<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude at Work — Field Cards V01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}


/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.6px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}
.blank{border:1px dashed var(--accent-dim);border-radius:8px;padding:14px 15px;margin:20px 0;background:rgba(224,164,88,.045)}
.blank b{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.blank code{background:none;padding:0;font-size:12.5px;color:var(--ink);line-height:1.85;display:block;white-space:pre-wrap}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
@media(max-width:430px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
.row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
.row:hover .t{color:var(--accent)}
.row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
.row .t{color:var(--ink);font-size:15px;transition:color .15s}
.row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const P = {
title:"Claude at Work",
sub:"An operator's cheat sheet. Every lever, where it lives, and when to pull it — written for someone with no technical background inside a real company.",
missions:[

/* ============ 01 ============ */
{n:"01",title:"The mental model",stage:"Ground",
bullets:["The one picture that makes every other setting obvious","Why a fresh chat knows nothing","What actually consumes a plan","The three levers, and nothing else"],
cards:[
{l:"ORIENT",t:"How to use this",h:"Not a book. A <em>card index</em>",b:`<p>This pack is built to be opened in the middle, mid-task, on a phone, and closed again ninety seconds later.</p>
<p>Read it once end to end so the shape is known. After that, use the index. Every card is a single move: what it does, where it lives, when it is worth pulling.</p>
<div class="note">One warning stated once, at the front. This is the fastest-moving material of any pack. Settings move, features ship, limits change. Where a card names a menu path, treat the path as a hint and the <em>principle</em> as the durable part.</div>`},

{l:"WHY",t:"The desk",h:"One picture, everything follows",b:`<p>Picture a desk of fixed size. Everything Claude can see while answering has to be laid out on that desk at once.</p>
<p>On it: the standing instructions, every message so far in this conversation, every file attached, everything retrieved from a search, and the answer being written.</p>
<div class="dg"><div class="dg-t">What is on the desk right now</div>
<div class="lay">
<div><span>·</span>Standing instructions and preferences</div>
<div><span>·</span>Project knowledge, if inside a project</div>
<div><span>·</span>Every message in this conversation, from the first</div>
<div><span>·</span>Files attached, in full</div>
<div><span>·</span>Anything fetched by a search or a tool</div>
<div class="hot"><span>·</span>Room reserved for the reply</div>
</div></div>
<p>The desk is called the <span class="k">context window</span>. Almost every technique in this pack is a decision about what goes on the desk, and what is kept off it.</p>`},

{l:"WHY",t:"Re-reading",h:"Every message reads the <em>whole</em> desk",b:`<p>A conversation does not accumulate in memory the way a human one does. On every single message, the entire desk is read again from the beginning.</p>
<p>Two consequences follow directly, and both matter more than they sound:</p>
<ul>
<li>A long conversation costs more per message than a short one — the same forty exchanges are re-read each time.</li>
<li>Something said at message three is exactly as visible at message forty as it was when written. Nothing decays or fades.</li>
</ul>
<div class="note">This is why "one chat, one job" is the single highest-value habit in the pack. A chat that wandered through three unrelated topics carries all three on the desk forever.</div>`},

{l:"WHY",t:"Fresh chats",h:"A new chat starts <em>blank</em>",b:`<p>A new conversation begins with an empty desk. It does not know what was decided yesterday, what the company does, or what was agreed three chats ago.</p>
<p>Four mechanisms fill that gap, and knowing which one is doing the work prevents most confusion:</p>
<table>
<tr><td>Project knowledge</td><td>Files and text loaded into every chat in a project, automatically</td></tr>
<tr><td>Project instructions</td><td>Standing directions applied to every chat in that project</td></tr>
<tr><td>Memory</td><td>Facts Claude has saved about the work, carried between chats</td></tr>
<tr><td>Past chat search</td><td>Claude searching earlier conversations on request</td></tr>
</table>
<p>They are four different things and are constantly confused with each other. Missions 03 and 04 take them apart properly.</p>`},

{l:"NUMBERS",t:"Desk size",h:"How big the desk is",b:`<p>On paid plans the newest models support up to a <strong>one million token</strong> context window; others support 500,000 or 200,000. A token is roughly three-quarters of an English word.</p>
<p>A portion is always reserved for the reply, so the usable space is slightly smaller than the headline figure.</p>
<div class="note">Where code execution is enabled, long conversations are managed automatically: as the limit approaches, earlier messages get summarised so the conversation can continue. A message about Claude "organising its thoughts" is that mechanism working, not an error.</div>
<p>Big desks change the arithmetic but not the principle. A cluttered desk still produces worse answers than a clean one, whatever its size.</p>`},

{l:"WHY",t:"The three levers",h:"Everything reduces to <em>three</em>",b:`<p>Every technique in this pack pulls one of three levers. Anything that does not is decoration.</p>
<div class="two"><div><b>1 — Context</b>What is on the desk. The highest-leverage lever by a wide margin, and the one almost nobody touches deliberately.</div>
<div><b>2 — Model and effort</b>Which Claude answers, and how hard it thinks before it does.</div></div>
<div class="dg"><div class="dg-t">And the third</div>
<div class="flow"><div class="n"><b>3 — Tools and surfaces</b>What Claude can reach and act on: search, files, connectors, spreadsheets, the browser, a whole desktop.</div></div></div>
<p>Most people spend all their attention on the words of the request. The words matter least of the four.</p>`},

{l:"TRAP",t:"The prompt myth",h:"Better wording is the <em>weakest</em> lever",b:`<p>The common belief is that mastery means knowing magic phrasings. It does not.</p>
<p>A perfectly worded request to a model that cannot see the relevant document will lose to a clumsy request from inside a properly loaded project, every time.</p>
<div class="note">Order of leverage, largest first: <strong>context</strong>, then <strong>tools</strong>, then <strong>model and effort</strong>, then <strong>wording</strong>. Mission 10 covers wording, and it is placed tenth deliberately.</div>`},

{l:"MOVE",t:"One chat one job",h:"The habit worth building first",b:`<p>Before any setting is touched, adopt one rule: <strong>a conversation covers one piece of work.</strong></p>
<p>When the subject changes, start a new chat. Inside a project, the project knowledge follows across; nothing of value is lost.</p>
<div class="two"><div><b>Cheaper</b>A short desk is re-read on every message. A long one is too.</div>
<div><b>Sharper</b>Irrelevant earlier material genuinely degrades answers, rather than being harmlessly ignored.</div></div>
<p>The instinct to keep one long conversation running "so it remembers" is exactly backwards. That is what projects and memory are for.</p>`},

{l:"RECALL",t:"Mission 01",h:"The ground",b:`<ul>
<li>Everything visible sits on one <strong>desk</strong> — the context window.</li>
<li>The whole desk is re-read on <strong>every message</strong>.</li>
<li>A new chat starts <strong>blank</strong>; four separate mechanisms fill that gap.</li>
<li>Three levers: <strong>context, model and effort, tools</strong>. Wording is fourth and weakest.</li>
<li><strong>One chat, one job.</strong></li>
</ul>`}
]},

/* ============ 02 ============ */
{n:"02",title:"Context engineering",stage:"Lever 1",
bullets:["The skill almost nobody has","Front-loading, batching and ordering","The anchor message","What to deliberately keep off the desk"],
cards:[
{l:"ORIENT",t:"The real skill",h:"Deciding what Claude <em>sees</em>",b:`<p>Context engineering is the deliberate practice of controlling what is on the desk: what goes on, in what order, and what is kept off.</p>
<p>It is the difference between an assistant that guesses and one that knows. It is almost entirely unpracticed, because it is invisible — nothing in the interface prompts anyone to do it.</p>
<div class="note">Everything in this mission works on any plan, costs nothing, and compounds. It is the highest-return mission in the pack.</div>`},

{l:"MOVE",t:"Front-load",h:"Everything known, in the <em>first</em> message",b:`<p>The instinct is to open with a short question and add detail as it is asked for. That produces the longest, most expensive, least accurate conversations.</p>
<p>Instead, open with everything already known:</p>
<ul>
<li>What the task actually is, and what a finished version looks like</li>
<li>Who the output is for, and what they already know</li>
<li>Constraints — length, format, tone, what must not appear</li>
<li>Relevant background, attached rather than described</li>
<li>What has already been tried and rejected, and why</li>
</ul>
<div class="note">A long, well-loaded opening message is cheaper than six short ones, because those six re-read a growing desk each time. Front-loading saves plan usage and improves the answer simultaneously — the two rarely align this cleanly.</div>`},

{l:"MOVE",t:"Batch",h:"Ask everything at <em>once</em>",b:`<p>Where several questions concern the same material, put them in one message rather than sending them one at a time.</p>
<div class="two"><div><b>Costly</b>Six messages, each re-reading the attached report and everything said since.</div>
<div><b>Cheap</b>One message listing six numbered questions about that report.</div></div>
<p>Numbering them helps — a numbered list gets a numbered answer, and nothing is quietly dropped.</p>
<p>This is official guidance as well as good practice: batching related questions is one of the specific recommendations for using a plan efficiently.</p>`},

{l:"MOVE",t:"Order",h:"Stable first, <em>variable</em> last",b:`<p>Where a request has both a fixed part and a changing part, put the fixed part at the top.</p>
<div class="flow">
<div class="n"><b>Top</b>Standing instructions, reference documents, examples, house style — the parts identical every time</div>
<div class="a">&#8595;</div>
<div class="n"><b>Bottom</b>Today's specific question or material</div>
</div>
<p>Frequently reused content gets partially cached, and cached content is cheaper. Caching works on stable openings, so an unchanging block at the top of every request is the shape that benefits.</p>
<div class="note">This is also why project knowledge is efficient: it sits in the same place every time, so it caches well and does not count against limits when reused.</div>`},

{l:"MOVE",t:"Attach, don't describe",h:"Show the thing itself",b:`<p>A summary of a document is a lossy translation made by someone who already knows what matters. Attaching the document lets Claude decide what matters.</p>
<ul>
<li>Paste the actual email rather than characterising it</li>
<li>Attach the real spreadsheet rather than describing its columns</li>
<li>Include the rejected draft rather than saying the last attempt was too formal</li>
<li>Supply two or three examples of good output rather than adjectives about tone</li>
</ul>
<div class="note">Examples of finished work outperform any description of it. Three samples of the house style teach more than a paragraph of instructions about the house style.</div>`},

{l:"MOVE",t:"The anchor",h:"Resetting a long conversation",b:`<p>When a conversation has run long — decisions made, dead ends explored, the thread hard to follow — the desk is cluttered and quality drops.</p>
<div class="flow">
<div class="n"><b>1</b>Ask for a complete summary of the state: what was decided, what was rejected and why, what remains open, what the current draft is</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>Check it and correct anything wrong</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>Open a new chat and paste it in as the first message</div>
</div>
<p>A clean desk holding only what matters, rather than a cluttered one holding everything that ever happened.</p>
<div class="note">Inside a project, the stronger version is to save that summary <em>into project knowledge</em> — then every future chat in the project starts from it. See Mission 03.</div>`},

{l:"MOVE",t:"Subtract",h:"What to keep <em>off</em>",b:`<p>Adding context has an obvious benefit and a hidden cost. More material means more to weigh, and genuinely relevant items compete with genuinely irrelevant ones.</p>
<p>Worth removing:</p>
<ul>
<li>Documents attached "in case they help" without a specific reason</li>
<li>Whole reports where three pages are the relevant part</li>
<li>Old conversation threads about a subject now closed</li>
<li>Instructions that contradict later instructions — one is being ignored, and it may be the wrong one</li>
</ul>
<div class="note">Less context, more useful context. The aim is a small pile of the right material, not a large pile of possibly-relevant material.</div>`},

{l:"PLAY",t:"The briefing",h:"A reusable opening block",b:`<p>Most repeated work shares a fixed preamble. Writing it once and keeping it somewhere retrievable turns every future request into a paste plus a sentence.</p>
<div class="dg"><div class="dg-t">The five-part briefing</div>
<div class="flow">
<div class="n"><b>Role</b>Who Claude is acting as, and what expertise the task needs</div>
<div class="a">&#8595;</div>
<div class="n"><b>Audience</b>Who reads the output and what they already know</div>
<div class="a">&#8595;</div>
<div class="n"><b>Format</b>Length, structure, and what the finished thing looks like</div>
<div class="a">&#8595;</div>
<div class="n"><b>Constraints</b>What must not appear — jargon, claims, promises, names</div>
<div class="a">&#8595;</div>
<div class="n"><b>Examples</b>Two or three samples of the standard being aimed at</div>
</div></div>
<p>Kept in project instructions, this applies to every chat in the project automatically and never needs pasting again.</p>`},

{l:"TRAP",t:"The slow reveal",h:"Drip-feeding the task",b:`<p>The most common and most costly pattern: opening with a vague request, then correcting across ten messages until the output is roughly right.</p>
<p>Each correction re-reads everything before it. By message ten the desk holds nine rejected attempts, all of which are still being read, and some of which are still influencing the answer.</p>
<div class="note">The fix is not a better correction. It is to stop, write one complete brief containing everything learned across those ten messages, and start again cleanly. Almost always faster from that point.</div>`},

{l:"RECALL",t:"Mission 02",h:"Context moves",b:`<ul>
<li><strong>Front-load</strong> — everything known, in the first message.</li>
<li><strong>Batch</strong> — related questions numbered, in one message.</li>
<li><strong>Order</strong> — stable material at the top, today's material at the bottom.</li>
<li><strong>Attach, don't describe</strong> — and examples beat adjectives.</li>
<li><strong>Anchor</strong> — summarise, verify, restart clean.</li>
<li><strong>Subtract</strong> — a small pile of the right material.</li>
</ul>`}
]},

/* ============ 03 ============ */
{n:"03",title:"Projects",stage:"Lever 1",
bullets:["The distinction that fixes most confusion","Project knowledge against chat context","The context update, and why it is the best move here","RAG mode, and what it changes"],
cards:[
{l:"ORIENT",t:"What a project is",h:"A workspace with a <em>standing</em> desk",b:`<p>A project is a self-contained workspace with its own chat history, its own knowledge base and its own standing instructions.</p>
<p>Everything placed in the knowledge base is available to every chat in that project, automatically, without re-uploading. Projects are available on every plan, including free, where five is the maximum.</p>
<div class="note">For anyone doing recurring work on a recurring subject, this is the single most useful feature in the product, and it is routinely used as nothing more than a folder.</div>`},

{l:"WHY",t:"The key distinction",h:"Chats do <em>not</em> share context",b:`<p>The most common misunderstanding about projects, stated plainly:</p>
<div class="note" style="font-size:16px;color:var(--ink);border-left-color:var(--accent)">Context is not shared across chats within a project unless the information is added into the project knowledge base.</div>
<p>Two chats in the same project are as blind to each other as two chats in different projects. The project supplies knowledge and instructions to each of them — it does not pass along what happened in one.</p>
<p>Which means: <strong>anything worth carrying forward has to be written into the knowledge base deliberately.</strong> It does not migrate there on its own.</p>`},

{l:"MOVE",t:"The context update",h:"The best habit in this pack",b:`<p>Directly from the previous card. At the end of any chat that produced something durable — a decision, a standard, a set of facts, a rejected approach worth not repeating — write it into project knowledge.</p>
<div class="flow">
<div class="n"><b>1</b>Ask for the durable output of this conversation as a short standalone document, written for someone with no memory of the chat</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>Read it. Correct it. It is about to become the source of truth</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>Add it to the project knowledge base as a named file</div>
<div class="a">&#8595;</div>
<div class="n"><b>4</b>Every future chat in the project now starts from it — no searching, no re-explaining</div>
</div>
<div class="note">This replaces the ritual of opening a new chat and asking whether the context is still there. It removes the question entirely.</div>`},

{l:"MOVE",t:"Instructions",h:"Standing orders for every chat",b:`<p>Separate from the knowledge base, a project carries <span class="k">instructions</span> — directions applied to every conversation inside it.</p>
<p>Knowledge is <em>material</em>. Instructions are <em>behaviour</em>. Worth putting in instructions:</p>
<ul>
<li>House style, tone and vocabulary, including words to avoid</li>
<li>Default output format and length</li>
<li>Standing constraints — never invent figures, always flag uncertainty, always cite the source document</li>
<li>Who the audience is, by default</li>
<li>What to do when something is unclear: ask, or proceed and mark the assumption</li>
</ul>
<div class="note">That last one is worth deciding explicitly. It changes the rhythm of every conversation in the project.</div>`},

{l:"WHY",t:"Caching",h:"Project content is <em>cheaper</em>",b:`<p>A direct and under-appreciated benefit: content in projects is cached, and does not count against usage limits when reused.</p>
<p>Uploading a document to a chat and asking six questions about it costs differently from putting that document in project knowledge and asking six questions across six chats.</p>
<div class="two"><div><b>Attached per chat</b>Reprocessed each time it appears in a new conversation.</div>
<div><b>In project knowledge</b>Cached, and only new or uncached portions count against the limit.</div></div>
<p>So heavy reference material belongs in the knowledge base, not attached repeatedly — for accuracy and for usage, both.</p>`},

{l:"WHY",t:"RAG mode",h:"When a project outgrows the desk",b:`<p>Project knowledge used to be capped by the size of the context window. It no longer is.</p>
<p>As knowledge approaches the context limit, projects on paid plans automatically switch to <span class="k">RAG mode</span> — retrieval-augmented generation — expanding capacity by up to ten times. A visual indicator shows when this is active. No setup is required.</p>
<div class="two"><div><b>Below the threshold</b>Everything in the knowledge base is on the desk, all the time.</div>
<div><b>In RAG mode</b>A search tool retrieves the most relevant parts per question rather than loading everything.</div></div>
<div class="note">The practical consequence: in RAG mode, retrieval is per-question and not guaranteed to surface everything. Naming a specific document in the request — "using the pricing policy file" — becomes worth doing.</div>`},

{l:"MOVE",t:"How to name files",h:"Retrieval reads names",b:`<p>Since RAG mode retrieves by relevance, file names and opening lines do real work.</p>
<div class="two"><div><b>Weak</b><code>notes.docx</code> · <code>final_v3.pdf</code> · <code>doc1.txt</code></div>
<div><b>Strong</b><code>pricing_policy_2026.md</code> · <code>brand_voice_rules.md</code> · <code>q3_targets_by_region.md</code></div></div>
<p>Start each document with a plain sentence saying what it is and when it applies. That sentence is often what makes a document findable.</p>`},

{l:"MOVE",t:"When to split",h:"One project or several",b:`<table>
<tr><td>New project</td><td>Different subject, different audience, or a knowledge base that would confuse the existing one</td></tr>
<tr><td>Same project, new chat</td><td>Same subject, new piece of work — the default</td></tr>
<tr><td>Same chat</td><td>Still the same piece of work</td></tr>
</table>
<p>The failure at each end is symmetrical. One giant project holding everything retrieves poorly and contradicts itself. Twenty tiny projects mean the right knowledge is never where the work is happening.</p>
<div class="note">A rough test: if a document in the knowledge base would be actively misleading for half the chats in the project, that project is holding two subjects.</div>`},

{l:"TRAP",t:"The stale base",h:"Knowledge that quietly went wrong",b:`<p>A knowledge base is trusted completely and updated rarely. Superseded prices, an old policy, a strategy that changed in March — all still being read as current on every request.</p>
<p>Two habits fix it:</p>
<ul>
<li>Date every document in its opening line, and say what supersedes it</li>
<li>When something changes, replace the file rather than adding a newer one beside it</li>
</ul>
<div class="note">Two contradictory documents in one knowledge base is worse than either alone, because which one wins is unpredictable — and nothing announces the conflict.</div>`},

{l:"RECALL",t:"Mission 03",h:"Project moves",b:`<ul>
<li>Projects carry <strong>knowledge</strong> (material) and <strong>instructions</strong> (behaviour).</li>
<li><strong>Chats do not share context</strong> — only the knowledge base crosses between them.</li>
<li>The <strong>context update</strong>: end a chat by writing its durable output into knowledge.</li>
<li>Project content is <strong>cached</strong> and does not count against limits when reused.</li>
<li><strong>RAG mode</strong> activates automatically near the context limit, expanding capacity roughly tenfold.</li>
<li>Name files descriptively; date them; replace rather than accumulate.</li>
</ul>`}
]},

/* ============ 04 ============ */
{n:"04",title:"Memory and continuity",stage:"Lever 1",
bullets:["Memory and past-chat search are different things","What is remembered and what is not","Editing memory in one sentence","Incognito, and when it matters at work"],
cards:[
{l:"WHY",t:"Two mechanisms",h:"Constantly confused, entirely <em>different</em>",b:`<div class="two"><div><b>Memory</b>Claude saves entries about the work — role, projects, preferences, ongoing context — and carries them into new chats automatically. Available on free, Pro and Max.</div>
<div><b>Past chat search</b>Claude searches earlier conversations on request and pulls back what is relevant. Available on paid plans.</div></div>
<p>Memory is <strong>automatic and always present</strong>. Search is <strong>on demand and specific</strong>. Knowing which is operating explains most of what otherwise looks like inconsistency.</p>
<div class="note">Memory applies to web, Claude Desktop and mobile. It is not currently available in Cowork.</div>`},

{l:"SETTING",t:"Where it lives",h:"Settings, memory",b:`<p>Open <strong>Settings &gt; Memory</strong> and turn on <strong>Generate memory from chats</strong>.</p>
<p>Two toggles matter there:</p>
<ul>
<li><strong>Generate memory from chats</strong> — whether Claude saves anything at all</li>
<li><strong>Search and reference chats</strong> — whether past conversations can be searched</li>
</ul>
<div class="note">A rollout is in progress. If <strong>Memory</strong> appears under <strong>Settings &gt; Capabilities</strong> instead of as its own section, that is the legacy experience — the controls are equivalent, in a different place.</div>`},

{l:"WHY",t:"What is kept",h:"Work context, not everything",b:`<p>Memory is deliberately focused on professional context:</p>
<ul>
<li>Role, projects, and professional context</li>
<li>Communication preferences and working style</li>
<li>Technical preferences</li>
<li>Project details and ongoing work</li>
</ul>
<p>Entries are stored individually, organised into categories, and written and updated in real time during a conversation rather than on a daily schedule.</p>
<div class="note">Each project also has its own <strong>separate memory space and project summary</strong>, kept apart from other projects and from non-project chats. Context in one project does not leak into another.</div>`},

{l:"MOVE",t:"Write to memory",h:"Say it, and it is <em>stored</em>",b:`<p>Memory does not have to be left to inference. Stating something directly in a conversation updates it, and the update applies to the next conversation without leaving the chat.</p>
<p>Worth stating explicitly, once:</p>
<ul>
<li>Role, team, and what the work actually consists of</li>
<li>Who the usual audience is</li>
<li>Format preferences — length, structure, whether bullets are wanted</li>
<li>Standing dislikes: phrasings to avoid, formatting to avoid</li>
<li>Recurring constraints: the industry, the regulator, the review process</li>
</ul>
<div class="note">Ten minutes spent stating these once removes the same ten minutes of re-explaining spread across the next hundred conversations.</div>`},

{l:"MOVE",t:"Audit it",h:"Read what is actually stored",b:`<p><strong>Settings &gt; Memory</strong> lists everything held, grouped by category. Select any entry to see its detail.</p>
<div class="flow">
<div class="n"><b>Change an entry</b>Use the "Tell Claude what to change or remove" box</div>
<div class="a">&#8595;</div>
<div class="n"><b>Remove one</b>Select Delete</div>
<div class="a">&#8595;</div>
<div class="n"><b>Stop without losing</b>Pause — existing memory is kept, nothing new is written or used</div>
<div class="a">&#8595;</div>
<div class="n"><b>Start over</b>Reset — permanently deletes everything, including project memories. Cannot be undone</div>
</div>
<div class="note">Worth an audit every few months. A preference stated during one unusual project can quietly become a standing rule applied to everything.</div>`},

{l:"MOVE",t:"Search past chats",h:"Asking for what was decided",b:`<p>On paid plans, asking naturally is enough — the search runs and appears as a tool call in the conversation.</p>
<ul>
<li>"What did we discuss about the pricing model?"</li>
<li>"Find our conversation about the vendor review."</li>
<li>"Continue where we left off on the budget paper."</li>
</ul>
<p>The boundaries are strict and worth knowing: searches cover <strong>all chats outside projects</strong>, or <strong>within one specific project</strong>. A chat inside a project cannot search chats outside it, and vice versa.</p>
<div class="note">Which is precisely why the context update in Mission 03 beats relying on search. Search finds a conversation. Knowledge supplies the conclusion, already checked.</div>`},

{l:"MOVE",t:"Incognito",h:"The chat that leaves no trace",b:`<p>The ghost icon in the upper right of a new chat outside a project starts an <span class="k">incognito chat</span> — not saved to history, not written to memory, not searchable afterwards.</p>
<p>Available on every plan. Worth using for genuinely sensitive one-offs, or for anything that should not shape Claude's picture of the ongoing work.</p>
<div class="note"><strong>One caution for company accounts.</strong> On Team and Enterprise plans, incognito chats are still included in standard data exports and still follow the organisation's data retention policies. Incognito means invisible to memory and history — it does not mean invisible to an administrator.</div>`},

{l:"TRAP",t:"Assumed continuity",h:"Writing as if Claude <em>remembers</em>",b:`<p>The most common failure with memory is trusting it for the wrong category of thing.</p>
<p>Memory holds preferences and standing context well. It is not a record of decisions, and it is not a document store. A conclusion reached in one chat may or may not survive into the next.</p>
<div class="two"><div><b>Trust memory for</b>Style, role, audience, working preferences, ongoing situation.</div>
<div><b>Do not trust it for</b>Specific figures, exact wording agreed, decisions with consequences, anything that must be right.</div></div>
<p>Anything in the second column belongs in project knowledge, where it can be read and checked.</p>`},

{l:"RECALL",t:"Mission 04",h:"Continuity moves",b:`<ul>
<li><strong>Memory</strong> is automatic and always on. <strong>Past chat search</strong> is on request.</li>
<li>Both live under <strong>Settings &gt; Memory</strong>, or Settings &gt; Capabilities on the legacy experience.</li>
<li>Memory can be <strong>written to by saying so</strong>, and edited or deleted entry by entry.</li>
<li>Each project has its own separate memory and summary.</li>
<li>Search covers <strong>all non-project chats</strong>, or <strong>one project</strong> — never across the boundary.</li>
<li><strong>Incognito</strong> hides from memory and history, not from an administrator.</li>
<li>Preferences to memory. Decisions to project knowledge.</li>
</ul>`}
]},

/* ============ 05 ============ */
{n:"05",title:"Model and effort",stage:"Lever 2",
bullets:["The menu next to the send button","What effort actually controls","When a bigger model is genuinely worth it","The setting that does not do what it sounds like"],
cards:[
{l:"SETTING",t:"The menu",h:"Three settings, <em>one</em> place",b:`<p>The model name next to the send button opens a menu controlling three separate things:</p>
<ul>
<li><strong>Model</strong> — which Claude answers. "More models" reveals additional options</li>
<li><strong>Effort</strong> — how much thinking goes into each response</li>
<li><strong>Extended thinking</strong> — a toggle for deeper reasoning on a turn</li>
</ul>
<div class="note">On an Enterprise plan, a missing model or effort level usually means an administrator has turned it off for that role, rather than a fault.</div>`},

{l:"WHY",t:"The model tiers",h:"Capability against speed and cost",b:`<table>
<tr><td>Opus</td><td>The most capable tier. Complex reasoning, difficult analysis, work where being right matters more than being fast.</td></tr>
<tr><td>Sonnet</td><td>The balanced workhorse. Strong on nearly everything, noticeably faster and lighter on a plan.</td></tr>
<tr><td>Haiku</td><td>The fastest and lightest. Well suited to simple, high-volume, well-defined tasks.</td></tr>
</table>
<p>Model choice affects usage. A capable model spends more of a plan per message than a light one, which makes tier selection a budgeting decision as much as a quality one.</p>`},

{l:"WHY",t:"Effort",h:"How hard it thinks",b:`<p>Effort controls how many tokens are spent thinking before a response is produced. Same model, different amount of deliberation.</p>
<div class="two"><div><b>Lower effort</b>Faster, lighter on the plan. Correct for well-defined tasks with a clear shape — reformatting, drafting from a full brief, summarising.</div>
<div><b>Higher effort</b>Slower, heavier. Correct where the answer requires genuine working-out — multi-step analysis, unfamiliar problems, anything where a wrong turn early ruins the result.</div></div>
<div class="note">Effort is listed explicitly among the factors that affect usage limits. Leaving it high permanently is a quiet and continuous cost.</div>`},

{l:"TRAP",t:"Effort and length",h:"Not a <em>length</em> control",b:`<p>Effort sounds like it should govern how much gets written. It does not. It governs thinking volume, not visible response length — on the current Opus generation, changing effort does not reliably shorten what comes back.</p>
<p>To change length, say so:</p>
<ul>
<li>"Three sentences maximum."</li>
<li>"One page, no headings."</li>
<li>"Just the answer — no preamble, no summary at the end."</li>
</ul>
<div class="note">Length is a prompting matter. Effort is a compute matter. Pulling the wrong lever produces a long answer that took longer to arrive.</div>`},

{l:"MOVE",t:"Matching",h:"Which setting for which work",b:`<table>
<tr><td>Reformat, tidy, translate</td><td>Light model, low effort</td></tr>
<tr><td>Draft from a complete brief</td><td>Mid model, low to medium effort</td></tr>
<tr><td>Summarise a long document</td><td>Mid model, medium effort</td></tr>
<tr><td>Analyse, compare, decide</td><td>Capable model, high effort</td></tr>
<tr><td>Unfamiliar or high-stakes work</td><td>Most capable model, high effort</td></tr>
</table>
<div class="note">The habit worth building is switching <em>down</em> for routine work rather than only switching up for hard work. Most people set the top tier once and never move it — which is the same as paying maximum on every request regardless of difficulty.</div>`},

{l:"TRAP",t:"Double-instructing",h:"High effort and &lsquo;check everything&rsquo;",b:`<p>A specific and expensive combination: setting high effort <em>and</em> writing instructions to verify, double-check and re-confirm.</p>
<p>Both push in the same direction. The result is a model spending its budget re-confirming things it already established, at higher cost with no gain in quality. Anthropic's own guidance for the current Opus generation is to remove explicit verification instructions where effort is already doing that work.</p>
<div class="note">Two controls pushing the same way is not twice the diligence.</div>`},

{l:"RECALL",t:"Mission 05",h:"Model moves",b:`<ul>
<li>Model, effort and extended thinking all sit in the <strong>menu next to the send button</strong>.</li>
<li><strong>Opus</strong> for hard, <strong>Sonnet</strong> for most, <strong>Haiku</strong> for simple and high-volume.</li>
<li><strong>Effort</strong> is thinking volume, not answer length. State the length separately.</li>
<li>Model and effort both count towards usage.</li>
<li>Switch <strong>down</strong> for routine work, not only up for hard work.</li>
<li>High effort plus verification instructions is double-paying for the same thing.</li>
</ul>`}
]},

/* ============ 06 ============ */
{n:"06",title:"Usage and credits",stage:"Lever 2",
bullets:["Two limits running at once","One pool across every surface","Where to actually look","How to make a plan go further"],
cards:[
{l:"WHY",t:"Two clocks",h:"Session and <em>weekly</em>",b:`<p>Pro runs two limits simultaneously, and they are independent of each other.</p>
<div class="two"><div><b>Session</b>A five-hour rolling window. The clock starts on the first message and resets five hours later — not at midnight, not at a fixed hour.</div>
<div><b>Weekly</b>A separate cap across all models, with its own reset schedule. The usage screen shows resets for Opus specifically and for all other models.</div></div>
<div class="note">Hitting the weekly cap is the one that surprises people, because waiting a few hours does not help. Only the weekly reset clears it.</div>`},

{l:"WHY",t:"One pool",h:"Every surface draws from the <em>same</em> bucket",b:`<p>Usage across all Claude surfaces counts towards the same limit — claude.ai, Claude Code, Claude Desktop.</p>
<p>Which explains an otherwise baffling experience: chat feeling tight for no apparent reason, when the cause was an agent session earlier in the day.</p>
<div class="note">Worth planning around on a Pro plan. A long agentic session and an afternoon of heavy chat work compete for the same allowance, and the first one silently wins.</div>`},

{l:"SETTING",t:"Where to look",h:"Settings, usage",b:`<p><strong>Settings &gt; Usage</strong> shows progress bars for both limits rather than leaving it to guesswork.</p>
<ul>
<li><strong>Current session</strong> — how much of the five-hour allowance is spent, and time remaining in the window</li>
<li><strong>Weekly limits</strong> — when the weekly cap resets, shown separately for Opus and for other models</li>
</ul>
<div class="note">Checking this once at the start of a heavy day is the difference between planning the work and discovering the ceiling mid-task. Any specific message count quoted anywhere is an estimate; this screen is the actual figure.</div>`},

{l:"WHY",t:"What burns it",h:"The full list",b:`<p>Usage is affected by:</p>
<ul>
<li>Message length</li>
<li>File attachment size</li>
<li>Current conversation length — the whole desk, re-read</li>
<li>Tool usage, such as Research and web search</li>
<li>Model choice</li>
<li>Effort level</li>
<li>Artifact creation and use</li>
</ul>
<div class="note">Four of the seven are context. This is why Mission 02 is the usage mission as much as the quality mission — the same moves reduce both.</div>`},

{l:"MOVE",t:"Stretching a plan",h:"Six moves that work",b:`<ol style="list-style:none;padding:0;margin:0">
<li style="padding-left:19px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">1</span><strong>Front-load and batch.</strong> Fewer messages, each carrying more.</li>
<li style="padding-left:19px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">2</span><strong>Never re-upload inside a chat.</strong> An attached file stays visible for the whole conversation.</li>
<li style="padding-left:19px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">3</span><strong>Put reference material in projects.</strong> Cached, and does not count when reused.</li>
<li style="padding-left:19px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">4</span><strong>Start fresh chats for new work.</strong> A short desk is a cheap desk.</li>
<li style="padding-left:19px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">5</span><strong>Drop the model tier for routine work.</strong> Most of a working day is not hard.</li>
<li style="padding-left:19px;position:relative"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">6</span><strong>Review before sending.</strong> A message that needed a follow-up cost twice.</li>
</ol>`},

{l:"MOVE",t:"Credits",h:"Working past the ceiling",b:`<p>Rather than being blocked on reaching the limit, paid plans can enable <span class="k">usage credits</span> — switching to consumption-based pricing at standard API rates and continuing without interruption.</p>
<p>Available on Pro and both Max tiers, managed from the usage settings page.</p>
<div class="two"><div><b>Worth enabling if</b>Being stopped mid-task has a real cost, and the work is time-bound.</div>
<div><b>Worth leaving off if</b>The limit is a useful signal to stop, or spending needs a hard ceiling.</div></div>
<div class="note">Enabling credits converts a hard stop into a variable bill. That is an improvement or a hazard depending entirely on the situation — it is worth deciding deliberately rather than at the moment of being blocked.</div>`},

{l:"TRAP",t:"The re-upload",h:"Sending the same file twice",b:`<p>A file attached earlier in a conversation is still on the desk. Attaching it again puts a second copy there.</p>
<p>The same applies to pasted text, to a document already in project knowledge, and to a summary of something already present in full.</p>
<div class="note">Referring back is free. "Using the report attached earlier" costs nothing. Re-attaching the report costs the report, again.</div>`},

{l:"RECALL",t:"Mission 06",h:"Usage moves",b:`<ul>
<li>Two independent limits: a <strong>five-hour rolling session</strong> and a <strong>weekly cap</strong>.</li>
<li>All surfaces draw from <strong>one pool</strong>.</li>
<li><strong>Settings &gt; Usage</strong> shows the real figures.</li>
<li>Seven factors burn usage; four of them are context.</li>
<li>Project content is cached and does not count when reused.</li>
<li><strong>Usage credits</strong> convert a hard stop into a variable bill.</li>
</ul>`}
]}
,
/* ============ 07 ============ */
{n:"07",title:"Making things",stage:"Lever 3",
bullets:["Artifacts, and why they beat chat output","When a real file is the right answer","Editing without regenerating","Documents, decks and spreadsheets"],
cards:[
{l:"ORIENT",t:"Chat against artifact",h:"Where the output <em>lives</em>",b:`<p>Answers can come back two ways, and the difference matters more than it appears.</p>
<div class="two"><div><b>In the chat</b>Prose in the conversation. Correct for thinking, explaining, deciding, discussing.</div>
<div><b>As an artifact</b>A document, table, chart or small tool in its own panel — editable, re-openable, shareable.</div></div>
<p>The rule of thumb: anything that will be <strong>used outside the conversation</strong> should be an artifact or a file. Anything that will be <strong>read and replied to</strong> belongs in the chat.</p>`},

{l:"MOVE",t:"Edit in place",h:"Change a line, not the <em>whole</em> thing",b:`<p>The instinct on wanting a change is to describe it and receive a fresh version. That is slow, costs a full regeneration, and often alters parts that were already right.</p>
<p>Instead: highlight the specific part inside the artifact, state the instruction, and only that part changes.</p>
<div class="note">Particularly valuable on long documents. Regenerating a six-page paper to fix one paragraph is the single most wasteful common habit in the product, and it introduces new errors in five pages that were finished.</div>`},

{l:"MOVE",t:"Real files",h:"Word, Excel, PowerPoint, PDF",b:`<p>Where the output has to leave Claude and enter someone else's workflow, ask for the actual file format rather than text to be copied and reformatted.</p>
<table>
<tr><td>Word document</td><td>Anything going into a formal review or approval chain</td></tr>
<tr><td>Spreadsheet</td><td>Anything with calculations, or that someone will filter and sort</td></tr>
<tr><td>Presentation</td><td>Anything that will be shown rather than read</td></tr>
<tr><td>PDF</td><td>Anything that must look identical to every recipient</td></tr>
</table>
<div class="note">Uploaded files can also be edited directly rather than rebuilt — a document sent for correction comes back as the same document, corrected, with its formatting intact.</div>`},

{l:"MOVE",t:"Iterate on the thing",h:"Keep one artifact, not <em>nine</em>",b:`<p>Work on a single artifact across a conversation rather than generating a new one each round.</p>
<div class="flow">
<div class="n"><b>Weak</b>Nine separate versions in the conversation, all still on the desk, ambiguity about which is current</div>
<div class="a">&#8595;</div>
<div class="n"><b>Strong</b>One artifact, revised in place, unambiguously the current version</div>
</div>
<p>When a version is worth keeping before a large change, say so explicitly — otherwise the previous state is only recoverable by scrolling.</p>`},

{l:"TRAP",t:"The formatting trap",h:"Asking for a document, getting <em>prose</em>",b:`<p>A request for "a report on Q3" produces prose in the chat, because nothing in the request specified an artefact.</p>
<p>The fix is to name the output explicitly:</p>
<ul>
<li>"As a Word document."</li>
<li>"As a spreadsheet with one row per region."</li>
<li>"As an artifact I can edit."</li>
<li>"As a slide deck, one slide per finding."</li>
</ul>
<div class="note">Naming the artefact also improves the content, because a document and a chat answer are structured differently and knowing which is being written changes how it is written.</div>`},

{l:"RECALL",t:"Mission 07",h:"Making moves",b:`<ul>
<li>Used outside the conversation → <strong>artifact or file</strong>. Read and replied to → <strong>chat</strong>.</li>
<li><strong>Edit in place</strong> by highlighting, rather than regenerating.</li>
<li>Ask for the <strong>real file format</strong> when it has to travel.</li>
<li>Uploaded files can be edited directly, keeping their formatting.</li>
<li>One artifact iterated beats nine artifacts generated.</li>
<li><strong>Name the output format</strong> in the request.</li>
</ul>`}
]},

/* ============ 08 ============ */
{n:"08",title:"Research and verification",stage:"Lever 3",
bullets:["Search, and when it is not running","The Research feature and what it costs","Making an answer checkable","The workplace discipline that matters most"],
cards:[
{l:"MOVE",t:"Search",h:"Current information, on request",b:`<p>Claude has a training cutoff and no inherent awareness of anything after it. Web search closes that gap, and asking for it explicitly is more reliable than assuming it ran.</p>
<ul>
<li>"Search for the current figure rather than answering from memory."</li>
<li>"Check whether this is still the case."</li>
<li>"Find the primary source, not a summary of it."</li>
</ul>
<div class="note">That last phrasing is worth keeping. Search results are dominated by aggregators and content written for search engines. Naming the primary source — the regulator, the filing, the company's own page — changes what comes back.</div>`},

{l:"WHY",t:"Research",h:"The deep version, and its price",b:`<p>The Research feature runs an extended investigation across many sources and returns a compiled, sourced report. It takes several minutes rather than seconds.</p>
<div class="two"><div><b>Worth it for</b>Genuinely broad questions — a market landscape, a regulatory comparison, a survey of an unfamiliar field.</div>
<div><b>Not worth it for</b>Anything a handful of searches would answer. Tool usage counts against the plan, and this is the heaviest tool available.</div></div>
<div class="note">A useful discipline: ask the ordinary question first. If the answer is thin in a way more sources would fix, escalate. Most questions do not need it.</div>`},

{l:"MOVE",t:"Make it checkable",h:"Separating <em>known</em> from inferred",b:`<p>The most valuable verification habit is to require the answer to mark its own confidence.</p>
<ul>
<li>"Mark each claim as sourced, inferred, or uncertain."</li>
<li>"Say which parts came from the documents I attached and which came from general knowledge."</li>
<li>"List what would need checking before this is sent."</li>
<li>"Where a number is an estimate, say so and give the basis."</li>
</ul>
<div class="note">This works well and is almost never asked for. It converts a uniformly confident answer into a map of where the risk actually sits — which is what makes it safe to use at work.</div>`},

{l:"TRAP",t:"Fluent and wrong",h:"Confidence is not <em>evidence</em>",b:`<p>A wrong answer arrives in exactly the same tone as a right one. There is no tell, no hedge, no change in register.</p>
<p>The categories that most need independent checking:</p>
<ul>
<li>Specific figures, dates, percentages and monetary amounts</li>
<li>Names of people, and who said or did what</li>
<li>Citations, references, links and case numbers</li>
<li>Legal, regulatory and compliance specifics</li>
<li>Anything about a niche or internal subject with little public writing</li>
</ul>
<div class="note">The rule that holds up in a company: <strong>Claude drafts, a person verifies, and the person's name goes on it.</strong> Accountability does not transfer.</div>`},

{l:"MOVE",t:"The adversarial pass",h:"Asking it to attack its own work",b:`<p>After an answer that looks good, run one more turn against it.</p>
<div class="flow">
<div class="n"><b>1</b>"What is the strongest argument that this analysis is wrong?"</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>"What did this assume without stating it?"</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>"What would a sceptical reviewer attack first?"</div>
<div class="a">&#8595;</div>
<div class="n"><b>4</b>"What is missing that should be here?"</div>
</div>
<p>This produces materially better work than asking for the answer again. Critique and generation are different tasks, and the critique is often sharper than the original.</p>`},

{l:"RECALL",t:"Mission 08",h:"Verification moves",b:`<ul>
<li>Ask for <strong>search explicitly</strong>, and for <strong>primary sources</strong>.</li>
<li><strong>Research</strong> is the heavy tool. Escalate to it, do not start there.</li>
<li>Require claims to be marked <strong>sourced, inferred or uncertain</strong>.</li>
<li>Figures, names, citations and regulation always get checked independently.</li>
<li>Run the <strong>adversarial pass</strong> before anything leaves.</li>
<li>Claude drafts. A person verifies. The person is accountable.</li>
</ul>`}
]},

/* ============ 09 ============ */
{n:"09",title:"Extending Claude",stage:"Lever 3",
bullets:["Styles, skills and connectors, distinguished","Working inside Office and the browser","Cowork, for non-technical agentic work","Choosing the right surface for the job"],
cards:[
{l:"WHY",t:"Four things",h:"Constantly muddled, easily separated",b:`<table>
<tr><td>Style</td><td>How output <em>sounds</em>. Voice, tone, formatting.</td></tr>
<tr><td>Skill</td><td>How a recurring task is <em>done</em>. A written procedure Claude loads when relevant.</td></tr>
<tr><td>Connector</td><td>What Claude can <em>reach</em>. Drive, calendar, ticketing, internal systems.</td></tr>
<tr><td>Surface</td><td>Where the work <em>happens</em>. Chat, desktop, Excel, browser, Cowork.</td></tr>
</table>
<div class="note">Reaching for the wrong one is the usual mistake. Output in the wrong voice is a style problem; a procedure done inconsistently is a skill problem; needing to paste data by hand is a connector problem.</div>`},

{l:"MOVE",t:"Styles",h:"Teaching a house voice",b:`<p>A style sets how responses are written and persists across conversations, so the tone does not need restating each time.</p>
<p>The strong move is to build one from examples rather than description: supply several pieces of writing in the target voice and let the pattern be extracted. Adjectives about tone are weak; samples are strong.</p>
<div class="note">Where the voice belongs to one body of work rather than everything, project instructions are the better home. Styles are global; project instructions are local.</div>`},

{l:"MOVE",t:"Skills",h:"A procedure, written once",b:`<p>A skill is a written procedure for a recurring task, loaded automatically when the task comes up. The comparison that fits: the onboarding document written for a new colleague, kept somewhere Claude can find it.</p>
<p>Worth turning into a skill:</p>
<ul>
<li>Any task done more than monthly with a defined shape</li>
<li>Anything with a checklist, a template or a house format</li>
<li>Anything where the output must match a standard exactly</li>
<li>Anything a new joiner would be handed instructions for</li>
</ul>
<div class="note">The test for whether something should be a skill: if explaining it again in three months would be tedious, it is a skill. If it was a one-off, it is a prompt.</div>`},

{l:"MOVE",t:"Connectors",h:"Reaching real systems",b:`<p>Connectors let Claude read from and act in the systems where work already lives, rather than requiring everything to be pasted in.</p>
<p>They are the difference between describing a document and Claude opening it.</p>
<div class="note"><strong>Before connecting anything at work</strong>: check who authorises it. A connector grants access to real company data, and that is an IT and security decision in most organisations, not an individual one. This is worth asking before rather than after.</div>`},

{l:"WHY",t:"The surfaces",h:"Where the work happens",b:`<table>
<tr><td>Chat</td><td>Thinking, drafting, deciding. The default.</td></tr>
<tr><td>Desktop</td><td>Working alongside local files and applications.</td></tr>
<tr><td>Cowork</td><td>Multi-step work handed over rather than conversed through — research, analysis, tasks spanning many files.</td></tr>
<tr><td>Excel, PowerPoint, Word, Outlook</td><td>Claude inside the application already in use, acting on the live document.</td></tr>
<tr><td>Chrome</td><td>Reading and acting on web pages directly.</td></tr>
<tr><td>Claude Code</td><td>Built for code, but genuinely useful for any task over a folder of files.</td></tr>
</table>`},

{l:"MOVE",t:"Cowork",h:"Handing work over rather than <em>chatting</em>",b:`<p>Cowork applies agentic working to knowledge work rather than coding. Instead of a conversation, a task is described and executed across many steps and files.</p>
<div class="two"><div><b>Chat suits</b>Work needing judgement at each step, where the direction may change based on what comes back.</div>
<div><b>Cowork suits</b>Work with a clear finish line and many mechanical steps — read forty documents and produce a comparison, process a folder, produce a recurring report.</div></div>
<div class="note">Two constraints worth knowing: Cowork draws from the same usage pool as everything else, and memory is not currently available in Cowork — context has to be supplied to the task rather than assumed.</div>`},

{l:"TRAP",t:"Tool sprawl",h:"Configuring instead of working",b:`<p>The failure that follows discovering this layer: styles, skills and connectors accumulate until nobody remembers what exists, and the list becomes something to scroll past rather than use.</p>
<p>The discipline is the same as any workplace documentation. A small number, actively maintained, beats a large number nobody trusts. When the list stops being read, consolidate rather than extend.</p>`},

{l:"RECALL",t:"Mission 09",h:"Extension moves",b:`<ul>
<li><strong>Style</strong> = how it sounds. <strong>Skill</strong> = how it is done. <strong>Connector</strong> = what it reaches. <strong>Surface</strong> = where it happens.</li>
<li>Build styles from <strong>examples</strong>, not adjectives.</li>
<li>A recurring task with a defined shape is a <strong>skill</strong>.</li>
<li>Connectors touch real company data — <strong>check who authorises</strong> first.</li>
<li><strong>Cowork</strong> for handing over multi-step work; same usage pool, no memory.</li>
<li>Few and maintained beats many and ignored.</li>
</ul>`}
]},

/* ============ 10 ============ */
{n:"10",title:"Asking well",stage:"Lever 4",
bullets:["The weakest lever, used properly","Role, audience, format, constraint","Getting the prompt written for free","The critique loop"],
cards:[
{l:"ORIENT",t:"Placed tenth",h:"Deliberately <em>last</em>",b:`<p>Wording is the fourth and weakest lever, and it is placed accordingly. A well-worded request into an empty context loses to a rough request into a loaded one.</p>
<p>That said, wording is not nothing — and a handful of moves are worth more than every "magic prompt" list combined.</p>`},

{l:"MOVE",t:"The four slots",h:"Role, audience, format, constraint",b:`<p>Most weak requests are missing at least two of these.</p>
<table>
<tr><td>Role</td><td>What expertise the task calls for. "As someone who reviews these professionally."</td></tr>
<tr><td>Audience</td><td>Who reads it and what they already know. "For a board with no technical background."</td></tr>
<tr><td>Format</td><td>Shape and length. "One page, three headings, no bullet points."</td></tr>
<tr><td>Constraint</td><td>What must not appear. "No jargon, no figures I have not supplied, no recommendation."</td></tr>
</table>
<div class="note">These four slots are exactly what belongs in project instructions, where they apply automatically. Filling them by hand every time is a sign they should be stored.</div>`},

{l:"MOVE",t:"Show the target",h:"Examples beat <em>adjectives</em>",b:`<p>"Professional but warm" means something different to everyone who reads it. Two examples of professional-but-warm writing mean one thing.</p>
<ul>
<li>Supply two or three examples of good output</li>
<li>Supply one example of what to avoid, and say why it fails</li>
<li>For structure, supply the skeleton to be filled</li>
</ul>
<div class="note">A rejected past attempt is one of the most useful things that can be attached. It defines the boundary from the outside, which description cannot do.</div>`},

{l:"MOVE",t:"Ask for the prompt",h:"The move most people <em>miss</em>",b:`<p>For anything complex or repeated, do not write the prompt. Ask for it.</p>
<div class="flow">
<div class="n"><b>1</b>Describe the task, the constraints and what a good result looks like — in ordinary language, no craft required</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>Ask for the best possible prompt for that task, plus any questions needed to sharpen it</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>Answer the questions. Take the refined prompt</div>
<div class="a">&#8595;</div>
<div class="n"><b>4</b>Run it in a fresh chat, with a clean desk</div>
</div>
<div class="note">This removes the need to be good at prompting, which is why it belongs near the top of any practical list — and why the mission it sits in is the least important one in the pack.</div>`},

{l:"MOVE",t:"The critique loop",h:"Two passes beat one",b:`<p>The highest-value repeatable pattern in ordinary work:</p>
<div class="flow">
<div class="n"><b>Draft</b>Produce a first version</div>
<div class="a">&#8595;</div>
<div class="n"><b>Critique</b>"Critique this as the toughest reviewer it will face. Be specific about what fails and why"</div>
<div class="a">&#8595;</div>
<div class="n"><b>Revise</b>"Now rewrite, addressing every point"</div>
</div>
<p>The critique step is where the quality appears. Asked to evaluate rather than produce, the standard applied is noticeably higher.</p>`},

{l:"MOVE",t:"Say what to skip",h:"Removing the padding",b:`<p>Output arrives with structure that is often unwanted: preamble, restating the question, a summary at the end, caveats, an offer of further help.</p>
<p>All of it can be turned off, permanently, in project instructions or memory:</p>
<ul>
<li>"No preamble. Start with the answer."</li>
<li>"No summary at the end."</li>
<li>"No offers of further help."</li>
<li>"Prose, not bullet points, unless a list is genuinely the right shape."</li>
</ul>`},

{l:"TRAP",t:"Politeness padding",h:"Words that carry <em>nothing</em>",b:`<p>Elaborate framing — insisting on importance, stacking urgency, layering emphasis — adds length without adding information.</p>
<p>What actually changes an answer: what the task is, who it is for, what it must contain, what it must avoid, and what a good version looks like. Everything else is decoration on the desk.</p>
<div class="note">This is not an argument against courtesy. It is an argument against mistaking emphasis for specification.</div>`},

{l:"RECALL",t:"Mission 10",h:"Asking moves",b:`<ul>
<li>Fill the four slots: <strong>role, audience, format, constraint</strong>.</li>
<li><strong>Examples beat adjectives.</strong> A rejected attempt is especially useful.</li>
<li><strong>Ask for the prompt</strong> rather than writing it.</li>
<li>Run the <strong>critique loop</strong>: draft, critique hard, revise.</li>
<li>Turn off unwanted padding once, in instructions or memory.</li>
<li>Emphasis is not specification.</li>
</ul>`}
]},

/* ============ 11 ============ */
{n:"11",title:"The plays",stage:"Applied",
bullets:["Complete patterns, end to end","Each combines several levers","Built for real workplace tasks","Take and adapt"],
cards:[
{l:"ORIENT",t:"How these work",h:"Levers, <em>combined</em>",b:`<p>Individual moves are useful. What produces the step change is combining them into a standing pattern used the same way every time.</p>
<p>Each play below names the levers it pulls. All of them work on Pro, and none require anything technical.</p>`},

{l:"PLAY",t:"The standing brief",h:"Never explain the job again",b:`<p><span class="tag">Levers: context · projects · memory</span></p>
<div class="flow">
<div class="n"><b>1</b>Create a project for one body of recurring work</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>Load the knowledge base: reference documents, past good examples, house standards, the facts that stay true</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>Write project instructions covering role, audience, format, constraints, and what to do when something is unclear</div>
<div class="a">&#8595;</div>
<div class="n"><b>4</b>Every chat in the project now opens fully briefed — and the knowledge is cached rather than counted</div>
</div>
<div class="note">Twenty minutes of setup. It pays back within a week and keeps paying.</div>`},

{l:"PLAY",t:"The closing ritual",h:"Ending a chat properly",b:`<p><span class="tag">Levers: context · projects</span></p>
<p>Two minutes at the end of any conversation that produced something durable:</p>
<div class="flow">
<div class="n"><b>Ask</b>"Write the durable output of this conversation as a standalone document — decisions made, reasoning, what was rejected and why, what is still open. Written for someone with no memory of this chat"</div>
<div class="a">&#8595;</div>
<div class="n"><b>Check</b>Read it properly. It is about to be treated as true</div>
<div class="a">&#8595;</div>
<div class="n"><b>Store</b>Into project knowledge, with a descriptive name and a date</div>
</div>
<div class="note">This is the single highest-return habit in the pack. It is what turns a sequence of disconnected chats into something that accumulates.</div>`},

{l:"PLAY",t:"The document interrogation",h:"Long material, fast",b:`<p><span class="tag">Levers: context · batching · verification</span></p>
<p>One message, not a conversation:</p>
<ul>
<li>Attach the document</li>
<li>State who is asking and why it matters</li>
<li>List numbered questions — the specific ones, not "summarise this"</li>
<li>Add: "For each answer, quote the passage it came from. Where the document does not answer, say so rather than inferring"</li>
</ul>
<div class="note">That last instruction is what makes the output usable at work. Without it, gaps in the document get filled with plausible material and there is no way to tell which is which.</div>`},

{l:"PLAY",t:"The reviewer",h:"A hard read before a real one",b:`<p><span class="tag">Levers: context · critique loop · model choice</span></p>
<div class="flow">
<div class="n"><b>1</b>Attach the draft and describe exactly who will review it and what they care about</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>"Review this as that person. What is the first thing attacked? What is unclear? What is claimed without support?"</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>"What is the strongest argument against the central point?"</div>
<div class="a">&#8595;</div>
<div class="n"><b>4</b>Revise, then run it once more from the top</div>
</div>
<div class="note">Worth a capable model and high effort. This is the case where the tier genuinely earns its cost.</div>`},

{l:"PLAY",t:"The translator",h:"One thing, four audiences",b:`<p><span class="tag">Levers: context · batching · artifacts</span></p>
<p>Most workplace communication is the same content aimed at different readers. Do it in one pass, not four.</p>
<ul>
<li>Supply the source material once</li>
<li>Name each audience and what each cares about</li>
<li>Specify the format and length for each</li>
<li>Ask for all versions in one response</li>
</ul>
<p>One shared desk, one reading of the material, four outputs. Four separate chats would re-read the same source four times.</p>`},

{l:"PLAY",t:"The decision memo",h:"Structured thinking, not an <em>answer</em>",b:`<p><span class="tag">Levers: context · effort · verification</span></p>
<p>For a real decision, asking what to do produces a confident answer with invisible reasoning. Ask for the structure instead:</p>
<ul>
<li>The options, including any not yet considered</li>
<li>What each assumes, stated explicitly</li>
<li>What would have to be true for each to be the right choice</li>
<li>What evidence exists, and what is missing</li>
<li>What is reversible and what is not</li>
<li>The strongest case against the apparent front-runner</li>
</ul>
<div class="note">This produces something usable in a meeting, and it keeps the judgement where it belongs — with the person accountable for it.</div>`},

{l:"PLAY",t:"The recurring report",h:"Same shape, new numbers",b:`<p><span class="tag">Levers: projects · skills · files</span></p>
<div class="flow">
<div class="n"><b>Once</b>Build the report properly, iterating until the structure is right</div>
<div class="a">&#8595;</div>
<div class="n"><b>Then</b>Ask for the procedure that produced it, written as instructions someone else could follow</div>
<div class="a">&#8595;</div>
<div class="n"><b>Store</b>As a skill, or in project knowledge as a named template</div>
<div class="a">&#8595;</div>
<div class="n"><b>Every cycle</b>Supply the new data and invoke the procedure. Same shape, every time</div>
</div>
<div class="note">The step everyone skips is the second one. Building the report is the visible work; capturing how it was built is where the compounding is.</div>`},

{l:"PLAY",t:"The onboarding file",h:"Making Claude know the company",b:`<p><span class="tag">Levers: projects · memory</span></p>
<p>Most friction at work comes from Claude not knowing the obvious. Write it down once, as one document in project knowledge:</p>
<ul>
<li>What the organisation does, and how it makes money</li>
<li>The teams, and who cares about what</li>
<li>Internal vocabulary, acronyms and project codenames — decoded</li>
<li>The recurring cycles: reporting, review, approval</li>
<li>Who has to approve what, and what makes a document acceptable</li>
<li>What must never appear in writing that leaves the building</li>
</ul>
<div class="note">Written for a competent new joiner. That is exactly the right register, and exactly the right level of assumed knowledge.</div>`},

{l:"RECALL",t:"Mission 11",h:"The plays",b:`<ul>
<li><strong>Standing brief</strong> — project loaded once, briefed forever.</li>
<li><strong>Closing ritual</strong> — durable output written into knowledge.</li>
<li><strong>Document interrogation</strong> — numbered questions, quoted sources, gaps named.</li>
<li><strong>Reviewer</strong> — the hard read before the real one.</li>
<li><strong>Translator</strong> — one source, several audiences, one pass.</li>
<li><strong>Decision memo</strong> — structure, not an answer.</li>
<li><strong>Recurring report</strong> — capture the procedure, not just the output.</li>
<li><strong>Onboarding file</strong> — the company, written down once.</li>
</ul>`}
]},

/* ============ 12 ============ */
{n:"12",title:"The card",stage:"Recall",
bullets:["Every move, in one place","Where each setting lives","Every trap","The working-at-a-company rules"],
cards:[
{l:"RECALL",t:"The moves",h:"Everything, <em>compressed</em>",b:`<table>
<tr><td>One chat, one job</td><td>New subject, new chat. The desk is re-read every message.</td></tr>
<tr><td>Front-load</td><td>Everything known, in the first message.</td></tr>
<tr><td>Batch</td><td>Related questions, numbered, together.</td></tr>
<tr><td>Stable first</td><td>Fixed material at the top, today's at the bottom.</td></tr>
<tr><td>Attach, don't describe</td><td>And examples beat adjectives.</td></tr>
<tr><td>Anchor</td><td>Summarise, verify, restart clean.</td></tr>
<tr><td>Context update</td><td>Durable output into project knowledge.</td></tr>
<tr><td>Write to memory</td><td>State preferences once, out loud.</td></tr>
<tr><td>Match the model</td><td>Switch down for routine, not only up for hard.</td></tr>
<tr><td>Edit in place</td><td>Highlight and instruct, never regenerate.</td></tr>
<tr><td>Name the format</td><td>Document, spreadsheet, deck, artifact.</td></tr>
<tr><td>Mark confidence</td><td>Sourced, inferred, or uncertain.</td></tr>
<tr><td>Adversarial pass</td><td>Attack it before someone else does.</td></tr>
<tr><td>Ask for the prompt</td><td>Then run it on a clean desk.</td></tr>
<tr><td>Critique loop</td><td>Draft, critique hard, revise.</td></tr>
</table>`},

{l:"RECALL",t:"Settings map",h:"Where everything lives",b:`<table>
<tr><td>Model, effort, thinking</td><td>The menu beside the send button</td></tr>
<tr><td>Memory on or off</td><td>Settings &gt; Memory — or Settings &gt; Capabilities on legacy</td></tr>
<tr><td>What Claude remembers</td><td>Settings &gt; Memory — view, edit, delete by entry</td></tr>
<tr><td>Search past chats</td><td>Settings &gt; Memory — "Search and reference chats"</td></tr>
<tr><td>Session and weekly usage</td><td>Settings &gt; Usage</td></tr>
<tr><td>Usage credits</td><td>Settings &gt; Usage</td></tr>
<tr><td>Incognito chat</td><td>Ghost icon, top right of a new non-project chat</td></tr>
<tr><td>Project knowledge and instructions</td><td>Inside the project, alongside the chat list</td></tr>
</table>
<div class="note">Paths move. Where one is wrong, the feature almost certainly still exists — search the settings for the name rather than assuming it is gone.</div>`},

{l:"RECALL",t:"Traps",h:"Every trap, gathered",b:`<table>
