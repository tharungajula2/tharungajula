<tr><td>Chasing magic wording</td><td>Wording is the weakest of four levers.</td></tr>
<tr><td>The slow reveal</td><td>Ten corrections cost more than one good brief.</td></tr>
<tr><td>The endless chat</td><td>Kept running "so it remembers" — that is what projects are for.</td></tr>
<tr><td>Assuming chats share context</td><td>Inside a project they do not. Only knowledge crosses.</td></tr>
<tr><td>The stale knowledge base</td><td>Two contradictory documents are worse than either alone.</td></tr>
<tr><td>Trusting memory for decisions</td><td>Preferences to memory; decisions to knowledge.</td></tr>
<tr><td>Top tier permanently</td><td>Paying maximum on every request regardless of difficulty.</td></tr>
<tr><td>Effort as a length control</td><td>It governs thinking, not words. State the length.</td></tr>
<tr><td>High effort plus "check everything"</td><td>Two controls pushing the same way, billed twice.</td></tr>
<tr><td>Re-uploading a file</td><td>It is already on the desk. Refer back instead.</td></tr>
<tr><td>Regenerating to fix a line</td><td>Highlight and edit in place.</td></tr>
<tr><td>Trusting fluency</td><td>Wrong answers arrive in the same confident tone.</td></tr>
<tr><td>Tool sprawl</td><td>Few and maintained beats many and ignored.</td></tr>
</table>`},

{l:"RECALL",t:"At a company",h:"The rules that are not about <em>features</em>",b:`<p>Everything above is technique. These are the ones that matter when the work is real and someone's name is on it.</p>
<ul>
<li><strong>Check what is permitted before pasting anything in.</strong> Client data, personal data, unreleased financials and confidential documents are governed by policy, not preference. Ask first.</li>
<li><strong>Connectors are an IT decision.</strong> Granting access to company systems is not an individual choice in most organisations.</li>
<li><strong>Incognito hides from memory, not from an administrator.</strong> On Team and Enterprise plans it still appears in exports and follows retention policy.</li>
<li><strong>Accountability does not transfer.</strong> Claude drafts; the person sending it owns every word.</li>
<li><strong>Verify anything a decision rests on.</strong> Figures, names, citations, regulation — independently, every time.</li>
<li><strong>Be honest about what was used.</strong> Norms vary by organisation; find out what is expected rather than assuming.</li>
</ul>`},

{l:"RECALL",t:"Glossary",h:"Every term",b:`<table>
<tr><td>Artifact</td><td>A document, chart or tool built in its own panel, editable and shareable</td></tr>
<tr><td>Connector</td><td>A link letting Claude reach an external system</td></tr>
<tr><td>Context window</td><td>The desk — everything visible while answering</td></tr>
<tr><td>Context engineering</td><td>Deliberately controlling what goes on the desk</td></tr>
<tr><td>Effort</td><td>How much thinking goes into a response; not a length control</td></tr>
<tr><td>Extended thinking</td><td>A toggle for deeper reasoning on a turn</td></tr>
<tr><td>Incognito chat</td><td>A chat not saved to history or memory</td></tr>
<tr><td>Memory</td><td>Entries Claude keeps about the work, carried between chats</td></tr>
<tr><td>Project</td><td>A workspace with its own knowledge, instructions and chats</td></tr>
<tr><td>Project instructions</td><td>Standing behaviour for every chat in a project</td></tr>
<tr><td>Project knowledge</td><td>Material available to every chat in a project</td></tr>
<tr><td>RAG mode</td><td>Automatic retrieval when project knowledge outgrows the window</td></tr>
<tr><td>Research</td><td>Extended multi-source investigation returning a sourced report</td></tr>
<tr><td>Session limit</td><td>The five-hour rolling window</td></tr>
<tr><td>Skill</td><td>A written procedure Claude loads when a task calls for it</td></tr>
<tr><td>Style</td><td>A saved voice and formatting preference</td></tr>
<tr><td>Token</td><td>A fragment of text, roughly three-quarters of a word</td></tr>
<tr><td>Usage credits</td><td>Pay-as-you-go continuation past a plan's included limits</td></tr>
<tr><td>Weekly limit</td><td>A separate cap running alongside the session window</td></tr>
</table>`},

{l:"CLOSE",t:"Where this stops",h:"The <em>real</em> compression",b:`<p>Everything in this pack reduces to one sentence, and it is worth carrying out on its own.</p>
<div class="note" style="font-size:17px;color:var(--ink);border-left-color:var(--accent)">Most of the difference between weak and excellent output is not what gets asked. It is what Claude can see when it is asked.</div>
<p>Which is why the first three missions carry more weight than the remaining nine combined, and why the mission about wording sits tenth.</p>
<div class="rule"></div>
<div class="meta">
V01 &nbsp;·&nbsp; the operator's card — complete<br>
Verified against official documentation, August 2026<br>
The fastest-moving pack in the set — check paths against the product
</div>
<div class="note" style="margin-top:24px">One honest note to close on. Nothing here makes the output correct. It makes it better informed, better shaped and better checked — and it leaves the judgement, and the accountability, exactly where they were.</div>`}
]}
]};

/* ---------- build the scroll ---------- */
const main=document.getElementById('main'), rail=document.getElementById('rail');
const lc=l=>(l==='TRAP'||l==='TRADE-OFF')?'label q':(l==='RECALL'?'label r':'label');
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards &nbsp;/&nbsp; Version 01</div>
  <h1>The <em>AI Stack</em></h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>Written for one sitting &nbsp;·&nbsp; No prior knowledge assumed<br>August 2026</div>
  <div class="note" style="margin-top:26px">Version 01 is the <strong>map</strong>: what every part of an AI system is, what it does, and where it sits. It goes wide and stops before depth. Later versions go down, one layer at a time, and each begins exactly where this one ends.</div>
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    <div class="inthis">In this mission</div>
    <ul>${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\u0027\u0027\u0027[\\s\\S]*?\u0027\u0027\u0027|"(?:[^"\\\\\\n]|\\\\.)*"|\u0027(?:[^\u0027\\\\\\n]|\\\\.)*\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'python';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
const rev=new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
},{rootMargin:'0px 0px -8% 0px',threshold:.04});
secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
</body>
</html>
