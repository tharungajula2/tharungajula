     "b": "<p>Reconciling a single value column is done with a full outer join and a break-type <code>CASE</code>. Reconciling a <em>wide</em> table means comparing every column of every matched row, and that needs a form which does not require writing forty <code>CASE</code> branches by hand.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Whole-row equality, both directions, in one pass.\nWITH only_in_source AS (\n    SELECT * FROM source_loan\n    EXCEPT\n    SELECT * FROM warehouse_loan\n),\nonly_in_warehouse AS (\n    SELECT * FROM warehouse_loan\n    EXCEPT\n    SELECT * FROM source_loan\n)\nSELECT 'source only'    AS side, * FROM only_in_source\nUNION ALL\nSELECT 'warehouse only' AS side, * FROM only_in_warehouse;\n</pre></div>\n<p><strong>A loan_id appearing on both sides has a value difference</strong>; one appearing on a single side is a genuinely missing or extra record. That distinction, from a query with no column list in it, is what makes this scale to a wide table.</p>\n<p>Three preconditions:</p>\n<ul>\n<li><strong>Column order and types must match exactly.</strong> Two tables with the same columns in different orders will compare column 3 against column 4 and report every row as a break.</li>\n<li><strong>Numeric precision must be aligned.</strong> A value stored as <code>NUMERIC(18,2)</code> on one side and floating point on the other differs in the last decimal place on most rows. Round both sides to the reporting precision before comparing.</li>\n<li><strong>Text must be normalised.</strong> Trailing spaces and case differences are real differences to the database. <code>TRIM</code> and <code>UPPER</code> both sides where the business treats them as equal.</li>\n</ul>\n<div class=\"note\">Precision is the one that produces a reconciliation with thousands of meaningless breaks and destroys confidence in the control. Compare at the precision the number is reported at, not at the precision it is stored at.</div>"
    },
    {
     "l": "TRAP",
     "t": "The clean total",
     "h": "Two totals agreeing does not mean the data <em>agrees</em>",
     "b": "<p>The wrong belief: source and warehouse both total ₹8,615,000, so the load is correct.</p>\n<p>A total is a single number carrying no information about how it was composed. Two loans swapped between branches leave the total untouched. A ₹100,000 record lost and a ₹100,000 record duplicated leave it untouched. A date shifted by one month leaves the book total untouched and moves an entire vintage.</p>\n<div class=\"sheet q\"><div class=\"h\">What a matching total does not prove</div>\n<div class=\"r\"><b>Row-level correctness</b><span>Offsetting errors cancel exactly</span></div>\n<div class=\"r\"><b>Attribute correctness</b><span>Any non-summed column &mdash; branch, product, status, date &mdash; is untested</span></div>\n<div class=\"r\"><b>Grain</b><span>A duplicated row and a dropped row of equal value net to nothing</span></div>\n<div class=\"r\"><b>Coverage</b><span>Both sides may be missing the same records for the same reason</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> A matching total is genuine evidence &mdash; it rules out most large single failures, and it is the first thing worth checking. The error is treating a necessary condition as a sufficient one.</p>\n<div class=\"sheet g\"><div class=\"h\">The four-level reconciliation, in order</div>\n<div class=\"r\"><b>1. Row count</b><span>Do both sides hold the same number of records</span></div>\n<div class=\"r\"><b>2. Key set</b><span><code>EXCEPT</code> in both directions. Which keys exist on one side only</span></div>\n<div class=\"r\"><b>3. Control totals</b><span>Sum of the money column, and of any other additive column</span></div>\n<div class=\"r\"><b>4. Row-by-row values</b><span>Full outer join with break types. The only level that proves anything</span></div>\n</div>\n<div class=\"note\">Levels 1 to 3 are cheap and run daily. Level 4 is the one that gets signed. A control framework that stops at level 3 will pass on the day two errors cancel, which is the day it most needed to fail.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Output that is usable",
     "h": "What a break report has to <em>contain</em>",
     "b": "<p>A reconciliation that produces a number nobody can act on has produced nothing. The output needs six things.</p>\n<div class=\"sheet g\"><div class=\"h\">The six columns</div>\n<div class=\"r\"><b>The key</b><span>Present on every row, from both sides, via <code>COALESCE</code></span></div>\n<div class=\"r\"><b>Both values</b><span>Source and target side by side, not just the difference</span></div>\n<div class=\"r\"><b>The difference</b><span>Signed, so direction is visible</span></div>\n<div class=\"r\"><b>The break type</b><span>Missing, extra, or value mismatch. Different types have different owners</span></div>\n<div class=\"r\"><b>The as-of date</b><span>Which snapshot was compared. A break report with no date cannot be re-run or disputed</span></div>\n<div class=\"r\"><b>The rule that was applied</b><span>Rounding, trimming, exclusions. Stated, not implied</span></div>\n</div>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT DATE '2025-05-31'                     AS as_of,\n       COALESCE(s.loan_id, w.loan_id)        AS loan_id,\n       ROUND(s.exposure, 2)                  AS source_value,\n       ROUND(w.exposure, 2)                  AS target_value,\n       ROUND(COALESCE(s.exposure,0) - COALESCE(w.exposure,0), 2) AS difference,\n       CASE WHEN w.loan_id IS NULL THEN 'MISSING_TARGET'\n            WHEN s.loan_id IS NULL THEN 'EXTRA_TARGET'\n            ELSE 'VALUE_DIFF' END            AS break_type\nFROM      source_loan s\nFULL OUTER JOIN warehouse_loan w ON s.loan_id = w.loan_id\nWHERE     s.loan_id IS NULL OR w.loan_id IS NULL\n   OR     ROUND(s.exposure,2) IS DISTINCT FROM ROUND(w.exposure,2)\nORDER BY  ABS(COALESCE(s.exposure,0) - COALESCE(w.exposure,0)) DESC;\n</pre></div>\n<div class=\"note\">Summarise before sending: count and value of breaks by type. \"Fourteen breaks, ₹640,000 gross, of which one record missing at ₹500,000\" is a sentence someone can act on. A spreadsheet of 14 rows with no summary is a task delegated back.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "Set operations, <em>specified</em>",
     "b": "<p><code>UNION</code>, <code>INTERSECT</code> and <code>EXCEPT</code>, their <code>ALL</code> variants, precedence between them and the type-compatibility rules are all in the <code>SELECT</code> reference under combining queries.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/sql-select.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; SELECT: UNION, INTERSECT and EXCEPT</a>\n<a href=\"https://www.postgresql.org/docs/current/functions-comparison.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; IS DISTINCT FROM, the null-safe comparison</a></div>\n<div class=\"note\">Where several set operations appear in one statement, <code>INTERSECT</code> binds more tightly than <code>UNION</code> and <code>EXCEPT</code> &mdash; the same class of precedence surprise as <code>AND</code> against <code>OR</code>. Bracket them.</div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 08",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong><code>UNION ALL</code> is the default; <code>UNION</code> deduplicates and costs.</strong> Removing genuine duplicates can itself be a defect.</li>\n<li><strong><code>EXCEPT</code> is directional.</strong> Run both ways or half the problem is unchecked.</li>\n<li><strong>The reconciliation pattern is <code>FULL OUTER JOIN</code> plus a break-type <code>CASE</code></strong>, with <code>COALESCE</code> on the key and <code>IS DISTINCT FROM</code> on the value.</li>\n<li><strong>Sort breaks by absolute difference</strong>, not by key. The first ten rows usually carry most of the money.</li>\n<li><strong>Report gross breaks by direction, never the net.</strong> Offsetting errors are two errors.</li>\n<li><strong>Six standard checks:</strong> duplicate keys, orphans, completeness, range, permitted values, date ordering.</li>\n<li><strong>Align precision and trim text before comparing</strong>, or the report fills with meaningless breaks.</li>\n<li><strong>Matching totals prove almost nothing.</strong> Reconcile at four levels: count, key set, control total, row-by-row.</li>\n</ul>"
    }
   ],
   "n": "08"
  },
  {
   "title": "Why a query is slow",
   "stage": "Performance",
   "line": "The planner decides how a query runs. Reading its plan turns 'the report takes forty minutes' into a specific, nameable cause &mdash; and three of those causes are written by the person who wrote the query.",
   "bullets": [
    "What an index is, and why it is not always used",
    "Sargability &mdash; the function on a column that disables the index",
    "Reading an execution plan, node by node",
    "Scans, joins and the estimate that was wrong",
    "Partitioning, and the largest lever on a big table"
   ],
   "cards": [
    {
     "l": "WHY",
     "t": "The cost of a scan",
     "h": "Finding one row in fifty <em>million</em>",
     "b": "<p>With no help, answering <code>WHERE loan_id = 'L1005'</code> means reading every row and testing each one. That is a <span class=\"k\">sequential scan</span> &mdash; also called a full table scan &mdash; and on fifty million rows it reads all fifty million to return one.</p>\n<p>An <span class=\"k\">index</span> is a separate structure holding the values of one or more columns in sorted order, each paired with a pointer to its row. Sorted order permits binary search: halve the range, halve again, and reach any value in roughly the number of halvings it takes to reduce fifty million to one &mdash; about 26 steps rather than fifty million reads.</p>\n<div class=\"dt\"><table>\n<tr><th>Rows</th><th>Sequential scan reads</th><th>Index lookups (approx)</th></tr>\n<tr><td class=\"n\">1,000</td><td class=\"n\">1,000</td><td class=\"n\">10</td></tr>\n<tr><td class=\"n\">1,000,000</td><td class=\"n\">1,000,000</td><td class=\"n\">20</td></tr>\n<tr class=\"hi\"><td class=\"n\">50,000,000</td><td class=\"n\">50,000,000</td><td class=\"n\">26</td></tr>\n</table></div>\n<p><strong>An index is not free.</strong> It occupies storage, and every insert, update and delete must maintain it. A table with twelve indexes writes twelve extra structures on every row inserted, which is why transactional systems are indexed sparingly and reporting tables more heavily.</p>\n<p><strong>And an index is not always used.</strong> Returning a large fraction of the table &mdash; say more than about a fifth &mdash; makes a sequential scan genuinely faster, because following an index pointer to each row scattered across storage costs more than reading the whole thing in order. The planner makes this choice from statistics about the data, and choosing the scan is usually correct.</p>\n<div class=\"note\">Primary keys are indexed automatically in every product. Foreign key columns generally are not, which is why joins on an unindexed foreign key are a common and easily fixed cause of slowness.</div>"
    },
    {
     "l": "TRAP",
     "t": "Sargability",
     "h": "A function on the column <em>disables</em> the index",
     "b": "<p>The wrong belief: an index on <code>disbursed_on</code> means any query filtering on <code>disbursed_on</code> will use it.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Index not usable. Every row must be read so the function can be applied.\nWHERE EXTRACT(YEAR FROM disbursed_on) = 2024\nWHERE UPPER(product) = 'PERSONAL'\nWHERE loan_id || '-' || product = 'L1005-PERSONAL'\nWHERE principal / 100000 &gt; 3\n\n-- Index usable. The column stands bare on one side.\nWHERE disbursed_on &gt;= DATE '2024-01-01' AND disbursed_on &lt; DATE '2025-01-01'\nWHERE product = 'PERSONAL'\nWHERE principal &gt; 300000\n</pre></div>\n<p>The index holds the values of the column, not the values of a function applied to it. Once a column is wrapped in <code>EXTRACT</code>, <code>UPPER</code>, a cast or arithmetic, the database cannot know which index entries would satisfy the condition without computing the function on every row &mdash; which requires reading every row.</p>\n<p>A predicate that leaves the column bare and comparable is called <span class=\"k\">sargable</span>, from \"search argument able\". <strong>Making a predicate sargable is usually a rewrite of the condition, not a change to the data</strong>, and it is the single cheapest performance fix available.</p>\n<div class=\"sheet g\"><div class=\"h\">The three standard rewrites</div>\n<div class=\"r\"><b>Year or month extraction</b><span>Becomes a half-open date range &mdash; Mission 02's pattern, now doing double duty</span></div>\n<div class=\"r\"><b>Case-insensitive match</b><span>Store a normalised column, or build an index on the expression itself</span></div>\n<div class=\"r\"><b>Arithmetic on the column</b><span>Move it to the other side: <code>principal &gt; 3 * 100000</code></span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> The two forms return identical results, and on a small table both are instant. The difference only appears at scale, and nothing in the query's text marks which one is which.</p>\n<div class=\"note\">PostgreSQL and Oracle both support an index built on an expression &mdash; <code>CREATE INDEX ON loan (UPPER(product))</code> &mdash; which makes the non-sargable form usable again. That is a real answer where the expression cannot be avoided, and it is a second index to maintain.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Reading a plan",
     "h": "What the database <em>says it will do</em>",
     "b": "<p><code>EXPLAIN</code> shows the plan without running the query. <code>EXPLAIN ANALYZE</code> runs it and shows estimates against reality. The plan is a tree, read <strong>innermost and most-indented first</strong>, with results flowing upward.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nEXPLAIN ANALYZE\nSELECT b.branch_name, SUM(l.principal)\nFROM   loan l JOIN branch b ON l.branch_id = b.branch_id\nWHERE  l.disbursed_on &gt;= DATE '2024-01-01'\nGROUP BY b.branch_name;\n</pre></div>\n<div class=\"code\" data-cap=\"query plan\"><pre>\nHashAggregate  (cost=1284.19..1284.22 rows=3 width=42)\n               (actual time=18.442..18.451 rows=3 loops=1)\n  Group Key: b.branch_name\n  -&gt;  Hash Join  (cost=1.07..1198.44 rows=17150 width=20)\n                 (actual time=0.061..12.803 rows=17103 loops=1)\n        Hash Cond: (l.branch_id = b.branch_id)\n        -&gt;  Index Scan using idx_loan_disbursed on loan l\n                 (cost=0.43..1102.11 rows=17150 width=14)\n                 (actual time=0.028..7.914 rows=17103 loops=1)\n              Index Cond: (disbursed_on &gt;= '2024-01-01'::date)\n        -&gt;  Hash  (cost=1.03..1.03 rows=3 width=18)\n                  (actual time=0.014..0.015 rows=3 loops=1)\n              -&gt;  Seq Scan on branch b  (cost=0.00..1.03 rows=3 width=18)\nPlanning Time: 0.284 ms\nExecution Time: 18.509 ms\n</pre></div>\n<p>Read from the bottom: the three-row <code>branch</code> table is scanned in full and built into a hash table; <code>loan</code> is read through an index on the date; the two are joined by hash; the result is aggregated. That is a good plan.</p>\n<div class=\"sheet\"><div class=\"h\">The numbers on each line</div>\n<div class=\"r\"><b>cost=1.07..1198.44</b><span>Estimated cost to return the first row, then all rows. Arbitrary units &mdash; only comparable within one plan</span></div>\n<div class=\"r\"><b>rows=17150</b><span>The <strong>estimate</strong>, from table statistics</span></div>\n<div class=\"r\"><b>actual ... rows=17103</b><span>What really happened. Only present with <code>ANALYZE</code></span></div>\n<div class=\"r\"><b>loops=1</b><span>How many times this node ran. Actual figures are <em>per loop</em> and must be multiplied</span></div>\n</div>\n<div class=\"note\">Estimate against actual is the most valuable comparison on the page. Here 17,150 against 17,103 is close, so the planner chose from good information. An estimate of 50 against an actual of 900,000 means the planner picked a strategy suited to a small result and is running it against a large one.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Plan vocabulary",
     "h": "What each node <em>means</em>",
     "b": "<div class=\"sheet\"><div class=\"h\">Access methods &mdash; how rows are reached</div>\n<div class=\"r\"><b>Seq Scan / Full Table Scan</b><span>Every row read. Correct on a small table or a large result; a problem when returning few rows from many</span></div>\n<div class=\"r\"><b>Index Scan</b><span>Index walked, then each matching row fetched. Best for a small number of rows</span></div>\n<div class=\"r\"><b>Index Only Scan</b><span>Answered from the index alone; the table is never touched. The fastest case</span></div>\n<div class=\"r\"><b>Bitmap Heap Scan</b><span>Middle ground: collect matching locations first, then read the table in physical order</span></div>\n</div>\n<div class=\"sheet\"><div class=\"h\">Join methods &mdash; how two inputs are combined</div>\n<div class=\"r\"><b>Nested Loop</b><span>For each outer row, look up the inner. Excellent when the outer side is small, catastrophic when it is not</span></div>\n<div class=\"r\"><b>Hash Join</b><span>Build a hash table from the smaller side, probe with the larger. The workhorse for large equality joins</span></div>\n<div class=\"r\"><b>Merge Join</b><span>Both inputs sorted, then walked together. Good when the sort already exists</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">Five signals worth acting on</div>\n<div class=\"r\"><b>Seq Scan on a large table with a selective filter</b><span>Missing index, or a non-sargable predicate</span></div>\n<div class=\"r\"><b>Estimate far from actual</b><span>Stale statistics. Refresh them &mdash; <code>ANALYZE</code> in PostgreSQL, <code>DBMS_STATS</code> in Oracle</span></div>\n<div class=\"r\"><b>Nested Loop with a large outer row count</b><span>Usually a consequence of the underestimate above</span></div>\n<div class=\"r\"><b>Sort or Hash spilling to disk</b><span>The working memory limit was exceeded. Reduce the rows, or raise the limit</span></div>\n<div class=\"r\"><b>No partition pruning on a partitioned table</b><span>The filter is not reaching the partition key</span></div>\n</div>\n<div class=\"note\">Product vocabulary differs &mdash; Oracle writes <code>TABLE ACCESS FULL</code> and <code>INDEX RANGE SCAN</code>, SQL Server writes <code>Clustered Index Scan</code> and <code>Key Lookup</code> &mdash; but the three access methods and three join methods are the same three everywhere. The concepts transfer even when the words do not.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Partitioning",
     "h": "The biggest lever on a <em>large</em> table",
     "b": "<p><span class=\"k\">Partitioning</span> splits one logical table into physical pieces by the value of a chosen column &mdash; almost always a date on a risk or transaction table. A query filtering on that column reads only the relevant pieces and ignores the rest entirely. That is <span class=\"k\">partition pruning</span>.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- loan_month partitioned by as_of, one partition per month.\n-- 60 months of history, 5 million rows each.\n\n-- Prunes: reads 1 partition of 60.\nWHERE as_of &gt;= DATE '2025-05-01' AND as_of &lt; DATE '2025-06-01'\n\n-- Does not prune: the function hides the partition key.\nWHERE EXTRACT(MONTH FROM as_of) = 5\n\n-- Does not prune: no condition on the partition key at all.\nWHERE loan_id = 'L1005'\n</pre></div>\n<p><strong>Sargability and pruning are the same principle at two scales.</strong> A function on the column defeats the index, and it defeats pruning too &mdash; except that here the cost is reading 300 million rows instead of 5 million.</p>\n<p>Two related mechanisms, worth recognising in a plan:</p>\n<div class=\"sheet\"><div class=\"h\">Beyond partitioning</div>\n<div class=\"r\"><b>Clustering / sort keys</b><span>Rows physically ordered by a column, so a range read is contiguous. Standard in warehouse products</span></div>\n<div class=\"r\"><b>Materialised views</b><span>A query's result stored and refreshed on a schedule. Turns a repeated expensive aggregate into a lookup</span></div>\n</div>\n<div class=\"note\">On a partitioned table, always filter on the partition key even when another condition would already identify the rows. The extra predicate is free and it is the difference between one partition and sixty.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Making it faster",
     "h": "In the order worth <em>trying</em>",
     "b": "<div class=\"sheet g\"><div class=\"h\">Free, and usually enough</div>\n<div class=\"r\"><b>1. Filter earlier</b><span>Push conditions into the innermost layer so every later layer works on fewer rows</span></div>\n<div class=\"r\"><b>2. Make predicates sargable</b><span>Take the function off the column. Half-open date ranges</span></div>\n<div class=\"r\"><b>3. Select fewer columns</b><span>Never <code>SELECT *</code>. Fewer columns can enable an index-only scan</span></div>\n<div class=\"r\"><b>4. Remove needless DISTINCT and ORDER BY</b><span>Both force a sort. A <code>DISTINCT</code> added to hide fan-out is treating the symptom</span></div>\n<div class=\"r\"><b>5. UNION ALL instead of UNION</b><span>Where duplicates are impossible, skip the deduplication sort</span></div>\n</div>\n<div class=\"sheet\"><div class=\"h\">Needs a change to the database</div>\n<div class=\"r\"><b>6. Refresh statistics</b><span>The fix when estimates are far from actuals. Cheap and frequently the whole answer</span></div>\n<div class=\"r\"><b>7. Add an index</b><span>On join keys and on selective filter columns. Composite indexes are used left to right</span></div>\n<div class=\"r\"><b>8. Materialise a repeated aggregate</b><span>When the same expensive summary is computed many times a day</span></div>\n</div>\n<p><strong>Measure before and after, on the same conditions.</strong> A query that ran in forty minutes and now runs in nine may owe that entirely to the data being cached from the first run. Comparing plans is more reliable than comparing clock times.</p>\n<div class=\"note\">A composite index on <code>(branch_id, disbursed_on)</code> serves a filter on <code>branch_id</code> alone, and a filter on both. It does <em>not</em> serve a filter on <code>disbursed_on</code> alone. Column order in a composite index is a design decision, not a formality.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "Plans and indexes, <em>specified</em>",
     "b": "<p>The EXPLAIN chapter works through real plans line by line, including the nested-loop example and how to read cost, rows and loops. The index reference covers types, expression indexes and partial indexes.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/using-explain.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Using EXPLAIN: reading a query plan</a>\n<a href=\"https://www.postgresql.org/docs/current/sql-createindex.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; CREATE INDEX: types, expression and partial indexes</a></div>\n<div class=\"note\">Adding an index to a shared database is a change to shared infrastructure: it consumes storage, slows writes, and on a large table the build itself can lock or load the system. It belongs to whoever owns the database, requested with the plan and the query attached as evidence.</div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 09",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong>An index turns a full read into a search</strong>, and costs storage and write speed. Returning a large fraction of a table makes a scan genuinely faster.</li>\n<li><strong>A function on a column disables the index.</strong> Sargable predicates leave the column bare.</li>\n<li><strong>Plans read innermost first</strong>, results flowing upward.</li>\n<li><strong>Estimate against actual is the most useful number on the page.</strong> A large gap means stale statistics and a plan chosen on bad information.</li>\n<li><strong>Three access methods</strong> &mdash; sequential, index, index-only &mdash; and <strong>three join methods</strong> &mdash; nested loop, hash, merge. Same everywhere, different names.</li>\n<li><strong>Partition pruning is the largest lever on a large table</strong>, and it is defeated by the same thing that defeats an index.</li>\n<li><strong>Filter earlier, select fewer columns, drop needless sorts</strong> before asking for an index.</li>\n<li><strong>Compare plans, not clock times.</strong> The second run is warm.</li>\n</ul>"

   "n": "09"

   "cards": [
    {

     "t": "The whole map",
     "h": "Nine missions, one <em>question</em>",
     "b": "<p>The spine of this pack is a single question travelling from a raw table to a number worth signing.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>01 &middot; Ground</b>What does one row mean? Grain, profiling, and the six questions asked of any unfamiliar table.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>02 &middot; Retrieval</b>Get the right rows out. Six clauses, an execution order that differs from the written order, and the filters that quietly mislead.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>03 &middot; Absence</b>Handle what is not there. Three-valued logic, and the rows that vanish without a message.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>04 &middot; Combining</b>Put the tables back together without losing or multiplying rows. Four join types and four checks.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>05 &middot; Shaping</b>Collapse to an answer. Grouping, <code>CASE</code>, and conditional aggregation as the pivot.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>06 &middot; Sequence</b>Compare a row to its neighbours. Windows, <code>LAG</code>, ranking, deduplication.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>07 &middot; Composition</b>Stack the layers. CTEs, <code>EXISTS</code>, aggregate-before-join, generated calendars.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>08 &middot; Proof</b>Show the number is right. Set operations, full outer reconciliation, break types, quality checks.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>09 &middot; Performance</b>Explain why it is slow. Indexes, sargability, plans, pruning.</div>\n</div>\n<div class=\"note\">Missions 01, 03, 04 and 08 are about being right. Missions 02, 05, 06 and 07 are about being able to express the question. Mission 09 is about being fast. In that order of importance: a fast wrong number is the worst outcome available.</div>"

    {
     "l": "TRAP",
     "t": "Every trap",
     "h": "The full grid, in one <em>place</em>",
     "b": "<div class=\"sheet q\"><div class=\"h\">Grain and counting</div>\n<div class=\"r\"><b>Assuming one row per entity</b><span><code>COUNT(*)</code> against <code>COUNT(DISTINCT key)</code>. Unequal means every sum is suspect</span></div>\n<div class=\"r\"><b><code>COUNT(*)</code> after a join</b><span>Counts joined rows, not entities. Count the distinct key</span></div>\n<div class=\"r\"><b>Mean on a skewed book</b><span>Two large loans pulled the average above six of eight. Use the median</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">Filtering</div>\n<div class=\"r\"><b>Unbracketed AND with OR</b><span><code>AND</code> binds tighter. Bracket every mixed condition</span></div>\n<div class=\"r\"><b><code>BETWEEN</code> on a timestamp</b><span>Loses the last day. Use <code>&gt;= start AND &lt; next start</code></span></div>\n<div class=\"r\"><b><code>LIMIT</code> without <code>ORDER BY</code></b><span>Arbitrary rows, not a sample. Add a unique tiebreaker</span></div>\n<div class=\"r\"><b>Integer division</b><span><code>1/2</code> is <code>0</code>. Make one side decimal</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">Absence</div>\n<div class=\"r\"><b><code>&lt;&gt;</code> drops absent rows</b><span>Add <code>OR col IS NULL</code>, or use <code>IS DISTINCT FROM</code></span></div>\n<div class=\"r\"><b><code>NOT IN</code> with a NULL in the list</b><span>Never true for anything. Use <code>NOT EXISTS</code></span></div>\n<div class=\"r\"><b><code>AVG</code> divides by present values</b><span>Not by row count. Publish the denominator</span></div>\n<div class=\"r\"><b>Blanket <code>COALESCE(col, 0)</code></b><span>Converts \"unknown\" into \"nothing\". Decide per column</span></div>\n<div class=\"r\"><b>Arithmetic with an absent term</b><span>Voids the whole expression, silently</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">Joining</div>\n<div class=\"r\"><b>Inner join as default</b><span>It is a filter. Start from the population, join outward with <code>LEFT</code></span></div>\n<div class=\"r\"><b>Fan-out</b><span>Two one-to-many joins from one parent multiply. Aggregate first</span></div>\n<div class=\"r\"><b>Right-table condition in <code>WHERE</code></b><span>Turns an outer join inner. Put it in <code>ON</code></span></div>\n<div class=\"r\"><b>Unverified lookup key</b><span>A duplicated key in a reference table makes every join to it multiply</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">Shaping, windows and proof</div>\n<div class=\"r\"><b>Averaging averages</b><span>Sum numerator, sum denominator, divide once</span></div>\n<div class=\"r\"><b><code>CASE</code> with no <code>ELSE</code></b><span>Unmatched rows become NULL silently. Absent inputs always land here</span></div>\n<div class=\"r\"><b>Missing group rows</b><span>A combination with no rows produces no row. Generate the grid, left join onto it</span></div>\n<div class=\"r\"><b>Window without <code>PARTITION BY</code></b><span><code>LAG</code> reaches into a different entity's rows</span></div>\n<div class=\"r\"><b><code>ORDER BY</code> inside <code>OVER</code> on a <code>SUM</code></b><span>Silently converts a total into a running total</span></div>\n<div class=\"r\"><b>Filtering a window in <code>WHERE</code></b><span>It does not exist yet. Wrap the query</span></div>\n<div class=\"r\"><b>Trusting a matching total</b><span>Offsetting errors cancel. Reconcile row by row</span></div>\n<div class=\"r\"><b>Reporting the net break</b><span>Two errors of opposite sign look like one small one</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">Performance</div>\n<div class=\"r\"><b>Function on an indexed column</b><span>Disables the index, and defeats partition pruning too</span></div>\n<div class=\"r\"><b>Comparing clock times</b><span>The second run is cached. Compare plans</span></div>\n<div class=\"r\"><b><code>DISTINCT</code> added to fix duplicates</b><span>Hides fan-out and pays for a sort. Fix the join</span></div>\n</div>"

     "b": "<div class=\"code\" data-cap=\"sql\"><pre>\n-- GRAIN AND PROFILE\nSELECT COUNT(*), COUNT(DISTINCT key_col) FROM t;\nSELECT COUNT(*) - COUNT(col) AS missing FROM t;\nSELECT key_col, COUNT(*) n FROM t\nGROUP BY key_col HAVING COUNT(*) &gt; 1 ORDER BY n DESC;\n\n-- SAFE DATE RANGE\nWHERE d &gt;= DATE '2025-01-01' AND d &lt; DATE '2025-02-01'\n\n-- ABSENCE\nWHERE col IS DISTINCT FROM 'X'\nCOALESCE(col, 0)            NULLIF(denominator, 0)\nWHERE NOT EXISTS (SELECT 1 FROM b WHERE b.k = a.k)\n\n-- ANTI-JOIN\nSELECT a.* FROM a LEFT JOIN b ON a.k = b.k WHERE b.k IS NULL;\n\n-- PIVOT\nSUM(CASE WHEN product = 'HOME' THEN principal ELSE 0 END) AS home_book\n\n-- BANDING\nCASE WHEN dpd = 0 THEN 'Current'\n     WHEN dpd BETWEEN 1 AND 30 THEN '1-30'\n     WHEN dpd &gt; 90 THEN '90+'\n     ELSE 'Unknown' END\n\n-- WEIGHTED RATE\nSUM(principal * rate) / SUM(principal)\n\n-- MOVEMENT\nLAG(dpd) OVER (PARTITION BY loan_id ORDER BY as_of)\n\n-- DEDUPLICATE TO ONE ROW PER KEY\nWITH r AS (SELECT *,\n       ROW_NUMBER() OVER (PARTITION BY k ORDER BY d DESC) rn FROM t)\nSELECT * FROM r WHERE rn = 1;\n\n-- RUNNING TOTAL / MOVING AVERAGE\nSUM(x) OVER (PARTITION BY k ORDER BY d)\nAVG(x) OVER (PARTITION BY k ORDER BY d\n              ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)\n\n-- AGGREGATE BEFORE JOINING\nWITH child AS (SELECT k, SUM(x) sx FROM many GROUP BY k)\nSELECT p.*, c.sx FROM parent p LEFT JOIN child c ON p.k = c.k;\n\n-- RECONCILIATION\nSELECT COALESCE(s.k, t.k) AS k, s.v, t.v,\n       COALESCE(s.v,0) - COALESCE(t.v,0) AS diff,\n       CASE WHEN t.k IS NULL THEN 'MISSING_TARGET'\n            WHEN s.k IS NULL THEN 'EXTRA_TARGET'\n            ELSE 'VALUE_DIFF' END AS break_type\nFROM src s FULL OUTER JOIN tgt t ON s.k = t.k\nWHERE s.k IS NULL OR t.k IS NULL OR s.v IS DISTINCT FROM t.v\nORDER BY ABS(COALESCE(s.v,0) - COALESCE(t.v,0)) DESC;\n\n-- PLAN\nEXPLAIN ANALYZE SELECT ...;\n</pre></div>\n<div class=\"sheet\"><div class=\"h\">Execution order, which explains most surprises</div>\n<div class=\"r\"><b>FROM &rarr; WHERE &rarr; GROUP BY &rarr; HAVING &rarr; window functions &rarr; SELECT &rarr; DISTINCT &rarr; ORDER BY &rarr; LIMIT</b><span>Aliases and window results exist only from <code>SELECT</code> onward</span></div>\n</div>"

    {
     "l": "LIVE",
     "t": "Shelf life",
     "h": "What in this pack can <em>change</em>",
     "b": "<div class=\"stamp\">Checked 19 Aug 2026</div>\n<p>Almost nothing here goes stale. The relational model dates to 1970 and the core of the language was standardised in 1986; grain, three-valued logic, join semantics and the execution order have not changed in decades and will not. <strong>This pack carries no market figures, no prices and no rankings</strong>, which is why there is one card on this rather than a mission.</p>\n<div class=\"dt\"><table>\n<tr><th>Claim</th><th>Why it could move</th><th>Re-check</th></tr>\n<tr class=\"hi\"><td>CTE materialisation defaults</td><td class=\"g\">PostgreSQL changed this at version 12; other products differ and continue to tune it</td><td class=\"g\">On a major version upgrade</td></tr>\n<tr><td><code>QUALIFY</code> availability</td><td class=\"g\">Present in several warehouse products, absent from PostgreSQL, Oracle and SQL Server. Support spreads</td><td class=\"g\">Yearly</td></tr>\n<tr><td>Approximate distinct counting</td><td class=\"g\">Function names and accuracy guarantees vary and are actively developed</td><td class=\"g\">Per product, when needed</td></tr>\n<tr><td>MySQL <code>GROUP BY</code> permissiveness</td><td class=\"g\">Tightened in newer versions but configurable, so behaviour depends on the server</td><td class=\"g\">Per server, once</td></tr>\n<tr><td>Planner behaviour</td><td class=\"g\">Every major release changes cost models and adds plan node types</td><td class=\"g\">On a major version upgrade</td></tr>\n</table></div>\n<div class=\"src\">Behaviour throughout this pack was checked against the PostgreSQL manual for the current release. Dialect differences for Oracle, SQL Server, MySQL and SQLite are stated as differences and should be confirmed against each product's own manual before being relied on.</div>\n<div class=\"note\">The two things worth re-reading on any version upgrade are the release notes for planner changes and for anything touching null handling. Both can alter the result or the speed of queries that were correct the day before.</div>"

function hl(src){

    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)||SQLKW.has(w.toUpperCase())) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
