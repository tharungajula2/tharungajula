     "b": "<p>The question: total lending by branch. Recall that L1008, at ₹500,000, has no <code>branch_id</code>.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT b.branch_name, COUNT(*) AS loans, SUM(l.principal) AS book\nFROM   loan   AS l\nJOIN   branch AS b ON l.branch_id = b.branch_id\nGROUP BY b.branch_name;\n</pre></div>\n<div class=\"dt\"><table>\n<tr><th>branch_name</th><th>loans</th><th>book</th></tr>\n<tr><td>Koramangala</td><td class=\"n\">3</td><td class=\"n\">3,190,000</td></tr>\n<tr><td>Andheri</td><td class=\"n\">2</td><td class=\"n\">4,575,000</td></tr>\n<tr><td>Salt Lake</td><td class=\"n\">2</td><td class=\"n\">350,000</td></tr>\n<tr class=\"hi\"><td><strong>Total</strong></td><td class=\"n\"><strong>7</strong></td><td class=\"n\"><strong>8,115,000</strong></td></tr>\n</table></div>\n<p>The book is ₹8,615,000. This report says ₹8,115,000. <strong>The join dropped L1008 because there was nothing in <code>branch</code> to match a null branch id, and the report does not mention it.</strong> Three named branches, plausible figures, wrong total.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT COALESCE(b.branch_name, 'Digital / unassigned') AS branch,\n       COUNT(*) AS loans, SUM(l.principal) AS book\nFROM   loan   AS l\nLEFT JOIN branch AS b ON l.branch_id = b.branch_id\nGROUP BY COALESCE(b.branch_name, 'Digital / unassigned');\n</pre></div>\n<div class=\"dt\"><table>\n<tr><th>branch</th><th>loans</th><th>book</th></tr>\n<tr><td>Koramangala</td><td class=\"n\">3</td><td class=\"n\">3,190,000</td></tr>\n<tr><td>Andheri</td><td class=\"n\">2</td><td class=\"n\">4,575,000</td></tr>\n<tr><td>Salt Lake</td><td class=\"n\">2</td><td class=\"n\">350,000</td></tr>\n<tr class=\"hi\"><td>Digital / unassigned</td><td class=\"n\">1</td><td class=\"n\">500,000</td></tr>\n<tr class=\"hi\"><td><strong>Total</strong></td><td class=\"n\"><strong>8</strong></td><td class=\"n\"><strong>8,615,000</strong></td></tr>\n</table></div>\n<div class=\"note\">The rule this yields: <strong>when one table is the population being measured, start from it and join outward with <code>LEFT JOIN</code>.</strong> The loan book is the population. A branch lookup must never be able to remove a loan from it.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "The other direction",
     "h": "The row with <em>no match at all</em>",
     "b": "<p>C006, Arjun Menon, is onboarded and has never borrowed. Starting from <code>customer</code> shows what an outer join does at the other end.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT c.customer_id, c.name, COUNT(l.loan_id) AS loans\nFROM   customer AS c\nLEFT JOIN loan  AS l ON c.customer_id = l.customer_id\nGROUP BY c.customer_id, c.name\nORDER BY loans DESC, c.customer_id;\n</pre></div>\n<div class=\"dt\"><table>\n<tr><th>customer_id</th><th>name</th><th>loans</th></tr>\n<tr><td>C001</td><td>Anita Rao</td><td class=\"n\">2</td></tr>\n<tr><td>C002</td><td>Vikram Shah</td><td class=\"n\">2</td></tr>\n<tr><td>C004</td><td>Rohit Sen</td><td class=\"n\">2</td></tr>\n<tr><td>C003</td><td>Meera Nair</td><td class=\"n\">1</td></tr>\n<tr><td>C005</td><td>Priya Das</td><td class=\"n\">1</td></tr>\n<tr class=\"hi\"><td>C006</td><td>Arjun Menon</td><td class=\"n\">0</td></tr>\n</table></div>\n<p><strong><code>COUNT(l.loan_id)</code> returns 0 for C006, but <code>COUNT(*)</code> would return 1.</strong> The left join produced one row for Arjun with every loan column absent. <code>COUNT(*)</code> counts that row; <code>COUNT(l.loan_id)</code> counts present loan ids, of which there are none. This is Mission 03's distinction, and on an outer join it is the difference between \"no loans\" and \"one loan\".</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Finding what is missing: the anti-join.\n-- Keep everything on the left, then keep only the rows that failed to match.\nSELECT c.customer_id, c.name\nFROM   customer AS c\nLEFT JOIN loan  AS l ON c.customer_id = l.customer_id\nWHERE  l.loan_id IS NULL;\n-- C006, Arjun Menon\n</pre></div>\n<div class=\"note\">The anti-join is the workhorse of reconciliation. Left join, then filter for absence on the right, and the result is exactly the records present in one system and not the other. Mission 08 builds the full reconciliation on this pattern.</div>"
    },
    {
     "l": "TRAP",
     "t": "Fan-out",
     "h": "Joining two many-sided tables <em>multiplies</em> the money",
     "b": "<p>The wrong belief: a join combines information, so joining more tables adds detail without changing the totals.</p>\n<p>Take L1005, which has 3 rows in <code>repayment</code> and 5 monthly rows in <code>loan_month</code>. Joining both to <code>loan</code> in one query produces <strong>3 &times; 5 = 15 rows</strong> for that single loan. Its principal of ₹200,000 now appears fifteen times, and <code>SUM(l.principal)</code> reports ₹3,000,000 for one ₹200,000 loan.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Wrong. Two independent one-to-many joins from the same parent.\nSELECT SUM(l.principal)\nFROM   loan       AS l\nJOIN   repayment  AS r  ON l.loan_id = r.loan_id\nJOIN   loan_month AS m  ON l.loan_id = m.loan_id;\n</pre></div>\n<p>This is <span class=\"k\">fan-out</span>: the join multiplies rows rather than adding columns. It is the single most expensive error in this pack, because the output is a large plausible number rather than an error.</p>\n<div class=\"sheet g\"><div class=\"h\">Three ways out, in order of preference</div>\n<div class=\"r\"><b>Aggregate before joining</b><span>Collapse each child table to one row per loan first, then join two one-row-per-loan results. Mission 07 builds this as named layers</span></div>\n<div class=\"r\"><b>Join one child table at a time</b><span>Two queries, each correct, rather than one wrong one</span></div>\n<div class=\"r\"><b>Aggregate the parent separately</b><span>Compute <code>SUM(principal)</code> from <code>loan</code> alone. A parent total never needs the children</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> Each join is individually correct. <code>loan</code> to <code>repayment</code> is right, and <code>loan</code> to <code>loan_month</code> is right. Only the combination breaks, and nothing in the syntax marks the point where it does.</p>\n<div class=\"note\">The detection rule is Mission 01's, applied to the join result: <strong>if <code>COUNT(*)</code> after the join exceeds <code>COUNT(DISTINCT loan_id)</code>, the grain has changed and no unaggregated sum of a parent column is safe.</strong></div>"
    },
    {
     "l": "TRAP",
     "t": "ON against WHERE",
     "h": "The clause that turns an outer join <em>inner</em>",
     "b": "<p>The wrong belief: on a left join, a condition on the right-hand table means the same thing in <code>ON</code> as in <code>WHERE</code>.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- A: condition in WHERE\nSELECT c.customer_id, l.loan_id\nFROM   customer AS c\nLEFT JOIN loan  AS l ON c.customer_id = l.customer_id\nWHERE  l.product = 'HOME';\n\n-- B: condition in ON\nSELECT c.customer_id, l.loan_id\nFROM   customer AS c\nLEFT JOIN loan  AS l ON c.customer_id = l.customer_id\n                    AND l.product = 'HOME';\n</pre></div>\n<p><strong>A returns 2 rows. B returns 6.</strong></p>\n<p>The reason is the execution order from Mission 02. The join runs first and produces a row for every customer, with loan columns absent for C006. Then <code>WHERE l.product = 'HOME'</code> is applied to that result &mdash; and for C006 the test is <em>unknown</em>, so the row is discarded. Every unmatched row is removed, and the left join has been converted into an inner join by a clause written three lines below it.</p>\n<p>In B the condition is part of the matching rule: match a customer to their loans <em>only where the product is HOME</em>. Customers with no home loan still appear, with absent loan columns. All six customers survive.</p>\n<div class=\"sheet q\"><div class=\"h\">The rule</div>\n<div class=\"r\"><b>Condition belongs in ON</b><span>When it defines which rows count as a match, and unmatched left rows must survive</span></div>\n<div class=\"r\"><b>Condition belongs in WHERE</b><span>When it filters the finished result, and dropping unmatched rows is intended</span></div>\n<div class=\"r\"><b>Condition on the LEFT table</b><span>Same either way. The distinction only bites on the outer side</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> Both queries are valid, both return sensible rows, and on an inner join the two placements genuinely are equivalent &mdash; so the habit forms in a setting where it is harmless and then carries into one where it is not.</p>\n<div class=\"note\">One exception is deliberate and useful: <code>WHERE l.loan_id IS NULL</code> after a left join is the anti-join. It intentionally keeps only the unmatched rows. Every other null test on the outer side after a left join deserves a second look.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Proving a join",
     "h": "Four checks, before anything is <em>built on it</em>",
     "b": "<p>Run these every time. They take under a minute and they catch the two failures that cost the most &mdash; silent dropping and silent multiplication.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- 1. Row count before and after.\n--    Equal is expected for a lookup join. More means fan-out.\n--    Fewer means an inner join discarded rows.\nSELECT COUNT(*) FROM loan;                       -- 8\nSELECT COUNT(*) FROM loan l JOIN branch b\n       ON l.branch_id = b.branch_id;             -- 7  &lt;-- one lost\n\n-- 2. Grain preserved?\nSELECT COUNT(*) AS rows, COUNT(DISTINCT l.loan_id) AS loans\nFROM   loan l JOIN repayment r ON l.loan_id = r.loan_id;\n-- rows &gt; loans means the result is no longer one row per loan\n\n-- 3. What exactly failed to match, on each side?\nSELECT l.loan_id, l.branch_id\nFROM   loan l LEFT JOIN branch b ON l.branch_id = b.branch_id\nWHERE  b.branch_id IS NULL;                      -- L1008\n\n-- 4. Is the right-hand key actually unique?\n--    If not, the \"lookup\" table is itself a many-side and will fan out.\nSELECT branch_id, COUNT(*) FROM branch\nGROUP BY branch_id HAVING COUNT(*) &gt; 1;          -- empty = safe\n</pre></div>\n<div class=\"sheet g\"><div class=\"h\">Reading the row count after a join</div>\n<div class=\"r\"><b>Same as before</b><span>A clean lookup. Every left row matched exactly one right row</span></div>\n<div class=\"r\"><b>Fewer</b><span>An inner join discarded rows. Find them with check 3 before deciding</span></div>\n<div class=\"r\"><b>More</b><span>Fan-out. Some left row matched several right rows. No parent sum is safe</span></div>\n</div>\n<div class=\"note\">Check 4 is the one most often skipped and it is the one that catches fan-out <em>before</em> it happens. A reference table with a duplicated key is a data quality defect, and it makes every join to that table multiply.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "Join semantics, <em>specified</em>",
     "b": "<p>The manual's Table Expressions chapter sets out all join types and includes the worked example of a condition placed in <code>ON</code> rather than <code>WHERE</code> on a left join &mdash; the distinction on the previous card.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/queries-table-expressions.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Table Expressions: joined tables, ON, USING and NATURAL</a></div>\n<div class=\"note\"><code>NATURAL JOIN</code> matches automatically on every column sharing a name across both tables. It is documented, it is standard, and it is worth avoiding: adding a column upstream silently changes the join condition and therefore the result. Write the condition out.</div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 04",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong>An inner join is a filter.</strong> Plain <code>JOIN</code> means inner, so the destructive form is the default.</li>\n<li><strong>Start from the population and join outward with <code>LEFT JOIN</code></strong>, so a lookup can never remove a member of it.</li>\n<li><strong>An outer join manufactures NULLs</strong> meaning \"no match\", and every rule from Mission 03 then applies to them.</li>\n<li><strong><code>COUNT(*)</code> and <code>COUNT(right.column)</code> differ after an outer join.</strong> The second is the one that returns 0 for an unmatched row.</li>\n<li><strong>The anti-join</strong> &mdash; left join, then <code>WHERE right.key IS NULL</code> &mdash; returns exactly what is missing.</li>\n<li><strong>Fan-out multiplies.</strong> Two one-to-many joins from the same parent multiply the row counts and inflate every parent sum. Aggregate before joining.</li>\n<li><strong>On an outer join, a right-table condition in <code>WHERE</code> silently converts it to an inner join.</strong> Put it in <code>ON</code>.</li>\n<li>Four checks prove a join: row count, grain, what failed to match, and whether the lookup key is unique.</li>\n</ul>"
    }
   ],
   "n": "04"
  },
  {
   "title": "Collapsing rows into answers",
   "stage": "Shaping",
   "line": "Grouping changes the grain of the result deliberately. With CASE inside an aggregate it also turns a long table sideways, which is how nearly every portfolio report is actually built.",
   "bullets": [
    "GROUP BY, and what it does to the grain",
    "The rule that decides what may appear in the select list",
    "HAVING against WHERE",
    "CASE, and conditional aggregation as the pivot mechanism",
    "Counting distinct things, and the ratio traps"
   ],
   "cards": [
    {
     "l": "MECHANISM",
     "t": "Grouping",
     "h": "Many rows in, <em>one row per group</em> out",
     "b": "<p><code>GROUP BY</code> collapses rows sharing a value into a single output row, and an <span class=\"k\">aggregate function</span> computes one number from the many rows in each group.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT product,\n       COUNT(*)        AS loans,\n       SUM(principal)  AS book,\n       AVG(rate)       AS avg_rate,\n       MIN(disbursed_on) AS earliest\nFROM   loan\nGROUP BY product\nORDER BY book DESC;\n</pre></div>\n<div class=\"dt\"><table>\n<tr><th>product</th><th>loans</th><th>book</th><th>avg_rate</th><th>earliest</th></tr>\n<tr class=\"hi\"><td>HOME</td><td class=\"n\">2</td><td class=\"n\">7,300,000</td><td class=\"n\">9.15</td><td>2023-11-15</td></tr>\n<tr><td>PERSONAL</td><td class=\"n\">4</td><td class=\"n\">1,150,000</td><td class=\"n\">14.68</td><td>2024-04-10</td></tr>\n<tr><td>TWO_WHEELER</td><td class=\"n\">2</td><td class=\"n\">165,000</td><td class=\"n\">17.75</td><td>2024-09-01</td></tr>\n</table></div>\n<p><strong>The grain has changed on purpose.</strong> Eight rows, one per loan, became three rows, one per product. Everything downstream now works at product level, and <code>loan_id</code> no longer exists in the result &mdash; it cannot, because each row stands for several loans.</p>\n<p>Grouping by more than one column groups by the combination: <code>GROUP BY product, status</code> yields one row per distinct pair that actually occurs. <strong>Combinations with no rows do not appear at all.</strong> A product with no closed loans produces no closed row, which is why a report built this way can have gaps where a zero was expected.</p>\n<div class=\"note\">The five standard aggregates are <code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code> and <code>MAX</code>. All of them except <code>COUNT(*)</code> ignore absent values, as Mission 03 established &mdash; and <code>SUM</code> over an all-absent group returns absent rather than zero.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "The grouping rule",
     "h": "Grouped, aggregated, or <em>not allowed</em>",
     "b": "<p>Every column in the select list of a grouped query must be one of two things: a column named in <code>GROUP BY</code>, or wrapped in an aggregate function. Nothing else is permitted.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Rejected. loan_id is neither grouped nor aggregated.\nSELECT product, loan_id, SUM(principal)\nFROM   loan GROUP BY product;\n</pre></div>\n<p>The reason is that the question has no answer. The <code>HOME</code> group covers L1003 and L1007. Which <code>loan_id</code> should the row show? The database refuses rather than choosing.</p>\n<div class=\"sheet g\"><div class=\"h\">Legitimate ways to get a detail column alongside a group</div>\n<div class=\"r\"><b>Add it to GROUP BY</b><span>Changes the grain &mdash; now one row per product per loan, which is one row per loan</span></div>\n<div class=\"r\"><b>Aggregate it</b><span><code>MIN(loan_id)</code>, <code>MAX(disbursed_on)</code> &mdash; a defined choice rather than an arbitrary one</span></div>\n<div class=\"r\"><b>Use a window function</b><span>Keeps every row <em>and</em> shows the group total. Mission 06, and usually what was actually wanted</span></div>\n</div>\n<p><strong>MySQL historically permitted the rejected query</strong> and returned a value from an arbitrary row, with no error. Modern versions reject it by default, but older systems and configurations still allow it &mdash; which means a query can run correctly on one server and return silent nonsense on another.</p>\n<div class=\"note\">When this error appears, the useful reaction is not to bolt the column into <code>GROUP BY</code>. It is to ask what grain the answer is meant to have. The error is usually pointing at a genuine confusion about the question.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "HAVING",
     "h": "Filtering <em>groups</em>, not rows",
     "b": "<p><code>WHERE</code> runs before grouping and tests individual rows. <code>HAVING</code> runs after grouping and tests whole groups. Only <code>HAVING</code> can reference an aggregate, because before grouping no aggregate exists.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT   c.city, COUNT(*) AS loans, SUM(l.principal) AS book\nFROM     loan     AS l\nJOIN     customer AS c ON l.customer_id = c.customer_id\nWHERE    l.status = 'ACTIVE'          -- rows: drop closed loans first\nGROUP BY c.city\nHAVING   SUM(l.principal) &gt; 500000    -- groups: drop small cities\nORDER BY book DESC;\n</pre></div>\n<p>Both filters are needed and they are not interchangeable. Moving <code>status = 'ACTIVE'</code> into <code>HAVING</code> is impossible &mdash; status is not an aggregate. Moving the sum into <code>WHERE</code> is impossible for the same reason in reverse.</p>\n<div class=\"sheet\"><div class=\"h\">Which clause</div>\n<div class=\"r\"><b>Test on a raw column value</b><span><code>WHERE</code>. Always. It runs first and reduces the work</span></div>\n<div class=\"r\"><b>Test on COUNT, SUM, AVG, MIN, MAX</b><span><code>HAVING</code>. It is the only clause that can see them</span></div>\n<div class=\"r\"><b>Test on a raw column, written in HAVING</b><span>Some products allow it. It is slower and it misleads the reader</span></div>\n</div>\n<p><strong><code>HAVING COUNT(*) &gt; 1</code> is the duplicate finder</strong>, and it is the most-used line in this whole mission:</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Any key appearing more than once. Empty result = grain confirmed.\nSELECT loan_id, COUNT(*) AS n\nFROM   loan_month\nGROUP BY loan_id\nHAVING COUNT(*) &gt; 1\nORDER BY n DESC;\n</pre></div>\n<div class=\"note\">Ordering that duplicate check by <code>n DESC</code> puts the worst offenders first, which is what makes the output usable when a table has thousands of duplicated keys rather than three.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "CASE",
     "h": "The <em>if</em> of SQL, and the banding tool",
     "b": "<p><code>CASE</code> evaluates conditions in order and returns the result of the first that is true. It is an expression, so it can appear anywhere a column can &mdash; in the select list, inside an aggregate, in <code>GROUP BY</code>, in <code>ORDER BY</code>.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, dpd,\n       CASE WHEN dpd = 0            THEN 'Current'\n            WHEN dpd BETWEEN 1  AND 30  THEN '1-30'\n            WHEN dpd BETWEEN 31 AND 60  THEN '31-60'\n            WHEN dpd BETWEEN 61 AND 90  THEN '61-90'\n            WHEN dpd &gt; 90               THEN '90+'\n            ELSE 'Unknown'\n       END AS bucket\nFROM loan_month\nWHERE as_of = DATE '2025-05-31';\n</pre></div>\n<p><span class=\"k\">Days past due</span> &mdash; DPD &mdash; is the count of days a scheduled payment has gone unpaid, and banding it into ranges is the standard way a lending book is reported.</p>\n<p>Three properties decide whether a <code>CASE</code> is correct:</p>\n<ul>\n<li><strong>Order matters.</strong> Conditions are tested top to bottom and the first true one wins. Putting <code>dpd &gt; 0</code> above <code>dpd BETWEEN 1 AND 30</code> would make the narrower band unreachable.</li>\n<li><strong>Without <code>ELSE</code>, unmatched rows return NULL.</strong> Silently. An <code>ELSE</code> that names the leftovers turns an invisible gap into a visible bucket.</li>\n<li><strong>An absent <code>dpd</code> falls through every condition</strong>, because every comparison to it is unknown. It lands in <code>ELSE</code>, which is precisely why <code>ELSE 'Unknown'</code> is the honest label rather than <code>ELSE 'Current'</code>.</li>\n</ul>\n<div class=\"note\">Bands defined in <code>CASE</code> should match the bands in the policy document exactly, including whether each boundary is inclusive. <code>BETWEEN 1 AND 30</code> includes both 1 and 30; a policy reading \"up to 30 days\" may or may not agree, and that is a question to settle in writing.</div>"
    },
    {
     "l": "WORKED",
     "t": "Conditional aggregation",
     "h": "Turning a long table <em>sideways</em>",
     "b": "<p>An aggregate counts the rows fed to it. Put a <code>CASE</code> inside it and it counts only the rows meeting a condition &mdash; which produces one column per category, in one pass over the table. This is how a pivot is done in SQL.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT b.region,\n       COUNT(*)                                                   AS loans,\n       SUM(CASE WHEN l.product = 'PERSONAL' THEN 1 ELSE 0 END)    AS personal,\n       SUM(CASE WHEN l.product = 'HOME'     THEN 1 ELSE 0 END)    AS home,\n       SUM(CASE WHEN l.product = 'HOME'\n                THEN l.principal ELSE 0 END)                      AS home_book,\n       SUM(l.principal)                                    AS total_book\nFROM   loan   AS l\nJOIN   branch AS b ON l.branch_id = b.branch_id\nGROUP BY b.region;\n</pre></div>\n<div class=\"dt\"><table>\n<tr><th>region</th><th>loans</th><th>personal</th><th>home</th><th>home_book</th><th>total_book</th></tr>\n<tr><td>South</td><td class=\"n\">3</td><td class=\"n\">1</td><td class=\"n\">1</td><td class=\"n\">2,800,000</td><td class=\"n\">3,190,000</td></tr>\n<tr class=\"hi\"><td>West</td><td class=\"n\">2</td><td class=\"n\">0</td><td class=\"n\">1</td><td class=\"n\">4,500,000</td><td class=\"n\">4,575,000</td></tr>\n<tr><td>East</td><td class=\"n\">2</td><td class=\"n\">2</td><td class=\"n\">0</td><td class=\"n\">0</td><td class=\"n\">350,000</td></tr>\n</table></div>\n<p><strong>The <code>ELSE 0</code> is load-bearing.</strong> Written as <code>SUM(CASE WHEN ... THEN 1 END)</code> with no <code>ELSE</code>, non-matching rows contribute NULL. <code>SUM</code> ignores them, so the count still comes out right &mdash; but East's <code>home_book</code> becomes an empty cell instead of 0, and any arithmetic on that cell then voids. Writing <code>ELSE 0</code> costs nothing and removes the class of problem.</p>\n<p>Two equivalent forms are worth recognising, since both appear constantly in existing code:</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nCOUNT(CASE WHEN l.product = 'HOME' THEN 1 END)   -- no ELSE: COUNT skips NULL\nCOUNT(*) FILTER (WHERE l.product = 'HOME')   -- standard; Postgres, SQLite\n</pre></div>\n<div class=\"note\">This one pattern produces almost every management report in lending: bucket distributions, product splits, vintage grids, stage-wise provisions. Learn it once and a very large class of reporting requests becomes a single query.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Counting distinctly",
     "h": "Rows, values, and <em>things</em>",
     "b": "<p>Three counts, three different questions, and they are constantly confused.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT COUNT(*)                     AS rows_in_table,\n       COUNT(branch_id)             AS rows_with_a_branch,\n       COUNT(DISTINCT branch_id)    AS distinct_branches,\n       COUNT(DISTINCT customer_id)  AS distinct_borrowers\nFROM   loan;\n-- 8, 7, 3, 5\n</pre></div>\n<div class=\"sheet\"><div class=\"h\">Reading those four numbers</div>\n<div class=\"r\"><b>8 rows</b><span>Eight loans exist</span></div>\n<div class=\"r\"><b>7 with a branch</b><span>One is unassigned. <code>COUNT(DISTINCT)</code> also ignores absence, so it never counts \"unknown\" as a branch</span></div>\n<div class=\"r\"><b>3 branches</b><span>All three branches have lent</span></div>\n<div class=\"r\"><b>5 borrowers</b><span>Eight loans across five people &mdash; the book is more concentrated than the loan count suggests</span></div>\n</div>\n<p><strong>Borrower count against loan count is a real measurement</strong>, not a technicality. Eight loans held by five people means average exposure per borrower is ₹1,723,000 against ₹1,076,875 per loan, and a single borrower defaulting takes more than one loan with them.</p>\n<p><code>COUNT(DISTINCT ...)</code> is expensive on large tables, because the database must hold every distinct value seen to know whether the next one is new. On a warehouse-scale table, approximate distinct counting &mdash; <code>APPROX_COUNT_DISTINCT</code> in several products &mdash; trades a small error for a large speed gain. On a book of a few million rows, the exact form is fine.</p>\n<div class=\"note\">After a join, <code>COUNT(*)</code> counts the joined rows and no longer counts loans. <strong>Once a join is in the query, count the key, not the rows</strong> &mdash; <code>COUNT(DISTINCT l.loan_id)</code> survives fan-out where <code>COUNT(*)</code> does not.</div>"
    },
    {
     "l": "TRAP",
     "t": "The ratio trap",
     "h": "Averaging averages gives the <em>wrong</em> average",
     "b": "<p>The wrong belief: to get the portfolio's overall rate, average the branch-level rates.</p>\n<p>Three branches with average rates of 14.5%, 9.4% and 15.6% do not give a portfolio rate of 13.17%. That figure treats a branch with two small loans as equal to a branch holding a ₹4.5 million home loan. The correct portfolio rate weights each loan by its size &mdash; and the two answers can differ by several percentage points on a book with any concentration in it.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Wrong: the mean of the branch means\nSELECT AVG(branch_rate) FROM (\n  SELECT branch_id, AVG(rate) AS branch_rate\n  FROM loan GROUP BY branch_id\n) AS per_branch;\n\n-- Right: divide the total by the total\nSELECT SUM(principal * rate) / SUM(principal) AS weighted_rate\nFROM   loan;\n</pre></div>\n<p>The general rule: <strong>a ratio is computed by summing the numerator and the denominator separately and dividing once, at the end.</strong> Never by averaging ratios that were themselves already divided.</p>\n<div class=\"fx\"><div class=\"cap\">Portfolio rate, weighted by exposure</div>\n<div class=\"eq\"><em>r</em><sub>portfolio</sub> = <span class=\"fr\"><i>&Sigma; (principal<sub>i</sub> &times; rate<sub>i</sub>)</i><i>&Sigma; principal<sub>i</sub></i></span></div>\n<div class=\"wh\">principal<sub>i</sub>&nbsp;&nbsp;the outstanding amount of loan i<br>\nrate<sub>i</sub>&nbsp;&nbsp;the interest rate on loan i<br>\n&Sigma;&nbsp;&nbsp;summed across every loan in the portfolio</div></div>\n<p><strong>Why it is a believable mistake.</strong> The branch report is on screen, it has a rate column, and averaging that column is the obvious next step. The result is in a plausible range, so nothing prompts a second look.</p>\n<div class=\"note\">The same trap governs delinquency ratios, recovery rates and coverage ratios. Any figure that is itself a division must be rebuilt from its components before being aggregated across groups.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Shaping reference",
     "h": "The compressed <em>surface</em>",
     "b": "<div class=\"sheet\"><div class=\"h\">Aggregates worth knowing beyond the five</div>\n<div class=\"r\"><b>STDDEV, VARIANCE</b><span>Dispersion. Standard everywhere</span></div>\n<div class=\"r\"><b>PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x)</b><span>The median. Standard, and far more honest than <code>AVG</code> on a skewed book</span></div>\n<div class=\"r\"><b>STRING_AGG(x, ', ')</b><span>Concatenates a group's values into one cell. <code>LISTAGG</code> in Oracle</span></div>\n<div class=\"r\"><b>COUNT(*) FILTER (WHERE cond)</b><span>Standard conditional count. <code>SUM(CASE...)</code> is the portable equivalent</span></div>\n</div>\n<div class=\"sheet g\"><div class=\"h\">Grouping extensions</div>\n<div class=\"r\"><b>GROUP BY ROLLUP(a, b)</b><span>Adds subtotal rows per <code>a</code> and one grand total</span></div>\n<div class=\"r\"><b>GROUP BY CUBE(a, b)</b><span>Every combination of subtotals. Expensive; use deliberately</span></div>\n<div class=\"r\"><b>GROUPING(a)</b><span>Returns 1 on a subtotal row, so totals can be labelled and sorted</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">The four shaping traps</div>\n<div class=\"r\"><b>Averaging averages</b><span>Sum numerator and denominator, divide once</span></div>\n<div class=\"r\"><b>Missing ELSE in CASE</b><span>Unmatched rows silently become NULL</span></div>\n<div class=\"r\"><b>Absent groups</b><span>A combination with no rows produces no row, not a zero</span></div>\n<div class=\"r\"><b>COUNT(*) after a join</b><span>Counts joined rows. Count the distinct key instead</span></div>\n</div>\n<div class=\"note\">The missing-zero-row problem is solved by generating the full grid of categories and left joining the data onto it &mdash; a calendar table or a category list on the left, the aggregate on the right. Mission 07 builds that grid.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "Aggregates and grouping, <em>specified</em>",
     "b": "<p>The aggregate reference lists every function, its null handling, and the <code>FILTER</code> clause. The <code>SELECT</code> reference covers <code>GROUP BY</code>, <code>HAVING</code>, <code>ROLLUP</code> and <code>CUBE</code>.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/functions-aggregate.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Aggregate Functions, including FILTER and ordered-set aggregates</a>\n<a href=\"https://www.postgresql.org/docs/current/sql-select.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; SELECT: the GROUP BY and HAVING clauses</a></div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 05",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong><code>GROUP BY</code> changes the grain on purpose.</strong> The result is one row per distinct combination, and detail columns cease to exist.</li>\n<li><strong>Every select-list column must be grouped or aggregated.</strong> The error usually indicates a confused question, not a missing clause.</li>\n<li><strong><code>WHERE</code> filters rows before grouping; <code>HAVING</code> filters groups after.</strong> Only <code>HAVING</code> can see an aggregate.</li>\n<li><strong><code>GROUP BY key HAVING COUNT(*) &gt; 1</code> is the duplicate finder.</strong></li>\n<li><strong><code>CASE</code> tests top to bottom, first match wins, and no <code>ELSE</code> means silent NULLs.</strong> Absent inputs always fall to <code>ELSE</code>.</li>\n<li><strong><code>SUM(CASE WHEN ... THEN x ELSE 0 END)</code> is the pivot.</strong> One column per category, one pass over the table.</li>\n<li><strong>Combinations with no rows produce no row.</strong> Generate the grid and left join onto it to get zeros.</li>\n<li><strong>Never average a ratio.</strong> Sum numerator, sum denominator, divide once.</li>\n</ul>"
    }
   ],
   "n": "05"
  },
  {
   "title": "Looking at neighbouring rows",
   "stage": "Sequence",
   "line": "A window function computes across a set of related rows while keeping every row intact. It is what makes movement, ranking and running totals expressible &mdash; and it is the dividing line between basic and capable SQL.",
   "bullets": [
    "How a window differs from a group",
    "PARTITION BY and ORDER BY inside OVER",
    "LAG and LEAD &mdash; comparing a row to the one before it",
    "Ranking, and the three functions that handle ties differently",
    "Frames, running totals, and deduplicating by rank"
   ],
   "cards": [
    {
     "l": "ORIENT",
     "t": "Window against group",
     "h": "Compute across rows <em>without collapsing them</em>",
     "b": "<p>A <code>GROUP BY</code> destroys the rows it summarises: eight loans become three product rows. A <span class=\"k\">window function</span> computes the same kind of summary but returns it on <strong>every original row</strong>. Nothing is collapsed.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, product, principal,\n       SUM(principal) OVER (PARTITION BY product)  AS product_book,\n       principal * 100.0\n         / SUM(principal) OVER (PARTITION BY product) AS pct_of_product\nFROM   loan;\n</pre></div>\n<div class=\"dt\"><table>\n<tr><th>loan_id</th><th>product</th><th>principal</th><th>product_book</th><th>pct_of_product</th></tr>\n<tr><td>L1003</td><td>HOME</td><td class=\"n\">4,500,000</td><td class=\"n\">7,300,000</td><td class=\"n\">61.6</td></tr>\n<tr><td>L1007</td><td>HOME</td><td class=\"n\">2,800,000</td><td class=\"n\">7,300,000</td><td class=\"n\">38.4</td></tr>\n<tr class=\"hi\"><td>L1008</td><td>PERSONAL</td><td class=\"n\">500,000</td><td class=\"n\">1,150,000</td><td class=\"n\">43.5</td></tr>\n<tr><td>L1001</td><td>PERSONAL</td><td class=\"n\">300,000</td><td class=\"n\">1,150,000</td><td class=\"n\">26.1</td></tr>\n<tr><td>L1005</td><td>PERSONAL</td><td class=\"n\">200,000</td><td class=\"n\">1,150,000</td><td class=\"n\">17.4</td></tr>\n<tr><td>L1004</td><td>PERSONAL</td><td class=\"n\">150,000</td><td class=\"n\">13.0</td><td class=\"n\">13.0</td></tr>\n</table></div>\n<p>Eight rows in, eight rows out, each carrying its group's total alongside its own value. Achieving this with <code>GROUP BY</code> takes an aggregate query joined back to the detail; the window function does it in one clause.</p>\n<p><strong><code>OVER</code> is what makes a function a window function.</strong> The same <code>SUM</code> becomes an aggregate without it and a window function with it. There is no separate list of window-only aggregates &mdash; <code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code> and <code>MAX</code> all work either way.</p>\n<div class=\"note\">Window functions are evaluated <em>after</em> <code>WHERE</code>, <code>GROUP BY</code> and <code>HAVING</code>, and before <code>ORDER BY</code>. That is why a window result cannot be filtered in <code>WHERE</code> &mdash; it does not exist yet. Wrapping the query is the standard remedy, and Mission 07 covers it.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Inside OVER",
     "h": "Two words that define the <em>window</em>",
     "b": "<p>The <code>OVER</code> clause has two main parts, and each is optional.</p>\n<div class=\"sheet\"><div class=\"h\">The anatomy</div>\n<div class=\"r\"><b>PARTITION BY col</b><span>Splits rows into independent groups. The function restarts at each new group. Analogous to <code>GROUP BY</code>, but non-destructive</span></div>\n<div class=\"r\"><b>ORDER BY col</b><span>Sequences rows <em>within</em> each partition. Required by anything positional &mdash; ranking, previous value, running total</span></div>\n<div class=\"r\"><b>OVER ()</b><span>Empty: the whole result set is one window. Gives the grand total on every row</span></div>\n</div>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, product, principal,\n       SUM(principal) OVER ()                          AS whole_book,\n       SUM(principal) OVER (PARTITION BY product)      AS product_book,\n       SUM(principal) OVER (PARTITION BY product\n                            ORDER BY principal DESC)   AS running_in_product\nFROM   loan;\n</pre></div>\n<p><strong>Adding <code>ORDER BY</code> inside <code>OVER</code> changes the meaning of an aggregate.</strong> Without it, <code>SUM</code> covers the entire partition and every row shows the same total. With it, <code>SUM</code> accumulates from the first row to the current one &mdash; a running total. That is not a variation, it is a different number, and it catches people constantly.</p>\n<p>The reason is the <span class=\"k\">frame</span>: the subset of the partition the function actually sees. With no <code>ORDER BY</code>, the frame defaults to the whole partition. With <code>ORDER BY</code>, it defaults to everything from the start up to the current row.</p>\n<div class=\"note\">The same window used several times can be named once with a <code>WINDOW</code> clause &mdash; <code>WINDOW w AS (PARTITION BY product ORDER BY principal DESC)</code>, then <code>OVER w</code>. It removes repetition and, more usefully, removes the chance of two windows drifting apart during editing.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "LAG and LEAD",
     "h": "Reaching the <em>previous</em> row",
     "b": "<p><code>LAG</code> returns a value from an earlier row in the partition; <code>LEAD</code> from a later one. This is what makes movement computable, and movement is the whole point of a monthly risk table.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, as_of, dpd,\n       LAG(dpd)  OVER (PARTITION BY loan_id ORDER BY as_of) AS dpd_prev,\n       dpd - LAG(dpd) OVER (PARTITION BY loan_id ORDER BY as_of) AS movement,\n       LAG(bucket, 1, 'NEW') OVER (PARTITION BY loan_id ORDER BY as_of)\n                                                            AS bucket_prev\nFROM   loan_month\nORDER BY loan_id, as_of;\n</pre></div>\n<p>Three arguments: the column, how many rows back (default 1), and what to return when there is no such row (default NULL). <strong>The first row of every partition has no predecessor</strong>, so <code>LAG</code> returns absent there &mdash; and the third argument is how that is labelled rather than left blank.</p>\n<p><code>PARTITION BY loan_id</code> is not optional here. Without it, the window runs across the whole table and the first row of one loan compares against the last row of a different loan &mdash; producing a movement figure that is arithmetically fine and completely meaningless.</p>\n<div class=\"dt\"><table>\n<tr><th>loan_id</th><th>as_of</th><th>dpd</th><th>dpd_prev</th><th>movement</th></tr>\n<tr><td>L1005</td><td>2025-01-31</td><td class=\"n\">0</td><td class=\"n\"><em>NULL</em></td><td class=\"n\"><em>NULL</em></td></tr>\n<tr><td>L1005</td><td>2025-02-28</td><td class=\"n\">0</td><td class=\"n\">0</td><td class=\"n\">0</td></tr>\n<tr><td>L1005</td><td>2025-03-31</td><td class=\"n\">15</td><td class=\"n\">0</td><td class=\"n\">+15</td></tr>\n<tr class=\"hi\"><td>L1005</td><td>2025-04-30</td><td class=\"n\">45</td><td class=\"n\">15</td><td class=\"n\">+30</td></tr>\n<tr class=\"hi\"><td>L1005</td><td>2025-05-31</td><td class=\"n\">72</td><td class=\"n\">45</td><td class=\"n\">+27</td></tr>\n</table></div>\n<div class=\"note\">The <code>ORDER BY</code> inside <code>OVER</code> must be on a column that genuinely sequences the rows. Ordering by an insertion timestamp when the business sequence is the month-end date gives a \"previous row\" that is not the previous period, and no error is raised.</div>"
    },
    {
     "l": "WORKED",
     "t": "A transition matrix",
     "h": "Two windows, and the whole <em>migration table</em>",
     "b": "<p>A <span class=\"k\">transition matrix</span> counts how many accounts moved from each delinquency bucket to each other bucket between two dates. It is built entirely from <code>LAG</code> plus the conditional aggregation of Mission 05.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nWITH moved AS (\n  SELECT loan_id, as_of, bucket,\n         LAG(bucket) OVER (PARTITION BY loan_id ORDER BY as_of) AS bucket_prev\n  FROM   loan_month\n)\nSELECT bucket_prev AS from_bucket,\n       COUNT(*)                                              AS accounts,\n       SUM(CASE WHEN bucket = 'Current' THEN 1 ELSE 0 END)   AS to_current,\n       SUM(CASE WHEN bucket = '1-30'    THEN 1 ELSE 0 END)   AS to_1_30,\n       SUM(CASE WHEN bucket = '31-60'   THEN 1 ELSE 0 END)   AS to_31_60,\n       SUM(CASE WHEN bucket = '61-90'   THEN 1 ELSE 0 END)   AS to_61_90\nFROM   moved\nWHERE  bucket_prev IS NOT NULL          -- drop each loan's first month\n  AND  as_of = DATE '2025-05-31'\nGROUP BY bucket_prev;\n</pre></div>\n<div class=\"dt\"><table>\n<tr><th>from_bucket</th><th>accounts</th><th>to_current</th><th>to_1-30</th><th>to_31-60</th><th>to_61-90</th></tr>\n<tr><td>Current</td><td class=\"n\">412</td><td class=\"n\">396</td><td class=\"n\">16</td><td class=\"n\">0</td><td class=\"n\">0</td></tr>\n<tr><td>1-30</td><td class=\"n\">38</td><td class=\"n\">9</td><td class=\"n\">21</td><td class=\"n\">8</td><td class=\"n\">0</td></tr>\n<tr class=\"hi\"><td>31-60</td><td class=\"n\">12</td><td class=\"n\">1</td><td class=\"n\">2</td><td class=\"n\">3</td><td class=\"n\">6</td></tr>\n</table></div>\n<p>Read across a row for what happened to that population. Of 38 accounts in 1&ndash;30 at April month-end, 9 cured, 21 stayed and 8 deteriorated. <strong>The proportion moving to a worse bucket is the roll rate</strong> &mdash; here 8 of 38, or 21%, out of the 1&ndash;30 bucket.</p>\n<p>The <code>WHERE bucket_prev IS NOT NULL</code> line matters. Each loan's first observed month has no predecessor, and including those rows would count new accounts as a transition from nowhere, inflating the denominator.</p>\n<div class=\"note\">Figures in this table are illustrative of the shape rather than computed from the eight-loan book, which is too small to populate a matrix. The query is exact; the counts are representative.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Ranking",
     "h": "Three functions, three answers on a <em>tie</em>",
     "b": "<p>Three ranking functions exist because there are three defensible things to do when two rows are equal.</p>\n<div class=\"dt\"><table>\n<tr><th>principal</th><th>ROW_NUMBER</th><th>RANK</th><th>DENSE_RANK</th></tr>\n<tr><td class=\"n\">4,500,000</td><td class=\"n\">1</td><td class=\"n\">1</td><td class=\"n\">1</td></tr>\n<tr class=\"hi\"><td class=\"n\">300,000</td><td class=\"n\">2</td><td class=\"n\">2</td><td class=\"n\">2</td></tr>\n<tr class=\"hi\"><td class=\"n\">300,000</td><td class=\"n\">3</td><td class=\"n\">2</td><td class=\"n\">2</td></tr>\n<tr><td class=\"n\">200,000</td><td class=\"n\">4</td><td class=\"n\">4</td><td class=\"n\">3</td></tr>\n</table></div>\n<div class=\"sheet\"><div class=\"h\">Which to use</div>\n<div class=\"r\"><b>ROW_NUMBER()</b><span>Always distinct, 1 2 3 4. Ties broken arbitrarily unless the sort makes them unique. The deduplication tool</span></div>\n<div class=\"r\"><b>RANK()</b><span>Ties share a rank and the next value skips. Two seconds, then fourth. Competition scoring</span></div>\n<div class=\"r\"><b>DENSE_RANK()</b><span>Ties share a rank and nothing is skipped. Two seconds, then third. Grade banding</span></div>\n<div class=\"r\"><b>NTILE(n)</b><span>Splits the partition into n equal buckets. Deciles for a scorecard are <code>NTILE(10)</code></span></div>\n</div>\n<p><strong><code>ROW_NUMBER</code> with ties broken arbitrarily is a reproducibility problem.</strong> Two loans of exactly ₹300,000 may be numbered either way on different runs. Adding a unique tiebreaker &mdash; <code>ORDER BY principal DESC, loan_id</code> &mdash; makes the result deterministic, and the same discipline as Mission 02's sorting rule.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT branch_id, loan_id, principal,\n       ROW_NUMBER() OVER (PARTITION BY branch_id\n                          ORDER BY principal DESC, loan_id) AS rn\nFROM   loan;\n-- rn = 1 is the largest loan in each branch\n</pre></div>\n<div class=\"note\"><code>NTILE</code> distributes remainders into the earliest buckets, so 103 rows into 10 buckets gives three buckets of 11 and seven of 10. On small populations the buckets are not equal and the deciles are not comparable across periods.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Deduplicating",
     "h": "Keeping one row per key, by a <em>defined rule</em>",
     "b": "<p>The most-used window pattern in production code: several rows exist per key, one must be kept, and which one is a business decision rather than an accident.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Keep the most recent record per loan.\nWITH ranked AS (\n  SELECT *,\n         ROW_NUMBER() OVER (PARTITION BY loan_id\n                            ORDER BY as_of DESC, loaded_at DESC) AS rn\n  FROM   loan_month\n)\nSELECT * FROM ranked WHERE rn = 1;\n</pre></div>\n<p>Three things make this correct rather than merely working:</p>\n<ul>\n<li><strong>The partition is the key the output should be unique on.</strong> Get this wrong and rows survive that should not.</li>\n<li><strong>The sort encodes the rule.</strong> Latest as-of date; where two share one, the later load wins. That rule should exist in writing before the query does.</li>\n<li><strong>The filter must be outside the window.</strong> <code>WHERE rn = 1</code> cannot sit in the same query as the <code>ROW_NUMBER</code>, because windows are computed after <code>WHERE</code>. It needs the wrapper &mdash; here a common table expression, Mission 07.</li>\n</ul>\n<div class=\"sheet g\"><div class=\"h\">Related one-line patterns</div>\n<div class=\"r\"><b>First value in each partition</b><span><code>FIRST_VALUE(col) OVER (PARTITION BY k ORDER BY d)</code></span></div>\n<div class=\"r\"><b>Latest value carried onto every row</b><span><code>LAST_VALUE(col) OVER (PARTITION BY k ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)</code></span></div>\n<div class=\"r\"><b>Running total</b><span><code>SUM(x) OVER (PARTITION BY k ORDER BY d)</code></span></div>\n<div class=\"r\"><b>Three-month moving average</b><span><code>AVG(x) OVER (PARTITION BY k ORDER BY d ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)</code></span></div>\n</div>\n<div class=\"note\"><code>LAST_VALUE</code> is the one that surprises people. With <code>ORDER BY</code> and no explicit frame, the frame ends at the current row, so \"last value\" returns the current row's own value. The explicit <code>UNBOUNDED FOLLOWING</code> frame is what makes it mean what its name says.</div>"
    },
    {
     "l": "TRAP",
     "t": "Filtering a window",
     "h": "The result cannot be used in <em>WHERE</em>",
     "b": "<p>The wrong belief: a window function produces a column, so it can be filtered like any other column.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Rejected by the database\nSELECT loan_id, ROW_NUMBER() OVER (ORDER BY principal DESC) AS rn\nFROM   loan\nWHERE  rn &lt;= 3;\n</pre></div>\n<p>Mission 02's execution order explains it exactly. <code>WHERE</code> runs long before the select list is computed, and window functions are evaluated later still &mdash; after grouping, before sorting. When <code>WHERE</code> executes, <code>rn</code> does not exist.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Correct: compute the window in an inner query, filter in the outer one\nWITH ranked AS (\n  SELECT loan_id, principal,\n         ROW_NUMBER() OVER (ORDER BY principal DESC, loan_id) AS rn\n  FROM   loan\n)\nSELECT loan_id, principal FROM ranked WHERE rn &lt;= 3;\n</pre></div>\n<p><strong>Why it is a believable mistake.</strong> Aggregates have <code>HAVING</code> as their after-the-fact filter, so it is reasonable to expect windows to have something similar. Most products do not provide one &mdash; Snowflake, Databricks and BigQuery offer <code>QUALIFY</code>, which does exactly this job, but it is not standard and not available in PostgreSQL, Oracle or SQL Server.</p>\n<div class=\"note\">The wrapper is not a workaround, it is the structure. Compute in one layer, filter in the next. Mission 07 turns this into a general way of building queries rather than a fix applied when something is rejected.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "Window semantics, <em>specified</em>",
     "b": "<p>The tutorial chapter is the clearest short explanation of what a window is; the function reference lists <code>LAG</code>, <code>LEAD</code>, the ranking functions and the frame syntax in full.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/tutorial-window.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Window Functions, the introduction</a>\n<a href=\"https://www.postgresql.org/docs/current/functions-window.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Window Function reference: LAG, LEAD, RANK, NTILE and frames</a></div>\n<div class=\"note\">The reference notes that the standard's <code>IGNORE NULLS</code> option for <code>LAG</code>, <code>LEAD</code> and <code>FIRST_VALUE</code> is not implemented in PostgreSQL, which always respects nulls. Oracle does implement it. That is a genuine behavioural difference when a series has gaps.</div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 06",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong><code>OVER</code> makes a function a window function.</strong> Rows are kept, not collapsed &mdash; the difference from <code>GROUP BY</code>.</li>\n<li><strong><code>PARTITION BY</code> restarts the calculation; <code>ORDER BY</code> inside <code>OVER</code> sequences it.</strong></li>\n<li><strong>Adding <code>ORDER BY</code> to a windowed <code>SUM</code> converts a partition total into a running total.</strong> Different number, same syntax.</li>\n<li><strong><code>LAG</code> gives movement</strong>, and movement gives roll rates and transition matrices. Always partition by the entity.</li>\n<li><strong>The first row of a partition has no predecessor</strong> and must be excluded from transition counts.</li>\n<li><strong><code>ROW_NUMBER</code>, <code>RANK</code> and <code>DENSE_RANK</code> differ only on ties.</strong> Add a unique tiebreaker for reproducibility.</li>\n<li><strong><code>ROW_NUMBER() ... WHERE rn = 1</code> is the deduplication pattern</strong>, and the sort encodes the business rule.</li>\n<li><strong>A window result cannot be filtered in <code>WHERE</code>.</strong> Wrap the query and filter outside.</li>\n</ul>"
    }
   ],
   "n": "06"
  },
  {
   "title": "Building a query in layers",
   "stage": "Composition",
   "line": "Complex questions are not written in one piece. They are stacked: each layer produces a named intermediate result at a known grain, and the next layer works on it. This is the difference between SQL that can be reviewed and SQL that cannot.",
   "bullets": [
    "Common table expressions, and why they replaced nested subqueries",
    "The four places a subquery can appear",
    "EXISTS and NOT EXISTS, and why they beat IN on absent values",
    "Solving fan-out by aggregating before joining",
    "Recursive CTEs, and generating a calendar to fill missing rows"
   ],
   "cards": [
    {
     "l": "WHY",
     "t": "Why layers",
     "h": "A nested query is written <em>inside out</em>",
     "b": "<p>A subquery inside a subquery inside a join is read from the middle outward, which is not how anyone reads. A <span class=\"k\">common table expression</span> &mdash; a CTE, introduced by <code>WITH</code> &mdash; gives each intermediate result a name and puts it at the top, so the query reads in the order it executes.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nWITH active_loans AS (\n    SELECT * FROM loan WHERE status = 'ACTIVE'\n),\nper_customer AS (\n    SELECT customer_id,\n           COUNT(*)       AS loans,\n           SUM(principal) AS exposure\n    FROM   active_loans\n    GROUP BY customer_id\n)\nSELECT c.name, c.city, p.loans, p.exposure\nFROM   per_customer AS p\nJOIN   customer     AS c ON p.customer_id = c.customer_id\nWHERE  p.exposure &gt; 250000\nORDER BY p.exposure DESC;\n</pre></div>\n<p>Three layers, each with a stated grain: all active loans, one row per customer, then the customer detail attached. Any layer can be run on its own by selecting from it, which is what makes a wrong answer findable.</p>\n<div class=\"sheet g\"><div class=\"h\">What a CTE buys</div>\n<div class=\"r\"><b>Readable order</b><span>Top to bottom, the way the work actually proceeds</span></div>\n<div class=\"r\"><b>Named grain</b><span>The name states what one row of that layer is. <code>per_customer</code> says it outright</span></div>\n<div class=\"r\"><b>Debuggable</b><span>Replace the final <code>SELECT</code> with <code>SELECT * FROM per_customer</code> and inspect that layer alone</span></div>\n<div class=\"r\"><b>Reusable within the query</b><span>One CTE can be referenced by several later layers, and by itself only once in text</span></div>\n</div>\n<div class=\"note\">A CTE is not a stored object. It exists only for the duration of the statement, it holds no data afterwards, and it costs nothing to define. A <code>VIEW</code> is the saved equivalent &mdash; the same idea, given a permanent name in the database.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Subquery positions",
     "h": "Four places a query can sit <em>inside</em> another",
     "b": "<div class=\"dt\"><table>\n<tr><th>Position</th><th>Must return</th><th>Typical use</th></tr>\n<tr><td>In <code>FROM</code> &mdash; a derived table</td><td>Any rows</td><td class=\"g\">An intermediate result. A CTE is almost always clearer</td></tr>\n<tr><td>In <code>WHERE</code> with <code>IN</code> or <code>EXISTS</code></td><td>One column, or any rows</td><td class=\"g\">Restricting to keys found elsewhere</td></tr>\n<tr class=\"hi\"><td>In <code>SELECT</code> &mdash; a scalar subquery</td><td>Exactly one row, one column</td><td class=\"g\">A single figure attached to every row. Often a window function is better</td></tr>\n<tr><td>In <code>WHERE</code> against an operator</td><td>Exactly one value</td><td class=\"g\">Comparing to a computed threshold such as the book average</td></tr>\n</table></div>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Scalar subquery: loans above the book average\nSELECT loan_id, principal\nFROM   loan\nWHERE  principal &gt; (SELECT AVG(principal) FROM loan);\n\n-- Correlated subquery: references the outer row, so it runs per row\nSELECT l.loan_id, l.principal,\n       (SELECT COUNT(*) FROM repayment r\n        WHERE  r.loan_id = l.loan_id) AS instalments\nFROM   loan AS l;\n</pre></div>\n<p>A <span class=\"k\">correlated subquery</span> refers to a column from the outer query, so it must be evaluated once per outer row rather than once in total. It is expressive and it can be slow &mdash; a correlated count over a million-row outer query runs a million times unless the planner rewrites it into a join, which modern planners often but not always do.</p>\n<div class=\"note\">The correlated count above is better written as a left join to a pre-aggregated CTE. Same answer, one pass, and the grain is visible in the text rather than hidden inside a bracket.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "EXISTS",
     "h": "Asking whether <em>any</em> row matches",
     "b": "<p><code>EXISTS</code> tests whether a subquery returns at least one row. It stops at the first match, and it returns only true or false &mdash; never unknown.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Customers who hold at least one active loan\nSELECT c.customer_id, c.name\nFROM   customer AS c\nWHERE  EXISTS (SELECT 1 FROM loan l\n               WHERE l.customer_id = c.customer_id\n                 AND l.status = 'ACTIVE');\n\n-- Customers holding none\nSELECT c.customer_id, c.name\nFROM   customer AS c\nWHERE  NOT EXISTS (SELECT 1 FROM loan l\n                   WHERE l.customer_id = c.customer_id);\n</pre></div>\n<p><code>SELECT 1</code> is conventional: nothing about the subquery's columns is used, only whether rows came back. <code>SELECT *</code> would be identical in effect.</p>\n<p><strong><code>NOT EXISTS</code> is the safe form of \"not in this list\", and <code>NOT IN</code> is the unsafe one.</strong> From Mission 03: if the list contains a single absent value, <code>x NOT IN (list)</code> is never true for any x, because \"is x different from unknown?\" is unanswerable. The whole query returns nothing, with no error.</p>\n<div class=\"sheet q\"><div class=\"h\">Three ways to express the same anti-join</div>\n<div class=\"r\"><b>NOT EXISTS</b><span class=\"g\">Safe with absent values. Usually fastest. The default choice</span></div>\n<div class=\"r\"><b>LEFT JOIN ... WHERE right.key IS NULL</b><span class=\"g\">Safe. Mission 04's pattern. Equally good, and clearer to some readers</span></div>\n<div class=\"r\"><b>NOT IN (SELECT ...)</b><span class=\"g\">Silently returns nothing if the subquery yields even one NULL. Avoid</span></div>\n</div>\n<div class=\"note\">If <code>NOT IN</code> must be used against a column that permits absence, add <code>WHERE col IS NOT NULL</code> inside the subquery. That is a patch on a pattern that has a better alternative; the better alternative is above.</div>"
    },
    {
     "l": "WORKED",
     "t": "Solving fan-out",
     "h": "Aggregate first, <em>then</em> join",
     "b": "<p>Mission 04 showed two one-to-many joins from one parent multiplying the row count and inflating every sum. The fix is structural: collapse each child table to one row per loan <em>before</em> the join, so both sides are one row per loan and nothing can multiply.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nWITH repay AS (              -- one row per loan\n    SELECT loan_id,\n           COUNT(*)          AS instalments_due,\n           SUM(due_amount)   AS total_due,\n           SUM(paid_amount)  AS total_paid\n    FROM   repayment\n    GROUP BY loan_id\n),\nlatest AS (                  -- one row per loan: the most recent month\n    SELECT loan_id, dpd, bucket\n    FROM  (SELECT loan_id, dpd, bucket,\n                  ROW_NUMBER() OVER (PARTITION BY loan_id\n                                     ORDER BY as_of DESC) AS rn\n           FROM loan_month) AS ranked\n    WHERE rn = 1\n)\nSELECT l.loan_id, l.principal,\n       r.instalments_due, r.total_due, r.total_paid,\n       r.total_due - r.total_paid AS shortfall,\n       m.dpd, m.bucket\nFROM   loan  AS l\nLEFT JOIN repay  AS r ON l.loan_id = r.loan_id\nLEFT JOIN latest AS m ON l.loan_id = m.loan_id;\n</pre></div>\n<div class=\"wk\"><div class=\"h\">Row counts at each layer</div>\n<div class=\"r\"><b><code>loan</code></b><span>8</span></div>\n<div class=\"r\"><b><code>repayment</code> raw</b><span>34</span></div>\n<div class=\"r\"><b><code>repay</code> after grouping</b><span>8</span></div>\n<div class=\"r\"><b><code>loan_month</code> raw</b><span>41</span></div>\n<div class=\"r\"><b><code>latest</code> after ranking</b><span>8</span></div>\n<div class=\"r tot\"><b>Final result</b><span>8</span></div>\n<div class=\"r tot\"><b><code>SUM(l.principal)</code></b><span>8,615,000 &mdash; matches the book</span></div>\n</div>\n<p><strong>Every layer's row count is stated and checked.</strong> That is the discipline the structure exists to support: the naive single-query version returned 15 rows for one loan and ₹3,000,000 for a ₹200,000 exposure, and nothing in it made that visible.</p>\n<p><code>LEFT JOIN</code> on both, not <code>JOIN</code> &mdash; a loan disbursed this month has no repayment history yet, and an inner join would delete it from the book.</p>\n<div class=\"note\">Loans with no repayment rows come back with absent <code>total_due</code>, so <code>shortfall</code> is absent too rather than zero. Wrap in <code>COALESCE(..., 0)</code> only if absence genuinely means nothing is due &mdash; Mission 03's decision, taken per column.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Generating rows",
     "h": "A calendar, and the <em>zeros that were missing</em>",
     "b": "<p>Mission 05 left a problem: a group with no rows produces no row, so a month with no disbursements is absent from the report rather than showing zero. A chart built on it draws a line straight across the gap.</p>\n<p>The fix is to generate the complete set of periods and left join the data onto it.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nWITH RECURSIVE months(month_start) AS (\n    SELECT DATE '2024-01-01'\n    UNION ALL\n    SELECT month_start + INTERVAL '1 month'\n    FROM   months\n    WHERE  month_start &lt; DATE '2025-12-01'\n),\ndisbursed AS (\n    SELECT DATE_TRUNC('month', disbursed_on) AS month_start,\n           COUNT(*)       AS loans,\n           SUM(principal) AS amount\n    FROM   loan\n    GROUP BY DATE_TRUNC('month', disbursed_on)\n)\nSELECT m.month_start,\n       COALESCE(d.loans, 0)  AS loans,\n       COALESCE(d.amount, 0) AS amount\nFROM   months AS m\nLEFT JOIN disbursed AS d ON m.month_start = d.month_start\nORDER BY m.month_start;\n</pre></div>\n<p>A <span class=\"k\">recursive CTE</span> has two parts joined by <code>UNION ALL</code>: a starting row, and a rule that produces the next row from the previous one. It stops when the rule returns nothing &mdash; here when the date passes December 2025.</p>\n<p><strong>The termination condition is not optional.</strong> A recursive CTE whose rule never returns an empty result runs until the database stops it. Write the stopping condition first, before the rule that advances.</p>\n<div class=\"sheet\"><div class=\"h\">Dialect notes on this pattern</div>\n<div class=\"r\"><b>PostgreSQL</b><span><code>generate_series</code> does it in one line and is preferable where available</span></div>\n<div class=\"r\"><b>Oracle, SQL Server</b><span>Recursive CTE as above. SQL Server omits the <code>RECURSIVE</code> keyword</span></div>\n<div class=\"r\"><b>Any product</b><span>A permanent calendar table is the most robust answer, and most warehouses already have one</span></div>\n</div>\n<div class=\"note\">Recursive CTEs also walk hierarchies &mdash; organisational trees, group structures, chains of related exposures. Same two-part shape: a starting row, and a rule for finding the children of what has been found so far.</div>"
    },
    {
     "l": "TRAP",
     "t": "CTE performance",
     "h": "A named layer is not a <em>free</em> layer",
     "b": "<p>The wrong belief: CTEs are just formatting, so any number of them costs nothing.</p>\n<p>Two real effects sit behind that. First, in PostgreSQL before version 12, a CTE was always <span class=\"k\">materialised</span> &mdash; computed in full and held, which blocked the planner from pushing a filter down into it. A CTE selecting a whole million-row table, filtered to ten rows in the outer query, read the whole million. Version 12 changed the default to inlining a CTE used once, and added <code>MATERIALIZED</code> and <code>NOT MATERIALIZED</code> to force either behaviour.</p>\n<p>Second, <strong>a CTE referenced three times may be computed three times</strong> in products that inline. If the layer is expensive, that is three times the work. Where it matters, materialise it explicitly or write to a temporary table.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nWITH heavy AS MATERIALIZED (          -- compute once, reuse\n    SELECT customer_id, SUM(principal) AS exposure\n    FROM   loan GROUP BY customer_id\n)\nSELECT * FROM heavy WHERE exposure &gt; 1000000;\n</pre></div>\n<p><strong>Why it is a believable mistake.</strong> On small data every version is instant, so the habit forms where it is free and only fails at scale &mdash; usually in production, on a table that grew.</p>\n<div class=\"note\">Optimising a CTE is not the first move. Filter as early as possible in the earliest layer, so every later layer works on fewer rows &mdash; that alone resolves most of it, and it is Mission 09's principle arriving early.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Composition reference",
     "h": "The layered <em>skeleton</em>",
     "b": "<div class=\"code\" data-cap=\"sql\"><pre>\nWITH\n-- Layer 1: restrict the population. Filter as early as possible.\npopulation AS (\n    SELECT * FROM loan\n    WHERE  status = 'ACTIVE'\n      AND  disbursed_on &gt;= DATE '2024-01-01'\n),\n-- Layer 2: collapse each child table to the parent grain. Prevents fan-out.\nchild_a AS (\n    SELECT loan_id, SUM(amount) AS total_a FROM repayment GROUP BY loan_id\n),\n-- Layer 3: pick one row per key by an explicit rule.\nchild_b AS (\n    SELECT loan_id, dpd FROM (\n        SELECT loan_id, dpd,\n               ROW_NUMBER() OVER (PARTITION BY loan_id\n                                  ORDER BY as_of DESC) AS rn\n        FROM   loan_month) AS r\n    WHERE rn = 1\n)\n-- Layer 4: assemble. Left join outward from the population.\nSELECT p.loan_id, p.principal, a.total_a, b.dpd\nFROM   population AS p\nLEFT JOIN child_a AS a ON p.loan_id = a.loan_id\nLEFT JOIN child_b AS b ON p.loan_id = b.loan_id;\n</pre></div>\n<div class=\"sheet g\"><div class=\"h\">Four rules that make a layered query reviewable</div>\n<div class=\"r\"><b>Name each layer for its grain</b><span><code>per_customer</code>, <code>latest_month</code> &mdash; not <code>tmp1</code>, <code>x</code>, <code>cte2</code></span></div>\n<div class=\"r\"><b>One job per layer</b><span>Filter, or aggregate, or rank. Not all three</span></div>\n<div class=\"r\"><b>Comment the grain</b><span>One line above each CTE saying what one row is</span></div>\n<div class=\"r\"><b>Check the row count at each layer</b><span>Before assembling. This is where a wrong number is cheap to find</span></div>\n</div>\n<div class=\"note\">The comment stating the grain of each layer is the highest-value line in a long query. It converts a review from reconstructing intent into checking a claim.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "WITH queries, <em>specified</em>",
     "b": "<p>The manual covers CTEs, the materialisation rules, recursive queries and the <code>SEARCH</code> and <code>CYCLE</code> clauses that keep a recursion from looping forever on a cyclic hierarchy.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/queries-with.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; WITH Queries (Common Table Expressions), including RECURSIVE and MATERIALIZED</a></div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 07",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong>A CTE names an intermediate result and puts it first</strong>, so the query reads in execution order and each layer can be inspected alone.</li>\n<li><strong>Name every layer for its grain</strong> and comment what one row is. This is the line that makes review possible.</li>\n<li><strong>Subqueries sit in four places</strong>; a correlated one runs per outer row and is often better rewritten as a join to a pre-aggregated layer.</li>\n<li><strong><code>NOT EXISTS</code> is the safe anti-join; <code>NOT IN</code> returns nothing if the list holds a single absent value.</strong></li>\n<li><strong>Fan-out is solved by aggregating each child to the parent grain before joining</strong>, and by checking the row count at every layer.</li>\n<li><strong>Left join outward from the population</strong>, so no lookup can delete a member of it.</li>\n<li><strong>A recursive CTE generates a calendar</strong>, and left joining data onto it restores the periods that had no rows.</li>\n<li><strong>A CTE is not free.</strong> It may be materialised once or inlined and recomputed. Filter early, in the earliest layer.</li>\n</ul>"
    }
   ],
   "n": "07"
  },
  {
   "title": "Proving the number",
   "stage": "Proof",
   "line": "A query that runs is not a query that is right. Reconciliation is the discipline of proving two datasets agree, finding every row where they do not, and classifying the differences into causes.",
   "bullets": [
    "UNION, INTERSECT and EXCEPT, and the ALL variants",
    "The full outer join reconciliation, with a break-type CASE",
    "Row-level and value-level differences, separated",
    "Duplicates, orphans, and the standard data quality checks",
    "What a reconciliation output has to contain to be usable"
   ],
   "cards": [
    {
     "l": "MECHANISM",
     "t": "Set operations",
     "h": "Stacking results, and <em>subtracting</em> them",
     "b": "<p>Set operations combine the results of two queries vertically &mdash; rows on top of rows &mdash; rather than horizontally as a join does. Both sides must have the same number of columns, of compatible types, in the same order. Column names come from the first query.</p>\n<div class=\"dt\"><table>\n<tr><th>Operator</th><th>Returns</th><th>Duplicates</th></tr>\n<tr><td><code>UNION</code></td><td>Rows in either result</td><td class=\"g\">Removed &mdash; requires a sort or hash, so it costs</td></tr>\n<tr class=\"hi\"><td><code>UNION ALL</code></td><td>Rows in either result</td><td class=\"g\">Kept. Faster, and the right default when duplicates are impossible</td></tr>\n<tr><td><code>INTERSECT</code></td><td>Rows in both</td><td class=\"g\">Removed</td></tr>\n<tr><td><code>EXCEPT</code></td><td>Rows in the first and not the second</td><td class=\"g\">Removed. Called <code>MINUS</code> in Oracle</td></tr>\n</table></div>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Which loan ids are in the source system but not in the warehouse?\nSELECT loan_id FROM source_loan\nEXCEPT\nSELECT loan_id FROM warehouse_loan;\n\n-- And the other direction. Neither alone is a reconciliation.\nSELECT loan_id FROM warehouse_loan\nEXCEPT\nSELECT loan_id FROM source_loan;\n</pre></div>\n<p><strong><code>EXCEPT</code> is directional.</strong> Running it one way answers \"what did we lose\", and the other way answers \"what did we invent\". A reconciliation that runs only one direction has checked half the problem.</p>\n<p>Set operations compare <strong>whole rows</strong>, and they treat absent values as equal for this purpose &mdash; consistent with <code>DISTINCT</code> and <code>GROUP BY</code>, inconsistent with the comparison operators. That is Mission 03's inconsistency, and here it works in your favour.</p>\n<div class=\"note\"><code>UNION ALL</code> should be the default and <code>UNION</code> the deliberate choice. Deduplication is expensive on large results, and silently removing genuine duplicate rows can itself be a defect &mdash; two identical repayments of ₹5,000 are two payments, not one.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "The reconciliation join",
     "h": "Full outer, and a <em>break-type</em> CASE",
     "b": "<p><code>EXCEPT</code> finds missing keys but not differing values. The complete reconciliation is a <code>FULL OUTER JOIN</code> on the key, with a <code>CASE</code> that names the type of each break.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT COALESCE(s.loan_id, w.loan_id) AS loan_id,\n       s.exposure AS source_exposure,\n       w.exposure AS warehouse_exposure,\n       COALESCE(s.exposure, 0) - COALESCE(w.exposure, 0) AS difference,\n       CASE\n         WHEN w.loan_id IS NULL                   THEN 'Missing in warehouse'\n         WHEN s.loan_id IS NULL                   THEN 'Extra in warehouse'\n         WHEN s.exposure IS DISTINCT FROM w.exposure\n                                                  THEN 'Value mismatch'\n         ELSE 'Match'\n       END AS break_type\nFROM      source_loan    AS s\nFULL OUTER JOIN warehouse_loan AS w ON s.loan_id = w.loan_id\nWHERE     w.loan_id IS NULL\n   OR     s.loan_id IS NULL\n   OR     s.exposure IS DISTINCT FROM w.exposure\nORDER BY  ABS(COALESCE(s.exposure,0) - COALESCE(w.exposure,0)) DESC;\n</pre></div>\n<p>Four things make this the pattern rather than one option among several:</p>\n<ul>\n<li><strong><code>FULL OUTER JOIN</code> keeps unmatched rows from both sides.</strong> An inner join would show only the records that exist in both, which are exactly the ones least likely to be the problem.</li>\n<li><strong><code>COALESCE(s.loan_id, w.loan_id)</code> gives a key on every row.</strong> Without it, half the output rows have a blank identifier.</li>\n<li><strong><code>IS DISTINCT FROM</code> rather than <code>&lt;&gt;</code>.</strong> Where one side is absent, <code>&lt;&gt;</code> returns unknown and the break is silently dropped &mdash; the exact failure the reconciliation exists to catch.</li>\n<li><strong>Sorted by absolute difference.</strong> Two hundred breaks are unusable in key order and immediately actionable in value order, because the first ten usually account for most of the money.</li>\n</ul>\n<div class=\"note\">Run it without the <code>WHERE</code> clause first to see the full picture including matches, then add the filter to produce the working list. The count of <code>'Match'</code> rows is the reconciliation's own evidence that it ran against real data.</div>"
    },
    {
     "l": "WORKED",
     "t": "A break report",
     "h": "Eight rows, and what each <em>says</em>",
     "b": "<p>Source shows ₹8,615,000 across 8 loans. Warehouse shows ₹8,448,000 across 8 loans. The totals differ by ₹167,000 and the counts agree &mdash; which already rules out a simple missing-record problem.</p>\n<div class=\"dt\"><table>\n<tr><th>loan_id</th><th>source</th><th>warehouse</th><th>difference</th><th>break_type</th></tr>\n<tr class=\"hi\"><td>L1008</td><td class=\"n\">500,000</td><td class=\"n\"><em>NULL</em></td><td class=\"n\">500,000</td><td>Missing in warehouse</td></tr>\n<tr class=\"hi\"><td>L1009</td><td class=\"n\"><em>NULL</em></td><td class=\"n\">333,000</td><td class=\"n\">-333,000</td><td>Extra in warehouse</td></tr>\n<tr><td>L1005</td><td class=\"n\">200,000</td><td class=\"n\">200,000</td><td class=\"n\">0</td><td>Match</td></tr>\n</table></div>\n<div class=\"wk\"><div class=\"h\">Reconciling the difference</div>\n<div class=\"r\"><b>Source total</b><span>8,615,000</span></div>\n<div class=\"r\"><b>Less: missing in warehouse (L1008)</b><span>-500,000</span></div>\n<div class=\"r\"><b>Plus: extra in warehouse (L1009)</b><span>+333,000</span></div>\n<div class=\"r tot\"><b>Explained warehouse total</b><span>8,448,000</span></div>\n<div class=\"r tot\"><b>Actual warehouse total</b><span>8,448,000 &mdash; fully explained</span></div>\n</div>\n<p><strong>Two breaks, and each has a different cause and a different owner.</strong> L1008 is the digitally sourced loan with no branch; a load process filtering on branch would drop exactly this row &mdash; the inner-join failure of Mission 04, occurring in a pipeline rather than in a query. L1009 exists only downstream, which points at a load that ran twice, a record never deleted, or a key generated in the warehouse.</p>\n<p><strong>The net difference of ₹167,000 is the least informative number in the whole exercise</strong>, because it is two unrelated failures of ₹500,000 and ₹333,000 partly cancelling. A control that only checks the net would report a modest variance and conceal both.</p>\n<div class=\"note\">Report gross breaks, split by direction, never the net. Two errors that offset are two errors, and the day one of them is fixed alone the net gets worse.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Quality checks",
     "h": "Six queries run on any table before <em>trusting</em> it",
     "b": "<div class=\"code\" data-cap=\"sql\"><pre>\n-- 1. Duplicate keys. Empty result means the grain holds.\nSELECT loan_id, COUNT(*) AS n FROM loan\nGROUP BY loan_id HAVING COUNT(*) &gt; 1 ORDER BY n DESC;\n\n-- 2. Orphans: child rows whose parent does not exist.\nSELECT r.loan_id, COUNT(*) AS orphan_rows\nFROM   repayment AS r\nLEFT JOIN loan   AS l ON r.loan_id = l.loan_id\nWHERE  l.loan_id IS NULL\nGROUP BY r.loan_id;\n\n-- 3. Completeness, per column, in one pass.\nSELECT COUNT(*) AS rows,\n       COUNT(*) - COUNT(branch_id)   AS branch_missing,\n       COUNT(*) - COUNT(principal)   AS principal_missing,\n       COUNT(*) - COUNT(disbursed_on) AS date_missing\nFROM   loan;\n\n-- 4. Values outside a sane range.\nSELECT loan_id, principal, rate FROM loan\nWHERE  principal &lt;= 0 OR rate &lt; 0 OR rate &gt; 60;\n\n-- 5. Categories outside the permitted set.\nSELECT status, COUNT(*) FROM loan\nWHERE  status NOT IN ('ACTIVE','CLOSED','WRITTEN_OFF')\nGROUP BY status;\n\n-- 6. Impossible date ordering.\nSELECT loan_id, disbursed_on, closed_on FROM loan\nWHERE  closed_on &lt; disbursed_on;\n</pre></div>\n<div class=\"sheet q\"><div class=\"h\">Two of those need care</div>\n<div class=\"r\"><b>Check 5 uses NOT IN</b><span>Safe here only because the list is literal and holds no NULL. Against a subquery, use <code>NOT EXISTS</code></span></div>\n<div class=\"r\"><b>Check 6 drops absent dates</b><span>An open loan has no <code>closed_on</code>, so the comparison is unknown and the row is skipped &mdash; correctly, but knowingly</span></div>\n</div>\n<div class=\"note\">These six map onto the standard data quality dimensions &mdash; uniqueness, referential integrity, completeness, validity, consistency and accuracy. The dimensions are a vocabulary for reporting; these queries are the test.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Comparing at scale",
     "h": "Two tables, <em>every</em> column",
