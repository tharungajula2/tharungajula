<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}

/* ================= v02 ADDITIONS ================= */

/* links — official source blocks */
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim);transition:color .15s,border-color .15s}
a:hover{color:var(--ink);border-color:var(--ink)}
.docs{margin:20px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--live);border-radius:7px;font-size:12.6px;line-height:1.9}
.docs b{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:6px;font-weight:500}
.docs a{display:block;border-bottom:none;color:var(--body)}
.docs a:hover{color:var(--accent)}
.docs a:before{content:'\2192\00a0';color:var(--live)}

/* formulae */
.fx{margin:20px 0;padding:16px 15px;background:#0E0E12;border:1px solid var(--line);border-radius:9px;text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fx .cap{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.fx .eq{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);line-height:2.1;white-space:normal}
.fx .eq em{font-style:italic;color:var(--accent);font-family:'Instrument Serif',serif;font-size:17px}
.fx .eq .nw{white-space:nowrap}
.fx .wh{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:left;line-height:1.8;font-family:'JetBrains Mono',monospace}

/* stacked fractions — never sup/frasl/sub */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px}
.fr>i{font-style:normal;display:block;padding:0 7px;line-height:1.4;white-space:nowrap}
.fr>i:first-child{border-bottom:1px solid var(--muted);padding-bottom:3px}
.fr>i:last-child{padding-top:3px}

/* worked examples */
.wk{margin:20px 0;border:1px solid var(--accent-dim);border-radius:9px;overflow:hidden}
.wk .h{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.wk .r{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;background:var(--surface)}
.wk .r:last-child{border-bottom:none}
.wk .r b{flex:1;color:var(--body);font-weight:400}
.wk .r span{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.wk .r.tot{background:var(--raise)}
.wk .r.tot b{color:var(--ink);font-weight:600}
.wk .r.tot span{color:var(--ink)}

@media(max-width:560px){
 .fx{text-align:left;padding:14px 12px}
 .fx .eq{font-size:12.5px;line-height:2}
 .fx .eq em{font-size:15px}
 .fx .cap{text-align:left}
 .fx .wh{font-size:10.5px;line-height:1.75}
 .fr>i{padding:0 5px}
 .wk .r{flex-wrap:wrap;gap:4px}
 .wk .r b{flex:1 1 100%}
 .wk .r span{flex:0 0 auto}
 .sheet .r{flex-direction:column;gap:3px}
 .sheet .r b{flex:none}
}
@media(max-width:430px){
 .fx{padding:12px 10px}
 .fx .eq{font-size:11.5px}
 .fx .eq em{font-size:14px}
}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "19 August 2026";
/* ============================================================
   FIELD CARDS — PACK TEMPLATE
   Extracted from investing_FINAL_v02.html. Design is locked:
   do not change tokens, CSS, or the renderer. Fill the data only.

   PACK FIELDS
     title     headline on the cover, one <em> allowed
     sub       one or two sentences under it
     floor     what the pack assumes, e.g. "No prior knowledge assumed"
     dateline  e.g. "Figures verified" — sits before DATE
     intro     optional note on the cover; delete for a pack with no LIVE cards

   MISSION FIELDS
     title     the mission name
     stage     short spine word, shown on every card in the mission
     line      one sentence under the mission title
     bullets   optional array — renders as "In this mission"
     cards     array, 7-18 cards, last one is always RECALL
     n         auto-generated, leave as is

   CARD FIELDS
     l  label   ORIENT DEFINE WHY MECHANISM PICTURE TRAP LIVE CHEAT
                NUMBERS RECALL CLOSE   (colour is automatic)
     t  tag     two or three words, shown next to the stage
     h  headline  one <em> for emphasis
     b  body     raw HTML — see the components below

   BODY COMPONENTS  (all styled already, no new CSS)
     <p> <ul><li> <strong> <em> <code>
     <span class="k">        accent for a key term
     <div class="note">      the aside
     <div class="stamp">     collection date — LIVE cards only
     <div class="src">       source line
     <div class="dt"><table> data table, cells .n for figures .g for context
                             <tr class="hi"> highlights a row
     <div class="flow">      ordered steps, .n boxes with .a arrows between
     <div class="two"> .three  side-by-side blocks
     <div class="bars">      horizontal bar chart, bars .b .c .d recolour
     <div class="stat">      three big numbers
     <div class="dg">        diagram frame, .dg-t title, .lay layers, .cross band
     <div class="code" data-cap="python"><pre>  highlighted, copy button auto
     <div class="sheet">     lookup table, .q warning .g good .b live
   ============================================================ */

const P = {
 "title": "Reading Data with <em>SQL</em>",
 "sub": "From an unfamiliar table to a number worth signing. Grain, retrieval, absence, joins, aggregation, windows, composition, reconciliation and query plans &mdash; every query shown with the rows going in and the rows coming out.",
 "edition": "Edition 01",
 "floor": "No prior SQL assumed &mdash; nothing needs to be run to follow it",
 "dateline": "Behaviour checked",
 "intro": "Every query in this pack runs against the same five-table lending dataset, printed in full in Mission 01, and every result is shown as rows rather than described. <strong>Nothing here needs a database to follow.</strong> PostgreSQL is the reference; where a product differs, the difference is stated on the card rather than left to be discovered.",
 "missions": [
  {
   "title": "What one row means",
   "stage": "Ground",
   "line": "Before any query is written, one question decides whether the answer will be right: what does a single row of this table represent? Everything else in this pack rests on it.",
   "bullets": [
    "What a relational table is, and what makes SQL a declarative language",
    "Grain &mdash; the one question to ask of any table you have not seen before",
    "The five tables used throughout this pack, printed in full",
    "Profiling an unfamiliar table in six queries",
    "Which parts of SQL are portable and which belong to one product"
   ],
   "cards": [
    {
     "l": "ORIENT",
     "t": "What it is",
     "h": "You describe the <em>result</em>, not the route",
     "b": "<p><span class=\"k\">SQL</span> &mdash; Structured Query Language &mdash; is the language for asking questions of data held in a <span class=\"k\">relational database</span>: data stored as tables, where a table is a grid of rows and columns and each column holds one kind of value.</p>\n<p>SQL is <strong>declarative</strong>. You state what the answer should look like. You do not state how to get it. There is no loop, no \"open the file, read line one, read line two\". You write <em>the branches in Bengaluru with more than five active loans</em>, and a component called the <span class=\"k\">query planner</span> decides whether to scan the whole table, use an index, sort first or join first.</p>\n<p>Two consequences follow, and both matter more than any syntax:</p>\n<ul>\n<li><strong>The same question can be written many ways and produce identical results</strong> at wildly different speeds. Correctness and performance are separate problems, dealt with separately &mdash; correctness through Mission 08, performance through Mission 09.</li>\n<li><strong>SQL operates on sets, not on rows one at a time.</strong> A condition is applied to every row at once. Thinking in loops is the single most common source of confusion for someone arriving from a procedural language.</li>\n</ul>\n<div class=\"note\">A relational database also enforces structure: every row of a table has the same columns, and a column declared as a date cannot hold the word \"pending\". That constraint is the reason SQL can be terse. The shape is guaranteed before the question is asked.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Grain",
     "h": "The one question worth asking <em>first</em>",
     "b": "<p>The <span class=\"k\">grain</span> of a table is what exactly one row represents, stated as a sentence. Not what the table is called. Not what columns it has. What one row <em>is</em>.</p>\n<div class=\"sheet g\"><div class=\"h\">Grain, stated properly</div>\n<div class=\"r\"><b>One row per loan account</b><span>The table holds each loan once, ever</span></div>\n<div class=\"r\"><b>One row per loan per calendar month-end</b><span>A five-year loan contributes sixty rows</span></div>\n<div class=\"r\"><b>One row per scheduled instalment</b><span>A 36-month loan contributes thirty-six rows</span></div>\n<div class=\"r\"><b>One row per repayment transaction received</b><span>A part-paid instalment contributes several</span></div>\n</div>\n<p>Those four tables could all be called \"the loan data\". Summing an amount column across them gives four different numbers, three of which are wrong for any given question. <strong>Grain decides what a sum means.</strong></p>\n<p>Grain also names the table's <span class=\"k\">key</span> &mdash; the column or set of columns that uniquely identifies a row. One row per loan per month-end means the key is the pair <code>(loan_id, as_of)</code>, not <code>loan_id</code> alone.</p>\n<div class=\"note\">Almost every wrong number in analytical work traces to a grain misunderstanding rather than to a syntax error. Syntax errors announce themselves. A grain error returns a clean, plausible, wrong figure.</div>"
    },
    {
     "l": "PICTURE",
     "t": "The book",
     "h": "Five tables, and the grain of <em>each</em>",
     "b": "<p>Every query in this pack runs against the same small retail lending dataset. It is deliberately tiny so that every result can be printed in full and checked by eye.</p>\n<div class=\"dt\"><table>\n<tr><th>Table</th><th>One row is</th><th>Key</th></tr>\n<tr class=\"hi\"><td><code>loan</code></td><td>One loan account</td><td><code>loan_id</code></td></tr>\n<tr><td><code>customer</code></td><td>One borrower</td><td><code>customer_id</code></td></tr>\n<tr><td><code>branch</code></td><td>One branch</td><td><code>branch_id</code></td></tr>\n<tr><td><code>repayment</code></td><td>One scheduled instalment on one loan</td><td><code>loan_id, due_on</code></td></tr>\n<tr><td><code>loan_month</code></td><td>One loan at one month-end</td><td><code>loan_id, as_of</code></td></tr>\n</table></div>\n<p>The links between them, in the direction the joins will run:</p>\n<div class=\"flow\">\n<div class=\"n\"><b>customer</b>One borrower may hold several loans, so <code>customer_id</code> appears once here and many times in <code>loan</code>. This is a <span class=\"k\">one-to-many</span> relationship.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>loan</b>Carries <code>customer_id</code> and <code>branch_id</code>. A column that points at another table's key is a <span class=\"k\">foreign key</span>.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>repayment and loan_month</b>Both carry <code>loan_id</code> and both are many rows per loan. Joining them to each other without care is where the arithmetic breaks &mdash; Mission 04.</div>\n</div>\n<div class=\"note\">Two deliberate imperfections are built into this data: one loan has no branch, and one customer has no loans. Both are there because real tables have them, and because they are what make the difference between join types visible.</div>"
    },
    {
     "l": "CHEAT",
     "t": "The loan table",
     "h": "Eight rows, carried through the whole <em>pack</em>",
     "b": "<p>Amounts are Indian rupees. <code>disbursed_on</code> is the date the money left the bank.</p>\n<div class=\"dt\"><table>\n<tr><th>loan_id</th><th>cust</th><th>branch</th><th>product</th><th>disbursed_on</th><th>principal</th><th>rate</th><th>status</th></tr>\n<tr><td>L1001</td><td>C001</td><td>B01</td><td>PERSONAL</td><td>2024-04-10</td><td class=\"n\">300,000</td><td class=\"n\">14.5</td><td>ACTIVE</td></tr>\n<tr><td>L1002</td><td>C001</td><td>B01</td><td>TWO_WHEELER</td><td>2024-09-01</td><td class=\"n\">90,000</td><td class=\"n\">18.0</td><td>ACTIVE</td></tr>\n<tr><td>L1003</td><td>C002</td><td>B02</td><td>HOME</td><td>2023-11-15</td><td class=\"n\">4,500,000</td><td class=\"n\">8.9</td><td>ACTIVE</td></tr>\n<tr><td>L1004</td><td>C003</td><td>B03</td><td>PERSONAL</td><td>2024-06-20</td><td class=\"n\">150,000</td><td class=\"n\">16.0</td><td>CLOSED</td></tr>\n<tr><td>L1005</td><td>C004</td><td>B03</td><td>PERSONAL</td><td>2024-08-05</td><td class=\"n\">200,000</td><td class=\"n\">15.2</td><td>ACTIVE</td></tr>\n<tr><td>L1006</td><td>C004</td><td>B02</td><td>TWO_WHEELER</td><td>2025-01-12</td><td class=\"n\">75,000</td><td class=\"n\">17.5</td><td>ACTIVE</td></tr>\n<tr><td>L1007</td><td>C005</td><td>B01</td><td>HOME</td><td>2025-02-28</td><td class=\"n\">2,800,000</td><td class=\"n\">9.4</td><td>ACTIVE</td></tr>\n<tr class=\"hi\"><td>L1008</td><td>C002</td><td><em>NULL</em></td><td>PERSONAL</td><td>2025-03-30</td><td class=\"n\">500,000</td><td class=\"n\">13.0</td><td>ACTIVE</td></tr>\n</table></div>\n<p>And the two small reference tables:</p>\n<div class=\"two\">\n<div><b>customer</b>C001 Anita Rao, Bengaluru, MID &middot; C002 Vikram Shah, Mumbai, HIGH &middot; C003 Meera Nair, Kochi, LOW &middot; C004 Rohit Sen, Kolkata, MID &middot; C005 Priya Das, Bengaluru, <em>income_band NULL</em> &middot; C006 Arjun Menon, Chennai, MID &mdash; <strong>no loans</strong></div>\n<div><b>branch</b>B01 Koramangala, Bengaluru, South &middot; B02 Andheri, Mumbai, West &middot; B03 Salt Lake, Kolkata, East</div>\n</div>\n<div class=\"note\">L1008 was sold through a digital channel and has no branch. C006 has been onboarded but has not borrowed. Those two facts generate half the traps in this pack.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Profiling",
     "h": "Six queries before you trust <em>anything</em>",
     "b": "<p>Profiling means establishing what a table actually contains before writing the query that matters. Six questions, in this order.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- 1. How many rows are there at all?\nSELECT COUNT(*) FROM loan;\n\n-- 2. How many distinct values of the suspected key?\n--    If this differs from COUNT(*), the grain is not what you assumed.\nSELECT COUNT(*) AS rows, COUNT(DISTINCT loan_id) AS loans FROM loan;\n\n-- 3. What period does it cover?\nSELECT MIN(disbursed_on), MAX(disbursed_on) FROM loan;\n\n-- 4. Which columns are incomplete?\n--    COUNT(col) counts non-null values only. COUNT(*) counts rows.\nSELECT COUNT(*) AS rows,\n       COUNT(branch_id) AS branch_present,\n       COUNT(*) - COUNT(branch_id) AS branch_missing\nFROM loan;\n\n-- 5. What values does a categorical column actually take?\nSELECT product, COUNT(*) AS n\nFROM loan\nGROUP BY product\nORDER BY n DESC;\n\n-- 6. Is the amount column sane?\nSELECT MIN(principal), MAX(principal), AVG(principal) FROM loan;\n</pre></div>\n<p><code>COUNT(*)</code> counts rows. <code>COUNT(column)</code> counts rows where that column is not empty. The gap between the two is the missing-value count, and query 4 uses exactly that difference. This is the most useful two-word distinction in the language.</p>\n<div class=\"note\">Query 2 is the one that saves the day. Rows equal to distinct keys means one row per loan. Rows greater than distinct keys means the grain is finer than the name suggests, and every sum written so far is suspect.</div>"
    },
    {
     "l": "WORKED",
     "t": "Profile output",
     "h": "What those six queries <em>return</em> here",
     "b": "<p>Run against the eight-row <code>loan</code> table on the previous cards.</p>\n<div class=\"wk\"><div class=\"h\">Results, in order</div>\n<div class=\"r\"><b>1. COUNT(*)</b><span>8</span></div>\n<div class=\"r\"><b>2. rows / distinct loan_id</b><span>8 / 8</span></div>\n<div class=\"r tot\"><b>Grain confirmed: one row per loan</b><span>&#10003;</span></div>\n<div class=\"r\"><b>3. MIN / MAX disbursed_on</b><span>2023-11-15 / 2025-03-30</span></div>\n<div class=\"r\"><b>4. rows / branch present / branch missing</b><span>8 / 7 / 1</span></div>\n<div class=\"r\"><b>5. products</b><span>PERSONAL 4, TWO_WHEELER 2, HOME 2</span></div>\n<div class=\"r\"><b>6. MIN / MAX / AVG principal</b><span>75,000 / 4,500,000 / 1,076,875</span></div>\n</div>\n<p>Four things are now known that were not known a minute ago. The grain is one row per loan, so summing <code>principal</code> gives a real book size. The book spans seventeen months. <strong>One loan in eight has no branch</strong>, which means any report grouped by branch will silently omit ₹500,000 unless that row is handled. And the average of ₹1,076,875 sits above six of the eight loans, because two home loans dominate &mdash; a mean on a skewed book describes almost nobody.</p>\n<div class=\"note\">Change the profile and the query changes. If query 2 had returned 8 rows and 6 distinct loans, the correct next move is not to write the report &mdash; it is to find out why two loans appear twice.</div>"
    },
    {
     "l": "TRAP",
     "t": "Assumed grain",
     "h": "It has a loan id, so one row is one <em>loan</em>",
     "b": "<p>The wrong belief: the table is called <code>loan_data</code>, it has a <code>loan_id</code> column, therefore each loan appears once and <code>SUM(exposure)</code> is the book size.</p>\n<p>This is wrong often enough to be the default suspicion. The same table name is used for month-end snapshots, for instalment schedules, and for records that were versioned each time the loan was restructured. In every one of those, <code>loan_id</code> repeats, and <code>SUM(exposure)</code> returns a number several times larger than the bank's actual lending &mdash; with no error and no warning.</p>\n<p><strong>Why it is a believable mistake.</strong> A column named <code>loan_id</code> reads like an identifier, and in the table where the loan is created, it is one. The mistake is not ignorance of what a key is. It is assuming that a column which is a key <em>somewhere</em> is a key <em>here</em>.</p>\n<div class=\"sheet q\"><div class=\"h\">The two-second check</div>\n<div class=\"r\"><b>COUNT(*) vs COUNT(DISTINCT loan_id)</b><span>Equal means one row per loan. Anything else means it is not</span></div>\n<div class=\"r\"><b>If unequal, find the extra column</b><span>Some column distinguishes the duplicates &mdash; a date, a version, a status. That column is part of the key</span></div>\n</div>\n<div class=\"note\">Ask for a table's grain in writing before building anything on it. A one-line answer from whoever owns the data is cheaper than a reconciliation two weeks later.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Dialects",
     "h": "One language, several <em>products</em>",
     "b": "<p>SQL is standardised, but every database product extends it and a few disagree on basics. Roughly 80% of everyday analytical SQL is identical everywhere; the rest needs checking against the product in front of you.</p>\n<div class=\"dt\"><table>\n<tr><th>Product</th><th>Typical setting</th><th>Notable divergence</th></tr>\n<tr><td>PostgreSQL</td><td>Applications, analytics, open source</td><td class=\"g\">Closest to the standard. The reference used throughout this pack</td></tr>\n<tr><td>Oracle Database</td><td>Large enterprise and core banking systems</td><td class=\"g\">An empty string is stored as absent; <code>MINUS</code> in place of <code>EXCEPT</code></td></tr>\n<tr><td>Microsoft SQL Server</td><td>Enterprise applications, reporting</td><td class=\"g\"><code>TOP</code> in place of <code>LIMIT</code>; <code>ISNULL</code> in place of <code>COALESCE</code></td></tr>\n<tr><td>MySQL / MariaDB</td><td>Web applications</td><td class=\"g\">Historically permissive about <code>GROUP BY</code>; string comparison ignores case by default</td></tr>\n<tr><td>SQLite</td><td>Embedded, local files, testing</td><td class=\"g\">Column types are advisory rather than enforced</td></tr>\n<tr><td>BigQuery / Snowflake / Databricks</td><td>Warehouse-scale analytics</td><td class=\"g\">Standard core plus heavy extensions; billing by data scanned changes what \"good\" means</td></tr>\n</table></div>\n<p>Portable everywhere: <code>SELECT</code>, <code>WHERE</code>, <code>GROUP BY</code>, <code>HAVING</code>, <code>ORDER BY</code>, all four join types, <code>CASE</code>, <code>UNION</code>, subqueries, <span class=\"k\">common table expressions</span> &mdash; named intermediate results, Mission 07 &mdash; and <span class=\"k\">window functions</span>, which compute across neighbouring rows without collapsing them, Mission 06.</p>\n<p>Not portable, and worth checking every time: row limiting, string concatenation, date arithmetic, the null-replacement function, and how strings are compared for case.</p>\n<div class=\"note\">Write the portable form by default. The cost of <code>COALESCE</code> over <code>ISNULL</code> is nothing; the cost of a query that has to be rewritten when the data moves is a day.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "The reference this pack is <em>checked against</em>",
     "b": "<p>PostgreSQL's manual is the most precise freely available description of standard SQL behaviour, and it states explicitly where PostgreSQL departs from the standard. Where this pack says \"standard\", it has been checked here.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/sql-select.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; SELECT, the complete statement reference</a>\n<a href=\"https://www.postgresql.org/docs/current/bookindex.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; documentation index</a></div>\n<div class=\"note\">Every product ships its own manual and they are all better than any tutorial, because they are the specification the software was built from rather than a description of it. Find the one for the database actually in use and keep the <code>SELECT</code> page open.</div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 01",
     "h": "What is now owned",
     "b": "<ul>\n<li>SQL is <strong>declarative and set-based</strong>. You describe the result; the planner chooses the route. There are no loops.</li>\n<li><strong>Grain is what one row represents</strong>, stated as a sentence. It determines what every sum, count and average means.</li>\n<li><strong><code>COUNT(*)</code> against <code>COUNT(DISTINCT key)</code></strong> confirms or destroys an assumed grain in one query.</li>\n<li><strong><code>COUNT(*)</code> counts rows; <code>COUNT(column)</code> counts non-empty values.</strong> The difference is the missing-value count.</li>\n<li>Six profiling questions come before the real query: row count, key count, date range, completeness, category values, numeric range.</li>\n<li>A skewed average describes nobody. Two home loans pulled the mean above six of eight loans.</li>\n<li>The core of the language is portable. <strong>Row limiting, date arithmetic, string concatenation and null replacement are not.</strong></li>\n</ul>"
    }
   ],
   "n": "01"
  },
  {
   "title": "Getting rows out",
   "stage": "Retrieval",
   "line": "The six clauses of a query, the order the database runs them in &mdash; which is not the order they are written &mdash; and the filtering mistakes that return a clean wrong answer.",
   "bullets": [
    "The six clauses, and the logical order of execution",
    "Why a column alias cannot be used in WHERE",
    "Filtering: comparison, ranges, lists, patterns and dates",
    "The bracket that changes the answer",
    "Sorting, limiting, and why LIMIT without ORDER BY is unsafe"
   ],
   "cards": [
    {
     "l": "ORIENT",
     "t": "The six clauses",
     "h": "Every query is these, in this <em>written</em> order",
     "b": "<p>An analytical query has at most six clauses. They are always written in this sequence, and any of the last five may be omitted.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT   product, COUNT(*) AS loans        -- which columns come out\nFROM     loan                              -- which table they come from\nWHERE    status = 'ACTIVE'                 -- which rows qualify\nGROUP BY product                           -- how rows are collapsed\nHAVING   COUNT(*) &gt; 1                      -- which groups qualify\nORDER BY loans DESC                        -- how the output is sorted\n</pre></div>\n<div class=\"sheet\"><div class=\"h\">What each clause is for</div>\n<div class=\"r\"><b>SELECT</b><span>The columns and expressions in the result</span></div>\n<div class=\"r\"><b>FROM</b><span>The table or joined tables supplying rows</span></div>\n<div class=\"r\"><b>WHERE</b><span>A test applied to each individual row before grouping</span></div>\n<div class=\"r\"><b>GROUP BY</b><span>Collapses many rows into one per distinct value &mdash; Mission 05</span></div>\n<div class=\"r\"><b>HAVING</b><span>A test applied to each group after grouping &mdash; Mission 05</span></div>\n<div class=\"r\"><b>ORDER BY</b><span>Sorts the finished result. Without it, row order is not guaranteed</span></div>\n</div>\n<p>Two lines above are also comments. A double hyphen makes the rest of that line a comment, ignored by the database. <code>/* ... */</code> comments out a block across several lines. Both are standard everywhere.</p>\n<div class=\"note\">This mission covers <code>SELECT</code>, <code>FROM</code>, <code>WHERE</code> and <code>ORDER BY</code>. Grouping gets its own mission because it changes the grain of the result, which is a bigger idea than a clause.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Execution order",
     "h": "The database runs them in a <em>different</em> order",
     "b": "<p>The written order is not the order of evaluation. Logically, the database proceeds like this:</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. FROM</b>Assemble the source rows, including any joins.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>2. WHERE</b>Discard rows failing the test. Everything after this sees fewer rows.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>3. GROUP BY</b>Collapse the survivors into groups.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>4. HAVING</b>Discard whole groups failing the test.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>5. SELECT</b>Compute the output columns. <strong>Aliases are created here.</strong></div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>6. ORDER BY, then LIMIT</b>Sort, then cut.</div>\n</div>\n<p>This explains three things that otherwise look arbitrary:</p>\n<ul>\n<li><strong>An alias defined in <code>SELECT</code> cannot be used in <code>WHERE</code></strong>, because <code>WHERE</code> ran first and the alias did not exist yet. Repeat the expression, or wrap the query &mdash; Mission 07.</li>\n<li><strong>An alias <em>can</em> be used in <code>ORDER BY</code></strong>, because sorting happens after <code>SELECT</code>. Most products allow this.</li>\n<li><strong><code>WHERE</code> filters rows, <code>HAVING</code> filters groups.</strong> They are not interchangeable, and putting a row condition in <code>HAVING</code> is slower because more rows were grouped than needed to be.</li>\n</ul>\n<div class=\"note\">This is the <em>logical</em> order. The planner may physically do something else entirely, provided the answer is identical. The logical order is what governs meaning; the physical order is Mission 09.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "The select list",
     "h": "Columns, expressions and <em>aliases</em>",
     "b": "<p>The select list can hold plain columns, computed expressions, and literal values. <code>AS</code> gives the output column a name.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id,\n       principal,\n       rate,\n       principal * rate / 100          AS annual_interest,\n       ROUND(principal / 100000.0, 2)  AS principal_lakh,\n       'RETAIL'                        AS segment\nFROM   loan\nWHERE  product = 'PERSONAL';\n</pre></div>\n<p><code>SELECT *</code> returns every column. It is fine while exploring and a poor idea in anything saved: if a column is added upstream, the query silently returns something different, and if a column is renamed it may break. <strong>Name the columns in anything that will run more than once.</strong></p>\n<p><code>SELECT DISTINCT</code> removes duplicate rows from the result &mdash; duplicates across <em>all</em> selected columns, not just the first.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT DISTINCT product FROM loan;\n-- PERSONAL, TWO_WHEELER, HOME\n\nSELECT DISTINCT product, status FROM loan;\n-- PERSONAL/ACTIVE, PERSONAL/CLOSED, TWO_WHEELER/ACTIVE, HOME/ACTIVE\n</pre></div>\n<div class=\"note\">Integer division is a recurring quiet defect. In PostgreSQL and Oracle, <code>1/2</code> is <code>0</code> because both sides are integers. Writing <code>1/2.0</code>, or casting one side, gives <code>0.5</code>. This is why <code>100000.0</code> appears above rather than <code>100000</code>.</div>"
    },
    {
     "l": "WORKED",
     "t": "One query",
     "h": "The rows going in, the rows <em>coming out</em>",
     "b": "<p>The question: personal loans above ₹150,000, largest first.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, customer_id, principal, rate\nFROM   loan\nWHERE  product = 'PERSONAL'\n  AND  principal &gt; 150000\nORDER BY principal DESC;\n</pre></div>\n<p><strong>Step 1 &mdash; FROM.</strong> All eight rows of <code>loan</code> enter.</p>\n<p><strong>Step 2 &mdash; WHERE.</strong> Four rows are <code>PERSONAL</code>: L1001, L1004, L1005, L1008. Of those, L1004 at ₹150,000 fails the second test, because <code>&gt;</code> is strictly greater than. Three survive.</p>\n<p><strong>Step 3 &mdash; SELECT, then ORDER BY.</strong></p>\n<div class=\"dt\"><table>\n<tr><th>loan_id</th><th>customer_id</th><th>principal</th><th>rate</th></tr>\n<tr class=\"hi\"><td>L1008</td><td>C002</td><td class=\"n\">500,000</td><td class=\"n\">13.0</td></tr>\n<tr><td>L1001</td><td>C001</td><td class=\"n\">300,000</td><td class=\"n\">14.5</td></tr>\n<tr><td>L1005</td><td>C004</td><td class=\"n\">200,000</td><td class=\"n\">15.2</td></tr>\n</table></div>\n<p>Three rows out of eight. L1004 sitting exactly on the boundary is the detail worth noticing: <code>&gt;</code> excludes it and <code>&gt;=</code> includes it, and a specification saying \"above ₹150,000\" does not settle which was meant. <strong>Boundary conditions are a question for whoever asked, not a choice for whoever writes the query.</strong></p>\n<div class=\"note\">Note that L1008 appears here with no branch. Nothing in this query touched <code>branch_id</code>, so its emptiness cost nothing. Mission 04 is where that changes.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Filtering",
     "h": "The predicates that do <em>real work</em>",
     "b": "<p>A <span class=\"k\">predicate</span> is a test that evaluates to true or false for a row. <code>WHERE</code> keeps the rows where it is true.</p>\n<div class=\"sheet\"><div class=\"h\">The working set</div>\n<div class=\"r\"><b>= &lt;&gt; &lt; &lt;= &gt; &gt;=</b><span>Comparison. <code>&lt;&gt;</code> is standard for not-equal; <code>!=</code> works nearly everywhere</span></div>\n<div class=\"r\"><b>BETWEEN a AND b</b><span>Inclusive of both endpoints. Always</span></div>\n<div class=\"r\"><b>IN (list)</b><span>Matches any value in the list. Clearer than a chain of ORs</span></div>\n<div class=\"r\"><b>LIKE 'pattern'</b><span><code>%</code> matches any run of characters, <code>_</code> matches exactly one</span></div>\n<div class=\"r\"><b>IS NULL / IS NOT NULL</b><span>The only way to test for an absent value &mdash; Mission 03</span></div>\n<div class=\"r\"><b>NOT</b><span>Negates a predicate. Behaves unexpectedly around absent values</span></div>\n</div>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, product, principal, disbursed_on\nFROM   loan\nWHERE  product IN ('PERSONAL','TWO_WHEELER')\n  AND  principal BETWEEN 75000 AND 300000\n  AND  disbursed_on &gt;= DATE '2024-01-01'\n  AND  loan_id LIKE 'L10%';\n</pre></div>\n<p>Dates compare like numbers: later is greater. <code>DATE '2024-01-01'</code> is the standard way to write a date literal and is accepted by PostgreSQL, Oracle and SQL Server. A bare <code>'2024-01-01'</code> usually works too, because the database converts it, but being explicit removes any question of format.</p>\n<div class=\"note\">String comparison is case-sensitive in PostgreSQL and Oracle, and case-insensitive by default in MySQL and SQL Server. <code>product = 'personal'</code> therefore returns four rows on one product and none on another, with no error either way.</div>"
    },
    {
     "l": "TRAP",
     "t": "Missing brackets",
     "h": "AND and OR are not <em>equal partners</em>",
     "b": "<p>The wrong belief: conditions are applied left to right in the order written, so these two are the same query.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Intended: personal or two-wheeler loans, but only active ones\nSELECT loan_id, product, status FROM loan\nWHERE  product = 'PERSONAL' OR product = 'TWO_WHEELER'\n  AND  status = 'ACTIVE';\n</pre></div>\n<p><strong><code>AND</code> binds more tightly than <code>OR</code></strong>, exactly as multiplication binds more tightly than addition. The database reads the above as <em>PERSONAL, or (TWO_WHEELER and ACTIVE)</em>. So L1004 &mdash; a <code>PERSONAL</code> loan that is <code>CLOSED</code> &mdash; comes back, because the <code>ACTIVE</code> test never applied to it.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Correct\nSELECT loan_id, product, status FROM loan\nWHERE (product = 'PERSONAL' OR product = 'TWO_WHEELER')\n  AND status = 'ACTIVE';\n\n-- Clearer still\nSELECT loan_id, product, status FROM loan\nWHERE product IN ('PERSONAL','TWO_WHEELER')\n  AND status = 'ACTIVE';\n</pre></div>\n<p><strong>Why it is a believable mistake.</strong> The query runs, returns rows, and the rows look right &mdash; they are all real loans with plausible values. Only a row count reconciled against a known total exposes it. Six rows came back where five were expected, and nothing on screen says which one does not belong.</p>\n<div class=\"note\">Bracket every mixed <code>AND</code>/<code>OR</code> condition even where precedence already gives the right answer. The brackets cost nothing and they make the intent auditable by the next reader.</div>"
    },
    {
     "l": "TRAP",
     "t": "Dates with times",
     "h": "BETWEEN on a timestamp loses the <em>last day</em>",
     "b": "<p>The wrong belief: <code>WHERE txn_time BETWEEN '2025-01-01' AND '2025-01-31'</code> returns January.</p>\n<p>It returns January the 1st to the 31st <em>at midnight</em>. A <span class=\"k\">timestamp</span> column stores a date and a time together, so <code>2025-01-31 14:22:07</code> is greater than <code>2025-01-31 00:00:00</code> and is excluded. On a busy table this quietly drops most of one day in every monthly figure.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- Unsafe on a timestamp column\nWHERE txn_time BETWEEN DATE '2025-01-01' AND DATE '2025-01-31'\n\n-- Safe, and the pattern worth making automatic:\n-- greater-or-equal the start, strictly less than the next start\nWHERE txn_time &gt;= DATE '2025-01-01'\n  AND txn_time &lt;  DATE '2025-02-01'\n</pre></div>\n<p>The second form is called a <span class=\"k\">half-open interval</span>. It is correct whether the column holds a plain date or a timestamp, it needs no knowledge of how precisely time is stored, and consecutive periods written this way tile perfectly with no gap and no overlap.</p>\n<p><strong>Why it is a believable mistake.</strong> <code>BETWEEN</code> genuinely is inclusive, and on a pure date column the query is right. It only fails once the column carries a time component &mdash; which is not visible in a result grid that displays dates only.</p>\n<div class=\"note\">Oracle's <code>DATE</code> type always carries a time component even when it displays as a bare date. Half-open intervals are not optional there.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Sorting and limiting",
     "h": "Order is <em>never</em> assumed",
     "b": "<p>Without <code>ORDER BY</code>, the order of rows is undefined. It may look stable for months and then change because the table grew, an index was added, or the query ran in parallel. <strong>If order matters, sort explicitly.</strong></p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, product, principal\nFROM   loan\nORDER BY product ASC, principal DESC;\n</pre></div>\n<p>Sorting runs left to right: by product ascending, and within each product by principal descending. <code>ASC</code> is the default and can be omitted. Absent values sort last by default in PostgreSQL and Oracle, first in SQL Server and MySQL &mdash; <code>NULLS FIRST</code> or <code>NULLS LAST</code> makes it explicit where the product supports it.</p>\n<div class=\"sheet q\"><div class=\"h\">Taking the top few &mdash; the syntax splits</div>\n<div class=\"r\"><b>PostgreSQL, MySQL, SQLite</b><span><code>ORDER BY principal DESC LIMIT 5</code></span></div>\n<div class=\"r\"><b>SQL Server</b><span><code>SELECT TOP 5 ...</code></span></div>\n<div class=\"r\"><b>Oracle, and the SQL standard</b><span><code>ORDER BY principal DESC FETCH FIRST 5 ROWS ONLY</code></span></div>\n</div>\n<p><strong>A limit without a sort is not a sample &mdash; it is whichever rows the database happened to produce first.</strong> Run it twice and it may differ. To look at a few rows, that is harmless. To produce \"the top five branches\", it is a wrong answer with a right shape.</p>\n<div class=\"note\">Ties are the second half of the problem. Sorting by principal alone, two loans of ₹300,000 can swap places between runs. Adding a unique column as the final sort key &mdash; <code>ORDER BY principal DESC, loan_id</code> &mdash; makes the result reproducible.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Retrieval reference",
     "h": "The compressed <em>surface</em>",
     "b": "<div class=\"sheet\"><div class=\"h\">Pattern matching with LIKE</div>\n<div class=\"r\"><b>'L10%'</b><span>Starts with L10</span></div>\n<div class=\"r\"><b>'%NAIR'</b><span>Ends with NAIR</span></div>\n<div class=\"r\"><b>'%PERSONAL%'</b><span>Contains PERSONAL anywhere</span></div>\n<div class=\"r\"><b>'L100_'</b><span>L100 plus exactly one more character</span></div>\n<div class=\"r\"><b>ILIKE</b><span>Case-insensitive match. PostgreSQL only; elsewhere use <code>UPPER(col) LIKE ...</code></span></div>\n</div>\n<div class=\"sheet\"><div class=\"h\">Everyday scalar functions</div>\n<div class=\"r\"><b>UPPER, LOWER, TRIM</b><span>Case and whitespace. <code>TRIM</code> before comparing text from a file</span></div>\n<div class=\"r\"><b>SUBSTRING, LENGTH</b><span>Slice and measure text</span></div>\n<div class=\"r\"><b>ROUND(x, n), ABS, FLOOR, CEIL</b><span>Numeric shaping</span></div>\n<div class=\"r\"><b>CAST(x AS NUMERIC)</b><span>Portable type conversion. <code>x::NUMERIC</code> is the PostgreSQL shorthand</span></div>\n<div class=\"r\"><b>CURRENT_DATE</b><span>Today. Standard, and available everywhere</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">The four checks before trusting a filtered result</div>\n<div class=\"r\"><b>Row count</b><span>How many came back, against how many were expected</span></div>\n<div class=\"r\"><b>Boundaries</b><span>Is the endpoint in or out, and was that specified</span></div>\n<div class=\"r\"><b>Brackets</b><span>Every mixed AND/OR grouped explicitly</span></div>\n<div class=\"r\"><b>Dates</b><span>Half-open interval, never BETWEEN on a timestamp</span></div>\n</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "Where the clause rules are <em>specified</em>",
     "b": "<p>The evaluation order, the alias rules and the row-limiting syntax are all set out in the <code>SELECT</code> reference. Section 7.1 covers the clause pipeline in prose.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/sql-select.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; SELECT: clauses, evaluation order and LIMIT</a>\n<a href=\"https://www.postgresql.org/docs/current/queries-table-expressions.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Table Expressions: FROM, WHERE, GROUP BY and HAVING</a></div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 02",
     "h": "What is now owned",
     "b": "<ul>\n<li>Six clauses, written <code>SELECT FROM WHERE GROUP BY HAVING ORDER BY</code>, but <strong>executed FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY</strong>.</li>\n<li>That order is why <strong>an alias works in <code>ORDER BY</code> and fails in <code>WHERE</code></strong>.</li>\n<li><strong><code>AND</code> binds tighter than <code>OR</code>.</strong> Bracket every mixed condition, always.</li>\n<li><strong>Half-open date intervals</strong> &mdash; <code>&gt;= start AND &lt; next start</code> &mdash; are correct on dates and timestamps alike. <code>BETWEEN</code> on a timestamp loses the last day.</li>\n<li><strong>Row order is undefined without <code>ORDER BY</code></strong>, and a limit without a sort returns arbitrary rows. Add a unique final sort key to break ties.</li>\n<li><code>SELECT *</code> belongs in exploration, never in anything saved.</li>\n<li>Integer division truncates. <code>1/2</code> is <code>0</code> until one side is made decimal.</li>\n</ul>"
    }
   ],
   "n": "02"
  },
  {
   "title": "The value that is not there",
   "stage": "Absence",
   "line": "An absent value is not zero and not an empty string. It is unknown, it obeys its own logic, and it is the single largest source of quietly wrong answers in SQL.",
   "bullets": [
    "Three-valued logic, and why NULL = NULL is not true",
    "The filter that silently drops rows you meant to keep",
    "How aggregates, GROUP BY, DISTINCT and ORDER BY each treat absence differently",
    "COALESCE, NULLIF and IS DISTINCT FROM",
    "Deciding whether absence means zero, or means unknown"
   ],
   "cards": [
    {
     "l": "DEFINE",
     "t": "What NULL is",
     "h": "Not zero, not blank &mdash; <em>unknown</em>",
     "b": "<p><span class=\"k\">NULL</span> is SQL's marker for a value that is absent. It is not the number zero, not an empty string, and not the text \"NULL\". It means <em>no value is recorded here</em>.</p>\n<div class=\"dt\"><table>\n<tr><th>Value</th><th>Means</th><th>In the book</th></tr>\n<tr><td class=\"n\">0</td><td>A known quantity of zero</td><td class=\"g\">A loan fully repaid: outstanding is genuinely nothing</td></tr>\n<tr><td>''</td><td>A known string of no characters</td><td class=\"g\">A remarks field deliberately left blank</td></tr>\n<tr class=\"hi\"><td><em>NULL</em></td><td>Not known, or not applicable</td><td class=\"g\">L1008 has no branch &mdash; it was sold digitally, so no branch exists to record</td></tr>\n</table></div>\n<p>The distinction is not pedantry. An outstanding balance of zero and an unknown outstanding balance mean opposite things about a book: one is a repaid loan, the other is a data failure. Storing both as <code>0</code> destroys the difference permanently.</p>\n<p>Absence arises in four ways, and it is worth knowing which applies:</p>\n<ul>\n<li><strong>Not applicable</strong> &mdash; a digital loan has no branch. Nothing is missing; the concept does not apply.</li>\n<li><strong>Not yet known</strong> &mdash; a loan that has not defaulted has no default date.</li>\n<li><strong>Not captured</strong> &mdash; the income band was never asked for. This is a data quality problem.</li>\n<li><strong>Introduced by the query</strong> &mdash; an outer join found no match, and manufactured absence on the spot. Mission 04.</li>\n</ul>\n<div class=\"note\">Oracle is the exception that must be remembered: it stores an empty string as absent. <code>'' IS NULL</code> is true in Oracle and false everywhere else, so a check that works in PostgreSQL passes silently and behaves differently on Oracle.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Three-valued logic",
     "h": "True, false, and <em>unknown</em>",
     "b": "<p>Comparing anything to an unknown value yields <em>unknown</em>, not false. So SQL logic has three outcomes rather than two, and <code>WHERE</code> keeps only the rows where the test is <strong>true</strong> &mdash; unknown is discarded exactly as false is.</p>\n<div class=\"dt\"><table>\n<tr><th>Expression</th><th>Result</th><th>Why</th></tr>\n<tr><td><code>5 = 5</code></td><td class=\"n\">true</td><td class=\"g\">Both known</td></tr>\n<tr class=\"hi\"><td><code>5 = NULL</code></td><td class=\"n\">unknown</td><td class=\"g\">Is 5 equal to something unrecorded? Unanswerable</td></tr>\n<tr class=\"hi\"><td><code>NULL = NULL</code></td><td class=\"n\">unknown</td><td class=\"g\">Two unknowns are not thereby equal</td></tr>\n<tr><td><code>NULL &lt;&gt; NULL</code></td><td class=\"n\">unknown</td><td class=\"g\">Nor are they thereby different</td></tr>\n<tr><td><code>NOT (unknown)</code></td><td class=\"n\">unknown</td><td class=\"g\">Negating an unknown leaves it unknown</td></tr>\n<tr><td><code>NULL IS NULL</code></td><td class=\"n\">true</td><td class=\"g\"><code>IS NULL</code> tests presence and always returns true or false</td></tr>\n</table></div>\n<p><code>AND</code> and <code>OR</code> follow from this. <code>false AND unknown</code> is <strong>false</strong>, because one false is enough to settle it. <code>true OR unknown</code> is <strong>true</strong>, for the same reason. But <code>true AND unknown</code> is unknown, and that is the case that loses rows.</p>\n<p>Arithmetic behaves the same way. <strong>Anything plus an unknown is unknown</strong>, so <code>principal + fees</code> returns nothing at all when <code>fees</code> is absent &mdash; not <code>principal</code>. A single absent component silently voids a whole computed column.</p>\n<div class=\"note\">The rule reduces to one sentence: <strong>absence propagates.</strong> It moves through comparisons, through arithmetic, and through any expression built on them, and it never announces itself.</div>"
    },
    {
     "l": "TRAP",
     "t": "The vanishing rows",
     "h": "NOT EQUAL does not mean <em>everything else</em>",
     "b": "<p>The wrong belief: <code>WHERE branch_id &lt;&gt; 'B01'</code> returns every loan not booked at Koramangala.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT loan_id, branch_id FROM loan\nWHERE  branch_id &lt;&gt; 'B01';\n-- Returns 4 rows: L1003, L1004, L1005, L1006\n-- L1008 is missing. Its branch is unknown, so the test returned\n-- unknown, and unknown is discarded exactly as false is.\n</pre></div>\n<p>Seven loans have a branch, three of them B01, so four should come back &mdash; and four do. The eighth loan, with no branch, is neither kept nor reported. <strong>₹500,000 of exposure has left the report and nothing on screen indicates it.</strong></p>\n<div class=\"code\" data-cap=\"sql\"><pre>\n-- If unknown-branch loans belong in the answer, say so\nSELECT loan_id, branch_id FROM loan\nWHERE  branch_id &lt;&gt; 'B01' OR branch_id IS NULL;\n\n-- Or use the predicate that treats absence as an ordinary value\nSELECT loan_id, branch_id FROM loan\nWHERE  branch_id IS DISTINCT FROM 'B01';\n</pre></div>\n<p><code>IS DISTINCT FROM</code> is the standard comparison that never returns unknown: two absent values are <em>not</em> distinct, and one absent against one present <em>is</em> distinct. PostgreSQL supports it directly; SQL Server has no equivalent and needs the explicit <code>OR ... IS NULL</code> form.</p>\n<p><strong>Why it is a believable mistake.</strong> In every other language, \"not equal to B01\" covers everything that is not B01. SQL's three-valued logic is genuinely unusual, and the query does not fail &mdash; it succeeds, returns real rows, and omits the ones it cannot decide about.</p>\n<div class=\"note\">The same swallowing happens with <code>NOT IN</code> against a list containing an absent value: <strong><code>x NOT IN (1, 2, NULL)</code> is never true for any x.</strong> Use <code>NOT EXISTS</code> instead &mdash; Mission 07.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Aggregates and absence",
     "h": "Every clause treats it <em>differently</em>",
     "b": "<p>This is the table worth memorising, because the rules are not consistent with each other.</p>\n<div class=\"sheet\"><div class=\"h\">How each construct handles NULL</div>\n<div class=\"r\"><b>SUM, AVG, MIN, MAX</b><span>Ignore absent values entirely. <code>AVG</code> divides by the count of present values, not by the row count</span></div>\n<div class=\"r\"><b>COUNT(*)</b><span>Counts rows regardless</span></div>\n<div class=\"r\"><b>COUNT(column)</b><span>Counts present values only</span></div>\n<div class=\"r\"><b>GROUP BY</b><span>Collects all absent values into <strong>one group</strong> &mdash; treating them as equal, which comparison refuses to do</span></div>\n<div class=\"r\"><b>DISTINCT</b><span>Keeps <strong>one</strong> absent value &mdash; also treating them as equal</span></div>\n<div class=\"r\"><b>ORDER BY</b><span>Sorts them together, last by default in PostgreSQL and Oracle, first in MySQL and SQL Server</span></div>\n<div class=\"r\"><b>UNION</b><span>Deduplicates them as equal</span></div>\n<div class=\"r\"><b>Primary key</b><span>Forbids them entirely</span></div>\n<div class=\"r\"><b>UNIQUE constraint</b><span>Permits several, since two unknowns are not proven duplicates</span></div>\n</div>\n<p><strong>The inconsistency is real and it is in the standard.</strong> Comparison says two unknowns cannot be shown equal; grouping, <code>DISTINCT</code> and <code>UNION</code> put them together anyway, because a report needs a single \"unknown\" bucket rather than one bucket per unknown row.</p>\n<p>The consequence that bites hardest is <code>AVG</code>. On ten loans where three have no recorded income, <code>AVG(income)</code> divides the sum by <strong>seven</strong>. If those three were meant to count as zero, the answer is too high &mdash; and it looks entirely reasonable.</p>\n<div class=\"note\"><code>SUM</code> over a group where every value is absent returns absent, not zero. A branch with no qualifying loans yields an empty cell, not a ₹0 cell, and downstream arithmetic then voids too.</div>"
    },
    {
     "l": "WORKED",
     "t": "Averaging",
     "h": "The same column, two defensible <em>answers</em>",
     "b": "<p>Six customers hold an income band. C005's is unrecorded. Take the numeric annual income behind those bands, in rupees:</p>\n<div class=\"dt\"><table>\n<tr><th>Customer</th><th>City</th><th>annual_income</th></tr>\n<tr><td>C001 Anita Rao</td><td>Bengaluru</td><td class=\"n\">900,000</td></tr>\n<tr><td>C002 Vikram Shah</td><td>Mumbai</td><td class=\"n\">2,400,000</td></tr>\n<tr><td>C003 Meera Nair</td><td>Kochi</td><td class=\"n\">420,000</td></tr>\n<tr><td>C004 Rohit Sen</td><td>Kolkata</td><td class=\"n\">840,000</td></tr>\n<tr class=\"hi\"><td>C005 Priya Das</td><td>Bengaluru</td><td class=\"n\"><em>NULL</em></td></tr>\n<tr><td>C006 Arjun Menon</td><td>Chennai</td><td class=\"n\">760,000</td></tr>\n</table></div>\n<div class=\"wk\"><div class=\"h\">AVG(annual_income), computed</div>\n<div class=\"r\"><b>Sum of present values</b><span>5,320,000</span></div>\n<div class=\"r\"><b>Count of rows &mdash; COUNT(*)</b><span>6</span></div>\n<div class=\"r\"><b>Count of present values &mdash; COUNT(annual_income)</b><span>5</span></div>\n<div class=\"r tot\"><b>AVG divides by 5, not 6</b><span>1,064,000</span></div>\n<div class=\"r\"><b>If absence is instead treated as zero</b><span>5,320,000 / 6</span></div>\n<div class=\"r tot\"><b>COALESCE then average</b><span>886,667</span></div>\n</div>\n<p><strong>The two answers differ by 20%</strong>, and both queries are syntactically perfect.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT AVG(annual_income)               AS avg_of_known,\n       AVG(COALESCE(annual_income, 0))  AS avg_treating_absent_as_zero,\n       COUNT(*)                         AS customers,\n       COUNT(annual_income)             AS with_income\nFROM customer;\n</pre></div>\n<p>Which is right depends entirely on what absence means here. Priya Das has an income; it was not captured. Treating it as zero asserts something false about her, so <strong>the default &mdash; averaging the known &mdash; is correct, and the honest report states that it covers five of six customers.</strong> Had the column been \"arrears\", where absence means no arrears exist, zero would be right.</p>\n<div class=\"note\">Publish the denominator next to any average over a column that has absent values. An average of 1,064,000 with no coverage figure is not a wrong number, but it is an unauditable one.</div>"
    },
    {
     "l": "CHEAT",
     "t": "The null toolkit",
     "h": "Four functions that do <em>most</em> of the work",
     "b": "<div class=\"code\" data-cap=\"sql\"><pre>\n-- COALESCE: first present value from the list. Standard everywhere.\nSELECT loan_id,\n       COALESCE(branch_id, 'DIGITAL')      AS channel,\n       COALESCE(fees, 0)                   AS fees_clean,\n       COALESCE(nickname, full_name, 'NA') AS display_name\nFROM   loan_extended;\n\n-- NULLIF: returns absent when the two arguments match.\n-- The standard guard against division by zero.\nSELECT recovered / NULLIF(exposure, 0) AS recovery_rate FROM workout;\n\n-- CASE: explicit control, and the reporting form of the two above.\nSELECT CASE WHEN branch_id IS NULL THEN 'Digital channel'\n            ELSE branch_id END AS channel\nFROM   loan;\n\n-- IS DISTINCT FROM: comparison that never returns unknown.\nSELECT * FROM loan WHERE branch_id IS DISTINCT FROM 'B01';\n</pre></div>\n<div class=\"sheet q\"><div class=\"h\">Dialect equivalents of COALESCE</div>\n<div class=\"r\"><b>Standard, all products</b><span><code>COALESCE(a, b)</code> &mdash; use this</span></div>\n<div class=\"r\"><b>SQL Server</b><span><code>ISNULL(a, b)</code> &mdash; two arguments only</span></div>\n<div class=\"r\"><b>Oracle</b><span><code>NVL(a, b)</code>, and <code>NVL2</code> for a three-way</span></div>\n<div class=\"r\"><b>MySQL</b><span><code>IFNULL(a, b)</code></span></div>\n</div>\n<div class=\"note\"><code>NULLIF(exposure, 0)</code> converts a zero denominator into an absent one, and division by absent yields absent rather than an error that stops the query. An empty cell is the honest output for an undefined ratio.</div>"
    },
    {
     "l": "TRAP",
     "t": "Blanket cleaning",
     "h": "Replacing every absence with <em>zero</em>",
     "b": "<p>The wrong belief: absent values are dirt, so wrap every numeric column in <code>COALESCE(col, 0)</code> and the data is clean.</p>\n<p>This converts an honest <em>we do not know</em> into a confident <em>it is nothing</em>. Downstream, the two are indistinguishable. A recovery rate column filled with zeros for cases still in workout drags the portfolio average down and reads as poor recovery rather than as incomplete data. Nobody can tell afterwards which zeros were measured.</p>\n<div class=\"sheet g\"><div class=\"h\">The decision, made once per column</div>\n<div class=\"r\"><b>Absence means none occurred</b><span>Replace with 0. Arrears with no arrears record. Fees where none were charged</span></div>\n<div class=\"r\"><b>Absence means not applicable</b><span>Replace with a label. A digital loan's branch becomes 'DIGITAL', not blank</span></div>\n<div class=\"r\"><b>Absence means not captured</b><span><strong>Leave it absent.</strong> Report the coverage alongside the figure</span></div>\n<div class=\"r\"><b>Absence means not yet</b><span>Leave it absent. A default date on a performing loan should stay empty</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> Empty cells in a report look like a defect, someone asks for them to be cleaned up, and zero is the obvious filler. The output is tidier and the meaning is gone.</p>\n<div class=\"note\">Where a column is filled in, record what was done and why. A specification saying \"unrecorded income excluded from the mean, coverage stated\" is a different document from one saying \"nulls replaced with zero\", and only one of them survives being questioned.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "The comparison rules, <em>specified</em>",
     "b": "<p>The PostgreSQL manual states the rule directly: ordinary comparison operators return null, meaning unknown, when either input is null &mdash; and it warns explicitly against writing <code>expression = NULL</code>.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.postgresql.org/docs/current/functions-comparison.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Comparison Functions and Operators, including IS DISTINCT FROM</a>\n<a href=\"https://www.postgresql.org/docs/current/functions-aggregate.html\" target=\"_blank\" rel=\"noopener\">PostgreSQL &mdash; Aggregate Functions, and how they treat null input</a></div>\n<div class=\"note\">The same page documents <code>transform_null_equals</code>, a compatibility setting that makes <code>= NULL</code> behave as <code>IS NULL</code>. Knowing it exists matters mainly so that it can be ruled out when a query behaves differently on two systems.</div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 03",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong>NULL is unknown</strong> &mdash; not zero, not blank. The four kinds of absence mean different things and get handled differently.</li>\n<li><strong>Comparison to NULL yields unknown</strong>, and <code>WHERE</code> discards unknown exactly as it discards false. This is where rows vanish.</li>\n<li><strong><code>&lt;&gt;</code> excludes absent rows silently.</strong> Add <code>OR col IS NULL</code>, or use <code>IS DISTINCT FROM</code>.</li>\n<li><strong><code>NOT IN</code> against a list containing NULL is never true.</strong> Use <code>NOT EXISTS</code>.</li>\n<li><strong>Absence propagates through arithmetic.</strong> One absent component voids the whole expression.</li>\n<li><strong>Aggregates ignore absence; <code>GROUP BY</code>, <code>DISTINCT</code> and <code>UNION</code> treat it as one value.</strong> The standard is inconsistent here on purpose.</li>\n<li><strong><code>AVG</code> divides by the count of present values.</strong> Publish the denominator.</li>\n<li><code>COALESCE</code> is the portable default; <code>NULLIF(x, 0)</code> is the division-by-zero guard.</li>\n</ul>"
    }
   ],
   "n": "03"
  },
  {
   "title": "Where rows disappear",
   "stage": "Combining",
   "line": "Joining is how tables are put back together, and it is where row counts silently change. Four join types, one multiplication hazard, and a discipline for proving the join did what was intended.",
   "bullets": [
    "Inner, left, right and full &mdash; and what each does to the row count",
    "Why an inner join is a filter as well as a combination",
    "Fan-out: joining two many-sided tables and doubling the money",
    "ON against WHERE on an outer join &mdash; the distinction that reverses the result",
    "A four-step check that proves a join before anything is built on it"
   ],
   "cards": [
    {
     "l": "WHY",
     "t": "Why tables split",
     "h": "Data is stored apart so it is stored <em>once</em>",
     "b": "<p>Branch names sit in <code>branch</code> and not in <code>loan</code> because storing the name against every loan would repeat it thousands of times, and a renamed branch would then have to be corrected in thousands of places &mdash; with the near-certainty that some would be missed. Splitting related facts into separate tables so each is recorded once is called <span class=\"k\">normalisation</span>.</p>\n<p>The cost of storing data once is that answering a real question needs it reassembled. That is a <span class=\"k\">join</span>: rows from one table matched to rows from another using a shared value.</p>\n<div class=\"code\" data-cap=\"sql\"><pre>\nSELECT l.loan_id, l.principal, b.branch_name, b.region\nFROM   loan   AS l\nJOIN   branch AS b ON l.branch_id = b.branch_id;\n</pre></div>\n<p><code>l</code> and <code>b</code> are <span class=\"k\">aliases</span> &mdash; short names for the tables within this query. They are not decoration. Once two tables are in play, both may have a column called <code>branch_id</code>, and an unqualified reference is ambiguous. <strong>Qualify every column with its table alias in any query that joins.</strong></p>\n<div class=\"note\">The join condition here is equality on a shared key, which covers the overwhelming majority of real joins. Conditions can be any Boolean expression &mdash; ranges, inequalities &mdash; but a non-equality join is a deliberate act and usually needs a comment saying why.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Four join types",
     "h": "What each does to the <em>row count</em>",
     "b": "<p>Every join asks the same question of each row on the left: is there a matching row on the right? The four types differ only in what happens when the answer is no.</p>\n<div class=\"dt\"><table>\n<tr><th>Type</th><th>Keeps</th><th>Unmatched rows become</th></tr>\n<tr class=\"hi\"><td><code>INNER JOIN</code></td><td>Only rows matching on both sides</td><td class=\"g\">Dropped, from both sides, without notice</td></tr>\n<tr><td><code>LEFT JOIN</code></td><td>All left rows, matched or not</td><td class=\"g\">Kept, with the right-hand columns filled with NULL</td></tr>\n<tr><td><code>RIGHT JOIN</code></td><td>All right rows, matched or not</td><td class=\"g\">Kept, with the left-hand columns filled with NULL</td></tr>\n<tr><td><code>FULL OUTER JOIN</code></td><td>Everything from both sides</td><td class=\"g\">Kept from both, unmatched side filled with NULL</td></tr>\n</table></div>\n<p>Two facts that follow, and both matter more than the syntax:</p>\n<ul>\n<li><strong>An inner join is a filter.</strong> It combines and it discards, in one operation, and the discarding is invisible. This is the largest single cause of exposure going missing from a report.</li>\n<li><strong>An outer join manufactures NULLs.</strong> The absent values in the result were not in either table. They mean \"no match found here\", which is a fact about the join rather than about the data &mdash; and everything in Mission 03 then applies to them.</li>\n</ul>\n<p><code>RIGHT JOIN</code> is rarely written in practice: any right join can be rewritten as a left join by swapping the table order, and keeping every join in one direction makes a long query far easier to read. <code>CROSS JOIN</code> is the fifth type &mdash; every row against every row, with no condition &mdash; and outside of generating calendars or scenario grids, it is nearly always an accident.</p>\n<div class=\"note\">The word \"outer\" is optional: <code>LEFT JOIN</code> and <code>LEFT OUTER JOIN</code> are identical. Plain <code>JOIN</code> means <code>INNER JOIN</code>. The default is the destructive one.</div>"
    },
    {
     "l": "WORKED",
     "t": "Inner against left",
     "h": "The same question, ₹500,000 <em>apart</em>",
