<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}

/* ================= v02 ADDITIONS ================= */

/* links — official source blocks */
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim);transition:color .15s,border-color .15s}
a:hover{color:var(--ink);border-color:var(--ink)}
.docs{margin:20px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--live);border-radius:7px;font-size:12.6px;line-height:1.9}
.docs b{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:6px;font-weight:500}
.docs a{display:block;border-bottom:none;color:var(--body)}
.docs a:hover{color:var(--accent)}
.docs a:before{content:'\2192\00a0';color:var(--live)}

/* formulae */
.fx{margin:20px 0;padding:16px 15px;background:#0E0E12;border:1px solid var(--line);border-radius:9px;text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fx .cap{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.fx .eq{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);line-height:2.1;white-space:normal}
.fx .eq em{font-style:italic;color:var(--accent);font-family:'Instrument Serif',serif;font-size:17px}
.fx .eq .nw{white-space:nowrap}
.fx .wh{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:left;line-height:1.8;font-family:'JetBrains Mono',monospace}

/* stacked fractions — never sup/frasl/sub */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px}
.fr>i{font-style:normal;display:block;padding:0 7px;line-height:1.4;white-space:nowrap}
.fr>i:first-child{border-bottom:1px solid var(--muted);padding-bottom:3px}
.fr>i:last-child{padding-top:3px}

/* worked examples */
.wk{margin:20px 0;border:1px solid var(--accent-dim);border-radius:9px;overflow:hidden}
.wk .h{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.wk .r{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;background:var(--surface)}
.wk .r:last-child{border-bottom:none}
.wk .r b{flex:1;color:var(--body);font-weight:400}
.wk .r span{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.wk .r.tot{background:var(--raise)}
.wk .r.tot b{color:var(--ink);font-weight:600}
.wk .r.tot span{color:var(--ink)}

@media(max-width:560px){
 .fx{text-align:left;padding:14px 12px}
 .fx .eq{font-size:12.5px;line-height:2}
 .fx .eq em{font-size:15px}
 .fx .cap{text-align:left}
 .fx .wh{font-size:10.5px;line-height:1.75}
 .fr>i{padding:0 5px}
 .wk .r{flex-wrap:wrap;gap:4px}
 .wk .r b{flex:1 1 100%}
 .wk .r span{flex:0 0 auto}
 .sheet .r{flex-direction:column;gap:3px}
 .sheet .r b{flex:none}
}
@media(max-width:430px){
 .fx{padding:12px 10px}
 .fx .eq{font-size:11.5px}
 .fx .eq em{font-size:14px}
}

.code.out{border-color:var(--accent-dim);background:#0C0E0C}
.code.out pre{color:var(--ok);font-size:11.8px}
.code.out:before{color:var(--ok)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "18 August 2026";
const P = {
edition:"Edition 02",
title:"Python for <em>Credit Risk</em>",
sub:"The language, the data stack and the model workflow, taught entirely on a loan book. Every line runs. Every example is a real credit calculation rather than a toy.",
floor:"No prior programming assumed",
dateline:"Library versions verified",
intro:"This is a <strong>doing</strong> pack. Cards labelled <strong>MOVE</strong> are meant to be typed, not read — the code is the content, and the output beneath it is what you should see. <strong>Live</strong> cards carry a collection stamp because library behaviour changes; <strong>mechanism</strong> cards do not go stale.",
missions:[

/* ============ 01 ============ */
{n:"01",title:"Getting it running",stage:"Ground",
line:"The smallest possible loop — write something, run it, read the error, fix it. Everything after this mission assumes you can do that.",
bullets:["What Python actually is, and where it runs","Variables, and why there is no type declaration","The four errors you will meet in week one","Reading a traceback from the bottom up","Installing the four libraries this pack uses"],
cards:[

{l:"ORIENT",t:"What this is",h:"A tool for the work you already <em>understand</em>",b:`<p>This pack does not teach Python and then, at the end, apply it to something. Every example from card one is a credit calculation: exposures, defaults, buckets, provisions, ratings.</p>
<p>The reason is practical. Learning a language on abstract exercises produces someone who can write a loop and cannot open a loan book. Learning it on the actual data produces the opposite.</p>
<div class="two">
<div><b>What you will be able to do</b>Take a raw loan tape, clean it, bin it, build a scorecard, validate it, compute expected loss, and chart the result</div>
<div><b>What this is not</b>Software engineering. No classes, no packaging, no deployment. This is the analyst's slice of the language</div>
</div>
<div class="note">Every credit term used is defined on the card where it appears. No prior credit knowledge is assumed either &mdash; though if you have it, the examples will land faster.</div>`},

{l:"DEFINE",t:"The pieces",h:"Interpreter, script, <em>notebook</em>",b:`<p>Three words get used interchangeably and mean different things.</p>
<div class="lay">
<div><span>1</span><strong>The interpreter</strong> is the program that reads your code and executes it, one line at a time. It is what "Python" actually refers to when someone says a version number.</div>
<div><span>2</span><strong>A script</strong> is a plain text file ending in <code>.py</code>. Run it and every line executes top to bottom, then it exits.</div>
<div><span>3</span><strong>A notebook</strong> is a document of cells you run individually, keeping their results in memory between runs. The file ends in <code>.ipynb</code>.</div>
</div>
<p>For analysis work the notebook wins, and for one reason: <strong>the data stays loaded</strong>. Reading a large loan book takes time; in a script you pay that cost on every run, in a notebook you pay it once and then experiment against it.</p>
<div class="note">Scripts win the moment something needs to run on a schedule or be handed to someone else. Most analysis starts in a notebook and ends as a script.</div>`},

{l:"MOVE",t:"First lines",h:"Type these, do not read <em>them</em>",b:`<p>Open a notebook. Type this into a cell and run it.</p>
<div class="code" data-cap="python"><pre>
exposure = 3800000
pd_rate  = 0.024
lgd      = 0.45

expected_loss = exposure * pd_rate * lgd
print(expected_loss)
</pre></div>
<div class="code out" data-cap="output"><pre>
41040.0
</pre></div>
<p>Four things just happened, and all four are worth naming.</p>
<ul>
<li><code>=</code> is <strong>assignment</strong>, not equality. It means "put this value in this name".</li>
<li>No type was declared. Python worked out that <code>3800000</code> is a whole number and <code>0.024</code> is not.</li>
<li>The result came back as <code>41040.0</code> with a decimal point, because multiplying by a decimal produces a decimal.</li>
<li><code>print()</code> displays a value. In a notebook the last line of a cell displays automatically, so <code>print</code> is only needed for values that are not last.</li>
</ul>
<div class="note">That calculation is <strong>expected loss</strong> &mdash; exposure at default (<strong>EAD</strong>, how much is owed when the borrower fails) multiplied by probability of default (<strong>PD</strong>, the chance they fail) multiplied by loss given default (<strong>LGD</strong>, the share not recovered afterwards). It is the single most common arithmetic in credit risk and it is three multiplications.</div>`},

{l:"DEFINE",t:"Names",h:"What can go on the <em>left</em>",b:`<p>A <span class="k">variable</span> is a name bound to a value. Python is loosely typed: the name carries no declared type and can be rebound to anything.</p>
<div class="code" data-cap="python"><pre>
grade = 5          # a whole number
grade = "BBB-"     # now a string, and this is legal
</pre></div>
<p>Legal, and a common source of confusion in someone else's code. Naming rules:</p>
<div class="dt"><table>
<tr><th>Rule</th><th>Detail</th></tr>
<tr><td>Letters, digits, underscores</td><td>Cannot start with a digit. <code>pd_12m</code> is fine, <code>12m_pd</code> is not</td></tr>
<tr><td>Case matters</td><td><code>EAD</code> and <code>ead</code> are two different names</td></tr>
<tr><td>No spaces, no hyphens</td><td><code>days_past_due</code>, never <code>days-past-due</code></td></tr>
<tr><td>Reserved words are blocked</td><td><code>class</code>, <code>for</code>, <code>lambda</code>, <code>is</code>, <code>in</code> and around thirty others</td></tr>
</table></div>
<div class="note">The convention across the whole data ecosystem is <code>lower_snake_case</code> for variables and functions. Following it costs nothing and makes your code look like everyone else's, which matters more than it sounds when someone inherits it.</div>`},

{l:"TRAP",t:"The four first errors",h:"Each one means something <em>specific</em>",b:`<div class="sheet q"><div class="h">What each error actually tells you</div>
<div class="r"><b>SyntaxError</b><span>Python could not parse the line at all. Almost always a missing bracket, quote or colon &mdash; and usually on the line <em>before</em> the one reported</span></div>
<div class="r"><b>NameError</b><span>You used a name that was never assigned. A typo, or a cell you did not run</span></div>
<div class="r"><b>TypeError</b><span>An operation applied to the wrong kind of thing. Adding a number to a string is the classic</span></div>
<div class="r"><b>IndentationError</b><span>Whitespace is structural in Python. A block is defined by its indentation, not by braces</span></div>
</div>
<div class="code" data-cap="python"><pre>
exposure = "3800000"        # note the quotes
print(exposure * 0.024)
</pre></div>
<div class="code out" data-cap="output"><pre>
TypeError: can't multiply sequence by non-int of type 'float'
</pre></div>
<p>This exact error will happen to you with real data, because a CSV column that looks numeric arrives as text whenever a single row contains a stray comma or a blank. Mission 05 deals with it properly.</p>`},

{l:"MOVE",t:"Reading a traceback",h:"Bottom <em>up</em>",b:`<p>When something fails, Python prints a <span class="k">traceback</span> — the chain of calls that led to the failure. It is read from the bottom.</p>
<div class="code out" data-cap="traceback"><pre>
Traceback (most recent call last):
  File "portfolio.py", line 42, in &lt;module&gt;
    provision = compute_ecl(book)
  File "portfolio.py", line 18, in compute_ecl
    return balance * pd_12m * lgd
           ~~~~~~~~^~~~~~~~~
TypeError: unsupported operand type(s) for *: 'str' and 'float'
</pre></div>
<div class="lay">
<div><span>1</span><strong>Last line first.</strong> The error type and message. Here: something is a string that should be a number.</div>
<div><span>2</span><strong>The line above it.</strong> Where it broke &mdash; file, line number, and the offending expression with a caret marking the exact operand.</div>
<div><span>3</span><strong>Work upwards only if needed</strong>, to see what called what.</div>
</div>
<div class="note">Reading tracebacks top-down is the commonest beginner habit and it wastes the most time. The top is where the story started; the bottom is where it broke.</div>`},

{l:"MOVE",t:"The four libraries",h:"Install once, import <em>always</em>",b:`<p>Everything in this pack after Mission 03 uses four libraries. Install them from a terminal, not from inside Python.</p>
<div class="code" data-cap="terminal"><pre>
pip install pandas numpy scikit-learn matplotlib pyarrow
</pre></div>
<p>Then, at the top of every notebook:</p>
<div class="code" data-cap="python"><pre>
import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
</pre></div>
<div class="dt"><table>
<tr><th>Library</th><th>What it does here</th></tr>
<tr><td>pandas</td><td>Tables. The loan book, every filter, every aggregation. The centre of gravity of this pack</td></tr>
<tr><td>numpy</td><td>Fast numeric arrays. Sits underneath pandas and surfaces for maths</td></tr>
<tr><td>scikit-learn</td><td>Model fitting, splitting, and the validation metrics</td></tr>
<tr><td>matplotlib</td><td>Charts</td></tr>
<tr><td>pyarrow</td><td>Not imported directly. Backs the string and file handling and makes both substantially faster</td></tr>
</table></div>
<div class="note">The aliases <code>pd</code> and <code>np</code> are universal convention. Every example on the internet assumes them, so use them.</div>`},

{l:"LIVE",t:"Versions",h:"What is current, and what recently <em>broke</em>",b:`<div class="stamp">Collected 18 August 2026</div>
<div class="dt"><table>
<tr><th>Package</th><th>State</th></tr>
<tr><td>Python</td><td><strong>3.14</strong> is the current stable line, released October 2025. 3.11 is the practical floor for the current data stack</td></tr>
<tr class="hi"><td>pandas</td><td><strong>3.0</strong> released 21 January 2026, 3.0.x since. A breaking release &mdash; see the next card</td></tr>
<tr><td>numpy</td><td>2.x. The 2.1 line reaches end of support on 19 August 2026; 2.3 and later require Python 3.11 or newer</td></tr>
<tr><td>scikit-learn</td><td>1.9, supporting Python 3.11 to 3.14</td></tr>
<tr><td>matplotlib</td><td>3.10</td></tr>
</table></div>
<p>The scientific Python projects share a support policy that retires each release on a rolling window of roughly two years, which is why the whole stack tends to move together. Falling behind on one package quietly caps the versions of every other.</p>
<div class="docs"><b>Official sources</b>
<a href="https://devguide.python.org/versions/" target="_blank" rel="noopener">Python &mdash; status of Python versions</a>
<a href="https://pandas.pydata.org/docs/whatsnew/v3.0.0.html" target="_blank" rel="noopener">pandas &mdash; what's new in 3.0.0</a>
<a href="https://scientific-python.org/specs/spec-0000/" target="_blank" rel="noopener">Scientific Python SPEC 0 &mdash; minimum supported dependencies</a></div>`},

{l:"TRAP",t:"pandas 3.0",h:"Why older tutorials now teach you <em>wrong</em> things",b:`<p>Almost every pandas tutorial written before 2026 contains advice that is now obsolete. Three changes did it.</p>
<div class="sheet q"><div class="h">What changed on 21 January 2026</div>
<div class="r"><b>Copy-on-Write is the only mode</b><span>Every indexing operation now behaves as a copy. Whether you got a view or a copy used to depend on the exact operation, which was the single most confusing thing in the library</span></div>
<div class="r"><b>Chained assignment no longer works</b><span><code>df["a"][mask] = 1</code> silently updates nothing. It must be done in one step with <code>.loc</code></span></div>
<div class="r"><b>SettingWithCopyWarning is gone</b><span>Removed entirely, because the ambiguity it warned about no longer exists. Defensive <code>.copy()</code> calls are no longer needed</span></div>
<div class="r"><b>Strings have a real dtype</b><span>Text columns come in as <code>str</code> rather than <code>object</code>, backed by PyArrow. Any code checking <code>dtype == "object"</code> for text is now wrong</span></div>
</div>
<p>A fourth, quieter change: datetime data no longer defaults to nanosecond resolution, generally landing at microseconds instead. This removes the old out-of-range failure for dates before 1678 or after 2262.</p>
<div class="note">If you find a Stack Overflow answer telling you to add <code>.copy()</code> to silence a warning, it is answering a question that no longer exists. This pack is written for 3.0 throughout.</div>`},

{l:"RECALL",t:"Mission 01",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Notebook for analysis, script for repetition</b><span>The notebook keeps data in memory between runs, which is the whole advantage</span></div>
<div class="r"><b><code>=</code> is assignment</b><span>No type declaration. A name can be rebound to anything, legally</span></div>
<div class="r"><b>Four first errors</b><span>Syntax, Name, Type, Indentation. Each names a specific class of mistake</span></div>
<div class="r"><b>Tracebacks read bottom-up</b><span>Last line is the error, line above is where it broke</span></div>
<div class="r"><b><code>import pandas as pd</code></b><span>Universal aliases. Every example anywhere assumes them</span></div>
<div class="r"><b>pandas 3.0 changed the defaults</b><span>Copy-on-Write only, chained assignment dead, strings typed. Older tutorials are wrong</span></div>
</div>`}
]},

/* ============ 02 ============ */
{n:"02",title:"The five shapes",stage:"Ground",
line:"Every piece of data you will ever hold is one of five containers. Learn what each is for and the rest of the language becomes navigation.",
bullets:["Numbers, and where floating point bites","Text, and the three things you do to it","Lists — ordered, changeable, the workhorse","Dictionaries — the lookup, and the master scale","Tuples and sets, and when each is the right answer","Mutability, and the trap it sets"],
cards:[

{l:"ORIENT",t:"Five containers",h:"Everything else is <em>arrangement</em>",b:`<p>Python has a small number of built-in types. Five carry almost all analysis work.</p>
<div class="dt"><table>
<tr><th>Type</th><th>Looks like</th><th>Holds</th></tr>
<tr><td><code>int</code> / <code>float</code></td><td><code>90</code> · <code>0.024</code></td><td>A single number, whole or decimal</td></tr>
<tr><td><code>str</code></td><td><code>"BBB-"</code></td><td>Text</td></tr>
<tr><td><code>list</code></td><td><code>[1, 2, 3]</code></td><td>An ordered sequence you can change</td></tr>
<tr><td><code>dict</code></td><td><code>{"grade": 5}</code></td><td>A lookup from key to value</td></tr>
<tr><td><code>tuple</code></td><td><code>(1, 2)</code></td><td>An ordered sequence you cannot change</td></tr>
</table></div>
<p>A sixth, <code>set</code>, appears occasionally and is worth one card.</p>
<div class="note">A pandas DataFrame is not on this list. It is built from these, and Mission 05 introduces it. Everything here is the layer underneath.</div>`},

{l:"TRAP",t:"Floating point",h:"Money and decimals do not <em>mix</em>",b:`<p>Computers store decimals in binary, and most decimal fractions have no exact binary representation. The consequences look absurd until you know why.</p>
<div class="code" data-cap="python"><pre>
print(0.1 + 0.2)
print(0.1 + 0.2 == 0.3)
</pre></div>
<div class="code out" data-cap="output"><pre>
0.30000000000000004
False
</pre></div>
<p>This is not a Python defect. It is how binary floating point works everywhere, including in spreadsheets, which merely hide it better.</p>
<div class="three">
<div><b>Never test equality on floats</b>Compare with a tolerance, or round first</div>
<div><b>Round at the end</b>Not at each step, or the errors compound</div>
<div><b>Reconciliations need a tolerance</b>A "difference" of 0.0000001 is noise, not a break</div>
</div>
<div class="code" data-cap="python"><pre>
difference = abs(risk_total - finance_total)
if difference &lt; 1.0:            # tolerance in currency units
    print("reconciled")
</pre></div>
<div class="note">This is why every reconciliation specification names a tolerance. It is not laxity &mdash; an exact-equality reconciliation on floating point numbers will break on arithmetic noise.</div>`},

{l:"MOVE",t:"Text",h:"Three operations you will do a <em>thousand</em> times",b:`<p>Real loan data is full of dirty text: trailing spaces, inconsistent case, embedded codes.</p>
<div class="code" data-cap="python"><pre>
grade = "  bbb- "

print(grade.strip())              # remove surrounding whitespace
print(grade.strip().upper())      # and uppercase it
print(grade.strip().startswith("B"))
</pre></div>
<div class="code out" data-cap="output"><pre>
bbb-
BBB-
False
</pre></div>
<p>The third result is <code>False</code> because <code>startswith</code> is case sensitive and the string is still lowercase at that point. Order matters in a chain.</p>
<p><span class="k">f-strings</span> build text from values, and are the only string formatting worth learning:</p>
<div class="code" data-cap="python"><pre>
borrower = "ACME Manufacturing"
ead = 3800000

print(f"{borrower}: exposure {ead:,} at default")
print(f"Loss rate {0.024 * 0.45:.2%}")
</pre></div>
<div class="code out" data-cap="output"><pre>
ACME Manufacturing: exposure 3,800,000 at default
Loss rate 1.08%
</pre></div>
<div class="note">The format specifiers earn their keep: <code>:,</code> inserts thousands separators, <code>:.2%</code> multiplies by 100 and appends a percent sign to two decimals, <code>:.2f</code> fixes two decimal places.</div>`},

{l:"MECHANISM",t:"Lists",h:"Ordered, indexed from <em>zero</em>",b:`<p>A <span class="k">list</span> is an ordered, changeable sequence. It is the default container for "several of something".</p>
<div class="code" data-cap="python"><pre>
grades = ["AAA", "AA", "A", "BBB", "BB", "B", "D"]

print(grades[0])       # first
print(grades[-1])      # last
print(grades[1:4])     # from 1, up to but NOT including 4
print(len(grades))
</pre></div>
<div class="code out" data-cap="output"><pre>
AAA
D
['AA', 'A', 'BBB']
7
</pre></div>
<p>Two rules cause most off-by-one errors and both are worth memorising:</p>
<div class="two">
<div><b>Indexing starts at zero</b>The first element is <code>[0]</code>. The seventh is <code>[6]</code></div>
<div><b>Slices exclude the end</b><code>[1:4]</code> gives elements 1, 2 and 3. The length of a slice is always <code>end &minus; start</code></div>
</div>
<div class="code" data-cap="python"><pre>
grades.append("CCC")       # add to the end
grades.insert(0, "AAA+")   # add at a position
grades.remove("D")         # remove by value
</pre></div>`},

{l:"MECHANISM",t:"Dictionaries",h:"The lookup, and the <em>master scale</em>",b:`<p>A <span class="k">dict</span> maps keys to values. It is how you express any lookup table in Python, and a credit master scale is exactly that: a rating grade mapped to a probability of default.</p>
<div class="code" data-cap="python"><pre>
master_scale = {
    1: 0.0003,
    2: 0.0010,
    3: 0.0025,
    4: 0.0065,
    5: 0.0160,
    6: 0.0390,
    7: 0.0950,
}

print(master_scale[5])
print(master_scale.get(9, None))     # missing key, no crash
</pre></div>
<div class="code out" data-cap="output"><pre>
0.016
None
</pre></div>
<p><code>master_scale[9]</code> would raise a <code>KeyError</code>. <code>.get()</code> returns a fallback instead, which is what you want whenever the key might legitimately be absent — an unrated exposure, a new product code.</p>
<div class="code" data-cap="python"><pre>
for grade, pd_rate in master_scale.items():
    print(f"Grade {grade}: {pd_rate:.2%}")
</pre></div>
<div class="note">Dictionaries preserve insertion order. This has been guaranteed since Python 3.7, so iterating a dict gives a predictable sequence.</div>`},

{l:"DEFINE",t:"Tuples and sets",h:"Two narrower <em>tools</em>",b:`<div class="two">
<div><b>Tuple &mdash; ordered, unchangeable</b>Written with parentheses. Used for a fixed group that belongs together: a coordinate, a date range, a function returning two values</div>
<div><b>Set &mdash; unordered, unique</b>Written with braces. Used for membership testing and for finding what is in one collection and not another</div>
</div>
<div class="code" data-cap="python"><pre>
window = (2026, 3, 31)          # tuple: a fixed as-at date

risk_ids    = {"L001", "L002", "L003", "L004"}
finance_ids = {"L002", "L003", "L005"}

print(risk_ids - finance_ids)          # in risk, missing from finance
print(finance_ids - risk_ids)          # in finance, missing from risk
print(risk_ids &amp; finance_ids)          # matched on both sides
</pre></div>
<div class="code out" data-cap="output"><pre>
{'L001', 'L004'}
{'L005'}
{'L002', 'L003'}
</pre></div>
<div class="note">That is a reconciliation in three lines. Set difference answers "what is in one system and not the other" faster than any join, and it is the right tool for a quick break analysis before you build the proper one.</div>`},

{l:"TRAP",t:"Mutability",h:"Two names, one <em>object</em>",b:`<p>Lists and dicts are <strong>mutable</strong> — they can be changed in place. Assigning one to a new name does not copy it; it creates a second label for the same object.</p>
<div class="code" data-cap="python"><pre>
original = ["AAA", "AA", "A"]
backup   = original          # NOT a copy

backup.append("BBB")
print(original)
</pre></div>
<div class="code out" data-cap="output"><pre>
['AAA', 'AA', 'A', 'BBB']
</pre></div>
<p>The "backup" modified the original, because there was only ever one list. To actually copy:</p>
<div class="code" data-cap="python"><pre>
backup = original.copy()         # or list(original)
</pre></div>
<p>Numbers, strings and tuples are <strong>immutable</strong> and cannot be caught this way. Only mutable containers behave like this.</p>
<div class="note">This is the source of the most baffling class of bug in Python: a value changes and nothing in the visible code changed it. Whenever that happens, look for two names bound to one mutable object.</div>`},

{l:"CHEAT",t:"Picking a container",h:"The decision in one <em>pass</em>",b:`<div class="sheet"><div class="h">Which shape</div>
<div class="r"><b>Several things, order matters, will change</b><span><code>list</code></span></div>
<div class="r"><b>Lookup from a key to a value</b><span><code>dict</code></span></div>
<div class="r"><b>A fixed group that belongs together</b><span><code>tuple</code></span></div>
<div class="r"><b>Membership, uniqueness, difference</b><span><code>set</code></span></div>
<div class="r"><b>A whole table of rows and columns</b><span>pandas DataFrame &mdash; Mission 05</span></div>
<div class="r"><b>Thousands of numbers to calculate on</b><span>numpy array &mdash; Mission 04</span></div>
</div>
<p>The last two matter more than they look. A list of 500,000 exposures works and is roughly a hundred times slower than the array or frame equivalent, and every operation on it needs a loop you write yourself.</p>`},

{l:"RECALL",t:"Mission 02",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Floats are approximate</b><span>Never test equality. Every reconciliation needs a tolerance</span></div>
<div class="r"><b><code>.strip()</code>, <code>.upper()</code>, f-strings</b><span>The three text operations that carry real data cleaning</span></div>
<div class="r"><b>Index from zero, slices exclude the end</b><span><code>[1:4]</code> gives three elements. Slice length is end minus start</span></div>
<div class="r"><b><code>dict</code> is a lookup table</b><span>A master scale is a dict. Use <code>.get()</code> when the key may be absent</span></div>
<div class="r"><b>Set difference is a reconciliation</b><span>Three lines to answer what is in one system and not the other</span></div>
<div class="r"><b>Assignment does not copy</b><span>Mutable containers get two names and one object. Use <code>.copy()</code></span></div>
</div>`}
]},

/* ============ 03 ============ */
{n:"03",title:"Control and functions",stage:"Ground",
line:"Decisions, repetition, and packaging work so it can be reused — the last of the language before the data stack begins.",
bullets:["if / elif / else, and the DPD bucket","Loops, and why you will use them less than you expect","Comprehensions — the pattern that replaces most loops","Functions, arguments and return","Why a function beats a copied block","Reading a file without pandas, once"],
cards:[

{l:"MECHANISM",t:"Conditions",h:"The bucket, written <em>out</em>",b:`<p><code>if</code> runs a block when a condition is true. <code>elif</code> tests another condition only if the previous ones failed. <code>else</code> catches everything left.</p>
<div class="code" data-cap="python"><pre>
dpd = 74

if dpd == 0:
    bucket = "Current"
elif dpd &lt;= 30:
    bucket = "SMA-0"
elif dpd &lt;= 60:
    bucket = "SMA-1"
elif dpd &lt;= 90:
    bucket = "SMA-2"
else:
    bucket = "NPA"

print(bucket)
</pre></div>
<div class="code out" data-cap="output"><pre>
SMA-2
</pre></div>
<p>Two structural points. The <strong>colon and the indentation</strong> define the block — there are no braces. And <strong>order matters</strong>: because <code>elif</code> only runs when everything above failed, <code>dpd &lt;= 60</code> already implies <code>dpd &gt; 30</code>. Writing the ranges as compound conditions would be redundant.</p>
<div class="note">That ladder is the Indian delinquency classification. <strong>DPD</strong> is days past due &mdash; how long a payment has been overdue. <strong>SMA</strong> means special mention account, the early-warning tier below impairment. <strong>NPA</strong> means non-performing asset: once a payment is more than 90 days overdue, the loan is formally classified as non-performing. It is the most-written <code>if</code> chain in retail credit.</div>`},

{l:"DEFINE",t:"Comparison and logic",h:"The operators, and the <em>subtle</em> one",b:`<div class="dt"><table>
<tr><th>Operator</th><th>Meaning</th></tr>
<tr><td><code>==</code> <code>!=</code></td><td>Equal, not equal. <strong>Two</strong> equals signs &mdash; one is assignment</td></tr>
<tr><td><code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code></td><td>Ordering</td></tr>
<tr><td><code>and</code> <code>or</code> <code>not</code></td><td>Combine conditions</td></tr>
<tr><td><code>in</code></td><td>Membership. <code>if grade in ["D", "LOSS"]</code></td></tr>
<tr><td><code>is</code></td><td><strong>Identity, not equality.</strong> Only correct for <code>None</code>, <code>True</code>, <code>False</code></td></tr>
</table></div>
<p>The distinction between <code>==</code> and <code>is</code> catches people. <code>==</code> asks whether two values are equal; <code>is</code> asks whether they are the same object in memory. For checking a missing value, <code>is None</code> is correct and <code>== None</code> is not.</p>
<div class="code" data-cap="python"><pre>
if collateral_value is None:
    recognised = 0
</pre></div>
<div class="note">Python also treats empty things as false: an empty list, an empty string, zero and <code>None</code> all fail an <code>if</code>. Convenient, and occasionally a trap when a legitimate zero exposure gets skipped by <code>if exposure:</code>.</div>`},

{l:"MECHANISM",t:"Loops",h:"Repetition, and its <em>limits</em>",b:`<p><code>for</code> walks through a sequence, one item at a time.</p>
<div class="code" data-cap="python"><pre>
exposures = [1200000, 850000, 3400000, 220000]
total = 0

for e in exposures:
    total = total + e

print(total)
</pre></div>
<div class="code out" data-cap="output"><pre>
5670000
</pre></div>
<p>Useful to understand, and <strong>you should almost never write this</strong> for data work. Two better answers exist: <code>sum(exposures)</code> for a plain list, and a vectorised operation once the data is in numpy or pandas.</p>
<div class="two">
<div><b>Loop when</b>Each step depends on the last, or you are calling something external per item &mdash; an API, a file</div>
<div><b>Vectorise when</b>The same operation applies independently to every element. This is nearly always the case in analysis</div>
</div>
<div class="note">A loop over 500,000 rows in Python takes seconds. The same calculation vectorised takes milliseconds. Mission 04 shows why, and it is not a small difference.</div>`},

{l:"MOVE",t:"Comprehensions",h:"One line where a loop had <em>four</em>",b:`<p>A <span class="k">comprehension</span> builds a list from another sequence in a single expression. It is the most characteristically Python thing in this pack.</p>
<div class="code" data-cap="python"><pre>
exposures = [1200000, 850000, 3400000, 220000]

# every exposure, converted to a loss at 1.08%
losses = [e * 0.0108 for e in exposures]

# only the large ones
large = [e for e in exposures if e &gt; 1000000]

# both at once
large_losses = [e * 0.0108 for e in exposures if e &gt; 1000000]

print(losses)
print(large)
print(large_losses)
</pre></div>
<div class="code out" data-cap="output"><pre>
[12960.0, 9180.0, 36720.0, 2376.0]
[1200000, 3400000]
[12960.0, 36720.0]
</pre></div>
<p>Read it left to right as: <em>the expression</em>, for each item, optionally where a condition holds.</p>
<div class="note">Dictionary comprehensions use the same shape with braces and a colon: <code>{k: v * 2 for k, v in scale.items()}</code>. Worth knowing because master scales get rescaled constantly.</div>`},

{l:"MECHANISM",t:"Functions",h:"Naming a piece of <em>work</em>",b:`<p>A <span class="k">function</span> packages a block of code under a name so it can be run repeatedly with different inputs.</p>
<div class="code" data-cap="python"><pre>
def expected_loss(exposure, pd_rate, lgd):
    """Expected loss for a single facility."""
    return exposure * pd_rate * lgd


print(expected_loss(3800000, 0.024, 0.45))
print(expected_loss(1200000, 0.039, 0.60))
</pre></div>
<div class="code out" data-cap="output"><pre>
41040.0
28080.0
</pre></div>
<div class="lay">
<div><span>1</span><strong><code>def</code></strong> begins the definition, followed by the name and the parameters in parentheses.</div>
<div><span>2</span><strong>The docstring</strong> in triple quotes says what it does. Optional to Python, not optional in practice.</div>
<div><span>3</span><strong><code>return</code></strong> sends a value back. A function with no <code>return</code> hands back <code>None</code>.</div>
</div>
<p>Default values let a parameter be omitted:</p>
<div class="code" data-cap="python"><pre>
def expected_loss(exposure, pd_rate, lgd=0.45):
    return exposure * pd_rate * lgd

print(expected_loss(3800000, 0.024))       # lgd defaults
</pre></div>`},

{l:"WHY",t:"Why not just copy the block",h:"One definition, one place to be <em>wrong</em>",b:`<p>The argument for functions is not elegance. It is that a calculation copied into six cells is six things to update when the methodology changes, and you will miss one.</p>
<div class="two">
<div><b>Copied block</b>Six copies of the loss calculation. The downturn LGD assumption changes. Five get updated. The sixth quietly reports last quarter's number for a year</div>
<div><b>Function</b>One definition. Change it once. Every caller is correct immediately, including the ones you forgot about</div>
</div>
<p>The second argument is testability. A function can be checked against a known answer; a block buried in a notebook cell cannot.</p>
<div class="code" data-cap="python"><pre>
# a check you can actually run
assert expected_loss(1000000, 0.02, 0.45) == 9000
</pre></div>
<div class="note"><code>assert</code> raises an error if the condition is false and does nothing if it is true. Three of these at the top of a notebook catch a broken function before it silently produces a wrong report.</div>`},

{l:"MOVE",t:"Reading a file, once",h:"So you know what pandas is <em>doing</em>",b:`<p>You will use pandas for every file after this. Doing it once by hand makes the abstraction legible rather than magical.</p>
<div class="code" data-cap="python"><pre>
total = 0
count = 0

with open("loans.csv") as f:
    header = f.readline()                  # consume the header row
    for line in f:
        parts = line.strip().split(",")
        exposure = float(parts[3])         # 4th column, as a number
        total += exposure
        count += 1

print(count, total)
</pre></div>
<div class="code out" data-cap="output"><pre>
48219 15872340000.0
</pre></div>
<p><code>with</code> opens the file and guarantees it is closed afterwards, even if the code inside fails. <code>+=</code> is shorthand for "add to what is already there".</p>
<div class="note">Everything fragile about this is what pandas removes: the hard-coded column position, the manual <code>float()</code>, the assumption that no field contains a comma. One line of <code>read_csv</code> replaces all of it &mdash; which is Mission 05.</div>`},

{l:"RECALL",t:"Mission 03",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Colon and indentation define a block</b><span>No braces. Indentation is structural, not cosmetic</span></div>
<div class="r"><b><code>elif</code> implies everything above failed</b><span>Which is why a DPD ladder needs only one bound per rung</span></div>
<div class="r"><b><code>is</code> for <code>None</code>, <code>==</code> for values</b><span>Identity against equality</span></div>
<div class="r"><b>Comprehensions replace most loops</b><span>expression &middot; for item &middot; optional condition</span></div>
<div class="r"><b><code>def</code> … <code>return</code></b><span>One definition means one place to be wrong when methodology changes</span></div>
<div class="r"><b><code>assert</code> checks a known answer</b><span>The cheapest defence against a silently broken calculation</span></div>
</div>
<div class="note">The language is now behind you. Everything from here is the data stack, and every card from here operates on a loan book.</div>`}
]},
/* ============ 04 ============ */
{n:"04",title:"Arrays and vectorisation",stage:"Numbers",
line:"Why the same calculation is a hundred times faster written differently, and the array operations that underpin everything pandas does.",
bullets:["What an array is, and why it is fast","Vectorisation, measured","Broadcasting","np.where — the conditional, vectorised","Aggregations along an axis","NaN, and how it propagates"],
cards:[

{l:"WHY",t:"The speed problem",h:"A loop over 500,000 rows is <em>seconds</em>",b:`<p>A Python list can hold anything, so every element carries type information and the interpreter must check it on every operation. A <span class="k">numpy array</span> holds one type in one contiguous block of memory, so the loop runs in compiled C rather than in Python.</p>
<div class="code" data-cap="python"><pre>
import numpy as np
import time

exposures = list(range(500_000))

t0 = time.time()
losses = [e * 0.0108 for e in exposures]
t1 = time.time()

arr = np.array(exposures)
t2 = time.time()
losses_arr = arr * 0.0108
t3 = time.time()

print(f"list  {t1 - t0:.4f}s")
print(f"array {t3 - t2:.4f}s")
</pre></div>
<div class="code out" data-cap="output"><pre>
list  0.0412s
array 0.0009s
</pre></div>
<p>Roughly forty times, on this machine, on this trivial operation. On a real calculation with several steps the gap widens, and on a full loan book it is the difference between a report that runs and one that does not.</p>
<div class="note">Timings are indicative and machine-dependent. The order of magnitude is not &mdash; vectorised numeric work is consistently one to two orders faster than element-wise Python.</div>`},

{l:"MECHANISM",t:"Creating arrays",h:"Four ways you will actually <em>use</em>",b:`<div class="code" data-cap="python"><pre>
import numpy as np

pd_grades = np.array([0.0003, 0.0010, 0.0025, 0.0065, 0.0160])

zeros   = np.zeros(5)              # five zeros
ones    = np.ones(5)               # five ones
steps   = np.arange(0, 1.01, 0.25) # 0 to 1 in steps of 0.25
spread  = np.linspace(0, 1, 5)     # 5 evenly spaced points, 0 to 1

print(pd_grades)
print(steps)
print(spread)
print(pd_grades.dtype, pd_grades.shape)
</pre></div>
<div class="code out" data-cap="output"><pre>
[0.0003 0.001  0.0025 0.0065 0.016 ]
[0.   0.25 0.5  0.75 1.  ]
[0.   0.25 0.5  0.75 1.  ]
64 (5,)
</pre></div>
<p>Two attributes are checked constantly. <code>.dtype</code> is the single type every element shares. <code>.shape</code> is a tuple of dimensions — <code>(5,)</code> is a flat array of five, <code>(5, 3)</code> is five rows by three columns.</p>
<div class="note"><code>arange</code> excludes its endpoint, which is why <code>1.01</code> appears above to include 1.0. <code>linspace</code> includes both ends and takes a count instead of a step. Use <code>linspace</code> when the endpoints matter.</div>`},

{l:"MECHANISM",t:"Vectorised arithmetic",h:"No loop, element by <em>element</em>",b:`<p>An operation between two arrays applies element-wise, in position order.</p>
<div class="code" data-cap="python"><pre>
ead = np.array([3_800_000, 1_200_000,  850_000, 3_400_000])
pd_ = np.array([     0.024,     0.039,    0.012,     0.008])
lgd = np.array([      0.45,      0.60,     0.35,      0.45])

el = ead * pd_ * lgd
print(el)
print(el.sum())
print(el.sum() / ead.sum())
</pre></div>
<div class="code out" data-cap="output"><pre>
[41040.  28080.   3570.  12240.]
84930.0
0.009284836065573771
</pre></div>
<p>Three multiplications applied across four facilities with no loop written. The last line is the portfolio expected loss rate — total expected loss over total exposure, 0.93%.</p>
<div class="fx"><div class="cap">What that code computed</div>
<div class="eq"><em>EL</em><sub>portfolio</sub> = <span class="fr"><i>&Sigma; <em>EAD</em><sub>i</sub> &times; <em>PD</em><sub>i</sub> &times; <em>LGD</em><sub>i</sub></i><i>&Sigma; <em>EAD</em><sub>i</sub></i></span></div>
<div class="wh">EAD&nbsp;exposure at default, per facility<br>
PD&nbsp;&nbsp;probability of default over one year<br>
LGD&nbsp;loss given default &mdash; the share not recovered<br>
The result is an exposure-weighted loss rate, not a simple average of the four rates</div></div>
<div class="note">Note what the weighting does. The simple average of the four loss rates is 1.03%; the exposure-weighted rate is 0.93%. Reporting the wrong one is a live error in portfolio packs.</div>`},

{l:"DEFINE",t:"Broadcasting",h:"When shapes do not <em>match</em>",b:`<p>Operating on arrays of different shapes works when numpy can stretch the smaller one to fit. This is <span class="k">broadcasting</span>.</p>
<div class="code" data-cap="python"><pre>
ead = np.array([3_800_000, 1_200_000, 850_000])

print(ead * 0.45)          # scalar broadcast across all three

haircuts = np.array([[0.00], [0.15], [0.25]])   # 3 rows, 1 column
values   = np.array([100, 200, 300])            # 3 values

print(values * (1 - haircuts))
</pre></div>
<div class="code out" data-cap="output"><pre>
[1710000.  540000.  382500.]
[[100.  200.  300. ]
 [ 85.  170.  255. ]
 [ 75.  150.  225. ]]
</pre></div>
<p>The second result is every collateral value at every haircut level — a three-by-three grid produced from two one-dimensional inputs. That is a sensitivity table in one line.</p>
<div class="note">The rule: dimensions are compared from the right, and are compatible when equal or when one of them is 1. A shape mismatch that is not broadcastable raises <code>ValueError: operands could not be broadcast together</code>, and the message names both shapes.</div>`},

{l:"MOVE",t:"np.where",h:"The conditional, <em>vectorised</em>",b:`<p>An <code>if</code> statement works on one value. <code>np.where</code> applies the same logic across an entire array at once, and it is the single most used numpy function in credit work.</p>
<div class="code" data-cap="python"><pre>
dpd = np.array([0, 12, 45, 74, 120, 200])

# one condition
stage = np.where(dpd &gt; 90, "Stage 3", "Stage 1")
print(stage)

# nested, for the full ladder
bucket = np.where(dpd == 0,  "Current",
         np.where(dpd &lt;= 30, "SMA-0",
         np.where(dpd &lt;= 60, "SMA-1",
         np.where(dpd &lt;= 90, "SMA-2", "NPA"))))
print(bucket)
</pre></div>
<div class="code out" data-cap="output"><pre>
['Stage 1' 'Stage 1' 'Stage 1' 'Stage 1' 'Stage 3' 'Stage 3']
['Current' 'SMA-0' 'SMA-1' 'SMA-2' 'NPA' 'NPA']
</pre></div>
<p>Read it as: condition, value if true, value if false. Nesting puts the next test in the false branch, exactly like <code>elif</code>.</p>
<div class="note">Nesting beyond three levels becomes unreadable. Past that, use <code>np.select</code> with a list of conditions and a list of results, or <code>pd.cut</code> once the data is in a DataFrame &mdash; Mission 08.</div>`},

{l:"MECHANISM",t:"Aggregating",h:"Down a column or across a <em>row</em>",b:`<div class="code" data-cap="python"><pre>
# rows = facilities, columns = quarters
balances = np.array([
    [1000, 950, 900, 850],
    [ 500, 480, 460, 440],
    [2000, 2100, 2200, 2300],
])

print(balances.sum())            # everything
print(balances.sum(axis=0))      # down the rows: total per quarter
print(balances.sum(axis=1))      # across the columns: total per facility
print(balances.mean(axis=0).round(1))
</pre></div>
<div class="code out" data-cap="output"><pre>
16180
[3500 3530 3560 3590]
[3700 1880 8600]
[1166.7 1176.7 1186.7 1196.7]
</pre></div>
<p>The <code>axis</code> argument is the one thing to get right, and the mnemonic that sticks: <strong>axis is the dimension that disappears</strong>. <code>axis=0</code> collapses the rows and leaves one value per column. <code>axis=1</code> collapses the columns and leaves one value per row.</p>
<div class="note">The same family exists throughout: <code>.mean()</code>, <code>.min()</code>, <code>.max()</code>, <code>.std()</code>, <code>.cumsum()</code>. All take <code>axis</code> and all behave identically with respect to it.</div>`},

{l:"TRAP",t:"NaN",h:"Missing, and <em>contagious</em>",b:`<p><code>np.nan</code> represents a missing numeric value. It propagates through arithmetic: anything touching it becomes NaN.</p>
<div class="code" data-cap="python"><pre>
collateral = np.array([500_000, np.nan, 1_200_000, 300_000])

print(collateral.sum())          # one missing value poisons the total
print(np.nansum(collateral))     # ignores it
print(np.isnan(collateral))
</pre></div>
<div class="code out" data-cap="output"><pre>
nan
2000000.0
[False  True False False]
</pre></div>
<p>And the property that catches everyone: <strong>NaN is not equal to itself</strong>.</p>
<div class="code" data-cap="python"><pre>
print(np.nan == np.nan)      # False, always
</pre></div>
<div class="note">Which is why missing values are tested with <code>np.isnan()</code> and never with <code>== np.nan</code>. Silently summing to NaN is the most common way a portfolio total quietly disappears &mdash; and the second most common is using <code>nansum</code> to hide a data quality problem that should have been raised instead.</div>`},

{l:"RECALL",t:"Mission 04",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Arrays are one type, contiguous, fast</b><span>One to two orders of magnitude over element-wise Python</span></div>
<div class="r"><b>Arithmetic is element-wise</b><span><code>ead * pd * lgd</code> across a whole book, no loop</span></div>
<div class="r"><b>Broadcasting stretches the smaller shape</b><span>Compared from the right; compatible when equal or 1</span></div>
<div class="r"><b><code>np.where(cond, if_true, if_false)</code></b><span>The vectorised conditional. Nest for a ladder, up to about three deep</span></div>
<div class="r"><b>axis is the dimension that disappears</b><span><code>axis=0</code> down the rows, <code>axis=1</code> across the columns</span></div>
<div class="r"><b>NaN propagates and fails equality</b><span>Test with <code>np.isnan()</code>. Never hide it without raising it</span></div>
</div>`}
]},

/* ============ 05 ============ */
{n:"05",title:"Loading the loan book",stage:"Frames",
line:"The DataFrame, the read that never works first time, and the six commands you run on any table before you trust a single number in it.",
bullets:["Series and DataFrame","read_csv, and the arguments that matter","dtypes, and why everything arrives as text","The six-command inspection","Memory, and when a column type matters","Writing back out"],
cards:[

{l:"DEFINE",t:"Series and DataFrame",h:"A column, and a <em>table</em>",b:`<p>Two objects carry everything in pandas.</p>
<div class="two">
<div><b>Series</b>One column. A numpy array plus an index &mdash; labels for each row &mdash; and a name</div>
<div><b>DataFrame</b>A table. A collection of Series sharing one index. Columns may each have a different type</div>
</div>
<div class="code" data-cap="python"><pre>
import pandas as pd

book = pd.DataFrame({
    "loan_id":  ["L001", "L002", "L003", "L004"],
    "borrower": ["ACME Mfg", "Bharat Steel", "Sunrise Textiles", "Delta Foods"],
    "ead":      [3_800_000, 1_200_000, 850_000, 3_400_000],
    "pd_12m":   [0.024, 0.039, 0.012, 0.008],
    "dpd":      [0, 45, 0, 120],
})

print(book)
</pre></div>
<div class="code out" data-cap="output"><pre>
  loan_id          borrower      ead  pd_12m  dpd
0    L001          ACME Mfg  3800000   0.024    0
1    L002      Bharat Steel  1200000   0.039   45
2    L003  Sunrise Textiles   850000   0.012    0
3    L004       Delta Foods  3400000   0.008  120
</pre></div>
<p>The leftmost column is the <span class="k">index</span>, defaulted here to 0,1,2,3. It is not a data column — it is the row label, and it survives filtering, joining and reshaping.</p>
<div class="note">A dict of lists is the fastest way to build a small frame for testing, and every example in this pack that needs data builds one this way so you can run it without a file.</div>`},

{l:"MOVE",t:"read_csv",h:"The arguments that decide whether it <em>works</em>",b:`<div class="code" data-cap="python"><pre>
book = pd.read_csv(
    "loan_book_2026Q1.csv",
    dtype={"loan_id": "str", "branch_code": "str"},   # keep leading zeros
    parse_dates=["origination_date", "maturity_date"],
    na_values=["", "NA", "NULL", "-", "#N/A"],
    thousands=",",
)
</pre></div>
<div class="dt"><table>
<tr><th>Argument</th><th>Why it is there</th></tr>
<tr><td><code>dtype</code></td><td>Forces a column to stay text. Without it, an account number <code>0012345</code> becomes the integer <code>12345</code> and will never join again</td></tr>
<tr><td><code>parse_dates</code></td><td>Converts to real dates on read. Otherwise they arrive as strings and no date arithmetic works</td></tr>
<tr><td><code>na_values</code></td><td>Source systems write missing values a dozen ways. List them or they become text</td></tr>
<tr><td><code>thousands</code></td><td>A formatted number like <code>3,800,000</code> is text until this is set</td></tr>
</table></div>
<p>Two more worth knowing: <code>usecols</code> reads only named columns, which matters on wide extracts, and <code>nrows=1000</code> reads a sample to check the shape before committing to a two-gigabyte file.</p>
<div class="note">The leading-zero problem is the most expensive of these. It is silent, it happens on identifiers, and it is discovered weeks later when a join produces fewer rows than it should.</div>`},

{l:"MOVE",t:"The six-command inspection",h:"Before trusting <em>anything</em>",b:`<p>Run these six, in this order, on every table you receive. Together they answer: what shape, what types, what is missing, what does it look like, what is the spread, and is the grain what you assumed.</p>
<div class="code" data-cap="python"><pre>
print(book.shape)                 # (rows, columns)
print(book.dtypes)                # type of each column
print(book.isna().sum())          # missing count per column
print(book.head())                # first five rows
print(book.describe())            # numeric summary
print(book["loan_id"].nunique())  # distinct keys
</pre></div>
<div class="code out" data-cap="output"><pre>
(48219, 14)

loan_id                     str
ead                       int64
pd_12m                  float64
origination_date  datetime64[us]

loan_id              0
ead                  0
pd_12m             318
collateral_value  9044

48219
</pre></div>
<p>The last line is the one that decides everything downstream. <strong>If <code>nunique()</code> on the key is lower than <code>shape[0]</code>, the grain is not one row per loan</strong> — and every assumption in your analysis is already wrong.</p>
<div class="note">318 missing probabilities and 9,044 missing collateral values are not an error to be silenced. They are a finding, with a count and a population, and Mission 07 covers what to do with each.</div>`},

{l:"DEFINE",t:"dtypes",h:"What each column actually <em>is</em>",b:`<div class="dt"><table>
<tr><th>dtype</th><th>Holds</th><th>Note</th></tr>
<tr><td><code>int64</code></td><td>Whole numbers</td><td>Cannot hold a missing value</td></tr>
<tr><td><code>float64</code></td><td>Decimals</td><td>Can hold NaN. This is why an integer column with one missing value arrives as float</td></tr>
<tr><td><code>str</code></td><td>Text</td><td>New default in pandas 3.0, backed by PyArrow</td></tr>
<tr><td><code>datetime64[us]</code></td><td>Dates and times</td><td>Microsecond resolution by default since 3.0</td></tr>
<tr><td><code>bool</code></td><td>True / False</td><td>Sums as 1 and 0, which makes counting conditions trivial</td></tr>
<tr><td><code>category</code></td><td>Repeated labels</td><td>Stores each distinct value once. Large memory saving on grade and branch columns</td></tr>
</table></div>
<div class="code" data-cap="python"><pre>
book["ead"] = book["ead"].astype("float64")
book["grade"] = book["grade"].astype("category")
book["is_npa"] = book["dpd"] &gt; 90            # bool
print(book["is_npa"].sum())                  # counts the True values
</pre></div>
<div class="note">The boolean trick in the last two lines is used constantly: a condition becomes a column, and summing it counts how many rows satisfy it. Taking the mean gives the proportion.</div>`},

{l:"TRAP",t:"Everything arrives as text",h:"And it will not tell <em>you</em>",b:`<p>A numeric column comes in as text whenever a single row contains something non-numeric — a stray comma, a currency symbol, a footnote marker, the word "NIL".</p>
<div class="code" data-cap="python"><pre>
print(book["ead"].dtype)
print(book["ead"].sum())
</pre></div>
<div class="code out" data-cap="output"><pre>
str
'3800000120000085000034000000...'
</pre></div>
<p>It did not fail. It concatenated. Summing a text column joins the strings end to end and returns something that looks like a very large number.</p>
<div class="code" data-cap="python"><pre>
# find the offenders rather than guessing
bad = pd.to_numeric(book["ead"], errors="coerce").isna() &amp; book["ead"].notna()
print(book.loc[bad, ["loan_id", "ead"]].head())

# then convert, turning genuine failures into NaN
book["ead"] = pd.to_numeric(book["ead"], errors="coerce")
</pre></div>
<div class="note">Always look at the offending rows before coercing. <code>errors="coerce"</code> turns every failure into NaN silently, and if the cause is systematic &mdash; a whole branch writing amounts in lakhs with a suffix &mdash; you have just deleted a branch instead of fixing a format.</div>`},

{l:"MECHANISM",t:"Writing out",h:"Three formats, three <em>uses</em>",b:`<div class="code" data-cap="python"><pre>
book.to_csv("book_clean.csv", index=False)
book.to_parquet("book_clean.parquet")
book.to_excel("book_summary.xlsx", index=False, sheet_name="Portfolio")
</pre></div>
<div class="three">
<div><b>CSV</b>Universal, readable, loses every dtype. Fine for handover, wrong for a pipeline step</div>
<div><b>Parquet</b>Compressed, columnar, keeps dtypes exactly. The right choice for anything you will read back</div>
<div><b>Excel</b>What stakeholders ask for. Slow and size-limited, but it ends arguments</div>
</div>
<p><code>index=False</code> matters more than it looks. Without it, the row index is written as an unnamed first column, and reading the file back produces a stray <code>Unnamed: 0</code> that then propagates into every downstream join.</p>
<div class="note">A parquet round-trip preserves categories, datetimes and nullable integers. A CSV round-trip does not, which is why a clean file re-read from CSV often needs re-cleaning.</div>`},

{l:"RECALL",t:"Mission 05",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Series is a column, DataFrame is a table</b><span>The index is a row label, not a data column</span></div>
<div class="r"><b><code>dtype=</code> on identifiers</b><span>Or leading zeros vanish and the join fails silently, weeks later</span></div>
<div class="r"><b>The six-command inspection</b><span>shape · dtypes · isna().sum() · head · describe · nunique on the key</span></div>
<div class="r"><b>nunique below row count means wrong grain</b><span>Stop and resolve it before anything else</span></div>
<div class="r"><b>Summing a text column concatenates</b><span>It does not error. Check the dtype</span></div>
<div class="r"><b>Parquet for pipelines, CSV for handover</b><span>And always <code>index=False</code></span></div>
</div>`}
]},

/* ============ 06 ============ */
{n:"06",title:"Selecting and filtering",stage:"Frames",
line:"Getting to the rows you want — the one indexing method worth learning properly, boolean masks, and the assignment rule that changed in pandas 3.0.",
bullets:["Columns, one and several","loc and iloc, and which to use","Boolean masks","Combining conditions, and the bracket rule","isin, between, query","Assignment under Copy-on-Write"],
cards:[

{l:"MECHANISM",t:"Columns",h:"One returns a Series, several return a <em>frame</em>",b:`<div class="code" data-cap="python"><pre>
ead = book["ead"]                       # Series
subset = book[["loan_id", "ead", "dpd"]]  # DataFrame

print(type(ead))
print(type(subset))
print(ead.head(3))
</pre></div>
<div class="code out" data-cap="output"><pre>
&lt;class 'pandas.core.series.Series'&gt;
&lt;class 'pandas.core.frame.DataFrame'&gt;
0    3800000
1    1200000
2     850000
Name: ead, dtype: int64
</pre></div>
<p>The double brackets are not a typo. The inner brackets are a <em>list of column names</em>; the outer are the selection. One name gives a Series, a list of names gives a DataFrame — even a list of one.</p>
<div class="note">This distinction matters because Series and DataFrame have different methods. Passing a Series where a frame is expected produces an error that names neither, and the cause is almost always a missing pair of brackets.</div>`},

{l:"DEFINE",t:"loc and iloc",h:"Labels against <em>positions</em>",b:`<div class="two">
<div><b><code>.loc[rows, cols]</code></b>Selects by <strong>label</strong>. Row index values and column names. Slices are <strong>inclusive</strong> of the endpoint</div>
<div><b><code>.iloc[rows, cols]</code></b>Selects by <strong>integer position</strong>. Slices exclude the endpoint, like ordinary Python</div>
</div>
<div class="code" data-cap="python"><pre>
print(book.loc[0, "ead"])              # row labelled 0, column named ead
print(book.loc[0:2, ["loan_id","ead"]])  # rows 0,1,2 — INCLUSIVE
print(book.iloc[0, 2])                 # first row, third column
print(book.iloc[0:2])                  # first two rows — exclusive
</pre></div>
<p>Use <code>.loc</code> for essentially everything. <code>.iloc</code> is for the narrow case where position genuinely is the meaning — the first row, the last five, a random sample.</p>
<div class="note">The inclusive slice on <code>.loc</code> is deliberate and catches people. <code>loc[0:2]</code> returns three rows; <code>iloc[0:2]</code> returns two. Label slicing includes both ends because a label range is a range of names, not of offsets.</div>`},

{l:"MOVE",t:"Boolean masks",h:"The filter that does everything <em>else</em>",b:`<p>A comparison against a column produces a Series of True and False, one per row. Passing that back into the frame keeps only the True rows.</p>
<div class="code" data-cap="python"><pre>
mask = book["dpd"] &gt; 90
print(mask.head())

npa = book[mask]
print(len(npa))

# usually written in one line
npa = book[book["dpd"] &gt; 90]
</pre></div>
<div class="code out" data-cap="output"><pre>
0    False
1    False
2    False
3     True
Name: dpd, dtype: bool

1847
</pre></div>
<p>The mask is a first-class object. It can be stored, inverted with <code>~</code>, combined, counted and reused — which is what makes this pattern flexible rather than just terse.</p>
<div class="code" data-cap="python"><pre>
print(mask.sum())            # how many
print(mask.mean())           # what proportion
print(book[~mask].shape)     # everything else
</pre></div>`},

{l:"TRAP",t:"Combining conditions",h:"Different operators, and the brackets are <em>mandatory</em>",b:`<p>Combining masks uses <code>&amp;</code>, <code>|</code> and <code>~</code> — not <code>and</code>, <code>or</code> and <code>not</code>. And <strong>every condition must be parenthesised</strong>, because <code>&amp;</code> binds tighter than <code>&gt;</code>.</p>
<div class="code" data-cap="python"><pre>
# correct
stressed = book[(book["dpd"] &gt; 30) &amp; (book["ead"] &gt; 1_000_000)]

# missing brackets — raises
stressed = book[book["dpd"] &gt; 30 &amp; book["ead"] &gt; 1_000_000]
</pre></div>
<div class="code out" data-cap="output"><pre>
TypeError: Cannot perform 'rand_' with a dtyped [int64] array
and scalar of type [bool]
</pre></div>
<p>The word forms fail differently and more confusingly:</p>
<div class="code out" data-cap="output"><pre>
ValueError: The truth value of a Series is ambiguous.
Use a.empty, a.bool(), a.item(), a.any() or a.all()
</pre></div>
<p>That message means Python tried to reduce a whole column of True and False to one value and refused to guess. It is the single most common pandas error.</p>
<div class="note">Rule to carry: <strong>symbols not words, and brackets around every condition.</strong> There is no case where the word form is correct on a Series.</div>`},

{l:"CHEAT",t:"The other four filters",h:"Beyond greater and <em>less</em>",b:`<div class="code" data-cap="python"><pre>
# membership
book[book["grade"].isin(["D", "LOSS"])]

# range, inclusive both ends
book[book["dpd"].between(31, 60)]

# missing / present
book[book["collateral_value"].isna()]
book[book["collateral_value"].notna()]

# text matching
book[book["borrower"].str.contains("Steel", case=False, na=False)]
book[book["branch_code"].str.startswith("MH")]

# a readable alternative for long conditions
book.query("dpd &gt; 30 and ead &gt; 1_000_000 and grade != 'D'")
</pre></div>
<div class="dt"><table>
<tr><th>Method</th><th>Use</th></tr>
<tr><td><code>.isin(list)</code></td><td>Any of several values. Replaces a chain of <code>|</code></td></tr>
<tr><td><code>.between(a, b)</code></td><td>Range, inclusive both ends by default</td></tr>
<tr><td><code>.str.*</code></td><td>Any string method, applied down a column. Always set <code>na=False</code></td></tr>
<tr><td><code>.query()</code></td><td>Conditions as a string, using <code>and</code>/<code>or</code>. Readable for long filters</td></tr>
</table></div>
<div class="note"><code>na=False</code> on <code>.str.contains</code> is not optional. Without it, missing values return NaN rather than False, and NaN in a boolean mask raises rather than filtering.</div>`},

{l:"TRAP",t:"Assignment",h:"What pandas 3.0 <em>changed</em>",b:`<p>Before 3.0, whether an assignment reached the original frame depended on the exact chain of operations. It sometimes worked, sometimes silently did nothing, and warned inconsistently.</p>
<p>Under Copy-on-Write, the rule is now absolute: <strong>every indexing operation returns something that behaves as a copy</strong>. Chained assignment therefore never reaches the original.</p>
<div class="code" data-cap="python"><pre>
# does nothing to book. no warning. pandas 3.0
book[book["dpd"] &gt; 90]["stage"] = 3

# correct: one operation, .loc with both axes
book.loc[book["dpd"] &gt; 90, "stage"] = 3
</pre></div>
<p>The shape to memorise is <code>.loc[mask, column] = value</code> — the row selector and the column selector inside one pair of brackets.</p>
<div class="code" data-cap="python"><pre>
book.loc[book["dpd"] == 0, "stage"] = 1
book.loc[book["dpd"].between(1, 90), "stage"] = 2
book.loc[book["dpd"] &gt; 90, "stage"] = 3
print(book["stage"].value_counts().sort_index())
</pre></div>
<div class="code out" data-cap="output"><pre>
stage
1    41205
2     5167
3     1847
</pre></div>
<div class="note">The corresponding good news: defensive <code>.copy()</code> calls are no longer needed, and <code>SettingWithCopyWarning</code> no longer exists. Any tutorial telling you to add <code>.copy()</code> to silence it predates January 2026.</div>`},

{l:"RECALL",t:"Mission 06",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>One name gives a Series, a list gives a frame</b><span>Double brackets are a list, not a typo</span></div>
<div class="r"><b><code>.loc</code> by label, <code>.iloc</code> by position</b><span><code>.loc</code> slices are inclusive at both ends</span></div>
<div class="r"><b>A mask is an object</b><span>Store it, invert with <code>~</code>, sum it for a count, mean it for a proportion</span></div>
