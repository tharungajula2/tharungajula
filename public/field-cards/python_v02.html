<div class="r"><b><code>&amp;</code> <code>|</code> <code>~</code> with brackets around every condition</b><span>Never the word forms. This is the commonest pandas error</span></div>
<div class="r"><b><code>.isin</code> <code>.between</code> <code>.str.*</code> <code>.query</code></b><span>And always <code>na=False</code> on string matching</span></div>
<div class="r"><b><code>.loc[mask, col] = value</code></b><span>The only assignment form that works under Copy-on-Write</span></div>
</div>`}
]},
/* ============ 07 ============ */
{n:"07",title:"Cleaning",stage:"Frames",
line:"Real loan data arrives broken. The six things that are wrong with it, in the order you should fix them, and how to record what you did.",
bullets:["Missing values — count, understand, then decide","Duplicates, and the ones that matter","Type repair","Text standardisation","Outliers, and the difference from errors","A quality report you can hand over"],
cards:[

{l:"ORIENT",t:"Order of operations",h:"Fix in the right <em>sequence</em>",b:`<p>Cleaning steps interact. Deduplicating before repairing types can keep the wrong row; imputing before deduplicating fills values that then get discarded.</p>
<div class="flow">
<div class="n"><b>1. Profile</b>Count everything before changing anything. This is the evidence you will cite later</div>
<div class="a">&#8595;</div>
<div class="n"><b>2. Types</b>Numbers numeric, dates dates, identifiers text</div>
<div class="a">&#8595;</div>
<div class="n"><b>3. Text</b>Trim, case, standardise codes &mdash; so duplicates become visible</div>
<div class="a">&#8595;</div>
<div class="n"><b>4. Duplicates</b>Now that keys are comparable, remove them with a stated rule</div>
<div class="a">&#8595;</div>
<div class="n"><b>5. Missing</b>Decide per column: drop, impute, flag, or escalate</div>
<div class="a">&#8595;</div>
<div class="n"><b>6. Ranges</b>Impossible values against merely extreme ones</div>
</div>
<div class="note">Text standardisation before deduplication is the step people invert. <code>"ACME Mfg "</code> and <code>"acme mfg"</code> are not duplicates until they are trimmed and cased, at which point they are.</div>`},

{l:"MOVE",t:"Profiling missing values",h:"Count and rate, per <em>column</em>",b:`<div class="code" data-cap="python"><pre>
missing = pd.DataFrame({
    "n_missing": book.isna().sum(),
    "pct":       (book.isna().mean() * 100).round(2),
    "dtype":     book.dtypes.astype(str),
})
print(missing[missing["n_missing"] &gt; 0].sort_values("n_missing", ascending=False))
</pre></div>
<div class="code out" data-cap="output"><pre>
                  n_missing    pct    dtype
collateral_value       9044  18.76  float64
lgd                    4102   8.51  float64
pd_12m                  318   0.66  float64
branch_code              12   0.02      str
</pre></div>
<p>That table is a deliverable, not a diagnostic. It is the evidence behind any statement about data quality, and it takes four lines.</p>
<div class="note">Read the pattern, not just the counts. 18.76% missing collateral is probably legitimate &mdash; unsecured loans have none. 0.66% missing PD is probably a break in the ratings feed. The same number means different things per column, and only domain knowledge separates them.</div>`},

{l:"MECHANISM",t:"Handling missing",h:"Four decisions, and the wrong <em>default</em>",b:`<div class="dt"><table>
<tr><th>Decision</th><th>When</th><th>Code</th></tr>
<tr><td>Leave it</td><td>Missing is meaningful &mdash; no collateral means unsecured</td><td>nothing</td></tr>
<tr><td>Fill with a value</td><td>Absence genuinely equals a known quantity</td><td><code>.fillna(0)</code></td></tr>
<tr><td>Flag and fill</td><td>A value is needed downstream but the fact of imputation must survive</td><td>flag column plus fill</td></tr>
<tr><td>Drop the row</td><td>A key field is missing and the row cannot be used</td><td><code>.dropna(subset=[...])</code></td></tr>
</table></div>
<div class="code" data-cap="python"><pre>
# missing collateral means unsecured — and record that we said so
book["collateral_imputed"] = book["collateral_value"].isna()
book["collateral_value"] = book["collateral_value"].fillna(0)

# a facility with no exposure cannot be analysed
before = len(book)
book = book.dropna(subset=["ead"])
print(f"dropped {before - len(book)} rows with no exposure")
</pre></div>
<div class="code out" data-cap="output"><pre>
dropped 7 rows with no exposure
</pre></div>
<div class="note">Never fill a probability or a rate with the column mean without saying so. It looks harmless, it makes every downstream statistic slightly wrong, and it is invisible six months later. The flag column costs one line and makes it auditable.</div>`},

{l:"MOVE",t:"Duplicates",h:"Two kinds, one <em>rule</em>",b:`<div class="code" data-cap="python"><pre>
# fully identical rows
print(book.duplicated().sum())

# duplicated on the key, which is the one that matters
dupe_keys = book.duplicated(subset=["loan_id"], keep=False)
print(dupe_keys.sum())
print(book.loc[dupe_keys].sort_values("loan_id").head(6))
</pre></div>
<div class="code out" data-cap="output"><pre>
0
84

    loan_id       ead  as_at_date  source
1102   L00417  1200000  2026-03-31   CORE
1103   L00417  1200000  2026-03-28   CORE
</pre></div>
<p>Zero fully identical rows and 84 duplicated keys — the difference is the whole story. These are not accidental copies; they are the same facility at two dates, and one of them is stale.</p>
<div class="code" data-cap="python"><pre>
# rule: keep the most recent record per loan
book = (book
        .sort_values(["loan_id", "as_at_date"])
        .drop_duplicates(subset=["loan_id"], keep="last"))
</pre></div>
<div class="note"><code>keep=False</code> marks <em>every</em> member of a duplicated group, which is what you want when inspecting. <code>keep="last"</code> retains one. Sort first, always &mdash; otherwise "last" means "last in file order", which is not a rule.</div>`},

{l:"MOVE",t:"Text standardisation",h:"Before anything <em>compares</em>",b:`<div class="code" data-cap="python"><pre>
print(book["grade"].value_counts())
</pre></div>
<div class="code out" data-cap="output"><pre>
grade
BBB     8102
BBB     3041
bbb      922
 BBB     117
</pre></div>
<p>Four distinct values, one actual grade. Trailing spaces and mixed case make them different strings.</p>
<div class="code" data-cap="python"><pre>
book["grade"] = (book["grade"]
                 .str.strip()
                 .str.upper()
                 .replace({"BBB-": "BBB", "BBB+": "BBB"}))

print(book["grade"].value_counts())
</pre></div>
<div class="code out" data-cap="output"><pre>
grade
BBB    12182
</pre></div>
<div class="note">Run <code>value_counts()</code> on every categorical column before and after. It is the fastest way to see both that a problem exists and that the fix worked, and the before-and-after pair is exactly what belongs in a data quality log.</div>`},

{l:"TRAP",t:"Outliers",h:"Impossible against merely <em>extreme</em>",b:`<p>These are different findings with different treatments, and conflating them destroys real data.</p>
<div class="two">
<div><b>Impossible</b>Violates a rule that cannot be broken. A negative exposure, a PD above 1, days past due of 40,000, a maturity before origination. <strong>An error. Fix or exclude, and report</strong></div>
<div><b>Extreme</b>Unusual but real. One exposure a hundred times the median. <strong>Not an error. It is the largest borrower</strong></div>
</div>
<div class="code" data-cap="python"><pre>
impossible = (
    (book["ead"] &lt; 0) |
    (book["pd_12m"] &gt; 1) | (book["pd_12m"] &lt; 0) |
    (book["dpd"] &lt; 0) |
    (book["maturity_date"] &lt; book["origination_date"])
)
print(f"impossible values: {impossible.sum()}")
print(book.loc[impossible].head())
</pre></div>
<div class="code out" data-cap="output"><pre>
impossible values: 23
</pre></div>
<div class="note">Never winsorise or clip an exposure column to remove "outliers". In credit, the extreme values are the concentration risk &mdash; they are the most important rows in the table, and trimming them produces a portfolio that does not exist.</div>`},

{l:"CHEAT",t:"The quality report",h:"Cleaning, made <em>auditable</em>",b:`<p>Every cleaning step should leave a record. This function produces one, and it is worth keeping.</p>
<div class="code" data-cap="python"><pre>
def quality_report(df, key):
    """Column-level quality summary for a table."""
    rep = pd.DataFrame({
        "dtype":     df.dtypes.astype(str),
        "n_missing": df.isna().sum(),
        "pct_miss":  (df.isna().mean() * 100).round(2),
        "n_unique":  df.nunique(),
    })
    rep["grain_ok"] = df[key].nunique() == len(df)
    return rep.sort_values("pct_miss", ascending=False)


before = quality_report(raw, "loan_id")
after  = quality_report(book, "loan_id")
comparison = before.join(after, lsuffix="_before", rsuffix="_after")
comparison.to_csv("dq_report_2026Q1.csv")
</pre></div>
<div class="note">The before-and-after join is the point. A report showing only the cleaned state proves nothing; the pair shows what was wrong, what was changed, and what remains &mdash; which is what an auditor asks for and what your successor needs.</div>`},

{l:"RECALL",t:"Mission 07",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Profile, types, text, duplicates, missing, ranges</b><span>In that order. Text before dedupe, or duplicates stay invisible</span></div>
<div class="r"><b>Missing rate per column is a deliverable</b><span>Four lines. The pattern matters more than the count</span></div>
<div class="r"><b>Flag before you fill</b><span>An imputation with no flag is invisible in six months</span></div>
<div class="r"><b>Duplicate keys ≠ duplicate rows</b><span>Sort, then <code>drop_duplicates(keep="last")</code> with a stated rule</span></div>
<div class="r"><b>Impossible is an error, extreme is a borrower</b><span>Never clip exposures. That is the concentration risk</span></div>
<div class="r"><b>Before-and-after report</b><span>Only the pair is evidence</span></div>
</div>`}
]},

/* ============ 08 ============ */
{n:"08",title:"Deriving and binning",stage:"Frames",
line:"Building the columns the analysis needs — new fields, conditional logic across a whole table, and the binning that every scorecard depends on.",
bullets:["assign, and the new pd.col syntax","np.select for a ladder","cut and qcut","Monotonic bins, and why they matter","apply, and why it should be a last resort","Rounding and rate columns"],
cards:[

{l:"MECHANISM",t:"Creating columns",h:"Three ways, one <em>preferred</em>",b:`<div class="code" data-cap="python"><pre>
# 1. direct assignment — fine, mutates in place
book["el"] = book["ead"] * book["pd_12m"] * book["lgd"]

# 2. assign — returns a new frame, chains cleanly
book = book.assign(
    el       = lambda d: d["ead"] * d["pd_12m"] * d["lgd"],
    el_rate  = lambda d: d["el"] / d["ead"],
)

# 3. pd.col — new in pandas 3.0, same thing without the lambda
book = book.assign(
    el      = pd.col("ead") * pd.col("pd_12m") * pd.col("lgd"),
    el_rate = pd.col("el") / pd.col("ead"),
)
</pre></div>
<p>All three produce the same result. <code>assign</code> is preferred in a pipeline because it returns a new frame rather than mutating, so a chain of transformations reads top to bottom with no intermediate variables.</p>
<div class="note"><code>pd.col()</code> arrived in pandas 3.0 as a shorter form of the lambda. It refers to a column of the frame being assigned into, including columns created earlier in the same <code>assign</code> call &mdash; which is how <code>el_rate</code> can use <code>el</code> above.</div>`},

{l:"MOVE",t:"np.select",h:"A ladder without the <em>nesting</em>",b:`<p>Nested <code>np.where</code> becomes unreadable past three levels. <code>np.select</code> takes a list of conditions and a list of results, in priority order.</p>
<div class="code" data-cap="python"><pre>
import numpy as np

conditions = [
    book["dpd"] == 0,
    book["dpd"].between(1, 30),
    book["dpd"].between(31, 60),
    book["dpd"].between(61, 90),
    book["dpd"] &gt; 90,
]
labels = ["Current", "SMA-0", "SMA-1", "SMA-2", "NPA"]

book["bucket"] = np.select(conditions, labels, default="Unknown")
print(book["bucket"].value_counts())
</pre></div>
<div class="code out" data-cap="output"><pre>
bucket
Current    41205
SMA-0       2914
SMA-1       1508
SMA-2        745
NPA         1847
</pre></div>
<p>The <strong>first matching condition wins</strong>, so order is the logic. <code>default</code> catches anything unmatched — and a non-zero count of "Unknown" is a finding, usually a missing DPD.</p>
<div class="note">Always set a <code>default</code> that is obviously wrong rather than a plausible one. "Unknown" gets noticed in a value count; "Current" does not, and silently understates delinquency.</div>`},

{l:"MECHANISM",t:"cut and qcut",h:"Fixed edges against equal <em>counts</em>",b:`<div class="two">
<div><b><code>pd.cut</code></b>Bins at edges <strong>you specify</strong>. Use when the boundaries carry meaning — regulatory thresholds, policy limits, or loan-to-value bands (<strong>LTV</strong> is the loan as a share of the property's value)</div>
<div><b><code>pd.qcut</code></b>Bins by <strong>quantile</strong>, so each holds roughly equal counts. Use for exploration and for scorecard binning where you want populated bins</div>
</div>
<div class="code" data-cap="python"><pre>
# fixed edges — the DPD ladder again, as bins
book["bucket"] = pd.cut(
    book["dpd"],
    bins=[-1, 0, 30, 60, 90, 100_000],
    labels=["Current", "SMA-0", "SMA-1", "SMA-2", "NPA"],
)

# equal-count deciles of exposure
book["ead_decile"] = pd.qcut(book["ead"], q=10, labels=False)

print(book.groupby("ead_decile")["ead"].agg(["count", "min", "max"]).head())
</pre></div>
<div class="code out" data-cap="output"><pre>
             count      min       max
ead_decile
0             4822    12000    148000
1             4822   148100    276500
2             4822   276600    412000
</pre></div>
<div class="note"><code>cut</code> excludes the left edge by default, which is why the first bin above starts at &minus;1 rather than 0. Otherwise every <code>dpd == 0</code> row becomes NaN &mdash; a genuinely common and genuinely invisible bug.</div>`},

{l:"WHY",t:"Monotonic bins",h:"What a scorecard bin has to <em>look</em> like",b:`<p>A binned variable feeding a scorecard should show risk moving <strong>in one direction</strong> across the bins. If the default rate zigzags, the bins are fitting noise rather than signal.</p>
<div class="code" data-cap="python"><pre>
book["ltv_bin"] = pd.qcut(book["ltv"], q=8, duplicates="drop")

check = (book.groupby("ltv_bin", observed=True)
             .agg(n=("loan_id", "count"),
                  bad_rate=("default_flag", "mean"))
             .assign(bad_rate=lambda d: (d["bad_rate"] * 100).round(2)))
print(check)
</pre></div>
<div class="code out" data-cap="output"><pre>
                    n  bad_rate
ltv_bin
(0.09, 0.42]     6027      1.12
(0.42, 0.55]     6027      1.48
(0.55, 0.64]     6027      1.39
(0.64, 0.71]     6027      2.05
(0.71, 0.78]     6027      2.71
(0.78, 0.85]     6027      3.44
(0.85, 0.92]     6027      4.90
(0.92, 1.31]     6027      7.18
</pre></div>
<p>Almost monotonic — the third bin dips slightly below the second. The standard fix is to merge the two, giving a clean rise across seven bins.</p>
<div class="note"><code>observed=True</code> on a groupby over a categorical stops pandas emitting every unused category combination. <code>duplicates="drop"</code> handles the case where a variable is so concentrated that two quantile edges land on the same value.</div>`},

{l:"TRAP",t:"apply",h:"The convenient answer that is usually <em>wrong</em>",b:`<p><code>.apply()</code> runs a Python function on every row. It works, it reads naturally, and it is slow because it reintroduces the per-row Python loop that vectorisation exists to remove.</p>
<div class="code" data-cap="python"><pre>
# works, and is slow on any real book
book["el"] = book.apply(
    lambda r: r["ead"] * r["pd_12m"] * r["lgd"], axis=1
)

# same result, vectorised
book["el"] = book["ead"] * book["pd_12m"] * book["lgd"]
</pre></div>
<div class="code out" data-cap="output"><pre>
apply       2.41 s
vectorised  0.004 s
</pre></div>
<div class="two">
<div><b>Reach for vectorised first</b>Arithmetic, comparisons, <code>np.where</code>, <code>np.select</code>, <code>.str</code> methods, <code>.map</code> on a dict</div>
<div><b>apply only when</b>The logic genuinely cannot be expressed column-wise &mdash; calling an external service, parsing an irregular text field</div>
</div>
<div class="note"><code>.map()</code> on a Series with a dict is the vectorised way to apply a lookup, and it covers most of what people reach for <code>apply</code> to do: <code>book["pd_12m"] = book["grade"].map(master_scale)</code>.</div>`},

{l:"CHEAT",t:"Rates and rounding",h:"Small things that cause <em>arguments</em>",b:`<div class="code" data-cap="python"><pre>
# store rates as decimals, format only at display
book["el_rate"] = book["el"] / book["ead"]          # 0.0108

# round at the end, never at each step
summary = (book.groupby("bucket", observed=True)
               .agg(exposure=("ead", "sum"), el=("el", "sum")))
summary["el_rate_pct"] = (summary["el"] / summary["exposure"] * 100).round(2)

# division that survives a zero denominator
summary["el_rate_pct"] = (summary["el"] / summary["exposure"].replace(0, np.nan)
                          * 100).round(2)
</pre></div>
<div class="sheet"><div class="h">Conventions worth holding</div>
<div class="r"><b>Store decimals, display percentages</b><span>0.0108 in the column, "1.08%" in the report</span></div>
<div class="r"><b>Round once, at the end</b><span>Rounding at each step compounds the error and breaks reconciliations</span></div>
<div class="r"><b>Replace zero denominators with NaN</b><span>Division by zero gives <code>inf</code>, which then poisons every aggregate above it</span></div>
<div class="r"><b>Weight rates by exposure</b><span>The mean of a rate column is almost never the portfolio rate</span></div>
</div>`},

{l:"RECALL",t:"Mission 08",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b><code>.assign()</code> with <code>pd.col()</code></b><span>Chains cleanly, returns a new frame, can reference columns made in the same call</span></div>
<div class="r"><b><code>np.select</code> for a ladder</b><span>First match wins. Always set an obviously-wrong default</span></div>
<div class="r"><b><code>cut</code> for meaningful edges, <code>qcut</code> for equal counts</b><span><code>cut</code> excludes the left edge — start below your minimum</span></div>
<div class="r"><b>Bins should be monotonic in bad rate</b><span>A dip means merge, not model</span></div>
<div class="r"><b><code>apply</code> is a last resort</b><span>Hundreds of times slower. <code>.map()</code> covers most of its uses</span></div>
<div class="r"><b>Round once, weight by exposure</b><span>The mean of a rate column is not the portfolio rate</span></div>
</div>`}
]},

{n:"09",title:"Grouping and joining",stage:"Frames",
line:"Aggregating a book by any dimension, and combining tables without silently losing or duplicating rows.",
bullets:["groupby, and the split-apply-combine idea","agg with named outputs","transform, and why it is different","merge, and the four join types","validate — the argument that catches the bug","Reconciling before and after a join","pivot_table"],

{l:"MECHANISM",t:"groupby",h:"Split, apply, <em>combine</em>",b:`<p><code>groupby</code> splits the frame into groups, applies a calculation to each, and combines the results into a new frame.</p>
<div class="code" data-cap="python"><pre>
summary = book.groupby("bucket", observed=True).agg(
    n_loans   = ("loan_id", "count"),
    exposure  = ("ead", "sum"),
    avg_pd    = ("pd_12m", "mean"),
    total_el  = ("el", "sum"),
)
summary["share_pct"] = (summary["exposure"] / summary["exposure"].sum() * 100).round(2)
print(summary)
</pre></div>
<div class="code out" data-cap="output"><pre>
          n_loans      exposure   avg_pd     total_el  share_pct
bucket
Current     41205  1.284e+10   0.0121   6.98e+07      80.91
SMA-0        2914  1.410e+09   0.0388   2.46e+07       8.88
SMA-1        1508  7.020e+08   0.0651   2.05e+07       4.42
SMA-2         745  3.910e+08   0.1024   1.80e+07       2.46
NPA          1847  5.290e+08   1.0000   2.38e+08       3.33
</pre></div>
<p>The named-aggregation form — <code>name=("column", "function")</code> — is the one to use. It produces flat, named columns rather than the nested headers the older syntax creates.</p>
<div class="note">Group by several columns by passing a list. The result gets a MultiIndex, and <code>.reset_index()</code> flattens it back to ordinary columns, which is almost always what you want before exporting.</div>`},

{l:"DEFINE",t:"agg against transform",h:"Collapse, or broadcast <em>back</em>",b:`<div class="two">
<div><b><code>.agg()</code></b>One row per group. The frame shrinks. Use for summaries</div>
<div><b><code>.transform()</code></b>Same number of rows as the original, with the group's value repeated on every member. Use when you need the group statistic <em>alongside</em> the detail</div>
</div>
<div class="code" data-cap="python"><pre>
# each loan's share of its own branch's exposure
book["branch_total"] = book.groupby("branch_code")["ead"].transform("sum")
book["share_of_branch"] = book["ead"] / book["branch_total"]

# each loan's PD against its grade's average
book["grade_avg_pd"] = book.groupby("grade", observed=True)["pd_12m"].transform("mean")
book["pd_vs_grade"] = book["pd_12m"] - book["grade_avg_pd"]

print(book[["loan_id","branch_code","ead","share_of_branch"]].head(3))
</pre></div>
<div class="code out" data-cap="output"><pre>
  loan_id branch_code      ead  share_of_branch
0    L001        MH01  3800000         0.041207
1    L002        MH01  1200000         0.013013
2    L003        KA07   850000         0.009822
</pre></div>
<div class="note"><code>transform</code> is how concentration measures get built. A borrower's share of total exposure, squared and summed by group, is the Herfindahl index &mdash; and it is two lines from here.</div>`},

{l:"MECHANISM",t:"merge",h:"Four joins, and what each <em>keeps</em>",b:`<div class="code" data-cap="python"><pre>
combined = book.merge(
    ratings,
    on="loan_id",
    how="left",
    validate="one_to_one",
)
</pre></div>
<div class="dt"><table>
<tr><th><code>how</code></th><th>Keeps</th><th>Use for</th></tr>
<tr><td><code>left</code></td><td>All left rows; matching right values, NaN where absent</td><td>Enriching a book with an attribute. The default choice</td></tr>
<tr><td><code>inner</code></td><td>Only rows present in both</td><td>When a missing match makes the row unusable</td></tr>
<tr><td><code>outer</code></td><td>Everything from both sides</td><td><strong>Reconciliation.</strong> The only join that shows what is missing from each side</td></tr>
<tr><td><code>right</code></td><td>All right rows</td><td>Rare. Write it as a left join the other way around</td></tr>
</table></div>
<div class="code" data-cap="python"><pre>
# reconciliation: risk against finance, both directions at once
recon = risk.merge(finance, on="loan_id", how="outer",
                   suffixes=("_risk", "_fin"), indicator=True)
print(recon["_merge"].value_counts())
</pre></div>
<div class="code out" data-cap="output"><pre>
_merge
both          47986
left_only       226
right_only       41
</pre></div>
<div class="note"><code>indicator=True</code> adds a <code>_merge</code> column saying which side each row came from. Three lines and you have the break analysis: 226 exposures in risk and not finance, 41 the other way.</div>`},

{l:"TRAP",t:"validate",h:"The argument that prevents the silent <em>bug</em>",b:`<p>The worst join failure is not an error. It is a join against a table with duplicate keys, which <strong>multiplies rows</strong> — and the total exposure grows without anything visibly breaking.</p>
<div class="code" data-cap="python"><pre>
print(len(book))
merged = book.merge(collateral, on="loan_id", how="left")
print(len(merged))
</pre></div>
<div class="code out" data-cap="output"><pre>
48219
51402
</pre></div>
<p>3,183 extra rows, because some loans have several collateral records. Total exposure is now overstated by every duplicated facility, and nothing raised.</p>
<div class="code" data-cap="python"><pre>
merged = book.merge(collateral, on="loan_id", how="left",
                    validate="one_to_one")
</pre></div>
<div class="code out" data-cap="output"><pre>
MergeError: Merge keys are not unique in right dataset;
not a one-to-one merge
</pre></div>
<p>Now it fails loudly, at the point of the mistake, naming the side at fault.</p>
<div class="sheet"><div class="h">The four values</div>
<div class="r"><b>one_to_one</b><span>Keys unique on both sides</span></div>
<div class="r"><b>one_to_many</b><span>Unique on the left, repeated on the right</span></div>
<div class="r"><b>many_to_one</b><span>Repeated on the left, unique on the right &mdash; the usual lookup</span></div>
<div class="r"><b>many_to_many</b><span>No check. If you need this, aggregate one side first</span></div>
</div>
<div class="note">Put <code>validate=</code> on every merge you write. It costs nothing when correct and it converts the most expensive silent bug in data work into an immediate, specific error.</div>`},

{l:"MOVE",t:"Reconciling a join",h:"Three checks, every <em>time</em>",b:`<div class="code" data-cap="python"><pre>
before_rows = len(book)
before_ead  = book["ead"].sum()

merged = book.merge(ratings, on="loan_id", how="left", validate="one_to_one")

after_rows = len(merged)
after_ead  = merged["ead"].sum()
unmatched  = merged["grade"].isna().sum()

print(f"rows      {before_rows} -> {after_rows}")
print(f"exposure  {before_ead:,.0f} -> {after_ead:,.0f}")
print(f"unmatched {unmatched} ({unmatched / after_rows:.2%})")
</pre></div>
<div class="code out" data-cap="output"><pre>
rows      48219 -> 48219
exposure  15,872,340,000 -> 15,872,340,000
unmatched 412 (0.85%)
</pre></div>
<div class="lay">
<div><span>1</span><strong>Row count unchanged</strong> on a left join. Any increase means duplicate keys on the right.</div>
<div><span>2</span><strong>Control total unchanged.</strong> Exposure is a left-side column, so it cannot legitimately move.</div>
<div><span>3</span><strong>Unmatched rate stated.</strong> 0.85% may be fine or may be a broken feed &mdash; but it is now a number rather than a surprise.</div>
</div>
<div class="note">Those three lines belong around every join in a production notebook. They are the difference between a pipeline that fails loudly and one that quietly reports the wrong total for a quarter.</div>`},

{l:"CHEAT",t:"pivot_table",h:"Two dimensions at <em>once</em>",b:`<div class="code" data-cap="python"><pre>
matrix = book.pivot_table(
    index="grade",
    columns="bucket",
    values="ead",
    aggfunc="sum",
    fill_value=0,
    observed=True,
)
print((matrix / 1e7).round(1))     # in crore
</pre></div>
<div class="code out" data-cap="output"><pre>
bucket  Current  SMA-0  SMA-1  SMA-2    NPA
grade
A         412.7    8.1    2.4    0.9    1.2
BBB       604.2   61.4   28.7   14.1   12.8
BB        211.4   52.9   31.6   20.4   19.7
B          55.3   18.6   16.3   12.5   19.1
</pre></div>
<p>Exposure by rating grade and delinquency bucket in one call. The concentration of NPA in the weakest grades is the diagonal you would expect, and a violation of it is a finding.</p>
<div class="note">Set <code>fill_value=0</code> or absent combinations arrive as NaN and every subsequent arithmetic operation propagates it. Same structure with <code>aggfunc="count"</code> gives the transition-matrix shape used in Mission 13.</div>`},

{l:"RECALL",t:"Mission 09",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b><code>agg(name=("col","fn"))</code></b><span>Named aggregation. Flat columns, no nested headers</span></div>
<div class="r"><b><code>agg</code> collapses, <code>transform</code> broadcasts back</b><span>Use transform when the group statistic must sit beside the detail</span></div>
<div class="r"><b><code>how="outer"</code> with <code>indicator=True</code></b><span>The reconciliation join. Shows both directions of break</span></div>

{n:"10",title:"Dates and vintages",stage:"Frames",
line:"Time is where most analysis errors hide. Real date types, months on book, and the vintage table that shows deterioration two years before a headline ratio does.",
bullets:["Real dates, not strings","Extracting parts, and period grouping","Date arithmetic and month differences","Months on book","The vintage table, built","Resampling a time series"],
cards:[

{l:"MOVE",t:"Real dates",h:"Convert on read, or convert <em>first</em>",b:`<div class="code" data-cap="python"><pre>
print(book["origination_date"].dtype)
</pre></div>
<div class="code out" data-cap="output"><pre>
str
</pre></div>
<p>A date column read as text supports no date arithmetic, sorts alphabetically, and compares wrongly. Fix it before anything else touches it.</p>
<div class="code" data-cap="python"><pre>
book["origination_date"] = pd.to_datetime(book["origination_date"],
                                          format="%Y-%m-%d",
                                          errors="coerce")

bad = book["origination_date"].isna().sum()
print(f"unparseable dates: {bad}")
print(book["origination_date"].dtype)
</pre></div>
<div class="code out" data-cap="output"><pre>
unparseable dates: 19
datetime64[us]
</pre></div>
<div class="note">Always pass <code>format=</code> when you know it. Without it pandas infers, and inference on an ambiguous file can read <code>03/04/2026</code> as March in some rows and April in others. Explicit format also runs considerably faster on a large column.</div>`},

{l:"MECHANISM",t:"Parts and periods",h:"Pulling pieces out of a <em>date</em>",b:`<div class="code" data-cap="python"><pre>
d = book["origination_date"]

book["orig_year"]    = d.dt.year
book["orig_month"]   = d.dt.month
book["orig_quarter"] = d.dt.quarter
book["orig_ym"]      = d.dt.to_period("M")     # 2024-03
book["orig_fy"]      = d.dt.to_period("Y-MAR") # Indian fiscal year to March

print(book[["origination_date","orig_ym","orig_fy"]].head(3))
</pre></div>
<div class="code out" data-cap="output"><pre>
  origination_date  orig_ym  orig_fy
0       2024-03-15  2024-03  2023-24
1       2024-11-02  2024-11  2024-25
2       2025-06-21  2025-06  2025-26
</pre></div>
<p>The <code>.dt</code> accessor is the gateway to everything date-related on a column, exactly as <code>.str</code> is for text.</p>
<div class="note"><code>to_period("Y-MAR")</code> is the one worth remembering in India: it produces a fiscal year ending 31 March, so an origination in November 2024 lands in FY 2024-25 rather than calendar 2024. Grouping by calendar year when the reporting year is fiscal is a silent, recurring error.</div>`},

{l:"MECHANISM",t:"Date arithmetic",h:"Differences, and the month <em>problem</em>",b:`<div class="code" data-cap="python"><pre>
as_at = pd.Timestamp("2026-03-31")

# days is easy
book["days_on_book"] = (as_at - book["origination_date"]).dt.days

# months is not — calendar months vary in length
book["months_on_book"] = (
    (as_at.year  - book["origination_date"].dt.year) * 12 +
    (as_at.month - book["origination_date"].dt.month)
)

print(book[["origination_date","days_on_book","months_on_book"]].head(3))
</pre></div>
<div class="code out" data-cap="output"><pre>
  origination_date  days_on_book  months_on_book
0       2024-03-15           746              24
1       2024-11-02           514              16
2       2025-06-21           283               9
</pre></div>
<p>Subtracting two dates gives a <code>Timedelta</code>, and <code>.dt.days</code> extracts whole days from it. There is no <code>.dt.months</code>, because a month is not a fixed length — hence the year-and-month arithmetic above, which is the standard idiom.</p>
<div class="note">Dividing days by 30 to get months is the shortcut people reach for and it drifts: 365 days becomes 12.17 months. Over a five-year book that error compounds enough to shift a vintage curve by a whole period.</div>`},

{l:"WHY",t:"Months on book",h:"Why calendar time is the wrong <em>axis</em>",b:`<p>A loan cannot default before it exists. So a book growing fast has a falling headline delinquency ratio purely because the denominator is full of young loans that have not had time to go bad.</p>
<div class="two">
<div><b>Calendar time</b>Mixes cohorts of every age. Growth mechanically flatters the ratio, and the flattery reverses later &mdash; exactly when the new book starts to season</div>
<div><b>Months on book</b>Every cohort measured at the same age. Like compared with like</div>
</div>
<p><span class="k">Months on book</span> is the number of months since origination. Plotting bad rate against it, one line per origination cohort, is <span class="k">vintage analysis</span> — and it is the single most informative view of underwriting quality that exists.</p>
<div class="note">A vintage curve typically reveals deterioration around two years before the headline ratio moves, because the newest cohorts are still small relative to the total book.</div>`},

{l:"MOVE",t:"The vintage table",h:"Built in one <em>chain</em>",b:`<div class="code" data-cap="python"><pre>
book["cohort"] = book["origination_date"].dt.to_period("Q")
book["mob"]    = ((as_at.year  - book["origination_date"].dt.year) * 12 +
                  (as_at.month - book["origination_date"].dt.month))
book["is_bad"] = (book["dpd"] &gt; 90).astype(int)

vintage = (book
    .groupby(["cohort", "mob"], observed=True)
    .agg(n=("loan_id", "count"), bad=("is_bad", "sum"))
    .assign(bad_rate=lambda d: (d["bad"] / d["n"] * 100).round(2))
    .reset_index()
    .pivot(index="cohort", columns="mob", values="bad_rate"))

print(vintage.loc[:, [6, 12, 18, 24]])
</pre></div>
<div class="code out" data-cap="output"><pre>
mob         6     12     18     24
cohort
2023Q1   0.31   1.18   1.94   2.41
2023Q3   0.29   1.22   2.03   2.55
2024Q1   0.38   1.41   2.38    NaN
2024Q3   0.52   1.87    NaN    NaN
2025Q1   0.74   2.31    NaN    NaN
2025Q3   0.98    NaN    NaN    NaN
</pre></div>
<p>Read down each column. At 12 months on book the bad rate went 1.18 → 1.22 → 1.41 → 1.87 → 2.31 across cohorts. Underwriting quality is deteriorating, and each column is a valid comparison because every cohort in it is the same age.</p>
<div class="note">The NaN triangle at the top right is correct and expected &mdash; recent cohorts have not lived long enough to be observed at 18 or 24 months. It is not missing data, and filling it would be a serious error.</div>`},

{l:"CHEAT",t:"Time series",h:"Resample and <em>shift</em>",b:`<div class="code" data-cap="python"><pre>
daily = daily.set_index("as_at_date").sort_index()

monthly = daily["ead"].resample("ME").last()      # month-end snapshot
qtr_avg = daily["ead"].resample("QE").mean()      # quarterly average

monthly_change = monthly.diff()                   # period on period
monthly_pct    = monthly.pct_change() * 100
rolling_3m     = monthly.rolling(3).mean()        # smoothed
prior_year     = monthly.shift(12)                # same month, last year
yoy            = (monthly / prior_year - 1) * 100
</pre></div>
<div class="dt"><table>
<tr><th>Method</th><th>Does</th></tr>
<tr><td><code>.resample("ME")</code></td><td>Regroups to month-end. <code>QE</code> quarter-end, <code>YE</code> year-end</td></tr>
<tr><td><code>.diff()</code></td><td>Difference from the previous period</td></tr>
<tr><td><code>.pct_change()</code></td><td>Proportional change from the previous period</td></tr>
<tr><td><code>.rolling(n)</code></td><td>Moving window. Add <code>.mean()</code>, <code>.sum()</code>, <code>.std()</code></td></tr>
<tr><td><code>.shift(n)</code></td><td>Moves values n periods forward. The basis of any year-on-year comparison</td></tr>
</table></div>
<div class="note">Resampling requires a datetime index, which is what <code>set_index</code> is doing on the first line. Sorting it is not optional &mdash; resampling an unsorted index gives wrong answers rather than an error.</div>`},

{l:"RECALL",t:"Mission 10",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b><code>pd.to_datetime(..., format=)</code></b><span>Always pass the format. Inference on ambiguous files mixes months and days</span></div>
<div class="r"><b><code>.dt</code> is the date accessor</b><span>As <code>.str</code> is for text. <code>to_period("Y-MAR")</code> for the Indian fiscal year</span></div>
<div class="r"><b>No <code>.dt.months</code></b><span>Use year×12 plus month difference. Dividing days by 30 drifts</span></div>
<div class="r"><b>Months on book, not calendar time</b><span>Growth mechanically flatters a headline delinquency ratio</span></div>
<div class="r"><b>Vintage: cohort × mob, read down the column</b><span>Sees deterioration around two years earlier</span></div>
<div class="r"><b>The NaN triangle is correct</b><span>Young cohorts have not been observed at older ages. Never fill it</span></div>
</div>`}
]},

{n:"11",title:"Scorecard mechanics",stage:"Modelling",
line:"Turning raw attributes into model inputs — weight of evidence, information value, and the binning discipline the whole scorecard rests on.",

{l:"ORIENT",t:"Define the target first",h:"Everything downstream depends on this <em>line</em>",b:`<p>Before a single variable is examined, the target must be fixed: what counts as bad, over what window.</p>
<div class="code" data-cap="python"><pre>
OBSERVATION = pd.Timestamp("2025-03-31")   # attributes measured here
PERFORMANCE = pd.Timestamp("2026-03-31")   # outcome observed by here

panel = book[book["origination_date"] &lt;= OBSERVATION].copy()
panel["target"] = (panel["max_dpd_next_12m"] &gt; 90).astype(int)

print(panel["target"].value_counts())
print(f"bad rate: {panel['target'].mean():.2%}")
</pre></div>
<div class="code out" data-cap="output"><pre>
target
0    44821
1     1284
bad rate: 2.79%
</pre></div>
<p>Two windows, and they must not overlap. Attributes are measured at the observation date; the outcome is whatever happened over the following twelve months.</p>
<div class="note">Change the definition from 90+ to 60+ days and every number downstream changes &mdash; the bad rate, every weight of evidence, every coefficient, the cut-off. It is fixed once, written down, and not revisited quietly.</div>`},

{l:"FORMULA",t:"Weight of evidence",h:"Turning a category into a <em>number</em>",b:`<p>Raw variables are messy: income is skewed, employment type is categorical, both have missing values. <span class="k">Weight of evidence</span> transforms any variable into one ordered numeric scale.</p>
<div class="fx"><div class="cap">Weight of evidence, per bin</div>
<div class="eq"><em>WoE</em><sub>i</sub> = ln <span class="fr"><i>%Good<sub>i</sub></i><i>%Bad<sub>i</sub></i></span></div>
<div class="wh">%Good<sub>i</sub>&nbsp;share of all non-defaulters falling in bin i<br>
%Bad<sub>i</sub>&nbsp;&nbsp;share of all defaulters falling in bin i<br>
Positive means the bin is safer than average; negative means riskier</div></div>
<div class="fx"><div class="cap">Information value, whole variable</div>
<div class="eq"><em>IV</em> = &Sigma;<sub>i</sub> ( %Good<sub>i</sub> &minus; %Bad<sub>i</sub> ) &times; <em>WoE</em><sub>i</sub></div>
<div class="wh">Summed across every bin. A single number for how much the variable separates good from bad</div></div>
<p>Three properties make this the standard transformation: missing values become their own bin rather than an exclusion, the relationship is linearised against log-odds so a linear model can use it, and variables of different types become directly comparable.</p>`},

{l:"MOVE",t:"Coding it",h:"One function, reused <em>everywhere</em>",b:`<div class="code" data-cap="python"><pre>
import numpy as np

def woe_iv(df, feature, target="target", bins=10):
    """Weight of evidence and information value for one variable."""
    d = df[[feature, target]].copy()

    if d[feature].dtype.kind in "ifc":                 # numeric
        d["bin"] = pd.qcut(d[feature], q=bins, duplicates="drop")
    else:
        d["bin"] = d[feature].fillna("MISSING")

    g = (d.groupby("bin", observed=True, dropna=False)
           .agg(n=(target, "count"), bad=(target, "sum")))
    g["good"] = g["n"] - g["bad"]

    # 0.5 guards against a bin with zero bads or zero goods
    g["pct_good"] = (g["good"] + 0.5) / (g["good"].sum() + 0.5)
    g["pct_bad"]  = (g["bad"]  + 0.5) / (g["bad"].sum()  + 0.5)

    g["woe"] = np.log(g["pct_good"] / g["pct_bad"])
    g["iv"]  = (g["pct_good"] - g["pct_bad"]) * g["woe"]
    g["bad_rate"] = (g["bad"] / g["n"] * 100).round(2)

    return g, g["iv"].sum()


table, iv = woe_iv(panel, "ltv")
print(table[["n", "bad_rate", "woe", "iv"]].round(4))
print(f"IV = {iv:.4f}")
</pre></div>

<div class="note">The <code>+ 0.5</code> is deliberate. A bin containing zero defaults gives a division by zero and an infinite WoE; the small constant keeps it finite without materially shifting a populated bin.</div>`},

{l:"TRAP",t:"Reading IV",h:"High is not always <em>good</em>",b:`<div class="dt"><table>
<tr><th>IV</th><th>Conventional reading</th></tr>
<tr><td>&lt; 0.02</td><td>No useful separation</td></tr>
<tr><td>0.02 – 0.10</td><td>Weak</td></tr>
<tr><td>0.10 – 0.30</td><td>Medium</td></tr>
<tr><td>0.30 – 0.50</td><td>Strong</td></tr>
<tr class="hi"><td>&gt; 0.50</td><td><strong>Suspicious.</strong> Usually leakage, not brilliance</td></tr>
</table></div>
<p>These are industry conventions, not thresholds derived from any distribution. Treat them as triage.</p>
<p>An IV above 0.5 nearly always means the variable encodes the outcome. Classic offenders: a recovery-team flag set only after default, a provision amount, a restructuring date, a field populated by the collections system.</p>

            "utilisation", "employment_type", "provision_amount"]

for f, v in sorted(ivs.items(), key=lambda x: -x[1]):

    print(f"{f:20s} {v:.4f}{flag}")

{l:"MOVE",t:"Enforcing monotonicity",h:"Merging the bins that <em>zigzag</em>",b:`<p>A binned variable feeding a scorecard should move in one direction. A dip means the bins are fitting noise.</p>
<div class="code" data-cap="python"><pre>
def is_monotonic(table):
    """True if bad rate rises or falls consistently across bins."""
    r = table["bad_rate"].values
    return bool(np.all(np.diff(r) &gt;= 0) or np.all(np.diff(r) &lt;= 0))


def bin_until_monotonic(df, feature, target="target", start=10, floor=3):
    """Reduce bin count until the bad rate is monotonic."""
    for q in range(start, floor - 1, -1):
        table, iv = woe_iv(df, feature, target, bins=q)
        if is_monotonic(table):
            return table, iv, q
    return table, iv, floor


table, iv, q = bin_until_monotonic(panel, "utilisation")
print(f"monotonic at {q} bins, IV = {iv:.4f}")
print(table[["n", "bad_rate", "woe"]].round(4))
</pre></div>

{l:"MOVE",t:"Applying WoE",h:"Replacing the raw column with its <em>transform</em>",b:`<div class="code" data-cap="python"><pre>
def apply_woe(df, feature, table):
    """Map each row's bin to its WoE value."""
    binned = pd.cut(df[feature], bins=table.index.categories)
    return binned.map(table["woe"]).astype(float)


selected = ["ltv", "utilisation", "n_enquiries", "months_on_book"]
woe_tables = {}

for f in selected:
    t, iv, q = bin_until_monotonic(panel, f)
    woe_tables[f] = t
    panel[f"woe_{f}"] = apply_woe(panel, f, t)

model_cols = [f"woe_{f}" for f in selected]
print(panel[model_cols].head(3).round(4))
</pre></div>

<p>Every model input is now on the same scale, in the same direction — positive means safer, negative means riskier — regardless of what the raw variable measured.</p>
<div class="note">Keep <code>woe_tables</code>. It must be applied unchanged to the validation set and to production scoring. Re-binning on new data is a classic and serious error: it silently recalibrates the model to whatever arrived.</div>`},

{l:"TRAP",t:"Splitting",h:"Random is the wrong <em>split</em>",b:`<p>The standard random train/test split is wrong for credit, and the reason matters.</p>
<div class="two">
<div><b>Random split</b>Training and test sets contain the same time period. The model is judged on data drawn from conditions it was fitted on. Performance looks better than it is</div>
<div><b>Out-of-time split</b>Train on earlier cohorts, test on later ones. Tests the only thing that matters: does the relationship survive into a period the model has never seen</div>
</div>
<div class="code" data-cap="python"><pre>
cutoff = pd.Timestamp("2024-09-30")

train = panel[panel["origination_date"] &lt;= cutoff]
test  = panel[panel["origination_date"] &gt;  cutoff]

print(f"train {len(train):>6}  bad rate {train['target'].mean():.2%}")
print(f"test  {len(test):>6}  bad rate {test['target'].mean():.2%}")
</pre></div>
<div class="code out" data-cap="output"><pre>
train  32118  bad rate 2.44%
test   13987  bad rate 3.58%
</pre></div>
<div class="note">The bad rate differs between the two periods, and that is exactly the point. A random split would have averaged the two and hidden the fact that conditions changed.</div>`},

{l:"MOVE",t:"Fitting",h:"Six lines, and the two that <em>matter</em>",b:`<div class="code" data-cap="python"><pre>
from sklearn.linear_model import LogisticRegression

X_train = train[model_cols]
y_train = train["target"]
X_test  = test[model_cols]
y_test  = test["target"]

model = LogisticRegression(max_iter=1000)
model.fit(X_train, y_train)

train_pd = model.predict_proba(X_train)[:, 1]
test_pd  = model.predict_proba(X_test)[:, 1]

print(f"mean predicted PD, test: {test_pd.mean():.4f}")
print(f"actual bad rate,   test: {y_test.mean():.4f}")
</pre></div>

mean predicted PD, test: 0.0271
actual bad rate,   test: 0.0358
</pre></div>
<p><code>predict_proba</code> returns two columns — probability of class 0 and of class 1. <code>[:, 1]</code> takes the second, which is the probability of default. Taking column 0 by mistake produces a model that ranks perfectly backwards.</p>
<div class="note">Predicted 2.71% against actual 3.58%. The model ranks but under-predicts the level, because it was fitted on a lower-default period. That is a calibration problem, not a discrimination problem, and it has a different fix &mdash; two cards down.</div>`},

<div class="fx"><div class="cap">What the model computes</div>

{l:"FORMULA",t:"Gini and AUROC",h:"Two names, one <em>quantity</em>",b:`<p><span class="k">AUROC</span> is the area under the receiver operating characteristic curve, and its interpretation is exact: <strong>the probability that a randomly chosen defaulter scores worse than a randomly chosen non-defaulter</strong>.</p>
<div class="fx"><div class="cap">The relationship</div>
<div class="eq"><em>Gini</em> = 2 &times; <em>AUROC</em> &minus; 1</div>
<div class="wh">AUROC 0.5 &rarr; Gini 0&nbsp;&nbsp;no discrimination, equivalent to random<br>
AUROC 0.75 &rarr; Gini 0.50<br>
AUROC 1.0 &rarr; Gini 1&nbsp;&nbsp;perfect separation, in practice a sign of leakage</div></div>
<div class="code" data-cap="python"><pre>
from sklearn.metrics import roc_auc_score

for name, y, p in [("train", y_train, train_pd), ("test", y_test, test_pd)]:
    auc = roc_auc_score(y, p)
    print(f"{name:5s}  AUROC {auc:.4f}   Gini {2*auc - 1:.4f}")
</pre></div>
<div class="code out" data-cap="output"><pre>
train  AUROC 0.7614   Gini 0.5228
test   AUROC 0.7402   Gini 0.4804
</pre></div>
<p>A drop from 0.52 to 0.48 out of time is normal and healthy. A drop to 0.20 would mean the relationship did not survive; no drop at all usually means the split was not genuinely out of time.</p>
<div class="note">Gini is the market convention in credit; AUROC is the convention in statistics. They are the same measurement on different scales, and quoting one to an audience expecting the other produces an argument about model quality that is purely a units problem.</div>`},

{l:"FORMULA",t:"The KS statistic",h:"The widest <em>gap</em>",b:`<p>Rank every account by predicted PD and plot two cumulative curves: the share of all defaulters captured, and the share of all non-defaulters. <span class="k">KS</span> is the largest vertical distance between them.</p>
<div class="fx"><div class="cap">Kolmogorov&ndash;Smirnov statistic</div>
<div class="eq"><em>KS</em> = max<sub>s</sub> | <em>F</em><sub>bad</sub>(s) &minus; <em>F</em><sub>good</sub>(s) |</div>
<div class="wh">F<sub>bad</sub>(s)&nbsp;&nbsp;cumulative share of defaulters with score at or below s<br>
F<sub>good</sub>(s)&nbsp;cumulative share of non-defaulters with score at or below s<br>
Reported as a percentage, 0 to 100</div></div>
<div class="code" data-cap="python"><pre>
def ks_statistic(y_true, y_score, bins=10):
    d = pd.DataFrame({"y": y_true.values, "p": y_score})
    d["band"] = pd.qcut(d["p"], q=bins, duplicates="drop", labels=False)

    g = (d.groupby("band")
           .agg(n=("y", "count"), bad=("y", "sum"))
           .sort_index(ascending=False))
    g["good"] = g["n"] - g["bad"]
    g["cum_bad"]  = g["bad"].cumsum()  / g["bad"].sum()
    g["cum_good"] = g["good"].cumsum() / g["good"].sum()
    g["ks"] = (g["cum_bad"] - g["cum_good"]).abs() * 100
    return g, g["ks"].max()


table, ks = ks_statistic(y_test, test_pd)
print(table[["n","bad","cum_bad","cum_good","ks"]].round(4))
print(f"KS = {ks:.2f}")
</pre></div>

<div class="note">KS carries something Gini does not: <strong>the score band where separation is widest</strong>. That band is the natural candidate for a cut-off, because it is where accepting one more account costs the most bad accounts per good account gained.</div>`},

{l:"FORMULA",t:"PSI",h:"Has the population <em>moved</em>?",b:`<p>A model built on one population and applied to another will misbehave even if nothing about the model changed. The <span class="k">population stability index</span> quantifies the shift.</p>
<div class="fx"><div class="cap">Population stability index</div>
<div class="eq"><em>PSI</em> = &Sigma;<sub>i</sub> ( <em>A</em><sub>i</sub> &minus; <em>E</em><sub>i</sub> ) &times; ln <span class="fr"><i><em>A</em><sub>i</sub></i><i><em>E</em><sub>i</sub></i></span></div>
<div class="wh">A<sub>i</sub>&nbsp;actual proportion in band i, current period<br>
E<sub>i</sub>&nbsp;expected proportion in band i, from the development sample<br>
Summed across bands, usually score deciles</div></div>
<div class="code" data-cap="python"><pre>
def psi(expected, actual, bins=10):
    edges = np.quantile(expected, np.linspace(0, 1, bins + 1))
    edges[0], edges[-1] = -np.inf, np.inf

    e = pd.cut(expected, edges).value_counts(normalize=True).sort_index()
    a = pd.cut(actual,   edges).value_counts(normalize=True).sort_index()

    e, a = e.replace(0, 0.0001), a.replace(0, 0.0001)
    return float(((a - e) * np.log(a / e)).sum())


print(f"PSI train vs test: {psi(train_pd, test_pd):.4f}")
</pre></div>
<div class="code out" data-cap="output"><pre>
PSI train vs test: 0.0817
</pre></div>
<div class="wk"><div class="h">Conventional reading</div>
<div class="r"><b>Below 0.10</b><span>No material shift</span></div>
<div class="r"><b>0.10 to 0.25</b><span>Moderate — investigate</span></div>
<div class="r tot"><b>Above 0.25</b><span>Significant — the model may be out of domain</span></div>
</div>
<div class="note">The same function applied to a single input variable rather than the score gives the characteristic stability index. PSI says the population moved; CSI says which variable moved it.</div>`},

{l:"MOVE",t:"Calibration",h:"Ranking is not the same as the <em>level</em>",b:`<p>Gini, KS and PSI all say nothing about whether predicted levels are right. Calibration compares predicted PD against realised default rate, band by band.</p>
<div class="code" data-cap="python"><pre>
cal = pd.DataFrame({"pred": test_pd, "actual": y_test.values})
cal["band"] = pd.qcut(cal["pred"], q=8, duplicates="drop", labels=False)

out = (cal.groupby("band")
          .agg(n=("actual", "count"),
               predicted=("pred", "mean"),
               observed=("actual", "mean")))
out["ratio"] = (out["observed"] / out["predicted"]).round(2)
print((out[["n"]].join((out[["predicted","observed"]] * 100).round(2))
       .join(out[["ratio"]])))
</pre></div>

<p>Two readings, and the distinction determines the remedy. The <strong>ordering is intact</strong> — observed rises monotonically with predicted, so discrimination is fine. The <strong>level is understated by roughly a third across every band</strong>, uniformly. That is a calibration failure, corrected by rescaling, not by rebuilding the scorecard.</p>

</div>
<div class="note">The inner join is deliberate. Loans present in one quarter and not the other are closures or new originations, and including them would contaminate a migration measure with book turnover.</div>`},

{l:"MOVE",t:"Roll rates",h:"Movement, chained to a <em>probability</em>",b:`<div class="code" data-cap="python"><pre>
ORDER = ["Current", "SMA-0", "SMA-1", "SMA-2", "NPA"]

pairs = (book_t0[["loan_id", "bucket", "ead"]]
         .rename(columns={"bucket": "b0", "ead": "ead0"})
         .merge(book_t1[["loan_id", "bucket"]].rename(columns={"bucket": "b1"}),
                on="loan_id", how="inner", validate="one_to_one"))

roll = (pairs.groupby("b0", observed=True)
             .apply(lambda g: pd.Series({
                 "opening_ead": g["ead0"].sum(),
                 "rolled_ead":  g.loc[g["b1"] == ORDER[min(ORDER.index(g.name)+1,
                                                            len(ORDER)-1)],
                                      "ead0"].sum(),
             }), include_groups=False))
roll["roll_rate_pct"] = (roll["rolled_ead"] / roll["opening_ead"] * 100).round(2)
print(roll.reindex(ORDER[:-1]))
</pre></div>
<div class="code out" data-cap="output"><pre>
         opening_ead   rolled_ead  roll_rate_pct
b0
Current   1.2840e+10   5.1360e+08           4.00
SMA-0     1.4100e+09   4.9350e+08          35.00
SMA-1     7.0200e+08   3.8610e+08          55.00
SMA-2     3.9100e+08   2.9325e+08          75.00
</pre></div>
<div class="code" data-cap="python"><pre>
chained = roll["roll_rate_pct"].div(100).prod()
print(f"Current -> NPA over four periods: {chained:.3%}")
</pre></div>
<div class="code out" data-cap="output"><pre>
Current -> NPA over four periods: 0.578%
</pre></div>
<div class="note">The shape is the point: roll rates rise steeply as buckets deepen. Most one-month arrears cure; most three-month arrears do not. That is why collections effort concentrates early, where the marginal account is still winnable.</div>`},

{l:"MOVE",t:"Staging",h:"Twelve-month against <em>lifetime</em>",b:`<p>The trigger from stage 1 to stage 2 is <span class="k">SICR</span> &mdash; a significant increase in credit risk since the loan was written, tested three ways at once: a relative rise in lifetime probability of default, a qualitative flag such as a watchlist entry, and a 30-days-past-due backstop.</p>
<p>An expected-loss framework assigns every exposure to one of three stages. Stage 1 provides for defaults expected in the next twelve months; stages 2 and 3 provide over the remaining life.</p>
<div class="code" data-cap="python"><pre>
# significant increase in credit risk: relative PD threshold,
# a qualitative flag, and the 30-day backstop
sicr = (
    (book["pd_lifetime"] / book["pd_at_origination"] &gt;= 2.0) |
    (book["watchlist_flag"] == 1) |
    (book["dpd"] &gt; 30)
)

conditions = [book["dpd"] &gt; 90, sicr]
book["stage"] = np.select(conditions, [3, 2], default=1)

print(book.groupby("stage").agg(
    n=("loan_id", "count"),
    exposure=("ead", "sum"),
))
</pre></div>
<div class="code out" data-cap="output"><pre>
       n      exposure
stage
1  41205  1.2840e+10
2   5167  2.5030e+09
3   1847  5.2900e+08
</pre></div>
<p>Order matters in <code>np.select</code> — stage 3 is tested first, so a defaulted account never falls through to stage 2 merely because it also triggered the SICR test.</p>
<div class="note">The <code>pd_at_origination</code> column is the hard requirement here. It must be retained for the life of every facility, and most core systems store only a current rating. History not captured cannot be reconstructed.</div>`},

{l:"FORMULA",t:"Expected credit loss",h:"Marginal, amortising, <em>discounted</em>",b:`<div class="fx"><div class="cap">Lifetime expected credit loss</div>
<div class="eq"><em>ECL</em><sub>LT</sub> = <span class="nw">&Sigma;<sub>t=1</sub><sup>T</sup></span> <span class="fr"><i><em>PD</em><sub>t</sub><sup>marg</sup> &times; <em>LGD</em><sub>t</sub> &times; <em>EAD</em><sub>t</sub></i><i>(1 + <em>EIR</em>)<sup>t</sup></i></span></div>
<div class="wh">PD<sub>t</sub><sup>marg</sup>&nbsp;probability of defaulting in period t having survived to t&minus;1<br>
LGD&nbsp;&nbsp;loss given default in period t<br>
EAD<sub>t</sub>&nbsp;expected exposure in period t, reflecting amortisation<br>
EIR&nbsp;&nbsp;effective interest rate at initial recognition<br>
T&nbsp;&nbsp;&nbsp;remaining life</div></div>
<div class="code" data-cap="python"><pre>
def lifetime_ecl(ead_schedule, pd_marginal, lgd, eir):
    """Discounted lifetime ECL for one facility."""
    t = np.arange(1, len(ead_schedule) + 1)
    discount = 1 / (1 + eir) ** t
    return float((pd_marginal * lgd * ead_schedule * discount).sum())


ead_sched   = np.array([1_000_000, 780_000, 530_000, 270_000])
pd_marginal = np.array([0.015, 0.020, 0.022, 0.020])

stage_1 = lifetime_ecl(ead_sched[:1], pd_marginal[:1], 0.40, 0.11)
stage_2 = lifetime_ecl(ead_sched,     pd_marginal,     0.40, 0.11)

print(f"Stage 1 (12-month): {stage_1:>10,.0f}   {stage_1/ead_sched[0]:.2%}")
print(f"Stage 2 (lifetime): {stage_2:>10,.0f}   {stage_2/ead_sched[0]:.2%}")
print(f"multiple: {stage_2 / stage_1:.1f}x")
</pre></div>
<div class="code out" data-cap="output"><pre>
Stage 1 (12-month):      5,405   0.54%
Stage 2 (lifetime):     15,303   1.53%
multiple: 2.8x
</pre></div>
<div class="note">Nothing about the borrower changed between those two lines. One reclassification multiplied the provision by 2.8 &mdash; which is why the staging threshold is the most contested parameter in the whole framework.</div>`},

{l:"MOVE",t:"Concentration",h:"Effective borrower <em>count</em>",b:`<div class="fx"><div class="cap">Herfindahl&ndash;Hirschman index</div>
<div class="eq"><em>HHI</em> = &Sigma;<sub>i</sub> <em>w</em><sub>i</sub><sup>2</sup> &nbsp;&nbsp;&nbsp; <em>n</em><sub>eff</sub> = <span class="fr"><i>1</i><i><em>HHI</em></i></span></div>
<div class="wh">w<sub>i</sub>&nbsp;share of total exposure held by borrower, sector or geography i<br>
n<sub>eff</sub>&nbsp;the effective number of equally sized exposures the portfolio behaves like</div></div>
<div class="code" data-cap="python"><pre>
def hhi(series):
    w = series / series.sum()
    h = float((w ** 2).sum())
    return h, 1 / h


by_borrower = book.groupby("borrower_group")["ead"].sum()
by_sector   = book.groupby("sector")["ead"].sum()

for name, s in [("borrower", by_borrower), ("sector", by_sector)]:
    h, n = hhi(s)
    print(f"{name:9s} HHI {h:.4f}   effective count {n:6.1f}   actual {len(s)}")
</pre></div>
<div class="code out" data-cap="output"><pre>
borrower  HHI 0.0031   effective count  322.6   actual 4187
sector    HHI 0.0762   effective count   13.1   actual 22
</pre></div>
<p>Four thousand borrower groups behaving like 323, and twenty-two sectors behaving like thirteen. The sector figure is the one that would attract attention.</p>
<div class="note">This matters because the internal-ratings capital formula assumes a perfectly diversified portfolio. Concentration violates that assumption by construction, which is why it is assessed separately rather than in the minimum capital calculation.</div>`},

{l:"MOVE",t:"The movement reconciliation",h:"An identity that must <em>balance</em>",b:`<div class="fx"><div class="cap">NPA movement</div>
<div class="eq"><em>NPA</em><sub>close</sub> = <em>NPA</em><sub>open</sub> + <em>Slippage</em> &minus; <em>Upgrades</em> &minus; <em>Recoveries</em> &minus; <em>Write-offs</em></div>
<div class="wh">NPA<sub>open</sub>&nbsp;non-performing balance at the start of the period<br>
Slippage&nbsp;&nbsp;accounts that crossed into non-performing during the period<br>
Upgrades&nbsp;&nbsp;accounts reclassified back to standard without loss<br>
Recoveries&nbsp;cash collected against accounts that stayed non-performing<br>
Write-offs&nbsp;balances removed as uncollectible; the legal claim survives<br>
NPA<sub>close</sub>&nbsp;non-performing balance at the end of the period</div></div>
<div class="code" data-cap="python"><pre>
m = (book_t0[["loan_id","bucket","ead"]].rename(columns={"bucket":"b0","ead":"e0"})
     .merge(book_t1[["loan_id","bucket","ead"]].rename(columns={"bucket":"b1","ead":"e1"}),
            on="loan_id", how="outer", indicator=True))

npa_open  = m.loc[m["b0"] == "NPA", "e0"].sum()
npa_close = m.loc[m["b1"] == "NPA", "e1"].sum()
slippage  = m.loc[(m["b0"] != "NPA") &amp; (m["b1"] == "NPA"), "e0"].sum()
upgrades  = m.loc[(m["b0"] == "NPA") &amp; (m["b1"] != "NPA") &amp;
                  (m["b1"].notna()), "e0"].sum()
exits     = m.loc[(m["b0"] == "NPA") &amp; (m["_merge"] == "left_only"), "e0"].sum()

derived = npa_open + slippage - upgrades - exits
print(f"opening   {npa_open:>16,.0f}")
print(f"slippage  {slippage:>16,.0f}")
print(f"upgrades  {-upgrades:>16,.0f}")
print(f"exits     {-exits:>16,.0f}")
print(f"derived   {derived:>16,.0f}")
print(f"actual    {npa_close:>16,.0f}")
print(f"unexplained {npa_close - derived:>14,.0f}")
</pre></div>
<div class="code out" data-cap="output"><pre>
opening            529,000,000
slippage           148,200,000
upgrades           -31,400,000
exits              -96,800,000
derived            549,000,000
actual             551,300,000
unexplained          2,300,000
</pre></div>
<div class="note">The unexplained residual is balance movement on accounts that stayed non-performing &mdash; accrued interest and part payments. It should be small and it should be explainable. A large residual means a category is missing from the identity, and that is a finding rather than a rounding difference.</div>`},

{l:"RECALL",t:"Mission 13",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b><code>pd.crosstab(..., normalize="index")</code></b><span>Rows sum to 100. Diagonal is stability, last column is realised default rate</span></div>
<div class="r"><b>Inner join for migration</b><span>Or book turnover contaminates the measure</span></div>
<div class="r"><b>Roll rates rise with bucket depth</b><span>Chain them for probability of reaching non-performing</span></div>
<div class="r"><b>Test stage 3 before stage 2</b><span>Order is the logic in <code>np.select</code></span></div>
<div class="r"><b>ECL: marginal PD, amortising EAD, discounted</b><span>All three must vary by period, or the lifetime number is wrong</span></div>
<div class="r"><b>HHI and effective count</b><span>4,187 borrowers can behave like 323</span></div>
<div class="r"><b>The movement identity must balance</b><span>A large residual is a missing category, not rounding</span></div>
</div>`}
]},

{l:"MOVE",t:"Handover",h:"What has to travel with the <em>notebook</em>",b:`<p>A notebook that runs on your machine and nowhere else has not been delivered. Four things must travel with it.</p>
<div class="lay">
<div><span>1</span><strong>Pinned versions.</strong> A requirements file, so the reader installs what you ran.</div>
<div><span>2</span><strong>Parameters at the top.</strong> Dates, thresholds and paths as named constants in the first cell, never buried in the middle.</div>
<div><span>3</span><strong>Assertions.</strong> The checks that must hold, stated as code, so a broken input fails immediately rather than producing a plausible wrong number.</div>
<div><span>4</span><strong>Frozen artefacts.</strong> The WoE tables, the fitted model, the bin edges &mdash; saved, not recomputed.</div>
</div>
<div class="code" data-cap="python"><pre>
# --- parameters -------------------------------------------------
AS_AT       = pd.Timestamp("2026-03-31")
BAD_DEF_DPD = 90
SICR_RATIO  = 2.0
DATA_PATH   = "data/loan_book_2026Q1.parquet"

# --- checks that must hold --------------------------------------
assert book["loan_id"].is_unique,        "grain is not one row per loan"
assert book["ead"].ge(0).all(),          "negative exposure present"
assert book["pd_12m"].between(0,1).all(), "PD outside [0,1]"

# --- freeze what the model needs --------------------------------
import pickle
with open("model_2026Q1.pkl", "wb") as f:
    pickle.dump({"model": model, "woe_tables": woe_tables,
                 "features": model_cols, "as_at": AS_AT}, f)
</pre></div>
<div class="code" data-cap="terminal"><pre>
pip freeze &gt; requirements.txt
</pre></div>
<div class="note">Saving the WoE tables alongside the model is the step most often skipped, and it is the one that makes a model unusable six months later. Without them the raw data cannot be transformed into what the model expects.</div>`},

{l:"TRAP",t:"Every trap",h:"One grid, all <em>missions</em>",b:`<div class="sheet q"><div class="h">Language and arrays</div>
<div class="r"><b>Float equality</b><span><code>0.1 + 0.2 != 0.3</code>. Every reconciliation needs a tolerance</span></div>

</div>
<div class="sheet q"><div class="h">Loading and cleaning</div>
<div class="r"><b>Leading zeros lost on identifiers</b><span>Pass <code>dtype="str"</code>. Discovered weeks later when a join under-matches</span></div>
<div class="r"><b>Summing a text column concatenates</b><span>No error. Check the dtype first</span></div>
<div class="r"><b>Row count above distinct keys</b><span>The grain is not what you assumed and everything downstream is wrong</span></div>
<div class="r"><b>Deduplicating before standardising text</b><span>Duplicates stay invisible until trimmed and cased</span></div>
<div class="r"><b>Imputing without a flag</b><span>Invisible in six months. One line to make it auditable</span></div>
<div class="r"><b>Clipping exposure outliers</b><span>Those are the concentration risk, not errors</span></div>
</div>
<div class="sheet q"><div class="h">Frames</div>
<div class="r"><b><code>and</code> / <code>or</code> on a Series</b><span>Raises "truth value is ambiguous". Use <code>&amp;</code> <code>|</code> with brackets</span></div>
<div class="r"><b>Chained assignment</b><span>Silently does nothing under Copy-on-Write. Use <code>.loc[mask, col]</code></span></div>
<div class="r"><b><code>cut</code> excludes the left edge</b><span>Every zero becomes NaN unless the first edge is below the minimum</span></div>
<div class="r"><b>Merge without <code>validate</code></b><span>Duplicate keys multiply rows and inflate totals silently</span></div>
<div class="r"><b><code>.apply</code> for arithmetic</b><span>Hundreds of times slower than the vectorised form</span></div>
<div class="r"><b>Mean of a rate column</b><span>Almost never the portfolio rate. Weight by exposure</span></div>
</div>
<div class="sheet q"><div class="h">Time and modelling</div>
<div class="r"><b>Days divided by 30</b><span>Drifts. Use year×12 plus month difference</span></div>
<div class="r"><b>Calendar time instead of months on book</b><span>Growth mechanically flatters every delinquency ratio</span></div>
<div class="r"><b>Filling the vintage NaN triangle</b><span>Young cohorts have not been observed yet. It is correct as it stands</span></div>
<div class="r"><b>IV above 0.5</b><span>Leakage far more often than a strong variable</span></div>
<div class="r"><b>Random train/test split</b><span>Hides the only failure that matters</span></div>
<div class="r"><b><code>predict_proba(X)[:, 0]</code></b><span>Column 0 is P(no default). Ranks perfectly backwards</span></div>
<div class="r"><b>Re-binning on new data</b><span>Silently recalibrates the model. Freeze the WoE tables</span></div>
</div>`},

document.title=P.title.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&mdash;/g,'\u2014')+' \u2014 Field Cards';
const main=document.getElementById('main'), rail=document.getElementById('rail');
function lc(l){
  if(l==='TRAP'||l==='TRADE-OFF') return 'label q';
  if(l==='FORMULA'||l==='WORKED') return 'label';
  if(l==='RECALL'||l==='CHEAT'||l==='CLOSE') return 'label r';
  if(l==='LIVE'||l==='NUMBERS') return 'label l';
  return 'label';
}
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards${P.edition ? ` &nbsp;/&nbsp; ${P.edition}` : ''}</div>
  <h1>${P.title}</h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>${P.floor}<br>${P.dateline} ${DATE}</div>
  ${P.intro ? `<div class="note" style="margin-top:26px">${P.intro}</div>` : ''}
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    ${m.line ? `<div class="mline">${m.line}</div>` : ''}
    ${m.bullets ? `<div class="inthis">In this mission</div><ul>${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : ''}
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
</body>
