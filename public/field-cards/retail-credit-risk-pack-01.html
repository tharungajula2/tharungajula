<div class="progress"><i id="bar"></i></div>
<div class="topbar"><div class="row">
  <div class="brand">RETAIL CREDIT RISK · <b>FIELD CARDS</b></div>
  <div class="spacer"></div>
  <div class="counter" id="counter">01</div>
</div></div>
<div class="rail" id="rail"></div>
<div class="deck" id="deck"></div>

  <div class="close" id="idxClose">CLOSE</div>

  <ol id="idxList"></ol>
</div>
<script>
const MISSIONS = [
{n:'01', title:'The Loop', stage:0,
 sub:'Retail credit risk is one sentence executed end to end. This mission sets out the sentence, the equation underneath it, and the rulebook it runs on in India.',
 covers:['What a lender is actually selling','EL = PD × LGD × EAD','The three consumers of a single number','Default under the RBI rulebook','The four regimes that coexist in India'],
 cards:[

{label:'ORIENT', tag:'The spine', title:'One sentence, eleven verbs', stage:0, html:`
<p class="kicker">Retail credit risk replaces a judgement about one borrower with a measurement of many. That measurement is a single loop, and every technique in the field lives at one verb of it.</p>
<ul class="spine">
<li><span class="k">01</span><span class="v">Define the event<em>What counts as default, written down as a rule that applies identically to every account</em></span></li>
<li><span class="k">02</span><span class="v">Freeze a photograph<em>Everything known about the borrower at a stated moment, and nothing known after it</em></span></li>
<li><span class="k">03</span><span class="v">Rank<em>Put the risky in front of the safe. This is discrimination</em></span></li>
<li><span class="k">04</span><span class="v">Level<em>Attach a number that is true, not merely ordered. This is calibration, and it is a separate job</em></span></li>
<li><span class="k">05</span><span class="v">Size the severity<em>How much is lost when the event happens — LGD</em></span></li>
<li><span class="k">06</span><span class="v">Size the exposure<em>How much is owed at the moment it happens — EAD</em></span></li>
<li><span class="k">07</span><span class="v">Stretch it over a life<em>Twelve months is not the whole story, so the probability becomes a curve</em></span></li>
<li><span class="k">08</span><span class="v">Stage it<em>Has risk moved since the loan was written? Accounting cares about the change, not the level</em></span></li>
<li><span class="k">09</span><span class="v">Provision it<em>Convert the estimate into money set aside, then compare it against a regulatory floor</em></span></li>
<li><span class="k">10</span><span class="v">Capitalise it<em>Set aside equity against the surprise, not the average</em></span></li>
<li><span class="k">11</span><span class="v">Watch it drift<em>The population moves away from the one that was measured, and the clock restarts</em></span></li>
</ul>
<div class="note"><div class="lab">Why the order is not arbitrary</div><p>Each verb consumes the output of the one above it. Get the event wrong at step one and nothing below it can be right, however sophisticated.</p></div>`},

{label:'DEFINE', tag:'The product', title:'A lender sells time, and buys a distribution', stage:0, html:`
<p>A loan is money now against a promise later. The lender's revenue is the spread between what it pays for funds and what it charges for them. Its cost is the fraction of promises that will not be kept.</p>
<p>What makes retail different from corporate lending is not the size of the ticket. It is that <b>no individual borrower is analysed at all.</b> A corporate credit officer reads audited accounts and forms a judgement about one company. A retail lender cannot: the ticket is too small to pay for that attention, and there are hundreds of thousands of them.</p>
<p>So retail substitutes <i class="term">measurement of many</i> for <i class="term">judgement of one</i>. It accepts that any single decision may be wrong, and requires only that the decisions are right on average, in a way that can be counted.</p>
<div class="note"><div class="lab">The consequence that shapes everything else</div><p>Because the unit of analysis is the portfolio rather than the borrower, every number in this field is a <b>rate</b> — a default rate, a recovery rate, a roll rate, a coverage ratio. And every rate has a numerator, a denominator, and a moment in time at which each was measured. Most errors in credit reporting are errors about that last part.</p></div>`},

{label:'MECHANISM', tag:'The equation', title:'Three numbers, one product', stage:1, html:`
<div class="formula"><span class="lg">EL = PD × LGD × EAD</span><small>Expected loss</small></div>
<table class="tbl free">
<tr><td><b>PD</b><span class="sub">Probability of default</span></td><td>The chance the defined event happens within a stated horizon, usually twelve months. A number between 0 and 1.</td></tr>
<tr><td><b>LGD</b><span class="sub">Loss given default</span></td><td>The fraction of the exposure <b>not</b> recovered, after the cost of collecting it and after discounting cash that arrives late.</td></tr>
<tr><td><b>EAD</b><span class="sub">Exposure at default</span></td><td>The amount actually owed at the moment default occurs — which is not today's balance, and for a credit card is usually more.</td></tr>
</table>
<div class="note"><div class="lab">The word doing all the work</div><p><b>Expected.</b> Expected loss is a mean. No single account ever experiences it, because an account either defaults or it does not. The mean describes the portfolio and describes no member of it.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'The mean nobody lives', stage:1, html:`
<p class="kicker">One unsecured personal loan of ₹5,00,000, at a 3.4% twelve-month default probability and a 70% severity.</p>
<ul class="steps">
<li><span class="op"><b>Expected loss</b>5,00,000 × 0.034 × 0.70</span><span class="res">₹11,900</span></li>
<li><span class="op"><b>What happens 96.6% of the time</b>No default, no loss</span><span class="res">₹0</span></li>
<li><span class="op"><b>What happens 3.4% of the time</b>Default, 70% of exposure lost</span><span class="res">₹3,50,000</span></li>
<li class="total"><span class="op"><b>Accounts losing exactly ₹11,900</b></span><span class="res">none</span></li>
</ul>
<div class="note"><div class="lab">What the number is for</div><p>₹11,900 is a <b>price</b>. It belongs in the interest rate charged and in the provision held against the book. It is not a measure of risk — it is the cost of doing the business, known in advance and recovered from the customer.</p></div>`},

{label:'TRAP', tag:'Expensive to get wrong', title:'What capital is actually for', stage:1, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">Capital is held against expected losses.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Capital covers <b>unexpected</b> loss — the excess of a bad year over the average year. Expected loss has already been funded twice: once in the price charged to the customer, once in the provision booked against the book. By the time a loss arrives at its expected size, it has been paid for.</div></div>
</div></div>
<p class="small" style="margin-top:16px">What destroys a lender is never the average. It is the year when realised losses come in at three or five times expected — an unemployment shock, a property price fall, a policy change — and the equity has to absorb the difference.</p>
<div class="note"><div class="lab">The tell, written into the formula</div><p>The Basel capital formula computes a stressed probability of default and then <b>subtracts the ordinary PD</b> from it. That subtraction is exactly this distinction, expressed as arithmetic.</p></div>`},

{label:'MECHANISM', tag:'Downstream', title:'Three consumers of the same number', stage:9, html:`
<p class="kicker">A single PD estimate is handed to three parties, and each does something entirely different with it. Most confusion in credit discussion is a failure to say which one is being talked about.</p>
<table class="tbl free">
<tr><td><b>Pricing<br>and sanction</b></td><td>Needs <b>order only</b>. A cut-off needs to know who is worse than whom; the absolute level can be off and the decision is still correct.</td></tr>
<tr><td><b>Provisioning</b></td><td>Needs <b>level</b>. It multiplies the probability by real money, under a forward-looking view, and books the answer to the profit and loss account.</td></tr>
<tr><td><b>Capital</b></td><td>In India, needs <b>nothing from the model at all</b>. Risk weights come from a supervisory table. More on this in Mission 09.</td></tr>
</table>
<div class="note"><div class="lab">The failure this explains</div><p>A model can rank beautifully and still be wrong by half on every level. Such a model sanctions correctly and under-provisions catastrophically — and the two facts are entirely compatible, because they are answers to different questions.</p></div>`},

{label:'INDIA', tag:'The rulebook', title:'What default means here', stage:1, html:`
<p class="kicker">In India, default is not a modelling choice. It is a legal classification with a name — <i class="term">non-performing asset</i> — and it differs from the American definition in ways that change how a system must be built.</p>
<ul class="spine">
<li><span class="k">90</span><span class="v">Days overdue makes it an NPA<em>Term loan: interest or principal remains overdue for more than 90 days. Credit card: the minimum amount due is unpaid for 90 days from the statement payment due date.</em></span></li>
<li><span class="k">WHO</span><span class="v">Classification is at borrower level<em>One defaulted credit card makes the same customer's housing loan an NPA as well. Not the facility — the person.</em></span></li>
<li><span class="k">OD</span><span class="v">Overdrafts have their own three-limb test<em>An account is "out of order" if it is over its limit for 90 continuous days, or has had no credits for 90 days, or the credits over the prior 90 days do not cover the interest debited. Any one limb is enough.</em></span></li>
<li><span class="k">UP</span><span class="v">Upgradation is all-or-nothing<em>An account returns to standard only when the entire arrears of interest and principal are cleared, across every facility of that borrower.</em></span></li>
</ul>
<div class="note"><div class="lab">The subtle limb</div><p>The third overdraft test means an account can sit inside its sanctioned limit, receive money every month, and still be non-performing — because the money arriving is less than the interest being charged. The balance is being kept alive by the lender's own accrual, not by the customer.</p></div>`},

{label:'INDIA', tag:'Before the cliff', title:'The SMA ladder', stage:1, html:`
<p>India requires every lender to classify accounts <b>before</b> they become non-performing, into <i class="term">special mention account</i> buckets:</p>
<table class="tbl">
<thead><tr><th>Bucket</th><th>Overdue</th></tr></thead>
<tr><td>SMA-0</td><td>1–30 days</td></tr>
<tr><td>SMA-1</td><td>31–60 days</td></tr>
<tr class="hi"><td>SMA-2</td><td>61–90 days</td></tr>
<tr><td>NPA</td><td>90+ days</td></tr>
</table>
<p class="small" style="margin-top:16px">The boundaries are conventional rather than natural — nothing changes about a borrower on the thirty-first day. But because they are universal, every early-warning system, every roll rate and every supervisory return in the country is expressed in them, which makes them the common language of the field.</p>
<div class="note"><div class="lab">Why the last step is different in kind</div><p>SMA-2 to NPA is not another rung on a ladder. Crossing it changes income recognition, provisioning, capital treatment and the borrower's bureau record simultaneously. Interest already booked but unpaid must be reversed. It is the edge of a cliff, and every collections strategy in the country is organised around keeping accounts off it.</p></div>`},

{label:'DEFINE', tag:'Orientation', title:'Four regimes, all live at once', stage:9, html:`
<p class="kicker">A recurring source of confusion is that India runs several overlapping rulebooks. They answer different questions and none replaces another.</p>
<table class="tbl free">
<tr><td><b>IRACP</b><span class="sub">Income recognition, asset classification, provisioning</span></td><td>The incurred-loss regime. Provisions follow classification: sub-standard, doubtful, loss. In force for banks until <b>31 March 2027</b>.</td></tr>
<tr><td><b>Ind AS 109</b><span class="sub">The accounting standard</span></td><td>Expected credit loss, three stages. <b>Already live for NBFCs</b>, with an RBI overlay.</td></tr>
<tr><td><b>ACPIR 2026</b><span class="sub">RBI Directions, notified April 2026</span></td><td>Brings expected credit loss to commercial banks from <b>1 April 2027</b>, with prudential floors on top of the model.</td></tr>
<tr><td><b>Basel III</b><span class="sub">Capital adequacy</span></td><td>Risk-weighted assets and minimum capital ratios. Separate from provisioning entirely, and in India implemented only in its Standardised form.</td></tr>
</table>
<div class="note"><div class="lab">The relationship to hold on to</div><p>Provisioning and capital are two different stacks of money on the same balance sheet, answering two different questions: <b>what do we expect to lose</b>, and <b>what could surprise us</b>. Expected credit loss reforms change the first. They do not change the second.</p></div>`},

{label:'NUMBERS', tag:'Recall', title:'The Indian ten', stage:9, html:`
<p class="kicker">Ten figures that recur across every conversation about retail credit in this country.</p>
<table class="tbl">
<tr class="hi"><td>NPA trigger</td><td>90+ DPD</td></tr>
<tr><td>SMA buckets 0 / 1 / 2</td><td>1–30 / 31–60 / 61–90</td></tr>
<tr class="hi"><td>Expected credit loss framework begins</td><td>1 Apr 2027</td></tr>
<tr><td>Stage 1 to Stage 2 backstop</td><td>30 DPD</td></tr>
<tr><td>Regulatory floor on modelled PD</td><td>0.03%</td></tr>
<tr><td>Backstop LGD — secured / unsecured</td><td>65% / 70%</td></tr>
<tr class="hi"><td>Unsecured retail provision floors, Stage 1 / 2</td><td>1.00% / 5%</td></tr>
<tr><td>Risk weight — qualifying regulatory retail</td><td>75%</td></tr>
<tr class="hi"><td>Risk weight — personal loan, card revolver</td><td>125%</td></tr>
<tr><td>Bank capital ratio — minimum / with buffer</td><td>9% / 11.5%</td></tr>
</table>`},

{label:'IN MY SYSTEM', tag:'What I built', title:'The loop, executed once', stage:13, html:`
<p>I built the whole sentence as a running pipeline in Python, on 466,285 US consumer loans originated between 2007 and 2014, because the only way to know whether the parts fit together is to make them fit together.</p>
<table class="tbl">
<tr><td>Target engineering, sampling, WoE binning</td><td>1 – 3</td></tr>
<tr><td>PD model, scorecard scaling</td><td>4 – 5</td></tr>
<tr><td>Validation, calibration, stability</td><td>6 – 8</td></tr>
<tr><td>LGD, EAD and credit conversion factor</td><td>9 – 10</td></tr>
<tr><td>Lifetime PD, staging</td><td>11 – 12</td></tr>
<tr class="hi"><td>Expected credit loss, capital</td><td>13 – 14</td></tr>
</table>
<p class="small" style="margin-top:16px">Fourteen stages, 82 Python modules, no notebooks — every result is produced by a runnable script so the chain reproduces from the raw file to the capital number without a human executing cells in the right order.</p>
<div class="note"><div class="lab">The limitation I state first, always</div><p>The data is American, so the default definition is charge-off rather than the RBI's 90-days-past-due at borrower level. Throughout these cards I mark where the Indian rule diverges, because that divergence is the interesting part.</p></div>`},

{label:'NUMBERS', tag:'Reference', title:'What the system produced', stage:13, html:`
<table class="tbl">
<tr><td>Loans, 2007–2014</td><td>466,285</td></tr>
<tr class="hi"><td>Default rate — 12-month / lifetime</td><td>3.44% / 10.93%</td></tr>
<tr><td>Development / out-of-time split</td><td>230,657 / 235,628</td></tr>
<tr class="hi"><td>Champion model — out-of-time Gini</td><td>0.3845</td></tr>
<tr><td>Score stability index, train to out-of-time</td><td>0.0071</td></tr>
<tr class="hi"><td>Mean LGD / defaults recovering nothing</td><td>93.01% / 52.18%</td></tr>
<tr><td>Staging — Stage 1 / 2 / 3</td><td>80.5 / 11.3 / 8.3%</td></tr>
<tr class="hi"><td>Expected credit loss / coverage</td><td>$278.48M / 15.25%</td></tr>
<tr><td>Risk weight — modelled vs standardised</td><td>125.63% vs 75%</td></tr>
</table>
<div class="ramp" style="margin-top:18px">
<div class="a"><div class="t">Stage 1</div><div class="n">2.14%</div></div>
<div class="b"><div class="t">Stage 2</div><div class="n">14.41%</div></div>
<div class="c"><div class="t">Stage 3</div><div class="n">93.25%</div></div>
</div>
<p class="small">Provision coverage by stage — a forty-four-fold climb across three categories. That gradient is the entire point of staged provisioning, and it is the fastest way to check that a staging implementation is doing something real.</p>`},

{label:'CLOSE', tag:'Mission 01', title:'What this mission established', stage:0, html:`
<ul class="own">
<li>The eleven-verb loop, and that every technique in the field sits at one verb</li>
<li>Expected loss is a price recovered from the customer; capital answers a different question</li>
<li>PD is consumed three ways — order for sanctioning, level for provisioning, and in India not at all for capital</li>
<li>Default in India: 90 days past due, at borrower level, with an all-or-nothing return to standard</li>
<li>Four regimes coexisting: IRACP until 2027, Ind AS 109 for NBFCs, ACPIR from April 2027, Basel throughout</li>
</ul>
<div class="next"><div class="lab">Mission 02</div><div class="ttl">Defining the event</div>
<p>Default is not a fact waiting to be observed. It is a rule someone wrote, over a window someone chose — and the choice determines everything measured afterwards.</p></div>`}
]},
{n:'02', title:'Defining the event', stage:1,
 sub:'There is no natural definition of default. There is only a documented one — and it is the highest-leverage decision in a credit model, because everything downstream is a model of whatever was defined here.',
 covers:['Observation point and outcome window','Choosing a horizon','Good, bad and indeterminate','Cure, and why severity is modelled separately','Reject inference and the population never seen'],
 cards:[

{label:'DEFINE', tag:'The primitive', title:'Default is a rule, not a fact', stage:1, html:`
<p>Nothing in a data file says "this loan defaulted". What exists is a set of observable facts — days past due, a status flag, a write-off entry — and a rule that converts them into a binary flag.</p>
<p>A usable definition has three parts, and all three must be written down:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">A condition<em>For example: interest or principal overdue for more than 90 days</em></span></li>
<li><span class="k">2</span><span class="v">A level of application<em>Facility or borrower. In India, borrower</em></span></li>
<li><span class="k">3</span><span class="v">A horizon<em>The period over which the condition is watched for</em></span></li>
</ul>
<div class="note"><div class="lab">Why this ranks above model choice</div><p>A model does not predict loss. It predicts <b>the event that was defined</b>. Two lenders with identical data and identical algorithms produce different probabilities if one counts a cured 95-day delinquency as a default and the other does not — and neither is wrong, provided each says which it did.</p></div>`},

{label:'DEFINE', tag:'The two dates', title:'Observation point and outcome window', stage:2, html:`
<p><b>The observation point</b> is the moment everything known about an account is frozen. Nothing recorded after it may enter the model, however predictive.</p>
<p><b>The outcome window</b> is the fixed period that follows, during which default is watched for. An account that defaults inside the window is a <i class="term">bad</i>. An account that never does is a <i class="term">good</i>.</p>
<div class="formula">observation point → [ outcome window ] → verdict<small>Freeze, then wait</small></div>
<p class="small">The single rule that follows: <b>a model can only predict over the window it was trained on.</b> A model built on a twelve-month window says nothing about year three, and using it as though it did is one of the more common quiet errors in provisioning.</p>
<div class="note"><div class="lab">The most common leak in the whole field</div><p>Variables recorded after the observation point. Recovery amounts, total principal received, last payment size — each separates defaulters from non-defaulters perfectly, because each is a <b>consequence</b> of the outcome rather than a predictor of it. A model containing one looks extraordinary in development and is worthless in production.</p></div>`},

{label:'MECHANISM', tag:'The choice', title:'How long the window should be', stage:2, html:`
<p class="kicker">Window length is a genuine trade-off between capturing the event and staying current.</p>
<table class="tbl free">
<tr><td><b>12 months</b><span class="sub">Unsecured personal loans, credit cards</span></td><td>Most defaults on these products emerge inside a year, and the model stays built on recent borrowers.</td></tr>
<tr><td><b>24 months+</b><span class="sub">Housing, secured long-tenor lending</span></td><td>Defaults arrive slowly. A short window would classify future defaulters as goods and teach the model the opposite of the truth.</td></tr>
</table>
<p style="margin-top:16px">The cost of a longer window is <b>staleness</b>. A 24-month window means the most recent usable observation point is two years old, so the model is fitted on a population, an economy and a credit policy that have all since moved.</p>
<div class="note"><div class="lab">The compromise most lenders reach</div><p>Model on the shorter window because it is fresher and better populated, then extend the probability into a curve over the full life using survival methods — which is precisely what accounting requires anyway. Mission 07 builds that curve.</p></div>`},

{label:'DEFINE', tag:'The third category', title:'Good, bad, and the accounts that are neither', stage:2, html:`
<p>Some accounts are neither clearly good nor clearly bad: they reached 30 or 60 days past due and recovered, or closed early for reasons unrelated to credit. These are <i class="term">indeterminates</i>.</p>
<table class="tbl free">
<tr><td><b>Count them as goods</b></td><td>The model learns that near-misses are unremarkable, and under-weights early delinquency as a signal.</td></tr>
<tr><td><b>Count them as bads</b></td><td>The model learns that one missed instalment is fatal, and declines profitable customers.</td></tr>
<tr class="hi"><td><b>Exclude them</b></td><td>Usual practice — but the model is then fitted on a population that is not the one it will be applied to.</td></tr>
</table>
<p class="small" style="margin-top:16px">The exclusion is acceptable while indeterminates are a small share. Beyond roughly 5–10% of the sample it needs written justification, and the model needs recalibrating back onto the full population, because the excluded accounts still exist in production.</p>
<div class="note"><div class="lab">In my system</div><p>I did not carve out an indeterminate class — the definition is a clean binary on charge-off status. It is a simplification, and the honest description of it is that my "goods" contain some accounts that were in real difficulty and recovered.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'Default and loss are different events', stage:5, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">A defaulted account is a lost account.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Accounts <b>cure</b>. A borrower who reaches 90 days overdue and then clears the arrears has defaulted and produced no loss at all. On secured retail books, cure rates commonly run between a third and a half of all defaults.</div></div>
</div></div>
<p style="margin-top:16px">This is the entire reason severity is modelled as a separate parameter rather than assumed to be one. If default meant loss, LGD would be unnecessary and expected loss would collapse to PD × EAD.</p>
<div class="note"><div class="lab">The Indian amplification</div><p>Because upgradation here requires clearing the <b>entire</b> arrears across <b>all</b> facilities, cure is a discrete, lumpy event rather than a gradual improvement. An account is either fully back or fully out. This is a direct cause of the bimodal severity distributions examined in Mission 06.</p></div>`},

{label:'DEFINE', tag:'The unseen population', title:'Reject inference', stage:2, html:`
<p>A model is trained on accounts that were <b>sanctioned</b>. It is applied to everyone who <b>applies</b>. The outcomes of declined applicants were never observed, because they were never funded.</p>
<p>The two populations differ systematically, and by construction: the rejected group is the one the previous policy believed was worse.</p>
<table class="tbl free">
<tr><td><b>Parcelling</b></td><td>Score the rejects with the current model, assign bad flags in proportion to the inferred odds — conventionally inflated two to four times — and add them to the development sample.</td></tr>
<tr><td><b>Augmentation</b></td><td>Reweight the accepted accounts so that each stands in for the rejected applicants that resemble it.</td></tr>
</table>
<div class="note q"><div class="lab">The uncomfortable truth</div><p>Neither technique recovers information. The outcomes were never observed and no algorithm creates data. What they do is make the assumption about the unseen region <b>explicit, consistent and auditable</b> instead of implicit. That is worth doing, and it is not the same as solving the problem.</p></div>
<div class="note g"><div class="lab">The only real cure</div><p>Deliberately sanction a random sample of applicants who would otherwise be declined, and observe what they do. It is expensive, it is the only source of genuine evidence about the rejected region, and the lenders with the best models are the ones that pay for it.</p></div>`},

{label:'IN MY SYSTEM', tag:'The build', title:'Constructing a target with no default date', stage:1, html:`
<p>The dataset gives a status string and no date of default. To build a twelve-month flag I had to infer <b>when</b> each default occurred:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">Flag every charge-off, default and late status as an eventual default<em>50,968 loans — 10.93% of the book</em></span></li>
<li><span class="k">2</span><span class="v">Take the last payment date as the estimated default date<em>Falling back to the last credit-bureau pull where the payment date is missing</em></span></li>
<li><span class="k">3</span><span class="v">Difference it against the issue date, floored at zero<em>So that data errors cannot produce negative elapsed months</em></span></li>
<li><span class="k">4</span><span class="v">Mark a twelve-month default where elapsed months are 12 or fewer<em>16,018 loans — 3.44%</em></span></li>
</ul>
<div class="note"><div class="lab">The 34,950 that do not disappear</div><p>The remaining 7.50% defaulted <b>after</b> month twelve. They are <b>goods</b> for the twelve-month model and <b>bads</b> for the lifetime curve. The same loan plays two roles correctly, in two different models, because the two models are answering two different questions.</p></div>`},

{label:'THE HARD QUESTION', tag:'Reconciliation', title:'"A 3.44% default rate looks too low"', stage:1, html:`
<p class="kicker">It looks low against the double-digit figures usually quoted for this dataset. Both numbers are correct; they measure different windows.</p>
<table class="tbl">
<tr><td>Twelve-month rate — the modelling target</td><td>3.44%</td></tr>
<tr><td>Defaults arriving after month twelve</td><td>7.50%</td></tr>
<tr class="hi"><td>Lifetime rate — the commonly quoted figure</td><td>10.93%</td></tr>
</table>
<p style="margin-top:16px">Any published default rate is meaningless without its horizon attached. A twelve-month rate and a lifetime rate on the same book can differ by a factor of three, and neither is more honest than the other.</p>
<div class="note"><div class="lab">The check worth building</div><p>The lifetime hazard curve I construct in Mission 07 reproduces <b>both</b> numbers independently — 3.4352% at month twelve and 10.9306% at month sixty. Two anchors from one curve is a free internal consistency test, and if they had not matched, the extraction would have been wrong.</p></div>`},

{label:'CLOSE', tag:'Mission 02', title:'What this mission established', stage:1, html:`
<ul class="own">
<li>Default is a written rule with a condition, a level and a horizon — never an observation</li>
<li>The observation point freezes what is known; anything recorded after it is leakage</li>
<li>Window length trades event capture against staleness; short windows are extended by survival curves, not by guessing</li>
<li>Accounts cure, which is why severity is a separate parameter and why expected loss has three terms</li>
<li>Models are fitted on sanctioned accounts and applied to applicants; reject inference makes that assumption explicit rather than solving it</li>
<li>Every default rate is meaningless without its horizon stated alongside</li>
</ul>
<div class="next"><div class="lab">Mission 03</div><div class="ttl">The split is the model</div>
<p>A badly designed sample leaks and flatters. A well-designed one is itself a piece of evidence — and the four ways a scorecard leaks all happen before a single coefficient is fitted.</p></div>`}
]},
{n:'03', title:'The split is the model', stage:2,
 sub:'Every claim a credit model makes rests on how its data was divided. Sampling is not preparation for the modelling — it is the experiment, and the modelling is what happens inside it.',
 covers:['Random holdout against out-of-time validation','Stratification, and why event rates must be preserved','The four ways a scorecard leaks','Oversampling and the intercept correction','What a split proves, and what it cannot'],
 cards:[

{label:'DEFINE', tag:'Two different tests', title:'Holdout answers the wrong question', stage:2, html:`
<table class="tbl free">
<tr><td><b>Random holdout</b><span class="sub">A random slice of the same period</span></td><td>Answers: does this work on <b>other accounts</b> from the same time?</td></tr>
<tr class="hi"><td><b>Out-of-time sample</b><span class="sub">A later period, held back entirely</span></td><td>Answers: does this still work <b>next year</b>?</td></tr>
</table>
<p style="margin-top:16px">Real scorecards almost never fail the first question. They fail the second, because populations drift, credit policy changes, sourcing channels shift and the economy moves. A random holdout is blind to all of it, by construction, since the drift is present in both halves equally.</p>
<div class="note"><div class="lab">The design that follows</div><p>Split by <b>time</b> first — a development period and a later out-of-time period — and only then split the development period randomly for model selection. The time split is the evidence; the random split is housekeeping.</p></div>`},

{label:'DEFINE', tag:'Preserving the rate', title:'Stratification', stage:2, html:`
<p>A <i class="term">stratified split</i> samples randomly within strata of the target, so the event rate is preserved in every partition.</p>
<p>On a rare event this matters more than it appears. At a 3.4% default rate, a naive random split of a modest sample can drift the event rate by several tenths of a percentage point purely by chance — and any comparison between the partitions is then contaminated by a difference that has nothing to do with the model.</p>
<div class="note"><div class="lab">In my system</div><p>Development 2007–2013, out-of-time the entire 2014 vintage, and an 80/20 stratified split inside development.</p></div>
<table class="tbl" style="margin-top:14px">
<thead><tr><th>Partition</th><th>Rows / rate</th></tr></thead>
<tr><td>Train</td><td>184,525 · 3.4299%</td></tr>
<tr><td>Test</td><td>46,132 · 3.4293%</td></tr>
<tr class="hi"><td>Out-of-time, 2014</td><td>235,628 · 3.4406%</td></tr>
</table>
<p class="small" style="margin-top:14px">Train and test agreeing is stratification working. The out-of-time rate agreeing to within 0.011 percentage points is not — that is a genuine finding about the portfolio, and it is what licenses treating the later result as a test of the model rather than a test of a different population.</p>`},

{label:'MECHANISM', tag:'Four failures', title:'How a scorecard leaks before it is fitted', stage:3, html:`
<ul class="spine">
<li><span class="k">1</span><span class="v">Binning on the full dataset<em>If the bins that transform a variable are chosen using data from the test period, the transformation has already seen the answers. The bin boundaries are part of the model and must be fitted on training data only.</em></span></li>
<li><span class="k">2</span><span class="v">Post-outcome variables<em>Anything recorded after the observation point — recoveries, principal received, final payment size. These are consequences of default, not predictors.</em></span></li>
<li><span class="k">3</span><span class="v">Overlapping accounts across partitions<em>The same account appearing in training and test, usually through a join that duplicates rows. The fix is an assertion in code, not an assumption.</em></span></li>
<li><span class="k">4</span><span class="v">Selection on the target<em>Filtering the sample using any condition correlated with the outcome — dropping accounts with missing status, excluding closed accounts — quietly reshapes the event being modelled.</em></span></li>
</ul>
<div class="note"><div class="lab">The diagnostic that catches most of it</div><p>An out-of-time result far <b>worse</b> than development is ordinary decay. An out-of-time result implausibly close to a suspiciously high development result is usually leakage — it means the model found something that exists in both periods and should not exist in either.</p></div>`},

{label:'IN MY SYSTEM', tag:'The proof', title:'Making the split an assertion, not a claim', stage:2, html:`
<p>Three properties of my split are enforced in code rather than described in documentation:</p>
<ul class="spine">
<li><span class="k">A</span><span class="v">Zero loan-identifier overlap<em>Asserted between all three partitions. If it fails, the pipeline stops rather than producing a result.</em></span></li>
<li><span class="k">B</span><span class="v">The split is frozen before any feature is examined<em>Split dates and ratios live in a configuration file, not in the modelling code, so they cannot be adjusted after seeing a result.</em></span></li>
<li><span class="k">C</span><span class="v">The binning transformer is fitted on training data only<em>Then pickled and applied unchanged to test and out-of-time. The transformer is saved as part of the model artefact.</em></span></li>
</ul>
<div class="note"><div class="lab">One oddity worth naming before it is noticed</div><p>My out-of-time sample (235,628) is <b>larger</b> than my development sample (230,657), because originations expanded sharply in 2014. That is unusual. It means the later test is unusually well powered — not that the split was constructed backwards.</p></div>`},

{label:'DEFINE', tag:'Rare events', title:'Oversampling, and the correction it demands', stage:3, html:`
<p>Bad accounts are rare, so a common practice is to keep every bad and randomly discard a proportion of goods. This speeds estimation and, importantly, <b>leaves the slope coefficients unbiased</b>.</p>
<p>It does not leave the intercept unbiased. The model has been shown a population with an artificially high event rate, and every predicted probability is inflated accordingly. The correction is exact:</p>
<div class="formula">β₀ corrected = β₀ − ln( ρ₁ / ρ₀ )<small>ρ₁ = sampling fraction on bads · ρ₀ = on goods</small></div>
<p class="small">Because only the intercept moves, <b>ranking is untouched</b> and calibration is fully restored by one number. This is the first appearance of a pattern that runs through the whole subject: level is cheap to fix, order is not.</p>
<div class="note"><div class="lab">In my system</div><p>I did not oversample. 184,525 training rows containing 6,329 events is ample, so no correction applies — and saying so plainly is better than leaving a reader to wonder whether it was forgotten.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'The comfortable split', stage:2, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">A random 80/20 split is a sufficient test of a credit model.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">It measures generalisation <b>across accounts</b>, which is not where scorecards fail. They fail across <b>time</b>. Only a later period, held back completely, tests the property that actually matters — and a model can pass a random holdout comfortably in the same year it stops working.</div></div>
</div></div>
<div class="note"><div class="lab">The related mistake</div><p>Tuning against the out-of-time sample. Once a threshold is adjusted or a variable dropped because the out-of-time result improved, that sample has become a second training set and no longer measures anything. It can be looked at once, at the end.</p></div>`},

{label:'CLOSE', tag:'Mission 03', title:'What this mission established', stage:2, html:`
<ul class="own">
<li>Out-of-time validation tests the property that matters; random holdout tests the one that rarely fails</li>
<li>Stratification preserves the event rate so comparisons measure the model rather than the sample</li>
<li>Four leakage routes: binning on full data, post-outcome variables, overlapping accounts, selection on the target</li>
<li>Leakage inflates development performance — so an out-of-time result that beats development is not evidence of it</li>
<li>Oversampling biases only the intercept, and one subtraction removes the bias entirely</li>
</ul>
<div class="next"><div class="lab">Mission 04</div><div class="ttl">Ranking</div>
<p>Almost all the craft in a scorecard is in the transformation rather than the regression. Weight of evidence, information value, and the arithmetic that turns log-odds into points a credit officer can read.</p></div>`}
]},
{n:'04', title:'Ranking', stage:3,
 sub:'A scorecard is a logistic regression on transformed columns. The regression is the easy part — the craft is in the transformation, and in the arithmetic that converts a probability into points a credit officer can read.',
 covers:['Why raw variables fail','Fine and coarse classing','Weight of evidence and information value','Logistic regression, and why not linear','Scaling: points, factor and offset'],
 cards:[

{label:'MECHANISM', tag:'The problem', title:'Why raw variables cannot be used', stage:3, html:`
<p class="kicker">Feeding untransformed application data into a logistic regression fails for four separate reasons, each of which has its own cure and all of which have the same cure.</p>
<table class="tbl free">
<tr><td><b>Skew</b></td><td>Declared income is heavily right-skewed and partly fictional. A handful of large values dominate the fitted coefficient.</td></tr>
<tr><td><b>Non-monotonicity</b></td><td>Risk against age is a hump, not a line. A linear term fits the average of a shape it cannot represent.</td></tr>
<tr><td><b>Informative missingness</b></td><td>A blank income field is a fact about the applicant, not an absence of one. Dropping or imputing it destroys the signal.</td></tr>
<tr><td><b>Outliers</b></td><td>A single implausible value drags the coefficient for every applicant.</td></tr>
</table>
<div class="note"><div class="lab">The industry answer</div><p>Cut every variable into a small number of ranges, and replace each range with one number encoding its riskiness. All four problems dissolve at once, and the resulting model is readable by someone who has never seen a regression.</p></div>`},

{label:'DEFINE', tag:'Binning', title:'Fine classing, then coarse classing', stage:3, html:`
<p><b>Fine classing</b> cuts a variable into roughly twenty narrow bins and plots the bad rate of each. This is a diagnostic, not a model — it shows the shape of the relationship without assuming one.</p>
<p><b>Coarse classing</b> merges adjacent fine bins until three conditions hold:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">The bad-rate pattern is monotonic, or defensibly non-monotonic<em>A hump is acceptable if it can be explained; noise is not</em></span></li>
<li><span class="k">2</span><span class="v">Every bin holds at least about 5% of the sample<em>Below that the bin's bad rate is estimated on too few events to be stable</em></span></li>
<li><span class="k">3</span><span class="v">Adjacent bins differ meaningfully in bad rate<em>If two neighbours have the same risk, they are one bin wearing two labels</em></span></li>
</ul>
<div class="note"><div class="lab">Missing values get their own bin</div><p>Not imputed, not dropped. "Declined to state" is a category with its own bad rate, and it frequently turns out to be one of the more predictive categories in the variable.</p></div>`},

{label:'DEFINE', tag:'The transformation', title:'Weight of evidence', stage:3, html:`
<p>Each bin is replaced by the log-odds of that bin relative to the whole book:</p>
<div class="formula">WoE = ln( (goods in bin ÷ total goods)<br>÷ (bads in bin ÷ total bads) )<small>One number per bin</small></div>
<p>Read the sign directly: <b>positive weight of evidence means proportionally more goods than the book average</b> — the bin is safer than typical. Negative means riskier.</p>
<p class="small">Some houses put bads in the numerator, which flips every sign. Either convention is correct; mixing them within one model is not, and a sign that comes out unexpectedly is usually this rather than a modelling failure.</p>
<div class="note"><div class="lab">A bin with weight of evidence exactly zero</div><p>Its bad rate matches the book's. It carries no information and can be merged into a neighbour without any loss — which makes zero a useful thing to look for when simplifying a bin table.</p></div>`},

{label:'DEFINE', tag:'Ranking variables', title:'Information value', stage:3, html:`
<p>Information value summarises how well a single variable separates goods from bads, before any other variable is considered:</p>
<div class="formula">IV = Σ ( %goods − %bads ) × WoE<small>Summed across every bin</small></div>
<p class="small">Every term is non-negative, because the proportion difference and the log-ratio always carry the same sign. The measure cannot be reduced by adding a bin.</p>
<table class="tbl" style="margin-top:14px">
<thead><tr><th>Information value</th><th>Verdict</th></tr></thead>
<tr><td>Below 0.02</td><td>Useless</td></tr>
<tr><td>0.02 – 0.10</td><td>Weak</td></tr>
<tr><td>0.10 – 0.30</td><td>Medium</td></tr>
<tr><td>0.30 – 0.50</td><td>Strong</td></tr>
<tr class="hi"><td>Above 0.50</td><td>Suspect</td></tr>
</table>
<p class="small" style="margin-top:14px">The bands are conventions, not laws, but they are near-universal and a variable's band is the usual justification for keeping or dropping it at the shortlisting stage.</p>`},

{label:'WORKED', tag:'Arithmetic', title:'Weight of evidence and information value by hand', stage:3, html:`
<p class="kicker">90,000 goods and 10,000 bads. The variable is bureau enquiries in the last six months.</p>
<table class="tbl">
<thead><tr><th>Bin · G / B</th><th>WoE · contribution</th></tr></thead>
<tr><td>0 enquiries<span class="sub">22,500 / 1,200 → 25.0% G, 12.0% B</span></td><td>+0.7340<span class="sub" style="text-align:right">0.0954</span></td></tr>
<tr><td>1–2<span class="sub">27,000 / 3,000 → 30.0% G, 30.0% B</span></td><td>0.0000<span class="sub" style="text-align:right">0.0000</span></td></tr>
<tr><td>3–5<span class="sub">22,500 / 1,800 → 25.0% G, 18.0% B</span></td><td>+0.3285<span class="sub" style="text-align:right">0.0230</span></td></tr>
<tr><td>6+<span class="sub">18,000 / 4,000 → 20.0% G, 40.0% B</span></td><td>−0.6931<span class="sub" style="text-align:right">0.1386</span></td></tr>
<tr class="hi"><td><b>Information value</b></td><td>0.2570</td></tr>
</table>
<div class="note"><div class="lab">Two readings</div><p>0.257 is <b>medium</b> — genuinely useful, not dominant, and unlikely to be leakage. And the second bin's weight of evidence is exactly zero, so it could be merged into a neighbour and the variable would lose nothing.</p></div>`},

{label:'MECHANISM', tag:'Why bother', title:'Four things the transformation buys', stage:3, html:`
<ul class="spine">
<li><span class="k">1</span><span class="v">Linearity by construction<em>The transformed column is already expressed in log-odds, which is exactly the space a logistic regression assumes its inputs live in. The assumption is satisfied by design rather than hoped for.</em></span></li>
<li><span class="k">2</span><span class="v">Outliers capped inside their bins<em>An implausible income sits in the top bin and contributes exactly what the top bin contributes.</em></span></li>
<li><span class="k">3</span><span class="v">Missing values receive a coefficient<em>Rather than being dropped, imputed, or silently excluded.</em></span></li>
<li><span class="k">4</span><span class="v">A free diagnostic<em>Under one convention, every fitted coefficient should carry the same sign. A wrong-signed coefficient means multicollinearity or a badly constructed bin, and it is visible at a glance rather than after an investigation.</em></span></li>
</ul>
<div class="note"><div class="lab">The answer to "why not one-hot encoding"</div><p>One-hot encoding gives each bin its own free parameter, which delivers the first three benefits and destroys the fourth. It also multiplies the parameter count, and on a rare event that cost is real.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'The variable that is too good', stage:3, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">A very high information value is an excellent find.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Above roughly 0.5, suspect <b>leakage</b>. A variable that separates that cleanly is usually a <b>consequence</b> of the default rather than a predictor of it — and it will separate nothing at all when applied to a live application, because the value does not exist yet.</div></div>
</div></div>
<p class="small" style="margin-top:16px">The test is not statistical. It is a question about timing: <b>would this value exist, in this form, at the moment the decision is made?</b> If the answer needs qualification, the variable is out.</p>
<div class="note"><div class="lab">In my system</div><p>The offenders in my dataset are recoveries, total principal received and last payment amount. Each is recorded after origination, each is enormously predictive, and each is excluded from the PD model entirely — they are used only for severity and exposure, where they are legitimate inputs.</p></div>`},

{label:'DEFINE', tag:'The model', title:'Logistic regression, and why not linear', stage:4, html:`
<div class="formula">ln( p ÷ (1−p) ) = β₀ + β₁x₁ + … + βₖxₖ<small>p = probability of the defined event</small></div>
<table class="tbl free">
<tr><td><b>p ÷ (1−p)</b></td><td>The odds of being bad. Lenders conventionally quote the reciprocal — good-to-bad odds — so 50:1 means one bad in fifty-one.</td></tr>
<tr><td><b>β₀</b></td><td>The intercept. Sets the overall level of risk and nothing else.</td></tr>
<tr><td><b>βᵢ</b></td><td>Change in log-odds per unit of the input.</td></tr>
</table>
<p style="margin-top:16px">Linear regression fails on three counts: it can predict negative probabilities and probabilities above one; its errors are heteroscedastic on a binary outcome; and its coefficients have no odds interpretation.</p>
<div class="note"><div class="lab">The reason that matters most</div><p>The logit link is what makes the points transformation on the next card possible <b>at all</b>. Points are a linear rescaling of log-odds. Without a log-odds model there is nothing to rescale, and the readable scorecard that the entire lending industry runs on does not exist.</p></div>`},

{label:'IN MY SYSTEM', tag:'The build', title:'Two models, deliberately', stage:4, html:`
<p>I fitted two models rather than one, so that additional complexity had to justify itself against a stated benchmark.</p>
<table class="tbl">
<thead><tr><th>Metric</th><th>Model A · B</th></tr></thead>
<tr><td>Variables</td><td>7 · 10</td></tr>
<tr><td>Gini — train</td><td>0.3013 · 0.3678</td></tr>
<tr class="hi"><td>Gini — out-of-time</td><td>0.2715 · 0.3845</td></tr>
<tr><td>KS — out-of-time</td><td>0.1955 · 0.2843</td></tr>
<tr><td>Score stability</td><td>0.0046 · 0.0071</td></tr>
</table>
<p class="small" style="margin-top:14px">Model B earns its three extra variables: eleven Gini points out of time, at a trivial cost in stability. Both stability figures are an order of magnitude below the threshold at which anyone would investigate.</p>
<div class="note"><div class="lab">A library choice with a real reason</div><p>I fitted the PD model with <b>statsmodels</b> rather than scikit-learn, because a regulated scorecard has to demonstrate that every coefficient is statistically significant and correctly signed — which needs standard errors and p-values. Scikit-learn returns coefficients only, and applies L2 regularisation by default, which quietly biases them. I used scikit-learn where inference was not required.</p></div>`},

{label:'DEFINE', tag:'Presentation', title:'From log-odds to points', stage:5, html:`
<p>Nobody runs a lending business on log-odds. The score is a linear rescaling that preserves everything statistical and changes everything operational.</p>
<div class="formula">Score = Offset + Factor × ln(odds)<br>Factor = PDO ÷ ln 2<br>Offset = S₀ − Factor × ln(odds₀)<small>Anchored at a chosen score and a chosen odds</small></div>
<p><b>PDO</b> is <i class="term">points to double the odds</i>, conventionally 20. It means a score 20 points higher is exactly twice as safe, and 40 points higher four times as safe.</p>
<div class="note"><div class="lab">What is and is not changed</div><p>Scaling is a change of units, like Celsius to Fahrenheit. It alters no statistic, no ranking and no decision. What it alters is whether a credit officer, a collections manager and a branch head can all read the same number and mean the same thing by it.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'Deriving a scorecard scale', stage:5, html:`
<p class="kicker">Anchors: 600 points at 50:1 good-to-bad odds, with 20 points to double the odds.</p>
<ul class="steps">
<li><span class="op"><b>Factor</b>20 ÷ ln 2 = 20 ÷ 0.693147</span><span class="res">28.854</span></li>
<li><span class="op"><b>Offset</b>600 − 28.854 × ln 50</span><span class="res">487.12</span></li>
<li><span class="op"><b>Score an account at 25:1 odds</b>487.12 + 28.854 × 3.21888</span><span class="res">580</span></li>
<li><span class="op"><b>Its bad rate</b>1 ÷ (1 + 25)</span><span class="res">3.85%</span></li>
<li class="total"><span class="op"><b>Check the doubling at 620</b>exp((620 − 487.12) ÷ 28.854)</span><span class="res">≈ 100:1</span></li>
</ul>
<p class="small" style="margin-top:14px">Points are then distributed across characteristics so each attribute contributes a whole number, with the intercept spread evenly across the characteristics. An applicant scores, say, 41 for indebtedness, 58 for grade, 33 for tenor, summing to 580.</p>`},

{label:'TRAP', tag:'Costs money', title:'A score has no meaning by itself', stage:5, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">A score of 700 is good.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Meaningless without the scaling convention. 700 in one lender's scheme may be 40:1 odds and in another's 15:1 — a difference of nearly three times in risk, from the same number.</div></div>
</div></div>
<div class="note q"><div class="lab">The related confusion, and it is expensive</div><p>An internal score is <b>not</b> a bureau score, even when both run in the hundreds. The bureau score is an <b>input</b> to the internal scorecard. Treating them as interchangeable produces a model that is largely a noisy copy of the bureau's, and a lender whose credit decision has been quietly outsourced.</p></div>
<div class="note g"><div class="lab">The artefact that makes it usable</div><p>Score bands mapped to rating grades, each carrying an observed default rate. That table is the bridge from a continuous score to the discrete grades that pricing, limit-setting and reporting actually run on.</p></div>`},

{label:'TRADE-OFF', tag:'The perennial argument', title:'Scorecard against gradient boosting', stage:4, html:`
<p>A boosted tree ensemble typically beats a well-built scorecard by two to five Gini points in development, and frequently by much less out of time.</p>
<table class="tbl free">
<tr><td><b>What is gained</b></td><td>Interactions and non-linearity found automatically; a few points of separation.</td></tr>
<tr><td><b>What is lost</b></td><td>Readable points. Monotonicity, unless explicitly imposed — otherwise the model will happily learn that risk falls and then rises with income for no reason. Reason codes, which must be reconstructed afterwards. And validation time, which multiplies.</td></tr>
</table>
<div class="note"><div class="lab">The question that resolves it</div><p>Not "which scores higher" but <b>"how large is the gap out of time, and does it repay the cost"</b>. A six-point gap in development and one point out of time is not an uplift — it is evidence of overfitting, and the correct response is to investigate the development gap rather than ship the model.</p></div>
<div class="note g"><div class="lab">In my system</div><p>Logistic regression for the PD model, where interpretability is a regulatory requirement; gradient boosting inside the severity model, where nobody is declined on the basis of the estimate and no reason code is owed. Different job, different tool — and that, rather than a preference, is the defensible reason.</p></div>`},

{label:'CLOSE', tag:'Mission 04', title:'What this mission established', stage:3, html:`
<ul class="own">
<li>Raw variables fail four ways at once, and binning cures all four</li>
<li>Weight of evidence converts a bin into log-odds; information value ranks the variable</li>
<li>Above 0.5, information value signals leakage rather than quality — the test is whether the value exists at decision time</li>
<li>The logit link is what makes a readable points scorecard possible at all</li>
<li>Factor = PDO ÷ ln 2; the whole scale is two constants and an anchor</li>
<li>A score without its scaling convention carries no information</li>
</ul>
<div class="next"><div class="lab">Mission 05</div><div class="ttl">Three questions, three fixes</div>
<p>Does the model order correctly, is the number attached to each account right, and is it still being asked about the same people? Three separate properties, three separate statistics, and only one of them is cheap to repair.</p></div>`}
]},
{n:'05', title:'Three questions', stage:6,
 sub:'Validation is not one activity. It is three unrelated questions about three unrelated properties, each with its own statistic and its own remedy — and conflating them is the most common error in model discussion.',
 covers:['Discrimination: ROC, Gini, KS','Calibration: Brier, Hosmer–Lemeshow','Stability: PSI and CSI','Why level is cheap and order is not','Point-in-time against through-the-cycle'],
 cards:[

{label:'ORIENT', tag:'The framework', title:'Order, level, population', stage:6, html:`
<table class="tbl free">
<tr><td><b>Does it order correctly?</b><span class="sub">Discrimination · AUROC, Gini, KS</span></td><td>If it fails: <b>redevelop</b>. No transformation of a score restores separation that is not in it.</td></tr>
<tr><td><b>Is the number right?</b><span class="sub">Calibration · Brier, Hosmer–Lemeshow, observed against expected</span></td><td>If it fails: <b>recalibrate</b>. Usually one intercept shift.</td></tr>
<tr><td><b>Same people?</b><span class="sub">Stability · PSI, CSI</span></td><td>If it fails: <b>investigate</b> which variable moved, before touching the model at all.</td></tr>
</table>
<div class="note"><div class="lab">The asymmetry that governs monitoring</div><p>Level is one additive constant and nearly free to fix. Order cannot be repaired by any transformation, because the information is simply absent. This is why a fall in Gini triggers redevelopment and a drift in observed default rate triggers only recalibration — two very different conversations, and two very different budgets.</p></div>`},

{label:'DEFINE', tag:'Discrimination', title:'ROC, AUROC and Gini', stage:6, html:`
<p>The <b>ROC curve</b> plots, at every possible score cut-off, the cumulative share of bads captured against the cumulative share of goods rejected. A useless model traces the diagonal; a perfect one reaches the top-left corner.</p>
<p><b>AUROC</b> is the area under it, and it has a clean interpretation: <b>the probability that a randomly chosen bad scores worse than a randomly chosen good.</b> 0.5 is a coin toss.</p>
<div class="formula">Gini = 2 × AUC − 1<small>Useless = 0 · perfect = 1</small></div>
<table class="tbl" style="margin-top:4px">
<thead><tr><th>Typical range</th><th>Gini</th></tr></thead>
<tr><td>Application scorecard, thin data</td><td>0.35 – 0.55</td></tr>
<tr class="hi"><td>Behavioural scorecard, own repayment history</td><td>0.60 – 0.80</td></tr>
</table>
<p class="small" style="margin-top:14px">The gap between those two rows is not modelling skill. It is information: six months of watching an account pay is worth more than everything on an application form.</p>`},

{label:'DEFINE', tag:'Discrimination', title:'Kolmogorov–Smirnov', stage:6, html:`
<div class="formula">KS = max | F<sub>bad</sub>(s) − F<sub>good</sub>(s) |<small>Largest gap between the two cumulative distributions</small></div>
<p>KS answers a narrower question than Gini: <b>how good is the single best cut-off?</b> Gini integrates performance across every possible cut-off; KS reports the one point where separation is widest.</p>
<p>That narrowness is exactly why it survives in operational reporting. A collections manager or a policy owner is not choosing among all cut-offs — they are choosing one, and KS speaks about the one.</p>
<div class="note"><div class="lab">Reading the two together</div><p>A high Gini with a low KS means separation is spread thinly across the range. A high KS with a modest Gini means the model is excellent at one boundary and ordinary elsewhere — which is entirely acceptable if the business only ever cuts at that boundary.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'Gini and KS from a five-band table', stage:6, html:`
<p class="kicker">Equal fifths of the population, worst-scoring first. Bads: 40, 25, 15, 12, 8%. Goods: 18, 19, 20, 21, 22%.</p>
<table class="tbl">
<thead><tr><th>Band · cum. goods → cum. bads</th><th>Trapezoid</th></tr></thead>
<tr><td>1 · 0.18 → 0.40</td><td>0.03600</td></tr>
<tr><td>2 · 0.37 → 0.65</td><td>0.09975</td></tr>
<tr><td>3 · 0.57 → 0.80</td><td>0.14500</td></tr>
<tr><td>4 · 0.78 → 0.92</td><td>0.18060</td></tr>
<tr><td>5 · 1.00 → 1.00</td><td>0.21120</td></tr>
<tr><td><b>Area under the curve</b></td><td>0.67255</td></tr>
<tr class="hi"><td><b>Gini = 2 × AUC − 1</b></td><td>0.345</td></tr>
<tr class="hi"><td><b>KS</b> — widest gap, at band 3</td><td>0.23</td></tr>
</table>
<p class="small" style="margin-top:14px">Each trapezoid is ½ × (start + end cumulative bads) × width in goods. The KS is simply the largest vertical difference in the same table: 0.80 − 0.57 at band three.</p>`},

{label:'DEFINE', tag:'Calibration', title:'Level is a different property entirely', stage:7, html:`
<p><b>Discrimination</b> asks whether the defaulter was placed below the non-defaulter. <b>Calibration</b> asks whether, of all the accounts assigned a 4% probability, about 4% actually defaulted.</p>
<p>Discrimination survives <b>any</b> monotonic transformation of the score. Calibration can be destroyed or repaired without touching the ordering at all. They are independent properties and a model can have either without the other.</p>
<table class="tbl free">
<tr><td><b>Brier score</b></td><td>Mean squared error between predicted probability and the 0/1 outcome. On a rare event it is dominated by the base rate, so it compares two models on the same data and means little in absolute terms.</td></tr>
<tr><td><b>Hosmer–Lemeshow</b></td><td>Sort by predicted probability, cut into deciles, chi-square observed against expected. <b>The null hypothesis is that the model is well calibrated</b> — so a <b>low</b> p-value rejects calibration.</td></tr>
</table>
<div class="note"><div class="lab">Who needs which</div><p>A sanction cut-off needs order only. Pricing and provisioning need level, because they multiply the probability by money. A model with a Gini of 0.5 and probabilities uniformly half of reality will sanction well and under-provision by half.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'Recalibrating with one number', stage:7, html:`
<p class="kicker">A book's central tendency moves from a 3.0% default rate to 4.5%. The ranking is unchanged; only the level is wrong.</p>
<ul class="steps">
<li><span class="op"><b>New log-odds</b>ln(0.045 ÷ 0.955)</span><span class="res">−3.0524</span></li>
<li><span class="op"><b>Old log-odds</b>ln(0.030 ÷ 0.970)</span><span class="res">−3.4761</span></li>
<li class="total"><span class="op"><b>Add to the intercept</b></span><span class="res">+0.4237</span></li>
</ul>
<p style="margin-top:14px">Every predicted probability rises. Every ranking is identical. Expressed in scorecard points it is a parallel shift of the entire scale.</p>
<div class="note"><div class="lab">The richer alternative</div><p><b>Platt scaling</b> fits a second logistic regression of the outcome on the model's own log-odds, which permits both a shift and a change of slope. Use it when miscalibration differs across the score range rather than sitting uniformly across it — a slope problem cannot be fixed by an intercept.</p></div>`},

{label:'THE HARD QUESTION', tag:'Owning a failure', title:'A calibration test that fails on the larger sample', stage:7, html:`
<p class="kicker">In my system, Hosmer–Lemeshow passes on the test partition (p = 0.494) and fails badly out of time (p = 0.00117). The complete answer has three parts and none of them is a defence.</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">The statistic scales with sample size<em>Chi-square grows with n. At 235,628 rows a deviation of a few basis points per decile — economically meaningless — is statistically significant. The same relative deviation at 46,132 rows passes comfortably.</em></span></li>
<li><span class="k">2</span><span class="v">There is also genuine drift, and it should be said<em>The later vintage runs slightly hotter than the development period, and the model was fitted on earlier conditions.</em></span></li>
<li><span class="k">3</span><span class="v">Recalibration aligned the mean and did not rescue the p-value<em>Which is the expected result, and is the point: the test was never measuring what it was being asked to measure at this sample size.</em></span></li>
</ul>
<div class="note"><div class="lab">The operational test that replaces it</div><p><b>Observed against expected default rate by score band</b>, with a binomial confidence interval around each expected value. Failing in one direction across every band means miscalibration — fix the intercept. Failing randomly across bands means the test is under-powered, not that the model is biased.</p></div>`},

{label:'DEFINE', tag:'A distinction that decides everything', title:'Point-in-time and through-the-cycle', stage:7, html:`
<table class="tbl free">
<tr><td><b>Point-in-time</b></td><td>Conditions on everything known today, including the state of the economy. Rises in a downturn and falls in a boom.</td></tr>
<tr><td><b>Through-the-cycle</b></td><td>A long-run average for a grade, deliberately insensitive to the cycle. Stable by design.</td></tr>
</table>
<p style="margin-top:16px">Neither is more correct. They answer different questions, and the framework consuming the number decides which is required.</p>
<ul class="spine">
<li><span class="k">ECL</span><span class="v">Requires point-in-time<em>Because it asks what is expected now, under current and forecast conditions</em></span></li>
<li><span class="k">CAP</span><span class="v">Basel prefers through-the-cycle<em>So that capital requirements do not swing violently with the cycle and force lending to contract exactly when it is most needed</em></span></li>
</ul>
<div class="note"><div class="lab">The honest position most models occupy</div><p>Almost every real model sits somewhere between the two, and closer to point-in-time than its documentation admits. Mine is fitted on pooled 2007–2013 vintages, which makes it closer to through-the-cycle than a provisioning model strictly ought to be — a limitation worth stating rather than discovering later.</p></div>`},

{label:'DEFINE', tag:'Stability', title:'Population stability index', stage:8, html:`
<div class="formula">PSI = Σ ( Aᵢ − Eᵢ ) × ln( Aᵢ ÷ Eᵢ )<small>A = actual share in band · E = expected share from development</small></div>
<p>PSI does not ask whether the model is still right. It asks whether <b>the model is still being shown the same kind of people</b>. Bands are usually deciles of the development score distribution, so that none is empty.</p>
<table class="tbl">
<thead><tr><th>PSI</th><th>Action</th></tr></thead>
<tr><td>Below 0.10</td><td>Stable</td></tr>
<tr><td>0.10 – 0.25</td><td>Investigate</td></tr>
<tr class="hi"><td>Above 0.25</td><td>Shifted</td></tr>
</table>
<div class="note"><div class="lab">The companion measure</div><p><b>CSI</b> — characteristic stability index — is the identical arithmetic applied to a single input variable rather than to the score. The score index shows <b>that</b> the population moved; the characteristic index shows <b>which variable</b> moved it. Without the second, an alert is an alarm with no address.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'Population stability by hand', stage:8, html:`
<table class="tbl">
<thead><tr><th>Band · expected → actual</th><th>Contribution</th></tr></thead>
<tr><td>1 · 0.20 → 0.12</td><td>0.040866</td></tr>
<tr><td>2 · 0.20 → 0.18</td><td>0.002107</td></tr>
<tr><td>3 · 0.20 → 0.22</td><td>0.001906</td></tr>
<tr><td>4 · 0.20 → 0.24</td><td>0.007293</td></tr>
<tr><td>5 · 0.20 → 0.24</td><td>0.007293</td></tr>
<tr class="hi"><td><b>PSI</b></td><td>0.0595</td></tr>
</table>
<p style="margin-top:14px">Below 0.10, so stable. And note the direction: the shift is <b>favourable</b> — fewer applicants in the worst band, more in the best.</p>
<div class="note"><div class="lab">The property that catches people out</div><p><b>PSI is unsigned.</b> It measures movement without saying whether the movement is good or bad news. A headline PSI of 0.18 could be a deteriorating book or a successful shift into a better customer segment. Read the band decomposition; never act on the headline.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'When a falling Gini means nothing at all', stage:8, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">Gini fell from 0.42 to 0.36, so the model has degraded.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Gini is a property of the model <b>and</b> of the population it is measured on. Tightening a cut-off removes the worst accounts — the easiest ones to rank — and lowers measured Gini <b>mechanically</b>, with no change to the model whatsoever. This is <i class="term">range restriction</i>.</div></div>
</div></div>
<p class="small" style="margin-top:16px">The consequence: sanctioned-book Gini is not comparable across periods with different approval rates. Compare only at equal approval rates, or measure on through-the-door data covering everyone who applied.</p>
<div class="note"><div class="lab">The order of investigation</div><p>Approval rate first. Then population stability. Then discrimination on through-the-door data. Only after all three does redevelopment become the right answer — and by then it is usually clear which variable caused it.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'A high Gini is not a good model', stage:6, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">A high-Gini model is a good model.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Gini says nothing about <b>level</b>. A model with perfect ranking and probabilities at half of reality under-provisions by half — and its Gini would be 1.0. Ordering and truth are independent properties, and only one of them is what the accounts consume.</div></div>
</div></div>
<div class="note"><div class="lab">The related misreading</div><p>An out-of-time Gini <b>higher</b> than the development figure is not a triumph. On a young cohort it is usually a truncation artefact: early defaults concentrate among the very worst grades, which makes ranking artificially easy, and the advantage disappears as the cohort matures and ordinary deterioration fills in the middle.</p></div>
<div class="note g"><div class="lab">In my system</div><p>Exactly this pattern appears — out-of-time Gini 0.3845 against 0.3678 in training. The evidence it is seasoning rather than leakage: leakage inflates <b>training</b> performance, not later performance, and my simpler model decays normally over the same partitions, which locates the effect in the model rather than in the sample construction.</p></div>`},

{label:'CLOSE', tag:'Mission 05', title:'What this mission established', stage:6, html:`
<ul class="own">
<li>Three questions, three statistics, three different remedies — never one activity called "validation"</li>
<li>AUROC is the probability a random bad scores worse than a random good; Gini rescales it</li>
<li>Calibration is repaired by one number; discrimination cannot be repaired at all</li>
<li>Hosmer–Lemeshow scales with sample size, so on large books it rejects economically trivial deviations</li>
<li>PSI is unsigned and needs its band decomposition read; CSI names the variable responsible</li>
<li>Range restriction makes sanctioned-book Gini incomparable across different approval rates</li>
</ul>
<div class="next"><div class="lab">Mission 06</div><div class="ttl">Severity and exposure</div>
<p>Probability gets the attention; severity gets the money. A distribution with half its mass at total loss breaks the standard tools, and the fix is a model in two parts.</p></div>`}
]},
{n:'06', title:'Severity and exposure', stage:9,
 sub:'Probability gets the attention; severity gets the money. A recovery distribution with half its mass at total loss breaks every standard regression — and the exposure that severity multiplies is not the balance on the books today.',
 covers:['LGD, properly defined','Why retail severity is bimodal','The two-part hurdle model','Recovery routes in India','Exposure, headroom and the conversion factor'],
 cards:[

{label:'DEFINE', tag:'Severity', title:'Loss given default, with nothing left out', stage:9, html:`
<div class="formula">LGD = 1 − [ Σ (Rₜ − Cₜ) ÷ (1+d)ᵗ ] ÷ EAD<small>R = cash recovered · C = cost of recovering it · d = discount rate</small></div>
<p>Each qualification removes an illusion:</p>
<ul class="spine">
<li><span class="k">t</span><span class="v">Recovery arrives over years, so it must be discounted<em>Under expected credit loss accounting the prescribed rate is the effective interest rate at initial recognition. A rupee recovered in year four is not a rupee.</em></span></li>
<li><span class="k">C</span><span class="v">Collection costs are real and must be netted<em>Legal fees, valuation, auction expenses, agency commission. A gross recovery rate flatters every book that reports it.</em></span></li>
<li><span class="k">≠</span><span class="v">Post-default interest charged is not recovery<em>Interest that accrues on a defaulted account and is never paid inflates both the numerator and the borrower's apparent debt, and recovers nothing.</em></span></li>
</ul>
<div class="note"><div class="lab">The definition in one line</div><p>Severity is the fraction of exposure that <b>never comes back</b>, measured in today's money, after paying for the effort of chasing it.</p></div>`},

{label:'MECHANISM', tag:'The shape', title:'Why retail severity is bimodal', stage:9, html:`
<p>Retail recovery distributions are not bell-shaped. They have mass at both ends and very little in between, because default resolves in one of two ways:</p>
<table class="tbl free">
<tr><td><b>Near-full recovery</b></td><td>The account cures, or secured collateral is sold and clears the debt.</td></tr>
<tr><td><b>Near-total loss</b></td><td>An unsecured balance is written off with a token recovery, or none.</td></tr>
</table>
<p style="margin-top:16px">The consequence is uncomfortable: <b>an average severity of 30% may describe almost no individual account.</b> The mean sits in the empty middle of the distribution, between the two places where accounts actually land.</p>
<div class="note"><div class="lab">The second structural feature</div><p>Severity is correlated with probability, <b>in the same direction</b>. Property prices fall, so defaults rise and recoveries shrink together. The two parameters that multiply each other in the loss equation both worsen at the same moment — which is precisely why capital rules require severity estimated under downturn conditions rather than long-run average ones.</p></div>`},

{label:'MECHANISM', tag:'The India effect', title:'All-or-nothing cure sharpens the split', stage:9, html:`
<p>The bimodality has a specifically Indian amplifier. Because an account returns to standard only when the <b>entire</b> arrears of interest and principal are cleared across <b>all</b> facilities of that borrower, cure is a step function.</p>
<p>There is no partial upgrade. A borrower who clears 80% of arrears is exactly as non-performing as one who clears none. So accounts do not drift back toward health — they either make the full jump or they do not, and the recovery distribution inherits that shape directly.</p>
<div class="note"><div class="lab">The practical reading</div><p>Any severity model built on Indian retail data should be tested for a mass point at full recovery as well as at total loss. A single average, or a model that assumes a smooth distribution between the two, will be wrong in both directions simultaneously and right on the portfolio total — which is the most dangerous combination available, because the total looks correct.</p></div>`},

{label:'DEFINE', tag:'The right tool', title:'The two-part hurdle model', stage:9, html:`
<p>A <i class="term">hurdle model</i> handles an outcome with a point mass at one value plus a continuous distribution elsewhere. It splits one question into two:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">Does anything come back at all?<em>A binary classification, fitted on every default</em></span></li>
<li><span class="k">2</span><span class="v">Given that something came back, how much?<em>A continuous regression, fitted only on the accounts that recovered something</em></span></li>
</ul>
<div class="formula">LGD = 1 − P(recovery) × RR<sub>positive</sub><small>Probability of recovering, times the size if it happens</small></div>
<p class="small">Why a single model fails: ordinary least squares fits a conditional mean through a distribution that is half at zero, predicting small positive recoveries for accounts that will recover nothing and understating those that will recover something. Beta regression assumes support strictly between zero and one and cannot represent a mass at the boundary at all. A tobit handles one boundary but not two.</p>`},

{label:'IN MY SYSTEM', tag:'The build', title:'What the distribution forced', stage:9, html:`
<p>On 50,968 defaulted loans:</p>
<table class="tbl">
<tr class="hi"><td>Mean severity</td><td>93.01%</td></tr>
<tr><td>Median severity</td><td>100%</td></tr>
<tr class="hi"><td>Defaults recovering nothing at all</td><td>52.18%</td></tr>
<tr><td>Defaults with any recovery</td><td>47.82%</td></tr>
<tr><td>Mean recovery rate where recovery occurred</td><td>6.99%</td></tr>
</table>
<p style="margin-top:14px">The 93% is not an error. It is the arithmetic consequence of a majority point mass at total loss on uncollateralised consumer paper charged off after months of non-payment.</p>
<div class="note"><div class="lab">The architecture, and why each half uses a different tool</div><p>A <b>logistic classifier</b> for recovery incidence, where a calibrated probability and an interpretable direction are wanted. A <b>gradient boosting regressor</b> for conditional magnitude, where the relationship is genuinely non-linear across loan size, grade and tenor, and where no reason code is owed to anyone because nobody is declined on the basis of a severity estimate.</p></div>
<div class="note g"><div class="lab">The result that matters</div><p>Classifier AUC 0.6416 — modest, and honestly so: predicting whether a charged-off borrower will ever pay anything is genuinely hard. But mean absolute calibration error across severity deciles is <b>under 0.005</b>. Weak discrimination, strong calibration — which is the correct trade for a parameter that multiplies money rather than ranking applicants.</p></div>`},

{label:'INDIA', tag:'Where the money comes from', title:'Recovery route by security', stage:9, html:`
<p class="kicker">Severity in India is decided less by the borrower than by what secures the loan. The routes differ by an order of magnitude in speed and completeness.</p>
<table class="tbl free">
<tr><td><b>Gold</b></td><td>Auction under a prescribed process; the collateral is already in the lender's vault. Fastest and most complete recovery in Indian retail. Pledged gold must be returned within seven working days of closure.</td></tr>
<tr><td><b>Vehicle</b></td><td>Repossession and resale. Months, at a value that has already depreciated sharply — often faster than the loan amortises.</td></tr>
<tr><td><b>Housing</b></td><td><b>SARFAESI, 2002</b> permits enforcement without a court: 60-day notice, then possession and sale. Applies to secured debts above ₹1 lakh, and not to agricultural land. Contested matters go to a Debts Recovery Tribunal above ₹20 lakh. Months to years.</td></tr>
<tr><td><b>Unsecured and cards</b></td><td>In-house collections, then agencies, then settlement, then sale to an asset reconstruction company or a debt purchaser. Slowest, least complete.</td></tr>
</table>
