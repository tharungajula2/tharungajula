<div class="note"><div class="lab">Why the ladder matters for modelling</div><p>Severity should never be modelled across a mixed retail book without segmenting by security type. The four rows above are four different distributions, and pooling them produces a mean that describes none of them.</p></div>`},

{label:'INDIA', tag:'The regulatory floor', title:'Backstop severity, and what counts as secured', stage:9, html:`
<p>When a lender cannot reliably estimate its own severity, the rulebook supplies one — and deliberately makes it punitive, so that investing in recovery data pays for itself.</p>
<table class="tbl">
<tr><td>Secured portion</td><td>65%</td></tr>
<tr class="hi"><td>Unsecured portion</td><td>70%</td></tr>
<tr><td>Cash, gold, government securities, LIC policies, KVP, NSC</td><td>30%</td></tr>
</table>
<div class="note q"><div class="lab">A distinction that surprises people</div><p>Land, buildings, plant, machinery and current assets are <b>not</b> eligible collateral for defining the secured portion of a non-performing asset under the capital rules. An exposure can therefore be <b>commercially secured and regulatorily unsecured at the same time</b> — a real asset stands behind it, and the rules still treat the exposure as bare.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'Budgeting to the average severity', stage:9, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">The average severity is 30%, so assume 30% per account.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">The distribution is bimodal, so the mean sits where no accounts are. If reality is 60% of accounts at 5% severity and 40% at 67%, a flat 30% gets the portfolio total exactly right and prices and provisions <b>every individual segment wrongly, in both directions</b>.</div></div>
</div></div>
<div class="note"><div class="lab">Why the total being right is the danger</div><p>A portfolio-level check will pass. Reconciliation will pass. The error only surfaces in decisions taken segment by segment — which segments to grow, which to price up, which to collect harder — and those decisions are the ones the model existed to inform.</p></div>`},

{label:'DEFINE', tag:'Exposure', title:'What is owed when it goes wrong', stage:10, html:`
<p>Exposure at default asks how much will be owed <b>at the moment default happens</b>, which is not today's balance. Two product types move in opposite directions:</p>
<table class="tbl free">
<tr><td><b>Amortising loans</b></td><td>The balance <b>falls</b> over time. Exposure is read off the amortisation schedule, and using the sanctioned amount overstates it substantially.</td></tr>
<tr><td><b>Revolving products</b><span class="sub">Cards, overdrafts, cash credit</span></td><td>The balance <b>rises</b>, because a borrower heading into distress draws down remaining headroom. Captured by the credit conversion factor.</td></tr>
</table>
<div class="formula">EAD = B + CCF × ( L − B )<small>B = drawn balance · L = limit · L − B = undrawn headroom</small></div>
<p class="small">The conversion factor is the fraction of the unused line expected to be drawn before default. It is an empirical quantity, estimated from what distressed borrowers actually did in the months before failing — and observed drawdown on stressed card portfolios routinely exceeds what the regulatory minimum assumes.</p>`},

{label:'IN MY SYSTEM', tag:'The build', title:'Exact where possible, demonstrated where not', stage:10, html:`
<p>My book is fixed-term instalment loans with no undrawn commitment, so exposure is <b>computed exactly rather than modelled</b>: funded amount minus principal repaid, floored at zero.</p>
<table class="tbl">
<tr><td>Mean exposure on defaulted loans</td><td>$10,781.56</td></tr>
<tr class="hi"><td>Exposure ÷ original funded amount</td><td>0.7193</td></tr>
</table>
<p style="margin-top:14px">That ratio is the amortisation effect quantified: by the time these loans default, about 28% of principal has been repaid. Using the sanctioned amount as exposure would overstate the book by roughly 39%.</p>
<div class="note"><div class="lab">Where I could not use real data, and how I marked it</div><p>With no revolving exposure in the dataset, I simulated a 5,000-account revolving portfolio and regressed realised conversion factors on utilisation and limit, to demonstrate the method. <b>Every output file from it carries a SYNTHETIC prefix</b> — the naming convention is the audit trail, so no result can be mistaken for a measurement.</p></div>
<div class="note q"><div class="lab">And the flaw in it, stated first</div><p>I used ordinary least squares for a quantity bounded between zero and one, and clip predictions to the range in code. That is a patch, not a fix. The correct tools are fractional logit or beta regression, which respect the bounds naturally, or a hurdle structure where there is mass at both ends.</p></div>`},

{label:'INDIA', tag:'A rule that just changed', title:'Unused card limits stop being free', stage:10, html:`
<p>Commitments a lender can cancel unconditionally at any time — which is how most Indian credit card limits are documented — previously attracted a <b>zero</b> conversion factor. The unused line consumed no capital at all.</p>
<table class="tbl">
<tr class="hi"><td>Unconditionally cancellable, from 1 Apr 2027</td><td>5%</td></tr>
<tr><td>The same, after three years</td><td>10%</td></tr>
<tr><td>Other commitments, original maturity up to a year</td><td>30% → 40%</td></tr>
<tr><td>Other commitments, longer maturity</td><td>40%</td></tr>
</table>
<p class="small" style="margin-top:14px">A lender's own estimate may and generally should be higher than the regulatory minimum, because observed drawdown in the twelve months before default on a distressed card book typically far exceeds a tenth of the headroom.</p>
<div class="note"><div class="lab">Why this is more than a technical change</div><p>Every unused rupee of card limit in the country acquires a capital cost on a fixed date. Limit-granting strategy, which has been effectively free at the margin, becomes a balance-sheet decision.</p></div>`},

{label:'TRADE-OFF', tag:'The obvious lever', title:'Cutting limits to cut exposure', stage:10, html:`
<p>Reducing unused limits cuts exposure immediately and mechanically, which cuts expected loss, provisions and — from 2027 — capital. It is the fastest exposure lever available.</p>
<table class="tbl free">
<tr><td><b>What it also does</b></td><td>Removes revenue from customers who would have borrowed profitably. Insults good customers, who notice. And withdraws household liquidity precisely when limit-cutting programmes tend to run — during stress.</td></tr>
</table>
<div class="note"><div class="lab">The usual compromise</div><p>Cut headroom only where a behavioural score has deteriorated <b>and</b> utilisation is already high. The first condition finds risk; the second finds accounts where the headroom is actually likely to be drawn. Either alone cuts the wrong customers.</p></div>`},

{label:'CLOSE', tag:'Mission 06', title:'What this mission established', stage:9, html:`
<ul class="own">
<li>Severity is measured net of collection costs and discounted to the default date, or it is flattered</li>
<li>Retail severity is bimodal, so the mean frequently describes no account in the book</li>
<li>India's all-or-nothing upgrade rule sharpens that split into a step function</li>
<li>A hurdle model splits incidence from magnitude, because ordinary regression cannot represent a mass point</li>
<li>Recovery route follows security: gold, vehicle, housing under SARFAESI, then unsecured</li>
<li>Exposure falls on amortising loans and rises on revolving ones; the conversion factor prices the headroom</li>
</ul>
<div class="next"><div class="lab">Mission 07</div><div class="ttl">The term structure</div>
<p>Accounting does not stop at twelve months, so a single probability is not enough. Hazard, survival, and why a five-year default rate is nowhere near five times the one-year rate.</p></div>`}
]},
{n:'07', title:'The term structure', stage:11,
 sub:'A single twelve-month probability cannot answer a question about a five-year loan. Extending it requires conditional probabilities that compound over survival — and the compounding is where intuition fails.',
 covers:['Hazard, survival and marginal probability','Compounding by hand','Seasoning and the vintage curve','Anchoring a curve at both ends','Scaling a portfolio curve to one account'],
 cards:[

{label:'DEFINE', tag:'The building block', title:'Hazard is a conditional probability', stage:11, html:`
<p>The <i class="term">hazard rate</i> in period t is the probability of defaulting <b>in</b> that period, <b>given survival to the start of it</b>.</p>
<p>The conditioning is what makes hazards composable. An unconditional probability of defaulting in year three is not a property of year three — it depends on having survived years one and two. A hazard is a property of year three alone, and hazards from different periods can therefore be chained.</p>
<div class="formula">Sₜ = Π (1 − hₖ)  for k ≤ t<br>PDₜ marginal = Sₜ₋₁ × hₜ<small>Survival, and the unconditional probability of failing in period t</small></div>
<table class="tbl free" style="margin-top:4px">
<tr><td><b>Survival</b></td><td>The running product of not-defaulting.</td></tr>
<tr><td><b>Marginal PD</b></td><td>The unconditional probability of defaulting in period t: survive to t, then fail.</td></tr>
<tr><td><b>Cumulative PD</b></td><td>1 − Sₜ, and equally the sum of all marginals to that point.</td></tr>
</table>`},

{label:'WORKED', tag:'Arithmetic', title:'Why the years do not add up', stage:11, html:`
<p class="kicker">Conditional default rates of 4%, 6% and 8% across three years.</p>
<table class="tbl">
<thead><tr><th>Year · survival → marginal</th><th>Cumulative</th></tr></thead>
<tr><td>1 · 1.0000 → 0.0400</td><td>0.0400</td></tr>
<tr><td>2 · 0.9600 → 0.0576</td><td>0.0976</td></tr>
<tr><td>3 · 0.9024 → 0.0722</td><td>0.1698</td></tr>
<tr class="hi"><td><b>Check: 1 − (0.96)(0.94)(0.92)</b></td><td>0.169792</td></tr>
</table>
<p style="margin-top:14px">Two facts fall out. Marginal probabilities <b>sum</b> to the cumulative probability. And the cumulative probability (16.98%) is always <b>less</b> than the sum of the conditional rates (18%) — because an account cannot default twice, and the accounts available to fail in year three are only those that survived.</p>
<div class="note"><div class="lab">The general shape</div><p>The gap between the sum of hazards and the true cumulative widens as hazards rise and as the horizon lengthens. On a high-risk book over five years the naive sum can overstate lifetime risk by a third.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'Multiplying by the number of years', stage:11, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">Lifetime probability is the twelve-month probability times the number of years.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Wrong for three independent reasons. Marginal probabilities compound over <b>survival</b>, so later years contribute less than their raw hazard. Exposure <b>amortises</b>, so later defaults strike a smaller balance. And conditional rates are <b>not flat</b> — they peak early and decay.</div></div>
</div></div>
<div class="note"><div class="lab">The demonstration from my own curve</div><p>Twelve-month cumulative probability 3.44%. Naive five-year figure: 5 × 3.44% = 17.2%. Actual sixty-month cumulative: <b>10.93%</b>. The naive method overstates lifetime risk by well over half, and it would flow straight into a provision.</p></div>`},

{label:'IN MY SYSTEM', tag:'The build', title:'A sixty-month curve, anchored at both ends', stage:11, html:`
<p>I built the curve empirically rather than assuming a functional form: for each month on book, the hazard is defaults occurring in that month divided by accounts still alive at its start, then chained into survival and cumulative probability.</p>
<table class="tbl">
<thead><tr><th>Horizon</th><th>Cumulative PD</th></tr></thead>
<tr><td>1 month</td><td>0.0806%</td></tr>
<tr class="hi"><td>12 months</td><td>3.4352%</td></tr>
<tr><td>24 months</td><td>6.3462%</td></tr>
<tr><td>36 months</td><td>9.3156%</td></tr>
<tr class="hi"><td>60 months</td><td>10.9306%</td></tr>
</table>
<div class="note g"><div class="lab">The consistency check the curve gives for free</div><p>The twelve-month point reproduces the <b>observed</b> twelve-month default rate of 3.4352%. The sixty-month point reproduces the <b>observed</b> lifetime rate of 10.9307%. Two independent anchors from one construction — and had they not matched, the hazard extraction would have been wrong somewhere.</p></div>`},

{label:'DEFINE', tag:'The shape', title:'Seasoning, and the vintage curve', stage:11, html:`
<p>Read down my curve and the shape is textbook: steep from months six to twenty-four, then flattening hard. Between month thirty-six and month sixty it adds only 1.6 percentage points.</p>
<p>This is <i class="term">seasoning</i>. Bad rates start near zero — nobody is ninety days overdue in month one — climb to a peak between roughly nine and eighteen months on unsecured products, then flatten as the surviving population self-selects toward reliable payers.</p>
<div class="note"><div class="lab">The axis that reveals it</div><p>Plot bad rate against <b>months on book</b>, grouping accounts by the month they were disbursed. That is a <i class="term">vintage curve</i>, and it removes the growth distortion entirely because no two cohorts are ever mixed.</p></div>
<div class="note q"><div class="lab">The consequence for reading any portfolio</div><p>Read a book by <b>calendar time</b> and the economy gets blamed. Read it by <b>months on book</b> and the hump appears. A portfolio growing at 30% a year looks better than it is, simply because it is full of young accounts that have not yet had time to fail.</p></div>`},

{label:'MECHANISM', tag:'From portfolio to account', title:'Giving one account its own curve', stage:11, html:`
<p>Accounting requires a lifetime probability for <b>each</b> account, but an empirical hazard curve is a portfolio-level object. The bridge is a scaling assumption.</p>
<div class="formula">PD lifetime (account) =<br>CumPD portfolio (remaining term)<br>× ( PD 12m account ÷ PD 12m portfolio )<small>Evaluated at each account's remaining term</small></div>
<p>In my system this is floored at one month, capped at original tenure, and clipped to the unit interval.</p>
<div class="note q"><div class="lab">The assumption hiding inside it</div><p>This is <b>proportional hazards in disguise</b>: it assumes relative riskiness is constant across the term, so a risky account is riskier by the same multiple in month forty as in month four. That is a real simplification, and it is not true — risky accounts fail earlier as well as more often.</p></div>
<div class="note g"><div class="lab">The better version</div><p>A discrete-time hazard model with account-level covariates, or a Cox model, which lets the <b>shape</b> of the curve vary by risk grade rather than only its level. That change matters most for long-tenor products, where a front-loaded hazard and a flat one produce very different lifetime provisions from the same twelve-month probability.</p></div>`},

{label:'CLOSE', tag:'Mission 07', title:'What this mission established', stage:11, html:`
<ul class="own">
<li>Hazards are conditional, which is what makes them composable across periods</li>
<li>Survival is the running product; marginal probability is survival times hazard; the marginals sum to cumulative</li>
<li>Cumulative probability is always below the sum of conditional rates, because accounts cannot fail twice</li>
<li>A curve that reproduces both the observed short-horizon and long-horizon rates has validated itself</li>
<li>Seasoning means a growing book flatters itself; vintage curves remove the distortion by never mixing cohorts</li>
<li>Scaling a portfolio curve to an account assumes constant relative risk across the term — a stated simplification, not a free one</li>
</ul>
<div class="next"><div class="lab">Mission 08</div><div class="ttl">Staging and provisioning</div>
<p>Where a model becomes an accounting number. Three stages, a trigger that measures change rather than level, and an Indian floor that frequently overrides the model entirely.</p></div>`}
]},
{n:'08', title:'Staging and provisioning', stage:12,
 sub:'This is where a model becomes an accounting number an auditor will ask about. Three stages, a trigger that measures change rather than level, scenarios that must be weighted at the output, and an Indian floor that frequently overrides the model entirely.',
 covers:['The three stages and what each carries','Significant increase in credit risk','The expected credit loss formula','Staged provisioning against day-one lifetime','Prudential floors, and where model quality actually pays'],
 cards:[

{label:'DEFINE', tag:'The classification', title:'Three stages, three allowances', stage:12, html:`
<p>Every instrument sits in exactly one stage, determined by how its credit risk has moved <b>since initial recognition</b>.</p>
<table class="tbl free">
<tr><td><b>Stage 1</b><span class="sub">No significant increase in risk</span></td><td><b>12-month</b> expected loss. Interest on the gross carrying amount.</td></tr>
<tr><td><b>Stage 2</b><span class="sub">Risk has increased significantly, but not impaired</span></td><td><b>Lifetime</b> expected loss. Interest still on gross.</td></tr>
<tr><td><b>Stage 3</b><span class="sub">Credit-impaired — the non-performing asset in India</span></td><td><b>Lifetime</b> expected loss. Interest on the <b>net</b> carrying amount, recognised only on receipt.</td></tr>
</table>
<div class="note"><div class="lab">The change in Stage 3 that is easy to miss</div><p>Income recognition stops. Interest that has been accrued and booked but not received must be reversed. A migration to Stage 3 therefore hits the profit and loss account twice: once through the provision, and once through the reversal of revenue already recognised.</p></div>`},

{label:'DEFINE', tag:'The trigger', title:'A change, not a level', stage:12, html:`
<p><i class="term">Significant increase in credit risk</i> is the Stage 1 to Stage 2 trigger, and the crucial word is <b>increase</b>.</p>
<p>It measures movement in default risk over the remaining life <b>relative to origination</b> — not the absolute level of risk today. The consequences are counter-intuitive and both directions matter:</p>
<ul class="spine">
<li><span class="k">A</span><span class="v">A borrower who was always risky and stayed equally risky does not trigger<em>High absolute risk, no movement, so Stage 1</em></span></li>
<li><span class="k">B</span><span class="v">A safe borrower who doubled in risk does trigger<em>Even while remaining safer in absolute terms than borrower A</em></span></li>
</ul>
<div class="note"><div class="lab">Why the standard is built this way</div><p>Because the price already accounts for the risk known at origination. A lender that priced a 6% probability and got a 6% probability has suffered nothing. What it has not been paid for is <b>deterioration</b> — and that is what the allowance is meant to capture.</p></div>`},

{label:'IN MY SYSTEM', tag:'The build', title:'Three triggers, applied together', stage:12, html:`
<p>Mine fire on an OR basis — any one is sufficient:</p>
<table class="tbl free">
<tr><td><b>Relative</b></td><td>Current twelve-month probability at least <b>double</b> the probability at origination. The true test of the standard.</td></tr>
<tr><td><b>Absolute</b></td><td>Probability above <b>6%</b> regardless of movement. A backstop that catches accounts written risky and now dangerous.</td></tr>
<tr><td><b>Days past due</b></td><td>30 or more. The rebuttable regulatory presumption.</td></tr>
</table>
<table class="tbl" style="margin-top:16px">
<thead><tr><th>Stage · accounts</th><th>Share · mean PD</th></tr></thead>
<tr><td>1 · 189,633</td><td>80.48% · 0.0273</td></tr>
<tr><td>2 · 26,554</td><td>11.27% · 0.0764</td></tr>
<tr class="hi"><td>3 · 19,441</td><td>8.25% · 1.0000</td></tr>
</table>
<div class="note"><div class="lab">Three readings of that table</div><p>Stage 3 mean probability is exactly <b>1.0</b> — those accounts have already defaulted, so the probability is no longer a probability. Stage 2's mean is <b>2.8 times</b> Stage 1's, which says the triggers are discriminating rather than shuffling accounts at random. And an 80/11/8 split is plausible for a young unsecured book: 40% in Stage 2 would suggest triggers set too loose, 2% too tight.</p></div>
<div class="note q"><div class="lab">The weakest link, named before it is found</div><p>Origination probability. My dataset preserves no point-in-time score from the issue date, so I proxy it with the average predicted probability per credit grade — which loses within-grade variation and coarsens the relative test. That is precisely why the absolute 6% threshold exists as a second net.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'Stage 2 is not a warning light', stage:12, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">Stage 2 is a soft warning; the real money is in Stage 3.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">The allowance frequently <b>more than doubles</b> on migration from Stage 1 to Stage 2 — and on a long-dated product the multiple runs to five or ten times — for an account whose underlying risk moved only modestly. A small deterioration in a macroeconomic forecast can push an entire cohort across the boundary at once.</div></div>
</div></div>
<p class="small" style="margin-top:16px">This is the <i class="term">cliff effect</i>, and it is intended rather than accidental: the standard wants deterioration recognised early and visibly.</p>
<div class="note"><div class="lab">What it demands of reporting</div><p>Every provision movement must be decomposed before any of it is interpreted — <b>stage transfers, scenario and forecast changes, model and assumption updates, volume and mix, and any floor that has started binding.</b> Only the residual after all five is genuine credit deterioration. A quarter-on-quarter provision jump attributed to "the economy" without that decomposition is usually a stage transfer wearing a costume.</p></div>`},

{label:'DEFINE', tag:'The number', title:'Expected credit loss', stage:13, html:`
<div class="formula">ECL = Σ PDₜ marginal × LGDₜ × EADₜ<br>÷ (1 + EIR)ᵗ<small>Summed from t = 1 to T</small></div>
<table class="tbl free">
<tr><td><b>PDₜ marginal</b></td><td>The unconditional probability of failing in period t, from the survival curve of Mission 07.</td></tr>
<tr><td><b>EIR</b></td><td>The effective interest rate at initial recognition — the prescribed discount rate, not a market rate chosen later.</td></tr>
<tr><td><b>T</b></td><td><b>1 for Stage 1. Remaining life for Stages 2 and 3.</b></td></tr>
</table>
<div class="note"><div class="lab">The whole standard is one letter</div><p>That single upper limit is the entire mechanism. Everything else — the triggers, the scenarios, the disclosures — exists to decide what <b>T</b> should be for each account. The formula itself is the same in every stage.</p></div>`},

{label:'IN MY SYSTEM', tag:'Results', title:'Reading the coverage gradient', stage:13, html:`
<table class="tbl">
<thead><tr><th>Stage · exposure</th><th>ECL · coverage</th></tr></thead>
<tr><td>1 · $1,417.20M</td><td>$30.27M · 2.14%</td></tr>
<tr><td>2 · $169.37M</td><td>$24.40M · 14.41%</td></tr>
<tr><td>3 · $240.00M</td><td>$223.80M · 93.25%</td></tr>
<tr class="hi"><td><b>Total · $1,826.57M</b></td><td><b>$278.48M · 15.25%</b></td></tr>
</table>
<p style="margin-top:14px"><b>Coverage ratio</b> is provision divided by exposure — the single number saying how much of a book has already been paid for.</p>
<div class="note g"><div class="lab">A free consistency check</div><p>Stage 3 coverage of 93.25% is essentially my mean severity of 93.01%. That is not a coincidence: with probability equal to one, expected loss divided by exposure reduces to severity. If those two numbers disagree materially in any implementation, either the staging or the severity model has a defect.</p></div>`},

{label:'DEFINE', tag:'The alternative', title:'Day-one lifetime provisioning', stage:13, html:`
<p>The American standard takes the same inputs and makes one change: <b>there are no stages.</b> Every instrument carries a lifetime allowance from the day it is written, whether or not risk has increased.</p>
<table class="tbl free">
<tr><td><b>Staged</b><span class="sub">IFRS 9, Ind AS 109</span></td><td>Small day-one charge; a cliff at the trigger; volatility driven by stage transfers.</td></tr>
<tr><td><b>Day-one lifetime</b><span class="sub">US CECL</span></td><td>Large day-one charge; no cliff; volatility driven by changes in forecast.</td></tr>
</table>
<p style="margin-top:16px">Running my portfolio through both isolates the difference exactly:</p>
<table class="tbl">
<tr><td>Staged provision</td><td>$278.48M</td></tr>
<tr><td>Day-one lifetime provision</td><td>$327.47M</td></tr>
<tr class="hi"><td>Difference</td><td>$48.99M</td></tr>
</table>
<div class="note"><div class="lab">Where the entire difference sits</div><p><b>Stage 1 only.</b> Stages 2 and 3 carry lifetime allowances under both frameworks, so they cancel exactly. The $48.99M is the cost of applying lifetime accounting to 189,633 performing accounts that the staged framework charges only twelve months for — which is the cleanest available demonstration of what staging is actually worth.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'Averaging the scenarios', stage:13, html:`
<p>Both frameworks require the allowance to reflect forward-looking information across several macroeconomic scenarios, each carrying a probability weight.</p>
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">Average the scenarios into a central view, then compute the provision once.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Loss is <b>convex</b> in the economy — a two-point deterioration costs more than twice a one-point deterioration. So the provision computed on the average scenario is always <b>below</b> the average of the provisions. <b>Weight the outputs, never the inputs.</b></div></div>
</div></div>
<div class="note"><div class="lab">Why it always errs the same way</div><p>The bias has a sign. Averaging inputs understates, systematically and in every portfolio, and the understatement grows with the severity of the downside scenario. It is not a rounding difference; on a stressed book it can be a material misstatement.</p></div>
<div class="note q"><div class="lab">In my system, stated plainly</div><p>My scenario engine computes baseline, upside and downside provisions and weights them correctly — but it runs on a three-loan test fixture rather than the full portfolio. It demonstrates the mechanics; it is not a portfolio result, and I say so before anyone opens the file.</p></div>`},

{label:'INDIA', tag:'The override', title:'Prudential floors', stage:13, html:`
<p>The distinctively Indian feature. Every modelled number sits on a regulatory backstop, and the booked allowance is the <b>higher</b> of the two.</p>
<div class="formula">Allowance = max( ECL modelled, Floor × Exposure )<small>The floor is not a guideline</small></div>
<table class="tbl">
<thead><tr><th>Category</th><th>Stage 1 · 2</th></tr></thead>
<tr class="hi"><td>Unsecured retail</td><td>1.00% · 5%</td></tr>
<tr><td>Secured retail, corporate</td><td>0.40% · 5%</td></tr>
<tr><td>Micro and small enterprise, farm credit</td><td>0.25% · 5%</td></tr>
<tr><td>Individual housing</td><td>0.25% · 1.50%</td></tr>
<tr><td>Gold loans</td><td>0.40% · 1.50%</td></tr>
<tr><td>Anything unspecified</td><td>0.40% · 5%</td></tr>
</table>
<p class="small" style="margin-top:14px">Stage 3 floors escalate over time — most categories 25 / 40 / 55 / 75 / 100% across five years, unsecured retail harsher at 25% in year one and 100% thereafter, individual housing gentlest. The modelled probability itself is separately floored at 0.03%.</p>`},

{label:'WORKED', tag:'Arithmetic', title:'Where the model binds, and where the floor does', stage:13, html:`
<table class="tbl free">
<tr><td><b>Unsecured personal</b><span class="sub">₹3,00,000 · PD 2.0% · LGD 70%</span></td><td>Model ₹4,200 = <b>1.40%</b><br>Floor 1.00% = ₹3,000<br><b>Model wins</b></td></tr>
<tr><td><b>Vehicle, secured retail</b><span class="sub">₹6,00,000 · PD 1.5% · LGD 25%</span></td><td>Model ₹2,250 = <b>0.375%</b><br>Floor 0.40% = ₹2,400<br><b>Floor wins</b></td></tr>
<tr><td><b>Housing</b><span class="sub">₹40,00,000 · PD 0.8% · LGD 15%</span></td><td>Model ₹4,800 = <b>0.12%</b><br>Floor 0.25% = ₹10,000<br><b>Floor wins, at 2.08×</b></td></tr>
</table>
<div class="note"><div class="lab">The pattern to carry away</div><p>The better the security, the more likely the floor binds — because good collateral drives the modelled number down and the floor does not follow it.</p></div>`},

{label:'MECHANISM', tag:'The strategic consequence', title:'Where model quality is actually repaid', stage:13, html:`
<p>If the floor exceeds the model, improving the model <b>changes nothing that gets reported</b>. The floor is what is booked, and a better estimate simply moves a number that never surfaces.</p>
<p>So modelling investment pays exactly where the model sits <b>above</b> the floor:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">Unsecured retail<em>Where modelled severity is high enough that no floor comes near it</em></span></li>
<li><span class="k">2</span><span class="v">Stage 2 populations<em>Where lifetime allowances on a deteriorating cohort dwarf a 5% floor</em></span></li>
<li><span class="k">3</span><span class="v">Stage 3<em>Where the floor applies account by account and the difference between a 35% and a 65% severity assumption is real money</em></span></li>
</ul>
<div class="note"><div class="lab">Which is the opposite of the intuition</div><p>The instinct is that sophistication matters most on the biggest, safest, best-secured book — the housing portfolio. Under a floor regime it matters least there, because the answer is a constant. Sophistication earns its keep on the small, messy, unsecured book that nobody wants to model.</p></div>`},

{label:'INDIA', tag:'The changeover', title:'What happens on 1 April 2027', stage:13, html:`
<p>Commercial banks move from incurred-loss provisioning to expected credit loss on a single date, and the mechanics of the switch are prescribed:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">The loan portfolio is fair-valued at transition<em>The difference goes to opening retained earnings, not through the profit and loss account</em></span></li>
<li><span class="k">2</span><span class="v">Day-one shortfall becomes a transitional adjustment<em>The excess of opening expected credit loss over the provisions held on 31 March 2027</em></span></li>
<li><span class="k">3</span><span class="v">A declining fraction may be added back to core capital<em>Four-fifths, three-fifths, two-fifths, one-fifth across FY2027-28 to FY2030-31, so the capital hit spreads over four years rather than landing at once</em></span></li>
<li><span class="k">4</span><span class="v">Loans outstanding at transition move to effective-interest accounting<em>By 31 March 2030</em></span></li>
</ul>
<div class="note"><div class="lab">What does not change</div><p>Asset classification. Expected credit loss <b>runs alongside</b> the non-performing asset framework rather than replacing it — under the Directions, default for provisioning purposes <b>is defined as</b> NPA status. A bank will report a stage and an asset classification for the same account, and both must reconcile.</p></div>`},

{label:'CLOSE', tag:'Mission 08', title:'What this mission established', stage:12, html:`
<ul class="own">
<li>Three stages, and the allowance depends on one letter in the formula: the upper limit of the sum</li>
<li>The trigger measures change since origination, not the level of risk today</li>
<li>Stage 3 probability is one, so its coverage should equal severity — a free implementation check</li>
<li>The cliff effect is intended, which is why every provision movement must be decomposed five ways</li>
<li>Scenarios weight outputs, because loss is convex and averaging inputs understates systematically</li>
<li>India books max(model, floor), and the floor usually wins on well-secured books</li>
<li>Model quality is repaid on unsecured, Stage 2 and Stage 3 exposures — not on the largest, safest book</li>
</ul>
<div class="next"><div class="lab">Mission 09</div><div class="ttl">Capital</div>
<p>Provisions cover the average; capital covers the surprise. The same parameters, a completely different arithmetic — and in India, a formula that never runs at all.</p></div>`}
]},
{n:'09', title:'Capital', stage:14,
 sub:'Provisions cover the average year; capital covers the surprise. The same three parameters feed a completely different arithmetic — and in India the formula that consumes them never runs at all.',
 covers:['Standardised against internal ratings','The retail capital formula, term by term','Downturn severity','Why India uses a lookup table','Risk weights, and the transactor lever'],
 cards:[

{label:'DEFINE', tag:'Two approaches', title:'Table or formula', stage:14, html:`
<table class="tbl free">
<tr><td><b>Standardised</b></td><td>Risk weights come from a supervisory table by exposure type. The lender's own estimates <b>never enter</b>. Simple, non-manipulable, blunt.</td></tr>
<tr><td><b>Internal ratings based</b></td><td>The lender's own probability (foundation), or own probability, severity and exposure (advanced), feed a prescribed formula. Better estimates produce lower capital on the same exposure.</td></tr>
</table>
<p style="margin-top:16px">The bargain in the second approach is explicit: a supervisor permits a lender to hold less capital in exchange for demonstrating that it measures its own risk credibly — with data history minima, use tests, independent validation and supervisory approval as the price of entry.</p>
<div class="note"><div class="lab">Where this is going</div><p>India has not taken that bargain. The formula on the next two cards is worth understanding completely, because it explains what capital <b>is</b> — and then Card 07 of this mission explains why an Indian lender never computes it.</p></div>`},

{label:'DEFINE', tag:'The formula', title:'Retail capital, term by term', stage:14, html:`
<div class="formula">K = LGD × [ Φ( (Φ⁻¹(PD) + √R × Φ⁻¹(0.999)) ÷ √(1−R) ) − PD ]<br><br>RWA = K × 12.5 × EAD<small>Capital requirement, then risk-weighted assets</small></div>
<table class="tbl free">
<tr><td><b>Φ</b></td><td>The standard normal distribution function. Φ⁻¹ is its inverse.</td></tr>
<tr><td><b>Φ⁻¹(0.999)</b></td><td>The 99.9th percentile — the confidence level the framework chooses. Approximately 3.0902.</td></tr>
<tr><td><b>R</b></td><td>Asset correlation: how much accounts fail together rather than independently. <b>0.15</b> for residential mortgages, <b>0.04</b> for qualifying revolving retail, 0.03–0.16 declining in probability for other retail.</td></tr>
<tr><td><b>× 12.5</b></td><td>Simply 1 ÷ 0.08 — converting a capital requirement into a risk-weighted amount at the 8% minimum.</td></tr>
</table>
<div class="note"><div class="lab">Retail has no maturity adjustment</div><p>Unlike corporate exposures, the retail formula contains no term to lengthen capital for longer-dated loans. The seasoning profile is assumed to handle it.</p></div>`},

{label:'MECHANISM', tag:'Reading it', title:'What the bracket is actually doing', stage:14, html:`
<p>Strip the notation and the bracketed term says one thing:</p>
<div class="formula">probability of default in a<br>one-in-a-thousand-year stress<br>−<br>the ordinary probability of default<small>The difference is unexpected loss</small></div>
<p>The first part asks: if the economy hit the 99.9th percentile of bad, how many of these accounts would fail? The subtraction then removes the losses already funded by pricing and provisions.</p>
<p>What is left is the surprise, and equity exists to absorb exactly that.</p>
<div class="note"><div class="lab">Why correlation is the interesting parameter</div><p>If accounts failed independently, a large portfolio would have almost no unexpected loss — the law of large numbers would flatten it, and capital would be near zero. Correlation is what prevents that: accounts fail together because they share an economy. <b>R is the entire reason capital exists</b>, and the difference between 0.04 and 0.15 is the difference between a card book and a mortgage book in how violently they can fail at once.</p></div>`},

{label:'IN MY SYSTEM', tag:'Results', title:'A risk weight above the standardised one', stage:14, html:`
<table class="tbl">
<tr><td>Total exposure</td><td>$1,826.57M</td></tr>
<tr class="hi"><td>Modelled risk-weighted assets</td><td>$2,294.67M</td></tr>
<tr class="hi"><td>Portfolio risk weight</td><td>125.63%</td></tr>
<tr><td>Standardised equivalent at 75%</td><td>$1,369.93M</td></tr>
<tr><td>Minimum capital at 8%</td><td>$183.57M</td></tr>
</table>
<div class="note q"><div class="lab">The obvious objection</div><p>If internal models are supposed to reduce capital, why is 125.63% almost double the standardised 75%?</p></div>
<div class="note g"><div class="lab">The answer is one input</div><p><b>Severity of 93.01%.</b> The formula is <b>linear in LGD</b>, so a 93% severity produces a risk weight roughly 1.67 times what a typical 55–60% retail assumption would give. Internal models are not meant to be lower — they are meant to be <b>risk-sensitive</b>, and on a genuinely severe portfolio they are correctly higher. The 75% standardised weight is calibrated for an average retail book with collateral and normal recoveries. Mine has neither. The formula is telling the truth; the table is telling an average.</p></div>`},

{label:'DEFINE', tag:'Stress', title:'Downturn severity', stage:14, html:`
<p>Capital rules require severity estimated under <b>economic downturn conditions</b>, not long-run averages — because probability and severity are correlated, and recoveries fall exactly when defaults rise.</p>
<p>Applying an eight percentage point add-on to my portfolio:</p>
<table class="tbl">
<tr><td>Risk-weighted assets</td><td>$2,453.92M</td></tr>
<tr><td>Portfolio risk weight</td><td>134.35%</td></tr>
<tr class="hi"><td>Additional capital required</td><td>$12.74M</td></tr>
</table>
<p style="margin-top:14px">A 6.9% increase in capital from an eight-point move in severity.</p>
<div class="note"><div class="lab">The design principle this supports</div><p>Capital is far more sensitive to severity than to probability in the retail formula, because severity enters linearly while probability enters through a distribution function that compresses at both ends. This is a strong argument for putting conservatism in <b>severity and exposure</b> and keeping probability as unbiased as the data allows — padding probability distorts the ranking that sanction decisions depend on, while padding severity raises provisions and capital without touching who gets approved.</p></div>`},

{label:'INDIA', tag:'The single biggest translation', title:'The formula never runs here', stage:14, html:`
<div class="formula" style="font-size:15px">The RBI has not implemented<br>the internal ratings based approach.<br>Indian banks use Standardised only.<small>Everything on the previous four cards is background theory in this market</small></div>
<ul class="spine">
<li><span class="k">1</span><span class="v">Risk weights come from a table<em>A bank's own probability estimate never enters the capital calculation at any point</em></span></li>
<li><span class="k">2</span><span class="v">A better probability model cannot lower an Indian bank's capital<em>Not by a rupee, however good it is</em></span></li>
<li><span class="k">3</span><span class="v">Modelling skill is repaid elsewhere<em>Selection, pricing, provisioning above the floor, and collections prioritisation — never capital</em></span></li>
</ul>
<div class="note"><div class="lab">Why the theory still has to be known</div><p>Asset correlation, the 99.9th percentile, downturn severity and the use test remain the language in which capital is discussed globally, they underpin the calibration of the standardised table itself, and forward-looking severity estimates are still required for provisioning. The arithmetic is dormant here. The concepts are not.</p></div>`},

{label:'INDIA', tag:'The table', title:'Retail risk weights that matter', stage:14, html:`
<table class="tbl">
<tr><td>Qualifying regulatory retail</td><td>75%</td></tr>
<tr class="hi"><td>Personal loan</td><td>125%</td></tr>
<tr class="hi"><td>Credit card revolver</td><td>125%</td></tr>
<tr><td>Credit card transactor</td><td>75%</td></tr>
<tr><td>Housing, first two loans, by LTV band</td><td>20 / 25 / 30 / 40%</td></tr>
<tr><td>Housing, third loan onward</td><td>30 / 35 / 45 / 60%</td></tr>
<tr><td>Microfinance outside regulatory retail</td><td>100%</td></tr>
</table>
<div class="formula" style="margin-top:16px;font-size:15px">RWA = exposure net of specific provisions × RW<br>Capital = RWA × CRAR<small>CRAR 9% minimum, 11.5% with the conservation buffer</small></div>
<p class="small">Core equity 5.5% (8% including the buffer); tier one 7%. Non-banking finance companies in the middle layer and above: <b>15%</b>. Housing bands run across loan-to-value up to 50%, 50–60%, 60–80% and 80–90%, with five percentage points added where the outstanding is ₹3 crore or more.</p>`},

{label:'DEFINE', tag:'Qualification', title:'What makes an exposure "regulatory retail"', stage:14, html:`
<p>The 75% weight is not automatic for anything small. An exposure must pass four tests:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">Orientation<em>The counterparty is an individual or a small business</em></span></li>
<li><span class="k">2</span><span class="v">Product<em>Revolving credits, personal term loans, leases and small business facilities — not securities, not commercial real estate</em></span></li>
<li><span class="k">3</span><span class="v">Low value<em>No more than ₹10 crore to any one counterparty</em></span></li>
<li><span class="k">4</span><span class="v">Granularity<em>No single counterparty exceeding 0.2% of the whole regulatory retail portfolio</em></span></li>
</ul>
<div class="note"><div class="lab">Why granularity is in the list</div><p>The 75% weight is justified by diversification — many small independent exposures. A portfolio with a handful of large names inside it does not have that property, so the concentration test removes the justification along with the weight.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'Capital on three Indian retail exposures', stage:14, html:`
<p class="kicker">Computed at 11.5%, the ratio including the conservation buffer.</p>
<ul class="steps">
<li><span class="op"><b>Housing, ₹40,00,000 on a ₹55,00,000 property</b>LTV 72.7% → 30% weight → RWA ₹12,00,000</span><span class="res">₹1,38,000</span></li>
<li><span class="op"><b>Card revolver</b>₹1,00,000 drawn, ₹3,00,000 limit, 10% conversion → EAD ₹1,20,000 → 125%</span><span class="res">₹17,250</span></li>
<li class="total"><span class="op"><b>The same card, held by a transactor</b>75% weight → RWA ₹90,000</span><span class="res">₹10,350</span></li>
</ul>
<p style="margin-top:14px">Per ₹100 of exposure: housing consumes ₹3.45, the card revolver ₹14.38, the same card in a transactor's hands ₹8.63.</p>
<div class="note"><div class="lab">The sharpest lever in Indian retail capital</div><p>Nothing about that card changed except <b>twelve months of full repayment</b>, and capital fell 40%. A <i class="term">transactor</i> is an obligor who repaid in full at every due date including the three-day grace, for twelve months — and <b>one day of delinquency resets the twelve-month clock</b>. Which makes the boundary between transactor and revolver one of the most valuable behavioural distinctions a card portfolio can measure.</p></div>`},

{label:'MECHANISM', tag:'Thresholds', title:'The loan-to-value cliff', stage:14, html:`
<p>Housing risk weights step at loan-to-value boundaries rather than sliding, which creates sharp discontinuities at ordinary-looking numbers.</p>
<ul class="steps">
<li><span class="op"><b>₹40 lakh loan at 79% LTV</b>30% weight → RWA ₹12,00,000</span><span class="res">₹1,38,000</span></li>
<li class="total"><span class="op"><b>The same loan at 81% LTV</b>40% weight → RWA ₹16,00,000</span><span class="res">₹1,84,000</span></li>
</ul>
<p style="margin-top:14px">A third more capital for a two-point move in a ratio, and the two loans are otherwise identical.</p>
<div class="note"><div class="lab">Two consequences that follow</div><p>First, valuation discipline becomes a capital matter, not merely a credit one — the denominator of that ratio is an opinion about a property. Second, cliffs create incentives to cluster just below them, so a portfolio with a suspicious concentration at 79% loan-to-value is worth examining rather than admiring.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'Two things a better model cannot do', stage:14, html:`
<div class="bt">
<div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">A better model means lower capital.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">Not in India. Standardised only, so the internal estimate never enters the calculation.</div></div>
</div>
<div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">A better model means lower provisions.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">On well-secured books the prudential floor sits <b>above</b> the model, so the floor is what gets booked and the model output never surfaces.</div></div>
</div>
</div>
<div class="note"><div class="lab">What is left, and it is substantial</div><p>Who is approved. What price they pay. Which accounts are collected first and how hard. And provisioning on the unsecured and deteriorated exposures where the model does sit above the floor. That is where measurement earns its return in this market — and it is a business case about revenue and losses, not about regulatory relief.</p></div>`},

{label:'CLOSE', tag:'Mission 09', title:'What this mission established', stage:14, html:`
<ul class="own">
<li>Capital answers a different question from provisions: the surprise, not the average</li>
<li>The retail formula computes a stressed probability and subtracts the ordinary one; correlation is why capital exists at all</li>
<li>The formula is linear in severity, which is why conservatism belongs there rather than in probability</li>
<li>India is standardised-only: internal estimates never enter the capital calculation</li>
<li>Regulatory retail at 75%, personal and card revolver at 125%, transactor back to 75%</li>
<li>Twelve months of full card repayment cuts capital by 40%, and one late day resets the clock</li>
</ul>
<div class="next"><div class="lab">Mission 10</div><div class="ttl">The book in motion</div>
<p>A portfolio is a flow system, not a stock. Vintage curves, roll rates, pricing against a hurdle, collections where contact changes the outcome, and the governance that decides whether any of it may be used.</p></div>`}
]},
{n:'10', title:'The book in motion', stage:0,
 sub:'A retail portfolio is a flow system, not a stock. The fastest honest read on its health is not how many loans are bad but how fast accounts are moving — and what happens to them when they arrive.',
 covers:['Vintage curves and the growth distortion','Roll rates and where collections effort pays','Pricing against a hurdle rate','Restructuring, settlement and technical write-off','Model risk, validation and fairness'],
 cards:[

{label:'MECHANISM', tag:'Reading a portfolio', title:'Why the headline ratio lies in a growing book', stage:0, html:`
<p>The gross non-performing asset ratio divides today's bad balance by today's total advances. In a book growing 25% a year, <b>the denominator is fresh and the numerator is not</b> — accounts capable of being ninety days overdue were disbursed months ago, when the book was smaller.</p>
<p>The ratio therefore falls purely because of growth, and keeps falling until growth stops — at which point it jumps, and the jump gets blamed on the economy.</p>
<table class="tbl free">
<tr><td><b>Lagged delinquency</b></td><td>Divide the bad balance by the book as it stood some months earlier, matching the emergence period.</td></tr>
<tr><td><b>Vintage analysis</b></td><td>Never mix cohorts. Group by disbursal month and plot against months on book.</td></tr>
</table>
<div class="note q"><div class="lab">The third distortion, specific to India</div><p><b>Technical write-offs</b> remove balances from the numerator without any cash arriving — the claim survives and recovery continues, but the ratio improves. A gross non-performing ratio can therefore fall for two independent cosmetic reasons at once, neither of which is a customer paying.</p></div>`},

{label:'MECHANISM', tag:'Three effects', title:'Decomposing any change in bad rate', stage:0, html:`
<p class="kicker">Almost every unexplained movement in a portfolio bad rate is one of three things, and naming them is most of the work of explaining a variance.</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">Seasoning<em>A young book looks good because its accounts have not had time to fail. Growth alone improves every headline.</em></span></li>
<li><span class="k">2</span><span class="v">Mix<em>If the share of unsecured or digitally sourced business rises, the portfolio bad rate rises even though no individual segment's rate has changed at all.</em></span></li>
<li><span class="k">3</span><span class="v">Attrition<em>Good borrowers refinance away when rates fall or a competitor offers a balance transfer, leaving a worse residual population. A book can deteriorate without a single account deteriorating.</em></span></li>
</ul>
<div class="note"><div class="lab">The discipline</div><p>Before attributing a change to credit quality, hold cohort, mix and attrition constant. What remains after all three is the part worth investigating — and it is usually much smaller than the headline movement.</p></div>`},

{label:'DEFINE', tag:'The flow', title:'Roll rates', stage:0, html:`
<p>A <i class="term">roll rate</i> is the probability of moving from one delinquency bucket to the next-worse one next month.</p>
<p>Roll rates are the <b>earliest honest signal</b> in the system. They respond within a month or two of a change in underwriting or the economy, while the stock of non-performing assets takes at least three months to register anything and write-offs longer still.</p>
<div class="note"><div class="lab">Related measures worth separating</div><p><b>Flow rate</b> is the same movement read from the perspective of accounts leaving rather than arriving. <b>Cure rate</b> is the proportion moving back toward standard. The two are <b>not complements</b> — accounts can also stay put, close, or be written off, so they need not sum to anything.</p></div>
<div class="note q"><div class="lab">The most volatile number in any pack</div><p>Cure rate. It responds to collections staffing, to seasonal payment patterns around harvests and festivals, and to restructuring policy. An unexplained rise in cure rate is more often an operational change than an improvement in customer health, and should be treated as an operations question until proven otherwise.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'Chaining roll rates into a write-off forecast', stage:0, html:`
<p class="kicker">Roll rates: standard→SMA-0 8%, →SMA-1 50%, →SMA-2 60%, →NPA 75%, →write-off 95%. Balances in ₹ crore.</p>
<table class="tbl">
<thead><tr><th>Bucket · balance × chained rate</th><th>Expected loss</th></tr></thead>
<tr><td>Standard · 1,000 × 0.01710</td><td>17.10</td></tr>
<tr><td>SMA-0 · 80 × 0.21375</td><td>17.10</td></tr>
<tr><td>SMA-1 · 40 × 0.42750</td><td>17.10</td></tr>
<tr><td>SMA-2 · 20 × 0.71250</td><td>14.25</td></tr>
<tr><td>NPA · 12 × 0.95</td><td>11.40</td></tr>
<tr class="hi"><td><b>Total</b></td><td>76.95</td></tr>
</table>
<div class="note"><div class="lab">Read the middle column, not the total</div><p>₹12 crore sitting in non-performing status contributes almost as much expected loss as the entire ₹1,000 crore of standard balances — because it is 95% certain to be lost, while the standard book is 1.71% likely to get there.</p></div>`},

{label:'MECHANISM', tag:'Collections', title:'Where an hour of effort is worth the most', stage:0, html:`
<p>Once an account is delinquent the question changes from "will this go wrong" to <b>which intervention, on which account, recovers the most cash per hour of effort</b>. It is a resource allocation problem with a hard constraint: always more delinquent accounts than agent-hours.</p>
<p>From the roll-rate chain: preventing one account from rolling SMA-0 to SMA-1 cancels a longer chain than preventing SMA-2 to non-performing, and there are far more accounts available to save at the earlier bucket. <b>Early effort is worth several times late effort.</b></p>
<div class="note"><div class="lab">The counter-intuitive rule</div><p><b>Do not call the worst accounts.</b> An account almost certain to self-cure wastes the call; an account almost certain to be lost wastes it too. Value is concentrated where the intervention <b>changes the outcome</b> — the middle of the distribution, not the tail.</p></div>
<div class="note g"><div class="lab">What a collections score therefore predicts</div><p>Not risk. It predicts the probability of self-cure without contact, or expected recovery under each available treatment. Those are different targets from a credit scorecard's, and a portfolio that ranks collections by delinquency severity is optimising the wrong quantity.</p></div>`},

{label:'DEFINE', tag:'Pricing', title:'Risk-adjusted return on capital', stage:0, html:`
<p>A lending decision is not a risk decision. It is a <b>profit decision in which risk is one of four terms</b>.</p>
<div class="formula">RAROC = [ (Revenue − Opex − EL) × (1 − tax) ]<br>÷ Capital<small>Compared against the hurdle rate: cost of equity plus a margin</small></div>
<p>An account below the hurdle destroys shareholder value even when it looks profitable in accounting terms, because the equity tied up behind it could have earned more elsewhere.</p>
<div class="note"><div class="lab">Why the capital denominator changes decisions</div><p>Two loans with identical margins and identical losses can have very different returns purely because one attracts a 125% risk weight and the other 75%. Pricing that ignores the denominator systematically over-lends to capital-hungry products.</p></div>`},

{label:'WORKED', tag:'Arithmetic', title:'Return on a ₹5,00,000 personal loan', stage:0, html:`
<p class="kicker">Rate 15%, cost of funds 7%, operating cost 2.5%, PD 4%, LGD 70%, tax 25%, risk weight 125%, capital at 11.5% of risk-weighted assets.</p>
<ul class="steps">
<li><span class="op"><b>Net interest income</b>(0.15 − 0.07) × 5,00,000</span><span class="res">₹40,000</span></li>
<li><span class="op"><b>Operating cost</b>0.025 × 5,00,000</span><span class="res">₹12,500</span></li>
<li><span class="op"><b>Expected loss</b>0.04 × 0.70 × 5,00,000</span><span class="res">₹14,000</span></li>
<li><span class="op"><b>Post-tax profit</b>(40,000 − 12,500 − 14,000) × 0.75</span><span class="res">₹10,125</span></li>
<li><span class="op"><b>Capital allocated</b>0.115 × (1.25 × 5,00,000)</span><span class="res">₹71,875</span></li>
<li class="total"><span class="op"><b>Return on capital</b></span><span class="res">14.1%</span></li>
</ul>
<div class="note"><div class="lab">What the number says</div><p>Against a mid-teens cost of equity this loan roughly breaks even and creates nothing. The <b>125% risk weight does most of the damage</b> — at 75% the same economics allocate ₹43,125 and return 23.5%. Unsecured consumer credit in India is priced where it is priced substantially because of that weight.</p></div>`},

{label:'MECHANISM', tag:'Pricing', title:'Raising the price changes who accepts', stage:0, html:`
<p>Increasing the rate on a segment does two things, and the second usually dominates: it raises margin on everyone who still takes the loan, and it changes <b>who</b> still takes it.</p>
<p>Borrowers with good alternatives — disproportionately the better credits — go elsewhere. So the observed default rate rises after a price increase even though <b>no individual borrower has changed</b>. This is adverse selection, and it makes the naive profit calculation wrong in a predictable direction.</p>
<div class="note q"><div class="lab">The portfolio-level cousin</div><p>Across a competitive market, a lender systematically <b>wins the business its own model under-prices</b> relative to everyone else's. A lender with a weaker model does not merely earn less — it acquires a book that has been selected against it, one application at a time.</p></div>
<div class="note g"><div class="lab">The right question when moving a cut-off</div><p>Not "what is the bad rate of the marginal segment" but <b>"does the swap set clear the hurdle rate"</b> — the swap set being the applicants whose decision actually changes. Some very high-risk segments clear it at high prices; some low-risk segments fail it because they are cheap to price and shop aggressively.</p></div>`},

{label:'DEFINE', tag:'Workout', title:'Three things that are not the same', stage:0, html:`
<table class="tbl free">
<tr><td><b>Restructuring</b></td><td>A concession granted <b>because of financial difficulty</b> — moratorium, tenor extension, rate reduction, capitalisation of arrears. Not generosity: a bet that a temporarily distressed borrower yields more cash than enforcement. Granting it is itself evidence of impairment.</td></tr>
<tr><td><b>Compromise settlement</b></td><td>The lender accepts less than full dues in final settlement, and the account closes.</td></tr>
<tr><td><b>Technical write-off</b></td><td>Removes a balance from the books <b>without extinguishing the claim</b>. Recovery continues. It improves the headline ratio with no cash arriving.</td></tr>
</table>
<div class="note q"><div class="lab">The governance risk in the first two</div><p><i class="term">Extend and pretend</i> — a book where arrears look low because delinquency has been repeatedly restructured away. This is why restructured and settled balances are reported separately, and why <b>re-default rates on them</b> are among the most closely watched numbers in any stressed portfolio.</p></div>
<div class="note"><div class="lab">And the modelling consequence</div><p>A written-off account is <b>not</b> a resolved one. Any severity dataset that treats write-off as the end of the story understates recovery and overstates loss, sometimes substantially.</p></div>`},

{label:'INDIA', tag:'Conduct', title:'The rules around recovery', stage:0, html:`
<ul class="spine">
<li><span class="k">1</span><span class="v">Agents act as the lender's agents<em>The lender remains responsible for their conduct. Outsourcing the activity does not outsource the accountability.</em></span></li>
<li><span class="k">2</span><span class="v">Contact is restricted<em>Reasonable hours, conventionally 8 a.m. to 7 p.m. Intimidation is prohibited, as is contacting people outside the agreed list.</em></span></li>
<li><span class="k">3</span><span class="v">Digital lending adds its own layer<em>Service providers must be disclosed, limits may not be increased automatically without consent, and any default loss guarantee is capped at 5% of the underlying portfolio.</em></span></li>
<li><span class="k">4</span><span class="v">Wilful default is a defined category<em>Dues of ₹25 lakh or more, with the means to pay but not paying, or diverting funds. It attracts an additional 5% provision.</em></span></li>
</ul>
<div class="note"><div class="lab">On pricing conduct too</div><p>India permits risk-based pricing and constrains it through <b>transparency</b> rather than rate caps: floating-rate retail loans linked to an external benchmark, a Key Facts Statement showing the all-in annual rate, penal charges that must be charges rather than penal interest and may not be capitalised, and no foreclosure charges on floating-rate loans to individuals for non-business purposes. Microfinance is the exception with hard limits — household income ceiling ₹3 lakh, and total repayment obligations capped at half of monthly household income.</p></div>`},

{label:'DEFINE', tag:'Governance', title:'Model risk, and who owns it', stage:0, html:`
<p><i class="term">Model risk</i> is the risk of loss from decisions based on incorrect or <b>misused</b> models. Two sources, and the second is the more common: the model may be wrong, or it may be right and used for something it was not built for.</p>
<p>The 2026 Directions prescribe a three-tier structure rather than leaving it to practice:</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">Model owners in the front line<em>Develop, implement and use; accountable for approval, validation and performance</em></span></li>
<li><span class="k">2</span><span class="v">Risk management and compliance<em>Monitor risk across the model ecosystem, oversee independent validation, enforce limits</em></span></li>
<li><span class="k">3</span><span class="v">Internal audit<em>Objective assurance on both, reporting to the board or audit committee</em></span></li>
</ul>
<div class="note"><div class="lab">Above all three</div><p>A board committee that <b>must include the chief financial officer and chief risk officer</b>, charged with challenging implementation strategy, ensuring data integrity across the provisioning lifecycle, and guaranteeing the independence of validation.</p></div>`},

{label:'MECHANISM', tag:'Validation', title:'Three questions, in this order', stage:0, html:`
<ul class="spine">
<li><span class="k">1</span><span class="v">Is it conceptually sound?<em>Do the variables make sense, is the target well defined, is the estimation method appropriate to the data</em></span></li>
<li><span class="k">2</span><span class="v">Does ongoing monitoring show it still works?<em>Stability, discrimination and calibration tracked on a schedule rather than on demand</em></span></li>
<li><span class="k">3</span><span class="v">Does outcomes analysis confirm it?<em>Predictions matching reality on data the model has never seen</em></span></li>
</ul>
<div class="note q"><div class="lab">The dangerous combination</div><p>A model can pass the third and fail the first. It works — until the regime it silently depends on changes, at which point it fails without warning and without any monitoring metric having moved beforehand. Conceptual soundness is what protects against the failure that monitoring cannot see coming.</p></div>
<div class="note"><div class="lab">Three obligations where implementations usually fall short</div><p>A <b>model inventory</b> listing every model with owner, tier and dependencies. <b>Risk-based tiering</b>, so validation intensity follows materiality. And a <b>documented lifecycle</b> with a prospectus stating methodology, limitations and initial validation outcomes.</p></div>`},

{label:'TRAP', tag:'Costs money', title:'Fairness by omission', stage:0, html:`
<div class="bt"><div class="pair">
<div class="believed"><div class="lab">Widely believed</div><div class="txt">Excluding sensitive attributes makes a model fair.</div></div>
<div class="true"><div class="lab">What is true</div><div class="txt">It prevents <b>direct</b> use only. A model with enough correlated inputs — postal code, device, employer type, education — <b>reconstructs the omitted variable implicitly</b>, and does so <b>better</b> the more flexible the model is. Removing the column removes the audit trail, not the effect.</div></div>
</div></div>
<div class="note g"><div class="lab">What actually works</div><p>Test <b>outcomes by group</b> rather than inspecting inputs. Document business necessity for any variable producing an adverse disparity. And search for a less discriminatory alternative of comparable predictive power — the existence of one is what turns a disparity into a problem.</p></div>
<div class="note"><div class="lab">The Indian frame</div><p>The Fair Practices Code already requires non-discriminatory application and <b>written reasons for rejection</b>; digital lending rules constrain what data may be collected at all; and the Digital Personal Data Protection Act, 2023 governs the personal data underneath everything above.</p></div>`},

{label:'DEFINE', tag:'The end of the cycle', title:'When a model should be retired', stage:0, html:`
<ul class="spine">
<li><span class="k">1</span><span class="v">Sustained fall in discrimination that recalibration cannot address<em>Because level is repairable and order is not</em></span></li>
<li><span class="k">2</span><span class="v">Population shift large enough that the development sample no longer resembles the applicant flow<em>The model is being asked about people it never saw</em></span></li>
<li><span class="k">3</span><span class="v">A change in product or classification rules that breaks the target<em>The event being predicted is no longer the event being measured</em></span></li>
<li><span class="k">4</span><span class="v">Age<em>Most retail scorecards are redeveloped on a two-to-four-year cycle — not because they expire on a date, but because accumulated drift reliably exceeds tolerance in that window</em></span></li>
</ul>
<div class="note"><div class="lab">The monitoring pack that catches all four</div><p><b>Monthly:</b> score stability, characteristic stability on every input, approval rate, score distribution by sourcing channel. <b>Quarterly:</b> Gini on the most recent mature cohort, observed against expected default rate by score band, and override rate.</p></div>`},

{label:'RECALL', tag:'The traps, together', title:'Fifteen beliefs that cost money', stage:0, html:`
<table class="tbl free">
<tr><td>Capital covers expected loss</td><td>It covers <b>unexpected</b> loss; expected loss is in the price</td></tr>
<tr><td>Default means loss</td><td>Accounts cure — a third to a half on secured books</td></tr>
<tr><td>Paying again means upgraded</td><td>Only when <b>all</b> arrears across <b>all</b> facilities clear</td></tr>
<tr><td>One late card is that card's problem</td><td>Classification is at <b>borrower</b> level</td></tr>
<tr><td>Inside its limit means performing</td><td>Not if credits fail to cover interest debited</td></tr>
<tr><td>ECL replaces NPA classification</td><td>It runs alongside; default <b>is defined as</b> NPA</td></tr>
<tr><td>Better models mean lower provisions</td><td>The floor is often above the model</td></tr>
<tr><td>Better models mean lower capital</td><td>Not in India — standardised only</td></tr>
<tr><td>Stage 2 is a soft warning</td><td>It multiplies the allowance two to ten times</td></tr>
<tr><td>Average the scenarios</td><td>Loss is convex; weight the <b>outputs</b></td></tr>
<tr><td>Falling gross NPA means improvement</td><td>Growth and technical write-offs both shrink it</td></tr>
<tr><td>Falling Gini means degradation</td><td>Range restriction lowers it mechanically</td></tr>
<tr><td>High Gini means a good model</td><td>Gini says nothing about level</td></tr>
<tr><td>High information value is a find</td><td>Above 0.5, suspect leakage</td></tr>
<tr><td>Unused card limits are free</td><td>5% conversion factor from 1 Apr 2027, rising to 10%</td></tr>
</table>`},

{label:'RECALL', tag:'Reference', title:'The formula sheet', stage:0, html:`
<table class="tbl free">
<tr><td>Expected loss</td><td>PD × LGD × EAD</td></tr>
<tr><td>Logistic model</td><td>ln(p ÷ (1−p)) = β₀ + Σ βᵢxᵢ</td></tr>
<tr><td>Weight of evidence</td><td>ln( (gᵢ÷G) ÷ (bᵢ÷B) )</td></tr>
<tr><td>Information value</td><td>Σ (%G − %B) × WoE</td></tr>
<tr><td>Oversampling correction</td><td>β₀ − ln(ρ₁ ÷ ρ₀)</td></tr>
<tr><td>Score scaling</td><td>Offset + Factor × ln(odds)</td></tr>
<tr><td>Factor · Offset</td><td>PDO ÷ ln 2 · S₀ − Factor × ln(odds₀)</td></tr>
<tr><td>Gini</td><td>2 × AUC − 1</td></tr>
<tr><td>Kolmogorov–Smirnov</td><td>max | F<sub>bad</sub> − F<sub>good</sub> |</td></tr>
<tr><td>Stability index</td><td>Σ (A − E) × ln(A ÷ E)</td></tr>
<tr><td>Recalibration shift</td><td>ln(p₁÷(1−p₁)) − ln(p₀÷(1−p₀))</td></tr>
<tr><td>Loss given default</td><td>1 − Σ(Rₜ−Cₜ)(1+d)⁻ᵗ ÷ EAD</td></tr>
<tr><td>Exposure, revolving</td><td>B + CCF × (L − B)</td></tr>
<tr><td>Survival · marginal PD</td><td>Π(1−hₖ) · Sₜ₋₁ × hₜ</td></tr>
<tr><td>Expected credit loss</td><td>Σ PDₜ LGDₜ EADₜ (1+EIR)⁻ᵗ</td></tr>
<tr><td>Allowance, India</td><td>max( ECL, floor × exposure )</td></tr>
<tr><td>Standardised capital</td><td>exposure × RW × CRAR</td></tr>
<tr><td>Return on capital</td><td>(Rev − Opex − EL)(1−τ) ÷ Capital</td></tr>
<tr><td>Roll-rate chain</td><td>balance × Π rⱼ</td></tr>
<tr class="hi"><td>Constants</td><td>ln 2 = 0.693147 · Factor at PDO 20 = 28.854 · Φ⁻¹(0.999) = 3.0902</td></tr>
</table>`},

{label:'THE COMPRESSION', tag:'The whole pack', title:'One loop, five errors', stage:0, html:`
<p>Define an event — ninety days past due, at borrower level. Freeze a photograph of the borrower and wait a stated period for the verdict, keeping the split honest across time as well as across accounts. Fit something that <b>ranks</b>, and separately something that <b>levels</b>. Multiply the probability by a severity and an exposure. Because accounting does not stop at twelve months, stretch the probability into a term structure using hazards and survival.</p>
<p>Then hand the answer to three consumers who treat it completely differently. Pricing wants today's odds. Provisioning wants today's odds under a forecast, staged by whether risk has moved since origination, then compared against a floor that frequently wins. Capital in India ignores the model entirely and reads a number from a table. Then the population drifts away from the one that was measured, the stability index registers it, the characteristic index names the variable responsible, and the loop starts again.</p>
<div class="note"><div class="lab">The five errors that matter, and they are always the same five</div><p>Measuring the <b>wrong event</b>, by building at facility level what the rulebook defines at borrower level. Measuring on the <b>wrong population</b>, by forgetting that only sanctioned borrowers are observed. Confusing the <b>mean with the tail</b>, by funding expected loss with capital or unexpected loss with price. Reading a <b>ratio whose numerator and denominator come from different moments in time</b>. And assuming a number computed under one regime means the same thing under the next.</p></div>`},

{label:'CLOSE', tag:'Pack 01 complete', title:'The whole subject, in one line', stage:0, html:`
<p style="font-family:var(--display);font-size:21px;line-height:1.34;color:#fff;margin-bottom:20px">A lender cannot know which borrower will default, so it prices, provisions and capitalises against the fraction that will — and every technique in this pack exists to make that fraction honest.</p>
<hr class="rule">
<ul class="own">
<li>Ten missions, one loop, and every technique located at one verb of it</li>
<li>The Indian rulebook throughout: 90 days, borrower level, floors, standardised capital</li>
<li>Rank and level as separate properties with separate remedies</li>
<li>Severity and exposure as the parameters where conservatism belongs</li>
<li>Provisions for the average year, capital for the surprise</li>
</ul>
<div class="next"><div class="lab">Written by</div><div class="ttl">Tharun Gajula</div>
<p>Built alongside an end-to-end retail credit risk system in Python — target engineering through to capital, on 466,285 loans.</p></div>`}
]}
];

/* ---------- flatten ---------- */
const FLAT = [];
FLAT.push({kind:'packcover', stage:0, title:'Retail Credit Risk', mission:'', html:`
<div class="cover">
  <div class="mark">Field Cards · Pack 01</div>
  <h1>Retail<br>Credit Risk</h1>
  <div class="sub">Probability, severity, exposure, staging, provisioning and capital — from first principles, written for the Indian rulebook.</div>
  <div class="meta">
    <div>MISSIONS<b>10</b></div>
    <div>CARDS<b id="totalCards">—</b></div>
    <div>JURISDICTION<b>India</b></div>
  </div>
  <div class="byline">Tharun Gajula</div>
  <div class="scrollhint">Swipe up ↑</div>
</div>`});

MISSIONS.forEach(m=>{
  FLAT.push({kind:'mcover', stage:m.stage, mission:m.n, title:m.title, html:`
  <div class="mcover">
    <div class="num">Mission ${m.n} of 10</div>
    <h1>${m.title}</h1>
    <div class="sub">${m.sub}</div>
    <div class="covers"><div class="lab">In this mission</div><ul>${m.covers.map(c=>`<li>${c}</li>`).join('')}</ul></div>
  </div>`});
  m.cards.forEach(c=>FLAT.push({kind:'card', mission:m.n, ...c}));
});

/* ---------- render ---------- */
const deck=document.getElementById('deck');
deck.innerHTML=FLAT.map((c,i)=>`<section class="card" data-i="${i}" data-stage="${c.stage||0}" data-m="${c.mission||''}">
  <div class="sheet">${(c.kind==='card')
    ? `<div class="eyebrow"><span class="dot"></span><span>${c.label}</span><span style="color:var(--rule)">/</span><span class="tag">${c.tag}</span></div><h2>${c.title}</h2>${c.html}`
    : c.html}</div></section>`).join('');
const tc=document.getElementById('totalCards'); if(tc) tc.textContent=FLAT.length;

/* rail — the fourteen stages of the pipeline */
const rail=document.getElementById('rail');
rail.innerHTML=Array.from({length:14},()=>'<span></span>').join('');
const ticks=[...rail.children];

/* index — missions only */
const idx=document.getElementById('idx'), idxList=document.getElementById('idxList');
const anchors=[];
FLAT.forEach((c,i)=>{ if(c.kind==='packcover'||c.kind==='mcover') anchors.push({i,c}); });
idxList.innerHTML=anchors.map(a=>`<li data-go="${a.i}">
  <span class="n">${a.c.kind==='packcover'?'·':a.c.mission}</span>
  <span class="t">${a.c.title}${a.c.kind==='mcover'?`<em>${MISSIONS.find(m=>m.n===a.c.mission).cards.length} cards</em>`:'<em>Cover</em>'}</span></li>`).join('');
idxList.addEventListener('click',e=>{const li=e.target.closest('li'); if(!li)return;
  idx.classList.remove('open'); deck.children[+li.dataset.go].scrollIntoView({behavior:'smooth'});});
document.getElementById('counter').onclick=()=>idx.classList.add('open');
document.getElementById('idxClose').onclick=()=>idx.classList.remove('open');

/* observer */
const counter=document.getElementById('counter'), bar=document.getElementById('bar');
let current=0;
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.intersectionRatio<0.5) return;
  current=+e.target.dataset.i;
  const m=e.target.dataset.m;
  counter.textContent=(m?`M${m} · `:'')+String(current+1).padStart(3,'0');
  bar.style.width=((current+1)/FLAT.length*100)+'%';
  const st=+e.target.dataset.stage;
  ticks.forEach((t,k)=>{t.className = st && k===st-1 ? 'on' : (st && k<st-1 ? 'past':'');});
});},{threshold:[0.5]});
[...deck.children].forEach(el=>io.observe(el));

/* keyboard */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){idx.classList.remove('open');return;}
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();
    deck.children[Math.min(current+1,FLAT.length-1)].scrollIntoView({behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();
    deck.children[Math.max(current-1,0)].scrollIntoView({behavior:'smooth'});}
});
</script>
</body>
</html>
