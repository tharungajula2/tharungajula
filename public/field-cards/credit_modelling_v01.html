"h": "Twelve months of the <em>actual</em> curve",
"b": "<div class=\"dt\"><table>\n<tr><th>Month</th><th>At risk</th><th>Defaults</th><th>Hazard</th><th>Cumulative PD</th></tr>\n<tr><td>1</td><td class=\"n\">466,285</td><td class=\"n\">376</td><td class=\"n\">0.081%</td><td class=\"n\">0.081%</td></tr>\n<tr class=\"hi\"><td>2</td><td class=\"n\">465,909</td><td class=\"n\">0</td><td class=\"n\">0.000%</td><td class=\"n\">0.081%</td></tr>\n<tr class=\"hi\"><td>3</td><td class=\"n\">465,909</td><td class=\"n\">0</td><td class=\"n\">0.000%</td><td class=\"n\">0.081%</td></tr>\n<tr><td>4</td><td class=\"n\">465,909</td><td class=\"n\">576</td><td class=\"n\">0.124%</td><td class=\"n\">0.204%</td></tr>\n<tr><td>6</td><td class=\"n\">464,326</td><td class=\"n\">1,305</td><td class=\"n\">0.281%</td><td class=\"n\">0.700%</td></tr>\n<tr><td>9</td><td class=\"n\">459,556</td><td class=\"n\">2,121</td><td class=\"n\">0.462%</td><td class=\"n\">1.898%</td></tr>\n<tr class=\"hi\"><td>12</td><td class=\"n\">452,806</td><td class=\"n\">2,539</td><td class=\"n\">0.561%</td><td class=\"n\">3.435%</td></tr>\n</table></div>\n<div class=\"wk\"><div class=\"h\">Month 1 to 4, by hand</div>\n<div class=\"r\"><b>h(1) = 376 / 466,285</b><span>0.000806</span></div>\n<div class=\"r\"><b>S(1) = 1 &minus; 0.000806</b><span>0.999194</span></div>\n<div class=\"r\"><b>h(4) = 576 / 465,909</b><span>0.001236</span></div>\n<div class=\"r\"><b>S(4) = 0.999194 &times; 1 &times; 1 &times; 0.998764</b><span>0.997958</span></div>\n<div class=\"r tot\"><b>F(4) = 1 &minus; 0.997958</b><span>0.204%</span></div>\n</div>\n<p><strong>Cumulative PD at month 12 is 3.4352%, and the independently computed twelve-month default rate is 3.4352%.</strong> Two different pieces of code arriving at the same number by different routes is the cheapest correctness check in the build, and it should be run deliberately rather than noticed by accident.</p>"
},
{
"l": "PICTURE",
"t": "Seasoning",
"h": "The shape every retail book <em>has</em>",
"b": "<div class=\"bars\">\n<div class=\"row\"><div class=\"lb\"><span>Month 4</span><span>0.124%</span></div><div class=\"tr\"><i class=\"d\" style=\"width:20%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>Month 8</span><span>0.396%</span></div><div class=\"tr\"><i class=\"b\" style=\"width:62%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>Month 12</span><span>0.561%</span></div><div class=\"tr\"><i class=\"b\" style=\"width:88%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>Month 14 &mdash; peak</span><span>0.634%</span></div><div class=\"tr\"><i style=\"width:100%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>Month 18</span><span>0.500%</span></div><div class=\"tr\"><i class=\"b\" style=\"width:79%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>Month 24</span><span>0.306%</span></div><div class=\"tr\"><i class=\"b\" style=\"width:48%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>Month 36</span><span>0.074%</span></div><div class=\"tr\"><i class=\"d\" style=\"width:12%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>Month 48</span><span>0.009%</span></div><div class=\"tr\"><i class=\"d\" style=\"width:1%\"></i></div></div>\n</div>\n<p>The hump peaks at month 14 and decays steadily after. Three forces produce it, and they act in sequence.</p>\n<p><strong>The rise</strong>: fraud and immediate inability to pay show up in the first months, then genuine credit deterioration takes time to develop &mdash; a job is lost, savings run down, payments start slipping.</p>\n<p><strong>The peak</strong>: around month 12 to 18 is when the weakest borrowers who could hold on initially have exhausted their buffers.</p>\n<p><strong>The decay</strong>: survivorship. A borrower who has made 30 consecutive payments has demonstrated capacity that a borrower at month 3 has not. The remaining pool is progressively better than the pool that started.</p>\n<div class=\"note\">The shape has a direct operational consequence: a book that has grown fast is disproportionately full of loans below month 14 and will show a rising default rate purely from ageing, with no deterioration whatsoever. Mission 15 returns to this.</div>"
},
{
"l": "MECHANISM",
"t": "Scaling to an account",
"h": "One portfolio curve, <em>many</em> accounts",
"b": "<p>The hazard curve is a portfolio average. A provision is required per account, and a low-risk account should not carry the average curve.</p>\n<p>The approach used here scales the portfolio curve by the account's relative riskiness:</p>\n<div class=\"fx\"><div class=\"cap\">Account-level lifetime PD by multiplicative scaling</div>\n<div class=\"eq\"><em>F</em><sub>i</sub>(<em>T</em><sub>i</sub>) = <em>F</em><sub>pf</sub>(<em>T</em><sub>i</sub>) &times; <span class=\"fr\"><i>PD<sub>12m, i</sub></i><i>PD<sub>12m, pf</sub></i></span></div>\n<div class=\"wh\">F<sub>i</sub>(T<sub>i</sub>)&nbsp;account i's cumulative PD over its own remaining term<br>\nF<sub>pf</sub>(T<sub>i</sub>)&nbsp;the portfolio cumulative PD curve read at month T<sub>i</sub><br>\nPD<sub>12m, i</sub>&nbsp;account i's twelve-month PD from the scorecard<br>\nPD<sub>12m, pf</sub>&nbsp;the portfolio twelve-month PD, 3.435%<br>\nT<sub>i</sub>&nbsp;account i's remaining term, floored at 1 month and capped at original tenure</div></div>\n<p>An account scored at 6.87% twelve-month PD carries twice the portfolio ratio, so its lifetime cumulative PD is twice the portfolio curve at the same point on the term.</p>\n<p>Three properties are enforced explicitly rather than hoped for: the result stays inside [0,1], it stays monotonic across months, and the term is bounded so a data error cannot read the curve beyond month 60 or below month 1.</p>\n<p><strong>What this method assumes is that the shape of the curve is the same for good and bad accounts and only its height differs.</strong> That is a simplification. In reality riskier accounts default earlier as well as more often, so their curve is both higher and shifted left. Naming the assumption is part of using the method.</p>"
},
{
"l": "TRAP",
"t": "Reading the curve",
"h": "The hazard curve is a <em>forecast</em>",
"b": "<p>The belief: the curve gives the probability of default in each future month, so it is a forward-looking projection.</p>\n<p>It is an empirical summary of what already happened, applied forward on the assumption that the future resembles the past. Nothing in the construction contains any information about future conditions. Unemployment, interest rates, house prices and the lender's own collections capacity appear nowhere in it.</p>\n<p>This matters directly for accounting provisions, which require expected credit losses to reflect reasonable and supportable forward-looking information. A static historical curve does not meet that on its own; conditioning the hazard on macroeconomic variables, or weighting several scenario curves, is what closes the gap.</p>\n<p><strong>This build's curve carries no macroeconomic conditioning.</strong> It is a static portfolio hazard curve estimated on 2007 to 2014 outcomes, which spans a severe recession and its recovery, and is applied unadjusted. That is a stated limitation rather than a hidden one, and it is the single largest gap between this pipeline and a production provisioning engine.</p>"
},
{

"t": "The visible hole",
"h": "Months 2 and 3 show <em>zero</em> defaults",
"b": "<p>The curve records 376 defaults in month 1, then exactly zero in months 2 and 3, then 576 in month 4. No real portfolio behaves that way.</p>\n<p>The cause is in Mission 02. Default timing was inferred from the last payment date, and the arithmetic that converts two dates into an elapsed month count cannot land in months 2 and 3 for this data's date granularity. The gap is a property of the inference rule, not of borrower behaviour.</p>\n<p>Two things follow, and the second is the more important.</p>\n<p>The effect on totals is negligible &mdash; the missing defaults are absorbed into months 1 and 4, and cumulative PD at month 12 reconciles exactly to the independently computed rate. <strong>The curve is right in aggregate and wrong in its first quarter.</strong></p>\n<p>And an artefact visible in an output is worth more than a smooth curve with an unexamined method behind it. Someone reading this table can see the hole, ask what produced it, and get an answer. A curve that had been quietly interpolated would have looked better and told them nothing.</p>\n<div class=\"note\">Publish the artefact and its cause together. A model document that lists its own visible defects is far more credible than one that lists none.</div>"

{
"l": "ORIENT",
"t": "Provisions",
"h": "Money set aside <em>before</em> the loss arrives",
"b": "<p>A lender holding a book of loans knows some of them will fail. Accounting requires that expectation to be recognised now, as a reduction in the carrying value of the assets, rather than waiting for the failures to occur.</p>\n<p>The framework in force internationally since 2018 is <span class=\"k\">expected credit loss</span>, which replaced an earlier approach that recognised impairment only once a loss event had actually happened. That earlier approach was judged to have delivered too little, too late, during the 2008 crisis: losses were visible to risk managers long before accounting permitted them to be booked.</p>\n<div class=\"docs\">\n<a href=\"https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2024/issued/ifrs9.html\"><b>IFRS 9 Financial Instruments &mdash; issued standard</b><span>ifrs.org &mdash; the impairment requirements are in Section 5.5</span></a>\n<a href=\"https://www.bis.org/fsi/fsisummaries/ifrs9.pdf\"><b>IFRS 9 and expected loss provisioning &mdash; executive summary</b><span>bis.org &mdash; how the accounting framework meets the capital framework</span></a>\n</div>\n<p>The mechanics reuse everything built so far. Expected credit loss is the loss equation with an accounting-defined horizon attached and a discount applied.</p>"
},
{
"l": "DEFINE",
"t": "Three stages",
"h": "Which loans get a <em>lifetime</em> provision",
"b": "<p>Every exposure sits in one of three stages. The stage determines the measurement horizon, and the horizon is what drives the size of the provision.</p>\n<div class=\"dt\"><table>\n<tr><th>Stage</th><th>Condition</th><th>Loss measured over</th><th>Interest recognised on</th></tr>\n<tr><td>1</td><td class=\"g\">No significant increase in credit risk since origination</td><td class=\"g\">Next 12 months</td><td class=\"g\">Gross carrying amount</td></tr>\n<tr class=\"hi\"><td>2</td><td class=\"g\">Significant increase in credit risk, but not yet credit-impaired</td><td class=\"n\">Remaining lifetime</td><td class=\"g\">Gross carrying amount</td></tr>\n<tr class=\"hi\"><td>3</td><td class=\"g\">Credit-impaired &mdash; default has occurred</td><td class=\"n\">Remaining lifetime</td><td class=\"g\">Net of the loss allowance</td></tr>\n</table></div>\n<p>The jump from stage 1 to stage 2 is where the money is. Nothing about the loan's balance changes, no payment has necessarily been missed, and the provision multiplies several times over because the measurement horizon goes from twelve months to the whole remaining term.</p>\n<p>This is what makes the stage 1 to stage 2 boundary the most consequential judgement in the entire framework, and why it gets its own card.</p>\n<div class=\"note\">Movement is symmetric. An account that improves moves back down a stage and the provision is released. Stage 2 is not a one-way door.</div>"
},
{
"l": "MECHANISM",
"t": "SICR",
"h": "The test for a <em>significant increase</em> in credit risk",
"b": "<p><span class=\"k\">Significant increase in credit risk</span> is not defined numerically by the standard. Each institution sets its own criteria and documents them. The common structure is three triggers, any one of which is sufficient.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Relative trigger</b>Current lifetime PD compared to the lifetime PD expected at origination. This build uses a ratio of <strong>2.0</strong> &mdash; risk has doubled.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Absolute trigger</b>A floor that catches large deteriorations from a low base, where a ratio would need to be enormous. This build uses <strong>6 percentage points</strong> of lifetime PD.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Backstop</b><strong>30 days past due.</strong> A rebuttable presumption written into the standard itself. If a payment is a month late, the account moves to stage 2 regardless of what the models say.</div>\n</div>\n<p>The three exist because each catches what the others miss. A relative test alone lets a very safe loan double its risk and stay in stage 1. An absolute test alone never triggers on a book of high-quality exposures. The backstop catches everything the models got wrong.</p>\n<p><strong>The backstop is a floor, not a target.</strong> Supervisors have been explicit that relying on 30 days past due as the primary trigger is a weak implementation of an expected-loss framework, because it recreates the lateness-driven recognition the framework was designed to replace.</p>"
},
{
"l": "FORMULA",
"t": "ECL",
"h": "The loss equation, with a <em>horizon</em> attached",
"b": "<div class=\"fx\"><div class=\"cap\">Expected credit loss for exposure i in stage s</div>\n<div class=\"eq\"><em>ECL</em><sub>i</sub> = <em>PD</em><sub>i</sub><sup>(<em>h</em><sub>s</sub>)</sup> &times; <em>LGD</em><sub>i</sub> &times; <em>EAD</em><sub>i</sub></div>\n<div class=\"wh\">h<sub>s</sub>&nbsp;the horizon set by the stage &mdash; 12 months for stage 1, remaining lifetime for stages 2 and 3<br>\nPD<sub>i</sub><sup>(h)</sup>&nbsp;cumulative probability of default over that horizon, from Mission 12<br>\nLGD<sub>i</sub>&nbsp;loss given default, from Mission 10<br>\nEAD<sub>i</sub>&nbsp;exposure at default, from Mission 11<br>\nFor stage 3, PD = 1 because default has already occurred</div></div>\n<p>Every term has already been built. The only new element is that the horizon is chosen by the staging rule rather than fixed at twelve months.</p>\n<p>Two refinements a production engine adds and this build does not. <strong>Discounting</strong>: losses expected in year four are worth less than losses expected next month, so cash shortfalls are discounted at the effective interest rate. <strong>Probability weighting</strong>: the standard requires an unbiased probability-weighted estimate across at least two macroeconomic scenarios, not a single central case.</p>\n<div class=\"note\">Stage 3 is where the equation becomes trivially readable. With PD = 1, ECL = LGD &times; EAD, so <strong>the coverage ratio on stage 3 is simply the average LGD</strong>.</div>"
},
{
"l": "WORKED",
"t": "The staged book",
"h": "235,628 accounts, <em>three</em> buckets",
"b": "<p>Staging applied to the 2014 holdout book, using the three triggers above.</p>\n<div class=\"dt\"><table>\n<tr><th>Stage</th><th>Accounts</th><th>Share</th><th>Exposure</th><th>ECL</th><th>Coverage</th></tr>\n<tr><td>1</td><td class=\"n\">189,633</td><td class=\"n\">80.48%</td><td class=\"n\">$1,417.20M</td><td class=\"n\">$30.27M</td><td class=\"n\">2.14%</td></tr>\n<tr class=\"hi\"><td>2</td><td class=\"n\">26,554</td><td class=\"n\">11.27%</td><td class=\"n\">$169.37M</td><td class=\"n\">$24.40M</td><td class=\"n\">14.41%</td></tr>\n<tr class=\"hi\"><td>3</td><td class=\"n\">19,441</td><td class=\"n\">8.25%</td><td class=\"n\">$240.00M</td><td class=\"n\">$223.80M</td><td class=\"n\">93.25%</td></tr>\n<tr><td><strong>Total</strong></td><td class=\"n\">235,628</td><td class=\"n\">100%</td><td class=\"n\">$1,826.57M</td><td class=\"n\">$278.48M</td><td class=\"n\">15.25%</td></tr>\n</table></div>\n<p><span class=\"k\">Coverage ratio</span> is provision divided by exposure &mdash; the share of the exposure already set aside. It is the single most quoted number in credit provisioning and it is read stage by stage, never in total.</p>\n<p>The three ratios rise from 2.14% to 14.41% to 93.25%, and each is doing something different. Stage 1 is twelve-month loss on performing accounts. Stage 2 is <strong>6.7 times higher</strong> on accounts that have not yet missed a payment &mdash; that multiple is the whole cost of the horizon switch. Stage 3 at 93.25% is the LGD, because the default has already happened.</p>\n<div class=\"note\">Stage 3 coverage of 93.25% against a modelled mean LGD of 93.01% is the equation closing on itself. Two independent calculations agreeing to a quarter of a percentage point is worth checking for and worth reporting.</div>"
},
{
"l": "MECHANISM",
"t": "Two standards",
"h": "Where <em>lifetime</em> loss starts",
"b": "<p>The international standard and the United States standard answer the same question differently, and the difference is one design decision.</p>\n<div class=\"two\"><div><b>Three-stage approach (IFRS 9)</b>Lifetime loss only once credit risk has increased significantly. Performing loans carry twelve months. <strong>Staging exists because the horizon changes.</strong></div>\n<div><b>Single-measure approach (CECL)</b>Lifetime expected loss on every exposure from the day it is originated. No stages, because there is nothing to move between.</div></div>\n<div class=\"wk\"><div class=\"h\">Same book, both bases</div>\n<div class=\"r\"><b>Three-stage total provision</b><span>$278.48M</span></div>\n<div class=\"r\"><b>Coverage</b><span>15.25%</span></div>\n<div class=\"r\"><b>Lifetime-from-origination provision</b><span>$327.47M</span></div>\n<div class=\"r\"><b>Coverage</b><span>17.93%</span></div>\n<div class=\"r tot\"><b>Difference</b><span>$48.99M</span></div>\n</div>\n<p>The gap of $48.99M, or 2.68 percentage points of coverage, is the entire stage 1 population being measured over its life rather than its next twelve months. Nothing else changed &mdash; same loans, same PD models, same LGD, same EAD.</p>\n<p><strong>One book, two defensible provisions, differing by 17.6% of the smaller one.</strong> That is the size of the accounting-choice effect, and it is why a coverage ratio quoted without its basis is close to uninterpretable.</p>"
},
{
"l": "TRAP",
"t": "Reading coverage",
"h": "93% stage 3 coverage means the book is <em>broken</em>",
"b": "<p>The belief: setting aside 93 cents on the dollar signals a catastrophic portfolio.</p>\n<p>Stage 3 coverage is not a portfolio quality measure. It is the LGD of defaulted exposures, and on unsecured consumer lending an LGD near 93% is the ordinary result, established directly in Mission 10 from 50,968 actual defaults. A secured mortgage book would show stage 3 coverage of 20% to 30% on the same accounting framework, because there is a house to sell.</p>\n<p>The number that carries portfolio quality information is the <strong>stage distribution</strong>: 80.48% of accounts in stage 1, 11.27% in stage 2, 8.25% in stage 3. That says what share of the book has deteriorated. The coverage ratios say what each deteriorated account is expected to cost.</p>\n<div class=\"sheet g\"><div class=\"h\">Reading a provisioning table in the right order</div>\n<div class=\"r\"><b>1. Stage distribution</b><span>How much of the book has moved, and in which direction since last period</span></div>\n<div class=\"r\"><b>2. Stage 1 to 2 migration</b><span>The leading indicator. Deterioration shows here first</span></div>\n<div class=\"r\"><b>3. Stage 3 coverage vs LGD</b><span>Should reconcile. A gap means the LGD model and the provision disagree</span></div>\n<div class=\"r\"><b>4. Total coverage</b><span>Last, and only against the same book last period on the same basis</span></div>\n</div>"
},
{
"l": "TRAP",
"t": "Staging thresholds",
"h": "The <em>2.0</em> ratio is a standard",
"b": "<p>The belief: a doubling of lifetime PD is the significant-increase test, so it can be applied anywhere.</p>\n<p>The standard defines the concept and deliberately leaves the calibration to the institution. A ratio of 2.0 with a 6 percentage point absolute floor is one reasonable calibration among many, and it must be justified against the portfolio it is applied to.</p>\n<p>The consequences of getting it wrong run in both directions. Too tight and a large share of the book sits in stage 2, carrying lifetime provisions on loans that will pay perfectly &mdash; earnings suppressed for no risk reason. Too loose and deterioration is recognised late, which is exactly the failure the framework replaced.</p>\n<p><strong>The threshold is also a lever.</strong> Because it is set internally and moves the provision materially, it attracts scrutiny from auditors and supervisors, and changes to it require justification and disclosure. It cannot be quietly retuned when the provision comes out uncomfortably.</p>\n<div class=\"note\">On this build, 11.27% of accounts landed in stage 2 under a 2.0 ratio. Whether that share is right for a portfolio is a question answered by back-testing migration against subsequent default, not by the threshold looking reasonable.</div>"

{
"l": "ORIENT",
"t": "Two kinds of loss",
"h": "The average, and the <em>bad year</em>",
"b": "<p>Expected loss is the average outcome, and a lender covers it the way any business covers an expected cost: by pricing it into the interest rate and provisioning for it. Expected loss is not what capital is for.</p>\n<p>Losses vary around that average. In a bad year they exceed it, sometimes by a great deal. <span class=\"k\">Unexpected loss</span> is that excess, and capital exists to absorb it &mdash; shareholder money that can be lost without the bank failing to repay its depositors.</p>\n<div class=\"dg\"><div class=\"dg-t\">Who covers what</div>\n<div class=\"lay\">\n<div><span>1</span>Interest margin covers <strong>expected loss</strong>, priced in at origination</div>\n<div><span>2</span>Provisions recognise expected loss on the balance sheet as it accrues</div>\n<div class=\"hot\"><span>3</span>Capital absorbs <strong>unexpected loss</strong> up to a very high confidence level</div>\n<div><span>4</span>Beyond that point the bank fails. That is what the confidence level chooses</div>\n</div>\n<div class=\"cross\">The framework targets the 99.9th percentile of the one-year loss distribution</div></div>\n<p>99.9% is a policy choice expressed as a probability: a capital level sufficient for all but a one-in-a-thousand year. It is not derived from anything; it was decided.</p>"
},
{
"l": "FORMULA",
"t": "The IRB function",
"h": "Three inputs into a <em>capital requirement</em>",
"b": "<div class=\"fx\"><div class=\"cap\">Internal ratings-based capital requirement, retail exposures</div>\n<div class=\"eq\"><em>K</em> = <em>LGD</em> &times; N &#91; <span class=\"fr\"><i>G(PD)</i><i>&radic;(1 &minus; R)</i></span> + &radic;<span class=\"fr\"><i>R</i><i>1 &minus; R</i></span> &times; G(0.999) &#93; &minus; <em>PD</em> &times; <em>LGD</em></div>\n<div class=\"wh\">K&nbsp;&nbsp;capital requirement per unit of exposure<br>\nN&#91;&middot;&#93;&nbsp;cumulative standard normal distribution &mdash; converts a z-score into a probability<br>\nG(&middot;)&nbsp;its inverse &mdash; converts a probability into a z-score<br>\nPD&nbsp;probability of default over one year<br>\nLGD&nbsp;loss given default, downturn-appropriate<br>\nR&nbsp;&nbsp;asset correlation &mdash; how much borrowers fail together rather than independently<br>\nG(0.999)&nbsp;the z-score at 99.9% confidence, 3.0902<br>\n&minus; PD &times; LGD&nbsp;subtracts expected loss, since provisions already cover it</div></div>\n<p>The structure is readable once the pieces are named. The bracket computes a stressed probability of default &mdash; what PD becomes in a 1-in-1000 year, given how correlated the book is. Multiplying by LGD converts that into a stressed loss rate. Subtracting expected loss leaves only the unexpected part.</p>\n<div class=\"docs\">\n<a href=\"https://www.bis.org/basel_framework/chapter/CRE/31.htm\"><b>CRE31 &mdash; IRB approach: risk weight functions</b><span>bis.org &mdash; the function above, with the retail correlation formulas</span></a>\n</div>\n<p><strong>Note the final subtraction.</strong> If PD reaches 1, the bracket evaluates to LGD and the subtraction removes it entirely, so K is zero. Defaulted exposures generate no capital requirement under this formula because they are fully covered by provisions.</p>"
},
{
"l": "DEFINE",
"t": "Correlation",
"h": "Whether borrowers fail <em>together</em>",
"b": "<p>Asset correlation R is the parameter that carries systemic risk. It asks whether defaults are independent events or driven by a shared factor &mdash; an economy, a region, an employer, an interest rate.</p>\n<p>A book of independent defaults needs little capital: the average is reliable because a thousand independent draws vary little. A book where everything fails together needs a great deal, because the whole portfolio can go bad at once.</p>\n<div class=\"fx\"><div class=\"cap\">Retail correlation, other retail exposures</div>\n<div class=\"eq\"><em>R</em> = 0.03 &times; <em>w</em> + 0.16 &times; (1 &minus; <em>w</em>) &nbsp;&nbsp;where&nbsp;&nbsp; <em>w</em> = <span class=\"fr\"><i>1 &minus; e<sup>&minus;35 &times; PD</sup></i><i>1 &minus; e<sup>&minus;35</sup></i></span></div>\n<div class=\"wh\">R&nbsp;&nbsp;asset correlation, bounded between 0.03 and 0.16 for this exposure class<br>\nw&nbsp;&nbsp;a weight running from 0 at PD = 0 to 1 at PD = 1<br>\ne&nbsp;&nbsp;base of natural logarithms<br>\nThe rules set different correlations by class: 0.15 fixed for residential mortgages, 0.04 fixed for qualifying revolving retail</div></div>\n<p>Correlation <em>falls</em> as PD rises, from 0.16 down towards 0.03. The reasoning is that high-risk borrowers default for idiosyncratic reasons &mdash; their own circumstances &mdash; while low-risk borrowers only default when something systemic goes wrong. It is a supervisory judgement embedded in a formula, not an empirical estimate the bank makes.</p>"
},
{
"l": "WORKED",
"t": "The risk weight",
"h": "From PD and LGD to a <em>percentage</em>",
"b": "<p>Evaluated at the portfolio average PD of 3.44% and LGD of 93.0%, using the other-retail correlation.</p>\n<div class=\"wk\"><div class=\"h\">Capital requirement per unit of exposure</div>\n<div class=\"r\"><b>w = (1 &minus; e<sup>&minus;35&times;0.0344</sup>) / (1 &minus; e<sup>&minus;35</sup>)</b><span>0.7001</span></div>\n<div class=\"r\"><b>R = 0.03&times;0.7001 + 0.16&times;0.2999</b><span>0.0690</span></div>\n<div class=\"r\"><b>G(0.0344)</b><span>&minus;1.8195</span></div>\n<div class=\"r\"><b>G(0.0344) / &radic;(1&minus;R)</b><span>&minus;1.8858</span></div>\n<div class=\"r\"><b>&radic;(R/(1&minus;R)) &times; 3.0902</b><span>+0.8412</span></div>\n<div class=\"r tot\"><b>Bracket total, then N&#91;&minus;1.0446&#93;</b><span>0.1481</span></div>\n<div class=\"r\"><b>LGD &times; 0.1481</b><span>0.13775</span></div>\n<div class=\"r\"><b>&minus; PD &times; LGD = &minus;0.0344 &times; 0.930</b><span>&minus;0.03200</span></div>\n<div class=\"r tot\"><b>K</b><span>0.10575</span></div>\n<div class=\"r tot\"><b>Risk weight = K &times; 12.5</b><span>132.2%</span></div>\n</div>\n<p>The 12.5 multiplier is the reciprocal of the 8% minimum capital ratio, and it exists purely to express the requirement as an asset weight rather than as capital directly.</p>\n<p><strong>The reported portfolio figure is 125.63%, not 132.2%</strong>, and the difference is instructive. The production calculation runs account by account rather than at the average, and defaulted accounts &mdash; the 8.25% in stage 3, where PD = 1 &mdash; contribute zero capital requirement under this formula. Averaging risk weights is not the same as computing the risk weight of the average.</p>"
},
{
"l": "WORKED",
"t": "The portfolio",
"h": "RWA, and the <em>minimum</em> that follows",
"b": "<div class=\"wk\"><div class=\"h\">Capital position on the 2014 book</div>\n<div class=\"r\"><b>Total exposure at default</b><span>$1,826.57M</span></div>\n<div class=\"r\"><b>Portfolio risk weight, IRB</b><span>125.63%</span></div>\n<div class=\"r tot\"><b>Risk-weighted assets, IRB</b><span>$2,294.67M</span></div>\n<div class=\"r\"><b>Standardised risk weight, regulatory retail</b><span>75%</span></div>\n<div class=\"r tot\"><b>Risk-weighted assets, standardised</b><span>$1,369.93M</span></div>\n<div class=\"r\"><b>Minimum total capital at 8%</b><span>$183.57M</span></div>\n<div class=\"r\"><b>Tier 1 at 6%</b><span>$137.68M</span></div>\n<div class=\"r\"><b>Common equity tier 1 at 4.5%</b><span>$103.26M</span></div>\n</div>\n<p>Three ratios against the same denominator, describing three qualities of capital. <span class=\"k\">Common equity tier 1</span> is the highest quality &mdash; ordinary shares and retained earnings, loss-absorbing while the bank is still trading. <span class=\"k\">Tier 1</span> adds certain perpetual instruments. <span class=\"k\">Total capital</span> adds subordinated debt that absorbs loss only in wind-up.</p>\n<p>These are minimums. Buffers sit on top &mdash; a capital conservation buffer, a countercyclical buffer, surcharges for systemically important institutions &mdash; and an institution operating at exactly the minimum would face restrictions on distributions.</p>"
},
{
"l": "WORKED",
"t": "The stress",
"h": "What <em>eight points</em> of LGD costs",
"b": "<p>The downturn LGD add-on from Mission 10, carried through the same calculation.</p>\n<div class=\"wk\"><div class=\"h\">Base against downturn</div>\n<div class=\"r\"><b>RWA, modelled LGD</b><span>$2,294.67M</span></div>\n<div class=\"r\"><b>RWA, LGD + 8 percentage points</b><span>$2,453.92M</span></div>\n<div class=\"r tot\"><b>Increase in RWA</b><span>$159.25M &nbsp;(+6.94%)</span></div>\n<div class=\"r\"><b>Risk weight under stress</b><span>134.35%</span></div>\n<div class=\"r tot\"><b>Additional total capital at 8%</b><span>$12.74M</span></div>\n</div>\n<p>An 8.6% relative increase in LGD produces a 6.94% increase in risk-weighted assets. The transmission is close to proportional but not exactly, because LGD appears twice in the formula &mdash; once multiplying the stressed loss rate and once inside the expected-loss subtraction, which partly offsets.</p>\n<p><strong>$12.74M is the capital cost of one assumption.</strong> Stating it that way is the point of running the comparison: it converts a modelling judgement into a number a capital committee can weigh, rather than leaving it as a methodological footnote.</p>"
},
{
"l": "TRAP",
"t": "IRB and capital",
"h": "Internal models always <em>save</em> capital",
"b": "<p>The belief: the reason banks invest in internal ratings-based approaches is that they produce lower requirements than the standardised table.</p>\n<p>This portfolio is the counterexample. IRB gives 125.63% and the standardised approach gives 75%. <strong>The internal model demands two-thirds more capital than the table does.</strong></p>\n<p>The reason is LGD. The standardised weight for regulatory retail is a fixed 75% regardless of recovery prospects. The IRB function takes the actual LGD, and on unsecured consumer lending that is 93%. A book where recoveries are near zero is genuinely riskier per unit of exposure than the standard table assumes, and a risk-sensitive formula says so.</p>\n<p>The general result: IRB reduces requirements on portfolios that are better than the standardised assumption &mdash; secured, high-recovery, low-PD &mdash; and increases them on portfolios that are worse. That is what risk sensitivity means, and it cuts both ways by design.</p>\n<div class=\"note\">There is also a floor. Under the finalised framework, IRB-derived risk-weighted assets cannot fall below a set percentage of the standardised calculation, which caps the saving available on the favourable side while leaving the increase on the unfavourable side untouched.</div>"
},
{
"l": "RECALL",
"t": "Mission 14",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li><strong>Provisions cover expected loss; capital covers unexpected loss</strong>, to the 99.9th percentile of a one-year distribution.</li>\n<li>The IRB function stresses PD through the correlation, multiplies by LGD, and <strong>subtracts expected loss</strong> &mdash; so defaulted exposures generate zero requirement.</li>\n<li>Retail correlation runs from 0.16 down to 0.03 as PD rises, and is set by the rules, not estimated.</li>\n<li>Risk weight = K &times; 12.5. Here <strong>125.63% IRB against 75% standardised</strong>, on $1,826.57M of exposure.</li>\n<li>Minimums stack: 4.5% CET1, 6% tier 1, 8% total, with buffers above.</li>\n<li><strong>IRB does not always save capital.</strong> On a 93% LGD book it costs two-thirds more than the table.</li>\n</ul>"
}
],

"stage": "Monitoring",
"line": "Once loans are live the questions change from what will happen to what is happening, and the reports that answer them have their own arithmetic and their own failure modes.",

"cards": [
{
"l": "ORIENT",
"t": "After go-live",
"h": "The model is now a <em>system</em> in production",
"b": "<p>Every mission so far produced an estimate about the future. Monitoring reports what is happening now, and the two are answerable by different people using different data.</p>\n<p>Three questions repeat on every management pack in retail lending, and the rest of the mission is the machinery behind them.</p>\n<div class=\"three\"><div><b>How much of the book is late, and by how much?</b>Delinquency distribution and the ratios built on it.</div>\n<div><b>Is recent lending worse than older lending?</b>Vintage analysis, which is the only comparison that is fair between cohorts of different ages.</div>\n<div><b>Are accounts getting worse or better, month on month?</b>Roll rates and transition matrices &mdash; and these have the strictest data requirement of the three.</div></div>\n<div class=\"note\">A monitoring report that answers only the first question is where most reporting stops, and it is the one most easily misread, because a delinquency ratio moves with book growth as much as with credit quality.</div>"
},
{
"l": "DEFINE",
"t": "Buckets",
"h": "The <em>vocabulary</em> of a live book",
"b": "<div class=\"sheet\"><div class=\"h\">Standard delinquency terms</div>\n<div class=\"r\"><b>DPD</b><span>Days past due &mdash; days since the oldest unpaid instalment fell due</span></div>\n<div class=\"r\"><b>Bucket</b><span>A DPD band. Commonly current, 1&ndash;30, 31&ndash;60, 61&ndash;90, 90+</span></div>\n<div class=\"r\"><b>PAR 30 / PAR 90</b><span>Portfolio at risk &mdash; outstanding balance of accounts more than 30 or 90 days past due, over total outstanding</span></div>\n<div class=\"r\"><b>NPA</b><span>Non-performing asset &mdash; typically the 90+ population, though the precise regulatory definition varies by jurisdiction</span></div>\n<div class=\"r\"><b>Flow rate</b><span>Share of one bucket that moves into the next bucket next month</span></div>\n<div class=\"r\"><b>Cure rate</b><span>Share of a delinquent bucket that returns to current</span></div>\n</div>\n<p>Two properties make these usable and both are easy to break. They are <strong>balance-weighted, not account-weighted</strong> &mdash; one large delinquent loan matters more than ten small ones, and a report that counts accounts will disagree with one that counts money. And the denominator is the total outstanding book, so a ratio falls when the book grows even if nothing improves.</p>\n<div class=\"note\">A falling PAR ratio during rapid growth is the most common false comfort in retail lending reporting. The numerator has not shrunk; the denominator has grown.</div>"
},
{
"l": "MECHANISM",
"t": "Vintage curves",
"h": "The only <em>fair</em> comparison between cohorts",
"b": "<p>Comparing loans made this year with loans made three years ago on any current measure is meaningless, because they have had different amounts of time to fail. Mission 12 established the shape: default risk peaks around month 14, so a young cohort will always look better.</p>\n<p>Vintage analysis removes age from the comparison by plotting each cohort against <span class=\"k\">months on book</span> &mdash; time since that loan was originated &mdash; rather than against the calendar.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. Group by origination period</b>Each cohort is a vintage: all loans originated in the same month or quarter.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2. Compute months on book</b>For every observation, the elapsed months since that loan's own origination.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3. Cumulative bad rate at each MOB</b>Share of the cohort that has defaulted by month 6, month 12, month 18, and so on.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>4. Plot all cohorts on one axis</b>Months on book horizontal, cumulative bad rate vertical. Curves that sit above earlier ones mean underwriting has deteriorated.</div>\n</div>\n<p>The read is direct and it is the reason the chart exists: <strong>at the same months on book, is the newer cohort worse than the older one?</strong> That question cannot be answered any other way, and it is the question a credit committee actually needs answered.</p>"
},
{
"l": "WORKED",
"t": "By vintage",
"h": "Eight cohorts, and what the table <em>can</em> say",
"b": "<div class=\"dt\"><table>\n<tr><th>Vintage</th><th>Loans</th><th>Current</th><th>Late 31&ndash;120</th><th>Defaulted</th><th>Fully paid</th></tr>\n<tr><td>2009</td><td class=\"n\">5,281</td><td class=\"n\">0.00%</td><td class=\"n\">0.00%</td><td class=\"n\">11.25%</td><td class=\"n\">78.05%</td></tr>\n<tr><td>2011</td><td class=\"n\">21,721</td><td class=\"n\">8.99%</td><td class=\"n\">0.21%</td><td class=\"n\">14.79%</td><td class=\"n\">75.83%</td></tr>\n<tr><td>2012</td><td class=\"n\">53,367</td><td class=\"n\">6.45%</td><td class=\"n\">0.42%</td><td class=\"n\">15.20%</td><td class=\"n\">77.72%</td></tr>\n<tr class=\"hi\"><td>2013</td><td class=\"n\">134,755</td><td class=\"n\">44.72%</td><td class=\"n\">1.32%</td><td class=\"n\">11.14%</td><td class=\"n\">41.85%</td></tr>\n<tr class=\"hi\"><td>2014</td><td class=\"n\">235,628</td><td class=\"n\">67.29%</td><td class=\"n\">2.06%</td><td class=\"n\">6.19%</td><td class=\"n\">23.22%</td></tr>\n</table></div>\n<p>Read down the defaulted column and it appears that lending quality improved dramatically: 15.20% for 2012, 6.19% for 2014. <strong>That reading is wrong, and the column next to it says why.</strong></p>\n<p>67.29% of the 2014 cohort was still current at the observation date. Those loans have not finished. Their defaults have not happened yet. The 2012 cohort has 6.45% still running, so its 15.20% is close to a final figure, while 2014's 6.19% is a partial count of an unfinished race.</p>\n<p>This is <span class=\"k\">truncation</span>: outcomes observed through a window that closes before the cohort matures. It is the same effect flagged in Mission 07 as the leading explanation for the out-of-time discrimination lift, and here it is visible directly.</p>\n<div class=\"note\">The correct comparison from this table is not between final columns but at a common months-on-book point &mdash; the default rate of each cohort at month 12, which is what a vintage curve plots and a status snapshot cannot give.</div>"
},
{
"l": "MECHANISM",
"t": "Roll rates",
"h": "What a transition measure actually <em>requires</em>",
"b": "<p>A roll rate is the share of accounts in one delinquency bucket that move to the next bucket in the following month. A transition matrix is the full grid of those movements, every bucket to every bucket.</p>\n<div class=\"fx\"><div class=\"cap\">Roll rate from bucket i to bucket j between consecutive months</div>\n<div class=\"eq\"><em>r</em><sub>ij</sub> = <span class=\"fr\"><i>accounts in bucket i at month t that are in bucket j at month t+1</i><i>accounts in bucket i at month t</i></span></div>\n<div class=\"wh\">i, j&nbsp;delinquency buckets &mdash; current, 1&ndash;30, 31&ndash;60, 61&ndash;90, 90+, charged off<br>\nt&nbsp;&nbsp;an observation month<br>\nr<sub>ij</sub>&nbsp;the share rolling from i to j; each row of the matrix sums to 1</div></div>\n<p>The requirement is absolute and it is what makes roll rates expensive: <strong>the same account must be observed in consecutive months</strong>. This is panel data &mdash; many accounts, each with a time series of states.</p>\n<p>A dataset with one row per loan holding its final status cannot produce a roll rate at any level of effort. There is one observation per account, so there is no transition to observe. The information was never captured.</p>"
},
{
"l": "TRAP",
"t": "Proxies",
"h": "A cross-section presented as a <em>transition</em>",
"b": "<p>This book is a single snapshot: one row per loan, current status only. No monthly history exists anywhere in it.</p>\n<p>What can be produced is a distribution of statuses within each vintage &mdash; the table two cards back. It looks like a transition table, sits in the same slot in a report, and answers a different question. A cross-section tells you where accounts <em>are</em>. A roll rate tells you where they are <em>going</em>.</p>\n<p>The distinction survives in the build in the most durable way available: <strong>the output file carries a column stating that it is a cross-sectional proxy and not a monthly panel, on every row.</strong> A label in a filename gets lost when the table is pasted into a deck. A label in the data travels with it.</p>\n<div class=\"sheet q\"><div class=\"h\">Component status on this build, stated plainly</div>\n<div class=\"r\"><b>Delinquency distribution</b><span>Real, from status. Cross-sectional</span></div>\n<div class=\"r\"><b>Vintage default rates</b><span>Real, by origination year. Truncated for recent cohorts</span></div>\n<div class=\"r\"><b>Roll rates</b><span>Proxy only. Labelled in-file. Not a panel measure</span></div>\n<div class=\"r\"><b>Grade transition matrix</b><span>Method implemented; the saved output ran on a fixture of two loans, so it demonstrates the code and reports nothing about the portfolio</span></div>\n</div>\n<p>The last row is the honest one and it is uncomfortable to write. A method that runs is not a result. If the saved artefact contains two rows, the claim available is \"the transition computation is implemented\", not \"transition matrices were produced for the book\".</p>"
},
{
"l": "TRAP",
"t": "Growth",
"h": "Rising delinquency means <em>deteriorating</em> credit",
"b": "<p>The belief: the 90+ ratio went up this quarter, so recent underwriting is worse.</p>\n<p>Two effects move a delinquency ratio and only one is credit quality.</p>\n<p><strong>Ageing.</strong> Mission 12 established that monthly default risk peaks around month 14. A book that grew fast last year is now full of loans passing through their peak-risk window. Delinquency rises with no change in underwriting standards at all &mdash; it is the arithmetic of the seasoning curve meeting a changed age mix.</p>\n<p><strong>Denominator effects.</strong> While a book is growing rapidly, new loans dilute the ratio and it falls. When growth stops, the dilution stops and the ratio rises sharply. Both movements are about the growth rate, not the credit.</p>\n<div class=\"sheet g\"><div class=\"h\">Separating ageing from deterioration</div>\n<div class=\"r\"><b>Vintage curves at fixed MOB</b><span>The direct answer. Same age, different cohorts</span></div>\n<div class=\"r\"><b>Delinquency by months on book</b><span>Removes the age mix from the current picture</span></div>\n<div class=\"r\"><b>Static pool balances</b><span>Track a fixed cohort's balance rather than a moving denominator</span></div>\n<div class=\"r\"><b>Growth rate alongside every ratio</b><span>So the reader can see the dilution effect rather than infer it</span></div>\n</div>\n<p>It is a believable mistake because the headline number genuinely moved and the explanation requires a chart nobody asked for.</p>"
},
{
"l": "RECALL",
"t": "Mission 15",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Delinquency buckets, PAR and NPA are <strong>balance-weighted with the whole book as denominator</strong>, so they move with growth.</li>\n<li>Vintage curves plot cumulative bad rate against months on book &mdash; the only comparison that is fair between cohorts of different ages.</li>\n<li><strong>Truncation</strong>: 67.29% of the 2014 cohort still current means its 6.19% default rate is an unfinished count, not an improvement.</li>\n<li>Roll rates require panel data &mdash; the same account across consecutive months. A one-row-per-loan extract cannot produce one.</li>\n<li><strong>Label a proxy inside the data, not in the filename</strong>, so the label survives being pasted into a deck.</li>\n<li>Rising delinquency is ageing or dilution until vintage analysis proves it is deterioration.</li>\n</ul>"
}
],

{
"l": "ORIENT",
"t": "The deliverable",
"h": "A number nobody can <em>check</em> is worth nothing",
"b": "<p>Everything built so far produces figures. None of those figures can be used by an institution until someone who did not build them can verify them, challenge them, and sign for them.</p>\n<p>That is not bureaucracy layered on top of the work. It is the difference between an analysis and a control. A provision figure that cannot be reconciled to source data is not a provision, it is an assertion, and an auditor will treat it as one.</p>\n<div class=\"dg\"><div class=\"dg-t\">What has to exist alongside every number</div>\n<div class=\"lay\">\n<div><span>1</span>The <strong>method</strong>, written so someone else could rebuild it</div>\n<div><span>2</span>The <strong>lineage</strong>, from source field to reported figure</div>\n<div class=\"hot\"><span>3</span>The <strong>limitations</strong>, stated by the builder before anyone asks</div>\n<div><span>4</span>The <strong>validation evidence</strong>, produced independently</div>\n<div><span>5</span>The <strong>sign-off</strong>, by someone accountable for using it</div>\n</div>\n<div class=\"cross\">Missing any one of the five and the number cannot be relied on</div></div>"
},
{
"l": "MECHANISM",
"t": "The model document",
"h": "What has to be <em>in</em> it",
"b": "<p>The supervisory expectation is that documentation is detailed enough for someone unfamiliar with the model to understand how it operates, its limitations and its key assumptions. That is a demanding standard and it produces a specific table of contents.</p>\n<div class=\"sheet\"><div class=\"h\">Sections a model document carries</div>\n<div class=\"r\"><b>Purpose and intended use</b><span>What decisions this model supports, and explicitly which it does not</span></div>\n<div class=\"r\"><b>Data</b><span>Sources, period, exclusions, quality assessment, and why the data is relevant to the use</span></div>\n<div class=\"r\"><b>Target definition</b><span>Default definition, performance window, and the reconciliation to raw counts</span></div>\n<div class=\"r\"><b>Methodology</b><span>Technique chosen, alternatives considered, and why this one</span></div>\n<div class=\"r\"><b>Variable selection</b><span>Candidates screened, criteria applied, final set with rationale per variable</span></div>\n<div class=\"r\"><b>Results</b><span>Coefficients, scorecard, grades, with the fitting sample identified</span></div>\n<div class=\"r\"><b>Validation</b><span>Discrimination, calibration, stability, on each sample, with the failures shown</span></div>\n<div class=\"r\"><b>Limitations</b><span>What the model cannot do and the conditions under which it should not be used</span></div>\n<div class=\"r\"><b>Monitoring plan</b><span>What is measured after go-live, how often, and the thresholds that trigger action</span></div>\n</div>\n<p>The two that get thinned first under time pressure are variable selection rationale and limitations, and they are the two an independent reviewer reads first &mdash; because they are where judgement lives, and judgement is what review exists to challenge.</p>"
},
{
"l": "MECHANISM",
"t": "Lineage",
"h": "From a <em>source field</em> to a reported figure",
"b": "<p><span class=\"k\">Data lineage</span> is the documented path from a field in a source system to a number in a report, including every transformation on the way. The test is that a reviewer can pick any figure and walk backwards to the raw data without asking the author anything.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Source</b>System of record, table, field name, extraction date, and the business definition of the field.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Transformation</b>Every cleaning rule, derivation, join, filter and default applied &mdash; each with the reason it exists.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Model input</b>The binned, transformed variable as the model consumes it, with the bin boundaries recorded.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Output</b>The computed figure, with the aggregation and any post-processing named.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Report</b>Where it appears, at what frequency, to whom.</div>\n</div>\n<p>Two properties make lineage useful rather than decorative. <strong>Reversibility</strong>: from a reported number, the source rows behind it can be identified. And <strong>impact analysis</strong>: when a source field changes definition, every downstream figure affected can be listed before the change is made rather than discovered afterwards.</p>\n<div class=\"note\">A worked example on this build: the 15.25% coverage ratio traces to total ECL over total EAD, ECL traces to per-account PD, LGD and EAD, EAD traces to funded amount minus principal received, and both of those are named source columns with an extraction date. Five steps, each recorded.</div>"
},
{
"l": "DEFINE",
"t": "Model risk",
"h": "The standard that defines <em>effective challenge</em>",
"b": "<p>The United States supervisory guidance on model risk management is the reference document most model documentation is written against, including outside the US, because other jurisdictions issued closely similar guidance afterwards.</p>\n<div class=\"docs\">\n<a href=\"https://www.federalreserve.gov/supervisionreg/srletters/sr1107.htm\"><b>SR 11-7 &mdash; Guidance on Model Risk Management</b><span>federalreserve.gov &mdash; issued jointly with the OCC, April 2011</span></a>\n</div>\n<p>Three ideas from it do the work.</p>\n<p><strong>Model risk has two sources.</strong> A model may have fundamental errors and produce wrong outputs; or it may be correct and used wrongly, outside its scope or without understanding its limitations. Documentation addresses the second at least as much as the first.</p>\n<p><strong>Effective challenge is the guiding principle</strong> &mdash; critical analysis by objective, informed parties who can identify limitations and produce changes. It depends on incentives, competence and influence: a reviewer who is technically able but cannot make anything happen is not effective challenge.</p>\n<p><strong>Validation has three core elements</strong>: evaluation of conceptual soundness, ongoing monitoring, and outcomes analysis. Missions 07 to 09 are the third and second. The first is a review of whether the design was reasonable at all, which cannot be answered by any metric.</p>"
},
{
"l": "MECHANISM",
"t": "Three lines",
"h": "Who <em>challenges</em> whom",
"b": "<p>Independence is structural rather than attitudinal. The standard arrangement separates three roles so that the people who check are not the people who built.</p>\n<div class=\"dt\"><table>\n<tr><th>Line</th><th>Who</th><th>Role</th></tr>\n<tr><td>First</td><td class=\"g\">Business and model development</td><td class=\"g\">Owns the risk, builds the model, runs it, documents it</td></tr>\n<tr class=\"hi\"><td>Second</td><td class=\"g\">Risk management and independent validation</td><td class=\"g\">Sets policy, challenges the model, validates it before use and periodically after</td></tr>\n<tr><td>Third</td><td class=\"g\">Internal audit</td><td class=\"g\">Assesses whether the framework itself is working &mdash; not the model, the process around it</td></tr>\n</table></div>\n<p>The distinction between the second and third lines is frequently blurred and worth holding: <strong>validation asks whether this model is sound; audit asks whether the institution's process for producing sound models is sound.</strong> An auditor finding that validations are being signed without evidence is a third-line finding, and it is more serious than any single model defect.</p>\n<p>The practical consequence for anyone building a model: the document is written for the second line, not for the first. It has to answer questions from someone whose job is to find what is wrong with it.</p>"
},
{
"l": "DEFINE",
"t": "Risk data",
"h": "Fourteen principles for the data <em>underneath</em>",
"b": "<p>Models sit on aggregated risk data, and a separate standard governs that layer. It was issued after the 2008 crisis, when it emerged that many banks could not aggregate their exposures quickly or accurately across entities and business lines.</p>\n<div class=\"docs\">\n<a href=\"https://www.bis.org/publ/bcbs239.pdf\"><b>Principles for effective risk data aggregation and risk reporting</b><span>bis.org &mdash; Basel Committee, January 2013. Fourteen principles in four groups</span></a>\n</div>\n<div class=\"sheet\"><div class=\"h\">The four groups, and what each demands</div>\n<div class=\"r\"><b>Governance and infrastructure (1&ndash;2)</b><span>Board oversight of data capability; architecture that works in a crisis, not only in normal times</span></div>\n<div class=\"r\"><b>Aggregation capability (3&ndash;6)</b><span>Accuracy and integrity, completeness, timeliness, adaptability to ad hoc requests</span></div>\n<div class=\"r\"><b>Reporting practices (7&ndash;11)</b><span>Accuracy, comprehensiveness, clarity, frequency, distribution</span></div>\n<div class=\"r\"><b>Supervisory review (12&ndash;14)</b><span>Periodic review, remedial powers, home-host cooperation</span></div>\n</div>\n<p>Three requirements bite hardest in practice. Data should be aggregated <strong>on a largely automated basis</strong> to minimise error, with manual workarounds documented and justified rather than merely tolerated. A bank should have a <strong>dictionary of concepts</strong> so terms mean the same thing across the organisation. And it should strive for a <strong>single authoritative source</strong> per risk type.</p>\n<div class=\"note\">The principles apply explicitly to internal ratings-based credit risk models, so a scorecard's data pipeline is in scope, not only the reporting layer above it.</div>"
},
{
"l": "MECHANISM",
"t": "Requirement to sign-off",
"h": "How a definition becomes a <em>delivered</em> number",
"b": "<p>Between a policy statement and a working report sits a sequence of documents, each one narrowing ambiguity. The names vary between institutions; the sequence does not.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. Business requirement</b>What the business needs and why, in business language. Signed by the business owner. No system names in it.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2. Data requirement and source-to-target mapping</b>Every field needed, its source system, its business definition, its transformation rule, and its target. This is where policy language becomes something engineering can build against.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3. Functional specification</b>How the system will behave &mdash; calculations, rules, sequences, edge cases, error handling.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>4. Test pack with predefined results</b>Cases written with expected outputs <strong>before</strong> the build is tested, so the test is a check rather than a rationalisation.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>5. User acceptance testing and defect tracking</b>Business users execute the pack. Failures are logged, prioritised, fixed, retested, closed.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>6. Sign-off</b>A named person accepts that the delivered system meets the requirement.</div>\n</div>\n<p>The step that fails most often is the second. Three parties will use the same word to mean three different things &mdash; outstanding balance, delinquency, active account &mdash; and the disagreement stays invisible until reported figures from two systems fail to reconcile.</p>\n<p><strong>Writing expected results before testing is the single highest-value habit in the sequence.</strong> A test pack built after the output is available tends to describe what the system does rather than what it should do.</p>"
},
{
"l": "TRAP",
"t": "Timing",
"h": "Documentation is written at the <em>end</em>",
"b": "<p>The belief: build the model, get the results, then write it up.</p>\n<p>Two decisions cannot be reconstructed afterwards, and both are the ones a reviewer asks about. <strong>Why this variable and not that one</strong> &mdash; the alternatives considered and rejected exist only in the builder's memory, and they fade within weeks. And <strong>what was known to be wrong at the time</strong> &mdash; a limitation that felt obvious during the build looks like an oversight in a document written after the fact.</p>\n<p>The failure is silent. A document written at the end is complete, well-formatted, and describes the final state accurately. It simply cannot answer the challenge questions, and it produces a validation cycle where the author is asked to reconstruct reasoning from months earlier.</p>\n<div class=\"note\">The working version is a decision log kept alongside the code: date, decision, alternatives, reason, and who was consulted. It costs a line per decision and it is the raw material for three sections of the final document.</div>"

"b": "<p>A limitations section written properly names defects the reader would otherwise have to find. This pack's subject carries eight, stated as a worked example of the format.</p>\n<div class=\"sheet q\"><div class=\"h\">Known limitations, retail credit pipeline</div>\n<div class=\"r\"><b>Single-snapshot source</b><span>One row per loan. Roll rates and transition matrices cannot be computed; the proxy is labelled in-file</span></div>\n<div class=\"r\"><b>Truncated recent vintages</b><span>67.29% of the 2014 cohort still current. Its default rate is a partial count</span></div>\n<div class=\"r\"><b>Inferred default timing</b><span>Reconstructed from payment dates. Produces zero defaults in months 2 and 3</span></div>\n<div class=\"r\"><b>No macroeconomic conditioning</b><span>Hazard curve is static and historical. Falls short of a forward-looking provisioning requirement</span></div>\n<div class=\"r\"><b>Borrowed signal in the PD model</b><span>Two highest-IV variables are the platform's own grade and price</span></div>\n<div class=\"r\"><b>Two inert variables retained</b><span>term at p = 0.853 and zero points spread; sub_grade at p = 0.088</span></div>\n<div class=\"r\"><b>Calibration fails on two of three samples</b><span>Passes on test at p = 0.494; fails on train and out-of-time, sample-size driven</span></div>\n<div class=\"r\"><b>Downturn LGD is an assumption</b><span>An 8-point add-on, not an estimate from downturn-period recovery data</span></div>\n</div>\n<p>Every one of these appeared in an earlier mission with its cause and its consequence. That is what the section should be: a gathering of things already explained, not a disclaimer.</p>"

  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    ${m.line ? `<div class="mline">${m.line}</div>` : ''}
    ${m.bullets ? `<div class="inthis">In this mission</div><ul>${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : ''}
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
