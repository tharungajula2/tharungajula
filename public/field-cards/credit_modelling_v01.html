},
{
"title": "The scorecard",
"stage": "Model",
"line": "Turning coefficients into whole-number points an underwriter can add up, inverting a score back to a probability, and banding the result into rating grades.",
"bullets": [
"Define points to double the odds, base score and anchor odds",
"Compute the scaling factor and offset, then the points for one attribute",
"Score a full application by hand and convert the total back to a probability",
"Band a scorecard into rating grades and check the bands are monotonic"
],
"cards": [
{
"l": "ORIENT",
"t": "Why points",
"h": "A probability nobody can <em>add up</em> is not an operating tool",
"b": "<p>The model outputs a probability. An underwriting system, a branch officer and a credit policy document all want something else: a whole number, on a familiar scale, that can be added attribute by attribute, compared to a cut-off, and explained to the applicant in terms of which attributes cost them points.</p>\n<p>The conversion is exact and reversible. No information is lost and no second model is fitted &mdash; a scorecard is the same logistic regression written in different units, the way a temperature is the same temperature in Celsius or Fahrenheit.</p>\n<div class=\"note\">This is why the additivity of weight of evidence mattered back in Mission 04. A model that multiplies cannot become a card that adds.</div>"
},
{
"l": "DEFINE",
"t": "Three constants",
"h": "The <em>three</em> numbers that define a scale",
"b": "<p>A scorecard scale is fixed by three chosen constants. They are conventions, not estimates &mdash; nothing in the data determines them, and they are set so the resulting numbers look familiar to the people who will use them.</p>\n<div class=\"sheet\"><div class=\"h\">The scaling constants used on this build</div>\n<div class=\"r\"><b>Points to double the odds (PDO)</b><span>20</span></div>\n<div class=\"r\"><b>Base score</b><span>600</span></div>\n<div class=\"r\"><b>Anchor odds at the base score</b><span>50 to 1</span></div>\n</div>\n<p><span class=\"k\">Points to double the odds</span> is the size of the step that halves the risk. With PDO of 20, a borrower scoring 620 is half as likely to default as one scoring 600, and one at 640 is half as likely again.</p>\n<p><span class=\"k\">Anchor odds</span> pins the scale to reality at one point: at exactly 600 points, the odds of good to bad are 50 to 1, which is a probability of default of 1 in 51, or 1.96%.</p>\n<p>Different institutions choose different constants and the resulting scores are not comparable. A 700 on one card and a 700 on another mean nothing to each other without both sets of constants.</p>"
},
{
"l": "FORMULA",
"t": "Factor and offset",
"h": "Two derived numbers that do all the <em>work</em>",
"b": "<p>The three constants collapse into two quantities that appear in every subsequent calculation.</p>\n<div class=\"fx\"><div class=\"cap\">Scaling factor &mdash; points per unit of log-odds</div>\n<div class=\"eq\"><em>factor</em> = <span class=\"fr\"><i>PDO</i><i>ln 2</i></span> = <span class=\"fr\"><i>20</i><i>0.693147</i></span> = 28.8539</div>\n<div class=\"wh\">PDO&nbsp;points to double the odds, here 20<br>\nln 2&nbsp;natural log of 2, because doubling the odds means adding ln 2 to the log-odds</div></div>\n<div class=\"fx\"><div class=\"cap\">Offset &mdash; the constant that pins the scale</div>\n<div class=\"eq\"><em>offset</em> = <em>base</em> &minus; <em>factor</em> &times; ln(<em>anchor odds</em>)</div>\n<div class=\"wh\">base&nbsp;the base score, here 600<br>\nanchor odds&nbsp;good-to-bad odds at the base score, here 50<br>\nComputed: 600 &minus; 28.8539 &times; ln(50) = 600 &minus; 28.8539 &times; 3.91202 = <strong>487.123</strong></div></div>\n<p>The factor converts log-odds into points. The offset places zero log-odds at the right point on the scale. Together they are a straight-line map between the model's natural units and the card's.</p>"
},
{
"l": "FORMULA",
"t": "Points per attribute",
"h": "Splitting the score across <em>ten</em> variables",
"b": "<p>The score is a sum over variables, so both the coefficient effect and the intercept have to be distributed across the ten attributes an applicant will present.</p>\n<div class=\"fx\"><div class=\"cap\">Points awarded for one attribute</div>\n<div class=\"eq\"><em>points</em><sub>j</sub> = &minus;( <em>&beta;</em><sub>j</sub><em>WoE</em><sub>j</sub> + <span class=\"fr\"><i>&alpha;</i><i>n</i></span> ) &times; <em>factor</em> + <span class=\"fr\"><i>offset</i><i>n</i></span></div>\n<div class=\"wh\">points<sub>j</sub>&nbsp;whole-number points for the bin the applicant falls into on variable j<br>\n&beta;<sub>j</sub>&nbsp;the fitted coefficient on variable j<br>\nWoE<sub>j</sub>&nbsp;the weight of evidence of that applicant's bin on variable j<br>\n&alpha;&nbsp;&nbsp;the model intercept, here &minus;3.33836<br>\nn&nbsp;&nbsp;the number of variables in the card, here 10<br>\nfactor&nbsp;28.8539&nbsp;&nbsp;offset&nbsp;487.123<br>\nThe leading minus sign flips direction so that higher points mean lower risk</div></div>\n<p>Both &alpha; and the offset are divided by n so that when the ten attribute scores are summed, exactly one intercept and one offset have been added &mdash; not ten.</p>\n<div class=\"note\">Points are rounded to whole numbers at this step, once. Rounding the total instead, or rounding twice, produces cards that disagree with themselves by a point or two and no one can find why.</div>"
},
{
"l": "WORKED",
"t": "One attribute",
"h": "Grade A, from coefficient to <em>77 points</em>",
"b": "<div class=\"wk\"><div class=\"h\">Points for an applicant whose grade is A</div>\n<div class=\"r\"><b>Coefficient on grade, &beta;</b><span>&minus;0.61774</span></div>\n<div class=\"r\"><b>WoE of bin A (Mission 04)</b><span>+1.05391</span></div>\n<div class=\"r tot\"><b>&beta; &times; WoE</b><span>&minus;0.65104</span></div>\n<div class=\"r\"><b>&alpha; / n = &minus;3.33836 / 10</b><span>&minus;0.33384</span></div>\n<div class=\"r tot\"><b>Sum inside the bracket</b><span>&minus;0.98488</span></div>\n<div class=\"r\"><b>&times; &minus;factor (&minus;28.8539)</b><span>+28.418</span></div>\n<div class=\"r\"><b>+ offset / n = 487.123 / 10</b><span>+48.712</span></div>\n<div class=\"r tot\"><b>Points, rounded</b><span>77</span></div>\n</div>\n<p>The same arithmetic on the worst grade bin, WoE &minus;0.96859, gives 41 points. So the grade variable alone spans 36 points across its six bins &mdash; nearly two full doublings of the odds.</p>\n<p>Run it once more on the missing-income bin, WoE &minus;1.13998 with coefficient &minus;0.92019, and it returns 28 points against 70 for the highest income bin. That 42-point gap is the largest single swing anywhere on the card, and the next card is about why that is a problem rather than a feature.</p>"
},
{
"l": "TRAP",
"t": "Missing values",
"h": "A blank field is <em>neutral</em>",
"b": "<p>The belief: an applicant who did not supply a field should neither gain nor lose, so a missing bin lands somewhere in the middle.</p>\n<p>Weight of evidence does not work that way. It measures whatever the missing population actually did, and on this card the results are extreme in both directions.</p>\n<div class=\"dt\"><table>\n<tr><th>Variable</th><th>Best populated bin</th><th>Worst populated bin</th><th>Missing bin</th></tr>\n<tr class=\"hi\"><td>annual_inc</td><td class=\"n\">70</td><td class=\"n\">50</td><td class=\"n\">28</td></tr>\n<tr class=\"hi\"><td>inq_last_6mths</td><td class=\"n\">62</td><td class=\"n\">45</td><td class=\"n\">69</td></tr>\n<tr><td>revol_util</td><td class=\"n\">59</td><td class=\"n\">57</td><td class=\"n\">52</td></tr>\n</table></div>\n<p>Missing income scores 22 points below the worst declared income, which is defensible: an application without an income figure is genuinely worse than one with a low figure.</p>\n<p><strong>Missing inquiry count scores 69, above every populated bin including zero inquiries.</strong> Read literally, the card says an applicant whose credit-inquiry history could not be retrieved is safer than one verified to have made none. That is not credit quality. It is almost certainly a population that was recorded differently &mdash; an earlier system, a different data feed, a particular product &mdash; and the model has learned the feed rather than the risk.</p>\n<p>It is a believable mistake because everything is working correctly. The WoE is right, the arithmetic is right, and the resulting number is nonsense.</p>\n<div class=\"note\">Every missing bin on a finished card gets read as a sentence about applicants. If the sentence is absurd, the bin is capped, merged or the variable is dropped &mdash; before the card goes anywhere near a decision.</div>"
},
{
"l": "WORKED",
"t": "A full application",
"h": "Ten attributes, <em>602</em> points, one probability",
"b": "<p>An applicant with a B grade, sub-grade B4, a 13.5% rate on a 36-month loan, income of 68,000, no inquiries in six months, borrowing to consolidate debt, mortgage holder, debt-to-income of 16%, revolving utilisation of 45%.</p>\n<div class=\"wk\"><div class=\"h\">Scoring the card</div>\n<div class=\"r\"><b>grade = B</b><span>65</span></div>\n<div class=\"r\"><b>int_rate in [13.11, 14.30)</b><span>58</span></div>\n<div class=\"r\"><b>inq_last_6mths &lt; 1</b><span>62</span></div>\n<div class=\"r\"><b>sub_grade = B4</b><span>59</span></div>\n<div class=\"r\"><b>annual_inc in [65000, 75000)</b><span>61</span></div>\n<div class=\"r\"><b>purpose = debt consolidation</b><span>59</span></div>\n<div class=\"r\"><b>home_ownership = MORTGAGE</b><span>61</span></div>\n<div class=\"r\"><b>term = 36 months</b><span>58</span></div>\n<div class=\"r\"><b>dti in [14.05, 18.30)</b><span>60</span></div>\n<div class=\"r\"><b>revol_util in [39.60, 51.90)</b><span>59</span></div>\n<div class=\"r tot\"><b>Total score</b><span>602</span></div>\n</div>\n<p>Two points above the base of 600, so slightly better than the anchor odds of 50 to 1. The next card turns 602 into a probability.</p>\n<p>The card's theoretical range, taking the best and worst bin of every variable, runs from <strong>490 to 648</strong>. At 490 the implied probability of default is 47.5%; at 648 it is 0.38%.</p>"
},
{
"l": "FORMULA",
"t": "Score to PD",
"h": "Reading the card <em>backwards</em>",
"b": "<p>The conversion is exact and runs both ways, which is what makes a scorecard auditable: any score can be turned back into the probability it encodes, with no reference to the model object.</p>\n<div class=\"fx\"><div class=\"cap\">Probability of default implied by a score</div>\n<div class=\"eq\">ln(<em>odds</em>) = <span class=\"fr\"><i>score &minus; offset</i><i>factor</i></span> &nbsp;&nbsp;then&nbsp;&nbsp; <em>PD</em> = <span class=\"fr\"><i>1</i><i>1 + odds</i></span></div>\n<div class=\"wh\">score&nbsp;the applicant's total points<br>\noffset&nbsp;487.123&nbsp;&nbsp;factor&nbsp;28.8539<br>\nodds&nbsp;good-to-bad odds implied by the score<br>\nPD&nbsp;probability of default over the model's twelve-month window</div></div>\n<div class=\"wk\"><div class=\"h\">The 602-point application</div>\n<div class=\"r\"><b>score &minus; offset = 602 &minus; 487.123</b><span>114.877</span></div>\n<div class=\"r\"><b>&divide; factor = 114.877 / 28.8539</b><span>3.9813</span></div>\n<div class=\"r tot\"><b>odds = e<sup>3.9813</sup></b><span>53.58 : 1</span></div>\n<div class=\"r tot\"><b>PD = 1 / (1 + 53.58)</b><span>1.83%</span></div>\n</div>\n<p>Check the scale on itself: at exactly 600 points the same arithmetic gives odds of 50.0 and a PD of 1.96%, which is the anchor that was chosen. The card is internally consistent.</p>"
},
{
"l": "MECHANISM",
"t": "Rating grades",
"h": "Eight bands, and the test they must <em>pass</em>",
"b": "<p>A continuous score is banded into a small number of rating grades, because policy, pricing, reporting and capital all operate on bands rather than on individual scores.</p>\n<div class=\"dt\"><table>\n<tr><th>Grade</th><th>Score range</th><th>Loans</th><th>Observed default rate</th></tr>\n<tr class=\"hi\"><td>1</td><td class=\"g\">614&ndash;639</td><td class=\"n\">21,930</td><td class=\"n\">0.86%</td></tr>\n<tr><td>2</td><td class=\"g\">604&ndash;613</td><td class=\"n\">23,998</td><td class=\"n\">1.34%</td></tr>\n<tr><td>3</td><td class=\"g\">597&ndash;603</td><td class=\"n\">22,475</td><td class=\"n\">1.94%</td></tr>\n<tr><td>4</td><td class=\"g\">591&ndash;596</td><td class=\"n\">21,074</td><td class=\"n\">2.52%</td></tr>\n<tr><td>5</td><td class=\"g\">584&ndash;590</td><td class=\"n\">24,353</td><td class=\"n\">3.08%</td></tr>\n<tr><td>6</td><td class=\"g\">577&ndash;583</td><td class=\"n\">22,564</td><td class=\"n\">4.31%</td></tr>\n<tr><td>7</td><td class=\"g\">568&ndash;576</td><td class=\"n\">23,203</td><td class=\"n\">5.19%</td></tr>\n<tr class=\"hi\"><td>8</td><td class=\"g\">522&ndash;567</td><td class=\"n\">24,928</td><td class=\"n\">7.72%</td></tr>\n</table></div>\n<p>Three tests, all passed here. <strong>Monotonicity</strong>: the observed default rate rises at every step with no reversal. <strong>Balance</strong>: each grade holds between 11.4% and 13.5% of the book, so no band is too thin to estimate or too fat to discriminate within. <strong>Spread</strong>: the worst grade defaults at nine times the rate of the best.</p>\n<p>The bands are not equal width in points. Grades 2 through 7 span seven to ten points each, while grade 8 spans 46. That is deliberate: the bands were cut for roughly equal population, and the score distribution has a long thin tail at the bottom.</p>"
},
{
"l": "RECALL",
"t": "Mission 06",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Three chosen constants define the scale: <strong>PDO 20, base 600, anchor odds 50:1</strong> &mdash; conventions, not estimates.</li>\n<li><strong>factor = PDO / ln 2 = 28.854</strong> and <strong>offset = base &minus; factor &times; ln(anchor) = 487.123</strong>.</li>\n<li>Points per attribute distribute both the coefficient effect and the intercept across n variables, and round once.</li>\n<li>Score inverts exactly: ln(odds) = (score &minus; offset) / factor. <strong>602 points is 53.6:1, a PD of 1.83%.</strong></li>\n<li>Missing bins get read as sentences about applicants; an inquiry-missing bin scoring above every populated bin is a data artefact, not credit quality.</li>\n<li>Rating grades are tested on monotonicity, population balance and spread &mdash; here 0.86% to 7.72% across eight bands.</li>\n</ul>"
}
],

{
"title": "Proving it ranks",
"stage": "Validation",
"line": "The first of two entirely separate questions about a model: does it put the bad loans below the good ones, and how is that measured.",
"bullets": [
"Build a ROC curve from scores and outcomes",
"Convert between AUROC and Gini, and compute KS",
"Read discrimination figures against what is normal on a retail book",
"Explain why holdout performance can exceed development performance"
],
"cards": [
{
"l": "ORIENT",
"t": "Two questions",
"h": "Ranking and level are <em>different</em> failures",
"b": "<p>A model can be wrong in two independent ways, and the tools that detect them share nothing.</p>\n<div class=\"two\"><div><b>Rank ordering</b>Does the model put riskier loans below safer ones? A model that ranks perfectly but predicts 20% for everyone still sorts the book correctly. <strong>This mission.</strong></div>\n<div><b>Level</b>Are the predicted probabilities right in absolute terms? A model predicting 2% where 5% occurs is mis-levelled even if its ranking is flawless. <strong>Mission 08.</strong></div></div>\n<p>The distinction is operational, not academic. A cut-off policy &mdash; approve above this score, decline below &mdash; needs only rank ordering. A provision, a capital charge or a risk-based price needs the level to be right too, because those numbers are the probability multiplied by money.</p>\n<div class=\"note\">Ranking is hard to fix and easy to measure. Level is easy to fix and easy to get wrong. Most of the noise around model validation comes from treating them as one thing.</div>"
},
{
"l": "MECHANISM",
"t": "Building a ROC",
"h": "Where the <em>curve</em> comes from",
"b": "<p>The receiver operating characteristic curve is built by sweeping a cut-off across every possible score and plotting two rates at each position.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. Sort by predicted risk</b>Order every loan from highest predicted probability of default to lowest.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2. Walk a cut-off down the list</b>At each position, treat everything above as predicted-bad and everything below as predicted-good.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3. Record two rates</b>The share of all actual bads captured above the cut-off, and the share of all actual goods wrongly captured above it.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>4. Plot</b>Goods wrongly captured on the horizontal axis, bads correctly captured on the vertical. Joining the points traces the curve.</div>\n</div>\n<p>The diagonal line is what random ordering produces: to capture 30% of the bads you must accept 30% of the goods. A useful model bows above it, capturing bads faster than it captures goods. A curve <em>below</em> the diagonal means the ordering is inverted, which is a coding error, not a weak model.</p>\n<p>The whole construction never looks at the predicted probabilities themselves, only at their order. That is why the curve measures ranking and is completely blind to level.</p>"
},
{
"l": "FORMULA",
"t": "AUROC and Gini",
"h": "Two numbers, one <em>quantity</em>",
"b": "<div class=\"fx\"><div class=\"cap\">Area under the curve, and its rescaling</div>\n<div class=\"eq\"><em>AUROC</em> = area under the ROC curve &nbsp;&nbsp;&nbsp; <em>Gini</em> = 2 &times; <em>AUROC</em> &minus; 1</div>\n<div class=\"wh\">AUROC&nbsp;area under the receiver operating characteristic curve, between 0 and 1<br>\n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;0.5 is random ordering; 1.0 is perfect separation<br>\nGini&nbsp;&nbsp;the same information rescaled so that 0 is random and 1 is perfect</div></div>\n<p>AUROC has an exact interpretation worth memorising: <strong>it is the probability that a randomly chosen bad loan is ranked riskier than a randomly chosen good one.</strong> An AUROC of 0.69 means that in 69 of every 100 such pairs, the model gets the order right.</p>\n<p>Gini exists because 0.5 is an awkward floor. Halving the distance from random to perfect and rescaling puts the floor at zero, which makes proportional statements sensible: a Gini of 0.40 really is twice the discriminatory power of 0.20, whereas an AUROC of 0.70 is not twice 0.35.</p>\n<div class=\"note\">Both are computed from the same curve, so a model cannot be better on one and worse on the other. Quoting both is convention rather than additional evidence.</div>"
},
{
"l": "WORKED",
"t": "The results",
"h": "Three samples, two <em>models</em>",
"b": "<div class=\"dt\"><table>\n<tr><th>Metric</th><th>Sample</th><th>Model A</th><th>Model B (final)</th></tr>\n<tr><td>AUROC</td><td class=\"g\">Train</td><td class=\"n\">0.6507</td><td class=\"n\">0.6839</td></tr>\n<tr><td>AUROC</td><td class=\"g\">Test</td><td class=\"n\">0.6485</td><td class=\"n\">0.6817</td></tr>\n<tr class=\"hi\"><td>AUROC</td><td class=\"g\">Out-of-time</td><td class=\"n\">0.6357</td><td class=\"n\">0.6923</td></tr>\n<tr><td>Gini</td><td class=\"g\">Train</td><td class=\"n\">0.3013</td><td class=\"n\">0.3678</td></tr>\n<tr><td>Gini</td><td class=\"g\">Test</td><td class=\"n\">0.2969</td><td class=\"n\">0.3634</td></tr>\n<tr class=\"hi\"><td>Gini</td><td class=\"g\">Out-of-time</td><td class=\"n\">0.2715</td><td class=\"n\">0.3845</td></tr>\n<tr><td>KS</td><td class=\"g\">Train</td><td class=\"n\">0.2193</td><td class=\"n\">0.2736</td></tr>\n<tr><td>KS</td><td class=\"g\">Test</td><td class=\"n\">0.2233</td><td class=\"n\">0.2728</td></tr>\n<tr class=\"hi\"><td>KS</td><td class=\"g\">Out-of-time</td><td class=\"n\">0.1955</td><td class=\"n\">0.2843</td></tr>\n</table></div>\n<div class=\"wk\"><div class=\"h\">Gini from AUROC, final model out-of-time</div>\n<div class=\"r\"><b>AUROC</b><span>0.69226</span></div>\n<div class=\"r\"><b>&times; 2</b><span>1.38452</span></div>\n<div class=\"r tot\"><b>&minus; 1 = Gini</b><span>0.38452</span></div>\n</div>\n<p>Train to test barely moves on either model &mdash; a gap of 0.004 on Model B &mdash; which is the signature of a model that has not overfitted. With ten variables and 184,525 rows, that is what should be expected, and it is worth confirming rather than assuming.</p>"
},
{
"l": "FORMULA",
"t": "KS",
"h": "The <em>widest gap</em> between two distributions",
"b": "<p>The Kolmogorov-Smirnov statistic answers a question a cut-off policy actually asks: at the single best cut-off, how much separation is available?</p>\n<div class=\"fx\"><div class=\"cap\">KS statistic on a scored population</div>\n<div class=\"eq\"><em>KS</em> = max<sub>s</sub> | <em>F</em><sub>bad</sub>(<em>s</em>) &minus; <em>F</em><sub>good</sub>(<em>s</em>) |</div>\n<div class=\"wh\">s&nbsp;&nbsp;a score threshold, swept across the whole range<br>\nF<sub>bad</sub>(s)&nbsp;share of all bad loans scoring at or below s &mdash; the cumulative distribution of bads<br>\nF<sub>good</sub>(s)&nbsp;share of all good loans scoring at or below s<br>\nmax<sub>s</sub>&nbsp;the largest value the gap reaches anywhere on the scale</div></div>\n<p>Where AUROC integrates separation across every possible cut-off, KS reports it at the best single one. A KS of 0.284 means that at the optimal score threshold, the cumulative share of bads below it exceeds the cumulative share of goods below it by 28.4 percentage points.</p>\n<p>KS is the more actionable number when a policy will use one cut-off, because it also identifies <em>where</em> that cut-off sits. AUROC is the more complete number when the score will be used continuously, for pricing or provisioning.</p>"
},
{
"l": "CHEAT",
"t": "What is normal",
"h": "Where these figures sit against <em>practice</em>",
"b": "<div class=\"sheet\"><div class=\"h\">Retail application scorecards &mdash; rough working bands</div>\n<div class=\"r\"><b>Gini below 0.20</b><span>Weak. Question whether the model adds anything over existing policy</span></div>\n<div class=\"r\"><b>Gini 0.25 to 0.45</b><span>Ordinary territory for unsecured consumer application scoring</span></div>\n<div class=\"r\"><b>Gini 0.45 to 0.65</b><span>Strong. Usually means bureau score or rich behavioural data is present</span></div>\n<div class=\"r\"><b>Gini above 0.75</b><span>Investigate before believing. Behavioural models on existing customers reach this; application models rarely do</span></div>\n</div>\n<p><strong>These are rules of thumb from practice, not a published standard</strong>, and the range is wide because the achievable figure depends almost entirely on what data is available. An application scorecard with no bureau score, on a thin file, in a market with limited credit history, will sit at the bottom of this range and be perfectly sound. A behavioural scorecard on twelve months of account conduct will sit near the top and is not thereby a better piece of work.</p>\n<p>The figures on this build &mdash; Gini 0.385, KS 0.284 out of time &mdash; sit in the ordinary band. That is consistent with what Mission 05 predicted: the borrower attributes available here are individually weak, and the two strong variables are the lender's own prior assessment.</p>"
},
{
"l": "TRAP",
"t": "Absolute standards",
"h": "AUROC of 0.69 means a <em>bad</em> model",
"b": "<p>The belief: 0.69 is close to the 0.5 floor, classifiers in other fields routinely reach 0.95, so this model is poor.</p>\n<p>Discrimination ceilings are set by the problem, not by the modeller. Predicting whether a human being will lose a job, get ill, divorce or simply choose to stop paying, from data captured on an application form months or years earlier, has a genuine ceiling far below tasks where the outcome is mechanically determined by the inputs.</p>\n<p>A retail application scorecard operating at Gini 0.38 that is stable, calibrated and explainable is a working credit tool. A model at Gini 0.90 on the same data would be evidence of leakage, and the first response should be to look for the outcome field that crept into the inputs.</p>\n<p>It is a believable mistake because accuracy figures from image and text classification are the ones most people meet first, and those tasks have almost no irreducible noise.</p>\n<div class=\"note\">The right comparison is never a benchmark from another field. It is the model this one replaces, and the decision it will be used to make.</div>"
},
{
"l": "TRAP",
"t": "Holdout gains",
"h": "Better out of time means the model <em>improved</em>",
"b": "<p>The final model scores Gini 0.3845 on the 2014 holdout against 0.3678 on the development sample. Performance went <em>up</em> on data the model never saw, which contradicts the usual expectation that holdout figures are lower.</p>\n<p>The wrong reading is that the model generalises unusually well. Models do not gain discriminatory power by being applied to new data. Something about the holdout sample is different, and the honest position is to say which explanations are candidates and which have been tested.</p>\n<div class=\"sheet q\"><div class=\"h\">Candidate explanations &mdash; none confirmed on this build</div>\n<div class=\"r\"><b>Truncation</b><span>67.3% of the 2014 vintage was still current when observed, so only early defaults are visible. Early defaults concentrate in the worst grades, which sharpens measured ranking</span></div>\n<div class=\"r\"><b>Population mix</b><span>A different distribution of grades and products in 2014 than in 2007&ndash;2013</span></div>\n<div class=\"r\"><b>Underwriting change</b><span>Tightened policy removing borderline cases that are hardest to rank</span></div>\n</div>\n<p><strong>The truncation explanation is the most plausible and it has not been tested here.</strong> Testing it means recomputing discrimination on the 2013 vintage at the same observation age as 2014 and seeing whether the same lift appears. Until that is done it is a hypothesis, and stating it as a finding would be an overclaim.</p>\n<p>Two other things are true regardless. It holds only for the final model &mdash; Model A fell from 0.3013 to 0.2715 on the same comparison. And ranking held out of time while calibration did not, which is Mission 08.</p>"
},
{
"l": "RECALL",
"t": "Mission 07",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Ranking and level are separate failures with separate tools. <strong>ROC-based measures are blind to level.</strong></li>\n<li>AUROC is the probability a random bad ranks riskier than a random good; <strong>Gini = 2 &times; AUROC &minus; 1</strong>.</li>\n<li>KS is the widest gap between the cumulative bad and good distributions, and it names the best cut-off.</li>\n<li>Final model out of time: <strong>AUROC 0.692, Gini 0.385, KS 0.284</strong> &mdash; ordinary and sound for unsecured application scoring.</li>\n<li>Holdout beating development is a signal to investigate, most likely truncation, and it should be labelled a hypothesis until tested.</li>\n</ul>"
}
],

{
"title": "Proving the level",
"stage": "Validation",
"line": "Whether predicted probabilities match observed rates, why the standard test fails on a large sample, and the two ways a mis-levelled model gets fixed without refitting.",
"bullets": [
"Distinguish calibration from discrimination and say which downstream uses need which",
"Compute a Brier score and read a Hosmer-Lemeshow decile table",
"Explain why a chi-square test rejects on a quarter of a million rows",
"Apply intercept recalibration and Platt scaling, and say what each preserves"
],
"cards": [
{
"l": "ORIENT",
"t": "Level",
"h": "Right order, <em>wrong</em> numbers",
"b": "<p><span class=\"k\">Calibration</span> asks whether the predicted probability is right in absolute terms. Take every loan the model scored at 2%, and check whether about 2% of them defaulted. Repeat across the range.</p>\n<p>A model can rank perfectly and be badly calibrated. Add a constant to every log-odds and the ordering is untouched while every probability shifts. Discrimination will not notice; a provision computed from those probabilities will be wrong by the size of the shift multiplied by the whole book.</p>\n<div class=\"dt\"><table>\n<tr><th>Downstream use</th><th>Needs ranking</th><th>Needs level</th></tr>\n<tr><td>Approve / decline cut-off</td><td class=\"n\">Yes</td><td class=\"g\">No</td></tr>\n<tr><td>Ordering an underwriting referral queue</td><td class=\"n\">Yes</td><td class=\"g\">No</td></tr>\n<tr class=\"hi\"><td>Risk-based pricing</td><td class=\"n\">Yes</td><td class=\"n\">Yes</td></tr>\n<tr class=\"hi\"><td>Expected credit loss provision</td><td class=\"n\">Yes</td><td class=\"n\">Yes</td></tr>\n<tr class=\"hi\"><td>Regulatory capital</td><td class=\"n\">Yes</td><td class=\"n\">Yes</td></tr>\n</table></div>\n<p>The three rows that need both are the three where the probability gets multiplied by money.</p>"
},
{
"l": "FORMULA",
"t": "Brier score",
"h": "One number for <em>total</em> prediction error",
"b": "<div class=\"fx\"><div class=\"cap\">Brier score across N predictions</div>\n<div class=\"eq\"><em>BS</em> = <span class=\"fr\"><i>1</i><i>N</i></span> &Sigma;<sub>i</sub> ( <em>p</em><sub>i</sub> &minus; <em>y</em><sub>i</sub> )<sup>2</sup></div>\n<div class=\"wh\">N&nbsp;&nbsp;number of loans scored<br>\np<sub>i</sub>&nbsp;&nbsp;predicted probability of default for loan i<br>\ny<sub>i</sub>&nbsp;&nbsp;actual outcome for loan i, 0 or 1<br>\nBS&nbsp;mean squared error of the probabilities. Lower is better; 0 is perfect</div></div>\n<p>Brier mixes both failures into one figure &mdash; it rewards ranking and level together &mdash; which makes it useful for comparing two models and useless for diagnosing which of the two problems a single model has.</p>\n<p>It also has a floor that depends on the event rate. On a book with a 3.4% default rate, predicting 0.034 for every loan gives a Brier score of about 0.0329 with no model at all. <strong>A Brier score is only meaningful against that constant-prediction baseline</strong>, never on its own.</p>"
},
{
"l": "MECHANISM",
"t": "Hosmer-Lemeshow",
"h": "Deciles, expected against <em>observed</em>",
"b": "<p>The standard calibration test bins the population by predicted probability and compares what the model expected with what happened.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. Sort and cut</b>Order all loans by predicted probability and cut into ten equal-sized groups.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2. Expected</b>In each group, sum the predicted probabilities. That is the number of defaults the model expects there.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3. Observed</b>Count the defaults that actually occurred in that group.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>4. Accumulate</b>Sum a squared standardised difference across the ten groups and compare to a chi-square distribution.</div>\n</div>\n<p>The null hypothesis is that the model is well calibrated. A <strong>large p-value means no evidence of mis-calibration</strong> and a small one means the differences are larger than chance would produce. The direction is the opposite of most tests people meet: here, failing to reject is the good outcome.</p>\n<div class=\"note\">The decile table itself is more informative than the p-value it produces, because it shows <em>where</em> the model is off &mdash; over-predicting at the safe end, under-predicting in the tail, or drifting uniformly.</div>"
},
{
"l": "FORMULA",
"t": "The statistic",
"h": "Why sample size is <em>inside</em> the test",
"b": "<div class=\"fx\"><div class=\"cap\">Hosmer-Lemeshow statistic across g groups</div>\n<div class=\"eq\"><em>H</em> = &Sigma;<sub>k=1</sub><sup>g</sup> <span class=\"fr\"><i>( O<sub>k</sub> &minus; E<sub>k</sub> )<sup>2</sup></i><i>E<sub>k</sub> ( 1 &minus; E<sub>k</sub> / n<sub>k</sub> )</i></span></div>\n<div class=\"wh\">g&nbsp;&nbsp;number of groups, conventionally 10<br>\nO<sub>k</sub>&nbsp;observed defaults in group k<br>\nE<sub>k</sub>&nbsp;expected defaults in group k &mdash; the sum of predicted probabilities there<br>\nn<sub>k</sub>&nbsp;number of loans in group k<br>\nH&nbsp;&nbsp;compared against a chi-square distribution with g &minus; 2 degrees of freedom</div></div>\n<p>The mechanism that matters sits in the denominator. Both O<sub>k</sub> and E<sub>k</sub> scale with group size, so the squared numerator scales with the square of group size while the denominator scales only linearly. <strong>H therefore grows roughly in proportion to sample size for any fixed percentage error.</strong></p>\n<p>A model that over-predicts by a relative 3% will pass comfortably on 5,000 loans and be rejected decisively on 235,000. Neither result says the model changed. The test is answering \"is the deviation distinguishable from zero\", and on a large enough sample every deviation is.</p>"
},
{
"l": "WORKED",
"t": "The results",
"h": "Twelve p-values, and what they <em>actually</em> say",
"b": "<div class=\"dt\"><table>\n<tr><th>Sample</th><th>Model A</th><th>Model B (final)</th><th>Rows</th></tr>\n<tr><td>Train</td><td class=\"n\">0.00115</td><td class=\"n\">0.00040</td><td class=\"g\">184,525</td></tr>\n<tr class=\"hi\"><td>Test</td><td class=\"n\">0.23634</td><td class=\"n\">0.49418</td><td class=\"g\">46,132</td></tr>\n<tr><td>Out-of-time</td><td class=\"n\">0.00000031</td><td class=\"n\">0.00117</td><td class=\"g\">235,628</td></tr>\n</table></div>\n<p>The honest sentence, and the one that should be written wherever this model is described: <strong>the final model passes Hosmer-Lemeshow on test at p = 0.494 and fails on train at p = 0.0004 and out of time at p = 0.0012.</strong> Never \"calibration passed\" unqualified &mdash; that is true on one partition out of three.</p>\n<p>The pattern across the row is the interesting part. The only sample it passes is the smallest, at 46,132 rows. The two it fails are the two largest, at 184,525 and 235,628. That is precisely the sample-size behaviour the formula predicts, and it is visible without any additional analysis.</p>\n<p>Reading across the three, the same model appears well calibrated and badly calibrated depending only on how many rows were fed to the test. <strong>That is a fact about the test, and it is the reason a decile table should always be produced alongside the p-value.</strong></p>"
},
{
"l": "TRAP",
"t": "Reading a p-value",
"h": "p = 0.001 means the model is <em>broken</em>",
"b": "<p>The belief: the test rejected, so the model's probabilities cannot be used.</p>\n<p>The test rejected the hypothesis of perfect calibration. It said nothing about the size of the miscalibration, and on 235,628 rows a deviation far too small to matter commercially will reject.</p>\n<p>What to look at instead, in order:</p>\n<div class=\"sheet g\"><div class=\"h\">Diagnosing calibration properly</div>\n<div class=\"r\"><b>Mean predicted vs observed rate</b><span>Aggregate bias, in percentage points. The number that actually moves a provision</span></div>\n<div class=\"r\"><b>The decile table</b><span>Where the error is, and whether it is uniform or concentrated</span></div>\n<div class=\"r\"><b>Ratio of predicted to observed by grade</b><span>Whether one band drives the whole result</span></div>\n<div class=\"r\"><b>Then the p-value</b><span>As one input among four, read alongside the sample size</span></div>\n</div>\n<p>The opposite error is just as common: quoting a pass on a small sample as evidence of good calibration. On 5,000 rows the test will fail to reject almost anything, and a pass there is close to uninformative.</p>\n<div class=\"note\">This is not a peculiarity of Hosmer-Lemeshow. Every chi-square goodness-of-fit test behaves this way, and the effect appears wherever a bank runs a statistical test on a full portfolio rather than a sample.</div>"
},
{
"l": "MECHANISM",
"t": "Intercept recalibration",
"h": "Moving the level without touching the <em>ranking</em>",
"b": "<p>When ranking is sound and level has drifted, the fix is to shift the whole score distribution rather than refit the model.</p>\n<div class=\"fx\"><div class=\"cap\">Intercept adjustment</div>\n<div class=\"eq\">ln <span class=\"fr\"><i>PD'</i><i>1 &minus; PD'</i></span> = ( <em>&alpha;</em> + <em>&delta;</em> ) + &Sigma;<em>&beta;</em><sub>j</sub><em>x</em><sub>j</sub></div>\n<div class=\"wh\">PD'&nbsp;the recalibrated probability<br>\n&alpha;&nbsp;&nbsp;the original intercept<br>\n&delta;&nbsp;&nbsp;a single constant, chosen so that mean predicted PD equals the observed default rate on the new sample<br>\n&beta;<sub>j</sub>, x<sub>j</sub>&nbsp;unchanged &mdash; every coefficient and every input stays exactly as fitted</div></div>\n<p>Because &delta; is added to every loan's log-odds equally, <strong>the ordering of loans is mathematically unchanged</strong>. AUROC, Gini and KS are identical before and after, to the last decimal. Only the level moves.</p>\n<p>This is why it is standard practice rather than a compromise. A scorecard that has kept its discrimination but drifted in level is the ordinary state of a model a year after development, and it is the reason recalibration exists as a scheduled activity separate from redevelopment.</p>"
},
{
"l": "MECHANISM",
"t": "Platt scaling",
"h": "When the drift is not <em>uniform</em>",
"b": "<p>An intercept shift assumes the model is off by the same amount everywhere. When it over-predicts in the tail and under-predicts at the safe end, one constant cannot fix both.</p>\n<div class=\"fx\"><div class=\"cap\">Platt scaling &mdash; a two-parameter fit on the score</div>\n<div class=\"eq\"><em>PD'</em> = <span class=\"fr\"><i>1</i><i>1 + e<sup>&minus;(A&middot;z + B)</sup></i></span></div>\n<div class=\"wh\">z&nbsp;&nbsp;the original model's log-odds output for the loan<br>\nA&nbsp;&nbsp;a slope, fitted &mdash; stretches or compresses the spread of predictions<br>\nB&nbsp;&nbsp;an intercept, fitted &mdash; shifts the level<br>\nPD'&nbsp;the recalibrated probability<br>\nA and B are fitted by a second, one-variable logistic regression of actual outcomes on z</div></div>\n<p>With A fixed at 1 this reduces exactly to intercept recalibration, so the two methods are a family rather than alternatives. A fitted A below 1 means the original model's predictions were too spread out; above 1 means too compressed.</p>\n<p><strong>A changes ranking only if it is negative</strong>, which would invert the model and never happens on a working fit. For any positive A the ordering is preserved, so discrimination is again untouched.</p>\n<div class=\"note\">Both methods were implemented on this build and applied to the out-of-time sample. Neither rescued the Hosmer-Lemeshow p-value, which is the expected outcome: recalibration corrects the level, and on 235,628 rows the test rejects on residual shape regardless.</div>"
},
{
"l": "RECALL",
"t": "Mission 08",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Calibration is about level, discrimination is about order, and <strong>pricing, provisioning and capital all need both</strong>.</li>\n<li>Brier score mixes the two and is only readable against a constant-prediction baseline.</li>\n<li>Hosmer-Lemeshow bins by decile and compares expected to observed; <strong>a large p-value is the good outcome</strong>.</li>\n<li><strong>The statistic scales with sample size</strong>, so on 235,628 rows a commercially trivial deviation rejects. Final model: passes on test at 0.494, fails on train at 0.0004 and out of time at 0.0012.</li>\n<li>Intercept recalibration shifts level and provably preserves ranking; Platt scaling adds a slope for non-uniform drift.</li>\n</ul>"
}
],
"n": "08"
},
{
"title": "Proving it holds",
"stage": "Validation",
"line": "Whether the population the model meets today is the population it was built on, measured on the score and on every input, with thresholds that trigger named actions.",
"bullets": [
"Compute a population stability index from two distributions",
"Distinguish score-level from characteristic-level drift and say what each implies",
"Apply the conventional thresholds and name what each one triggers",
"Explain why a stable population is not evidence that a model still works"
],
"cards": [
{
"l": "ORIENT",
"t": "The third question",
"h": "The model did not change. The <em>book</em> did",
"b": "<p>Discrimination and calibration are measured against outcomes, which means waiting for outcomes. On a twelve-month window that is a twelve-month wait, and a model can do a year of damage in it.</p>\n<p>Stability monitoring needs no outcomes at all. It compares the distribution of scores and inputs today against the distribution at development. If the population has moved, the model is being applied outside the conditions it was fitted on, and that is knowable the day the applications arrive.</p>\n<div class=\"two\"><div><b>Population stability index</b>Measures drift in the <strong>score</strong> distribution. Answers: is the model seeing a different mix of risk than it was built on?</div>\n<div><b>Characteristic stability index</b>Same arithmetic applied to each <strong>input variable</strong> separately. Answers: which variable moved, and is it a real shift or a data feed that broke?</div></div>\n<div class=\"note\">This is the only one of the three validation checks that produces a warning before losses appear. That is what makes it the monitoring metric rather than the validation metric.</div>"
},
{
"l": "FORMULA",
"t": "PSI",
"h": "Distance between two <em>distributions</em>",
"b": "<div class=\"fx\"><div class=\"cap\">Population stability index across b bands</div>\n<div class=\"eq\"><em>PSI</em> = &Sigma;<sub>k=1</sub><sup>b</sup> ( <em>a</em><sub>k</sub> &minus; <em>e</em><sub>k</sub> ) &times; ln <span class=\"fr\"><i>a<sub>k</sub></i><i>e<sub>k</sub></i></span></div>\n<div class=\"wh\">b&nbsp;&nbsp;number of score bands, conventionally 10, fixed at development and never redrawn<br>\na<sub>k</sub>&nbsp;actual &mdash; share of the current population falling in band k<br>\ne<sub>k</sub>&nbsp;expected &mdash; share of the development population that fell in band k<br>\nln&nbsp;natural logarithm<br>\nBoth shares are proportions summing to 1, not counts</div></div>\n<p>The structure is identical to information value from Mission 04, with two populations in place of goods and bads. Each term is always positive, and PSI is zero only when the two distributions match exactly.</p>\n<p><strong>The bands must be the development bands.</strong> Recutting them on the current population makes the two distributions match by construction and the index reads near zero forever. This is the single most common way stability monitoring gets quietly disabled.</p>"
},
{
"l": "WORKED",
"t": "Score drift",
"h": "The number, and what it <em>rules out</em>",
"b": "<div class=\"wk\"><div class=\"h\">Score PSI, development sample against 2014 holdout</div>\n<div class=\"r\"><b>Model A</b><span>0.00464</span></div>\n<div class=\"r tot\"><b>Model B (final)</b><span>0.00709</span></div>\n<div class=\"r\"><b>Conventional \"investigate\" threshold</b><span>0.10</span></div>\n<div class=\"r tot\"><b>Distance below threshold</b><span>14&times;</span></div>\n</div>\n<p>0.007 is not merely inside tolerance, it is more than an order of magnitude inside it. The score distribution the model met in 2014 was, for practical purposes, the same distribution it was built on in 2007 to 2013.</p>\n<p>That single figure rules out a whole family of explanations for anything else observed. The calibration failure in Mission 08 cannot be attributed to the model meeting a different population, because it did not. Neither can the discrimination lift. Whatever is driving both, it is not population shift.</p>\n<div class=\"note\">A stability index is most valuable for what it eliminates. Publishing it early removes several candidate explanations from every later discussion.</div>"
},
{
"l": "MECHANISM",
"t": "CSI",
"h": "Same arithmetic, applied <em>variable by variable</em>",
"b": "<p>Characteristic stability index is PSI computed on one input variable's bins rather than on the score. Same formula, different bands. It is run on every variable in the card, every cycle.</p>\n<div class=\"dt\"><table>\n<tr><th>Variable</th><th>CSI</th><th>Reading</th></tr>\n<tr class=\"hi\"><td>dti &mdash; debt to income</td><td class=\"n\">0.0416</td><td class=\"g\">Largest mover, still far inside tolerance</td></tr>\n<tr><td>purpose</td><td class=\"n\">0.0362</td><td class=\"g\">Stable</td></tr>\n<tr><td>term</td><td class=\"n\">0.0258</td><td class=\"g\">Stable</td></tr>\n<tr><td>annual_inc</td><td class=\"n\">0.0057</td><td class=\"g\">Essentially unchanged</td></tr>\n</table></div>\n<p>Seventeen characteristics carry a reported CSI on this build and <strong>every one sits inside 0.10</strong>, with the largest at 0.042.</p>\n<p>Why both indices are needed: they fail differently and the difference is diagnostic. Two variables can drift in opposite directions and cancel, leaving PSI near zero while the population underneath has genuinely changed. And a single variable spiking while the score stays flat is the classic signature of a broken data feed &mdash; a field that stopped populating, a code list that changed, an upstream system that started sending nulls.</p>\n<div class=\"note\">Score PSI tells you whether to worry. Characteristic CSI tells you where to look. Neither substitutes for the other.</div>"
},
{
"l": "CHEAT",
"t": "Thresholds",
"h": "The numbers, and what each one <em>triggers</em>",
"b": "<div class=\"sheet\"><div class=\"h\">PSI and CSI, conventional action bands</div>\n<div class=\"r\"><b>Below 0.10</b><span>Stable. Log the value, take no action</span></div>\n<div class=\"r\"><b>0.10 to 0.25</b><span>Moderate shift. Investigate, document the cause, raise monitoring frequency</span></div>\n<div class=\"r\"><b>Above 0.25</b><span>Significant shift. Formal review; recalibration or redevelopment on the table</span></div>\n</div>\n<div class=\"sheet q\"><div class=\"h\">What a breach means before it means anything about the model</div>\n<div class=\"r\"><b>Check first</b><span>Data feed. A broken field produces a huge index and no real change</span></div>\n<div class=\"r\"><b>Then</b><span>Policy. A deliberate underwriting or pricing change shifts the population on purpose</span></div>\n<div class=\"r\"><b>Then</b><span>Market. New channel, new product, new geography, new segment</span></div>\n<div class=\"r\"><b>Only then</b><span>Genuine change in the risk profile of applicants</span></div>\n</div>\n<p><strong>0.10 and 0.25 are conventions with no single issuing authority</strong>, in wide use across credit and model risk practice. Institutions set their own and write them into policy. What matters far more than the exact number is that the threshold is fixed in advance and attached to a named action, because a threshold with no consequence attached is a number in a report that nobody reads.</p>"
},
{
"l": "TRAP",
"t": "Stability alone",
"h": "PSI is low, so the model still <em>works</em>",
"b": "<p>The belief: the population has not moved, therefore the model remains valid.</p>\n<p>Stability says the model is being applied to the population it was built for. It says nothing about whether the relationship between inputs and defaults has held. Those are different things and they fail independently.</p>\n<p>The same applicants, with the same score distribution, can default at twice the rate they used to &mdash; because unemployment rose, because collections capacity shrank, because a competitor's forbearance policy changed borrower behaviour. Every input distribution holds steady and every prediction is wrong.</p>\n<p>This build shows the pattern in miniature. Score PSI of 0.007 and every CSI under 0.042 say the population is stable. Hosmer-Lemeshow rejects on the same sample. <strong>Stable population, drifted calibration.</strong> Both readings are correct and neither would have been visible from the other.</p>\n<div class=\"note\">Stability is an early warning, not a validation. It arrives before outcomes and it is therefore worth less, not more.</div>"
},
{
"l": "RECALL",
"t": "Mission 09",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Stability is the only check that <strong>needs no outcomes</strong>, so it warns before losses appear.</li>\n<li><strong>PSI = &Sigma;(a<sub>k</sub> &minus; e<sub>k</sub>) &times; ln(a<sub>k</sub>/e<sub>k</sub>)</strong> on development bands, never recut.</li>\n<li>PSI watches the score, CSI watches each input; a spike in one variable with a flat score is usually a broken feed.</li>\n<li>0.10 and 0.25 are conventions, and their value comes from being attached to a named action.</li>\n<li>On this build: <strong>score PSI 0.007, every CSI inside 0.042</strong> &mdash; which eliminates population shift as an explanation for anything else observed.</li>\n</ul>"

{
"title": "Loss given default",
"stage": "Loss",
"line": "The second term of the loss equation: how much of the money is gone once a loan has failed, and why the shape of that distribution breaks the obvious model.",
"bullets": [

"cards": [
{
"l": "ORIENT",
"t": "The second term",
"h": "Default is not the <em>loss</em>",
"b": "<p>A defaulted loan is not a written-off loan. Money continues to arrive after default &mdash; late payments, settlements, collateral sales, collection agency remittances, court-ordered recovery &mdash; sometimes for years.</p>\n<p><span class=\"k\">Loss given default</span> is the share of the exposure that never comes back, expressed as a fraction between 0 and 1. It is the difference between knowing a loan failed and knowing what that failure cost.</p>\n<p>Two things make LGD harder to model than PD, and both come from the data rather than the mathematics. <strong>Only defaulted loans have an LGD</strong>, which shrinks the modelling sample from 466,285 to 50,968 here. And recovery takes time, so recent defaults have incomplete recovery histories and look better than they will turn out to be.</p>\n<div class=\"note\">LGD is where secured and unsecured lending part company. PD models for a mortgage and a personal loan look similar. Their LGD models do not, because one has a house behind it.</div>"
},
{
"l": "FORMULA",
"t": "Definition",
"h": "Recovery rate and its <em>complement</em>",
"b": "<div class=\"fx\"><div class=\"cap\">Loss given default for a defaulted exposure</div>\n<div class=\"eq\"><em>LGD</em> = 1 &minus; <em>RR</em> &nbsp;&nbsp;where&nbsp;&nbsp; <em>RR</em> = <span class=\"fr\"><i>recoveries received after default, discounted</i><i>exposure at the moment of default</i></span></div>\n<div class=\"wh\">LGD&nbsp;loss given default, a share between 0 and 1<br>\nRR&nbsp;&nbsp;recovery rate &mdash; the share of the defaulted exposure that came back<br>\nrecoveries&nbsp;all cash received after the default event, net of collection costs<br>\ndiscounted&nbsp;brought back to the default date at an appropriate rate, because money recovered in year three is worth less than money recovered in month one</div></div>\n<p>Three modelling choices hide inside that definition, and two portfolios with identical cash flows can report different LGD depending on them: whether collection costs are netted off, what discount rate is used, and how long a workout is followed before the case is closed and the remaining balance declared lost.</p>\n<p><strong>Any LGD figure is only comparable to another built on the same three choices.</strong> This is the LGD equivalent of asking which default definition produced a default rate.</p>"
},
{
"l": "NUMBERS",
"t": "The distribution",
"h": "Recovery on unsecured consumer debt <em>piles up</em>",
"b": "<div class=\"dt\"><table>\n<tr><th>Quantity</th><th>Value</th><th>Note</th></tr>\n<tr><td>Defaulted loans in the LGD sample</td><td class=\"n\">50,968</td><td class=\"g\">Split 40,774 train / 10,194 test</td></tr>\n<tr class=\"hi\"><td>Mean LGD</td><td class=\"n\">93.01%</td><td class=\"g\">Roughly 93 cents in every dollar owed is lost</td></tr>\n<tr class=\"hi\"><td>Median LGD</td><td class=\"n\">100%</td><td class=\"g\">The typical defaulted loan returns nothing at all</td></tr>\n<tr><td>Standard deviation</td><td class=\"n\">11.04%</td><td class=\"g\">Tightly bunched near the top</td></tr>\n<tr><td>Share at total loss (LGD = 1)</td><td class=\"n\">52.18%</td><td class=\"g\">Over half return nothing</td></tr>\n<tr><td>Share at zero loss (LGD = 0)</td><td class=\"n\">0.35%</td><td class=\"g\">Full recovery is almost unheard of</td></tr>\n<tr><td>Share with any recovery at all</td><td class=\"n\">47.82%</td><td class=\"g\">And most of those recover very little</td></tr>\n<tr><td>Mean recovery rate</td><td class=\"n\">6.99%</td><td class=\"g\">Median recovery rate is 0%</td></tr>\n</table></div>\n<p>A mean of 93% with a median of 100% is the signature of a distribution crushed against its upper boundary. Roughly half the population sits exactly at 1, and the rest is spread thinly below it.</p>\n<p>This is not an anomaly of this dataset. It is what unsecured consumer lending looks like everywhere: there is no asset to sell, the borrower is usually insolvent, and collection on a small balance costs more than it returns.</p>"
},
{
"l": "TRAP",
"t": "The obvious model",
"h": "Fit a regression to the <em>recovery rate</em>",
"b": "<p>The belief: recovery rate is a continuous number between 0 and 1, so regress it on borrower and loan attributes.</p>\n<p>It fails on this shape for three separate reasons, each sufficient on its own.</p>\n<div class=\"three\"><div><b>The residuals cannot be normal</b>With 52% of observations at exactly one value, no error distribution assumed by ordinary regression can describe what is there.</div>\n<div><b>Predictions leave the range</b>A linear fit on a variable bounded at 0 and 1 will predict below 0 and above 1 for some inputs. Clipping hides the symptom and keeps the cause.</div>\n<div><b>Two processes get averaged into one</b>Whether any money comes back and how much comes back are driven by different things &mdash; the first by borrower circumstances and collections policy, the second by balance size and workout route. Averaging them produces a model that describes neither.</div></div>\n<p>It is a believable mistake because the fit runs without error and returns a plausible-looking coefficient table. Nothing announces the problem; it shows up only when the residuals are plotted, which is a step easy to skip.</p>\n<div class=\"note\">Whenever a bounded target has a large point mass at a boundary, the first question is whether one process or two produced it.</div>"
},
{
"l": "MECHANISM",
"t": "The hurdle",
"h": "Two models, asked <em>two</em> questions",
"b": "<p>The two-stage hurdle model splits the problem along the line the data itself suggests.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Stage 1 &mdash; did anything come back?</b>A logistic regression on a binary target: was there any post-default recovery at all. On this sample, 47.82% of defaults answer yes. The output is a probability.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Stage 2 &mdash; given something came back, how much?</b>A gradient boosting regressor fitted <strong>only on the loans with positive recovery</strong>, predicting the recovery rate conditional on there being one. The point mass at zero is not in this sample, so the target is well behaved.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Combine</b>Multiply the probability by the conditional magnitude to get expected recovery, and subtract from 1.</div>\n</div>\n<p>The choice of a different technique at each stage is deliberate. Stage 1 wants a calibrated probability and an explainable structure, which is logistic regression's strength. Stage 2 wants to capture interactions in recovery magnitude and does not need to produce a probability, so a tree ensemble is appropriate.</p>\n<p>Stage 1 discrimination on this build was an area under the curve of about 0.64 &mdash; modest, and honest for the problem. Whether a given defaulted borrower pays anything back is genuinely hard to predict from origination data.</p>"
},
{
"l": "FORMULA",
"t": "Combining",
"h": "Two outputs into <em>one</em> LGD",
"b": "<div class=\"fx\"><div class=\"cap\">Expected LGD from the two stages</div>\n<div class=\"eq\"><em>LGD</em> = 1 &minus; ( <em>P</em>(recovery) &times; <em>RR</em><sub>positive</sub> )</div>\n<div class=\"wh\">P(recovery)&nbsp;stage 1 output &mdash; probability that any recovery occurs, between 0 and 1<br>\nRR<sub>positive</sub>&nbsp;stage 2 output &mdash; expected recovery rate given that recovery occurs<br>\nThe product is the unconditional expected recovery rate, which is what LGD subtracts from 1</div></div>\n<div class=\"wk\"><div class=\"h\">A defaulted loan through both stages</div>\n<div class=\"r\"><b>Stage 1: probability of any recovery</b><span>0.48</span></div>\n<div class=\"r\"><b>Stage 2: recovery rate if recovery occurs</b><span>14.6%</span></div>\n<div class=\"r tot\"><b>Expected recovery = 0.48 &times; 0.146</b><span>7.0%</span></div>\n<div class=\"r tot\"><b>LGD = 1 &minus; 0.070</b><span>93.0%</span></div>\n</div>\n<p>The structure guarantees the output stays in range. A probability between 0 and 1 multiplied by a rate between 0 and 1 cannot exceed 1, so LGD cannot go negative and cannot exceed 100% &mdash; without any clipping.</p>\n<p>It also produces the right kind of prediction for a loan with no recovery. Rather than predicting exactly zero recovery, it predicts a small expected recovery reflecting the probability that some might arrive, which is what an expectation should do.</p>"
},
{
"l": "WORKED",
"t": "Calibration",
"h": "Predicted against actual, by <em>decile</em>",
"b": "<p>The model is checked by sorting the held-out defaults by predicted LGD, cutting into ten equal groups, and comparing the group mean prediction with the group mean outcome.</p>\n<div class=\"dt\"><table>\n<tr><th>Decile</th><th>Loans</th><th>Predicted LGD</th><th>Actual LGD</th><th>Absolute error</th></tr>\n<tr class=\"hi\"><td>1 (lowest)</td><td class=\"n\">1,020</td><td class=\"n\">0.9065</td><td class=\"n\">0.9148</td><td class=\"n\">0.0082</td></tr>\n<tr><td>2</td><td class=\"n\">1,019</td><td class=\"n\">0.9178</td><td class=\"n\">0.9177</td><td class=\"n\">0.0001</td></tr>\n<tr><td>4</td><td class=\"n\">1,020</td><td class=\"n\">0.9262</td><td class=\"n\">0.9248</td><td class=\"n\">0.0014</td></tr>\n<tr><td>5</td><td class=\"n\">1,019</td><td class=\"n\">0.9294</td><td class=\"n\">0.9244</td><td class=\"n\">0.0049</td></tr>\n<tr><td>7</td><td class=\"n\">1,020</td><td class=\"n\">0.9354</td><td class=\"n\">0.9313</td><td class=\"n\">0.0041</td></tr>\n<tr><td>9</td><td class=\"n\">1,019</td><td class=\"n\">0.9429</td><td class=\"n\">0.9437</td><td class=\"n\">0.0008</td></tr>\n<tr class=\"hi\"><td>10 (highest)</td><td class=\"n\">1,020</td><td class=\"n\">0.9498</td><td class=\"n\">0.9524</td><td class=\"n\">0.0026</td></tr>\n</table></div>\n<p>Every decile is within half a percentage point, and the ordering is monotonic in both columns &mdash; predictions rise across deciles and so do outcomes.</p>\n<p><strong>The honest reading is that this is a well-calibrated model with a narrow job.</strong> Predicted LGD spans only 0.907 to 0.950, a range of four percentage points, because on this portfolio almost everything is a near-total loss. The model is accurate and it has very little to discriminate between. On a secured book, where LGD genuinely ranges from 5% to 90%, the same table would span most of the interval and the model would be doing far more work.</p>"
},
{
"l": "MECHANISM",
"t": "Downturn LGD",
"h": "The estimate for the year it goes <em>wrong</em>",
"b": "<p>An LGD fitted on historical averages is an average-conditions estimate. Prudential capital rules do not accept that, for a specific reason: defaults and recoveries are correlated. In a downturn more borrowers default <em>and</em> each default recovers less, because collateral values fall and collections capacity is stretched at exactly the moment volumes rise.</p>\n<p>A capital number built on average LGD therefore understates losses precisely when capital is needed. The requirement is to use a <span class=\"k\">downturn LGD</span> &mdash; an estimate appropriate to an economic downturn, not to the average of the cycle.</p>\n<div class=\"two\"><div><b>How it is estimated properly</b>Identify downturn periods in the recovery history and estimate LGD on those periods alone, or model recovery against macroeconomic drivers and evaluate at stressed values.</div>\n<div><b>How it is approximated</b>A supervisory add-on or a fixed uplift to the average estimate. Simple, transparent, and admittedly crude.</div></div>\n<p>This build takes the second route: a flat 8 percentage point add-on applied to modelled LGD, carried through the capital calculation as a stress comparison. The capital cost of that add-on is quantified in Mission 14.</p>\n<div class=\"note\">An 8 point add-on is an assumption, not an estimate. It is defensible as a stress comparison and it would not be defensible as a production downturn LGD without downturn-period evidence behind it.</div>"
},
{

"h": "What is now <em>owned</em>",
"b": "<ul>\n<li><strong>LGD = 1 &minus; recovery rate</strong>, and any figure depends on three choices: cost netting, discount rate, and workout length.</li>\n<li>Unsecured consumer recovery piles up at total loss: <strong>52.18% at LGD = 1, mean 93.01%, median 100%</strong>.</li>\n<li>A single regression on a target with a boundary point mass fails on residuals, on range, and on mixing two processes.</li>\n<li><strong>The hurdle splits it: P(any recovery) &times; expected recovery given recovery</strong>, and the structure keeps LGD in range without clipping.</li>\n<li>Decile calibration within 0.005 &mdash; accurate, over a narrow four-point range, because this portfolio has little LGD variation to explain.</li>\n<li>Downturn LGD exists because default frequency and recovery loss are correlated; an 8-point add-on is an assumption, labelled as one.</li>\n</ul>"
}

"cards": [
{
"l": "ORIENT",
"t": "The third term",
"h": "Not the amount <em>lent</em>",
"b": "<p>Expected loss multiplies by the amount owed at default, not the amount originally advanced. On a five-year loan that fails in year three, most of the principal has already been repaid, and using the original amount would overstate the loss by more than half.</p>\n<p>The exposure moves in both directions depending on the product, and that is the whole difficulty.</p>\n<div class=\"two\"><div><b>Term loan</b>Fixed amount, fixed schedule. Exposure only ever <strong>falls</strong> as principal is repaid. EAD is an observation, not a forecast.</div>\n<div><b>Revolving facility</b>Credit card, overdraft, working capital line. The borrower controls the balance up to a limit. Exposure can <strong>rise</strong> right up to default &mdash; and typically does, because a borrower in trouble draws down what remains.</div></div>\n<div class=\"note\">The behavioural fact that makes revolving EAD hard: borrowers approaching default use their remaining headroom. The exposure at default is systematically higher than the exposure a year earlier, and predicting how much higher is the entire problem.</div>"
},
{
"l": "FORMULA",
"t": "Term loan EAD",
"h": "Outstanding principal, and <em>nothing</em> else",
"b": "<div class=\"fx\"><div class=\"cap\">EAD on an amortising term loan with no undrawn commitment</div>\n<div class=\"eq\"><em>EAD</em> = max( <em>funded amount</em> &minus; <em>principal repaid</em>, 0 )</div>\n<div class=\"wh\">funded amount&nbsp;the principal originally advanced to the borrower<br>\nprincipal repaid&nbsp;cumulative principal received before default &mdash; interest is excluded, since interest was never lent<br>\nmax( &middot; , 0 )&nbsp;a floor at zero, guarding against data errors where recorded repayments exceed the advance</div></div>\n<p>The floor is not paranoia. On real extracts, rounding, reversed transactions and misposted recoveries all produce occasional rows where cumulative principal exceeds the advance. Without a floor those become negative exposures, which then subtract from the portfolio total and corrupt every aggregate silently.</p>\n<p>Note what is excluded. Accrued unpaid interest, fees and penalties are genuinely owed and are deliberately not in this EAD, because LGD here is estimated against principal. <strong>EAD and LGD must be defined on the same base or their product is meaningless.</strong></p>"
},
{
"l": "WORKED",
"t": "On this book",
"h": "What EAD looks like across <em>50,968</em> defaults",
"b": "<div class=\"wk\"><div class=\"h\">Exposure at default, defaulted loans</div>\n<div class=\"r\"><b>Mean EAD</b><span>10,781.56</span></div>\n<div class=\"r\"><b>Median EAD</b><span>9,141.37</span></div>\n<div class=\"r tot\"><b>Mean EAD as a share of amount funded</b><span>71.93%</span></div>\n<div class=\"r tot\"><b>Median EAD as a share of amount funded</b><span>76.94%</span></div>\n</div>\n<p>The typical defaulted loan had repaid about a quarter of its principal before failing. Using the funded amount instead of the outstanding balance would overstate expected loss on this book by roughly 39% &mdash; that is, 1 divided by 0.719.</p>\n<p>The ratio is also a statement about timing. A ratio near 1 would mean defaults cluster immediately after origination; near 0 would mean they cluster at maturity. At 0.72 they cluster early in the loan's life but not at the very start, which is exactly the seasoning shape Mission 12 draws.</p>\n<div class=\"note\">Mean above median on the ratio would indicate a tail of very early defaults. Here the median is higher than the mean, so the tail runs the other way: a minority of loans repaid substantially before failing.</div>"
},
{
"l": "DEFINE",
"t": "Undrawn commitment",
"h": "The money the borrower <em>has not taken yet</em>",
"b": "<p>An <span class=\"k\">undrawn commitment</span> is the difference between a credit limit granted and the balance currently used. A card with a 100,000 limit and a 30,000 balance carries a 70,000 undrawn commitment.</p>\n<p>It creates exposure that does not appear on the balance sheet today. The lender is contractually committed and cannot generally withdraw the limit fast enough to stop a distressed borrower drawing it.</p>\n<div class=\"sheet q\"><div class=\"h\">Why undrawn exposure is where the surprises live</div>\n<div class=\"r\"><b>Adverse selection</b><span>Healthy borrowers rarely max out. Distressed ones do</span></div>\n<div class=\"r\"><b>Timing</b><span>The drawdown happens in the months immediately before default, when the lender is least able to react</span></div>\n<div class=\"r\"><b>Invisibility</b><span>Today's balance sheet shows 30,000. Tomorrow's default may show 95,000</span></div>\n</div>\n<p>This is why capital rules treat off-balance-sheet commitments explicitly rather than ignoring them, and why the next card's factor exists at all.</p>"
},
{
"l": "FORMULA",
"t": "Credit conversion factor",
"h": "How much of the headroom gets <em>used</em>",
"b": "<div class=\"fx\"><div class=\"cap\">EAD on a revolving facility</div>\n<div class=\"eq\"><em>EAD</em> = <em>B</em> + <em>CCF</em> &times; ( <em>L</em> &minus; <em>B</em> )</div>\n<div class=\"wh\">B&nbsp;&nbsp;current drawn balance<br>\nL&nbsp;&nbsp;approved credit limit<br>\nL &minus; B&nbsp;the undrawn commitment<br>\nCCF&nbsp;credit conversion factor &mdash; the share of the undrawn amount expected to be drawn before default, between 0 and 1<br>\nSetting CCF = 0 assumes no further drawdown; CCF = 1 assumes the limit is fully used</div></div>\n<div class=\"wk\"><div class=\"h\">A card at 30% utilisation with a CCF of 0.43</div>\n<div class=\"r\"><b>Limit</b><span>100,000</span></div>\n<div class=\"r\"><b>Drawn balance</b><span>30,000</span></div>\n<div class=\"r\"><b>Undrawn commitment</b><span>70,000</span></div>\n<div class=\"r\"><b>Expected further drawdown = 0.43 &times; 70,000</b><span>30,100</span></div>\n<div class=\"r tot\"><b>EAD = 30,000 + 30,100</b><span>60,100</span></div>\n</div>\n<p>Exposure doubles relative to today's balance, and none of that increase is visible in current reporting. CCF is estimated from historical defaults by comparing the balance a year before default with the balance at default, relative to the headroom that existed at the start.</p>"
},
{
"l": "MECHANISM",
"t": "Simulated demonstration",
"h": "When the data <em>cannot</em> answer the question",
"b": "<p>Every loan in this book is a fixed-term instalment loan. The money was advanced once, in full, at origination. There is no limit, no headroom and no undrawn commitment anywhere in 466,285 rows.</p>\n<p>So no credit conversion factor can be estimated from this data. Not because the analysis is difficult, but because the phenomenon does not exist in it. Three responses were available:</p>\n<div class=\"three\"><div><b>Omit it</b>Honest, and leaves a gap in the pipeline where a real portfolio would need one.</div>\n<div><b>Estimate it anyway</b>Requires inventing headroom that is not there. Produces a number with no meaning attached.</div>\n<div><b>Demonstrate on simulated data</b>Build a synthetic revolving portfolio with known drawdown behaviour, run the estimation, and <strong>label every output as synthetic</strong>.</div></div>\n<p>The third was taken: a simulated 5,000-account revolving portfolio, with the resulting output file named to carry the word synthetic in its filename so the label cannot be separated from the number. The fitted mean CCF on that simulated portfolio was 0.429, with utilisation as the dominant driver &mdash; which is the expected direction, since an account already heavily used has less headroom left to draw.</p>\n<div class=\"note\">A demonstration on simulated data proves the method is implemented. It proves nothing about any real portfolio, and the labelling is what keeps those two claims apart.</div>"
},
{
"l": "TRAP",
"t": "Bounded targets",
"h": "Use ordinary regression for a quantity between <em>0 and 1</em>",
"b": "<p>The belief: CCF is a number between 0 and 1, so fit a linear regression to it, clip anything outside the range, and move on.</p>\n<p>Clipping treats the symptom. A linear model on a bounded target will place mass outside the boundary for exactly the accounts furthest from the mean, which are the high-utilisation and low-utilisation accounts &mdash; the two groups whose behaviour matters most. Clipping them to 0 or 1 replaces a wrong estimate with a different wrong estimate and destroys the information about how wrong it was.</p>\n<p>Realised CCF also has genuine mass at both ends: many accounts draw nothing further, and many draw the entire remaining limit. That is the same boundary point-mass structure as LGD in Mission 10, and it wants the same kind of answer.</p>\n<div class=\"sheet g\"><div class=\"h\">Appropriate specifications for a bounded target</div>\n<div class=\"r\"><b>Fractional logit</b><span>Models the mean of a proportion directly, respects [0,1] by construction</span></div>\n<div class=\"r\"><b>Beta regression</b><span>Assumes a beta-distributed target; needs handling for exact 0 and 1</span></div>\n<div class=\"r\"><b>Two-stage hurdle</b><span>The Mission 10 structure, applied to draw-or-not then how-much</span></div>\n</div>\n<p>It is a believable mistake because ordinary regression is the default tool and clipping looks like a reasonable guard rather than an admission that the specification is wrong.</p>"
},
{
"l": "RECALL",
"t": "Mission 11",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>EAD is what is owed at default, not what was lent. <strong>On this book the mean is 71.93% of the funded amount.</strong></li>\n<li>Term loan EAD is an observation: <strong>max(funded &minus; principal repaid, 0)</strong>, with the floor guarding against data errors.</li>\n<li>EAD and LGD must be defined on the same base &mdash; here, principal.</li>\n<li>Revolving EAD needs a conversion factor: <strong>EAD = B + CCF &times; (L &minus; B)</strong>, because distressed borrowers draw their headroom.</li>\n<li>When the phenomenon is absent from the data, a labelled simulation demonstrates the method and claims nothing about a real book.</li>\n<li>Bounded targets want fractional logit, beta regression or a hurdle &mdash; not a linear fit with clipping.</li>\n</ul>"

{
"l": "ORIENT",
"t": "Why lifetime",
"h": "Twelve months is not the <em>life</em> of the loan",
"b": "<p>The scorecard predicts default within twelve months. A 60-month loan has 48 further months of risk after that window closes, and two things need the whole of it.</p>\n<p>Accounting provisions require a lifetime expected credit loss for any exposure whose credit risk has increased significantly since origination &mdash; the subject of Mission 13. And risk-based pricing over a five-year term cannot be set from a one-year probability without understating the risk of the later years.</p>\n<p>The extension cannot be done by multiplication. Five times a twelve-month PD of 3.44% gives 17.2%, and the actual five-year figure on this book is 10.93%. Two effects break the arithmetic and both matter.</p>\n<div class=\"two\"><div><b>Survival</b>A loan can only default once. Each month, the pool of loans still able to default has shrunk. Multiplying ignores this and overcounts.</div>\n<div><b>Seasoning</b>Monthly default risk is not constant. It rises from origination, peaks, then falls away. Multiplying by an average ignores the shape entirely.</div></div>"
},
{
"l": "DEFINE",
"t": "Three quantities",
"h": "Hazard, survival, <em>cumulative</em>",
"b": "<p>Three related quantities, constantly confused, each answering a different question about the same curve.</p>\n<div class=\"sheet\"><div class=\"h\">The three, precisely</div>\n<div class=\"r\"><b>Hazard, h(t)</b><span>Given the loan reached month t alive, the chance it defaults <em>in</em> month t. A conditional rate</span></div>\n<div class=\"r\"><b>Survival, S(t)</b><span>The chance the loan reaches the end of month t without ever defaulting. Falls from 1, never rises</span></div>\n<div class=\"r\"><b>Cumulative PD, F(t)</b><span>The chance the loan has defaulted at some point by the end of month t. Equals 1 &minus; S(t)</span></div>\n</div>\n<p>The distinction that catches people: hazard is <strong>conditional on having survived</strong>. A hazard of 0.5% in month 40 does not mean 0.5% of the original book defaults in month 40. It means 0.5% of whatever is still alive at month 40 does.</p>\n<div class=\"note\">Cumulative PD is the quantity that plugs into a provision. Hazard is the quantity that gets estimated. Survival is how you get from one to the other.</div>"
},
{
"l": "FORMULA",
"t": "Hazard and survival",
"h": "From monthly counts to a <em>curve</em>",
"b": "<div class=\"fx\"><div class=\"cap\">Discrete-time hazard in month t</div>\n<div class=\"eq\"><em>h</em>(<em>t</em>) = <span class=\"fr\"><i>defaults occurring in month t</i><i>loans still at risk at the start of month t</i></span></div>\n<div class=\"wh\">at risk&nbsp;loans that have neither defaulted nor matured before month t<br>\nh(t)&nbsp;&nbsp;the conditional monthly default rate, between 0 and 1</div></div>\n<div class=\"fx\"><div class=\"cap\">Survival and cumulative PD from the hazards</div>\n<div class=\"eq\"><em>S</em>(<em>t</em>) = &Pi;<sub>u=1</sub><sup>t</sup> ( 1 &minus; <em>h</em>(<em>u</em>) ) &nbsp;&nbsp;&nbsp; <em>F</em>(<em>t</em>) = 1 &minus; <em>S</em>(<em>t</em>)</div>\n<div class=\"wh\">&Pi;<sub>u=1</sub><sup>t</sup>&nbsp;product over every month from 1 to t<br>\n1 &minus; h(u)&nbsp;chance of surviving month u given arrival at it<br>\nS(t)&nbsp;chance of surviving every month up to t<br>\nF(t)&nbsp;cumulative probability of default by end of month t</div></div>\n<p>Surviving to month t means surviving month 1 <em>and</em> month 2 <em>and</em> so on, so the survivals multiply. This is why cumulative PD cannot be a sum of monthly rates: the product of survivals is always larger than one minus the sum of hazards, and the gap widens as the hazards do.</p>"
},
{
