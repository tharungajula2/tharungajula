<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Building a Retail Credit Risk System &mdash; Field Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}

a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim)}
a:hover{color:var(--ink);border-color:var(--ink)}
.docs{margin:20px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--live);border-radius:7px;font-size:12.6px;line-height:1.9}
.docs b{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:6px;font-weight:500}
.docs a{display:block;border-bottom:none;color:var(--body)}
.docs a:hover{color:var(--accent)}
.docs a:before{content:'\2192\00a0';color:var(--live)}
.fx{margin:20px 0;padding:16px 15px;background:#0E0E12;border:1px solid var(--line);border-radius:9px;text-align:center;overflow-x:auto}
.fx .eq{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);line-height:2.1;white-space:nowrap}
.fx .eq em{font-style:italic;color:var(--accent);font-family:'Instrument Serif',serif;font-size:17px}
.fx .wh{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:left;line-height:1.8;font-family:'JetBrains Mono',monospace}
.fx .cap{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.wk{margin:20px 0;border:1px solid var(--accent-dim);border-radius:9px;overflow:hidden}
.wk .h{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.wk .r{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;background:var(--surface)}
.wk .r:last-child{border-bottom:none}
.wk .r b{flex:1;color:var(--body);font-weight:400}
.wk .r span{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.wk .r.tot{background:var(--raise)}
.wk .r.tot b{color:var(--ink);font-weight:600}
.wk .r.tot span{color:var(--ink)}

/* ---------- stacked fractions ---------- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px}
.fr>i{font-style:normal;display:block;padding:0 7px;line-height:1.4;white-space:nowrap}
.fr>i:first-child{border-bottom:1px solid var(--muted);padding-bottom:3px}
.fr>i:last-child{padding-top:3px}
.fx .eq{white-space:normal}
.fx .eq .nw{white-space:nowrap}
/* ---------- mobile ---------- */
.fx{-webkit-overflow-scrolling:touch}
@media(max-width:560px){
 .fx{text-align:left;padding:14px 12px}
 .fx .eq{font-size:12.5px;line-height:2}
 .fx .eq em{font-size:15px}
 .fx .cap{text-align:left}
 .fx .wh{font-size:10.5px;line-height:1.75}
 .fr>i{padding:0 5px}
 .wk .r{flex-wrap:wrap;gap:4px}
 .wk .r b{flex:1 1 100%}
 .wk .r span{flex:0 0 auto}
 .sheet .r{flex-direction:column;gap:3px}
 .sheet .r b{flex:none}
}
@media(max-width:430px){
 .fx{padding:12px 10px}
 .fx .eq{font-size:11.5px}
 .fx .eq em{font-size:14px}
}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "18 August 2026";
const P = {
"title": "Building a Retail <em>Credit Risk</em> System",
"sub": "From a raw loan table to a defended number: the target, the scorecard, the loss components, the provision, the capital charge, and the evidence for each.",
"edition": "Edition 01",
"floor": "No prior knowledge assumed",
"dateline": "Built",
"intro": "A working credit system is a chain: every number depends on one built before it. This pack follows that chain in dependency order on a real, public book of 466,285 consumer loans &mdash; defining default, fitting a scorecard, estimating loss and exposure, provisioning, holding capital, and proving each step to someone who did not build it. Every formula is worked with the actual figures, and every defect the build carries is stated where it arises rather than collected at the end.",
"missions": [
{
"title": "The one number a lender is trying to guess",
"stage": "Data",
"line": "What a loan book is, the equation that every credit system is a machine for computing, and the shape of the table everything else is built from.",
"bullets": [
"State the loss equation and name each of its three terms",
"Carry one loan through it in rupees or dollars and get a number",
"Say what \"default\" means and why it is a decision rather than a fact",
"Describe the raw table this pack works from, row count, column count and provenance"
],
"cards": [
{
"l": "ORIENT",
"t": "The question",
"h": "Lending is <em>guessing</em>, priced",
"b": "<p>A lender hands over money now for a promise of money later. The promise may not be kept. Everything called credit risk is machinery for answering one question before the money leaves: <span class=\"k\">if I lend this, how much do I expect to lose?</span></p>\n<p>Not <em>will I lose</em>. A single loan either pays or it does not, and no model tells you which. Across a hundred thousand loans the average is knowable, and the average is what a lender prices, provisions and holds capital against.</p>\n<p>Three quantities are needed. How likely is it to go bad. If it goes bad, how much of the money is gone for good. And how much is actually owed at the moment it goes bad, which is rarely the amount that was originally lent.</p>\n<div class=\"note\">Every model, table, ratio and regulation in this pack exists to estimate one of those three numbers, to check that the estimate is honest, or to decide what to do with the answer.</div>"
},
{
"l": "FORMULA",
"t": "The loss equation",
"h": "Three terms, and <em>everything</em> hangs off them",
"b": "<p>The three quantities multiply. This is the single most reused expression in credit and it is worth being able to write from memory.</p>\n<div class=\"fx\"><div class=\"cap\">Expected loss on one exposure</div>\n<div class=\"eq\"><em>EL</em> = <em>PD</em> &times; <em>LGD</em> &times; <em>EAD</em></div>\n<div class=\"wh\">EL&nbsp;&nbsp;expected loss, in currency &mdash; the average amount lost across many exposures like this one<br>\nPD&nbsp;&nbsp;probability of default, a number between 0 and 1, over a stated time horizon<br>\nLGD&nbsp;loss given default, the share of the owed amount not recovered after default, between 0 and 1<br>\nEAD&nbsp;exposure at default, the currency amount owed at the moment default happens</div></div>\n<p>Two things about this equation are easy to miss. <strong>PD is meaningless without a horizon.</strong> A 3% PD over twelve months and a 3% PD over the life of a five-year loan are different claims about the same borrower, and mixing them is a common and expensive error.</p>\n<p><strong>LGD is a share, not an amount.</strong> It answers \"of what was owed, what fraction never came back\", so it is multiplied by EAD rather than added to anything.</p>"
},
{
"l": "WORKED",
"t": "One loan",
"h": "The equation with <em>real</em> numbers in it",
"b": "<p>An unsecured personal loan. The borrower owes 10,000 at the point default would occur. The scorecard puts the twelve-month probability of default at 3.4%. History on similar defaulted loans says roughly 93 cents in every dollar owed is never recovered.</p>\n<div class=\"wk\"><div class=\"h\">Expected loss, twelve-month horizon</div>\n<div class=\"r\"><b>EAD &mdash; amount owed at default</b><span>10,000</span></div>\n<div class=\"r\"><b>PD &mdash; probability of default in 12 months</b><span>3.40%</span></div>\n<div class=\"r\"><b>LGD &mdash; share not recovered</b><span>93.0%</span></div>\n<div class=\"r tot\"><b>PD &times; LGD</b><span>3.162%</span></div>\n<div class=\"r tot\"><b>EL = 10,000 &times; 3.162%</b><span>316.20</span></div>\n</div>\n<p>316 is not what this loan will lose. This loan will lose either nothing or several thousand. 316 is what a thousand loans like it lose on average, each, and that is the number a lender can price into a rate and set aside against.</p>\n<p>Change one input and watch it move. Halve LGD to 46.5%, as secured lending against property might, and expected loss falls to 158. <strong>Collateral does not change who defaults. It changes what a default costs.</strong></p>"
},
{
"l": "DEFINE",
"t": "Default",
"h": "A definition someone <em>chose</em>, not a fact in the world",
"b": "<p>There is no moment at which a loan becomes objectively bad. There is a definition, written down, applied consistently. Change the definition and every PD, every provision and every capital number moves.</p>\n<p>The common regulatory anchor is <span class=\"k\">90 days past due</span> &mdash; an obligation unpaid for ninety days or more &mdash; or a judgement that the borrower is unlikely to pay in full without recourse to security. Either condition is enough.</p>\n<p>Accounting and lending systems carry their own words for the same territory, and they are not interchangeable:</p>\n<div class=\"sheet\"><div class=\"h\">Words that sound alike and are not</div>\n<div class=\"r\"><b>Delinquent</b><span>A payment is late. Says nothing yet about ninety days</span></div>\n<div class=\"r\"><b>Default</b><span>The defined threshold has been crossed. Usually 90+ days past due or unlikely-to-pay</span></div>\n<div class=\"r\"><b>Charged off</b><span>The lender has written the balance off its books. An accounting act, often later than default</span></div>\n<div class=\"r\"><b>Cured</b><span>An account that crossed a delinquency threshold and came back to current</span></div>\n</div>\n<div class=\"note\">The first question to ask of any default rate is which definition produced it. A book with a 90-day definition and a book with a 60-day definition are not comparable, and neither is the same book before and after a definition change.</div>"
},
{
"l": "MECHANISM",
"t": "The raw table",
"h": "What a lending book looks like <em>as data</em>",
"b": "<p>The book used throughout this pack is a public dataset of United States consumer unsecured term loans originated between 2007 and 2014, published by the marketplace lender that made them. It is open data, freely downloadable, and nothing in it is proprietary.</p>\n<div class=\"stat\"><div><b>466,285</b><span>Loans</span></div><div><b>75</b><span>Raw columns</span></div><div><b>2007&ndash;14</b><span>Origination vintages</span></div></div>\n<p>The columns fall into four families, and the families matter more than the individual names because every retail lending table in the world has the same four.</p>\n<div class=\"dt\"><table>\n<tr><th>Family</th><th>Examples</th><th>What it is for</th></tr>\n<tr><td>Loan terms</td><td class=\"g\">amount funded, interest rate, term in months, instalment</td><td class=\"g\">The contract. Known at origination</td></tr>\n<tr><td>Borrower attributes</td><td class=\"g\">annual income, employment length, home ownership, debt-to-income</td><td class=\"g\">Who is borrowing. Known at origination</td></tr>\n<tr><td>Credit bureau history</td><td class=\"g\">revolving utilisation, open accounts, inquiries in last 6 months, delinquencies</td><td class=\"g\">Past behaviour with other lenders</td></tr>\n<tr class=\"hi\"><td>Outcome fields</td><td class=\"n\">loan status, total principal received, recoveries, last payment date</td><td class=\"g\">What actually happened. <strong>Known only afterwards</strong></td></tr>\n</table></div>\n<p>That last row is the dangerous one. Outcome fields are what the target is built from, and they must never become inputs to the model. A field describing what happened cannot be used to predict what happened.</p>"
},
{
"l": "TRAP",
"t": "Wide tables",
"h": "More columns means more <em>signal</em>",
"b": "<p>The belief: 75 columns is a rich dataset, so a model built on it should be strong, and the job is mostly about choosing an algorithm.</p>\n<p>It is wrong here in a specific and measurable way. When all 49 usable candidate columns were binned and scored for predictive content on this book, <strong>26 of them carried effectively none</strong>, and 17 of those had only one bin &mdash; meaning the column held a single value or was empty for every row in the training sample.</p>\n<p>The reason is mundane and universal: fields get added to a lending platform over time. Columns introduced in 2015 are blank for every loan originated in 2011. They still appear in the extract. They still have a column name that sounds predictive.</p>\n<p>It is a believable mistake because nothing in the file says so. A column of nulls looks identical to a column that has not been examined yet, and a model-fitting library will happily accept both.</p>\n<div class=\"note\">The first pass over any lending extract is a count of distinct non-null values per column. It takes one line of code and it removes a third of the work.</div>"
},
{
"l": "PICTURE",
"t": "The pipeline",
"h": "Where this pack is <em>going</em>",
"b": "<div class=\"dg\"><div class=\"dg-t\">From raw table to defended number</div>\n<div class=\"lay\">\n<div><span>1</span>Raw table &rarr; define default &rarr; build the target column</div>\n<div><span>2</span>Cut samples: development, and a later period held back</div>\n<div><span>3</span>Transform columns into predictive form, screen for content</div>\n<div class=\"hot\"><span>4</span>Fit the PD model, scale it into a scorecard, band it into grades</div>\n<div><span>5</span>Prove it: rank ordering, level accuracy, stability over time</div>\n<div><span>6</span>Estimate LGD and EAD, extend PD across the life of the loan</div>\n<div><span>7</span>Provision under accounting rules, hold capital under prudential rules</div>\n<div><span>8</span>Monitor the live book and document everything</div>\n</div>\n<div class=\"cross\">Every layer is checkable by someone who did not build it. That is the actual product</div></div>\n<p>The order is not arbitrary and it is not the order a textbook uses. It is dependency order: nothing appears before the thing it needs. Provisioning needs lifetime PD, lifetime PD needs a twelve-month PD, a twelve-month PD needs a target, and a target needs a definition of default.</p>"
},
{
"l": "NUMBERS",
"t": "The book",
"h": "The figures this pack keeps <em>returning</em> to",
"b": "<div class=\"dt\"><table>\n<tr><th>Quantity</th><th>Value</th><th>Note</th></tr>\n<tr class=\"hi\"><td>Loans in the book</td><td class=\"n\">466,285</td><td class=\"g\">Raw rows, 75 columns</td></tr>\n<tr><td>Ever defaulted</td><td class=\"n\">50,968</td><td class=\"g\">10.93% of the book</td></tr>\n<tr><td>Defaulted within 12 months</td><td class=\"n\">16,018</td><td class=\"g\">3.44% &mdash; this is the modelling target</td></tr>\n<tr><td>Defaulted after 12 months</td><td class=\"n\">34,950</td><td class=\"g\">7.50% &mdash; real, but outside the window</td></tr>\n<tr><td>Never defaulted</td><td class=\"n\">415,317</td><td class=\"g\">89.07%</td></tr>\n</table></div>\n<p>Two default rates for one book, both correct, answering different questions. 10.93% is what the book eventually lost to default. 3.44% is what it lost in the first twelve months of each loan's life. The gap between them is not error &mdash; it is the shape of the loss over time, and Mission 12 is entirely about that shape.</p>"

{
"title": "Building the target",
"stage": "Data",
"line": "Turning a column of status text into a binary outcome, and dating an event in a table that never recorded when it happened.",
"bullets": [
"Convert loan status categories into a modelling target",
"Distinguish the ever-default target from the twelve-month target and say when each is right",
"Reconstruct default timing from payment and credit-pull dates",
"Reconcile a target back to the raw book so the counts can be checked"
],
"cards": [
{
"l": "ORIENT",
"t": "First decision",
"h": "Nothing can be modelled until <em>bad</em> has a column",
"b": "<p>A raw lending table has no column called <code>default</code>. It has a status field with text values, and those values encode a mixture of current state, historical outcome and administrative action. Turning that into a single column of 0 and 1 is the first real modelling decision, and it is made before any statistics happen.</p>\n<p>Two things get decided at once here, and conflating them is the classic error. <span class=\"k\">Which outcomes count as bad</span> is the default definition. <span class=\"k\">Over what period</span> is the performance window. They are independent choices and both must be stated.</p>\n<div class=\"note\">Every number produced downstream inherits both choices. A provision, a capital number and a scorecard cut-off are all downstream of a decision made in this mission.</div>"
},
{
"l": "MECHANISM",
"t": "Status to target",
"h": "Text categories into a <em>binary</em> column",
"b": "<p>The status field on this book carries values that group into three kinds. The grouping, not the individual labels, is what transfers to any other lending table.</p>\n<div class=\"dt\"><table>\n<tr><th>Kind</th><th>Status values of this type</th><th>Target</th></tr>\n<tr><td>Resolved good</td><td class=\"g\">Fully Paid</td><td class=\"n\">0</td></tr>\n<tr class=\"hi\"><td>Resolved bad</td><td class=\"g\">Charged Off, Default, Does not meet credit policy: Charged Off</td><td class=\"n\">1</td></tr>\n<tr><td>Still running</td><td class=\"g\">Current, In Grace Period, Late 16&ndash;30 days, Late 31&ndash;120 days</td><td class=\"n\">0 or excluded</td></tr>\n</table></div>\n<p>The third group is where judgement lives. A loan that is currently 31 to 120 days late has not yet met a 90-day default definition on the evidence in the file, but it is clearly not healthy. Coding it 0 understates bad. Excluding it shrinks the sample and biases it toward resolved cases.</p>\n<p>The choice made in this build is to treat unresolved accounts as non-default for the modelling target and to handle their deterioration separately, in the staging logic of Mission 13, where lateness gets its own treatment rather than being forced into a binary.</p>"
},
{
"l": "DEFINE",
"t": "Two targets",
"h": "Ever-default and <em>twelve-month</em> default",
"b": "<p>Two different binary columns can be built from the same status field, and both are used in this pack for different jobs.</p>\n<div class=\"two\"><div><b>Ever default</b>The loan defaulted at any point in its life. On this book, 50,968 loans, 10.93%. Used for modelling <strong>loss given default</strong>, because that model only ever looks at loans that actually defaulted, and when they defaulted is irrelevant to how much was recovered.</div>\n<div><b>Default within 12 months</b>The loan defaulted within twelve months of origination. 16,018 loans, 3.44%. Used as the <strong>PD model target</strong>, because a scorecard must predict over a fixed horizon or its output cannot be compared across loans of different ages.</div></div>\n<p>The remaining 34,950 loans defaulted after month twelve. They are genuine defaults and they are coded 0 in the twelve-month target. That is correct, not a loss of information: the twelve-month model is answering \"will this go bad soon\", and a loan that survived three years before failing did not.</p>\n<div class=\"note\">Quoting the wrong one is the most common way a default rate gets misstated by a factor of three. On this book the two differ by exactly that.</div>"
},
{
"l": "MECHANISM",
"t": "Missing dates",
"h": "Dating an event the table <em>never recorded</em>",
"b": "<p>A twelve-month target needs to know <em>when</em> each default happened. This table has no default date column. It has the origination date, the last payment date, the date the lender last pulled a credit report, and the status text. The default date must be inferred.</p>\n<p>The rule used is a priority hierarchy, applied only to loans whose status is already classed as bad:</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. Last payment date</b>If a defaulted loan has a recorded last payment, that is the best available marker of when the borrower stopped paying.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2. Last credit pull date</b>If no last payment exists, fall back to the last time the lender checked the borrower's credit file, which brackets the period the account was still being managed.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3. Clamp at zero</b>Compute elapsed months from origination to the inferred date. Where arithmetic produces a negative value, set it to zero rather than dropping the record.</div>\n</div>\n<p>The alternative was to drop defaulted loans with no payment date, which removes exactly the worst accounts &mdash; those that never made a single payment. Dropping them would flatter every metric that follows.</p>\n<p>The cost is stated openly in Mission 12: the inference method cannot place a default in months 2 and 3, so the hazard curve shows zero there. That is an artefact of this rule, visible in the output, and it is better to know why a hole exists than to have no hole and no explanation.</p>"
},
{
"l": "WORKED",
"t": "Reconciliation",
"h": "Proving the target <em>adds up</em>",
"b": "<p>After building any target, the counts get reconciled back to the raw row count. If they do not sum, something was silently dropped or double-counted, and every number downstream is wrong by an unknown amount.</p>\n<div class=\"wk\"><div class=\"h\">Target reconciliation, full book</div>\n<div class=\"r\"><b>Total loans loaded</b><span>466,285</span></div>\n<div class=\"r\"><b>Non-default</b><span>415,317</span></div>\n<div class=\"r\"><b>Ever default</b><span>50,968</span></div>\n<div class=\"r tot\"><b>415,317 + 50,968</b><span>466,285</span></div>\n<div class=\"r\"><b>&mdash; of which default within 12 months</b><span>16,018</span></div>\n<div class=\"r\"><b>&mdash; of which default after 12 months</b><span>34,950</span></div>\n<div class=\"r tot\"><b>16,018 + 34,950</b><span>50,968</span></div>\n</div>\n<p>Two identities, both closing exactly. Row count preserved through cleaning: 466,285 in, 466,285 out, with columns growing from 75 to 79 as the derived fields were added and no rows lost.</p>\n<div class=\"note\">This table is the cheapest audit artefact in the whole build and the one most often skipped. A reviewer who cannot reconcile the target will not trust anything that follows it.</div>"
},
{
"l": "TRAP",
"t": "Target choice",
"h": "Use ever-default &mdash; it has <em>more</em> bads",
"b": "<p>The belief: the twelve-month target has only 16,018 positives against 50,968 for ever-default, and rare-event modelling is hard, so use the bigger one and get a stronger model.</p>\n<p>It produces a model that cannot be used. A scorecard scores an application <em>at origination</em> and its output has to mean something specific: the chance this loan goes bad over a defined period. Train on ever-default and the output means \"the chance this loan goes bad at some point over a term that is 36 months for some loans and 60 for others\" &mdash; a quantity that is not comparable between two applicants sitting in the same queue.</p>\n<p>Worse, it silently mixes in the observation problem. A loan originated in 2014 has had eighteen months to fail; one from 2009 has had six years. Ever-default on a mixed-vintage book measures how long a loan has been observed as much as how risky it is.</p>\n<p>It is a believable mistake because the resulting model looks better on every metric. More positives, higher discrimination, no warning anywhere.</p>\n<div class=\"note\">Fix the horizon first, then accept whatever event rate that horizon gives you. A 3.44% event rate is entirely workable and the rest of this pack is built on one.</div>"
},
{
"l": "FORMULA",
"t": "The window",
"h": "What a <em>performance window</em> actually asserts",
"b": "<p>The target is a statement about a window, and writing it as an expression removes the ambiguity that plain English leaves in.</p>\n<div class=\"fx\"><div class=\"cap\">Twelve-month default indicator for loan i</div>\n<div class=\"eq\"><em>y</em><sub>i</sub> = 1 if <em>t</em><sub>def,i</sub> &minus; <em>t</em><sub>orig,i</sub> &le; 12, otherwise 0</div>\n<div class=\"wh\">y<sub>i</sub>&nbsp;&nbsp;the modelling target for loan i, 1 means bad<br>\nt<sub>def,i</sub>&nbsp;the inferred month in which loan i met the default definition<br>\nt<sub>orig,i</sub>&nbsp;the month loan i was originated<br>\n12&nbsp;&nbsp;the performance window in months, a choice, not a constant of nature</div></div>\n<p>Twelve months is the conventional retail window for three reasons. It matches the horizon prudential capital rules use for probability of default. It matches the twelve-month expected credit loss concept in accounting. And it is long enough for a bad loan to reveal itself but short enough that recent originations are usable.</p>\n<p>A loan originated too recently to have twelve months of observation cannot be scored on this target at all. That is a real constraint on this book and it returns in Mission 15 as truncation.</p>"
},
{
"l": "RECALL",
"t": "Mission 02",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Status text groups into resolved good, resolved bad, and still running &mdash; and the third group is where the judgement is.</li>\n<li><strong>Ever-default is for LGD modelling; twelve-month default is for PD modelling.</strong> 10.93% and 3.44% on the same book.</li>\n<li>Default timing can be reconstructed by priority hierarchy when no date column exists, and the artefacts that creates should be published, not hidden.</li>\n<li><strong>Every target gets reconciled back to the raw row count</strong> before anything else happens.</li>\n<li>A performance window is a choice; twelve months is conventional because capital and accounting both use it.</li>\n</ul>"
}
],
"n": "02"
},
{
"title": "Cutting the samples",
"stage": "Data",
"line": "Three samples doing three different jobs, why the third one is split by time rather than at random, and what leaks in a lending table.",
"bullets": [
"Name what train, test and out-of-time each prove",
"Split a lending book by vintage and say why random splitting overstates performance",
"Run the checks that show no record appears in two samples",
"Recognise the forms of leakage specific to loan data"
],
"cards": [
{
"l": "ORIENT",
"t": "Three jobs",
"h": "Three samples, three <em>different</em> questions",
"b": "<p>One dataset gets cut into pieces because three separate claims need supporting and no single piece can support all three.</p>\n<div class=\"dt\"><table>\n<tr><th>Sample</th><th>Question it answers</th><th>Used for</th></tr>\n<tr><td>Train</td><td class=\"g\">What relationship exists in the data?</td><td class=\"g\">Fitting coefficients. Nothing else</td></tr>\n<tr><td>Test</td><td class=\"g\">Does it hold on data the fit never saw?</td><td class=\"g\">Checking for overfitting</td></tr>\n<tr class=\"hi\"><td>Out-of-time</td><td class=\"g\">Does it hold on a <strong>later period</strong>?</td><td class=\"g\">Checking the model survives the passage of time</td></tr>\n</table></div>\n<p>Test and out-of-time are often treated as the same check. They are not. A test sample drawn at random from the same period proves the model is not memorising individual rows. An out-of-time sample drawn from a later period proves the model is not memorising a <em>moment</em> &mdash; a particular economy, a particular product mix, a particular underwriting policy.</p>\n<p>For a lending model the second is much the harder test, and it is the one that matters, because a model is always deployed on the future.</p>"
},
{
"l": "MECHANISM",
"t": "Splitting by time",
"h": "Vintage is the cut, <em>not</em> a random number",
"b": "<p>The book is split on origination year. Loans originated 2007 to 2013 form the development sample. Loans originated in 2014 are held out entirely and never touched during fitting.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Development, 2007&ndash;2013</b>230,657 loans. Everything the model is allowed to learn from.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Split 80/20, stratified on the target</b>184,525 train and 46,132 test, with the default rate held near-identical in both so neither piece is accidentally easier.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Out-of-time, 2014</b>235,628 loans. Scored once, at the end, with the model frozen.</div>\n</div>\n<p><span class=\"k\">Stratified</span> means the split preserves the proportion of the rare class rather than sampling rows blindly. With a 3.4% event rate, a careless random split can hand one piece noticeably more defaults than the other purely by chance, and the resulting difference in metrics gets misread as instability.</p>\n<div class=\"note\">The word for cutting by origination period is <strong>vintage</strong>. It recurs constantly: a vintage is a cohort of loans originated in the same period, tracked together for the rest of their lives.</div>"
},
{
"l": "WORKED",
"t": "The cut",
"h": "Three samples, and the check that they <em>match</em>",
"b": "<div class=\"wk\"><div class=\"h\">Sample summary</div>\n<div class=\"r\"><b>Train &mdash; rows</b><span>184,525</span></div>\n<div class=\"r\"><b>Train &mdash; 12m defaults</b><span>6,329</span></div>\n<div class=\"r tot\"><b>Train default rate</b><span>3.4299%</span></div>\n<div class=\"r\"><b>Test &mdash; rows</b><span>46,132</span></div>\n<div class=\"r\"><b>Test &mdash; 12m defaults</b><span>1,582</span></div>\n<div class=\"r tot\"><b>Test default rate</b><span>3.4293%</span></div>\n<div class=\"r\"><b>Out-of-time &mdash; rows</b><span>235,628</span></div>\n<div class=\"r\"><b>Out-of-time &mdash; 12m defaults</b><span>8,107</span></div>\n<div class=\"r tot\"><b>Out-of-time default rate</b><span>3.4406%</span></div>\n</div>\n<p>Train and test agree to the fourth decimal place, which is exactly what stratification is supposed to deliver and is worth printing as evidence that it worked.</p>\n<p>The out-of-time rate is 3.4406% against 3.4299% on train &mdash; eleven hundredths of a percentage point higher. <strong>The event rate barely moved between the development period and the later year.</strong> That single comparison is the first and cheapest stability check available, and it is done before any model exists.</p>"
},
{
"l": "TRAP",
"t": "Random splitting",
"h": "Shuffle the rows and take <em>80%</em>",
"b": "<p>The belief: a random 80/20 split is the standard way to hold out data, so apply it to the whole book and be done.</p>\n<p>On a lending table this inflates measured performance in a way that will not be caught until the model is live. Loans originated in the same month share an economy, an underwriting policy, a marketing campaign and a product mix. Randomly splitting puts siblings from the same month on both sides of the wall. The model learns the month and gets credited for learning risk.</p>\n<p>It is a believable mistake because random splitting is genuinely correct for data where rows are independent draws, which is most of what people learn on. A lending book is not that. It is a time series of cohorts wearing a table's clothing.</p>\n<p>The symptom is a model that tests beautifully and degrades immediately on deployment, with no diagnostic explaining why, because the diagnostic that would have caught it was never run.</p>\n<div class=\"note\">If a model will be used on future applicants, it must be validated on a period it did not see. Everything else is a rehearsal.</div>"
},
{
"l": "MECHANISM",
"t": "Leakage",
"h": "What leaks in a <em>loan</em> table",
"b": "<p><span class=\"k\">Leakage</span> is information about the outcome reaching the model through an input. In lending it has three recognisable shapes and all three are easy to commit.</p>\n<div class=\"three\"><div><b>Outcome fields</b>Total principal received, recoveries, last payment date, current status. All describe what happened after origination. Any of them in a model produces near-perfect discrimination and predicts nothing.</div>\n<div><b>Post-origination updates</b>Bureau fields refreshed after the loan was made. The column name is identical to the origination-time version; only the as-of date differs, and the as-of date is usually not in the file.</div>\n<div><b>Split contamination</b>The same loan appearing in more than one sample, usually through a merge that duplicated rows or an identifier that is not unique.</div></div>\n<p>The third is the only one with a mechanical check, and it should be run every time: confirm that the intersection of loan identifiers between every pair of samples is empty. On this build train, test and out-of-time were verified to share no identifier.</p>\n<p>The first two have no mechanical check. They are caught by reading the data dictionary and asking of every column: <strong>was this knowable on the day the loan was approved?</strong> If the answer is no or unclear, it does not go in.</p>"
},
{
"l": "TRAP",
"t": "Sample sizes",
"h": "The holdout is <em>larger</em> than the development sample",
"b": "<p>The out-of-time sample here is 235,628 loans against a development sample of 230,657. The holdout is bigger than the thing being held out from, which looks like an error and is not.</p>\n<p>The reason is growth. This lender originated more loans in 2014 alone than in the seven years 2007 to 2013 combined. Splitting a growing book by calendar time will routinely produce a small early sample and a large recent one.</p>\n<p>Two consequences follow and both matter later. First, statistical tests on the out-of-time sample are extremely powerful, which sounds good and turns out to cause a problem of its own in Mission 08. Second, the 2014 vintage has had far less time to season &mdash; most of those loans were still running when the data was cut &mdash; so their eventual outcomes are only partly observed. That is <span class=\"k\">truncation</span>, and it is picked up in Mission 15.</p>\n<div class=\"note\">A holdout sample is defined by <em>when</em>, not by <em>how many</em>. Resisting the urge to rebalance it is part of the discipline.</div>"
},
{
"l": "CHEAT",
"t": "Sample design",
"h": "The <em>checklist</em> before fitting anything",
"b": "<div class=\"sheet g\"><div class=\"h\">Should be true before a single coefficient is fitted</div>\n<div class=\"r\"><b>Target reconciled</b><span>Class counts sum to the raw row count</span></div>\n<div class=\"r\"><b>Split is by time</b><span>Holdout period is strictly later than development</span></div>\n<div class=\"r\"><b>Stratified within development</b><span>Train and test default rates match to 3 decimals</span></div>\n<div class=\"r\"><b>No identifier overlap</b><span>Pairwise intersection of loan IDs is empty</span></div>\n<div class=\"r\"><b>Date ranges printed</b><span>Each sample's first and last origination month recorded</span></div>\n<div class=\"r\"><b>Seeds fixed</b><span>Every random operation carries an explicit seed</span></div>\n<div class=\"r\"><b>Outcome fields quarantined</b><span>Listed explicitly and excluded from the candidate set</span></div>\n</div>\n<p>Fixed seeds deserve a line of their own. Without one, a rerun produces different splits, different coefficients and different metrics, and no reported number can be reproduced by anyone including its author. It costs one argument.</p>"
},
{
"l": "RECALL",
"t": "Mission 03",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Train fits, test detects overfitting, <strong>out-of-time detects the passage of time</strong> &mdash; and the third is the hard one.</li>\n<li>Lending books split by vintage, never at random, because rows in the same cohort are not independent.</li>\n<li>Stratification holds the rare-class rate steady across the split: 3.4299% and 3.4293% here.</li>\n<li>Leakage in lending comes from outcome fields, refreshed bureau data, and duplicated identifiers. <strong>Only the third has a mechanical check.</strong></li>\n<li>A holdout can legitimately be larger than the development sample when the book has grown.</li>\n</ul>"
}
],
"n": "03"
},
{
"title": "Weight of evidence",
"stage": "Model",
"line": "Why raw columns are not fed into a scorecard, the transformation that replaces them, and the number that decides which columns survive.",
"bullets": [
"Compute weight of evidence for a bin from four counts",
"Compute information value and read it against the conventional bands",
"Apply the binning rules that make a scorecard stable rather than merely accurate",
"Explain why a high information value can be a warning rather than a result"
],
"cards": [
{
"l": "ORIENT",
"t": "Why transform",
"h": "Raw columns are the <em>wrong shape</em> for a scorecard",
"b": "<p>A column such as annual income cannot be dropped into a credit model as it stands, for four reasons that apply to almost every column in a lending table.</p>\n<div class=\"dt\"><table>\n<tr><th>Problem</th><th>What it looks like</th></tr>\n<tr><td>Non-linear relationship</td><td class=\"g\">Risk falls steeply from 30k to 60k of income and barely at all from 200k to 400k. A straight line fits neither end</td></tr>\n<tr><td>Outliers</td><td class=\"g\">One declared income of 8,000,000 drags a coefficient on its own</td></tr>\n<tr><td>Missing values</td><td class=\"g\">A blank has no numeric value, but the fact of the blank is often informative</td></tr>\n<tr class=\"hi\"><td>Categories</td><td class=\"g\">Loan purpose has no numeric ordering at all, and one-hot encoding turns one column into fifteen</td></tr>\n</table></div>\n<p>The standard answer in credit is to stop using the raw value entirely. Every column, numeric or categorical, is cut into bins, and each bin is replaced by a single number describing how good or bad that bin is. That number is the <span class=\"k\">weight of evidence</span>.</p>\n<p>The transformation solves all four problems at once: shape becomes irrelevant because bins carry no ordering assumption, outliers fall into an end bin, missing gets its own bin, and categories and numbers become the same kind of object.</p>"
},
{
"l": "FORMULA",
"t": "Weight of evidence",
"h": "One number for <em>how good</em> a bin is",
"b": "<div class=\"fx\"><div class=\"cap\">Weight of evidence for bin b</div>\n<div class=\"eq\"><em>WoE</em><sub>b</sub> = ln <span class=\"fr\"><i>share of all goods falling in bin b</i><i>share of all bads falling in bin b</i></span></div>\n<div class=\"wh\">ln&nbsp;&nbsp;natural logarithm<br>\ngood&nbsp;a loan with target 0 &mdash; did not default in the window<br>\nbad&nbsp;&nbsp;a loan with target 1 &mdash; did default in the window<br>\nshare of goods&nbsp;goods in bin b divided by total goods in the sample, not by the bin size<br>\nshare of bads&nbsp;bads in bin b divided by total bads in the sample</div></div>\n<p>Read the sign directly. <strong>Positive weight of evidence means the bin holds a larger share of the goods than of the bads</strong>, so it is a safer-than-average bin. Negative means the reverse. Zero means the bin is indistinguishable from the book as a whole.</p>\n<p>The logarithm is not decoration. It makes the quantity symmetric &mdash; a bin twice as good and a bin twice as bad get equal and opposite values &mdash; and it makes the result additive, which is what allows a scorecard to be a sum of points rather than a product of ratios.</p>\n<div class=\"note\">Both denominators are sample totals, never bin totals. Dividing by bin size gives a bad rate, which is a different and less useful quantity because it takes no account of how much of the book sits in the bin.</div>"
},
{
"l": "WORKED",
"t": "WoE by hand",
"h": "Six bins of one variable, <em>computed</em>",
"b": "<p>The credit grade assigned at origination, binned on the training sample of 184,525 loans containing 6,329 bads and 178,196 goods.</p>\n<div class=\"dt\"><table>\n<tr><th>Bin</th><th>Loans</th><th>Bads</th><th>% of goods</th><th>% of bads</th><th>WoE</th></tr>\n<tr class=\"hi\"><td>A</td><td class=\"n\">31,018</td><td class=\"n\">379</td><td class=\"n\">17.19%</td><td class=\"n\">5.99%</td><td class=\"n\">+1.0539</td></tr>\n<tr><td>B</td><td class=\"n\">59,958</td><td class=\"n\">1,393</td><td class=\"n\">32.87%</td><td class=\"n\">22.01%</td><td class=\"n\">+0.4010</td></tr>\n<tr><td>C</td><td class=\"n\">46,953</td><td class=\"n\">1,740</td><td class=\"n\">25.37%</td><td class=\"n\">27.49%</td><td class=\"n\">&minus;0.0801</td></tr>\n<tr><td>D</td><td class=\"n\">27,311</td><td class=\"n\">1,459</td><td class=\"n\">14.51%</td><td class=\"n\">23.05%</td><td class=\"n\">&minus;0.4630</td></tr>\n<tr><td>E</td><td class=\"n\">12,422</td><td class=\"n\">771</td><td class=\"n\">6.54%</td><td class=\"n\">12.18%</td><td class=\"n\">&minus;0.6224</td></tr>\n<tr><td>Other</td><td class=\"n\">6,863</td><td class=\"n\">587</td><td class=\"n\">3.52%</td><td class=\"n\">9.28%</td><td class=\"n\">&minus;0.9686</td></tr>\n</table></div>\n<div class=\"wk\"><div class=\"h\">Grade A, step by step</div>\n<div class=\"r\"><b>Goods in bin A (31,018 &minus; 379)</b><span>30,639</span></div>\n<div class=\"r\"><b>Share of all goods (30,639 / 178,196)</b><span>0.17194</span></div>\n<div class=\"r\"><b>Share of all bads (379 / 6,329)</b><span>0.05993</span></div>\n<div class=\"r tot\"><b>Ratio</b><span>2.8689</span></div>\n<div class=\"r tot\"><b>WoE = ln(2.8689)</b><span>+1.0539</span></div>\n</div>\n<p>Grade A holds nearly three times as much of the good population as of the bad. Grade Other, at the far end, holds under four percent of goods and over nine percent of bads. The six values run monotonically from +1.05 down to &minus;0.97 with no reversal, which is what a well-ordered variable looks like.</p>"
},
{
"l": "FORMULA",
"t": "Information value",
"h": "One number for <em>how useful</em> a column is",
"b": "<p>Weight of evidence describes a bin. Information value aggregates across bins to describe the whole column, so that 49 candidate columns can be ranked.</p>\n<div class=\"fx\"><div class=\"cap\">Information value of a variable</div>\n<div class=\"eq\"><em>IV</em> = &Sigma;<sub>b</sub> ( <em>g</em><sub>b</sub> &minus; <em>b</em><sub>b</sub> ) &times; <em>WoE</em><sub>b</sub></div>\n<div class=\"wh\">&Sigma;<sub>b</sub>&nbsp;sum over every bin b of the variable<br>\ng<sub>b</sub>&nbsp;&nbsp;share of all goods falling in bin b<br>\nb<sub>b</sub>&nbsp;&nbsp;share of all bads falling in bin b<br>\nWoE<sub>b</sub>&nbsp;the weight of evidence of bin b</div></div>\n<p>Each term is a separation multiplied by a log ratio, so it is always positive: when goods exceed bads in a bin, both factors are positive, and when bads exceed goods, both are negative. A bin that separates nothing contributes nothing. IV is therefore a total of separation across the column, floored at zero.</p>\n<div class=\"wk\"><div class=\"h\">Grade, contribution by bin</div>\n<div class=\"r\"><b>A &nbsp;(0.17194 &minus; 0.05993) &times; 1.0539</b><span>0.11804</span></div>\n<div class=\"r\"><b>B &nbsp;(0.32865 &minus; 0.22007) &times; 0.4010</b><span>0.04355</span></div>\n<div class=\"r\"><b>C &nbsp;(0.25372 &minus; 0.27487) &times; &minus;0.0801</b><span>0.00169</span></div>\n<div class=\"r\"><b>D &nbsp;(0.14508 &minus; 0.23050) &times; &minus;0.4630</b><span>0.03955</span></div>\n<div class=\"r\"><b>E &nbsp;(0.06538 &minus; 0.12184) &times; &minus;0.6224</b><span>0.03514</span></div>\n<div class=\"r\"><b>Other (0.03522 &minus; 0.09278) &times; &minus;0.9686</b><span>0.05575</span></div>\n<div class=\"r tot\"><b>IV = sum</b><span>0.29372</span></div>\n</div>\n<p>Bin C contributes almost nothing: its goods and bads shares are nearly identical, so it neither helps nor hurts. Grade A alone contributes 40% of the column's total information.</p>"
},
{
"l": "CHEAT",
"t": "IV bands",
"h": "The conventional <em>strength</em> table",
"b": "<div class=\"sheet\"><div class=\"h\">Information value, conventional reading</div>\n<div class=\"r\"><b>Below 0.02</b><span>Unusable. Drop it</span></div>\n<div class=\"r\"><b>0.02 to 0.10</b><span>Weak, but can contribute inside a multivariate model</span></div>\n<div class=\"r\"><b>0.10 to 0.30</b><span>Medium. The workhorse range for credit variables</span></div>\n<div class=\"r\"><b>0.30 to 0.50</b><span>Strong</span></div>\n<div class=\"r\"><b>Above 0.50</b><span>Suspiciously strong. Check for leakage before celebrating</span></div>\n</div>\n<p><strong>These bands are a rule of thumb, not a standard.</strong> They circulate widely in credit scoring practice without a single authoritative source, and different houses use slightly different cut points, most commonly shifting the weak/medium boundary between 0.08 and 0.12. Treat them as a sorting aid rather than a test.</p>\n<p>On this book the ranking that mattered was relative, not absolute: only two variables reached the medium band at all, and the model was built from the top of the list rather than from anything that cleared a threshold.</p>"
},
{
"l": "PICTURE",
"t": "The screen",
"h": "Forty-nine candidates, <em>ranked</em>",
"b": "<div class=\"bars\">\n<div class=\"row\"><div class=\"lb\"><span>grade &mdash; the origination credit grade</span><span>0.294</span></div><div class=\"tr\"><i style=\"width:98%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>int_rate &mdash; contractual interest rate</span><span>0.277</span></div><div class=\"tr\"><i style=\"width:92%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>inq_last_6mths &mdash; credit inquiries</span><span>0.076</span></div><div class=\"tr\"><i class=\"b\" style=\"width:25%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>sub_grade &mdash; finer grade band</span><span>0.074</span></div><div class=\"tr\"><i class=\"b\" style=\"width:25%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>annual_inc &mdash; declared income</span><span>0.060</span></div><div class=\"tr\"><i class=\"b\" style=\"width:20%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>purpose &mdash; stated loan purpose</span><span>0.051</span></div><div class=\"tr\"><i class=\"b\" style=\"width:17%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>home_ownership</span><span>0.034</span></div><div class=\"tr\"><i class=\"b\" style=\"width:11%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>term &mdash; 36 or 60 months</span><span>0.025</span></div><div class=\"tr\"><i class=\"d\" style=\"width:8%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>dti &mdash; debt to income</span><span>0.023</span></div><div class=\"tr\"><i class=\"d\" style=\"width:8%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>revol_util &mdash; revolving utilisation</span><span>0.021</span></div><div class=\"tr\"><i class=\"d\" style=\"width:7%\"></i></div></div>\n</div>\n<p>Below this top ten the list falls away fast. <strong>Twenty-six of the 49 candidates score under 0.02</strong>, and seventeen of those produced a single bin, meaning the column was constant or empty across the whole training sample.</p>\n<p>Two features of this ranking are worth holding onto, because Mission 05 turns on them. The top two are more than three times as informative as anything else. And both of them are the lender's own assessment of the borrower rather than a fact about the borrower.</p>"
},
{
"l": "MECHANISM",
"t": "Binning rules",
"h": "What makes a binning <em>stable</em> rather than merely sharp",
"b": "<p>Bins can always be cut finer to raise information value. Doing so makes the model worse in production. Four rules keep the binning honest, and they trade measured performance for durability on purpose.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. Minimum bin size</b>No bin below roughly 5% of the sample. A small bin's weight of evidence is estimated from few bads and swings wildly on rerun.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2. Monotonic where the variable is ordered</b>For a numeric variable such as income or utilisation, weight of evidence should move in one direction across bins. A reversal is usually noise, and it produces a scorecard that cannot be explained to a credit committee.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3. Missing is its own bin</b>Never imputed, never merged. A blank field often carries real information about the application, and forcing it to a median destroys that and invents data at the same time.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>4. Rare categories collapse into Other</b>A category with a handful of loans cannot support a stable estimate. Grouping them is what the Other bin in the grade table is.</div>\n</div>\n<p>The counts in this build reflect these rules directly: grade came out with 6 bins, interest rate with 12, income with 7 including a missing bin, and revolving utilisation with 8 including a missing bin.</p>"
},
{
"l": "TRAP",
"t": "High IV",
"h": "The highest information value is the <em>best</em> variable",
"b": "<p>The belief: rank the candidates by information value and take the top of the list, because that is what the number is for.</p>\n<p>An information value above about 0.5 is more often a leak than a discovery. A column that separates goods from bads that cleanly usually contains the answer: an outcome field, a post-origination update, or a code the lender assigns only to accounts already in trouble.</p>\n<p>The subtler version of the same problem appears at the top of this particular ranking, and it is not leakage. The two strongest variables are the credit grade the lender assigned and the interest rate the lender charged &mdash; and the interest rate is set from the grade. Both are outputs of the lender's own risk assessment, made before the loan was funded. They are legitimate inputs, available at origination, and no rule forbids them.</p>\n<p>But a model built mostly on them is largely reproducing a decision that has already been made, and it will inherit whatever that decision got wrong. Mission 05 takes this apart properly.</p>\n<div class=\"note\">The question to ask of any high-information column is not \"is this allowed\" but \"where does this number come from, and who made it\".</div>"
},
{
"l": "RECALL",
"t": "Mission 04",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Bin every column and replace bins with <strong>WoE = ln(share of goods / share of bads)</strong>, computed from sample totals, not bin totals.</li>\n<li>Positive WoE is a safer-than-average bin; the log makes the quantity symmetric and additive.</li>\n<li><strong>IV = &Sigma; (g<sub>b</sub> &minus; b<sub>b</sub>) &times; WoE<sub>b</sub></strong>, always positive, used to rank columns. Grade computes to 0.294 on this book.</li>\n<li>The strength bands are a rule of thumb with no single authority; the 0.02 floor and 0.50 ceiling are the two that earn their keep.</li>\n<li>Binning rules trade sharpness for stability: minimum bin size, monotonicity, missing as its own bin, rare categories collapsed.</li>\n</ul>"
}
],
"n": "04"
},
{
"title": "Fitting the model",
"stage": "Model",
"line": "Logistic regression on transformed variables, what a coefficient means once the input is a weight of evidence, and the two things wrong with the model this book produced.",
"bullets": [
"Write the logistic model and say what it outputs",
"Interpret a coefficient on a WoE-transformed variable, including its expected sign",
"Read a coefficient table for significance and for variables doing no work",
"Recognise when a model is largely re-learning someone else's risk assessment"
],
"cards": [
{
"l": "ORIENT",
"t": "Why logistic",
"h": "The oldest tool in the room is still the <em>right</em> one",
"b": "<p>Gradient boosting will out-discriminate a logistic regression on most credit datasets, usually by a modest margin. Retail scorecards are still built on logistic regression almost everywhere, and the reasons are not nostalgia.</p>\n<div class=\"three\"><div><b>It produces a probability</b>The output is directly interpretable as a rate, which is what provisioning and capital both consume. A ranking is not enough.</div>\n<div><b>Every effect is inspectable</b>One coefficient per variable, one direction, one magnitude. A credit committee can be shown why an application declined, and a regulator can be shown that the reason is lawful.</div>\n<div><b>It converts to points</b>The additive structure is what allows the model to become a scorecard, which is the artefact underwriters and systems actually use.</div></div>\n<p>The trade is real and should be stated rather than hidden: some discriminatory power is given up in exchange for a model that can be explained, defended, monitored variable by variable, and adjusted without refitting.</p>"
},
{
"l": "FORMULA",
"t": "The logit",
"h": "Log-odds, linear in the <em>inputs</em>",
"b": "<div class=\"fx\"><div class=\"cap\">Logistic regression, log-odds form</div>\n<div class=\"eq\">ln <span class=\"fr\"><i>PD</i><i>1 &minus; PD</i></span> = <em>&alpha;</em> + <em>&beta;</em><sub>1</sub><em>x</em><sub>1</sub> + <em>&beta;</em><sub>2</sub><em>x</em><sub>2</sub> + &hellip; + <em>&beta;</em><sub>k</sub><em>x</em><sub>k</sub></div>\n<div class=\"wh\">PD&nbsp;&nbsp;the predicted probability of default for this loan<br>\nPD / (1 &minus; PD)&nbsp;the odds of default &mdash; chance of bad divided by chance of good<br>\nln&nbsp;&nbsp;natural logarithm; the whole left side is called the log-odds, or logit<br>\n&alpha;&nbsp;&nbsp;the intercept, the log-odds when every input is zero<br>\n&beta;<sub>j</sub>&nbsp;&nbsp;the coefficient on input j<br>\nx<sub>j</sub>&nbsp;&nbsp;input j &mdash; here, the weight of evidence of the bin the loan falls into</div></div>\n<p>Rearranged to give a probability directly:</p>\n<div class=\"fx\"><div class=\"cap\">The same model, solved for PD</div>\n<div class=\"eq\"><em>PD</em> = <span class=\"fr\"><i>1</i><i>1 + e<sup>&minus;(&alpha; + &Sigma;&beta;<sub>j</sub>x<sub>j</sub>)</sup></i></span></div>\n<div class=\"wh\">e&nbsp;&nbsp;the base of natural logarithms, about 2.71828<br>\n&Sigma;&beta;<sub>j</sub>x<sub>j</sub>&nbsp;the sum of every coefficient times its input</div></div>\n<p>The model is linear in log-odds and curved in probability. That curvature is the point: it keeps every prediction strictly between 0 and 1 no matter how extreme the inputs, which a linear model on probability directly cannot do.</p>"
},
{
"l": "MECHANISM",
"t": "Reading a coefficient",
"h": "What <em>&beta;</em> means when the input is a weight of evidence",
"b": "<p>Because every input has been replaced by its weight of evidence, coefficients no longer mean what they would on raw variables. Three consequences follow, and all three are used in practice.</p>\n<div class=\"dt\"><table>\n<tr><th>Property</th><th>Consequence</th></tr>\n<tr class=\"hi\"><td>Sign is predictable</td><td class=\"g\">WoE rises with safety. The target is default. So <strong>every coefficient should be negative</strong> in a model predicting default. A positive one is a defect, not a finding</td></tr>\n<tr><td>Magnitude is comparable</td><td class=\"g\">All inputs are on the same log-odds scale, so coefficients can be compared directly across variables. Raw-variable coefficients cannot</td></tr>\n<tr><td>Near 1.0 is the natural size</td><td class=\"g\">If a variable's WoE were a perfect standalone predictor of log-odds, its coefficient would be about &minus;1. Smaller means the other variables are explaining part of it</td></tr>\n</table></div>\n<p>The <span class=\"k\">sign check</span> is a formal gate in scorecard development: fit the model, inspect every coefficient's sign against expectation, and treat any reversal as a problem to be diagnosed rather than a result to be reported. A reversal almost always means two variables are carrying overlapping information and the fit has split it between them awkwardly.</p>"
},
{
"l": "WORKED",
"t": "The coefficients",
"h": "Ten variables, and what the table <em>says</em>",
"b": "<div class=\"dt\"><table>\n<tr><th>Variable</th><th>Coefficient</th><th>p-value</th><th>Reading</th></tr>\n<tr><td>intercept</td><td class=\"n\">&minus;3.3384</td><td class=\"n\">0.000</td><td class=\"g\">Baseline log-odds</td></tr>\n<tr class=\"hi\"><td>annual_inc</td><td class=\"n\">&minus;0.9202</td><td class=\"n\">&lt;0.001</td><td class=\"g\">Largest effect in the model</td></tr>\n<tr><td>inq_last_6mths</td><td class=\"n\">&minus;0.7480</td><td class=\"n\">&lt;0.001</td><td class=\"g\">Strong</td></tr>\n<tr><td>purpose</td><td class=\"n\">&minus;0.7180</td><td class=\"n\">&lt;0.001</td><td class=\"g\">Strong</td></tr>\n<tr><td>grade</td><td class=\"n\">&minus;0.6177</td><td class=\"n\">&lt;0.001</td><td class=\"g\">Strong</td></tr>\n<tr><td>dti</td><td class=\"n\">&minus;0.4887</td><td class=\"n\">&lt;0.001</td><td class=\"g\">Solid</td></tr>\n<tr><td>home_ownership</td><td class=\"n\">&minus;0.4658</td><td class=\"n\">&lt;0.001</td><td class=\"g\">Solid</td></tr>\n<tr><td>int_rate</td><td class=\"n\">&minus;0.2358</td><td class=\"n\">0.0007</td><td class=\"g\">Modest, and see the next card</td></tr>\n<tr><td>revol_util</td><td class=\"n\">&minus;0.2239</td><td class=\"n\">0.018</td><td class=\"g\">Marginal</td></tr>\n<tr><td>sub_grade</td><td class=\"n\">&minus;0.1068</td><td class=\"n\">0.088</td><td class=\"q\">Not significant</td></tr>\n<tr><td>term</td><td class=\"n\">&minus;0.0168</td><td class=\"n\">0.853</td><td class=\"q\">Not significant, and near zero</td></tr>\n</table></div>\n<p>Every coefficient is negative. <strong>The sign check passes on all ten</strong>, which given the near-duplication among the top variables is not a foregone conclusion.</p>\n<p>The intercept of &minus;3.3384 corresponds to odds of e<sup>&minus;3.3384</sup> = 0.0355, or a probability of 3.43% &mdash; the sample default rate, which is what an intercept on centred inputs should reproduce.</p>"
},
{
"l": "TRAP",
"t": "Dead weight",
"h": "Every variable in the model is <em>doing something</em>",
"b": "<p>The belief: a variable survived selection and appears in the final model, so it is contributing.</p>\n<p>Two of these ten are contributing nothing measurable, and the evidence is in two places at once. The <code>term</code> coefficient is &minus;0.0168 with a p-value of 0.853, meaning the data cannot distinguish its effect from zero. And when the model is converted to points in Mission 06, both of term's bins score 58 &mdash; <strong>a 36-month loan and a 60-month loan receive identical points</strong>. The variable is present and inert.</p>\n<p><code>sub_grade</code> is the softer case at p = 0.088 and a points spread of 58 to 60, which is two points out of a range of roughly 150. It is not quite nothing, and it is not enough to justify a variable.</p>\n<p>The honest reading is that both should be dropped and the model refitted on eight variables. The believable mistake is treating a variable list as a decision already made rather than a hypothesis still under test, and the reason it survives is that nothing breaks &mdash; the model still runs, still validates, still scores.</p>\n<div class=\"note\">A points table exposes dead variables more bluntly than a p-value does, because a spread of zero points is not a matter of interpretation.</div>"
},
{
"l": "MECHANISM",
"t": "Borrowed signal",
"h": "When the strongest variable is someone else's <em>model</em>",
"b": "<p>Three of the ten variables are the same thing wearing three names. <code>grade</code> is the risk band the lender assigned at underwriting. <code>sub_grade</code> is a finer cut of that same band. <code>int_rate</code> is the price, and the price is set from the band.</p>\n<p>None of this is leakage &mdash; all three were fixed before the money moved, and any applicant scored by this model would have them. But it changes what the model is.</p>\n<div class=\"two\"><div><b>What it looks like</b>A ten-variable scorecard on borrower attributes and bureau history, with strong discrimination from a well-ordered set of inputs.</div>\n<div><b>What it is</b>A model whose two most informative inputs, at IV 0.294 and 0.277, are the lender's own prior risk judgement. Everything genuinely about the borrower &mdash; income, inquiries, utilisation, debt-to-income &mdash; sits at IV 0.076 or below.</div></div>\n<p>Three consequences follow, and each is checkable.</p>\n<p><strong>It explains the insignificance of sub_grade.</strong> A finer version of grade adds almost nothing once grade is in, which is exactly what a p-value of 0.088 on a collinear pair looks like.</p>\n<p><strong>It caps what the model can achieve.</strong> If the residual borrower attributes carry weak information, a model containing the prior grade cannot get far beyond the prior grade. Mission 07 shows discrimination landing where that reasoning predicts.</p>\n<p><strong>It inherits the prior model's blind spots.</strong> Whatever the original underwriting missed, this model will also miss, because it is partly a copy of it.</p>"
},
{
"l": "MECHANISM",
"t": "Two candidates",
"h": "Seven variables against <em>ten</em>",
"b": "<p>Two models were fitted and compared rather than one model being declared. Model A used seven variables, Model B used ten. Both were scored on all three samples before either was chosen.</p>\n<div class=\"dt\"><table>\n<tr><th>Sample</th><th>Model A &mdash; Gini</th><th>Model B &mdash; Gini</th></tr>\n<tr><td>Train</td><td class=\"n\">0.3013</td><td class=\"n\">0.3678</td></tr>\n<tr><td>Test</td><td class=\"n\">0.2969</td><td class=\"n\">0.3634</td></tr>\n<tr class=\"hi\"><td>Out-of-time</td><td class=\"n\">0.2715</td><td class=\"n\">0.3845</td></tr>\n</table></div>\n<p>Model B is better everywhere, and the gap widens on the later period rather than narrowing, which is the opposite of what overfitting produces. That is the argument for choosing it, and it is stronger than the train-sample comparison on its own would be.</p>\n<p><strong>The direction of travel differs between the two models on the holdout.</strong> Model A degrades out of time, from 0.3013 to 0.2715. Model B does not. Any claim about out-of-time behaviour on this build has to name which model it refers to, because the two behave differently and only one of them is the final model.</p>\n<div class=\"note\">Fitting two candidates and comparing them on a frozen holdout is cheap and it converts a preference into evidence. Fitting one is how a model gets defended by assertion.</div>"
},
{
"l": "RECALL",
"t": "Mission 05",
"h": "What is now <em>owned</em>",
"b": "<ul>\n<li>Logistic regression is linear in log-odds: <strong>ln(PD/(1&minus;PD)) = &alpha; + &Sigma;&beta;<sub>j</sub>x<sub>j</sub></strong>, and it survives in credit because it yields a probability, an explanation and a points table.</li>\n<li>With WoE inputs, <strong>every coefficient in a default model should be negative</strong>, and magnitudes become comparable across variables.</li>\n<li>A points spread of zero exposes a dead variable more clearly than a p-value: term at &minus;0.0168, p = 0.853, 58 points either way.</li>\n<li><strong>When the top variables are the lender's own grade and price, the model is partly re-learning a prior decision</strong> &mdash; which caps its ceiling and inherits its blind spots.</li>\n<li>Two candidate models compared on a frozen holdout beats one model defended by assertion.</li>\n</ul>"
}
],
