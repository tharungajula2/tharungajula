<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}

/* ================= v02 ADDITIONS ================= */

/* links — official source blocks */
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim);transition:color .15s,border-color .15s}
a:hover{color:var(--ink);border-color:var(--ink)}
.docs{margin:20px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--live);border-radius:7px;font-size:12.6px;line-height:1.9}
.docs b{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:6px;font-weight:500}
.docs a{display:block;border-bottom:none;color:var(--body)}
.docs a:hover{color:var(--accent)}
.docs a:before{content:'\2192\00a0';color:var(--live)}

/* formulae */
.fx{margin:20px 0;padding:16px 15px;background:#0E0E12;border:1px solid var(--line);border-radius:9px;text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fx .cap{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.fx .eq{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);line-height:2.1;white-space:normal}
.fx .eq em{font-style:italic;color:var(--accent);font-family:'Instrument Serif',serif;font-size:17px}
.fx .eq .nw{white-space:nowrap}
.fx .wh{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:left;line-height:1.8;font-family:'JetBrains Mono',monospace}

/* stacked fractions — never sup/frasl/sub */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px}
.fr>i{font-style:normal;display:block;padding:0 7px;line-height:1.4;white-space:nowrap}
.fr>i:first-child{border-bottom:1px solid var(--muted);padding-bottom:3px}
.fr>i:last-child{padding-top:3px}

/* worked examples */
.wk{margin:20px 0;border:1px solid var(--accent-dim);border-radius:9px;overflow:hidden}
.wk .h{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.wk .r{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;background:var(--surface)}
.wk .r:last-child{border-bottom:none}
.wk .r b{flex:1;color:var(--body);font-weight:400}
.wk .r span{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.wk .r.tot{background:var(--raise)}
.wk .r.tot b{color:var(--ink);font-weight:600}
.wk .r.tot span{color:var(--ink)}

@media(max-width:560px){
 .fx{text-align:left;padding:14px 12px}
 .fx .eq{font-size:12.5px;line-height:2}
 .fx .eq em{font-size:15px}
 .fx .cap{text-align:left}
 .fx .wh{font-size:10.5px;line-height:1.75}
 .fr>i{padding:0 5px}
 .wk .r{flex-wrap:wrap;gap:4px}
 .wk .r b{flex:1 1 100%}
 .wk .r span{flex:0 0 auto}
 .sheet .r{flex-direction:column;gap:3px}
 .sheet .r b{flex:none}
}
@media(max-width:430px){
 .fx{padding:12px 10px}
 .fx .eq{font-size:11.5px}
 .fx .eq em{font-size:14px}
}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "19 August 2026";
/* ============================================================
   FIELD CARDS — PACK TEMPLATE
   Extracted from investing_FINAL_v02.html. Design is locked:
   do not change tokens, CSS, or the renderer. Fill the data only.

   PACK FIELDS
     title     headline on the cover, one <em> allowed
     sub       one or two sentences under it
     floor     what the pack assumes, e.g. "No prior knowledge assumed"
     dateline  e.g. "Figures verified" — sits before DATE
     intro     optional note on the cover; delete for a pack with no LIVE cards

   MISSION FIELDS
     title     the mission name
     stage     short spine word, shown on every card in the mission
     line      one sentence under the mission title
     bullets   optional array — renders as "In this mission"
     cards     array, 7-18 cards, last one is always RECALL
     n         auto-generated, leave as is

   CARD FIELDS
     l  label   ORIENT DEFINE WHY MECHANISM PICTURE TRAP LIVE CHEAT
                NUMBERS RECALL CLOSE   (colour is automatic)
     t  tag     two or three words, shown next to the stage
     h  headline  one <em> for emphasis
     b  body     raw HTML — see the components below

   BODY COMPONENTS  (all styled already, no new CSS)
     <p> <ul><li> <strong> <em> <code>
     <span class="k">        accent for a key term
     <div class="note">      the aside
     <div class="stamp">     collection date — LIVE cards only
     <div class="src">       source line
     <div class="dt"><table> data table, cells .n for figures .g for context
                             <tr class="hi"> highlights a row
     <div class="flow">      ordered steps, .n boxes with .a arrows between
     <div class="two"> .three  side-by-side blocks
     <div class="bars">      horizontal bar chart, bars .b .c .d recolour
     <div class="stat">      three big numbers
     <div class="dg">        diagram frame, .dg-t title, .lay layers, .cross band
     <div class="code" data-cap="python"><pre>  highlighted, copy button auto
     <div class="sheet">     lookup table, .q warning .g good .b live
   ============================================================ */

const P = {
 "title": "The Traded <em>Balance Sheet</em>",
 "sub": "Fixed income, derivatives and foreign exchange, from no prior knowledge. What each instrument promises, the arithmetic that measures it, and the credit exposure it creates — anchored in the Indian market and its rulebook.",
 "edition": "Edition 01",
 "floor": "No prior markets knowledge assumed",
 "dateline": "Levels and regulatory positions verified",
 "intro": "Two kinds of card. <strong>Mechanism</strong> cards — discounting, duration, cost of carry, put-call parity — are arithmetic and do not go stale. <strong>Live</strong> cards carry a collection date and will: policy rates, yields, the rupee, and India's regulatory positions. Every number in this pack is dated, and Mission 10 lists what to re-check and when.",
 "missions": [
  {
   "title": "What a market actually is",
   "stage": "Ground",
   "line": "Four asset classes, two ways to own risk, and a regulatory split that decides which rulebook applies to which instrument. Everything later sits on this frame.",
   "bullets": [
    "Primary and secondary, and why both are needed",
    "The four asset classes, and what a price means in each",
    "Cash instruments against derivatives &mdash; the single most useful distinction",
    "Bid, offer, spread and what liquidity really measures",
    "Who regulates what in India, and why the split matters"
   ],
   "cards": [
    {
     "l": "ORIENT",
     "t": "The two jobs",
     "h": "Moving money, and moving <em>risk</em>",
     "b": "<p>A financial market does two things. It moves <strong>money</strong> from those who have it to those who need it, and it moves <strong>risk</strong> from those who do not want it to those who will hold it for a price.</p>\n<p>The first job happens in the <span class=\"k\">primary market</span>, where a security is created and sold for the first time: a government auctioning a bond, a company issuing shares. Money goes to the issuer. The second job happens in the <span class=\"k\">secondary market</span>, where that same security changes hands afterwards. <strong>The issuer receives nothing from secondary trading</strong> &mdash; and the secondary market is nonetheless what makes the primary market possible, because almost nobody lends for ten years without the ability to sell in year three.</p>\n<div class=\"two\">\n<div><b>Primary</b>New security, money to the issuer. Auctions, initial public offerings, private placements. Happens once per security.</div>\n<div><b>Secondary</b>Existing security, money between investors. Exchanges and dealer markets. Happens continuously.</div>\n</div>\n<p>A <span class=\"k\">security</span> is a tradable financial contract: a claim on future cash flows, transferable to someone else. That transferability is the whole point. A bank loan is a claim on future cash flows too, but it was not built to be handed on, which is why loans and bonds behave so differently despite being the same economic act.</p>\n<div class=\"note\">Liquidity is the ability to sell quickly at close to the last traded price. It is not a property of an instrument; it is a property of an instrument <em>at a moment</em>. Government bonds that trade every second in normal conditions can become untradeable in a crisis, which is when selling matters most.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Four asset classes",
     "h": "What is being <em>bought</em>, in each",
     "b": "<div class=\"dt\"><table>\n<tr><th>Class</th><th>What it is</th><th>What drives the price</th></tr>\n<tr><td><strong>Equity</strong></td><td>Ownership of a company, last in line for its cash</td><td class=\"g\">Expected profits, and what the market will pay for them</td></tr>\n<tr class=\"hi\"><td><strong>Fixed income</strong></td><td>A loan in tradable form &mdash; fixed cash flows on fixed dates</td><td class=\"g\">Interest rates, and the chance the borrower fails to pay</td></tr>\n<tr><td><strong>Foreign exchange</strong></td><td>One currency against another</td><td class=\"g\">Interest rate differences, trade and capital flows, policy</td></tr>\n<tr><td><strong>Commodities</strong></td><td>Physical goods &mdash; oil, metals, agricultural produce</td><td class=\"g\">Supply, demand, storage cost</td></tr>\n</table></div>\n<p>The single structural difference between equity and fixed income decides most of the rest: <strong>a bondholder's best case is being repaid in full, while a shareholder's best case is unbounded.</strong> A bond that performs perfectly returns exactly what was promised. That asymmetry is why bond analysis is about the probability of not being paid, and equity analysis is about how large the upside might be.</p>\n<p>Foreign exchange is the odd one out. There is no issuer, no cash flow and nothing to hold to maturity. A currency pair is a <em>relative</em> price: buying one currency is always simultaneously selling another, and a quote of 95.50 for the dollar against the rupee is one statement, not two.</p>\n<div class=\"note\">This pack covers fixed income, foreign exchange and the derivatives built on both, because those are what a bank's balance sheet is actually made of. Equity and commodities appear only where a derivative references them.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Cash and derivative",
     "h": "Owning the thing, or owning a <em>contract about</em> it",
     "b": "<p>A <span class=\"k\">cash instrument</span> is the asset itself. Buy a government bond and it is yours: you paid for it, you receive the coupons, you can sell it.</p>\n<p>A <span class=\"k\">derivative</span> is a contract whose value is <em>derived</em> from something else &mdash; the underlying. It confers no ownership of the underlying. A currency forward is a promise to exchange dollars for rupees at an agreed rate on an agreed date; it is not dollars.</p>\n<div class=\"dt\"><table>\n<tr><th></th><th>Cash instrument</th><th>Derivative</th></tr>\n<tr><td>Money paid upfront</td><td class=\"g\">The full price</td><td class=\"g\">Little or nothing &mdash; a forward starts at zero value</td></tr>\n<tr><td>What you own</td><td class=\"g\">The asset</td><td class=\"g\">A claim on the counterparty</td></tr>\n<tr class=\"hi\"><td>Main risk</td><td class=\"g\">The asset falls in value</td><td class=\"g\">The asset moves <strong>and</strong> the counterparty fails</td></tr>\n<tr><td>Maximum loss</td><td class=\"g\">What you paid</td><td class=\"g\">Can far exceed anything paid</td></tr>\n</table></div>\n<p>Two consequences run through this whole pack.</p>\n<ul>\n<li><strong>Derivatives create counterparty credit risk where none existed.</strong> Buying a bond outright means no ongoing exposure to whoever sold it. Entering a five-year swap means five years of exposure to whether they can still pay. Mission 09 is entirely about this.</li>\n<li><strong>Derivatives embed leverage.</strong> Controlling ₹100 crore of exposure with ₹2 crore of margin is not unusual. The same instrument hedges a risk or manufactures one, and nothing in the contract distinguishes the two intentions.</li>\n</ul>\n<div class=\"note\">The distinction cuts across asset classes rather than sitting inside one. Every class has cash instruments and derivatives on them, and the derivative usually trades in larger volume than the thing it references.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "How a price is made",
     "h": "Bid, offer, and the gap <em>between</em>",
     "b": "<p>There is rarely one price. There are two, quoted by whoever is willing to trade.</p>\n<div class=\"sheet\"><div class=\"h\">Reading a quote</div>\n<div class=\"r\"><b>Bid</b><span>The price at which the quoting party will <strong>buy</strong>. You sell here</span></div>\n<div class=\"r\"><b>Offer, or ask</b><span>The price at which they will <strong>sell</strong>. You buy here</span></div>\n<div class=\"r\"><b>Spread</b><span>Offer minus bid. The dealer's compensation for standing in the middle</span></div>\n<div class=\"r\"><b>Mid</b><span>The average of the two. Where valuation is usually struck, and a price at which nobody actually trades</span></div>\n</div>\n<p>A quote of <strong>95.50 / 95.52</strong> on the dollar against the rupee means: sell dollars at 95.50, buy at 95.52. Buy and immediately sell, and 2 paise per dollar is gone. On $10 million that is ₹200,000, which is the cost of the round trip and not a market move.</p>\n<p><strong>The spread is the practical measure of liquidity.</strong> A benchmark government bond may quote a spread of a fraction of a paisa; an unlisted corporate bond may not be quoted at all. Two instruments described as \"bonds\" can be a hundred times apart in the cost of getting out.</p>\n<p>Markets are organised in two shapes:</p>\n<div class=\"two\">\n<div><b>Order-driven &mdash; an exchange</b>Everyone's orders meet in one book. Prices are public, counterparty is the clearing house. Equities and listed derivatives work this way.</div>\n<div><b>Quote-driven &mdash; over the counter</b>Dealers quote to clients bilaterally. Prices are negotiated, terms are flexible, the counterparty is the dealer. Bonds, currencies and most swaps work this way.</div>\n</div>\n<div class=\"note\">Over the counter does not mean unregulated or unreported. In India, over-the-counter trades in government securities, currencies and rupee derivatives are reported to a trade repository, and most are centrally cleared. Mission 09 covers what that changes.</div>"

    {
     "l": "PICTURE",
     "t": "The Indian map",
     "h": "Two regulators, and the line <em>between</em> them",
     "b": "<p>India splits financial market regulation by instrument rather than by institution. Which regulator applies is not a technicality &mdash; it decides the rulebook, the reporting, the permitted participants and the clearing arrangement.</p>\n<div class=\"dg\"><div class=\"dg-t\">Who regulates what</div>\n<div class=\"lay\">\n<div><span>RBI</span>Government securities &middot; money markets &middot; foreign exchange &middot; interest rate derivatives &middot; credit derivatives &middot; <span class=\"k\">repo</span>, borrowing secured on securities &mdash; Mission 05</div>\n<div class=\"hot\"><span>Both</span>Exchange-traded currency and interest rate derivatives &mdash; product design with the RBI, market conduct with SEBI</div>\n<div><span>SEBI</span>The Securities and Exchange Board of India &mdash; equity &middot; corporate bonds &middot; mutual funds &middot; equity and commodity derivatives &middot; exchanges and depositories</div>\n</div>\n<div class=\"cross\">Ministry of Finance sets the government's borrowing programme; the RBI executes it as debt manager</div></div>\n<div class=\"sheet\"><div class=\"h\">The institutions worth knowing by name</div>\n<div class=\"r\"><b>RBI</b><span>Central bank, banking supervisor, manager of the government's debt, regulator of money, government securities, foreign exchange and rupee derivatives</span></div>\n<div class=\"r\"><b>SEBI</b><span>Securities and Exchange Board of India &mdash; capital markets regulator</span></div>\n<div class=\"r\"><b>CCIL</b><span>The Clearing Corporation of India &mdash; central counterparty for government securities, foreign exchange and rupee derivatives</span></div>\n<div class=\"r\"><b>FBIL</b><span>Financial Benchmarks India &mdash; administers the rupee interest rate and foreign exchange benchmarks</span></div>\n<div class=\"r\"><b>NSE and BSE</b><span>The two main exchanges, for equity and exchange-traded derivatives</span></div>\n<div class=\"r\"><b>FIMMDA and FEDAI</b><span>Industry bodies setting market conventions for debt and for foreign exchange</span></div>\n</div>\n<div class=\"note\">The RBI wearing three hats at once &mdash; monetary policy, banking supervision and debt manager of the borrower whose bonds it also regulates &mdash; is a genuine structural feature of the Indian market and a long-standing point of debate, not an accident of drafting.</div>"

    {
     "l": "MECHANISM",
     "t": "Long and short",
     "h": "Two directions, <em>asymmetric</em> risk",
     "b": "<p><strong>Long</strong> means owning it, and gaining when the price rises. <strong>Short</strong> means having sold something not owned, and gaining when the price falls.</p>\n<p>A short position in a cash instrument requires borrowing the security first, selling it, and buying it back later to return. In a derivative it requires nothing to be borrowed: the contract simply has two sides, and one of them profits from a fall.</p>\n<div class=\"sheet q\"><div class=\"h\">The asymmetry that matters</div>\n<div class=\"r\"><b>Long a share at ₹1,000</b><span>Maximum loss ₹1,000. It cannot go below zero. Gain is unbounded</span></div>\n<div class=\"r\"><b>Short a share at ₹1,000</b><span>Maximum gain ₹1,000. <strong>Loss is unbounded</strong> &mdash; the price can rise without limit</span></div>\n</div>\n<p>This is why short positions are margined harder, restricted more tightly, and capable of forcing a participant out of business in a way a long position rarely is. Being wrong on a long position makes it smaller. Being wrong on a short position makes it <em>bigger</em>, and demands more collateral precisely when it is hardest to find.</p>\n<p>In Indian government securities, short selling is permitted within limits set by the RBI &mdash; expressed as a percentage of the outstanding stock of the security or an absolute rupee cap, whichever is higher, with tighter limits on less liquid bonds.</p>\n<div class=\"note\">\"Long\" and \"short\" also describe risk rather than position. A treasury that has borrowed at floating rates and lent at fixed is short interest rates &mdash; it loses when rates rise &mdash; without having sold a single instrument.</div>"

     "b": "<p>The wrong belief: a bank with ₹50,000 crore of derivatives outstanding has ₹50,000 crore at risk.</p>\n<p>That figure is <span class=\"k\">notional</span> &mdash; the reference amount on which payments are calculated. On an interest rate swap, the notional is never exchanged by either party. It exists only to turn a rate difference into a rupee amount. Two parties swapping fixed against floating on ₹100 crore exchange the difference between two interest calculations, which might be ₹40 lakh a year.</p>\n<div class=\"dt\"><table>\n<tr><th>Measure</th><th>On a ₹100 crore 5-year swap</th><th>What it means</th></tr>\n<tr><td>Notional</td><td class=\"n\">₹100 crore</td><td class=\"g\">The calculation base. Never exchanged</td></tr>\n<tr><td>Annual cash flow</td><td class=\"n\">~₹40 lakh</td><td class=\"g\">The net payment when rates differ by 40 <span class=\"k\">basis points</span> &mdash; hundredths of one percent</td></tr>\n<tr class=\"hi\"><td>Current exposure</td><td class=\"n\">₹2.15 crore</td><td class=\"g\">What the counterparty would owe if they failed today</td></tr>\n<tr><td>Potential future exposure</td><td class=\"n\">₹0.50 crore</td><td class=\"g\">A regulatory estimate of how much worse that could get</td></tr>\n</table></div>\n<p><strong>Why it is a believable mistake.</strong> On a bond, the face value genuinely is the money at risk. The word \"notional\" reads like a synonym for face value, and on derivatives it is nothing of the kind. Global derivative notionals run to hundreds of trillions of dollars while the gross market value is a low single-digit percentage of that.</p>\n<div class=\"note\">Notional is still worth watching, because it bounds how large exposure could become and it scales with market activity. It is a measure of <em>volume</em>, not of risk, and the two get quoted interchangeably in headlines.</div>"

     "h": "A loan, written to be <em>handed on</em>",
     "b": "<p>A <span class=\"k\">bond</span> is a promise to pay fixed amounts on fixed dates. Three things define it and none of them change after issue:</p>\n<div class=\"sheet\"><div class=\"h\">Fixed at issue, permanently</div>\n<div class=\"r\"><b>Face value, or par</b><span>The amount repaid at the end. Indian government securities are issued in ₹100 face value units</span></div>\n<div class=\"r\"><b>Coupon</b><span>The interest rate paid on face value, on a stated schedule. Indian government securities pay half-yearly</span></div>\n<div class=\"r\"><b>Maturity</b><span>The date the face value comes back</span></div>\n</div>\n<p>Take the <strong>7.10% GS 2034</strong>: a government security paying 7.10% of ₹100 face value each year, in two instalments of ₹3.55, until 2034, when the ₹100 returns alongside the last coupon.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Today</b>Pay the market price. Not necessarily ₹100</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Every six months</b>Receive ₹3.55 per ₹100 of face value. Fixed, regardless of what the price has done</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>At maturity</b>Receive ₹100, plus the final coupon</div>\n</div>\n<p><strong>The coupon is a percentage of face value, never of the price paid.</strong> Buy at ₹95 and the ₹7.10 still arrives; the return is therefore higher than 7.10%. Buy at ₹105 and it is lower. That gap between the fixed coupon and the varying price is where the entire subject lives.</p>\n<div class=\"note\">A <span class=\"k\">zero-coupon</span> bond pays no interest at all and is sold below face value, the whole return being the climb to par. Treasury bills are the everyday example &mdash; and because there is only one cash flow, they are the cleanest thing to reason about.</div>"

     "l": "MECHANISM",
     "t": "The seesaw",
     "h": "Price and yield move <em>opposite</em>, always",
     "b": "<p>The cash flows are fixed. The only thing that can adjust when market interest rates change is <strong>the price someone will pay for them</strong>.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>A bond exists</b>Paying ₹7.10 a year on ₹100 face. Issued when 7.10% was the market rate, so it was worth ₹100</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Market rates rise to 8%</b>New bonds pay ₹8.00 a year. Nobody will pay ₹100 for ₹7.10</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>The price falls</b>Until buying at that lower price produces the same 8% return. The old bond is now worth about ₹94</div>\n</div>\n<p><span class=\"k\">Yield</span> is the return earned by buying at today's price and holding to maturity. It is not set by anyone. <strong>Yield is a consequence of the price, computed from it</strong> &mdash; the market trades price, and yield is how that price is quoted in comparable terms.</p>\n<div class=\"dt\"><table>\n<tr><th>Market yield</th><th>Price of a 7.10% bond</th><th>Called</th></tr>\n<tr><td class=\"n\">6.10%</td><td class=\"n\">Above ₹100</td><td class=\"g\">Trading at a <strong>premium</strong> &mdash; its coupon beats the market</td></tr>\n<tr class=\"hi\"><td class=\"n\">7.10%</td><td class=\"n\">Exactly ₹100</td><td class=\"g\">Trading at <strong>par</strong> &mdash; coupon equals market yield</td></tr>\n<tr><td class=\"n\">8.10%</td><td class=\"n\">Below ₹100</td><td class=\"g\">Trading at a <strong>discount</strong> &mdash; its coupon lags the market</td></tr>\n</table></div>\n<p>Hold to maturity and the price movement is irrelevant: the coupons and the ₹100 arrive as promised. <strong>But a bank marks its book to market</strong>, so a rate rise is a loss reported this quarter even where every rupee will eventually be received. That gap between economic outcome and reported outcome is one of the recurring tensions in a treasury.</p>\n<div class=\"note\">Interest rate risk and credit risk are separable and both are present. A rate rise hurts a bond that will certainly repay. A credit deterioration hurts a bond even when rates have not moved. Price falls the same way for either reason, and the two need different responses.</div>"

    {
     "l": "FORMULA",
     "t": "Pricing",
     "h": "The price <em>is</em> the discounted cash flows",
     "b": "<p>A bond's price is what its future payments are worth today. Money arriving later is worth less than money arriving now, so each payment is <span class=\"k\">discounted</span> &mdash; divided by growth at the market rate over the time until it arrives.</p>\n<div class=\"fx\"><div class=\"cap\">Price of a bond, discounting every cash flow at the yield</div>\n<div class=\"eq\"><em>P</em> = <span class=\"fr\"><i>C</i><i>(1 + y)<sup>1</sup></i></span> + <span class=\"fr\"><i>C</i><i>(1 + y)<sup>2</sup></i></span> + &hellip; + <span class=\"fr\"><i>C + F</i><i>(1 + y)<sup>n</sup></i></span></div>\n<div class=\"wh\"><em>P</em>&nbsp;&nbsp;the price today, per ₹100 of face value<br>\n<em>C</em>&nbsp;&nbsp;the coupon paid each period, in rupees per ₹100 of face<br>\n<em>F</em>&nbsp;&nbsp;the face value repaid at maturity, ₹100<br>\n<em>y</em>&nbsp;&nbsp;the yield per period, as a decimal &mdash; 6.76% is 0.0676<br>\n<em>n</em>&nbsp;&nbsp;the number of periods remaining until maturity</div></div>\n<p><span class=\"k\">Yield to maturity</span> is the single value of <em>y</em> that makes this equation give today's observed price. It cannot be rearranged and solved directly for more than one cash flow; it is found by trial, which every calculator and system does invisibly.</p>\n<p>Yield to maturity carries three assumptions, and all three are worth stating because each fails in some real situation:</p>\n<ul>\n<li><strong>The bond is held to maturity.</strong> Sell early and the realised return depends on the price then.</li>\n<li><strong>Every payment is made in full and on time.</strong> Yield to maturity on a distressed bond is a fiction &mdash; the number rises as the price collapses, which reads as an attractive return and is a signal of expected default.</li>\n<li><strong>Coupons are reinvested at the same yield.</strong> Rarely true, and less true the longer the bond.</li>\n</ul>\n<div class=\"note\">Indian government securities pay half-yearly, so the working convention uses a half-yearly period: <em>y</em> becomes the annual yield divided by two and <em>n</em> becomes twice the years remaining. The worked examples in this pack use annual periods for legibility; the mechanism is identical.</div>"

     "b": "<p>A bond paying a 7.00% annual coupon, five years remaining, ₹100 face, and the market yield is 6.76% &mdash; the level the ten-year government benchmark was trading at in August 2026.</p>\n<div class=\"wk\"><div class=\"h\">Each cash flow, discounted</div>\n<div class=\"r\"><b>Year 1 &mdash; ₹7.00 &divide; 1.0676</b><span>6.557</span></div>\n<div class=\"r\"><b>Year 2 &mdash; ₹7.00 &divide; 1.0676<sup>2</sup></b><span>6.142</span></div>\n<div class=\"r\"><b>Year 3 &mdash; ₹7.00 &divide; 1.0676<sup>3</sup></b><span>5.753</span></div>\n<div class=\"r\"><b>Year 4 &mdash; ₹7.00 &divide; 1.0676<sup>4</sup></b><span>5.388</span></div>\n<div class=\"r\"><b>Year 5 &mdash; ₹107.00 &divide; 1.0676<sup>5</sup></b><span>77.151</span></div>\n<div class=\"r tot\"><b>Price per ₹100 face value</b><span>₹100.99</span></div>\n</div>\n<p>The coupon of 7.00% exceeds the market yield of 6.76%, so the bond trades slightly above par. The premium of 99 paise is exactly what the extra 24 basis points of coupon are worth over five years, discounted.</p>\n<p><strong>Now move the yield and watch the price.</strong></p>\n<div class=\"dt\"><table>\n<tr><th>Yield</th><th>Price</th><th>Change from 6.76%</th></tr>\n<tr><td class=\"n\">5.76%</td><td class=\"n\">₹105.19</td><td class=\"g\">+4.16%</td></tr>\n<tr class=\"hi\"><td class=\"n\">6.76%</td><td class=\"n\">₹100.99</td><td class=\"g\">&mdash;</td></tr>\n<tr><td class=\"n\">7.76%</td><td class=\"n\">₹96.95</td><td class=\"g\">&minus;4.00%</td></tr>\n</table></div>\n<p>Two things are visible here that matter later. <strong>A 100 basis point move produces roughly a 4% price change on a five-year bond.</strong> That ratio &mdash; percentage price change per unit of yield change &mdash; is <span class=\"k\">duration</span>, developed in Mission 04. And <strong>the gain from a fall is larger than the loss from an equal rise</strong>: +4.16% against &minus;4.00%. That asymmetry, the bend in the price-yield relationship, is <span class=\"k\">convexity</span>, also Mission 04.</p>\n<div class=\"note\">The ₹4 lost on a ₹100 position from a 1% rate move is not a small number on a treasury book. On ₹1,000 crore of five-year bonds it is roughly ₹40 crore, from a rate move that happens in an ordinary quarter.</div>"

     "h": "Clean, dirty, and the interest that has <em>accrued</em>",
     "b": "<p>Coupons arrive twice a year, but bonds trade every day. A buyer settling four months into a coupon period is receiving the full six-month coupon in two months' time, including two months the seller held it. The seller is owed that portion.</p>\n<div class=\"sheet\"><div class=\"h\">The two prices, and which is which</div>\n<div class=\"r\"><b>Clean price</b><span>The quoted price. Excludes accrued interest. What screens and dealers show</span></div>\n<div class=\"r\"><b>Accrued interest</b><span>The coupon earned by the seller since the last payment, not yet received</span></div>\n<div class=\"r\"><b>Dirty price</b><span>Clean plus accrued. <strong>The amount actually paid on settlement</strong></span></div>\n</div>\n<div class=\"fx\"><div class=\"cap\">Accrued interest between coupon dates</div>\n<div class=\"eq\"><em>AI</em> = <em>C</em> &times; <span class=\"fr\"><i>days since last coupon</i><i>days in the coupon period</i></span></div>\n<div class=\"wh\"><em>AI</em>&nbsp;&nbsp;accrued interest, in rupees per ₹100 of face value<br>\n<em>C</em>&nbsp;&nbsp;the coupon amount for one full period<br>\ndays&nbsp;&nbsp;counted on the market's day-count convention &mdash; 30/360 for Indian government securities, actual/365 for money market instruments</div></div>\n<p>On the 7.10% GS 2034, a full half-yearly coupon is ₹3.55. Settle 120 days into a 180-day period and accrued interest is ₹3.55 &times; 120/180 = <strong>₹2.367</strong>. A clean price of ₹101.50 means ₹103.867 actually changes hands per ₹100 of face value.</p>\n<p><strong>Quotation is clean because a dirty price would drift upward every day and drop on each coupon date</strong>, purely from the calendar. Clean prices move only when the market moves, which makes them comparable across days and across bonds.</p>\n<div class=\"note\">Day-count conventions differ by instrument and by market, and getting one wrong misprices a trade by a few paise per ₹100 &mdash; which on ₹500 crore is a real number and the sort of difference that surfaces in a settlement break rather than in a trade blotter.</div>"

may not trade for weeks, so its \"price\" is a valuation from a curve rather than a level anyone dealt at.</div>"

     "l": "MECHANISM",
     "t": "The credit spread",
     "h": "What the extra yield is <em>paying for</em>",
     "b": "<p>A five-year government bond yields 6.60%. A five-year AAA corporate bond yields 7.55%. The 95 basis point difference is the <span class=\"k\">credit spread</span>.</p>\n<div class=\"fx\"><div class=\"cap\">Spread decomposed into what it compensates</div>\n<div class=\"eq\"><em>Spread</em> = <em>EL</em> + <em>UL premium</em> + <em>Liquidity premium</em></div>\n<div class=\"wh\"><em>EL</em>&nbsp;&nbsp;expected loss &mdash; probability of default multiplied by the share not recovered<br>\n<em>UL premium</em>&nbsp;&nbsp;compensation for the loss being uncertain rather than merely expected<br>\n<em>Liquidity premium</em>&nbsp;&nbsp;compensation for being harder to sell than a government bond</div></div>\n<p><strong>The expected loss component is usually the smallest of the three.</strong> A AAA issuer's one-year default probability is a few basis points, so on a five-year horizon expected loss might account for 10 to 20 basis points of a 95 basis point spread. The rest pays for uncertainty and for illiquidity.</p>\n<p>This matters because the two behave completely differently in stress. Expected loss changes slowly, as fundamentals deteriorate. <strong>The liquidity component can double in days</strong> when buyers step back, widening spreads and marking down portfolios on issuers whose credit has not changed at all.</p>\n<div class=\"sheet\"><div class=\"h\">Reading a spread widening</div>\n<div class=\"r\"><b>One issuer widens, peers do not</b><span>Credit-specific. Something has changed at that borrower</span></div>\n<div class=\"r\"><b>A whole rating band widens</b><span>Sector or systemic repricing of credit risk</span></div>\n<div class=\"r\"><b>Everything widens including government bonds</b><span>Not credit &mdash; that is rates or liquidity</span></div>\n</div>\n<div class=\"note\">State Development Loans yield above central government securities despite states rarely being allowed to fail, because the spread is mostly liquidity and eligibility, not default probability. A spread is not a pure credit signal until the liquidity component has been accounted for.</div>"

     "h": "The most attractive number on the screen is a <em>warning</em>",
     "b": "<p>The wrong belief: two bonds of similar maturity and rating, one yielding 8.2% and one 7.6%, means the first is better value.</p>\n<p>Yield rises as price falls, and price falls for reasons. A yield well above comparable bonds is the market saying one of three things: the credit has deteriorated and the rating has not caught up, the bond cannot be sold when needed, or it carries a feature &mdash; a call option held by the issuer, subordination, a step-down coupon &mdash; that has not been noticed.</p>\n<div class=\"sheet q\"><div class=\"h\">Three questions before treating extra yield as free</div>\n<div class=\"r\"><b>Compared with what?</b><span>Against the government bond of the same maturity, on the same day. An absolute yield says nothing</span></div>\n<div class=\"r\"><b>What is the spread paying for?</b><span>Expected loss, uncertainty, or illiquidity. Only the first is about the borrower</span></div>\n<div class=\"r\"><b>Who holds the options?</b><span>A callable bond is redeemed when rates fall &mdash; the good outcome is taken away, the bad one is kept</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> Yield to maturity genuinely is the return, if every payment arrives. The calculation is correct; it is the assumption underneath it that fails. On a bond heading for default, the computed yield goes <em>up</em> as the situation gets worse, so the screen becomes more attractive precisely as the investment becomes less so.</p>\n<div class=\"note\">The disciplined comparison is always spread over the government curve at the same maturity, never yield against yield. Two bonds a year apart in maturity are not comparable on yield when the curve has any slope, which it always does.</div>"

     "b": "<ul>\n<li><strong>Face value, coupon and maturity are fixed at issue.</strong> Price is the only thing that can adjust, which is why price and yield move opposite.</li>\n<li><strong>Yield is computed from price, not set.</strong> Coupon above market yield means a premium; below means a discount.</li>\n<li><strong>Price is the sum of discounted cash flows</strong>, and yield to maturity is the single discount rate that reproduces today's price.</li>\n<li><strong>Yield to maturity assumes hold to maturity, full payment, and reinvestment at the same rate.</strong> All three fail somewhere.</li>\n<li><strong>Clean price is quoted; dirty price is paid.</strong> The difference is accrued interest, computed on a day-count convention.</li>\n<li><strong>A 100 basis point move costs roughly 4% on a five-year bond</strong>, and the gain from a fall slightly exceeds the loss from an equal rise.</li>\n<li><strong>A credit spread pays for expected loss, uncertainty and illiquidity</strong> &mdash; and expected loss is usually the smallest part.</li>\n<li><strong>Unusually high yield is a warning, not a bargain.</strong> Compare spread over the government curve at the same maturity.</li>\n</ul>"

    {
     "l": "ORIENT",
     "t": "One issuer, many yields",
     "h": "The same borrower pays different rates by <em>maturity</em>",
     "b": "<p>The central government issues securities from two years to forty years. All carry the same credit standing &mdash; the same borrower, the same currency, the same guarantee. Yet each maturity trades at its own yield.</p>\n<p>Plot yield against maturity and the result is the <span class=\"k\">yield curve</span>. Because credit is held constant, the shape isolates one thing: <strong>what the market believes about the path of interest rates, and what it charges for committing money over longer periods.</strong></p>\n<div class=\"dt\"><table>\n<tr><th>Maturity</th><th>Illustrative yield</th><th>Spread over 1 year</th></tr>\n<tr><td>1 year</td><td class=\"n\">5.85%</td><td class=\"g\">&mdash;</td></tr>\n<tr><td>3 years</td><td class=\"n\">6.25%</td><td class=\"g\">+40 bp</td></tr>\n<tr><td>5 years</td><td class=\"n\">6.48%</td><td class=\"g\">+63 bp</td></tr>\n<tr class=\"hi\"><td>10 years</td><td class=\"n\">6.76%</td><td class=\"g\">+91 bp</td></tr>\n<tr><td>30 years</td><td class=\"n\">7.05%</td><td class=\"g\">+120 bp</td></tr>\n</table></div>\n<p>A <span class=\"k\">basis point</span> is one hundredth of one percent. It is the unit of the entire fixed income market, because the moves that matter are small in percentage terms and large in rupees: 91 basis points is 0.91%.</p>\n<p><strong>The curve is the reference for everything else.</strong> A corporate bond is quoted as a spread over it. A swap is priced off it. A loan is benchmarked to it. When the curve moves, every rupee-denominated instrument reprices, whether or not it trades.</p>\n<div class=\"note\">The ten-year point is treated as <em>the</em> yield because it is the most heavily traded and the most quoted. It is one point on a line, and a book with no ten-year exposure can still lose money on a day the ten-year is unchanged.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "How it is built",
     "h": "From traded prices, then <em>fitted</em>",
     "b": "<p>The curve is not published by anyone as a decision. It is derived from prices at which government securities actually trade, and then smoothed, because not every maturity has a bond and not every bond trades.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1. Observe</b>Traded prices and quotes for government securities across maturities, from the order-matching platform.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>2. Convert</b>Each price becomes a yield to maturity, using the discounting of Mission 02.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>3. Fit</b>A smooth curve is fitted through the points, since maturities are uneven and some bonds are illiquid.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>4. Publish</b>FBIL publishes the daily valuation curve. Every institution marks its portfolio against the same published levels.</div>\n</div>\n<p><strong>Step 4 is a regulatory device as much as a market one.</strong> If each bank fitted its own curve, two banks holding identical bonds would report different values, and neither could be challenged. A single published curve makes valuations comparable and auditable &mdash; and makes the curve's methodology a matter of genuine consequence.</p>\n<div class=\"two\">\n<div><b>On-the-run</b>The most recently issued security at a given maturity. Liquid, tightly quoted, the reference point.</div>\n<div><b>Off-the-run</b>Older securities of similar maturity. Less liquid, and they usually yield a few basis points more for that reason alone.</div>\n</div>\n<div class=\"note\">The on-the-run against off-the-run gap is a liquidity premium hiding inside what looks like a pure government curve. It widens in stress, which means a portfolio of older bonds marks down against the benchmark even when nothing about government credit has changed.</div>"

    {
     "l": "PICTURE",
     "t": "Four shapes",
     "h": "What the line can <em>look like</em>",
     "b": "<div class=\"dt\"><table>\n<tr><th>Shape</th><th>Description</th><th>Usually indicates</th></tr>\n<tr class=\"hi\"><td><strong>Normal</strong></td><td>Rising &mdash; longer maturities yield more</td><td class=\"g\">The ordinary state. Compensation for tying money up longer</td></tr>\n<tr><td><strong>Steep</strong></td><td>Rising sharply</td><td class=\"g\">Expected growth or inflation, or heavy government borrowing at the long end</td></tr>\n<tr><td><strong>Flat</strong></td><td>Similar yields across maturities</td><td class=\"g\">A turning point. The market cannot decide the direction</td></tr>\n<tr><td><strong>Inverted</strong></td><td>Falling &mdash; short maturities yield more than long</td><td class=\"g\">Policy is tight now and expected to ease. Rare, and closely watched</td></tr>\n</table></div>\n<div class=\"bars\">\n<div><b>Normal &mdash; 1y 5.85, 5y 6.48, 10y 6.76, 30y 7.05</b><div class=\"tr\"><i class=\"b\" style=\"width:58%\"></i></div></div>\n<div><b>Steep &mdash; 1y 5.40, 5y 6.60, 10y 7.30, 30y 7.90</b><div class=\"tr\"><i class=\"c\" style=\"width:82%\"></i></div></div>\n<div><b>Flat &mdash; 1y 6.60, 5y 6.65, 10y 6.70, 30y 6.72</b><div class=\"tr\"><i class=\"d\" style=\"width:22%\"></i></div></div>\n<div><b>Inverted &mdash; 1y 7.20, 5y 6.90, 10y 6.70, 30y 6.60</b><div class=\"tr\"><i style=\"width:12%\"></i></div></div>\n</div>\n<p><strong>The short end and the long end are driven by different forces.</strong> The short end tracks the policy rate closely, because a one-year yield is largely an average of expected overnight rates over the next year, and the central bank sets those. The long end is driven by expectations of inflation and growth, by the supply of government borrowing, and by who is buying &mdash; insurers and pension funds have long liabilities and structural demand for long bonds.</p>\n<p>Because they are driven separately, the curve can steepen with the short end falling, or with the long end rising, or both. <strong>\"Rates went up\" is not a description of anything until the part of the curve is named.</strong></p>\n<div class=\"note\">India's curve has been persistently upward sloping, and its long end is heavily shaped by the supply of central and state government issuance, which is large and known in advance from a published borrowing calendar.</div>"
    },
    {
     "l": "FORMULA",
     "t": "Spot and forward",
     "h": "The rate the curve <em>implies</em> for a future period",
     "b": "<p>A <span class=\"k\">spot rate</span> is the rate for money lent from today until a stated future date. A <span class=\"k\">forward rate</span> is the rate for money lent between two future dates &mdash; and it is not a forecast anyone publishes. It is arithmetic, forced by the requirement that two routes to the same endpoint cannot pay differently.</p>\n<p>Lending for two years must produce the same result as lending for one year and reinvesting for the second. If it did not, one route would be free money.</p>\n<div class=\"fx\"><div class=\"cap\">The forward rate implied between year 1 and year 2</div>\n<div class=\"eq\">(1 + <em>z</em><sub>2</sub>)<sup>2</sup> = (1 + <em>z</em><sub>1</sub>) &times; (1 + <em>f</em>)</div>\n<div class=\"wh\"><em>z</em><sub>1</sub>&nbsp;&nbsp;the spot rate for one year, as a decimal<br>\n<em>z</em><sub>2</sub>&nbsp;&nbsp;the spot rate for two years, as a decimal<br>\n<em>f</em>&nbsp;&nbsp;the implied forward rate for the second year alone</div></div>\n<div class=\"fx\"><div class=\"cap\">Rearranged for the forward rate</div>\n<div class=\"eq\"><em>f</em> = <span class=\"fr\"><i>(1 + z<sub>2</sub>)<sup>2</sup></i><i>1 + z<sub>1</sub></i></span> &minus; 1</div>\n<div class=\"wh\">The same structure extends to any pair of dates: divide the longer compounded rate by the shorter one, and take the root over the number of years between them</div></div>\n<p><strong>The forward rate is what the market has already priced in.</strong> That makes it the correct benchmark for a view: believing rates will be 6.70% in a year is not a view if the curve already implies 6.70%. It is a view only when it differs from the forward.</p>\n<div class=\"note\">Forward rates are what the floating leg of an interest rate swap is valued against, and what a bond forward is priced from. They are not a prediction with a track record &mdash; they are the level at which no arbitrage exists today.</div>"
    },
    {
     "l": "WORKED",
     "t": "An implied forward",
     "h": "What the curve says about <em>next year</em>",
     "b": "<p>The one-year spot rate is 6.20%. The two-year spot rate is 6.45%. What rate is the market implying for the second year alone?</p>\n<div class=\"wk\"><div class=\"h\">Step by step</div>\n<div class=\"r\"><b>Grow ₹100 for two years at 6.45%</b><span>&times; 1.0645<sup>2</sup></span></div>\n<div class=\"r\"><b>Two-year growth factor</b><span>1.13316</span></div>\n<div class=\"r\"><b>Grow ₹100 for one year at 6.20%</b><span>&times; 1.0620</span></div>\n<div class=\"r\"><b>Divide: the second year alone</b><span>1.13316 &divide; 1.0620</span></div>\n<div class=\"r tot\"><b>Implied one-year rate, one year forward</b><span>6.70%</span></div>\n</div>\n<p>Check it: ₹100 at 6.20% becomes ₹106.20 after one year. That ₹106.20 at 6.70% becomes ₹113.32 after the second. ₹100 at 6.45% for two years becomes ₹113.32. <strong>The two routes match exactly, which is the condition that produced the number.</strong></p>\n<p>What this means in practice: the curve rising from 6.20% to 6.45% is saying the market expects one-year money to cost 6.70% a year from now &mdash; 50 basis points above today. Someone who believes rates will be unchanged at 6.20% should lend long, not short, because the long route pays for a rise that they think will not happen.</p>\n<div class=\"note\">A rising curve always implies forward rates above today's spot rates. That is arithmetic, not sentiment. It means a normal curve is permanently \"predicting\" rate rises &mdash; and historically, forward rates have been a poor predictor of realised rates, which is itself evidence that part of the slope is a risk premium rather than a forecast.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Carry and rolldown",
     "h": "Two ways to earn from a curve that <em>does not move</em>",
     "b": "<p>If the curve stays exactly where it is for a year, a bond position still makes money. Two separate effects, routinely confused.</p>\n<div class=\"two\">\n<div><b>Carry</b>The coupon earned, less the cost of funding the position. Hold a bond yielding 6.76% funded at 5.30% overnight, and the carry is 146 basis points a year.</div>\n<div><b>Rolldown</b>As time passes, a ten-year bond becomes a nine-year bond. If the curve is upward sloping, nine-year yields are lower than ten-year yields &mdash; so the bond is now valued at a lower yield, which means a <strong>higher price</strong>.</div>\n</div>\n<div class=\"wk\"><div class=\"h\">A year of rolldown on a 10-year bond, curve unchanged</div>\n<div class=\"r\"><b>Bought at the 10-year yield</b><span>6.76%</span></div>\n<div class=\"r\"><b>One year later, it is a 9-year bond</b><span>Curve unchanged</span></div>\n<div class=\"r\"><b>The 9-year point on that same curve</b><span>6.70%</span></div>\n<div class=\"r\"><b>Yield falls by</b><span>6 bp</span></div>\n<div class=\"r\"><b>Duration of the bond, now 9 years</b><span>~6.6</span></div>\n<div class=\"r tot\"><b>Price gain from rolldown alone</b><span>~0.40%</span></div>\n</div>\n<p><strong>Carry and rolldown together are why a steep curve is profitable to sit in</strong>, and why crowded positions build up in exactly the maturities where the curve is steepest. It is also why those positions unwind violently: everyone is earning the same carry the same way, and a rate move forces them all out at once.</p>\n<div class=\"note\">Carry is a real cash flow. Rolldown is a valuation effect that only becomes cash on sale. Both are legitimate; conflating them overstates how much of a return is actually banked.</div>"
    },
    {
     "l": "TRAP",
     "t": "Reading inversion",
     "h": "An inverted curve does not <em>cause</em> anything",
     "b": "<p>The wrong belief: an inverted yield curve is a reliable recession indicator, so inversion means a recession is coming.</p>\n<p>Inversion is a statement about expectations, not a mechanism. The curve inverts when the market expects the policy rate to be <em>lower</em> in future than it is now &mdash; which usually means the central bank is holding rates high to control inflation and is expected to cut once that is achieved. The forecast is embedded in prices; the curve is the thermometer, not the illness.</p>\n<div class=\"sheet q\"><div class=\"h\">Three reasons the signal is weaker than it looks</div>\n<div class=\"r\"><b>The lag is long and variable</b><span>Historical intervals between inversion and downturn have run from several months to over two years. A signal with that spread is hard to act on</span></div>\n<div class=\"r\"><b>The evidence base is thin</b><span>The much-cited record rests on a small number of episodes in a small number of economies, mostly the United States</span></div>\n<div class=\"r\"><b>The long end has other drivers</b><span>Heavy central bank bond buying, regulatory demand from insurers, and index-driven flows all push long yields down for reasons unrelated to growth expectations</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> The historical association is genuine and striking, and a single number that appears to forecast recessions is exactly what anyone would want. The error is treating a correlation drawn from a handful of episodes as a mechanism that must operate again.</p>\n<div class=\"note\">For a bank, inversion has an immediate and concrete meaning that has nothing to do with forecasting: borrowing short and lending long stops being profitable. That is a balance sheet fact today, not a prediction about next year.</div>"

     "b": "<p>The clearing corporation and FBIL between them publish the traded volumes, the zero-coupon and par curves used for valuation, and the forward premia and swap curves that the derivative markets are struck against.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.ccilindia.com/documents/d/ccil/Clearing_Corporation_of_India_Limited%20Annual-pdf\" target=\"_blank\" rel=\"noopener\">The Clearing Corporation of India &mdash; Factbook, including the valuation and benchmark curves published daily</a>\n<a href=\"https://www.bis.org/review/r221201d.pdf\" target=\"_blank\" rel=\"noopener\">Reserve Bank of India &mdash; Financial Benchmarks in India: A Coming of Age, Deputy Governor's address on benchmark administration</a></div>\n<div class=\"note\">Curve methodology is not a neutral technical detail. A change to how illiquid points are interpolated moves the published valuation of every portfolio marked against it, without a single trade taking place.</div>"

     "b": "<ul>\n<li><strong>The curve holds credit constant and varies maturity</strong>, isolating rate expectations and the premium for lending long.</li>\n<li><strong>It is derived from traded prices, then fitted and published</strong> &mdash; a single published curve is what makes valuations comparable across institutions.</li>\n<li><strong>On-the-run trades tighter than off-the-run</strong>, so a liquidity premium sits inside an apparently pure government curve.</li>\n<li><strong>Four shapes.</strong> The short end tracks policy; the long end tracks inflation, growth and supply. They move separately.</li>\n<li><strong>Forward rates are arithmetic, not forecasts</strong> &mdash; forced by two routes to the same endpoint paying alike.</li>\n<li><strong>A view is only a view when it differs from the forward</strong>, because the forward is already in the price.</li>\n<li><strong>Carry is coupon less funding; rolldown is the price gain from ageing down a sloping curve.</strong> Only carry is cash.</li>\n<li><strong>Inversion is a thermometer, not a mechanism</strong>, and its forecasting record rests on few episodes.</li>\n</ul>"
