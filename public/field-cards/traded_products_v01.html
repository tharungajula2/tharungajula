    {
     "l": "MECHANISM",
     "t": "Offshore",
     "h": "The market that settles in <em>dollars</em>",
     "b": "<p>The rupee is not fully convertible: moving it across borders is subject to regulation. That creates demand from parties who want rupee exposure without touching the Indian system, and the <span class=\"k\">non-deliverable forward</span> is how it is met.</p>\n<p>A non-deliverable forward fixes a rupee rate for a future date, but <strong>no rupees are ever exchanged</strong>. At maturity the difference between the agreed rate and a published reference rate is settled in dollars. The rupee never moves; only the profit or loss on it does.</p>\n<div class=\"two\">\n<div><b>Onshore</b>Traded in India under RBI rules, settled in rupees, participants and purposes defined by regulation.</div>\n<div><b>Offshore &mdash; the NDF market</b>Traded in Singapore, London, Dubai and elsewhere, settled in dollars, outside the reach of Indian rules.</div>\n</div>\n<p>The two prices should be equal and are not always. <strong>The gap between the onshore forward and the offshore non-deliverable rate is a stress indicator</strong> &mdash; it widens when offshore participants expect depreciation that onshore regulation is restraining, and it has repeatedly been the first place pressure on the rupee becomes visible.</p>\n<p>India's response has been to bring the two closer rather than to fight the offshore market. Banks operating from the International Financial Services Centre at GIFT City were permitted to deal in rupee non-deliverable derivatives, and access was subsequently widened &mdash; the September 2025 update to the inter-bank dealings framework extended it to standalone primary dealers authorised as Category-III authorised dealers.</p>\n<div class=\"note\">A price that exists offshore and cannot be influenced onshore is a genuine policy problem: it sets expectations, it is quoted to the same clients, and it is outside any domestic rulebook. Bringing the activity inside a domestic jurisdiction is the standard answer.</div>"

     "b": "<p>Foreign exchange in India operates under the Foreign Exchange Management Act, with the RBI issuing directions to authorised dealers. The framework rests on one organising principle: <strong>derivatives are permitted to hedge exposure, and exposure must be demonstrable.</strong></p>\n<div class=\"flow\">\n<div class=\"n\"><b>FEMA, 1999</b>The statute. Sets what is permissible in principle for current and capital account transactions.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Regulations under FEMA</b>Define categories of transaction and their conditions.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Master Direction &mdash; Risk Management and Inter-Bank Dealings</b>The operating rules for authorised dealers: which products, which users, what documentation.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>A.P. (DIR Series) circulars</b>Amendments issued continuously. The current position is the Master Direction as amended, not any single circular.</div>\n</div>\n<p>The framework introduced from 5 April 2024 consolidated the directions covering cash, tom, spot and forward transactions, and set out the conditions for foreign exchange derivatives including dealings with non-resident users.</p>\n<div class=\"sheet g\"><div class=\"h\">The two routes, and what separates them</div>\n<div class=\"r\"><b>Over the counter, through an authorised dealer bank</b><span>Flexible amounts and dates. Bank verifies the underlying exposure and holds the documentation</span></div>\n<div class=\"r\"><b>Exchange-traded currency derivatives</b><span>Standardised contracts on recognised exchanges. Centrally cleared, no counterparty credit risk to the bank</span></div>\n</div>\n<p>The exchange-traded route carried a long-standing facility to take positions up to a limit without establishing an underlying exposure, on the basis of a declaration. <strong>The RBI reiterated in January 2024 that participation requires a valid contracted exposure</strong>, with the requirement taking effect in the following months &mdash; a change that reduced activity in that segment materially and clarified that the exchange route is a hedging facility rather than a retail trading venue.</p>\n<div class=\"note\">The practical consequence for anyone specifying a system or a control: the underlying exposure is not a form field to be ticked. It is a document that must exist, be dated, be of sufficient size, and be re-tested as the hedge runs.</div>"

     "t": "Hedging an import",
     "h": "A million dollars, three months <em>out</em>",
     "b": "<p>A manufacturer has contracted to pay $1,000,000 in three months for imported machinery. Spot is 95.50; the three-month forward is 95.96.</p>\n<div class=\"dt\"><table>\n<tr><th>Rupee cost at maturity</th><th>Unhedged</th><th>Hedged at 95.96</th></tr>\n<tr><td>Rupee weakens to 99.00</td><td class=\"n\">₹9.90 crore</td><td class=\"n\">₹9.596 crore</td></tr>\n<tr class=\"hi\"><td>Rupee at 95.96</td><td class=\"n\">₹9.596 crore</td><td class=\"n\">₹9.596 crore</td></tr>\n<tr><td>Rupee strengthens to 92.00</td><td class=\"n\">₹9.20 crore</td><td class=\"n\">₹9.596 crore</td></tr>\n</table></div>\n<div class=\"wk\"><div class=\"h\">What the hedge did</div>\n<div class=\"r\"><b>Worst case avoided, at 99.00</b><span>₹30.4 lakh saved</span></div>\n<div class=\"r\"><b>Best case forgone, at 92.00</b><span>₹39.6 lakh given up</span></div>\n<div class=\"r tot\"><b>Certainty obtained</b><span>Cost fixed at ₹9.596 crore</span></div>\n</div>\n<p><strong>The forward removed the uncertainty in both directions.</strong> That is not a defect of the instrument; it is the instrument. The manufacturer's business is making machinery products, not taking a view on the rupee, and a known cost lets the product be priced.</p>\n<p>The alternative is an option: buy a three-month call on the dollar at 95.96, paying premium. That caps the cost while leaving the gain from a stronger rupee intact &mdash; Mission 07's bend, applied here. It costs money upfront, and whether that is worth paying depends on whether the exposure is certain.</p>\n<div class=\"sheet\"><div class=\"h\">Which instrument, and when</div>\n<div class=\"r\"><b>Exposure is certain</b><span>Forward. Cheaper, and there is nothing to protect the upside for</span></div>\n<div class=\"r\"><b>Exposure is contingent</b><span>Option. A tender that may not be won should not create an obligation that certainly exists</span></div>\n<div class=\"r\"><b>Exposure is recurring</b><span>A programme of layered hedges rather than a single deal, so no one rate dominates the year</span></div>\n</div>\n<div class=\"note\">The classic failure is hedging a contingent exposure with a forward. The tender is lost, the underlying disappears, and the forward remains as a naked currency position that nobody chose to take &mdash; Mission 06's trap, arriving through the front door.</div>"

     "l": "WHY",
     "t": "Credit from nowhere",
     "h": "A winning trade is an <em>unsecured loan</em>",
     "b": "<p>Buy a bond for cash and settlement ends the relationship. The seller could fail the next morning and it would not matter.</p>\n<p>Enter a five-year swap and the relationship lasts five years. From Mission 06: rates rose 50 basis points and the swap is worth ₹2.15 crore. <strong>That ₹2.15 crore is owed by the counterparty and has not been paid.</strong> It is an unsecured claim on them, created by a market move, on a contract that cost nothing to enter.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Day one</b>The swap is worth zero to both sides. No exposure exists.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Rates move</b>The swap becomes an asset to one side and a liability to the other. Exposure appears, created by the market rather than by any decision.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>The counterparty fails</b>The contract is closed out at market value. If it was worth ₹2.15 crore, that is the claim &mdash; ranking with other unsecured creditors.</div>\n</div>\n<p>Three features make this different from ordinary credit risk, and each of them is why the subject needs its own machinery:</p>\n<ul>\n<li><strong>It is bilateral.</strong> Either party may be the one exposed, and it can switch during the life of the trade.</li>\n<li><strong>It is uncertain in size.</strong> A loan's exposure is the amount lent. A derivative's exposure is unknown until the market decides it.</li>\n<li><strong>It correlates with the market.</strong> The move that makes the position valuable may be the same move that damaged the counterparty. Exposure peaks exactly when the counterparty is least able to pay &mdash; which is called wrong-way risk.</li>\n</ul>\n<div class=\"note\">This is why the 2008 crisis was a derivatives crisis as much as a housing one. Institutions had large bilateral exposures that were invisible in aggregate, uncollateralised, and concentrated in a few names whose failure would have crystallised all of them at once.</div>"

     "h": "What is owed now, and what <em>could be</em>",
     "b": "<p>Measuring derivative credit risk requires two numbers, because today's value is not the risk.</p>\n<div class=\"two\">\n<div><b>Current exposure</b>The mark-to-market value, floored at zero. What would be lost if the counterparty failed today. Observable and exact.</div>\n<div><b>Potential future exposure</b>An estimate of how much worse the current exposure could become before the contract matures. Not observable &mdash; modelled or prescribed.</div>\n</div>\n<p><strong>Current exposure is floored at zero because a losing position is not a credit risk.</strong> Owing ₹2 crore to a counterparty who fails does not create a loss; it creates an obligation that still has to be met. Only a positive value is at risk.</p>\n<div class=\"dt\"><table>\n<tr><th>Position</th><th>Mark to market</th><th>Current exposure</th></tr>\n<tr class=\"hi\"><td>Swap A, in the money</td><td class=\"n\">+₹2.15 crore</td><td class=\"n\">₹2.15 crore</td></tr>\n<tr><td>Swap B, out of the money</td><td class=\"n\">&minus;₹0.90 crore</td><td class=\"n\">₹0 &mdash; not a credit risk</td></tr>\n<tr><td>Forward C, in the money</td><td class=\"n\">+₹0.40 crore</td><td class=\"n\">₹0.40 crore</td></tr>\n</table></div>\n<p>Potential future exposure exists because a five-year contract has five years left in which to move. A swap worth zero today could be worth ₹5 crore in two years. <strong>Capital has to be held against what the exposure might become, not only against what it is</strong>, or the capital would fall to zero on the day every position happened to be flat.</p>\n<div class=\"note\">The two numbers behave differently over the life of a trade. Current exposure wanders with the market. Potential future exposure declines as maturity approaches, because there is less remaining time in which to move.</div>"

     "l": "FORMULA",
     "t": "The Current Exposure Method",
     "h": "Replacement cost plus an <em>add-on</em>",
     "b": "<p>The regulatory calculation used to turn a derivative into an exposure figure for capital purposes has a simple structure: what it is worth now, plus a prescribed allowance for what it might become.</p>\n<div class=\"fx\"><div class=\"cap\">Exposure under the Current Exposure Method</div>\n<div class=\"eq\"><em>EAD</em> = <em>RC</em> + <em>PFE</em> &nbsp;&nbsp;&nbsp; where &nbsp; <em>PFE</em> = &Sigma; ( <em>Notional</em><sub>i</sub> &times; <em>a</em><sub>i</sub> )</div>\n<div class=\"wh\"><em>EAD</em>&nbsp;&nbsp;exposure at default &mdash; the figure a risk weight is applied to<br>\n<em>RC</em>&nbsp;&nbsp;replacement cost &mdash; the current mark-to-market value, floored at zero<br>\n<em>PFE</em>&nbsp;&nbsp;potential future exposure &mdash; the add-on for possible future movement<br>\n<em>Notional</em><sub>i</sub>&nbsp;&nbsp;the notional amount of each contract<br>\n<em>a</em><sub>i</sub>&nbsp;&nbsp;the prescribed add-on factor, depending on asset class and remaining maturity</div></div>\n<p>The add-on factors are set by the regulator, not modelled by the bank. They rise with remaining maturity, because a longer contract has more time to move, and they differ sharply by asset class &mdash; interest rate contracts move less than equity or commodity contracts over the same period.</p>\n<div class=\"dt\"><table>\n<tr><th>Residual maturity</th><th>Interest rate</th><th>Foreign exchange and gold</th><th>Equity</th></tr>\n<tr><td>Up to 1 year</td><td class=\"n\">0.0%</td><td class=\"n\">1.0%</td><td class=\"n\">6.0%</td></tr>\n<tr class=\"hi\"><td>1 to 5 years</td><td class=\"n\">0.5%</td><td class=\"n\">5.0%</td><td class=\"n\">8.0%</td></tr>\n<tr><td>Over 5 years</td><td class=\"n\">1.5%</td><td class=\"n\">7.5%</td><td class=\"n\">10.0%</td></tr>\n</table></div>\n<div class=\"note\">The figures above are the long-standing Basel grid, shown to illustrate the shape and the relative magnitudes. <strong>The factors applying in India were revised in March 2026</strong> &mdash; the next card but one. Any live calculation must use the current prescribed table, not this illustration.</div>"

     "b": "<div class=\"stamp\">Collected 19 Aug 2026</div>\n<p>Internationally, the Basel Committee replaced the Current Exposure Method with the <span class=\"k\">Standardised Approach for Counterparty Credit Risk</span> &mdash; SA-CCR &mdash; finalised in 2014. SA-CCR distinguishes margined from unmargined trades, recognises netting more fully, and applies an alpha multiplier to the sum of replacement cost and potential future exposure. Many jurisdictions have implemented it.</p>\n<div class=\"dt\"><table>\n<tr><th>Item</th><th>Position</th></tr>\n<tr class=\"hi\"><td><strong>India's counterparty exposure method</strong></td><td class=\"g\"><strong>The Current Exposure Method</strong> &mdash; not SA-CCR</td></tr>\n<tr><td>Most recent change</td><td class=\"g\">RBI Amendment Directions dated 10 March 2026, following a draft of 20 August 2025 and consultation closing 10 September 2025</td></tr>\n<tr><td>What changed</td><td class=\"g\">Add-on factors for potential future exposure realigned with Basel Committee guidelines &mdash; lowered for interest rate and foreign exchange contracts, raised for some long-dated equity and commodity contracts</td></tr>\n<tr><td>Also clarified</td><td class=\"g\">Banks acting as clearing members in equity and commodity derivative segments of recognised exchanges must hold capital for counterparty credit risk</td></tr>\n<tr><td>Consolidation requirement</td><td class=\"g\">Counterparty exposures of all entities consolidated under Basel III must be included when computing capital on a consolidated basis</td></tr>\n</table></div>\n<p><strong>The practical consequence is that an Indian counterparty credit calculation is a replacement cost plus a notional-times-factor add-on</strong>, with the factor table taken from the current RBI Directions. A specification written to SA-CCR would not match the Indian rulebook.</p>\n<div class=\"src\">RBI Amendment Directions on Counterparty Credit Risk &mdash; add-on factors for computation of Potential Future Exposure, 10 March 2026. Basel Committee standard BCBS 279 for the SA-CCR comparison.</div>\n<div class=\"note\">This is the single most checkable fact in this mission and the one most often assumed rather than verified. Convergence toward the Basel approach is happening through the add-on factors rather than through adoption of the method, and that distinction matters to anyone writing a calculation.</div>"

    {
     "l": "MECHANISM",
     "t": "Netting",
     "h": "Many contracts, <em>one</em> claim",
     "b": "<p>Two parties with fifty contracts between them, some in the money and some out, could in principle face a liquidator who enforces the profitable ones and disclaims the rest. That is <span class=\"k\">cherry-picking</span>, and it would make every gross position an exposure.</p>\n<p><span class=\"k\">Close-out netting</span> prevents it. A master agreement provides that on default all contracts terminate at once, are valued, and collapse into a single net amount owed one way.</p>\n<div class=\"wk\"><div class=\"h\">Gross against net, on one counterparty</div>\n<div class=\"r\"><b>Contracts in the money</b><span>+₹18 crore</span></div>\n<div class=\"r\"><b>Contracts out of the money</b><span>&minus;₹14 crore</span></div>\n<div class=\"r tot\"><b>Gross exposure, without netting</b><span>₹18 crore</span></div>\n<div class=\"r tot\"><b>Net exposure, with enforceable netting</b><span>₹4 crore</span></div>\n</div>\n<p>The reduction is typically very large across a real portfolio, and it flows straight into capital. <strong>But it only counts if netting is legally enforceable in the counterparty's jurisdiction on insolvency</strong> &mdash; not merely written into the contract. A netting clause that a local court would set aside is worth nothing for capital purposes.</p>\n<p><strong>India resolved this with the Bilateral Netting of Qualified Financial Contracts Act, 2020.</strong> Before it, the enforceability of close-out netting against an Indian counterparty in insolvency was uncertain, so exposures had to be measured gross &mdash; consuming capital, constraining market size, and making Indian counterparties expensive to trade with. The Act made netting enforceable for qualified financial contracts and materially changed the economics.</p>\n<div class=\"note\">Netting sets are defined by the legal agreement, not by convenience. Contracts under different master agreements, or in jurisdictions where enforceability is not established, sit in separate netting sets and cannot be offset against each other however similar they look.</div>"

     "t": "Collateral",
     "h": "Turning an exposure into a <em>secured</em> one",
     "b": "<p>Netting reduces the exposure. Collateral covers what remains. Under a credit support annex to the master agreement, the party that is out of the money posts assets to the party that is in.</p>\n<div class=\"two\">\n<div><b>Variation margin</b>Posted to cover the <em>current</em> exposure, exchanged daily as the mark to market moves. Cash, typically. It settles the profit and loss.</div>\n<div><b>Initial margin</b>Posted at the outset to cover <em>potential future</em> exposure &mdash; the move that could occur between the last exchange and the close-out. Held segregated, not used.</div>\n</div>\n<div class=\"sheet\"><div class=\"h\">The terms that decide how much protection there really is</div>\n<div class=\"r\"><b>Threshold</b><span>Exposure below this is not collateralised at all. A threshold of ₹10 crore means the first ₹10 crore is unsecured</span></div>\n<div class=\"r\"><b>Minimum transfer amount</b><span>Movements below this are not called, to avoid trivial transfers. A second small uncovered band</span></div>\n<div class=\"r\"><b>Eligible collateral and haircuts</b><span>What may be posted, and at what discount to market value</span></div>\n<div class=\"r\"><b>Frequency</b><span>Daily is standard. Weekly leaves a week of movement uncovered</span></div>\n</div>\n<p><strong>A collateralised exposure is not a zero exposure.</strong> The threshold, the minimum transfer amount, the haircut and the gap between the last successful margin call and close-out all leave residual risk &mdash; and that residual is precisely what initial margin is sized to cover.</p>\n<p>India brought this into rule with the Margining for Non-Centrally Cleared OTC Derivatives Directions of 2024, extending mandatory margining beyond the cleared market. The direction of travel internationally has been consistent: <strong>collateralise everything, clear what can be cleared, and hold capital against the rest.</strong></p>\n<div class=\"note\">Collateral converts credit risk into liquidity risk. A firm that must post ₹200 crore of variation margin overnight has no credit loss and may still fail, because it cannot find the cash by morning. That trade is a good one and the firm is gone.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Central clearing",
     "h": "One counterparty, standing in the <em>middle</em>",
     "b": "<p>A <span class=\"k\">central counterparty</span> interposes itself between the two sides of a trade: the original contract is replaced by two contracts, each facing the clearing house. Both parties now face one highly regulated entity instead of each other.</p>\n<p>In India, CCIL performs this role for government securities, tri-party repo, foreign exchange and rupee interest rate derivatives, operating as a qualified central counterparty.</p>\n<div class=\"dg\"><div class=\"dg-t\">The default waterfall &mdash; the order losses are absorbed</div>\n<div class=\"lay\">\n<div><span>1</span>The defaulting member's own initial margin</div>\n<div><span>2</span>The defaulting member's contribution to the default fund</div>\n<div class=\"hot\"><span>3</span>The clearing house's own capital contributed ahead of members &mdash; \"skin in the game\"</div>\n<div><span>4</span>Surviving members' default fund contributions, mutualised</div>\n<div><span>5</span>Further assessments on surviving members, up to a cap</div>\n</div>\n<div class=\"cross\">Read bottom-up: the defaulter pays first, and only then is loss shared</div></div>\n<p><strong>Central clearing does not remove risk; it concentrates and mutualises it.</strong> Multilateral netting across all members shrinks the total exposure substantially, margining is uniform and enforced, and one entity's failure no longer propagates directly to its counterparties. In exchange, the clearing house itself becomes systemically critical, and surviving members are exposed to each other's failures through the default fund.</p>\n<p>That systemic criticality has international consequences. CCIL's recognition by overseas regulators became a live issue when the European Securities and Markets Authority withdrew its recognition in 2022, which affected European banks' ability to clear in India and required extended engagement between the authorities to resolve.</p>\n<div class=\"note\">The waterfall is the whole design. Losses fall on the defaulter first, then on the clearing house, then on survivors &mdash; and that ordering is what makes members willing to mutualise at all.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "The counterparty credit <em>standard</em>",
     "b": "<p>The Basel Committee's standard sets out SA-CCR in full, including the replacement cost and add-on structure and the alpha factor. The frequently asked questions document resolves the interpretation points that arise in implementation.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.bis.org/publ/bcbs279.htm\" target=\"_blank\" rel=\"noopener\">Basel Committee &mdash; The standardised approach for measuring counterparty credit risk exposures</a>\n<a href=\"https://www.bis.org/bcbs/publ/d333.htm\" target=\"_blank\" rel=\"noopener\">Basel Committee &mdash; SA-CCR: frequently asked questions</a></div>\n<div class=\"note\">Read the Basel standard for the concepts and the RBI Directions for what actually applies in India. The two are converging and are not the same document, and the difference is the point of the LIVE card in this mission.</div>"

     "t": "Mission 09",

     "b": "<ul>\n<li><strong>A derivative in the money is an unsecured claim on the counterparty</strong>, created by the market rather than by a lending decision.</li>\n<li><strong>Exposure is bilateral, uncertain in size, and correlated with the market</strong> &mdash; it peaks when the counterparty is least able to pay.</li>\n<li><strong>Current exposure is mark to market floored at zero; potential future exposure is what it could become.</strong></li>\n<li><strong>Exposure at default = replacement cost + notional &times; add-on factor</strong>, with the factor rising by maturity and by asset class volatility.</li>\n<li><strong>India uses the Current Exposure Method, not SA-CCR</strong>, with add-on factors realigned to Basel by RBI Amendment Directions of 10 March 2026.</li>\n<li><strong>Close-out netting collapses many contracts into one claim</strong>, and counts for capital only where legally enforceable &mdash; which the Bilateral Netting Act, 2020 established in India.</li>\n<li><strong>Variation margin covers current exposure; initial margin covers potential future exposure.</strong> Thresholds and minimum transfer amounts leave a real uncovered band.</li>\n<li><strong>Collateral converts credit risk into liquidity risk.</strong> A profitable position can still kill a firm that cannot fund the margin call.</li>\n<li><strong>Central clearing concentrates and mutualises rather than removing risk</strong>, and the default waterfall is what makes mutualisation acceptable.</li>\n</ul>"

     "b": "<p>The spine of this pack runs from the instrument, to the risk it creates, to who stands between.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>01 &middot; Ground</b>Primary and secondary, four asset classes, cash against derivative, bid and offer, and the RBI/SEBI split. Notional is not exposure.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>02 &middot; Fixed income</b>The bond. Cash flows fixed, price variable, and therefore price and yield move opposite. Clean, dirty, and the credit spread.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>03 &middot; Fixed income</b>The curve. Built from trades then fitted, four shapes, forward rates as arithmetic, carry and rolldown.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>04 &middot; Fixed income</b>Measuring it. Duration in percent, PV01 in rupees, convexity as the correction, and what a parallel shift hides.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>05 &middot; Funding</b>Where the day begins. Repo as a secured loan, haircuts, the policy corridor, and the benchmark transition.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>06 &middot; Linear</b>Forwards, futures and swaps. Cost of carry, daily margin, and how a hedge decays into a position.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>07 &middot; Optionality</b>The bend. Intrinsic and time value, five inputs of which one is unobservable, the Greeks, and why selling premium flatters.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>08 &middot; Currency</b>Two currencies, one price. Covered interest parity, forward premium as carry, the offshore market, and India's exposure-based rulebook.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>09 &middot; Counterparty</b>Who is on the other side. Current and potential exposure, netting, collateral, and the clearing house waterfall.</div>\n</div>\n<div class=\"note\">Missions 02 to 05 are instruments and the arithmetic that measures them. Missions 06 to 08 are contracts written on those instruments. Mission 09 is what happens when the person on the other side of the contract fails, and it applies to everything in 06 to 08 at once.</div>"

v>\n<div class=\"r\"><b>Replacement cost</b><span>Mark to market, floored at zero</span></div>\n<div class=\"r\"><b>Net exposure</b><span>Sum of positive and negative marks within an enforceable netting set</span></div>\n</div>\n<div class=\"sheet g\"><div class=\"h\">Conventions worth not looking up again</div>\n<div class=\"r\"><b>1 basis point</b><span>0.01% &mdash; and the unit everything is quoted in</span></div>\n<div class=\"r\"><b>G-Sec day count</b><span>30/360. Money market: actual/365. USD money market: actual/360</span></div>\n<div class=\"r\"><b>G-Sec settlement</b><span>T+1. FX spot: T+2</span></div>\n<div class=\"r\"><b>Long options</b><span>Long gamma, long vega, negative theta. Short options reverse all three</span></div>\n</div>"

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(--[^\\n]*|#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)||SQLKW.has(w.toUpperCase())) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}

    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
</body>
</html>
