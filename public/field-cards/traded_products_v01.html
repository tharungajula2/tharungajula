   "cards": [
    {
     "l": "WHY",
     "t": "Why one number",
     "h": "A book of four hundred bonds needs a <em>single</em> figure",
     "b": "<p>A treasury holding four hundred securities cannot answer \"what happens if rates rise\" by repricing all of them and comparing. It needs one number per position that adds up across the book, and that is what duration provides.</p>\n<p>The requirement is specific. The number must:</p>\n<ul>\n<li><strong>Express sensitivity, not size.</strong> A ₹500 crore holding of one-year bills and a ₹500 crore holding of thirty-year bonds are the same size and nothing alike in risk.</li>\n<li><strong>Add up.</strong> The risk of a portfolio must be computable from the risk of its parts, weighted by value.</li>\n<li><strong>Convert to rupees.</strong> Percentages do not aggregate against a capital base; rupees do.</li>\n</ul>\n<p>Maturity fails the first test. Two ten-year bonds, one paying a 3% coupon and one paying 9%, have identical maturity and materially different sensitivity, because the high-coupon bond returns more of its value earlier. <strong>What matters is not when the last payment arrives but when the money arrives on average, weighted by how much of it there is.</strong></p>\n<div class=\"note\">That weighted-average timing is Macaulay duration, and the reason it works as a risk measure is not obvious from its definition. The next two cards establish it and then convert it into something usable.</div>"
    },
    {
     "l": "FORMULA",
     "t": "Duration",
     "h": "Weighted average time, then <em>rescaled</em>",
     "b": "<p><span class=\"k\">Macaulay duration</span> is the average time until the bond's cash flows arrive, weighting each date by the present value of the money arriving then.</p>\n<div class=\"fx\"><div class=\"cap\">Macaulay duration, in years</div>\n<div class=\"eq\"><em>D</em><sub>Mac</sub> = <span class=\"fr\"><i>&Sigma; t &times; PV(CF<sub>t</sub>)</i><i>P</i></span></div>\n<div class=\"wh\"><em>t</em>&nbsp;&nbsp;the time in years until each cash flow<br>\nPV(CF<sub>t</sub>)&nbsp;&nbsp;the present value of the cash flow arriving at time <em>t</em><br>\n<em>P</em>&nbsp;&nbsp;the price, which equals the sum of all those present values<br>\n&Sigma;&nbsp;&nbsp;summed across every remaining cash flow</div></div>\n<p>This is a length of time, in years. It is not yet a sensitivity. <span class=\"k\">Modified duration</span> converts it into the percentage price change per unit change in yield, by dividing by one plus the yield per period.</p>\n<div class=\"fx\"><div class=\"cap\">Modified duration, and the price change it predicts</div>\n<div class=\"eq\"><em>D</em><sub>mod</sub> = <span class=\"fr\"><i>D<sub>Mac</sub></i><i>1 + y</i></span> &nbsp;&nbsp;&nbsp; <span class=\"nw\">&Delta;<em>P</em> / <em>P</em> &asymp; &minus; <em>D</em><sub>mod</sub> &times; &Delta;<em>y</em></span></div>\n<div class=\"wh\"><em>D</em><sub>mod</sub>&nbsp;&nbsp;modified duration &mdash; percentage price change per 1.00 change in yield<br>\n<em>y</em>&nbsp;&nbsp;the yield per period, as a decimal<br>\n&Delta;<em>y</em>&nbsp;&nbsp;the change in yield, as a decimal &mdash; 100 basis points is 0.01<br>\n&Delta;<em>P</em> / <em>P</em>&nbsp;&nbsp;the resulting proportional change in price<br>\nThe minus sign carries the seesaw: yields up, price down</div></div>\n<div class=\"sheet\"><div class=\"h\">What raises and lowers duration</div>\n<div class=\"r\"><b>Longer maturity</b><span>Raises it. Money arrives later on average</span></div>\n<div class=\"r\"><b>Higher coupon</b><span>Lowers it. More value returns earlier</span></div>\n<div class=\"r\"><b>Higher yield</b><span>Lowers it. Distant cash flows are discounted harder, so they weigh less</span></div>\n<div class=\"r\"><b>Zero coupon</b><span>Duration equals maturity exactly. One cash flow, one date</span></div>\n</div>\n<div class=\"note\">A zero-coupon bond is the only case where duration and maturity coincide. Every coupon-paying bond has duration shorter than its maturity, and the gap widens with the coupon.</div>"
    },
    {
     "l": "WORKED",
     "t": "Duration computed",
     "h": "The five-year bond, <em>fully</em> worked",
     "b": "<p>The bond from Mission 02: 7.00% annual coupon, five years remaining, yield 6.76%, price ₹100.99.</p>\n<div class=\"wk\"><div class=\"h\">Present value of each flow, and its weighted time</div>\n<div class=\"r\"><b>Year 1 &mdash; PV 6.557, &times; 1</b><span>6.557</span></div>\n<div class=\"r\"><b>Year 2 &mdash; PV 6.142, &times; 2</b><span>12.283</span></div>\n<div class=\"r\"><b>Year 3 &mdash; PV 5.753, &times; 3</b><span>17.258</span></div>\n<div class=\"r\"><b>Year 4 &mdash; PV 5.388, &times; 4</b><span>21.554</span></div>\n<div class=\"r\"><b>Year 5 &mdash; PV 77.151, &times; 5</b><span>385.756</span></div>\n<div class=\"r tot\"><b>Sum of weighted times</b><span>443.408</span></div>\n<div class=\"r\"><b>Divide by the price, ₹100.99</b><span>443.408 &divide; 100.99</span></div>\n<div class=\"r tot\"><b>Macaulay duration</b><span>4.39 years</span></div>\n<div class=\"r\"><b>Divide by 1 + 0.0676</b><span>4.3906 &divide; 1.0676</span></div>\n<div class=\"r tot\"><b>Modified duration</b><span>4.11</span></div>\n</div>\n<p>Read the middle column: <strong>the final year contributes 385.8 of the 443.4 total</strong> &mdash; 87% of the weighted time comes from one cash flow, because that is where the ₹100 principal sits. This is why coupon size matters so much. Strip the coupons away and duration would be exactly 5.00; the coupons pull it down to 4.39.</p>\n<p>The modified duration of 4.11 means: <strong>a 100 basis point rise in yield costs roughly 4.11% of value.</strong> Mission 02 computed the actual price at 7.76% as ₹96.95, a fall of 4.00%. The estimate is close and slightly overstates the loss &mdash; which is convexity, three cards on.</p>\n<div class=\"note\">Duration falls as the bond ages, but not linearly, and it changes when yields move. A hedge built on today's duration needs rebalancing, and how often is a policy decision rather than a mathematical one.</div>"
    },
    {
     "l": "FORMULA",
     "t": "PV01",
     "h": "The same risk, in <em>rupees</em>",
     "b": "<p>Modified duration is a percentage. A treasury manages rupees. <span class=\"k\">PV01</span> &mdash; the present value of one basis point, also written DV01 &mdash; is the change in the position's value for a one basis point move in yield.</p>\n<div class=\"fx\"><div class=\"cap\">PV01 of a position</div>\n<div class=\"eq\"><em>PV01</em> = <em>MV</em> &times; <em>D</em><sub>mod</sub> &times; 0.0001</div>\n<div class=\"wh\"><em>MV</em>&nbsp;&nbsp;the market value of the position, in rupees<br>\n<em>D</em><sub>mod</sub>&nbsp;&nbsp;modified duration<br>\n0.0001&nbsp;&nbsp;one basis point expressed as a decimal</div></div>\n<div class=\"wk\"><div class=\"h\">₹100 crore face value of the five-year bond</div>\n<div class=\"r\"><b>Face value</b><span>₹100.00 crore</span></div>\n<div class=\"r\"><b>Price ₹100.99 per ₹100 face</b><span>&times; 1.0099</span></div>\n<div class=\"r tot\"><b>Market value</b><span>₹100.99 crore</span></div>\n<div class=\"r\"><b>Modified duration</b><span>4.11</span></div>\n<div class=\"r\"><b>One basis point</b><span>0.0001</span></div>\n<div class=\"r tot\"><b>PV01</b><span>₹4.15 lakh per basis point</span></div>\n</div>\n<p><strong>PV01 is the number a treasury actually manages to.</strong> It adds across positions, it converts directly into a limit, and it answers the only question the board asks: how many rupees does a rate move cost. A 25 basis point policy move on this position is ₹1.04 crore.</p>\n<p>It also sizes a hedge directly. To neutralise ₹4.15 lakh of PV01 with a futures contract whose PV01 is ₹2,500, sell 166 contracts. <strong>Matching PV01 is what \"hedged\" operationally means</strong> &mdash; not matching face value, which would leave the book badly exposed whenever the durations differ.</p>\n<div class=\"note\">PV01 is signed. A long bond position has positive PV01 in the sense that it loses when yields rise; a pay-fixed swap gains. Netting them requires a consistent sign convention, and a sign error is one of the more expensive mistakes available in a treasury system.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Convexity",
     "h": "Why the straight-line estimate is always <em>pessimistic</em>",
     "b": "<p>Duration describes a straight line. The true relationship between price and yield is a curve, bending upward. <span class=\"k\">Convexity</span> measures that bend.</p>\n<div class=\"fx\"><div class=\"cap\">Price change including the second-order term</div>\n<div class=\"eq\">&Delta;<em>P</em> / <em>P</em> &asymp; &minus; <em>D</em><sub>mod</sub> &times; &Delta;<em>y</em> + <span class=\"nw\">&frac12; &times; <em>C</em> &times; (&Delta;<em>y</em>)<sup>2</sup></span></div>\n<div class=\"wh\"><em>C</em>&nbsp;&nbsp;convexity, computed from the cash flows in the same way duration is<br>\n(&Delta;<em>y</em>)<sup>2</sup>&nbsp;&nbsp;the yield change squared, so this term is always positive regardless of direction<br>\nThe first term is the straight line; the second is the correction for the bend</div></div>\n<p>Because the correction term is squared, <strong>it adds value whether yields rise or fall</strong>. That produces the asymmetry seen in Mission 02: the same 100 basis point move gained 4.16% on the way down and cost 4.00% on the way up.</p>\n<div class=\"sheet g\"><div class=\"h\">What convexity is worth</div>\n<div class=\"r\"><b>Small yield moves</b><span>Negligible. Duration alone is fine for a few basis points</span></div>\n<div class=\"r\"><b>Large yield moves</b><span>Material. The squared term grows fast, and duration alone overstates losses</span></div>\n<div class=\"r\"><b>Long-dated, low-coupon bonds</b><span>High convexity. More of the value sits far out, where the curvature is greatest</span></div>\n<div class=\"r\"><b>Two bonds, same duration</b><span>The more convex one is worth more, and will be priced accordingly</span></div>\n</div>\n<p><strong>Convexity is a benefit that is paid for.</strong> Two bonds with identical duration but different convexity will not yield the same &mdash; the convex one yields slightly less, because the market charges for an asymmetry that favours the holder in both directions.</p>\n<div class=\"note\">Negative convexity exists and behaves in reverse. A callable bond is redeemed when rates fall, capping the gain while leaving the loss intact. The holder has effectively sold an option, and the extra yield they receive is the premium for it.</div>"
    },
    {
     "l": "WORKED",
     "t": "The correction",
     "h": "Three estimates against the <em>actual</em>",
     "b": "<p>The same five-year bond, convexity computed as 22.08, and a 100 basis point rise from 6.76% to 7.76%.</p>\n<div class=\"wk\"><div class=\"h\">Duration alone</div>\n<div class=\"r\"><b>&minus; 4.1127 &times; 0.01</b><span>&minus;4.113%</span></div>\n</div>\n<div class=\"wk\"><div class=\"h\">Duration plus convexity</div>\n<div class=\"r\"><b>First term: &minus; 4.1127 &times; 0.01</b><span>&minus;4.1127%</span></div>\n<div class=\"r\"><b>Second term: &frac12; &times; 22.08 &times; 0.0001</b><span>+0.1104%</span></div>\n<div class=\"r tot\"><b>Combined estimate</b><span>&minus;4.002%</span></div>\n</div>\n<div class=\"wk\"><div class=\"h\">Actual, by repricing</div>\n<div class=\"r\"><b>Price at 6.76%</b><span>₹100.991</span></div>\n<div class=\"r\"><b>Price at 7.76%</b><span>₹96.947</span></div>\n<div class=\"r tot\"><b>Actual change</b><span>&minus;4.004%</span></div>\n</div>\n<p><strong>Duration alone was wrong by 11 basis points of value; duration plus convexity was wrong by less than a quarter of one basis point.</strong> On ₹1,000 crore that is the difference between a ₹1.1 crore error and a ₹20 lakh one, from a rate move of a size that occurs in an ordinary quarter.</p>\n<p>And the direction of the error matters as much as its size. <strong>Duration alone always overstates the loss and understates the gain.</strong> A risk report built on duration alone is conservative on the downside, which sounds safe &mdash; and it is systematically wrong in a way that compounds when positions are large and moves are large.</p>\n<div class=\"note\">For a 25 basis point move the convexity term is 0.0069% and can be ignored. The threshold at which it starts to matter is roughly 50 basis points on a five-year bond, and much lower on a thirty-year one.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Across a book",
     "h": "Adding it up, and <em>hedging</em>",
     "b": "<p>Portfolio duration is the market-value weighted average of the durations of its parts. PV01 is simpler still: it just adds.</p>\n<div class=\"dt\"><table>\n<tr><th>Position</th><th>Market value</th><th>Mod duration</th><th>PV01</th></tr>\n<tr><td>1-year T-bills</td><td class=\"n\">₹300 cr</td><td class=\"n\">0.95</td><td class=\"n\">₹2.85 lakh</td></tr>\n<tr><td>5-year G-Sec</td><td class=\"n\">₹500 cr</td><td class=\"n\">4.11</td><td class=\"n\">₹20.55 lakh</td></tr>\n<tr class=\"hi\"><td>10-year G-Sec</td><td class=\"n\">₹400 cr</td><td class=\"n\">7.20</td><td class=\"n\">₹28.80 lakh</td></tr>\n<tr><td>Pay-fixed 5-year swap</td><td class=\"n\">₹600 cr notional</td><td class=\"n\">&minus;4.30</td><td class=\"n\">&minus;₹25.80 lakh</td></tr>\n<tr class=\"hi\"><td><strong>Net book</strong></td><td class=\"n\">&mdash;</td><td class=\"n\">&mdash;</td><td class=\"n\"><strong>₹26.40 lakh</strong></td></tr>\n</table></div>\n<p>The book loses ₹26.40 lakh per basis point of parallel rate rise. A 25 basis point move costs ₹6.6 crore. That single number is what a limit is set against, what is reported daily, and what the swap position exists to reduce &mdash; it is cutting the book's PV01 by roughly half.</p>\n<p><strong>The pay-fixed swap has negative duration</strong> because it gains when rates rise. That is the entire mechanism of hedging a bond book with swaps: assemble offsetting PV01 without selling the bonds, which may be held for liquidity or regulatory reasons and cannot be sold.</p>\n<div class=\"note\">Offsetting PV01 to zero removes exposure to a <em>parallel</em> shift only. A book long ten-year bonds and short five-year swaps can have zero net PV01 and lose substantially when the curve steepens. Key rate durations &mdash; PV01 computed separately at each maturity point &mdash; are what expose that.</div>"
    },
    {
     "l": "TRAP",
     "t": "The parallel shift",
     "h": "Zero net duration is not <em>no risk</em>",
     "b": "<p>The wrong belief: the book's net PV01 is zero, therefore the book is hedged against interest rates.</p>\n<p>Duration assumes every point on the curve moves by the same amount at the same time. Curves almost never do that. They steepen, flatten, twist, and move at the short end while the long end sits still. <strong>A position that is duration-neutral against a parallel shift can be heavily exposed to a change in shape</strong>, and the loss arrives from a risk the report said was zero.</p>\n<div class=\"sheet q\"><div class=\"h\">Four things duration does not capture</div>\n<div class=\"r\"><b>Curve shape</b><span>Steepening and flattening. Needs key rate durations, point by point</span></div>\n<div class=\"r\"><b>Large moves</b><span>The straight line fails. Needs convexity</span></div>\n<div class=\"r\"><b>Credit</b><span>A corporate bond's spread can widen with government yields unchanged. Different risk, different measure</span></div>\n<div class=\"r\"><b>Optionality</b><span>Callable and prepayable instruments have duration that changes as rates move &mdash; the measure moves under the position</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> Parallel-shift duration is the correct first-order measure, it does aggregate properly, and for small moves in a stable curve it is accurate. The failure is not in the mathematics. It is in reading \"net PV01 zero\" as \"no interest rate risk\" when it means \"no exposure to one specific and rather unusual kind of rate move\".</p>\n<div class=\"note\">This is precisely why supervisory frameworks for interest rate risk in the banking book require several prescribed scenarios &mdash; parallel up, parallel down, steepener, flattener, short-rate shocks &mdash; rather than a single duration figure. The scenarios exist because the single figure hides the shape.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "The curve duration is <em>measured against</em>",
     "b": "<p>Duration and PV01 are arithmetic, and they are computed against a published curve. In India that curve, and the valuation levels every portfolio is marked to, come from the clearing corporation and FBIL.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://www.ccilindia.com/documents/d/ccil/Clearing_Corporation_of_India_Limited%20Annual-pdf\" target=\"_blank\" rel=\"noopener\">The Clearing Corporation of India &mdash; Factbook, valuation and benchmark curves</a>\n<a href=\"https://www.bis.org/review/r221201d.pdf\" target=\"_blank\" rel=\"noopener\">Reserve Bank of India &mdash; Financial Benchmarks in India, on benchmark governance and construction</a></div>\n<div class=\"note\">Two banks computing duration on the same bond will agree. Two banks computing it against different curves will not, which is why a single published valuation curve matters more to comparability than the sensitivity formula does.</div>"
    },
    {
     "l": "RECALL",
     "t": "Mission 04",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong>Maturity is not sensitivity.</strong> What matters is when money arrives on average, weighted by how much.</li>\n<li><strong>Macaulay duration is weighted average time in years; modified duration divides it by one plus the yield</strong> and becomes a percentage sensitivity.</li>\n<li><strong>Longer maturity raises duration; higher coupon and higher yield lower it.</strong> A zero-coupon bond's duration equals its maturity.</li>\n<li><strong>PV01 = market value &times; modified duration &times; 0.0001.</strong> It is in rupees, it adds across a book, and it is what limits are set against.</li>\n<li><strong>Hedging means matching PV01, not face value.</strong></li>\n<li><strong>Convexity is the bend, and it always helps the holder</strong> &mdash; so duration alone overstates losses and understates gains.</li>\n<li><strong>The correction matters above roughly 50 basis points</strong>, and much sooner on long bonds.</li>\n<li><strong>Zero net PV01 hedges a parallel shift only.</strong> Curve shape, credit and optionality remain, which is why supervisors prescribe several scenarios.</li>\n</ul>"
    }

   "title": "Where the day begins",
   "stage": "Funding",
   "line": "Every bank ends each day either short of cash or holding too much. The overnight market clears that difference, the central bank sets the price of doing so, and a repo is the instrument that carries most of it.",

     "l": "ORIENT",
     "t": "The daily gap",
     "h": "Nobody ends the day exactly <em>square</em>",
     "b": "<p>A bank takes deposits, makes loans, settles payments and buys securities. At the close of every day, the cash that came in never exactly matches the cash that went out. It must still meet its reserve requirement with the central bank by morning.</p>\n<p>The <span class=\"k\">money market</span> is where that gap is closed. It deals in maturities from one day to one year, and it exists for one reason: <strong>to move cash from institutions holding a surplus to institutions holding a shortfall, overnight, at a price.</strong></p>\n<div class=\"dt\"><table>\n<tr><th>Segment</th><th>Tenor</th><th>Secured?</th><th>Who participates</th></tr>\n<tr><td>Call money</td><td>Overnight</td><td class=\"g\">No &mdash; unsecured</td><td class=\"g\">Banks and primary dealers only</td></tr>\n<tr><td>Notice and term money</td><td>2 to 14 days, and beyond</td><td class=\"g\">No</td><td class=\"g\">Banks and primary dealers</td></tr>\n<tr class=\"hi\"><td>TREPS</td><td>Overnight mostly</td><td class=\"g\">Yes &mdash; tri-party repo</td><td class=\"g\">Banks, mutual funds, insurers, corporates</td></tr>\n<tr><td>Market repo</td><td>1 day to 1 year</td><td class=\"g\">Yes</td><td class=\"g\">Wide, including non-banks</td></tr>\n<tr><td>Treasury bills</td><td>91, 182, 364 days</td><td class=\"g\">Government paper</td><td class=\"g\">Everyone</td></tr>\n<tr><td>Commercial paper, certificates of deposit</td><td>Up to 1 year</td><td class=\"g\">No</td><td class=\"g\">Corporates and banks issuing</td></tr>\n</table></div>\n<p><strong>The secured segments dominate.</strong> Tri-party repo and market repo together account for the overwhelming majority of overnight volume in India, and unsecured call money is a comparatively small residue. That matters for the benchmark question at the end of this mission: a rate built on call money describes a shrinking slice of the market.</p>\n<div class=\"note\">Non-banks &mdash; mutual funds especially &mdash; are large lenders of overnight cash and cannot participate in the call money market at all. They lend through tri-party repo, which is one reason that segment grew to dominate.</div>"
    },
    {
     "l": "DEFINE",
     "t": "What a repo is",
     "h": "A sale that is really a <em>secured loan</em>",
     "b": "<p>A <span class=\"k\">repo</span> &mdash; repurchase agreement &mdash; is two linked transactions: sell a security today, and agree now to buy it back on a stated future date at a stated higher price.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Today</b>Borrower delivers government securities and receives cash.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Tomorrow, or later</b>Borrower returns the cash plus interest and takes the securities back. The repurchase price is fixed at the outset.</div>\n</div>\n<p><strong>Economically this is a loan secured on the securities, and legally it is a sale and a repurchase.</strong> That distinction is not pedantry. Because title genuinely passes, the lender can sell the collateral immediately on default rather than waiting for an insolvency process &mdash; which is exactly why repo funding is cheap and available in size when unsecured funding is not.</p>\n<div class=\"two\">\n<div><b>Repo, from the cash borrower's side</b>Giving securities, taking cash. Paying interest. This is funding a bond position.</div>\n<div><b>Reverse repo, from the cash lender's side</b>Giving cash, taking securities. Earning interest. This is a short-term secured investment.</div>\n</div>\n<p>The same trade has both names depending on which side is speaking, which is a persistent source of confusion in documentation and in systems.</p>\n<p>The interest rate on the transaction depends on the quality of the collateral and on general market conditions. <strong>Government securities as collateral fund cheaply; corporate bonds fund more expensively or not at all in stress</strong>, and the rate at which a given collateral funds is itself a market signal.</p>\n<div class=\"note\">In a <span class=\"k\">tri-party repo</span>, an agent sits between the two parties and handles collateral selection, valuation and margining. That removes the operational burden and is what lets a mutual fund lend cash overnight against securities it never has to evaluate itself.</div>"
    },
    {
     "l": "WORKED",
     "t": "A repo, priced",
     "h": "₹50 crore of collateral, <em>one night</em>",
     "b": "<p>A bank funds a holding of the 7.10% GS 2034 overnight. The market value of the bonds delivered is ₹50 crore, the haircut is 2%, and the repo rate is 5.30%.</p>\n<div class=\"wk\"><div class=\"h\">Leg one &mdash; today</div>\n<div class=\"r\"><b>Market value of collateral delivered</b><span>₹50.00 crore</span></div>\n<div class=\"r\"><b>Less haircut at 2%</b><span>&minus;₹1.00 crore</span></div>\n<div class=\"r tot\"><b>Cash received by the borrower</b><span>₹49.00 crore</span></div>\n</div>\n<div class=\"wk\"><div class=\"h\">Leg two &mdash; tomorrow</div>\n<div class=\"r\"><b>Principal to return</b><span>₹49.00 crore</span></div>\n<div class=\"r\"><b>Interest: ₹49 cr &times; 5.30% &times; 1/365</b><span>₹71,151</span></div>\n<div class=\"r tot\"><b>Repurchase amount</b><span>₹49.0071 crore</span></div>\n</div>\n<p>The <span class=\"k\">haircut</span> is the gap between what the collateral is worth and what is lent against it. It protects the cash lender against the collateral falling in value between default and sale. Two percent on a liquid government bond; considerably more on anything less liquid.</p>\n<div class=\"sheet q\"><div class=\"h\">The two ways this goes wrong</div>\n<div class=\"r\"><b>The borrower fails</b><span>The lender keeps and sells the collateral. Loss only if it has fallen more than the haircut</span></div>\n<div class=\"r\"><b>The collateral falls in value</b><span>A margin call demands more securities or cash. If it cannot be met, that becomes the first failure</span></div>\n</div>\n<p><strong>The two failure modes reinforce each other, and that is the systemic problem with repo funding.</strong> Falling collateral prices trigger margin calls; meeting them requires selling assets; selling pushes prices down further. Haircuts rise at the same moment, so the same collateral raises less cash. A funding market that is deep and cheap in calm conditions can withdraw within days.</p>\n<div class=\"note\">₹71,151 for one night looks trivial. Rolled 250 times a year on a book funded this way, it is roughly ₹1.78 crore &mdash; and the risk is not the interest cost but that on one of those 250 mornings the roll is unavailable.</div>"
    },

     "t": "Two repo rates",
     "h": "The policy rate and the market rate are <em>different things</em>",
     "b": "<p>The wrong belief: the repo rate is 5.25%, so banks borrow overnight at 5.25%.</p>\n<p>Two distinct things carry the name.</p>\n<div class=\"two\">\n<div><b>The policy repo rate</b>The rate at which the RBI lends to banks against government securities under its liquidity facility. An administered rate, set by the Monetary Policy Committee. A policy instrument.</div>\n<div><b>The market repo rate</b>The rate at which banks and non-banks lend to <em>each other</em> against collateral. Set by supply and demand, changing intraday, and it can sit meaningfully above or below the policy rate.</div>\n</div>\n<p>When the banking system holds surplus cash, market repo trades <em>below</em> the policy rate &mdash; sometimes near the floor of the corridor, because a lender with spare cash would rather earn something than nothing. When cash is scarce, it trades above.</p>\n<p><strong>Why it is a believable mistake.</strong> They share a name, they are quoted in the same units, and news coverage uses \"the repo rate\" to mean only the policy one. But a treasury funding a bond book cares about the market rate, because that is what it actually pays, and the two can diverge by 50 basis points or more for weeks.</p>\n<div class=\"note\">The gap between market overnight rates and the policy rate is itself the most-watched liquidity indicator in the Indian market. Persistent trading below the policy rate signals a systemic cash surplus; persistent trading above signals a deficit that the central bank will usually act on.</div>"

    {
     "l": "MECHANISM",
     "t": "The corridor",
     "h": "How the overnight rate is <em>steered</em>",
     "b": "<p>The RBI does not set the overnight market rate directly. It builds a corridor and lets the market clear inside it.</p>\n<div class=\"dg\"><div class=\"dg-t\">The liquidity adjustment facility corridor</div>\n<div class=\"lay\">\n<div><span>SDF</span><strong>Floor.</strong> The Standing Deposit Facility &mdash; banks park surplus cash with the RBI, uncollateralised, at this rate. No bank lends below it, because this is available risk-free</div>\n<div class=\"hot\"><span>Repo</span><strong>Policy rate.</strong> The centre of the corridor and the signalling rate. Where the MPC's decision is expressed</div>\n<div><span>MSF</span><strong>Ceiling.</strong> The Marginal Standing Facility &mdash; banks borrow from the RBI against securities at this rate. No bank pays more, because this is always available</div>\n</div>\n<div class=\"cross\">Open market operations, variable rate auctions and the cash reserve ratio adjust the total quantity of cash inside the corridor</div></div>\n<p>The corridor works because both edges are standing facilities: always open, no negotiation. A bank offered 4.80% in the market will decline and use the deposit facility instead; a bank asked to pay 5.70% will borrow from the standing facility instead. <strong>The overnight rate is therefore trapped between the two, and where it sits inside the corridor is a function of how much cash the system holds in aggregate.</strong></p>\n<div class=\"sheet\"><div class=\"h\">The tools that move the quantity, not the price</div>\n<div class=\"r\"><b>Open market operations</b><span>The RBI buys or sells government securities outright, injecting or absorbing cash permanently</span></div>\n<div class=\"r\"><b>Variable rate repo and reverse repo auctions</b><span>Temporary injection or absorption for a fixed term, at a rate the market bids</span></div>\n<div class=\"r\"><b>Cash reserve ratio</b><span>The share of deposits banks must hold with the RBI. A blunt, powerful lever</span></div>\n</div>\n<div class=\"note\">A rate decision and a liquidity decision are separate levers and can point in different directions. The policy rate can be held while large open market purchases inject cash, which eases financial conditions without any change to the headline rate.</div>"

     "l": "LIVE",

     "b": "<div class=\"stamp\">Collected 19 Aug 2026</div>\n<div class=\"dt\"><table>\n<tr><th>Rate</th><th>Level</th><th>Role</th></tr>\n<tr><td>Standing Deposit Facility</td><td class=\"n\">5.00%</td><td class=\"g\">Floor of the corridor</td></tr>\n<tr class=\"hi\"><td><strong>Policy repo rate</strong></td><td class=\"n\"><strong>5.25%</strong></td><td class=\"g\">The signalling rate</td></tr>\n<tr><td>Marginal Standing Facility</td><td class=\"n\">5.50%</td><td class=\"g\">Ceiling of the corridor</td></tr>\n<tr><td>Bank Rate</td><td class=\"n\">5.50%</td><td class=\"g\">Moves with the MSF</td></tr>\n<tr><td>10-year government benchmark</td><td class=\"n\">6.76%</td><td class=\"g\">14 August 2026</td></tr>\n</table></div>\n<p>The Monetary Policy Committee met from 3 to 5 August 2026 and voted unanimously to hold, keeping the stance at neutral. Headline consumer price inflation was 4.4% in June 2026, having moved above the 4% target after a long period below it. The next scheduled meeting is 5 to 7 October 2026.</p>\n<p>The corridor is 50 basis points wide, 25 basis points either side of the policy rate. <strong>That width is itself a policy choice</strong> &mdash; a narrow corridor keeps the overnight rate tightly anchored to the policy rate; a wide one gives the market more room to price liquidity conditions on its own.</p>\n<div class=\"src\">Rates and the meeting outcome from Reserve Bank of India monetary policy statements, August 2026. Ten-year benchmark yield from published clearing corporation data, 14 August 2026.</div>\n<div class=\"note\">Every figure on this card is dated because every one of them changes. The corridor <em>structure</em> &mdash; floor, policy rate, ceiling, and standing facilities at both edges &mdash; does not, and that is the part worth carrying.</div>"

    {
     "l": "LIVE",
     "t": "The benchmark stack",
     "h": "What rupee contracts are <em>referenced to</em>",
     "b": "<div class=\"stamp\">Collected 19 Aug 2026</div>\n<p>A floating rate needs something to float against. The rupee benchmark set is administered by FBIL and is mid-transition.</p>\n<div class=\"dt\"><table>\n<tr><th>Benchmark</th><th>Based on</th><th>Status</th></tr>\n<tr class=\"hi\"><td>Overnight MIBOR &mdash; the Mumbai Interbank Outright Rate</td><td class=\"g\">Trade-weighted interbank call money on the clearing corporation's platform, in a defined morning window</td><td class=\"g\">The long-standing reference for rupee interest rate swaps</td></tr>\n<tr><td><strong>SORR</strong></td><td class=\"g\">Secured Overnight Rupee Rate &mdash; basket repo and tri-party repo trades</td><td class=\"g\">Announced by the RBI in December 2024, following its MIBOR Committee. Phased introduction alongside MIBOR</td></tr>\n<tr><td>Modified MIFOR</td><td class=\"g\">The US secured overnight rate plus rupee-dollar forward premia</td><td class=\"g\">Replaced the LIBOR-based version after the global benchmark transition</td></tr>\n<tr><td>FBIL Reference Rate</td><td class=\"g\">Rupee-dollar and other currency spot fixings</td><td class=\"g\">The official daily fixing used for settlement and valuation</td></tr>\n</table></div>\n<p>The logic behind SORR is the same logic that ended LIBOR internationally. <strong>A benchmark should rest on a large volume of real transactions.</strong> Unsecured call money is now a small fraction of overnight activity, while secured repo accounts for the overwhelming majority &mdash; so a rate built on repo describes the market and a rate built on call money describes a corner of it.</p>\n<div class=\"src\">RBI announcement on the introduction of the Secured Overnight Rupee Rate, December 2024, and the report of the Committee on the MIBOR Benchmark. Transition status is phased and continuing.</div>\n<div class=\"note\">Benchmark transitions are slow because every legacy contract references the old rate. The practical consequence for anyone reading a contract or a system field is that both names will appear for years, and which one applies is a matter of trade date, not of preference.</div>"

    {
     "l": "RECALL",
     "t": "Mission 05",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong>No bank ends the day square.</strong> The money market moves cash from surplus to shortfall, overnight, at a price.</li>\n<li><strong>Secured segments dominate Indian overnight volume</strong>; unsecured call money is a shrinking residue and excludes non-banks entirely.</li>\n<li><strong>A repo is economically a secured loan and legally a sale and repurchase</strong>, and that legal form is why it funds cheaply.</li>\n<li><strong>Repo and reverse repo are the same trade from opposite sides.</strong></li>\n<li><strong>The haircut is the gap between collateral value and cash lent.</strong> Falling collateral triggers margin calls, and haircuts rise at the same moment.</li>\n<li><strong>The policy repo rate and the market repo rate are different things</strong>, and the gap between them is the main liquidity indicator.</li>\n<li><strong>The corridor is SDF at the floor, policy repo in the middle, MSF at the ceiling</strong> &mdash; held together because both edges are standing facilities.</li>\n<li><strong>Rate decisions and liquidity operations are separate levers</strong> and can point in different directions.</li>\n<li><strong>Rupee benchmarks are mid-transition</strong> from unsecured call money to a secured repo-based rate, for the same reason LIBOR ended.</li>\n</ul>"

  {
   "title": "Locking a price in advance",
   "stage": "Linear",
   "line": "Forwards, futures and swaps all do one thing: fix today the price of something that happens later. Their payoff is a straight line, they cost nothing at inception, and they are where a hedge quietly turns into a position.",
   "bullets": [
    "What makes a payoff linear, and why that matters",

   "cards": [
    {
     "l": "ORIENT",
     "t": "Linear payoff",
     "h": "Gains and losses in a <em>straight line</em>",
     "b": "<p>A forward, a future and a swap share one structural property: <strong>the payoff moves one-for-one with the underlying, in both directions, without limit.</strong> Plot profit against the underlying price and the result is a straight line through the agreed rate.</p>\n<div class=\"dt\"><table>\n<tr><th>Spot at maturity</th><th>Bought forward at 95.50</th><th>Sold forward at 95.50</th></tr>\n<tr><td class=\"n\">93.50</td><td class=\"n\">&minus;2.00</td><td class=\"n\">+2.00</td></tr>\n<tr class=\"hi\"><td class=\"n\">95.50</td><td class=\"n\">0</td><td class=\"n\">0</td></tr>\n<tr><td class=\"n\">97.50</td><td class=\"n\">+2.00</td><td class=\"n\">&minus;2.00</td></tr>\n<tr><td class=\"n\">99.50</td><td class=\"n\">+4.00</td><td class=\"n\">&minus;4.00</td></tr>\n</table></div>\n<p>Two consequences follow, and they are the reason this mission comes before options.</p>\n<ul>\n<li><strong>Nothing is paid at the start.</strong> The rate is set so the contract is worth zero to both sides on day one. Neither party is buying anything; they are agreeing terms.</li>\n<li><strong>The obligation is symmetric.</strong> Both sides must perform. There is no choice, no walking away, and the loss side is as unlimited as the gain side.</li>\n</ul>\n<p>That symmetry is what separates this mission from the next. An option costs money upfront and lets one side decline; a forward costs nothing and binds both. <strong>A linear instrument removes uncertainty in both directions &mdash; including the direction the hedger would have preferred.</strong> An importer who hedges at 95.50 and watches the rupee strengthen to 93.50 has lost ₹2 per dollar against having done nothing, and the hedge worked exactly as designed.</p>\n<div class=\"note\">\"The hedge lost money\" is a sentence that should never be said about a linear hedge in isolation. The hedge and the underlying exposure are one position, and the whole point was to make the pair sum to a known number.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Forward and future",
     "h": "Same economics, four different <em>mechanics</em>",
     "b": "<div class=\"dt\"><table>\n<tr><th></th><th>Forward</th><th>Future</th></tr>\n<tr><td>Where it trades</td><td class=\"g\">Over the counter, bilaterally</td><td class=\"g\">On an exchange</td></tr>\n<tr><td>Terms</td><td class=\"g\">Negotiated &mdash; any amount, any date</td><td class=\"g\">Standardised &mdash; fixed sizes, fixed expiry dates</td></tr>\n<tr class=\"hi\"><td>Counterparty</td><td class=\"g\">The other party. Their failure is your loss</td><td class=\"g\">The clearing house, which novates itself between the two sides</td></tr>\n<tr><td>Cash flow before maturity</td><td class=\"g\">None, typically. Value accrues unrealised</td><td class=\"g\"><strong>Daily.</strong> Marked to market and settled every day through margin</td></tr>\n</table></div>\n<p>The fourth row is the one that changes behaviour. A forward showing a ₹5 crore loss demands nothing until maturity. <strong>A future showing the same loss demands ₹5 crore in cash, in instalments, as it accumulates.</strong></p>\n<div class=\"flow\">\n<div class=\"n\"><b>Initial margin</b>Posted at the outset. Sized to cover a plausible one or two day move. Returned when the position closes.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Daily mark to market</b>The exchange revalues every position at the closing price. Gains are credited in cash, losses debited.</div>\n<div class=\"a\">&darr;</div>\n<div class=\"n\"><b>Variation margin</b>Losses must be funded, usually by the next morning. Failure to pay means the position is closed out.</div>\n</div>\n<p>This is why a perfectly correct hedge can still cause a crisis. <strong>The hedge's losses are settled in cash daily; the underlying exposure's offsetting gains may not be realised for years.</strong> The economics net to zero and the cash flows do not, and the gap must be funded from somewhere for the entire life of the position.</p>\n<div class=\"note\">Over-the-counter derivatives have moved a long way toward the futures model. Central clearing brings daily margining to swaps, and margin requirements now apply to non-centrally cleared derivatives too. The distinction between the two columns is narrower than it was, and narrowing further.</div>"
    },
    {
     "l": "FORMULA",
     "t": "Cost of carry",
     "h": "The forward price is <em>arithmetic</em>, not a forecast",
     "b": "<p>The forward price is not anyone's opinion about the future. It is forced by the alternative: buy the asset today with borrowed money and hold it. If the forward price differed from the cost of doing that, one route would be free money.</p>\n<div class=\"fx\"><div class=\"cap\">Forward price under cost of carry</div>\n<div class=\"eq\"><em>F</em> = <em>S</em> &times; (1 + <em>r</em> &minus; <em>q</em>)<sup><em>T</em></sup></div>\n<div class=\"wh\"><em>F</em>&nbsp;&nbsp;the forward price, agreed today for delivery at time <em>T</em><br>\n<em>S</em>&nbsp;&nbsp;the spot price today<br>\n<em>r</em>&nbsp;&nbsp;the cost of funding the position, as an annual decimal rate<br>\n<em>q</em>&nbsp;&nbsp;the income earned from holding the asset &mdash; coupon on a bond, dividend on a share, the foreign interest rate on a currency<br>\n<em>T</em>&nbsp;&nbsp;the time to delivery, in years</div></div>\n<p><strong>The forward price sits above spot when funding costs more than the asset yields, and below when it yields more than it costs to fund.</strong> Nothing in that sentence is a view about direction.</p>\n<div class=\"sheet\"><div class=\"h\">What r and q are, by asset class</div>\n<div class=\"r\"><b>Bond</b><span><em>r</em> is the repo rate; <em>q</em> is the accruing coupon</span></div>\n<div class=\"r\"><b>Equity</b><span><em>r</em> is the funding rate; <em>q</em> is the expected dividend yield</span></div>\n<div class=\"r\"><b>Currency</b><span><em>r</em> is the domestic rate; <em>q</em> is the foreign rate. This becomes covered interest parity &mdash; Mission 08</span></div>\n<div class=\"r\"><b>Commodity</b><span><em>r</em> is funding plus storage; <em>q</em> is the convenience yield of holding the physical good</span></div>\n</div>\n<p>Because a bond's coupon usually exceeds the repo rate at which it is funded, <strong>bond forward prices typically sit below spot</strong> &mdash; and the gap is not a prediction that bonds will fall. It is the coupon the forward buyer does not receive.</p>\n<div class=\"note\">This is the most reliably misread relationship in markets. A forward rate above spot is routinely reported as the market expecting a rise. It is the market charging for carry, and the two would only coincide by accident.</div>"
    },
    {
     "l": "DEFINE",
     "t": "The swap",
     "h": "A series of forwards, <em>bundled</em>",
     "b": "<p>An <span class=\"k\">interest rate swap</span> is an agreement to exchange interest payment streams on a notional amount for a stated term. One side pays a fixed rate; the other pays a floating rate that resets periodically. The notional itself is never exchanged.</p>\n<div class=\"two\">\n<div><b>Pay fixed, receive floating</b>Pays a known rate, receives whatever the benchmark sets at. <strong>Gains when rates rise.</strong> Negative duration &mdash; the hedge for a bond book.</div>\n<div><b>Receive fixed, pay floating</b>Receives a known rate, pays the benchmark. <strong>Gains when rates fall.</strong> Positive duration, economically like owning a bond.</div>\n</div>\n<p>A swap is a bundle of forward rate agreements: each payment period is a separate bet on where the benchmark will set, and the fixed rate is the single rate that makes the whole bundle worth zero today. <strong>That fixed rate is derived from the forward rates of Mission 03</strong>, which is why the curve is the input to every swap price.</p>\n<p>In India, the dominant rupee swap is the <span class=\"k\">overnight indexed swap</span>: fixed against overnight MIBOR compounded across each period. Its use is straightforward and specific.</p>\n<div class=\"sheet g\"><div class=\"h\">What a swap is actually used for</div>\n<div class=\"r\"><b>Hedging a bond book</b><span>Pay fixed to offset the PV01 of bonds that cannot be sold &mdash; Mission 04's hedge</span></div>\n<div class=\"r\"><b>Converting a borrowing</b><span>A floating-rate borrower who wants certainty pays fixed and receives floating, leaving fixed-rate debt in effect</span></div>\n<div class=\"r\"><b>Expressing a rate view</b><span>Directional positioning without funding a bond position</span></div>\n<div class=\"r\"><b>Pricing reference</b><span>The swap curve is a reference rate structure independent of government bond supply and demand</span></div>\n</div>\n<div class=\"note\">The Reserve Bank of India consolidated its rupee interest rate derivative rules into the Rupee Interest Rate Derivatives Directions, notified in December 2025 and in force from 1 March 2026. Which participants may transact, for what purpose, and what must be reported are all set there.</div>"
    },
    {
     "l": "WORKED",
     "t": "A swap, in cash",
     "h": "₹100 crore, five years, <em>pay fixed</em>",
     "b": "<p>A treasury holds ₹100 crore of five-year bonds and wants to reduce its exposure to rising rates without selling them. It enters a five-year swap: pay fixed at 6.40%, receive overnight MIBOR compounded, on ₹100 crore notional, settling annually.</p>\n<div class=\"wk\"><div class=\"h\">Year 1 &mdash; the benchmark averages 5.90%</div>\n<div class=\"r\"><b>Pays fixed: ₹100 cr &times; 6.40%</b><span>₹6.40 crore</span></div>\n<div class=\"r\"><b>Receives floating: ₹100 cr &times; 5.90%</b><span>₹5.90 crore</span></div>\n<div class=\"r tot\"><b>Net paid</b><span>₹0.50 crore</span></div>\n</div>\n<div class=\"wk\"><div class=\"h\">Year 3 &mdash; the benchmark averages 7.10%</div>\n<div class=\"r\"><b>Pays fixed</b><span>₹6.40 crore</span></div>\n<div class=\"r\"><b>Receives floating: ₹100 cr &times; 7.10%</b><span>₹7.10 crore</span></div>\n<div class=\"r tot\"><b>Net received</b><span>₹0.70 crore</span></div>\n</div>\n<p>Only the difference moves. <strong>The ₹100 crore notional never changes hands in either year</strong>, which is exactly the point of Mission 01's trap card.</p>\n<p>Now the valuation. If five-year rates rise 50 basis points shortly after inception, the swap gains: it is paying a rate now below the market. Using a swap duration of roughly 4.3:</p>\n<div class=\"wk\"><div class=\"h\">Mark to market on a 50 bp rise</div>\n<div class=\"r\"><b>Notional</b><span>₹100 crore</span></div>\n<div class=\"r\"><b>Swap duration</b><span>4.3</span></div>\n<div class=\"r\"><b>Rate move</b><span>0.50%</span></div>\n<div class=\"r tot\"><b>Gain on the swap</b><span>≈ ₹2.15 crore</span></div>\n</div>\n<p>And the bond book it was hedging lost roughly the same amount on the same move. <strong>That ₹2.15 crore is also the current exposure to the counterparty</strong> &mdash; if they failed today, that is what would be lost. Mission 09 picks up exactly this number.</p>\n<div class=\"note\">A swap is worth zero at inception by construction, and rarely worth zero a day later. Its value tracks the difference between the contracted fixed rate and the current market fixed rate for the remaining term.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Bond forwards",
     "h": "Locking a purchase or a sale <em>ahead</em>",
     "b": "<p>A forward on a government security fixes today the price at which a bond will be bought or sold on a future date. It serves purposes a swap cannot.</p>\n<div class=\"sheet\"><div class=\"h\">What a bond forward does</div>\n<div class=\"r\"><b>Locking a reinvestment</b><span>An insurer expecting a large maturity in three months can fix the yield it will reinvest at today</span></div>\n<div class=\"r\"><b>Hedging an issue</b><span>An issuer with a bond sale scheduled can lock the level before the auction</span></div>\n<div class=\"r\"><b>Positioning without funding</b><span>Taking a view on a specific security without paying for it or repoing it</span></div>\n</div>\n<p>India formalised this market through the Forward Contracts in Government Securities Directions in February 2025, which brought bond forwards into a defined regulatory framework alongside the existing margining rules for non-centrally cleared derivatives.</p>\n<p>The pricing is the cost-of-carry formula with the bond's own terms: <strong>spot price, plus the repo cost of funding it to the forward date, less the coupon accruing over that period.</strong> Because the coupon on a government security usually exceeds the overnight repo rate at which it can be funded, the forward price generally sits below the spot price.</p>\n<p>A <span class=\"k\">forward rate agreement</span> is the same idea applied to a single interest period rather than a security: it fixes the rate for a defined future period on a notional amount, settling in cash for the difference against the benchmark. A swap is a strip of these.</p>\n<div class=\"note\">The order of construction is worth holding: a forward rate agreement fixes one period, a swap bundles many, and a bond forward fixes the price of a specific instrument. All three are the same act of moving a price from the future into today.</div>"
    },
    {
     "l": "TRAP",
     "t": "Hedge into position",
     "h": "The instrument does not know your <em>intention</em>",
     "b": "<p>The wrong belief: this is a hedge, so it reduces risk.</p>\n<p>A linear derivative is symmetric and blind to purpose. It offsets an exposure only to the extent that the exposure is really there, really that size, and really over that period. Change any of those and the same contract is a position.</p>\n<div class=\"sheet q\"><div class=\"h\">Four ways a hedge becomes a position without anyone deciding</div>\n<div class=\"r\"><b>Over-hedging</b><span>Hedging $10 million against a $6 million exposure. The extra $4 million is a currency bet</span></div>\n<div class=\"r\"><b>The exposure disappears</b><span>The import order is cancelled. The forward remains, and is now naked</span></div>\n<div class=\"r\"><b>Maturity mismatch</b><span>A three-month hedge against a nine-month exposure. Two rolls remain, at rates not yet known</span></div>\n<div class=\"r\"><b>Basis mismatch</b><span>Hedging a corporate bond with a government bond future. Rates are hedged; the spread is not, and the spread is what moves in stress</span></div>\n</div>\n<p><strong>Why it is a believable mistake.</strong> The intention genuinely was to hedge, the documentation says hedge, and at inception it was one. Hedges decay into positions through the passage of time and the movement of the underlying business, not through any decision to speculate. Nobody signs anything.</p>\n<p>This is why the Indian framework for foreign exchange derivatives is built around <strong>demonstrable underlying exposure</strong> rather than stated intent, and why hedge documentation requires periodic re-testing rather than a one-time assertion.</p>\n<div class=\"note\">The operational control is unglamorous and effective: re-measure the exposure and the hedge on the same date, on the same basis, at a stated frequency. Anything that has drifted is a position, whatever the file says.</div>"
    },
    {
     "l": "DEFINE",
     "t": "Primary source",
     "h": "The rupee derivative <em>rulebook</em>",
     "b": "<p>Rupee interest rate derivatives, forward contracts in government securities and margining for non-centrally cleared derivatives are each governed by their own Directions issued by the RBI's Financial Markets Regulation Department.</p>\n<div class=\"docs\"><b>Official source</b>\n<a href=\"https://fimmda.org/UploadPopupPageFiles/MasterDirection_RBI_Directions_11Dec2025.pdf\" target=\"_blank\" rel=\"noopener\">Master Direction &mdash; Reserve Bank of India (Rupee Interest Rate Derivatives) Directions, notified December 2025</a>\n<a href=\"https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12594&amp;Mode=0\" target=\"_blank\" rel=\"noopener\">Reserve Bank of India &mdash; A.P. (DIR Series) Circular on Risk Management and Inter-Bank Dealings</a></div>\n<div class=\"note\">Reporting obligations sit alongside the trading rules. Rupee derivative transactions are reported to a trade repository, and the RBI's Unique Identifiers Directions of March 2026 extend legal entity identifiers and introduce unique transaction identifiers, the latter taking effect from January 2027.</div>"

     "l": "RECALL",
     "t": "Mission 06",
     "h": "What is now owned",
     "b": "<ul>\n<li><strong>Linear means the payoff moves one-for-one in both directions</strong>, costs nothing at inception, and binds both sides.</li>\n<li><strong>A hedge that \"lost money\" did its job</strong> &mdash; the hedge and the exposure are one position.</li>\n<li><strong>Forwards and futures differ in venue, standardisation, counterparty and cash flow.</strong> Daily margining is the one that changes behaviour.</li>\n<li><strong>A correct hedge can still cause a funding crisis</strong>, because losses settle daily while the offsetting gains may not be realised for years.</li>\n<li><strong>The forward price is cost of carry, not a forecast.</strong> Above spot when funding exceeds yield, below when it does not.</li>\n<li><strong>Bond forwards usually price below spot</strong>, because the coupon exceeds the repo cost.</li>\n<li><strong>A swap is a strip of forward rate agreements</strong>, priced off the curve, with the notional never exchanged.</li>\n<li><strong>Pay fixed gains when rates rise</strong> and carries negative duration &mdash; the standard hedge for a bond book.</li>\n<li><strong>Hedges decay into positions</strong> through over-hedging, disappearing exposure, maturity mismatch and basis mismatch. Re-measure on a schedule.</li>\n</ul>"

   "cards": [
    {
     "l": "DEFINE",
     "t": "What an option is",
     "h": "A choice, bought for a <em>price</em>",
     "b": "<p>An <span class=\"k\">option</span> gives its buyer the right, but not the obligation, to buy or sell an underlying at a fixed price on or before a fixed date. The seller has no choice at all: if the buyer exercises, the seller must perform.</p>\n<div class=\"sheet\"><div class=\"h\">The vocabulary, once</div>\n<div class=\"r\"><b>Call</b><span>The right to <strong>buy</strong> at the strike. Wanted when the underlying rises</span></div>\n<div class=\"r\"><b>Put</b><span>The right to <strong>sell</strong> at the strike. Wanted when the underlying falls</span></div>\n<div class=\"r\"><b>Strike</b><span>The fixed price at which the right may be exercised</span></div>\n<div class=\"r\"><b>Premium</b><span>What the buyer pays the seller, upfront and non-returnable</span></div>\n<div class=\"r\"><b>Expiry</b><span>The date the right lapses</span></div>\n<div class=\"r\"><b>European / American</b><span>Exercisable only at expiry / at any time until expiry</span></div>\n</div>\n<p><strong>The premium is paid whatever happens.</strong> That is the structural difference from a forward, which costs nothing and binds both sides. Here, money changes hands on day one, and it buys an asymmetry.</p>\n<div class=\"dt\"><table>\n<tr><th>Position</th><th>Maximum gain</th><th>Maximum loss</th><th>Wants</th></tr>\n<tr class=\"hi\"><td>Buy a call</td><td class=\"g\">Unlimited</td><td class=\"g\">The premium</td><td class=\"g\">A rise</td></tr>\n<tr><td>Buy a put</td><td class=\"g\">Strike less premium</td><td class=\"g\">The premium</td><td class=\"g\">A fall</td></tr>\n<tr class=\"hi\"><td>Sell a call</td><td class=\"g\">The premium</td><td class=\"g\"><strong>Unlimited</strong></td><td class=\"g\">Nothing to happen</td></tr>\n<tr><td>Sell a put</td><td class=\"g\">The premium</td><td class=\"g\">Strike less premium</td><td class=\"g\">Nothing to happen</td></tr>\n</table></div>\n<p>Read the third row carefully. <strong>A sold call has capped gain and uncapped loss</strong>, which is the reverse of every intuition built up from buying things. The seller is being paid to take a risk that has no natural boundary.</p>\n<div class=\"note\">Buying an option is the only position in this pack where the maximum loss is known at the outset and cannot grow. That certainty is precisely what the premium buys, and it is why options are the instrument of choice when the exposure itself is uncertain.</div>"

     "l": "PICTURE",
     "t": "The payoffs",
     "h": "A bend, where a forward has a <em>line</em>",
     "b": "<p>Take a share at ₹1,000. A three-month call struck at ₹1,050 costs ₹40 in premium.</p>\n<div class=\"dt\"><table>\n<tr><th>Share at expiry</th><th>Option worth</th><th>Less premium</th><th>Outcome</th></tr>\n<tr><td class=\"n\">₹950</td><td class=\"n\">₹0</td><td class=\"n\">&minus;₹40</td><td class=\"g\">Lapses. Loss is the premium</td></tr>\n<tr><td class=\"n\">₹1,050</td><td class=\"n\">₹0</td><td class=\"n\">&minus;₹40</td><td class=\"g\">At the strike. Still lapses</td></tr>\n<tr class=\"hi\"><td class=\"n\">₹1,090</td><td class=\"n\">₹40</td><td class=\"n\">₹0</td><td class=\"g\"><strong>Breakeven</strong> &mdash; strike plus premium</td></tr>\n<tr><td class=\"n\">₹1,200</td><td class=\"n\">₹150</td><td class=\"n\">+₹110</td><td class=\"g\">Exercised. Profit</td></tr>\n<tr><td class=\"n\">₹1,500</td><td class=\"n\">₹450</td><td class=\"n\">+₹410</td><td class=\"g\">Unlimited upside</td></tr>\n</table></div>\n<div class=\"bars\">\n<div><b>Below ₹1,050 &mdash; flat, loss capped at ₹40</b><div class=\"tr\"><i class=\"c\" style=\"width:20%\"></i></div></div>\n<div><b>₹1,050 to ₹1,090 &mdash; recovering the premium</b><div class=\"tr\"><i class=\"d\" style=\"width:38%\"></i></div></div>\n<div><b>Above ₹1,090 &mdash; rises one-for-one with the share</b><div class=\"tr\"><i class=\"b\" style=\"width:88%\"></i></div></div>\n</div>\n<p><strong>The bend at the strike is the entire innovation.</strong> Below it the payoff is flat; above it the payoff has the slope of a forward. An option is a forward that has been switched off in one direction, and the premium is the cost of the switch.</p>\n<p>Two consequences that recur throughout risk management:</p>\n<ul>\n<li><strong>Breakeven is not the strike.</strong> It is the strike plus the premium for a call, minus the premium for a put. An option can finish above its strike and still lose money.</li>\n<li><strong>Payoff is not profit.</strong> The option is worth ₹40 at ₹1,090 and the position has made nothing. Reports that show payoff without netting the premium overstate results systematically.</li>\n</ul>\n<div class=\"note\">A hedger buying a put on a bond portfolio is buying exactly this shape: full protection below the strike, full participation above it, in exchange for a known upfront cost. That is insurance, and it is priced like insurance.</div>"

    {
     "l": "MECHANISM",
     "t": "The two parts",
     "h": "What is real now, and what is <em>possibility</em>",
     "b": "<p>An option's premium splits into two components that behave completely differently.</p>\n<div class=\"two\">\n<div><b>Intrinsic value</b>What the option is worth if exercised immediately. For a call, the underlying less the strike, floored at zero. Never negative &mdash; the right would simply not be used.</div>\n<div><b>Time value</b>Everything else. What the market pays for the chance that the option ends up further in the money before expiry.</div>\n</div>\n<div class=\"dt\"><table>\n<tr><th>Share price</th><th>Premium</th><th>Intrinsic</th><th>Time value</th><th>Called</th></tr>\n<tr><td class=\"n\">₹950</td><td class=\"n\">₹12</td><td class=\"n\">₹0</td><td class=\"n\">₹12</td><td class=\"g\">Out of the money</td></tr>\n<tr class=\"hi\"><td class=\"n\">₹1,050</td><td class=\"n\">₹40</td><td class=\"n\">₹0</td><td class=\"n\">₹40</td><td class=\"g\">At the money &mdash; maximum time value</td></tr>\n<tr><td class=\"n\">₹1,150</td><td class=\"n\">₹118</td><td class=\"n\">₹100</td><td class=\"n\">₹18</td><td class=\"g\">In the money</td></tr>\n<tr><td class=\"n\">₹1,400</td><td class=\"n\">₹352</td><td class=\"n\">₹350</td><td class=\"n\">₹2</td><td class=\"g\">Deep in the money</td></tr>\n</table></div>\n<p><strong>Time value is largest at the money and shrinks in both directions.</strong> Deep in the money, the option is almost certainly going to be exercised and behaves like the underlying itself. Far out of the money, it is almost certainly worthless. In both extremes there is little left to be uncertain about, and uncertainty is what time value prices.</p>\n<p><strong>Time value decays to zero at expiry, always, and the decay accelerates.</strong> An option with 90 days left loses time value slowly; with 5 days left it drains rapidly. This is the only certainty in options pricing: whatever else happens, that component is going to zero on a known date.</p>\n<div class=\"note\">Decay is the option seller's income and the option buyer's cost. A buyer who is right about direction but wrong about timing loses, because the clock ran out before the move arrived. Being right eventually is not a payoff structure options support.</div>"

    {
     "l": "FORMULA",
     "t": "Five inputs",
     "h": "And the one that cannot be <em>observed</em>",
     "b": "<p>An option's theoretical price depends on five things. Four are observable. The fifth is not, and that is where the entire market lives.</p>\n<div class=\"dt\"><table>\n<tr><th>Input</th><th>Observable?</th><th>Raises a call's price when</th></tr>\n<tr><td>Underlying price</td><td class=\"g\">Yes</td><td class=\"g\">It rises</td></tr>\n<tr><td>Strike</td><td class=\"g\">Yes &mdash; contractual</td><td class=\"g\">It is lower</td></tr>\n<tr><td>Time to expiry</td><td class=\"g\">Yes &mdash; a calendar fact</td><td class=\"g\">There is more of it</td></tr>\n<tr><td>Interest rate</td><td class=\"g\">Yes</td><td class=\"g\">It is higher</td></tr>\n<tr class=\"hi\"><td><strong>Volatility</strong></td><td class=\"g\"><strong>No</strong></td><td class=\"g\">It is higher &mdash; for calls <em>and</em> puts</td></tr>\n</table></div>\n<div class=\"fx\"><div class=\"cap\">The Black-Scholes European call price</div>\n<div class=\"eq\"><em>C</em> = <em>S</em> &times; <em>N</em>(<em>d</em><sub>1</sub>) &minus; <em>K</em> &times; <em>e</em><sup>&minus;<em>rT</em></sup> &times; <em>N</em>(<em>d</em><sub>2</sub>)</div>\n<div class=\"wh\"><em>C</em>&nbsp;&nbsp;the call premium<br>\n<em>S</em>&nbsp;&nbsp;the current price of the underlying<br>\n<em>K</em>&nbsp;&nbsp;the strike price<br>\n<em>r</em>&nbsp;&nbsp;the risk-free interest rate<br>\n<em>T</em>&nbsp;&nbsp;time to expiry, in years<br>\n<em>e</em><sup>&minus;<em>rT</em></sup>&nbsp;&nbsp;the discount factor bringing the strike back to today's value<br>\n<em>N</em>(&middot;)&nbsp;&nbsp;the cumulative normal distribution &mdash; the probability of being below a given point<br>\n<em>d</em><sub>1</sub>, <em>d</em><sub>2</sub>&nbsp;&nbsp;standardised distances from the strike, both computed from <em>S</em>, <em>K</em>, <em>r</em>, <em>T</em> and volatility</div></div>\n<p><strong>Volatility raises the price of calls and puts alike</strong>, because both benefit from a wider range of outcomes. The buyer's downside is capped at the premium either way, so more dispersion is worth more &mdash; and that is the asymmetry being paid for.</p>\n<p>Since volatility cannot be observed, the market runs the equation backwards: take the traded premium, solve for the volatility that reproduces it, and call the answer <span class=\"k\">implied volatility</span>. <strong>Options are quoted in volatility, not in rupees.</strong> A dealer saying \"16 vol\" is naming the input, and the premium follows from it.</p>\n<div class=\"note\">Black-Scholes assumes constant volatility and normally distributed returns. Real markets show fatter tails and volatility that varies by strike. The model survives because everyone uses it as a quoting convention rather than a belief &mdash; the smile visible across strikes is the market correcting the assumption in the open.</div>"

    {
     "l": "CHEAT",
     "t": "The Greeks",
     "h": "One derivative per <em>input</em>",
     "b": "<p>Each Greek measures how the premium responds to one input moving while the others hold still. They are the working vocabulary of an options book.</p>\n<div class=\"sheet\"><div class=\"h\">The five that matter</div>\n<div class=\"r\"><b>Delta</b><span>Change in premium per unit change in the underlying. 0 to 1 for a call, 0 to &minus;1 for a put. Roughly the probability of finishing in the money &mdash; and the hedge ratio</span></div>\n<div class=\"r\"><b>Gamma</b><span>Change in <em>delta</em> per unit change in the underlying. Highest at the money near expiry. It is what makes a delta hedge need constant rebalancing</span></div>\n<div class=\"r\"><b>Vega</b><span>Change in premium per 1% change in implied volatility. Positive for every bought option, call or put</span></div>\n<div class=\"r\"><b>Theta</b><span>Change in premium per day passing. Negative for the buyer, positive for the seller. The decay</span></div>\n<div class=\"r\"><b>Rho</b><span>Change in premium per 1% change in interest rates. Usually the smallest, except on long-dated options</span></div>\n</div>\n<p><strong>Delta is the hedge ratio.</strong> A call with delta 0.60 on 10,000 shares moves like 6,000 shares, so shorting 6,000 shares neutralises the position against small moves. That is delta hedging, and it is how an options dealer runs a book without taking a directional view.</p>\n<p><strong>Gamma is why delta hedging is hard.</strong> Delta itself changes as the underlying moves, so the hedge that was correct this morning is wrong this afternoon. A short-gamma position &mdash; typically from having sold options &mdash; requires buying as the market rises and selling as it falls, which means trading into every move at the worst moment.</p>\n<div class=\"sheet q\"><div class=\"h\">The pairing worth remembering</div>\n<div class=\"r\"><b>Long options</b><span>Long gamma, long vega, <strong>negative theta</strong>. Pays rent daily, profits from movement</span></div>\n<div class=\"r\"><b>Short options</b><span>Short gamma, short vega, <strong>positive theta</strong>. Collects rent daily, loses from movement</span></div>\n</div>\n<div class=\"note\">Theta and gamma always have opposite signs. There is no position that collects decay and also profits from large moves. Any strategy that appears to offer both has hidden the risk somewhere, usually in a tail.</div>"

    {
     "l": "FORMULA",
     "t": "Parity",
     "h": "Calls and puts are the <em>same instrument</em>",
     "b": "<p>A call and a put at the same strike and expiry are not independent. They are linked by an arbitrage relationship that must hold or free money exists.</p>\n<div class=\"fx\"><div class=\"cap\">Put-call parity, for European options</div>\n<div class=\"eq\"><em>C</em> &minus; <em>P</em> = <em>S</em> &minus; <em>K</em> &times; <em>e</em><sup>&minus;<em>rT</em></sup></div>\n<div class=\"wh\"><em>C</em>&nbsp;&nbsp;the call premium<br>\n<em>P</em>&nbsp;&nbsp;the put premium, at the same strike and expiry<br>\n<em>S</em>&nbsp;&nbsp;the current price of the underlying<br>\n<em>K</em>&nbsp;&nbsp;the strike, discounted back to today at rate <em>r</em> over time <em>T</em></div></div>\n<p>The logic is direct. Buy a call and sell a put at the same strike, and the combined position obliges purchase at the strike whatever happens &mdash; above it the call is exercised, below it the put is exercised against you. <strong>That combination is a forward.</strong> So the difference between the two premiums must equal the difference between spot and the discounted strike, which is what a forward is worth.</p>\n<div class=\"sheet g\"><div class=\"h\">What parity lets you build</div>\n<div class=\"r\"><b>Synthetic forward</b><span>Long call plus short put at the same strike</span></div>\n<div class=\"r\"><b>Synthetic call</b><span>Long put plus long the underlying</span></div>\n<div class=\"r\"><b>Synthetic put</b><span>Long call plus short the underlying</span></div>\n</div>\n<p>Two practical consequences. <strong>A quoted call price implies a put price</strong>, so a mispriced put can be identified from the call and the forward alone. And a hedge blocked in one instrument can often be constructed from the others &mdash; which matters where regulation or availability restricts a particular product.</p>\n<div class=\"note\">Parity holds for European options. American options can be exercised early, which breaks the equality into an inequality &mdash; the early exercise right is worth something, and that something is why American options are never cheaper than their European equivalents.</div>"

     "l": "TRAP",

     "b": "<p>The wrong belief: selling out-of-the-money options is a reliable income strategy, because most of them expire worthless.</p>\n<p>Most of them do. That is precisely what makes the strategy dangerous. An option with a 5% chance of finishing in the money produces a profit in 19 months out of 20, building a track record that looks like skill. <strong>The twentieth month is sized to remove more than the previous nineteen produced</strong>, and the arithmetic is not close.</p>\n<div class=\"wk\"><div class=\"h\">Selling a call for ₹40, 5% chance of a large move</div>\n<div class=\"r\"><b>19 months of premium collected</b><span>+₹760</span></div>\n<div class=\"r\"><b>The month the underlying gaps to ₹1,500</b><span>&minus;₹450</span></div>\n<div class=\"r\"><b>Less premium received that month</b><span>+₹40</span></div>\n<div class=\"r tot\"><b>Net over 20 months</b><span>+₹350</span></div>\n<div class=\"r\"><b>But if it gaps to ₹2,200 instead</b><span>&minus;₹1,150</span></div>\n<div class=\"r tot\"><b>Net over 20 months</b><span>&minus;₹350</span></div>\n</div>\n<p>The distribution of outcomes has no right-hand boundary, so no number of good months settles the question. <strong>Nineteen wins and one loss can be a net loss, and the size of the loss is not knowable in advance.</strong></p>\n<p><strong>Why it is a believable mistake.</strong> The income is real, it arrives on schedule, it appears in every month's results, and the risk appears in none of them until it does. Theta is visible daily; gamma is invisible until it is the only thing that matters. Every measure of consistency &mdash; win rate, months profitable, average return &mdash; flatters the strategy, and the one measure that does not is the one nobody has data for.</p>\n<div class=\"note\">This is the same shape as writing insurance without reserving, and it is why a book that has sold options is monitored on gamma and on tail scenarios rather than on realised profit. Realised profit is the least informative number available about a short-option position.</div>"

    {
     "l": "MECHANISM",
     "t": "In India",
     "h": "Where options actually <em>trade</em>",
     "b": "<p>The Indian options market is highly concentrated in listed index and stock options on the exchanges, regulated by SEBI, with over-the-counter options in currencies and interest rates regulated by the RBI.</p>\n<div class=\"sheet\"><div class=\"h\">The segments</div>\n<div class=\"r\"><b>Index and stock options</b><span>Exchange-traded, centrally cleared, European style, cash settled for indices. By volume, among the largest options markets in the world</span></div>\n<div class=\"r\"><b>Currency options</b><span>Exchange-traded on recognised exchanges, and over the counter through authorised dealer banks under the RBI's foreign exchange framework</span></div>\n<div class=\"r\"><b>Interest rate options</b><span>Over the counter, governed by the RBI's rupee interest rate derivative rules &mdash; caps, floors and swaptions</span></div>\n</div>\n<p>Two structural features of the Indian listed market are worth knowing because they shape the risk. <strong>Volume is heavily concentrated in very short-dated options</strong>, often expiring within days, where gamma is at its highest and time value drains fastest. And <strong>index options are cash settled</strong>, so no delivery obligation arises &mdash; the difference is simply paid.</p>\n<p>On the over-the-counter side, the same principle as Mission 06 applies: a currency option sold to a client must sit against a demonstrable underlying exposure, and the permissible product set for a given class of user is set by the RBI rather than negotiated.</p>\n<div class=\"note\">Short-dated options are not smaller versions of long-dated ones. Gamma rises sharply as expiry approaches, so a position that looks modest by premium can carry very large sensitivity to a move on the final day.</div>"

     "l": "ORIENT",

     "h": "Which currency is being <em>priced</em>",
     "b": "<p>Every foreign exchange quote names two currencies. The first is the <span class=\"k\">base</span> currency; the second is the <span class=\"k\">quote</span> currency. <strong>The number says how many units of the quote currency buy one unit of the base.</strong></p>\n<p><code>USD/INR = 95.50</code> means one US dollar buys 95.50 rupees. The dollar is the base; the rupee is the quote.</p>\n<div class=\"sheet q\"><div class=\"h\">The confusion this generates, resolved</div>\n<div class=\"r\"><b>\"The rate went up to 96\"</b><span>The <em>dollar</em> strengthened. The rupee weakened. More rupees per dollar</span></div>\n<div class=\"r\"><b>\"The rate fell to 94\"</b><span>The dollar weakened, the rupee strengthened</span></div>\n<div class=\"r\"><b>\"Buying USD/INR\"</b><span>Buying dollars, selling rupees</span></div>\n<div class=\"r\"><b>\"A rupee appreciation\"</b><span>The number goes <strong>down</strong>. Counter-intuitive and entirely standard</span></div>\n</div>\n<p>Because the rupee is the quote currency, <strong>a rising number is bad news for an importer and good news for an exporter</strong>, and the direction of the number is the opposite of the direction of the currency being discussed.</p>\n<p>Settlement dates carry their own vocabulary, and the difference is real money:</p>\n<div class=\"sheet\"><div class=\"h\">Value dates in the Indian market</div>\n<div class=\"r\"><b>Cash</b><span>Settles today</span></div>\n<div class=\"r\"><b>Tom</b><span>Settles tomorrow</span></div>\n<div class=\"r\"><b>Spot</b><span>Settles in two business days. <strong>The reference quote</strong></span></div>\n<div class=\"r\"><b>Forward</b><span>Any date beyond spot</span></div>\n</div>\n<div class=\"note\">\"Spot\" is not today. It is two business days ahead, and the cash and tom rates differ from it by the interest for those days. A treasury needing dollars today pays the cash rate, not the spot rate on the screen.</div>"

    {
     "l": "FORMULA",
     "t": "Covered interest parity",
     "h": "The forward rate is two <em>interest rates</em>",
     "b": "<p>There are two ways to hold rupees in three months' time. Keep rupees and earn the rupee rate. Or convert to dollars, earn the dollar rate, and agree today to convert back. <strong>Both routes must produce the same amount</strong>, or the difference is free money available in unlimited size.</p>\n<div class=\"fx\"><div class=\"cap\">The forward rate forced by that equality</div>\n<div class=\"eq\"><em>F</em> = <em>S</em> &times; <span class=\"fr\"><i>1 + r<sub>INR</sub> &times; d/365</i><i>1 + r<sub>USD</sub> &times; d/360</i></span></div>\n<div class=\"wh\"><em>F</em>&nbsp;&nbsp;the forward rate, rupees per dollar<br>\n<em>S</em>&nbsp;&nbsp;the spot rate, rupees per dollar<br>\n<em>r</em><sub>INR</sub>&nbsp;&nbsp;the rupee interest rate for the period, as an annual decimal<br>\n<em>r</em><sub>USD</sub>&nbsp;&nbsp;the dollar interest rate for the period<br>\n<em>d</em>&nbsp;&nbsp;days in the period. Rupee markets count on a 365-day year, dollar markets on 360</div></div>\n<p><strong>The higher-interest currency always trades at a forward discount.</strong> The rupee pays more than the dollar, so rupees buy fewer dollars forward than they do spot &mdash; the forward number is higher. This relationship is called <span class=\"k\">covered interest parity</span>, and it holds because it can be enforced by arbitrage.</p>\n<p>The gap is quoted as <span class=\"k\">forward premium</span>, expressed in paise or as an annualised percentage. <strong>It is not a forecast of the rupee.</strong> It is the interest rate difference, restated as a currency rate.</p>\n<div class=\"note\">The day-count mismatch is not a rounding detail. Rupee money markets use actual/365 and dollar markets actual/360, so the same nominal rate produces different accrual, and a forward priced on the wrong convention is wrong by a few paise on every deal.</div>"

     "b": "<p>Spot is 95.50. The three-month rupee rate is 5.60% and the three-month dollar rate is 3.60%. The period is 91 days.</p>\n<div class=\"wk\"><div class=\"h\">Building the forward</div>\n<div class=\"r\"><b>Rupee interest factor: 1 + 0.0560 &times; 91/365</b><span>1.013962</span></div>\n<div class=\"r\"><b>Dollar interest factor: 1 + 0.0360 &times; 91/360</b><span>1.009100</span></div>\n<div class=\"r\"><b>Ratio</b><span>1.004818</span></div>\n<div class=\"r\"><b>Spot 95.50 &times; 1.004818</b><span>&nbsp;</span></div>\n<div class=\"r tot\"><b>Three-month forward rate</b><span>95.96</span></div>\n<div class=\"r\"><b>Forward premium</b><span>46 paise</span></div>\n<div class=\"r tot\"><b>Annualised premium</b><span>≈ 1.93%</span></div>\n</div>\n<p>The interest rate difference is 2.00% and the annualised premium comes out at 1.93%. <strong>The 7 basis point gap is the day-count conventions and the compounding, not a market view.</strong> Nothing about direction has entered the calculation at any point.</p>\n<p>Now the reading that matters. An importer who hedges at 95.96 has not paid 46 paise for protection. <strong>They have given up 46 paise of rupee interest they would have earned by holding rupees</strong> &mdash; it is the cost of carry, exactly as in Mission 06, and it would be identical if every forecaster in the market expected the rupee to strengthen.</p>\n<div class=\"note\">When forward premia move sharply without spot moving, the cause is almost always the rupee-dollar rate differential shifting, or dollar funding becoming scarce. Reading a jump in forward premium as a currency signal reads the interest rate market as if it were the currency market.</div>"
