<div class="wk"><div class="h">HQLA, after haircuts</div>
<div class="r"><b>Level 1: gilts and reserves, 0% haircut</b><span>&pound;80m</span></div>
<div class="r"><b>Level 2A: &pound;20m &times; (1 &minus; 15%)</b><span>&pound;17m</span></div>
<div class="r tot"><b>Total HQLA</b><span>&pound;97m</span></div>
</div>
<div class="wk"><div class="h">Net outflows over 30 days</div>
<div class="r"><b>Stressed deposit and wholesale outflows</b><span>&pound;120m</span></div>
<div class="r"><b>Less inflows, capped at 75% of outflows</b><span>&minus;&pound;30m</span></div>
<div class="r tot"><b>Net cash outflow</b><span>&pound;90m</span></div>
</div>
<div class="fx"><div class="eq">LCR = <span class="fr"><i>97</i><i>90</i></span> = 108%</div>
<div class="wh">Above 100%, so the bank passes &mdash; with an 8-point margin</div></div>
<p>Notice how much rides on two judgements: which assets qualify as HQLA, and how severe the assumed outflows are. Both are governed assumptions, and both are fields you will trace and reconcile.</p>`},

{l:"FORMULA",t:"The NSFR",h:"Funding that <em>stays</em>",b:`<p>The <span class="k">Net Stable Funding Ratio</span> (NSFR) is the long-horizon twin. It asks whether the bank's funding is stable enough, over a one-year horizon, to support its assets &mdash; so it is not relying on cheap short-term borrowing to fund long-term lending.</p>
<div class="fx"><div class="cap">Net Stable Funding Ratio</div>
<div class="eq">NSFR = <span class="fr"><i>Available stable funding (ASF)</i><i>Required stable funding (RSF)</i></span> &ge; 100%</div>
<div class="wh">ASF&nbsp;funding weighted by how likely it is to stay &mdash; retail deposits and capital score high, overnight wholesale scores low<br>
RSF&nbsp;assets weighted by how much stable funding they need &mdash; a long illiquid loan needs a lot, cash needs none</div></div>
<div class="dt"><table>
<tr><th>Ratio</th><th>Horizon</th><th>Guards against</th></tr>
<tr><td>LCR</td><td>30-day stress</td><td>A sudden run</td></tr>
<tr><td>NSFR</td><td>1 year, structural</td><td>Over-reliance on short-term funding</td></tr>
</table></div>`},

{l:"MECHANISM",t:"Encumbrance",h:"The asset you cannot <em>count</em>",b:`<p>An asset is <span class="k">encumbered</span> when it has been pledged as security to someone else &mdash; typically through a repo (Mission 03) or as collateral for a derivative. Encumbered assets cannot be sold freely, so they cannot count as HQLA.</p>
<div class="flow">
<div class="n"><b>Unencumbered gilt</b>Free to sell or pledge &mdash; counts as Level 1 HQLA</div>
<div class="a">&#8594;</div>
<div class="n"><b>Repoed gilt</b>Pledged away &mdash; removed from the buffer</div>
</div>
<div class="note">The encumbrance flag is one field, and it is decisive: the same gilt is either full HQLA or nothing depending on it. Reconciling encumbrance between the collateral system and the liquidity return is a classic, recurring reporting problem.</div>`},

{l:"TRAP",t:"The 100% floor is not the target",h:"Banks run <em>well</em> above 100%",b:`<p>The rules require LCR and NSFR of at least 100%, but no bank runs at exactly 100% &mdash; a single bad day would breach it, and a breach is a supervisory event. Banks hold comfortable margins and manage to an internal target well above the floor.</p>
<div class="two">
<div><b>The regulatory floor</b>100% &mdash; the legal minimum, a hard line</div>
<div><b>The management target</b>Often 120&ndash;140%+ &mdash; the level Treasury actually steers to</div>
</div>
<p>Why it matters to you: reports and dashboards show the ratio against the internal target, not just the floor. Reading a 115% LCR as "barely passing" misunderstands how the number is managed.</p>`}
]},

/* ===================== 10 ===================== */
{n:"10",title:"Interest-rate risk and ALM",stage:"Liquidity",
line:"The risk that rate moves quietly erode a bank's margin and value, the two lenses used to see it, the tools that measure it, and the soft assumption the whole thing rests on.",
cards:[

{l:"ORIENT",t:"The big picture, first",h:"The risk that killed a bank in <em>2023</em>",b:`<p>Here is the whole of this mission in one breath. A bank borrows short and lends long (Mission 02), so its funding reprices faster than its assets. When rates move, the two sides move out of step &mdash; and that gap quietly bleeds either the bank's <em>income</em> or the <em>value</em> of its balance sheet. This is <span class="k">interest-rate risk in the banking book</span> (IRRBB), managed by a discipline called <span class="k">asset-liability management</span> (ALM) &mdash; the deliberate matching of the two sides.</p>
<div class="dt"><table>
<tr><th>The setup</th><th>What happens when rates rise</th></tr>
<tr><td>Assets: long, slow to reprice (fixed mortgages, long bonds)</td><td>Still earning the old, lower rate</td></tr>
<tr><td>Funding: short, fast to reprice (deposits, wholesale)</td><td>Cost jumps to the new, higher rate</td></tr>
<tr><td class="g">Result</td><td class="g">Margin squeezed; long bonds lose value</td></tr>
</table></div>
<p>It carries <strong>no Pillar 1 capital charge</strong> &mdash; it sits in Pillar 2 (Mission 08). But do not mistake "no capital charge" for "not dangerous": in March 2023 a US bank was sunk almost entirely by unmanaged interest-rate risk on its bond portfolio. This is the risk that hides.</p>`},

{l:"MECHANISM",t:"The two lenses",h:"Income now, or value <em>forever</em>",b:`<p>There are two ways to look at rate risk, and a bank must watch both because they can point in opposite directions. This is the single most useful table in the mission.</p>
<div class="dt"><table>
<tr><th></th><th>NII &mdash; net interest income</th><th>EVE &mdash; economic value of equity</th></tr>
<tr><td>Measures</td><td>The earnings hit over the next 1&ndash;3 years</td><td>The change in long-run value of assets minus liabilities</td></tr>
<tr><td>Horizon</td><td>Short &mdash; this year's profit</td><td>Long &mdash; the whole life of every position</td></tr>
<tr><td>Question</td><td>"Will a rate move dent our income soon?"</td><td>"Will it erode our underlying worth?"</td></tr>
<tr><td>Whose view</td><td>The earnings view &mdash; management, analysts</td><td>The value view &mdash; the supervisor's favourite</td></tr>
</table></div>
<p>A position can protect income and destroy value at the same time, which is why a bank that watches only NII can be quietly bleeding EVE &mdash; exactly the 2023 failure. The regulator sets outlier tests on both.</p>`},

{l:"MECHANISM",t:"The tools",h:"Gap and <em>duration</em>",b:`<p>Two measurement tools sit under the two lenses.</p>
<div class="dt"><table>
<tr><th>Tool</th><th>What it does</th><th>Feeds</th></tr>
<tr><td>Repricing gap</td><td>Sorts assets and liabilities into time buckets by when each next reprices (its rate resets); the mismatch in a bucket is the gap</td><td>NII &mdash; income view</td></tr>
<tr><td>Duration</td><td>Measures how much a position's value changes for a 1% rate move &mdash; longer duration, bigger swing</td><td>EVE &mdash; value view</td></tr>
</table></div>
<p>A simple gap picture: if far more funding reprices in the 0&ndash;3 month bucket than assets, a rate rise hits the bank's cost before its income &mdash; a negative short-bucket gap. Treasury uses swaps (Mission 03) to close gaps it does not want.</p>`},

{l:"MECHANISM",t:"The soft input",h:"Behaviour, not <em>contract</em>",b:`<p>The hardest part of the whole mission is not the maths &mdash; it is that customers do not behave the way their contracts say.</p>
<div class="dt"><table>
<tr><th>Product</th><th>Contract says</th><th>Reality</th></tr>
<tr><td>Current / instant-access deposits</td><td>Withdrawable today</td><td>Most balances stay for years &mdash; "sticky"</td></tr>
<tr><td>Fixed-rate mortgage</td><td>Fixed to a maturity date</td><td>Many repay early when rates fall &mdash; "prepayment"</td></tr>
</table></div>
<p>So the bank overlays <strong>behavioural assumptions</strong>: it models a non-maturing deposit (one with no fixed end date) as if part of it were long-term funding, and a mortgage as repaying faster than its stated term. These assumptions <em>are</em> the model &mdash; change them and every gap, duration and EVE number moves.</p>
<div class="note">Whoever owns the behavioural assumptions owns the answer. That is why they are governed, dated, challenged and re-approved &mdash; and why a change to them is a formal, evidenced change, not a spreadsheet tweak.</div>`},

{l:"TRAP",t:"The assumption that is really a decision",h:"The soft number that moves <em>everything</em>",b:`<p>Because behavioural assumptions are judgements dressed as inputs, they are the easiest place in the whole balance sheet to accidentally &mdash; or deliberately &mdash; move the answer.</p>
<div class="two">
<div><b>The temptation</b>Assume deposits are stickier than they are, and the funding looks more stable, EVE looks safer, everything improves &mdash; on paper</div>
<div><b>The discipline</b>Every assumption traced to evidence, dated, owned, and re-tested against what customers actually did</div>
</div>
<p>For a change or reporting role this is the crux: you are often building the very system that stores, applies and evidences these assumptions. Getting the governance of a soft number right is the real deliverable, not the arithmetic.</p>`}
]},

/* ===================== 11 ===================== */
{n:"11",title:"Funds transfer pricing",stage:"Liquidity",
line:"The internal price that moves funding cost and value from the business lines to Treasury and back &mdash; how it is built, why it exists, and the number worked through.",
cards:[

{l:"WHY",t:"Why an internal price exists",h:"Treasury in the <em>middle</em>",b:`<p>A branch that takes deposits has spare cash; a mortgage desk that lends needs cash. Left alone, each would judge its own profit using whatever rate it happened to face. <span class="k">Funds transfer pricing</span> (FTP) fixes that by putting Treasury in the middle: it "buys" every deposit and "sells" funding to every loan, at a single internal price called the transfer rate.</p>
<div class="flow">
<div class="n"><b>Deposit business</b>Lends its cash to Treasury, earns the transfer rate</div>
<div class="a">&#8594;</div>
<div class="n"><b>Treasury</b>The internal bank &mdash; sets the price, holds the mismatch</div>
<div class="a">&#8594;</div>
<div class="n"><b>Lending business</b>Buys funding from Treasury, pays the transfer rate</div>
</div>
<div class="note">FTP is how a bank knows which activities actually make money once funding is priced properly. It is also how liquidity risk is priced back to the business that creates it &mdash; the direct link to Missions 09 and 10.</div>`},

{l:"MECHANISM",t:"What goes into the rate",h:"Three components, <em>stacked</em>",b:`<p>The transfer rate is not one number pulled from the air; it is built from components, each pricing a specific thing.</p>
<div class="dt"><table>
<tr><th>Component</th><th>Prices</th></tr>
<tr><td>Base curve (e.g. SONIA)</td><td>The pure cost of money for the tenor</td></tr>
<tr><td>Term liquidity premium</td><td>The extra cost of funding for longer &mdash; longer money is dearer and scarcer</td></tr>
<tr><td>Contingent liquidity cost</td><td>The cost of holding buffers (Mission 09) against the risk the product creates</td></tr>
</table></div>
<p>Stack the three and you have the rate the business is charged or paid. Change the liquidity premium and you change which products look profitable &mdash; which is why FTP methodology is a governed, contested document, not a setting.</p>`},

{l:"DEFINE",t:"Matched-maturity",h:"Price to the <em>tenor</em>",b:`<p>The core principle is <span class="k">matched-maturity FTP</span>: fund each position at the transfer rate for <em>its own</em> maturity, not at a single blended rate for the whole book.</p>
<div class="two">
<div><b>Blended (wrong)</b>One average rate for everything &mdash; hides that long lending is riskier and dearer to fund</div>
<div><b>Matched-maturity (right)</b>A 5-year loan is funded at the 5-year transfer rate; a 1-month deposit earns the 1-month rate</div>
</div>
<p>Matched-maturity is what isolates the business's real margin from Treasury's funding-and-liquidity result. Without it, a business can look profitable purely because it is being under-charged for long, risky funding.</p>`},

{l:"WORKED",t:"FTP in pounds",h:"Margins, <em>separated</em>",b:`<p>A 5-year fixed-rate loan at 6.0%, funded by a 1-year deposit costing 3.0%. The 5-year transfer rate is 4.5%; the 1-year transfer rate is 3.5%.</p>
<div class="wk"><div class="h">Lending business</div>
<div class="r"><b>Earns loan rate</b><span>6.0%</span></div>
<div class="r"><b>Pays Treasury the 5-year transfer rate</b><span>&minus;4.5%</span></div>
<div class="r tot"><b>Lending margin (pure credit spread)</b><span>1.5%</span></div>
</div>
<div class="wk"><div class="h">Deposit business</div>
<div class="r"><b>Earns the 1-year transfer rate from Treasury</b><span>3.5%</span></div>
<div class="r"><b>Pays depositor</b><span>&minus;3.0%</span></div>
<div class="r tot"><b>Deposit margin</b><span>0.5%</span></div>
</div>
<div class="wk"><div class="h">Treasury</div>
<div class="r"><b>Receives 5-year rate, pays 1-year rate: the term mismatch it chose to run</b><span>4.5% &minus; 3.5% = 1.0%</span></div>
</div>
<p>Each unit now owns exactly the result it controls: the lender owns credit spread, the deposit-taker owns deposit margin, and Treasury owns the maturity-mismatch result &mdash; and the interest-rate risk that comes with it (Mission 10).</p>`},

{l:"TRAP",t:"Behavioural life again",h:"The deposit with no <em>maturity</em>",b:`<p>The behavioural assumptions of Mission 10 come straight back here. A non-maturing deposit (no fixed end date) has no contractual maturity to price against &mdash; so what transfer rate does it earn?</p>
<p>The answer depends entirely on the assumed <em>behavioural</em> life. Treat instant-access balances as effectively 5-year money and they earn the 5-year rate, and the deposit business looks far more profitable. The same assumption drives both the FTP result and the IRRBB numbers, so the two must use one governed set.</p>
<div class="note">This is the connective tissue of the whole liquidity block: one behavioural assumption set feeds LCR/NSFR, IRRBB and FTP at once. A change to it in one place that is not reflected in the others is a reconciliation break waiting to happen.</div>`}
]},

/* ===================== 12 ===================== */
{n:"12",title:"The reporting machine",stage:"Reporting",
line:"The regulatory returns a UK bank actually files &mdash; what each one is, how often it goes, and the production cycle that turns raw data into a submission on a deadline.",
cards:[

{l:"ORIENT",t:"What reporting even is",h:"The number, <em>filed</em>",b:`<p>Everything so far produces numbers. Regulatory reporting is the machinery that packages those numbers into prescribed templates and files them with the regulator on a fixed calendar. Miss a deadline, or file a number that will not reconcile, and it is a supervisory issue in its own right &mdash; independent of whether the underlying business is sound.</p>
<div class="note">This mission is the destination of the whole pack for a reporting role. Everything upstream exists to make these returns correct, on time, and defensible.</div>`},

{l:"DEFINE",t:"COREP and FINREP",h:"Prudential, and <em>financial</em>",b:`<p>Two big harmonised return families, inherited from EU frameworks and retained in the UK.</p>
<div class="dt"><table>
<tr><th>Return</th><th>Full name</th><th>Carries</th></tr>
<tr><td>COREP</td><td>Common Reporting</td><td>The prudential numbers &mdash; capital, RWA, large exposures, leverage, and the liquidity ratios (LCR and NSFR sit in COREP templates)</td></tr>
<tr><td>FINREP</td><td>Financial Reporting</td><td>The financial-statement numbers &mdash; balance sheet, profit and loss, provisions &mdash; on a prudential basis</td></tr>
</table></div>
<p>They are submitted as structured data on defined templates, quarterly for most items, and they must reconcile to each other and to the published accounts.</p>`},

{l:"DEFINE",t:"PRA110",h:"The cash-flow <em>ladder</em>",b:`<p>The <span class="k">PRA110</span> is a UK-specific liquidity return &mdash; a "110" numbered PRA template &mdash; and the one a liquidity reporting role lives closest to. It is a cash-flow mismatch ladder: it lays out the bank's contractual and behavioural cash flows across time buckets out to a long horizon, so the supervisor can see where a funding gap opens.</p>
<div class="dt"><table>
<tr><th>Feature</th><th>Detail</th></tr>
<tr><td>Shape</td><td>Cash inflows and outflows bucketed across time &mdash; a maturity ladder</td></tr>
<tr><td>Frequency</td><td>Monthly in normal times; <strong>weekly, and daily in stress</strong> for the largest firms</td></tr>
<tr><td>Replaced</td><td>The old FSA047 / FSA048 returns (from the Financial Services Authority, the PRA's predecessor)</td></tr>
</table></div>
<div class="note">The daily-in-stress frequency is why the PRA110 pipeline has to be robust and automated. A return you might file every day cannot depend on a manual spreadsheet step &mdash; which is exactly the kind of fragility a change programme is asked to remove.</div>`},

{l:"DEFINE",t:"Pillar 3",h:"The public <em>disclosure</em>",b:`<p><span class="k">Pillar 3</span> (Mission 06) is the public-facing leg: standardised disclosures a bank must publish so investors and counterparties can compare it against others. Same numbers, but out in daylight rather than filed privately to the supervisor.</p>
<p>Because it is public and must reconcile to both COREP and the accounts, Pillar 3 is where an inconsistency becomes visible to the whole market &mdash; a strong incentive for the reconciliations upstream to actually hold.</p>`},

{l:"MECHANISM",t:"The production cycle",h:"Raw data to <em>submission</em>",b:`<p>Every return runs the same assembly line, and knowing the stages tells you where problems surface.</p>
<div class="flow">
<div class="n"><b>Source</b>Data extracted from product and finance systems</div>
<div class="a">&#8594;</div>
<div class="n"><b>Transform</b>Mapped, enriched, classified into the return's shape</div>
<div class="a">&#8594;</div>
<div class="n"><b>Calculate</b>Ratios and templates computed (often the vendor engine)</div>
<div class="a">&#8594;</div>
<div class="n"><b>Reconcile</b>Checked against the ledger and across returns</div>
<div class="a">&#8594;</div>
<div class="n"><b>Review &amp; sign</b>Explained, signed off, submitted</div>
</div>
<div class="note">The "extract, transform, load" (ETL) middle is where most of your requirements will land, and the reconcile step is where most defects are caught. A change that helps the reconcile step pass first time is worth more than one that just moves data faster.</div>`},

{l:"TRAP",t:"The calendar is the boss",h:"On time beats <em>perfect</em>",b:`<p>Outside reporting, "get it exactly right" usually wins. Inside reporting, the deadline is immovable, and a late return is itself a breach. The discipline is therefore to file a correct-and-explained number on time, with any known issue documented, rather than to chase perfection past the cut-off.</p>
<div class="note">This reshapes how you write requirements: the cycle must produce a defensible number every period without heroics, and it must degrade gracefully when a feed is late &mdash; not stop dead. Resilience of the cycle is a requirement, not a nice-to-have.</div>`}
]},

/* ===================== 13 ===================== */
{n:"13",title:"Data: the real job",stage:"Data",
line:"Why a correct number is still useless if it cannot be proven, the standard that made banks prove it, and the concepts &mdash; lineage, golden source, reconciliation &mdash; you will live in.",
cards:[

{l:"WHY",t:"Why data is the whole game",h:"Right, and still <em>rejected</em>",b:`<p>Here is the hard truth of the role: a number that is correct but cannot be <em>traced back to its source</em> is unusable to a supervisor. If you cannot show where a figure came from, what was done to it, and why, it does not matter that it happens to be right &mdash; it cannot be relied on, defended, or signed.</p>
<p>So the real job is rarely "calculate the number". It is "make the number provable": sourced, transformed transparently, reconciled, owned. That is what the rest of this mission is about, and it is why the data work, not the maths, is where a business analyst spends the days.</p>`},

{l:"LIVE",t:"BCBS 239",h:"The standard that named the <em>problem</em>",b:`<div class="stamp">Collected 19 August 2026</div>
<p><span class="k">BCBS 239</span> &mdash; standard number 239 from the Basel Committee on Banking Supervision &mdash; is the rulebook for risk-data aggregation and reporting. Published in 2013 after 2008 exposed that banks could not add up their own risk fast or accurately, it sets 14 principles (11 for banks, 3 for supervisors) covering governance, accuracy, completeness, timeliness and adaptability.</p>
<div class="dt"><table>
<tr><th>Fact</th><th>Detail</th></tr>
<tr><td>Published</td><td>2013; compliance expected from 2016 for the largest banks</td></tr>
<tr><td>Principles</td><td>14 total &mdash; 11 for banks, 3 for supervisors</td></tr>
<tr><td>State of play</td><td>Full compliance remains rare; supervisors still report very few global systemically important banks as fully compliant, more than a decade on</td></tr>
</table></div>
<p>For you, BCBS 239 is the "why" behind every lineage, ownership and reconciliation requirement. When someone asks why a data-governance task matters, the answer is usually BCBS 239.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/bcbs/publ/d559.htm" target="_blank" rel="noopener">BIS &mdash; progress on the BCBS 239 principles</a></div>`},

{l:"DEFINE",t:"CDE and golden source",h:"The fields that <em>matter</em>",b:`<p>Not every field is equal. A <span class="k">critical data element</span> (CDE) is a field that, if wrong, materially misstates a regulatory number &mdash; a rating grade, a maturity date, an encumbrance flag, a notional amount. These get the governance; the rest get less.</p>
<p>Each CDE should have a <strong>golden source</strong>: the one system designated as authoritative for that field, so when two systems disagree there is a defined winner rather than an argument.</p>
<div class="note">Half of data governance is just deciding, and writing down, which system wins for which field. Without a golden source, every reconciliation break becomes a negotiation instead of a rule.</div>`},

{l:"MECHANISM",t:"Data lineage",h:"The traceable <em>path</em>",b:`<p><span class="k">Data lineage</span> is the documented path a figure travels &mdash; from the system where it was born, through every transformation, to the cell in the return where it lands. It is what lets you answer a supervisor's "where did this number come from?" without a two-week investigation.</p>
<div class="flow">
<div class="n"><b>Source</b>Origin system and field</div>
<div class="a">&#8594;</div>
<div class="n"><b>Transformations</b>Every mapping, enrichment and rule applied</div>
<div class="a">&#8594;</div>
<div class="n"><b>Report cell</b>The final template and line</div>
</div>
<div class="note">Documenting lineage is one of the most common things a business analyst on a reporting programme is actually asked to produce. It is the map that makes a number defensible &mdash; the artefact BCBS 239 is really demanding.</div>`},

{l:"MECHANISM",t:"The six data qualities",h:"What good data <em>means</em>",b:`<p>"Data quality" is vague until you break it into testable dimensions. These six are the ones supervisors and BCBS 239 lean on.</p>
<div class="dt"><table>
<tr><th>Quality</th><th>The question it answers</th></tr>
<tr><td>Accuracy</td><td>Does the value match reality?</td></tr>
<tr><td>Completeness</td><td>Is anything missing?</td></tr>
<tr><td>Timeliness</td><td>Is it current enough for the cycle?</td></tr>
<tr><td>Consistency</td><td>Does it agree across systems?</td></tr>
<tr><td>Uniqueness</td><td>Are there duplicates?</td></tr>
<tr><td>Validity</td><td>Is it in the right format and range?</td></tr>
</table></div>
<p>Each becomes a concrete data-quality rule you can write, test and monitor &mdash; and each failing rule becomes an entry in the issue log of Mission 14.</p>`},

{l:"DEFINE",t:"The four reconciliations",h:"Where numbers must <em>agree</em>",b:`<p>Reconciliation is proving that two views of the same thing match. Four recur constantly on a reporting programme, and knowing them by name saves hours in every discovery.</p>
<div class="dt"><table>
<tr><th>Reconciliation</th><th>Proves</th></tr>
<tr><td>Report to ledger</td><td>The return ties back to the official accounts</td></tr>
<tr><td>Report to report</td><td>COREP, FINREP and Pillar 3 agree with each other</td></tr>
<tr><td>Source to report</td><td>Nothing was lost or distorted in the pipeline</td></tr>
<tr><td>Period to period</td><td>Movements since last cycle are explained, not random</td></tr>
</table></div>
<div class="note">A break in any of these is where a reporting defect first shows itself. Most of your investigative time is spent finding which of the four broke and why.</div>`}
]},

/* ===================== 14 ===================== */
{n:"14",title:"Rule into requirement",stage:"Delivery",
line:"The core craft of the role &mdash; turning a line of regulation into a documented chain that a developer can build and a tester can prove, one field at a time.",
cards:[

{l:"MECHANISM",t:"The document chain",h:"Rule to <em>build</em>, in seven steps",b:`<p>A regulation does not become a system in one leap. It travels down a chain of documents, each more concrete than the last, and the business analyst owns the middle of it.</p>
<div class="flow">
<div class="n"><b>1 Regulation</b>The rule text from the PRA or Basel</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 Interpretation</b>What it means for this bank, agreed with Reporting</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 Methodology paper</b>The bank's documented approach and assumptions</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 Business requirements</b>What the system must do, in testable terms</div>
<div class="a">&#8595;</div>
<div class="n"><b>5 Functional spec</b>How the system will do it</div>
<div class="a">&#8595;</div>
<div class="n"><b>6 Build</b>Developers implement</div>
<div class="a">&#8595;</div>
<div class="n"><b>7 Test</b>Proven against the requirements</div>
</div>
<div class="note">Steps 2 to 4 are the analyst's core. Everything above is input; everything below depends on getting them right.</div>`},

{l:"DEFINE",t:"The methodology paper",h:"The decision, <em>written down</em>",b:`<p>The <span class="k">methodology paper</span> is where the bank records how it has chosen to meet a rule &mdash; the interpretation, the assumptions, the formula, the data, the edge cases. It is written to survive being read years later by an auditor or supervisor who was not in the room.</p>
<div class="note">This is the audience test that governs all your writing: not "does my colleague understand this today?" but "will a supervisor, in three years, understand exactly what we did and why, from this document alone?" The ICAAP and ILAAP of Mission 08 are read the same way.</div>`},

{l:"MECHANISM",t:"The testable requirement",h:"No adjectives, only <em>checks</em>",b:`<p>A requirement a developer can build and a tester can prove has no room for judgement words. "Handle deposits correctly" is not a requirement; it is a wish.</p>
<div class="two">
<div><b>Not a requirement</b>"The system should correctly classify stable deposits"</div>
<div><b>A requirement</b>"Where deposit type = retail AND balance held &ge; 12 months, classify as stable per LCR rule reference X, and evidence the classification"</div>
</div>
<p>The test is mechanical: could two people read this and build the same thing, and could a third prove it right or wrong without asking you? If not, it is not finished.</p>`},

{l:"MECHANISM",t:"Source-to-target mapping",h:"Field by field, <em>proven</em>",b:`<p>The <span class="k">source-to-target mapping</span> is the workhorse artefact: a row for every field the return needs, saying where it comes from and what happens to it on the way.</p>
<div class="dt"><table>
<tr><th>Column</th><th>Answers</th></tr>
<tr><td>Target field</td><td>The return cell to be filled</td></tr>
<tr><td>Source system &amp; field</td><td>Where the data is born (its golden source)</td></tr>
<tr><td>Transformation rule</td><td>Exactly what is done to it</td></tr>
<tr><td>Default / exception</td><td>What happens when the source is missing or invalid</td></tr>
</table></div>
<div class="note">The last row is where the real work hides. Anyone can map the happy path; the value is in specifying what happens when the field is null, stale, or contradicts another system. That column is where defects are prevented.</div>`},

{l:"MECHANISM",t:"Eight questions per field",h:"The interrogation that finds the <em>gaps</em>",b:`<p>For every critical field, a short interrogation surfaces the requirements nobody thought to state. Run it on each field before you call the mapping done.</p>
<div class="dt"><table>
<tr><th>#</th><th>Question</th></tr>
<tr><td>1</td><td>What is the golden source?</td></tr>
<tr><td>2</td><td>What does it mean, precisely?</td></tr>
<tr><td>3</td><td>What values are valid?</td></tr>
<tr><td>4</td><td>What if it is missing?</td></tr>
<tr><td>5</td><td>What if it is stale?</td></tr>
<tr><td>6</td><td>What transformation applies?</td></tr>
<tr><td>7</td><td>What does it reconcile to?</td></tr>
<tr><td>8</td><td>Who owns it?</td></tr>
</table></div>
<p>These eight turn a vague field into a specified one. Most production defects trace back to a field where one of these was never asked.</p>`},

{l:"DEFINE",t:"Validation and the issue log",h:"Catch it, then <em>track</em> it",b:`<p>Two safety nets run alongside the build. <strong>Extract validation</strong> checks incoming data against the six qualities (Mission 13) before it enters the pipeline &mdash; catching the bad row at the door, not in the return. The <strong>issue log</strong> is the single tracked list of every known data or logic problem, its impact, its owner, and its fix.</p>
<div class="note">A mature programme is not one with no issues &mdash; it is one where every issue is known, sized, owned and visible. An unknown issue is the dangerous one; a logged issue is just work. Making the unknown known is much of the job.</div>`}
]},

/* ===================== 15 ===================== */
{n:"15",title:"Test, coordinate, ship",stage:"Delivery",
line:"How the build is proven, how defects are run, how a room full of teams is kept moving in one direction, and how the thing is handed to the people who run it forever.",
cards:[

{l:"DEFINE",t:"Waterfall and agile",h:"Two ways to <em>deliver</em>",b:`<p>Two delivery styles, and regulatory programmes usually blend them.</p>
<div class="dt"><table>
<tr><th>Style</th><th>How it works</th><th>Fits</th></tr>
<tr><td>Waterfall</td><td>Sequential &mdash; requirements, then build, then test, each phase signed off before the next</td><td>Fixed regulatory scope and a hard deadline</td></tr>
<tr><td>Agile</td><td>Iterative &mdash; small increments, frequent delivery, scope that flexes</td><td>Evolving needs, early feedback</td></tr>
</table></div>
<p>A reporting programme often runs waterfall for the regulatory backbone (the rule and the deadline do not flex) with agile inside the build. Knowing which mode a workstream is in tells you how change is controlled and how sign-off works.</p>`},

{l:"DEFINE",t:"The solution owner",h:"Accountable for the <em>design</em>",b:`<p>As <span class="k">solution owner</span>, the business analyst is accountable for the solution being correct and complete &mdash; not for writing the code, but for the answer to "does this design actually meet the requirement, end to end?"</p>
<div class="note">It is an ownership role, not a documentation role. When a design decision is wrong, it is the solution owner's problem regardless of who implemented it &mdash; which is why the requirements and mapping have to be right before the build starts.</div>`},

{l:"MECHANISM",t:"UAT and the test pack",h:"Prove it against the <em>rule</em>",b:`<p><span class="k">User acceptance testing</span> (UAT) is where the business &mdash; not the developers &mdash; proves the system does what the requirement said, before it goes live. Its engine is the test pack.</p>
<div class="dt"><table>
<tr><th>Element</th><th>What it is</th></tr>
<tr><td>Test case</td><td>One scenario tied to one requirement</td></tr>
<tr><td>Expected result</td><td>The answer, defined <em>before</em> the test is run</td></tr>
<tr><td>Actual result</td><td>What the system produced</td></tr>
<tr><td>Pass / fail</td><td>Do they match?</td></tr>
</table></div>
<div class="note">Defining the expected result <em>before</em> running the test is the whole discipline. Deciding afterwards whether the output "looks right" is not testing &mdash; it is rationalising. The expected result comes from the methodology paper, not from the system's output.</div>`},

{l:"DEFINE",t:"Defects and severity",h:"Not all bugs are <em>equal</em>",b:`<p>A <span class="k">defect</span> is any gap between expected and actual. They are triaged by severity so the team fixes what matters first.</p>
<div class="dt"><table>
<tr><th>Severity</th><th>Meaning</th><th>Response</th></tr>
<tr><td>Critical</td><td>Wrong regulatory number, or return cannot be filed</td><td>Fix before go-live, no exceptions</td></tr>
<tr><td>Major</td><td>Material error with a workaround</td><td>Fix soon; document the workaround</td></tr>
<tr><td>Minor</td><td>Cosmetic or immaterial</td><td>Backlog</td></tr>
</table></div>
<p>The judgement that matters is materiality to the <em>reported number</em>. A cosmetic glitch on a screen is minor; a penny error that flips a reconciliation is not.</p>`},

{l:"MECHANISM",t:"Coordinating the room",h:"Many teams, one <em>direction</em>",b:`<p>Recall the cast of Mission 02: Treasury, Finance, Reporting, Technology, the vendor team. A regulatory programme fails at the seams between them far more often than inside any one of them, and holding those seams is much of the analyst's real work.</p>
<div class="dt"><table>
<tr><th>Stakeholder</th><th>Wants</th><th>You give them</th></tr>
<tr><td>Treasury / business</td><td>The number to behave correctly</td><td>Requirements that match reality</td></tr>
<tr><td>Reporting</td><td>To file on time and defend it</td><td>Reconciliations that hold</td></tr>
<tr><td>Technology / vendor</td><td>Unambiguous specs</td><td>Testable requirements and mappings</td></tr>
<tr><td>Risk / compliance</td><td>Rules correctly interpreted</td><td>A defensible methodology paper</td></tr>
</table></div>
<div class="note">Each speaks a different language and measures success differently. Translating between them &mdash; without losing precision &mdash; is the skill the role is really hired for.</div>`},

{l:"MECHANISM",t:"Parallel run and handover",h:"Ship without <em>breaking</em> the cycle",b:`<p>You cannot switch a live regulatory return to a new system on a Monday and hope. The safe pattern is a <strong>parallel run</strong>: the old and new systems produce the return side by side for a period, and the results are reconciled until the new one is trusted.</p>
<div class="flow">
<div class="n"><b>Parallel run</b>Old and new produce the return together; differences investigated to zero</div>
<div class="a">&#8594;</div>
<div class="n"><b>Handover</b>Documentation, runbooks and known issues passed to the Run / BAU team</div>
<div class="a">&#8594;</div>
<div class="n"><b>Live</b>New system owns the cycle; the builder steps away</div>
</div>
<div class="note">The handover is the moment of truth from Mission 02: a solution that only its builder can run has not been delivered. If Run cannot operate it from the documentation alone, the programme is not finished, whatever the plan says.</div>`}
]},

/* ===================== 16 ===================== */
{n:"16",title:"The whole thing, on one surface",stage:"Reference",
line:"The entire pack compressed into a single reference &mdash; the connecting narrative, a cheatsheet for every domain, every number, every formula, a full glossary, the traps, and what will go stale.",
cards:[

{l:"ORIENT",t:"How it all connects",h:"The pack, in one <em>thread</em>",b:`<p>Read this once and the whole pack should click into place. It is one continuous story.</p>
<p>A bank exists to <strong>borrow short and lend long</strong> and keep the difference (M02). That single act creates every risk in the pack. The oldest risk is that borrowers do not repay &mdash; <strong>credit risk</strong> &mdash; and it reduces to one equation, <strong>expected loss = PD &times; LGD &times; EAD</strong> (M01, M04). That average loss is covered by <strong>provisions</strong> under the accounting rules, IFRS 9, which now look forward and stage loans by how much they have worsened (M05). The <em>bad-year excess</em> above the average is covered by something else entirely: <strong>capital</strong>, sized by the Basel framework and enforced in the UK by the PRA (M06). Capital is held against <strong>risk-weighted assets</strong> &mdash; exposures scaled by risk &mdash; and the reforms floor how far a bank's own models may cut that number (M07). Risks the formula misses are caught in <strong>Pillar 2</strong> and tested by <strong>stress</strong> (M08).</p>
<p>But a solvent bank can still die of thirst, so a parallel world governs <strong>liquidity</strong>: the LCR for a 30-day run, the NSFR for a year of funding (M09). Rates moving out of step erode margin and value &mdash; <strong>interest-rate risk</strong>, managed by ALM through the NII and EVE lenses (M10) &mdash; and <strong>funds transfer pricing</strong> moves those funding costs to the businesses that create them (M11). All of it must be <strong>filed</strong> to the regulator on prescribed returns to a fixed calendar (M12), and none of it counts unless every number is <strong>provable</strong> &mdash; sourced, transformed transparently, reconciled &mdash; which is what BCBS 239 demands and what the data job delivers (M13). Turning each rule into something a system can build and a tester can prove is the analyst's craft (M14), and proving, coordinating and safely shipping it is the last mile (M15).</p>
<div class="note">Every card in this mission is a compressed reference to the story above. Nothing new is introduced &mdash; it is the whole pack, made scannable.</div>`},

{l:"CHEAT",t:"The map",h:"Sixteen missions, one <em>line</em> each",b:`<div class="sheet">
<div class="h"><b>Mission</b><span>The one thing it holds</span></div>
<div class="r"><b>01 One question</b><span>EL = PD &times; LGD &times; EAD; average &rarr; provisions, excess &rarr; capital</span></div>
<div class="r"><b>02 The system</b><span>Borrow short, lend long; two deaths; Change vs Run; current vs target state</span></div>
<div class="r"><b>03 Products</b><span>Rates, bonds, equities, FX, derivatives, repo &rarr; encumbrance</span></div>
<div class="r"><b>04 Measuring loss</b><span>PD, LGD, EAD; standardised vs IRB</span></div>
<div class="r"><b>05 Default &amp; IFRS 9</b><span>90 days / unlikely to pay; three stages; ECL forward-looking</span></div>
<div class="r"><b>06 Basel</b><span>Committee &rarr; PRA; three pillars; CET1; capital stack; leverage backstop</span></div>
<div class="r"><b>07 RWA</b><span>Exposure &times; risk weight; collateral; CCF; output floor 72.5%</span></div>
<div class="r"><b>08 Pillar 2 &amp; stress</b><span>ICAAP / ILAAP; 2A vs 2B; stress and reverse stress</span></div>
<div class="r"><b>09 Liquidity</b><span>LCR (30-day) and NSFR (1-year); HQLA grades</span></div>
<div class="r"><b>10 IRRBB / ALM</b><span>NII vs EVE; gap and duration; behavioural assumptions</span></div>
<div class="r"><b>11 FTP</b><span>Treasury in the middle; matched-maturity; three components</span></div>
<div class="r"><b>12 Reporting</b><span>COREP, FINREP, PRA110, Pillar 3; the production cycle</span></div>
<div class="r"><b>13 Data</b><span>BCBS 239; CDE, golden source, lineage; six qualities, four recs</span></div>
<div class="r"><b>14 Rule &rarr; requirement</b><span>Document chain; testable requirement; source-to-target mapping</span></div>
<div class="r"><b>15 Ship</b><span>UAT and test packs; defect severity; parallel run and handover</span></div>
<div class="r"><b>16 Surface</b><span>This reference</span></div>
</div>`},

{l:"CHEAT",t:"Ground &amp; measurement, at a glance",h:"The foundation, <em>compressed</em>",b:`<div class="sheet g">
<div class="h"><b>Idea</b><span>Hold this</span></div>
<div class="r"><b>The bank</b><span>Borrows short, lends long; the maturity gap is the product and the risk</span></div>
<div class="r"><b>Two deaths</b><span>Insolvency (slow, capital) vs illiquidity (fast, liquidity)</span></div>
<div class="r"><b>Two books</b><span>Banking book (held to collect) vs trading book (held to sell, marked to market)</span></div>
<div class="r"><b>Change vs Run</b><span>You build and leave; Run operates forever; the handover is the danger</span></div>
<div class="r"><b>EL rate</b><span>PD &times; LGD; becomes an amount only &times; EAD</span></div>
<div class="r"><b>PD</b><span>A rating grade's default chance; through-the-cycle (capital) vs point-in-time (accounting)</span></div>
<div class="r"><b>LGD</b><span>Share not recovered; driven by seniority and collateral</span></div>
<div class="r"><b>EAD</b><span>Drawn + CCF &times; undrawn</span></div>
<div class="r"><b>IFRS 9 stages</b><span>1 = 12-month ECL; 2 &amp; 3 = lifetime ECL; the 1&rarr;2 jump is expensive</span></div>
</div>`},

{l:"CHEAT",t:"Capital, at a glance",h:"The whole stack, <em>compressed</em>",b:`<div class="sheet g">
<div class="h"><b>Idea</b><span>Hold this</span></div>
<div class="r"><b>Who sets it</b><span>Basel Committee writes it (no legal power); the PRA makes it UK law</span></div>
<div class="r"><b>Three pillars</b><span>1 formula minimum, 2 supervisory add-on, 3 public disclosure</span></div>
<div class="r"><b>CET1</b><span>Shares + retained earnings &minus; deductions; absorbs loss immediately; the real measure</span></div>
<div class="r"><b>Stack order</b><span>CET1 &rarr; AT1 (going-concern) &rarr; Tier 2 (gone-concern)</span></div>
<div class="r"><b>Leverage</b><span>Tier 1 &divide; total un-weighted exposure; backstop the models cannot bend</span></div>
<div class="r"><b>RWA</b><span>&Sigma; exposure &times; risk weight; the denominator of every ratio</span></div>
<div class="r"><b>Output floor</b><span>Modelled RWA &ge; 72.5% of standardised (UK: full by 2030)</span></div>
<div class="r"><b>Pillar 2</b><span>ICAAP (capital) and ILAAP (liquidity); 2A now, 2B buffer for stress</span></div>
</div>`},

{l:"CHEAT",t:"Liquidity, funding &amp; delivery, at a glance",h:"The day-job, <em>compressed</em>",b:`<div class="sheet g">
<div class="h"><b>Idea</b><span>Hold this</span></div>
<div class="r"><b>LCR</b><span>HQLA &divide; 30-day net outflows &ge; 100%; managed well above the floor</span></div>
<div class="r"><b>NSFR</b><span>Stable funding available &divide; required &ge; 100%; the 1-year structural view</span></div>
<div class="r"><b>Encumbrance</b><span>Pledged assets leave the buffer; one decisive flag</span></div>
<div class="r"><b>IRRBB</b><span>NII (income, short) vs EVE (value, long); can point opposite ways</span></div>
<div class="r"><b>Behavioural</b><span>Deposits stickier and mortgages faster than contract; the governed soft input</span></div>
<div class="r"><b>FTP</b><span>Treasury in the middle; matched-maturity isolates each unit's real margin</span></div>
<div class="r"><b>Returns</b><span>COREP (prudential incl. LCR/NSFR), FINREP (financial), PRA110 (liquidity ladder), Pillar 3 (public)</span></div>
<div class="r"><b>Data</b><span>BCBS 239; golden source, lineage, six qualities, four reconciliations</span></div>
<div class="r"><b>Requirement</b><span>Testable, no adjectives; source-to-target mapping; eight questions per field</span></div>
<div class="r"><b>Ship</b><span>Expected result before the test; defect severity by materiality; parallel run then handover</span></div>
</div>`},

{l:"NUMBERS",t:"Every number",h:"The figures, in one <em>place</em>",b:`<div class="sheet b">
<div class="h"><b>Figure</b><span>Value</span></div>
<div class="r"><b>CET1 minimum</b><span>4.5% (7% incl. 2.5% conservation buffer)</span></div>
<div class="r"><b>Tier 1 minimum</b><span>6%</span></div>
<div class="r"><b>Total capital minimum</b><span>8% (10.5% incl. buffer)</span></div>
<div class="r"><b>Countercyclical buffer</b><span>0&ndash;2.5%</span></div>
<div class="r"><b>G-SIB surcharge</b><span>1&ndash;3.5%</span></div>
<div class="r"><b>Leverage ratio</b><span>~3% Basel; 3.25% UK major firms</span></div>
<div class="r"><b>Output floor</b><span>72.5% of standardised RWA</span></div>
<div class="r"><b>LCR / NSFR floor</b><span>&ge; 100%</span></div>
<div class="r"><b>HQLA haircuts</b><span>L1 0%; L2A 15%; L2B 25&ndash;50%</span></div>
<div class="r"><b>HQLA caps</b><span>L2 &le; 40% of buffer; L2B &le; 15%</span></div>
<div class="r"><b>LCR inflow cap</b><span>75% of outflows</span></div>
<div class="r"><b>Default</b><span>90 days past due, or unlikely to pay</span></div>
<div class="r"><b>IFRS 9 staging backstop</b><span>30 days past due &rarr; at least Stage 2</span></div>
<div class="r"><b>BCBS 239</b><span>14 principles (11 banks, 3 supervisors); 2013 / 2016</span></div>
</div>`},

{l:"FORMULA",t:"Every formula",h:"The equations, in one <em>place</em>",b:`<div class="fx"><div class="cap">Expected / credit loss</div>
<div class="eq"><em>EL</em> = <em>PD</em> &times; <em>LGD</em> &times; <em>EAD</em></div>
<div class="wh">Lifetime ECL sums this over each future period, using marginal (survival-adjusted) PD, discounted to today</div></div>
<div class="fx"><div class="cap">Exposure at default</div>
<div class="eq"><em>EAD</em> = drawn + <em>CCF</em> &times; undrawn</div></div>
<div class="fx"><div class="cap">Risk-weighted assets and the output floor</div>
<div class="eq"><em>RWA</em> = &Sigma; <em>EAD</em> &times; <em>RW</em>&nbsp;&nbsp;&nbsp;floored at 72.5% &times; <em>RWA</em><sub>std</sub></div></div>
<div class="fx"><div class="cap">Capital ratio</div>
<div class="eq">CET1 ratio = <span class="fr"><i>CET1 capital</i><i>RWA</i></span> &ge; 7%</div></div>
<div class="fx"><div class="cap">The two liquidity ratios</div>
<div class="eq">LCR = <span class="fr"><i>HQLA</i><i>30-day net outflows</i></span>&nbsp;&nbsp;NSFR = <span class="fr"><i>Stable funding available</i><i>Stable funding required</i></span></div>
<div class="wh">Both &ge; 100%</div></div>`},

{l:"DEFINE",t:"The glossary",h:"Every term, <em>expanded</em>",b:`<p>Your safety net &mdash; every acronym in the pack, spelled out, so nothing sends you searching elsewhere.</p>
<div class="sheet">
<div class="h"><b>Term</b><span>Meaning</span></div>
<div class="r"><b>ALM</b><span>Asset-liability management &mdash; matching the two sides of the balance sheet</span></div>
<div class="r"><b>ASF / RSF</b><span>Available / required stable funding (the two halves of NSFR)</span></div>
<div class="r"><b>AT1</b><span>Additional Tier 1 capital</span></div>
<div class="r"><b>BAU</b><span>Business as usual &mdash; the Run operation</span></div>
<div class="r"><b>BCBS 239</b><span>Basel Committee standard 239, on risk-data aggregation</span></div>
<div class="r"><b>CCF</b><span>Credit conversion factor &mdash; share of an undrawn limit assumed drawn at default</span></div>
<div class="r"><b>CDE</b><span>Critical data element &mdash; a field that can misstate a regulatory number</span></div>
<div class="r"><b>CET1</b><span>Common Equity Tier 1 &mdash; highest-quality capital</span></div>
<div class="r"><b>COREP</b><span>Common Reporting &mdash; the prudential return family</span></div>
<div class="r"><b>CRR3</b><span>Capital Requirements Regulation 3 &mdash; the EU version of Basel 3.1</span></div>
<div class="r"><b>EAD</b><span>Exposure at default</span></div>
<div class="r"><b>ECL</b><span>Expected credit loss (IFRS 9 provisions)</span></div>
<div class="r"><b>ETL</b><span>Extract, transform, load &mdash; the data-pipeline stages</span></div>
<div class="r"><b>EVE</b><span>Economic value of equity &mdash; the value lens on rate risk</span></div>
<div class="r"><b>FINREP</b><span>Financial Reporting &mdash; the financial-statement return family</span></div>
<div class="r"><b>FRTB</b><span>Fundamental Review of the Trading Book &mdash; the market-risk rewrite</span></div>
<div class="r"><b>FTP</b><span>Funds transfer pricing</span></div>
<div class="r"><b>G-SIB</b><span>Global systemically important bank</span></div>
<div class="r"><b>HQLA</b><span>High-quality liquid assets</span></div>
<div class="r"><b>ICAAP / ILAAP</b><span>Internal Capital / Liquidity Adequacy Assessment Process</span></div>
<div class="r"><b>IFRS 9</b><span>International Financial Reporting Standard 9 &mdash; provisioning rules</span></div>
<div class="r"><b>IRB</b><span>Internal ratings-based approach to RWA</span></div>
<div class="r"><b>IRRBB</b><span>Interest-rate risk in the banking book</span></div>
<div class="r"><b>LCR</b><span>Liquidity Coverage Ratio (30-day)</span></div>
<div class="r"><b>LGD</b><span>Loss given default</span></div>
<div class="r"><b>NII</b><span>Net interest income &mdash; the income lens on rate risk</span></div>

<div class="r"><b>PD</b><span>Probability of default</span></div>
<div class="r"><b>PRA</b><span>Prudential Regulation Authority &mdash; the UK bank regulator</span></div>
<div class="r"><b>PRA110</b><span>The UK liquidity cash-flow mismatch return</span></div>
<div class="r"><b>RWA</b><span>Risk-weighted assets</span></div>
<div class="r"><b>SONIA</b><span>Sterling Overnight Index Average &mdash; the UK reference rate</span></div>

</div>`},

{l:"TRAP",t:"Every trap",h:"The errors that mark you as <em>new</em>",b:`<div class="sheet q">
<div class="h"><b>Do not say</b><span>The correction</span></div>
<div class="r"><b>"Provisions and capital are both loss cushions"</b><span>Provisions = expected loss (IFRS 9); capital = unexpected loss (Basel). Different rulebooks</span></div>
<div class="r"><b>"The borrower's PD is 1.83%"</b><span>PD belongs to a rating grade, not a false-precise per-borrower figure</span></div>
<div class="r"><b>"PD &times; LGD is the expected loss"</b><span>That is the loss rate; multiply by EAD for an amount</span></div>
<div class="r"><b>"Liquidity is a capital issue"</b><span>Liquidity carries no capital charge; it is ratios and buffers</span></div>
<div class="r"><b>"We watch NII, so rate risk is covered"</b><span>NII can look fine while EVE bleeds &mdash; the 2023 failure</span></div>
<div class="r"><b>"115% LCR is barely passing"</b><span>The floor is 100%; banks target well above it</span></div>
<div class="r"><b>"The number is right, ship it"</b><span>Right but unprovable is unusable; lineage is the deliverable</span></div>
<div class="r"><b>"Handle deposits correctly"</b><span>Not testable; a requirement has conditions and a rule reference</span></div>
<div class="r"><b>"It's built, so it's delivered"</b><span>Not until Run can operate it from the documentation alone</span></div>
</div>`},

{l:"LIVE",t:"What goes stale",h:"The figures to <em>re-check</em>",b:`<div class="stamp">Collected 19 August 2026</div>
<p>Everything mechanism in this pack is durable. These dated facts are not &mdash; verify them before you rely on them, because the Basel timeline has already moved more than once.</p>

</div>

{l:"CLOSE",t:"The close",h:"What you actually <em>carry</em>",b:`<p>Strip the pack to one sentence and it is this: a bank borrows short and lends long, and every rule, ratio, return and system in these sixteen missions exists to make sure it can survive doing so &mdash; and to <em>prove</em>, to a supervisor, that it can.</p>
<p>Your seat is where that proof gets built. Not the models, not the trading, but the chain that turns a rule into a number and a number into something defensible: interpret the rule, map the data to its source, make it testable, prove it, and hand it over so it runs without you. Get that chain right and the figures take care of themselves.</p>
<div class="note" style="border-left-color:var(--accent);color:var(--ink)">The equation is simple. The proof is the profession. Carry the proof.</div>`}
]}

]};
const main=document.getElementById('main'), rail=document.getElementById('rail');
function lc(l){
  if(l==='TRAP'||l==='TRADE-OFF') return 'label q';
  if(l==='FORMULA'||l==='WORKED') return 'label';
  if(l==='RECALL'||l==='CHEAT'||l==='CLOSE') return 'label r';
  if(l==='LIVE'||l==='NUMBERS') return 'label l';
  return 'label';
}
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards &nbsp;/&nbsp; ${P.edition}</div>
  <h1>${P.title}</h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>${P.floor}<br>${P.dateline} ${DATE}</div>
  ${P.intro ? `<div class="note" style="margin-top:26px">${P.intro}</div>` : ''}
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    ${m.line ? `<div class="mline">${m.line}</div>` : ''}
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
</body>
</html>
