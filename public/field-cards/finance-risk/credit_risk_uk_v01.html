<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}

a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim)}
a:hover{color:var(--ink);border-color:var(--ink)}
.docs{margin:20px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--live);border-radius:7px;font-size:12.6px;line-height:1.9}
.docs b{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:6px;font-weight:500}
.docs a{display:block;border-bottom:none;color:var(--body)}
.docs a:hover{color:var(--accent)}
.docs a:before{content:'\2192\00a0';color:var(--live)}
.fx{margin:20px 0;padding:16px 15px;background:#0E0E12;border:1px solid var(--line);border-radius:9px;text-align:center;overflow-x:auto}
.fx .eq{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);line-height:2.1;white-space:nowrap}
.fx .eq em{font-style:italic;color:var(--accent);font-family:'Instrument Serif',serif;font-size:17px}
.fx .wh{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:left;line-height:1.8;font-family:'JetBrains Mono',monospace}
.fx .cap{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.wk{margin:20px 0;border:1px solid var(--accent-dim);border-radius:9px;overflow:hidden}
.wk .h{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.wk .r{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;background:var(--surface)}
.wk .r:last-child{border-bottom:none}
.wk .r b{flex:1;color:var(--body);font-weight:400}
.wk .r span{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.wk .r.tot{background:var(--raise)}
.wk .r.tot b{color:var(--ink);font-weight:600}
.wk .r.tot span{color:var(--ink)}

/* ---------- stacked fractions ---------- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px}
.fr>i{font-style:normal;display:block;padding:0 7px;line-height:1.4;white-space:nowrap}
.fr>i:first-child{border-bottom:1px solid var(--muted);padding-bottom:3px}
.fr>i:last-child{padding-top:3px}
.fx .eq{white-space:normal}
.fx .eq .nw{white-space:nowrap}
/* ---------- mobile ---------- */
.fx{-webkit-overflow-scrolling:touch}
@media(max-width:560px){
 .fx{text-align:left;padding:14px 12px}
 .fx .eq{font-size:12.5px;line-height:2}
 .fx .eq em{font-size:15px}
 .fx .cap{text-align:left}
 .fx .wh{font-size:10.5px;line-height:1.75}
 .fr>i{padding:0 5px}
 .wk .r{flex-wrap:wrap;gap:4px}
 .wk .r b{flex:1 1 100%}
 .wk .r span{flex:0 0 auto}
 .sheet .r{flex-direction:column;gap:3px}
 .sheet .r b{flex:none}
}
@media(max-width:430px){
 .fx{padding:12px 10px}
 .fx .eq{font-size:11.5px}
 .fx .eq em{font-size:14px}
}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "19 August 2026";
const P = {
edition:"UK Edition 01",
title:"Credit Risk &amp; the <em>Regulated Balance Sheet</em>",
sub:"How an internationally-active UK bank turns a rulebook into a number, files it to the regulator, and proves every figure &mdash; and the business-analysis work that builds the systems underneath. Every term is explained where it first appears, so the pack stands on its own.",
floor:"No prior knowledge assumed",
dateline:"UK / Basel position verified",
intro:"Two kinds of card. <strong>Mechanism</strong> cards explain how something works and do not go stale. <strong>Live</strong> cards carry a collection stamp and do. The jurisdiction is the UK: the Basel standard is taught as the mechanism, the PRA rule as the operative fact. The final mission is a full reference &mdash; the whole pack compressed, plus a glossary of every term.",
missions:[

/* ===================== 01 ===================== */
{n:"01",title:"The one question",stage:"Ground",
line:"The question the whole field exists to answer, the equation it reduces to, and why one loss becomes two separate regulatory answers.",
cards:[

{l:"ORIENT",t:"The question",h:"Will it be paid <em>back</em>?",b:`<p>Every model, committee, regulation and system in this field exists to answer one question about one exposure (one loan or facility the bank is owed money on), and then the same question about a whole book of them at once.</p>
<div class="note" style="font-size:16.5px;color:var(--ink);border-left-color:var(--accent)">How much of this money will not come back, and how confident is that number?</div>
<p>Two halves, and they are not the same question. The first is an estimate of the loss. The second is the estimate's reliability &mdash; and the second is where regulatory <strong>capital</strong> (the owners' own money, held in reserve to absorb losses) lives.</p>
<p>That split is why a bank holds two entirely different cushions against the same book, computed by two different teams under two different rulebooks, which never agree and are never meant to. Hold that sentence; the whole pack hangs from it.</p>`},

{l:"FORMULA",t:"Expected loss",h:"Three numbers, <em>multiplied</em>",b:`<p>Expected loss reduces to three quantities. Every credit model in existence estimates one of them.</p>
<div class="fx"><div class="cap">Expected loss, single exposure</div>
<div class="eq"><em>EL</em> = <em>PD</em> &times; <em>LGD</em> &times; <em>EAD</em></div>
<div class="wh">EL&nbsp;&nbsp;expected loss, in currency<br>
PD&nbsp;&nbsp;probability of default &mdash; the chance the borrower fails to pay, over the horizon, 0 to 1<br>
LGD&nbsp;loss given default &mdash; the share you do <em>not</em> get back after a default, 0 to 1<br>
EAD&nbsp;exposure at default &mdash; how much you are owed at the moment of default, in currency</div></div>
<p>Two of the three are ratios and one is an amount, so the product is an amount. Written as a rate rather than a value:</p>
<div class="fx"><div class="cap">Expressed as a loss rate</div>
<div class="eq"><em>EL</em>% = <em>PD</em> &times; <em>LGD</em></div>
<div class="wh">Loss as a percentage of exposure, independent of facility size</div></div>
<div class="note">A common slip is calling PD &times; LGD the "expected loss". It is the expected loss <em>rate</em>. It becomes an amount only when multiplied by EAD.</div>`},

{l:"WORKED",t:"One facility",h:"The equation with real <em>numbers</em>",b:`<p>A committed corporate facility (an agreed lending limit a company can draw on). Limit &pound;5,000,000, drawn &pound;3,000,000, undrawn &pound;2,000,000. The internal rating implies a one-year PD of 2.4%. Recovery experience on similar senior secured exposures is 55%, so LGD is 45%. The credit conversion factor (CCF &mdash; the share of the unused limit assumed to be drawn before default) on the undrawn portion is 40%.</p>
<div class="wk"><div class="h">Step by step</div>
<div class="r"><b>EAD = drawn + CCF &times; undrawn = 3,000,000 + 0.40 &times; 2,000,000</b><span>&pound;3,800,000</span></div>
<div class="r"><b>PD</b><span>2.40%</span></div>
<div class="r"><b>LGD = 1 &minus; recovery = 1 &minus; 0.55</b><span>45.00%</span></div>
<div class="r tot"><b>EL = 0.024 &times; 0.45 &times; 3,800,000</b><span>&pound;41,040</span></div>
</div>
<p>Forty-one thousand pounds is what the bank <em>expects</em> to lose on this one exposure across a year, on average. It is priced into the loan and set aside in the accounts. It is not the number capital is held against &mdash; that is the next card.</p>`},

{l:"MECHANISM",t:"Expected vs unexpected",h:"The two cushions, and <em>why</em> there are two",b:`<p>Expected loss is the average. Reality is not the average. In a bad year losses run far above it, and the gap between the average and the bad-year outcome is <span class="k">unexpected loss</span>.</p>
<div class="dt"><table>
<tr><th>Loss</th><th>What it is</th><th>Covered by</th><th>Rulebook</th></tr>
<tr><td>Expected</td><td>The average, everyday loss</td><td>Provisions (money set aside in the accounts)</td><td class="g">IFRS 9 accounting</td></tr>
<tr><td>Unexpected</td><td>The bad-year excess above the average</td><td>Regulatory capital (owners' money)</td><td class="g">Basel / PRA</td></tr>
</table></div>
<p>They never reconcile because they answer different questions. Provisions ask "what will we lose on average?" Capital asks "how bad could it get, and can we absorb it while still trading?" One is accounting; the other is solvency (whether the bank's assets still exceed what it owes).</p>
<div class="note">The whole capital framework (Missions 06&ndash;08) sizes the second cushion. The whole provisioning framework (Mission 05) sizes the first. A person who confuses them will misread every number in a bank.</div>`},

{l:"ORIENT",t:"Where everyone sits",h:"One equation, every <em>role</em>",b:`<p>The equation is also an org chart. Every team you will meet owns a piece of it.</p>
<div class="dt"><table>
<tr><th>Piece</th><th>Who owns it</th></tr>
<tr><td>PD, LGD, EAD models</td><td>Credit risk modelling / validation</td></tr>
<tr><td>Provisions (expected loss)</td><td>Finance, under IFRS 9</td></tr>
<tr><td>Capital (unexpected loss &rarr; RWA)</td><td>Regulatory capital / prudential</td></tr>
<tr><td>The funding and liquidity of the book</td><td>Treasury (the team that funds the bank)</td></tr>
<tr><td>Filing the numbers to the regulator</td><td>Regulatory reporting</td></tr>
<tr><td>The data that carries all of it</td><td>Every one of them, badly, until someone owns it</td></tr>
</table></div>
<p>The last row is the job this pack is really about. A number that cannot be traced back to its source is unusable to a supervisor <strong>regardless of whether it is right</strong>. That principle has a rulebook of its own, and it is Mission 13.</p>`}
]},

/* ===================== 02 ===================== */
{n:"02",title:"The system you are inside",stage:"Ground",
line:"The bank as a balance sheet, the two ways it dies, the risks it is measured on, and how a change programme is actually staffed and run.",
cards:[

{l:"MECHANISM",t:"The balance sheet",h:"Borrow short, lend <em>long</em>",b:`<p>A bank is a balance sheet with a business model bolted to it. It borrows money that can leave quickly and lends money that comes back slowly, and it keeps the difference.</p>
<div class="dt"><table>
<tr><th>Side</th><th>Means</th><th>Made of</th></tr>
<tr><td>Liabilities</td><td>Where the money came from</td><td>Customer deposits, wholesale borrowing (money borrowed from other banks and markets), bonds issued, and a thin sliver of the owners' own capital</td></tr>
<tr><td>Assets</td><td>Where the money went</td><td>Loans, mortgages, bonds held, cash and reserves at the central bank, trading positions</td></tr>
</table></div>
<p>The gap between the maturity (the time until money must be repaid) of the two sides is called <span class="k">maturity transformation</span>, and it is not a flaw &mdash; it is the product. It is also the source of every risk in this pack. The bank is paid to run that gap and regulated to survive it.</p>`},

{l:"WHY",t:"Two deaths",h:"Solvent, and dead <em>anyway</em>",b:`<p>A bank fails in one of two ways, and conflating them is the most common error in the subject.</p>
<div class="dt"><table>
<tr><th>Death</th><th>What happened</th><th>Speed</th><th>Rulebook</th></tr>
<tr><td>Insolvency</td><td>Assets are worth less than liabilities &mdash; the capital is gone</td><td>Slow (quarters)</td><td class="g">Capital &mdash; Missions 06&ndash;08</td></tr>
<tr><td>Illiquidity</td><td>Assets exceed liabilities, but the cash is not there on the day a bill falls due</td><td>Fast (days, or hours)</td><td class="g">Liquidity &mdash; Mission 09</td></tr>
</table></div>
<p>Capital erodes over quarters and shows in published accounts. Liquidity evaporates over days &mdash; and in the failures of March 2023, over hours, because deposits now move at the speed of a banking app, not a branch queue.</p>
<div class="note">That speed is why liquidity is governed by ratios, buffers and high-frequency returns rather than an annual capital cycle, and why it carries no capital charge at all. Two different deaths, two different rulebooks, two different teams.</div>`},

{l:"DEFINE",t:"The risk families",h:"What a bank is measured <em>on</em>",b:`<p>Regulation sorts a bank's risk into families. Know the ones that carry a capital charge and the ones that do not. ("Pillar 1" and "Pillar 2" are the two ways the rules require capital &mdash; explained in Mission 06.)</p>
<div class="dt"><table>
<tr><th>Risk</th><th>The question</th><th>Treatment</th></tr>
<tr><td>Credit</td><td>Will borrowers repay?</td><td class="g">Pillar 1 capital</td></tr>
<tr><td>Market</td><td>Will trading positions move against us?</td><td class="g">Pillar 1 capital</td></tr>
<tr><td>Operational</td><td>Will processes, people or systems fail?</td><td class="g">Pillar 1 capital</td></tr>
<tr><td>Liquidity</td><td>Can we meet cash obligations on the day?</td><td class="g">Ratios, not capital</td></tr>
<tr><td>Interest-rate (banking book)</td><td>Do rate moves erode margin and value?</td><td class="g">Pillar 2</td></tr>
</table></div>
<p>Credit risk is the largest for most banks and the subject of this pack's core. But the role you are being trained for lives mostly in the liquidity and interest-rate families, where Treasury and regulatory reporting sit.</p>`},

{l:"MECHANISM",t:"Banking book, trading book",h:"The line that decides the <em>rules</em>",b:`<p>Every position a bank holds sits in one of two books, and which book decides which rulebook applies.</p>
<div class="dt"><table>
<tr><th>Book</th><th>What sits there</th><th>Measured for</th></tr>
<tr><td>Banking book</td><td>Held to maturity or to collect the cash flows (interest and repayment) &mdash; loans, mortgages, deposits, bonds held for liquidity</td><td>Credit and interest-rate risk</td></tr>
<tr><td>Trading book</td><td>Held to trade (bought to sell on at a profit), short-term, and marked to market (revalued to its current market price every day)</td><td>Market risk</td></tr>
</table></div>
<p>The boundary is policed hard because it is the classic arbitrage (exploiting a rule for gain): park a position in whichever book gives the lower capital charge. The Basel 3.1 market-risk rules (Mission 06) redraw the boundary precisely for this reason.</p>
<div class="note">For a Treasury and liquidity role the banking book is home ground. But the returns you help produce cover the whole balance sheet, so the boundary matters: a mislabelled position lands in the wrong return.</div>`},

{l:"PICTURE",t:"Who is on the programme",h:"The teams, and where <em>you</em> sit",b:`<p>You are not a lone analyst. You sit inside a change programme (a project to build or replace systems) with a fixed cast, and knowing who owns what is half the job.</p>
<div class="dg"><div class="dg-t">A treasury / liquidity reporting programme</div>
<div class="flow">
<div class="n"><b>Treasury</b>Owns funding, the liquidity position, and transfer pricing. The business owner of most of what you build</div>
<div class="a">&#8597;</div>
<div class="n"><b>Finance &amp; Country Finance</b>Owns the ledger (the official book of accounts) and the entity-level numbers the returns must reconcile to</div>
<div class="a">&#8597;</div>
<div class="n"><b>Group Liquidity Regulatory Reporting</b>Produces the liquidity returns for the group and files them to the regulator</div>
<div class="a">&#8597;</div>
<div class="n"><b>Technology</b>Builds the pipelines, the calculation engine and the architecture</div>
<div class="a">&#8597;</div>
<div class="n"><b>The vendor-platform team</b>Runs the bought-in calculation engine and its input model</div>
</div></div>
<p>The business analyst sits in the middle of all of them, turning what Treasury and Reporting need into something Technology and the vendor platform can build, and proving it works before Reporting relies on it.</p>`},

{l:"DEFINE",t:"Change and Run",h:"Two tribes, one <em>handover</em>",b:`<p>A bank splits its people into two modes, and you must know which one you are in.</p>
<div class="dt"><table>
<tr><th>Mode</th><th>What it does</th><th>Funded as</th></tr>
<tr><td>Change</td><td>Builds new systems and processes to a deadline, then leaves. <strong>Your seat</strong></td><td>Project</td></tr>
<tr><td>Run / BAU (business as usual)</td><td>Operates the live systems every day, every cycle, forever</td><td>Ongoing / operational</td></tr>
</table></div>
<p>The most dangerous moment in any programme is the handover from Change to Run. A process that only works when the data is clean, or only when its builder is in the room, fails its first bad month in production. Mission 15 is largely about surviving that handover.</p>
<div class="note">On many programmes the analyst is supplied by a firm and embedded in the bank's team. The work is the bank's; the standards are the bank's; the seat is temporary. That changes how you document &mdash; you write for the person who inherits it, not for yourself.</div>`},

{l:"DEFINE",t:"Current state, target state",h:"The two maps you always <em>draw</em>",b:`<p>Change work is the journey between two pictures, and naming them precisely is the first thing you do.</p>
<div class="lay">
<div><span>A</span><strong>Current state.</strong> How it works today &mdash; the systems, the feeds, the manual workarounds, the actual (not the intended) process.</div>
<div><span>B</span><strong>Target state.</strong> How it will work when the programme is done &mdash; the design everyone has agreed to build toward.</div>
</div>
<p>As <span class="k">solution owner</span> (the person accountable for the design being right) of the target state, the business analyst owns the answer to "what are we building, and why" &mdash; not the code, but the correctness and completeness of the design, signed off.</p>
<div class="note">The gap between the two states is the programme. Half the discovery work is that the current state on paper and the current state in reality are different documents, and the difference is where the workarounds hide.</div>`}
]},

/* ===================== 03 ===================== */
{n:"03",title:"Products and markets, from zero",stage:"Ground",
line:"The instruments the money is held in &mdash; what they are, how they pay, and why each one matters to funding, liquidity and the returns you will report.",
cards:[

{l:"WHY",t:"Why products matter here",h:"The data describes <em>instruments</em>",b:`<p>Every row that flows through a liquidity or capital return describes an instrument (a specific financial contract &mdash; a loan, a bond, a swap). If you do not know what the instrument is, you cannot tell whether the row is right.</p>
<p>A bond and a loan behave differently when a bank is running down its book. A derivative can be an asset one day and a liability the next. A repo moves a security off the shelf without selling it. Each lands in a different cell of a different return, and a mislabelled instrument is a misstated number.</p>
<div class="note">This mission is the primer, not the deep dive. The goal is to name every product and know why it matters to the balance sheet.</div>`},

{l:"DEFINE",t:"Rates and the money market",h:"The price of <em>time</em>",b:`<p>The most basic thing a bank trades is money for a period of time, at a price. That price is an <span class="k">interest rate</span>, and it depends on how long the money is tied up (the <strong>tenor</strong> &mdash; the length of the deal).</p>
<p>Plot the rate against the tenor and you get the <strong>yield curve</strong>. Short-term borrowing between banks and against government paper is the <strong>money market</strong>; it is where Treasury funds the bank day to day.</p>
<div class="dt"><table>
<tr><th>Rate</th><th>What it is</th></tr>
<tr><td>Reference rate</td><td>A published benchmark rate for a tenor. In the UK, <strong>SONIA</strong> (Sterling Overnight Index Average &mdash; the rate banks lend to each other overnight). Loans and swaps are priced off it</td></tr>
<tr><td>Repo rate</td><td>The rate to borrow cash against a security as collateral (assets pledged as security). The bank's cheapest secured funding</td></tr>
</table></div>
<div class="note">The curve is the backbone of transfer pricing (Mission 11) and interest-rate risk (Mission 10). When someone says "the curve moved", margins and valuations moved with it.</div>`},

{l:"DEFINE",t:"Fixed income",h:"Lending, made <em>tradable</em>",b:`<p><span class="k">Fixed income</span> is lending turned into a security you can buy and sell. You give an issuer money; they pay you set interest (the <strong>coupon</strong> &mdash; the regular interest payment) and return the principal (the original amount) at maturity. A <strong>bond</strong> is the instrument.</p>
<div class="dt"><table>
<tr><th>Type</th><th>Issuer</th><th>Role in the bank</th></tr>
<tr><td>Gilts (UK government bonds)</td><td>The UK government</td><td class="g">Core of the liquidity buffer</td></tr>
<tr><td>Corporate bonds</td><td>Companies</td><td class="g">Held for yield; higher risk weight</td></tr>
<tr><td>Covered bonds / securitisations</td><td>Backed by pools of assets</td><td class="g">Funding and investment</td></tr>
</table></div>
<p>Two forces move a bond's price: interest rates (rates up, price down) and the issuer's credit quality (riskier issuer, lower price, higher yield). Both matter to the balance sheet &mdash; the first is interest-rate risk, the second is credit risk.</p>`},

{l:"DEFINE",t:"Equities",h:"Owning, not <em>lending</em>",b:`<p>An <span class="k">equity</span> &mdash; a share &mdash; is a slice of ownership in a company. No coupon, no maturity, no promise to repay. You get dividends if declared and whatever the market will pay for the share.</p>
<p>For a bank, equities appear mostly in the trading book and in the small sliver of the liquidity buffer that the lowest grade allows. They carry market risk, not credit risk, because there is no borrower to default &mdash; only a price that moves.</p>
<div class="note">The distinction that matters: a bondholder is a lender whose claim ranks ahead of shareholders; an equity holder is an owner who is paid last and loses first. This ranking &mdash; called <strong>seniority</strong> &mdash; is the whole of recovery, and recovery is what sets LGD.</div>`},

{l:"DEFINE",t:"Foreign exchange",h:"One currency for <em>another</em>",b:`<p><span class="k">Foreign exchange</span> (FX) is trading one currency for another at an agreed rate. A UK bank with dollar assets and sterling funding carries FX risk: the rate can move between now and settlement (when the exchange actually happens).</p>
<div class="dt"><table>
<tr><th>Deal</th><th>What it is</th></tr>
<tr><td>Spot</td><td>Exchange now, at today's rate, settling in a day or two</td></tr>
<tr><td>Forward / swap</td><td>An agreed rate for exchange on a future date &mdash; used to hedge (offset a risk), or to fund one currency with another</td></tr>
</table></div>
<p>FX matters to liquidity because regulators watch currency by currency: a bank can be liquid in sterling and short of dollars on the same day. Significant currencies are reported separately.</p>`},

{l:"DEFINE",t:"Derivatives",h:"Value <em>derived</em> from something else",b:`<p>A <span class="k">derivative</span> is a contract whose value comes from an underlying price, rate or index &mdash; you never own the underlying, only exposure to how it moves.</p>
<div class="dt"><table>
<tr><th>Instrument</th><th>What it does</th></tr>
<tr><td>Interest-rate swap</td><td>Exchange fixed for floating interest &mdash; the main tool to hedge rate risk</td></tr>
<tr><td>FX forward</td><td>Lock a future exchange rate</td></tr>
<tr><td>Option</td><td>The right, not the obligation, to trade at a set price</td></tr>
<tr><td>Credit default swap</td><td>Insurance against a borrower defaulting</td></tr>
</table></div>
<p>Derivatives are how Treasury moves risk off the business and manages it centrally. They create <strong>counterparty credit risk</strong> (the other side of the contract may itself default) and they swing between asset and liability as prices move, which is why they are hard to report.</p>`},

{l:"MECHANISM",t:"Repo",h:"Borrowing without <em>selling</em>",b:`<p>A <span class="k">repo</span> (repurchase agreement) is a secured loan dressed as a sale: sell a security now, agree to buy it back later at a slightly higher price. The difference is the interest.</p>
<div class="flow">
<div class="n"><b>Today</b>Bank gives a gilt to a lender, receives cash</div>
<div class="a">&#8595;</div>
<div class="n"><b>At maturity</b>Bank returns the cash plus interest, takes the gilt back</div>
</div>
<p>Repo is the bank's main source of cheap, secured funding &mdash; and its main way to turn a bond into cash without selling it. But a repoed security is <strong>encumbered</strong> (pledged away, promised to someone else), so it is no longer available to count in the liquidity buffer. That one flag is where liquidity ratios break (Mission 09).</p>`},

{l:"LIVE",t:"Market risk and FRTB",h:"The trading-book rewrite, <em>dated</em>",b:`<div class="stamp">Collected 19 August 2026</div>
<p>Market risk &mdash; the capital held against trading positions moving &mdash; is being rewritten under the <span class="k">Fundamental Review of the Trading Book</span> (FRTB), part of the Basel 3.1 reform package.</p>
<div class="dt"><table>
<tr><th>Element</th><th>UK position</th></tr>
<tr class="hi"><td>Basel 3.1 package, incl. trading-book boundary</td><td>Applies from <strong>1 January 2027</strong></td></tr>
<tr><td>FRTB internal-model approach (banks using their own models)</td><td>Deferred to <strong>1 January 2028</strong></td></tr>
<tr><td>EU version (CRR3 &mdash; Capital Requirements Regulation 3)</td><td>In force since <strong>1 January 2025</strong></td></tr>
</table></div>
<p>You will not build market-risk models in this role, but you will hear FRTB constantly, and the boundary it redraws decides which of your positions are market-risk and which are banking-book. Full detail is in Mission 06.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/basel_framework/standard/MAR.htm" target="_blank" rel="noopener">Basel Framework MAR &mdash; the market risk standard</a></div>`}
]},

/* ===================== 04 ===================== */
{n:"04",title:"Measuring credit loss",stage:"Measurement",
line:"The three parameters behind the loss equation &mdash; what each one is, how a bank estimates it, and the two rulebooks that turn them into capital.",
cards:[

{l:"MECHANISM",t:"PD",h:"The chance it <em>defaults</em>",b:`<p><span class="k">Probability of default</span> (PD) is the chance a borrower fails to meet its obligations over a set horizon, usually one year. It is a number between 0 and 1, and it is the hardest of the three to estimate because default is rare.</p>
<p>A bank assigns each borrower an internal <strong>rating grade</strong> (a risk band, like a school grade), and each grade maps to a PD. The rating comes from a model &mdash; financials, behaviour, and the sector &mdash; calibrated against how often similar borrowers actually defaulted in the past.</p>
<div class="dt"><table>
<tr><th>PD flavour</th><th>What it is</th><th>Used for</th></tr>
<tr><td>Through-the-cycle</td><td>An average across good and bad years &mdash; stable</td><td>Capital</td></tr>
<tr><td>Point-in-time</td><td>The estimate for right now, moving with the economy</td><td>Provisions (IFRS 9)</td></tr>
</table></div>
<div class="note">The same borrower has two PDs at once, and they are meant to differ: capital wants stability, accounting wants today's truth. Confusing them is a classic error.</div>`},

{l:"MECHANISM",t:"LGD",h:"What you actually <em>lose</em>",b:`<p><span class="k">Loss given default</span> (LGD) is the share of the exposure you do not get back after a borrower defaults, once collateral is sold and recoveries collected. If you recover 60p in the pound, LGD is 40%.</p>
<div class="fx"><div class="cap">Loss given default</div>
<div class="eq"><em>LGD</em> = 1 &minus; <span class="fr"><i>Recoveries &minus; costs</i><i>Exposure at default</i></span></div>
<div class="wh">recoveries&nbsp;cash and collateral collected after default<br>
costs&nbsp;the expense of collecting them<br>
both discounted back to the default date</div></div>
<p>Two things drive LGD: how senior the claim is (a secured lender is paid before an unsecured one) and how good the collateral is. Seniority and collateral are the whole of recovery.</p>
<div class="note">LGD is where data quality bites hardest. A collateral value a decade out of date, or a missing security flag, moves LGD straight into the capital number &mdash; and nobody notices until a supervisor asks.</div>`},

{l:"MECHANISM",t:"EAD and the CCF",h:"How much is on the <em>line</em>",b:`<p><span class="k">Exposure at default</span> (EAD) is how much the bank is owed at the moment of default. For a fully drawn loan that is simple. For anything with an undrawn commitment it is not, because borrowers draw down as they get into trouble.</p>
<div class="fx"><div class="cap">Exposure at default</div>
<div class="eq"><em>EAD</em> = drawn + <em>CCF</em> &times; undrawn</div>
<div class="wh">CCF&nbsp;credit conversion factor &mdash; the share of the undrawn limit expected to be drawn before default, 0 to 1</div></div>
<p>The <strong>credit conversion factor</strong> turns an off-balance-sheet commitment (a promise to lend that is not yet a loan) into an on-balance-sheet-equivalent exposure. A committed overdraft with a 40% CCF means the bank assumes 40% of the unused limit will be drawn before default.</p>
<div class="note">CCFs are prescribed in the rules by product type. They are also where off-balance-sheet exposure quietly enters the capital number, which is why undrawn commitments are a reported data field, not an afterthought.</div>`},

{l:"DEFINE",t:"Two rulebooks for capital",h:"Standardised, or <em>modelled</em>",b:`<p>Once a bank has PD, LGD and EAD, two rulebooks turn them into a capital requirement.</p>
<div class="dt"><table>
<tr><th>Approach</th><th>How the risk weight is set</th><th>Trade-off</th></tr>
<tr><td>Standardised</td><td>The regulator sets the weights in a table by exposure type and rating; the bank looks them up</td><td>Simple, conservative, no permission needed</td></tr>
<tr><td>Internal ratings-based (IRB)</td><td>The bank feeds its own modelled PD, LGD and EAD into a prescribed formula</td><td>More risk-sensitive, but needs supervisory approval and heavy validation</td></tr>
</table></div>
<p>The Basel 3.1 reforms (Mission 06) push the two closer together: they constrain what IRB models may claim and impose an <strong>output floor</strong> so a modelled number can never fall too far below the standardised one.</p>
<div class="note">For a reporting role you rarely build the models, but you must know which approach a portfolio uses, because it decides which fields the return demands and which reconciliations must hold.</div>`},

{l:"TRAP",t:"The parameter that isn't a number",h:"PD is a <em>grade</em>, not a guess",b:`<p>A tempting mistake is to treat PD as a single estimated number per borrower. In practice it is the PD <strong>attached to a rating grade</strong>, and the grade is what the borrower actually carries.</p>
<div class="two">
<div><b>Wrong</b>"This borrower's PD is 1.83%." Precision that does not exist and cannot be governed</div>
<div><b>Right</b>"This borrower is grade 7; grade 7 carries a long-run PD of 1.8%." A grade can be audited, challenged and re-rated</div>
</div>
<p>Why it matters to you: the return and the reconciliation work on grades and their assigned PDs. A borrower's grade is a governed, dated field with an owner. A free-floating PD is not.</p>`}
]},

/* ===================== 05 ===================== */
{n:"05",title:"Default and IFRS 9 stages",stage:"Measurement",
line:"When a loan is officially in trouble, how the accounting rules turn that into a provision that moves before the default does, and how the expected-loss figure is actually calculated.",
cards:[

{l:"DEFINE",t:"Default, defined",h:"The line the whole field <em>codes</em>",b:`<p>Everything depends on one boundary: when is an exposure in <span class="k">default</span>? The Basel definition has two triggers, and either one is enough.</p>
<div class="lay">
<div><span>1</span><strong>Past due 90 days.</strong> The borrower is more than 90 days late on a material (large enough to matter) obligation. A hard, countable line.</div>
<div><span>2</span><strong>Unlikely to pay.</strong> The bank judges the borrower will not pay in full without action like seizing and selling collateral &mdash; regardless of days past due.</div>
</div>
<p>The first is mechanical; the second is judgement. Both feed the same flag, and that flag drives PD calibration, provisioning and the capital number. Define it loosely and every downstream figure inherits the looseness.</p>
<div class="note">"Material" and "unlikely to pay" both need written, governed definitions. When four teams each hold a version of "default", nothing reconciles &mdash; a theme that returns in Mission 13.</div>`},

{l:"WHY",t:"Why provisions moved forward",h:"The lesson of <em>2008</em>",b:`<p><span class="k">IFRS 9</span> (International Financial Reporting Standard 9 &mdash; the accounting rulebook for financial instruments) governs how a bank sets aside money for loan losses. The old rule only let a bank provision once there was objective evidence a loss had happened &mdash; "incurred loss". In 2008 that meant provisions arrived late, after the losses were already visible, too late to help.</p>
<p>IFRS 9 flipped it to <strong>expected</strong> credit loss: provide for the loss you expect, before it is incurred, updated as the outlook changes. Forward-looking, not backward-looking.</p>
<div class="note">This is why a bank's provisions now move with the economic forecast, not just with actual defaults. It also made provisioning a data and modelling problem, which is why Finance now needs the same parameters Risk produces.</div>`},

{l:"MECHANISM",t:"The three stages",h:"How bad, and since <em>when</em>",b:`<p>IFRS 9 sorts every exposure into one of three stages by how much its credit risk has worsened <strong>since the loan was written</strong>.</p>
<div class="dt"><table>
<tr><th>Stage</th><th>Meaning</th><th>Provision held</th></tr>
<tr><td>Stage 1</td><td>Performing, no significant deterioration</td><td class="g">12-month ECL</td></tr>
<tr><td>Stage 2</td><td>Significant increase in credit risk since it was written</td><td class="g">Lifetime ECL</td></tr>
<tr><td>Stage 3</td><td>Credit-impaired (in default)</td><td class="g">Lifetime ECL</td></tr>
</table></div>
<p>The jump from Stage 1 to Stage 2 is the expensive one: the provision leaps from twelve months of expected loss to the loss expected over the <em>whole remaining life</em> of the loan. A wave of loans moving to Stage 2 hits the profit and loss account hard.</p>`},

{l:"FORMULA",t:"What ECL is",h:"The loss equation, over <em>time</em>",b:`<p><span class="k">Expected credit loss</span> (ECL) is the loss equation you already know &mdash; PD &times; LGD &times; EAD &mdash; but applied to each future period and discounted back to today (because a pound lost in three years hurts less than a pound lost now).</p>
<div class="fx"><div class="cap">Expected credit loss</div>
<div class="eq"><em>ECL</em> = &Sigma; <em>PD</em><sub>t</sub> &times; <em>LGD</em><sub>t</sub> &times; <em>EAD</em><sub>t</sub> &times; <em>DF</em><sub>t</sub></div>
<div class="wh">&Sigma;&nbsp;means "add up over every future period t"<br>
PD<sub>t</sub>&nbsp;the chance of defaulting <em>in</em> period t (point-in-time, forward-looking)<br>
DF<sub>t</sub>&nbsp;discount factor &mdash; shrinks a future loss to its value today</div></div>
<div class="dt"><table>
<tr><th>Measure</th><th>Horizon</th><th>Applies to</th></tr>
<tr><td>12-month ECL</td><td>Only defaults expected in the next 12 months</td><td>Stage 1</td></tr>
<tr><td>Lifetime ECL</td><td>Defaults expected across the whole remaining life</td><td>Stage 2 and 3</td></tr>
</table></div>
<div class="note">The PD here is point-in-time and forward-looking &mdash; the accounting number, not the through-the-cycle capital number. Same three parameters, different calibration, different answer.</div>`},

{l:"WORKED",t:"Lifetime ECL, step by step",h:"How the lifetime number is <em>built</em>",b:`<p>This is the calculation people find fuzzy, so here it is in full. A 3-year loan. EAD &pound;100,000, LGD 40% (so LGD &times; EAD = &pound;40,000 lost per default). The economy is expected to worsen, so the yearly default chance rises: 2%, 3%, 4%. The discount rate is 5%.</p>
<p><strong>Step 1 &mdash; survival.</strong> A loan can only default in year 2 if it survived year 1. So each year's <em>marginal</em> default chance is the chance of surviving until then, times that year's default rate.</p>
<div class="wk"><div class="h">Marginal probability of default each year</div>
<div class="r"><b>Year 1: 2% &times; (survived so far 100%)</b><span>2.00%</span></div>
<div class="r"><b>Year 2: 3% &times; (survived year 1 = 98%)</b><span>2.94%</span></div>
<div class="r"><b>Year 3: 4% &times; (survived years 1&ndash;2 = 95.06%)</b><span>3.80%</span></div>
</div>
<p><strong>Step 2 &mdash; loss per year, then discount it.</strong> Multiply each year's marginal PD by the &pound;40,000 lost per default, then shrink to today's value with the discount factor.</p>
<div class="wk"><div class="h">Expected loss, discounted</div>
<div class="r"><b>Year 1: 2.00% &times; 40,000 &times; 0.952</b><span>&pound;762</span></div>
<div class="r"><b>Year 2: 2.94% &times; 40,000 &times; 0.907</b><span>&pound;1,067</span></div>
<div class="r"><b>Year 3: 3.80% &times; 40,000 &times; 0.864</b><span>&pound;1,313</span></div>
<div class="r tot"><b>Lifetime ECL = sum of all three years</b><span>&pound;3,142</span></div>
</div>
<p>So the <strong>lifetime</strong> provision is <span class="k">&pound;3,142</span>. The <strong>12-month</strong> provision is just year 1 &mdash; <span class="k">&pound;762</span>. That gap, roughly four times larger, is exactly what hits the accounts the moment a loan moves from Stage 1 to Stage 2.</p>
<div class="note">The whole difficulty of lifetime ECL is in step 1: you need a PD for every future year, and the survival chain, not one single number. That is why lifetime models are so much heavier than the 12-month version.</div>`},

{l:"TRAP",t:"The staging trigger",h:"Where judgement <em>hides</em>",b:`<p>The whole provision depends on one decision: has credit risk increased <em>significantly</em> since the loan was written? There is no single legal threshold, so each bank sets its own triggers &mdash; and that is where the judgement, and the argument, lives.</p>
<div class="two">
<div><b>Quantitative trigger</b>PD has risen by more than a set amount since origination (when the loan was written)</div>
<div><b>Backstop</b>More than 30 days past due &mdash; a hard line that forces at least Stage 2</div>
</div>
<p>Because the Stage 1 to Stage 2 jump is so expensive, the trigger definitions are heavily governed and audited. For a reporting or change role, the staging logic is a load-bearing piece of the mapping, and a change to it is a change to the bank's profit.</p>`}
]},

/* ===================== 06 ===================== */
{n:"06",title:"Basel, end to end",stage:"Capital",
line:"Why an international capital rulebook exists, what each round fixed, the layers of capital explained one by one, and the reform now landing in the UK.",
cards:[

{l:"WHY",t:"Why a rulebook, and who writes it",h:"Committee, then <em>law</em>",b:`<p>Capital is expensive: a bank holding less of it earns more on what remains. Left alone, competition pushes every bank toward the thinnest cushion it can defend &mdash; until a bad year takes several of them down and the state pays.</p>
<p>The <span class="k">Basel Committee</span> (a global club of bank regulators, based in Basel, Switzerland) sets a common minimum so no country can attract business by permitting thinner banks. It has <strong>no legal power</strong>. It writes standards; national regulators turn them into enforceable law.</p>
<div class="flow">
<div class="n"><b>Basel Committee</b>Writes the global standard. No enforcement authority anywhere</div>
<div class="a">&#8595;</div>
<div class="n"><b>The PRA (Prudential Regulation Authority &mdash; the UK's bank regulator, part of the Bank of England)</b>Turns the standard into binding UK rules</div>
<div class="a">&#8595;</div>
<div class="n"><b>The bank</b>Calculates, holds, reports and discloses</div>
</div>
<div class="note">This is why the same standard produces different rules on different dates in different countries. National discretion is designed in, not a deviation.</div>`},

{l:"MECHANISM",t:"Four rounds, four failures",h:"Each version fixes the last one's <em>hole</em>",b:`<div class="dt"><table>
<tr><th>Version</th><th>What it did, and why it needed fixing</th></tr>
<tr><td>Basel I<br>1988</td><td>Five crude risk buckets. Simple, and immediately gamed &mdash; the worst borrower in a bucket cost the same as the best, so banks kept the worst</td></tr>
<tr><td>Basel II<br>2004</td><td>Risk sensitivity, three pillars, and permission to model own parameters. Then 2008 showed the models understated risk and the framework ignored liquidity entirely</td></tr>
<tr><td>Basel III<br>2010&ndash;17</td><td>More and better capital, plus two new dimensions &mdash; liquidity ratios and a leverage backstop that ignores risk weights</td></tr>
<tr class="hi"><td>Final reforms<br>2017</td><td>Attacks unjustifiable variation in modelled numbers. Constrains internal models, rewrites the standardised approach, imposes an output floor</td></tr>
</table></div>
<p>The final package has a different name in every jurisdiction &mdash; <strong>Basel 3.1</strong> in the UK, <strong>CRR3</strong> (Capital Requirements Regulation 3) in the EU, the "Basel III endgame" in the US. Same standard, different labels and start dates.</p>`},

{l:"DEFINE",t:"The three pillars",h:"Minimum, judgement, <em>daylight</em>",b:`<div class="dt"><table>
<tr><th>Pillar</th><th>Name</th><th>What it does</th></tr>
<tr><td>Pillar 1</td><td>Minimum requirements</td><td>Formula-driven capital for credit, market and operational risk &mdash; the same rules for every bank</td></tr>
<tr><td>Pillar 2</td><td>Supervisory review</td><td>The bank assesses risks Pillar 1 misses; the supervisor reviews and can add a firm-specific requirement</td></tr>
<tr><td>Pillar 3</td><td>Market discipline</td><td>Mandatory public disclosure on set templates, so investors and counterparties can compare banks</td></tr>
</table></div>
<p>Interest-rate risk in the banking book, concentration risk, pension and model risk carry <strong>no Pillar 1 charge</strong>. They are assessed in Pillar 2 &mdash; which is why the ICAAP (Mission 08) is substantive, not a form.</p>
<div class="note">Pillar 3 templates are prescribed to the cell and must reconcile to the regulatory returns and the published accounts &mdash; a reconciliation that is checked and regularly fails.</div>`},

{l:"MECHANISM",t:"What CET1 actually is",h:"The realest <em>money</em>",b:`<p>Before the stack, the one term that matters most. <span class="k">CET1 &mdash; Common Equity Tier 1</span> &mdash; is the highest-quality capital a bank has. In points, it is made of:</p>
<div class="lay">
<div><span>+</span><strong>Paid-up ordinary shares</strong> &mdash; money shareholders put in to own the bank.</div>
<div><span>+</span><strong>Retained earnings</strong> &mdash; past profits kept in the bank rather than paid out.</div>
<div><span>&minus;</span><strong>Deductions</strong> &mdash; goodwill, intangibles, and deferred tax assets that rely on future profit are subtracted, because none would absorb a real loss.</div>
</div>
<p>Why it is "the realest": it absorbs losses <strong>immediately, while the bank keeps trading</strong>, with no trigger and no maturity. When the market, a supervisor or the board judges a bank's strength, the CET1 ratio (this mission's close) is the single number they look at.</p>`},

{l:"MECHANISM",t:"The capital stack",h:"Loss-absorbing, in <em>order</em>",b:`<p>Not all capital absorbs loss equally, so the framework ranks it into three tiers, best at the top.</p>
<div class="dt"><table>
<tr><th>Tier</th><th>What it is</th><th>Absorbs loss</th><th>Quality</th></tr>
<tr class="hi"><td>CET1</td><td>Ordinary shares + retained earnings, net of deductions</td><td>Immediately, while trading &mdash; no trigger</td><td>Highest</td></tr>
<tr><td>AT1 (Additional Tier 1)</td><td>Perpetual instruments that convert to equity or write down when CET1 falls below a set trigger</td><td>While trading, once triggered ("going-concern")</td><td>High</td></tr>
<tr><td>Tier 2</td><td>Subordinated debt (loans repaid last) with a minimum maturity</td><td>Only in insolvency ("gone-concern")</td><td>Lower</td></tr>
</table></div>
<p>"Going-concern" means the capital absorbs losses while the bank is still alive and trading; "gone-concern" means it only helps once the bank has failed, protecting depositors in the wind-down.</p>
<div class="note">AT1 is where loss-absorption is contractual rather than structural, and it is the layer that behaves unexpectedly under stress &mdash; AT1 has been written down to zero while shares kept some value, which repriced the whole instrument class overnight.</div>`},

{l:"NUMBERS",t:"The minimum ratios",h:"Four-and-a-half, plus the <em>buffers</em>",b:`<p>Capital is measured as a percentage of risk-weighted assets (Mission 07). The minimum requirements, built up in layers:</p>
<div class="dt"><table>
<tr><th>Requirement</th><th class="n">Level</th><th>What it is</th></tr>
<tr><td>CET1 minimum</td><td class="n">4.5%</td><td>The floor of highest-quality capital</td></tr>
<tr><td>Tier 1 (CET1 + AT1)</td><td class="n">6.0%</td><td>Going-concern capital floor</td></tr>
<tr><td>Total capital</td><td class="n">8.0%</td><td>All three tiers</td></tr>
<tr class="hi"><td>+ Capital conservation buffer</td><td class="n">2.5%</td><td>Extra CET1 on top, to be run down in stress</td></tr>
<tr><td>+ Countercyclical buffer</td><td class="n">0&ndash;2.5%</td><td>Switched on by the regulator in booms</td></tr>
<tr><td>+ G-SIB surcharge</td><td class="n">1&ndash;3.5%</td><td>Extra for a global systemically important bank (one big enough that its failure threatens the system)</td></tr>
</table></div>
<p>Add the conservation buffer and the effective CET1 requirement becomes <strong>7.0%</strong>, and total capital <strong>10.5%</strong>. Buffers are meant to be <em>usable</em> &mdash; drawn down in a downturn, not defended to the last. A bank that hoards its buffer and cuts lending instead defeats the purpose.</p>`},

{l:"MECHANISM",t:"The leverage backstop",h:"A check the models <em>cannot</em> bend",b:`<p>Every ratio above divides capital by <em>risk-weighted</em> assets &mdash; and risk weights come from models that can be argued down. The <span class="k">leverage ratio</span> is the crude backstop that ignores risk weights entirely.</p>
<div class="sheet">
<div class="h">Three facts about the leverage ratio</div>
<div class="r"><b>1 &middot; What it is</b><span>Tier 1 capital divided by <em>total</em> exposure, un-weighted &mdash; every asset counted at full face value, no risk weighting.</span></div>
<div class="r"><b>2 &middot; Why it exists</b><span>A bank cannot make this ratio look good by claiming its assets are low-risk. It catches a bank that is thinly capitalised against a very large balance sheet, however "safe" the models say it is.</span></div>
<div class="r"><b>3 &middot; The number</b><span>Broadly around <strong>3%</strong> under Basel; the UK sets it at <strong>3.25%</strong> for major firms.</span></div>
</div>
<div class="note">Think of it as a seatbelt behind the airbags: the risk-weighted ratios do the main work, but the leverage ratio stops the whole system failing if the risk weights turn out to be wrong &mdash; which, in 2008, they were.</div>`},

{l:"MECHANISM",t:"Where the numbers meet",h:"The capital ratio, <em>assembled</em>",b:`<p>Put the two halves together and you have the number the whole framework produces.</p>
<div class="fx"><div class="cap">The capital ratio</div>
<div class="eq">CET1 ratio = <span class="fr"><i>CET1 capital</i><i>Risk-weighted assets</i></span> &ge; 7% incl. buffer</div>
<div class="wh">Numerator: the highest-quality capital of this mission<br>
Denominator: the risk-weighted assets of Mission 07</div></div>
<p>Everything above is the numerator. Mission 07 builds the denominator. The supervisor, the market and the board all watch this one ratio, and every data problem in the pack ends up moving it.</p>`},

{l:"LIVE",t:"Basel 3.1 in the UK",h:"The reform, and the <em>delay</em>",b:`<div class="stamp">Collected 19 August 2026</div>
<p>The final Basel reforms are being implemented in the UK by the PRA (the UK regulator) as <span class="k">Basel 3.1</span>, confirmed in its policy statement PS1/26.</p>
<div class="dt"><table>
<tr><th>Element</th><th>UK position</th></tr>
<tr class="hi"><td>Start date</td><td><strong>1 January 2027</strong></td></tr>
<tr><td>Output floor (Mission 07)</td><td>Modelled risk-weighted assets floored at <strong>72.5%</strong> of the standardised result; phased in gradually to full effect on <strong>1 January 2030</strong></td></tr>
<tr><td>FRTB internal models (Mission 03)</td><td>Deferred to <strong>1 January 2028</strong></td></tr>
<tr><td>EU version (CRR3)</td><td>Already in force since <strong>1 January 2025</strong></td></tr>
</table></div>
<p><strong>What "the PRA delay" means:</strong> the UK start date was pushed back &mdash; first from 2025 to 2026, then to 1 January 2027. The reason is coordination: the United States had not finalised its own version ("the endgame"), and if the UK went first with tougher rules, UK banks would be at a competitive disadvantage. So the PRA waited for international timing to line up. It is a delay in <em>when the rules bite</em>, not a change to the rules themselves.</p>
<div class="docs"><b>Official sources</b>
<a href="https://www.bankofengland.co.uk/news/2025/january/the-pra-announces-a-delay-to-the-implementation-of-basel-3-1" target="_blank" rel="noopener">Bank of England &mdash; PRA delay to Basel 3.1 implementation</a>
<a href="https://www.bis.org/basel_framework/" target="_blank" rel="noopener">The consolidated Basel Framework</a></div>`}
]},

/* ===================== 07 ===================== */
{n:"07",title:"Exposure into RWA",stage:"Capital",
line:"How a pile of exposures becomes the single denominator every capital ratio divides by &mdash; risk weights, collateral, off-balance-sheet, and the floor that caps the models.",
cards:[

{l:"MECHANISM",t:"What RWA is",h:"Assets, scaled by <em>risk</em>",b:`<p><span class="k">Risk-weighted assets</span> (RWA) is the denominator of every capital ratio. It scales each exposure by how risky it is, so a bank holds more capital against a risky asset than a safe one.</p>
<div class="fx"><div class="cap">Risk-weighted assets</div>
<div class="eq"><em>RWA</em> = &Sigma; <em>EAD</em><sub>i</sub> &times; <em>RW</em><sub>i</sub></div>
<div class="wh">&Sigma;&nbsp;add up over every exposure i<br>
EAD<sub>i</sub>&nbsp;exposure at default for exposure i<br>
RW<sub>i</sub>&nbsp;its risk weight, a percentage set by the rules or a model</div></div>
<p>A &pound;1m exposure at a 20% risk weight contributes &pound;200,000 of RWA; at 100% the full &pound;1m; at 150% it contributes &pound;1.5m. Multiply RWA by the capital ratio (e.g. 7% CET1) and you get the capital the bank must actually hold against it.</p>
<div class="note">RWA is a <em>data</em> problem, not an accounting one. Every risk weight depends on fields &mdash; rating, collateral, exposure class, maturity &mdash; that have to arrive, correct and traceable, from source systems.</div>`},

{l:"DEFINE",t:"Standardised risk weights",h:"The table you <em>look up</em>",b:`<p>Under the standardised approach the regulator hands the bank a table. A few indicative weights to build intuition (the binding numbers come from the PRA rulebook under Basel 3.1):</p>
<div class="dt"><table>
<tr><th>Exposure</th><th class="n">Indicative RW</th></tr>
<tr><td>Cash, central-bank reserves</td><td class="n">0%</td></tr>
<tr><td>High-grade sovereign (e.g. gilts)</td><td class="n">0%</td></tr>
<tr><td>Residential mortgage (low loan-to-value)</td><td class="n">20&ndash;35%</td></tr>
<tr><td>Corporate, investment grade</td><td class="n">65&ndash;100%</td></tr>
<tr><td>Corporate, unrated / weaker</td><td class="n">100%</td></tr>
<tr><td>Defaulted / high risk</td><td class="n">150%</td></tr>
</table></div>
<div class="note">Basel 3.1 rewrote this table &mdash; more granular mortgage weights by loan-to-value (the loan size versus the property value), a split of corporate exposures, and revised weights for specialised lending. The direction is more risk-sensitivity, so the standardised table is a fairer floor for the models.</div>`},

{l:"MECHANISM",t:"Credit risk mitigation",h:"Collateral that <em>cuts</em> the weight",b:`<p>Good collateral reduces the exposure the bank is at risk on, so it reduces RWA &mdash; but only if it is eligible, valued, and legally enforceable. The rules apply a <strong>haircut</strong> (a deliberate reduction in the value counted) to allow for the collateral falling in a stress.</p>
<div class="flow">
<div class="n"><b>Gross exposure</b>What is owed, before collateral</div>
<div class="a">&#8595;</div>
<div class="n"><b>Less collateral, after haircut</b>Eligible collateral value, reduced for volatility and currency mismatch</div>
<div class="a">&#8595;</div>
<div class="n"><b>Net exposure &times; risk weight</b>The RWA that remains</div>
</div>
<div class="note">Every step here is a data field: collateral type, value, valuation date, currency, legal eligibility flag. A missing or stale field means collateral cannot be recognised &mdash; and RWA, and the capital requirement, jump. This is the most common RWA data issue in any bank.</div>`},

{l:"MECHANISM",t:"Off-balance-sheet",h:"Commitments become <em>exposure</em>",b:`<p>An undrawn facility, a guarantee, a letter of credit &mdash; none is a loan today, but each can become one. The credit conversion factor (CCF, Mission 04) turns each into an on-balance-sheet-equivalent exposure before the risk weight is applied.</p>
<div class="fx"><div class="cap">Off-balance-sheet into RWA</div>
<div class="eq">RWA = ( drawn + <em>CCF</em> &times; undrawn ) &times; <em>RW</em></div>
<div class="wh">The undrawn portion enters at its CCF-adjusted amount, then is risk-weighted like any other exposure</div></div>
<p>Basel 3.1 removed the old 0% CCF for unconditionally cancellable commitments (facilities the bank can withdraw at any time, like some credit-card and overdraft limits), so undrawn limits now attract capital. That single change moved billions of RWA across the industry and is a live reporting item.</p>`},

{l:"DEFINE",t:"IRB, in one card",h:"The model, and its <em>leash</em>",b:`<p>Under the <span class="k">internal ratings-based</span> approach (IRB) the bank feeds its own PD, LGD and EAD into a prescribed Basel formula to produce the risk weight, rather than reading it from the table. The formula is set by the regulator; only the inputs are the bank's.</p>
<div class="dt"><table>
<tr><th>Flavour</th><th>Bank models</th><th>Regulator sets</th></tr>
<tr><td>Foundation IRB</td><td>PD</td><td>LGD and EAD</td></tr>
<tr><td>Advanced IRB</td><td>PD, LGD and EAD</td><td>&mdash;</td></tr>
</table></div>
<p>Basel 3.1 tightened the leash: some portfolios can no longer use advanced IRB, input floors set minimum PDs and LGDs, and the output floor (next card) caps the whole result.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/basel_framework/chapter/CRE/31.htm" target="_blank" rel="noopener">Basel Framework CRE31 &mdash; IRB risk-weight functions</a></div>`},

{l:"MECHANISM",t:"The output floor",h:"A model number, <em>floored</em>",b:`<p>The reform's headline. A bank using internal models must compare its modelled RWA to what the simple standardised approach would give, and take the higher of the two.</p>
<div class="fx"><div class="cap">The output floor</div>
<div class="eq">RWA = max ( <em>RWA</em><sub>model</sub> , 72.5% &times; <em>RWA</em><sub>std</sub> )</div>
<div class="wh">The modelled total RWA can never fall below 72.5% of the standardised total<br>UK: phased in gradually to full effect on 1 January 2030</div></div>
<p>Before this, two banks holding identical risk could report very different RWA because their models disagreed. The floor caps how far a model may diverge, restoring comparability &mdash; and for many large banks it, not the models, becomes the binding capital constraint.</p>
<div class="note">The reporting consequence is concrete: every IRB firm must now run the <em>standardised</em> calculation in parallel just to compute the floor, doubling part of the data and reconciliation work. That parallel calculation is exactly the kind of thing a change programme is built to deliver.</div>`}
]},

/* ===================== 08 ===================== */
{n:"08",title:"Pillar 2 and stress",stage:"Capital",
line:"The capital the formula misses, how the bank argues for its own number, and how a regulator tests whether the whole thing survives a bad scenario.",
cards:[

{l:"WHY",t:"Why Pillar 1 is not enough",h:"The formula has <em>blind spots</em>",b:`<p>Pillar 1 is a formula, and a formula only captures what it was built to capture. Real risks fall outside it: a book concentrated in one sector, interest-rate risk in the banking book, pension deficits, model error.</p>
<p><span class="k">Pillar 2</span> exists to catch those. The bank assesses them itself and holds extra capital; the supervisor reviews the assessment and can impose more. It is where judgement re-enters a framework that Pillar 1 tried to make purely mechanical.</p>
<div class="note">The single most-missed Pillar 1 blind spot is concentration: the formula assumes a diversified book, so a bank with half its lending to one sector looks as safe as one spread across ten. Pillar 2 is where that gets priced.</div>`},

{l:"DEFINE",t:"The ICAAP",h:"The bank's own capital <em>case</em>",b:`<p>The <span class="k">ICAAP</span> &mdash; Internal Capital Adequacy Assessment Process &mdash; is the document in which a bank makes its own case for how much capital it needs, across every material risk, tested under stress.</p>
<div class="lay">
<div><span>1</span><strong>Identify</strong> every material risk, including the Pillar 1 blind spots.</div>
<div><span>2</span><strong>Quantify</strong> the capital needed for each, with method and assumptions stated.</div>
<div><span>3</span><strong>Stress</strong> the whole thing against severe but plausible scenarios.</div>
<div><span>4</span><strong>Conclude</strong> with a capital number the board owns and signs.</div>
</div>
<div class="note">Its liquidity twin is the <strong>ILAAP</strong> (Internal Liquidity Adequacy Assessment Process) &mdash; the same exercise for liquidity. Both are read by supervisors years later to judge whether a number was deliberate or accidental &mdash; exactly the audience the methodology paper in Mission 14 is written for.</div>`},

{l:"MECHANISM",t:"Pillar 2A and 2B",h:"Add-on now, buffer for <em>later</em>",b:`<p>The supervisor's response to the ICAAP splits into two.</p>
<div class="dt"><table>
<tr><th>Layer</th><th>What it is</th><th>Held</th></tr>
<tr><td>Pillar 2A</td><td>An add-on for risks not captured, or under-captured, in Pillar 1</td><td>Today, as a hard requirement</td></tr>
<tr><td>Pillar 2B / PRA buffer</td><td>A forward-looking buffer sized by the stress test</td><td>To be drawn down in a downturn</td></tr>
</table></div>
<p>Basel 3.1 interacts with this: as Pillar 1 becomes more risk-sensitive, the PRA has said it will reduce Pillar 2A where the risk is now captured in Pillar 1, to avoid double-counting. So the reform moves capital between pillars, not just up or down.</p>`},

{l:"MECHANISM",t:"Stress testing",h:"Survive the bad <em>scenario</em>",b:`<p>A <span class="k">stress test</span> runs the bank's balance sheet through a severe hypothetical &mdash; a deep recession, a property crash, a rate shock &mdash; and asks whether capital stays above the minimum throughout.</p>
<div class="flow">
<div class="n"><b>Scenario</b>A defined path for GDP, unemployment, rates, house prices &mdash; set by the regulator or the bank</div>
<div class="a">&#8595;</div>
<div class="n"><b>Impact</b>PDs rise, LGDs worsen, RWA climbs, provisions jump, income falls</div>
<div class="a">&#8595;</div>
<div class="n"><b>Result</b>The capital ratio through the scenario &mdash; does it stay above the hurdle?</div>
</div>
<p>The regulator runs system-wide tests (in the UK, the Bank of England's concurrent stress test), and the bank runs its own inside the ICAAP. Both are enormous data exercises &mdash; every parameter re-computed under the scenario &mdash; and both depend on the same clean, traceable data everything else does.</p>`},

{l:"DEFINE",t:"Reverse stress testing",h:"Start from the <em>funeral</em>",b:`<p>Ordinary stress testing asks "does this scenario break us?" <span class="k">Reverse stress testing</span> flips it: "what scenario <em>would</em> break us, and how likely is it?" You start from failure and work backwards to find the causes.</p>
<p>It is valued because it surfaces the risks a bank has stopped imagining &mdash; the combination nobody modelled because it seemed impossible. The 2008 and 2023 failures were, in hindsight, reverse-stress scenarios nobody had run.</p>
<div class="note">For a change role the point is that stress and reverse-stress are downstream consumers of your data and your calculation engine. If the engine cannot re-run under a scenario cleanly, the stress test is guesswork.</div>`}
]}
,

/* ===================== 09 ===================== */
{n:"09",title:"Liquidity: LCR and NSFR",stage:"Liquidity",
line:"The fast death, and the two ratios built to prevent it &mdash; one for a 30-day panic, one for the shape of funding over a year, with the money worked through in pounds.",
cards:[

{l:"WHY",t:"Why liquidity is its own world",h:"Solvent, and dead by <em>Friday</em>",b:`<p>A bank can be perfectly solvent &mdash; assets worth more than liabilities &mdash; and still fail, because on a given day it cannot turn assets into cash fast enough to pay what is due. That is the fast death of Mission 02, and it is why liquidity has its own rulebook, its own ratios, and the highest-frequency reporting in the bank.</p>
<p>The rules answer two separate questions: can the bank survive a <strong>30-day</strong> run (the LCR), and is its funding <strong>structurally</strong> stable over a year (the NSFR)? Short shock, long shape.</p>
<div class="note">This is the centre of gravity for a Treasury and liquidity reporting role. If one mission in this pack is the day-job, it is this one and its plumbing in Missions 11&ndash;13.</div>`},

{l:"FORMULA",t:"The LCR",h:"Cash for a 30-day <em>run</em>",b:`<p>The <span class="k">Liquidity Coverage Ratio</span> (LCR) asks: if a severe stress hit for 30 days, does the bank hold enough liquid assets to cover the net cash flowing out?</p>
<div class="fx"><div class="cap">Liquidity Coverage Ratio</div>
<div class="eq">LCR = <span class="fr"><i>High-quality liquid assets (HQLA)</i><i>Net cash outflows over 30 days</i></span> &ge; 100%</div>
<div class="wh">HQLA&nbsp;assets that can be sold or pledged for cash fast, even in a stress<br>
net outflows&nbsp;outflows minus capped inflows, over a 30-day stress window</div></div>
<p><strong>HQLA</strong> (high-quality liquid assets) are graded by how reliably they hold value and convert to cash, and lower grades are counted at a discount &mdash; a <strong>haircut</strong>.</p>
<div class="dt"><table>
<tr><th>Grade</th><th>Examples</th><th class="n">Haircut</th><th>Cap</th></tr>
<tr><td>Level 1</td><td>Cash, central-bank reserves, gilts</td><td class="n">0%</td><td>No cap</td></tr>
<tr><td>Level 2A</td><td>High-grade government / covered bonds</td><td class="n">15%</td><td rowspan="2">L2 &le; 40% of buffer; L2B &le; 15%</td></tr>
<tr><td>Level 2B</td><td>Lower-grade corporate bonds, some equities</td><td class="n">25&ndash;50%</td></tr>
</table></div>
<div class="note">Inflows are capped at 75% of outflows, so a bank cannot count on everything owed to it arriving on time. That cap is a common source of reporting error.</div>`},

{l:"WORKED",t:"LCR in pounds",h:"The ratio, <em>calculated</em>",b:`<p>A worked example, all figures in millions.</p>
