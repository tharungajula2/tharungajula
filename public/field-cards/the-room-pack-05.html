<div class="good"><div class="lab">The most useful sentence in this whole conversation</div>
<p>"The uncertainty does not change the recommendation" — where true. It tells the listener they do not need to resolve the uncertainty to act, which is frequently the only thing standing between the analysis and a decision.</p></div>` },

{label:'MECHANISM', tag:'Visual', title:'One chart, one argument', stage:8, html:`
<p>A chart shown to a non-specialist audience should make a single point, and the point should be readable before anything is said about it.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">The title states the finding, not the contents<em>"Bad rate rising in the partner channel since June" rather than "Bad rate by channel"</em></span></li>
<li><span class="k">02</span><span class="v">Everything not supporting that finding is removed<em>Gridlines, extra series, legends restating the axis</em></span></li>
<li><span class="k">03</span><span class="v">The comparison is built in<em>The threshold, the prior period, or the other segment — visible in the same frame rather than described</em></span></li>
<li><span class="k">04</span><span class="v">One chart per point<em>Two arguments on one chart means neither is made</em></span></li>
</ul>
<div class="warn"><div class="lab">The cohort chart requires a sentence of setup</div>
<p>Curves by origination cohort against months on book is the most informative chart in lending and the least intuitive. Without "each line is a month's lending, and we are comparing them at the same age", a room reads it as a time series and draws the opposite conclusion.</p></div>` },

{label:'TRAP', tag:'Precision', title:'False precision costs credibility', stage:8, html:`
<p>Quoting a projected credit cost to three decimal places asserts a confidence the estimate does not have. The first listener who notices treats every other figure with the same suspicion.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Round to the precision of the estimate<em>An estimate with a fifteen per cent range is quoted to two significant figures, not five</em></span></li>
<li><span class="k">02</span><span class="v">Distinguish measured from projected<em>Last quarter's loss is a fact. Next year's is a projection. Presenting them in the same format merges them.</em></span></li>
<li><span class="k">03</span><span class="v">Reconcile before presenting<em>Any figure appearing in two places must match. One mismatch, noticed publicly, ends the discussion of substance.</em></span></li>
</ul>
<div class="note"><div class="lab">The underlying principle</div>
<p>Precision should signal how much a number can be relied on. Where it signals only effort, it is misleading — and the audience most likely to over-rely on it is the one least equipped to notice.</p></div>` },

{label:'MECHANISM', tag:'Pressure', title:'The question with no good answer', stage:8, html:`
<p>Some questions in these rooms cannot be answered honestly and satisfyingly at the same time. Three that recur, and what actually works.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">"Can you guarantee losses won't exceed this?"<em>No, and saying so plainly then giving the range and the trigger for reassessment is stronger than any hedge</em></span></li>
<li><span class="k">02</span><span class="v">"Why didn't we see this earlier?"<em>Answer the mechanism, not the blame. Frequently the honest answer is that the leading indicator existed and was not being watched — which is a finding worth surfacing.</em></span></li>
<li><span class="k">03</span><span class="v">"What would you do?"<em>Answer it. Declining to give a view when directly asked is read as evasion, not as neutrality.</em></span></li>
</ul>
<div class="good"><div class="lab">The move for a question genuinely unanswerable in the room</div>
<p>Say what would be needed to answer it and by when. "That needs the cohort at nine months, which we have in November" is a complete answer. Improvising a number under pressure is the single fastest way to lose a room permanently, because the improvised figure will be quoted back.</p></div>` },

{label:'WORKED', tag:'Translation', title:'The same finding, two rooms', stage:8, html:`
<p>Presenting portfolio quality to lending and risk leadership, the same underlying finding needed two different framings — and the difference was not simplification.</p>
<div class="vs">
  <div class="no"><div class="t">Risk audience</div><div class="d">Stability index breached on two characteristics; cohort curves diverging from month six; recommend recalibration ahead of schedule.</div></div>
  <div class="yes"><div class="t">Business audience</div><div class="d">Lending since June is performing worse at the same age than earlier lending. On current volumes that is roughly this much additional loss next year. Here is what would confirm it and when.</div></div>
</div>
<p>Neither is dumbed down. They are aimed at different actions — one at a technical remediation, one at a commercial decision — and the second required knowing what the business could actually do about it.</p>` },

{label:'THE HARD QUESTION', tag:'Simplification', title:'Where does simplifying become misleading?', stage:8, html:`
<p>The line is not about how much detail is dropped. It is about whether the listener's <b>decision</b> would change if they knew what was dropped.</p>
<div class="vs">
  <div class="no"><div class="t">Misleading</div><div class="d">Omitting that the estimate assumes stable conditions, when the audience is deciding on the basis of it being robust.</div></div>
  <div class="yes"><div class="t">Legitimate</div><div class="d">Omitting the estimation method entirely. It does not change the decision and the audience cannot evaluate it.</div></div>
</div>
<p>The test is applied per audience and per decision, not per fact. The same omission is fine in one room and a failure in another.</p>
<div class="warn"><div class="lab">The asymmetry to watch in oneself</div>
<p>The details most tempting to omit are the ones that complicate the recommendation. That correlation is not accidental, and noticing it is most of the defence — where a simplification happens to make the case cleaner, it deserves a second look before it is made.</p></div>` },

{label:'CLOSE', tag:'07 / 10', title:'Now owned', stage:8, html:`
<ul class="own">
<li>The three questions a non-specialist is actually running</li>
<li>Natural frequencies and the listener's own unit, not percentages</li>
<li>Bounded confidence, and whether the uncertainty is decision-relevant</li>
<li>One chart, one argument, with the finding in the title</li>
<li>Precision that signals reliability rather than effort</li>
<li>Answering "what would you do", and never improvising a figure</li>
<li>The simplification test: would the decision change if they knew</li>
</ul>
<div class="next">
<div class="lab">Mission 08 unlocks</div>
<div class="ttl">The Disagreement</div>
<p>Being right is not sufficient and is sometimes the problem. Disagreeing with policy, with engineering, with a client — and the escalation that preserves the relationship.</p>
</div>` }

]},
{n:'08', title:'The Disagreement', stage:7,
 sub:'Being right is not sufficient, and in the wrong register it is counterproductive. This mission covers disagreeing with policy, with engineering and with a client — what to do when overruled, and the escalation that preserves the working relationship.',
 covers:['Separating the position from the person','Disagreeing upward','The client who is wrong','Being overruled well','When to escalate','The disagreement that must be recorded'],
 cards:[

{label:'ORIENT', tag:'Register', title:'The position, not the person', stage:7, html:`
<p>Most workplace disagreement fails for structural reasons rather than social ones. A challenge phrased as a correction invites defence of the original position, and the conversation becomes about who was right.</p>
<div class="vs">
  <div class="no"><div class="t">Correction</div><div class="d">That approach won't work — the sample isn't representative.</div></div>
  <div class="yes"><div class="t">Shared problem</div><div class="d">If the sample skews toward one channel, the conclusion moves. Worth checking before this goes further?</div></div>
</div>
<p>The second says the same thing and leaves the other person somewhere to go that is not a reversal. It also leaves open the possibility that the objection is wrong, which occasionally it is.</p>
<div class="note"><div class="lab">The genuine reframe, not a technique</div>
<p>Two people looking at a problem together will disagree about the problem. Two people defending positions will disagree about each other. The wording matters because it determines which of those is happening — and the first produces better answers as well as better relationships.</p></div>` },

{label:'MECHANISM', tag:'Upward', title:'Disagreeing upward', stage:7, html:`
<p>The asymmetry is real and pretending otherwise is unconvincing. Four things make an upward challenge land.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Privately first<em>A challenge in a meeting requires a public reversal. The same point raised beforehand costs nothing to accept.</em></span></li>
<li><span class="k">02</span><span class="v">On evidence, not judgement<em>"The swap-set at that setting has swap-in performing worse than swap-out" beats "I think that's too aggressive"</em></span></li>
<li><span class="k">03</span><span class="v">With a route forward<em>An objection with no alternative is a blockage. An objection with a modified version is a contribution.</em></span></li>
<li><span class="k">04</span><span class="v">Once, clearly<em>Repeating a lost argument converts a technical position into a personal one</em></span></li>
</ul>
<div class="good"><div class="lab">What actually earns the standing to do this</div>
<p>Having been right before, visibly, in low-stakes situations. Credibility is accumulated on small calls and spent on large ones. Somebody whose first-ever disagreement is on a major decision has no balance to draw on.</p></div>` },

{label:'MECHANISM', tag:'Engineering', title:'The disagreement about feasibility', stage:7, html:`
<p>A recurring shape: a requirement is stated, engineering says it cannot be done in the time, and the conversation becomes a negotiation over an estimate neither side can verify.</p>
<p>The productive move is to separate three things that are being bundled into one word.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Cannot be done<em>Genuinely infeasible — the data does not exist, the system cannot deliver it. Accept immediately and redesign.</em></span></li>
<li><span class="k">02</span><span class="v">Cannot be done well in the time<em>A quality and debt trade-off. A legitimate engineering judgement to surface, not to override.</em></span></li>
<li><span class="k">03</span><span class="v">Cannot be done as specified<em>The requirement is over-constrained. Usually the real situation, and usually solvable by finding which constraint is actually load-bearing.</em></span></li>
</ul>
<div class="good"><div class="lab">The question that separates them</div>
<p>"Which part of this is the expensive part?" Almost always one clause is driving most of the effort — a real-time requirement that could be near-real-time, an edge case that affects a fraction of a per cent. Finding it converts a standoff into a design conversation.</p></div>` },

{label:'MECHANISM', tag:'Client', title:'The client who is wrong', stage:7, html:`
<p>In a platform seat this arrives regularly: a client insists on behaviour that is inconsistent with their own policy, unworkable at scale, or a compliance exposure.</p>
<div class="flow">
<div><span class="s">First</span><span class="x">Establish what they are trying to achieve. The stated request is often a proposed solution to an unstated problem.</span></div>
<div><span class="s">Then</span><span class="x">State the consequence factually, in their terms — operational load, exposure, cost</span></div>
<div><span class="s">Then</span><span class="x">Offer the version that achieves the goal without the consequence</span></div>
<div><span class="s">If refused</span><span class="x">Implement as instructed, and record the position in writing</span></div>
</div>
<div class="warn"><div class="lab">The last row is not a formality</div>
<p>Where a client insists on something against advice, that advice belongs in the written record — neutrally, without editorial. Not to allocate blame later, but because when the consequence materialises the conversation is about what to do next rather than about what was known when.</p></div>` },

{label:'MECHANISM', tag:'Losing', title:'Being overruled well', stage:7, html:`
<p>Most disagreements are lost, and how they are lost determines whether the next one is heard.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Commit properly<em>Half-executing a decision that was argued against, and letting it fail, is visible and costly to reputation</em></span></li>
<li><span class="k">02</span><span class="v">Record the position once, without editorial<em>A neutral line in the minutes. Not repeated, not referenced afterwards.</em></span></li>
<li><span class="k">03</span><span class="v">Name what would change the answer<em>"If early delinquency on this cohort exceeds two per cent by month three, worth revisiting" — a trigger, agreed in advance</em></span></li>
<li><span class="k">04</span><span class="v">Do not revisit it early<em>Raising it again before the trigger fires spends credibility and confirms the disagreement was personal</em></span></li>
</ul>
<div class="good"><div class="lab">Why the third item is the whole technique</div>
<p>It converts a lost argument into a monitored condition. Nobody has to concede anything now, and when the trigger fires the reassessment happens automatically rather than requiring somebody to reopen a settled decision.</p></div>` },

{label:'TRAP', tag:'Escalation', title:'What escalation actually costs', stage:7, html:`
<p>Escalation is a legitimate mechanism and an expensive one. It converts a peer disagreement into a judgement by someone senior, and both parties lose autonomy in the process.</p>
<div class="vs">
  <div class="no"><div class="t">Premature</div><div class="d">Escalating a technical disagreement that had not been fully worked. Reads as an inability to resolve things.</div></div>
  <div class="yes"><div class="t">Warranted</div><div class="d">A control, regulatory or customer-harm exposure that the other party has declined to address after being told plainly.</div></div>
</div>
<p>The test is not the strength of the disagreement. It is whether the matter is <b>one either party is authorised to settle</b>. A cutoff dispute between two analysts is not — it belongs upward by design.</p>
<div class="warn"><div class="lab">One thing that is never optional</div>
<p>Telling the other party before escalating. Not as courtesy — an escalation that arrives as a surprise permanently damages the working relationship, and most escalations are resolved in the conversation where the intention is announced.</p></div>` },

{label:'MECHANISM', tag:'Record', title:'The disagreement that has to be written down', stage:7, html:`
<p>Most disagreements are resolved and forgotten, correctly. A narrow class must be recorded regardless of outcome.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">A control or regulatory exposure was raised<em>Whether or not it was accepted</em></span></li>
<li><span class="k">02</span><span class="v">A model or system limitation was flagged before go-live<em>So that its later materialisation is understood as known rather than as a surprise</em></span></li>
<li><span class="k">03</span><span class="v">A client or business instruction ran against advice<em>Neutrally, in the delivery record</em></span></li>
<li><span class="k">04</span><span class="v">An assumption was accepted under time pressure<em>What was assumed, why, and what would validate it later</em></span></li>
</ul>
<div class="note"><div class="lab">Written for the successor, not for the file</div>
<p>The purpose is not protection. It is that in eighteen months somebody will encounter the consequence and need to know it was considered — and whether it was considered and accepted or simply never seen determines what they do about it.</p></div>` },

{label:'THE HARD QUESTION', tag:'Cost', title:'When is the right call to say nothing?', stage:7, html:`
<p>Disagreeing has a budget. Somebody who objects to everything is routed around; the objections stop being evaluated on merit and start being filtered by source.</p>
<p>Three tests, and the answer is silence unless at least one is met.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Is it reversible?<em>A reversible decision going wrong is a learning event. An irreversible one is not, and irreversibility raises the bar for staying quiet.</em></span></li>
<li><span class="k">02</span><span class="v">Who absorbs it if wrong?<em>A team absorbing its own mistake is different from a customer, a regulator or a client absorbing it</em></span></li>
<li><span class="k">03</span><span class="v">Is this a preference or a defect?<em>Most disagreements are about approach. A minority are about something being incorrect. Only the second is always worth spending on.</em></span></li>
</ul>
<div class="warn"><div class="lab">The exception that overrides all three</div>
<p>Where the exposure is a control failure, a regulatory breach or customer harm, the budget does not apply. Those are raised every time, regardless of how recently something else was raised and regardless of the cost to the relationship.</p></div>` },

{label:'CLOSE', tag:'08 / 10', title:'Now owned', stage:7, html:`
<ul class="own">
<li>Challenging the position rather than the person, and why it produces better answers</li>
<li>Privately, on evidence, with a route forward, once</li>
<li>Infeasible, expensive, or over-specified — and the question that separates them</li>
<li>The client sequence, ending in implementation with the advice recorded</li>
<li>Being overruled: commit, record once, agree a trigger, do not reopen early</li>
<li>Escalation as a cost, and never as a surprise</li>
<li>The disagreement budget, and the exposure that overrides it</li>
</ul>
<div class="next">
<div class="lab">Mission 09 unlocks</div>
<div class="ttl">The Handover</div>
<p>Work that survives its author: what a successor actually needs, the knowledge that never made it into any document, and leaving without leaving a hole.</p>
</div>` }

]},
{n:'09', title:'The Handover', stage:12,
 sub:'Work that cannot survive its author is a liability regardless of quality. This mission covers what a successor actually needs, the knowledge that never reaches a document, and the practice that makes handover a habit rather than an event.',
 covers:['What a successor is missing','The undocumented layer','The handover pack','Ownership as a named thing','Continuous rather than final handover'],
 cards:[

{label:'ORIENT', tag:'The gap', title:'What a successor is actually missing', stage:12, html:`
<p>Code, documents and dashboards transfer easily. Four things do not, and they are what make the difference between inheriting a system and inheriting a mystery.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Why it is like this<em>The decision behind every strange choice. Almost always a reason existed; almost never was it recorded.</em></span></li>
<li><span class="k">02</span><span class="v">What is fragile<em>Which step fails silently, which upstream feed is unreliable, what breaks at month end</em></span></li>
<li><span class="k">03</span><span class="v">Who to ask<em>The person in another team who actually understands the source system, regardless of what any chart says</em></span></li>
<li><span class="k">04</span><span class="v">What was already tried<em>The approach that looks obvious and was attempted eighteen months ago and failed for a reason</em></span></li>
</ul>
<div class="warn"><div class="lab">The cost of the first item</div>
<p>A successor encountering an unexplained oddity has two options: preserve it without understanding, or remove it. Both are wrong roughly half the time. An undocumented workaround for a real upstream defect gets removed, and the defect returns in production.</p></div>` },

{label:'MECHANISM', tag:'Pack', title:'The handover document', stage:12, html:`
<div class="doc"><div class="h">Handover · skeleton</div><ol>
<li>What this is<em>Purpose, who consumes the output, what depends on it</em></li>
<li>How to run it<em>The exact commands, the schedule, where outputs land</em></li>
<li>The calendar<em>What happens weekly, monthly, quarterly — with dates that matter</em></li>
<li>Known fragility<em>What breaks, how it presents, what to do</em></li>
<li>Decisions and their reasons<em>Every non-obvious choice, with why</em></li>
<li>People<em>Who owns each upstream source, who consumes the output, who approves changes</em></li>
<li>Open items<em>In flight, blocked, or deferred — with current status</em></li>
<li>What was tried and rejected<em>With the reason, so it is not re-attempted from scratch</em></li>
</ol></div>
<p class="small">Sections four, five and eight are the ones that do not exist anywhere else. The rest is assembled from documents that already exist.</p>` },

{label:'MECHANISM', tag:'Fragility', title:'Writing down what breaks', stage:12, html:`
<p>Every recurring process has a set of failures its owner handles automatically and has never described. Making them explicit is the highest-value hour of any handover.</p>
<pre class="code">SYMPTOM   month-end run produces ~3% fewer accounts
CAUSE     source extract lands late on the 1st; the job
          reads a partial file rather than failing
CHECK     compare row count against prior month before
          publishing anything
FIX       rerun after 11:00; the file is complete by then
OWNER     [name], data platform team
PERMANENT open — a size check on the extract is the fix</pre>
<div class="good"><div class="lab">What this converts</div>
<p>Tacit competence into a transferable procedure. It also makes the permanent fix visible as an outstanding item rather than as something perpetually absorbed by whoever is running it — which is how workarounds become permanent by default.</p></div>` },

{label:'MECHANISM', tag:'Ownership', title:'Named, not implied', stage:12, html:`
<p>An artifact without a named owner has an implied one — usually whoever built it, indefinitely, regardless of role changes.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Every recurring output has a named owner<em>Not a team. A person, with a documented deputy.</em></span></li>
<li><span class="k">02</span><span class="v">Every model and rule set has an owner<em>Distinct from whoever built it. Governance requires this and it is frequently unfilled in practice.</em></span></li>
<li><span class="k">03</span><span class="v">Ownership transfers explicitly<em>With a date, an acknowledgement, and a period where both parties are available</em></span></li>
</ul>
<div class="warn"><div class="lab">The pattern this prevents</div>
<p>Someone changes role and continues receiving questions about a system they no longer own, answering them from memory that is degrading. The output stays alive without maintenance, degrades slowly, and fails at a point where nobody has current context. Naming the transfer is what stops this.</p></div>` },

{label:'MECHANISM', tag:'Practice', title:'Continuous rather than final', stage:12, html:`
<p>A handover written in the last fortnight is written under time pressure, from memory, by someone already mentally elsewhere. It is reliably the worst version.</p>
<div class="flow">
<div><span class="s">At build</span><span class="x">Record the reason alongside every non-obvious decision, as it is made</span></div>
<div><span class="s">On failure</span><span class="x">Add each new failure to the fragility list when it is fresh</span></div>
<div><span class="s">Quarterly</span><span class="x">Review the document against reality; delete what is stale</span></div>
<div><span class="s">On exit</span><span class="x">The document already exists. The handover is a conversation, not a writing exercise.</span></div>
</div>
<div class="good"><div class="lab">The secondary benefit</div>
<p>A living handover document is the fastest way to onboard anyone at any time — a new joiner, a covering colleague, an auditor. It stops being an exit artifact and becomes the reference for the work itself.</p></div>` },

{label:'WORKED', tag:'Reproduction', title:'The reproduction test', stage:12, html:`
<p>The most reliable way to discover what a handover is missing is to have the successor <b>reproduce a published output independently</b> before the incumbent leaves.</p>
<p>It fails the first time. Every time. The gap is the education — an undocumented exclusion, a manual adjustment applied by habit, a definition that drifted from the written one, a filter nobody remembered.</p>
<div class="good"><div class="lab">Why this is worth insisting on</div>
<p>It converts handover from a claim into a demonstration. A successor who has reproduced the number owns it. One who has read about how it is produced will discover the gaps alone, in the first cycle after the incumbent has gone, under deadline.</p></div>` },

{label:'TRAP', tag:'Indispensability', title:'Being irreplaceable is a trap', stage:12, html:`
<p>There is a quiet incentive to be the only person who can run something. It is understood as security and it functions as the opposite.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">It prevents movement<em>Somebody who cannot be released from a process does not get moved to a better one</em></span></li>
<li><span class="k">02</span><span class="v">It concentrates blame<em>When the sole owner's process fails, there is no shared understanding to distribute the diagnosis across</em></span></li>
<li><span class="k">03</span><span class="v">It is a governance finding<em>Key-person dependency on a control-relevant process is something an audit is specifically looking for</em></span></li>
</ul>
<div class="note"><div class="lab">What is actually valued</div>
<p>Not the person who alone can run a process, but the person whose processes run without them and who is therefore available for the next problem. That is what a promotion consists of structurally — being detachable from current responsibilities.</p></div>` },

{label:'THE HARD QUESTION', tag:'Effort', title:'How much documentation is too much?', stage:12, html:`
<p>Over-documenting is a real failure. A document nobody maintains becomes misleading, which is worse than an absent one, because it is trusted.</p>
<p>The test is not volume. It is <b>whether the document would be wrong if nobody updated it for six months</b>.</p>
<div class="vs">
  <div class="no"><div class="t">Rots</div><div class="d">Step-by-step interface walkthroughs, current thresholds, personnel lists, anything mirroring a live system.</div></div>
  <div class="yes"><div class="t">Durable</div><div class="d">Why decisions were made, what has failed before, what was tried and rejected, what the process is for.</div></div>
</div>
<p>Reasons and history do not go stale. Configuration and procedure do, and it belongs in the system rather than in a document about the system.</p>
<div class="note"><div class="lab">The practical rule</div>
<p>Document the <b>why</b> heavily and the <b>what</b> lightly, pointing at where the current state actually lives. A handover that says "thresholds are in the policy file, current version is authoritative" ages better than one that lists the thresholds and is wrong within a quarter.</p></div>` },

{label:'CLOSE', tag:'09 / 10', title:'Now owned', stage:12, html:`
<ul class="own">
<li>The four things that never transfer: why, fragility, who to ask, what was tried</li>
<li>The eight-section pack, with three sections that exist nowhere else</li>
<li>Fragility written as symptom, cause, check, fix, permanent remedy</li>
<li>Ownership named per artifact, transferred explicitly with a date</li>
<li>Continuous handover, so the exit version is a conversation</li>
<li>The successor reproducing a published number before the incumbent leaves</li>
<li>Document the why heavily, the what lightly</li>
</ul>
<div class="next">
<div class="lab">Mission 10 unlocks</div>
<div class="ttl">On Duty</div>
<p>The operating rhythm that holds all of it together, and the three recall surfaces that close the pack — and the series.</p>
</div>` }

]},
{n:'10', title:'On Duty', stage:10,
 sub:'The rhythm that holds the artifacts together, the first ninety days in a new seat, and the three recall surfaces that close this pack and the series.',
 covers:['The weekly and monthly rhythm','The first ninety days','Every trap in one grid','Every structure on one card','The compression','What the five packs amount to'],
 cards:[

{label:'MECHANISM', tag:'Rhythm', title:'The operating cadence', stage:10, html:`
<div class="flow">
<div><span class="s">Daily</span><span class="x">Exceptions and anything with a live decision attached. Nothing that can wait.</span></div>
<div><span class="s">Weekly</span><span class="x">Open questions chased to named owners; drafts circulated for the coming cycle</span></div>
<div><span class="s">Monthly</span><span class="x">The monitoring pack; carried actions reviewed; one committee item prepared properly</span></div>
<div><span class="s">Quarterly</span><span class="x">Documents reviewed against reality; stale content deleted; handover refreshed</span></div>
</div>
<div class="note"><div class="lab">The quarterly line is the one that gets dropped</div>
<p>It has no deadline and no requester, so it loses to everything with either. It is also what prevents the slow accumulation of documents that are quietly wrong — and a document that is wrong and trusted causes more damage than one that does not exist.</p></div>` },

{label:'NUMBERS', tag:'Arrival', title:'The first ninety days in a new seat', stage:10, html:`
<div class="flow">
<div><span class="s">Days 1–10</span><span class="x">Read the last two model documents and the last four monitoring packs, unaided</span></div>
<div><span class="s">Days 11–20</span><span class="x">Draw the lineage from source system to published number. Nobody has this diagram.</span></div>
<div><span class="s">Days 21–35</span><span class="x">Sit with whoever handles the exceptions — underwriting, operations, collections</span></div>
<div><span class="s">Days 36–50</span><span class="x"><b>Reproduce one published number independently.</b> It will not match the first time.</span></div>
<div><span class="s">Days 51–70</span><span class="x">Write up the discrepancy found. This is the credibility event.</span></div>
<div><span class="s">Days 71–90</span><span class="x">Take one artifact and improve it — usually the monitoring pack, usually by cutting it</span></div>
</div>
<div class="good"><div class="lab">Why reproduction outranks shipping</div>
<p>A feature delivered in month two is judged on whether it was needed, which a newcomer cannot yet know. A discrepancy found in a number leadership relies on is unambiguously valuable, requires no permission, and establishes that the newcomer checks things.</p></div>` },

{label:'NUMBERS', tag:'Recall surface I', title:'Every trap in one grid', stage:12, html:`
<table>
<tr><th>Symptom</th><th>Cause</th><th>Move</th></tr>
<tr><td>Good analysis, nothing changed</td><td>Decision request sent as a report</td><td>Ask in sentence one, three options, a recommendation</td></tr>
<tr><td>Item deferred at committee</td><td>An unanswered question, not disagreement</td><td>Cover exposure, reviewers, and consequence of inaction</td></tr>
<tr><td>Recommendation negotiated arbitrarily</td><td>Arrived with a point, not a curve</td><td>Show the range; let the room place the appetite</td></tr>
<tr><td>Objection surfaces in the room</td><td>No pre-wiring</td><td>Walk the draft with objectors; record unresolved views</td></tr>
<tr><td>Validation takes three rounds</td><td>Weaknesses left for the reviewer to find</td><td>Volunteer the limitations section</td></tr>
<tr><td>Model used outside its population</td><td>Intended use never stated plainly</td><td>Name product, segment, channel, decision</td></tr>
<tr><td>Two builders, two systems</td><td>Requirement readable two ways</td><td>Acceptance cases written during requirements</td></tr>
<tr><td>Rules nobody can source</td><td>No authority column</td><td>Map every rule to its policy clause</td></tr>
<tr><td>Pack grows, readership falls</td><td>Additions easy, removals contested</td><td>Cut to summary and exceptions; appendix the rest</td></tr>
<tr><td>Threshold breached, nothing happens</td><td>Threshold set after the number</td><td>Set in advance, record the date, require a decision to move it</td></tr>
<tr><td>Commentary describes the chart</td><td>Narration instead of diagnosis</td><td>What moved, where, why, what is being done</td></tr>
<tr><td>Incident cause cannot be established</td><td>Fixed before evidence was preserved</td><td>Snapshot inputs, outputs, config before touching it</td></tr>
<tr><td>Incidents stop being reported</td><td>Reviews produce culprits</td><td>Trace to the mechanism that permitted it</td></tr>
<tr><td>Same failure recurs renamed</td><td>Closed on the fix, not on detection</td><td>Every incident leaves a new automated check</td></tr>
<tr><td>Room fills the vacuum</td><td>Hedging read as having no view</td><td>Best estimate, honest range, decision relevance</td></tr>
<tr><td>Every figure doubted</td><td>One unreconciled number</td><td>Reconcile across summary, body and appendix</td></tr>
<tr><td>Objections stop being evaluated</td><td>Disagreement budget overspent</td><td>Reversibility, who absorbs it, defect or preference</td></tr>
<tr><td>Lost argument keeps returning</td><td>No agreed trigger</td><td>Name the condition that reopens it</td></tr>
<tr><td>Successor removes a workaround</td><td>The reason was never recorded</td><td>Document the why alongside the decision</td></tr>
<tr><td>Cannot be moved to better work</td><td>Sole operator of a live process</td><td>Named owner, deputy, reproduction test</td></tr>
</table>` },

{label:'NUMBERS', tag:'Recall surface II', title:'Every structure on one card', stage:12, html:`
<pre class="code"><u>REQUIREMENT</u>
purpose · open questions · inputs · rules · sequence
outcomes · edge cases · non-functional
acceptance criteria · traceability
<i>test: could two people build different things?</i>

<u>MODEL DOCUMENT</u>
intended use · data · sampling · selection · method
performance · implementation · monitoring
LIMITATIONS · governance
<i>the limitations section is the fast route through</i>

<u>COMMITTEE NOTE</u>  <i>— one page</i>
the ask · context · options · recommendation
impact · risks · reviewed by · if not approved
<i>ask in sentence one; three options, same measures</i>

<u>MONITORING PACK</u>
status summary · exceptions · population · decisions
performance · carried actions · appendix
<i>fixed shape, fixed definitions, thresholds preset</i>

<u>INCIDENT</u>
stop · bound · tell · preserve · diagnose
then: summary · timeline · impact · cause
detection · remediation · prevention
<i>cause is a mechanism; closure is a new check</i>

<u>HANDOVER</u>
what · how to run · calendar · fragility
decisions and reasons · people · open items
tried and rejected
<i>document the why heavily, the what lightly</i>

<u>THE RAMP</u>
inform    → they now know it
persuade  → a decision is taken
bind      → a system now matches it</pre>` },

{label:'ORIENT', tag:'Recall surface III', title:'The compression', stage:12, html:`
<p class="kicker">The pack in one paragraph, for the moment there is no time to read anything else.</p>
<div class="note"><div class="lab">The compression</div>
<p>Analysis becomes real when it takes the shape of a document somebody can act on. So: know whether the thing being written is meant to <b>inform, persuade or bind</b>, and write it accordingly. <b>Specify</b> so that two people cannot build different things. <b>Volunteer the limitations</b>, because the fastest route through a gate is a document that names its own weaknesses. <b>Ask in the first sentence</b>, offer a curve rather than a point, and say what happens if nothing is decided. Keep the recurring pack the <b>same shape</b> every cycle so change is visible. When something breaks, <b>stop, bound, tell, preserve, then diagnose</b> — and close it with a detection rather than a fix. Translate into the listener's own unit and state uncertainty as a <b>bounded</b> view rather than a hedge. Disagree <b>privately, on evidence, once</b>, and name the trigger that would reopen it. And write it all down as it happens, so the work <b>survives its author</b>.</p></div>
<p>Nine moves. None of them is about being right — all of them are about whether being right makes any difference.</p>` },

{label:'THE HARD QUESTION', tag:'The series', title:'What do five packs actually amount to?', stage:12, html:`
<p>Honestly: <b>fluency, not mastery.</b> The distinction is worth holding on to.</p>
<p>What five packs transfer well is vocabulary, the documented failure modes, and the reasoning patterns — the order in which a problem is diagnosed, when a rule should be refused, why something is scoped at the lowest level that works. Those genuinely shorten the distance to competence.</p>
<p>What they cannot transfer is the reps. No card conveys the feeling of a match rate quietly dropping, or a client insisting in acceptance testing that the system is wrong when it is doing exactly what was specified.</p>
<div class="note"><div class="lab">The formula that holds</div>
<p><b>Packs plus reps.</b> The packs make each rep count for more, because the thing being encountered has a name and a known shape. Revisiting them after a rep is worth several times revisiting them before one — the second reading lands on something.</p></div>
<p class="small">Five packs: the domain, the engineering, the instrument, the product, and the room. What remains is the work itself.</p>` },

{label:'CLOSE', tag:'10 / 10', title:'Pack complete', stage:12, html:`
<ul class="own">
<li>The daily, weekly, monthly and quarterly cadence — and the review that gets dropped</li>
<li>The first ninety days, anchored on reproducing a published number</li>
<li>The traps grid, the structures card, and the compression</li>
<li>Fluency from reading, mastery from reps — and why the order matters</li>
</ul>
<div class="next">

<div class="ttl">The artifacts, and the conversations</div>
<p>Ten missions from the seven documents that carry the work to the handover that outlives it. Completing the series alongside Pack 01 on retail credit risk, Pack 02 on AI engineering, Pack 03 on credit risk and Python, and Pack 04 on AI product management in lending.</p>
<p class="small" style="margin-top:14px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute)">Tharun Gajula</p>
</div>` }

]}

/* ---------- flatten ---------- */
const FLAT = [];
FLAT.push({kind:'packcover', stage:0, title:'The Room', mission:'', html:`
<div class="cover">
  <div class="mark">Field Cards · Pack 05</div>
  <h1>The<br>Room</h1>
  <div class="sub">The artifacts that carry risk and product work, and the conversations they exist for — requirements, model documents, committee notes, monitoring packs, incidents, disagreement and handover.</div>
  <div class="meta">
    <div>MISSIONS<b>10</b></div>
    <div>CARDS<b id="totalCards">—</b></div>
    <div>RAMP<b>I→B</b></div>
  </div>
  <div class="byline">Tharun Gajula</div>
  <div class="scrollhint">Swipe up ↑</div>
</div>`});

MISSIONS.forEach(m=>{
  FLAT.push({kind:'mcover', stage:m.stage, mission:m.n, title:m.title, html:`
  <div class="mcover">
    <div class="num">Mission ${m.n} of 10</div>
    <h1>${m.title}</h1>
    <div class="sub">${m.sub}</div>
    <div class="covers"><div class="lab">In this mission</div><ul>${m.covers.map(c=>`<li>${c}</li>`).join('')}</ul></div>
  </div>`});
  m.cards.forEach(c=>FLAT.push({kind:'card', mission:m.n, ...c}));
});

/* ---------- render ---------- */
const deck=document.getElementById('deck');
deck.innerHTML=FLAT.map((c,i)=>`<section class="card" data-i="${i}" data-stage="${c.stage||0}" data-m="${c.mission||''}">
  <div class="sheet">${(c.kind==='card')
    ? `<div class="eyebrow"><span class="dot"></span><span>${c.label}</span><span style="color:var(--rule)">/</span><span class="tag">${c.tag}</span></div><h2>${c.title}</h2>${c.html}`
    : c.html}</div></section>`).join('');
const tc=document.getElementById('totalCards'); if(tc) tc.textContent=FLAT.length;

/* ---------- rail: twelve stages of the lending loop ---------- */
const RAIL_N=12;
const rail=document.getElementById('rail');
rail.innerHTML=Array.from({length:RAIL_N},()=>'<span></span>').join('');
const ticks=[...rail.children];

/* ---------- index: missions only ---------- */
const idx=document.getElementById('idx'), idxList=document.getElementById('idxList');
const anchors=[];
FLAT.forEach((c,i)=>{ if(c.kind==='packcover'||c.kind==='mcover') anchors.push({i,c}); });
idxList.innerHTML=anchors.map(a=>`<li data-go="${a.i}">
  <span class="n">${a.c.kind==='packcover'?'00':a.c.mission}</span>
  <span class="t">${a.c.title}${a.c.kind==='mcover'?`<em>Mission ${a.c.mission}</em>`:'<em>Pack cover</em>'}</span>
</li>`).join('');
idxList.addEventListener('click',e=>{const li=e.target.closest('li'); if(!li)return;
  idx.classList.remove('open');
  deck.children[+li.dataset.go].scrollIntoView({behavior:'smooth'});});
document.getElementById('counter').onclick=()=>idx.classList.add('open');
document.getElementById('idxClose').onclick=()=>idx.classList.remove('open');

/* ---------- observer ---------- */
const counter=document.getElementById('counter'), bar=document.getElementById('bar');
let current=0;
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.intersectionRatio<0.55) return;
  current=+e.target.dataset.i;
  const m=e.target.dataset.m;
  counter.textContent = m ? `M${m} · ${String(current+1).padStart(3,'0')}` : String(current+1).padStart(3,'0');
  bar.style.width=((current+1)/FLAT.length*100)+'%';
  const st=+e.target.dataset.stage;
  ticks.forEach((t,k)=>{
    t.className = (st && k===st-1) ? 'on' : ((st && k<st-1) ? 'past' : '');
  });
});},{threshold:[0.55]});
[...deck.children].forEach(s=>io.observe(s));

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){
    e.preventDefault(); deck.children[Math.min(current+1,FLAT.length-1)].scrollIntoView({behavior:'smooth'});
  }
  if(e.key==='ArrowUp'||e.key==='PageUp'){
    e.preventDefault(); deck.children[Math.max(current-1,0)].scrollIntoView({behavior:'smooth'});
  }
  if(e.key==='Escape') idx.classList.remove('open');
});
</script>
</body>
