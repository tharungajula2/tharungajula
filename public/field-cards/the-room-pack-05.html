<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0F">
<title>The Room — Field Cards · Pack 05</title>
<meta name="description" content="The artifacts that carry risk and product work, and the conversations they exist for: requirements, model documents, committee notes, monitoring packs, incidents, disagreement and handover.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0B0D0F; --panel:#14171A; --panel-2:#191D21; --ink:#EDEAE4; --ink-dim:#A8AEB4; --ink-mute:#767D84;
  --rule:#242A30; --rule-soft:#1B2025;
  --s1:#6FBF9B; --s2:#E0A73E; --s3:#D9584A; --accent:#E0A73E;
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.deck{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.card{min-height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:flex-start;justify-content:center;
      padding:calc(env(safe-area-inset-top) + 54px) 20px calc(env(safe-area-inset-bottom) + 40px)}
.sheet{width:min(100%,470px);margin:auto}

/* ---------- chrome ---------- */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:var(--rule-soft)}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;padding:env(safe-area-inset-top) 0 0;
        background:linear-gradient(to bottom,var(--ground) 60%,rgba(11,13,15,0));pointer-events:none}
.topbar .row{display:flex;align-items:center;gap:12px;padding:12px 20px 16px;pointer-events:auto}
.brand{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--ink-dim);font-weight:500}
.spacer{flex:1}
.counter{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-dim);border:1px solid var(--rule);
         padding:6px 10px;border-radius:2px;cursor:pointer;white-space:nowrap}
.counter:active{border-color:var(--accent);color:var(--accent)}
.rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.rail span{width:2px;height:11px;background:var(--rule);border-radius:1px;transition:background .3s,height .3s}
.rail span.on{background:var(--accent);height:19px}
.rail span.past{background:var(--rule)}

/* ---------- covers ---------- */
.cover .mark,.mcover .num{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.cover h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,13vw,66px);line-height:.95;margin:18px 0 0;letter-spacing:-.01em}
.cover .sub{color:var(--ink-dim);font-size:14.5px;line-height:1.55;margin:18px 0 0;max-width:38ch}
.cover .meta{display:flex;gap:26px;margin:30px 0 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.cover .meta div{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-mute);text-transform:uppercase}
.cover .meta b{display:block;font-family:var(--display);font-size:25px;font-weight:400;color:var(--ink);letter-spacing:0;margin-top:5px}
.cover .byline{margin-top:26px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase}
.cover .scrollhint{margin-top:34px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent);opacity:.75}
.mcover h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9.5vw,46px);line-height:1.03;margin:14px 0 0;letter-spacing:-.01em}
.mcover .sub{color:var(--ink-dim);font-size:14px;line-height:1.55;margin:15px 0 0}
.mcover .covers{margin-top:26px;padding-top:15px;border-top:1px solid var(--rule)}
.mcover .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase}
.mcover ul{list-style:none;margin:12px 0 0;padding:0}
.mcover li{font-size:13.5px;line-height:1.45;color:var(--ink-dim);padding:6px 0 6px 17px;position:relative}
.mcover li:before{content:"—";position:absolute;left:0;color:var(--accent);opacity:.6}

/* ---------- card body ---------- */
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
         text-transform:uppercase;color:var(--ink-mute);margin-bottom:13px}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.eyebrow .tag{color:var(--ink-mute);opacity:.8}
h2{font-family:var(--display);font-weight:400;font-size:clamp(27px,7.4vw,34px);line-height:1.1;margin:0 0 15px;letter-spacing:-.005em}
p{font-size:13.5px;line-height:1.5;color:var(--ink-dim);margin:0 0 11px}
p b,li b{color:var(--ink);font-weight:600}
p.kicker{color:var(--ink);font-size:15px;line-height:1.45}
em{font-style:italic;color:var(--ink-dim)}
.small{font-size:12px;line-height:1.45;color:var(--ink-mute)}

/* ---------- components ---------- */
.note{background:var(--panel);border-left:2px solid var(--accent);padding:13px 14px;margin:15px 0;border-radius:0 2px 2px 0}
.note .lab{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.note p:last-child{margin-bottom:0}
.warn{background:var(--panel);border-left:2px solid var(--s3);padding:13px 14px;margin:15px 0;border-radius:0 2px 2px 0}
.warn .lab{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--s3);margin-bottom:7px}
.warn p:last-child{margin-bottom:0}
.good{background:var(--panel);border-left:2px solid var(--s1);padding:13px 14px;margin:15px 0;border-radius:0 2px 2px 0}
.good .lab{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--s1);margin-bottom:7px}
.good p:last-child{margin-bottom:0}

pre.code{background:var(--panel-2);border:1px solid var(--rule);border-left:2px solid var(--ink-mute);
         padding:12px 13px;margin:14px 0;border-radius:0 2px 2px 0;overflow-x:auto;
         font-family:var(--mono);font-size:11px;line-height:1.62;color:var(--ink-dim);white-space:pre}
pre.code b{color:var(--ink);font-weight:500}
pre.code i{color:var(--ink-mute);font-style:normal}
pre.code u{color:var(--accent);text-decoration:none}
.codelab{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute);margin:15px 0 -8px}

.kv{list-style:none;margin:15px 0;padding:0}
.kv li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.kv li:last-child{border-bottom:0}
.kv .k{font-family:var(--mono);font-size:10px;color:var(--accent);flex:none;width:30px;padding-top:2px}
.kv .v{font-size:13px;line-height:1.45;color:var(--ink)}
.kv .v em{font-style:normal;display:block;color:var(--ink-mute);font-size:12px;line-height:1.45;margin-top:3px}

table{width:100%;border-collapse:collapse;margin:15px 0;font-size:12px}
th{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-mute);
   text-align:left;font-weight:500;padding:0 8px 8px 0;border-bottom:1px solid var(--rule)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule-soft);color:var(--ink-dim);line-height:1.4;vertical-align:top}
td:first-child{color:var(--ink)}
td b{color:var(--ink)}
tr:last-child td{border-bottom:0}
.num-cell{font-family:var(--mono);font-size:11px;color:var(--accent);white-space:nowrap}

.own{list-style:none;margin:0;padding:0}
.own li{font-size:13.5px;line-height:1.45;color:var(--ink);padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--rule-soft)}
.own li:before{content:"✓";position:absolute;left:0;color:var(--s1);font-size:12px}
.own li:last-child{border-bottom:0}
.next{margin-top:20px;padding-top:15px;border-top:1px solid var(--rule)}
.next .lab{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute)}
.next .ttl{font-family:var(--display);font-size:23px;margin:6px 0 7px;color:var(--ink)}

.ramp{display:flex;gap:6px;margin:15px 0}
.ramp div{flex:1;padding:10px 9px;background:var(--panel);border-top:2px solid var(--rule)}
.ramp div.a{border-top-color:var(--s1)} .ramp div.b{border-top-color:var(--s2)} .ramp div.c{border-top-color:var(--s3)}
.ramp .t{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:5px}
.ramp .d{font-size:11.5px;line-height:1.35;color:var(--ink-dim)}

.flow{margin:15px 0;border-top:1px solid var(--rule)}
.flow div{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.flow .s{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--accent);flex:none;width:64px;text-transform:uppercase}
.flow .x{font-size:12.5px;line-height:1.45;color:var(--ink-dim)}
.flow .x b{color:var(--ink)}
.drop{font-family:var(--mono);font-size:10px;color:var(--s3);margin-left:auto;flex:none}

.doc{background:var(--panel-2);border:1px solid var(--rule);border-left:2px solid var(--accent);
     padding:13px 14px;margin:15px 0;border-radius:0 2px 2px 0}
.doc .h{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.doc ol{list-style:none;margin:0;padding:0;counter-reset:d}
.doc li{counter-increment:d;font-size:12.5px;line-height:1.4;color:var(--ink);padding:5px 0 5px 26px;position:relative}
.doc li:before{content:counter(d,decimal-leading-zero);position:absolute;left:0;font-family:var(--mono);font-size:9.5px;color:var(--ink-mute);top:7px}
.doc li em{font-style:normal;display:block;color:var(--ink-mute);font-size:11.5px;line-height:1.4;margin-top:2px}
.vs{display:flex;gap:8px;margin:15px 0}
.vs div{flex:1;background:var(--panel);padding:11px 11px;border-top:2px solid var(--rule)}
.vs div.no{border-top-color:var(--s3)} .vs div.yes{border-top-color:var(--s1)}
.vs .t{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:6px}
.vs .d{font-size:12px;line-height:1.4;color:var(--ink-dim)}

/* ---------- index ---------- */
.idx{position:fixed;inset:0;z-index:70;background:var(--ground);display:none;flex-direction:column;
     padding:calc(env(safe-area-inset-top) + 56px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.idx.open{display:flex}
.idx h3{font-family:var(--display);font-size:25px;font-weight:400;margin:0 0 2px}
.idx .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-mute);text-transform:uppercase}
.idx .close{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:16px;font-family:var(--mono);font-size:10px;
            letter-spacing:.12em;color:var(--ink-mute);border:1px solid var(--rule);padding:7px 11px;border-radius:2px;cursor:pointer}
.idx ol{list-style:none;margin:14px 0 0;padding:0;overflow-y:auto;flex:1}
.idx li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule-soft);cursor:pointer;align-items:baseline}
.idx li .n{font-family:var(--mono);font-size:10px;color:var(--accent);width:26px;flex:none}
.idx li .t{font-size:14.5px;line-height:1.35}
.idx li .t em{font-style:normal;display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
              text-transform:uppercase;color:var(--ink-mute);margin-top:3px}
.idx li:active .t{color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.deck{scroll-behavior:auto}}
</style>

<div class="progress"><i id="bar"></i></div>
<div class="topbar"><div class="row">
  <div class="brand">THE ROOM · ARTIFACTS · <b>FIELD CARDS</b></div>
  <div class="spacer"></div>
  <div class="counter" id="counter">01</div>
</div></div>
<div class="rail" id="rail"></div>
<div class="deck" id="deck"></div>
<div class="idx" id="idx">
  <div class="close" id="idxClose">CLOSE</div>
  <h3>Contents</h3>
  <div class="hint">Ten missions · Pack 05</div>
  <ol id="idxList"></ol>
</div>
<script>
const MISSIONS = [
{n:'01', title:'The Artifacts', stage:1,
 sub:'Analysis that stays in a notebook or a head does not exist. Work becomes real when it takes the shape of a document somebody else can act on. This mission maps the seven that carry risk and product work, and the three things a document can be for.',
 covers:['Why the artifact is the unit of work','The seven documents','Inform, persuade, bind','Reading the room before writing','The cost of the wrong shape'],
 cards:[

{label:'ORIENT', tag:'The unit', title:'The artifact is the unit of work', stage:1, html:`
<p class="kicker">In a risk or lending function, work is not measured in analysis performed. It is measured in <b>decisions made possible</b> — and decisions are made against documents.</p>
<p>A model that exists only as a notebook has not been built. A finding that exists only in conversation did not happen. A requirement that lives in one person's understanding will be implemented as something else.</p>
<p>This is not bureaucracy for its own sake. In a regulated environment the document <b>is</b> the control: it is what a validator reviews, what an auditor requests, what a committee approves, and what the next person inherits.</p>
<div class="note"><div class="lab">The shift this asks for</div>
<p>Treating the write-up as the deliverable rather than the residue. Where a document is drafted after the work as a summary of it, it reads like one. Where the shape of the document is decided <b>before</b> the analysis, the analysis is aimed at something.</p></div>` },

{label:'MECHANISM', tag:'The set', title:'Seven documents, seven jobs', stage:1, html:`
<table>
<tr><th>Artifact</th><th>Exists to</th><th>Read by</th></tr>
<tr><td><b>Requirement</b></td><td>Make a system behave a specific way</td><td>Engineering, QA, the client</td></tr>
<tr><td><b>Model document</b></td><td>Let a model be validated and used</td><td>Validation, audit, regulator</td></tr>
<tr><td><b>Committee note</b></td><td>Get a decision taken</td><td>Credit, risk, executive</td></tr>
<tr><td><b>Monitoring pack</b></td><td>Show whether the thing still works</td><td>Owners, governance</td></tr>
<tr><td><b>Incident write-up</b></td><td>Explain a failure and close it</td><td>Everyone, eventually</td></tr>
<tr><td><b>Analysis memo</b></td><td>Answer one question well</td><td>Whoever asked</td></tr>
<tr><td><b>Handover</b></td><td>Let the work survive its author</td><td>The successor</td></tr>
</table>
<p class="small">Missions 02 to 09 take these one at a time. Everything in the pack assumes the underlying work is already sound — this is about what happens to it afterwards.</p>` },

{label:'MECHANISM', tag:'The ramp', title:'Inform, persuade, bind', stage:1, html:`
<p>Every document does one of three things, and the three are written differently. Confusing them is the most common reason a good piece of work lands badly.</p>
<div class="ramp">
  <div class="a"><div class="t">Inform</div><div class="d">Tells someone what is true. Success is that they now know it. Monitoring packs, status, analysis.</div></div>
  <div class="b"><div class="t">Persuade</div><div class="d">Asks someone to change their mind or agree to something. Success is a decision. Committee notes, proposals.</div></div>
  <div class="c"><div class="t">Bind</div><div class="d">Becomes the thing itself. Success is that a system, a model or an obligation now matches it. Requirements, model documents, policy.</div></div>
</div>
<div class="warn"><div class="lab">Where they get confused</div>
<p>A proposal written as an information dump — twelve pages of findings with the ask buried on page nine. And a requirement written as persuasion — argued rather than specified, so engineering implements the argument's spirit and the result is untestable.</p></div>` },

{label:'MECHANISM', tag:'Binding', title:'What changes when a document binds', stage:2, html:`
<p>A binding document is one that something else will be built or judged against. Three properties become non-negotiable that are merely nice elsewhere.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Every statement is testable<em>"The system should handle missing bureau data gracefully" binds nothing. "Where the bureau returns no file, the application is routed to manual review with reason code B04" binds precisely.</em></span></li>
<li><span class="k">02</span><span class="v">Silence is a defect, not a default<em>An unaddressed case will be implemented by whoever notices it, according to their judgement, without a record</em></span></li>
<li><span class="k">03</span><span class="v">It is versioned and dated<em>Because the question "what did this say when the system was built" will be asked, and the answer has to be retrievable</em></span></li>
</ul>
<div class="good"><div class="lab">The test worth applying to every line</div>
<p>Could two competent people read this sentence and build different things? If yes, it is not yet a requirement — it is a description of one.</p></div>` },

{label:'MECHANISM', tag:'Audience', title:'Reading the room before writing', stage:2, html:`
<p>The same finding is written four ways depending on who reads it, and the difference is not tone. It is <b>what they are able to do about it</b>.</p>
<table>
<tr><th>Reader</th><th>Wants</th><th>Opens with</th></tr>
<tr><td>Executive</td><td>A decision or a reassurance</td><td>The conclusion and the ask</td></tr>
<tr><td>Credit or risk</td><td>The mechanism and the exposure</td><td>What changed and by how much</td></tr>
<tr><td>Engineering</td><td>Specificity and edge cases</td><td>The behaviour required</td></tr>
<tr><td>Validation or audit</td><td>Evidence and limitations</td><td>Method, then what it cannot support</td></tr>
</table>
<div class="note"><div class="lab">The question that precedes writing</div>
<p>Not "what did I find" but <b>"what do I want to be different after this is read, and who has to act for that to happen"</b>. A document written without an answer to the second half tends to be circulated widely and acted on by nobody.</p></div>` },

{label:'TRAP', tag:'Shape', title:'The right work in the wrong container', stage:1, html:`
<p>Four recurring mismatches, each of which wastes work that was itself sound.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">A decision request sent as a report<em>No explicit ask, no options, no recommendation. It is filed rather than decided.</em></span></li>
<li><span class="k">02</span><span class="v">A recurring pack rebuilt as a fresh narrative each cycle<em>Readers cannot compare against last month, which is the entire point of a recurring pack</em></span></li>
<li><span class="k">03</span><span class="v">An incident explained in a meeting and nowhere else<em>The fix happens, the cause is not recorded, and the same failure recurs under a different name</em></span></li>
<li><span class="k">04</span><span class="v">A model documented in slides<em>Slides cannot carry method, assumptions or limitations at the depth validation requires, so the whole thing is rewritten later under time pressure</em></span></li>
</ul>
<p class="small">In each case the analysis was fine. The container was wrong, and the container decided whether it mattered.</p>` },

{label:'WORKED', tag:'Evidence', title:'What made the difference on delivery', stage:1, html:`
<p>Writing requirement documents for a lending platform's decisioning layer across twelve banking clients, and portfolio quality reporting reviewed by lending and risk leadership, the pattern was consistent and slightly deflating.</p>
<p><b>The technical difficulty was rarely the constraint.</b> What determined whether something shipped on time was whether the ambiguities had been surfaced in writing, to the right owner, early enough that resolving them did not require re-work.</p>
<div class="good"><div class="lab">The habit that came out of it</div>
<p>Keeping an <b>open questions</b> section at the top of every draft — not the bottom — listing what remains unresolved and who owns each answer. It makes the document useful before it is finished, and it converts a reviewer from a critic into a contributor, because there is a visible place for them to help.</p></div>` },

{label:'THE HARD QUESTION', tag:'Value', title:'Is this just documentation overhead?', stage:1, html:`
<p>It would be, if the documents were produced after the fact to satisfy a process. Most organisations do exactly that, which is why the objection has force.</p>
<p>The distinction is <b>when</b> the artifact is designed.</p>
<div class="vs">
  <div class="no"><div class="t">Overhead</div><div class="d">Work is done, then written up to satisfy a gate. The document adds effort and no information.</div></div>
  <div class="yes"><div class="t">Instrument</div><div class="d">The shape is decided first. Writing it exposes the gaps while they are still cheap to close.</div></div>
</div>
<p>Drafting the limitations section of a model document <b>before</b> the model is finished routinely changes what gets built, because it forces a written answer to "what will this not support" while there is still time to support it.</p>
<p class="small">The overhead version is real and worth resisting. The answer is not fewer documents — it is producing them earlier, where they still function as thinking rather than as reporting.</p>` },

{label:'CLOSE', tag:'01 / 10', title:'Now owned', stage:1, html:`
<ul class="own">
<li>The artifact as the unit of work, and the document as the control</li>
<li>Seven documents, seven jobs, seven readerships</li>
<li>Inform, persuade, bind — and what changes when a document binds</li>
<li>Testable statements, silence as a defect, versioning as standard</li>
<li>The question that precedes writing: what should be different, and who acts</li>
<li>Open questions at the top, not the bottom</li>
</ul>
<div class="next">
<div class="lab">Mission 02 unlocks</div>
<div class="ttl">The Requirement</div>
<p>The most binding document in the set: specifying a decision engine so that two competent people cannot build different things from it.</p>
</div>` }

]},
{n:'02', title:'The Requirement', stage:3,
 sub:'The most binding artifact in the set. A requirement for a decision engine is not a description of desired behaviour — it is the behaviour, written down, in a form that cannot be read two ways.',
 covers:['What a decisioning requirement contains','The four ambiguity categories','Writing a rule that cannot be misread','Traceability','Acceptance criteria as the real specification'],
 cards:[

{label:'MECHANISM', tag:'Structure', title:'What the document has to contain', stage:3, html:`
<div class="doc"><div class="h">Decisioning requirement · skeleton</div><ol>
<li>Purpose and scope<em>What decision, for which product and segment, replacing what</em></li>
<li>Open questions<em>Unresolved items and their named owners — at the top</em></li>
<li>Inputs<em>Every field, its source, its type, when it is available, what happens if it is not</em></li>
<li>Rules<em>Each rule, its condition, its outcome, its reason code, its precedence</em></li>
<li>Sequence<em>Evaluation order, and where paid data is fetched</em></li>
<li>Outcomes<em>The full set: approve, decline, refer, and what each triggers</em></li>
<li>Edge cases<em>Missing, contradictory, boundary and out-of-range conditions</em></li>
<li>Non-functional<em>Latency budget, throughput, availability, fallback behaviour</em></li>
<li>Acceptance criteria<em>The cases that must pass before this is considered delivered</em></li>
<li>Traceability<em>Each rule mapped to the policy clause that authorises it</em></li>
</ol></div>
<p class="small">Sections three, four and seven are where the work is. Sections nine and ten are what make it survive.</p>` },

{label:'MECHANISM', tag:'Precision', title:'Turning a sentence into a rule', stage:3, html:`
<p>A policy line arrives as prose. A requirement has to leave no reading open.</p>
<div class="vs">
  <div class="no"><div class="t">Not a requirement</div><div class="d">Applicants with insufficient income should be declined.</div></div>
  <div class="yes"><div class="t">A requirement</div><div class="d">Where verified monthly net income is strictly below 25,000, outcome is DECLINE with reason code E02.</div></div>
</div>
<p>Five decisions were made in that conversion, and each one was a place the system could otherwise have diverged.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Which income<em>Verified, not declared — and net, not gross</em></span></li>
<li><span class="k">02</span><span class="v">Which period<em>Monthly, stated explicitly rather than inferred from the number's size</em></span></li>
<li><span class="k">03</span><span class="v">Boundary<em>Strictly below. Exactly 25,000 passes.</em></span></li>
<li><span class="k">04</span><span class="v">Outcome<em>Decline, not refer — a different operational path entirely</em></span></li>
<li><span class="k">05</span><span class="v">Reason<em>A code, so the applicant's message and the reporting both derive from one source</em></span></li>
</ul>` },

{label:'TRAP', tag:'Ambiguity', title:'The four categories that recur everywhere', stage:3, html:`
<p>Across every decisioning specification, ambiguity concentrates in four places. Walking these deliberately, with the policy owner, before writing is the highest-yield hour available.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Boundaries<em>Exactly at the cutoff, exactly at the age limit, exactly at the tenure minimum. Half of all specifications leave this open and it decides real applications.</em></span></li>
<li><span class="k">02</span><span class="v">Absence<em>Field not returned, document unreadable, bureau unavailable. Absence is not zero and it is not a pass.</em></span></li>
<li><span class="k">03</span><span class="v">Contradiction<em>Declared and verified income disagree; two sources report different obligations. Which wins, or does it refer?</em></span></li>
<li><span class="k">04</span><span class="v">Precedence<em>Several rules decline the same applicant. Which reason is reported, and why that one?</em></span></li>
</ul>
<div class="warn"><div class="lab">Why they survive review</div>
<p>Each reads as obvious to whoever wrote the source policy. The author knows what was meant; the developer implements what is written; the tester validates against the same line. Nobody disagrees at any point, and the system does something none of them intended.</p></div>` },

{label:'MECHANISM', tag:'Traceability', title:'Every rule points at its authority', stage:3, html:`
<p>A rule in a decision engine exists because something authorises it. The mapping between the two is a column in the requirement, not an act of memory.</p>
<pre class="code">RULE  R-014
COND  verified_monthly_income &lt; 25000
OUT   DECLINE
CODE  E02
AUTH  Credit Policy 2026.08.1, §4.2(a)
OWNER Head of Credit Policy
TEST  TC-041, TC-042, TC-043</pre>
<div class="good"><div class="lab">What the authority column earns</div>
<p>Three things. When policy changes, the rules affected are identifiable in seconds rather than by reading the engine. When a rule is queried in audit, its basis is on the same line. And when a rule has <b>no</b> authority, that becomes visible — which is how undocumented policy accumulated by past implementations gets found.</p></div>
<p class="small">The last of the three is the one that surprises people. Most mature decision engines contain rules nobody can source, and the traceability column is how they surface.</p>` },

{label:'MECHANISM', tag:'Acceptance', title:'The test cases are the real specification', stage:4, html:`
<p>Prose can be read two ways. A test case with an input and an expected output cannot.</p>
<pre class="code">TC-041  income 24,999  →  DECLINE / E02
TC-042  income 25,000  →  CONTINUE
TC-043  income missing →  REFER / M01
TC-044  income 25,000, declared 60,000 → REFER / C03</pre>
<p>Four lines settle the boundary, the absence case and the contradiction case permanently. They are also, not incidentally, the automated regression suite for the life of the system.</p>
<div class="good"><div class="lab">The sequencing that removes most defects</div>
<p>Write the acceptance cases <b>during</b> requirements and walk them with the policy owner. Every case they correct is a defect that never exists. This converts acceptance testing from a negotiation at the end into a confirmation — which is the single largest schedule saving available on a decisioning build.</p></div>` },

{label:'WORKED', tag:'Delivery', title:'Where ambiguity actually surfaces', stage:8, html:`
<p>Running validation and user acceptance testing through to client go-live on a lending platform, the recurring scene was this: a client tests a case, the system does exactly what the requirement said, and the client says it is wrong.</p>
<p>Nobody has erred. The requirement was read two ways, and this is the first moment the two readings collide — at the most expensive possible point, with a go-live date attached.</p>
<div class="warn"><div class="lab">What that pattern implies about drafting</div>
<p>A requirement that survives review is not the same as a requirement that survives acceptance. Review checks whether the document is coherent. Acceptance checks whether it matched what the reader had in their head — and the only way to test that early is to <b>put concrete cases in front of them before anything is built</b>.</p></div>` },

{label:'MECHANISM', tag:'Change', title:'Requirements change, and that is fine', stage:12, html:`
<p>A requirement is a live document until the system is decommissioned. What matters is that changes are visible.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Version and date every revision<em>With a change log naming what moved and who approved it</em></span></li>
<li><span class="k">02</span><span class="v">Never edit a rule in place silently<em>The previous behaviour is what live decisions were made under, and those decisions still need explaining</em></span></li>
<li><span class="k">03</span><span class="v">Separate policy changes from clarifications<em>A clarification records what was always intended. A policy change alters who gets money and needs its own approval.</em></span></li>
</ul>
<div class="warn"><div class="lab">The conflation that causes governance findings</div>
<p>A "clarification" that quietly changes a boundary from inclusive to exclusive is a policy change wearing a smaller word. It shifts real applicants across the line without the approval that a policy change would have required, and it is visible in the change log only if the log records the substance rather than the label.</p></div>` },

{label:'THE HARD QUESTION', tag:'Method', title:'Does this survive an agile team?', stage:3, html:`
<p>The objection is that heavy specification belongs to a delivery model most teams have left behind.</p>
<p>Partly fair, and the resolution is to separate two things that get bundled.</p>
<div class="vs">
  <div class="no"><div class="t">Genuinely obsolete</div><div class="d">A complete document signed before any build begins, treated as fixed.</div></div>
  <div class="yes"><div class="t">Not negotiable</div><div class="d">That every rule in a live decision engine has a written, versioned, testable statement and a traceable authority.</div></div>
</div>
<p>Those are compatible. Rules can be specified incrementally, one segment at a time, iterated on with engineering in the same week — and still end up with a document that a validator can read and a system that can be reconstructed.</p>
<div class="note"><div class="lab">The line that actually holds</div>
<p>Iterate on <b>what</b> the rules are. Do not iterate on <b>whether they are written down</b>. A decision engine whose behaviour exists only in code is unauditable regardless of how well the team ships.</p></div>` },

{label:'CLOSE', tag:'02 / 10', title:'Now owned', stage:3, html:`
<ul class="own">
<li>The ten-section skeleton, with open questions at the top</li>
<li>Five decisions hidden inside one policy sentence</li>
<li>Boundaries, absence, contradiction, precedence — walked before drafting</li>
<li>Traceability to authority, and the undocumented rules it exposes</li>
<li>Acceptance cases written during requirements, not after build</li>
<li>Versioned change, with clarifications distinguished from policy changes</li>
</ul>
<div class="next">
<div class="lab">Mission 03 unlocks</div>
<div class="ttl">The Model Document</div>
<p>The document a model cannot go live without: methodology, evidence, and the limitations section that decides how fast it gets through validation.</p>
</div>` }

]},
{n:'03', title:'The Model Document', stage:5,
 sub:'A model is not live because it is deployed. It is live when validation has what it needs, and what it needs is a document. This mission covers its structure, the evidence it carries, and why the limitations section is the fastest route through the gate.',
 covers:['What validation is actually checking','The document skeleton','Evidence that answers before it is asked','The limitations section','Writing for a reader who will attack it'],
 cards:[

{label:'ORIENT', tag:'The reader', title:'Written for someone paid to disagree', stage:5, html:`
<p class="kicker">A model document has an unusual reader: an independent function whose job is to challenge it, and whose sign-off is required.</p>
<p>That changes the register entirely. A document written to impress reads as advocacy and invites scrutiny of everything. A document written to be <b>checked</b> — method stated plainly, choices justified, weaknesses volunteered — moves faster, because the reviewer's questions have already been answered on the page.</p>
<div class="note"><div class="lab">What validation is actually testing</div>
<p>Not whether the model is good. Whether it is <b>fit for the use it is proposed for</b>, whether its weaknesses are known and bounded, and whether it can be reproduced and monitored. A strong model with unstated assumptions fails. A modest model with well-understood limits passes.</p></div>` },

{label:'MECHANISM', tag:'Structure', title:'The skeleton', stage:5, html:`
<div class="doc"><div class="h">Model development document · skeleton</div><ol>
<li>Purpose and intended use<em>What decision it supports, for which population, and explicitly what it is not for</em></li>
<li>Data<em>Source, period, exclusions with counts at every step, target definition</em></li>
<li>Sampling and splitting<em>Development and out-of-time windows, maturity treatment</em></li>
<li>Characteristic selection<em>Candidates considered, criteria applied, what was rejected and why</em></li>
<li>Methodology<em>Transformation, estimator, calibration, with the reasoning for each choice</em></li>
<li>Performance<em>Discrimination, calibration, stability — development and out-of-time</em></li>
<li>Implementation<em>How it is scored in production, and the reconciliation proving it matches</em></li>
<li>Monitoring plan<em>Metrics, thresholds, frequency, named owner, escalation</em></li>
<li><b>Limitations</b><em>Where it is weak, what it assumes, when it stops being valid</em></li>
<li>Governance<em>Versions, approvals, change control, review date</em></li>
</ol></div>
<p class="small">Sections two and nine are read most carefully. Section six is read first and quoted most often.</p>` },

{label:'MECHANISM', tag:'Exclusions', title:'The waterfall nobody wants to write', stage:4, html:`
<p>The path from raw population to development sample is where most validation questions land, because every exclusion is a judgement that shaped the result.</p>
<pre class="code">Originations in window            466,285
  less: not matured (window open)  −112,410
  less: no bureau at application    −18,220
  less: staff and related party        −890
  less: duplicate identity           −1,455
  less: indeterminate outcome       −24,660
Development population             308,650
  of which bad                       16,018   (5.19%)</pre>
<div class="warn"><div class="lab">Why every line needs a stated reason</div>
<p>An exclusion without a rationale reads as a result being shaped. The maturity exclusion is defensible and expected. The indeterminate exclusion needs its definition stated, because moving that boundary moves the bad rate — and a reviewer who has to ask about it will ask about everything else too.</p></div>` },

{label:'MECHANISM', tag:'Evidence', title:'Answer the question before it is asked', stage:6, html:`
<p>Certain challenges arrive in every validation. Pre-empting them in the document converts a two-round review into one.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Is there leakage?<em>State that every characteristic was checked for availability at decision time, and name the ones excluded on that basis</em></span></li>
<li><span class="k">02</span><span class="v">Is the split temporal?<em>Give the windows explicitly, with the maturity treatment</em></span></li>
<li><span class="k">03</span><span class="v">Why these characteristics?<em>Show the rejected candidates and the criterion each failed — including anything dropped for an implausible information value</em></span></li>
<li><span class="k">04</span><span class="v">Are the signs sensible?<em>The coefficient table with a business reading of each direction</em></span></li>
<li><span class="k">05</span><span class="v">Does the implementation match?<em>The reconciliation between the fitted model and the production scoring path, at the point</em></span></li>
<li><span class="k">06</span><span class="v">What about the censored sample?<em>How applicants who were never approved were treated, or why they were not</em></span></li>
</ul>
<p class="small">Six paragraphs. Each removes a round trip that would otherwise cost a fortnight of calendar time.</p>` },

{label:'MECHANISM', tag:'Limitations', title:'The section that speeds everything up', stage:9, html:`
<p class="kicker">Counter-intuitively, the section admitting what the model cannot do is what gets it approved fastest.</p>
<p>A document presenting a model as unqualified forces the reviewer to find the weaknesses themselves — and a reviewer who finds one unstated weakness will assume there are others and go looking.</p>
<div class="doc"><div class="h">Limitations · what belongs</div><ol>
<li>Period<em>The development window covered benign conditions; performance under stress is untested</em></li>
<li>Population<em>Weaker on thin-file applicants; a named segment is under-represented</em></li>
<li>Assumptions<em>What the inference or extrapolation rests on, stated as an assumption rather than a fact</em></li>
<li>Proxy<em>Where the target approximates the thing actually of interest</em></li>
<li>Validity horizon<em>What would have to change for this model to stop being appropriate</em></li>
</ol></div>
<div class="good"><div class="lab">The effect on the room</div>
<p>Volunteering the weakness moves the author from defending a claim to jointly assessing a tool. That is a different and much shorter conversation, and it holds regardless of the model's quality.</p></div>` },

{label:'TRAP', tag:'Register', title:'Four ways the document loses the reader', stage:5, html:`
<ul class="kv">
<li><span class="k">01</span><span class="v">Selling<em>Adjectives around the performance figures. A strong result needs none, and adding them signals the author thinks it needs help.</em></span></li>
<li><span class="k">02</span><span class="v">Method without motive<em>Stating what was done and not why that choice over the alternative. Validation's core question is always "why this".</em></span></li>
<li><span class="k">03</span><span class="v">Unreconciled numbers<em>A figure in the summary that does not match the same figure in an appendix. One instance destroys confidence in every other number.</em></span></li>
<li><span class="k">04</span><span class="v">Missing the intended use<em>A document that never states plainly what decision the model supports and for whom, leaving the reviewer to infer the scope they are approving</em></span></li>
</ul>
<div class="warn"><div class="lab">The third is worth guarding hardest</div>
<p>It is usually innocent — a figure updated in one place after a rerun. It reads as carelessness, and in a document whose entire purpose is to establish that a process was careful, that inference is expensive and difficult to recover from.</p></div>` },

{label:'WORKED', tag:'Scope', title:'Stating what a model is not for', stage:5, html:`
<p>Building a retail credit risk system end to end — a probability-of-default scorecard through loss and exposure models to provisioning — the section that took longest to write correctly was the shortest one: intended use.</p>
<p>A scorecard developed on one product, one channel and one period is frequently proposed for a second product within months, because it exists and it works. The document is the only thing standing between that and a model used outside its validated population.</p>
<div class="good"><div class="lab">The sentence worth writing carefully</div>
<p>An explicit statement of the population, product, channel and decision the model is approved for — and a line stating that use outside it requires revalidation. It takes two minutes and it is the sentence that gets quoted back, sometimes years later, by whoever inherits the model.</p></div>` },

{label:'THE HARD QUESTION', tag:'Length', title:'Does anyone read forty pages?', stage:5, html:`
<p>Mostly not, and pretending otherwise produces documents optimised for a reader who does not exist.</p>
<p>The realistic readership splits three ways, and the document should be built for all three simultaneously.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Reads two pages<em>Executives and approvers. They read the summary: intended use, headline performance, limitations, recommendation.</em></span></li>
<li><span class="k">02</span><span class="v">Reads ten<em>Risk peers and the model's future owner. Method, characteristics, performance, monitoring.</em></span></li>
<li><span class="k">03</span><span class="v">Reads all of it, twice<em>Validation and, eventually, audit. Every exclusion, every assumption, every reconciliation.</em></span></li>
</ul>
<div class="note"><div class="lab">The structural answer</div>
<p>A summary that is genuinely complete on its own, a body that is navigable rather than narrative, and appendices carrying the detail. Not a shorter document — a <b>layered</b> one. Compressing to satisfy the first reader deletes exactly what the third reader is required to check.</p></div>` },

{label:'CLOSE', tag:'03 / 10', title:'Now owned', stage:5, html:`
<ul class="own">
<li>Writing for a reader paid to disagree, and what validation is actually testing</li>
<li>The ten-section skeleton, and the exclusion waterfall with reasons per line</li>
<li>Six pre-empted challenges that remove a review round trip</li>
<li>The limitations section as the fastest route through the gate</li>
<li>Selling, unmotivated method, unreconciled figures, undeclared scope</li>
<li>The intended-use sentence, and the layered document for three readerships</li>
</ul>
<div class="next">
<div class="lab">Mission 04 unlocks</div>
<div class="ttl">The Committee Note</div>
<p>Writing to get a decision taken: the one-page discipline, options rather than a single answer, and how a recommendation is structured so that a room can act on it.</p>
</div>` }

]},
{n:'04', title:'The Committee Note', stage:7,
 sub:'A document written to change something. It has one page, a room that has not read the appendix, and a specific decision it is asking for. This mission covers the structure that gets decisions taken rather than deferred.',
 covers:['The one-page discipline','Ask first, evidence after','Three options, never one','What a deferral actually means','Pre-wiring the room'],
 cards:[

{label:'ORIENT', tag:'The room', title:'What is actually happening in the meeting', stage:7, html:`
<p>A credit or risk committee has a packed agenda, members who skimmed the pack that morning, and a chair managing time. An item gets somewhere between five and fifteen minutes.</p>
<p>Within that, three outcomes are possible and only one is useful.</p>
<div class="flow">
<div><span class="s">Approved</span><span class="x">The decision is taken and recorded</span></div>
<div><span class="s">Deferred</span><span class="x">More information requested — a month lost, minimum</span></div>
<div><span class="s">Noted</span><span class="x">Acknowledged, nothing changes, quietly dead</span></div>
</div>
<div class="warn"><div class="lab">The failure mode that produces the middle row</div>
<p>Deferral is rarely caused by disagreement. It is caused by a question the note did not answer — the exposure if it goes wrong, who else has reviewed it, what happens if nothing is done. The note that anticipates those three converts most deferrals into decisions.</p></div>` },

{label:'MECHANISM', tag:'Structure', title:'The one page', stage:7, html:`
<div class="doc"><div class="h">Committee note · one page</div><ol>
<li>The ask<em>The specific decision requested, in one sentence, at the top</em></li>
<li>Context<em>Two or three sentences. Why this is on the agenda now.</em></li>
<li>Options<em>Usually three, with the trade-off of each stated in the same terms</em></li>
<li>Recommendation<em>Which option, and the reasoning in two or three lines</em></li>
<li>Impact<em>Volume, credit cost, contribution, operational load — quantified</em></li>
<li>Risks and mitigants<em>What could go wrong and what would catch it</em></li>
<li>Reviewed by<em>Which functions have already seen this and what they said</em></li>
<li>If not approved<em>What happens if the answer is no or nothing</em></li>
</ol></div>
<p class="small">Everything else goes in an appendix that most members will not open, and that the one who does will be glad exists.</p>` },

{label:'TRAP', tag:'Order', title:'The ask does not go at the end', stage:7, html:`
<p>Analytical writing builds to a conclusion. Decision writing states the conclusion and then supports it. Using the first shape in the second context is the commonest reason a well-researched note fails.</p>
<div class="vs">
  <div class="no"><div class="t">Builds to it</div><div class="d">Six paragraphs of analysis, then the request on the last line. The room reaches the ask with no time and no context for it.</div></div>
  <div class="yes"><div class="t">Leads with it</div><div class="d">The request in sentence one. Everything after it is the room checking whether to agree.</div></div>
</div>
<div class="note"><div class="lab">Why the reversal matters more here than elsewhere</div>
<p>A reader who knows what is being asked reads the evidence <b>as evidence for that thing</b>. A reader who does not is assembling their own interpretation, and by the time the ask arrives they have already formed a different one — which now has to be dislodged rather than informed.</p></div>` },

{label:'MECHANISM', tag:'Options', title:'Three, with the trade-off in common terms', stage:7, html:`
<p>A note presenting one course of action invites the room to accept or reject it. A note presenting three invites the room to <b>choose</b> — and a room that chooses owns the outcome.</p>
<table>
<tr><th>Option</th><th>Approval</th><th>Credit cost</th><th>Contribution</th></tr>
<tr><td>A — hold current</td><td class="num-cell">62%</td><td class="num-cell">2.1%</td><td class="num-cell">base</td></tr>
<tr><td><b>B — recommended</b></td><td class="num-cell">68%</td><td class="num-cell">2.4%</td><td class="num-cell">+9%</td></tr>
<tr><td>C — aggressive</td><td class="num-cell">76%</td><td class="num-cell">3.6%</td><td class="num-cell">−4%</td></tr>
</table>
<div class="good"><div class="lab">What the third option is for</div>
<p>Option C is frequently not intended to be chosen. It exists to show where the curve turns, which is what makes B look considered rather than arbitrary. A recommendation with no visible boundary on either side reads as a preference; one bracketed by a too-cautious and a too-aggressive option reads as an optimum.</p></div>
<p class="small">The options must be stated in the <b>same</b> measures. Comparing one on conversion and another on loss rate makes them incomparable and pushes the room toward deferral.</p>` },

{label:'MECHANISM', tag:'Consequence', title:'The section that gets the decision taken', stage:7, html:`
<p>Committees default to inaction, because inaction is rarely blamed. The counterweight is a section stating plainly what happens if nothing is approved.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">The cost of the status quo<em>The volume, margin or competitive position being lost per month at the current setting</em></span></li>
<li><span class="k">02</span><span class="v">What deteriorates<em>Whether the situation is stable or worsening while undecided</em></span></li>
<li><span class="k">03</span><span class="v">The next opportunity<em>If deferred, when this can realistically return — usually the next monthly cycle plus preparation</em></span></li>
</ul>
<div class="warn"><div class="lab">Stated as fact, never as pressure</div>
<p>"Approximately eleven hundred applications per month are declined at the current cutoff whose observed performance is comparable to the approved population" is a fact the room can weigh. "We are losing customers every day we wait" is advocacy, and a committee that senses advocacy discounts the entire note.</p></div>` },

{label:'MECHANISM', tag:'Pre-wiring', title:'The note is not where the argument happens', stage:7, html:`
<p>A note arriving cold at a committee is being tested for the first time in the least forgiving venue available.</p>
<div class="flow">
<div><span class="s">Two weeks</span><span class="x">Walk the draft with the functions who would object — credit, compliance, operations</span></div>
<div><span class="s">One week</span><span class="x">Incorporate their positions; where unresolved, record the disagreement in the note</span></div>
<div><span class="s">Pack date</span><span class="x">Circulate the final with the "reviewed by" section populated</span></div>
<div><span class="s">Meeting</span><span class="x">The room is confirming a position that has already been tested</span></div>
</div>
<div class="good"><div class="lab">Recording disagreement rather than hiding it</div>
<p>Where a function still objects, that belongs in the note with their reasoning. It looks like weakness and it is the opposite — it tells the committee the proposal has been genuinely contested, and it prevents the objection surfacing in the room as a surprise, which is the fastest route to deferral.</p></div>` },

{label:'WORKED', tag:'Framing', title:'Three cutoffs, not one', stage:7, html:`
<p>Working across risk and technology on portfolio quality reporting, the pattern that separated proposals that moved from proposals that did not was consistent: <b>arriving with a curve rather than a point</b>.</p>
<p>A single proposed number invites the room to negotiate it, and the negotiation is unanchored — somebody senior suggests a different figure and there is no basis for preferring either.</p>
<div class="good"><div class="lab">What the curve does</div>
<p>Showing approval, loss and contribution across a range converts the conversation from "is this number right" to "where on this curve does the appetite sit". The second question is one the committee is actually equipped to answer, and it is their job rather than the author's.</p></div>` },

{label:'THE HARD QUESTION', tag:'Ownership', title:'Is recommending a course of action overstepping?', stage:7, html:`
<p>The concern is real in risk functions: an analyst recommending where the cutoff should sit is proposing a change to board-delegated appetite.</p>
<p>The distinction that resolves it is between <b>recommending a decision</b> and <b>recommending on the evidence</b>.</p>
<div class="vs">
  <div class="no"><div class="t">Overstepping</div><div class="d">"We should lend to this segment." An appetite statement, and not the author's to make.</div></div>
  <div class="yes"><div class="t">The job</div><div class="d">"On the evidence, option B is where contribution peaks within the stated appetite. Beyond it, loss grows faster than margin."</div></div>
</div>
<p>The second is a recommendation the room can accept, reject or modify, and it leaves the appetite decision exactly where it belongs.</p>
<div class="note"><div class="lab">The failure of declining to recommend at all</div>
<p>Presenting three options with no view is not neutrality — it transfers analytical work to people with less context and less time. Committees consistently find that unhelpful, and the author who does it repeatedly stops being asked.</p></div>` },

{label:'CLOSE', tag:'04 / 10', title:'Now owned', stage:7, html:`
<ul class="own">
<li>Approved, deferred, noted — and what actually causes the middle one</li>
<li>The eight-section one-pager, with the ask in sentence one</li>
<li>Three options in common measures, with the boundary option that frames the recommendation</li>
<li>The consequence-of-inaction section, stated as fact rather than pressure</li>
<li>Pre-wiring, and recording unresolved disagreement inside the note</li>
<li>Arriving with a curve rather than a point</li>
<li>Recommending on the evidence without making the appetite decision</li>
</ul>
<div class="next">
<div class="lab">Mission 05 unlocks</div>
<div class="ttl">The Monitoring Pack</div>
<p>The recurring document — the hardest to keep alive, the easiest to let rot, and the one that determines whether a problem is found in week three or quarter three.</p>
</div>` }

]},
{n:'05', title:'The Monitoring Pack', stage:11,
 sub:'The recurring artifact. It is produced every cycle whether or not anything happened, which makes it uniquely prone to rot — and uniquely valuable when it is built to make change visible rather than to fill pages.',
 covers:['Why recurring documents decay','Same shape, every cycle','Thresholds decided in advance','Writing the commentary','The pack nobody reads'],
 cards:[

{label:'ORIENT', tag:'Decay', title:'How a monitoring pack dies', stage:11, html:`
<p>Almost every recurring pack follows the same trajectory, and recognising it early is most of the defence.</p>
<div class="flow">
<div><span class="s">Month 1</span><span class="x">Purposeful. Built to answer specific questions.</span></div>
<div><span class="s">Month 6</span><span class="x">Charts added on request. Nothing removed.</span></div>
<div><span class="s">Month 12</span><span class="x">Forty pages. Commentary is a description of the charts.</span></div>
<div><span class="s">Month 18</span><span class="x">Produced by one person, read by nobody, defended by inertia</span></div>
<div><span class="s">Month 24</span><span class="x">A problem is missed, and the pack contained it on page 31</span></div>
</div>
<div class="warn"><div class="lab">The mechanism of decay</div>
<p>Additions are easy and removals require someone to argue that a stakeholder's chart is not worth its space. The asymmetry is structural, so packs grow monotonically unless something deliberately prunes them.</p></div>` },

{label:'MECHANISM', tag:'Constancy', title:'The same shape, every cycle', stage:11, html:`
<p>The entire value of a recurring document is <b>comparability</b>. A reader should be able to hold last month's beside this month's and see what moved.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Fixed structure<em>Same sections, same order, same charts in the same positions, every cycle without exception</em></span></li>
<li><span class="k">02</span><span class="v">Fixed definitions<em>A metric whose definition changes silently breaks every comparison behind it. Definition changes are announced and dated.</em></span></li>
<li><span class="k">03</span><span class="v">Fixed scales<em>Axes that rescale each cycle make a stable series look volatile and a deteriorating one look flat</em></span></li>
<li><span class="k">04</span><span class="v">Prior period always visible<em>Every number appears beside its previous value and its threshold</em></span></li>
</ul>
<div class="good"><div class="lab">The consequence of getting this right</div>
<p>A reader familiar with the pack can scan it in two minutes and find what changed, because everything that has not changed is exactly where it was. That is the whole design goal, and it is incompatible with rebuilding the narrative each cycle.</p></div>` },

{label:'MECHANISM', tag:'Thresholds', title:'Decided before the number is seen', stage:11, html:`
<p>A metric with no threshold produces a debate every cycle about whether the movement matters. A metric with a threshold produces an action or a note.</p>
<pre class="code">METRIC     population stability index
GREEN      &lt; 0.10        no action
AMBER      0.10 – 0.25   investigate, comment required
RED        &gt; 0.25        escalate to owner within 5 working days
OWNER      Head of Credit Risk Analytics
SET        2026-03, reviewed annually</pre>
<div class="warn"><div class="lab">Why the setting date matters</div>
<p>Thresholds decided <b>after</b> a bad number arrives are not thresholds. There is always a reason this particular breach is unusual, and a threshold that moves to accommodate each breach is a decoration. Recording when it was set, and requiring a documented decision to change it, is what makes it a control.</p></div>` },

{label:'MECHANISM', tag:'Commentary', title:'Writing the words next to the chart', stage:11, html:`
<p>The commentary is the pack. The charts are evidence for it. Most packs invert this and produce narration.</p>
<div class="vs">
  <div class="no"><div class="t">Narration</div><div class="d">"Approval rate decreased from 64% to 61% in the period."</div></div>
  <div class="yes"><div class="t">Commentary</div><div class="d">"Approval fell three points, concentrated in the partner channel. Bureau match rate there dropped after a vendor change on the 8th. Under investigation with the vendor; no policy change required."</div></div>
</div>
<p>Four elements distinguish the second: <b>what moved</b>, <b>where it concentrated</b>, <b>the suspected cause</b>, and <b>what is being done</b>. A reader can act on that. The first version tells them something they could read off the axis.</p>
<p class="small">Where the cause is unknown, saying so explicitly is stronger than a plausible guess. "Cause not yet identified; three hypotheses being tested, update by the 20th" is a legitimate and complete entry.</p>` },

{label:'MECHANISM', tag:'Structure', title:'The pack skeleton', stage:11, html:`
<div class="doc"><div class="h">Monitoring pack · skeleton</div><ol>
<li>Status summary<em>One page. Every metric, its value, prior, threshold, and a status flag.</em></li>
<li>Exceptions<em>Only the amber and red items, each with commentary and an owner</em></li>
<li>Population<em>Volume, mix, stability of the score and of each characteristic</em></li>
<li>Decisions<em>Approval rate, override rate and reasons, straight-through rate</em></li>
<li>Performance<em>Early delinquency, cohort curves at equal age, backtest where due</em></li>
<li>Actions<em>Open items from prior cycles with status — the accountability spine</em></li>
<li>Appendix<em>Everything anyone has ever asked for, and no more of the main body</em></li>
</ol></div>
<div class="good"><div class="lab">Section six is the one that changes behaviour</div>
<p>Carrying open actions forward with their age visible converts a pack from a report into a mechanism. An action opened four cycles ago and still open is a fact on the page that somebody has to address.</p></div>` },

{label:'TRAP', tag:'Reading', title:'The pack that is produced and not read', stage:11, html:`
<p>A pack nobody reads still consumes days of production every cycle. Three diagnostics, and the response is not to produce more.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Nobody asks about it between cycles<em>If it never generates a question, it is not informing a decision</em></span></li>
<li><span class="k">02</span><span class="v">The same items sit in exceptions unresolved<em>The pack is reporting into a vacuum</em></span></li>
<li><span class="k">03</span><span class="v">It cannot be scanned in five minutes<em>Then it will not be, by anyone senior enough to act</em></span></li>
</ul>
<div class="note"><div class="lab">The intervention</div>
<p>Cut it to the summary and the exceptions, move everything else to an appendix that is available but not sent, and attach a named owner to each metric. A pack that shrinks tends to get read; one that grows to prove its thoroughness does the opposite.</p></div>` },

{label:'WORKED', tag:'Definitions', title:'Where the pack and the source disagree', stage:11, html:`
<p>Owning portfolio quality reporting reviewed by lending and risk leadership meant working across risk and technology to turn credit policy into reporting definitions — and the recurring work was resolving where the policy language and the source data did not agree.</p>
<p>That disagreement has a predictable shape: policy names a concept the system does not hold; the system holds a field with the right name and a different meaning; or two systems hold the same concept and disagree with each other.</p>
<div class="good"><div class="lab">What has to be produced alongside the pack</div>
<p>A <b>definitions annexe</b> — each metric, its exact computation, its source, and the decision taken where sources conflicted, with who took it. Without it, the same question is re-litigated every few months and the answer drifts. With it, the pack has a foundation somebody else can stand on.</p></div>` },

{label:'THE HARD QUESTION', tag:'Automation', title:'Should the commentary be generated?', stage:11, html:`
<p>The numbers are automated already. Generating the words is the obvious next step and it is half right.</p>
<div class="vs">
  <div class="no"><div class="t">Should not be generated</div><div class="d">The cause, the judgement, and what is being done. These are the pack.</div></div>
  <div class="yes"><div class="t">Should be</div><div class="d">The description — what moved, by how much, where it concentrated. Mechanical, and it consumes most of the production time.</div></div>
</div>
<p>The productive split has a model produce the <b>description and the candidate hypotheses</b>, and a human supply the <b>cause and the action</b>. That removes the tedious half without removing the half that carries accountability.</p>
<div class="warn"><div class="lab">The line that cannot move</div>
<p>A generated cause is a plausible sentence, not a finding. Published in a governance document it becomes the organisation's stated explanation for a movement it has not actually diagnosed — and the first time that is discovered, the credibility of every other line goes with it.</p></div>` },

{label:'CLOSE', tag:'05 / 10', title:'Now owned', stage:11, html:`
<ul class="own">
<li>The decay trajectory, and the structural asymmetry that drives it</li>
<li>Fixed structure, definitions, scales and prior-period comparison</li>
<li>Thresholds set in advance, with the setting date recorded</li>
<li>Commentary as what moved, where, why, and what is being done</li>
<li>The seven-section skeleton, with carried-forward actions as the spine</li>
<li>A definitions annexe as the pack's foundation</li>
<li>Generate the description; never generate the cause</li>
</ul>
<div class="next">
<div class="lab">Mission 06 unlocks</div>
<div class="ttl">The Incident</div>
<p>When a number is wrong and it has already been used. Sequence, containment, the write-up, and the difference between a cause and a culprit.</p>
</div>` }

]},
{n:'06', title:'The Incident', stage:9,
 sub:'A number was wrong and it has already been used. This mission covers the sequence in the first hours, what has to be said before the cause is known, the write-up, and the difference between finding a cause and finding a culprit.',
 covers:['The first hour','Containment before diagnosis','Telling people early','The write-up structure','Cause, not culprit','What actually closes an incident'],
 cards:[

{label:'ORIENT', tag:'Shape', title:'What an incident is in this domain', stage:9, html:`
<p>It is rarely an outage. Systems being down is visible, understood and handled by others. The incidents that fall to a risk or product owner have a different signature.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">A published number was wrong<em>A provision, a portfolio figure, a regulatory return. It has been read and acted on.</em></span></li>
<li><span class="k">02</span><span class="v">Decisions were made on faulty inputs<em>A vendor field changed meaning; a join silently dropped rows; a model scored a slice with defaults</em></span></li>
<li><span class="k">03</span><span class="v">A control did not operate<em>Monitoring was not run, a threshold breach was not escalated, a version went live unapproved</em></span></li>
</ul>
<div class="warn"><div class="lab">The property that makes these hard</div>
<p>They are usually discovered <b>long after they began</b>. The question is never only "what is broken" but "how far back does this go, and what has been decided on it since" — and that second question determines the scale of everything that follows.</p></div>` },

{label:'MECHANISM', tag:'Sequence', title:'The first hour', stage:9, html:`
<div class="flow">
<div><span class="s">1</span><span class="x"><b>Stop the spread.</b> Halt the process, hold the publication, freeze the affected path.</span></div>
<div><span class="s">2</span><span class="x"><b>Bound it.</b> When did it start, what is affected, how many records, which decisions.</span></div>
<div><span class="s">3</span><span class="x"><b>Tell people.</b> Before the cause is known. Facts only.</span></div>
<div><span class="s">4</span><span class="x"><b>Preserve evidence.</b> Snapshot inputs, outputs, logs and configuration before anything is fixed.</span></div>
<div><span class="s">5</span><span class="x"><b>Then diagnose.</b> With the bleeding stopped and the evidence held.</span></div>
</div>
<div class="warn"><div class="lab">The step most often skipped</div>
<p>The fourth. The instinct under pressure is to fix immediately, and a fix frequently destroys the evidence of what happened — a rerun overwrites the bad output, a configuration correction removes the record of what was live. Snapshotting costs minutes and is the difference between a write-up that explains and one that speculates.</p></div>` },

{label:'MECHANISM', tag:'Bounding', title:'Blast radius before cause', stage:9, html:`
<p>Leadership's first question is never what caused it. It is <b>how bad is it</b>, and that is answerable long before the cause is.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Time window<em>First affected record, and whether it is still occurring</em></span></li>
<li><span class="k">02</span><span class="v">Volume<em>Records, applications or accounts touched, as a count and a share</em></span></li>
<li><span class="k">03</span><span class="v">Direction<em>Whether the error was conservative or permissive. A wrongly declined applicant and a wrongly approved one are different orders of problem.</em></span></li>
<li><span class="k">04</span><span class="v">Downstream use<em>What was published, disclosed, disbursed or reported on the faulty basis</em></span></li>
<li><span class="k">05</span><span class="v">Reversibility<em>What can be corrected, and what has already left the building</em></span></li>
</ul>
<div class="good"><div class="lab">Why direction is the pivotal one</div>
<p>An error that wrongly declined applicants is recoverable — they can be re-decisioned and contacted. An error that wrongly approved them has already disbursed money against decisions that would not have been made. The remediation, the disclosure obligation and the loss are entirely different, and knowing which within the first hour shapes every subsequent call.</p></div>` },

{label:'MECHANISM', tag:'Communication', title:'Saying something before knowing everything', stage:9, html:`
<p>The instinct is to wait until the cause is understood so that the update is complete. That instinct reliably makes things worse, because in the interval somebody else notices and the first version of events comes from elsewhere.</p>
<pre class="code">WHAT     Provision figures published on the 3rd overstate
         portfolio ECL for the SME book.
SCOPE    ~18,400 accounts. Aug and Sep cycles. Overstated,
         not understated. No customer impact.
STATUS   Publication held. Cause under investigation.
NEXT     Update by 16:00 today with cause and corrected
         figures, or a revised timeline.
OWNER    [name]</pre>
<div class="good"><div class="lab">What the format achieves</div>
<p>It is honest about what is unknown, it bounds the concern, and it commits to a next update at a stated time. Committing to the <b>time</b> of the next update rather than to the answer is what makes it possible to send within the first hour.</p></div>` },

{label:'MECHANISM', tag:'Write-up', title:'The document afterwards', stage:9, html:`
<div class="doc"><div class="h">Incident write-up · skeleton</div><ol>
<li>Summary<em>What happened, scope, impact, current status. Four sentences.</em></li>
<li>Timeline<em>When it began, when it was detected, what happened at each point, with times</em></li>
<li>Impact<em>Quantified. Records, decisions, figures, and whether anything left the organisation.</em></li>
<li>Cause<em>The mechanism, traced to the change or condition that permitted it</em></li>
<li>Detection<em>How it was found — and how it should have been found</em></li>
<li>Remediation<em>What was corrected, how, and how the correction was verified</em></li>
<li>Prevention<em>Specific, owned, dated actions. Not intentions.</em></li>
</ol></div>
<div class="warn"><div class="lab">Section five carries the most information</div>
<p>The gap between how an incident was detected and how it should have been detected is the real finding. Discovery by a client, a regulator or an auditor is a control failure independent of the original defect — and it is usually the more serious of the two.</p></div>` },

{label:'TRAP', tag:'Attribution', title:'Cause is a mechanism, not a person', stage:9, html:`
<p>Every incident has a human action somewhere in its history. Stopping the analysis there is the most common failure of an incident review and the most damaging.</p>
<div class="vs">
  <div class="no"><div class="t">A culprit</div><div class="d">An analyst deployed a configuration change without approval.</div></div>
  <div class="yes"><div class="t">A cause</div><div class="d">Configuration changes could be deployed without approval, because the path had no gate and the monitoring that would have caught the effect ran weekly.</div></div>
</div>
<p>The second version generates three preventions. The first generates a conversation and no change, and the same incident recurs under a different name with a different person attached.</p>
<div class="note"><div class="lab">The organisational stake</div>
<p>Where incidents produce blame, they stop being reported. Problems get quietly fixed and never recorded, the pattern behind them is never visible, and the organisation loses the only mechanism it has for finding systemic weakness. That cost dwarfs any individual incident.</p></div>` },

{label:'MECHANISM', tag:'Closure', title:'What actually closes it', stage:12, html:`
<p>An incident is not closed when the number is corrected. It is closed when it cannot happen again unnoticed.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">The defect is fixed and the fix is verified<em>With evidence, not assertion</em></span></li>
<li><span class="k">02</span><span class="v">A detection exists<em>A test, a threshold, a reconciliation that would have caught this. This is the item that actually matters.</em></span></li>
<li><span class="k">03</span><span class="v">Prevention actions are owned and dated<em>With a named person and a date, tracked in the monitoring pack until closed</em></span></li>
<li><span class="k">04</span><span class="v">The class is considered, not just the instance<em>If a vendor field changed meaning here, which other vendor fields are equally unguarded</em></span></li>
</ul>
<div class="good"><div class="lab">The second item is the deliverable</div>
<p>A fix without a detection means the same failure will recur silently. Every incident should leave behind at least one new automated check — and over time that accumulated set of checks is the most valuable artifact the whole process produces.</p></div>` },

{label:'THE HARD QUESTION', tag:'Disclosure', title:'How much is said outside the team?', stage:9, html:`
<p>There is a real tension. Over-disclosing a minor internal error consumes attention and creates alarm. Under-disclosing a material one is a governance failure and, in some cases, a regulatory one.</p>
<p>Three tests, and any one of them being true settles it.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Did anything leave the organisation?<em>A published figure, a customer decision, a regulatory submission. If yes, it is disclosed.</em></span></li>
<li><span class="k">02</span><span class="v">Would another function's decisions have differed?<em>If finance, credit or compliance acted on the faulty output, they are told regardless of size</em></span></li>
<li><span class="k">03</span><span class="v">Would discovery elsewhere be worse than disclosure now?<em>It almost always is, and the interval between the two is what turns an error into a credibility problem</em></span></li>
</ul>
<div class="note"><div class="lab">The asymmetry worth internalising</div>
<p>The cost of disclosing something that turns out to be minor is an hour of attention. The cost of an unreported error surfacing later through an audit is the assumption that other things are also unreported. The two are not comparable, and the default should follow the larger one.</p></div>` },

{label:'CLOSE', tag:'06 / 10', title:'Now owned', stage:9, html:`
<ul class="own">
<li>The three incident signatures in a risk function, and the how-far-back question</li>
<li>Stop, bound, tell, preserve, then diagnose — with evidence snapshotted before fixing</li>
<li>Blast radius before cause, and direction as the pivotal dimension</li>
<li>Committing to the time of the next update rather than to the answer</li>
<li>The seven-section write-up, with detection as the real finding</li>
<li>Cause as mechanism, and what blame does to reporting</li>
<li>Closure as a new detection, and the three disclosure tests</li>
</ul>
<div class="next">
<div class="lab">Mission 07 unlocks</div>
<div class="ttl">The Numbers Conversation</div>
<p>Presenting risk to people who do not do risk: what survives translation, what a probability means to a non-specialist, and how uncertainty is stated without forfeiting authority.</p>
</div>` }

]},
{n:'07', title:'The Numbers Conversation', stage:8,
 sub:'Risk work is judged by people who do not do risk work. This mission covers what survives translation, how a probability lands with a non-specialist, and how uncertainty is stated in a way that builds authority rather than spending it.',
 covers:['What the listener is actually solving for','Translating a probability','Uncertainty without hedging','The chart that carries the argument','Handling the question with no good answer'],
 cards:[

{label:'ORIENT', tag:'The listener', title:'What they are solving for', stage:8, html:`
<p>A specialist presents the analysis. A non-specialist listener is running a different computation entirely, usually three questions deep.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">What do I need to do?<em>Decide, approve, escalate, or nothing. Establish this in the first thirty seconds or they construct their own version.</em></span></li>
<li><span class="k">02</span><span class="v">How confident should I be?<em>Not the confidence interval. Whether to treat this as settled or provisional.</em></span></li>
<li><span class="k">03</span><span class="v">What happens if this is wrong?<em>The exposure. Frequently the only thing they remember afterwards.</em></span></li>
</ul>
<div class="note"><div class="lab">Where technical presentations go wrong</div>
<p>They answer a fourth question — <b>how was this done</b> — which the listener has not asked and cannot evaluate. Method establishes credibility with peers. With a non-specialist audience it consumes the time available and displaces the three questions they actually brought.</p></div>` },

{label:'MECHANISM', tag:'Probability', title:'What a percentage does to a listener', stage:8, html:`
<p>A probability quoted as a percentage is processed as a property of the individual case rather than of a population. "A four per cent chance of default" is heard as "this loan is probably fine".</p>
<div class="vs">
  <div class="no"><div class="t">Percentage</div><div class="d">This segment has a 4% probability of default.</div></div>
  <div class="yes"><div class="t">Frequency</div><div class="d">Of every hundred loans like this, about four will not be repaid. At an average ticket of two lakh, that is eight lakh of loss per hundred loans written.</div></div>
</div>
<p>The second version converts a rate into a count and a count into money, and both conversions are what the listener would have done privately and imprecisely.</p>
<div class="good"><div class="lab">The general rule</div>
<p>Express uncertainty as <b>natural frequencies</b>, and translate the consequence into the unit the listener manages. A credit committee manages rupees and volumes, not rates — so the rate is an intermediate step, not the finding.</p></div>` },

{label:'MECHANISM', tag:'Uncertainty', title:'Stating it without forfeiting authority', stage:8, html:`
<p>Specialists hedge because they are being precise. Non-specialists hear hedging as an absence of a view, and the resulting vacuum is filled by whoever in the room is most confident.</p>
<div class="vs">
  <div class="no"><div class="t">Hedging</div><div class="d">It's difficult to say with any certainty — the data has limitations and it could go either way.</div></div>
  <div class="yes"><div class="t">Bounded confidence</div><div class="d">Best estimate is a 40-basis-point increase in credit cost. Confident about the direction, less about the size — the range is 25 to 60. That range does not change the recommendation.</div></div>
</div>
<p>The second states a view, bounds it honestly, and then says the thing that matters most: <b>whether the uncertainty is decision-relevant</b>.</p>
