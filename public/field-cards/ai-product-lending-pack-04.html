<li><span class="k">03</span><span class="v">Documentation<em>Methodology, data, assumptions, performance, and a written limitations section</em></span></li>
<li><span class="k">04</span><span class="v">Monitoring<em>Defined metrics, thresholds, frequency and a named owner</em></span></li>
<li><span class="k">05</span><span class="v">Change control<em>What constitutes a material change, and what re-validation it triggers</em></span></li>
</ul>
<div class="good"><div class="lab">The item a product manager should insist on</div>
<p>The <b>limitations section</b>, drafted before validation asks for it. A document naming its own weaknesses — the sample period, the assumptions, the segments where performance is weaker — passes review substantially faster than one that presents a model as unqualified. Volunteering the weakness is not a concession; it is the fastest route through the gate.</p></div>` },

{label:'TRAP', tag:'Outsourcing', title:'The partner acts, the lender answers', stage:11, html:`
<p>Lending products are assembled from partners: sourcing platforms, technology providers, verification vendors, collection agencies, co-lenders.</p>
<p>Activity can be delegated. <b>Accountability to the borrower and the regulator cannot.</b> Three places this surfaces as a concrete product requirement:</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">A partner's interface is the lender's disclosure<em>If the borrower sees terms in a partner's app, that screen carries the lender's disclosure obligation</em></span></li>
<li><span class="k">02</span><span class="v">A partner's contact is the lender's conduct<em>An agency breaching contact rules produces a finding against the lender</em></span></li>
<li><span class="k">03</span><span class="v">Money flows are constrained<em>Disbursement and repayment generally must move between the lender and the borrower's own account, not through an intermediary's pool</em></span></li>
</ul>
<p class="small">Each of these becomes a clause in a partner agreement and a control in the product. The third frequently invalidates an otherwise attractive commercial structure, and is worth checking before the structure is designed around.</p>` },

{label:'THE HARD QUESTION', tag:'Constraint', title:'Does regulation make this space uncompetitive to build in?', stage:11, html:`
<p>The opposite, and the argument is worth being able to make precisely.</p>
<p>A generic product platform cannot simply be switched on inside a lender. It has to accommodate a specific policy, integrate with a legacy core, produce reason codes the compliance function accepts, keep data inside a boundary, and generate an audit trail that survives inspection.</p>
<div class="note"><div class="lab">Where the defensibility comes from</div>
<p>That gap between a capable general product and a deployable regulated one is exactly the space a specialist occupies. It is why lending platforms sell against horizontal tooling, and why the people who can cross the policy-to-implementation boundary are scarce relative to demand. <b>The regulation is the moat, not the obstacle.</b></p></div>
<p>The corollary is uncomfortable and worth stating: the advantage belongs to whoever treats the constraints as the design brief at the start. A team that builds first and reads the rulebook at launch pays for the gap twice — once in rework, and once in the quarters lost.</p>` },

{label:'CLOSE', tag:'07 / 10', title:'Now owned', stage:11, html:`
<ul class="own">
<li>Six constraints read as specifications rather than approvals</li>
<li>All-in cost disclosed before commitment — and what it does to fee-based positioning</li>
<li>Reason codes derived arithmetically; language used only to render them</li>
<li>Purpose, minimisation, residency and retention — with residency gating model choice</li>
<li>Contact rules enforced in code, never in a prompt</li>
<li>Inventory, validation, documentation, monitoring, change control — limitations volunteered</li>
<li>Delegated activity, undelegatable accountability, and constrained money flows</li>
</ul>
<div class="next">
<div class="lab">Mission 08 unlocks</div>
<div class="ttl">The Numbers</div>
<p>The metric tree from application to contribution: what a loan actually earns, what it costs to make, and the four numbers that decide whether a lending product is a business.</p>
</div>` }

]},
{n:'08', title:'The Numbers', stage:8,
 sub:'A lending product is a business with an unusually long feedback loop and an unusually specific cost structure. This mission builds the metric tree from application to contribution, and names the numbers that decide whether any of it works.',
 covers:['What a loan actually earns','The four cost lines','Contribution per account','The funnel metrics that matter','Leading indicators of credit quality','What each seat is measured on'],
 cards:[

{label:'MECHANISM', tag:'Revenue', title:'What a loan earns', stage:8, html:`
<p>Three revenue lines, and they behave differently.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Interest margin<em>The spread between the rate charged and the cost of funds, earned over the life of the loan and only while it performs</em></span></li>
<li><span class="k">02</span><span class="v">Fees<em>Processing and service charges, earned at origination and therefore certain — which is why they distort incentives toward volume</em></span></li>
<li><span class="k">03</span><span class="v">Ancillary<em>Insurance and attached products, where permitted and disclosed</em></span></li>
</ul>
<div class="warn"><div class="lab">The timing asymmetry that shapes everything</div>
<p>Fees arrive at day zero. Margin accrues monthly. Losses arrive in a cluster around months nine to eighteen. A product judged on the first two months looks profitable regardless of quality, and this is the single most common way a lending business grows itself into trouble.</p></div>` },

{label:'MECHANISM', tag:'Cost', title:'The four cost lines', stage:8, html:`
<table>
<tr><th>Line</th><th>Driver</th><th>Lever</th></tr>
<tr><td><b>Cost of funds</b></td><td>Funding structure and rating</td><td>Largely outside product control</td></tr>
<tr><td><b>Acquisition</b></td><td>Channel mix and conversion</td><td>Funnel, targeting, partner terms</td></tr>
<tr><td><b>Processing</b></td><td>Data pulls, document handling, manual touches</td><td><b>Straight-through processing, decline ordering</b></td></tr>
<tr><td><b>Credit cost</b></td><td>Who was approved</td><td>Policy, scorecard, limit and pricing</td></tr>
</table>
<div class="note"><div class="lab">Which two a product manager actually moves</div>
<p>Processing cost and, indirectly, credit cost. Acquisition is usually shared with marketing and funding sits with treasury. Processing cost is the one wholly owned and most frequently ignored, because it does not appear in any customer-facing metric — it appears in the operations headcount, one quarter later.</p></div>` },

{label:'MECHANISM', tag:'Contribution', title:'The number that settles arguments', stage:8, html:`
<pre class="code">contribution_per_account =
      interest_margin_over_life
    + fees
    − acquisition_cost
    − processing_cost
    − expected_credit_loss

expected_credit_loss = pd × lgd × ead

<i>pd  — probability of default</i>
<i>lgd — share of exposure not recovered</i>
<i>ead — amount owed at the moment of default</i></pre>
<p>Every product argument in lending reduces to this line. A conversion improvement is real only if it does not raise the loss term by more than it adds to the first two. A speed improvement is real only if it does not cost more in processing than it wins in volume.</p>
<div class="good"><div class="lab">The discipline it imposes</div>
<p>A proposal expressed as "conversion up eight per cent" is incomplete. The same proposal expressed as "conversion up eight per cent, admitted cohort defaulting at three and a half against a book at two, contribution positive above a limit of sixty thousand" is a decision a credit committee can actually take.</p></div>` },

{label:'NUMBERS', tag:'Funnel', title:'The metrics that carry information', stage:2, html:`
<ul class="kv">
<li><span class="k">01</span><span class="v">Completion by step<em>Where the journey loses people, with reason at exit attached</em></span></li>
<li><span class="k">02</span><span class="v">Approval rate<em>Read only alongside bad rate. Alone it is a number that can be improved by making the product worse.</em></span></li>
<li><span class="k">03</span><span class="v">Offer acceptance<em>Approved applicants who take the offer. A pricing, speed and competitiveness signal.</em></span></li>
<li><span class="k">04</span><span class="v">Straight-through rate<em>Per segment. The automation and cost metric.</em></span></li>
<li><span class="k">05</span><span class="v">Turnaround<em>At the median and the ninetieth percentile. The tail is what generates abandonment and complaints.</em></span></li>
<li><span class="k">06</span><span class="v">Cost per disbursed loan<em>Fully loaded, including every application that did not convert</em></span></li>
</ul>
<div class="warn"><div class="lab">The pairing rule</div>
<p>Approval rate never appears without bad rate. Conversion never appears without a quality measure. Any single funnel number can be improved by degrading the book, so a dashboard that shows one without the other is an invitation to do exactly that.</p></div>` },

{label:'MECHANISM', tag:'Early warning', title:'What is watched while waiting for the truth', stage:12, html:`
<p>Credit quality takes quarters to reveal itself. Four indicators move earlier and are what a product manager actually operates on.</p>
<div class="flow">
<div><span class="s">Days</span><span class="x">Mandate registration failures — repayment set-up not completing</span></div>
<div><span class="s">Month 1</span><span class="x"><b>First payment default</b> — the earliest and harshest signal available</span></div>
<div><span class="s">Month 3</span><span class="x">Thirty-day delinquency by origination cohort</span></div>
<div><span class="s">Month 6</span><span class="x">Cohort curves compared at equal age against previous cohorts</span></div>
</div>
<div class="good"><div class="lab">Why first payment default is the one to watch</div>
<p>A borrower missing their very first instalment did not encounter misfortune — they were almost certainly never able to afford it, or never intended to repay. It isolates <b>assessment failure and fraud</b> from ordinary credit risk, and it arrives within thirty days rather than within a year.</p></div>` },

{label:'MECHANISM', tag:'Cohorts', title:'Compare at equal age, never at equal date', stage:12, html:`
<p>Loans default on a clock that starts at disbursal, not on the calendar. A cohort three months old and one two years old cannot be compared on delinquency — the young one has not had time.</p>
<table>
<tr><th>Cohort</th><th>30+ at month 6</th></tr>
<tr><td>January</td><td class="num-cell">1.2%</td></tr>
<tr><td>February</td><td class="num-cell">1.4%</td></tr>
<tr><td>March</td><td class="num-cell">1.9%</td></tr>
<tr><td>April</td><td class="num-cell">2.6%</td></tr>
</table>
<p>That column is deteriorating origination quality, visible now, reaching the accounts in about a year. No calendar-dated report surfaces it, because every calendar view blends cohorts of different ages and the trend disappears into the blend.</p>
<p class="small">Reading this table is among the highest-leverage analytical habits available in a lending product role, and it costs one query.</p>` },

{label:'NUMBERS', tag:'By seat', title:'What each seat is actually measured on', stage:8, html:`
<table>
<tr><th>Seat</th><th>Primary</th><th>Guardrail</th></tr>
<tr><td><b>Platform</b></td><td>Time to client go-live; decisions processed; client retention</td><td>Configuration without forking the codebase</td></tr>
<tr><td><b>In-house</b></td><td>Straight-through rate; turnaround; cost per decision</td><td>Approval rate held, bad rate held</td></tr>
<tr><td><b>Own book</b></td><td>Contribution per account; disbursal volume</td><td>First payment default; cohort curves</td></tr>
</table>
<div class="note"><div class="lab">The platform metric that is chronically missing</div>
<p><b>Time from contract to first live decision.</b> It is the number that determines whether the commercial model works, it is where implementation cost concentrates, and it is almost never on a product dashboard — because it spans sales, delivery and engineering, and no single function owns it.</p></div>` },

{label:'THE HARD QUESTION', tag:'Attribution', title:'How is a product change credited when the outcome arrives a year later?', stage:12, html:`
<p>This is the genuine measurement problem of the discipline, and there is no clean solution — only a set of partial ones used together.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Hold the slice open<em>Keep a control arm running well past the point the change is rolled out, so a comparison still exists when the slow metrics land</em></span></li>
<li><span class="k">02</span><span class="v">Commit to the leading indicator in advance<em>Name, before launch, which early signal is being treated as the proxy and what value would trigger reversal</em></span></li>
<li><span class="k">03</span><span class="v">Record the counterfactual<em>Log what the previous system would have decided, so the comparison survives even after the old path is gone</em></span></li>
<li><span class="k">04</span><span class="v">Accept the honest gap<em>Some changes will never be cleanly attributed, and claiming otherwise damages credibility more than the missing attribution does</em></span></li>
</ul>
<div class="warn"><div class="lab">The organisational failure this prevents</div>
<p>Where attribution is not designed in, credit for growth accrues immediately and blame for losses accrues to whoever is present when they surface — usually a different person, often a different team. That pattern reliably produces a lending business optimised for the next two quarters and nothing beyond them.</p></div>` },

{label:'CLOSE', tag:'08 / 10', title:'Now owned', stage:8, html:`
<ul class="own">
<li>Three revenue lines, and the timing asymmetry between fees and losses</li>
<li>Four cost lines, and the two a product manager actually moves</li>
<li>Contribution per account as the line every argument reduces to</li>
<li>Six funnel metrics, with the pairing rule that prevents self-harm</li>
<li>First payment default as the earliest separation of assessment failure from credit risk</li>
<li>Cohorts compared at equal age; the column that predicts next year's losses</li>
<li>Per-seat metrics, and time from contract to first live decision</li>
</ul>
<div class="next">
<div class="lab">Mission 09 unlocks</div>
<div class="ttl">Shipping</div>
<p>Integration, pilots, migration and go-live inside institutions that cannot be released to on a Friday — and the delivery reality that separates a lending roadmap from a consumer one.</p>
</div>` }

]},
{n:'09', title:'Shipping', stage:7,
 sub:'Lending products are delivered into institutions that cannot be released to on a Friday afternoon. This mission covers integration, pilots, acceptance testing, migration and go-live — the delivery reality that separates this discipline from consumer product work.',
 covers:['What integration actually involves','The pilot that proves something','Acceptance testing as a product artifact','Migration and parallel run','Release under change control','The first ninety days on a new product'],
 cards:[

{label:'ORIENT', tag:'Reality', title:'Why delivery dominates the calendar', stage:7, html:`
<p>In consumer product work, building is most of the effort and releasing is a deployment. In lending the ratio inverts: building a decisioning capability may take six weeks and getting it live inside an institution takes six months.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Integration<em>Core systems, bureaus, verification vendors, payment rails — each with its own contract, environment and test cycle</em></span></li>
<li><span class="k">02</span><span class="v">Approval sequencing<em>Committees meet monthly. Missing one costs four weeks regardless of readiness.</em></span></li>
<li><span class="k">03</span><span class="v">Acceptance<em>The client or the internal business function validates against their own understanding, which is not the requirement document</em></span></li>
<li><span class="k">04</span><span class="v">Change windows<em>Releases happen in defined windows, and the window before a financial period close is closed entirely</em></span></li>
</ul>
<p class="small">A roadmap that budgets for building and not for these will miss every date it sets, and the misses will be attributed to engineering.</p>` },

{label:'MECHANISM', tag:'Integration', title:'Five connections, five failure modes', stage:7, html:`
<table>
<tr><th>Connection</th><th>Fails as</th></tr>
<tr><td>Core banking</td><td>Batch-only where real time was assumed; fields that do not exist</td></tr>
<tr><td>Bureau</td><td>Test environment unlike production; per-query cost at volume</td></tr>
<tr><td>Verification vendors</td><td>Latency and availability outside the lender's control</td></tr>
<tr><td>Payment and mandate rails</td><td>Asynchronous confirmation; failure states needing reconciliation</td></tr>
<tr><td>Identity and know-your-customer</td><td>Regulatory dependency; downtime the product must survive</td></tr>
</table>
<div class="warn"><div class="lab">The assumption that breaks schedules</div>
<p>That an integration is real time because it is exposed as an interface. A great many core systems answer from an overnight file. A journey designed around an instant balance check against a nightly extract does not degrade gracefully — it produces confidently stale decisions, and the discovery usually arrives in acceptance testing.</p></div>` },

{label:'MECHANISM', tag:'Pilot', title:'What a pilot has to be designed to prove', stage:7, html:`
<p>A pilot is not a small launch. It is an experiment with a stated hypothesis, and pilots that omit the hypothesis run indefinitely.</p>
<div class="flow">
<div><span class="s">Question</span><span class="x">The one thing this pilot exists to answer</span></div>
<div><span class="s">Scope</span><span class="x">One segment, one channel, one product — not a representative slice of everything</span></div>
<div><span class="s">Volume</span><span class="x">Enough to answer the question, sized on the slowest metric it must move</span></div>
<div><span class="s">Duration</span><span class="x">Fixed at the start, with the review date in the calendar</span></div>
<div><span class="s">Exit</span><span class="x"><b>What result expands it, and what result ends it</b></span></div>
</div>
<div class="good"><div class="lab">The last row is the one omitted</div>
<p>A pilot with no defined failure condition cannot fail — it can only be extended. Writing the exit condition before the start is what converts a pilot from a demonstration into evidence, and it is a product manager's responsibility rather than a sponsor's.</p></div>` },

{label:'WORKED', tag:'Acceptance', title:'Testing as a product artifact', stage:7, html:`
<p>On a lending platform serving banking clients, I ran validation and user acceptance testing through to go-live. The lesson from that seat is that acceptance testing is not a quality gate at the end — it is where <b>requirement ambiguity finally surfaces</b>.</p>
<p>The pattern is consistent. A client tests a case, the system does what the requirement said, and the client says it is wrong. Nobody has made an error; the requirement was read two ways and this is the first moment the two readings collide.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Boundary cases<em>Exactly at the cutoff, exactly at the age limit, exactly at the tenure minimum</em></span></li>
<li><span class="k">02</span><span class="v">Absent data<em>Bureau unavailable, document unreadable, field not returned</em></span></li>
<li><span class="k">03</span><span class="v">Contradictions<em>Declared income and verified income disagree; two sources give different obligations</em></span></li>
<li><span class="k">04</span><span class="v">Precedence<em>Several rules decline the same applicant — which reason is reported</em></span></li>
</ul>
<div class="good"><div class="lab">The move that pulls the pain forward</div>
<p>Write those four categories as test cases <b>during requirements</b>, and walk them with the policy owner before a line is built. Every ambiguity resolved there is a defect that never exists, and it converts acceptance testing from a negotiation into a confirmation.</p></div>` },

{label:'MECHANISM', tag:'Migration', title:'Parallel run, and the disagreement log', stage:7, html:`
<p>Replacing a live decisioning system is not a switch. The old and the new run together on the same traffic, and their disagreements are the entire evidence base.</p>
<div class="flow">
<div><span class="s">Stage 1</span><span class="x">New system runs invisibly; every decision compared, none acted on</span></div>
<div><span class="s">Stage 2</span><span class="x">Disagreements reviewed by underwriting — which was correct, and why</span></div>
<div><span class="s">Stage 3</span><span class="x">New system decides a small share of live traffic</span></div>
<div><span class="s">Stage 4</span><span class="x">Share increased on agreed thresholds; old path retained</span></div>
<div><span class="s">Stage 5</span><span class="x">Old path decommissioned only after a full period has closed cleanly</span></div>
</div>
<div class="warn"><div class="lab">Expect disagreement, and read it correctly</div>
<p>A parallel run reaching perfect agreement usually means the new system reimplemented the old one's defects faithfully. Disagreement is the expected outcome; what matters is that each instance is explained. An unexplained disagreement at stage two is a requirement that was never resolved, surfacing at the last possible moment.</p></div>` },

{label:'MECHANISM', tag:'Release', title:'Shipping under change control', stage:7, html:`
<p>Continuous deployment is not available for the decisioning path in most regulated institutions. What is available is a disciplined use of the windows that exist.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Separate the release from the activation<em>Deploy the code inactive, behind a switch; activation becomes a controlled, reversible business decision</em></span></li>
<li><span class="k">02</span><span class="v">Version the policy separately from the code<em>A cutoff change should not require a deployment, and a deployment should not silently change a cutoff</em></span></li>
<li><span class="k">03</span><span class="v">Define the rollback before the release<em>Not "revert the deployment" — what happens to applications decided in the interval</em></span></li>
<li><span class="k">04</span><span class="v">Never release into a close<em>The window before a financial period end is closed, and no amount of urgency reopens it</em></span></li>
</ul>
<div class="good"><div class="lab">The first item is the whole technique</div>
<p>Separating deployment from activation converts a change-controlled event into a routine one. The heavy process attaches to putting code on a server; the switch that makes it live is a business decision that can be taken, and reversed, in minutes.</p></div>` },

{label:'NUMBERS', tag:'Arrival', title:'The first ninety days on a lending product', stage:7, html:`
<div class="flow">
<div><span class="s">Days 1–10</span><span class="x">Read the credit policy end to end. Unaided, before asking anyone to explain it.</span></div>
<div><span class="s">Days 11–20</span><span class="x">Trace one real application through every system it touches, field by field</span></div>
<div><span class="s">Days 21–35</span><span class="x">Sit with underwriting and collections. Watch the overrides and ask why each happened.</span></div>
<div><span class="s">Days 36–50</span><span class="x">Rebuild the funnel from source data and reconcile it against the published one</span></div>
<div><span class="s">Days 51–70</span><span class="x">Ship one small thing that removes a manual touch</span></div>
<div><span class="s">Days 71–90</span><span class="x">Bring a proposal with swap-set and contribution evidence attached</span></div>
</div>
<div class="good"><div class="lab">Why the fourth step earns the most</div>
<p>Rebuilding the funnel independently and reconciling it always surfaces a discrepancy, and the discrepancy is always instructive — an exclusion nobody documented, a stage counted twice, a definition that drifted. Finding it establishes more credibility than any feature shipped in the same period.</p></div>` },

{label:'THE HARD QUESTION', tag:'Pace', title:'Can a lending product ship weekly?', stage:7, html:`
<p>Parts of it can, and conflating the parts is what produces both unrealistic roadmaps and unnecessarily slow ones.</p>
<table>
<tr><th>Surface</th><th>Realistic cadence</th></tr>
<tr><td>Journey, copy, screens, messaging</td><td>Weekly</td></tr>
<tr><td>Operations and underwriter tooling</td><td>Weekly to fortnightly</td></tr>
<tr><td>Collections treatments and prioritisation</td><td>Fortnightly</td></tr>
<tr><td>Rules and cutoffs</td><td>Monthly — committee-bound</td></tr>
<tr><td><b>Scorecard or decision model</b></td><td><b>Quarterly — validation-bound</b></td></tr>
</table>
<div class="note"><div class="lab">The structural consequence</div>
<p>These are separate release trains with separate governance, and treating them as one forces everything to the slowest cadence. A team that ships journey changes weekly while a scorecard moves through validation quarterly is not inconsistent — it is correctly organised, and it delivers roughly four times as much.</p></div>` },

{label:'CLOSE', tag:'09 / 10', title:'Now owned', stage:7, html:`
<ul class="own">
<li>Why delivery, not build, dominates the calendar in this domain</li>
<li>Five integrations and their characteristic failure modes</li>
<li>The pilot's exit condition, written before it starts</li>
<li>The four ambiguity categories, walked with the policy owner during requirements</li>
<li>Parallel run, and disagreement as the expected and informative outcome</li>
<li>Deployment separated from activation; policy versioned apart from code</li>
<li>Separate release trains at separate cadences, not one train at the slowest speed</li>
</ul>
<div class="next">
<div class="lab">Mission 10 unlocks</div>
<div class="ttl">On Duty</div>
<p>The operating rhythm once it is live — servicing, collections, portfolio watch — and the three recall surfaces that close the pack.</p>
</div>` }

]},
{n:'10', title:'On Duty', stage:9,
 sub:'The product is live and the work changes shape. Servicing, collections and portfolio watch run on a rhythm — and the pack closes with the three surfaces built for recall rather than for reading.',
 covers:['Where the second half of the value sits','Collections as a product, not a function','The operating rhythm','Every trap in one grid','Every number on one card','The compression'],
 cards:[

{label:'ORIENT', tag:'After disbursal', title:'The half of the product nobody roadmaps', stage:9, html:`
<p class="kicker">Origination decides who gets money. Servicing and collections decide how much of it comes back — and receive a fraction of the product attention.</p>
<div class="flow">
<div><span class="s">Servicing</span><span class="x">Repayment, mandates, statements, queries, closure</span></div>
<div><span class="s">Pre-delinquency</span><span class="x">Reminders, mandate health, the borrower who is about to miss</span></div>
<div><span class="s">Early collections</span><span class="x">One to thirty days — mostly forgetfulness and friction</span></div>
<div><span class="s">Late collections</span><span class="x">Thirty to ninety days — genuine distress, restructuring, negotiation</span></div>
<div><span class="s">Recovery</span><span class="x">Beyond ninety days — legal, settlement, write-off</span></div>
</div>
<div class="good"><div class="lab">Where the fastest returns in lending are</div>
<p>The second and third rows. A borrower whose repayment failed because a mandate lapsed is not a credit problem at all — it is a product defect, and it is fully recoverable with a message. Preventing avoidable delinquency is cheaper than collecting it, and it operates on a feedback loop of days rather than quarters.</p></div>` },

{label:'MECHANISM', tag:'Collections', title:'Four product decisions, not one', stage:10, html:`
<p>Collections is usually treated as an operational function with a headcount. Treated as a product it resolves into four decisions, each independently improvable.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Who<em>Prioritisation. Not by size of arrears — by probability of recovery given contact, against the cost of that contact.</em></span></li>
<li><span class="k">02</span><span class="v">When<em>Timing frequently outperforms message. A reminder two days before the instalment prevents what a call three days after has to recover.</em></span></li>
<li><span class="k">03</span><span class="v">How<em>Channel and language. Automated message, automated call, human agent, field visit — each an order of magnitude apart in cost.</em></span></li>
<li><span class="k">04</span><span class="v">What is offered<em>Pre-approved bounds within which a restructure or instalment plan may be proposed without escalation</em></span></li>
</ul>
<div class="warn"><div class="lab">The fourth is the one usually left unautomated</div>
<p>Not for good reason. Where the bounds are defined by credit in advance, proposing within them is deterministic. Where they are not, every case escalates and the queue becomes the constraint on the entire operation.</p></div>` },

{label:'MECHANISM', tag:'Portfolio', title:'The operating rhythm', stage:12, html:`
<div class="flow">
<div><span class="s">Daily</span><span class="x">Service health, decision volumes, approval rate, error and fallback rates</span></div>
<div><span class="s">Weekly</span><span class="x">Funnel by step and channel; exit reasons; queue depth; first payment default</span></div>
<div><span class="s">Monthly</span><span class="x">Cohort curves at equal age; population stability; override rates and reasons</span></div>
<div><span class="s">Quarterly</span><span class="x">Model performance backtest; policy review; contribution by segment</span></div>
</div>
<p>The rhythm exists because the signals arrive on different clocks. Watching a quarterly signal weekly produces noise-driven decisions; watching a daily signal quarterly means an outage is discovered by a client.</p>
<div class="note"><div class="lab">The one weekly item most often missing</div>
<p><b>Override rate and reason.</b> Where underwriters routinely override the system in a particular direction, either the policy is wrong or the system is — and either way the answer is in the override log, weeks before it appears anywhere else.</p></div>` },

{label:'NUMBERS', tag:'Recall surface I', title:'Every trap in one grid', stage:12, html:`
<table>
<tr><th>Symptom</th><th>Cause</th><th>Move</th></tr>
<tr><td>Conversion up, book worse</td><td>Growth funnel optimised alone</td><td>Pair every funnel metric with a quality one</td></tr>
<tr><td>Drop-off blamed on friction</td><td>Rejection counted as leakage</td><td>Instrument reason at exit</td></tr>
<tr><td>Cost per disbursal high</td><td>Paid data pulled before cheap declines</td><td>Reorder the enrichment sequence</td></tr>
<tr><td>Consent screen bleeding</td><td>Over-requesting range or duration</td><td>Request only what decides the case</td></tr>
<tr><td>Thin-file segment lost</td><td>Bureau depth as an eligibility rule</td><td>Substitute data, or a small graduating limit</td></tr>
<tr><td>Extraction wrong, undetected</td><td>Confidence without arithmetic checks</td><td>Reconcile against the document's own totals</td></tr>
<tr><td>Model proposal stalls for quarters</td><td>Scoped at decide when assist suffices</td><td>Re-scope down the autonomy ramp</td></tr>
<tr><td>Decline reason indefensible</td><td>Explanation generated, not derived</td><td>Derive from points; render with language</td></tr>
<tr><td>Endpoint unusable at launch</td><td>Residency checked after selection</td><td>Gate model choice on residency first</td></tr>
<tr><td>Contact breach via automation</td><td>Conduct rules held in a prompt</td><td>Enforce in the deterministic shell</td></tr>
<tr><td>Challenger promoted, losses follow</td><td>Judged on the fast metric only</td><td>Stopping rules naming which metrics may be read early</td></tr>
<tr><td>Pilot never ends</td><td>No exit condition written</td><td>Define what ends it before it starts</td></tr>
<tr><td>Acceptance testing becomes a fight</td><td>Ambiguity surfacing at the last gate</td><td>Walk boundaries and precedence during requirements</td></tr>
<tr><td>Parallel run agrees perfectly</td><td>Old defects faithfully reimplemented</td><td>Expect disagreement; explain each one</td></tr>
<tr><td>Release blocked for weeks</td><td>Deployment fused to activation</td><td>Ship inactive; activate behind a switch</td></tr>
<tr><td>Vendor model shifts silently</td><td>No version pin, no output retained</td><td>Pin, and store the output with the decision</td></tr>
<tr><td>Nobody can attribute an outcome</td><td>Control arm closed at rollout</td><td>Hold the slice; log the counterfactual</td></tr>
<tr><td>Losses surprise everyone</td><td>Calendar-dated reporting only</td><td>Cohort curves read at equal age</td></tr>
</table>` },

{label:'NUMBERS', tag:'Recall surface II', title:'Every number on one card', stage:12, html:`
<pre class="code"><u>CONTRIBUTION</u>
contribution = margin + fees
             − acquisition − processing
             − ( pd × lgd × ead )

<u>FUNNEL</u>  <i>— never read alone</i>
completion by step        + exit reason
approval rate             + bad rate
offer acceptance          + price position
straight-through rate     <i>per segment</i>
turnaround                <i>median AND 90th percentile</i>
cost per disbursed loan   <i>fully loaded</i>

<u>EARLY WARNING</u>  <i>— before the truth arrives</i>
days     mandate registration failure
month 1  FIRST PAYMENT DEFAULT
month 3  30+ delinquency by cohort
month 6  cohort curves at equal age

<u>SWAP SET</u>  <i>— at constant approval rate</i>
swap-in bad rate  &lt;  swap-out bad rate  → real gain
swap-in bad rate  ≈  swap-out bad rate  → cosmetic

<u>AUTONOMY</u>
assist     → accuracy + fallback          <i>days</i>
recommend  → override trail + acceptance  <i>weeks</i>
decide     → validation, reasons,
             monitoring, audit trail      <i>quarters</i>

<u>BY SEAT</u>
platform  contract → first live decision
in-house  straight-through, turnaround, cost
own book  contribution per account</pre>` },

{label:'ORIENT', tag:'Recall surface III', title:'The compression', stage:12, html:`
<p class="kicker">The whole pack in one paragraph, for the moment there is no time to read anything else.</p>
<div class="note"><div class="lab">The compression</div>
<p>A lending product is a <b>decision manufactured at scale under a rulebook</b>. Building one well means: reading the <b>policy</b> unaided and turning its ambiguities into written answers; knowing what data is <b>knowable, affordable and permitted</b> at the moment of decision; placing the model at the <b>lowest autonomy level that captures the value</b>, inside a deterministic shell that makes it replayable; <b>proving</b> it in shadow before it touches an applicant; treating <b>disclosure, reasons, residency and conduct</b> as the design brief rather than the approval; measuring in <b>contribution</b> and watching the <b>leading indicators</b> because the truth is a year away; and <b>shipping</b> it through committees, integrations and parallel runs that no amount of urgency shortens.</p></div>
<p>Seven clauses. Each is a mission, and each is a place where a product manager who understands credit diverges from one who does not.</p>` },

{label:'THE HARD QUESTION', tag:'The role', title:'What makes this role hard to fill?', stage:10, html:`
<p>The scarcity is specific and worth naming precisely, because it is the same thing that makes the work difficult.</p>
<p>The role sits at the intersection of three literacies that rarely co-occur.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Credit<em>Reading a policy, understanding what a loss actually costs, knowing why the cutoff is where it is</em></span></li>
<li><span class="k">02</span><span class="v">Technical<em>Knowing what a model can and cannot be asked for, what an integration implies, where a probabilistic component may sit</em></span></li>
<li><span class="k">03</span><span class="v">Delivery<em>Requirements, ambiguity resolution, acceptance, migration, and the committee sequencing that governs all of it</em></span></li>
</ul>
<div class="note"><div class="lab">The common failure of each single literacy</div>
<p>Credit alone specifies what cannot be built. Technical alone builds what cannot be approved. Delivery alone ships the wrong thing on time. The combination is uncommon because the three are learned in different places — and it is why people who have done the analysis work convert into this role more reliably than people who have only done product work elsewhere.</p></div>` },

{label:'CLOSE', tag:'10 / 10', title:'Pack complete', stage:12, html:`
<ul class="own">
<li>Servicing and collections as the half of the product with the fastest feedback</li>
<li>Collections as four separable decisions: who, when, how, what is offered</li>
<li>The daily, weekly, monthly and quarterly rhythm — and the override log</li>
<li>The traps grid, the numbers card, and the compression, built for recall under pressure</li>
<li>The three literacies, and why their intersection is scarce</li>
</ul>

<p>Ten missions from what the product actually is to the rhythm that keeps it alive. Companion to Pack 01 on retail credit risk, Pack 02 on AI engineering, and Pack 03 on credit risk and Python.</p>
<p class="small" style="margin-top:14px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute)">Tharun Gajula</p>
</div>` }

]}
];

/* ---------- flatten ---------- */
const FLAT = [];
FLAT.push({kind:'packcover', stage:0, title:'AI Product Management in Lending', mission:'', html:`
<div class="cover">
  <div class="mark">Field Cards · Pack 04</div>
  <h1>AI Product<br>Management<br>in Lending</h1>
  <div class="sub">Building credit products with AI inside them — the journey, the policy, the data, where the model sits, how it is proved, what constrains it, and what it earns.</div>
  <div class="meta">
    <div>MISSIONS<b>10</b></div>
    <div>CARDS<b id="totalCards">—</b></div>
    <div>RAMP<b>A→D</b></div>
  </div>
  <div class="byline">Tharun Gajula</div>
  <div class="scrollhint">Swipe up ↑</div>
</div>`});

MISSIONS.forEach(m=>{
  FLAT.push({kind:'mcover', stage:m.stage, mission:m.n, title:m.title, html:`
  <div class="mcover">
    <div class="num">Mission ${m.n} of 10</div>
    <h1>${m.title}</h1>
    <div class="sub">${m.sub}</div>
    <div class="covers"><div class="lab">In this mission</div><ul>${m.covers.map(c=>`<li>${c}</li>`).join('')}</ul></div>
  </div>`});
  m.cards.forEach(c=>FLAT.push({kind:'card', mission:m.n, ...c}));
});

/* ---------- render ---------- */
const deck=document.getElementById('deck');
deck.innerHTML=FLAT.map((c,i)=>`<section class="card" data-i="${i}" data-stage="${c.stage||0}" data-m="${c.mission||''}">
  <div class="sheet">${(c.kind==='card')
    ? `<div class="eyebrow"><span class="dot"></span><span>${c.label}</span><span style="color:var(--rule)">/</span><span class="tag">${c.tag}</span></div><h2>${c.title}</h2>${c.html}`
    : c.html}</div></section>`).join('');
const tc=document.getElementById('totalCards'); if(tc) tc.textContent=FLAT.length;

/* ---------- rail: twelve stages of the lending loop ---------- */
const RAIL_N=12;
const rail=document.getElementById('rail');
rail.innerHTML=Array.from({length:RAIL_N},()=>'<span></span>').join('');
const ticks=[...rail.children];

/* ---------- index: missions only ---------- */
const idx=document.getElementById('idx'), idxList=document.getElementById('idxList');
const anchors=[];
FLAT.forEach((c,i)=>{ if(c.kind==='packcover'||c.kind==='mcover') anchors.push({i,c}); });
idxList.innerHTML=anchors.map(a=>`<li data-go="${a.i}">
  <span class="n">${a.c.kind==='packcover'?'00':a.c.mission}</span>
  <span class="t">${a.c.title}${a.c.kind==='mcover'?`<em>Mission ${a.c.mission}</em>`:'<em>Pack cover</em>'}</span>
</li>`).join('');
idxList.addEventListener('click',e=>{const li=e.target.closest('li'); if(!li)return;
  idx.classList.remove('open');
  deck.children[+li.dataset.go].scrollIntoView({behavior:'smooth'});});
document.getElementById('counter').onclick=()=>idx.classList.add('open');
document.getElementById('idxClose').onclick=()=>idx.classList.remove('open');

/* ---------- observer ---------- */
const counter=document.getElementById('counter'), bar=document.getElementById('bar');
let current=0;
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.intersectionRatio<0.55) return;
  current=+e.target.dataset.i;
  const m=e.target.dataset.m;
  counter.textContent = m ? `M${m} · ${String(current+1).padStart(3,'0')}` : String(current+1).padStart(3,'0');
  bar.style.width=((current+1)/FLAT.length*100)+'%';
  const st=+e.target.dataset.stage;
  ticks.forEach((t,k)=>{
    t.className = (st && k===st-1) ? 'on' : ((st && k<st-1) ? 'past' : '');
  });
});},{threshold:[0.55]});
[...deck.children].forEach(s=>io.observe(s));

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){
    e.preventDefault(); deck.children[Math.min(current+1,FLAT.length-1)].scrollIntoView({behavior:'smooth'});
  }
  if(e.key==='ArrowUp'||e.key==='PageUp'){
    e.preventDefault(); deck.children[Math.max(current-1,0)].scrollIntoView({behavior:'smooth'});
  }
  if(e.key==='Escape') idx.classList.remove('open');
});
</script>
