<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Risk, India — Field Cards V01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}


/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.6px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}
.blank{border:1px dashed var(--accent-dim);border-radius:8px;padding:14px 15px;margin:20px 0;background:rgba(224,164,88,.045)}
.blank b{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.blank code{background:none;padding:0;font-size:12.5px;color:var(--ink);line-height:1.85;display:block;white-space:pre-wrap}


/* ---------- ladder & bars ---------- */
.ladder{display:flex;gap:4px;margin:8px 0 4px}
.ladder div{flex:1;padding:9px 5px;border-radius:5px;background:var(--raise);border:1px solid var(--line);text-align:center;font-size:11px;line-height:1.35}
.ladder div b{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink);letter-spacing:.06em;margin-bottom:3px}
.ladder div.w{border-color:var(--accent-dim);background:rgba(224,164,88,.09)}
.ladder div.w b{color:var(--accent)}
.ladder div.d{border-color:var(--warn);background:rgba(201,123,107,.11)}
.ladder div.d b{color:var(--warn)}
.axis{display:flex;gap:4px;margin-bottom:14px}
.axis span{flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:.05em}
.bars{margin:6px 0}
.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
@media(max-width:430px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
.row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
.row:hover .t{color:var(--accent)}
.row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
.row .t{color:var(--ink);font-size:15px;transition:color .15s}
.row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>

<script>
const P = {
title:"Credit Risk, India",
sub:"The reasoning layer. What every measure means, why the rulebook says what it says, and what changes on 1 April 2027.",
missions:[

/* ============ 01 ============ */
{n:"01",title:"The one question",stage:"Ground",
bullets:["What the whole field is actually asking","The loss equation, and where every job sits on it","Expected against unexpected loss","Why provisions and capital are different things"],
cards:[
{l:"ORIENT",t:"The question",h:"Will it be paid <em>back</em>?",b:`<p>Every model, regulation, committee and job title in this field exists to answer one question about one loan, and then the same question about millions at once.</p>
<div class="note" style="font-size:16.5px;color:var(--ink);border-left-color:var(--accent)">How much of this money will not come back, and how certain is that number?</div>
<p>Two halves, and they are not the same question. The first is an estimate. The second is the estimate's reliability — and the second is where capital, regulation and most careers actually live.</p>
<div class="note">This pack carries the reasoning. The code for every measure in it is in the Python pack, Mission 13. Nothing here is repeated there, and nothing there is repeated here.</div>`},

{l:"MECHANISM",t:"The equation",h:"Three numbers, <em>multiplied</em>",b:`<p>Expected loss reduces to three quantities. Every retail and corporate credit model in existence is an attempt to estimate one of them.</p>
<div class="dg"><div class="dg-t">Expected Loss</div>
<div class="flow">
<div class="n"><b>PD — probability of default</b>The chance the borrower stops paying. A number between 0 and 1</div>
<div class="a">&times;</div>
<div class="n"><b>LGD — loss given default</b>The proportion not recovered afterwards, after collateral and collections</div>
<div class="a">&times;</div>
<div class="n"><b>EAD — exposure at default</b>How much is actually owed at the moment it fails</div>
<div class="a">&#61;</div>
<div class="n"><b>EL — expected loss</b>The amount expected to be lost, in currency</div>
</div></div>
<div class="note">A loan of ₹10,00,000 with a 2% PD, 60% LGD and full drawdown gives an expected loss of ₹12,000. Not a prediction that this loan loses ₹12,000 — it either defaults or it does not. It is what a very large book of identical loans would average.</div>`},

{l:"WHY",t:"Expected and unexpected",h:"The distinction that explains <em>everything</em>",b:`<p>Expected loss is the average. Actual losses vary around it, sometimes violently. That variation is <span class="k">unexpected loss</span>, and the two are handled by completely different mechanisms.</p>
<div class="two"><div><b>Expected loss</b>Anticipated, so it is a cost of doing business. Covered by <strong>provisions</strong>, and priced into the interest rate charged.</div>
<div><b>Unexpected loss</b>The bad year. Not predictable, so it cannot be provisioned for. Covered by <strong>capital</strong> — the shareholders' money that absorbs it.</div></div>
<div class="note">This is the single most useful distinction in the field. Provisions are an accounting matter answering "what do we expect to lose". Capital is a solvency matter answering "what if it is much worse than expected". Confusing them is the most common error in the whole subject.</div>`},

{l:"PICTURE",t:"The distribution",h:"Where each one <em>sits</em>",b:`<div class="dg"><div class="dg-t">Loss distribution of a portfolio</div>
<svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
<path d="M15,125 C60,125 70,35 105,35 C140,35 155,95 200,112 C250,128 290,124 325,125" fill="none" stroke="#8A6634" stroke-width="1.6"/>
<line x1="105" y1="35" x2="105" y2="130" stroke="#E0A458" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="240" y1="122" x2="240" y2="130" stroke="#C97B6B" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="15" y1="130" x2="330" y2="130" stroke="#26262C" stroke-width="1"/>
<text x="108" y="30" fill="#E0A458" font-size="9" font-family="monospace">EL — average</text>
<text x="196" y="118" fill="#C97B6B" font-size="9" font-family="monospace">99.9th percentile</text>
<text x="15" y="145" fill="#84837E" font-size="8.5" font-family="monospace">no loss</text>
<text x="278" y="145" fill="#84837E" font-size="8.5" font-family="monospace">severe loss</text>
</svg></div>
<p>The curve is not symmetric. Most years cluster near the average; a long thin tail runs right, where rare and severe years live.</p>
<div class="note">Provisions cover the region up to the dashed amber line. Capital covers the distance from there out to the far marker. Regulators set that far marker — under Basel it is calibrated to a 99.9% confidence level over one year.</div>`},

{l:"WHY",t:"The three parties",h:"Who wants <em>what</em>",b:`<table>
<tr><td>The business</td><td>Wants to lend more. Growth, market share, yield. Pushes for looser cut-offs.</td></tr>
<tr><td>Risk</td><td>Wants losses within appetite. Independent by design, and the tension with the business is structural rather than a failure.</td></tr>
<tr><td>The regulator</td><td>Wants the bank to survive a bad year and depositors to be repaid. Sets the floor beneath both.</td></tr>
</table>
<div class="note">Almost every question about why a rule exists resolves by asking which of these three wrote it and what they were afraid of. This is the most useful interpretive habit in the subject.</div>`},

{l:"RECALL",t:"Mission 01",h:"Ground",b:`<ul>
<li>The question: <strong>how much will not come back, and how certain is that</strong>.</li>
<li><strong>EL = PD × LGD × EAD</strong>.</li>
<li><strong>Expected loss → provisions.</strong> Priced into the rate.</li>
<li><strong>Unexpected loss → capital.</strong> The bad year, absorbed by shareholders.</li>
<li>Confusing provisions and capital is the field's most common error.</li>
<li>Business, risk and regulator want different things, and the tension is by design.</li>
</ul>`}
]},

/* ============ 02 ============ */
{n:"02",title:"The three components",stage:"Measurement",
bullets:["What default actually means, legally","PD, and the two flavours that are not interchangeable","LGD and what drives recovery","EAD, and why undrawn limits matter"],
cards:[
{l:"DEFINE",t:"Default",h:"A date, not a <em>judgement</em>",b:`<p>Every number in this field rests on a definition of default, and it is a mechanical test rather than an opinion.</p>
<p>The near-universal standard, and the Indian one: <strong>90 days past due</strong>. Interest or principal overdue for more than 90 days makes the account non-performing.</p>
<div class="note">Definitions must be identical across the model, the accounting and the regulatory return, or the numbers cannot be reconciled. A model trained on a 60-day definition and reported against a 90-day rule produces figures that are wrong in a way nobody can trace.</div>`},

{l:"MECHANISM",t:"PD",h:"Two kinds, not <em>interchangeable</em>",b:`<div class="two"><div><b>Point-in-time (PIT)</b>The probability of default given conditions right now. Moves with the economy — rises in a downturn, falls in a boom. Used for <strong>ECL provisioning</strong>.</div>
<div><b>Through-the-cycle (TTC)</b>A long-run average across good and bad years. Deliberately stable. Used for <strong>regulatory capital</strong>.</div></div>
<p>Both describe the same borrower. They answer different questions, and swapping one for the other produces a number that is confidently wrong.</p>
<div class="note">The reasoning behind the split: provisions should react to the cycle, because a loss becoming more likely should be recognised now. Capital should not, because capital that collapses in a boom and spikes in a crash amplifies the cycle rather than cushioning it.</div>`},

{l:"MECHANISM",t:"LGD",h:"What is <em>not</em> recovered",b:`<p>Given default, how much is permanently lost after everything collectable has been collected.</p>
<div class="code" data-cap="definition"><pre>
LGD = 1 - (recoveries - collection costs) / exposure at default
</pre></div>
<p>Four things move it, and only the first is usually discussed:</p>
<ul>
<li><strong>Collateral</strong> — its value, and more importantly whether it can actually be seized and sold</li>
<li><strong>Seniority</strong> — position in the queue when there is not enough to go round</li>
<li><strong>Time</strong> — recovery two years out is worth less than recovery today, and legal process in India is slow</li>
<li><strong>Cost</strong> — legal, collection and servicing costs come out of the recovery, not out of nothing</li>
</ul>
<div class="note">Downturn LGD is a separate and higher figure. Collateral is worth least at exactly the moment most borrowers are defaulting — which is precisely when it must be sold. Regulators require the downturn figure for capital for this reason.</div>`},

{l:"MECHANISM",t:"EAD",h:"How much is owed <em>then</em>",b:`<p>For a term loan with a fixed schedule, EAD is close to the outstanding balance and is nearly uninteresting.</p>
<p>For anything with an undrawn limit — a credit card, an overdraft, a cash-credit facility — it is a genuine modelling problem, because borrowers heading into distress <strong>draw down harder</strong>.</p>
<div class="dg"><div class="dg-t">Credit conversion factor</div>
<div class="flow">
<div class="n"><b>Drawn</b>Already borrowed. Fully exposed</div>
<div class="a">&#43;</div>
<div class="n"><b>Undrawn &times; CCF</b>The share of the unused limit expected to be drawn before default</div>
<div class="a">&#61;</div>
<div class="n"><b>EAD</b>Expected exposure at the moment of default</div>
</div></div>
<div class="note">A card with ₹1,00,000 outstanding on a ₹5,00,000 limit is not a ₹1,00,000 exposure. A distressed customer draws the rest. That behaviour is what the CCF captures, and underestimating it is a well-documented way to be surprised.</div>`},

{l:"THE HARD QUESTION",t:"The weak link",h:"Which component is <em>least</em> trustworthy?",b:`<p>PD attracts nearly all the modelling attention — the scorecards, the machine learning, the validation. It is also the component with the most data behind it, because defaults are frequent enough to model.</p>
<p>LGD is the weak link, and it is rarely challenged:</p>
<ul>
<li>Far fewer observations — only defaulted accounts contribute</li>
<li>Recoveries take years, so recent defaults have incomplete outcomes</li>
<li>Heavily dependent on legal process, which changes</li>
<li>Collateral valuations are estimates layered on estimates</li>
</ul>
<div class="note">Expected loss is a product. A 20% error in LGD moves the answer exactly as much as a 20% error in PD — but receives a fraction of the scrutiny. That asymmetry is worth naming before someone else names it.</div>`},

{l:"RECALL",t:"Mission 02",h:"Components",b:`<ul>
<li><strong>Default = 90 days past due.</strong> Mechanical, and must match across model, accounts and returns.</li>
<li><strong>PIT PD</strong> moves with the cycle → provisions. <strong>TTC PD</strong> is stable → capital.</li>
<li><strong>LGD</strong> driven by collateral, seniority, time and cost. Downturn LGD is higher.</li>
<li><strong>EAD</strong> = drawn + undrawn × CCF. Distressed borrowers draw down.</li>
<li>LGD is the least scrutinised component and matters as much as PD.</li>
</ul>`}
]},

/* ============ 03 ============ */
{n:"03",title:"Origination",stage:"Retail",
bullets:["The decision, and the two ways to be wrong","Bureau data and what it actually shows","Scorecards, and why old technology persists","Reject inference, the problem nobody solves"],
cards:[
{l:"MECHANISM",t:"The decision",h:"Two errors, <em>different</em> costs",b:`<div class="two"><div><b>Approve a bad loan</b>The loss is visible, attributable, and lands in a provisioning line someone must explain.</div>
<div><b>Decline a good loan</b>The lost margin is invisible. Nobody is ever blamed for it, and no report contains it.</div></div>
<p>The costs are asymmetric in reality and far more asymmetric in how they are perceived. That asymmetry drives real institutional behaviour towards caution beyond what the economics justify.</p>
<div class="note">Which is why the cut-off is set by the business against a risk appetite, not by the model. A model produces a ranking. Choosing where to cut it is a commercial decision about the relative price of the two errors.</div>`},

{l:"DEFINE",t:"The bureau",h:"What CIBIL actually <em>shows</em>",b:`<p>India's credit bureaus — CIBIL, Experian, Equifax, CRIF High Mark — hold repayment history reported by lenders. The score is a summary of that history, not an assessment of the person.</p>
<table>
<tr><td>What it shows</td><td>Existing exposure, repayment behaviour, enquiries, defaults, settlements, days past due</td></tr>
<tr><td>What it misses</td><td>Income, employment stability, informal borrowing, anyone with no credit history at all</td></tr>
</table>
<div class="note">The last point is the structural one in India. A borrower with no bureau record is not low-risk or high-risk — they are <span class="k">unscorable</span>, and a large share of the addressable population sits there. Alternative data exists to address this, and every approach to it carries fairness questions that are not settled.</div>`},

{l:"MECHANISM",t:"Scorecards",h:"Why the <em>old</em> technology survives",b:`<p>An application scorecard is usually logistic regression on binned variables. Gradient boosting would score better on almost every dataset. Scorecards remain dominant, for four reasons that have nothing to do with accuracy.</p>
<ul>
<li><strong>Explainable</strong> — a declined applicant can be told which factors drove it</li>
<li><strong>Defensible</strong> — a regulator can follow the logic end to end</li>
<li><strong>Stable</strong> — binning limits the damage a strange input value can do</li>
<li><strong>Monotonic</strong> — each factor moves the score in one direction, which can be checked against sense</li>
</ul>
<div class="note">This is the recurring trade in regulated lending: a small amount of predictive power exchanged for the ability to explain a decision to a regulator, a court or a customer. Anyone arguing purely on model performance has misread the constraint.</div>`},

{l:"TRAP",t:"Reject inference",h:"Training on the <em>survivors</em>",b:`<p>A scorecard is built on accounts that were approved. Their outcomes are known. Rejected applicants have no outcome, because they were never lent to.</p>
<p>So the model learns the relationship between characteristics and default <em>within the population the previous policy already let through</em> — and is then used to judge everyone.</p>
<div class="flow">
<div class="n"><b>The distortion</b>Applicants the old rule rejected are absent from training, so the new model cannot learn they would have been fine</div>
<div class="a">&#8595;</div>
<div class="n"><b>The consequence</b>Each generation of scorecard inherits and hardens the previous policy's blind spots</div>
</div>
<div class="note">Techniques exist — parcelling, augmentation, and occasionally deliberately approving a small random sample below the cut-off to generate honest data. None fully solves it. The last is the only one that actually creates new information, and it costs real money by design.</div>`},

{l:"RECALL",t:"Mission 03",h:"Origination",b:`<ul>
<li>Approving a bad loan is visible; declining a good one is not. The asymmetry drives behaviour.</li>
<li>The model ranks; the <strong>business sets the cut-off</strong>.</li>
<li>Bureau data shows behaviour, not capacity — and misses the <strong>unscorable</strong> entirely.</li>
<li>Scorecards persist for explainability, defensibility, stability and monotonicity.</li>
<li><strong>Reject inference</strong>: models train on survivors and inherit the old policy's blind spots.</li>
</ul>`}
]},

/* ============ 04 ============ */
{n:"04",title:"The Indian ladder",stage:"RBI",
bullets:["SMA and NPA, with the exact day counts","The post-default grades","How provisioning rises down the ladder","The rules that close the loopholes"],
cards:[
{l:"PICTURE",t:"The ladder",h:"Every account, one <em>rung</em>",b:`<p>The Indian classification system is a ladder measured in days overdue. It is mechanical, day-end stamped, and the foundation of every regulatory return.</p>
<div class="dg"><div class="dg-t">Days past due</div>
<div class="axis"><span>0</span><span>31</span><span>61</span><span>91+</span></div>
<div class="ladder">
<div><b>SMA-0</b>up to 30 days, or signs of stress</div>
<div class="w"><b>SMA-1</b>31&ndash;60 days</div>
<div class="w"><b>SMA-2</b>61&ndash;90 days</div>
<div class="d"><b>NPA</b>over 90 days</div>
</div></div>
<p>The three SMA rungs are the early-warning system. Nothing has failed yet — the account is being watched, and reported.</p>
<div class="note">SMA-2 exposures above ₹5 crore are reported to <span class="k">CRILC</span>, the central repository. Which means stress at one lender becomes visible to every other lender, and to the regulator, before it becomes a default.</div>`},

{l:"MECHANISM",t:"After 90 days",h:"The three grades <em>below</em>",b:`<p>Crossing 90 days makes an account non-performing. It then continues to deteriorate through three further grades, on time elapsed rather than on fresh events.</p>
<table>
<tr><td>Sub-standard</td><td>NPA for up to 12 months</td></tr>
<tr><td>Doubtful</td><td>NPA for more than 12 months. Sub-graded by age: <strong>D1</strong> up to a year in doubtful, <strong>D2</strong> one to three years, <strong>D3</strong> beyond three</td></tr>
<tr><td>Loss</td><td>Identified as uncollectable by the bank, its auditors or an RBI inspection, but not yet written off</td></tr>
</table>
<div class="note">Serious impairment short-circuits the ladder. Where the realisable value of security falls below half the assessed value, the account can go straight to doubtful; below a tenth, security is disregarded entirely and it goes straight to loss. Fraud has the same effect.</div>`},

{l:"PICTURE",t:"Provisioning",h:"Rising down the <em>ladder</em>",b:`<p>Each rung carries a higher provision. The shape matters more than any single figure.</p>
<div class="dg"><div class="dg-t">Indicative provisioning, secured exposure</div>
<div class="bars">
<div class="r"><em>Standard</em><i style="width:4%"></i><u>&lt;1%</u></div>
<div class="r"><em>Sub-standard</em><i style="width:15%"></i><u>~15%</u></div>
<div class="r"><em>Doubtful D1</em><i style="width:25%"></i><u>~25%</u></div>
<div class="r"><em>Doubtful D2</em><i style="width:40%"></i><u>~40%</u></div>
<div class="r"><em>Doubtful D3</em><i class="hi" style="width:100%"></i><u>100%</u></div>
<div class="r"><em>Loss</em><i class="hi" style="width:100%"></i><u>100%</u></div>
</div></div>
<div class="note"><strong>Indicative only.</strong> Rates differ for secured and unsecured portions, vary by sector for standard assets, and are revised periodically. The current master circular is the authority — these figures show the shape of the curve, not the values to quote.</div>`},

{l:"MECHANISM",t:"The anti-gaming rules",h:"Where the <em>loopholes</em> were closed",b:`<p>Three rules exist purely because the obvious workarounds were being used.</p>
<table>
<tr><td>Day-end stamping</td><td>Classification runs automatically at the close of each day. It cannot be deferred to a reporting date or adjusted by hand.</td></tr>
<tr><td>Full-clearance upgrade</td><td>An NPA returns to standard only when the <strong>entire</strong> arrears of interest and principal are paid. A part-payment moves nothing.</td></tr>
<tr><td>Borrower-level</td><td>All facilities of one borrower carry the same classification. One loan cannot stay standard while another to the same borrower is 90 days overdue.</td></tr>
</table>
<div class="note">Every one of these describes a behaviour that happened. Reading a regulation as a description of past misconduct is usually the fastest way to understand why it is worded the way it is.</div>`},

{l:"NUMBERS",t:"NBFCs",h:"The glide path, now <em>complete</em>",b:`<p>Non-banking financial companies converged on the same standard on a deliberately slow timetable, and that convergence is now finished.</p>
<ul>
<li>The NBFC IRACP Directions, 2025 took effect on <strong>28 November 2025</strong>, consolidating the rules into one framework</li>
<li>From <strong>31 March 2026</strong>, the 90-day NPA norm applies to every NBFC, completing a glide path that began in 2022</li>
</ul>
<div class="note">Historically NBFCs recognised NPAs later than banks, which made their reported asset quality look structurally better than a bank's on identical lending. That gap is now closed, and comparisons across older periods still carry it.</div>`},

{l:"RECALL",t:"Mission 04",h:"The ladder",b:`<ul>
<li><strong>SMA-0</strong> up to 30 · <strong>SMA-1</strong> 31&ndash;60 · <strong>SMA-2</strong> 61&ndash;90 · <strong>NPA</strong> over 90.</li>
<li>SMA-2 above ₹5 crore is reported to <strong>CRILC</strong>.</li>
<li>Sub-standard ≤12 months · Doubtful beyond, graded D1/D2/D3 · Loss.</li>
<li>Provisioning rises down the ladder; confirm exact rates against the current circular.</li>
<li>Day-end stamping · full-clearance upgrade · borrower-level classification.</li>
<li>NBFCs at the 90-day norm since <strong>31 March 2026</strong>.</li>
</ul>`}
]},

/* ============ 05 ============ */
{n:"05",title:"The ECL transition",stage:"RBI 2027",
bullets:["The largest change to Indian provisioning in decades","Three stages and the SICR test","What is final, what is dated, what is estimated","Who it applies to, and who it does not"],
cards:[
{l:"ORIENT",t:"The change",h:"From <em>incurred</em> to expected",b:`<p>The ladder in Mission 04 is an <span class="k">incurred loss</span> system. Provision follows evidence: something has gone wrong, days have accumulated, provision is made.</p>
<p><span class="k">Expected credit loss</span> inverts this. Provision is made at origination, for losses expected over the future, before anything at all has gone wrong.</p>
<div class="two"><div><b>Incurred</b>Waits for deterioration. Simple, objective, and structurally late — the criticism after 2008 was that it recognised losses only once they were unavoidable.</div>
<div><b>Expected</b>Forward-looking. Recognises stress early. Requires models, judgement and scenarios — and therefore requires governance.</div></div>`},

{l:"NUMBERS",t:"The facts",h:"Dated, and <em>final</em>",b:`<table>
<tr><td>Instrument</td><td>RBI (Commercial Banks — Asset Classification, Provisioning and Income Recognition) Directions, 2026</td></tr>
<tr><td>Draft issued</td><td>7 October 2025</td></tr>
<tr><td>Final issued</td><td>27 April 2026</td></tr>
<tr><td>Effective</td><td><strong>1 April 2027</strong></td></tr>
<tr><td>Applies to</td><td>Commercial banks, corresponding new banks, and SBI</td></tr>
<tr><td>Excludes</td><td>Small finance banks, payments banks, local area banks, regional rural banks</td></tr>
</table>
<div class="note">The RBI declined industry requests to delay. The date is firm, which means every affected bank is mid-programme right now — and that is why this material is worth more today than it will be in three years.</div>`},

{l:"PICTURE",t:"The staging",h:"Three stages, one <em>test</em>",b:`<div class="dg"><div class="dg-t">ECL staging</div>
<div class="ladder">
<div><b>Stage 1</b>Performing<br><span style="color:var(--muted)">12-month ECL</span></div>
<div class="w"><b>Stage 2</b>Significant increase in credit risk<br><span style="color:var(--muted)">Lifetime ECL</span></div>
<div class="d"><b>Stage 3</b>Credit-impaired<br><span style="color:var(--muted)">Lifetime ECL</span></div>
</div></div>
<p>Stage 1 provisions only for defaults expected in the next twelve months. Stage 2 and 3 provision for losses expected over the <strong>entire remaining life</strong> of the instrument.</p>
<div class="note">The jump from Stage 1 to Stage 2 is therefore a cliff, not a slope. A single classification change can multiply the provision on an exposure several times over without any payment being missed. This is the mechanic that drives the whole transition impact.</div>`},

{l:"MECHANISM",t:"SICR",h:"The judgement at the <em>centre</em>",b:`<p>Everything turns on one test: has credit risk increased <strong>significantly</strong> since the instrument was first recognised?</p>
<p>Not "is it bad" — is it <em>materially worse than it was when written</em>. A loan originated as high-risk and still performing as expected has not experienced a significant increase.</p>
<div class="flow">
<div class="n"><b>No significant increase</b>Stage 1. Loss allowance based on 12-month expected credit losses</div>
<div class="a">&#8595;</div>
<div class="n"><b>Significant increase, not yet impaired</b>Stage 2. Lifetime expected credit losses</div>
<div class="a">&#8595;</div>
<div class="n"><b>Credit-impaired</b>Stage 3. Lifetime, with interest computed on the net carrying amount</div>
</div>
<div class="note">SICR is where the discretion lives, and therefore where supervisors look hardest. A bank whose Stage 2 population is conspicuously small relative to peers will be asked to defend its thresholds.</div>`},

{l:"MECHANISM",t:"Mechanics",h:"Discounting, floors, POCI",b:`<ul>
<li><strong>Discounting.</strong> For instruments originated on or after 1 April 2027, ECL is computed using the effective interest rate determined at initial recognition. For credit-impaired assets, a credit-adjusted EIR is used.</li>
<li><strong>The opening balance.</strong> ECL as at 1 April 2027 is computed from the position at 31 March 2027, and may use the contractual interest rate as the discounting factor in the interim.</li>
<li><strong>Prudential floors.</strong> Model output is not accepted unbounded. Floors sit beneath it, so a bank cannot model its way to an implausibly low provision.</li>
<li><strong>POCI.</strong> Assets purchased or originated already credit-impaired are handled separately, and were clarified between draft and final.</li>
</ul>
<div class="note">Prudential floors are the tell. The RBI is adopting a model-based framework while explicitly declining to trust models alone — which is a reasonable summary of its posture throughout.</div>`},

{l:"NUMBERS",t:"The impact",h:"What is <em>estimated</em>, not decreed",b:`<p>Clearly separated from the rules above, because these are analyst projections rather than regulatory statements.</p>
<ul>
<li>Higher upfront provisioning, concentrated in <strong>unsecured retail, MSME and corporate</strong> exposures</li>
<li>Public sector and mid-tier private banks more affected; large private banks better cushioned</li>
<li>Estimated capital impact of roughly <strong>60&ndash;80 basis points</strong>, spread over four years</li>
<li>Estimated profitability impact in the region of <strong>₹50,000&ndash;60,000 crore</strong></li>
<li>Transition permitted through reserves as a one-time adjustment, amortised over four years</li>
</ul>
<div class="note">The one-time hit goes through reserves. The ongoing effect — the annual run-rate increase from accounts overdue by less than 90 days — flows through profit and loss. That second part is the durable change, and it is the part most often overlooked.</div>`},

{l:"THE HARD QUESTION",t:"Discretion",h:"Does forward-looking mean <em>better</em>?",b:`<p>The case for ECL is strong and mostly settled. The honest objection is worth being able to state.</p>
<p>Incurred loss was late, but it was <strong>objective</strong>. Days overdue is a fact. ECL is timely, but it introduces judgement at the exact point where a bank has the strongest incentive to be optimistic — and it does so through models whose assumptions are opaque to almost every reader of the accounts.</p>
<div class="note">Which is why prudential floors, external validation and model governance are not administrative additions to this framework. They are what makes the discretion survivable, and they are the reason Mission 11 exists.</div>`},

{l:"RECALL",t:"Mission 05",h:"ECL",b:`<ul>
<li>Final Directions <strong>27 April 2026</strong>, effective <strong>1 April 2027</strong>. Not delayed.</li>
<li>Commercial banks, corresponding new banks, SBI. Not SFBs, payments banks, local area banks, RRBs.</li>
<li><strong>Stage 1</strong> 12-month · <strong>Stage 2</strong> lifetime on SICR · <strong>Stage 3</strong> lifetime, impaired.</li>
<li>The Stage 1 to 2 move is a <strong>cliff</strong>, not a slope.</li>
<li>EIR discounting; credit-adjusted EIR for impaired; prudential floors beneath model output.</li>
<li>One-time hit through reserves over four years; the run-rate flows through P&amp;L.</li>
</ul>`}
]},

/* ============ 06 ============ */
{n:"06",title:"Building a PD model",stage:"Modelling",
bullets:["The performance window, and how it is chosen","Ranking against calibration","Reading the standard measures","Where models actually fail"],
cards:[
{l:"MECHANISM",t:"The windows",h:"Two periods, chosen <em>deliberately</em>",b:`<div class="dg"><div class="dg-t">Observation and performance</div>
<div class="flow">
<div class="n"><b>Observation point</b>The moment the characteristics are taken — application date, or a month-end for a behavioural model</div>
<div class="a">&#8595;</div>
<div class="n"><b>Performance window</b>The period afterwards in which default is observed. Typically twelve months</div>
<div class="a">&#8595;</div>
<div class="n"><b>The label</b>Did this account default within that window</div>
</div></div>
<p>The window is chosen from the data, not by convention. Plot the cumulative default rate by months on book: it rises steeply, then flattens. The window should reach the flattening.</p>
<div class="note">Too short and most eventual defaults are labelled good. Too long and recent accounts have no complete outcome, so the model can only be trained on stale data.</div>`},

{l:"WHY",t:"Two different jobs",h:"Ranking and <em>calibration</em>",b:`<div class="two"><div><b>Discrimination</b>Does the model put riskier accounts above safer ones? Measured by AUC, Gini, KS. Needed for <strong>decisions</strong> — approve, decline, price.</div>
<div><b>Calibration</b>Is a predicted 3% actually 3% in reality? Measured by comparing predicted against observed by band. Needed for <strong>provisions and capital</strong>.</div></div>
<p>A model can rank perfectly and be badly calibrated — every prediction wrong by a constant factor, in the right order.</p>
<div class="note">For a cut-off decision, ranking is nearly everything. For ECL, calibration <em>is</em> the answer, because the provision is the probability multiplied by money. This distinction separates people who have used these models from people who have read about them.</div>`},

{l:"PICTURE",t:"KS",h:"Where separation is <em>widest</em>",b:`<div class="dg"><div class="dg-t">Cumulative distributions</div>
<svg viewBox="0 0 340 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
<line x1="30" y1="135" x2="325" y2="135" stroke="#26262C"/>
<line x1="30" y1="20" x2="30" y2="135" stroke="#26262C"/>
<path d="M30,135 C110,60 180,32 325,20" fill="none" stroke="#C97B6B" stroke-width="1.7"/>
<path d="M30,135 C140,122 230,90 325,20" fill="none" stroke="#7FA88A" stroke-width="1.7"/>
<line x1="150" y1="46" x2="150" y2="115" stroke="#E0A458" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="150" cy="46" r="2.4" fill="#C97B6B"/><circle cx="150" cy="115" r="2.4" fill="#7FA88A"/>
<text x="157" y="80" fill="#E0A458" font-size="9.5" font-family="monospace">KS</text>
<text x="235" y="45" fill="#C97B6B" font-size="8.5" font-family="monospace">bad</text>
<text x="243" y="105" fill="#7FA88A" font-size="8.5" font-family="monospace">good</text>
<text x="30" y="151" fill="#84837E" font-size="8" font-family="monospace">worst scores</text>
<text x="262" y="151" fill="#84837E" font-size="8" font-family="monospace">best</text>
</svg></div>
<p>Both curves run from nothing to everything. The bad accounts accumulate faster at the low-score end, because that is what a working model does. KS is the widest vertical gap between them.</p>
<div class="note">KS also identifies <em>where</em> the model separates best, which is operationally useful — that score region is the natural place to set a cut-off. Gini and AUC give a single number for the whole curve and hide this.</div>`},

{l:"NUMBERS",t:"Reading the numbers",h:"What counts as <em>good</em>",b:`<table>
<tr><td>Gini</td><td><code>2 × AUC − 1</code>. A rescaling, not a separate measure.</td></tr>
<tr><td>Retail application</td><td>Gini roughly 0.35&ndash;0.55 is a normal working range.</td></tr>
<tr><td>Behavioural</td><td>Higher — repayment history is strongly predictive. 0.60+ is common.</td></tr>
<tr><td>Suspiciously high</td><td>Gini above 0.85 on an application model usually means leakage, not brilliance.</td></tr>
</table>
<div class="note">Ranges are indicative and vary enormously by portfolio, geography and definition. Their real use is as a smell test: a number far outside the expected band is a prompt to check the data before celebrating or despairing.</div>`},

{l:"TRAP",t:"Leakage",h:"The variable that already <em>knows</em>",b:`<p>The most common cause of an implausibly strong model: a feature that encodes the outcome.</p>
<ul>
<li>A collections flag, set only after the account went bad</li>
<li>A field updated at default rather than frozen at the observation point</li>
<li>Restructuring markers</li>
<li>A behavioural variable computed over a window that overlaps the performance window</li>
</ul>
<div class="note">The test is temporal, not statistical: <strong>was this value knowable at the observation point?</strong> Anything that was not is leakage, however sensible the variable looks. Feature importance is the fastest place to spot it — a single variable dominating is the signature.</div>`},

{l:"RECALL",t:"Mission 06",h:"PD modelling",b:`<ul>
<li>Observation point, then a <strong>performance window</strong> chosen where cumulative defaults flatten.</li>
<li><strong>Discrimination</strong> for decisions; <strong>calibration</strong> for provisions and capital.</li>
<li><strong>KS</strong> shows where separation is widest; Gini and AUC give one number for the whole curve.</li>
<li>Gini above ~0.85 on an application model means check for leakage.</li>
<li>Leakage test: <strong>was this knowable at the observation point?</strong></li>
</ul>`}
]}
,
/* ============ 07 ============ */
{n:"07",title:"Recovery and exposure",stage:"Modelling",
bullets:["Why LGD resists modelling","Collateral, and what it is worth in practice","Cure rates and the workout period","Modelling drawdown behaviour"],
cards:[
{l:"WHY",t:"The hard one",h:"Why LGD <em>resists</em> modelling",b:`<p>PD has millions of observations and a clean binary outcome. LGD has neither.</p>
<ul>
<li>Only defaulted accounts contribute, so the sample is a small fraction of the book</li>
<li>The outcome is a proportion between 0 and 1, and it clusters at both ends rather than spreading evenly</li>
<li>Recovery takes years, so recent defaults are incomplete and the complete ones are old</li>
<li>It depends on legal process, court capacity and enforcement, none of which is in the data</li>
</ul>
<div class="note">The bimodal shape matters. Most defaults recover almost everything or almost nothing; the middle is thin. An average LGD of 45% may describe a population where hardly any account loses 45%. Modelling the mean of a two-humped distribution produces a number that describes nobody.</div>`},

{l:"MECHANISM",t:"Collateral",h:"Three haircuts, not <em>one</em>",b:`<p>The stated value of security is the beginning of the calculation, not the end.</p>
<div class="dg"><div class="dg-t">From valuation to recovery</div>
<div class="flow">
<div class="n"><b>Assessed value</b>What the valuer said, at origination</div>
<div class="a">&#8595;</div>
<div class="n"><b>Less market movement</b>And values fall hardest in exactly the conditions that cause defaults</div>
<div class="a">&#8595;</div>
<div class="n"><b>Less enforceability</b>Whether it can actually be seized. Title defects, occupancy, disputed possession</div>
<div class="a">&#8595;</div>
<div class="n"><b>Less time and cost</b>Legal expense, and the discount for recovering years later</div>
</div></div>
<div class="note">In India the enforceability step dominates. The SARFAESI route is materially faster than the courts for secured creditors, and whether an exposure qualifies for it changes realistic LGD far more than a revaluation would.</div>`},

{l:"DEFINE",t:"Cures",h:"Not every default is a <em>loss</em>",b:`<p>A substantial share of accounts that cross 90 days recover without any enforcement. The borrower was travelling, disputed a charge, had a temporary cash gap, or simply paid late.</p>
<p>The <span class="k">cure rate</span> is the proportion that returns to performing. It varies enormously by product — unsecured retail cures at a very different rate from a corporate term loan.</p>
<div class="note">Ignoring cures overstates LGD substantially, because cured accounts enter the denominator as defaults and contribute near-zero loss. Whether cures are included is one of the first things to establish when comparing two LGD figures, and it is frequently not stated.</div>`},

{l:"MECHANISM",t:"Drawdown",h:"Modelling the <em>CCF</em>",b:`<p>For revolving products, EAD is behavioural. The question is how much of an unused limit gets drawn on the path into default.</p>
<div class="flow">
<div class="n"><b>Look back</b>Take accounts that defaulted. Find their utilisation twelve months earlier</div>
<div class="a">&#8595;</div>
<div class="n"><b>Measure</b>What proportion of the then-undrawn limit had been drawn by default</div>
<div class="a">&#8595;</div>
<div class="n"><b>Segment</b>CCF differs sharply by product, by current utilisation, and by time to default</div>
</div>
<div class="note">The strongest predictor is existing utilisation. An account already at 90% of its limit has little room left, so its CCF is low. An account at 20% has room, and a distressed borrower uses it. This produces the counter-intuitive result that low-utilisation accounts can carry higher exposure risk.</div>`},

{l:"RECALL",t:"Mission 07",h:"Recovery",b:`<ul>
<li>LGD is sparse, slow, legally dependent, and <strong>bimodal</strong> — the mean often describes nobody.</li>
<li>Collateral loses value to market movement, <strong>enforceability</strong>, time and cost.</li>
<li>In India, enforceability dominates; SARFAESI eligibility changes realistic LGD.</li>
<li><strong>Cure rate</strong>: many defaults recover. Excluding cures overstates LGD.</li>
<li>CCF is driven by current utilisation — low utilisation, higher CCF.</li>
</ul>`}
]},

/* ============ 08 ============ */
{n:"08",title:"The portfolio view",stage:"Portfolio",
bullets:["Why the sum is riskier than the parts","Vintage and roll rates","Concentration, and the limits that follow","Reading a portfolio without a model"],
cards:[
{l:"WHY",t:"Correlation",h:"The whole is riskier than the <em>parts</em>",b:`<p>Add up the expected losses of every loan and the total is correct. Add up the <em>risks</em> and the total is badly wrong, because defaults are not independent.</p>
<p>Borrowers share exposure to the same conditions — an interest rate rise, a monsoon, a sector downturn, a regional employment shock. When one defaults, others become more likely to.</p>
<div class="note">This is the entire justification for portfolio-level capital. If defaults were independent, a large book would be nearly riskless by diversification alone and almost no capital would be required. They are not, and the correlation is what capital is held against.</div>`},

{l:"PICTURE",t:"Roll rates",h:"Flow between <em>buckets</em>",b:`<p>A roll-rate matrix shows what proportion of accounts in each bucket moves to each other bucket next month. It is the most information-dense single view of a retail portfolio.</p>
<div class="dg"><div class="dg-t">Monthly transition, illustrative</div>
<table style="margin:0;font-size:12px">
<tr><td style="width:20%;color:var(--muted);font-weight:400">from &#8595; to &#8594;</td><td style="color:var(--muted);font-weight:400">Current</td><td style="color:var(--muted);font-weight:400">1&ndash;30</td><td style="color:var(--muted);font-weight:400">31&ndash;60</td><td style="color:var(--muted);font-weight:400">61&ndash;90</td><td style="color:var(--muted);font-weight:400">NPA</td></tr>
<tr><td>Current</td><td>97.8</td><td>2.2</td><td>&ndash;</td><td>&ndash;</td><td>&ndash;</td></tr>
<tr><td>1&ndash;30</td><td>61.0</td><td>13.0</td><td>26.0</td><td>&ndash;</td><td>&ndash;</td></tr>
<tr><td>31&ndash;60</td><td>18.0</td><td>&ndash;</td><td>11.0</td><td>71.0</td><td>&ndash;</td></tr>
<tr><td>61&ndash;90</td><td>7.0</td><td>&ndash;</td><td>&ndash;</td><td>9.0</td><td>84.0</td></tr>
</table></div>
<p>Read across a row: of accounts one to thirty days down, 61% cured, 26% got worse. The deeper the bucket, the lower the cure rate — which is why early collections effort returns far more than late effort.</p>
<div class="note">Roll rates are also a leading indicator. A rise in the current-to-1-30 rate this month becomes an NPA rise three months from now, and it is visible long before the headline number moves.</div>`},

{l:"PICTURE",t:"Vintage",h:"Is <em>new</em> lending worse?",b:`<p>The headline NPA ratio mixes every cohort together and conceals the thing management most needs to know: whether recent underwriting is deteriorating.</p>
<div class="dg"><div class="dg-t">Cumulative default by months on book</div>
<svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
<line x1="30" y1="125" x2="325" y2="125" stroke="#26262C"/>
<line x1="30" y1="15" x2="30" y2="125" stroke="#26262C"/>
<path d="M30,125 C90,105 150,88 320,80" fill="none" stroke="#7FA88A" stroke-width="1.6"/>
<path d="M30,125 C90,98 150,76 320,64" fill="none" stroke="#8A6634" stroke-width="1.6"/>
<path d="M30,125 C90,84 150,52 320,34" fill="none" stroke="#C97B6B" stroke-width="1.8"/>
<text x="270" y="76" fill="#7FA88A" font-size="8.5" font-family="monospace">2024</text>
<text x="270" y="60" fill="#E0A458" font-size="8.5" font-family="monospace">2025</text>
<text x="270" y="30" fill="#C97B6B" font-size="8.5" font-family="monospace">2026</text>
<text x="30" y="141" fill="#84837E" font-size="8" font-family="monospace">0 months</text>
<text x="272" y="141" fill="#84837E" font-size="8" font-family="monospace">24 months</text>
</svg></div>
<div class="note">Compare <strong>down</strong> a column — the same age across different cohorts. The 2026 vintage is worse at every age, which is a real signal. Comparing along a row only shows that older loans have had more time to fail, which is not information.</div>`},

{l:"MECHANISM",t:"Concentration",h:"The failure mode that <em>recurs</em>",b:`<p>Concentration is correlation made visible, and it appears in more dimensions than the obvious one.</p>
<table>
<tr><td>Single borrower</td><td>One large exposure failing. Directly limited by regulation.</td></tr>
<tr><td>Sector</td><td>A book heavy in one industry moves together with that industry.</td></tr>
<tr><td>Geographic</td><td>One region, one local economy, one weather system.</td></tr>
<tr><td>Product</td><td>One product type sharing an identical failure mechanism.</td></tr>
<tr><td>Collateral</td><td>Different loans secured against the same kind of asset, whose value falls at once.</td></tr>
</table>
<div class="note">The last is the least monitored and has repeatedly been the most damaging. A book of well-diversified borrowers all secured on property in one city is a concentrated book, however diversified the borrower list looks.</div>`},

{l:"MOVE",t:"Reading a book",h:"Without building <em>anything</em>",b:`<p>Six views answer most questions about a portfolio before any model is involved.</p>
<ul>
<li><strong>Distribution</strong> — exposure and count by product, by score band, by ticket size</li>
<li><strong>Vintage curves</strong> — is new lending worse than old</li>
<li><strong>Roll rates</strong> — where accounts are flowing, and how fast</li>
<li><strong>Concentration</strong> — largest exposures, top sectors, top regions as a share of the whole</li>
<li><strong>NPA bridge</strong> — opening, plus additions, less recoveries, upgrades and write-offs, closing</li>
<li><strong>Coverage ratio</strong> — provisions held against gross NPA</li>
</ul>
<div class="note">The NPA bridge is the one most often skipped and the most revealing. A flat headline ratio can conceal heavy additions offset by heavy write-offs — a portfolio churning badly while appearing stable.</div>`},

{l:"RECALL",t:"Mission 08",h:"Portfolio",b:`<ul>
<li>Defaults are <strong>correlated</strong>; that correlation is what capital exists for.</li>
<li><strong>Roll rates</strong> show flow, and lead the headline number by months.</li>
<li><strong>Vintage</strong> curves: compare down the column, not along the row.</li>
<li>Concentration hides in sector, geography, product and <strong>collateral type</strong>.</li>
<li>Six views: distribution, vintage, roll rates, concentration, NPA bridge, coverage.</li>
</ul>`}
]},

/* ============ 09 ============ */
{n:"09",title:"Corporate and wholesale",stage:"Corporate",
bullets:["Why the retail toolkit does not transfer","Ratings, and what an analyst actually does","The ratios that carry the weight","Early warning without a bureau score"],
cards:[
{l:"WHY",t:"Different in kind",h:"Not retail with bigger <em>numbers</em>",b:`<table>
<tr><td>Retail</td><td>Millions of small, similar exposures. Statistical. The individual case does not matter; the distribution does.</td></tr>
<tr><td>Corporate</td><td>Hundreds of large, distinct exposures. Analytical. One name failing is a material event on its own.</td></tr>
</table>
<p>The consequence is methodological. A retail scorecard needs thousands of defaults to train on. A corporate portfolio may see a handful of defaults in a year — far too few for the same approach.</p>
<div class="note">So corporate PD comes from <strong>rating systems</strong>: exposures are graded, and each grade carries a default rate drawn from long-run internal and external data. Judgement produces the grade; statistics produce the number attached to it.</div>`},

{l:"MECHANISM",t:"Rating",h:"What the analyst <em>does</em>",b:`<div class="flow">
<div class="n"><b>Financial analysis</b>Spreading three to five years of statements onto a common template so figures are comparable</div>
<div class="a">&#8595;</div>
<div class="n"><b>Business analysis</b>Industry position, competition, management quality, promoter track record, group structure</div>
<div class="a">&#8595;</div>
<div class="n"><b>Model grade</b>A scorecard combines the quantitative inputs into an indicative grade</div>
<div class="a">&#8595;</div>
<div class="n"><b>Override</b>The analyst may move the grade, with documented reasons</div>
<div class="a">&#8595;</div>
<div class="n"><b>Committee</b>Final grade approved, and the override rate is itself monitored</div>
</div>
<div class="note">Override rates are a governance metric in their own right. Consistent overrides in one direction mean the model is wrong or the analysts are optimistic, and either finding matters more than the individual case.</div>`},

{l:"NUMBERS",t:"The ratios",h:"Four that carry the <em>weight</em>",b:`<table>
<tr><td>Leverage</td><td>Debt / EBITDA. How many years of earnings the debt represents. The single most watched figure.</td></tr>
<tr><td>Coverage</td><td>EBITDA / interest. Whether earnings comfortably service the interest.</td></tr>
<tr><td>Liquidity</td><td>Current ratio, and the cash conversion cycle. Solvent companies fail for want of cash.</td></tr>
<tr><td>Gearing</td><td>Debt / equity. How much of the balance sheet belongs to lenders.</td></tr>
</table>
<div class="note">Trend beats level. A company at 3.5× leverage improving from 5× is a different proposition from the same company deteriorating from 2×. A single-period ratio without its trajectory is close to meaningless, and is quoted that way constantly.</div>`},

{l:"MOVE",t:"Early warning",h:"Signals before the <em>numbers</em>",b:`<p>Financial statements arrive quarterly at best and are backward-looking. Corporate early warning relies on faster signals.</p>
<ul>
<li>Utilisation of working capital limits climbing towards the ceiling</li>
<li>Cheque returns, or delayed statutory payments</li>
<li>Rating downgrades, or an outlook change from an agency</li>
<li>Auditor qualification, or an auditor resigning</li>
<li>Promoter share pledging, or an increase in it</li>
<li>Requests to reschedule, or unusual interest in restructuring</li>
<li>Appearance in SMA-1 or SMA-2 at any lender, visible through CRILC</li>
</ul>
<div class="note">The last is the structural advantage of the Indian framework. CRILC makes stress at one lender visible to all of them, which removes the classic failure where each lender sees a manageable position and nobody sees the aggregate.</div>`},

{l:"RECALL",t:"Mission 09",h:"Corporate",b:`<ul>
<li>Retail is <strong>statistical</strong>; corporate is <strong>analytical</strong>. Too few defaults to model directly.</li>
<li>PD comes from <strong>rating grades</strong> with default rates attached.</li>
<li>Spread, analyse, model grade, override, committee — and <strong>monitor the override rate</strong>.</li>
<li>Leverage, coverage, liquidity, gearing — and <strong>trend beats level</strong>.</li>
<li>Early warning is behavioural and external; <strong>CRILC</strong> makes cross-lender stress visible.</li>
</ul>`}
]},

/* ============ 10 ============ */
{n:"10",title:"Capital",stage:"Basel",
bullets:["Why capital exists at all","Risk-weighted assets, plainly","Standardised against internal ratings","How provisions and capital interact"],
cards:[
{l:"WHY",t:"Why capital",h:"Who absorbs the <em>bad</em> year",b:`<p>A bank funds lending mostly with other people's money — deposits and borrowings. Capital is the portion belonging to shareholders.</p>
<p>When losses exceed provisions, they consume capital. When capital runs out, they consume deposits, and that is the failure the entire regulatory apparatus exists to prevent.</p>
<div class="note">Capital requirements are therefore not a tax on banking. They are the answer to the question: how much of the shareholders' own money must stand in front of the depositors' money before this bank may lend.</div>`},

{l:"MECHANISM",t:"RWA",h:"Not all assets are <em>equal</em>",b:`<p>Requiring a fixed percentage of capital against total assets would treat a government bond and an unsecured personal loan identically. So assets are weighted by risk first.</p>
<div class="dg"><div class="dg-t">The calculation</div>
<div class="flow">
<div class="n"><b>Exposure</b>The amount lent</div>
<div class="a">&times;</div>
<div class="n"><b>Risk weight</b>A percentage reflecting riskiness. Sovereign near 0%, secured retail low, unsecured high</div>
<div class="a">&#61;</div>
<div class="n"><b>RWA</b>Risk-weighted assets</div>
<div class="a">&#8595;</div>
<div class="n"><b>Capital required</b>A minimum ratio of capital to total RWA</div>
</div></div>
<div class="note">This is why the composition of a book matters more to capital than its size. Shifting from secured to unsecured lending raises the capital requirement without lending a rupee more — which is a major part of why the ECL transition's impact concentrates in unsecured retail and MSME.</div>`},

{l:"TRADE-OFF",t:"Two approaches",h:"Standardised and <em>IRB</em>",b:`<div class="two"><div><b>Standardised</b>Risk weights set by the regulator, by exposure category and external rating. Simple, comparable, insensitive to a bank's actual portfolio quality.</div>
<div><b>Internal ratings based</b>The bank's own PD, LGD and EAD estimates feed a supervisory formula. More risk-sensitive, and permitted only with approval, extensive validation and years of data.</div></div>
<div class="note">IRB usually produces lower capital for a genuinely good book, which is the incentive. It also means the bank's own models directly determine its capital requirement — which is exactly why approval is demanding and why floors exist beneath the output.</div>`},

{l:"MECHANISM",t:"The interaction",h:"Provisions and capital <em>meet</em>",b:`<p>The two systems are separate but connected, and the connection is where the ECL transition bites.</p>
<div class="flow">
<div class="n"><b>1</b>Higher provisions reduce profit</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>Lower profit means less retained earnings</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>Less retained earnings means less capital</div>
<div class="a">&#8595;</div>
<div class="n"><b>4</b>Less capital against the same RWA means a lower ratio</div>
</div>
<div class="note">Which is why a provisioning rule change is a capital event, and why the RBI permitted the one-time ECL transition adjustment to run through reserves and amortise over four years rather than landing at once.</div>`},

{l:"RECALL",t:"Mission 10",h:"Capital",b:`<ul>
<li>Capital is the shareholders' money standing in front of the depositors'.</li>
<li><strong>RWA = exposure × risk weight.</strong> Composition matters more than size.</li>
<li><strong>Standardised</strong>: regulator's weights. <strong>IRB</strong>: the bank's own estimates, with approval and floors.</li>
<li>Provisions reduce profit, which reduces retained earnings, which reduces capital.</li>
<li>A provisioning change is therefore a <strong>capital</strong> event.</li>
</ul>`}
]},

/* ============ 11 ============ */
{n:"11",title:"Validation and governance",stage:"Model risk",
bullets:["Why an independent function exists","What validation actually tests","Monitoring after go-live","Overrides, and what they reveal"],
cards:[
{l:"WHY",t:"Model risk",h:"The model itself is a <em>risk</em>",b:`<p>A model can be wrong, be used outside its intended scope, or quietly stop working as the world moves. Each is a loss mechanism independent of any borrower.</p>
<p>Which is why validation is performed by people who did not build the model and do not report to those who did. The independence is the control — a builder reviewing their own work will find what they were looking for.</p>
<div class="note">Under the incoming ECL framework this stops being good practice and becomes load-bearing. When provisions come from models rather than from days overdue, model governance is the only thing standing between judgement and the reported number.</div>`},

{l:"MECHANISM",t:"What validation tests",h:"Five things, in <em>order</em>",b:`<ol style="list-style:none;padding:0;margin:0">
<li style="padding-left:20px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">1</span><strong>Conceptual soundness.</strong> Is the approach appropriate, are the variables sensible, is the theory defensible?</li>
<li style="padding-left:20px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">2</span><strong>Data quality.</strong> Is the sample representative, complete, and free of leakage?</li>
<li style="padding-left:20px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">3</span><strong>Discrimination.</strong> Does it rank, on data it has never seen?</li>
<li style="padding-left:20px;position:relative;margin-bottom:9px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">4</span><strong>Calibration.</strong> Do predicted rates match observed rates, band by band?</li>
<li style="padding-left:20px;position:relative"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">5</span><strong>Stability.</strong> Has the population moved since the model was built?</li>
</ol>
<div class="note">The order is deliberate. A model that fails conceptual soundness cannot be rescued by a good Gini, and testing performance first tends to produce a defence of something that should not have been built.</div>`},

{l:"MECHANISM",t:"Monitoring",h:"After it goes <em>live</em>",b:`<table>
<tr><td>PSI</td><td>Has the applicant population shifted? Under 0.10 stable, 0.10&ndash;0.25 investigate, above 0.25 significant.</td></tr>
<tr><td>Discrimination tracking</td><td>Gini and KS recomputed on recent data. A steady decline means degradation.</td></tr>
<tr><td>Calibration tracking</td><td>Predicted against actual by band. Drift here hits provisions directly.</td></tr>
<tr><td>Characteristic analysis</td><td>PSI on each individual variable, to locate <em>which</em> input moved.</td></tr>
<tr><td>Override rate</td><td>How often humans disagree with the model, and in which direction.</td></tr>
</table>
<div class="note">Population shift and performance decay are different failures. PSI can be high while the model still ranks perfectly — that is a changed population, not a broken model. Diagnosing one as the other leads to rebuilding something that was working.</div>`},

{l:"THE HARD QUESTION",t:"Overrides",h:"Signal or <em>noise</em>?",b:`<p>Overrides are usually framed as a control weakness — humans undermining a validated model. The honest position is more uncomfortable.</p>
<p>Analysts see things the model cannot: a group structure that is not in the data, a news event, an explanation for a figure that looks alarming. Some overrides are genuinely better than the model.</p>
<div class="two"><div><b>Healthy</b>A low rate, both directions, individually documented, and — checked afterwards — the overridden cases perform better than the model predicted.</div>
<div><b>Unhealthy</b>A high rate, one direction, thin justification, and no back-testing of whether the overrides were right.</div></div>
<div class="note">The test is not whether overrides happen. It is whether anyone ever goes back to see if they were correct. Almost nobody does, which makes it a good question to ask.</div>`},

{l:"RECALL",t:"Mission 11",h:"Governance",b:`<ul>
<li>The model is itself a risk; validation is <strong>independent</strong> by design.</li>
<li>Five tests in order: conceptual soundness, data, discrimination, calibration, stability.</li>
<li>Monitor PSI, discrimination, calibration, per-variable PSI, and override rate.</li>
<li><strong>Population shift ≠ performance decay.</strong></li>
<li>Overrides are only a control if someone back-tests whether they were right.</li>
</ul>`}
]},

/* ============ 12 ============ */
{n:"12",title:"The card",stage:"Recall",
bullets:["Every measure, in one place","The Indian rulebook, dated","Every trap","The questions worth being able to answer"],
cards:[
{l:"RECALL",t:"Measures",h:"Everything, <em>compressed</em>",b:`<table>
<tr><td>EL</td><td>PD × LGD × EAD. Covered by provisions.</td></tr>
<tr><td>UL</td><td>Variation around EL. Covered by capital.</td></tr>
<tr><td>PD, PIT</td><td>Cycle-sensitive. Used for ECL.</td></tr>
<tr><td>PD, TTC</td><td>Cycle-neutral. Used for capital.</td></tr>
<tr><td>LGD</td><td>1 − net recovery / EAD. Bimodal. Downturn version is higher.</td></tr>
<tr><td>EAD</td><td>Drawn + undrawn × CCF.</td></tr>
<tr><td>Gini</td><td>2 × AUC − 1. Ranking ability.</td></tr>
<tr><td>KS</td><td>max(cumulative bad − cumulative good). Where separation is widest.</td></tr>
<tr><td>IV</td><td>Predictive strength of one variable. Above 0.5, suspect leakage.</td></tr>
<tr><td>PSI</td><td>Population shift. &lt;0.10 stable · 0.10&ndash;0.25 investigate · &gt;0.25 significant.</td></tr>
<tr><td>Coverage ratio</td><td>Provisions held against gross NPA.</td></tr>
<tr><td>RWA</td><td>Exposure × risk weight. Capital is a ratio to this.</td></tr>
</table>`},

{l:"RECALL",t:"The rulebook",h:"India, <em>dated</em>",b:`<table>
<tr><td>SMA-0 / 1 / 2</td><td>Up to 30 · 31&ndash;60 · 61&ndash;90 days overdue</td></tr>
<tr><td>NPA</td><td>Over 90 days overdue. Day-end stamped, borrower-level</td></tr>
<tr><td>Sub-standard</td><td>NPA up to 12 months</td></tr>
<tr><td>Doubtful</td><td>Beyond 12 months. D1 / D2 / D3 by age</td></tr>
<tr><td>Loss</td><td>Identified uncollectable, not yet written off</td></tr>
<tr><td>Upgrade</td><td>Only on payment of the entire arrears</td></tr>
<tr><td>CRILC</td><td>SMA-2 reporting above ₹5 crore</td></tr>
<tr><td>NBFC 90-day norm</td><td>All NBFCs from 31 March 2026</td></tr>
<tr><td>ECL Directions</td><td>Final 27 April 2026 · effective <strong>1 April 2027</strong></td></tr>
<tr><td>ECL scope</td><td>Commercial banks, corresponding new banks, SBI. Not SFB, payments, local area, RRB</td></tr>
<tr><td>ECL stages</td><td>1 — 12-month · 2 — lifetime on SICR · 3 — lifetime, impaired</td></tr>
</table>
<div class="note">The fastest-moving rows are the last four. Everything dated here was verified in August 2026 and should be checked against the current master direction before being relied on.</div>`},

{l:"RECALL",t:"Traps",h:"Every trap, gathered",b:`<table>
<tr><td>Confusing provisions and capital</td><td>Expected loss versus the bad year. Different mechanisms entirely.</td></tr>
<tr><td>Mismatched default definitions</td><td>Model, accounts and returns must all use the same test.</td></tr>
<tr><td>PIT where TTC belongs</td><td>Cycle-sensitive PD in capital amplifies the cycle.</td></tr>
<tr><td>Ignoring LGD</td><td>Least scrutinised, and moves EL exactly as much as PD.</td></tr>
<tr><td>Averaging a bimodal LGD</td><td>The mean describes almost nobody.</td></tr>
<tr><td>Excluding cures</td><td>Overstates LGD substantially.</td></tr>
<tr><td>Ignoring undrawn limits</td><td>Distressed borrowers draw down.</td></tr>
<tr><td>Reject inference</td><td>Models trained on survivors inherit the old policy.</td></tr>
<tr><td>Ranking mistaken for calibration</td><td>Fine for a cut-off, useless for a provision.</td></tr>
<tr><td>Leakage</td><td>Test: was this knowable at the observation point?</td></tr>
<tr><td>Reading vintage across the row</td><td>Older loans have had longer to fail. Read down the column.</td></tr>
<tr><td>Collateral concentration</td><td>Diverse borrowers, one asset class, one city.</td></tr>
<tr><td>Trusting a headline NPA ratio</td><td>Write-offs can hold it flat while the book churns. Read the bridge.</td></tr>
<tr><td>PSI read as decay</td><td>A shifted population is not a broken model.</td></tr>
</table>`},

{l:"THE HARD QUESTION",t:"The questions",h:"Worth being able to <em>answer</em>",b:`<p>Not a list to memorise. A list of places where an answer either shows real handling or does not.</p>
<ul>
<li>Why do provisions and capital both exist, if both cover losses?</li>
<li>Why is Gini not a different measurement from AUC?</li>
<li>Why would a well-ranking model still be unusable for ECL?</li>
<li>Why does an account at 20% utilisation carry a higher CCF than one at 90%?</li>
<li>What makes the Stage 1 to Stage 2 move a cliff rather than a slope?</li>
<li>Why did the RBI put prudential floors beneath a model-based framework?</li>
<li>Why is a rise in the current-to-30-day roll rate more useful than this month's NPA number?</li>
<li>How would a high override rate be told apart from good analyst judgement?</li>
</ul>
<div class="note">Each one has appeared in this pack. None has a one-line answer, and that is the point.</div>`},

{l:"CLOSE",t:"Where this stops",h:"The compression",b:`<p>Four packs, and this is the one where the others converge. The AI Stack pack described how systems get built. The Claude pack made building them faster. The Python pack gave the code. This one supplies the only thing that makes any of it worth running: knowing what the numbers <em>mean</em>, and what happens if they are wrong.</p>
<div class="note" style="font-size:16.5px;color:var(--ink);border-left-color:var(--accent)">Every number in this field is an estimate of something that has not happened yet, made by people with an incentive for it to look good, checked by people paid to doubt them.</div>
<p>That sentence is the field. The regulation, the validation, the independence, the floors, the committees — all of it exists because of the middle clause.</p>
<div class="rule"></div>
<div class="meta">
V01 &nbsp;·&nbsp; the reasoning layer — complete<br>
Code for every measure: Python pack, Mission 13<br>
Regulatory positions verified August 2026 &nbsp;·&nbsp; check before relying
</div>`}
]}
]};
