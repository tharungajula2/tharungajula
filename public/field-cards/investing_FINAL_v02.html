          "t": "What one looks like",
          "h": "Forced selling, not <em>bad news</em>",
          "b": "<p>Genuine opportunities — the kind worth holding a reserve for — are rare. In Indian equity, market-wide dislocations of the 2008 or March 2020 kind arrive perhaps once every seven to ten years. Sector-level ones are more frequent.</p>\n<p>They share a signature, and it is not simply that prices fell.</p>\n<div class=\"two\"><div><b>Ordinary decline</b>Prices fall on deteriorating fundamentals. Sellers are selling because the business got worse. The price is lower and so is the value.</div>\n<div><b>Genuine dislocation</b>Prices fall because holders <em>must</em> sell — margin calls, fund redemptions, forced liquidation. The seller has no view on value; they need cash today.</div></div>\n<p>The second is where an individual investor holds a real advantage, and it is the advantage described in Mission 08 — Behaviour: <strong>nobody can force you to sell.</strong> No redemptions, no quarterly report, no committee. That is not a small edge. It is the main one available.</p>\n<div class=\"note\">The tell is indiscriminate selling. When good and bad companies in a sector fall the same amount on the same day, the market has stopped distinguishing between them — which is the condition under which anyone still distinguishing gets paid.</div>"
        },
        {
          "l": "MOVE",
          "t": "The checklist",
          "h": "Decided while <em>calm</em>",
          "b": "<p>The moment an opportunity arrives is the moment judgement is least available. So the conditions are written now, in advance, and checked then.</p>\n<div class=\"sheet g\"><div class=\"h\">Before deploying reserve capital</div>\n<div class=\"r\"><b>Is this indiscriminate?</b><span>Are good and bad falling together, or has something specific broken?</span></div>\n<div class=\"r\"><b>Is the seller forced?</b><span>Redemptions and margin calls, or a genuine reassessment of value?</span></div>\n<div class=\"r\"><b>Do I already understand it?</b><span>A crisis is not the time to learn a new sector. If it needed research today, it is not your opportunity.</span></div>\n<div class=\"r\"><b>Is my own position secure?</b><span>Job, emergency fund, no leverage. The reserve is only usable if you are not the one being forced.</span></div>\n<div class=\"r\"><b>What is the tranche?</b><span>How much now, how much if it falls further. Written before, not decided in the moment.</span></div>\n<div class=\"r\"><b>What would prove me wrong?</b><span>Stated in advance, or every subsequent fall becomes a reason to add.</span></div>\n</div>\n<div class=\"note\">The final line matters most. Without a written falsification condition, \"buying the dip\" and \"averaging into a permanent loss\" are indistinguishable from the inside, which is the trap on the next card.</div>"
        },
        {
          "l": "TRAP",
          "t": "The falling knife",
          "h": "Cheap and getting <em>cheaper</em>",

          "l": "TRADE-OFF",
          "t": "Mid and small",
          "h": "More return, or more <em>range</em>?",
          "b": "<p>The case for smaller companies is that they grow faster from a lower base and are less thoroughly researched, so mispricing is more likely. Both parts are true.</p>\n<p>The cost is the width of the outcome. Small-cap indices fall further in crashes, recover more slowly, and contain many companies that do not recover at all — which the index conceals by replacing them.</p>\n<div class=\"stamp\">Valuations, 7 Aug 2026</div>\n<div class=\"dt\"><table>\n<tr><th>Index</th><th>P/E</th><th>5-year median</th><th>Position</th></tr>\n<tr><td>Nifty 50</td><td class=\"n\">~20.6</td><td class=\"n\">~20–21</td><td class=\"g\">Around average</td></tr>\n<tr><td>Nifty Midcap 150</td><td class=\"n\">30.21</td><td class=\"n\">29.77</td><td class=\"g\">+1%</td></tr>\n<tr class=\"hi\"><td>Nifty Smallcap 250</td><td class=\"n\">34.43</td><td class=\"n\">28.30</td><td class=\"g\">+22%</td></tr>\n</table></div>\n<p>Set that beside the flows from Mission 08 — Behaviour: small-cap funds took ₹7,768 crore of net inflows in July 2026 while large-cap funds saw net outflows. The most expensive part of the market relative to its own history is the part attracting the most money.</p>\n<div class=\"note\">This is not an argument against holding mid and small caps. It is an argument for holding them as a <strong>stated, sized tilt decided in advance</strong> rather than an allocation that grows because recent returns were good — which is the mechanism by which almost everyone ends up overweight the expensive thing.</div>"

          "l": "MECHANISM",
          "t": "International",
          "h": "Two exposures in <em>one</em>",
          "b": "<p>Buying a fund that holds foreign equity gives you two things simultaneously, and most people notice only the first.</p>\n<div class=\"two\"><div><b>The assets</b>Companies and sectors that barely exist on Indian exchanges — global technology at scale, for one.</div>\n<div><b>The currency</b>The holding is denominated in another currency. If the rupee weakens, the rupee value of the holding rises even if the underlying does not move.</div></div>\n<p>The currency exposure is doing real work. It is a hedge against the specific risk of having your income, your savings, your home and your job all denominated in one currency in one country.</p>\n<p>The practical constraints in India are worth knowing before planning around it: international funds have faced regulatory limits on fresh inflows at various points, some routes are taxed less favourably than domestic equity, and costs are typically higher.</p>\n<div class=\"note\">Which is why it works better as a modest, permanent slice than a large one. Its job is reducing single-country dependence, not adding return — and a 5–10% holding does most of that job.</div>"

          "l": "TRAP",
          "t": "Sector funds",
          "h": "Bought at the <em>top</em>, structurally",
          "b": "<p>Sector and thematic funds are not launched at random. They are launched when a sector has already performed well, because that is when they can be sold.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>1</b>A sector performs strongly for two or three years.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2</b>Funds dedicated to it are launched, with the strong recent record in the marketing.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3</b>Money arrives, drawn by that record — after the returns that created it.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>4</b>The sector reverts. The fund's investors experience the reversion, having missed the run.</div>\n</div>\n<p>This is not a criticism of any fund house. It is the structure of a business that must launch products people will buy, and people buy what has recently gone up.</p>\n<div class=\"note\">The specific danger is that a sector fund is a <em>concentrated</em> bet dressed as a diversified one — it holds many companies, all exposed to the same single thing. If you hold one, size it as the single bet it is, and note that a broad index already holds that sector at its market weight.</div>"

          "h": "What it is <em>for</em>",
          "b": "<div class=\"stamp\">Prices 13–16 Aug 2026</div>\n<p>Gold in India sits at roughly <strong>₹15,500 per gram</strong> for 24-carat — about ₹1.55 lakh per 10 grams.</p>\n<p>Its rupee price is driven by three things at once, which is why Indian gold can rise in a year when global gold does not:</p>\n<div class=\"three\"><div><b>Global price</b>Set in dollars, driven by real interest rates, central bank buying and crisis demand.</div>\n<div><b>The rupee</b>A weakening rupee raises the rupee price of gold even with the dollar price flat.</div>\n<div><b>Import duty and local demand</b>Policy and the festival and wedding cycle both move the domestic premium.</div></div>\n<p>What gold is for is worth being blunt about: <strong>it is not a return engine.</strong> It produces no earnings, pays no dividend and has no cash flow to value. Over very long periods it roughly preserves purchasing power.</p>\n<div class=\"note\">Its job in a portfolio is behaving <em>differently</em> — often rising when equity falls sharply, which is what makes it useful for the rebalancing mechanism in Mission 09 — Allocation and rebalancing. It supplies something to sell high in the year everything else is down. That is worth roughly 5–10%, and considerably less than most Indian households actually hold once jewellery is counted.</div>"

          "l": "NUMBERS",

          "h": "The route that <em>closed</em>",
          "b": "<p>Sovereign Gold Bonds were the best gold instrument ever offered to Indian retail investors: gold price exposure, plus 2.5% annual interest, plus tax-free capital gains at maturity for the original subscriber.</p>\n<p>They are gone. No new tranche has been issued since February 2024, and none is scheduled. The government's stated reason is that it proved an expensive way to borrow — outstanding liability grew with the gold price while the expected reduction in physical imports did not materialise.</p>\n<div class=\"stamp\">Redemptions, 2026</div>\n<p>What existing holders have received shows why it was ended. The 2019–20 Series VIII, issued at ₹3,966 per gram, redeemed on 21 January 2026 at ₹14,432 — roughly 264% before counting eight years of 2.5% interest.</p>\n<p>Two things matter for anyone acting today. Existing bonds continue to their maturity dates and can still be bought on the exchange. But <strong>Budget 2026 restricted the capital gains exclusion at redemption to original subscribers</strong> — a secondary-market buyer holding to maturity no longer gets the tax-free treatment that made the instrument famous.</p>\n<div class=\"note\">A clean example of a general rule: <strong>a tax advantage attached to a specific instrument is a policy decision, and policy decisions are reversed.</strong> Anything whose entire case rests on a current tax treatment carries that risk.</div>"

          "l": "DEFINE",
          "t": "Two risks",
          "h": "Duration and <em>credit</em>",
          "b": "<p>A bond is a loan. Two things can go wrong and they are unrelated to each other.</p>\n<div class=\"two\"><div><b>Duration risk</b>Interest rates rise, so existing bonds paying lower rates become less valuable. Longer-dated bonds fall more. Nobody defaults; the price simply moves.</div>\n<div><b>Credit risk</b>The borrower does not repay. This is the one that produces permanent loss, and it arrives suddenly rather than gradually.</div></div>\n<p>Debt funds are labelled by duration — liquid, ultra-short, short, medium, long — which is helpful, and the label says nothing about credit quality, which is not.</p>\n<div class=\"note\">The rule that avoids nearly all trouble: <strong>take duration risk if you want, take credit risk deliberately or not at all.</strong> A debt fund yielding two percentage points more than its peers is being paid for lending to weaker borrowers. That extra yield is not free, and it disappears exactly when you need the debt allocation most — in a crisis, alongside the equity fall.</div>"

          "t": "Core and satellite",
          "h": "The structure that <em>contains</em> this",
          "b": "<p>Everything in this mission is optional, and optional things accumulate. The structure that stops that is core and satellite.</p>\n<div class=\"dg\"><div class=\"dg-t\">One portfolio, two jobs</div>\n<div class=\"flow\">\n<div class=\"n\"><b>Core — the large majority</b>Broad index exposure, debt, gold. Boring, cheap, permanent, rarely touched.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Satellite — a stated, capped share</b>Everything with a view attached: mid and small tilts, sectors, individual stocks, active funds. Capped in advance, at a number you write down.</div>\n</div></div>\n<p>The cap is the entire mechanism. It converts \"should I buy this?\" — which is unanswerable and therefore always answered yes eventually — into \"does this belong in my satellite more than what is already there?\", which is answerable.</p>\n<div class=\"note\">It also bounds the damage. A satellite that halves costs you a defined fraction of the portfolio. Without a cap, positions grow by addition and by appreciation, and the concentration is discovered afterwards — which is the hidden concentration trap from Mission 07 — Risk and the record.</div>"

        {
          "l": "ORIENT",
          "t": "The honest framing",
          "h": "Before any of <em>this</em>",
          "b": "<p>Picking individual companies is optional, and this mission is placed twelfth for that reason. Everything before it works without it.</p>\n<p>Three things are true simultaneously and are usually presented one at a time:</p>\n<ul>\n<li>Most individual stock pickers underperform a cheap index fund over long periods, after costs and taxes.</li>\n<li>Some do not, and Indian mid and small caps are genuinely less efficiently priced than large caps.</li>\n<li>You cannot know in advance which group you are in, and two good years is not evidence.</li>\n</ul>\n<div class=\"note\">The workable resolution is the structure from Mission 11 — Beyond the core: a satellite of a capped size, with the core untouched. That way being wrong is affordable and being right still matters. Anyone unwilling to cap it should read the first bullet again.</div>"
        },
        {
          "l": "DEFINE",
          "t": "Three statements",
          "h": "What each one <em>answers</em>",
          "b": "<p>Every listed company publishes three statements. They answer different questions and none is sufficient alone.</p>\n<div class=\"dt\"><table>\n<tr><th>Statement</th><th>Answers</th><th>Watch for</th></tr>\n<tr><td>Profit and loss</td><td class=\"g\">Did it make money over the period?</td><td class=\"g\">Profit is an opinion — it depends on accounting choices</td></tr>\n<tr class=\"hi\"><td>Balance sheet</td><td class=\"g\">What does it own and owe, at one instant?</td><td class=\"g\">Debt levels, and receivables that keep growing</td></tr>\n<tr class=\"hi\"><td>Cash flow</td><td class=\"g\">Did actual cash move?</td><td class=\"g\">The hardest to manipulate. Start here</td></tr>\n</table></div>\n<p>The single most useful check in fundamental analysis is comparing the first and the third over several years. <strong>A company reporting rising profits with flat or negative operating cash flow is reporting something other than cash.</strong></p>\n<div class=\"note\">Profits can be produced by accounting judgement — when a sale is recognised, how a cost is spread. Cash arriving in the bank is considerably harder to invent, which is why nearly every accounting failure is visible in this gap years before it becomes a headline.</div>"
        },
        {
          "l": "NUMBERS",
          "t": "The ratios",
          "h": "What each one actually <em>asks</em>",
          "b": "<div class=\"sheet\"><div class=\"h\">And what it fails to see</div>\n<div class=\"r\"><b>P/E</b><span>Price per rupee of earnings. Meaningless across industries and when earnings are temporarily distorted.</span></div>\n<div class=\"r\"><b>P/B</b><span>Price against net assets. Useful for banks, misleading for asset-light businesses.</span></div>\n<div class=\"r\"><b>ROE</b><span>Profit per rupee of shareholder capital. Can be inflated purely by borrowing more.</span></div>\n<div class=\"r\"><b>ROCE</b><span>Return on all capital including debt. Usually the better quality measure.</span></div>\n<div class=\"r\"><b>Debt to equity</b><span>How much borrowing. High is not automatically bad, but it removes room to be wrong.</span></div>\n<div class=\"r\"><b>Interest coverage</b><span>How many times over earnings cover the interest bill. Below 2 is fragile.</span></div>\n<div class=\"r\"><b>Promoter holding</b><span>How much the founding group owns. Falling holding, and pledged shares, both deserve attention.</span></div>\n</div>\n<p>Ratios are a screen, not a conclusion. Their honest use is <strong>comparison</strong> — against the same company's history and against direct competitors — never against an absolute threshold learned from a list.</p>\n<div class=\"note\">Every ratio can be optically improved by management, and several can be improved by taking risk. A rising ROE alongside rising debt to equity is not improving quality; it is the same business with more leverage, which will read as skill until the cycle turns.</div>"
        },

          "l": "WHY",

          "h": "Being right is not <em>enough</em>",
          "b": "<p>Two people buy the identical stock on the same day at the same price. It falls 50% and then triples. One makes a great deal of money and the other loses.</p>\n<p>The difference is position size. The one who put 40% of the portfolio in could not sit through the fall — not because they were weaker, but because the pain was four times larger. The one who put 10% in barely had to think about it.</p>\n<div class=\"note\">Which reframes the whole activity: <strong>selection determines whether you were right. Sizing determines whether you were still there to collect.</strong> The research effort goes almost entirely into the first and the outcome depends heavily on the second.</div>"
        },
        {
          "l": "NUMBERS",
          "t": "The arithmetic",
          "h": "Why losses are <em>asymmetric</em>",
          "b": "<p>A loss and the gain required to undo it are not symmetrical, and the asymmetry accelerates.</p>\n<div class=\"dt\"><table>\n<tr><th>Fall</th><th>Gain needed to recover</th></tr>\n<tr><td>10%</td><td class=\"n\">11%</td></tr>\n<tr><td>25%</td><td class=\"n\">33%</td></tr>\n<tr class=\"hi\"><td>50%</td><td class=\"n\">100%</td></tr>\n<tr class=\"hi\"><td>75%</td><td class=\"n\">300%</td></tr>\n<tr><td>90%</td><td class=\"n\">900%</td></tr>\n</table></div>\n<p>This is the mathematical case for position limits, and it is why avoiding catastrophic single losses matters more than capturing exceptional single gains. A portfolio can absorb many 20% losses on small positions. It cannot absorb one 80% loss on a large one.</p>\n<div class=\"note\">It is also the case against leverage in a single sentence: borrowed money converts a 50% fall, which requires patience, into a forced exit, which requires nothing further because the position no longer exists.</div>"

        {
          "l": "MOVE",
          "t": "The rules",
          "h": "Limits set <em>in advance</em>",
          "b": "<div class=\"sheet g\"><div class=\"h\">Written before, not during</div>\n<div class=\"r\"><b>Maximum single position</b><span>A stated percentage of the portfolio at cost. Commonly 5–10% for an individual stock.</span></div>\n<div class=\"r\"><b>Maximum sector</b><span>Otherwise five positions become one bet. Count your employer and your salary in this.</span></div>\n<div class=\"r\"><b>Maximum satellite</b><span>The total of everything with a view attached, from Mission 11 — Beyond the core.</span></div>\n<div class=\"r\"><b>Let winners run, at a limit</b><span>Decide in advance whether a position that grows past the cap gets trimmed. Either answer works; not deciding does not.</span></div>\n<div class=\"r\"><b>No leverage</b><span>For an individual investor with a long horizon, borrowing to invest removes the one real edge: never being forced to sell.</span></div>\n</div>\n<div class=\"note\">Limits apply at cost, and appreciation will breach them. That is a good problem and it still needs a written answer, because \"it has done so well I will let it run\" and \"it is now 35% of everything I own\" are the same sentence.</div>"
        },
        {
          "l": "MECHANISM",
          "t": "Opportunity cost",
          "h": "The <em>second</em>-best idea",
          "b": "<p>The right size for a position is not set by how good it looks in isolation. It is set by how much better it is than the alternative use of the money.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>The question people ask</b>Is this a good investment?</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>The question that sizes it</b>Is this better than adding the same rupees to a broad index fund at 0.2% a year — and by enough to justify the research, the risk and the tax?</div>\n</div>\n<p>That comparison is harsh and it is the correct benchmark, because the index fund is genuinely available, requires no work, and is what you would otherwise own.</p>\n<div class=\"note\">The practical consequence is a much shorter list. Most ideas are good in isolation and not clearly better than the alternative, and those should be zero rather than small — because a small position still costs full attention, and attention is the scarce input.</div>"
        },
        {
          "l": "MECHANISM",
          "t": "Why to sell",
          "h": "Three legitimate reasons, and <em>one</em> that is not",
          "b": "<div class=\"two\"><div><b>1 — The reason for owning it has gone</b>The thesis was specific and is now false. This is the only reason that concerns the business itself.</div>\n<div><b>2 — Something better exists</b>A clearly superior use of the same money, judged against the benchmark on the previous card.</div></div>\n<div class=\"dg\"><div class=\"dg-t\">And the third</div>\n<div class=\"flow\"><div class=\"n\"><b>3 — It has outgrown its limit</b>Appreciation has pushed the position past the cap. A trim is portfolio management, not a view on the company.</div></div></div>\n<p>The reason that is not legitimate: <strong>the price fell.</strong> A falling price is information about other people's willingness to pay. If nothing in the first reason has changed, a lower price makes the same holding better value, not worse.</p>\n<div class=\"note\">This is why the thesis is written down at purchase, per Mission 08 — Behaviour. Without it, \"the thesis broke\" and \"I am frightened\" are indistinguishable from the inside, and the second one will use the language of the first.</div>"
        },
        {
          "l": "TRAP",
          "t": "Cutting winners",
          "h": "The most expensive <em>habit</em>",
          "b": "<p>Selling something that has risen 40% feels like discipline. Booking a profit is satisfying, concrete and easy to explain.</p>\n<p>Long-run returns in equity are highly concentrated: a small number of holdings produce most of the gain. A portfolio that systematically sells its winners at +40% and holds its losers waiting for recovery has removed exactly the positions that were going to pay for everything else.</p>\n<div class=\"note\">This is the <strong>disposition effect</strong> from Mission 08 — Behaviour, in its most costly form. The correct discipline is the reverse and feels wrong every time: cut positions whose <em>reason</em> has broken, regardless of price, and hold positions whose reason still stands, regardless of gain — trimming only when the size limit demands it.</div>"
        },
        {
          "l": "TRAP",
          "t": "Common errors",
          "h": "Where it goes <em>wrong</em>",
          "b": "<div class=\"sheet q\"><div class=\"h\">The recurring ones</div>\n<div class=\"r\"><b>A low P/E means cheap</b><span>Often it means the market expects earnings to fall, and it is usually right.</span></div>\n<div class=\"r\"><b>Extrapolating growth</b><span>Three years of 30% growth does not continue. High growth attracts competition, which ends it.</span></div>\n<div class=\"r\"><b>Ignoring the balance sheet</b><span>A profitable company with too much debt still fails when refinancing gets hard.</span></div>\n<div class=\"r\"><b>Falling for the story</b><span>A compelling narrative is not a valuation. The best stories often carry the worst prices.</span></div>\n<div class=\"r\"><b>Anchoring on your price</b><span>What you paid is not a fact about the company.</span></div>\n<div class=\"r\"><b>Confusing a good company with a good investment</b><span>An excellent business at an excessive price is a poor investment. This is the most common error of all.</span></div>\n</div>"
        },
        {
          "l": "RECALL",
          "t": "Mission 12",
          "h": "What is now owned",
          "b": "<ul>\n<li>Most pickers underperform a cheap index after costs and tax. Do it inside a <strong>capped satellite</strong> or not at all.</li>\n<li>Read <strong>cash flow against profit</strong> over several years. That gap exposes most accounting failures early.</li>\n<li>Ratios compare a company to <strong>its own history and its competitors</strong>, never to an absolute threshold.</li>\n<li><strong>Selection decides whether you were right; sizing decides whether you were still there.</strong></li>\n<li>A 50% fall needs a 100% gain. Avoiding catastrophic losses beats capturing exceptional gains.</li>\n<li>Size against the alternative: <strong>is this better than the index fund?</strong> Most ideas should be zero, not small.</li>\n<li>Sell for a broken thesis, a better use, or a breached limit. <strong>Never because the price fell.</strong></li>\n<li>An excellent business at an excessive price is a poor investment.</li>\n</ul>"
        }
      ]
    }
  ]
};

const main=document.getElementById('main'), rail=document.getElementById('rail');
function lc(l){
  if(l==='TRAP'||l==='TRADE-OFF') return 'label q';
  if(l==='RECALL'||l==='CHEAT'||l==='CLOSE') return 'label r';
  if(l==='LIVE'||l==='NUMBERS') return 'label l';
  return 'label';
}
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards &nbsp;/&nbsp; Final</div>
  <h1>Investing, <em>India</em></h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>No prior knowledge assumed<br>Figures verified ${DATE}</div>
  <div class="note" style="margin-top:26px">Two kinds of card. <strong>Mechanism</strong> cards explain how something works and do not go stale. <strong>Live</strong> cards carry a collection date and do. Every number in this pack is dated and verified.</div>
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    ${m.line ? `<div class="mline">${m.line}</div>` : ''}
    ${m.bullets ? `<div class="inthis">In this mission</div><ul>${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : ''}
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
