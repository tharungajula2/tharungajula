<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investing, India — Field Cards · Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "17 August 2026";
const P = {
  "title": "Investing, India",
  "sub": "For a beginner putting their own money to work over a long horizon. What the instruments are, what they cost, what the rules say, and where people actually lose.",
  "missions": [
    {
      "n": "01",
      "title": "Before any of it",
      "stage": "Ground",
      "line": "The decisions that come before choosing anything to buy — and the state of mind that destroys more money than any bad pick.",
      "cards": [
        {
          "l": "ORIENT",
          "t": "What this is",
          "h": "Education, not <em>advice</em>",
          "b": "<p>This pack explains how investing works in India, what the rules currently say, and what the evidence shows about how people actually behave with their own money.</p>\n<p>It contains no recommendation to buy or sell anything. Where a portfolio shape appears, it appears so the <em>reasoning</em> is visible, not so the numbers are copied.</p>\n<p>Two things genuinely require a qualified professional, and they are the two that are specific to you: the interaction of tax with your total income and slab, and any decision involving a large irreversible commitment.</p>\n<div class=\"note\">Everything else in here is knowable, and most of it is arithmetic. The difficulty in investing is almost never that the subject is hard. It is that the correct action is uncomfortable at the moment it is correct.</div>"
        },
        {
          "l": "WHY",
          "t": "The first question",
          "h": "Not which stock. <em>Which money</em>",
          "b": "<p>The first question is not what to buy. It is <strong>which money is available to be invested at all</strong>, because money with a job already attached to it cannot be exposed to a market.</p>\n<p>Three claims come first, in this order:</p>\n<div class=\"three\"><div><b>Emergency</b>Three to six months of expenses, in a savings account or liquid fund. Reachable in a day, and never invested in equity.</div>\n<div><b>Expensive debt</b>Credit card debt at 36-42% a year is a guaranteed negative return. Clearing it is the highest certain return available anywhere.</div>\n<div><b>Insurance</b>Term life if anyone depends on your income, and health cover. Both are protection, not investment, and mixing the two produces a bad version of each.</div></div>\n<p>Only what remains after those three is investable. This is unglamorous and it is the single largest determinant of whether you can hold an investment through a bad year — because the person who is forced to sell in a fall is almost always the person who needed the money for something else.</p>"
        },
        {
          "l": "MECHANISM",
          "t": "The order",
          "h": "What comes <em>first</em>",
          "b": "<div class=\"flow\">\n<div class=\"n\"><b>1 — Income exceeds spending</b>If it does not, nothing downstream matters. This is the only step with no substitute.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>2 — Emergency fund</b>Three to six months of expenses, liquid and boring.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>3 — Clear expensive debt</b>Anything above roughly 12% a year. Certain return, zero risk.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>4 — Insure</b>Term life and health. Cheap when young, and the cost never falls again.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>5 — Then invest</b>With money that has no other claim on it and a horizon measured in years.</div>\n</div>\n<div class=\"note\">Steps two and three are frequently skipped because they feel like standing still. They are the foundation on which the ability to stay invested rests, and Mission 08 — Behaviour shows what happens to returns when that ability fails.</div>"
        },
        {
          "l": "LIVE",
          "t": "The board",
          "h": "Where things stand <em>today</em>",
          "b": "<div class=\"stamp\">Collected 17 Aug 2026</div>\n<p>Before any theory, the actual numbers you are deciding against. Facts only here; what they mean is worked out later, in Mission 10 — Deploying money.</p>\n<div class=\"dt\"><table>\n<tr><th>Measure</th><th>Level</th><th>Context</th></tr>\n<tr class=\"hi\"><td>Nifty 50</td><td class=\"n\">24,436</td><td class=\"g\">Close, 12 Aug 2026</td></tr>\n<tr><td>All-time high</td><td class=\"n\">26,373</td><td class=\"g\">5 Jan 2026 — about 7% above today</td></tr>\n<tr><td>Nifty 50 P/E</td><td class=\"n\">~20.6</td><td class=\"g\">Long-run average roughly 20–21</td></tr>\n<tr><td>Nifty 50 P/B</td><td class=\"n\">3.17</td><td class=\"g\">Mid-June 2026</td></tr>\n<tr><td>Dividend yield</td><td class=\"n\">~1.2%</td><td class=\"g\">Below 1% is historically expensive</td></tr>\n<tr class=\"hi\"><td>Repo rate</td><td class=\"n\">5.25%</td><td class=\"g\">Held 5 Aug 2026, neutral stance</td></tr>\n<tr><td>CPI inflation</td><td class=\"n\">4.4%</td><td class=\"g\">June 2026, above the 4% target</td></tr>\n<tr><td>PPF</td><td class=\"n\">7.1%</td><td class=\"g\">Tax-free, unchanged since Apr 2020</td></tr>\n<tr><td>Gold, 24k</td><td class=\"n\">~₹15,500/g</td><td class=\"g\">About ₹1.55 lakh per 10 grams</td></tr>\n</table></div>\n<div class=\"src\">Sources: NSE and index data providers, RBI monetary policy statement of 5 Aug 2026, Ministry of Finance small savings notification of 30 Jun 2026, bullion price aggregators. Every one of these moves; the mechanisms built on them do not.</div>"
        },
        {
          "l": "PICTURE",
          "t": "Horizon",
          "h": "Why time changes <em>everything</em>",
          "b": "<p>The same instrument is prudent or reckless depending only on when the money is needed. Nothing about the instrument changes; the horizon changes.</p>\n<div class=\"dt\"><table>\n<tr><th>Money needed in</th><th>Belongs in</th><th>Because</th></tr>\n<tr><td>Under 1 year</td><td class=\"g\">Savings account, liquid fund</td><td class=\"g\">Return is irrelevant; availability is everything</td></tr>\n<tr><td>1 – 3 years</td><td class=\"g\">Fixed deposits, short-duration debt</td><td class=\"g\">Equity can be down heavily across any three-year window</td></tr>\n<tr><td>3 – 5 years</td><td class=\"g\">Mostly debt, some equity</td><td class=\"g\">Equity is possible but the range of outcomes is still wide</td></tr>\n<tr class=\"hi\"><td>5 – 10 years</td><td class=\"g\">Mostly equity</td><td class=\"g\">Enough time to sit through a full bad cycle</td></tr>\n<tr class=\"hi\"><td>10 years and beyond</td><td class=\"g\">Equity-dominant</td><td class=\"g\">Time is the mechanism through which equity works at all</td></tr>\n</table></div>\n<div class=\"note\">Equity is not risky in the abstract. It is risky over short periods and becomes progressively less so over long ones — not because it stops falling, but because you stop being forced to sell while it is down. Mission 07 — Risk and the record puts numbers on that.</div>"
        },
        {
          "l": "TRAP",
          "t": "Urgency",
          "h": "The most expensive <em>state of mind</em>",

    {
      "n": "02",
      "title": "What you actually own",
      "stage": "Ground",
      "line": "A share, a return, and a price — three things that are constantly confused with each other.",
      "cards": [
        {
          "l": "DEFINE",
          "t": "A share",
          "h": "A slice of a <em>business</em>",
          "b": "<p>A share is a unit of ownership in a company. Own one share out of ten crore and you own one ten-croreth of that business — its factories, its brands, its contracts, and its profits.</p>\n<p>This sounds obvious and is routinely forgotten, because a share is experienced as a number on a screen that moves. It is worth restating in its blunt form:</p>\n<div class=\"note\">Over any long period, <strong>the return on a share is produced by the business, not by the market.</strong> The market decides what you pay to get it and what you receive when you leave. Everything in between is the company earning money or failing to.</div>\n<p>A mutual fund is a pooled version of the same thing: many people's money, invested together, in many companies at once, with each investor holding units representing their share of the pool.</p>"
        },
        {
          "l": "MECHANISM",
          "t": "Returns",
          "h": "Only <em>two</em> sources",
          "b": "<p>Every rupee ever made from a share came from one of two places. There is no third.</p>\n<div class=\"two\"><div><b>1 — Dividends</b>Cash the company pays out of its profits to owners. Real money, arriving in your bank account, requiring nobody else's opinion.</div>\n<div><b>2 — Capital gain</b>Selling for more than you paid. This requires another person, later, willing to pay more.</div></div>\n<p>The distinction matters more than it appears. A dividend is generated by the business. A capital gain is generated by <em>someone else's willingness to pay</em> — which over long periods tracks the business, and over short periods tracks mood.</p>\n<p>Indian equity dividend yields are low, currently around 1.2% at the index level. So for an Indian equity investor, almost the entire return is the second kind: it depends on companies growing their earnings, and on the market continuing to value those earnings reasonably.</p>"
        },
        {
          "l": "WHY",
          "t": "Price and value",
          "h": "Not the <em>same</em> thing",
          "b": "<p>Price is what a share trades at right now, set by the most recent transaction between a willing buyer and a willing seller.</p>\n<p>Value is what the business is actually worth — the cash it will produce over its life, judged today. Nobody knows it precisely. It can be estimated within a range, and the range is wide.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Short run</b>Price is a voting machine. It reflects what people currently feel about the company, the sector, the country and the world.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Long run</b>Price is a weighing machine. It converges on what the business actually earned.</div>\n</div>\n<p>Every argument about whether something is cheap or expensive is an argument about the gap between these two. And the reason investing is difficult is contained in one fact: <strong>price is precise, public and updated every second, while value is imprecise, private and never confirmed.</strong></p>\n<div class=\"note\">The mind gravitates to the number it can see. A falling price feels like information about the business. Usually it is information about other people.</div>"
        },
        {
          "l": "MECHANISM",
          "t": "Why prices move",
          "h": "Expectations, not <em>news</em>",
          "b": "<p>A company announces record profits and the share falls 6%. This looks irrational and is not.</p>\n<p>Prices already contain what everyone expects. The current price is the market's aggregate guess about the future. So a share does not move on news — it moves on the <strong>difference between the news and what was expected</strong>.</p>\n<div class=\"dt\"><table>\n<tr><th>Result</th><th>Expectation</th><th>Price</th></tr>\n<tr><td>Profit up 20%</td><td class=\"g\">Market expected 30%</td><td class=\"n\">Falls</td></tr>\n<tr><td>Profit down 5%</td><td class=\"g\">Market expected down 15%</td><td class=\"n\">Rises</td></tr>\n<tr><td>Profit up 20%</td><td class=\"g\">Market expected 20%</td><td class=\"n\">Barely moves</td></tr>\n</table></div>\n<p>Two consequences follow directly, and both are load-bearing for the rest of this pack:</p>\n<ul>\n<li><strong>Good news is not a reason to buy.</strong> If you have read it, it is already in the price. You are not early; you are late by definition.</li>\n<li><strong>Beating the market requires being right about something the market has priced wrongly</strong> — not being right about the company. Those are completely different achievements, and Mission 12 — If you pick stocks is honest about the odds.</li>\n</ul>"

          "l": "RECALL",
          "t": "Mission 02",

      "cards": [
        {
          "l": "DEFINE",
          "t": "The exchanges",
          "h": "NSE and <em>BSE</em>",
          "b": "<p>Two exchanges matter in India.</p>\n<div class=\"two\"><div><b>NSE</b>National Stock Exchange, founded 1992. Dominant by volume in both cash and derivatives. Its main index is the <span class=\"k\">Nifty 50</span>.</div>\n<div><b>BSE</b>Bombay Stock Exchange, founded 1875 and Asia's oldest. Its main index is the <span class=\"k\">Sensex</span>, 30 companies.</div></div>\n<p>An <span class=\"k\">index</span> is a measured basket of companies used to represent a market. The Nifty 50 is the fifty largest and most liquid companies weighted by the portion of shares actually available to trade. When the news says the market rose 1%, it means an index rose 1%.</p>\n<p>Most large companies are listed on both. The price difference between them is negligible, so for an ordinary investor the choice of exchange is not a decision.</p>\n<div class=\"note\">Indices used later in this pack: <strong>Nifty 50</strong> (largest 50), <strong>Nifty Midcap 150</strong> (ranked 101–250), <strong>Nifty Smallcap 250</strong> (ranked 251–500), <strong>Nifty 500</strong> (the broad market). Each is reviewed twice a year.</div>"

          "l": "DEFINE",
          "t": "The plumbing",
          "h": "Four things <em>required</em>",

          "t": "SEBI",
          "h": "What protection <em>covers</em>",
          "b": "<p>The <span class=\"k\">Securities and Exchange Board of India</span> regulates the market: it licenses brokers and fund houses, sets disclosure rules, defines fund categories, and acts against fraud and manipulation.</p>\n<p>What that protection does and does not extend to is worth being precise about, because the gap is where people are surprised.</p>\n<div class=\"two\"><div><b>Covered</b>Fraud, manipulation, misselling, broker misconduct, false disclosure. There is a formal complaint route — SCORES — and an investor protection fund.</div>\n<div><b>Not covered</b>Losing money. A regulated product bought willingly that then falls in value is a normal outcome, not a grievance.</div></div>\n<div class=\"note\">The second column is the whole point of regulation being about <em>process</em> rather than <em>outcome</em>. Anyone offering an investment where losses cannot happen is describing something that either is not an investment or is not legal — both covered in Mission 13 — Where money is lost.</div>"

    {
      "n": "04",
      "title": "The vehicles",
      "stage": "Instruments",
      "line": "Four ways to own equity, how an index is actually built, and how to choose one instrument rather than collecting nine.",
      "cards": [
        {
          "l": "WHY",
          "t": "Four routes",
          "h": "Owning equity, four <em>ways</em>",
          "b": "<div class=\"dt\"><table>\n<tr><th>Route</th><th>What it is</th><th>Demands</th></tr>\n<tr><td>Direct shares</td><td class=\"g\">You choose and hold individual companies</td><td class=\"g\">Research, time, and tolerance for being wrong in public</td></tr>\n<tr><td>Active fund</td><td class=\"g\">A manager picks, aiming to beat an index</td><td class=\"g\">Choosing a manager, and a higher fee</td></tr>\n<tr class=\"hi\"><td>Index fund</td><td class=\"g\">Holds an index mechanically, no judgement</td><td class=\"g\">Almost nothing. Bought like any mutual fund</td></tr>\n<tr><td>ETF</td><td class=\"g\">An index fund that trades on the exchange like a share</td><td class=\"g\">A demat account, and attention to price at purchase</td></tr>\n</table></div>\n<p>These are not rungs on a ladder of sophistication. They are different amounts of work in exchange for different amounts of control, and the amount of work required is genuinely large for the first two.</p>\n<div class=\"note\">The honest framing for someone investing their own money alongside a full-time job: routes three and four are the default, and routes one and two need a reason. Mission 12 — If you pick stocks states what that reason has to look like.</div>"
        },
        {
          "l": "MECHANISM",
          "t": "SIP",
          "h": "The same amount, <em>every</em> month",
          "b": "<p>A <span class=\"k\">systematic investment plan</span> invests a fixed sum on a fixed date, automatically. It is a schedule, not a product — any fund can be bought this way.</p>\n<p>What it actually does is remove one decision permanently:</p>\n<div class=\"two\"><div><b>What it solves</b>The timing question, which almost nobody answers well, is answered once and never revisited. Falling prices buy more units, rising prices buy fewer.</div>\n<div><b>What it does not solve</b>It does not guarantee a profit and does not protect against a fall. A SIP running into a three-year decline is down, and the units bought cheaply only help if you are still there afterwards.</div></div>\n<p>The real mechanism is behavioural rather than mathematical. Its value is that <strong>the investment happens on the days you would not have chosen to invest</strong> — which, as Mission 08 — Behaviour shows, are the days that matter most.</p>\n<div class=\"stamp\">AMFI, July 2026</div>\n<p>Monthly SIP contributions across India reached ₹31,961 crore in July 2026, the fifth consecutive month above ₹30,000 crore, against total open-ended mutual fund assets of ₹85.59 lakh crore.</p>"
        },
        {
          "l": "TRADE-OFF",
          "t": "Active and passive",
          "h": "The argument, put <em>fairly</em>",
          "b": "<p>Both sides have a real case and the disagreement is narrower than the noise suggests.</p>\n<div class=\"two\"><div><b>For active</b>India is less efficiently priced than the United States. Coverage of mid and small companies is thin, so genuine mispricing exists and a skilled manager can find it. Some do, over long periods.</div>\n<div><b>For passive</b>Before costs, all investors together hold the market and therefore earn the market. After costs, the average actively managed rupee must earn less than the market by the amount of the fee. This is arithmetic, not opinion.</div></div>\n<p>What the arithmetic does not settle is whether <em>your</em> chosen fund is above average. The difficulty is that identifying the future outperformer is a harder problem than the one you were trying to avoid, and past performance is a weak guide to it.</p>\n<div class=\"note\">The practical resolution most people arrive at: a passive core that captures the market cheaply, with active exposure added deliberately and in a limited proportion where the case is strongest. Mission 09 — Allocation and rebalancing gives that structure a shape.</div>"
        },
        {
          "l": "MECHANISM",
          "t": "Index construction",
          "h": "A rule, and its <em>consequences</em>",
          "b": "<p>An index looks neutral. It is not — it is a written rule, and every rule has consequences worth knowing before you own one.</p>\n<p>The Nifty 50 weights companies by <span class=\"k\">free-float market capitalisation</span>: the value of shares actually available to trade. Bigger company, bigger weight.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Consequence 1 — It buys what has risen</b>A company that doubles gets a larger weight automatically. The index is momentum-following by construction, with no view involved.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Consequence 2 — It concentrates</b>The top ten holdings dominate. An index of fifty companies is not fifty equal bets, and its sector mix is an accident of which sectors grew.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Consequence 3 — It self-cleans</b>Companies that shrink fall out at the twice-yearly review and are replaced. Losers are removed without anyone deciding to sell.</div>\n</div>\n<div class=\"note\">The third consequence is the strongest and least discussed argument for indexing. An index has no ego, no thesis to defend and no reluctance to admit a mistake — precisely the three failures that Mission 12 — If you pick stocks identifies as most expensive in individual investors.</div>"
        },
        {
          "l": "DEFINE",
          "t": "The families",
          "h": "Which index, and <em>why</em>",
          "b": "<div class=\"dt\"><table>\n<tr><th>Index</th><th>Holds</th><th>Role</th></tr>\n<tr class=\"hi\"><td>Nifty 50</td><td class=\"g\">Largest 50 companies</td><td class=\"g\">The standard core. Cheapest to track</td></tr>\n<tr><td>Sensex 30</td><td class=\"g\">Largest 30</td><td class=\"g\">Nearly the same exposure, fewer names</td></tr>\n<tr><td>Nifty Next 50</td><td class=\"g\">Companies ranked 51–100</td><td class=\"g\">Larger swings. Not a core holding</td></tr>\n<tr class=\"hi\"><td>Nifty 500</td><td class=\"g\">Top 500, roughly the whole market</td><td class=\"g\">One holding covering large, mid and small</td></tr>\n<tr><td>Nifty Midcap 150</td><td class=\"g\">Ranked 101–250</td><td class=\"g\">A deliberate tilt, taken knowingly</td></tr>\n<tr><td>Nifty Smallcap 250</td><td class=\"g\">Ranked 251–500</td><td class=\"g\">The widest range of outcomes</td></tr>\n</table></div>\n<p>For most people building a first core the choice is between two, and the argument is short: a Nifty 50 fund is the cheapest and most liquid, while a Nifty 500 fund gives the whole market in one line and removes the need to decide how much mid and small cap to hold.</p>\n<div class=\"note\">Everything beyond the core is a tilt, and a tilt is a claim that one part of the market will do better than the rest. That is a legitimate position to hold. It is not diversification, and Mission 11 — Beyond the core prices it honestly.</div>"
        },
        {
          "l": "DEFINE",
          "t": "Tracking",
          "h": "Error and <em>difference</em>",
          "b": "<p>An index fund aims to match an index and never quite does. Two separate measures describe the shortfall, and they are constantly confused.</p>\n<div class=\"two\"><div><b>Tracking difference</b>How far the fund's return sits below the index over a period. This is the number that costs you money, and it is roughly the expense ratio plus frictions.</div>\n<div><b>Tracking error</b>How <em>consistently</em> it lags — the volatility of the gap. A fund can have low error and a persistent, predictable shortfall.</div></div>\n<p>Marketing quotes tracking error because it sounds like precision. The number to actually compare between two funds tracking the same index is the <strong>tracking difference</strong>, over three years or more.</p>\n<div class=\"note\">Two funds tracking the identical index are not the same product. They differ by their costs and their operational quality, and over twenty years that difference compounds — which is the entire subject of Mission 05 — Costs.</div>"
        },
        {
          "l": "MECHANISM",
          "t": "ETF pricing",
          "h": "Two prices, and the <em>gap</em>",
          "b": "<p>An ordinary index fund has one price a day: the <span class=\"k\">NAV</span>, the net asset value of everything it holds, calculated after the market closes. You get that price whenever you place the order.</p>\n<p>An ETF has two prices at once — its NAV, and the price people are actually trading it at on the exchange. Those two can separate.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Premium</b>Market price above NAV. You pay more than the underlying is worth.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Discount</b>Market price below NAV. You receive less than the underlying is worth when selling.</div>\n</div>\n<p>Large institutions arbitrage the gap away and normally it is tiny. It widens in exactly the conditions where it hurts: thin volumes, and violent market days when everyone is transacting at once.</p>\n<div class=\"note\">Two habits close most of this risk. Check the indicative NAV before placing an ETF order, and use a limit order rather than a market order. Never transact in an ETF in the opening or closing minutes, when spreads are widest.</div>"
        },
        {
          "l": "TRADE-OFF",
          "t": "Choosing",
          "h": "Index fund or <em>ETF</em>",
          "b": "<div class=\"dt\"><table>\n<tr><th></th><th>Index fund</th><th>ETF</th></tr>\n<tr><td>Demat needed</td><td class=\"g\">No</td><td class=\"g\">Yes</td></tr>\n<tr><td>Price you get</td><td class=\"g\">End-of-day NAV, always</td><td class=\"g\">Whatever the market quotes</td></tr>\n<tr><td>SIP</td><td class=\"g\">Straightforward and automatic</td><td class=\"g\">Clumsy, and manual on most platforms</td></tr>\n<tr><td>Expense ratio</td><td class=\"g\">Slightly higher</td><td class=\"g\">Usually lowest available</td></tr>\n<tr><td>Hidden cost</td><td class=\"g\">None material</td><td class=\"g\">Spread and premium or discount on every trade</td></tr>\n</table></div>\n<p>The lower expense ratio on an ETF is real and visible. The spread and the gap to NAV are also real and are not in any published cost figure — so an ETF bought monthly in small amounts can end up more expensive than the index fund it appears to undercut.</p>\n<div class=\"note\">For regular monthly investing, the index fund is usually the correct instrument. For a single large deployment where the spread can be watched, the ETF often wins. The instrument follows the transaction pattern, not the headline fee.</div>"
        },
        {
          "l": "MOVE",
          "t": "Selecting one",
          "h": "Five checks, in <em>order</em>",
          "b": "<div class=\"sheet\"><div class=\"h\">Comparing two funds on the same index</div>\n<div class=\"r\"><b>1 — Same index?</b><span>Compare like with like. A Nifty 50 fund and a Nifty Next 50 fund are not competitors.</span></div>\n<div class=\"r\"><b>2 — Tracking difference</b><span>Over three years or more. The lower, the better. This is the real cost.</span></div>\n<div class=\"r\"><b>3 — Total cost</b><span>On the same basis for both — see the live card in this mission on why that now needs care.</span></div>\n<div class=\"r\"><b>4 — Fund size</b><span>Very small funds carry higher frictions and closure risk. Very large is not a problem for an index fund.</span></div>\n<div class=\"r\"><b>5 — Direct plan</b><span>Always. Mission 05 — Costs shows what the regular plan takes.</span></div>\n</div>\n<p>Notice what is absent: <strong>past returns</strong>. Two funds tracking the same index have almost the same returns by construction, and any visible difference between them is the cost and the frictions — which the checks above measure directly and more honestly.</p>"

        {
          "l": "LIVE",
          "t": "The new rulebook",
          "h": "What changed on 1 April <em>2026</em>",
          "b": "<div class=\"stamp\">In force since 1 Apr 2026</div>\n<p>The <strong>SEBI (Mutual Funds) Regulations, 2026</strong> replaced the 1996 regulations. Four changes reach an ordinary investor.</p>\n<ul>\n<li><strong>TER became BER.</strong> The single Total Expense Ratio was split — a Base Expense Ratio covering the fund house's own fee, with brokerage and statutory levies such as GST, STT and stamp duty now disclosed separately.</li>\n<li><strong>Caps reduced.</strong> Index funds and ETFs from 1.00% to <strong>0.90%</strong>; equity fund-of-funds from 2.25% to 2.10%; close-ended equity schemes from 1.25% to 1.00%.</li>\n<li><strong>Brokerage limits tightened</strong>, with statutory levies charged on actuals.</li>\n<li><strong>Category overlap rules.</strong> A fund house can no longer run multiple schemes with substantially overlapping mandates; solution-oriented funds were replaced by life cycle funds.</li>\n</ul>\n<div class=\"note\">The caps are ceilings, not prices. Competitive Nifty 50 index funds charge a small fraction of 0.90%, and the gap between the cap and the market rate is the point of comparing rather than assuming.</div>"

          "h": "The unbundling <em>caught</em> people out",
          "b": "<p>The widely repeated expectation was that expense ratios would fall after April 2026. What actually happened is a useful lesson in reading any disclosure change.</p>\n<p>Because costs previously bundled are now itemised, reported totals in some categories <strong>rose</strong> rather than fell — the same underlying cost, more completely disclosed. Analysis of the flexi-cap category showed increases across a range of schemes.</p>\n<div class=\"note\">Two practical consequences. Figures published before April 2026 are <strong>not directly comparable</strong> with those after it. And when comparing two funds today, compare base against base or total against total — never one against the other, which is exactly the mistake a fund with a low base and high levies benefits from.</div>"

          "l": "WHY",
          "t": "The certain number",
          "h": "Returns are unknown. Costs are <em>not</em>",

          "b": "<p>₹10 lakh invested for twenty years, at an assumed 11% before costs. The only thing changing between these rows is the annual charge.</p>\n<div class=\"bars\">\n<div class=\"row\"><div class=\"lb\"><span>0.2% — a cheap index fund</span><span>₹78.0 lakh</span></div><div class=\"tr\"><i style=\"width:100%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>0.5%</span><span>₹73.7 lakh</span></div><div class=\"tr\"><i style=\"width:94%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>1.0% — a cheap active fund</span><span>₹67.3 lakh</span></div><div class=\"tr\"><i class=\"b\" style=\"width:86%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>1.8% — a regular-plan active fund</span><span>₹58.0 lakh</span></div><div class=\"tr\"><i class=\"d\" style=\"width:74%\"></i></div></div>\n</div>\n<p>The gap between the first and last row is <strong>about ₹20 lakh</strong> — two times the original investment, removed by a difference of 1.6 percentage points a year that never appeared on any statement as a deduction.</p>\n<div class=\"note\">Illustrative arithmetic on an assumed return, not a forecast. The <em>ratio</em> between the rows is the durable part and does not depend on the 11% assumption being right.</div>"

      "cards": [
        {
          "l": "LIVE",
          "t": "Equity",
          "h": "The rates, <em>today</em>",
          "b": "<div class=\"stamp\">FY 2026–27 · checked 17 Aug 2026</div>\n<div class=\"dt\"><table>\n<tr><th>Item</th><th>Position</th></tr>\n<tr class=\"hi\"><td>Holding period</td><td class=\"g\">More than <strong>12 months</strong> makes listed equity and equity mutual funds long-term</td></tr>\n<tr class=\"hi\"><td>LTCG</td><td class=\"g\"><strong>12.5%</strong> on gains above <strong>₹1.25 lakh</strong> per financial year. No indexation</td></tr>\n<tr><td>STCG</td><td class=\"g\"><strong>20%</strong> on listed equity and equity funds where STT is paid</td></tr>\n<tr><td>Cess</td><td class=\"g\">4% on the tax, plus surcharge where income thresholds are crossed</td></tr>\n<tr><td>Regime</td><td class=\"g\">Old or new regime does not change these special rates</td></tr>\n</table></div>\n<p>The structure dates from 23 July 2024, which raised STCG from 15% to 20%, standardised LTCG at 12.5%, removed indexation for most assets and lifted the exemption from ₹1 lakh to ₹1.25 lakh.</p>\n<p>The <strong>Income-tax Act, 2025</strong> took effect on 1 April 2026, replacing the 1961 Act. It reorganises and renumbers sections; <strong>it did not change the capital gains rates or holding periods</strong>, and Budget 2026 left them alone too.</p>\n<div class=\"note\">One detail worth knowing because it circulated widely and then changed: a draft transitional relief allowing long-term losses accumulated before 31 March 2026 to be set off against short-term gains was <strong>removed from the final Act</strong>. If you planned around it, confirm the current position with a professional before relying on it.</div>"

          "b": "<div class=\"dt\"><table>\n<tr><th>Item</th><th>Treatment</th></tr>\n<tr><td>Dividends</td><td class=\"g\">Added to total income, taxed at your slab rate. TDS of 10% where dividends from one fund house exceed ₹5,000 in a year</td></tr>\n<tr class=\"hi\"><td>Debt mutual funds</td><td class=\"g\">Bought on or after 1 April 2023: <strong>slab rate</strong> regardless of holding period. No indexation, no long-term distinction</td></tr>\n<tr><td>Gold funds and ETFs</td><td class=\"g\">Where listed and meeting conditions, long-term at 12 months and 12.5%. Confirm for the specific instrument</td></tr>\n<tr><td>Short-term losses</td><td class=\"g\">Set off against both short-term and long-term gains</td></tr>\n<tr><td>Long-term losses</td><td class=\"g\">Set off against long-term gains only</td></tr>\n<tr><td>Carry forward</td><td class=\"g\">Up to 8 years, <strong>only if the return is filed by the due date</strong></td></tr>\n</table></div>\n<p>Two asymmetries are worth carrying. A long-term loss cannot shelter a short-term gain, though the reverse works. And the carry-forward is lost entirely by filing late — a deadline, not a rate, quietly deciding the value of a loss.</p>\n<p>The debt row is the consequential one for portfolio design: since April 2023 debt funds lost their tax advantage entirely, which is why Mission 11 — Beyond the core compares them against fixed deposits and small savings on equal terms rather than assuming the fund wins.</p>"

          "t": "The threshold",
          "h": "What the exemption <em>does</em>",

        {

          "h": "What selling early actually <em>costs</em>",
          "b": "<p>The gap between 20% and 12.5% is not a detail. On a gain of ₹5 lakh it is the difference between roughly ₹1.04 lakh of tax and roughly ₹52,700 — and the only variable is the date.</p>\n<div class=\"dt\"><table>\n<tr><th>Sold at</th><th>Rate</th><th>Tax on ₹5L gain</th></tr>\n<tr><td>11 months</td><td class=\"n\">20%</td><td class=\"n\">~₹1,04,000</td></tr>\n<tr class=\"hi\"><td>12 months and a day</td><td class=\"n\">12.5% above ₹1.25L</td><td class=\"n\">~₹48,750</td></tr>\n</table></div>\n<p>So a position approaching the line is worth checking before selling. But note the shape of that sentence carefully: the tax outcome is a reason to <em>check the date</em>, not a reason to hold something you have concluded should be sold.</p>\n<div class=\"note\">The arithmetic that settles it: if the holding is genuinely impaired, the difference in tax is a fraction of the gain, while the continued exposure is all of it. Waiting three weeks for a rate is sensible. Waiting three months for a rate while the reason for holding has gone is not.</div>"

          "l": "TRAP",
          "t": "The tail wagging",
          "h": "Tax as a <em>reason</em>",

    {
      "n": "07",

      "cards": [
        {
          "l": "WHY",
          "t": "Two meanings",
          "h": "Volatility and <em>permanent loss</em>",
          "b": "<p>The word risk is used for two entirely different things, and confusing them causes people to fear the survivable and ignore the fatal.</p>\n<div class=\"two\"><div><b>Volatility</b>Prices moving around. Uncomfortable, temporary, and the mechanism by which equity returns exist at all — you are paid for tolerating it.</div>\n<div><b>Permanent loss</b>Capital that does not come back. A company that fails, a fraud, or being forced to sell at the bottom and never returning.</div></div>\n<p>The second is the only one that matters over a long horizon, and it has three main causes:</p>\n<ul>\n<li><strong>Concentration</strong> — too much in one company or one theme, so one failure is terminal.</li>\n<li><strong>Leverage</strong> — borrowed money, which turns a temporary fall into a forced exit.</li>\n<li><strong>Being forced to sell</strong> — which is a horizon and emergency-fund failure from Mission 01 — Before any of it, appearing as a market loss.</li>\n</ul>\n<div class=\"note\">Notice that all three are decided <em>before</em> the fall arrives, not during it. That is the most useful thing in this mission: permanent loss is almost always structural, and structure is set while calm.</div>"

        {
          "l": "NUMBERS",
          "t": "Drawdowns",

          "b": "<p>The long-run return figure quoted for Indian equity conceals the path taken to produce it. The path includes these.</p>\n<div class=\"bars\">\n<div class=\"row\"><div class=\"lb\"><span>2008 global financial crisis</span><span>about −60%</span></div><div class=\"tr\"><i class=\"d\" style=\"width:100%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>2000 technology unwind</span><span>about −50%</span></div><div class=\"tr\"><i class=\"d\" style=\"width:83%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>March 2020, in about a month</span><span>about −38%</span></div><div class=\"tr\"><i class=\"d\" style=\"width:63%\"></i></div></div>\n<div class=\"row\"><div class=\"lb\"><span>2011</span><span>about −28%</span></div><div class=\"tr\"><i class=\"d\" style=\"width:47%\"></i></div></div>\n</div>\n<p>These are index-level falls. Individual stocks and small-cap indices fell considerably further, and many companies that fell never recovered at all.</p>\n<div class=\"note\">The correct way to hold this: <strong>a fall of 30% or more is a normal feature of a long investing life, not an emergency.</strong> Anyone investing in Indian equity for thirty years should expect to live through several. The plan has to survive them by design, because it will certainly meet them.</div>"

        {
          "l": "LIVE",
          "t": "The distribution",
          "h": "The average is not the <em>experience</em>",
          "b": "<div class=\"stamp\">Index data to mid-2026</div>\n<p>People anchor on a single number — \"equity returns about 12%\" — and then experience something that looks nothing like it. The average is real and the experience is the distribution around it.</p>\n<div class=\"dt\"><table>\n<tr><th>Nifty 50, total return</th><th>Figure</th></tr>\n<tr><td>Median across all 1-year windows since 1999</td><td class=\"n\">+12.48%</td></tr>\n<tr class=\"hi\"><td>Best 1-year window</td><td class=\"n\">+108.92%</td></tr>\n<tr class=\"hi\"><td>Worst 1-year window</td><td class=\"n\">−55.30%</td></tr>\n<tr><td>Five-year annualised, to June 2026</td><td class=\"n\">+9.99%</td></tr>\n<tr><td>One year to June 2026</td><td class=\"n\">−5.42%</td></tr>\n<tr><td>Annualised volatility, year to June 2026</td><td class=\"n\">13.05%</td></tr>\n</table></div>\n<p>Read the last two rows carefully, because they describe now. <strong>The trailing year has been negative.</strong> A person who began investing twelve months ago is currently down, is experiencing something entirely normal, and is at precisely the point where most people conclude the strategy is broken.</p>\n<div class=\"note\">This is what a base rate is for. Not prediction — calibration. If you expect a range from roughly −55% to over +100% in any single year, a bad year is data. If you expect 12%, a bad year is a crisis, and crises produce the decisions in Mission 08 — Behaviour.</div>"

        {
          "l": "MECHANISM",
          "t": "Calibration",
          "h": "What three years actually <em>contains</em>",
          "b": "<p>Three years feels like a long time to a person and is a short time to a market. It is worth being explicit about what a three-year holding period historically contains, because this is the horizon most people actually operate on while believing they are long-term.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Usually</b>At least one fall of 10% or more, and often one of 20%.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Frequently</b>A stretch of twelve to eighteen months where the index goes nowhere and every month feels like a mistake.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Sometimes</b>A three-year window that ends below where it started. These exist in the record and are not rare.</div>\n</div>\n<p>The practical use of this is a single question to ask before committing money: <strong>if this position is down 30% eighteen months from now, and nothing about the reason for holding it has changed, what will I do?</strong></p>\n<div class=\"note\">If the honest answer is \"sell\", then the position is too large, or the money has too short a horizon, or the conviction was never real. All three are fixable now and none is fixable then.</div>"

          "l": "MECHANISM",

          "h": "What it fixes, and what it <em>does not</em>",

    {
      "n": "08",
      "title": "Behaviour",
      "stage": "The real variable",
      "line": "The measurable gap between what investments return and what investors receive — and the machinery that closes it, since knowledge alone does not.",
      "cards": [
        {
          "l": "WHY",
          "t": "The gap",
          "h": "The fund returns more than its <em>investors</em>",
          "b": "<p>A fund reports a ten-year return. Its investors, on average, receive less than that. This is measured repeatedly across markets and is not a rounding difference.</p>\n<p>The cause is not fees, which are already inside the reported number. It is <strong>timing of entry and exit</strong>. Money arrives after good performance and leaves after bad performance, so the average rupee is present for less of the rise and more of the fall than the fund's own return implies.</p>\n<div class=\"note\">This is the single most important fact in personal investing, and it reframes everything: <strong>the return you receive is determined more by your behaviour than by your selection.</strong> Choosing well and behaving badly loses to choosing adequately and behaving well.</div>"
        },
        {
          "l": "MECHANISM",
          "t": "Timing",
          "h": "Why getting out and back in <em>fails</em>",
          "b": "<p>Exiting before a fall and re-entering at the bottom requires two correct decisions, not one, and the second is harder than the first because it must be made when the news is worst and the fall feels most permanent.</p>\n<p>The arithmetic is unforgiving for a specific structural reason: <strong>the best days cluster inside the worst periods.</strong> The largest single-day rises in market history occur during crashes, days or weeks from the largest falls. Being out during the fall means being out during the rebound, because they are the same fortnight.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Stayed invested</b>Receives the full period return, including every violent recovery day.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Missed a handful of the best days</b>A substantial portion of the entire period's return is gone — and those days were unpredictable in advance.</div>\n</div>\n<p>The trap closes because exiting <em>feels</em> like risk management. It is a forecast, made under stress, requiring two correct calls, at a moment when judgement is at its worst.</p>"

        {

          "b": "<div class=\"stamp\">AMFI flows, July 2026</div>\n<p>Behavioural theory is easier to accept when it is happening this month. Here is where Indian investors actually put money in July 2026, with the market about 7% below its January high.</p>\n<div class=\"dt\"><table>\n<tr><th>Category</th><th>Net flow, Jul 2026</th></tr>\n<tr class=\"hi\"><td>Small cap funds</td><td class=\"n\">+₹7,768 cr</td></tr>\n<tr class=\"hi\"><td>Mid cap funds</td><td class=\"n\">+₹6,192 cr</td></tr>\n<tr><td>Large cap funds</td><td class=\"n\">−₹1,322 cr</td></tr>\n<tr><td>All active equity</td><td class=\"n\">+₹24,697 cr</td></tr>\n<tr><td>SIP contributions</td><td class=\"n\">₹31,961 cr</td></tr>\n</table></div>\n<p>Set that against the valuations from Mission 11 — Beyond the core, where the Smallcap 250 trades about 22% above its five-year median while the Nifty 50 sits near its long-run average. Money is leaving the cheaper part of the market and entering the more expensive part.</p>\n<div class=\"note\">Two honest readings. This may be entirely rational — investors adding growth exposure deliberately. Or it may be the most documented pattern in the field: recent returns attracting money, at the point where recent returns have made the asset expensive. <strong>You cannot tell from the flow data which it is. You can tell which one you are doing.</strong></div>"
        },

          "t": "The biases",
          "h": "Named, so they can be <em>spotted</em>",
          "b": "<div class=\"sheet\"><div class=\"h\">The ones that cost real money</div>\n<div class=\"r\"><b>Loss aversion</b><span>A loss hurts roughly twice as much as an equal gain pleases. Produces selling to stop the feeling.</span></div>\n<div class=\"r\"><b>Recency</b><span>Whatever happened lately feels like what happens generally. Produces buying tops and selling bottoms.</span></div>\n<div class=\"r\"><b>Confirmation</b><span>Seeking evidence for what you already hold, and discounting the rest.</span></div>\n<div class=\"r\"><b>Anchoring</b><span>Fixating on your purchase price, which the market has never heard of.</span></div>\n<div class=\"r\"><b>Overconfidence</b><span>Most people rate themselves above average. Produces concentration and trading frequency.</span></div>\n<div class=\"r\"><b>Herding</b><span>Comfort in the crowd. Being wrong alongside everyone else feels survivable; being wrong alone does not.</span></div>\n<div class=\"r\"><b>Disposition effect</b><span>Selling winners to book a gain, holding losers to avoid booking a loss. Exactly backwards.</span></div>\n</div>\n<div class=\"note\">Reading this list produces recognition, not immunity. The biases operate below the level at which you can argue with them, and they operate hardest under stress — which is why every remaining card in this mission is about <em>structure</em> rather than awareness.</div>"

        {
          "l": "MOVE",
          "t": "Structure over willpower",
          "h": "What actually <em>works</em>",
          "b": "<p>Since the biases fire under stress, the defence has to be built before the stress arrives and has to work without requiring a good decision at the wrong moment.</p>\n<div class=\"sheet g\"><div class=\"h\">Defences that hold</div>\n<div class=\"r\"><b>Automate the investing</b><span>A SIP invests on the days you would not have chosen to. That is the whole point.</span></div>\n<div class=\"r\"><b>Reduce the checking</b><span>Watching a portfolio daily produces more loss aversion, not more information.</span></div>\n<div class=\"r\"><b>Write rules while calm</b><span>Decisions made in advance are made by a different person than the one in a crash.</span></div>\n<div class=\"r\"><b>Use bands, not opinions</b><span>Rebalancing on a threshold removes the judgement call entirely — Mission 09 — Allocation and rebalancing.</span></div>\n<div class=\"r\"><b>Add friction to selling</b><span>A mandatory waiting period between deciding to sell and selling.</span></div>\n<div class=\"r\"><b>Hold fewer things</b><span>Fewer holdings means fewer decisions, and every decision is an opportunity to be biased.</span></div>\n</div>"

        {
          "l": "MOVE",
          "t": "The journal",
          "h": "What it actually <em>reveals</em>",
          "b": "<p>For each decision, before acting, record four things: what you are doing, why, what you expect, and what would prove you wrong.</p>\n<p>The value is not in the writing. It is that memory rewrites itself — after the fact, everyone remembers having been more certain about what happened and less certain about what did not. A journal is the only defence against being edited by your own recollection.</p>\n<div class=\"note\">After a year the journal answers questions nothing else can: are your reasons actually reasons, or restatements of what the price recently did? Do your outcomes track your reasoning, or is a good outcome from a bad reason being recorded as skill? That second question is the one that decides whether Mission 12 — If you pick stocks is for you.</div>"

          "h": "The most <em>underrated</em> defence",
          "b": "<p>Every decision is an opportunity to be wrong, and the number of decisions is almost entirely within your control.</p>\n<div class=\"two\"><div><b>High-decision portfolio</b>Twelve holdings, several sector funds, direct stocks, monitored daily, rebalanced on instinct. Dozens of judgement calls a year, each one a chance for a bias to operate.</div>\n<div><b>Low-decision portfolio</b>Three or four holdings, automatic contributions, threshold rebalancing, reviewed twice a year. Perhaps four judgement calls a year.</div></div>\n<p>These can hold nearly identical underlying exposure. The difference is entirely in the number of opportunities to interfere — and given the gap in the first card of this mission, the second portfolio very likely delivers more to its owner.</p>\n<div class=\"note\">This is the single largest practical advantage an individual investor has over a professional. Nobody is watching you, so you are permitted to do nothing for long periods. A fund manager has to justify inaction to somebody every quarter.</div>"

          "l": "WHY",
          "t": "The dominant decision",
          "h": "Allocation over <em>selection</em>",
          "b": "<p>The split between asset classes — how much in equity, how much in debt, how much in gold — explains far more of a portfolio's outcome and its variability than the specific instruments chosen within each.</p>\n<p>Attention runs the other way. People spend hours choosing between two large-cap funds that hold nearly the same companies and minutes deciding whether the portfolio is 60% or 90% equity, when the second decision matters by an order of magnitude more.</p>\n<div class=\"note\">The reason is that the allocation decision is boring, has no news attached to it, and cannot be researched into a right answer. The selection decision produces the feeling of doing something. Notice which one is being avoided.</div>"

        {
          "l": "MOVE",

          "h": "The question that <em>determines</em> it",
          "b": "<p>The target is not found by asking what return you want. Everyone wants the highest. It is found by asking what you can survive.</p>\n<div class=\"dg\"><div class=\"dg-t\">The question that sets the number</div>\n<div class=\"flow\"><div class=\"n\"><b>What is the largest fall in this portfolio that I would sit through without selling?</b>Not tolerate in principle. Actually sit through, in dark months, with the news bad and no visible reason to expect recovery.</div></div></div>\n<p>Then work backwards using the record from Mission 07 — Risk and the record, where a 50% equity fall is a normal event.</p>\n<div class=\"dt\"><table>\n<tr><th>Equity share</th><th>Rough fall in a 50% equity crash</th></tr>\n<tr><td>100%</td><td class=\"n\">−50%</td></tr>\n<tr class=\"hi\"><td>80%</td><td class=\"n\">about −40%</td></tr>\n<tr class=\"hi\"><td>60%</td><td class=\"n\">about −30%</td></tr>\n<tr><td>40%</td><td class=\"n\">about −20%</td></tr>\n</table></div>\n<p>Three inputs settle it: <strong>horizon</strong> (from Mission 01 — Before any of it), <strong>the depth you can hold through</strong>, and <strong>whether your income is stable</strong> — because a person whose job is at risk in the same recession that takes the market down has less equity capacity than the same person with a secure income.</p>\n<div class=\"note\">A 60% equity portfolio held through a crash beats a 100% equity portfolio abandoned in one. The best allocation is not the highest-returning; it is the highest-returning one you will actually keep.</div>"

          "l": "MOVE",

          "h": "Thresholds beat <em>calendars</em>",
          "b": "<p>Two ways to rebalance back to the target.</p>\n<div class=\"two\"><div><b>Calendar</b>Once a year on a fixed date. Simple, but may act when nothing has moved, and may sit still through a violent dislocation because the date has not arrived.</div>\n<div><b>Bands</b>Act when an allocation drifts more than a set amount from target — five percentage points is a common threshold. Acts when something has actually happened.</div></div>\n<p>Bands are better because they respond to the market rather than the calendar, and the market does not move on schedule.</p>\n<div class=\"note\">A hybrid removes almost all the remaining work: <strong>check twice a year, act only if a band is breached.</strong> Two scheduled looks, and no action unless something has genuinely moved — which fits the fewer-decisions principle from Mission 08 — Behaviour rather than fighting it.</div>"

          "b": "<p>Rebalancing is usually explained as risk control. Its more interesting property is that it mechanically forces the behaviour everyone claims to want and almost nobody executes.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Target</b>60% equity, 40% debt. ₹10 lakh: ₹6 lakh and ₹4 lakh.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>Equity falls 40%</b>Equity is now ₹3.6 lakh, debt roughly ₹4.2 lakh. Total ₹7.8 lakh — equity has drifted to about 46%.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>The band is breached</b>Restoring 60% means moving roughly ₹1 lakh from debt into equity.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>What just happened</b>You bought equity after a 40% fall — the transaction almost nobody manages voluntarily — without predicting anything, and without needing to feel brave.</div>\n</div>\n<p>It works identically in reverse. After a long rally, equity drifts above target and the rule trims it — selling into strength, which is equally difficult by hand.</p>\n<div class=\"note\">The rule buys low and sells high as a side effect of arithmetic. That is why it is written down in advance: at the moment it triggers, doing it will feel obviously wrong.</div>"

          "l": "ORIENT",
          "t": "The honest answer",
          "h": "There is no <em>signal</em>. There is a gauge",
          "b": "<p>The question everyone actually wants answered is whether now is a good time to invest. There is no reliable answer, and any confident one should be treated as a warning about its source.</p>\n<p>What does exist is a set of gauges: measures that say whether prices are high or low <em>relative to history</em>. They are useless for prediction over months and genuinely informative over five to ten years, which happens to be the horizon that matters.</p>\n<div class=\"note\">The correct use of a gauge is not to decide whether to invest. It is to decide <strong>how much, at what pace, and with what expectation</strong>. Expensive markets do not mean stay out; they mean expect less and deploy more slowly.</div>"

        {

          "b": "<div class=\"dt\"><table>\n<tr><th>Gauge</th><th>What it asks</th><th>Weakness</th></tr>\n<tr class=\"hi\"><td>P/E</td><td class=\"g\">Price against last year's earnings</td><td class=\"g\">Distorted when earnings spike or collapse temporarily</td></tr>\n<tr><td>P/B</td><td class=\"g\">Price against net assets</td><td class=\"g\">Steadier, but misleading for asset-light businesses</td></tr>\n<tr><td>Dividend yield</td><td class=\"g\">Cash paid out against price</td><td class=\"g\">Falls when companies choose to reinvest instead</td></tr>\n<tr><td>Market cap to GDP</td><td class=\"g\">The whole market against the economy</td><td class=\"g\">Drifts upward as more of the economy lists</td></tr>\n</table></div>\n<p>Each is defective alone. Together they are informative, because their defects are different: when P/E is high, P/B is high <em>and</em> dividend yield is low, the reading is far more reliable than any one of them.</p>\n<div class=\"note\">The one thing no gauge can do is tell you <em>when</em>. Expensive markets can become considerably more expensive and stay there for years. A gauge sets your expectation of return; it does not set a date.</div>"

          "b": "<div class=\"stamp\">Collected 7–17 Aug 2026</div>\n<div class=\"dt\"><table>\n<tr><th>Index</th><th>P/E</th><th>Against its own history</th></tr>\n<tr class=\"hi\"><td>Nifty 50</td><td class=\"n\">~20.6</td><td class=\"g\">Around the long-run average of 20–21. Fairly valued</td></tr>\n<tr><td>Nifty Midcap 150</td><td class=\"n\">30.21</td><td class=\"g\">About 1% above its 5-year median of 29.77. Fairly valued</td></tr>\n<tr class=\"hi\"><td>Nifty Smallcap 250</td><td class=\"n\">34.43</td><td class=\"g\">About 22% above its 5-year median of 28.30. Moderately expensive</td></tr>\n</table></div>\n<p>Supporting readings: Nifty 50 P/B 3.17 and dividend yield about 1.2%, both in neutral territory rather than at an extreme. The index sits about 7% below its January 2026 high, and the trailing twelve months were negative.</p>\n<p>Read together, the picture is unusually clear for a valuation reading: <strong>large caps ordinary, mid caps ordinary, small caps stretched.</strong> Not a screaming buy, not a bubble, and one specific part of the market carrying a premium.</p>\n<div class=\"src\">Index P/E and median data from NSE-sourced index trackers, 7–14 Aug 2026. These move daily. The <em>framework</em> — compare an index to its own history, and read several gauges together — is the durable part.</div>"

          "h": "Against the <em>alternative</em>",
          "b": "<p>Valuation in isolation is incomplete, because equity always competes against the safe return available at the same moment. Turn the P/E upside down to compare them directly.</p>\n<div class=\"flow\">\n<div class=\"n\"><b>Earnings yield</b>1 divided by the P/E. At a Nifty P/E of about 20.6, that is roughly <strong>4.9%</strong> — the earnings the index produces per rupee of price.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>The safe alternative</b>Repo at 5.25%. Post office 5-year deposits at 7.5%, NSC at 7.7%, PPF at 7.1% tax-free.</div>\n<div class=\"a\">&#8595;</div>\n<div class=\"n\"><b>The comparison</b>Equity's current earnings yield is <strong>below</strong> the safe rates available today.</div>\n</div>\n<p>That is not a reason to avoid equity, and reading it that way is the classic misuse. Equity earnings <em>grow</em> and a deposit's coupon does not. The comparison tells you something more precise and more useful:</p>\n<div class=\"note\"><strong>Today's price requires earnings growth to justify it.</strong> You are not being paid a premium for current earnings; you are being paid for future ones. That is a normal condition for a growing economy, and it is also exactly what raises the cost of disappointment if growth does not arrive.</div>"

        {
          "l": "NUMBERS",

          "h": "Lump sum against <em>staggered</em>",
          "b": "<p>You have a large sum. Invest it all now, or spread it over months?</p>\n<p>The historical evidence is consistent and points the other way from intuition: <strong>investing the lump sum immediately wins more often than not.</strong> The reason is structural rather than clever — markets rise more often than they fall, so time out of the market is usually time missing returns rather than avoiding losses.</p>\n<div class=\"two\"><div><b>Lump sum</b>Wins in the majority of historical windows. Loses badly, and memorably, when the timing is unlucky.</div>\n<div><b>Staggered</b>Wins less often. Its losses are smaller and far easier to keep holding through.</div></div>\n<div class=\"note\">Which means the evidence answers a question most people are not actually asking. The lump sum maximises <em>expected</em> outcome. It does not maximise the chance you are still invested in eighteen months, and that is the constraint that binds — as the next card makes explicit.</div>"

        {

          "t": "The real question",
          "h": "Which mistake is <em>survivable</em>",
          "b": "<p>Reframe it away from maximisation. Two mistakes are available and only one is recoverable.</p>\n<div class=\"dt\"><table>\n<tr><th>Mistake</th><th>Feels like</th><th>Consequence</th></tr>\n<tr><td>Deployed slowly, market rose</td><td class=\"g\">Mild regret</td><td class=\"g\">Earned less than you could have. You are still invested</td></tr>\n<tr class=\"hi\"><td>Deployed everything, market fell 35%</td><td class=\"g\">Sickness, and self-blame</td><td class=\"g\">Frequently sold near the bottom, then stayed out for years</td></tr>\n</table></div>\n<p>The first mistake costs a portion of one period's return. The second can cost the entire strategy, because it damages the willingness to participate at all — and that damage is what Mission 08 — Behaviour measures as the gap between fund returns and investor returns.</p>\n<div class=\"note\">So the correct answer depends on the person, and the honest question is not <em>which produces more</em> but <strong>which mistake can I survive without abandoning the plan</strong>. A first large deployment, by someone who has not yet lived through a crash, is the strongest case for staggering that exists.</div>"

        {
          "l": "MOVE",
          "t": "Tranching",
          "h": "Rules written <em>before</em>",
          "b": "<p>If deploying in stages, the schedule must be written before the first rupee moves. A stagger without written rules becomes an open-ended wait, which is a different thing entirely.</p>\n<div class=\"sheet\"><div class=\"h\">A tranche plan has four parts</div>\n<div class=\"r\"><b>Base</b><span>A portion in immediately, regardless of anything. This ensures participation.</span></div>\n<div class=\"r\"><b>Schedule</b><span>Fixed dates for the rest — monthly or quarterly, over a defined period.</span></div>\n<div class=\"r\"><b>Triggers</b><span>Optional. Accelerate a tranche if the market falls a stated percentage.</span></div>\n<div class=\"r\"><b>Deadline</b><span>The date by which everything is deployed, whatever has happened. Non-negotiable.</span></div>\n</div>\n<p>The deadline is the part people omit and the part that does the work. Without it, a tranche plan silently converts into market timing the first time prices rise, and the remaining money never goes in.</p>\n<div class=\"note\">Where the money waits matters too. Undeployed cash belongs in a liquid fund or a savings account — not in equity \"temporarily\", which is the same decision you were trying to stage.</div>"

        {
          "l": "MECHANISM",
          "t": "The reserve",
          "h": "Cash as a <em>position</em>",
          "b": "<p>Cash held deliberately is a position, not an absence of one. It has a cost, a purpose and a limit, and all three should be stated.</p>\n<div class=\"three\"><div><b>Cost</b>It earns little and loses to inflation. That cost is continuous and certain.</div>\n<div><b>Purpose</b>The ability to act when prices fall. Optionality that only exists if the cash exists first.</div>\n<div><b>Limit</b>A stated percentage, decided in advance, with a rule for when it gets spent.</div></div>\n<p>The distinction that matters: this reserve is <strong>separate from the emergency fund</strong> in Mission 01 — Before any of it. The emergency fund is never invested under any circumstances. The reserve exists specifically to be invested, on stated conditions.</p>\n<div class=\"note\">Without a spending rule, a reserve becomes permanent. The person holding 30% cash waiting for a better price in 2021 was still holding it in 2024, and the cost of that wait exceeded the fall they were waiting for.</div>"

          "b": "<p>Staying out feels free. It is not, and the cost has three parts that never appear on a statement.</p>\n<ul>\n<li><strong>Foregone return.</strong> The market rose while you waited, and that gap compounds for as long as you hold whatever you eventually buy.</li>\n<li><strong>Inflation.</strong> Cash loses purchasing power continuously, at roughly the 4.4% currently being printed.</li>\n<li><strong>The escalating entry price.</strong> If you would not buy at 24,000 having wanted 22,000, you will not buy at 26,000 either. Waiting rarely resolves into buying; it resolves into a higher refusal threshold.</li>\n</ul>\n<div class=\"note\">The asymmetry to hold: <strong>the cost of being invested during a fall is visible and temporary. The cost of being uninvested during a rise is invisible and permanent.</strong> Only one of them generates an emotion, which is precisely why the other one wins so often.</div>"
