</div>
<div class="note">Every row here has a shelf life measured in weeks. The durable content of this card is its <em>shape</em>: three tiers per lab, a million tokens as standard, and open weights competitive at the top on licence terms that differ sharply.</div>`},

{l:"CHEAT",t:"Constants",h:"Numbers worth <em>knowing</em>",b:`<div class="sheet"><div class="h">Rules of thumb</div>
<div class="r"><b>100 tokens</b><span>≈ 75 English words</span></div>
<div class="r"><b>1M tokens</b><span>≈ 750,000 words ≈ a dozen novels</span></div>
<div class="r"><b>Output vs input</b><span>3–6x the price, because decode cannot be parallelised</span></div>
<div class="r"><b>70B model, FP16</b><span>140 GB → 4–8 H100s with KV cache</span></div>
<div class="r"><b>Effective context</b><span>Degradation is often observable well below the advertised limit</span></div>
<div class="r"><b>Agentic task</b><span>5–30x the tokens of one chat exchange</span></div>
<div class="r"><b>Cache read</b><span>0.1x the input rate</span></div>
<div class="r"><b>Batch API</b><span>0.5x, results in hours</span></div>
<div class="r"><b>Agent pilots to production</b><span>~11–14% at scale</span></div>
<div class="r"><b>NVIDIA share</b><span>&gt;90% of training, ~60–75% of inference</span></div>
</div>`},

{l:"CHEAT",t:"Diagnostics",h:"Symptom, layer, <em>fix</em>",b:`<p>The practical use of a map is finding where a problem lives. Read the left column, go to the right one.</p>
<div class="dt"><table>
<tr><th>Symptom</th><th>Layer</th><th>First move</th></tr>
<tr><td>Answers are wrong about our own business</td><td class="n">4</td><td class="g">Retrieval, not the model. Check what was actually retrieved</td></tr>
<tr><td>Long pause before anything appears</td><td class="n">3</td><td class="g">Prefill. Shorten the input; enable streaming</td></tr>
<tr><td>Words appear slowly once started</td><td class="n">3</td><td class="g">Decode. Smaller model, or speculative decoding</td></tr>
<tr class="hi"><td>Bill is several times the forecast</td><td class="n">3 and 5</td><td class="g">Caching, routing, agent step counts, thinking left on</td></tr>
<tr><td>Worked last month, worse now</td><td class="n">Governance</td><td class="g">Drift. Which version? What changed in the corpus or the questions?</td></tr>
<tr><td>Works on the laptop, fails live</td><td class="n">Reproducibility</td><td class="g">Pinned versions and environment as code</td></tr>
<tr><td>Confident answers that cite nothing</td><td class="n">4</td><td class="g">Require citation; permit refusal explicitly</td></tr>
<tr><td>Agent runs forever or costs a fortune</td><td class="n">5</td><td class="g">No hard bounds. Cap steps, spend and time</td></tr>
<tr><td>Fails one time in fifty on format</td><td class="n">5</td><td class="g">Constrained decoding, not a politer request</td></tr>
<tr><td>Cannot answer what it did in March</td><td class="n">Governance</td><td class="g">No traces. Cannot be fixed retrospectively — start now</td></tr>
</table></div>
<div class="note">Notice how few of these rows say <em>use a better model</em>. That is the pack's argument, restated as a troubleshooting table.</div>`},

{l:"RECALL",t:"Traps",h:"Every trap, gathered",b:`<div class="sheet q"><div class="h">The nine expensive mistakes</div>
<div class="r"><b>The model reflex</b><span>Treating model choice as the hard part. It is one layer of six.</span></div>
<div class="r"><b>The largest model</b><span>Paying frontier rates to classify two-word requests.</span></div>
<div class="r"><b>The hidden layer</b><span>Assuming a rented API removes serving decisions. It removes the operation only.</span></div>
<div class="r"><b>Context rot</b><span>Believing a large window is a usable window. Measured degradation says otherwise.</span></div>
<div class="r"><b>Hallucination</b><span>Expecting a model to know what it does not know. Cite, refuse, separate.</span></div>
<div class="r"><b>The shared plug</b><span>A universal connector is a universal target. Prompt injection is the mechanism.</span></div>
<div class="r"><b>The agent multiplier</b><span>Pricing an agent like a chat message. It is 5–30x.</span></div>
<div class="r"><b>The prompt as a limit</b><span>A limit in the prompt is a request. Limits live in code.</span></div>
<div class="r"><b>The unrecorded environment</b><span>Floating versions move. Pin everything, including the model.</span></div>
</div>`},

{l:"RECALL",t:"Glossary A–L",h:"Every term, A to L",b:`<table>
<tr><td>A2A</td><td>A protocol for agents built by different teams to delegate work to each other.</td></tr>
<tr><td>Agent</td><td>A system where the model chooses its own next action, using tools, until a goal is met.</td></tr>
<tr><td>Batching</td><td>Serving many requests together so weights are fetched once for all of them.</td></tr>
<tr><td>Chunk</td><td>A piece of a document, cut for storage and retrieval.</td></tr>
<tr><td>Constrained decoding</td><td>Restricting which tokens are permitted so invalid output cannot be produced.</td></tr>
<tr><td>Container</td><td>An application packaged with its whole environment so it runs identically anywhere.</td></tr>
<tr><td>Context engineering</td><td>Deliberately selecting, ordering, compressing and subtracting what goes on the desk.</td></tr>
<tr><td>Context rot</td><td>Measured accuracy loss as input grows, in cliffs rather than slopes.</td></tr>
<tr><td>Context window</td><td>The fixed space holding everything the model can see while answering.</td></tr>
<tr><td>CUDA</td><td>NVIDIA's software platform for programming its GPUs. The moat.</td></tr>
<tr><td>Decode</td><td>Generating output one token at a time. Cannot be parallelised.</td></tr>
<tr><td>Drift</td><td>A working system degrading without being changed — model, data or behaviour.</td></tr>
<tr><td>Embedding</td><td>A list of numbers representing a text's position in a space of meaning.</td></tr>
<tr><td>Eval</td><td>A fixed set of real cases with known-good answers, run on every change.</td></tr>
<tr><td>Fine-tuning</td><td>Continuing an existing model's training on specific examples to teach behaviour.</td></tr>
<tr><td>Foundation model</td><td>A broad general model intended to be adapted to many tasks.</td></tr>
<tr><td>GPU</td><td>A processor with thousands of simple workers running simultaneously.</td></tr>
<tr><td>Guardrail</td><td>A constraint enforced outside the model, on input, output or action.</td></tr>
<tr><td>Hallucination</td><td>Fluent, confident, false output. The mechanism working as designed.</td></tr>
<tr><td>Hybrid search</td><td>Keyword and embedding search combined, then merged.</td></tr>
<tr><td>Inference</td><td>Running a model to answer one request. Happens constantly.</td></tr>
<tr><td>KV cache</td><td>Working state kept for each active conversation. Consumes VRAM; limits batching.</td></tr>
<tr><td>Latency</td><td>Total time for one complete answer.</td></tr>
</table>`},

{l:"RECALL",t:"Glossary M–Z",h:"Every term, M to Z",b:`<table>
<tr><td>MCP</td><td>Model Context Protocol. A shared standard for connecting models to external systems.</td></tr>
<tr><td>Mixture of experts</td><td>A design where a huge model uses only a fraction of its parameters per token.</td></tr>
<tr><td>Multimodal</td><td>Able to take images, audio or video as input alongside text.</td></tr>
<tr><td>Open-weight</td><td>The weights file is published and downloadable. Not the same as open-source.</td></tr>
<tr><td>Parameters</td><td>The numbers inside a model. Also called weights.</td></tr>
<tr><td>Post-training</td><td>The stage that teaches a model to be helpful and follow instructions.</td></tr>
<tr><td>Pre-training</td><td>The stage where a model learns to predict the next token from vast text.</td></tr>
<tr><td>Prefill</td><td>Reading the whole input at once, in parallel. Determines TTFT.</td></tr>
<tr><td>Prompt caching</td><td>Reusing computed state for a repeated prefix, at about a tenth of the price.</td></tr>
<tr><td>Prompt injection</td><td>Instructions hidden in data the model reads, which it may follow.</td></tr>
<tr><td>Quantization</td><td>Storing weights in fewer bytes to cut memory and increase speed.</td></tr>
<tr><td>RAG</td><td>Retrieval-augmented generation. Search first, then answer from what was found.</td></tr>
<tr><td>Re-ranking</td><td>A second scoring pass that keeps the most useful retrieved passages.</td></tr>
<tr><td>Reasoning model</td><td>A model that generates hidden working-out before answering. Billed as output.</td></tr>
<tr><td>Routing</td><td>Sending each request to the cheapest model that can handle it.</td></tr>
<tr><td>Serving engine</td><td>Software that runs a model file efficiently for many users at once.</td></tr>
<tr><td>Speculative decoding</td><td>A small model guesses ahead; the large one verifies in one pass.</td></tr>
<tr><td>Structured output</td><td>Output in a fixed machine-readable shape rather than prose.</td></tr>
<tr><td>System prompt</td><td>Standing instructions sent with every request. Not a security boundary.</td></tr>
<tr><td>Test-time compute</td><td>Spending more effort at the moment of answering rather than at training.</td></tr>
<tr><td>Throughput</td><td>Total tokens served per second across all users.</td></tr>
<tr><td>Token</td><td>A fragment of text. The unit of both processing and billing.</td></tr>
<tr><td>Tool</td><td>A function outside the model that it can ask to have run.</td></tr>
<tr><td>Trace</td><td>Every step of one request linked together, with timings and costs.</td></tr>
<tr><td>Training</td><td>Creating the weights file. Happens occasionally, at enormous cost.</td></tr>
<tr><td>TTFT / TPOT</td><td>Time to first token; time per output token.</td></tr>
<tr><td>VRAM</td><td>Memory on the GPU itself. The model must fit in it.</td></tr>
<tr><td>Workflow</td><td>A sequence of steps you wrote, with the model thinking inside each one.</td></tr>
</table>`},

{l:"CHEAT",t:"Maintenance",h:"What goes <em>stale</em>, and when",b:`<p>This pack has two kinds of content, and they age at completely different rates. Knowing which is which is the difference between notes that stay useful and notes that quietly become wrong.</p>
<div class="dt"><table>
<tr><th>Content</th><th>Shelf life</th><th>Re-check</th></tr>
<tr class="hi"><td>Per-token prices</td><td class="n">Weeks</td><td class="g">Vendor pricing pages before any budget</td></tr>
<tr class="hi"><td>Model names and tiers</td><td class="n">1–2 months</td><td class="g">Vendor model pages</td></tr>
<tr><td>Open-weight rankings</td><td class="n">1–2 months</td><td class="g">Independent leaderboards, not launch posts</td></tr>
<tr><td>GPU rental rates</td><td class="n">Quarterly</td><td class="g">Provider price indexes</td></tr>
<tr><td>Serving engine versions</td><td class="n">Quarterly</td><td class="g">Project release notes</td></tr>
<tr><td>Market share, adoption stats</td><td class="n">6 months</td><td class="g">Analyst reports, with dates attached</td></tr>
<tr><td>Mechanisms — prefill, KV cache, RAG, the loop</td><td class="n">Years</td><td class="g">Nothing. These are the pack</td></tr>
</table></div>
<p>Every dated block in this pack carries the date it was collected for exactly this reason. A number without a date is not a fact; it is a rumour with a decimal point.</p>
<div class="note">When you revisit, replace the rows and keep the shapes. A price table refreshed is a new table. The reason output costs more than input does not change, because it follows from how decode works.</div>`},

{l:"CLOSE",t:"Where this stops",h:"The map, and the <em>ground</em>",b:`<p>This pack is the map: what every part of an AI system is, what it does, where it sits, and what it costs on the day it was written.</p>
<p>It deliberately goes wide and stops before depth. Every layer here is a subject with its own literature, and any one of them could be a pack of this size on its own.</p>
<p>What should now be possible, and is the only real test of it:</p>
<ul>
<li>Read any AI announcement and place it on the diagram within a sentence.</li>
<li>Hear a proposal and identify which layer it actually touches.</li>
<li>Read a symptom and know which layer to look in first.</li>
<li>Estimate a cost from a description, and know which four levers move it.</li>
<li>Recognise when a difficulty is a model problem, which it usually is not.</li>
</ul>
<div class="note">The one sentence to keep, if only one survives: <strong>everything around the model decides whether the system works.</strong></div>`}
]}
]};

const main=document.getElementById('main'), rail=document.getElementById('rail');
function lc(l){
  if(l==='TRAP'||l==='TRADE-OFF') return 'label q';
  if(l==='RECALL'||l==='CHEAT'||l==='CLOSE') return 'label r';
  if(l==='LIVE'||l==='NUMBERS') return 'label l';
  return 'label';
}
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards &nbsp;/&nbsp; Final</div>
  <h1>The <em>AI Stack</em></h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>No prior knowledge assumed<br>Live figures collected ${DATE}</div>
  <div class="note" style="margin-top:26px">Two kinds of card. <strong>Mechanism</strong> cards explain how something works and do not go stale. <strong>Live</strong> cards carry a collection date and do. Every number in this pack is dated, and the last mission lists what to re-check and when.</div>
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    <div class="mline">${m.line}</div>
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>

  });
  const b=document.createElement('b');rail.appendChild(b);

main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs,'+
'FROM,RUN,COPY,CMD,POST,GET').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\u0027\u0027\u0027[\\s\\S]*?\u0027\u0027\u0027|"(?:[^"\\\\\\n]|\\\\.)*"|\u0027(?:[^\u0027\\\\\\n]|\\\\.)*\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
