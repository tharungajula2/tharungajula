<div class="n"><b>1 — Arrive</b>The request reaches the serving layer with everything it needs, because nothing was remembered from last time.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Route</b>Difficulty is judged; a model tier is chosen.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Check the cache</b>Any prefix already computed is reused at a tenth of the price.</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Batch</b>Joined with other live requests so the weights are fetched once for all of them.</div>
<div class="a">&#8595;</div>
<div class="n"><b>5 — Prefill</b>The remaining input is read in parallel. The user is still waiting; this is TTFT.</div>
<div class="a">&#8595;</div>
<div class="n"><b>6 — Decode</b>Tokens are produced one at a time, possibly with a draft model guessing ahead. This is TPOT.</div>
<div class="a">&#8595;</div>
<div class="n"><b>7 — Stream</b>Tokens are sent as they are produced, so reading begins before writing finishes.</div>
</div></div>
<p>Streaming is the cheapest perceived-speed improvement in the entire stack. Nothing gets faster; the wait simply stops being visible.</p>`},

{l:"TRAP",t:"The hidden layer",h:"A rented API does not <em>remove</em> this",b:`<p>The tempting conclusion: rent an API and layer three belongs to somebody else.</p>
<p>Half true. The provider owns the machines, the engine, the batching and the quantization. What remains yours is every decision that determines what you send them — and that is where the bill is actually set.</p>
<ul>
<li>Which tier each request goes to, and whether anything routes down</li>
<li>Whether prompts are ordered so caching can work at all</li>
<li>Whether reasoning is on when it does not need to be</li>
<li>Whether anything is batched, or everything is treated as urgent</li>
<li>Whether context is trimmed, or the whole history is resent forever</li>
</ul>
<p>Every one of those is a serving decision made outside the serving provider. A team that believes this layer was outsourced makes all five badly, and discovers it in a monthly invoice.</p>
<div class="note">The general form, which recurs at every layer above: <strong>renting a component transfers the operation, not the decision.</strong></div>`},

{l:"RECALL",t:"Mission 04",h:"What is now owned",b:`<ul>
<li>Each request is <strong>stateless</strong>: everything needed must be sent every time.</li>
<li><strong>TTFT</strong> is prefill finishing; <strong>TPOT</strong> is decode running. Latency and throughput trade against each other.</li>
<li><strong>Quantization</strong> stores weights in fewer bytes — fewer machines, faster movement, some quality risk at the extreme.</li>
<li><strong>Serving engines</strong> — vLLM by default, SGLang for shared prefixes, TensorRT-LLM for one pinned model on NVIDIA.</li>
<li><strong>Batching</strong> raises throughput; the <strong>KV cache</strong> limits how much of it is possible, which is how long context becomes expensive.</li>
<li><strong>Caching</strong> repeated prefixes costs a tenth of normal input. Order prompts stable-first.</li>
<li>Four levers cut the bill: <strong>caching, batching, routing</strong>, and staying under the <strong>long-context threshold</strong>.</li>
<li>Renting an API transfers the operation of this layer, not the decisions.</li>
</ul>`}
]},
/* ============ MISSION 05 ============ */
{n:"05",title:"Data, retrieval and protocols",stage:"Layer 4",
line:"Giving the model something to work from. The layer where most production systems are actually won or lost.",
cards:[

{l:"ORIENT",t:"Layer 4",h:"Fast answers to the <em>wrong</em> question",b:`<p>By this point a model has been chosen and made to answer quickly and affordably. It still knows nothing about your organisation.</p>
<p>Its knowledge stops at a training date. It has never seen your policies, your customers, your codebase, or anything that happened this week. Ask it a question about your own business and it will answer fluently and incorrectly.</p>
<p>This layer closes that gap. It is also where the most expensive production failures happen, for a reason worth stating up front: <strong>every layer below this one makes the system faster. This layer is the only one that makes it right.</strong></p>
<div class="note">A system that retrieves the wrong document answers the wrong question perfectly, in a hundred milliseconds, at a tenth of a cent. Nothing downstream can detect that.</div>`},

{l:"DEFINE",t:"The context window",h:"One desk, fixed size",b:`<p>Picture a desk of fixed size. Everything the model can see while answering has to be laid out on that desk at once. That desk is the <span class="k">context window</span>.</p>
<div class="dg"><div class="dg-t">What is on the desk during one request</div>
<div class="lay">
<div><span>·</span>The standing instructions</div>
<div><span>·</span>Any loaded reference material</div>
<div><span>·</span>Every message in this conversation, from the first</div>
<div><span>·</span>Files attached, in full</div>
<div><span>·</span>Anything fetched by a search or a tool</div>
<div class="hot"><span>·</span>Room reserved for the reply</div>
</div></div>
<p>Two consequences follow from the statelessness established in Mission 04 — Inference and serving, and both are felt constantly by anyone using these systems:</p>
<ul>
<li><strong>The whole desk is re-read on every message.</strong> A conversation does not accumulate; the forty exchanges so far are sent again each time. Long conversations cost more per message than short ones.</li>
<li><strong>Nothing decays.</strong> Something said at message three is exactly as present at message forty as when it was written. Irrelevant early material does not fade — it is re-read at full strength forever.</li>
</ul>
<div class="stamp">Window sizes, 17 Aug 2026</div>
<p>Frontier windows now sit at roughly a million tokens — about 750,000 words — with 128K reserved for output at several labs. Google offers a million tokens on every tier down to its cheapest.</p>
<div class="note">Bigger desks change the arithmetic but not the principle, and the next card is the evidence for why.</div>`},

{l:"TRAP",t:"Context rot",h:"A large window is not a <em>usable</em> window",b:`<div class="stamp">Research current to mid-2026</div>
<p>The obvious inference from million-token windows is that retrieval is obsolete: load everything, ask the question. The measurements say otherwise, and this is one of the few places where the research is unambiguous enough to plan around.</p>
<p>Two separate failures get conflated and are worth separating:</p>
<div class="two"><div><b>Positional degradation</b>Accuracy depends on <em>where</em> the evidence sits. Material at the very start or very end is found reliably; material in the middle is found 20–30 points less often. Known as lost-in-the-middle.</div>
<div><b>Length degradation</b>Accuracy falls as the input grows even when the evidence is fixed and well placed. This is context rot proper.</div></div>
<div class="bars">
<div class="row"><div class="lb"><span>Reasoning accuracy, short input</span><span>0.92</span></div><div class="tr"><i style="width:92%"></i></div></div>
<div class="row"><div class="lb"><span>Same task, ~3,000 tokens</span><span>0.68</span></div><div class="tr"><i class="d" style="width:68%"></i></div></div>
<div class="row"><div class="lb"><span>Monitoring recall, short transcript</span><span>98.6%</span></div><div class="tr"><i style="width:98%"></i></div></div>
<div class="row"><div class="lb"><span>Same task, 800K-token prefill</span><span>88%</span></div><div class="tr"><i class="d" style="width:88%"></i></div></div>
</div>
<p>Three findings to carry, from work across eighteen frontier models:</p>
<ul>
<li><strong>Degradation is not gradual.</strong> Models hit cliffs rather than sloping down. Some hold at 32K and collapse at 64K.</li>
<li><strong>Similarity hurts more than length.</strong> When distractors resemble the answer, accuracy drops sharply — and worse as the input grows. Real documents are full of near-duplicates.</li>
<li><strong>Advertised length is not effective length.</strong> A million-token model does not reason across a million tokens; observable degradation on such models often begins somewhere around 300–400K.</li>
</ul>
<div class="note">This single card justifies the rest of the mission. Retrieval is not a workaround for small windows — it is how you keep the desk clean when the window is enormous. Everything that follows is a method for putting less, and better, in front of the model.</div>`},

{l:"DEFINE",t:"Embeddings",h:"Turning meaning into position",b:`<p>To find relevant text you need a way to compare meaning, not spelling. Keyword search cannot tell that <em>annual leave</em> and <em>holiday entitlement</em> are the same subject.</p>
<p>An <span class="k">embedding</span> is a list of numbers representing a piece of text's position in a space of meaning. Texts about similar things land close together; unrelated texts land far apart. Closeness is measured arithmetically, so a computer can do it in milliseconds across millions of documents.</p>
<div class="code" data-cap="what an embedding looks like"><pre>
"annual leave policy"   ->  [0.021, -0.184, 0.093, ... ]   # 1,536 numbers
"holiday entitlement"   ->  [0.019, -0.177, 0.101, ... ]   # very close
"fire safety drill"     ->  [-0.243, 0.512, -0.088, ... ]  # far away
</pre></div>
<p>You never read these numbers. They exist so that <em>close in meaning</em> becomes <em>close in space</em>, which turns an impossible search problem into an ordinary arithmetic one.</p>
<div class="note">Embeddings are produced by their own small models, separate from the one answering. Changing the embedding model invalidates every stored embedding, because the space itself has moved — which makes it a decision with a migration attached.</div>`},

{l:"MECHANISM",t:"Retrieval",h:"Search, then answer",b:`<p>The pattern is called <span class="k">retrieval-augmented generation</span>, almost always shortened to <span class="k">RAG</span>. It is the most common architecture in production AI, and it is four steps.</p>
<div class="flow">
<div class="n"><b>1 — Prepare, once</b>Split the documents into pieces, embed each piece, store them.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — On a question</b>Embed the question the same way.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Search</b>Find the handful of pieces closest to it.</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Answer</b>Put those pieces on the desk beside the question and ask the model to answer from them.</div>
</div>
<p>The model is not taught anything. It is handed the right page at the right moment — which is why Mission 03 — Models and training insisted that fine-tuning teaches behaviour while retrieval supplies facts.</p>
<p>Three properties make this the default choice:</p>
<div class="three"><div><b>Current</b>Update a document and the next answer uses it. No retraining.</div>
<div><b>Attributable</b>You know which passages were used, so the answer can cite them.</div>
<div><b>Bounded</b>Only relevant pieces reach the desk, which is the direct answer to context rot.</div></div>`},

{l:"MECHANISM",t:"Chunking",h:"How documents get cut up",b:`<p>Documents are split before storage, into <span class="k">chunks</span>. The size of the cut is a real decision with a real failure on each side.</p>
<div class="two"><div><b>Too small</b>A chunk arrives without the context that made it meaningful. A paragraph saying <em>this does not apply to contractors</em> is useless when the sentence naming what <em>this</em> is landed in the previous chunk.</div>
<div><b>Too large</b>Each chunk covers several subjects, so its embedding is an average of all of them and matches none precisely. Retrieval quality falls and the desk fills with irrelevant text.</div></div>
<p>Practical answers, in the order teams usually discover them:</p>
<ul>
<li><strong>Overlap</strong> the chunks slightly, so a sentence at a boundary appears in both.</li>
<li><strong>Cut on structure</strong> — sections, headings, clauses — rather than on a fixed character count. A contract cut every 500 characters produces nonsense; cut by clause it produces exactly the right units.</li>
<li><strong>Keep the metadata</strong> — document name, section, date, permissions — attached to every chunk. It is needed for filtering and for citation, and it is painful to add later.</li>
</ul>
<div class="note">Chunking is unglamorous and decides more retrieval quality than model choice does. It is the clearest example in the pack of the pack's central claim.</div>`},

{l:"TRADE-OFF",t:"Where embeddings live",h:"Specialist store or ordinary database",b:`<p>Embeddings need somewhere to live that can search by closeness at speed.</p>
<div class="dt"><table>
<tr><th>Option</th><th>Argument for</th><th>Argument against</th></tr>
<tr><td>Vector database</td><td class="g">Built for this. Fast at very large scale, rich filtering</td><td class="g">One more system to run, secure and pay for</td></tr>
<tr class="hi"><td>Existing database, extended</td><td class="g">No new system. Your data, permissions and backups already work</td><td class="g">Slower at extreme scale</td></tr>
</table></div>
<p>For most organisations the second is the correct starting point and the first is a migration to make when a measured limit is reached, rather than in advance.</p>
<p>One technique matters more than the choice of store, and it is called <span class="k">hybrid search</span>: run keyword matching and embedding search together, then merge the results. Keyword search finds exact product codes, error numbers and names. Embedding search finds the paraphrased question that never uses those words. Each covers the other's blind spot, and the combination beats either alone by a wide margin.</p>`},

{l:"MECHANISM",t:"Context engineering",h:"What plain retrieval <em>became</em>",b:`<p>Early systems retrieved five chunks and hoped. The discipline that grew out of that failure is <span class="k">context engineering</span>: deciding deliberately what occupies the desk on every request, and in what order.</p>
<div class="dg"><div class="dg-t">Assembling one desk</div>
<div class="flow">
<div class="n"><b>Select</b>Retrieve widely, then narrow. A second pass — <span class="k">re-ranking</span> — scores the candidates properly and keeps the best few, because the closest embedding is not always the most useful passage.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Order</b>Stable material first for caching, and the most important evidence at the edges rather than buried in the middle.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Compress</b>Summarise what must be present but need not be verbatim. Older conversation turns are the usual candidate.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Subtract</b>Remove anything that is merely available. Every irrelevant token costs money and measurably lowers accuracy.</div>
</div></div>
<p>Notice that all four steps are answers to earlier cards: ordering serves caching from Mission 04 — Inference and serving, while selecting, compressing and subtracting all serve context rot from two cards ago.</p>
<div class="note">The habit that follows for anyone using these systems directly, not only building them: <strong>one conversation, one job.</strong> A chat that wandered through three subjects carries all three on the desk forever, at full cost and full distraction. Starting a new one is not losing progress; it is cleaning the desk.</div>`},

{l:"DEFINE",t:"The system prompt",h:"The instructions that never change",b:`<p>The <span class="k">system prompt</span> is the standing instruction sent with every single request: who the assistant is, what it may and may not do, how to format answers, what to do when it does not know.</p>
<p>It is invisible to the user and it is doing an enormous amount of work. Most of what makes two products built on the same model feel different is here.</p>
<p>Three properties are worth knowing:</p>
<ul>
<li>It is <strong>paid for on every request</strong>, as input tokens. A 2,000-token system prompt on a million requests is two billion input tokens.</li>
<li>It is therefore <strong>the ideal cache target</strong> — identical on every call, first in the order, cached at a tenth of the price.</li>
<li>It is <strong>not security</strong>. Instructions written in the same channel the user writes in can be argued with. Real limits live outside the model, in Mission 08 — Governance and observability.</li>
</ul>`},

{l:"TRAP",t:"Hallucination",h:"Confident, fluent, <em>wrong</em>",b:`<p>A model that lacks a fact does not know that it lacks it. It produces the most plausible continuation, and plausible text is exactly what it was built to make. The result is fluent, well-structured and false, and it does not look different from the truth.</p>
<p>The name for this is <span class="k">hallucination</span>. It is not a bug to be patched; it is the mechanism from Mission 01 — Before the stack working as designed.</p>
<p>Retrieval reduces it substantially by supplying the facts rather than relying on recall. It does not eliminate it, and the residual failures are the interesting ones:</p>
<ul>
<li>Nothing relevant was retrieved, so the model answered from memory anyway.</li>
<li>Something relevant but outdated was retrieved and used with full confidence.</li>
<li>The right passages were retrieved and the summary of them quietly overstated what they said.</li>
</ul>
<div class="note">The structural defences are three, and none is a better model: <strong>cite the source</strong> so any claim can be checked against the passage it came from; <strong>permit refusal</strong> explicitly, since a model with no licence to say it does not know will invent something; and <strong>separate what was retrieved from what was inferred</strong> in the answer itself.</div>`},

{l:"DEFINE",t:"MCP",h:"A common plug",b:`<p>Once a model needs to reach outside itself — a database, a ticket system, a file store — every connection is bespoke. Ten models against ten systems is a hundred integrations.</p>
<p>The <span class="k">Model Context Protocol</span>, or MCP, is a shared standard for that connection, introduced by Anthropic in November 2024. Any system exposes its capabilities once, in a defined way; any model can then use it. A hundred integrations become twenty.</p>
<div class="code" data-cap="an MCP server, declared"><pre>
{
  "mcpServers": {
    "company-docs": {
      "command": "npx",
      "args": ["-y", "@acme/docs-mcp-server"],
      "env": { "ACME_API_KEY": "..." }
    }
  }
}
</pre></div>
<div class="stamp">Adoption checked Aug 2026</div>
<p>The adoption is unusual for a standard this young: supported by OpenAI, Google, Microsoft, AWS, GitHub and Cursor among others, roughly 97 million monthly SDK downloads, a public registry that reached around 2,000 servers within months, and governance donated in December 2025 to the Agentic AI Foundation under the Linux Foundation, with OpenAI as a co-founding member.</p>
<p>A sibling protocol, <span class="k">A2A</span>, addresses the next problem along: agents built by different teams needing to delegate work to each other. Same instinct, one level up. It is earlier and less settled.</p>
<div class="note">A standard adopted by competitors is a rare event, and it is the strongest signal available that this layer is now considered infrastructure rather than product.</div>`},

{l:"TRAP",t:"A shared plug",h:"A shared <em>weakness</em>",b:`<div class="stamp">Findings through Aug 2026</div>
<p>A universal connector is a universal target. The measurements from 2026 are worth reading in full, because this is the clearest live example in the pack of a layer moving faster than its own safety.</p>
<div class="stat">
<div><b>21,000</b><span>Internet-facing MCP servers detected, Jul 2026</span></div>
<div><b>91.8%</b><span>Of 640 audited production servers lacking OAuth</span></div>
<div><b>85%</b><span>Exploitation success in one published injection study</span></div>
</div>
<p>The June 2026 work published as <em>Agentjacking</em> demonstrated hijacking of AI coding agents through injected content, reporting success across Claude Code, Cursor and Codex CLI in controlled testing. The NSA published MCP security guidance in May 2026. OWASP now maintains a Top 10 for agentic applications.</p>
<p>The underlying mechanism deserves a name, because it generalises far beyond this protocol: <span class="k">prompt injection</span>. A model cannot fully distinguish instructions from data. Anything it reads — a document, a web page, a ticket comment, a tool's response — can contain text that reads as a command.</p>
<div class="note">The protocol was built capability-first, with authentication and sandboxing left to whoever implements it, and most implementers skipped all three during the rush. That sentence is the entire history of every integration standard ever shipped, and it is the reason Mission 08 — Governance and observability is not optional.</div>`},

{l:"RECALL",t:"Mission 05",h:"What is now owned",b:`<ul>
<li>The <strong>context window</strong> is one desk, re-read in full on every message. Nothing on it decays.</li>
<li><strong>Context rot</strong> is measured, not theoretical: accuracy falls with length and position, in cliffs rather than slopes. Advertised length is not usable length.</li>
<li><strong>Embeddings</strong> turn meaning into position so closeness can be computed.</li>
<li><strong>RAG</strong> is: chunk and embed once, then embed the question, search, and answer from what came back.</li>
<li><strong>Chunking</strong> decides retrieval quality. Cut on structure, overlap slightly, keep the metadata.</li>
<li><strong>Hybrid search</strong> — keyword plus embedding — beats either alone.</li>
<li><strong>Context engineering</strong> is select, order, compress, subtract. One conversation, one job.</li>
<li><strong>Hallucination</strong> is the mechanism working as designed. Cite sources, permit refusal, separate retrieved from inferred.</li>
<li><strong>MCP</strong> is the shared plug, now broadly adopted and demonstrably under-secured. <strong>Prompt injection</strong> is the reason.</li>
</ul>`}
]},
/* ============ MISSION 06 ============ */
{n:"06",title:"Orchestration and agents",stage:"Layer 5",
line:"Turning single calls into completed work. What a tool is, what an agent actually is, and why this layer multiplies every cost below it.",
cards:[

{l:"ORIENT",t:"Layer 5",h:"Deciding what happens <em>next</em>",b:`<p>Everything so far produces one answer to one question. Almost no real task is one question.</p>
<p>Reviewing a contract means reading it, finding the relevant policy, comparing them, flagging differences and drafting a note. Five steps, where later steps depend on what earlier ones found.</p>
<p>This layer decides the order of those steps and who chooses it. It is also the layer that <strong>multiplies everything underneath</strong>: one user request becomes twenty model calls, and every cost in Mission 02 — Compute and infrastructure, Mission 03 — Models and training and Mission 04 — Inference and serving is paid twenty times.</p>`},

{l:"DEFINE",t:"Tools",h:"Letting a model <em>do</em> rather than say",b:`<p>A model only writes text. A <span class="k">tool</span> is a function outside the model that it can ask to have run: search the database, send the email, run the code, fetch the price.</p>
<p>The model is given a description of what is available. It never runs anything itself. It writes a request to run something, your code runs it and hands back the result, and the model continues with that result on the desk.</p>
<div class="code" data-cap="a tool, declared"><pre>
{
  "name": "get_invoice",
  "description": "Fetch one invoice by its ID. Use when the user names an invoice.",
  "input_schema": {
    "type": "object",
    "properties": {
      "invoice_id": { "type": "string" }
    },
    "required": ["invoice_id"]
  }
}
</pre></div>
<p>Read the description field closely, because it is the part people get wrong. It is not documentation for a human — it is <strong>the entire basis on which the model decides whether to use this tool</strong>. A vague description produces a tool that is never called, or called at the wrong moment, and the symptom looks like a stupid model rather than a badly written sentence.</p>
<div class="note">This is also the security boundary of the whole stack. The model proposes; your code disposes. Whether a proposed action is permitted, logged, rate-limited or requires a human is decided outside the model — and given the injection findings in Mission 05 — Data, retrieval and protocols, it must be.</div>`},

{l:"MECHANISM",t:"Structured output",h:"Text that software can read",b:`<p>If the next step is another program rather than a person, prose is useless. The model must return something with a fixed shape — a defined set of fields, in a defined format.</p>
<p>Asking politely for that shape works most of the time, which is worse than it sounds: a format that fails one time in fifty breaks a pipeline that runs ten thousand times a day.</p>
<p>The reliable mechanism is <span class="k">constrained decoding</span>. Rather than checking the output afterwards, the serving engine restricts which tokens are even permitted at each position, so an invalid response cannot be produced. If the schema says the next character must be a quotation mark, no other token is available to choose.</p>
<div class="note">Every serving engine in Mission 04 — Inference and serving supports this. Where a system depends on structure, it should be enforced this way rather than requested and validated — the difference is between rare mysterious failures and none.</div>`},

{l:"DEFINE",t:"Workflow and agent",h:"Who decides the order",b:`<p>Two shapes exist, and the distinction is the whole of this layer.</p>
<div class="two"><div><b>Workflow</b>You wrote the sequence. Step one, then two, then three. The model does the thinking inside each step; the path is fixed. Predictable, testable, bounded in cost.</div>
<div><b>Agent</b>The model decides what to do next, using tools, until the goal is met. Handles tasks whose shape is not known in advance. Unpredictable in cost, path and duration.</div></div>
<p>Most working systems are workflows with a small agentic step inside them, not agents. That is not a compromise — it is the correct default, and the industry arrived at it the expensive way.</p>
<div class="stamp">Enterprise data, 2026</div>
<p>Surveys through 2026 consistently find only around <strong>11–14% of agent pilots reaching production at scale</strong>, with a large share stalling three to nine months after an apparently successful demonstration. Gartner separately estimates that of the many vendors claiming agentic products, only around 130 offer genuine agentic capability — a practice it calls <em>agent washing</em>.</p>
<div class="note">The useful reading is not that agents fail. It is that <strong>the gap between a working demonstration and a production system is where the work actually is</strong>, and that gap is made of the things in Mission 08 — Governance and observability and Mission 09 — Reproducibility rather than anything in this one.</div>`},

{l:"MECHANISM",t:"The loop",h:"Plan, act, observe, repeat",b:`<p>Every agent is this loop, whatever the framework calls it.</p>
<div class="flow">
<div class="n"><b>1 — Plan</b>Given the goal and everything so far, decide the next action.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Act</b>Call a tool.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Observe</b>Put the result on the desk.</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Repeat or stop</b>Decide whether the goal is met. If not, return to step one.</div>
</div>
<p>Two properties of that loop cause nearly every agent problem in production:</p>
<ul>
<li><strong>The desk grows every cycle.</strong> Each observation is appended and re-read on the next turn. Twenty steps in, the model is reading nineteen previous results — the exact conditions the context-rot card in Mission 05 — Data, retrieval and protocols warned about.</li>
<li><strong>Errors compound rather than cancel.</strong> A wrong step at cycle three is context for cycles four through twenty. The model does not doubt its own earlier work; it builds on it.</li>
</ul>
<div class="note">Which is why every serious agent has hard limits attached from the start: a maximum number of steps, a maximum spend, a maximum time. Not as tuning, but as the thing that stops a loop from running all night.</div>`},

{l:"PICTURE",t:"The assistant",h:"One request, broken down",b:`<p>The coding assistant from Mission 01 — Before the stack. An engineer types: <em>add rate limiting to the payments endpoint.</em></p>
<div class="dg"><div class="dg-t">What the system does, and which layer does it</div>
<div class="flow">
<div class="n"><b>1 — Retrieve</b>Find the payments endpoint and how rate limiting is done elsewhere in this codebase. <span class="k">Layer 4</span></div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Plan</b>A capable model produces the sequence of edits. <span class="k">Layer 5</span></div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Write</b>Generate the changes, in a structured form the editor can apply. <span class="k">Layers 3 and 5</span></div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Test</b>Run the test suite as a tool. Read what failed. <span class="k">Layer 5</span></div>
<div class="a">&#8595;</div>
<div class="n"><b>5 — Repair</b>If tests failed, loop back with the failure on the desk. Bounded to three attempts.</div>
<div class="a">&#8595;</div>
<div class="n"><b>6 — Present</b>Show the engineer a diff to approve. Nothing is committed without them. <span class="k">Layer 6</span></div>
</div></div>
<p>Notice what the loop is anchored to. Step 4 is not the model judging its own work — it is a test suite, which is either green or red and cannot be argued with. <strong>An agent is only as reliable as the check it cannot talk its way past.</strong></p>`},

{l:"LIVE",t:"The multiplier",h:"Why agents change the <em>arithmetic</em>",b:`<div class="stamp">Reported, 2026</div>
<p>The single most consequential fact about this layer is a number, and it is routinely absent from the plan.</p>
<p>An agentic task consumes on the order of <strong>5 to 30 times the tokens of a single chat exchange</strong>, because every step re-reads everything that came before. That growth is not linear in steps; it is closer to quadratic, since step twenty re-reads nineteen prior results.</p>
<div class="dt"><table>
<tr><th>Shape</th><th>Model calls</th><th>Tokens per user task</th></tr>
<tr><td>One question, one answer</td><td class="n">1</td><td class="n">~5K</td></tr>
<tr><td>Retrieval, then answer</td><td class="n">2</td><td class="n">~12K</td></tr>
<tr class="hi"><td>Agent, ten steps</td><td class="n">10 – 25</td><td class="n">~150K+</td></tr>
</table></div>
<p>Apply the rates from Mission 01 — Before the stack and the consequence is immediate. A per-request cost that was acceptable becomes thirty times itself, and the pilot that cost a few hundred thousand to build turns into the $1–2m annual running cost that industry surveys repeatedly find behind cancelled agent projects.</p>
<div class="note">Both counter-levers live one layer down and were built in Mission 04 — Inference and serving. <strong>Cache the stable prefix</strong>, so twenty steps re-read it at a tenth of the price. <strong>Route the routine steps down</strong>, since most steps in an agent loop are mechanical and need nothing near the frontier tier.</div>`},

{l:"MECHANISM",t:"Review",h:"Three ways to check the work",b:`<p>Output that reaches a person or a live system needs a check. Three exist, and they are not interchangeable.</p>
<div class="dt"><table>
<tr><th>Check</th><th>How it works</th><th>Honest assessment</th></tr>
<tr class="hi"><td>Deterministic</td><td class="g">Run the tests. Validate the schema. Check the total sums.</td><td class="g">Strongest by far. Use wherever a right answer is computable</td></tr>
<tr><td>Model review</td><td class="g">A second call, often a different model, critiques the first</td><td class="g">Catches real errors; shares blind spots with the writer</td></tr>
<tr><td>Human</td><td class="g">A person approves before anything takes effect</td><td class="g">Necessary for consequential actions; does not scale</td></tr>
</table></div>
<p>The design question is not which to use but <strong>where to place the human</strong>. Reviewing everything defeats the purpose; reviewing nothing is how a system deletes a production database at two in the morning.</p>
<div class="note">The workable rule is to gate on consequence rather than confidence: reversible and cheap actions proceed automatically, irreversible or expensive ones wait for a person. Confidence is a poor signal here, for the reason given in the hallucination card of Mission 05 — Data, retrieval and protocols.</div>`},

{l:"DEFINE",t:"Frameworks",h:"The names encountered here",b:`<p>Libraries exist to supply the loop, the tool plumbing and the state handling so nobody writes it from scratch. LangChain and LangGraph, LlamaIndex, CrewAI, AutoGen and the vendors' own agent toolkits are the names in circulation.</p>
<p>They are worth knowing as names and worth holding lightly as commitments. This part of the stack moves faster than any other, and the framework that dominates a conference season is frequently not the one in production two years later.</p>
<div class="note">One durable rule: the loop is fifty lines of ordinary code. A framework saves you writing them and costs you a dependency, an abstraction to learn, and someone else's opinion about how state should be stored. Adopt one when the plumbing is genuinely the problem — not before.</div>`},

{l:"TRAP",t:"The second seed",h:"Version drift",b:`<p>Two things move underneath an agent without anyone changing a line of code.</p>
<ul>
<li>The <strong>model</strong> is updated by its provider. Same name, different weights, subtly different behaviour.</li>
<li>The <strong>framework</strong> ships a new version, and an installation performed today produces a different system than the identical instruction did last month.</li>
</ul>
<p>An agent is more sensitive to both than a single call is, because behaviour changes compound over twenty steps. A model that is slightly more inclined to keep going produces a loop that runs twice as long and costs twice as much, and nothing in the code changed.</p>
<div class="note">This is the second seed. The first was planted in Mission 02 — Compute and infrastructure, where the first machine was built by hand. Mission 09 — Reproducibility harvests both.</div>`},

{l:"RECALL",t:"Mission 06",h:"What is now owned",b:`<ul>
<li>A <strong>tool</strong> is a function the model can request. Its description is how the model decides to use it — write it as an instruction, not documentation.</li>
<li>The model proposes actions; <strong>your code decides whether they happen</strong>. That is the security boundary.</li>
<li><strong>Structured output</strong> should be enforced by constrained decoding, not requested and hoped for.</li>
<li>A <strong>workflow</strong> has a path you wrote. An <strong>agent</strong> chooses its own. Most working systems are workflows with an agentic step inside.</li>
<li>Every agent is <strong>plan, act, observe, repeat</strong>, with hard limits on steps, spend and time.</li>
<li>The desk grows every cycle and errors compound. Anchor the loop to a check that cannot be argued with.</li>
<li>Agentic tasks cost <strong>5–30x</strong> a single exchange. Caching and routing are the counter-levers.</li>
<li>Gate human review on <strong>consequence</strong>, not on the model's confidence.</li>
</ul>`}
]},
/* ============ MISSION 07 ============ */
{n:"07",title:"Applications",stage:"Layer 6",
line:"What a person actually touches, and why the layer that looks thinnest captures the most value.",
cards:[

{l:"ORIENT",t:"Layer 6",h:"Where the complexity <em>disappears</em>",b:`<p>The top layer is what a person sees: a chat box, a sidebar in an editor, a button inside software they already use.</p>
<p>Its job is to make the other five invisible. Nobody using a product should learn what a token is, choose a serving engine or think about chunk boundaries — and if they must, the application has failed at the one thing it exists to do.</p>
<p>This layer is also where value is captured, which is counter-intuitive: it holds the least technology and the most leverage. The rest of this mission is why.</p>`},

{l:"TRADE-OFF",t:"Two shapes",h:"General assistants and vertical products",b:`<div class="two"><div><b>General assistant</b>Handles anything, knows nothing specific. Enormous reach, shallow depth. The user brings the context and does the integrating.</div>
<div><b>Vertical product</b>Does one job inside one profession. Narrow reach, deep integration. It already knows the documents, the workflow and the vocabulary.</div></div>
<p>General assistants win on distribution and get commoditised from beneath, because every lab ships one and they converge. Vertical products win on depth and are harder to displace, because the moat is the integration rather than the model.</p>
<p>The distinction predicts who survives. When the underlying models improve, a general assistant gets a better competitor for free. A vertical product gets a better engine for free.</p>`},

{l:"LIVE",t:"The case",h:"An editor, four years, sixty billion dollars",b:`<div class="stamp">Timeline current 17 Aug 2026</div>
<p>The cleanest evidence that the application layer is where value concentrates is a single company, and the numbers are public.</p>
<p>Cursor, built by Anysphere, is a code editor with AI throughout it. It trains no frontier model of its own for most work — it calls the same models available to everyone.</p>
<div class="bars">
<div class="row"><div class="lb"><span>Jan 2025 — annualised revenue</span><span>$100M</span></div><div class="tr"><i style="width:3%"></i></div></div>
<div class="row"><div class="lb"><span>Late 2025</span><span>$1B</span></div><div class="tr"><i style="width:25%"></i></div></div>
<div class="row"><div class="lb"><span>Feb 2026</span><span>$2B</span></div><div class="tr"><i style="width:50%"></i></div></div>
<div class="row"><div class="lb"><span>Jun 2026</span><span>~$4B</span></div><div class="tr"><i class="c" style="width:100%"></i></div></div>
</div>
<p>In June 2026 SpaceX announced an all-stock acquisition at approximately <strong>$60 billion</strong>, against a last independent private valuation of $29.3bn in November 2025. Roughly three quarters of the revenue is enterprise.</p>
<p>The market underneath it is real rather than speculative: AI coding tools generated around <strong>$12.8bn in 2026</strong>, more than double 2024, with reports that over half of code on GitHub is now AI-generated or AI-assisted.</p>
<div class="src">Figures from TechCrunch, WSJ and company reporting as aggregated Jun–Aug 2026. Valuations and run-rate figures vary between sources; treat the shape of the curve as the durable fact and any single number as approximate.</div>`},

{l:"MECHANISM",t:"Owning the workflow",h:"Why that <em>worked</em>",b:`<p>The instructive part is not the number. It is that the same models were available to every competitor, several with far greater distribution, and the outcome was not close.</p>
<p>What Cursor owned was the place the work happens. An engineer lives in an editor all day. Putting the model there — with the codebase retrieved, the tests runnable and the changes reviewable in place — removes every step of carrying context back and forth.</p>
<div class="flow">
<div class="n"><b>Without it</b>Copy code out. Paste into a chat. Explain the surrounding system. Read the answer. Paste it back. Fix what did not fit.</div>
<div class="a">&#8595;</div>
<div class="n"><b>With it</b>Ask, in place. The context is already there, because the application supplied it.</div>
</div>
<p>Everything eliminated in that gap is Layer 4 work — retrieval, context assembly — done by the application on the user's behalf rather than by the user by hand.</p>
<div class="note">This is the general lesson of the layer, and it holds well outside coding: <strong>the value is not the model, and not the interface. It is knowing what to put on the desk, in a specific job, without being asked.</strong> That knowledge is domain-specific, which is exactly why it cannot be commoditised by the next model release.</div>`},

{l:"PICTURE",t:"The mapping",h:"You have been using the stack already",b:`<p>Every feature of a consumer AI product is one of the mechanisms in this pack, renamed for people who should never have to learn the mechanism. Take the product this pack was written in.</p>
<div class="dt"><table>
<tr><th>What you see</th><th>What it is</th><th>Layer</th></tr>
<tr><td>Model picker, effort setting</td><td class="g">Tier selection and test-time compute</td><td class="n">2 and 3</td></tr>
<tr class="hi"><td>Project knowledge</td><td class="g">A cached, reused prefix — and above a size threshold, retrieval rather than loading everything</td><td class="n">3 and 4</td></tr>
<tr><td>Project instructions</td><td class="g">A system prompt scoped to a workspace</td><td class="n">4</td></tr>
<tr><td>Memory across chats</td><td class="g">Selected facts re-injected into a stateless request</td><td class="n">4</td></tr>
<tr class="hi"><td>Connectors</td><td class="g">MCP servers</td><td class="n">4</td></tr>
<tr><td>Web search, file handling</td><td class="g">Tools in a loop</td><td class="n">5</td></tr>
<tr><td>Artifacts and file outputs</td><td class="g">Structured output with a place to live</td><td class="n">5 and 6</td></tr>
<tr><td>Usage limits</td><td class="g">The economics of compute and serving, made visible</td><td class="n">1 and 3</td></tr>
</table></div>
<p>Two practical habits fall directly out of this mapping, and they are worth having because they follow from mechanism rather than folklore:</p>
<ul>
<li><strong>Put stable reference material where it is cached, not attached to each conversation.</strong> Same file, same questions, a different bill and a cleaner desk.</li>
<li><strong>Start a new conversation when the subject changes.</strong> Nothing on a desk decays, so a chat that wandered carries every earlier subject at full weight forever.</li>
</ul>
<div class="note">Whenever a product feature seems arbitrary, ask which layer it is hiding. The answer is nearly always one of the six, and knowing which one tells you how to use it well.</div>`},

{l:"LIVE",t:"How it is sold",h:"Three pricing shapes",b:`<div class="stamp">Structures current Aug 2026</div>
<p>Applications sit on a variable cost — the token bill from Mission 04 — Inference and serving — and must charge for it somehow. Three shapes exist, and each has a characteristic failure.</p>
<div class="dt"><table>
<tr><th>Shape</th><th>Example</th><th>Fails when</th></tr>
<tr><td>Flat seat</td><td class="g">~$20/user/month consumer tiers across the major assistants</td><td class="g">Heavy users cost more than they pay</td></tr>
<tr class="hi"><td>Seat plus usage</td><td class="g">Business seats around $40/user plus charges for premium model requests</td><td class="g">Buyers cannot forecast the bill</td></tr>
<tr><td>Pure usage</td><td class="g">Per-token API access</td><td class="g">Revenue is unpredictable; no floor</td></tr>
</table></div>
<p>The flat-seat failure is the one that shaped the market. When a single user can trigger an agentic task costing thirty times a chat message, a fixed monthly price stops covering the cost of the heaviest tenth of users — which is why almost every serious product moved to a hybrid, and why usage limits exist at all.</p>
<div class="note">This is the clearest example in the pack of Layer 1 arithmetic surfacing in Layer 6 packaging. A GPU-hour in Mission 02 — Compute and infrastructure eventually becomes a message limit somebody notices on a Tuesday afternoon.</div>`},

{l:"TRAP",t:"The wrapper question",h:"Thin against <em>owned</em>",b:`<p><em>It is just a wrapper around an API</em> is the standard dismissal. It is sometimes correct and usually lazy, and the difference can be stated precisely.</p>
<div class="two"><div><b>Thin</b>A text box in front of a model. Nothing retrieved, no workflow owned, no proprietary data, no evaluation of its own. Reproducible in a weekend, and reproduced within one.</div>
<div><b>Owned</b>Sits where the work happens. Retrieves what the user would otherwise supply. Runs a multi-step process. Improves as it is used, on data nobody else has.</div></div>
<p>The test is not how much code sits between the user and the model. It is what would break if the underlying model were swapped out overnight.</p>
<p>For a thin product, everything — the model was the product. For an owned one, very little: the retrieval, the workflow, the integrations and the accumulated data all survive the swap, and the product quietly gets better.</p>
<div class="note">Which is the whole pack in one sentence, arriving from the top rather than the bottom: <strong>the model is one layer.</strong> A company whose entire value is that layer has rented its business from someone else.</div>`},

{l:"RECALL",t:"Mission 07",h:"What is now owned",b:`<ul>
<li>The application layer's job is to make the other five <strong>invisible</strong>.</li>
<li><strong>General assistants</strong> win distribution and converge. <strong>Vertical products</strong> win depth and hold it.</li>
<li>Cursor reached roughly <strong>$4bn annualised in four years</strong> and a $60bn acquisition without owning the model, by owning where the work happens.</li>
<li>The value is knowing <strong>what to put on the desk for a specific job</strong>, without being asked.</li>
<li>Every consumer AI feature is one of these six layers renamed. Knowing which tells you how to use it.</li>
<li>Pricing is a <strong>flat seat, seat plus usage, or pure usage</strong>. Agentic costs broke the flat seat.</li>
<li>A product is thin if swapping the model breaks it, and owned if it survives.</li>
</ul>`}
]},
/* ============ MISSION 08 ============ */
{n:"08",title:"Governance and observability",stage:"Across all layers",
line:"Knowing what the system did, what it cost, and whether it is getting better or worse. The first of the two columns that cut through every layer.",
cards:[

{l:"ORIENT",t:"The first crosscut",h:"Not a layer — a <em>column</em>",b:`<p>The six layers stack. This does not. It runs vertically through all of them, because every layer produces something that has to be watched.</p>
<div class="dg"><div class="dg-t">What each layer emits</div>
<div class="sheet"><div class="h">Evidence, by layer</div>
<div class="r"><b>1 — Compute</b><span>Utilisation, capacity, spend</span></div>
<div class="r"><b>2 — Models</b><span>Which version answered, and when it changed</span></div>
<div class="r"><b>3 — Serving</b><span>Latency, token counts, cache hit rate, cost per call</span></div>
<div class="r"><b>4 — Data</b><span>What was retrieved, and whether it was relevant</span></div>
<div class="r"><b>5 — Orchestration</b><span>Every step, tool call and decision in the loop</span></div>
<div class="r"><b>6 — Applications</b><span>What the user asked, got, and did next</span></div>
</div></div>
<p>Treated as a feature to add later, this becomes impossible — the evidence was never captured, and it cannot be recovered after the fact. Treated as a property of each layer as it is built, it costs almost nothing.</p>`},

{l:"MECHANISM",t:"Four questions",h:"What gets asked in production",b:`<p>Every AI system in real use eventually faces the same four questions, usually from someone who is not an engineer, usually urgently.</p>
<div class="flow">
<div class="n"><b>1 — What did it do?</b>Show the exact request, the retrieved material, the model version, every tool call and the final answer. For one specific interaction, months ago.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Why did it do that?</b>Which passages drove the answer, and which step in the chain introduced the error.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — What is it costing?</b>Broken down by feature, team and user — not one monthly total.</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Is it getting better or worse?</b>Against a fixed standard, measured rather than felt.</div>
</div>
<p>Questions one and two need <strong>records</strong>. Question three needs <strong>attribution</strong>. Question four needs <strong>evaluation</strong>, and it is the only one that cannot be answered retrospectively at all.</p>`},

{l:"DEFINE",t:"Observability",h:"Logs, traces and audit",b:`<p>Three words, frequently used loosely, doing different jobs.</p>
<div class="dt"><table>
<tr><th>Term</th><th>What it is</th><th>Answers</th></tr>
<tr><td>Log</td><td class="g">A record of one event</td><td class="g">Did this happen?</td></tr>
<tr class="hi"><td>Trace</td><td class="g">Every step of one request, linked together with timings and costs</td><td class="g">What happened, in what order, and where the time and money went</td></tr>
<tr><td>Audit trail</td><td class="g">A tamper-evident record kept deliberately for later scrutiny</td><td class="g">What can be proved, months later</td></tr>
</table></div>
<p>The trace is the one this field needs and ordinary software rarely required. In a conventional system, a request is one action. In an agentic system it is twenty, each with its own cost, latency, inputs and failure mode. Without a trace, a slow expensive answer is a single mystery instead of a visible chain with one bad link in it.</p>
<div class="note">The cheapest possible version, worth doing on day one: record for every call the model version, the token counts in and out, the latency, the retrieved document identifiers, and a request identifier that ties the whole chain together. That is a few fields, and it is the difference between diagnosing a problem in an hour and never diagnosing it.</div>`},

{l:"DEFINE",t:"Guardrails",h:"Limits that hold <em>regardless</em>",b:`<p>A <span class="k">guardrail</span> is a constraint enforced outside the model, so it holds whatever the model produces. Three positions:</p>
<div class="three"><div><b>On input</b>Reject or strip what should never reach the model — injected instructions, material the user is not entitled to see.</div>
<div><b>On output</b>Check what comes back before anyone sees it: leaked personal data, invalid structure, forbidden claims.</div>
<div><b>On action</b>The important one. Limits on what tools may do: spending caps, rate limits, irreversible actions requiring approval.</div></div>
<p>The reason for the emphasis on the third is the injection finding from Mission 05 — Data, retrieval and protocols. If a model can be persuaded by text it reads, then anything downstream of what it reads must be constrained by code rather than by instruction.</p>
<div class="note">Restated as a rule: <strong>a limit written in the prompt is a request; a limit written in code is a limit.</strong> The system prompt is not a security boundary, however firmly it is worded.</div>`},

{l:"DEFINE",t:"Drift",h:"Working systems that stop working",b:`<p>Ordinary software fails when changed. AI systems fail when nothing is changed. Three mechanisms, worth separating because they have different fixes.</p>
<div class="dt"><table>
<tr><th>Kind</th><th>What moves</th><th>Detected by</th></tr>
<tr><td>Model drift</td><td class="g">The provider updates the model behind the same name</td><td class="g">Pinning versions, and re-running evals when they change</td></tr>
<tr><td>Data drift</td><td class="g">The knowledge base ages; documents are superseded</td><td class="g">Freshness checks and ownership of the corpus</td></tr>
<tr class="hi"><td>Behaviour drift</td><td class="g">Users bring different questions than they did at launch</td><td class="g">Watching the distribution of what is asked, not only the answers</td></tr>
</table></div>
<p>The third is the one that catches teams out, because nothing technical has changed at all. A system built for the questions of six months ago meets the questions of today and quietly performs worse, and every dashboard stays green.</p>`},

{l:"MECHANISM",t:"Evals",h:"Logs say what. Evals say <em>better or worse</em>",b:`<p>An <span class="k">eval</span> is a fixed set of representative inputs with known-good outputs, run against the system on every meaningful change. It is a test suite for something that has no single right answer.</p>
<div class="flow">
<div class="n"><b>1 — Build the set</b>Thirty to three hundred real examples, including the awkward ones. Real, not invented — invented sets test what you imagined, which is the part that already works.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Fix the standard</b>For each, what a good answer contains. Where it is checkable — a number, a schema, a retrieved document identifier — check it mechanically.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Run on every change</b>New prompt, new model version, new retrieval settings. A change that improves one case and quietly breaks four is otherwise invisible.</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Grow it</b>Every production failure becomes a new case, permanently. The set becomes the memory of everything that has gone wrong once.</div>
</div>
<p>Where no mechanical check exists, a strong model can grade the output against a rubric. Useful and cheap, and it shares blind spots with the model being graded — so it complements human review rather than replacing it.</p>
<div class="note">This is also the honest answer to model selection from Mission 03 — Models and training. Benchmarks measure someone else's distribution of tasks. An eval measures yours, and it is the only number that can settle an argument about whether a change helped.</div>`},

{l:"LIVE",t:"Agentic risk",h:"The new category",b:`<div class="stamp">Data through Aug 2026</div>
<p>Everything above applies to any AI system. Agents add a category that did not previously exist, because a system that only writes text can be wrong, while a system that acts can be wrong <em>and have done something about it</em>.</p>
<div class="stat">
<div><b>40%</b><span>Of agentic projects forecast cancelled by end-2027</span></div>
<div><b>21%</b><span>Of organisations with a mature agent governance model</span></div>
<div><b>11–14%</b><span>Of agent pilots reaching production at scale</span></div>
</div>
<p>Gartner names the causes as escalating costs, unclear business value and inadequate risk controls, and separately forecasts that a third of companies will damage customer experience in 2026 by deploying prematurely. Deloitte's work found a large share of organisations building agents without any operating model to run them.</p>
<p>Four questions that have no good answer yet in most deployments:</p>
<ul>
<li><strong>Authority.</strong> What is this agent permitted to do without asking, and where is that written down as code rather than intention?</li>
<li><strong>Attribution.</strong> When an agent acting for a person takes a wrong action, whose action was it?</li>
<li><strong>Reversal.</strong> Which actions can be undone, and is there a mechanism, or only a hope?</li>
<li><strong>Compounding.</strong> When one agent calls another, who is accountable for the chain?</li>
</ul>
<div class="note">The pattern across every one of those numbers is the same, and it is the argument of this column: the failures are not model failures. They are the absence of the things in this mission, discovered after deployment rather than before.</div>`},

{l:"RECALL",t:"Mission 08",h:"What is now owned",b:`<ul>
<li>Governance is a <strong>column, not a layer</strong> — every layer emits evidence, and it cannot be captured retrospectively.</li>
<li>Production asks four questions: <strong>what did it do, why, what does it cost, is it improving.</strong></li>
<li>A <strong>trace</strong> links every step of one request. In agentic systems it is the only way to diagnose anything.</li>
<li><strong>Guardrails</strong> sit on input, output and action. A limit in the prompt is a request; a limit in code is a limit.</li>
<li><strong>Drift</strong> comes in three kinds — model, data and behaviour — and behaviour drift is invisible on dashboards.</li>
<li>An <strong>eval</strong> is a fixed set of real cases with known-good answers, run on every change and grown from every failure.</li>
<li>Agents add <strong>authority, attribution, reversal and compounding</strong> — governance questions with no technical default.</li>
</ul>`}
]},

/* ============ MISSION 09 ============ */
{n:"09",title:"Reproducibility",stage:"Across all layers",
line:"Making the system behave the same way twice. The second column, the least glamorous subject in the pack, and the one that quietly ends projects.",
cards:[

{l:"ORIENT",t:"The second crosscut",h:"The column everyone <em>overlooks</em>",b:`<p>Two seeds were planted earlier. In Mission 02 — Compute and infrastructure, the first machine was configured by hand and nobody recorded which versions were installed. In Mission 06 — Orchestration and agents, the model and the framework both moved underneath a working system without anyone changing a line.</p>
<p>Both are the same problem: <strong>the system is defined by things nobody wrote down.</strong></p>
<p>This mission is the answer. It appears last because it is invisible until something breaks, and it is universally underestimated for exactly that reason.</p>`},

{l:"DEFINE",t:"Environment",h:"Everything around the code",b:`<p>Code is a small part of what determines behaviour. The <span class="k">environment</span> is everything else:</p>
<ul>
<li>The operating system and its version</li>
<li>Every library, and its exact version</li>
<li>Hardware drivers — for GPUs, notoriously version-sensitive</li>
<li>Configuration and settings</li>
<li>Which model version is being called, and with what settings</li>
</ul>
<p>Two machines running byte-identical code in different environments produce different results. This is ordinary in all software and worse here, because the AI stack has an unusually deep pile of numerical libraries, and because one item on that list — the model — is not even on your machine.</p>`},

{l:"DEFINE",t:"The four stages",h:"Where the code travels",b:`<p>Software passes through four environments on its way to a user. The names are near-universal.</p>
<div class="dt"><table>
<tr><th>Stage</th><th>Purpose</th><th>Typical divergence</th></tr>
<tr><td>Development</td><td class="g">A laptop, where it is written</td><td class="g">Newest versions, real data absent, a different chip entirely</td></tr>
<tr><td>Testing</td><td class="g">Automated checks on every change</td><td class="g">Often no GPU at all, so anything hardware-sensitive is untested</td></tr>
<tr><td>Staging</td><td class="g">A rehearsal of production</td><td class="g">Smaller, cheaper, with a fraction of the data</td></tr>
<tr class="hi"><td>Production</td><td class="g">The live system, with real users</td><td class="g">Older, hardened, and the only one that matters</td></tr>
</table></div>
<p>Each is created at a different time by a different person for a different reason. Divergence is not a failure of discipline; it is the default outcome of that arrangement.</p>`},

{l:"MECHANISM",t:"Nobody's fault",h:"Why the same code behaves differently",b:`<p>The sequence is worth walking once, because it is so ordinary that nobody involved does anything wrong.</p>
<div class="flow">
<div class="n"><b>March</b>Production is built. The instruction is <em>install the current version</em>, and the current version is 2.1.</div>
<div class="a">&#8595;</div>
<div class="n"><b>July</b>A new engineer sets up a laptop from the same instruction. The current version is now 2.4.</div>
<div class="a">&#8595;</div>
<div class="n"><b>August</b>Their code works locally and fails in production. Both machines followed identical instructions correctly.</div>
</div>
<p>The AI-specific version of this is worse, because the moving part is outside your control entirely. A prompt tuned against one model version meets its successor, and the same instruction produces subtly different output. No install happened. No version number changed on your side. The behaviour changed anyway.</p>
<div class="note">This is why every eval in Mission 08 — Governance and observability must record which model version produced the result. A score without a version attached cannot be compared to anything.</div>`},

{l:"MECHANISM",t:"The fix",h:"Environment as <em>code</em>",b:`<p>The principle is one sentence: <strong>if it affects behaviour, write it down in a file that travels with the code.</strong> Not in a wiki, not in someone's memory, not in a command run once.</p>
<div class="dt"><table>
<tr><th>Loose</th><th>Written down</th></tr>
<tr><td class="g">Install the library</td><td>Pin the exact version, and lock the versions of its dependencies too</td></tr>
<tr><td class="g">Use the latest model</td><td>Name a dated model identifier explicitly in configuration</td></tr>
<tr><td class="g">Set it up like the last one</td><td>A build file that produces the machine from scratch</td></tr>
<tr><td class="g">The prompt we agreed</td><td>Prompts versioned in the repository alongside the code that sends them</td></tr>
</table></div>
<p>Four things are specific to this stack and get missed by teams who otherwise do this well:</p>
<ul>
<li><strong>Model identifier.</strong> Call a dated version, not a floating alias, so an upgrade is a decision with a date rather than a surprise.</li>
<li><strong>Sampling settings.</strong> Temperature and related controls decide how much randomness enters. For anything you intend to reproduce, set them explicitly rather than accepting a default that may change.</li>
<li><strong>Prompts and schemas.</strong> They are code. They belong in version control, and a change to one is a change to the system.</li>
<li><strong>The eval set itself.</strong> Versioned, or last quarter's scores mean nothing.</li>
</ul>`},

{l:"DEFINE",t:"Docker",h:"What a container actually does",b:`<p>A <span class="k">container</span> packages an application together with its entire environment — libraries, versions, configuration — into one artefact that runs identically anywhere the container runtime exists. Docker is the dominant tool.</p>
<div class="code" data-cap="a build file"><pre>
FROM python:3.11-slim

# exact versions, not "latest" — this file IS the environment
RUN pip install --no-cache-dir \\
    anthropic==0.42.0 \\
    fastapi==0.115.6

COPY ./app /app
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0"]
</pre></div>
<p>Read what that file is rather than what it does. It is <strong>the environment, written down</strong> — the same machine every time it is built, on a laptop and on a server, this month and next year.</p>
<div class="note">It does not solve everything. GPU drivers still have to match the host, and the model behind the API is still outside the container entirely. Containers fix the parts you own; the parts you rent need pinning by version instead.</div>`},

{l:"TRAP",t:"The overlooked layer",h:"Why this is skipped",b:`<p>It is skipped for a reason that is genuinely rational in the short term. Doing it properly costs days at the start and returns nothing visible. Skipping it costs nothing at the start and returns a demonstration sooner.</p>
<p>The bill arrives later, and always in the same three forms:</p>
<ul>
<li>A change that works locally and fails live, with no way to tell why.</li>
<li>A result nobody can reproduce, so nobody can tell whether a change helped.</li>
<li>A system that only one person can rebuild, who is on holiday.</li>
</ul>
<p>Note that all three are the same failure as the agent pilots in Mission 08 — Governance and observability: work that graduates from demonstration to production discovers that the demonstration was never the hard part.</p>
<div class="note">The proportionate version is small. Pin your versions. Name your model explicitly. Write one build file. Put prompts in version control. That is an afternoon, and it removes an entire category of failure that otherwise arrives at the worst possible moment.</div>`},

{l:"RECALL",t:"Mission 09",h:"What is now owned",b:`<ul>
<li>The <strong>environment</strong> — operating system, libraries, drivers, configuration, model version — decides behaviour as much as the code does.</li>
<li>Code passes through <strong>development, testing, staging and production</strong>, and they diverge by default.</li>
<li>Behaviour changes without anyone changing anything, because <strong>floating versions move</strong> — including the model.</li>
<li>The fix is <strong>environment as code</strong>: if it affects behaviour, write it down in a file that travels with the code.</li>
<li>Pin the <strong>model identifier</strong>, the <strong>sampling settings</strong>, the <strong>prompts</strong> and the <strong>eval set</strong>.</li>
<li>A <strong>container</strong> is the environment written down. It fixes what you own, not what you rent.</li>
<li>This is skipped because it pays nothing immediately and everything eventually.</li>
</ul>`}
]},
/* ============ MISSION 10 ============ */
{n:"10",title:"The whole map and the cheatsheet",stage:"Recall",
line:"Everything compressed: the map, the decision rules, the numbers, the diagnostics and every term in one place.",
cards:[

{l:"PICTURE",t:"The map",h:"Everything, at once",b:`<div class="dg"><div class="dg-t">The complete stack</div>
<div class="lay">
<div><span>1</span>Compute — GPUs, VRAM, CUDA, cloud / on-prem / edge</div>
<div><span>2</span>Models — foundation, open vs proprietary, reasoning, fine-tuning</div>
<div><span>3</span>Serving — TTFT, batching, quantization, caching, routing</div>
<div><span>4</span>Data — context window, embeddings, RAG, chunking, MCP</div>
<div><span>5</span>Orchestration — tools, structured output, workflows, agents</div>
<div><span>6</span>Applications — assistants, vertical products, pricing</div>
</div>
<div class="cross">Governance &amp; observability &nbsp;·&nbsp; traces, guardrails, drift, evals</div>
<div class="cross">Reproducibility &nbsp;·&nbsp; pinned versions, environment as code</div>
</div>
<p>Every term in this pack has an address on that diagram. If a new one arrives tomorrow — and it will — the useful first question is not <em>what does it do</em> but <em>which row does it sit on, and what does it replace</em>.</p>`},

{l:"RECALL",t:"Compression",h:"One line per layer",b:`<div class="sheet"><div class="h">The whole pack, compressed</div>
<div class="r"><b>1 — Compute</b><span>The file must fit in GPU memory; that decides the machines and the bill.</span></div>
<div class="r"><b>2 — Models</b><span>Pick the least capable model that reliably does the job.</span></div>
<div class="r"><b>3 — Serving</b><span>The same answer can cost ten times more depending on how it is served.</span></div>
<div class="r"><b>4 — Data</b><span>Put less, and better, on the desk. This is where systems are won.</span></div>
<div class="r"><b>5 — Orchestration</b><span>Multiplies everything below it, so bound it and anchor it to a real check.</span></div>
<div class="r"><b>6 — Applications</b><span>Own where the work happens, not the model.</span></div>
<div class="r"><b>Governance</b><span>Capture the evidence as you build, because it cannot be recovered later.</span></div>
<div class="r"><b>Reproducibility</b><span>If it affects behaviour, write it down in a file.</span></div>
</div>`},

{l:"CHEAT",t:"Decisions",h:"The rules, in one place",b:`<div class="sheet"><div class="h">Choosing</div>
<div class="r"><b>Open or proprietary</b><span>Data cannot leave, or independence is required → open. Otherwise rent.</span></div>
<div class="r"><b>Which tier</b><span>Least capable model that reliably does the job. Switch down for routine work.</span></div>
<div class="r"><b>Fine-tune or retrieve</b><span>Behaviour and format → fine-tune. Facts and freshness → retrieve.</span></div>
<div class="r"><b>Self-host or rent</b><span>Fixed cost vs variable. Self-host only at high, steady utilisation.</span></div>
<div class="r"><b>Workflow or agent</b><span>Known path → workflow. Unknown path → agent, bounded hard.</span></div>
<div class="r"><b>Vector DB or existing DB</b><span>Start with the database you already run. Migrate on a measured limit.</span></div>
</div>
<div class="sheet g"><div class="h">Always do</div>
<div class="r"><b>Order prompts</b><span>Stable material first, variable last — or caching cannot work.</span></div>
<div class="r"><b>Bound every loop</b><span>Max steps, max spend, max time, from day one.</span></div>
<div class="r"><b>Gate on consequence</b><span>Irreversible or expensive actions wait for a human. Not on confidence.</span></div>
<div class="r"><b>Pin the model version</b><span>A dated identifier, never a floating alias.</span></div>
<div class="r"><b>Trace every call</b><span>Model version, tokens in/out, latency, retrieved IDs, request ID.</span></div>
<div class="r"><b>Keep an eval set</b><span>Real cases, known-good answers, grown from every failure.</span></div>
</div>`},

{l:"CHEAT",t:"Money",h:"The cost sheet",b:`<div class="stamp">Rates 15–17 Aug 2026</div>
<div class="sheet b"><div class="h">Per million tokens — input / output</div>
<div class="r"><b>Claude Fable 5</b><span>$10 / $50</span></div>
<div class="r"><b>Claude Opus 5</b><span>$5 / $25</span></div>
<div class="r"><b>Claude Sonnet 5</b><span>$2 / $10</span></div>
<div class="r"><b>Claude Haiku 4.5</b><span>$1 / $5</span></div>
<div class="r"><b>GPT-5.6 Sol / Terra / Luna</b><span>$5 / $30 &nbsp;·&nbsp; $2 / $12 &nbsp;·&nbsp; $0.20 / $1.20</span></div>
<div class="r"><b>Gemini 3.1 Pro</b><span>$2 / $12 &nbsp;(doubles above 200K)</span></div>
<div class="r"><b>Gemini 3.7 Flash</b><span>$0.75 / $3.75</span></div>
<div class="r"><b>DeepSeek V4 Flash</b><span>$0.14 / $0.28</span></div>
<div class="r"><b>H100 rental</b><span>$2.19 – $11.06 per GPU-hour</span></div>
</div>
<div class="sheet"><div class="h">The arithmetic</div>
<div class="r"><b>Monthly bill</b><span>(input M x input rate) + (output M x output rate)</span></div>
<div class="r"><b>Words to tokens</b><span>tokens = words / 0.75</span></div>
<div class="r"><b>Model file size</b><span>parameters x bytes per parameter (FP16 = 2)</span></div>

</div>
<div class="sheet q"><div class="h">The levers, in order of size</div>
<div class="r"><b>Route down</b><span>−60% to −95%</span></div>
<div class="r"><b>Batch API</b><span>−50%, if hours instead of seconds is acceptable</span></div>
<div class="r"><b>Cache the prefix</b><span>−90% on repeated input</span></div>
<div class="r"><b>Turn thinking off</b><span>Where the task does not need it — it bills as output</span></div>
<div class="r"><b>Stay under the threshold</b><span>Long-context surcharges reprice the whole request</span></div>
</div>`},

{l:"CHEAT",t:"Models",h:"The roster, condensed",b:`<div class="stamp">Field as at 17 Aug 2026</div>
<div class="sheet b"><div class="h">Rented — context / released</div>
<div class="r"><b>Claude Fable 5</b><span>1M · Jun 2026 · top tier</span></div>
<div class="r"><b>Claude Opus 5</b><span>1M · 24 Jul 2026 · adaptive thinking by default</span></div>

</div>
