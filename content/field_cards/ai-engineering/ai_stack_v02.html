<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AI Stack — Field Cards · Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "17 August 2026";
const P = {
title:"The AI Stack",
sub:"How an AI system is actually assembled — every layer, in plain words, with the real market attached to it.",
missions:[
/* ============ MISSION 01 ============ */
{n:"01",title:"Before the stack",stage:"Ground",
line:"What a model is, what a token is, and the six layers that sit between a file of numbers and a person using it.",
cards:[

{l:"ORIENT",t:"Why a map",h:"You can name the parts. Can you <em>place</em> them?",b:`<p>Most people arriving at this subject already know the words. Model. Token. RAG. Agent. Vector database. Inference. The words are not the problem.</p>
<p>The problem is that the words arrive unordered — from launch posts, threads, job descriptions, a colleague in a meeting — and nothing tells you which of them are <strong>alternatives to each other</strong>, which are <strong>layered on top of each other</strong>, and which are the same idea wearing two names.</p>
<p>So the knowledge stays flat. You can recognise a term without being able to say what breaks if you remove it.</p>
<div class="note">This pack fixes the ordering. Six layers, bottom to top, each defined by the one job it does. Every term you already half-know gets a fixed address, and everything that follows can be hung off it.</div>
<p>Nothing here assumes programming. Every technical word is defined the first time it appears, and never used before it is defined.</p>`},

{l:"DEFINE",t:"The model",h:"What a <em>model</em> actually is",b:`<p>Strip away the mystique and a model is a <strong>file</strong>. A large one, containing nothing but numbers.</p>
<p>Those numbers are called <span class="k">weights</span>, or <span class="k">parameters</span>. A model with 70 billion parameters is a file holding 70 billion numbers. They encode statistical patterns absorbed from an enormous quantity of text.</p>
<p>The file size follows directly from two things: how many numbers, and how many bytes each number takes. That second number is called <span class="k">precision</span>.</p>
<div class="dt"><table>
<tr><th>Precision</th><th>Bytes each</th><th>70B model</th><th>Used for</th></tr>
<tr><td>FP32</td><td class="n">4</td><td class="n">280 GB</td><td class="g">Training, rarely serving</td></tr>
<tr class="hi"><td>FP16 / BF16</td><td class="n">2</td><td class="n">140 GB</td><td class="g">The standard full-quality form</td></tr>
<tr><td>INT8</td><td class="n">1</td><td class="n">70 GB</td><td class="g">Compressed for serving</td></tr>
<tr><td>INT4</td><td class="n">0.5</td><td class="n">35 GB</td><td class="g">Heavily compressed, runs on one card</td></tr>
</table></div>
<p>Parameters times bytes gives you the file. That single multiplication decides what hardware the model needs, and it returns in Mission 02 — Compute and infrastructure, where the machines are chosen.</p>
<div class="note">On its own the file does nothing. A model sitting on a disk is as inert as a photograph in a drawer. Everything in this pack exists to answer one question: what does it take to pick that file up and make it useful to a real person?</div>`},

{l:"LIVE",t:"The roster",h:"The rented models, today",b:`<div class="stamp">Collected 17 Aug 2026</div>
<p>Abstract definitions age badly. Here is the actual field on the day this card was written — the models a company would be choosing between right now. These are <span class="k">proprietary</span>: the file stays with the lab and you rent access over the internet.</p>
<div class="dt"><table>
<tr><th>Model</th><th>Lab</th><th>Released</th><th>Context in</th><th>Position</th></tr>
<tr><td>Claude Fable 5</td><td>Anthropic</td><td class="n">Jun 2026</td><td class="n">1M</td><td class="g">Top capability tier</td></tr>
<tr class="hi"><td>Claude Opus 5</td><td>Anthropic</td><td class="n">24 Jul 2026</td><td class="n">1M</td><td class="g">Default for serious work</td></tr>
<tr><td>Claude Sonnet 5</td><td>Anthropic</td><td class="n">2026</td><td class="n">1M</td><td class="g">Balanced workhorse</td></tr>
<tr><td>Claude Haiku 4.5</td><td>Anthropic</td><td class="n">Oct 2025</td><td class="n">200K</td><td class="g">Fast and light</td></tr>
<tr class="hi"><td>GPT-5.6 Sol</td><td>OpenAI</td><td class="n">9 Jul 2026</td><td class="n">1.05M</td><td class="g">Frontier tier</td></tr>
<tr><td>GPT-5.6 Terra</td><td>OpenAI</td><td class="n">9 Jul 2026</td><td class="n">1.05M</td><td class="g">Production middle</td></tr>
<tr><td>GPT-5.6 Luna</td><td>OpenAI</td><td class="n">9 Jul 2026</td><td class="n">1.05M</td><td class="g">High-volume cheap tier</td></tr>
<tr class="hi"><td>Gemini 3.1 Pro</td><td>Google</td><td class="n">2026</td><td class="n">1M</td><td class="g">Frontier tier</td></tr>
<tr><td>Gemini 3.7 Flash</td><td>Google</td><td class="n">13 Aug 2026</td><td class="n">1.05M</td><td class="g">Newest cheap tier</td></tr>
</table></div>
<p>Two patterns are worth reading off this table rather than memorising the rows. First, <strong>every lab ships a ladder</strong>, not a model — a top tier, a middle, a cheap one. Second, <strong>a million tokens of context is now ordinary</strong> at the frontier, where two years ago it was a headline.</p>
<div class="src">Sources: vendor pricing and model pages as aggregated by BenchLM, pricepertoken and vendor announcements, checked 15–17 Aug 2026. xAI, Mistral and Amazon ship competing tiers; verify rates before quoting any of them.</div>`},

{l:"LIVE",t:"The roster",h:"The models you can <em>download</em>",b:`<div class="stamp">Collected 17 Aug 2026</div>
<p>The other half of the field publishes the weights file itself. Anyone can download it and run it on their own machines. The term for this is <span class="k">open-weight</span>.</p>
<div class="dt"><table>
<tr><th>Model</th><th>Lab</th><th>Size</th><th>Licence</th><th>Context</th></tr>
<tr class="hi"><td>Kimi K3</td><td>Moonshot</td><td class="n">2.8T / 104B active</td><td class="g">Custom</td><td class="n">1.05M</td></tr>
<tr><td>DeepSeek V4 Pro</td><td>DeepSeek</td><td class="n">1.6T MoE</td><td class="g">MIT</td><td class="n">1M</td></tr>
<tr><td>GLM-5.2</td><td>Z.ai</td><td class="n">Large MoE</td><td class="g">MIT</td><td class="n">1M</td></tr>
<tr><td>Qwen3.6-35B-A3B</td><td>Alibaba</td><td class="n">35B / 3B active</td><td class="g">Apache 2.0</td><td class="n">Long</td></tr>
<tr><td>MiniMax M3</td><td>MiniMax</td><td class="n">MoE</td><td class="g">Open</td><td class="n">Long</td></tr>
</table></div>
<p>Two things in that table need unpacking, and both matter later.</p>
<div class="two"><div><b>Two numbers, not one</b>Kimi K3 holds 2.8 trillion parameters but uses about 104 billion of them per token. This design is called a <span class="k">mixture of experts</span> — the file is enormous, the work per token is not. Storage is set by the big number; speed by the small one.</div>
<div><b>Open-weight, not open-source</b>The numbers are published. The training data and process usually are not. Licences differ sharply: MIT and Apache 2.0 permit commercial use plainly, custom licences attach conditions. Read the licence on the exact checkpoint.</div></div>
<div class="src">Moonshot released Kimi K3 on 17 Jul 2026 with weights on 27 Jul 2026. LLM Stats open leaderboard snapshot of 7 Aug 2026 placed Kimi K3 first among open weights, GLM-5.2 second. Verify before relying on any ranking — this table moves monthly.</div>`},

{l:"DEFINE",t:"Tokens",h:"The unit everything is counted in",b:`<p>A model does not read words. It reads <span class="k">tokens</span> — fragments of text, usually a short word or a piece of a longer one.</p>
<p>The word <em>hospital</em> might be one token. The word <em>reproducibility</em> might be four. A working rule: <strong>100 tokens is about 75 English words</strong>, so a million tokens is roughly 750,000 words, or a dozen thick novels.</p>
<p>Tokens matter beyond linguistics for one commercial reason: they are the unit of billing. Every rented model is priced per million tokens, split in two.</p>
<div class="two"><div><b>Input tokens</b>Everything sent in — the question, the instructions, attached documents, the conversation so far.</div>
<div><b>Output tokens</b>Everything written back. Priced several times higher than input. The next card explains why.</div></div>
<p>Two details cost people real money because they are invisible on a price page:</p>
<ul>
<li><strong>Thinking is billed as output.</strong> Where a model reasons internally before answering, those hidden tokens are charged at the output rate even though you never see them.</li>
<li><strong>Token counts are not comparable across generations.</strong> Anthropic notes that Claude 4.7 and later cut the same English text into roughly 30% more tokens than earlier models — so a flat per-million comparison against an older model understates the real bill.</li>
</ul>`},

{l:"MECHANISM",t:"How it runs",h:"One token at a time",b:`<p>A model does exactly one thing: given a sequence of tokens, it produces a probability for every possible next token, and one is picked. That token is added to the sequence, and the whole thing runs again.</p>
<p>A paragraph of output is that single operation repeated a few hundred times. Nothing is planned in advance; the answer is discovered one token at a time.</p>
<div class="dg"><div class="dg-t">The two phases of one request</div>
<div class="flow">
<div class="n"><b>Phase 1 — Prefill</b>Read the entire input at once. All the tokens are known already, so the machine can process them <em>in parallel</em> — thousands at a time. Fast, and cheap per token.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Phase 2 — Decode</b>Generate the answer. Each new token depends on the one before it, so they must be produced <em>one after another</em>. No parallelism is possible. Slow, and expensive per token.</div>
</div></div>
<p>This asymmetry is the whole explanation for a price list. Input is read in bulk; output is produced in single file. That is why output costs three to six times input at every lab, and why a request that returns a long answer costs far more than one that reads a long document.</p>
<p>It also explains the two things a user actually feels: the pause before the first word appears is prefill finishing; the pace of words after that is decode running. Mission 04 — Inference and serving names and attacks both.</p>
<div class="note">There is no separate reasoning module inside the file. Everything that reads as reasoning, style or expertise emerges from this loop running at scale.</div>`},

{l:"LIVE",t:"The bill",h:"How to read a <em>price page</em>",b:`<div class="stamp">Rates checked 15–17 Aug 2026</div>

<p><strong>A worked example.</strong> An assistant answers 50,000 questions a month. Each sends 4,000 input tokens and returns 800 output tokens: 200M input and 40M output.</p>

<p>Same traffic, a 23x spread. No engineering has happened yet — this is model selection alone, and it is the reason Mission 04 — Inference and serving spends a whole card on routing.</p>
<div class="src">Watch for four modifiers that are not in the headline: a long-context surcharge above a threshold, cache discounts, a batch discount for non-urgent work, and thinking tokens billed as output. All four are covered in Mission 04 — Inference and serving.</div>`},

{l:"DEFINE",t:"The central split",h:"Training and <em>inference</em>",b:`<p>This is the most important distinction in the pack. Almost every cost, tool and job title in AI sits on one side of it or the other.</p>
<div class="two"><div><b>Training</b>Creating the file. Feeding vast quantities of text through specialised hardware for weeks or months until the numbers settle into useful patterns. Enormously expensive. Happens <strong>occasionally</strong>.</div>
<div><b>Inference</b>Using the file. Running it once to answer one request. Cheap per use. Happens <strong>every time anyone asks it anything</strong>.</div></div>
<p>A model might be trained four times in its life. It will run inference a billion times. That ratio is why the industry's spending has an unintuitive shape: the headline number is training, the recurring bill is inference.</p>
<div class="stamp">Reported figures, Apr–Aug 2026</div>
<p>Two dated illustrations. Reporting on confidential financials in April 2026 put Anthropic's cumulative training spend at roughly $4.1bn against a far larger figure for OpenAI — while, separately, OpenAI's cost of serving a single query is reported to have fallen around 95% since GPT-4 launched in early 2023.</p>
<div class="note">Read that pair carefully, because it is the shape of the whole industry: <strong>the cost per request keeps collapsing, and the total bill keeps rising</strong>, because usage grows faster than unit cost falls. Mission 02 — Compute and infrastructure returns to this as the cost inversion.</div>`},

{l:"WHY IT EXISTS",t:"The gap",h:"A file is not a product",b:`<p>Between a model file and something a person can use sits a list of unglamorous problems, and none of them are solved by choosing a better model.</p>
<ul>
<li>The file has to run on machines large enough to hold it and fast enough to answer while somebody waits.</li>
<li>It was trained on text that stops at a date, so it knows nothing about last week and nothing at all about your company.</li>
<li>Most real tasks need several steps in sequence, not one answer.</li>
<li>Somebody has to prove afterwards what it did, what it cost, and why.</li>
<li>It has to behave identically on an engineer's laptop and on the live system.</li>
</ul>
<p>Each of those is a layer. That is all the stack is: the list of everything standing between the file and the person.</p>`},

{l:"PICTURE",t:"The stack",h:"Six layers, bottom to top",b:`<div class="dg"><div class="dg-t">Read from the bottom up</div>
<div class="lay">
<div><span>1</span>Compute &amp; infrastructure — the machines</div>
<div><span>2</span>Model training &amp; development — which model</div>
<div><span>3</span>Inference &amp; serving — making it respond</div>
<div><span>4</span>Data, retrieval &amp; protocols — giving it context</div>
<div><span>5</span>Orchestration &amp; agents — turning calls into work</div>
<div><span>6</span>Applications — what a person sees</div>
</div>
<div class="cross">Governance &amp; observability &nbsp;·&nbsp; runs through all six</div>
<div class="cross">Reproducibility &nbsp;·&nbsp; runs through all six</div>
</div>
<p>Each layer is one mission of this pack, in order, and each is defined by a single question:</p>
<div class="sheet"><div class="h">The question each layer answers</div>
<div class="r"><b>1 — Compute</b><span>What machines, and who owns them?</span></div>
<div class="r"><b>2 — Models</b><span>Which file, on whose terms?</span></div>
<div class="r"><b>3 — Serving</b><span>How does it answer fast and affordably?</span></div>
<div class="r"><b>4 — Data</b><span>How does it know anything specific?</span></div>
<div class="r"><b>5 — Orchestration</b><span>What happens next, and who decides?</span></div>
<div class="r"><b>6 — Applications</b><span>What does the person actually touch?</span></div>
</div>
<p>Practitioners draw the boundaries differently and that is fine. What matters is the job each layer does, not the number of boxes.</p>`},

{l:"TRAP",t:"The model reflex",h:"The model is <em>one</em> layer",b:`<p>The most common and most expensive misconception in the field: that choosing the right model is the hard part and the rest is plumbing.</p>
<p>In practice the model is layer two of six, and it is frequently the layer a team spends the <em>least</em> time on — a decision made in an afternoon and revisited twice a year.</p>
<p>Systems fail in production for reasons that have nothing to do with model quality. They retrieve the wrong document. They cost four times the forecast. They behave differently live than in testing. They cannot explain what they did.</p>
<div class="stamp">Gartner, cited through Jul 2026</div>
<p>The evidence is blunt. Gartner projects that <strong>more than 40% of agentic AI projects will be cancelled by the end of 2027</strong>, and names the causes as escalating costs, unclear business value and inadequate risk controls. Not one of those three is a model problem.</p>
<div class="note">Everything around the model decides whether the system works. That sentence is the spine of this pack, and it is earned layer by layer.</div>`},

{l:"ORIENT",t:"The example",h:"One system, carried throughout",b:`<p>A single example runs through every layer: a company building an <strong>AI coding assistant</strong> for its own engineers.</p>
<p>An engineer writes software — instructions a computer follows. The assistant sits inside the program the engineer already types into and writes some of those instructions for them. Thousands of engineers, one assistant.</p>
<p>It is a useful example because it exercises every layer honestly, and because it is not hypothetical — it is the single largest commercial category in applied AI right now, covered with real numbers in Mission 07 — Applications.</p>
<table>
<tr><td>It must know the company's own code</td><td>Layer 4 — retrieval</td></tr>
<tr><td>It must work in steps: understand, write, test, review</td><td>Layer 5 — orchestration</td></tr>
<tr><td>It must answer fast, at bearable cost</td><td>Layers 1 and 3</td></tr>
<tr><td>It must live inside the engineer's own tools</td><td>Layer 6 — application</td></tr>
<tr><td>It must be auditable when it changes something</td><td>Governance, across all layers</td></tr>
</table>`},

{l:"RECALL",t:"Mission 01",h:"What is now owned",b:`<ul>
<li>A <strong>model</strong> is a file of numbers called weights. Parameters times bytes-per-parameter gives the file size, and that decides the hardware.</li>
<li>A <strong>token</strong> is a fragment of text and the unit of billing. 100 tokens is about 75 words.</li>
<li>Generation runs in two phases: <strong>prefill</strong> reads the input in parallel, <strong>decode</strong> writes the answer one token at a time. That is why output costs 3–6x input.</li>
<li><strong>Training</strong> makes the file and happens rarely. <strong>Inference</strong> uses it and happens constantly.</li>
<li>The field splits into <strong>proprietary</strong> models you rent and <strong>open-weight</strong> models you download.</li>
<li>Six layers sit between the file and the user, with governance and reproducibility cutting across all of them.</li>
</ul>
<div class="note">Nothing above needed a further definition to be understood. That standard holds for the rest of the pack.</div>`}
]},
/* ============ MISSION 02 ============ */
{n:"02",title:"Compute and infrastructure",stage:"Layer 1",
line:"The machines. Why AI needs unusual hardware, how much of it, what it costs to rent, and who controls the software beneath it.",
cards:[

{l:"ORIENT",t:"Layer 1",h:"The floor everything stands on",b:`<p>The bottom layer answers a blunt question: <strong>what machines does this run on, and who owns them?</strong></p>
<p>Every decision above is constrained by the answer. A model that does not fit on the available hardware is not an option however good it is. A serving cost that cannot be borne ends the product however well it works.</p>
<p>This layer is unusual in one respect. In most software, infrastructure is a solved commodity you rent without thinking. Here it is a scarce, expensive, politically contested resource with a single dominant supplier — and the reason for that is worth understanding rather than memorising.</p>
<div class="note">A quiet problem is also planted in this mission that does not surface until Mission 09 — Reproducibility. The last card of this mission is where it goes in.</div>`},

{l:"DEFINE",t:"CPU and GPU",h:"Two kinds of processor",b:`<p>A <span class="k">processor</span> is the part of a computer that performs calculations. Two kinds matter here.</p>
<div class="two"><div><b>CPU</b>Central Processing Unit. A handful of very fast, very flexible workers. Excellent at complicated instructions performed in sequence. This runs ordinary software.</div>
<div><b>GPU</b>Graphics Processing Unit. Thousands of simpler workers operating at the same instant. Poor at complicated sequences, extraordinary at doing the same simple sum thousands of times at once.</div></div>
<p>Why does that suit AI? Because of what the arithmetic actually looks like.</p>
<p>Predicting one token means multiplying the incoming numbers against the weights — billions of multiply-and-add operations, none of which depends on the result of any other. They can all happen simultaneously. That is not a special case for a GPU; it is precisely the shape a GPU was built for, originally to colour millions of independent pixels for video games.</p>
<div class="note">The field did not commission this hardware. It inherited it. A processor designed to render explosions turned out to be the right instrument for matrix arithmetic, and an entire industry rearranged itself around that coincidence.</div>`},

{l:"MECHANISM",t:"The memory wall",h:"Why the file size <em>decides</em> the machine",b:`<p>Here is the part that is usually skipped, and it is the most practically useful thing in this layer.</p>
<p>To run a model, the whole weights file must sit in the GPU's own memory, called <span class="k">VRAM</span>. Not on the disk. Not in ordinary computer memory. In the GPU. An NVIDIA H100 has 80 GB of it; an H200 has 141 GB; a B200 has 192 GB.</p>
<p>Recall the multiplication from Mission 01 — Before the stack: parameters times bytes each. Now it does real work.</p>
<div class="dg"><div class="dg-t">Serving a 70B model at full precision</div>
<div class="flow">
<div class="n"><b>Weights</b>70 billion parameters at 2 bytes each = <strong>140 GB</strong>. Already larger than a single 80 GB H100.</div>
<div class="a">&#8595;</div>
<div class="n"><b>KV cache</b>Every token in the conversation leaves working state behind so it need not be recomputed. This grows with context length and with the number of users served at once. Tens of gigabytes, and it is the part people forget.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Overhead</b>Activations, fragmentation, headroom.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Result</b>Two GPUs will not comfortably do it. <strong>Four to eight</strong> is the realistic answer, wired together with high-speed interconnect so they behave as one.</div>
</div></div>
<p>Three consequences follow, and they explain most of what happens in the layers above:</p>
<ul>
<li><strong>Model size is a hardware bill, not a preference.</strong> Doubling parameters can double the machines.</li>
<li><strong>Compression is not a nicety.</strong> Storing weights at 1 byte instead of 2 halves the requirement and can turn eight cards into four. Mission 04 — Inference and serving names this quantization.</li>
<li><strong>Long context is expensive in memory, not just money.</strong> The KV cache is why a million-token window is a hardware commitment and not a marketing checkbox.</li>
</ul>
<div class="note">The limit is usually memory, not speed. A GPU that could do the arithmetic faster is idle if the numbers cannot fit beside it. This is why the industry talks about memory bandwidth and VRAM capacity more than raw operations per second.</div>`},

{l:"LIVE",t:"The price of a GPU-hour",h:"What the machines cost",b:`<div class="stamp">Market rates, Aug 2026</div>
<p>Hardware is rented by the GPU-hour. Rates vary by a factor of five between the cheapest specialist marketplaces and the largest cloud providers for the identical card, so any single figure is a range rather than a price.</p>
<div class="dt"><table>
<tr><th>Card</th><th>VRAM</th><th>Typical on-demand</th><th>Buy price</th></tr>
<tr><td>A100</td><td class="n">80 GB</td><td class="n">$1.09 – $5.07 /hr</td><td class="g">Previous generation</td></tr>
<tr class="hi"><td>H100</td><td class="n">80 GB</td><td class="n">$2.19 – $11.06 /hr</td><td class="n">$25k – $40k</td></tr>
<tr><td>H200</td><td class="n">141 GB</td><td class="n">~$4.00 /hr</td><td class="n">$30k – $40k</td></tr>
<tr><td>B200</td><td class="n">192 GB</td><td class="n">$5.91 – $16.11 /hr</td><td class="n">$30k – $40k</td></tr>
</table></div>
<p>Read three things off this rather than the numbers themselves.</p>
<div class="three"><div><b>Prices fall</b>H100 rental has dropped roughly two thirds from its 2023 peak near $8/hr as supply caught up and newer cards arrived.</div>
<div><b>Newest is not cheapest</b>B200 carries a 75–150% premium over an H200 and a less mature software stack. It wins on very large models and very long context; otherwise it loses on cost per useful token.</div>
<div><b>Power is real</b>A B200 draws about 1000W. Many data centres physically cannot host them without retrofitting, which is why availability, not price, is often the binding constraint.</div></div>
<p>Put the memory-wall card together with this one and you get a concrete monthly figure. A 70B model on eight H100s at roughly $2.50/hr each, running continuously, is about <strong>$14,400 a month</strong> before anyone is paid to look after it.</p>
<div class="src">Rates aggregated from Thunder Compute, Jarvislabs, Spheron and IntuitionLabs provider surveys, Aug 2026. Spot and reserved pricing runs materially lower; hyperscaler on-demand runs materially higher.</div>`},

{l:"DEFINE",t:"CUDA",h:"The layer beneath the hardware",b:`<p>A GPU cannot be instructed directly in ordinary programming terms. Something has to translate a mathematical intention into thousands of parallel operations on that specific chip.</p>
<p>For NVIDIA hardware, that something is <span class="k">CUDA</span> — a software platform released in 2007, roughly five years before anyone knew what it would be used for.</p>
<p>Nearly every AI library ever written assumes it. Every optimisation, every tutorial, every bug already found and fixed, sits on top of it. NVIDIA's own figures describe an installed base in the hundreds of millions of CUDA-capable devices and several million developers building against it.</p>
<div class="note">This is why a competitor cannot win by building a faster chip. The chip is the small part. The moat is nineteen years of accumulated software that only speaks to one company's hardware.</div>`},

{l:"LIVE",t:"The moat, measured",h:"How dominant, and where it <em>cracks</em>",b:`<div class="stamp">Estimates, H1 2026</div>
<p>Market-share figures for AI accelerators vary by who is counting and what they count, but the direction is consistent across sources.</p>
<div class="bars">
<div class="row"><div class="lb"><span>NVIDIA — training workloads</span><span>&gt;90%</span></div><div class="tr"><i style="width:92%"></i></div></div>
<div class="row"><div class="lb"><span>NVIDIA — all AI accelerators</span><span>~75–88%</span></div><div class="tr"><i style="width:81%"></i></div></div>
<div class="row"><div class="lb"><span>NVIDIA — inference only</span><span>~60–75%</span></div><div class="tr"><i class="b" style="width:67%"></i></div></div>
<div class="row"><div class="lb"><span>AMD — AI accelerators by revenue</span><span>~5–7%</span></div><div class="tr"><i class="d" style="width:6%"></i></div></div>
</div>
<p>The gap between the first row and the third is the entire strategic story of this layer. <strong>Training is locked; inference is opening.</strong></p>
<p>Three reasons, and each is a real mechanism rather than a prediction:</p>
<ul>
<li><strong>Inference is price-sensitive.</strong> Training a frontier model is a prestige project; serving it is a line item measured in cents per request.</li>
<li><strong>Serving software abstracts the hardware away.</strong> Engines such as vLLM and SGLang, covered in Mission 04 — Inference and serving, hide the difference between vendors. OpenAI's Triton compiler generates optimised code for NVIDIA and AMD alike.</li>
<li><strong>Memory capacity decides inference.</strong> As the memory-wall card showed, the constraint is often gigabytes rather than arithmetic, and competitors have shipped cards with more of them.</li>
</ul>
<div class="note">Supply is the other half of the moat, and it is not about software at all. NVIDIA is reported to have booked around 60% of TSMC's advanced packaging capacity for 2026 — the single manufacturing step every modern accelerator needs. A rival can design a better chip and still not be able to have it made.</div>`},

{l:"DEFINE",t:"The alternatives",h:"TPUs, Trainium and the rest",b:`<p>The challengers fall into two groups with different logic.</p>
<div class="two"><div><b>Custom silicon</b>Google's TPU and Amazon's Trainium are designed by cloud providers for their own machines. Not sold to you; rented as a service. Their economics work because the buyer and the operator are the same company.</div>
<div><b>Merchant silicon</b>AMD's Instinct line is sold to anyone, as NVIDIA's is. It competes on memory capacity and price per token rather than ecosystem.</div></div>
<p>Both face the same obstacle, and it is not performance. Software written for CUDA does not run elsewhere without work, and the amount of work is rarely known until it is attempted.</p>
<p>The honest summary for a reader placing this layer on the map: <strong>if you rent a model through an API you will never see any of this</strong>. It matters when you self-host, when you negotiate a large cloud contract, or when you are reading the industry rather than using it.</p>`},

{l:"TRADE-OFF",t:"Where it runs",h:"Cloud, on-premises, edge",b:`<p>Three places the machines can be, with different reasons.</p>
<div class="dt"><table>
<tr><th>Option</th><th>What it means</th><th>Chosen when</th></tr>
<tr><td>Cloud</td><td>Rent someone else's machines by the hour</td><td class="g">Demand is uneven, capital is scarce, speed matters</td></tr>
<tr><td>On-premises</td><td>Buy and operate your own</td><td class="g">Data cannot leave, or usage is steady and large enough to beat rental</td></tr>
<tr><td>Edge</td><td>Run on the user's own device</td><td class="g">Latency must be tiny, or the network cannot be relied on</td></tr>
</table></div>
<p>Edge is the one most people underrate. A small model running on a phone or a laptop has no per-token cost, no network delay and no data leaving the device — at the price of being a small model. Mission 03 — Models and training explains why that trade is often better than it sounds.</p>
<p>Most real systems use more than one. A frontier model in the cloud for hard requests, a small local model for the constant cheap ones.</p>`},

{l:"MECHANISM",t:"The cost inversion",h:"Train once, <em>serve forever</em>",b:`<p>Training costs are enormous, singular and widely reported. Serving costs are modest, continuous and invisible — and for almost every organisation, the second number is the one that ends up mattering.</p>
<div class="dg"><div class="dg-t">Two cost curves</div>
<div class="flow">
<div class="n"><b>Training</b>A vertical spike. Paid once, in advance, by a lab. Forecastable, because it happens on purpose.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Inference</b>A flat line that never stops, multiplied by every user, every request, and every retry. Grows with success.</div>
</div></div>
<p>The trap is that the inference line is <em>proportional to adoption</em>. A system that nobody uses is cheap. A system that works becomes the largest line in the budget, and it does so in the same quarter that everyone declares it a success.</p>
<div class="stamp">Reported, 2026</div>
<p>Two dated markers of the scale involved. Anthropic is estimated to spend around 2.3 times its payroll on compute — roughly $2m of compute per employee per year. And industry surveys of failed agent projects repeatedly find pilots that cost a few hundred thousand to build requiring <strong>$1–2m annually to run reliably</strong>, a figure that appeared in no original plan.</p>
<div class="note">Two levers exist against this, and both live one layer up: make each request cheaper (Mission 04 — Inference and serving) and send cheap requests to cheap models (routing, same mission).</div>`},

{l:"NUMBERS",t:"Rent or own",h:"Where the lines <em>cross</em>",b:`<p>The self-hosting question is usually argued with adjectives. It is arithmetic, and worth doing once properly.</p>
<p>Take the assistant from Mission 01 — Before the stack: 200M input and 40M output tokens a month.</p>
<div class="dt"><table>
<tr><th></th><th>Rent an API</th><th>Self-host open weights</th></tr>
<tr><td>Per-token bill</td><td class="n">$800 – $2,000</td><td class="n">$0</td></tr>
<tr><td>Hardware</td><td class="g">None</td><td class="n">~$14,400 /mo (8x H100)</td></tr>
<tr><td>People</td><td class="g">None dedicated</td><td class="n">Fraction of 1–2 engineers</td></tr>
<tr><td>Scaling and uptime</td><td class="g">Provider's problem</td><td class="g">Yours</td></tr>
<tr><td>Model upgrades</td><td class="g">Automatic</td><td class="g">A migration project</td></tr>
</table></div>
<p>At this volume, renting wins by an order of magnitude and it is not close. The GPUs sit idle most of the day and you pay for them anyway.</p>
<p>The lines cross when utilisation is high and constant — when those same GPUs are busy around the clock. That is a volume question, and it has a clean form: <strong>self-hosting is a fixed cost, renting is a variable cost</strong>. Fixed costs win at scale and lose everywhere else.</p>
<div class="note">Which is why the two genuine arguments for open weights are not about price at all, and Mission 03 — Models and training states them plainly: data never leaves the building, and nobody else can change or withdraw the model.</div>`},

{l:"TRAP",t:"The first seed",h:"Nobody knows which version they run",b:`<p>Machines are provisioned, libraries installed, drivers matched to hardware, a serving engine configured. It works. Everyone moves on.</p>
<p>Six weeks later a second machine is added to handle load. It is built from the same instructions, but the instructions said <em>install the current version</em> and the current version has moved. Now two machines answer the same question differently and nobody can say why.</p>
<p>This is not a hypothetical and it is not rare. It is the ordinary consequence of treating infrastructure as a task rather than as a recorded artefact.</p>
<div class="note">Remember this card. Mission 09 — Reproducibility is the whole answer to it, and it will refer back to precisely this moment: the first machine, built by hand, undocumented.</div>`},

{l:"RECALL",t:"Mission 02",h:"What is now owned",b:`<ul>
<li><strong>GPUs</strong> suit AI because the arithmetic is thousands of independent operations, not one long sequence.</li>
<li>The whole weights file must fit in <strong>VRAM</strong>. A 70B model at full precision needs 140 GB, plus KV cache — realistically four to eight cards.</li>
<li>The binding constraint is usually <strong>memory</strong>, not speed. Long context costs memory.</li>
<li>H100 rents for roughly <strong>$2–11 per GPU-hour</strong> depending on provider; newest cards cost more and are harder to get.</li>
<li><strong>CUDA</strong> is the moat — nineteen years of software, not the chip. It holds firmly on training, less firmly on inference.</li>
<li>Machines sit in the <strong>cloud</strong>, <strong>on-premises</strong> or at the <strong>edge</strong>. Most real systems use more than one.</li>
<li>Training is a spike; <strong>inference is a line that grows with success</strong>. Self-hosting is a fixed cost and only wins at high, steady utilisation.</li>
</ul>`}
]},
/* ============ MISSION 03 ============ */
{n:"03",title:"Models and training",stage:"Layer 2",
line:"Which file, on whose terms. How models are made, why they behave as they do, and how to choose one without paying for capability you never use.",
cards:[

{l:"ORIENT",t:"Layer 2",h:"Which model, and on whose terms",b:`<p>The second layer is the one everyone thinks is the whole subject. It is one of six, and this mission is about making the choice properly rather than by reflex.</p>
<p>Three questions decide it, and they are answered in this order:</p>
<ul>
<li>Where do the weights live — with a lab you rent from, or on machines you control?</li>
<li>How much capability does this particular task actually require?</li>
<li>Should the model be adapted to your work, or given your work at the moment of asking?</li>
</ul>
<p>That third question is the boundary between this mission and Mission 05 — Data, retrieval and protocols, and it is one of the most common confusions in the field. Changing the model is training. Handing it information at the moment of the request is context. They solve different problems and cost different amounts.</p>`},

{l:"DEFINE",t:"Foundation models",h:"Trained once, used for anything",b:`<p>A <span class="k">foundation model</span> is a model trained on a broad sweep of text, intended to be adapted to many tasks rather than built for one.</p>
<p>It is the substrate. It knows language, structure, code and a great deal of general knowledge, and it knows nothing whatever about any particular organisation.</p>
<p>A small number of well-funded laboratories build them, because the training run alone costs what a mid-sized company is worth. Everyone else builds on top — and that division of labour is the reason a stack exists at all.</p>`},

{l:"MECHANISM",t:"Two stages",h:"Why a raw model is not an <em>assistant</em>",b:`<p>Training is not one event. It is two, and the difference explains why models behave the way they do.</p>
<div class="two"><div><b>Pre-training</b>The model reads an enormous quantity of text and learns only to predict what comes next. The result is capable and useless — it will continue a question rather than answer it, because continuing is all it was ever asked to do.</div>
<div><b>Post-training</b>A much smaller stage teaching it to be helpful: follow instructions, answer rather than continue, refuse certain things, adopt a manner. Usually involves humans ranking outputs so the model learns which kind of answer is preferred.</div></div>
<p>Nearly all the personality, helpfulness and caution of a commercial model comes from the second stage. Nearly all the knowledge comes from the first.</p>
<div class="note">This is why two models trained on similar text can feel completely different to use, and why a model can be strong on a benchmark and unpleasant in practice. The difference is usually post-training, not raw capability.</div>`},

{l:"DEFINE",t:"Reasoning models",h:"Thinking before answering",b:`<p>A distinct class of model behaves differently: instead of answering immediately, it generates a long internal working-out first, then produces a final answer. These are <span class="k">reasoning models</span>, and the internal working is usually hidden or summarised.</p>
<div class="two"><div><b>What is gained</b>Substantially better performance on problems with many steps — mathematics, complex code, chains of logic where one wrong turn ruins the answer.</div>
<div><b>What is paid</b>Far more tokens generated, so higher cost and a longer wait. Sometimes ten or twenty times the tokens for one answer.</div></div>
<p>This created a new lever, called <span class="k">test-time compute</span>: spending more effort at the moment of answering rather than at the moment of training. A model can be asked to think hard about a hard question and barely at all about an easy one.</p>
<p>In products this appears as an <span class="k">effort</span> or <span class="k">thinking</span> setting. It is worth being precise about what that control does, because it is routinely misread:</p>
<ul>
<li>It governs <strong>how much the model deliberates</strong>, not how long the answer is. Asking for a shorter reply is a separate instruction.</li>
<li>Raising effort and also writing <em>check your work carefully</em> is paying twice for the same thing. Two controls pushing the same direction is not twice the diligence.</li>
</ul>
<div class="note">Which is the same insight as routing in Mission 04 — Inference and serving, arriving from a different direction: match the effort to the difficulty rather than paying maximum on every request.</div>`},

{l:"LIVE",t:"What thinking costs",h:"The line item nobody <em>budgeted</em>",b:`<div class="stamp">Checked 17 Aug 2026</div>
<p>Hidden reasoning tokens are billed at the output rate. Since output is the expensive side, a reasoning-heavy request can cost several times a plain one on identical pricing.</p>
<p>Two dated changes make this concrete rather than theoretical:</p>
<div class="dt"><table>
<tr><th>Change</th><th>Effect on the bill</th></tr>
<tr class="hi"><td>Claude Opus 5 runs adaptive thinking by default; on Opus 4.8 omitting the thinking field meant no thinking</td><td class="g">The same code migrated forward now generates billed thinking tokens on every request at $25/M</td></tr>
<tr><td>Google's Gemini bills thinking tokens at the output rate on its reasoning tiers</td><td class="g">Invisible on a token estimate built from prompt and answer alone</td></tr>
</table></div>
<p>The general rule to carry: <strong>estimate output tokens, then assume reasoning can multiply them.</strong> An estimate built from the visible answer alone is not an estimate.</p>
<div class="note">The counter-argument from the labs is also real, and worth holding alongside: on hard tasks a stronger model that thinks can reach a better answer for fewer total attempts, which is cheaper than a weaker model failing three times. Anthropic makes exactly this claim for Opus 5 against its top tier — comparable peak scores at roughly half the cost per task. Cost per <em>completed task</em> is the honest measure, not cost per token.</div>`},

{l:"DEFINE",t:"Multimodal",h:"Beyond text",b:`<p>Most current frontier models are <span class="k">multimodal</span> — able to take images, documents, audio or video as input alongside text.</p>
<p>The mechanism is unchanged. An image is converted into tokens by a different method and then predicted over exactly as text is. There is no separate vision faculty; the input is translated into the only currency the model understands.</p>
<ul>
<li>A photograph of a form, read and turned into structured data</li>
<li>A screenshot of a broken interface, described and diagnosed</li>
<li>A chart in a report, interpreted rather than skipped</li>
</ul>
<p>Images consume tokens, often a great many, and audio input is priced two to seven times higher than text at some providers. A multimodal request is usually a more expensive request.</p>`},

{l:"TRADE-OFF",t:"The real comparison",h:"Free is not free",b:`<p>The choice is often presented as paid against free. That framing is wrong, and expensively so — Mission 02 — Compute and infrastructure already did the arithmetic.</p>
<table>
<tr><td>Hosted (proprietary)</td><td>A per-token charge. In exchange the provider handles machines, serving, scaling, updates and reliability. Capability is available in an afternoon.</td></tr>
<tr><td>Open-weight, self-run</td><td>No per-token charge. Instead: GPUs, hosting, monitoring, upgrades — and the salaries of the engineers who keep it standing.</td></tr>
</table>
<p>The token bill disappears. The operational work does not; it moves in-house and acquires a payroll.</p>
<p>Open weights win decisively on two grounds that have nothing to do with price:</p>
<div class="two"><div><b>Data never leaves</b>Nothing is sent to a third party. For regulated work — health records, legal files, anything under data-residency rules — this is frequently the only argument that matters, and it settles the decision on its own.</div>
<div><b>Nobody can change it</b>A hosted model can be updated, deprecated or withdrawn on someone else's schedule. A downloaded file behaves the same way in three years. Mission 08 — Governance and observability shows what silent updates do to a working system.</div></div>
<div class="note">A third argument is emerging from the price data itself. Hosted rates at the cheap end — DeepSeek V4 Flash at $0.14/$0.28 per million tokens — are now low enough that for many workloads the interesting comparison is not open against closed, but cheap-hosted against expensive-hosted.</div>`},

{l:"MECHANISM",t:"Fine-tuning",h:"Adjusting a model that already exists",b:`<p><span class="k">Fine-tuning</span> takes a working model and continues its training on a much smaller, specific set of examples. The general capability remains; a specialisation is added on top.</p>
<div class="flow">
<div class="n"><b>Start</b>A model that handles language well and knows nothing about the domain</div>
<div class="a">&#8595;</div>
<div class="n"><b>Feed</b>A few thousand examples of the exact task, done correctly</div>
<div class="a">&#8595;</div>
<div class="n"><b>Result</b>A model noticeably better at that one task, and no better at anything else</div>
</div>
<p>Orders of magnitude cheaper than training from scratch — hours and thousands rather than months and millions.</p>
<p>The critical distinction, and the one that decides most real projects:</p>
<div class="two"><div><b>Fine-tuning teaches a <em>manner</em></b>How to behave: this format, this tone, this classification scheme, this way of structuring an answer. Facts learned this way are baked in and go stale.</div>
<div><b>Retrieval supplies <em>facts</em></b>What is true right now: this customer's balance, this week's policy, this document. Covered in Mission 05 — Data, retrieval and protocols.</div></div>
<div class="note">Teams reach for fine-tuning when they want the model to know something, and are disappointed. It is the wrong instrument for that job. Fine-tune for behaviour; retrieve for knowledge.</div>`},

{l:"MECHANISM",t:"Small and sharp",h:"Why the biggest model loses",b:`<p>One of the most consequential shifts of recent years: a small model fine-tuned for one narrow, well-defined task will often <strong>outperform a much larger general-purpose model on that task</strong> — while running faster and costing considerably less.</p>
<p>The reason is not mysterious. A large general model carries capability for thousands of tasks it is not currently being asked to do. That breadth is paid for on every single request, in money and in latency.</p>
<p>The same logic explains why open-weight labs now ship deliberately small models alongside enormous ones. A 35-billion-parameter model that runs on one card is not a consolation prize; it is the correct tool for classification, extraction, routing and formatting — which is most of the requests in a real system.</p>
<div class="note">This turns model selection into an engineering discipline of its own. A serious system rarely uses one model. It uses several, each chosen for the step it sits at.</div>`},

{l:"LIVE",t:"Reading a benchmark",h:"What the numbers do and <em>don't</em> say",b:`<div class="stamp">Scores current 17 Aug 2026</div>
<p>Model comparisons are quoted as index scores. They are useful and they are routinely over-read, so here is how to hold them.</p>
<div class="dt"><table>
<tr><th>Benchmark</th><th>What it measures</th><th>Example</th></tr>
<tr><td>GPQA Diamond</td><td class="g">Graduate-level science questions</td><td class="n">Opus 5: 93.2%</td></tr>
<tr><td>Coding index</td><td class="g">Composite of code tasks</td><td class="n">Opus 5: 78.0</td></tr>
<tr><td>SWE-bench</td><td class="g">Real fixes to real repositories</td><td class="g">Quoted by every coding model</td></tr>
<tr><td>Open leaderboards</td><td class="g">Aggregate of the above for open weights</td><td class="n">Kimi K3: 55.4 overall</td></tr>
</table></div>
<p>Four cautions, each of which has cost somebody money:</p>
<ul>
<li><strong>Vendor-reported is not independent.</strong> The number in a launch post was produced by the party with an interest in it. Third-party leaderboards and your own tests are different evidence.</li>
<li><strong>Benchmarks saturate.</strong> When every frontier model scores above 90 on a test, that test has stopped discriminating between them and the remaining gap is noise.</li>
<li><strong>A benchmark is not your workload.</strong> Scores measure a distribution of tasks that is not your distribution of tasks.</li>
<li><strong>Cost per completed task beats score.</strong> A model that is 3% weaker at a fifth of the price is usually the correct commercial answer.</li>
</ul>
<div class="note">The practical move is unglamorous and rarely done: assemble thirty real examples of your actual work, with correct answers, and run every candidate against them. That is an eval, and Mission 08 — Governance and observability treats it as infrastructure rather than a one-off.</div>`},

{l:"PICTURE",t:"The choice",h:"Four questions, in order",b:`<div class="dg"><div class="dg-t">Model selection, layer by layer</div>
<div class="flow">
<div class="n"><b>1 — Can the data leave?</b>If not, the decision is already made: open-weight, self-hosted. Everything else is downstream of this.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Is the task narrow?</b>Narrow and repetitive favours a small or fine-tuned model. Broad and unpredictable favours a large general one.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — What is the volume?</b>Low volume favours renting. High and steady volume is where self-hosting begins to repay its overhead.</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — How fast must it answer?</b>Strict speed requirements push towards smaller models, or towards running closer to the user.</div>
</div></div>
<p>Answered in that order, the choice usually makes itself. Answered in reverse, it becomes an argument about benchmarks.</p>`},

{l:"TRAP",t:"The reflex",h:"Reaching for the largest model",b:`<p>The instinct is to pick the most capable model available and use it everywhere. It is a defensible instinct — it removes a decision and rarely produces a bad answer.</p>
<p>It also produces systems that cost several times what they need to and answer more slowly than they need to, because the same expensive model is asked to classify a two-word request and to write a complex document.</p>
<p>The discipline is to ask, at each step, what the <em>least</em> capable model that reliably does this job would be:</p>
<div class="sheet"><div class="h">Matching work to tier</div>
<div class="r"><b>Classify, route, extract</b><span>Cheapest tier. No thinking.</span></div>
<div class="r"><b>Reformat, tidy, translate</b><span>Cheap tier, low effort.</span></div>
<div class="r"><b>Draft from a full brief</b><span>Middle tier, low to medium effort.</span></div>
<div class="r"><b>Summarise long material</b><span>Middle tier, medium effort.</span></div>
<div class="r"><b>Analyse, compare, decide</b><span>Top tier, high effort.</span></div>
<div class="r"><b>Unfamiliar or high-stakes</b><span>Top tier, high effort, and check it.</span></div>
</div>
<p>The habit worth building is switching <em>down</em> for routine work, not only switching up for hard work. Most people set the top tier once and never move it — which is the same as paying maximum on every request regardless of difficulty.</p>
<div class="note">Mission 04 — Inference and serving turns this table from a habit into a mechanism, so the choice is made by the system rather than remembered by a person.</div>`},

{l:"RECALL",t:"Mission 03",h:"What is now owned",b:`<ul>
<li>A <strong>foundation model</strong> is broad and general, built by a few labs; everyone else builds on top.</li>
<li><strong>Pre-training</strong> gives knowledge, <strong>post-training</strong> gives behaviour. Most of the felt difference between models is the second.</li>
<li><strong>Reasoning models</strong> think before answering. Hidden thinking is billed as output, and can be on by default.</li>
<li>Open weights remove the token bill and replace it with operational work and payroll. Their real advantages are <strong>data control</strong> and <strong>independence</strong>.</li>
<li><strong>Fine-tuning teaches behaviour; retrieval supplies facts.</strong> Using either for the other's job fails.</li>
<li>A small specialised model frequently beats a large general one on a narrow task.</li>
<li>Choose in order: data constraint, task breadth, volume, latency. Judge on <strong>cost per completed task</strong>, not benchmark score.</li>
</ul>`}
]},
/* ============ MISSION 04 ============ */
{n:"04",title:"Inference and serving",stage:"Layer 3",
line:"From file to answer. The layer that decides how fast a request comes back and how much it costs — the two numbers a user and a finance director actually feel.",
cards:[

{l:"ORIENT",t:"Layer 3",h:"From file to <em>answer</em>",b:`<p>Mission 02 — Compute and infrastructure supplied machines. Mission 03 — Models and training chose a file. This layer is everything that turns the two into a response arriving in front of a person.</p>
<p>Concretely, a request is small. This is the entire shape of one, stripped to essentials:</p>
<div class="code" data-cap="one request"><pre>
POST https://api.anthropic.com/v1/messages

{
  "model": "claude-sonnet-5",
  "max_tokens": 1024,
  "messages": [
    { "role": "user", "content": "Summarise this contract clause." }
  ]
}
</pre></div>
<p>You are not asking to be trained on. You are not opening a session. You send the entire context, the model reads it and writes a reply, and it is over. The next request starts from nothing.</p>
<div class="note">That statelessness is the single most misunderstood property of the layer. Every appearance of memory or continuity anywhere above this line is built by re-sending things, and Mission 05 — Data, retrieval and protocols is entirely about deciding what gets re-sent.</div>`},

{l:"DEFINE",t:"The vocabulary",h:"Four words used constantly",b:`<p>Four terms cover almost every performance conversation in this layer.</p>
<div class="dt"><table>
<tr><th>Term</th><th>What it measures</th><th>Who feels it</th></tr>
<tr class="hi"><td>TTFT</td><td class="g">Time to first token — the pause before anything appears. This is prefill finishing.</td><td class="g">The user, immediately</td></tr>
<tr><td>TPOT</td><td class="g">Time per output token — the pace of words after that. This is decode running.</td><td class="g">The user, continuously</td></tr>
<tr><td>Latency</td><td class="g">Total time for one complete answer</td><td class="g">The user</td></tr>
<tr><td>Throughput</td><td class="g">Total tokens served per second across everyone at once</td><td class="g">Whoever pays the bill</td></tr>
</table></div>
<p>The distinction that matters: <strong>latency and throughput trade against each other</strong>. Serving many users at once raises throughput and lowers cost per request, while making each individual answer slightly slower. Every tuning decision in this layer is a position on that trade.</p>
<div class="note">A system reported as fast because its throughput is high can still feel slow to every individual using it. Ask which number is being quoted.</div>`},

{l:"DEFINE",t:"Quantization",h:"Storing numbers less <em>precisely</em>",b:`<p><span class="k">Quantization</span> stores each weight in fewer bytes — the precision table from Mission 01 — Before the stack, applied deliberately.</p>
<div class="dt"><table>
<tr><th>Precision</th><th>70B file</th><th>H100s needed</th><th>Quality</th></tr>
<tr><td>FP16</td><td class="n">140 GB</td><td class="n">4 – 8</td><td class="g">Reference</td></tr>
<tr class="hi"><td>INT8 / FP8</td><td class="n">70 GB</td><td class="n">2 – 4</td><td class="g">Loss usually not noticeable</td></tr>
<tr><td>INT4</td><td class="n">35 GB</td><td class="n">1 – 2</td><td class="g">Measurable degradation on hard tasks</td></tr>
</table></div>
<p>Halving the memory can halve the machines, which halves the bill from Mission 02 — Compute and infrastructure. Going further starts to cost quality, and where exactly it starts depends on the model and the task.</p>
<p>Two things follow that are easy to miss:</p>
<ul>
<li>Quantization also makes a model <em>faster</em>, because less data has to be moved between memory and the processor — and movement, not arithmetic, is the usual bottleneck.</li>
<li>It is the mechanism that puts capable models on laptops and phones, which is what makes the edge option in Mission 02 — Compute and infrastructure practical rather than theoretical.</li>
</ul>`},

{l:"LIVE",t:"Serving engines",h:"The software that <em>runs</em> the file",b:`<div class="stamp">Versions current Jun–Aug 2026</div>
<p>Calling a model file directly from a program handles one request at a time and wastes most of the GPU. A <span class="k">serving engine</span> sits in front of it: queueing requests, packing them onto the hardware, managing memory, and exposing an interface an application can call.</p>
<div class="dt"><table>
<tr><th>Engine</th><th>Signature technique</th><th>Choose when</th></tr>
<tr class="hi"><td>vLLM</td><td class="g">PagedAttention — manages the KV cache like an operating system manages memory, so almost nothing is wasted to fragmentation</td><td class="g">Default. Widest hardware support, simplest install</td></tr>
<tr><td>SGLang</td><td class="g">RadixAttention — stores cached prefixes in a tree so requests sharing an opening reuse the computation automatically</td><td class="g">Traffic shares a long system prompt</td></tr>
<tr><td>TensorRT-LLM</td><td class="g">Compiles the model into an engine tuned to one specific NVIDIA card</td><td class="g">One model, pinned, NVIDIA only, throughput is everything</td></tr>
</table></div>
<p>The published benchmark difference is worth reading carefully, because it is a lesson in how to read all such claims. On prefix-heavy traffic with a small model, independent 2026 tests put SGLang around <strong>16,200 tokens/sec</strong> against vLLM's <strong>12,500</strong> — a 29% lead. On unique prompts with nothing shared, the two land within a few percent of each other.</p>
<div class="note">Almost the entire headline gap is one feature meeting one traffic shape. The honest question is never <em>which engine is fastest</em> but <em>does my traffic repeat</em>. Hugging Face's own TGI is now in maintenance mode, with vLLM or SGLang recommended instead.</div>`},

{l:"MECHANISM",t:"Batching and memory",h:"Why several at once is <em>cheaper</em>",b:`<p>Loading weights from memory is expensive; doing arithmetic with them is cheap. Once the weights have been fetched for one request, running four more alongside costs very little extra.</p>
<p>So the engine deliberately serves many requests simultaneously — <span class="k">batching</span>. Modern engines use <em>continuous</em> batching: as soon as one request in the batch finishes, a waiting one takes its place, rather than everyone waiting for the slowest.</p>
<p>The constraint on batch size is the <span class="k">KV cache</span> introduced in Mission 02 — Compute and infrastructure. Every active conversation holds working state in VRAM proportional to its length. Long conversations occupy more memory, so fewer fit at once, so throughput falls and cost per request rises.</p>
<div class="note">This is the mechanical link between context length and money, and it is worth stating plainly because it is felt everywhere above: <strong>long contexts are expensive not only because you pay per input token, but because they crowd out other users on the same machine.</strong></div>`},

{l:"MECHANISM",t:"Caching",h:"Paying once for what <em>repeats</em>",b:`<p>Most production traffic is highly repetitive at the front. The same instructions, the same policy document, the same examples, followed by a short varying question.</p>
<p>Prefill can be skipped for any prefix already processed. The engine keeps the computed state and reuses it. This is <span class="k">prompt caching</span>, and where a provider charges for it, the discount is severe.</p>
<div class="stamp">Rates checked 15–17 Aug 2026</div>
<div class="dt"><table>
<tr><th>Token type</th><th>Charged at</th></tr>
<tr class="hi"><td>Cache read</td><td class="n">0.1x the normal input rate</td></tr>
<tr><td>Cache write, 5-minute life</td><td class="n">1.25x input</td></tr>
<tr><td>Cache write, 1-hour life</td><td class="n">2x input</td></tr>
</table></div>
<p>Ninety percent off the repeated part of every request is not a micro-optimisation. It changes which architectures are affordable.</p>
<p>In an API this is marked explicitly — everything above the marker is cached, everything below varies:</p>
<div class="code" data-cap="prompt caching"><pre>
"system": [
  { "type": "text",
    "text": "<the 20,000-token policy manual>",
    "cache_control": { "type": "ephemeral" } }
],
"messages": [
  { "role": "user", "content": "Does clause 14 apply here?" }
]
</pre></div>
<p>The same mechanism appears in consumer products under different names. In Claude, material placed in a project's knowledge base is cached and reused across chats, while the identical file attached to each new conversation is reprocessed every time. Same file, same questions, different bill.</p>
<div class="note">The design rule that falls out of this: <strong>put the stable material first and the variable material last.</strong> A prompt ordered the other way around is uncacheable, and nothing else you do will recover the difference.</div>`},

{l:"MECHANISM",t:"Speculative decoding",h:"Guess ahead, then verify",b:`<p>Decode is slow because each token waits for the one before it. Speculative decoding attacks exactly that.</p>
<div class="flow">
<div class="n"><b>1 — Draft</b>A small, fast model proposes the next several tokens at once.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Verify</b>The large model checks the whole run in a single pass, which it can do in parallel because all the tokens are already known.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Keep or discard</b>Correct guesses are kept. The first wrong one and everything after it is thrown away.</div>
</div>
<p>Because ordinary language is highly predictable, the small model is right most of the time, and several tokens arrive for the price of one verification step.</p>
<div class="note">The output is identical to what the large model would have produced alone — this buys speed, not a different answer. It is the clearest illustration of the principle running through this layer: the arithmetic is fixed, but when and in what order it happens is a design choice worth real money.</div>`},

{l:"MECHANISM",t:"Routing",h:"Not every request needs the expensive model",b:`<p>Mission 03 — Models and training ended with a habit: match the model to the difficulty. A <span class="k">router</span> makes that a mechanism, so it happens on every request without anyone remembering to.</p>
<div class="flow">
<div class="n"><b>Classify</b>A tiny, cheap model or a simple rule judges the incoming request: routine or hard?</div>
<div class="a">&#8595;</div>
<div class="n"><b>Route</b>Routine goes to the cheap tier. Hard goes to the frontier tier.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Escalate</b>If the cheap answer fails a check, retry on the expensive model. This shape is called a <span class="k">cascade</span>.</div>
</div>
<p>The economics are not subtle. Using the price table from Mission 01 — Before the stack: at 200M input and 40M output tokens a month, a top tier costs around $2,000 and the cheapest around $88. If 70% of traffic is routine, routing that portion down saves most of the bill while leaving the hard 30% untouched.</p>
<div class="note">The cost of routing is a second thing that can be wrong, and a second thing to monitor. It is worth it above a certain volume and pure overhead below it — which is itself a decision, and one Mission 08 — Governance and observability expects to see measured rather than assumed.</div>`},

{l:"LIVE",t:"The four discounts",h:"How the bill is actually <em>cut</em>",b:`<div class="stamp">Terms checked 15–17 Aug 2026</div>
<p>Headline per-token rates are the starting point, not the price. Four modifiers move it, and all four are decisions rather than negotiations.</p>
<div class="dt"><table>
<tr><th>Lever</th><th>Effect</th><th>Cost of using it</th></tr>
<tr class="hi"><td>Prompt caching</td><td class="n">Up to −90% on repeated input</td><td class="g">Prompt must be ordered stable-first</td></tr>
<tr class="hi"><td>Batch API</td><td class="n">−50% across the board</td><td class="g">Results within hours, not seconds</td></tr>
<tr><td>Tier routing</td><td class="n">−60% to −95%</td><td class="g">A classifier to build and watch</td></tr>
<tr><td>Long-context surcharge</td><td class="n">Avoid a 2x input penalty</td><td class="g">Keep prompts under the threshold</td></tr>
</table></div>
<p>That last row is the one that surprises people, because it is a penalty rather than a discount. Several providers meter long prompts differently above a threshold: OpenAI bills requests above 272K input tokens at 2x input and 1.5x output <em>for the entire request</em>, and Google's Pro tier roughly doubles input above 200K tokens.</p>
<p>The practical consequence is sharp. A prompt that crosses the line does not cost slightly more — the whole request reprices. Sending 280K tokens can cost more than sending 260K twice.</p>
<div class="note">Combining the first two is where the real money is. Batch plus caching on a repetitive overnight workload takes a $2,000 monthly bill towards $200, with no change to the model and no change to the answers.</div>`},

{l:"PICTURE",t:"The path",h:"What one request touches",b:`<div class="dg"><div class="dg-t">Question in, answer out</div>
<div class="flow">
