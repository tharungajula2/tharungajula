main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
