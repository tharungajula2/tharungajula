<script>
const MISSIONS = [
{n:'01', title:'The Instrument', stage:0,
 sub:'Python is not the subject. It is the instrument a credit risk function plays. This mission sets out what the function actually asks of it, the six shapes the work takes, and the one sentence every card after this one serves.',
 covers:['What the discipline actually pays for','Six archetypes behind a hundred titles','Where the marginal hour pays best','The notebook ceiling','The three-gear ramp'],
 cards:[

{label:'ORIENT', tag:'The sentence', title:'One sentence, five survivals', stage:1, html:`
<p class="kicker">Every role that pairs credit risk with Python is asking the same question in a different costume.</p>
<p>Take credit data, turn it into a defensible risk number, and make that process survive five things: <b>an auditor</b>, <b>a regulator</b>, <b>a production incident</b>, <b>a change in the population</b>, and <b>the analyst who inherits the code in eighteen months</b>.</p>
<p>Fitting a logistic regression satisfies none of the five. That is the gap this pack closes. A model that scores well and cannot be reproduced is not a model — it is a result, and results expire.</p>
<div class="note"><div class="lab">The distinction that runs through the pack</div>
<p>A notebook produces <b>an answer</b>. A system produces <b>the same answer tomorrow</b>, and can prove which data and which code produced it. Credit risk is regulated precisely because the second thing is the one that matters.</p></div>` },

{label:'MECHANISM', tag:'The six shapes', title:'Six archetypes, a hundred titles', stage:1, html:`
<p>Job titles in credit risk are close to meaningless. Risk Analyst at one lender is Quantitative Analytics Associate at the next and Decision Scientist at a fintech. The work decodes by responsibility, not by title, and it collapses into six shapes.</p>
<table>
<tr><th>Shape</th><th>What Python is for</th></tr>
<tr><td><b>Analyst / MIS</b></td><td>Pull, aggregate, chart, explain the portfolio</td></tr>
<tr><td><b>Modeller</b></td><td>Build PD, LGD, EAD; binning, scorecards, calibration</td></tr>
<tr><td><b>Validator</b></td><td>Re-implement and attack somebody else's model</td></tr>
<tr><td><b>Risk data engineer</b></td><td>Pipelines, feature tables, quality gates, scale</td></tr>
<tr><td><b>Strategy scientist</b></td><td>Cutoffs, champion and challenger, swap sets</td></tr>
<tr><td><b>Platform engineer</b></td><td>Ship the decisioning engine and keep it up</td></tr>
</table>
<p>The three walls of a real risk function are <b>building</b> models, <b>challenging</b> models and <b>shipping</b> models. Every one of the six sits against one of those walls.</p>` },

{label:'MECHANISM', tag:'Translation', title:'What the words mean', stage:1, html:`
<p>Role descriptions are written by one person from notes taken off another. A translation layer helps.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Strong Python<em>pandas, and a five-million-row groupby that does not fall over</em></span></li>
<li><span class="k">02</span><span class="v">Statistical modelling<em>Logistic regression whose coefficients can be explained to an underwriter</em></span></li>
<li><span class="k">03</span><span class="v">SAS to Python migration<em>Ten years of legacy code and a team that is quietly frightened of it</em></span></li>
<li><span class="k">04</span><span class="v">Automation of existing processes<em>A spreadsheet is a single point of failure and everyone knows it</em></span></li>
<li><span class="k">05</span><span class="v">End-to-end ownership<em>There is no data engineer</em></span></li>
<li><span class="k">06</span><span class="v">Model monitoring<em>Stability indices, in a pack, on a deadline, every quarter</em></span></li>
</ul>
<div class="note"><div class="lab">The two-word tell</div>
<p>Where <b>migration</b>, <b>automation</b> or <b>legacy</b> appear, the real pain is not modelling sophistication. It is that the process is fragile and manual. Reproducibility and pipeline design are worth more there than any gradient booster.</p></div>` },

{label:'NUMBERS', tag:'Where the hour goes', title:'The honest weighting', stage:1, html:`
<p>Across all six shapes, the marginal hour of practice pays out unevenly. This is the split that holds.</p>
<table>
<tr><th>Capability</th><th>Weight</th></tr>
<tr><td><b>pandas fluency and data quality instinct</b></td><td class="num-cell">35%</td></tr>
<tr><td><b>The metric library</b> — evidence, discrimination, stability</td><td class="num-cell">25%</td></tr>
<tr><td><b>Code another human can run next year</b></td><td class="num-cell">20%</td></tr>
<tr><td>Modelling depth</td><td class="num-cell">12%</td></tr>
<tr><td>Deployment</td><td class="num-cell">8%</td></tr>
</table>
<p>Modelling depth sits fourth. That ordering surprises people arriving from general machine learning, where it would sit first. In a regulated function the model is the smallest defensible part of the work — everything around it is what makes it usable.</p>` },

{label:'TRAP', tag:'The ceiling', title:'The notebook ceiling', stage:1, html:`
<p class="kicker">The most common career plateau in credit risk analytics is total comfort inside a notebook and total helplessness outside one.</p>
<div class="warn"><div class="lab">How it presents</div>
<p>Everything works, on one machine, in one session, in a specific cell order. Nobody else can run it. Re-running it next month produces a different number and no one can say why. The work is real; the artefact is not transferable.</p></div>
<p>An analyst who can only work in notebooks tops out at analysis and modelling. One who can turn a notebook into a module, a module into a package and a package into a scheduled job moves into engineering and platform work.</p>
<p>The boundary is not intelligence and it is not modelling ability. It is a set of habits — structure, configuration, tests, seeds — that take a fortnight to learn and are never taught, because the people who need them are busy producing answers.</p>` },

{label:'MECHANISM', tag:'The ramp', title:'Zero, hero, god mode', stage:1, html:`
<p>The pack runs a three-level ramp, and the colour spine of every card follows it.</p>
<div class="ramp">
  <div class="a"><div class="t">Zero</div><div class="d">Survive the codebase. Read it, run it, not break it.</div></div>
  <div class="b"><div class="t">Hero</div><div class="d">Build the evidence, the metrics, the model. Be relied on.</div></div>
  <div class="c"><div class="t">God mode</div><div class="d">Architect it, defend it, ship it, watch it.</div></div>
</div>
<p>Missions 02 to 04 are the first level. Missions 05 to 08 are the second. Missions 09 and 10 are the third. The levels are cumulative and the order is not optional: nobody defends a model they cannot reproduce, and nobody reproduces a pipeline they cannot read.</p>
<p class="small">Every card is self-contained. Terms are defined where they first appear, and no card assumes another has been read.</p>` },

{label:'WORKED', tag:'The reference build', title:'The system behind the examples', stage:1, html:`
<p>Where a card needs a real number rather than an illustrative one, it draws on a retail credit risk system I built end to end: <b>466,285 consumer loan originations</b>, of which <b>50,968</b> ever defaulted and <b>16,018</b> defaulted inside a twelve-month performance window.</p>
<p>That system runs the full chain — target engineering, temporal splitting, evidence-weighted binning, a probability-of-default scorecard scaled to points, loss and exposure models, provisioning, validation, and a scoring service in a container.</p>
<div class="note"><div class="lab">Nothing here depends on it</div>
<p>The build supplies worked numbers, not prerequisites. Every mechanism in this pack is explained from zero and stands without it. Where a card leans on the build, it says so.</p></div>` },

{label:'THE HARD QUESTION', tag:'Depth', title:'Is this just data analysis with a finance label?', stage:1, html:`
<p>It is a fair challenge and it deserves a real answer rather than a defensive one.</p>
<p>Three properties separate credit risk work from general analytics, and all three change the code.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">The outcome arrives late<em>Whether today's model is good is unknowable for twelve to eighteen months. Everything else in analytics has a feedback loop; this does not.</em></span></li>
<li><span class="k">02</span><span class="v">The sample is censored by the decision<em>Repayment is only observed on applicants who were approved. The training data is produced by the thing being modelled.</em></span></li>
<li><span class="k">03</span><span class="v">The output is legally consequential<em>A declined applicant is owed a specific reason. A provision figure lands in audited accounts. Neither tolerates a black box.</em></span></li>
</ul>
<p>Any one of those would change the engineering. Together they produce a discipline where reproducibility outranks accuracy, and where a worse model that can be explained routinely beats a better one that cannot.</p>` },

{label:'CLOSE', tag:'01 / 10', title:'Now owned', stage:1, html:`
<ul class="own">
<li>The one sentence: data to defensible number, surviving five things</li>
<li>The six shapes, and the three walls they sit against</li>
<li>Where the marginal hour pays — and why modelling depth is fourth</li>
<li>The notebook ceiling, and what crosses it</li>
<li>The three properties that make credit risk unlike general analytics</li>
</ul>
<div class="next">
<div class="lab">Mission 02 unlocks</div>
<div class="ttl">The Subset</div>
<p>Not all of Python — a specific, unusually sharp slice of it. Absence versus zero versus sentinel, the structures that carry the job, money that reconciles, and the four dates that cause every leakage bug in the discipline.</p>
</div>` }

]},
{n:'02', title:'The Subset', stage:1,
 sub:'Credit risk does not need all of Python. It needs a specific, unusually sharp slice of it, and it needs that slice to be exact — because the failures here are silent, plausible and expensive.',
 covers:['Absence, zero and sentinel are three things','The structures that carry the job','Policy is configuration, never code','Money that reconciles to a ledger','The four dates, and the leakage between them'],
 cards:[

{label:'ORIENT', tag:'Three kinds of nothing', title:'None is not zero is not minus one', stage:1, html:`
<p class="kicker">Bureau data contains three different kinds of nothing, and conflating them is a classic production defect.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Missing<em>The attribute was not returned. Absence of information.</em></span></li>
<li><span class="k">02</span><span class="v">Zero<em>The attribute was measured and its value is nought. Zero enquiries, zero balance.</em></span></li>
<li><span class="k">03</span><span class="v">Sentinel<em>A reserved code with bureau-specific meaning. Minus one and nought commonly signal a borrower new to credit, or a file too thin to score.</em></span></li>
</ul>
<div class="warn"><div class="lab">What the naive fix does</div>
<p>Filling every missing value with zero across a bureau file tells the model that thin-file applicants have <b>perfect credit behaviour</b> — no enquiries, no overdue, no delinquency. Those applicants are then scored as low risk. This has produced real losses at real lenders.</p></div>` },

{label:'MECHANISM', tag:'Decode, do not fill', title:'Sentinels decoded per column', stage:2, html:`
<p>The correct treatment is explicit, documented and column-specific. Sentinels become missing, and the fact of the sentinel is retained as its own field.</p>
<pre class="code"><i># reserved codes differ per attribute — read the data dictionary</i>
SENTINELS = {
    <u>"bureau_score"</u>:        [-1, 0],
    <u>"months_since_delinq"</u>: [-1, 999],
}

<b>def</b> decode_sentinels(series, col):
    codes = SENTINELS.get(col, [])
    flag  = series.isin(codes)
    clean = series.mask(flag)         <i># sentinel becomes missing</i>
    <b>return</b> clean, flag.astype("int8")</pre>
<div class="good"><div class="lab">The flag is a characteristic</div>
<p>In credit risk the fact that data is missing is itself predictive. Thin-file borrowers default differently from established ones. The missingness indicator is not diagnostic scaffolding to be discarded — it is an input, and the binning in Mission 06 will price it.</p></div>` },

{label:'MECHANISM', tag:'Four structures', title:'What the job is actually built from', stage:3, html:`
<p>Four built-in structures carry almost all credit work.</p>
<table>
<tr><th>Structure</th><th>Carries</th><th>Property</th></tr>
<tr><td><b>list</b></td><td>Ordered collections, characteristic names</td><td>Mutable, ordered</td></tr>
<tr><td><b>dict</b></td><td>Lookups, configuration, evidence maps, payloads</td><td>Key to value, fast</td></tr>
<tr><td><b>set</b></td><td>Membership, deduplication, column differences</td><td>Unique, fast tests</td></tr>
<tr><td><b>tuple</b></td><td>Fixed records, returns, keys</td><td>Immutable</td></tr>
</table>
<p>Set arithmetic delivers the cheapest defect prevention in the discipline: a schema difference computed before anything else runs.</p>
<pre class="code">expected = {"bureau_score", "income", "dti", "enquiries_6m"}
actual   = set(df.columns)

missing = expected - actual   <i># declared but absent — stop</i>
extra   = actual - expected   <i># present but undeclared — investigate</i>

<b>if</b> missing:
    <b>raise</b> ValueError(f"contract violation: {sorted(missing)}")</pre>
<p>Upstream teams rename and drop columns without notice. Three lines of set arithmetic stop a silently wrong month-end run.</p>` },

{label:'TRAP', tag:'Policy in code', title:'The number that cannot be dated', stage:2, html:`
<p class="kicker">The moment a policy value appears inline in a function body, the system becomes unauditable.</p>
<pre class="code"><i># unauditable — which cutoff was live on 14 March?</i>
<b>if</b> score &gt;= 680 <b>and</b> dti &lt;= 0.50:
    decision = "APPROVE"</pre>
<p>Credit policy changes monthly. When a regulator asks which cutoff was live on a given date, the answer must come from a versioned, effective-dated configuration file — not from reading the history of a Python function and hoping the deployment dates line up.</p>
<pre class="code"><i># policy.yaml, versioned, effective-dated</i>
PERSONAL_LOAN:
  min_score: 680
  max_dti:   0.50
  min_age:   21</pre>
<div class="warn"><div class="lab">The rule, stated plainly</div>
<p>No number chosen by a human belongs in a source file. Cutoffs, bin counts, thresholds, scaling parameters, scenario weights — all configuration, all versioned, all dated.</p></div>` },

{label:'MECHANISM', tag:'Contracts', title:'A function signature is a contract', stage:3, html:`
<pre class="code"><b>def</b> calculate_dti(
    monthly_debt: float,
    monthly_income: float,
    *,
    include_new_emi: float | None = None,
) -&gt; float:
    <i>"""Debt to income. Returns a decimal fraction: 0.42 is 42 per cent.</i>
<i>    Raises when income is non-positive — never returns infinity."""</i>
    <b>if</b> monthly_income &lt;= 0:
        <b>raise</b> ValueError("monthly_income must be positive")
    <b>return</b> (monthly_debt + (include_new_emi <b>or</b> 0.0)) / monthly_income</pre>
<p>Four things make this professional rather than merely working, and each is a scored item in a code review.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Type hints<em>Machine-checkable documentation that does not drift from the code</em></span></li>
<li><span class="k">02</span><span class="v">Keyword-only arguments<em>The bare asterisk forces naming at the call site, so three floats cannot be passed in the wrong order</em></span></li>
<li><span class="k">03</span><span class="v">Units in the docstring<em>Ambiguous units are a leading source of credit defects</em></span></li>
<li><span class="k">04</span><span class="v">Loud failure<em>A crashed job is fixed on Tuesday. A silently infinite ratio is lent against.</em></span></li>
</ul>` },

{label:'TRAP', tag:'Units', title:'The bug that never raises', stage:2, html:`
<p>An annual income passed into a function expecting a monthly one does not error. It produces a debt-to-income ratio twelve times too low, approves a population that should have been declined, and is discovered a year later in a loss review.</p>
<div class="warn"><div class="lab">Why this class of bug survives</div>
<p>Every intermediate value remains plausible. Nothing is negative, nothing is infinite, nothing exceeds a sane range. The pipeline runs green. Only the decisions are wrong.</p></div>
<p>Three defences, applied together:</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Encode units in the name<em>income_monthly_inr, not income</em></span></li>
<li><span class="k">02</span><span class="v">Range-validate on ingest<em>A monthly income of 3,600,000 fails a plausibility gate; the same figure as an annual does not</em></span></li>
<li><span class="k">03</span><span class="v">Test the boundary<em>One assertion pinning a known input to a known ratio</em></span></li>
</ul>` },

{label:'MECHANISM', tag:'Graded failure', title:'Three tiers, not one', stage:2, html:`
<p>Credit systems must fail in a graded way. Treating everything as fatal is as damaging as treating nothing as fatal.</p>
<table>
<tr><th>Tier</th><th>Example</th><th>Response</th></tr>
<tr><td><b>Fatal</b></td><td>Target column absent; 40% of rows lost in a join</td><td>Stop. Produce no numbers.</td></tr>
<tr><td><b>Degrade</b></td><td>Bureau call times out on one applicant</td><td>Fall back to policy rules, flag for referral</td></tr>
<tr><td><b>Outcome</b></td><td>Applicant is 19, minimum age is 21</td><td>Not an error — a decision with a reason</td></tr>
</table>
<pre class="code"><b>class</b> CreditRiskError(Exception): ...
<b>class</b> DataQualityError(CreditRiskError): ...   <i># halt the batch</i>
<b>class</b> PolicyViolation(CreditRiskError): ...    <i># a business outcome</i>
<b>class</b> ModelUnavailable(CreditRiskError): ...   <i># degrade and page</i></pre>
<div class="warn"><div class="lab">The silent swallow</div>
<p>A bare exception handler that passes is the single most effective way to hide a credit defect for months. Inside a scoring loop it can score a slice of the book with default values, at full confidence, with no trace in any log.</p></div>` },

{label:'NUMBERS', tag:'Money', title:'Model in float, report in decimal', stage:2, html:`
<p>Binary floating point cannot represent most decimal fractions exactly. Adding a tenth to two tenths does not give three tenths.</p>
<p>For modelling — probabilities, ratios, evidence weights — floating point is correct and fast. For anything that reconciles to a ledger, it is not.</p>
<pre class="code"><b>from</b> decimal <b>import</b> Decimal, ROUND_HALF_UP

<b>def</b> to_money(x, places="0.01"):
    <b>return</b> Decimal(str(x)).quantize(
        Decimal(places), rounding=ROUND_HALF_UP)</pre>
<div class="warn"><div class="lab">Why it matters at scale</div>
<p>One paisa or one cent of discrepancy per account, across four million accounts, is a finance team that will not sign off the provision. Provision figures land in audited financial statements; they must reconcile exactly, not approximately.</p></div>` },

{label:'TRAP', tag:'Dates', title:'Four dates, and the leakage between them', stage:2, html:`
<p class="kicker">Credit risk is a time-indexed discipline. Every account carries four distinct dates, and confusing any two of them causes leakage.</p>
<table>
<tr><th>Date</th><th>Meaning</th><th>Confusion causes</th></tr>
<tr><td><b>Application</b></td><td>When applied</td><td>—</td></tr>
<tr><td><b>Origination</b></td><td>When disbursed — the cohort anchor</td><td>Wrong cohorts</td></tr>
<tr><td><b>Observation</b></td><td>The point characteristics are measured as of</td><td><b>Target leakage</b></td></tr>
<tr><td><b>Performance end</b></td><td>Observation plus the window</td><td>Immature accounts labelled good</td></tr>
</table>
<div class="warn"><div class="lab">Always pass the format</div>
<p>Letting a parser infer date formats is slow and ambiguous. The third of April and the fourth of March are written identically in different conventions. A silently misparsed date column shuffles origination cohorts and quietly destroys an out-of-time split — with no error anywhere.</p></div>` },

{label:'ORIENT', tag:'Cohorts', title:'What a vintage is', stage:2, html:`
<p>A <b>vintage</b> is the set of accounts originated in the same period, usually a month or a quarter.</p>
<p>Credit performance is analysed by vintage because loans default on a clock that starts at origination, not on the calendar. A cohort three months old and a cohort two years old cannot be compared on default rate — the young one has not had time to go bad.</p>
<pre class="code">df["vintage"] = df["issue_d"].dt.to_period("M")
df["performance_end"] = df["issue_d"] + pd.DateOffset(months=12)</pre>
<div class="note"><div class="lab">Why this one idea keeps returning</div>
<p>Vintage underpins the maturity filter, the temporal split, the vintage curve, the seasoning correction and the entire monitoring discipline. It is the closest thing the subject has to a founding concept, and it is arithmetic on two dates.</p></div>` },

{label:'THE HARD QUESTION', tag:'Strictness', title:'Is a raise not just a crash with extra steps?', stage:2, html:`
<p>The objection has force. A pipeline that raises on a bad input stops the month-end run, and the month-end run has a deadline attached to it.</p>
<p>The answer is that the alternative is not a smoother run — it is a <b>wrong number with no marker on it</b>.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">A raise is loud, dated and attributable<em>It names the input, the moment and the contract that was broken. Somebody is paged, and the fix is scoped in minutes.</em></span></li>
<li><span class="k">02</span><span class="v">A silent fallback is none of those<em>A default value substituted for a missing one propagates into a score, into a decision, into a provision. It is discovered, if at all, by the party least well placed to explain it.</em></span></li>
</ul>
<div class="note"><div class="lab">The asymmetry that settles it</div>
<p>A halted batch costs hours and embarrassment. A completed batch carrying wrong numbers costs a restatement, an audit finding, and the credibility of every figure the team has published since. The costs are not the same order of magnitude, so the defaults should not be symmetric either.</p></div>` },

{label:'CLOSE', tag:'02 / 10', title:'Now owned', stage:2, html:`
<ul class="own">
<li>Missing, zero and sentinel as three separate things — and the flag as a characteristic</li>
<li>Set arithmetic as a schema gate before anything else runs</li>
<li>Policy as versioned, effective-dated configuration, never as an inline number</li>
<li>Signature as contract: types, keyword-only, units, loud failure</li>
<li>Three-tier failure, and why a silent swallow is the most expensive line in a codebase</li>
<li>Decimal for anything that reconciles; the four dates and the leakage between them</li>
</ul>
<div class="next">
<div class="lab">Mission 03 unlocks</div>
<div class="ttl">The Frame</div>
<p>The data frame as the working surface of the discipline: loading without destroying memory, the audited merge, the vectorisation ladder, and the quality gate that can fail a pipeline before a model ever sees the data.</p>
</div>` }

]},
{n:'03', title:'The Frame', stage:3,
 sub:'The data frame is the working surface of the discipline. This mission covers loading it without destroying memory, joining it without destroying the bad rate, transforming it without destroying the afternoon, and gating it before a model ever sees it.',
 covers:['Reconnaissance before loading','The four decisions in a read','The audited merge','The vectorisation ladder','The gate that can fail a pipeline'],
 cards:[

{label:'ORIENT', tag:'Reconnaissance', title:'A thousand rows first, always', stage:1, html:`
<p class="kicker">No new file is loaded at full size on the first attempt.</p>
<p>A credit warehouse extract carries three hundred columns; a model needs forty. Reading all three hundred with inferred types costs several times the memory for no benefit, and the inference itself is often wrong.</p>
<pre class="code"><b>def</b> profile(path, n=1000):
    s = pd.read_csv(path, nrows=n)
    <b>return</b> pd.DataFrame({
        "dtype":    s.dtypes.astype(str),
        "n_unique": s.nunique(),
        "pct_null": (s.isna().mean() * 100).round(2),
        "sample":   s.iloc[0],
    }).sort_values("pct_null", ascending=<b>False</b>)</pre>
<p>Two minutes of reconnaissance produces the type map, the null profile and the cardinality profile. It replaces a forty-minute out-of-memory spiral, and it usually surfaces at least one column whose contents contradict its name.</p>` },

{label:'MECHANISM', tag:'The read', title:'Four decisions in one call', stage:1, html:`
<pre class="code">DTYPES = {
    "loan_id":       "string",
    "bureau_score":  "float32",   <i># float — must hold missing</i>
    "annual_income": "float64",   <i># money — keep precision</i>
    "grade":         "category",  <i># low cardinality</i>
    "default_12m":   "int8",
}

df = pd.read_csv(path, dtype=DTYPES,
                 usecols=<b>list</b>(DTYPES) + ["issue_d"],
                 parse_dates=["issue_d"], date_format="%b-%Y")</pre>
<ul class="kv">
<li><span class="k">01</span><span class="v">Explicit types<em>Inference costs memory and is sometimes wrong in ways that survive to production</em></span></li>
<li><span class="k">02</span><span class="v">Category for low-cardinality text<em>A grade column on 466,285 rows falls from roughly 30 MB to under 1 MB</em></span></li>
<li><span class="k">03</span><span class="v">Float for scores<em>Integer types cannot hold missing. Typing a bureau score as integer forces an eventual fill, and the fill is the bug from Mission 02.</em></span></li>
<li><span class="k">04</span><span class="v">Only the needed columns<em>Forty of three hundred is roughly a seventh of the memory</em></span></li>
</ul>` },

{label:'TRAP', tag:'Downcasting', title:'Do not shrink money', stage:2, html:`
<p>Reducing numeric width is the standard memory utility on every risk team. Applied indiscriminately, it corrupts balances.</p>
<pre class="code"><b>for</b> col <b>in</b> df.columns:
    s = df[col]
    <b>if</b> pd.api.types.is_integer_dtype(s):
        df[col] = pd.to_numeric(s, downcast="integer")
    <b>elif</b> pd.api.types.is_float_dtype(s):
        df[col] = pd.to_numeric(s, downcast="float")
    <b>elif</b> pd.api.types.is_object_dtype(s) <b>and</b> \\
         s.nunique() / <b>max</b>(<b>len</b>(s), 1) &lt; 0.5:
        df[col] = s.astype("category")</pre>
<div class="warn"><div class="lab">The exclusion that must be explicit</div>
<p>Single-precision float holds roughly seven significant digits. A balance of 12,345,678.90 loses its cents on the way down. Currency columns are excluded from downcasting, or the reconciliation in Mission 09 will never close.</p></div>` },

{label:'TRAP', tag:'Assignment', title:'The write that goes nowhere', stage:3, html:`
<p>Selecting and then assigning in two steps writes to a temporary copy. The original frame is untouched, no error is raised, and the pipeline continues with the old values.</p>
<pre class="code"><i># silently does nothing</i>
df[df.score &gt; 700]["segment"] = "PRIME"

<i># correct — one step, label-based</i>
df.loc[df.score &gt; 700, "segment"] = "PRIME"</pre>
<p>Multi-condition masks carry a second hazard. The bitwise operators are required, because the keyword forms attempt to reduce a whole column to a single truth value. And operator precedence means that omitted brackets change the answer without raising anything.</p>
<pre class="code">approve = (
    (df["bureau_score"] &gt;= 680)
    &amp; (df["dti"] &lt;= 0.50)
    &amp; (df["age"] &gt;= 21)
    &amp; (~df["has_90dpd_24m"])
)</pre>` },

{label:'MECHANISM', tag:'Aggregation', title:'The four grouping patterns', stage:3, html:`
<p>Grouping is the majority of the daily work. Four patterns cover nearly all of it.</p>
<pre class="code"><i># 1 — portfolio summary</i>
df.groupby("grade", observed=<b>True</b>).agg(
    accounts = ("loan_id", "count"),
    bad_rate = ("default_12m", "mean"),
    exposure = ("loan_amnt", "sum"))

<i># 2 — cohort by age: the vintage grid</i>
df.groupby(["vintage", "months_on_book"], observed=<b>True</b>) \\
  ["default_12m"].mean().unstack("months_on_book")

<i># 3 — broadcast a group statistic back to rows</i>
df["vs_grade"] = df["bureau_score"] - df.groupby(
    "grade", observed=<b>True</b>)["bureau_score"].transform("mean")</pre>
<div class="note"><div class="lab">Reduce, broadcast, or fall back</div>
<p><b>agg</b> reduces each group to one row. <b>transform</b> returns the original shape. <b>apply</b> is the flexible fallback and is a row-level loop wearing a costume — on five million rows it is usually where a pipeline's runtime goes to die.</p></div>` },

{label:'TRAP', tag:'Empty combinations', title:'Observed categories only', stage:3, html:`
<p>Grouping on category types emits every declared combination by default, including those that never occur.</p>
<p>Two categorical characteristics of fifty levels each produce two and a half thousand rows, almost all empty, and the bad rates in them are undefined. A summary that should have had forty rows arrives with two thousand five hundred, most of them missing, and any downstream mean is now wrong.</p>
<pre class="code">df.groupby(["grade", "region"], observed=<b>True</b>).agg(...)</pre>
<p>Setting the flag explicitly is the correct default in credit work and keeps the code reading identically regardless of library version.</p>` },

{label:'MECHANISM', tag:'The join', title:'The audited merge', stage:2, html:`
<p class="kicker">The single most damaging silent defect in credit analytics is a bad join.</p>
<p>Application data joins to bureau data joins to performance data joins to collections data. One duplicate key and the bad rate is wrong, with no error message anywhere.</p>
<pre class="code"><b>def</b> audited_merge(left, right, on, how="left",
                  expect="1:1", name=""):
    n = <b>len</b>(left)
    out = left.merge(right, on=on, how=how,
                     validate=expect, indicator=<b>True</b>)
    matched = (out["_merge"] == "both").sum()
    log.info("%s: %d rows, %.1f%% matched",
             name, <b>len</b>(out), 100 * matched / n)
    <b>if</b> how == "left" <b>and</b> <b>len</b>(out) != n:
        <b>raise</b> ValueError("row count changed — duplicate keys")
    <b>return</b> out.drop(columns="_merge")</pre>
<p>Two arguments do the work. Declaring the expected cardinality raises when it is violated. The indicator quantifies the match rate — and a match rate that moves month over month is an upstream incident, not a modelling question.</p>` },

{label:'TRAP', tag:'Keys', title:'Three ways a key fails to match', stage:2, html:`
<table>
<tr><th>Left</th><th>Right</th><th>Matches</th></tr>
<tr><td>ABC123 </td><td>ABC123</td><td>No — trailing space</td></tr>
<tr><td>abc123</td><td>ABC123</td><td>No — case</td></tr>
<tr><td>12345 <i>(integer)</i></td><td>12345 <i>(text)</i></td><td>No — type</td></tr>
</table>
<pre class="code"><b>for</b> d <b>in</b> (left, right):
    d["cust_id"] = (d["cust_id"].astype("string")
                                .str.strip().str.upper())</pre>
<div class="warn"><div class="lab">What a three per cent drop costs</div>
<p>A silent three per cent fall in match rate is roughly a three per cent understatement of measured portfolio risk. It does not raise, it does not look wrong, and it is normally found by an auditor rather than by the team.</p></div>` },

{label:'NUMBERS', tag:'The ladder', title:'Four ways, three orders of magnitude', stage:3, html:`
<p>The same computation, four ways. Timings are indicative on a million rows; the ratios are what hold.</p>
<table>
<tr><th>Approach</th><th>Time</th><th>Verdict</th></tr>
<tr><td>Row iteration</td><td class="num-cell">~120 s</td><td>Never</td></tr>
<tr><td>Element-wise apply</td><td class="num-cell">~4 s</td><td>A loop in costume</td></tr>
<tr><td>Binary condition</td><td class="num-cell">~15 ms</td><td>Correct</td></tr>
<tr><td>Condition ladder</td><td class="num-cell">~25 ms</td><td><b>The credit workhorse</b></td></tr>
</table>
<pre class="code">conditions = [df.pd &lt;= 0.02, df.pd &lt;= 0.05, df.pd &lt;= 0.10]
choices    = ["SUPER_PRIME", "PRIME", "NEAR_PRIME"]
df["band"] = np.select(conditions, choices, default="SUBPRIME")</pre>
<div class="good"><div class="lab">Why the ladder fits this subject</div>
<p>Nearly every credit rule set is a ladder of conditions with a fallback. The condition-ladder form expresses exactly that, evaluates top down with first match winning, stays vectorised, and reads like the policy document it came from.</p></div>` },

{label:'MECHANISM', tag:'The gate', title:'Fail before the model, not after', stage:2, html:`
<p>Before any model touches data, it passes a gate. Written once, reused permanently, run in continuous integration.</p>
<pre class="code"><b>def</b> validate(df, target="default_12m", key="loan_id"):
    r = QualityReport()

    <b>if</b> df[key].duplicated().any():
        r.fail("duplicate primary keys")

    rate = df[target].mean()
    <b>if</b> <b>not</b> <b>set</b>(df[target].dropna().unique()) &lt;= {0, 1}:
        r.fail("target is not binary")
    <b>if</b> <b>not</b> 0.001 &lt; rate &lt; 0.60:
        r.warn(f"bad rate {rate:.2%} implausible")

    RANGES = {"bureau_score": (300, 900), "dti": (0, 10)}
    <b>for</b> col, (lo, hi) <b>in</b> RANGES.items():
        n = ((df[col] &lt; lo) | (df[col] &gt; hi)).sum()
        <b>if</b> n: r.fail(f"{col}: {n} out of range")
    <b>return</b> r</pre>
<p>Persisting the report as an artefact makes month-over-month drift in data quality visible — which is a different and earlier signal than drift in the population.</p>` },

{label:'THE HARD QUESTION', tag:'Gating', title:'Does a gate that halts a batch cause more damage than it prevents?', stage:2, html:`
<p>A month-end run that stops is visible, escalated and awkward. A month-end run that completes with wrong numbers is none of those things, which is precisely the problem.</p>
<p>The honest answer is that the gate must be <b>graded</b>, not binary. Three tiers, matching Mission 02.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Halt<em>Duplicate keys, absent target, a range violation that implies a schema change. The output would be meaningless.</em></span></li>
<li><span class="k">02</span><span class="v">Warn and continue<em>A null rate that has moved but not collapsed; a category not seen before. Recorded, surfaced, not blocking.</em></span></li>
<li><span class="k">03</span><span class="v">Record only<em>Distribution shifts that belong in monitoring rather than in a gate.</em></span></li>
</ul>
<p>A gate that halts on everything is switched off within two months. A gate that halts on nothing was never a gate. The tiering is the whole design, and getting it wrong in either direction ends with the same outcome — no gate at all.</p>` },

{label:'CLOSE', tag:'03 / 10', title:'Now owned', stage:3, html:`
<ul class="own">
<li>Reconnaissance on a thousand rows before any full load</li>
<li>The four decisions in a read, and why scores are float and money is not downcast</li>
<li>Single-step assignment, bracketed masks, observed categories</li>
<li>The audited merge: declared cardinality, match rate, asserted row count</li>
<li>The vectorisation ladder, and the condition ladder as the credit workhorse</li>
<li>A graded quality gate that halts, warns or records — and never halts on everything</li>
</ul>
