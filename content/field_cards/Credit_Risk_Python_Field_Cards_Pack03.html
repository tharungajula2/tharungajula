</div>` }

]},
{n:'10', title:'On Duty', stage:11,
 sub:'The last mission ships the thing and then watches it — and closes the pack with the three surfaces built for recall rather than for reading: the traps, the formulae, and the compression.',
 covers:['Loading once, not per request','Atomic batches, or none','Outcome lag and leading indicators','Every trap in one grid','Every formula on one card','The whole pack in one paragraph'],
 cards:[

{label:'MECHANISM', tag:'The service', title:'Artefacts load once', stage:11, html:`
<pre class="code">@asynccontextmanager
<b>async</b> <b>def</b> lifespan(app):
    ARTEFACTS["woe"]     = joblib.load("artefacts/woe.pkl")
    ARTEFACTS["model"]   = joblib.load("artefacts/pd_model.pkl")
    ARTEFACTS["version"] = read_version()
    ARTEFACTS["policy"]  = load_policy("config/policy.yaml")
    <b>yield</b>
    ARTEFACTS.clear()</pre>
<p>Artefacts are loaded at startup and held in memory. Loading inside a request handler multiplies latency and memory by the request rate, and is the most common cause of a scoring service that performs well in testing and collapses under production load.</p>
<div class="note"><div class="lab">Two endpoints, not one</div>
<p><b>Health</b> means the process is alive — restart it if not. <b>Readiness</b> means artefacts are loaded and traffic can be sent. Conflating them routes applicants to a container that has not finished loading its model, and those applicants receive errors or, worse, a fallback decision they should never have had.</p></div>` },

{label:'MECHANISM', tag:'Concurrency', title:'The synchronous path is the fast path', stage:11, html:`
<p>Asynchronous handlers exist for work that waits on a network — a bureau call, a cache read. Numeric scoring waits on nothing; it occupies a core.</p>
<p>Declaring a synchronous handler lets the framework run it in a worker thread, so heavy array work never blocks the loop that is accepting connections. Wrapping a synchronous prediction in an asynchronous handler serialises the entire service behind it.</p>
<pre class="code"><i># plain def — numeric work, runs off the event loop</i>
@app.post("/v1/score")
<b>def</b> score(req: ScoreRequest) -&gt; ScoreResponse:
    ...</pre>
<div class="warn"><div class="lab">The container setting that pairs with it</div>
<p>Numeric libraries default to spawning threads across every available core. Inside a service handling concurrent requests they oversubscribe and latency becomes erratic. The thread count is pinned to one in the container environment, and parallelism is left to the request layer.</p></div>` },

{label:'TRAP', tag:'Batches', title:'Publish everything, or publish nothing', stage:11, html:`
<p>A month-end run that fails on partition forty-seven of sixty and writes the other fifty-nine produces a book that is roughly three-quarters scored.</p>
<p>Downstream, provisions are computed on a partial portfolio. The figure is wrong, it is plausible, and nothing in the output indicates that a quarter of the accounts are absent.</p>
<pre class="code">out.to_parquet(f"{output_dir}/_staging/{name}")
...
<b>if</b> stats["failed"]:
    <b>raise</b> RuntimeError("batch incomplete — nothing published")
promote_staging(output_dir)      <i># all or nothing</i></pre>
<div class="good"><div class="lab">Staging is the whole mechanism</div>
<p>Every partition writes to a staging location. Only a fully successful run promotes it. A partial batch leaves the previous, complete output in place — which is stale and known to be stale, rather than fresh and quietly incomplete.</p></div>` },

{label:'ORIENT', tag:'The lag', title:'Eighteen months of not knowing', stage:12, html:`
<p class="kicker">Whether today's model is good will not be known for twelve to eighteen months, because that is how long the performance window takes to mature.</p>
<p>This is what makes credit modelling structurally unlike most applied machine learning. There is no fast feedback loop. A model can be deployed, write a full year of business, and only then reveal that it was wrong.</p>
<p>So monitoring watches the <b>leading</b> indicators, because by the time the lagging one moves, the damage is already on the balance sheet.</p>
<table>
<tr><th>Layer</th><th>Watch</th><th>Cadence</th></tr>
<tr><td>Service</td><td>Latency, error rate, throughput</td><td>Real time</td></tr>
<tr><td>Input</td><td>Nulls, unseen categories, ranges</td><td>Daily</td></tr>
<tr><td>Population</td><td>Score and characteristic stability</td><td>Monthly</td></tr>
<tr><td>Decision</td><td>Approval rate, score distribution, overrides</td><td>Daily</td></tr>
<tr><td>Performance</td><td>First-payment default, early delinquency</td><td>Monthly</td></tr>
</table>` },

{label:'MECHANISM', tag:'Versioning', title:'Four axes, plus one', stage:11, html:`
<p>A model version is not the serialised object. Reproducing a decision requires four things, and a fifth that changes on a different clock.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">The artefact<em>The fitted object and its transformers</em></span></li>
<li><span class="k">02</span><span class="v">The code<em>The commit that produced it</em></span></li>
<li><span class="k">03</span><span class="v">The data<em>Hash and snapshot date of the training sample</em></span></li>
<li><span class="k">04</span><span class="v">The configuration<em>Characteristics, bins, scaling parameters</em></span></li>
<li><span class="k">05</span><span class="v">The policy<em>Versioned separately — cutoffs change far more often than models</em></span></li>
</ul>
<div class="note"><div class="lab">Why the fifth is separate</div>
<p>A decision is the product of a model and a policy. Two applicants with identical scores can receive opposite decisions three weeks apart with no model change at all. Recording only the model version makes half of those decisions unexplainable.</p></div>` },

{label:'NUMBERS', tag:'Recall surface I', title:'Every trap in one grid', stage:12, html:`
<table>
<tr><th>Symptom</th><th>Cause</th><th>Fix</th></tr>
<tr><td>Separation above 0.75</td><td>Leakage</td><td>Audit availability at decision time</td></tr>
<tr><td>Separation collapses out of time</td><td>Random split or immature window</td><td>Temporal split, maturity filter</td></tr>
<tr><td>Area near 0.25</td><td>Score direction inverted</td><td>Flip the sign</td></tr>
<tr><td>Bad rate drops after a join</td><td>Unmatched rows dropped</td><td>Left join, declared cardinality</td></tr>
<tr><td>Rows increase on a left join</td><td>Duplicate keys on the right</td><td>Deduplicate or aggregate first</td></tr>
<tr><td>Service scores everyone alike</td><td>Bins recomputed at transform</td><td>Persist edges; test single row</td></tr>
<tr><td>Best applicant scored average</td><td>Closed tail edge</td><td>Open tails to infinity</td></tr>
<tr><td>Infinite evidence value</td><td>Bin with no bads</td><td>Smoothing</td></tr>
<tr><td>Stability always near zero</td><td>Bins recomputed on current data</td><td>Freeze development edges</td></tr>
<tr><td>Probabilities uniformly too high</td><td>Undersampled, uncorrected</td><td>Prior correction</td></tr>
<tr><td>Edits vanish silently</td><td>Two-step assignment</td><td>Single-step label assignment</td></tr>
<tr><td>Wrong coefficient sign</td><td>Correlated inputs</td><td>Variance inflation, drop or combine</td></tr>
<tr><td>Different result each run</td><td>Unseeded generation</td><td>Seed everything; sort before splitting</td></tr>
<tr><td>Translated code disagrees</td><td>Missing, rounding, ties, retention</td><td>Reconciliation harness</td></tr>
<tr><td>Month-end takes six hours</td><td>Row-level apply in the hot path</td><td>Profile, then vectorise</td></tr>
<tr><td>Latency spikes under load</td><td>Model loaded per request</td><td>Load at startup; pin thread count</td></tr>
<tr><td>Provisions will not reconcile</td><td>Float on money</td><td>Decimal for reported figures</td></tr>
<tr><td>Cohorts look shuffled</td><td>Ambiguous date parsing</td><td>Always pass the format</td></tr>
<tr><td>Approval rate jumps overnight</td><td>Upstream default or policy change</td><td>Diff inputs and policy version first</td></tr>
</table>` },

{label:'NUMBERS', tag:'Recall surface II', title:'Every formula on one card', stage:12, html:`
<pre class="code"><u>EVIDENCE</u>
woe = ln( dist_good / dist_bad )      <i>per bin</i>
iv  = Σ ( dist_good − dist_bad ) × woe

<i>bands: &lt;.02 drop | .02–.1 weak | .1–.3 medium</i>
<i>       .3–.5 strong | &gt;.5 leakage suspect</i>

<u>SEPARATION</u>
gini = 2 × auc − 1
separation = max | cum_bad(s) − cum_good(s) |

<i>gini: &lt;.30 weak | .40–.60 good | &gt;.75 suspect</i>

<u>STABILITY</u>
index = Σ ( actual − expected ) × ln( actual / expected )

<i>&lt;.10 stable | .10–.25 investigate | &gt;.25 major</i>
<i>bins frozen from development, always</i>

<u>SCALING</u>
factor = pdo / ln 2
offset = target_score − factor × ln( target_odds )
score  = offset − factor × ln( p / (1 − p) )

<u>LOSS</u>
expected_loss = pd × lgd × ead × discount
ead = drawn + ccf × ( limit − drawn )
lgd = 1 − ( discounted_recoveries − costs ) / ead

<u>CORRECTION</u>
adj = ln[ (s/(1−s)) ÷ (q/(1−q)) ]      <i>s sample, q population</i>
log_odds_corrected = log_odds − adj</pre>` },

{label:'ORIENT', tag:'Recall surface III', title:'The compression', stage:12, html:`
<p class="kicker">The whole pack, in one paragraph, for the moment when there is no time to read anything else.</p>
<div class="note"><div class="lab">The compression</div>
<p>Anyone can fit a logistic regression. What a credit risk function pays for is someone who can <b>define the target</b> correctly, <b>split it in time</b>, <b>transform characteristics</b> so the model is both predictive and defensible, prove it <b>separates</b> and is <b>calibrated</b>, show which <b>population shift</b> would break it, <b>ship</b> it so it returns the same number tomorrow as today, tell a declined applicant <b>exactly why</b>, and hand the whole thing to a validator with its <b>weaknesses already written down</b>.</p></div>
<p>Python is the instrument. Everything above is the technique.</p>
<p class="small">Eight verbs. Each one is a mission in this pack, and each one is a place where a competent analyst and a trusted one diverge.</p>` },

{label:'THE HARD QUESTION', tag:'Closing', title:'Where does a credit model actually earn its keep?', stage:12, html:`
<p>A better model does not automatically produce a better outcome, and pretending otherwise is the fastest way to lose a room.</p>
<p>Three points of separation change nothing on its own. The lift has to land somewhere, and it lands in four places.</p>
<ul class="kv">
<li><span class="k">01</span><span class="v">Selection<em>At the same approval rate, a better model swaps in good accounts and swaps out bad ones. That is the swap-set analysis, and it is what a committee asks for — not the headline statistic.</em></span></li>
<li><span class="k">02</span><span class="v">Pricing<em>Better-ordered risk supports finer risk-based pricing, which converts separation into margin rather than into volume</em></span></li>
<li><span class="k">03</span><span class="v">Provisioning<em>Calibration, not separation, drives the expected-loss figure — and that figure is in the accounts</em></span></li>
<li><span class="k">04</span><span class="v">Collections<em>Prioritisation has a fraction of the governance burden and the fastest feedback loop in the discipline</em></span></li>
</ul>
<p>Naming where the lift lands — rather than quoting the statistic and stopping — is the difference between presenting a model and proposing a decision.</p>` },

{label:'CLOSE', tag:'10 / 10', title:'Pack complete', stage:12, html:`
<ul class="own">
<li>Artefacts loaded once, health and readiness separated, the numeric path left synchronous</li>
<li>Batches staged and promoted atomically, never published in part</li>
<li>The outcome lag, and the leading indicators that stand in for it</li>

const rail=document.getElementById('rail');
rail.innerHTML=Array.from({length:RAIL_N},()=>'<span></span>').join('');
const ticks=[...rail.children];

/* ---------- index: missions only ---------- */
const idx=document.getElementById('idx'), idxList=document.getElementById('idxList');
const anchors=[];
FLAT.forEach((c,i)=>{ if(c.kind==='packcover'||c.kind==='mcover') anchors.push({i,c}); });
idxList.innerHTML=anchors.map(a=>`<li data-go="${a.i}">
  <span class="n">${a.c.kind==='packcover'?'00':a.c.mission}</span>
  <span class="t">${a.c.title}${a.c.kind==='mcover'?`<em>Mission ${a.c.mission}</em>`:'<em>Pack cover</em>'}</span>
</li>`).join('');
idxList.addEventListener('click',e=>{const li=e.target.closest('li'); if(!li)return;
  idx.classList.remove('open');
  deck.children[+li.dataset.go].scrollIntoView({behavior:'smooth'});});
document.getElementById('counter').onclick=()=>idx.classList.add('open');
document.getElementById('idxClose').onclick=()=>idx.classList.remove('open');

/* ---------- observer ---------- */
const counter=document.getElementById('counter'), bar=document.getElementById('bar');
let current=0;
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.intersectionRatio<0.55) return;
  current=+e.target.dataset.i;
  const m=e.target.dataset.m;
  counter.textContent = m ? `M${m} · ${String(current+1).padStart(3,'0')}` : String(current+1).padStart(3,'0');
  bar.style.width=((current+1)/FLAT.length*100)+'%';
  const st=+e.target.dataset.stage;
  ticks.forEach((t,k)=>{
    t.className = (st && k===st-1) ? 'on' : ((st && k<st-1) ? 'past' : '');
  });
});},{threshold:[0.55]});
[...deck.children].forEach(s=>io.observe(s));

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){
    e.preventDefault(); deck.children[Math.min(current+1,FLAT.length-1)].scrollIntoView({behavior:'smooth'});
  }
  if(e.key==='ArrowUp'||e.key==='PageUp'){
    e.preventDefault(); deck.children[Math.max(current-1,0)].scrollIntoView({behavior:'smooth'});
  }
  if(e.key==='Escape') idx.classList.remove('open');
});
</script>
</body>
</html>
