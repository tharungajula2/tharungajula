<div><b>What it does not solve</b>A container is built from a recipe file. If that recipe says "install the latest version", two builds a month apart produce two different containers.</div></div>
<div class="note">Containers make the environment portable. They do not, on their own, make it reproducible. Those are two different guarantees, and they are constantly confused.</div>`},

{l:"DEFINE",t:"The alternatives",h:"Nix, Flox, and an honest note",b:`<p><span class="k">Nix</span> is a package management system built on a stricter promise: an environment is described exhaustively in code, down to exact versions, and rebuilt identically from that description every time. <strong>Flox</strong> is a commercial product built on Nix, aimed at making it easier to adopt and share across a team.</p>
<p>Approaches worth knowing, each with a different trade-off between rigour and convenience:</p>
<ul>
<li><strong>Docker</strong> — near-universal, portable, reproducible only if the recipe is written with discipline</li>
<li><strong>Nix</strong> — the strongest reproducibility guarantee available, and a genuinely steep learning curve</li>
<li><strong>Lock files</strong> — the lighter, more common approach: pin every library to an exact version and commit that list</li>
</ul>
<div class="note"><strong>Honest note on the source.</strong> The video this pack draws its structure from carried a paid sponsorship from Flox, and the reproducibility section doubles as its advertisement. The <em>problem</em> is entirely real and independently well documented. The endorsement of one product is not evidence. Treat the problem as established and the tool as an open question.</div>`},

{l:"TRAP",t:"The overlooked layer",h:"Why this is skipped",b:`<p>Reproducibility is skipped for a rational-sounding reason: it fixes a problem that has not happened yet, and there is always something more urgent.</p>
<p>The cost is not paid at once. It is paid in small instalments, spread over months, and never attributed to its cause — the afternoon lost to a failure that only occurs in CI, the model behaving differently in production, the new colleague who takes three days to get the system running at all, the security patch that requires visiting machines one by one because nobody knows which versions are where.</p>
<div class="note">If every machine runs a different environment, then every layer above it can behave differently even when the code is character-for-character identical. That is what makes this the foundation rather than the afterthought.</div>`},

{l:"RECALL",t:"Mission 09",h:"What is now owned",b:`<ul>
<li>An <strong>environment</strong> is everything around the code that the code depends on.</li>
<li>Software crosses four stages: <strong>development, CI, build, production</strong> — four separate machines.</li>
<li>Environments diverge silently, and usually nobody made a mistake.</li>
<li>The environment a model was trained in is typically never recorded.</li>
<li>The fix is one versioned definition, with every stage built from it.</li>
<li><strong>Docker</strong> packages an environment into a portable container — portable is not the same as reproducible.</li>
<li><strong>Nix</strong> offers the strongest guarantee at the highest learning cost; lock files are the common middle ground.</li>
</ul>`}
]},

/* ============ MISSION 10 ============ */
{n:"10",title:"The whole map",stage:"Recall",
bullets:["The full stack in one view","One line per layer","Every trap in the pack, gathered","The complete glossary"],
cards:[
{l:"PICTURE",t:"The map",h:"Everything, at once",b:`<div class="dg"><div class="dg-t">The AI stack, 2026</div>
<div class="lay">
<div><span>1</span>Compute — GPUs, CUDA, cloud / on-prem / edge</div>
<div><span>2</span>Models — foundation, open-weight, fine-tuned</div>
<div><span>3</span>Serving — quantization, batching, routing</div>
<div><span>4</span>Data — embeddings, RAG, context engineering, MCP</div>
<div><span>5</span>Orchestration — tools, workflows, agents, review</div>
<div><span>6</span>Applications — general and vertical</div>
</div>
<div class="cross">Governance &amp; observability &nbsp;·&nbsp; logs, guardrails, evals</div>
<div class="cross">Reproducibility &nbsp;·&nbsp; one environment definition</div>
</div>
<p>This is the same diagram as Mission 01. Every word in it should now carry weight.</p>`},

{l:"RECALL",t:"Compression",h:"One line per layer",b:`<table>
<tr><td>Compute</td><td>Decides what can be run at all, and at what scale</td></tr>
<tr><td>Models</td><td>Offers the choices — and the biggest is rarely the right one</td></tr>
<tr><td>Serving</td><td>Determines how fast and how cheaply a model can answer</td></tr>
<tr><td>Data</td><td>Supplies the right context, which is not the same as more context</td></tr>
<tr><td>Orchestration</td><td>Turns individual model calls into completed work</td></tr>
<tr><td>Applications</td><td>Where all of it becomes something people use and pay for</td></tr>
<tr><td>Governance</td><td>Makes the system explainable, controllable and auditable</td></tr>
<tr><td>Reproducibility</td><td>Makes it behave the same everywhere it runs</td></tr>
</table>`},

{l:"RECALL",t:"Traps",h:"Every trap, gathered",b:`<table>
<tr><td>The model reflex</td><td>Treating model choice as the hard part. It is one layer of six.</td></tr>
<tr><td>Free is not free</td><td>Open weights remove the token bill and add operational payroll.</td></tr>
<tr><td>Biggest model everywhere</td><td>Pays for unused capability on every single request.</td></tr>
<tr><td>The hidden serving layer</td><td>A hosted API does this work and bills for it invisibly.</td></tr>
<tr><td>More context is better</td><td>Beyond a point, extra context makes answers worse.</td></tr>
<tr><td>Shared standard, shared flaw</td><td>MCP concentrates risk as efficiently as it spreads capability.</td></tr>
<tr><td>Agent without a limit</td><td>A loop with no ceiling on steps or cost will not stop itself.</td></tr>
<tr><td>Framework before understanding</td><td>Gets blamed for problems the underlying loop caused.</td></tr>
<tr><td>Shipping without evals</td><td>Fix one behaviour, break three, notice in six weeks.</td></tr>
<tr><td>Trusting a fluent answer</td><td>Hallucination is how the mechanism works, not a bug awaiting a patch.</td></tr>
<tr><td>Prompting as a guarantee</td><td>Instructions are requests. Anything that must hold belongs in code.</td></tr>
<tr><td>Portable mistaken for reproducible</td><td>A container travels. That does not mean it rebuilds identically.</td></tr>
</table>`},

{l:"RECALL",t:"Glossary A–L",h:"Every term, A to L",b:`<table>
<tr><td>A2A</td><td>Standard for agents communicating with other agents</td></tr>
<tr><td>Agent</td><td>System where the model chooses its own next step towards a goal</td></tr>
<tr><td>Batching</td><td>Processing many requests together to keep the GPU busy</td></tr>
<tr><td>Container</td><td>An application packaged with its environment, able to run anywhere</td></tr>
<tr><td>Context window</td><td>Maximum tokens that fit in a single request</td></tr>
<tr><td>CUDA</td><td>Nvidia's software ecosystem for its GPUs</td></tr>
<tr><td>CI</td><td>Shared automated system that tests every change</td></tr>
<tr><td>Docker</td><td>The most widely used container tool</td></tr>
<tr><td>Drift</td><td>Degradation of a system nobody changed</td></tr>
<tr><td>Embedding</td><td>Numbers representing text, where similar meaning gives similar numbers</td></tr>
<tr><td>Evals</td><td>Fixed test cases run after changes to detect improvement or regression</td></tr>
<tr><td>Chunking</td><td>How documents are cut into passages before embedding</td></tr>
<tr><td>Fine-tuning</td><td>Further training of an existing model on task-specific examples</td></tr>
<tr><td>Foundation model</td><td>Large general model intended to be adapted to many tasks</td></tr>
<tr><td>GPU</td><td>Processor with thousands of simple workers running in parallel</td></tr>
<tr><td>Hallucination</td><td>Fluent, confident output that is false</td></tr>
<tr><td>Guardrail</td><td>A limit enforced in code around the model</td></tr>
<tr><td>Inference</td><td>One run of a model to produce one answer</td></tr>
<tr><td>Grounding</td><td>Answering from supplied text rather than memory</td></tr>
<tr><td>KV cache</td><td>Stored intermediate results; grows with conversation length</td></tr>
<tr><td>Knowledge cutoff</td><td>Date at which a model's training text ends</td></tr>
<tr><td>Latency</td><td>How long one person waits for an answer</td></tr>
</table>`},

{l:"RECALL",t:"Glossary M–W",h:"Every term, M to W",b:`<table>
<tr><td>MCP</td><td>Shared standard for connecting AI applications to tools and data</td></tr>
<tr><td>Nix</td><td>Package system giving the strongest reproducibility guarantee</td></tr>
<tr><td>Multimodal</td><td>Model that accepts images, audio or video as well as text</td></tr>
<tr><td>Observability</td><td>Ability to see what a system did after the fact</td></tr>
<tr><td>Open-weight</td><td>Model whose weights are published and downloadable</td></tr>
<tr><td>pgvector</td><td>Extension letting an ordinary PostgreSQL database store embeddings</td></tr>
<tr><td>Prompt caching</td><td>Reusing processed repeated text at a steep discount</td></tr>
<tr><td>Quantization</td><td>Storing weights at lower precision for size and speed</td></tr>
<tr><td>RAG</td><td>Retrieval-augmented generation — search, then attach, then answer</td></tr>
<tr><td>Reasoning model</td><td>Model that works through a problem internally before answering</td></tr>
<tr><td>Routing</td><td>Sending each request to an appropriately sized model</td></tr>
<tr><td>Serving</td><td>Software that runs a model against live requests</td></tr>
<tr><td>Speculative decoding</td><td>Small model guesses ahead, large model verifies in one pass</td></tr>
<tr><td>Throughput</td><td>Total requests handled per second</td></tr>
<tr><td>Structured output</td><td>Machine-readable response with named fields</td></tr>
<tr><td>Token</td><td>Fragment of text; the unit of billing</td></tr>
<tr><td>Tool call</td><td>A model's request for the surrounding system to perform an action</td></tr>
<tr><td>TPU</td><td>Google's purpose-built AI accelerator</td></tr>
<tr><td>Test-time compute</td><td>Spending more effort at answering time, not training time</td></tr>
<tr><td>Trace</td><td>The full path of one request through every step</td></tr>
<tr><td>Version control</td><td>System recording every change and permitting return to any point</td></tr>
<tr><td>vLLM</td><td>Widely used open serving engine</td></tr>
<tr><td>Post-training</td><td>Stage that turns a raw predictor into a helpful assistant</td></tr>
<tr><td>Weights</td><td>The numbers inside a model file; also called parameters</td></tr>
<tr><td>Workflow</td><td>Sequence of steps fixed in advance by a person</td></tr>
</table>`},

{l:"ORIENT",t:"The question",h:"Which layer is <em>owned</em>?",b:`<p>The instinct at the end of a map like this is to ask which layer matters most. It is the wrong question — every layer can end a product on its own.</p>
<p>The better question, and the one that determines strategy for an organisation and direction for a career:</p>
<div class="note" style="font-size:17px;color:var(--ink);border-left-color:var(--accent)">Which layer is genuinely owned, and which layers are rented from someone else?</div>
<p>Cursor owned layer six and rented the rest, and that turned out to be worth sixty billion dollars. A bank running models on its own hardware owns layer one because the law requires it, and rents the model. Both are coherent. Neither is accidental.</p>`},

{l:"CLOSE",t:"Version 01",h:"Where this <em>stops</em>",b:`<p>This is the map, and only the map. Every part of an AI system has now been named, defined and placed in relation to the others, and the whole thing has been carried in one sitting.</p>
<p>What it deliberately does not do is go deep. There is no mathematics, no code, no configuration, no hands-on work. Those are the next layer up, and they land properly only on ground that already exists.</p>
<div class="rule"></div>
<div class="meta">
V01 &nbsp;·&nbsp; the map — complete<br>
V02 &nbsp;·&nbsp; one layer, in depth — begins where this ends<br>
V03 &nbsp;·&nbsp; the work itself — hands on the system
</div>
<div class="note" style="margin-top:24px">A note on method, from a source outside this subject: understanding is built one small step at a time, and each step must be reachable from the one below it but not trivial. Nothing here was written to be impressive. It was written to be the step that holds weight.</div>`}
]}
]};

/* ---------- build the scroll ---------- */
const main=document.getElementById('main'), rail=document.getElementById('rail');
const lc=l=>(l==='TRAP'||l==='TRADE-OFF')?'label q':(l==='RECALL'?'label r':'label');
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards &nbsp;/&nbsp; Version 01</div>
  <h1>The <em>AI Stack</em></h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>Written for one sitting &nbsp;·&nbsp; No prior knowledge assumed<br>August 2026</div>
  <div class="note" style="margin-top:26px">Version 01 is the <strong>map</strong>: what every part of an AI system is, what it does, and where it sits. It goes wide and stops before depth. Later versions go down, one layer at a time, and each begins exactly where this one ends.</div>
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    <div class="inthis">In this mission</div>
    <ul>${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
const rev=new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
},{rootMargin:'0px 0px -8% 0px',threshold:.04});
secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
</body>
</html>
