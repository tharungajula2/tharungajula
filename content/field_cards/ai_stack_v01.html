<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AI Stack — Field Cards V01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
@media(max-width:430px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
.row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
.row:hover .t{color:var(--accent)}
.row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
.row .t{color:var(--ink);font-size:15px;transition:color .15s}
.row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>

<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>

<script>
const P = {
title:"The AI Stack",
sub:"A complete map of how an AI system is actually built, for a reader starting from zero.",
missions:[

/* ============ MISSION 01 ============ */
{n:"01",title:"Before the stack",stage:"Ground",
bullets:["Why a shared map exists at all","What a model actually is, in plain words","The one distinction that explains everything else","The six layers, seen for the first time"],
cards:[
{l:"ORIENT",t:"The map problem",h:"Two maps, forty years apart",b:`<p>In 1984, computer networks were incompatible with each other. Every manufacturer built its own hardware and its own rules for sending messages, and equipment from one company could not talk to equipment from another.</p>
<p>Engineers responded with a shared diagram called the <span class="k">OSI model</span> — seven layers, each with one clearly defined job. It did not build the internet. It did something quieter and more durable: it gave everyone the same vocabulary for describing what they were building.</p>
<p>Artificial intelligence in 2026 is at the same point. There is no official standard for how an AI system is assembled. But the same layers keep appearing in real production systems, and that recurrence is enough to draw a map from.</p>
<div class="note">This pack is that map. It assumes no programming background whatsoever. Every technical word is defined the first time it appears, and never used before it is defined.</div>`},

{l:"DEFINE",t:"The model",h:"What a <em>model</em> actually is",b:`<p>Strip away the mystique and a model is a <strong>file</strong>. A very large one — often hundreds of gigabytes — containing nothing but numbers.</p>
<p>Those numbers are called <span class="k">weights</span>, or sometimes <span class="k">parameters</span>. When people say a model has 70 billion parameters, they mean the file holds 70 billion of these numbers.</p>
<p>The numbers encode statistical patterns absorbed from an enormous quantity of text. On their own they do nothing at all. A model file sitting on a hard drive is as inert as a photograph in a drawer. Something has to pick it up and run it.</p>
<div class="note">This is the first idea that has to land, because everything else in the stack exists to answer one question: what does it take to pick that file up and make it useful to a real person?</div>`},

{l:"DEFINE",t:"Tokens",h:"The unit everything is counted in",b:`<p>A model does not read words. It reads <span class="k">tokens</span> — fragments of text, usually a short word or a piece of a longer one.</p>
<p>The word <em>hospital</em> might be one token. The word <em>reproducibility</em> might be four. As a rough rule, one hundred tokens is about seventy-five English words.</p>
<p>Tokens matter far beyond linguistics, for one commercial reason: <strong>tokens are the unit of billing</strong>. Companies that rent access to a model charge per million tokens read and per million tokens written. Every cost decision later in this pack traces back to this unit.</p>
<div class="two"><div><b>Input tokens</b>The text sent to the model — the question, plus any documents attached to it.</div><div><b>Output tokens</b>The text the model writes back. Usually billed at a higher rate than input.</div></div>`},

{l:"MECHANISM",t:"How it runs",h:"One token at a time",b:`<p>A model does exactly one thing: given a sequence of tokens, it predicts the token most likely to come next.</p>
<p>It writes that token, adds it to the sequence, and predicts again. And again. A paragraph of output is that single operation repeated a few hundred times.</p>
<div class="flow">
<div class="n"><b>Step 1</b>Read everything so far</div>
<div class="a">&#8595;</div>
<div class="n"><b>Step 2</b>Predict the single most likely next token</div>
<div class="a">&#8595;</div>
<div class="n"><b>Step 3</b>Append it, and return to step 1</div>
</div>
<p>Everything that feels like reasoning, style or expertise emerges from this loop running at scale. There is no separate reasoning module inside the file.</p>`},

{l:"DEFINE",t:"The central split",h:"Training and <em>inference</em>",b:`<p>This is the single most important distinction in the entire pack. Almost every cost, tool and job title in AI sits on one side of it or the other.</p>
<div class="two"><div><b>Training</b>Creating the file. Feeding vast amounts of text through specialised hardware for weeks or months until the numbers settle into useful patterns. Enormously expensive. Happens <strong>occasionally</strong>.</div>
<div><b>Inference</b>Using the file. Running it once to answer one request. Cheap per use. Happens <strong>every single time anyone asks it anything</strong>.</div></div>
<p>A model might be trained four times in its life. It will be used for inference a billion times.</p>
<div class="note">Hold on to this. Later, when serving costs turn out to dwarf training costs for most companies, it will already make sense.</div>`},

{l:"WHY IT EXISTS",t:"The gap",h:"A file is not a product",b:`<p>Between a model file and something a person can actually use sits a long list of unglamorous problems, and none of them are solved by choosing a better model.</p>
<ul>
<li>The file has to run on machines powerful enough to hold it and fast enough to answer while someone waits.</li>
<li>It was trained on text that stops at a certain date, so it knows nothing about last week, and nothing at all about any particular company.</li>
<li>Most real tasks need several steps in sequence, not one answer.</li>
<li>Somebody has to be able to prove later what it did and what it cost.</li>
<li>It has to behave identically on an engineer's laptop and on the live system.</li>
</ul>
<p>Each of those is a layer. That is what the stack is: the list of everything between the file and the person.</p>`},

{l:"PICTURE",t:"The stack",h:"Six layers, bottom to top",b:`<div class="dg"><div class="dg-t">Read from the bottom up</div>
<div class="lay">
<div><span>1</span>Compute &amp; infrastructure — the machines</div>
<div><span>2</span>Model training &amp; development — which model</div>
<div><span>3</span>Inference &amp; serving — making it respond</div>
<div><span>4</span>Data, retrieval &amp; protocols — giving it context</div>
<div><span>5</span>Orchestration &amp; agents — turning calls into work</div>
<div><span>6</span>Applications — what a person sees</div>
</div>
<div class="cross">Governance &amp; observability &nbsp;·&nbsp; runs through all six</div>
<div class="cross">Reproducibility &nbsp;·&nbsp; runs through all six</div>
</div>
<p>Different practitioners draw the boundaries differently, and that is fine. What matters is the <strong>job each layer does</strong>, not the number of boxes.</p>`},

{l:"TRAP",t:"The model reflex",h:"The model is one layer",b:`<p>The most common and most expensive misconception in the field: that choosing the right model is the hard part, and the rest is plumbing.</p>
<p>In practice the model is layer two of six, and it is frequently the layer a team spends the <em>least</em> time on — a decision made in an afternoon and revisited twice a year.</p>
<p>Systems fail in production for reasons that have nothing to do with model quality. They retrieve the wrong document. They cost four times the forecast. They behave differently on the live system than in testing. They cannot explain what they did.</p>
<div class="note">Everything around the model decides whether the system works. This sentence is the spine of the pack, and it will be earned layer by layer.</div>`},

{l:"ORIENT",t:"The example",h:"One system, carried throughout",b:`<p>A single example runs through every layer of this pack: a company building an <strong>AI coding assistant</strong> for its own engineers.</p>
<p>An engineer writes software — instructions a computer follows. The assistant sits inside the program the engineer already types into, and writes some of those instructions for them. Thousands of engineers, one assistant.</p>
<p>It is a useful example because it exercises every layer honestly:</p>
<table>
<tr><td>It must know the company's own software</td><td>Layer 4 — retrieval</td></tr>
<tr><td>It must work in steps: understand, write, test, review</td><td>Layer 5 — orchestration</td></tr>
<tr><td>It must answer fast, at bearable cost</td><td>Layers 1 and 3</td></tr>
<tr><td>It must live inside the engineer's own tools</td><td>Layer 6 — application</td></tr>
</table>`},

{l:"RECALL",t:"Mission 01",h:"What is now owned",b:`<ul>
<li>A <strong>model</strong> is a file of numbers called weights, and does nothing on its own.</li>
<li>A <strong>token</strong> is a fragment of text, and is the unit of billing.</li>
<li>A model generates by predicting one token at a time, in a loop.</li>
<li><strong>Training</strong> makes the file and happens rarely. <strong>Inference</strong> uses the file and happens constantly.</li>
<li>Six layers sit between the file and the user, with governance and reproducibility cutting across all of them.</li>
</ul>
<div class="note">Nothing above requires a single further definition to be understood. That standard holds for the rest of the pack.</div>`}
]},

/* ============ MISSION 02 ============ */
{n:"02",title:"Compute and infrastructure",stage:"Layer 1",
bullets:["Why AI needs unusual hardware","What CUDA is, and why it is a moat","Cloud, on-premises and edge","The cost inversion nobody plans for"],
cards:[
{l:"ORIENT",t:"Layer 1",h:"The floor everything stands on",b:`<p>The bottom layer answers a blunt question: <strong>what machines does this run on, and who owns them?</strong></p>
<p>Every decision above this layer is constrained by the answer. A model that cannot fit on the available hardware is not an option, however good it is. A serving cost that cannot be borne ends the product regardless of how well it works.</p>
<p>This layer is also where a quiet problem is planted that will not surface until Mission 09 — so it is worth reading the last card of this mission with some attention.</p>`},

{l:"DEFINE",t:"CPU and GPU",h:"Two kinds of processor",b:`<p>A <span class="k">processor</span> is the part of a computer that performs calculations. There are two relevant kinds.</p>
<div class="two"><div><b>CPU</b>Central Processing Unit. A handful of very fast, very flexible workers. Excellent at complicated instructions performed in sequence. This is what runs ordinary software.</div>
<div><b>GPU</b>Graphics Processing Unit. Thousands of simpler workers operating simultaneously. Poor at complicated sequences, extraordinary at doing the same simple sum thousands of times at once.</div></div>
<p>GPUs were built to colour in the pixels of video games — millions of identical small calculations, all at the same moment.</p>`},

{l:"WHY IT EXISTS",t:"Why GPUs won",h:"The shape of the arithmetic",b:`<p>Running a model means multiplying enormous grids of numbers together. Not complicated arithmetic — the same simple multiplication, performed billions of times, and crucially, most of those multiplications do not depend on each other's results.</p>
<p>Work that does not depend on itself can be split up and done simultaneously. That is precisely the shape of problem a GPU exists for.</p>
<div class="note">This is the whole reason AI runs on graphics hardware. Not a historical accident, and not marketing — the arithmetic of a neural network and the arithmetic of a video game frame happen to have the same shape.</div>`},

{l:"DEFINE",t:"CUDA",h:"The layer beneath the hardware",b:`<p>Owning a GPU is not enough. Software has to be told how to talk to it, and that translation is done by a <span class="k">software ecosystem</span> — the libraries, drivers and tools that sit between a program and the chip.</p>
<p>Nvidia's is called <span class="k">CUDA</span>. It has existed since 2007, and nearly every significant piece of AI software has been written and tested against it.</p>
<p>So Nvidia's dominance of this layer rests on two things, and the second is the harder one to dislodge:</p>
<ul>
<li>The chips themselves, which are excellent.</li>
<li>CUDA, which nearly two decades of the world's AI code already assumes.</li>
</ul>`},

{l:"MECHANISM",t:"The moat",h:"Why a better chip is not enough",b:`<p>A competitor can build a faster chip. What is far harder is persuading the world to rewrite software that already works.</p>
<p>Every framework, every tuned routine, every workaround discovered at three in the morning by an engineer somewhere — all of it assumes CUDA. A rival must not only match the hardware but reproduce that accumulated ecosystem, or accept that customers will do the porting work themselves.</p>
<p>This is why the layer is diversifying slowly rather than suddenly, despite intense commercial pressure to escape a single supplier.</p>`},

{l:"DEFINE",t:"The alternatives",h:"TPUs, Trainium and the rest",b:`<p>The pressure to reduce dependence on one vendor is producing purpose-built alternatives, generally called <span class="k">accelerators</span> — chips designed for one kind of work rather than for anything.</p>
<table>
<tr><td>TPU</td><td>Google. Tensor Processing Unit. Built specifically for the grid arithmetic described earlier, and used heavily inside Google's own systems.</td></tr>
<tr><td>Trainium</td><td>Amazon. Designed for training, with a companion chip for inference, and offered through Amazon's cloud.</td></tr>
<tr><td>Others</td><td>Most large cloud providers now design their own, chiefly to lower cost and reduce reliance on a single supplier.</td></tr>
</table>`},

{l:"TRADE-OFF",t:"Where it runs",h:"Cloud, on-premises, edge",b:`<p>Three places the machines can physically be, and the choice is rarely made on technical grounds alone.</p>
<div class="two"><div><b>Cloud</b>Rent machines from Amazon, Google or Microsoft. Nothing to buy, capacity in minutes. Costs are ongoing and scale with use.</div>
<div><b>On-premises</b>Buy the machines and keep them in an owned building. Common where data is legally not permitted to leave — banks, hospitals, government.</div></div>
<div class="dg"><div class="dg-t">The third option</div>
<div class="flow"><div class="n"><b>Edge</b>A smaller model running directly on the phone, laptop or device in someone's hand. Nothing is sent anywhere. Fast and private, but constrained to models small enough to fit.</div></div></div>`},

{l:"MECHANISM",t:"The cost inversion",h:"Train once, <em>serve forever</em>",b:`<p>Return to the training-and-inference split from Mission 01, and apply it to money.</p>
<p>Training is a large, visible, one-off expense. It is the number that appears in press coverage. Inference is a small expense that recurs on every single request, and it is almost never the number anyone quotes.</p>
<div class="flow">
<div class="n"><b>Early</b>Few users. Training dominates the budget entirely.</div>
<div class="a">&#8595;</div>
<div class="n"><b>Growth</b>Request volume climbs. Serving cost climbs with it, linearly and without pause.</div>
<div class="a">&#8595;</div>
<div class="n"><b>At scale</b>Serving is the larger long-term cost, and the one that determines whether the product has a viable business at all.</div>
</div>
<p>This inversion is why the entire next mission but one is devoted to making inference cheaper.</p>`},

{l:"TRAP",t:"The first seed",h:"Nobody knows which version they run",b:`<p>Every machine that runs a model depends on a specific combination of <span class="k">drivers</span> — the software that lets a computer control a piece of hardware — plus runtimes and accelerator libraries. On an Nvidia machine, CUDA is the obvious example.</p>
<p>These have version numbers. CUDA 12.4 is not CUDA 12.1.</p>
<p>Two engineers on the same team can be running different versions without either of them knowing, because nothing announces it and everything appears to work.</p>
<div class="note">This is the first of three seeds planted deliberately across the pack. The second appears in Mission 06. Mission 09 is where all three grow into the same problem.</div>`},

{l:"RECALL",t:"Mission 02",h:"What is now owned",b:`<ul>
<li>GPUs suit AI because model arithmetic is enormous, simple and independent — the shape that parallel hardware exists for.</li>
<li><strong>CUDA</strong> is Nvidia's software ecosystem, and a stronger moat than the chips.</li>
<li>TPUs and Trainium are purpose-built alternatives, driven mainly by cost and supplier risk.</li>
<li>Cloud, on-premises and edge trade convenience against control, and the choice is often legal rather than technical.</li>
<li>Training is occasional and visible; <strong>serving is constant and eventually larger</strong>.</li>
<li>Version drift in drivers and libraries starts here, silently.</li>
</ul>`}
]},

/* ============ MISSION 03 ============ */
{n:"03",title:"Models and training",stage:"Layer 2",
bullets:["Where models come from","Proprietary against open-weight","What fine-tuning really is","Why the biggest model is often the wrong one"],
cards:[
{l:"ORIENT",t:"Layer 2",h:"Which model, and on whose terms",b:`<p>Compute provides raw capacity. The next question is what actually runs on it.</p>
<p>Almost no organisation trains a model from nothing. The cost runs to hundreds of millions and requires research staff that barely exist. What nearly everyone does instead is start from a model somebody else trained.</p>
<p>So this layer is less about training than about <strong>selection</strong> — and about the terms on which a model is obtained, which turn out to matter as much as its quality.</p>`},

{l:"DEFINE",t:"Foundation models",h:"Trained once, used for anything",b:`<p>A <span class="k">foundation model</span> is a large general-purpose model trained on a broad sweep of text, intended to be adapted to many different tasks rather than built for one.</p>
<p>It is the substrate. It knows language, structure, code and a great deal of general knowledge, and knows nothing whatever about any particular organisation.</p>
<p>A small number of well-funded laboratories build them. Everyone else builds on top.</p>`},

{l:"MECHANISM",t:"Two stages",h:"Why a raw model is not an <em>assistant</em>",b:`<p>Training is not one event. It is two, and the difference explains why models behave the way they do.</p>
<div class="two"><div><b>Pre-training</b>The model reads an enormous quantity of text and learns only to predict what comes next. The result is capable and useless — it will continue a question rather than answer it, because continuing is all it was ever asked to do.</div>
<div><b>Post-training</b>A much smaller stage that teaches the model to be helpful: follow instructions, answer rather than continue, refuse certain things, adopt a manner. Often involves humans ranking outputs so the model learns which kind of answer is preferred.</div></div>
<p>Nearly all the personality, helpfulness and caution of a commercial model comes from the second stage. The knowledge comes from the first.</p>
<div class="note">This is why two models trained on similar text can feel completely different to use. The difference is usually post-training, not raw capability.</div>`},

{l:"DEFINE",t:"Two ways to get one",h:"Proprietary and <em>open-weight</em>",b:`<div class="two"><div><b>Proprietary</b>The weights stay with the company that made them. Access is rented over the internet and billed per token. Claude, GPT and Gemini work this way.</div>
<div><b>Open-weight</b>The weights file is published and can be downloaded. Models from laboratories such as Qwen and DeepSeek are now strongly competitive, particularly at code and reasoning.</div></div>
<div class="note">The term is <em>open-weight</em>, not open-source. The numbers are published; the data and process that produced them usually are not. The distinction is worth keeping, because it is frequently blurred in marketing material.</div>
<p>Meta's Llama once dominated this conversation. That is no longer the case — the competitive set has widened considerably.</p>`},

{l:"DEFINE",t:"Reasoning models",h:"Thinking before answering",b:`<p>A distinct class of model behaves differently: instead of answering immediately, it generates a long internal working-out first, then produces a final answer.</p>
<p>These are called <span class="k">reasoning models</span>. The internal working is often hidden or summarised, and the user sees only the conclusion.</p>
<div class="two"><div><b>What is gained</b>Substantially better performance on problems with many steps — mathematics, complex code, chains of logic where a single wrong turn ruins the answer.</div>
<div><b>What is paid</b>Far more tokens generated, so higher cost and a longer wait. Sometimes ten or twenty times the tokens for one answer.</div></div>
<p>This introduced a new lever, sometimes called <span class="k">test-time compute</span>: spending more effort at the moment of answering rather than at the moment of training. A model can be asked to think harder about a hard question and less about an easy one.</p>
<div class="note">Which is the same insight as routing in Mission 04, arriving from a different direction — match the effort to the difficulty rather than paying maximum on every request.</div>`},

{l:"DEFINE",t:"Multimodal",h:"Beyond text",b:`<p>The pack has so far described models that read and write text. Most current frontier models are <span class="k">multimodal</span> — able to take images, documents, audio or video as input alongside text.</p>
<p>The mechanism is unchanged. An image is converted into tokens by a different method, and then predicted over exactly as text is. The model does not have a separate vision faculty; the input is translated into the only currency it understands.</p>
<ul>
<li>A photograph of a form, read and turned into structured data</li>
<li>A screenshot of a broken interface, described and diagnosed</li>
<li>A chart in a report, interpreted rather than skipped</li>
</ul>
<p>Images consume tokens, often a great many, so a multimodal request is usually a more expensive request.</p>`},

{l:"TRADE-OFF",t:"The real comparison",h:"Free is not free",b:`<p>The choice is often presented as paid against free. That framing is wrong, and expensively so.</p>
<table>
<tr><td>Hosted (proprietary)</td><td>A per-token charge. In exchange, the provider handles machines, serving, scaling, updates and reliability. Capability is available immediately.</td></tr>
<tr><td>Open-weight, self-run</td><td>No per-token charge. Instead: GPUs, hosting, monitoring, upgrades — and the salaries of the engineers who keep it standing.</td></tr>
</table>
<p>The per-token bill disappears. The operational work does not; it moves in-house and acquires a payroll.</p>
<p>Open weights win decisively on two grounds that have nothing to do with price: <strong>data never leaves the building</strong>, and <strong>the model cannot be changed or withdrawn by someone else</strong>.</p>`},

{l:"MECHANISM",t:"Fine-tuning",h:"Adjusting a model that already exists",b:`<p><span class="k">Fine-tuning</span> takes a model that already works and continues its training on a much smaller, specific set of examples. The general capability remains; a specialisation is added on top.</p>
<div class="flow">
<div class="n"><b>Start</b>An open-weight model that handles language well and knows nothing about the domain</div>
<div class="a">&#8595;</div>
<div class="n"><b>Feed</b>A few thousand examples of the exact task, done correctly</div>
<div class="a">&#8595;</div>
<div class="n"><b>Result</b>A model noticeably better at that one task, and no better at anything else</div>
</div>
<p>Orders of magnitude cheaper than training from scratch — a scale of hours and thousands, not months and millions.</p>`},

{l:"MECHANISM",t:"Small and sharp",h:"Why the biggest model loses",b:`<p>One of the most consequential shifts of recent years: a small model fine-tuned for one narrow, well-defined task will often <strong>outperform a much larger general-purpose model on that task</strong> — while running faster and costing considerably less.</p>
<p>The reasoning is not mysterious. A large general model carries capability for thousands of tasks it is not currently being asked to do. That breadth is paid for on every single request, in money and in latency.</p>
<div class="note">This turns model selection into an engineering discipline of its own. A serious system rarely uses one model. It uses several, each chosen for the step it is placed at.</div>`},

{l:"PICTURE",t:"The choice",h:"Four questions, in order",b:`<div class="dg"><div class="dg-t">Model selection, layer by layer</div>
<div class="flow">
<div class="n"><b>1 — Can the data leave?</b>If not, the decision is already made: open-weight, self-hosted. Everything else is downstream of this.</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Is the task narrow?</b>Narrow and repetitive favours a small fine-tuned model. Broad and unpredictable favours a large general one.</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — What is the volume?</b>Low volume favours renting. High volume is where self-hosting begins to repay its overhead.</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — How fast must it answer?</b>Strict speed requirements push towards smaller models, or towards running closer to the user.</div>
</div></div>`},

{l:"TRAP",t:"The reflex",h:"Reaching for the largest model",b:`<p>The instinct is to choose the most capable model available and use it everywhere. It is a defensible instinct — it removes a decision and rarely produces a bad answer.</p>
<p>It also produces systems that cost several times what they need to, and answer more slowly than they need to, because the same expensive model is being asked to classify a two-word request and to write a complex document.</p>
<p>The discipline is to ask, at each step, what the <em>least</em> capable model that reliably does this job would be. That question is asked far less often than it should be, and Mission 04 turns it into a mechanism.</p>`},

{l:"RECALL",t:"Mission 03",h:"What is now owned",b:`<ul>
<li>A <strong>foundation model</strong> is broad, general, and built by a small number of laboratories.</li>
<li><strong>Proprietary</strong> models are rented per token. <strong>Open-weight</strong> models are downloaded and run.</li>
<li>Open weights remove the token bill and replace it with operational work and payroll.</li>
<li>The genuine advantages of open weights are data control and independence, not price.</li>
<li><strong>Fine-tuning</strong> specialises an existing model cheaply.</li>
<li>A small fine-tuned model frequently beats a large general one on a narrow task.</li>
</ul>`}
]},

/* ============ MISSION 04 ============ */
{n:"04",title:"Inference and serving",stage:"Layer 3",
bullets:["What it takes to answer a real request","Quantization, in plain terms","Batching, KV cache and speculative decoding","Routing, and where the bill actually falls"],
cards:[
{l:"ORIENT",t:"Layer 3",h:"From file to <em>answer</em>",b:`<p>A trained model is still only a file on a machine. To become a product it has to respond to real people, reliably, quickly, and at a price the business can survive.</p>
<p>That is <span class="k">serving</span>: the software layer that receives a request, runs the model on the hardware, and returns the result.</p>
<p>And by the logic established in Mission 02, this is where the money goes. Training happens occasionally. Serving happens on every request, forever.</p>`},

{l:"DEFINE",t:"The vocabulary",h:"Three words used constantly",b:`<table>
<tr><td>Inference</td><td>One run of the model to produce one answer. Also called a <em>call</em> or a <em>request</em>.</td></tr>
<tr><td>Latency</td><td>How long the person waits. Usually split into time-to-first-token and the speed of everything after it.</td></tr>
<tr><td>System prompt</td><td>Standing instructions sent ahead of every request</td></tr>
<tr><td>Throughput</td><td>How many requests the hardware handles per second. Latency is the individual's experience; throughput is the fleet's.</td></tr>
</table>
<p>These pull against each other. Optimising hard for one usually costs something on the other, and most serving decisions are a position taken on that tension.</p>`},

{l:"DEFINE",t:"Quantization",h:"Storing numbers less precisely",b:`<p>The weights in a model file are numbers, and numbers can be stored at different levels of precision. <span class="k">Quantization</span> means deliberately storing them at lower precision than they were trained at.</p>
<p>An analogy that holds well: recording a measurement as 3.14159 against recording it as 3.14. Less precise, far more compact, and for a great many purposes indistinguishable in effect.</p>
<div class="two"><div><b>Gained</b>A smaller file, less memory used, faster responses, lower cost, and the ability to run on more modest hardware.</div>
<div><b>Given up</b>A small amount of accuracy. Often unnoticeable; occasionally it matters a great deal, which is why it must be measured rather than assumed.</div></div>`},

{l:"DEFINE",t:"Serving engines",h:"vLLM and TensorRT-LLM",b:`<p>Between the incoming request and the GPU sits a specialised piece of software called a <span class="k">serving engine</span>. The names encountered most often are <strong>vLLM</strong> and <strong>TensorRT-LLM</strong>.</p>
<p>Its job is not to make one request faster in isolation. It is to make the GPU handle as many simultaneous requests as possible, and to use the GPU's limited memory efficiently while doing so.</p>
<p>The gains are not marginal. A well-configured serving engine can be the difference between paying for four GPUs and paying for one.</p>`},

{l:"MECHANISM",t:"Batching and memory",h:"Why several at once is cheaper",b:`<p>A GPU running one request at a time is mostly idle — thousands of parallel workers waiting on a single conversation. <span class="k">Batching</span> means processing many requests together so the hardware stays occupied.</p>
<p>The complication is memory. As a model generates, it keeps intermediate results for everything written so far, so it does not recompute them on every token. This store is the <span class="k">KV cache</span>, and it grows with the length of the conversation.</p>
<div class="note">Longer conversations consume more GPU memory, which means fewer users can be served at once. This is a direct and often surprising link between conversation length and infrastructure cost.</div>`},

{l:"MECHANISM",t:"Speculative decoding",h:"Guess ahead, then verify",b:`<p>Generating one token at a time is inherently sequential, and therefore slow. Speculative decoding sidesteps some of that.</p>
<div class="flow">
<div class="n"><b>1</b>A small, fast model guesses the next several tokens</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>The large model checks all of those guesses together, in one pass</div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>Correct guesses are accepted in a single step. Wrong ones are discarded and generated properly</div>
</div>
<p>Verifying several tokens at once is far cheaper than generating them one by one, so when the small model guesses well, the whole sequence arrives faster — with no change to the final output.</p>`},

{l:"MECHANISM",t:"Caching",h:"Paying once for what repeats",b:`<p>Real systems send the same text over and over. The same instructions at the start of every request, the same reference document, the same conversation history re-sent on every turn.</p>
<p><span class="k">Prompt caching</span> stores the processed form of that repeated text so it is not recomputed each time.</p>
<div class="flow">
<div class="n"><b>Without caching</b>Every request reprocesses the full instructions and history from the beginning</div>
<div class="a">&#8595;</div>
<div class="n"><b>With caching</b>The unchanged portion is reused; only the new part is processed</div>
</div>
<p>Providers usually bill cached input at a steep discount, often a small fraction of the normal rate. For a system with long standing instructions, this is one of the largest and least effortful savings available — and it depends on putting the stable text at the <em>start</em> of the request and the varying text at the end.</p>`},

{l:"MECHANISM",t:"Routing",h:"Not every request needs the expensive model",b:`<p>Mission 03 ended on a question: what is the least capable model that reliably does this job? <span class="k">Routing</span> is that question, answered automatically, per request.</p>
<p>A router inspects an incoming request and sends it to an appropriate model. Simple classification goes to a small cheap one. Genuinely hard reasoning goes to the large expensive one.</p>
<p>Because the distribution of real traffic is heavily weighted towards easy requests, a good router can reduce an inference bill substantially. A bad one sends hard problems to a model that cannot handle them, and the failure is quiet.</p>`},

{l:"PICTURE",t:"The path",h:"What one request touches",b:`<div class="dg"><div class="dg-t">Layer 3, end to end</div>
<div class="flow">
<div class="n"><b>Request</b>A person asks something</div>
<div class="a">&#8595;</div>
<div class="n"><b>Router</b>Decides which model is appropriate</div>
<div class="a">&#8595;</div>
<div class="n"><b>Serving engine</b>Groups it with other live requests, manages GPU memory</div>
<div class="a">&#8595;</div>
<div class="n"><b>Model on GPU</b>Generates, possibly with a small model guessing ahead</div>
<div class="a">&#8595;</div>
<div class="n"><b>Response</b>Streamed back as it is produced</div>
</div></div>`},

{l:"TRAP",t:"The hidden layer",h:"A rented API does not remove this",b:`<p>When a hosted model is called over the internet, the provider is doing every one of the things in this mission — quantization, batching, cache management, speculative decoding, routing.</p>
<p>It is not absent. It is <strong>included in the token price</strong>, and invisible.</p>
<p>Which means the choice made back in Mission 03 was also a choice about this mission. Rent the model and this engineering is bought. Self-host and it becomes the team's problem, and it is the reason self-hosting is far more work than downloading a file.</p>
<div class="note">How a model is served matters nearly as much as which model is chosen. The two decisions are made together or they are made badly.</div>`},

{l:"RECALL",t:"Mission 04",h:"What is now owned",b:`<ul>
<li><strong>Serving</strong> is the software that turns a model file into something that answers requests.</li>
<li><strong>Latency</strong> is one person's wait; <strong>throughput</strong> is total volume; they pull against each other.</li>
<li><strong>Quantization</strong> trades a little accuracy for size, speed and cost.</li>
<li><strong>Batching</strong> keeps the GPU busy; the <strong>KV cache</strong> is what limits how much batching is possible.</li>
<li><strong>Speculative decoding</strong> uses a small model to guess ahead and a large one to verify.</li>
<li><strong>Routing</strong> sends easy work to cheap models, and is where large savings live.</li>
<li>A hosted API performs all of this and bills for it inside the token price.</li>
</ul>`}
]},

/* ============ MISSION 05 ============ */
{n:"05",title:"Data, retrieval and protocols",stage:"Layer 4",
bullets:["Why a model knows nothing about the company","Embeddings and retrieval, from first principles","Context engineering, which replaced plain retrieval","MCP, A2A, and the risk that arrives with a standard"],
cards:[
{l:"ORIENT",t:"Layer 4",h:"Fast answers to the <em>wrong</em> question",b:`<p>Layer 3 made the model respond quickly. This layer decides whether it responds usefully — and speed applied to the wrong information is simply a faster mistake.</p>
<p>A model has two permanent blind spots, and neither is fixed by a better model:</p>
<ul>
<li>It knows nothing about any specific organisation — internal documents, decisions, data, conventions.</li>
<li>It knows nothing after its <span class="k">knowledge cutoff</span>, the date at which its training text stops.</li>
</ul>
<p>This layer is the practice of supplying the right information, at the right moment, for one specific request.</p>`},

{l:"DEFINE",t:"The context window",h:"How much fits in one request",b:`<p>Everything sent to a model on a single request — the question, plus any documents attached to it — has to fit inside its <span class="k">context window</span>, measured in tokens.</p>
<p>Windows have grown very large. It remains impossible to send an entire company's documents on every request, for three separate reasons:</p>
<ul>
<li>Cost — every token is billed, on every single request.</li>
<li>Speed — more input means a longer wait.</li>
<li>Quality — a model given a great deal of mostly irrelevant text answers <em>worse</em>, not better.</li>
</ul>
<div class="note">That third reason is the one most often missed. More context is not better context, and beyond a point it is actively harmful.</div>`},

{l:"DEFINE",t:"Embeddings",h:"Turning meaning into position",b:`<p>To find the relevant part of a document collection, a computer needs a way to compare meaning rather than spelling.</p>
<p>An <span class="k">embedding</span> is a list of numbers representing a piece of text, produced so that <strong>texts with similar meaning receive similar numbers</strong>.</p>
<p>Picture every piece of text placed as a point in space. Passages about mortgage default cluster in one region. Passages about holiday policy sit far away. Distance in that space stands for closeness in meaning.</p>
<div class="note">This is what makes it possible to search for a question and retrieve a passage that shares no words with it at all — a thing ordinary keyword search cannot do.</div>`},

{l:"MECHANISM",t:"Retrieval",h:"Search, then answer",b:`<p>Put those pieces together and a mechanism appears, universally known as <span class="k">RAG</span> — retrieval-augmented generation.</p>
<div class="dg"><div class="dg-t">The retrieval loop</div>
<div class="flow">
<div class="n"><b>Prepared in advance</b>Documents are split into passages, and each passage is converted into an embedding and stored</div>
<div class="a">&#8595;</div>
<div class="n"><b>1 — Question arrives</b>It is converted into an embedding by the same method</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Search</b>The stored passages closest in that space are found</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Assemble</b>Only those few passages are attached to the question</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Answer</b>The model responds using text it has just been handed</div>
</div></div>
<p>The model has not learned anything. It has been handed the right page at the right moment.</p>`},

{l:"MECHANISM",t:"Chunking",h:"How documents get cut up",b:`<p>The retrieval loop said documents are "split into passages". That split is called <span class="k">chunking</span>, and it quietly decides how well the whole system works.</p>
<div class="two"><div><b>Chunks too small</b>A passage arrives without the context that made it meaningful. A figure with no indication of what it measures.</div>
<div><b>Chunks too large</b>Each retrieved passage carries mostly irrelevant text, which costs tokens and degrades the answer.</div></div>
<p>Good chunking follows the document's own structure — a section, a clause, a table — rather than counting a fixed number of words and cutting wherever that lands. Overlapping the edges slightly stops a sentence being severed at a boundary.</p>
<div class="note">When a retrieval system returns plausible but subtly wrong passages, chunking is the first place to look, and almost the last place anyone does.</div>`},

{l:"TRADE-OFF",t:"Where embeddings live",h:"Specialist store or ordinary database",b:`<p>Those embeddings have to be stored somewhere that can search them quickly. Two routes, and the default has shifted.</p>
<div class="two"><div><b>Vector database</b>Purpose-built systems such as Pinecone and Qdrant. Genuinely necessary at large scale.</div>
<div><b>pgvector</b>An extension to PostgreSQL, an ordinary database many organisations already run. One less system to operate.</div></div>
<p>Many teams no longer add a separate vector database on day one. They start inside the database they already have and move only when a real bottleneck appears, rather than an anticipated one.</p>`},

{l:"MECHANISM",t:"Context engineering",h:"What plain retrieval became",b:`<p>Basic retrieval — embed, search, attach — turned out to be a floor rather than a solution. The broader practice that replaced it is <span class="k">context engineering</span>.</p>
<table>
<tr><td>Hybrid search</td><td>Meaning-based search combined with ordinary keyword search, because exact terms and product codes still matter.</td></tr>
<tr><td>Re-ranking</td><td>A second, more careful model re-orders the retrieved passages, so the best sits first rather than merely near.</td></tr>
<tr><td>Filtering</td><td>Restricting the search by date, department or permission before meaning is considered at all.</td></tr>
<tr><td>Memory</td><td>Carrying relevant facts across a conversation, or across sessions, rather than starting cold each time.</td></tr>
</table>
<p>The objective is stated compactly: <strong>less context, more useful context</strong>.</p>`},

{l:"DEFINE",t:"The prompt",h:"The instructions that never change",b:`<p>Every request carries more than the user's question. Ahead of it sits a <span class="k">system prompt</span> — standing instructions that define what the assistant is, what it may do, how it should answer, and what it must refuse.</p>
<p>The user never sees it. It is sent on every single request, which is why the caching card in Mission 04 matters here.</p>
<ul>
<li>Role and scope — what this assistant is for, and what it declines</li>
<li>Format — how answers should be structured</li>
<li>Rules — what must never appear in a response</li>
<li>Context — stable facts about the organisation using it</li>
</ul>
<div class="note">Prompting is the cheapest lever in the entire stack and the first one reached for. It is also the weakest: instructions are requests a model usually honours. Anything that must hold regardless belongs in a guardrail, in Mission 08.</div>`},

{l:"TRAP",t:"Hallucination",h:"Confident, fluent, <em>wrong</em>",b:`<p>A model predicts the most likely next token. Nothing in that mechanism distinguishes true from false — only likely from unlikely.</p>
<p>So when a model lacks the information, it does not stop. It produces the most plausible-sounding continuation, in the same confident register it uses when correct. This is <span class="k">hallucination</span>, and it is a direct consequence of how the thing works rather than a defect to be patched out.</p>
<p>Four mechanisms reduce it, and all four have been met already:</p>
<ul>
<li><strong>Grounding</strong> — retrieval, so the answer comes from supplied text rather than memory</li>
<li><strong>Citation</strong> — requiring the model to point at the passage it used, making the claim checkable</li>
<li><strong>Verification</strong> — a second model or ordinary software checking the output</li>
<li><strong>Evals</strong> — measuring the rate, so it is a number rather than an impression</li>
</ul>
<div class="note">Reduced, not eliminated. A system designed on the assumption that hallucination has been solved is a system that has not yet noticed its errors.</div>`},

{l:"DEFINE",t:"MCP",h:"A common plug",b:`<p>Retrieval solves documents. It does not solve <em>tools</em> — a calendar, a ticket system, a database an AI system needs to consult or act on.</p>
<p>Historically every such connection was written by hand, once per tool, per application. The <span class="k">Model Context Protocol</span>, or MCP, is a shared standard for those connections.</p>
<p>The comparison usually offered is USB-C: one shape of plug, so any tool that implements it can be used by any application that supports it.</p>
<div class="note">MCP began at Anthropic and has since moved to neutral governance, with support across OpenAI, Google, Microsoft and Amazon. That convergence is what makes it worth learning rather than merely noting.</div>`},

{l:"DEFINE",t:"A2A",h:"Agents talking to agents",b:`<p>MCP connects an application to tools and data. <span class="k">A2A</span> — agent-to-agent — addresses a different problem: separate AI systems, often built by different organisations, communicating directly with each other.</p>
<p>It originated at Google, and it is the less settled of the two. The word <em>agent</em> is defined properly in the next mission; for now it is enough to hold the shape of the distinction.</p>
<div class="two"><div><b>MCP</b>An application reaching down to tools and data</div><div><b>A2A</b>An agent reaching across to another agent</div></div>`},

{l:"TRAP",t:"The cost of convergence",h:"A shared plug, a shared <em>weakness</em>",b:`<p>Standards deliver enormous benefits, and they concentrate risk in exactly the same motion.</p>
<p>If a widely used MCP server or software library contains a security flaw, every application that depends on it is potentially exposed at once. The convenience of one shared plug is also one shared point of failure.</p>
<p>Serious security problems have already appeared around agent systems, and OWASP — the long-established organisation that publishes the industry's reference list of the most critical software security risks — now maintains a top ten specifically for agentic applications.</p>
<div class="note">This connects forward to Mission 08. It is the first point in the pack where a capability and a liability turn out to be the same feature.</div>`},

{l:"RECALL",t:"Mission 05",h:"What is now owned",b:`<ul>
<li>A model has a <strong>knowledge cutoff</strong> and no knowledge of any specific organisation.</li>
<li>The <strong>context window</strong> limits what fits in one request; filling it degrades answers rather than improving them.</li>
<li>An <strong>embedding</strong> converts text to numbers so that similar meaning gives similar numbers.</li>
<li><strong>RAG</strong> searches those embeddings and attaches the closest passages to the question.</li>
<li>Many teams now start with <strong>pgvector</strong> and add a vector database only when forced to.</li>
<li><strong>Context engineering</strong> adds hybrid search, re-ranking, filtering and memory.</li>
<li><strong>MCP</strong> standardises connections to tools; <strong>A2A</strong> addresses agents talking to each other.</li>
<li>A shared standard concentrates security risk as efficiently as it spreads capability.</li>
</ul>`}
]}

,
/* ============ MISSION 06 ============ */
{n:"06",title:"Orchestration and agents",stage:"Layer 5",
bullets:["Why one model call is not a product","Tools, workflows and agents, distinguished properly","How review actually works","The second seed"],
cards:[
{l:"ORIENT",t:"Layer 5",h:"Deciding what happens <em>next</em>",b:`<p>By this point the model can run, respond quickly, and reach the right information. Something still has to decide what happens first, what happens after that, and when the job is finished.</p>
<p>A simple question-and-answer exchange is one model call. Real work almost never is. It is a sequence of steps, where each step depends on how the previous one turned out.</p>
<p>This layer is where individual model calls become completed work.</p>`},

{l:"DEFINE",t:"Tools",h:"Letting a model do rather than say",b:`<p>A model produces text. That is its only output. A <span class="k">tool</span> is a defined action the surrounding system will perform on the model's behalf — search a database, send an email, run a calculation, open a file.</p>
<div class="flow">
<div class="n"><b>1</b>The model is told which tools exist and what each one does</div>
<div class="a">&#8595;</div>
<div class="n"><b>2</b>Instead of answering, it writes a request to use one — a <span class="k">tool call</span></div>
<div class="a">&#8595;</div>
<div class="n"><b>3</b>The surrounding system performs the action and hands back the result</div>
<div class="a">&#8595;</div>
<div class="n"><b>4</b>The model continues, now knowing something it could not have known</div>
</div>
<p>The model never touches anything itself. It asks, and code it does not control decides whether to comply. That separation is the entire basis of every safety control in Mission 08.</p>`},

{l:"MECHANISM",t:"Structured output",h:"Text that software can read",b:`<p>A model writes prose. Software cannot act on prose. Something has to bridge that gap, or nothing after the model can be automated.</p>
<p>The bridge is <span class="k">structured output</span>: constraining the model to answer in a strict machine-readable format, with named fields and defined types, rather than in sentences.</p>
<div class="two"><div><b>Prose</b>"The application looks like a moderate risk, mainly because of the recent missed payments."</div>
<div><b>Structured</b>A record with a risk level, a score, and a list of reasons — each in a named field of a known type.</div></div>
<p>Modern providers can enforce this rather than request it, guaranteeing the shape of the response. That guarantee is what makes the next step in a workflow possible, because the step after can be ordinary code that knows exactly what it is receiving.</p>`},

{l:"DEFINE",t:"Workflow and agent",h:"Who decides the order",b:`<p>Two words used almost interchangeably in practice, distinguished by one thing: <strong>who chooses the sequence of steps</strong>.</p>
<div class="two"><div><b>Workflow</b>The steps are fixed in advance by a person. Step one, then two, then three. The model does the work inside each step; it does not decide what the steps are.</div>
<div><b>Agent</b>The goal is fixed; the steps are not. The model decides what to do next, does it, looks at the result, and decides again — until it judges the goal met.</div></div>
<div class="note">Agents are more capable and considerably less predictable. Most reliable production systems are closer to workflows than the language around them suggests.</div>`},

{l:"MECHANISM",t:"The loop",h:"Plan, act, observe, repeat",b:`<p>Every agent, whatever framework it is built on, runs the same loop.</p>
<div class="dg"><div class="dg-t">The agent loop</div>
<div class="flow">
<div class="n"><b>Plan</b>Given the goal and everything known so far, decide the single next step</div>
<div class="a">&#8595;</div>
<div class="n"><b>Act</b>Call a tool</div>
<div class="a">&#8595;</div>
<div class="n"><b>Observe</b>Read what came back — including failures</div>
<div class="a">&#8595;</div>
<div class="n"><b>Repeat or stop</b>Continue until the goal is met, or a limit is reached</div>
</div></div>
<p>That final clause matters. Without a hard ceiling on steps, cost or time, an agent that misjudges its progress will loop indefinitely, spending money the whole while.</p>`},

{l:"PICTURE",t:"The assistant",h:"One request, broken down",b:`<p>The coding assistant from Mission 01, working through a single request.</p>
<div class="dg"><div class="dg-t">One engineer's request</div>
<div class="flow">
<div class="n"><b>Understand</b>Retrieve the relevant parts of the company's own software — Layer 4</div>
<div class="a">&#8595;</div>
<div class="n"><b>Write</b>Produce the change. A capable model, because this step is genuinely hard</div>
<div class="a">&#8595;</div>
<div class="n"><b>Test</b>Run the automated checks the company already had. Not a model at all — ordinary software</div>
<div class="a">&#8595;</div>
<div class="n"><b>Review</b>Check the result against the team's conventions. A cheaper model suffices here</div>
<div class="a">&#8595;</div>
<div class="n"><b>Approve</b>For anything consequential, a person decides before it becomes real</div>
</div></div>
<p>Five steps, three different models, one piece of conventional software, and one human. That mixture is what a real system looks like.</p>`},

{l:"MECHANISM",t:"Review",h:"Three ways to check the work",b:`<p>An agent that acts without any check on its output is a liability. Three mechanisms are used, and mature systems use all three at once.</p>
<table>
<tr><td>Model review</td><td>A second model inspects the first one's output. Cheap, fast, catches obvious errors. Shares blind spots with the model it is checking.</td></tr>
<tr><td>Automated tests</td><td>Ordinary software that verifies whatever is objectively verifiable. Not clever, and completely trustworthy within its scope.</td></tr>
<tr><td>Human approval</td><td>A person decides before anything consequential takes effect. Slow, expensive, and the only one of the three that carries accountability.</td></tr>
</table>
<div class="note">The judgement is not whether to include a human, but where. Placed on every action, the system is useless. Placed nowhere, it is unaccountable.</div>`},

{l:"DEFINE",t:"Frameworks",h:"The names encountered here",b:`<p>Building the loop, the tool handling and the error recovery by hand is possible and tedious. Frameworks provide the scaffolding.</p>
<ul>
<li><strong>LangGraph</strong> — describes agent behaviour as a graph of steps and transitions</li>
<li><strong>CrewAI</strong> — organised around several agents with distinct assigned roles</li>
<li><strong>AutoGen</strong> — from Microsoft, oriented towards agents in conversation with each other</li>
<li><strong>OpenAI Agents SDK</strong> and <strong>Google's Agent Development Kit</strong> — first-party toolkits from the model providers</li>
</ul>
<p>They differ in style far more than in capability. None of them removes the need to understand the loop underneath, and a framework chosen before that loop is understood tends to be blamed for problems it did not cause.</p>`},

{l:"TRAP",t:"The second seed",h:"Version drift",b:`<p>Every framework, every MCP server, every command-line tool in the list above carries a version number.</p>
<p>One engineer's machine runs the newest release. A colleague's is four months behind. The company's automated testing system is on something else again, installed once and never revisited.</p>
<p>None of this is visible. Nothing warns anyone. Everything appears to work.</p>
<div class="note">Second seed planted. The first was CUDA and drivers, in Mission 02. Mission 09 collects both, along with a third, and shows they were always the same problem.</div>`},

{l:"RECALL",t:"Mission 06",h:"What is now owned",b:`<ul>
<li>A <strong>tool</strong> is an action the surrounding system performs on the model's behalf; the model only ever asks.</li>
<li>A <strong>workflow</strong> has steps fixed by a person. An <strong>agent</strong> chooses its own steps.</li>
<li>Every agent runs the same loop: plan, act, observe, repeat — and needs a hard limit.</li>
<li>Real systems mix several models, ordinary software, and human approval.</li>
<li>Review comes in three forms; mature systems use all three.</li>
<li>Frameworks provide scaffolding, not understanding.</li>
<li>Version drift compounds silently at this layer.</li>
</ul>`}
]},

/* ============ MISSION 07 ============ */
{n:"07",title:"Applications",stage:"Layer 6",
bullets:["The only layer users ever see","General assistants against vertical products","What Cursor actually owned","A lesson priced at sixty billion dollars"],
cards:[
{l:"ORIENT",t:"Layer 6",h:"Where the complexity <em>disappears</em>",b:`<p>Five layers of engineering, and none of it is visible. The person using the product sees a box to type in and an answer coming back.</p>
<p>They do not know which model answered, whether it was quantized, what was retrieved, how many steps ran, or what any of it cost. They know one thing: whether it helped.</p>
<p>This is the layer where every decision below is finally judged, on a criterion none of those decisions were expressed in.</p>`},

{l:"TRADE-OFF",t:"Two shapes",h:"General assistants and vertical products",b:`<div class="two"><div><b>General assistants</b>Claude, ChatGPT, Gemini. Enormously capable, and a crowded field. For everyday tasks a user can switch between them with little friction, which puts constant pressure on price.</div>
<div><b>Vertical products</b>Built for one industry — legal, medical, financial. Narrower by design, and far harder to displace.</div></div>
<p>The advantage of a vertical product is not model quality; it is usually the same underlying models. It is the combination of domain knowledge, proprietary data and specific workflow that a competitor cannot assemble quickly.</p>`},

{l:"MECHANISM",t:"Owning the workflow",h:"The Cursor lesson",b:`<p>Cursor is an AI coding assistant. It did not own the models, the cloud or the chips. It owned something else.</p>
<p>It placed capable models <strong>inside the program engineers were already typing into all day</strong>, rather than beside it. No switching windows, no copying text back and forth. The AI arrived where the work already was.</p>
<p>That positioning made it one of the fastest-growing software companies on record, reaching roughly four billion dollars of annualised revenue in under four years — the majority of it from enterprise customers.</p>
<div class="note">Owning the workflow and the relationship with the user turned out to be worth more than owning any layer beneath it.</div>`},

{l:"NUMBERS",t:"The valuation",h:"Sixty billion dollars",b:`<p>On 16 June 2026, SpaceX announced it would acquire Anysphere, the company behind Cursor, in an all-stock transaction valued at <strong>sixty billion dollars</strong>. It was widely described as the largest acquisition of a venture-backed startup ever recorded.</p>
<p>The deal closed on <strong>14 August 2026</strong>. Cursor is now a wholly owned subsidiary, and its team has moved into SpaceX's AI division.</p>
<table>
<tr><td>Price</td><td>$60bn, all stock — roughly 15× revenue</td></tr>
<tr><td>What was bought</td><td>The application layer. Not chips, not a frontier laboratory</td></tr>
<tr><td>Buyer's position</td><td>Already owned compute at enormous scale</td></tr>
</table>
<p>A company that owned infrastructure paid sixty billion dollars for the layer that owned the user.</p>`},

{l:"TRAP",t:"The wrapper question",h:"Thin against <em>owned</em>",b:`<p>The obvious objection to any application-layer product: it is a thin wrapper around someone else's model, and could be replicated in a weekend.</p>
<p>Sometimes entirely true. The distinguishing question is what, apart from the model, the product actually owns.</p>
<ul>
<li>Does it hold data nobody else has?</li>
<li>Does it sit inside a workflow that would be disruptive to leave?</li>
<li>Does it improve as it is used, in ways a newcomer starts without?</li>
<li>Does it carry domain knowledge that took real time to encode?</li>
</ul>
<p>None yes, and it is a wrapper. Several yes, and the model underneath is a replaceable component — which is precisely the position Cursor occupied.</p>`},

{l:"RECALL",t:"Mission 07",h:"What is now owned",b:`<ul>
<li>Users see only this layer, and judge it on whether it helped.</li>
<li><strong>General assistants</strong> compete in a crowded field with low switching costs.</li>
<li><strong>Vertical products</strong> defend through domain knowledge, proprietary data and workflow.</li>
<li>Cursor owned the workflow, not the stack, and that was the valuable position.</li>
<li>Enormous value can be created here without owning anything beneath.</li>
<li>The wrapper test is what a product owns <em>besides</em> the model.</li>
</ul>`}
]},

/* ============ MISSION 08 ============ */
{n:"08",title:"Governance and observability",stage:"Across all layers",
bullets:["The four questions every organisation eventually asks","What logs are, and what they cannot tell anyone","Guardrails and drift","Why evals are the thing that actually protects a system"],
cards:[
{l:"ORIENT",t:"The first crosscut",h:"Not a layer — a <em>column</em>",b:`<p>The six layers stack. The next two concerns run vertically through all of them, which is why they are drawn as columns rather than boxes.</p>
<p>The moment an AI system touches real company data, calls real tools and takes real actions, questions arrive that no individual layer answers.</p>
<div class="note">Cloud computing made this journey already — security treated as an afterthought until it became mandatory and unnegotiable. AI governance is walking the same road, at speed.</div>`},

{l:"MECHANISM",t:"Four questions",h:"What gets asked in production",b:`<p>The questions are always the same, and they are always asked after something has gone wrong rather than before.</p>
<table>
<tr><td>Who reached this?</td><td>Access control — which people, which systems, which data</td></tr>
<tr><td>What did it do?</td><td>Every tool call, every action, recorded in order</td></tr>
<tr><td>What did it cost?</td><td>Tokens and compute, attributed to a team or feature</td></tr>
<tr><td>Can that be proven?</td><td>Records that satisfy an auditor, not just an engineer</td></tr>
</table>
<p>Building for these from the start is ordinary work. Retrofitting them into a running system, under time pressure, after an incident, is not.</p>`},

{l:"DEFINE",t:"Observability",h:"Logs, traces and audit",b:`<p><span class="k">Observability</span> is the ability to see what a system did after it has done it. Three components, distinct in purpose.</p>
<ul>
<li><strong>Logs</strong> — individual events recorded as they happen</li>
<li><strong>Traces</strong> — the full path of one request through every step, which matters enormously when a request touched five models and three tools</li>
<li><strong>Audit records</strong> — a deliberately tamper-resistant account of who did what, kept for a defined period to satisfy an external party</li>
</ul>
<p>Ordinary software needed all three. AI systems need them more acutely, because the same input does not always produce the same output.</p>`},

{l:"DEFINE",t:"Guardrails",h:"Limits that hold regardless",b:`<p>A <span class="k">guardrail</span> is a constraint enforced by code around the model, not by instruction to the model.</p>
<p>The distinction is the whole point. Instructions are requests that a model usually honours. Guardrails are conditions that hold whether it honours them or not.</p>
<div class="two"><div><b>Input side</b>Rejecting requests that should not be processed at all, before a token is spent</div>
<div><b>Output side</b>Blocking responses containing things that must never be returned — personal data, credentials, forbidden actions</div></div>
<p>Recall Mission 06: the model asks, and separate code decides. That separation is what makes guardrails possible.</p>`},

{l:"DEFINE",t:"Drift",h:"Working systems that stop working",b:`<p>An AI system can degrade without a single line of it being changed.</p>
<ul>
<li>A hosted model is updated by its provider, and behaves slightly differently</li>
<li>The documents being retrieved change, and the old retrieval settings no longer suit them</li>
<li>Real users ask different things than the ones the system was tested against</li>
<li>Costs climb quietly because responses have grown longer</li>
</ul>
<p>This is <span class="k">drift</span>, and it is why AI systems require monitoring in a way that conventional software does not. Conventional software that worked yesterday will work today. This assumption does not carry over.</p>`},

{l:"MECHANISM",t:"Evals",h:"Logs say what. Evals say <em>better or worse</em>",b:`<p>The single most important distinction in this mission, and the most commonly skipped.</p>
<div class="two"><div><b>Logs</b>Tell what happened. Backward-looking. Necessary and insufficient.</div>
<div><b>Evals</b>A fixed set of test cases with known good answers, run after every change, to establish whether the system got better or worse.</div></div>
<p>Without evals, a team changes a prompt, a model, a retrieval setting or a tool, observes that the case they were worried about now works, and ships.</p>
<div class="note">And three other behaviours broke, silently, and nobody will notice for six weeks. This is the most common way a working AI system quietly decays.</div>`},

{l:"TRAP",t:"Agentic risk",h:"The new category",b:`<p>A model that only produces text has limited capacity to cause harm. A model that calls tools, reaches data and takes actions is a different proposition entirely.</p>
<p>New failure modes follow directly from the capability:</p>
<ul>
<li>Instructions hidden inside a document the agent retrieves, which it then follows</li>
<li>Legitimate tools combined in a sequence nobody anticipated</li>
<li>An agent granted far more access than the task required, because narrowing it was fiddly</li>
<li>A compromised shared component reaching every system that depends on it — the risk from Mission 05</li>
</ul>
<p>OWASP now publishes a dedicated top ten for agentic applications, which is a fair signal of how quickly this stopped being theoretical.</p>`},

{l:"RECALL",t:"Mission 08",h:"What is now owned",b:`<ul>
<li>Governance runs <strong>across</strong> the stack, not at one layer of it.</li>
<li>Four questions: who reached it, what did it do, what did it cost, can it be proven.</li>
<li><strong>Logs, traces and audit records</strong> serve three different purposes.</li>
<li><strong>Guardrails</strong> are enforced in code, not requested of the model.</li>
<li><strong>Drift</strong> degrades systems that nobody changed.</li>
<li><strong>Evals</strong> are the only mechanism that answers whether a change helped or hurt.</li>
<li>Agentic capability creates a distinct risk category, now formally catalogued.</li>
</ul>`}
]},

/* ============ MISSION 09 ============ */
{n:"09",title:"Reproducibility",stage:"Across all layers",
bullets:["The three seeds, collected","What an environment actually is","Docker, and what it does","One definition instead of four"],
cards:[
{l:"ORIENT",t:"The second crosscut",h:"The layer everyone <em>overlooks</em>",b:`<p>Two seeds have been planted deliberately. Driver and CUDA versions in Mission 02. Framework and tool versions in Mission 06. A third is about to be named.</p>
<p>They are the same problem wearing different clothes, and it is the most ignored concern in the entire stack — not because it is difficult, but because it is invisible until it is expensive.</p>`},

{l:"DEFINE",t:"Environment",h:"Everything around the code",b:`<p>Software never runs alone. It runs inside an <span class="k">environment</span> — the complete collection of everything present on the machine that the code depends on.</p>
<ul>
<li>The version of the programming language itself</li>
<li>Every library the code draws on, at a specific version</li>
<li>The drivers and accelerator libraries from Mission 02 — CUDA among them</li>
<li>The serving engine from Mission 04</li>
<li>The agent frameworks and MCP servers from Missions 05 and 06</li>
<li>Configuration settings the code reads when it starts</li>
</ul>
<p>Identical code, placed in two different environments, is not the same system. It only looks like one.</p>`},

{l:"DEFINE",t:"The four stages",h:"Where the code travels",b:`<p>Software passes through four distinct places on its way to real users, and each is a separate machine.</p>
<table>
<tr><td>Development</td><td>An engineer's own laptop, where the code is written</td></tr>
<tr><td>CI</td><td>Continuous Integration — a shared automated system that runs the tests every time anyone changes anything</td></tr>
<tr><td>Build</td><td>Where the finished, packaged version is produced</td></tr>
<tr><td>Production</td><td>The live system, serving actual people</td></tr>
</table>
<p>Four stages. Four machines. And the same question at each: <strong>is the environment here the same as the environment there?</strong></p>`},

{l:"PICTURE",t:"The divergence",h:"One codebase, four realities",b:`<div class="dg"><div class="dg-t">What is actually running where</div>
<div class="flow">
<div class="n"><b>Laptop</b>Whatever was installed over two years, updated at random intervals</div>
<div class="a">&#8595;</div>
<div class="n"><b>CI</b>Configured once when the project began, and never revisited since</div>
<div class="a">&#8595;</div>
<div class="n"><b>Build</b>Assembled from a packaging file somebody wrote last year and has since left</div>
<div class="a">&#8595;</div>
<div class="n"><b>Production</b>Whatever that build produced, plus emergency fixes applied by hand at two in the morning</div>
</div></div>
<p>And the third seed: <strong>the environment a model was trained in is usually not recorded anywhere at all</strong>.</p>`},

{l:"MECHANISM",t:"Nobody's fault",h:"Why the same code behaves differently",b:`<p>The same prompt and the same agent code behave one way on a laptop, another way in CI, and a third way in production.</p>
<p>The temptation is to search for a mistake. There usually is not one.</p>
<div class="note">There was never one definition of the environment. There were four, each assembled by different people at different times, and each drifting independently from the moment it was created.</div>
<p>This is why the symptom is so maddening. Nothing is broken. Nothing was done wrong. And the system behaves differently in every place it runs.</p>`},

{l:"MECHANISM",t:"The fix",h:"Environment as <em>code</em>",b:`<p>The principle is one every software team already trusts and applies to something else.</p>
<p>Code is kept under <span class="k">version control</span> — a system that records every change, by whom, and permits return to any earlier point. Nobody would work without it.</p>
<p>Reproducibility means extending exactly that treatment to the environment.</p>
<div class="flow">
<div class="n"><b>Write it down once</b>Everything the system needs — language versions, libraries, CUDA version, serving stack, agent tools, MCP servers — in a single file</div>
<div class="a">&#8595;</div>
<div class="n"><b>Version that file</b>Alongside the code, with the same history and the same review</div>
<div class="a">&#8595;</div>
<div class="n"><b>Build every stage from it</b>Laptop, CI, build and production all constructed from the identical definition</div>
</div>
<p>Secrets — passwords and keys — stay in a separate secure store. The file records only which secrets are needed, never their values.</p>`},

{l:"DEFINE",t:"Docker",h:"What a container actually does",b:`<p><span class="k">Docker</span> is the tool most people encounter first here, and it is worth defining precisely rather than by reputation.</p>
<p>Docker packages an application together with its entire environment into a single unit called a <span class="k">container</span>. The container carries the libraries, the settings and the supporting software with it. Wherever it runs, that environment travels with it, unchanged.</p>
<div class="two"><div><b>What it solves</b>The application no longer depends on whatever happens to be installed on the machine underneath it.</div>
