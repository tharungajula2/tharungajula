<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investing, India — Field Cards V01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}


/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.6px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}
.blank{border:1px dashed var(--accent-dim);border-radius:8px;padding:14px 15px;margin:20px 0;background:rgba(224,164,88,.045)}
.blank b{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.blank code{background:none;padding:0;font-size:12.5px;color:var(--ink);line-height:1.85;display:block;white-space:pre-wrap}


/* ---------- ladder & bars ---------- */
.ladder{display:flex;gap:4px;margin:8px 0 4px}
.ladder div{flex:1;padding:9px 5px;border-radius:5px;background:var(--raise);border:1px solid var(--line);text-align:center;font-size:11px;line-height:1.35}
.ladder div b{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink);letter-spacing:.06em;margin-bottom:3px}
.ladder div.w{border-color:var(--accent-dim);background:rgba(224,164,88,.09)}
.ladder div.w b{color:var(--accent)}
.ladder div.d{border-color:var(--warn);background:rgba(201,123,107,.11)}
.ladder div.d b{color:var(--warn)}
.axis{display:flex;gap:4px;margin-bottom:14px}
.axis span{flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:.05em}
.bars{margin:6px 0}
.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
@media(max-width:430px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
.row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
.row:hover .t{color:var(--accent)}
.row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
.row .t{color:var(--ink);font-size:15px;transition:color .15s}
.row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const P = {
title:"Investing, India",
sub:"For a beginner putting their own money to work over a long horizon. What the instruments are, what they cost, what the rules say, and where people actually lose.",
missions:[

/* ============ 01 ============ */
{n:"01",title:"Before any of it",stage:"Ground",
bullets:["The question that comes before which stock","Money that must not go into equity","What a realistic horizon looks like","What this pack is and is not"],
cards:[
{l:"ORIENT",t:"What this is",h:"Education, not <em>advice</em>",b:`<p>This pack explains how investing works in India — the instruments, the costs, the rules, the evidence, and the failure modes. It is written for someone starting from nothing.</p>
<p>What it deliberately does not contain: any recommendation to buy or sell anything, any view on a particular company, any prediction about where the market goes.</p>
<div class="note">Those are not omissions of modesty. A recommendation depends on circumstances no card can know — income, obligations, dependents, existing assets, tax position, and how a person actually behaves when a portfolio falls by a third. For anything personalised, the right party is a <span class="k">SEBI-registered investment adviser</span>, and that registration is checkable on SEBI's own website.</div>`},

{l:"WHY",t:"The first question",h:"Not which stock. <em>Which money</em>",b:`<p>Almost every serious loss suffered by a beginner traces to a single error, and it is not choosing the wrong share.</p>
<div class="note" style="font-size:16.5px;color:var(--ink);border-left-color:var(--accent)">Money that might be needed within the next five years does not belong in equity.</div>
<p>Not because equity is bad, but because equity is <strong>volatile on short horizons and rewarding on long ones</strong>. A portfolio can fall 30% and recover over four years — which is survivable if untouched, and a permanent loss if it must be sold in the trough to pay for something.</p>
<p>The market does not know or care about the timing of a rent payment, a medical bill or a period between jobs. The horizon has to be set by the money's purpose, before anything is bought.</p>`},

{l:"MECHANISM",t:"The order",h:"What comes <em>first</em>",b:`<p>The conventional sequence, and the reasoning behind each step rather than the step alone.</p>
<div class="flow">
<div class="n"><b>1 — High-cost debt</b>A personal loan or credit card outstanding at 14&ndash;40% is a guaranteed negative return. Clearing it beats any uncertain positive return</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — Emergency fund</b>Several months of expenses, somewhere boring and immediately accessible. This is what stops the portfolio being sold at the worst moment</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — Insurance</b>Term life if anyone depends on the income, and health cover. One uninsured event undoes years of investing</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Long-horizon money</b>Only what remains, and only what has no claim on it for years</div>
</div>
<div class="note">Step 2 is the one skipped most often and the one that does the most work. An emergency fund is not an investment — it is what makes the investments survivable.</div>`},

{l:"PICTURE",t:"Horizon",h:"Why time changes <em>everything</em>",b:`<p>Equity returns over one year are close to unpredictable. Over long periods the range narrows considerably — not because the average improves, but because good and bad years increasingly offset each other.</p>
<div class="dg"><div class="dg-t">Range of outcomes, illustrative</div>
<svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
<line x1="30" y1="75" x2="325" y2="75" stroke="#26262C" stroke-dasharray="3 3"/>
<path d="M35,15 C120,40 220,62 320,68" fill="none" stroke="#C97B6B" stroke-width="1.6"/>
<path d="M35,138 C120,112 220,88 320,82" fill="none" stroke="#7FA88A" stroke-width="1.6"/>
<text x="36" y="12" fill="#C97B6B" font-size="8.5" font-family="monospace">best case</text>
<text x="36" y="148" fill="#7FA88A" font-size="8.5" font-family="monospace">worst case</text>
<text x="250" y="72" fill="#84837E" font-size="8.5" font-family="monospace">1 yr &#8594; 20 yrs</text>
</svg></div>
<div class="note">The curves converge; they do not meet. A long horizon narrows the range of outcomes substantially. It has never guaranteed a positive one, and any presentation that suggests otherwise is selling something.</div>`},

{l:"TRAP",t:"Urgency",h:"The most expensive <em>state of mind</em>",b:`<p>The worst decisions in this field are made by people who need money quickly. The reasoning is understandable and the outcome is consistent.</p>
<ul>
<li>Needing a large return soon forces concentration into a few positions</li>
<li>Concentration raises the range of outcomes in both directions</li>
<li>A bad outcome then arrives at the exact moment it can least be absorbed</li>
<li>Which produces a forced sale, turning a temporary fall into a permanent loss</li>
</ul>
<div class="note">Markets are indifferent to need. Investing rewards money that can be left alone, and there is no version of it that reliably converts a small sum into a large one quickly. Anything presenting itself that way is either leverage, which multiplies the loss too, or a fraud.</div>`},

{l:"RECALL",t:"Mission 01",h:"Ground",b:`<ul>
<li>This is education. Personalised advice comes from a <strong>SEBI-registered adviser</strong>.</li>
<li><strong>Money needed within five years does not belong in equity.</strong></li>
<li>Order: high-cost debt, then emergency fund, then insurance, then investing.</li>
<li>The emergency fund is what stops a forced sale at the bottom.</li>
<li>Long horizons narrow the range of outcomes. They do not guarantee one.</li>
<li>Urgency is the most expensive state of mind in this field.</li>
</ul>`}
]},

/* ============ 02 ============ */
{n:"02",title:"What a share is",stage:"Ground",
bullets:["Ownership, in plain terms","Where returns actually come from","Price against value","Why prices move at all"],
cards:[
{l:"DEFINE",t:"A share",h:"A slice of a <em>business</em>",b:`<p>A company divides its ownership into units. Buying one makes the buyer a part-owner of that business — entitled to a share of its profits and, in principle, of whatever remains if it is wound up.</p>
<p>This sounds obvious and is routinely forgotten. A share price is not a number in a game. It is a claim on a real business that employs people, sells things and earns or loses money.</p>
<div class="note">Which supplies the most useful discipline available to a beginner: before buying, being able to say in one sentence what the business does and how it makes money. An inability to complete that sentence is a complete answer in itself.</div>`},

{l:"MECHANISM",t:"Returns",h:"Only <em>two</em> sources",b:`<div class="two"><div><b>Dividends</b>A portion of profit paid out to owners. Cash, arriving without anything being sold.</div>
<div><b>Capital appreciation</b>The price rising, so the holding is worth more than it cost. Realised only on sale.</div></div>
<p>Over long periods, both trace back to one thing: <strong>the business earning more money</strong>. A company whose profits grow becomes worth more and can pay out more.</p>
<div class="note">Over short periods the connection breaks down entirely. Prices move on sentiment, flows, news and expectation, and can diverge from business performance for years in either direction. The long-run link is what makes equity work; the short-run absence of it is what makes it uncomfortable.</div>`},

{l:"WHY",t:"Price and value",h:"The <em>same</em> thing?",b:`<p>Price is what a share trades at right now — set by the most recent transaction between a willing buyer and seller.</p>
<p>Value is what the business is actually worth, based on the cash it will generate over its life. Nobody knows this number; it can only be estimated.</p>
<div class="flow">
<div class="n"><b>Price</b>Observable, precise, updated every second, and frequently wrong</div>
<div class="a">&#8596;</div>
<div class="n"><b>Value</b>Unobservable, imprecise, changes slowly, and is what matters</div>
</div>
<div class="note">Active investing is the belief that the gap between the two can be identified and exploited. Passive investing is the belief that it usually cannot, at least not reliably enough to cover the cost of trying. Mission 04 takes that argument seriously in both directions.</div>`},

{l:"MECHANISM",t:"Why prices move",h:"Expectations, not <em>news</em>",b:`<p>The most counter-intuitive mechanic in markets: a company can announce excellent results and the price can fall.</p>
<p>The price already reflects what the market collectively expects. What moves it is the <strong>difference between the news and the expectation</strong>, not the news itself.</p>
<div class="dg"><div class="dg-t">Good news, three outcomes</div>
<div class="flow">
<div class="n"><b>Better than expected</b>Price rises</div>
<div class="a">&#8595;</div>
<div class="n"><b>Exactly as expected</b>Price barely moves — it was already priced in</div>
<div class="a">&#8595;</div>
<div class="n"><b>Good, but less than expected</b>Price falls, despite the news being positive</div>
</div></div>
<div class="note">This is why acting on public news rarely produces an edge. By the time it is public and understood, it is in the price. Any strategy resting on reading the same headlines as everyone else is resting on nothing.</div>`},

{l:"RECALL",t:"Mission 02",h:"Shares",b:`<ul>
<li>A share is <strong>part-ownership of a real business</strong>.</li>
<li>Returns come from <strong>dividends</strong> and <strong>price appreciation</strong>, both ultimately from earnings.</li>
<li><strong>Price</strong> is observable and often wrong. <strong>Value</strong> is unobservable and is what matters.</li>
<li>Prices move on the gap between news and <strong>expectation</strong>.</li>
<li>If the business cannot be described in one sentence, that is an answer.</li>
</ul>`}
]},

/* ============ 03 ============ */
{n:"03",title:"The Indian market",stage:"India",
bullets:["The exchanges and the indices","What is actually needed to buy anything","Who protects the investor, and how far","Settlement, and what happens after a click"],
cards:[
{l:"DEFINE",t:"The exchanges",h:"NSE and <em>BSE</em>",b:`<table>
<tr><td>BSE</td><td>Bombay Stock Exchange. Asia's oldest, founded 1875. Its headline index is the <strong>Sensex</strong> — 30 large companies.</td></tr>
<tr><td>NSE</td><td>National Stock Exchange, from 1992. Now carries the large majority of equity trading volume. Its headline index is the <strong>Nifty 50</strong>.</td></tr>
</table>
<p>Most companies are listed on both, and prices track each other closely because any meaningful gap is immediately traded away.</p>
<div class="note">An <span class="k">index</span> is simply a defined list of companies with a rule for weighting them. The Nifty 50 is a rule, not an opinion — which is precisely what makes it possible to buy the whole thing cheaply, as Mission 04 covers.</div>`},

{l:"DEFINE",t:"The plumbing",h:"Four things <em>required</em>",b:`<div class="flow">
<div class="n"><b>PAN</b>Permanent Account Number. Required for essentially all financial activity</div>
<div class="a">&#8595;</div>
<div class="n"><b>KYC</b>Identity verification. Done once, then reusable across regulated providers</div>
<div class="a">&#8595;</div>
<div class="n"><b>Demat account</b>Where shares are held electronically. Maintained through a depository — NSDL or CDSL</div>
<div class="a">&#8595;</div>
<div class="n"><b>Trading account</b>With a broker, to place orders on an exchange</div>
</div>
<div class="note">The shares sit with the depository, not with the broker. This matters: a broker failing does not make the holdings vanish, because the ownership record is held independently. Verifying that a broker is registered with SEBI and is an exchange member is a check worth making before opening anything.</div>`},

{l:"DEFINE",t:"SEBI",h:"What protection <em>covers</em>",b:`<p>The Securities and Exchange Board of India regulates the securities market — exchanges, brokers, mutual funds, advisers and listed company disclosure.</p>
<div class="two"><div><b>What it does</b>Registers and supervises intermediaries, mandates disclosure, investigates manipulation and fraud, and runs a complaint mechanism.</div>
<div><b>What it does not do</b>Guarantee returns, approve investments as safe, or compensate for losses from a legitimate investment that fell in value.</div></div>
<div class="note">The distinction is worth holding firmly, because the most common fraud pitch in India leans on blurring it — implying regulation means safety. Regulation governs conduct. It does not underwrite outcomes.</div>`},

{l:"MECHANISM",t:"Settlement",h:"What happens after the <em>click</em>",b:`<p>Placing an order does not immediately transfer shares. It goes to the exchange, is matched with a counterparty, and then settles — shares moving to the demat account and money moving out.</p>
<p>Indian equity settlement has moved progressively faster over the years, and is now among the fastest of any major market.</p>
<div class="note">Two practical consequences: the price at which an order executes may differ from the price displayed when it was placed, particularly in fast markets; and a <span class="k">limit order</span>, which specifies a maximum price, is the tool for controlling that. A <span class="k">market order</span> accepts whatever price is available, which is fine in a liquid large company and genuinely dangerous in a thinly traded one.</div>`},

{l:"RECALL",t:"Mission 03",h:"The market",b:`<ul>
<li><strong>NSE</strong> (Nifty 50) and <strong>BSE</strong> (Sensex). An index is a rule, not an opinion.</li>
<li>Required: <strong>PAN, KYC, demat, trading account</strong>.</li>
<li>Shares are held at the <strong>depository</strong> — NSDL or CDSL — not at the broker.</li>
<li>SEBI regulates conduct. It does not guarantee returns or approve anything as safe.</li>
<li><strong>Limit orders</strong> control price; market orders accept whatever is available.</li>
</ul>`}
]},

/* ============ 04 ============ */
{n:"04",title:"The vehicles",stage:"Instruments",
bullets:["Four ways to own equity","Index funds and ETFs, and the difference","The active and passive argument, fairly","What changed on 1 April 2026"],
cards:[
{l:"WHY",t:"Four routes",h:"Owning equity, four <em>ways</em>",b:`<table>
<tr><td>Direct shares</td><td>Buying individual companies. Full control, full responsibility, and the research burden sits entirely on the buyer.</td></tr>
<tr><td>Active mutual fund</td><td>A manager selects holdings, aiming to beat a benchmark. Higher cost, and the outcome depends on the manager.</td></tr>
<tr><td>Index fund</td><td>Holds whatever the index holds, in the index's proportions. No selection, low cost.</td></tr>
<tr><td>ETF</td><td>An index fund that trades on the exchange like a share. Requires a demat account; priced continuously.</td></tr>
</table>
<div class="note">Index fund and ETF hold nearly identical portfolios. The difference is mechanical: a fund transacts once a day at a computed value, an ETF trades continuously at whatever the market offers, which can sit slightly above or below the underlying value.</div>`},

{l:"MECHANISM",t:"SIP",h:"The same amount, <em>every</em> month",b:`<p>A systematic investment plan invests a fixed sum at a fixed interval, automatically, regardless of the level of the market.</p>
<div class="two"><div><b>The mechanical benefit</b>A fixed sum buys more units when prices are low and fewer when high, so the average cost per unit ends below the average price over the period.</div>
<div><b>The larger benefit</b>It removes the decision. No judgement about whether now is a good time, which is where most damage is done.</div></div>
<div class="note">Worth being accurate about the claim, since it is frequently overstated: a SIP does not guarantee profit and does not protect against a market that falls and stays down. What it reliably does is remove timing decisions from a person who has no way of making them well.</div>`},

{l:"TRADE-OFF",t:"Active and passive",h:"The argument, put <em>fairly</em>",b:`<div class="two"><div><b>The case for active</b>Markets are imperfect. A skilled manager can find mispricing, avoid deteriorating businesses, and manage risk in ways an index mechanically cannot — an index buys whatever is in it, including things that are overvalued.</div>
<div><b>The case for passive</b>Costs are certain and returns are not. A large body of evidence, in India and elsewhere, finds that a majority of active funds underperform their benchmark over long periods after fees, and that the specific funds which outperform are hard to identify in advance.</div></div>
<div class="note">Both positions are held by serious people. What is not seriously disputed is the arithmetic underneath: <strong>the average actively managed rupee must earn the market return before costs, and therefore less than it after costs.</strong> That does not mean no manager outperforms. It means outperformance cannot be the average outcome.</div>`},

{l:"NUMBERS",t:"April 2026",h:"The <em>new</em> rulebook",b:`<p>The <strong>SEBI (Mutual Funds) Regulations, 2026</strong> took effect on <strong>1 April 2026</strong>, replacing the 1996 regulations. Four changes matter to an ordinary investor.</p>
<ul>
<li><strong>TER became BER.</strong> The single Total Expense Ratio is now split — a Base Expense Ratio for the fund house's own fee, with brokerage and statutory levies such as GST, STT and stamp duty disclosed separately.</li>
<li><strong>Caps reduced.</strong> Index funds and ETFs fell from 1.00% to 0.90%; equity fund-of-funds from 2.25% to 2.10%; close-ended equity schemes from 1.25% to 1.00%.</li>
<li><strong>Brokerage limits tightened</strong>, with statutory levies charged on actuals.</li>
<li><strong>Category overlap rules.</strong> A fund house can no longer run multiple schemes with substantially overlapping mandates. Solution-oriented funds were replaced by life cycle funds.</li>
</ul>`},

{l:"TRAP",t:"Lower on paper",h:"The unbundling <em>caught</em> people out",b:`<p>The widely repeated expectation was that expense ratios would fall. The reality has been more mixed, and it is a useful lesson in reading a disclosure change carefully.</p>
<p>Because costs previously bundled are now itemised, reported totals in some categories <strong>rose</strong> after April 2026 rather than fell — the same underlying cost, more completely disclosed. Analysis of the flexi-cap category showed increases across a range of schemes.</p>
<div class="note">Two practical consequences. Figures published before April 2026 are <strong>not directly comparable</strong> with those after it. And when comparing two funds now, the comparison must be on the same basis — base expense against base expense, or total against total, never one against the other.</div>`},

{l:"RECALL",t:"Mission 04",h:"Vehicles",b:`<ul>
<li>Direct shares · active funds · index funds · ETFs.</li>
<li><strong>SIP</strong> removes the timing decision. It does not guarantee a profit.</li>
<li>The active-passive argument is real; the arithmetic of average costs is not disputed.</li>
<li><strong>SEBI (Mutual Funds) Regulations, 2026</strong> effective 1 April 2026: BER split, caps cut, categories tightened.</li>
<li>Index and ETF cap now <strong>0.90%</strong>.</li>
<li>Pre- and post-April 2026 expense figures are <strong>not comparable</strong>.</li>
</ul>`}
]},

/* ============ 05 ============ */
{n:"05",title:"What it costs",stage:"Costs",
bullets:["The only variable that is known in advance","Direct against regular plans","Every charge, named","What a small percentage does over decades"],
cards:[
{l:"WHY",t:"The certain number",h:"Returns are unknown. Costs are <em>not</em>",b:`<p>Nobody knows what a portfolio will return. Everybody can know exactly what it will be charged.</p>
<p>Which makes cost the one input under complete control, and the one where effort has a guaranteed effect rather than a hoped-for one.</p>
<div class="note">This is the least exciting mission in the pack and probably the most valuable. Cost reduction is certain, permanent and compounds — three properties that no strategy for choosing investments can claim.</div>`},

{l:"PICTURE",t:"The drag",h:"What 1% does over <em>twenty</em> years",b:`<p>Costs are charged annually on the whole balance, so their effect compounds alongside the returns — in the opposite direction.</p>
<div class="dg"><div class="dg-t">Same investment, different annual cost</div>
<svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
<line x1="30" y1="130" x2="325" y2="130" stroke="#26262C"/>
<path d="M30,130 C120,112 210,72 320,22" fill="none" stroke="#7FA88A" stroke-width="1.7"/>
<path d="M30,130 C120,116 210,86 320,48" fill="none" stroke="#E0A458" stroke-width="1.7"/>
<path d="M30,130 C120,120 210,98 320,72" fill="none" stroke="#C97B6B" stroke-width="1.7"/>
<text x="265" y="18" fill="#7FA88A" font-size="8.5" font-family="monospace">0.2% cost</text>
<text x="265" y="44" fill="#E0A458" font-size="8.5" font-family="monospace">1.0% cost</text>
<text x="265" y="68" fill="#C97B6B" font-size="8.5" font-family="monospace">2.0% cost</text>
<text x="30" y="145" fill="#84837E" font-size="8" font-family="monospace">year 0</text>
<text x="285" y="145" fill="#84837E" font-size="8" font-family="monospace">year 20</text>
</svg></div>
<div class="note">The gap widens rather than staying proportional, because the money removed each year is also money that would have compounded. A difference that looks trivial in year one is substantial by year twenty. Every basis point not paid is a basis point that keeps working.</div>`},

{l:"MOVE",t:"Direct and regular",h:"The <em>same</em> fund, two prices",b:`<p>Nearly every mutual fund is sold in two versions holding identical portfolios and managed identically.</p>
<div class="two"><div><b>Regular plan</b>Includes a distribution commission paid to whoever sold it. Higher annual cost, permanently.</div>
<div><b>Direct plan</b>Bought without an intermediary. No commission component. Lower annual cost, same portfolio.</div></div>
<p>The difference persists for as long as the investment is held, and compounds exactly as the previous card describes.</p>
<div class="note">The honest counterpoint: a good adviser earns their fee by preventing expensive behavioural mistakes, which Mission 07 shows are far larger than any expense ratio. The question is whether advice is actually being received. Paying a distribution commission and receiving nothing in return is the outcome worth avoiding, and it is common.</div>`},

{l:"RECALL",t:"Every charge",h:"Named, one place",b:`<table>
<tr><td>Base expense ratio</td><td>The fund house's fee, charged annually on the balance. Deducted before the published value.</td></tr>
<tr><td>Brokerage and levies</td><td>Disclosed separately since April 2026 — GST, STT, stamp duty, transaction costs.</td></tr>
<tr><td>Brokerage (own trades)</td><td>Charged by the broker per trade. Several now charge nothing on delivery equity.</td></tr>
<tr><td>STT</td><td>Securities transaction tax, on both sides of an equity trade.</td></tr>
<tr><td>Stamp duty</td><td>On purchase.</td></tr>
<tr><td>Exchange and regulatory fees</td><td>Small, per transaction.</td></tr>
<tr><td>GST</td><td>On brokerage and on several of the above.</td></tr>
<tr><td>Demat charges</td><td>Annual maintenance, and debit charges on sale, varying by provider.</td></tr>
<tr><td>Exit load</td><td>Charged by some funds on redemption within a defined period.</td></tr>
</table>
<div class="note">Per-transaction charges are the argument against frequent trading independent of any view on whether trading works. Each round trip pays these again.</div>`},

{l:"RECALL",t:"Mission 05",h:"Costs",b:`<ul>
<li>Returns are unknown; <strong>costs are known</strong> and controllable.</li>
<li>Cost compounds against the investor exactly as returns compound for them.</li>
<li><strong>Direct plans</strong> hold the same portfolio without the distribution commission.</li>
<li>A good adviser can be worth their fee. A commission with no advice attached is not.</li>
<li>Per-transaction charges make frequent trading expensive on their own terms.</li>
</ul>`}
]},

/* ============ 06 ============ */
{n:"06",title:"Tax",stage:"India",
bullets:["The current rates, dated and verified","Holding period, and what it changes","Dividends and losses","What tax should and should not drive"],
cards:[
{l:"NUMBERS",t:"Equity",h:"The rates, <em>current</em>",b:`<table>
<tr><td>Holding period</td><td>More than <strong>12 months</strong> makes listed equity and equity mutual funds long-term.</td></tr>
<tr><td>LTCG</td><td><strong>12.5%</strong> on gains above <strong>₹1.25 lakh</strong> per financial year. No indexation. Section 112A.</td></tr>
<tr><td>STCG</td><td><strong>20%</strong>, for transfers on or after 23 July 2024. Section 111A.</td></tr>
<tr><td>Cess</td><td>4% on the tax, plus surcharge where income thresholds are crossed.</td></tr>
</table>
<div class="note">Verified for FY 2026&ndash;27. Budget 2024 raised these from 10% and 15% and lifted the exemption from ₹1 lakh; Budget 2026 made no further change. Rates move with budgets — confirm against the current position before relying on them.</div>`},

{l:"NUMBERS",t:"The rest",h:"Dividends, debt, <em>losses</em>",b:`<table>
<tr><td>Dividends</td><td>Added to total income and taxed at the applicable slab rate. TDS of 10% where dividend from one fund house exceeds ₹5,000 in a year.</td></tr>
<tr><td>Debt-oriented funds</td><td>For investments on or after 1 April 2023, taxed at slab rate regardless of holding period. No indexation, no long-term distinction.</td></tr>
<tr><td>Short-term losses</td><td>Set off against both short-term and long-term gains.</td></tr>
<tr><td>Long-term losses</td><td>Set off against long-term gains only.</td></tr>
<tr><td>Carry forward</td><td>Unused losses carry forward up to 8 assessment years, provided the return is filed on time.</td></tr>
</table>
<div class="note">The asymmetry in loss set-off is worth remembering — a long-term loss cannot shelter a short-term gain, though the reverse works.</div>`},

{l:"MECHANISM",t:"The threshold",h:"What the exemption <em>does</em>",b:`<p>The ₹1.25 lakh exemption applies per financial year, to the person rather than to any single holding. Long-term gains below it attract no tax at all.</p>
<div class="flow">
<div class="n"><b>Gain of ₹1,00,000</b>Entirely within the exemption. No tax</div>
<div class="a">&#8595;</div>
<div class="n"><b>Gain of ₹3,00,000</b>₹1,25,000 exempt. ₹1,75,000 taxed at 12.5%, plus cess</div>
</div>
<div class="note">The exemption resets each financial year and does not accumulate. Unused exemption is simply lost — which is a factual observation, not a suggestion to sell for the purpose of using it.</div>`},

{l:"TRAP",t:"The tail wagging",h:"Tax as a <em>reason</em>",b:`<p>Tax is a consequence of a decision, not usually a reason for one. Two failure modes recur.</p>
<div class="two"><div><b>Holding a poor investment</b>Refusing to sell something that should be sold, purely to avoid crystallising tax. The tax is a fraction of the gain; the continued exposure is all of it.</div>
<div><b>Selling a good one</b>Disposing of something that should be held, in order to manufacture a tax outcome.</div></div>
<div class="note">Tax rules also change, and a strategy built primarily around a current rate is exposed to the next budget. This is genuinely a place where a qualified professional earns their fee, because the interaction with total income, slab and surcharge is specific to the person.</div>`},

{l:"RECALL",t:"Mission 06",h:"Tax",b:`<ul>
<li>Equity long-term after <strong>12 months</strong>. <strong>LTCG 12.5%</strong> above <strong>₹1.25 lakh</strong>. <strong>STCG 20%</strong>. Plus 4% cess.</li>
<li>Dividends at slab; TDS 10% above ₹5,000 from one fund house.</li>
<li>Debt funds bought on or after 1 April 2023: <strong>slab rate</strong>, any holding period.</li>
<li>Short-term losses offset both; long-term losses offset long-term only. Carry forward 8 years.</li>
<li>The exemption is annual, per person, and does not accumulate.</li>
<li>Tax is a consequence of a decision, not usually the reason for one.</li>
</ul>`}
]}
,
/* ============ 07 ============ */
{n:"07",title:"Risk",stage:"Risk",
bullets:["The two things both called risk","Drawdowns, and what they feel like","Diversification, and what it cannot fix","Concentration, including the invisible kind"],
cards:[
{l:"WHY",t:"Two meanings",h:"Volatility and <em>permanent loss</em>",b:`<div class="two"><div><b>Volatility</b>The price moves around, sometimes violently. Uncomfortable, and temporary if the business is sound and the holding is not sold.</div>
<div><b>Permanent loss</b>The money does not come back. The business fails, the thesis was wrong, or the holding was sold at the bottom.</div></div>
<p>Both get called risk, and conflating them causes damage in both directions — treating every fall as a disaster, or treating a genuine deterioration as noise to be ignored.</p>
<div class="note">The critical link: <strong>volatility becomes permanent loss the moment a sale is forced.</strong> This is the mechanism by which a short horizon converts a survivable fall into a real loss, and it is why Mission 01 comes first.</div>`},

{l:"NUMBERS",t:"Drawdowns",h:"What the record actually <em>contains</em>",b:`<p>Long-run equity returns are quoted as smooth averages. The path is not smooth, and the difference is where investors are lost.</p>
<ul>
<li>Falls of 10% or more occur frequently — often more than once in a year</li>
<li>Falls of 20% or more have occurred repeatedly across market history</li>
<li>Falls of 40&ndash;50% have occurred in major dislocations, in India and globally</li>
<li>Recovery has historically followed, but has sometimes taken years</li>
</ul>
<div class="note">A 50% fall requires a 100% gain to return to level. That asymmetry is arithmetic, not pessimism, and it is the reason position sizing and diversification matter more than being right.</div>`},

{l:"MECHANISM",t:"Diversification",h:"What it fixes, and what it <em>does not</em>",b:`<div class="two"><div><b>Fixes company-specific risk</b>One business failing. Spread across many holdings, a single failure is survivable rather than fatal.</div>
<div><b>Does not fix market risk</b>Everything falling together. In a real dislocation, correlations rise and diversification within equity helps much less than expected.</div></div>
<p>Which is the argument for diversifying across <em>asset types</em>, not only across shares — because holding forty companies that all fall together is a single position wearing a disguise.</p>
<div class="note">The uncomfortable property: diversification works least well exactly when it is needed most. It is still worth doing. It is simply not the protection it is often presented as.</div>`},

{l:"TRAP",t:"Hidden concentration",h:"Diversified on <em>paper</em>",b:`<p>A portfolio can look spread out and be a single bet in several forms.</p>
<ul>
<li>Four funds that all hold the same large companies at the top</li>
<li>An index fund plus an active fund that largely tracks the same index</li>
<li>Employer shares, plus employment at that employer — income and savings on one outcome</li>
<li>Equities plus property in the same city, exposed to the same local economy</li>
<li>Several sector funds in adjacent sectors that move together</li>
</ul>
<div class="note">The check is to look through to the actual underlying holdings rather than counting products. Fund fact sheets list top holdings, and the overlap between two similarly-named funds is frequently large. SEBI's 2026 category overlap rules address part of this at the fund-house level, but not what an individual assembles.</div>`},

{l:"RECALL",t:"Mission 07",h:"Risk",b:`<ul>
<li><strong>Volatility</strong> is temporary. <strong>Permanent loss</strong> is not. A forced sale converts one into the other.</li>
<li>Large falls are a normal feature of the record, not an aberration.</li>
<li>A 50% fall needs a 100% gain to recover.</li>
<li>Diversification fixes company risk, not market risk, and helps least in a crisis.</li>
<li>Look through to <strong>holdings</strong>, not product count.</li>
</ul>`}
]},

/* ============ 08 ============ */
{n:"08",title:"Behaviour",stage:"The real variable",
bullets:["Why the investor underperforms the investment","Timing, and why it fails","The specific biases, named","What actually works against them"],
cards:[
{l:"WHY",t:"The gap",h:"The fund returns more than its <em>investors</em>",b:`<p>A repeatedly documented finding across markets: the average investor in a fund earns less than the fund itself reports.</p>
<p>The fund's return assumes money invested at the start and left alone. Real investors add after good periods and withdraw after bad ones — buying more at higher prices and less at lower ones.</p>
<div class="note">The gap is behavioural, not analytical. It is created entirely by the timing of contributions and withdrawals, and it is routinely larger than the difference between a good fund and a mediocre one. Which means behaviour, not selection, is the dominant variable — and it receives a fraction of the attention.</div>`},

{l:"MECHANISM",t:"Timing",h:"Why getting out and back in <em>fails</em>",b:`<p>Selling before a fall and buying before a rise requires being right twice — on the exit and on the re-entry — and the second is far harder than the first.</p>
<div class="flow">
<div class="n"><b>The exit</b>Usually happens after a large fall, when the reasons to sell feel overwhelming</div>
<div class="a">&#8595;</div>
<div class="n"><b>The wait</b>Re-entry requires conditions to feel safe again</div>
<div class="a">&#8595;</div>
<div class="n"><b>The problem</b>Conditions feel safe only well after prices have already recovered</div>
</div>
<div class="note">Compounding this: long-run returns are concentrated in a small number of very strong days, and those days cluster near the worst ones. Being out of the market during a handful of them materially reduces the whole period's return — and they are only identifiable afterwards.</div>`},

{l:"WHY",t:"The biases",h:"Named, so they can be <em>spotted</em>",b:`<table>
<tr><td>Loss aversion</td><td>A loss hurts more than an equivalent gain pleases. Produces selling to stop the feeling.</td></tr>
<tr><td>Recency</td><td>Recent experience feels like the permanent state. Produces buying after rises and selling after falls.</td></tr>
<tr><td>Overconfidence</td><td>Attributing gains to skill and losses to bad luck. Produces more trading and more concentration.</td></tr>
<tr><td>Confirmation</td><td>Seeking information that supports a position already held. Produces holding through genuine deterioration.</td></tr>
<tr><td>Anchoring</td><td>Fixating on the purchase price. Produces refusal to sell at a loss regardless of the current case.</td></tr>
<tr><td>Herding</td><td>Comfort in doing what everyone else is doing. Produces arrival at the top.</td></tr>
</table>
<div class="note">Naming them does not remove them. Knowing about loss aversion does not stop a 30% fall feeling terrible. What naming does is make the feeling identifiable as a known pattern rather than as new information about the market.</div>`},

{l:"MOVE",t:"Structure over willpower",h:"What actually <em>works</em>",b:`<p>The reliable defences are structural, because they act before the emotional moment arrives rather than during it.</p>
<ul>
<li><strong>Automate contributions.</strong> A standing instruction does not consult the news.</li>
<li><strong>Write the plan down.</strong> What is held, why, and what would justify selling. Written when calm, consulted when not.</li>
<li><strong>Define sell conditions in advance</strong> — business reasons, not price reasons.</li>
<li><strong>Look less often.</strong> Checking a portfolio daily produces many opportunities to see a loss and few to act well.</li>
<li><strong>Rebalance on a schedule</strong>, not on a feeling. It mechanically enforces selling what rose and buying what fell.</li>
<li><strong>Keep the emergency fund intact.</strong> The best defence against selling in a panic is not needing to.</li>
</ul>
<div class="note">Every item works by removing a decision from a moment when judgement is worst. None depends on being calm, because the assumption that anyone will be calm is exactly what fails.</div>`},

{l:"RECALL",t:"Mission 08",h:"Behaviour",b:`<ul>
<li>Investors typically earn less than their own funds report. The gap is <strong>timing</strong>.</li>
<li>Market timing requires being right <strong>twice</strong>, and re-entry is the harder half.</li>
<li>Returns concentrate in a few days, which cluster near the worst ones.</li>
<li>Six biases: loss aversion, recency, overconfidence, confirmation, anchoring, herding.</li>
<li>Defences are <strong>structural</strong>, not emotional. Automate, write it down, look less.</li>
</ul>`}
]},

/* ============ 09 ============ */
{n:"09",title:"Building a portfolio",stage:"Construction",
bullets:["Allocation, which decides most of it","Goals before instruments","Rebalancing, and what it enforces","A first portfolio, plainly"],
cards:[
{l:"WHY",t:"Allocation",h:"The decision that decides <em>most</em> of it",b:`<p>The split between broad asset types — equity, debt, gold, cash — explains far more of a portfolio's behaviour over time than the selection of individual holdings within those types.</p>
<p>Which is an awkward finding, because allocation is a single dull decision and selection is endlessly discussable.</p>
<div class="note">Practically: an hour spent deciding what proportion belongs in equity at all is worth more than a week spent choosing between two large-cap funds. The attention usually goes the other way round.</div>`},

{l:"MECHANISM",t:"Goals first",h:"Horizon sets the <em>instrument</em>",b:`<p>Money is not one pool. Different money has different jobs, and the job determines what it can hold.</p>
<table>
<tr><td>Under 2 years</td><td>Capital preservation dominates. Equity is inappropriate at this horizon regardless of the outlook.</td></tr>
<tr><td>2 to 5 years</td><td>A genuine grey zone. Equity remains capable of being down at the end of it.</td></tr>
<tr><td>Beyond 7 to 10 years</td><td>The horizon over which equity's range of outcomes has historically narrowed meaningfully.</td></tr>
</table>
<div class="note">The reasoning runs from the money's purpose to the instrument, never the reverse. Starting from an attractive-looking investment and then finding money for it is how short-horizon money ends up in long-horizon assets.</div>`},

{l:"MOVE",t:"Rebalancing",h:"Enforcing what feels <em>wrong</em>",b:`<p>Over time, whatever performed best grows into a larger share of the portfolio, so the actual allocation drifts away from the intended one — and drifts towards whatever has recently done well.</p>
<div class="flow">
<div class="n"><b>Set</b>A target allocation, decided when calm</div>
<div class="a">&#8595;</div>
<div class="n"><b>Drift</b>The strongest performer grows beyond its share</div>
<div class="a">&#8595;</div>
<div class="n"><b>Rebalance</b>Sell some of what rose, buy what lagged, return to target</div>
</div>
<div class="note">This mechanically sells high and buys low, which is the thing everyone intends and almost nobody does — because at the moment of doing it, it means selling what is working. Doing it on a fixed schedule rather than a judgement is the point. Note that selling to rebalance can trigger tax, so directing new contributions towards the underweight asset is often the cheaper route.</div>`},

{l:"MECHANISM",t:"A first portfolio",h:"The <em>shape</em>, not a recommendation",b:`<p>What a straightforward long-horizon portfolio typically looks like, described so the reasoning is visible rather than the numbers copied.</p>
<ul>
<li><strong>A broad Indian equity index fund</strong> as the core — wide exposure at low cost, no selection decision</li>
<li><strong>Some international equity</strong> — India is a single economy and a single currency</li>
<li><strong>A debt component</strong> sized to the horizon and to how much volatility is genuinely tolerable</li>
<li><strong>Optionally gold</strong>, which has historically behaved differently from equity in stress</li>
<li><strong>Contributions automated</strong>, and rebalanced on a schedule</li>
</ul>
<div class="note">Deliberately no percentages. The right split depends on horizon, income stability, obligations and behaviour under stress — none of which a card can know. That is the point at which a registered adviser is genuinely worth paying, and the point at which any specific number from any general source should be treated with suspicion.</div>`},

{l:"TRAP",t:"Complexity",h:"More holdings is not more <em>sophisticated</em>",b:`<p>A common trajectory: enthusiasm produces fourteen funds, six of which overlap heavily, three chosen for past performance, and two nobody can now explain.</p>
<p>The costs are real — overlap without diversification, more to track, more tax events, more opportunities to tinker, and an inability to say what the portfolio is actually betting on.</p>
<div class="note">A useful test: being able to explain, in two sentences and without notes, what is held and why. Failing that test is a signal to simplify rather than to research harder.</div>`},

{l:"RECALL",t:"Mission 09",h:"Construction",b:`<ul>
<li><strong>Allocation</strong> explains more than selection.</li>
<li>Horizon determines instrument. Under two years, equity is inappropriate.</li>
<li><strong>Rebalance on a schedule</strong>; direct new money to the underweight asset to avoid tax.</li>
<li>Broad index core, some international, debt sized to horizon, automated.</li>
<li>If the portfolio cannot be explained in two sentences, simplify.</li>
</ul>`}
]},

/* ============ 10 ============ */
{n:"10",title:"Reading a company",stage:"If picking",
bullets:["The honest framing first","What the three statements say","Ratios that carry weight","Where beginners go wrong"],
cards:[
{l:"ORIENT",t:"The honest framing",h:"Before any of <em>this</em>",b:`<p>This mission exists because the question always gets asked. It opens with the finding that matters most.</p>
<p>Studies across markets consistently find that the majority of individual investors picking their own stocks underperform a simple index over long periods, after costs and taxes. Not through stupidity — through trading too much, concentrating too heavily, and competing against full-time professionals with better information.</p>
<div class="note">This does not mean nobody should pick stocks. It means the reasonable version is a <strong>bounded</strong> one: a defined, modest portion of the portfolio, with the core held in something broad, so that the outcome of the experiment is survivable and measurable against a benchmark.</div>`},

{l:"DEFINE",t:"Three statements",h:"What each one <em>answers</em>",b:`<table>
<tr><td>Profit and loss</td><td>Did it make money over the period? Revenue, costs, profit.</td></tr>
<tr><td>Balance sheet</td><td>What does it own and owe at a point in time? Assets, liabilities, equity.</td></tr>
<tr><td>Cash flow</td><td>Did actual cash move? Operating, investing, financing.</td></tr>
</table>
<div class="note">The cash flow statement is the least read and the hardest to dress up. Profit involves judgement about when revenue is recognised and how costs are spread. Cash either arrived or it did not. Where reported profit rises steadily while operating cash flow does not follow, that divergence is the most useful single signal available in the accounts.</div>`},

{l:"NUMBERS",t:"The ratios",h:"What each one actually <em>asks</em>",b:`<table>
<tr><td>P/E</td><td>Price relative to earnings. How many years of current earnings the price represents. Meaningless without a comparison — to the sector, and to the company's own history.</td></tr>
<tr><td>Debt / equity</td><td>How much is borrowed. High debt magnifies both directions and removes options in a downturn.</td></tr>
<tr><td>ROE</td><td>Return on equity. How efficiently owners' money is turned into profit. Check whether it is high because of genuine returns or because of heavy borrowing.</td></tr>
<tr><td>Operating margin</td><td>Profit as a share of revenue. The trend matters more than the level.</td></tr>
<tr><td>Interest coverage</td><td>Whether earnings comfortably cover interest. Where this falls towards 1, the situation is serious.</td></tr>
</table>
<div class="note">Ratios are questions, not answers. A low P/E may mean the company is cheap or that the market expects earnings to fall — and the ratio itself cannot distinguish between the two.</div>`},

{l:"TRAP",t:"Common errors",h:"Where it goes <em>wrong</em>",b:`<ul>
<li><strong>Buying on price history.</strong> Past rises are not a reason. What matters is the business relative to today's price.</li>
<li><strong>Confusing a good company with a good investment.</strong> An excellent business at an excessive price is a poor investment.</li>
<li><strong>Ignoring debt.</strong> Leverage is invisible in good times and decisive in bad ones.</li>
<li><strong>Reading one year.</strong> A single period says almost nothing. Five shows trajectory.</li>
<li><strong>Trusting the story.</strong> A compelling narrative about the future is easier to produce than cash flow.</li>
<li><strong>Not defining the exit.</strong> Without knowing in advance what would prove the thesis wrong, every fall becomes a buying opportunity.</li>
</ul>
<div class="note">That last one is the discipline that separates investing from hoping. It has to be written down before purchase, because afterwards the reasoning bends towards the position already held.</div>`},

{l:"RECALL",t:"Mission 10",h:"Companies",b:`<ul>
<li>Most individual stock pickers underperform an index. Bound the experiment.</li>
<li>P&amp;L, balance sheet, cash flow — and <strong>cash flow is hardest to dress up</strong>.</li>
<li>Ratios are questions, not answers. Compare to sector and to history.</li>
<li>A good company at a bad price is a bad investment.</li>
<li><strong>Write down what would prove the thesis wrong, before buying.</strong></li>
</ul>`}
]},

/* ============ 11 ============ */
{n:"11",title:"Where money is lost",stage:"Traps",
bullets:["Derivatives, and what the data shows","Tips, groups and unregistered advice","Products that are not investments","How to check anything, in two minutes"],
cards:[
{l:"TRAP",t:"F&O",h:"The clearest evidence in the <em>whole</em> field",b:`<p>Futures and options are contracts whose value derives from an underlying asset. They are leveraged, meaning a small move produces a large gain or loss, and they expire.</p>
<p>SEBI has published studies of individual traders in equity derivatives. The findings have been consistent and stark: the overwhelming majority — around nine in ten — lose money, and aggregate individual losses run into very large sums.</p>
<div class="note">Rarely is evidence in finance this one-sided. Leverage plus expiry plus transaction costs plus competing against professional counterparties produces a distribution in which most participants lose. This is not a warning about doing it badly; it describes the typical outcome of doing it at all.</div>`},

{l:"TRAP",t:"Tips",h:"Why the free tip <em>exists</em>",b:`<p>The question worth asking of any unsolicited recommendation: what does the sender gain?</p>
<ul>
<li><strong>Pump and dump.</strong> Accumulate a thinly traded stock, promote it, sell into the buying it creates. Illegal, and common.</li>
<li><strong>Commission.</strong> The recommendation pays whoever made it, regardless of outcome.</li>
<li><strong>Subscription.</strong> The product is the tip service; performance is unaudited and losers churn out quietly.</li>
<li><strong>Front-running.</strong> Position taken before the recommendation goes out.</li>
</ul>
<div class="note">Genuinely valuable, non-public investment information is worth money to the person holding it. The strong prior on anything arriving free and unsolicited is that the sender profits from the recipient acting, not from the recipient being right.</div>`},

{l:"TRAP",t:"Not investments",h:"Products that <em>look</em> like one",b:`<table>
<tr><td>Insurance-linked investment</td><td>Bundles life cover with investment. Typically expensive on both sides, opaque, and hard to exit. Separating term insurance from investment is usually cheaper and clearer.</td></tr>
<tr><td>Guaranteed return schemes</td><td>Returns materially above what government securities pay, described as guaranteed, are either mispriced risk or a fraud.</td></tr>
<tr><td>Unregistered advisory</td><td>Anyone providing personalised investment advice for consideration in India requires SEBI registration.</td></tr>
<tr><td>Crypto-style guarantees</td><td>Fixed returns promised on a volatile asset. The guarantee is the claim to examine, not the asset.</td></tr>
</table>
<div class="note">One durable structural signal: an entity offering both a high fixed return <strong>and</strong> full liquidity is claiming to have solved a trade-off nobody has solved. Something in the description is untrue.</div>`},

{l:"MOVE",t:"The two-minute check",h:"Before <em>anything</em>",b:`<div class="flow">
<div class="n"><b>1 — Is the entity registered?</b>SEBI publishes registers of intermediaries and investment advisers. Check the register directly, not a certificate that was sent</div>
<div class="a">&#8595;</div>
<div class="n"><b>2 — How does this party get paid?</b>If the answer is unclear or the person is reluctant, that is the answer</div>
<div class="a">&#8595;</div>
<div class="n"><b>3 — What is the exit?</b>How money is withdrawn, how long it takes, what it costs</div>
<div class="a">&#8595;</div>
<div class="n"><b>4 — Is there urgency?</b>Manufactured time pressure exists to prevent step 1</div>
</div>
<div class="note">Legitimate investments survive all four questions comfortably. Frauds fail at least one, usually the fourth, and the pressure to skip the check is itself the strongest signal available.</div>`},

{l:"RECALL",t:"Mission 11",h:"Traps",b:`<ul>
<li><strong>F&amp;O</strong>: SEBI's own studies show roughly nine in ten individual traders lose money.</li>
<li>Ask what the sender of any tip gains from the recipient acting.</li>
<li>High fixed return <strong>plus</strong> full liquidity is a claim that something has been solved. It has not.</li>
<li>Personalised advice for consideration requires <strong>SEBI registration</strong>. Check the register.</li>
<li>Four questions: registered · paid how · exit how · why the hurry.</li>
</ul>`}
]},

/* ============ 12 ============ */
{n:"12",title:"The card",stage:"Recall",
bullets:["Every number, dated","Every trap","The order of operations","What holds when everything else changes"],
cards:[
{l:"RECALL",t:"The numbers",h:"India, <em>dated</em>",b:`<table>
<tr><td>Equity long-term</td><td>Held more than 12 months</td></tr>
<tr><td>LTCG</td><td>12.5% above ₹1.25 lakh per year, no indexation</td></tr>
<tr><td>STCG</td><td>20%, for transfers on or after 23 July 2024</td></tr>
<tr><td>Cess</td><td>4% on tax, plus surcharge at thresholds</td></tr>
<tr><td>Dividends</td><td>Slab rate; 10% TDS above ₹5,000 from one fund house</td></tr>
<tr><td>Debt funds</td><td>Bought on or after 1 Apr 2023: slab rate, any holding period</td></tr>
<tr><td>Loss carry-forward</td><td>8 assessment years, if the return is filed on time</td></tr>
<tr><td>MF regulations</td><td>SEBI (Mutual Funds) Regulations, <strong>2026</strong> — effective 1 Apr 2026</td></tr>
<tr><td>Index / ETF cost cap</td><td>0.90%, reduced from 1.00%</td></tr>
<tr><td>Expense disclosure</td><td>BER, with brokerage and levies shown separately</td></tr>
</table>
<div class="note">Verified August 2026. Tax rates move with budgets and SEBI rules change; every row here should be confirmed against the current position before it is relied on. This is the fastest-staling card in the pack.</div>`},

{l:"RECALL",t:"Traps",h:"Every trap, gathered",b:`<table>
<tr><td>Short-horizon money in equity</td><td>The error behind most serious beginner losses.</td></tr>
<tr><td>Investing before the emergency fund</td><td>Guarantees a forced sale at the worst moment.</td></tr>
<tr><td>Urgency</td><td>Forces concentration exactly when loss can least be absorbed.</td></tr>
<tr><td>Acting on public news</td><td>Already in the price.</td></tr>
<tr><td>Assuming regulation means safety</td><td>SEBI governs conduct, not outcomes.</td></tr>
<tr><td>Regular plans without advice</td><td>Paying a commission and receiving nothing.</td></tr>
<tr><td>Comparing pre- and post-April 2026 expenses</td><td>Different basis. Not comparable.</td></tr>
<tr><td>Tax driving the decision</td><td>Tax is a consequence, not usually a reason.</td></tr>
<tr><td>Confusing volatility with permanent loss</td><td>A forced sale is what converts one into the other.</td></tr>
<tr><td>Hidden concentration</td><td>Count holdings, not products.</td></tr>
<tr><td>Market timing</td><td>Requires being right twice; re-entry is the harder half.</td></tr>
<tr><td>Chasing past performance</td><td>The most consistently unrewarded habit there is.</td></tr>
<tr><td>Good company, bad price</td><td>Still a bad investment.</td></tr>
<tr><td>No written exit condition</td><td>Every fall becomes a buying opportunity.</td></tr>
<tr><td>F&amp;O</td><td>Around nine in ten individual traders lose money.</td></tr>
<tr><td>Free unsolicited tips</td><td>The sender profits from the action, not the outcome.</td></tr>
</table>`},

{l:"RECALL",t:"The order",h:"Operations, in <em>sequence</em>",b:`<ol style="list-style:none;padding:0;margin:0">
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">1</span>Clear high-cost debt</li>
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">2</span>Build the emergency fund, somewhere boring and accessible</li>
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">3</span>Term insurance if anyone depends on the income, and health cover</li>
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">4</span>Separate money by horizon; only long-horizon money reaches equity</li>
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">5</span>Decide the allocation before choosing any product</li>
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">6</span>Choose low-cost, broad, direct-plan instruments for the core</li>
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">7</span>Automate contributions</li>
<li style="padding-left:22px;position:relative;margin-bottom:10px"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">8</span>Write the plan down while calm</li>
<li style="padding-left:22px;position:relative"><span style="position:absolute;left:0;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px">9</span>Rebalance on a schedule. Otherwise, leave it alone</li>
</ol>`},

{l:"CLOSE",t:"What holds",h:"When everything else <em>changes</em>",b:`<p>Rates move with budgets. SEBI rewrites its regulations. Products appear and vanish. Almost every specific figure in this pack has a shelf life, and the card before last says so plainly.</p>
<p>What does not change is shorter, and is the part worth carrying.</p>
<div class="note" style="font-size:16.5px;color:var(--ink);border-left-color:var(--accent)">Costs are certain and returns are not. Time in the market beats timing it. The money must be able to stay where it is put. And nobody offering a shortcut is offering it out of generosity.</div>
<p>Everything in the preceding eleven missions is an elaboration of those four sentences.</p>
<div class="rule"></div>
<div class="meta">
V01 &nbsp;·&nbsp; the beginner's card — complete<br>
Education, not advice &nbsp;·&nbsp; for anything personal, a SEBI-registered adviser<br>
Tax and regulatory positions verified August 2026
</div>`}
]}
]};


/* ---------- build the scroll ---------- */
const main=document.getElementById('main'), rail=document.getElementById('rail');
const lc=l=>(l==='TRAP'||l==='TRADE-OFF')?'label q':(l==='RECALL'?'label r':'label');
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards &nbsp;/&nbsp; Version 01</div>
  <h1>The <em>AI Stack</em></h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>Written for one sitting &nbsp;·&nbsp; No prior knowledge assumed<br>August 2026</div>
  <div class="note" style="margin-top:26px">Version 01 is the <strong>map</strong>: what every part of an AI system is, what it does, and where it sits. It goes wide and stops before depth. Later versions go down, one layer at a time, and each begins exactly where this one ends.</div>
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    <div class="inthis">In this mission</div>
    <ul>${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\u0027\u0027\u0027[\\s\\S]*?\u0027\u0027\u0027|"(?:[^"\\\\\\n]|\\\\.)*"|\u0027(?:[^\u0027\\\\\\n]|\\\\.)*\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'python';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
const rev=new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
},{rootMargin:'0px 0px -8% 0px',threshold:.04});
secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
</body>
</html>
