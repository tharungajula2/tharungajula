    <text x="150" y="151" font-size="9" fill="#6FBF9B" text-anchor="middle" font-weight="500">communication</text>
    <circle cx="150" cy="82" r="4" fill="#EDEAE4"/>
    <text x="150" y="172" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84" text-anchor="middle" letter-spacing="1">ALL THREE → EXFILTRATION ACHIEVABLE</text>
  </g>
</svg>
<div class="cap">Remove <b>any one</b> and the entire attack class collapses</div>
</div>
<p>An agent with access to private data, that reads content an attacker can influence, and that can send information outward, can be made to send the private data outward. The instruction arrives inside the untrusted content and is read as an instruction, because there is only one channel.</p>
<div class="note g"><div class="lab">How to use this</div><p><b>Check it against the architecture diagram before any code is written.</b> It is a design-time test, not a review-time one. If all three are present, one must be removed — and removing one is nearly always cheaper than defending the combination.</p><p>The standard structural answer: an untrusted reader with <b>no tools at all</b> processes external content and emits schema-validated structure; a privileged agent acts on that structure and <b>never sees the raw external text</b>.</p></div>
<div class="note q"><div class="lab">One rule that closes most practical paths</div><p><b>Never fetch a model-generated URL.</b> Image loads, link previews and webhook calls to an address the model produced are the ordinary route by which data leaves. A single rule, mechanically enforceable, closing most of the realistic exfiltration surface.</p></div>`},

{label:'THE HARD QUESTION', tag:'The uncomfortable one', title:'Why is prompt injection still unsolved?', stage:11, html:`
<p>Direct injection — a user typing something manipulative — is a nuisance, and the user is the one taking the risk. <b>Indirect injection is the dangerous case</b>: instructions hidden inside a document, a web page or an email that the system retrieves on a user's behalf. The user asked an ordinary question and is the victim of it.</p>
<p>It remains unsolved, and the reason is structural rather than a matter of insufficient effort. Every previous injection class was solved by separating the control channel from the data channel — parameterised queries, escaped output, content policies. <b>A prompt has one channel.</b> Instructions and data are the same tokens in the same stream, and the model's ability to follow instructions found in text is the same ability that makes it useful at all. There is no known way to keep one and remove the other.</p>
<p><b>Anyone claiming to have solved it is selling something.</b> Filters raise the cost of an attack and are worth deploying; none of them changes the structure.</p>
<div class="note"><div class="lab">What is actually done instead — nine layers, none sufficient alone</div><p>Architecture that removes a trifecta leg · least agency · separating untrusted content from privileged action · input filtering · sanitisation · output filtering · <b>egress control</b> · human gates on consequential actions · monitoring for the attempt rather than the success.</p><p>The load-bearing ones are the first and the seventh. Architecture removes the possibility; egress control removes the payoff. The filters in between raise cost, and cost is not prevention.</p></div>
<div class="note q"><div class="lab">What follows for how this is discussed</div><p>A design conversation that ends with "the guardrail will catch it" has not addressed the problem. The honest position is that the attack cannot be prevented at the model layer, so the system is built such that a successful injection reaches nothing worth reaching. That is a harder conversation and it is the only one that survives an incident.</p></div>`},

{label:'MECHANISM', tag:'Guardrails', title:'Fail closed on security, open on quality', stage:11, html:`
<table class="tbl free">
<tr><td><b>Deterministic before probabilistic</b></td><td>A regular expression for an account number pattern is exact, instant and free. Run it before any model-based check.</td></tr>
<tr><td><b>Fail closed on security</b></td><td>A security check that errors must block. An unavailable check is not a passed check.</td></tr>
<tr><td><b>Fail open on quality</b></td><td>A quality check that errors should let the response through. Blocking a good answer because a scorer timed out serves nobody.</td></tr>
<tr><td><b>Run in parallel</b></td><td>Sequential checks stack latency. Concurrent ones cost the slowest, not the sum.</td></tr>
<tr><td><b>Measure false positives</b></td><td>An over-triggering guardrail is a broken feature, and it is invisible unless counted.</td></tr>
<tr><td><b>Never in the system prompt</b></td><td>A rule stated in the prompt is a request. A rule in code is a control. Guardrails are versioned code, and every trigger is logged.</td></tr>
</table>
<div class="note"><div class="lab">The gates that block a release</div><p>Faithfulness above 0.92 · citation validity exactly 1.00 · schema validity above 0.99 · false refusal below 3 percent · judge agreement above 0.80 · <b>injection success exactly zero, with no tolerance</b> · any single slice down 5 points blocks regardless of the aggregate.</p></div>`},

{label:'CLOSE', tag:'Mission 09 complete', title:'The system can now be trusted, and defended', stage:11, html:`
<ul class="own">
<li>The evaluation set is the only asset that compounds and cannot be bought</li>
<li>100 to 300 real cases, half ordinary, a tenth adversarial, with unanswerable and must-not-cite cases</li>
<li>Report by slice always; a five-point slice drop blocks a release whatever the aggregate says</li>
<li>False refusal rate matters as much as accuracy, and it generates no complaints</li>
<li>Calibrate a model judge with kappa — 88 percent raw agreement can be 0.565</li>
<li>Four leading indicators: cache hit, escalation, abstention, guardrail trigger. Alert on 20 percent relative</li>
<li>Three things are genuinely new: one channel, text nobody wrote, and compounding autonomy</li>
<li>The lethal trifecta — remove any leg. Never fetch a model-generated URL</li>
<li>Injection is unsolved; architecture and egress control are the only load-bearing defences</li>
</ul>
<div class="next">
  <div class="lab">Mission 10 unlocks</div>
  <div class="ttl">The system in the world</div>
  <p>Nine missions have built something that works, costs what it should, and can be defended. Mission 10 is what makes it approvable — and then compresses the whole pack into what is worth carrying.</p>
</div>`}

]},

{n:'10', title:'The System in the World', stage:14,
 sub:'A system in a regulated firm is not finished when it works. It is finished when three parties can each get a satisfactory answer. This mission covers those answers, then compresses everything the pack has established.',
 covers:['The three questions that define done','Risk tiering, and settling it at inception','The separation that gets approved','What four assumptions no longer hold','The traps, gathered','Every number worth carrying','The compression'],
 cards:[

{label:'ORIENT', tag:'The framing', title:'Three questions, and each is built rather than written', stage:14, html:`
<p class="kicker">Compliance is usually treated as a blocker that arrives at the end. Treated as a design specification that arrives at the start, it becomes ordinary engineering work.</p>
<table class="tbl free">
<tr><td><b>The customer asks</b><span class="sub">Why was this decision made about me?</span></td><td>Requires explainability, reason codes and provenance — which is the citation architecture from stage 06.</td></tr>
<tr><td><b>The supervisor asks</b><span class="sub">Who is accountable, and what controls exist?</span></td><td>Requires named ownership, designed human oversight and delegated authority — which is the gate design from stage 08.</td></tr>
<tr><td><b>The auditor asks</b><span class="sub">Can you prove it, for a decision made seven months ago?</span></td><td>Requires traces, a model inventory and change control — which is the checkpointing and tracing from stages 08 and 12.</td></tr>
</table>
<div class="note"><div class="lab">Why none of this is new work</div><p>Every one of these was built for a different reason earlier in the pack. Citations were built to stop fabrication. Gates were built to bound an agent. Traces were built to debug. <b>The governance answer is largely a matter of pointing at machinery that already exists</b> — provided it was built at the time, because none of it can be reconstructed afterwards.</p></div>
<div class="note g"><div class="lab">The observation that reframes the discussion</div><p>A credit scorecard already carries documented development, independent validation, an inventory entry, drift monitoring, an override log, a periodic review and a named owner. <b>An AI system needs the same apparatus.</b> What changed is that some assumptions underlying that apparatus no longer hold — and explaining how each is restored is the whole conversation.</p></div>`},

{label:'MECHANISM', tag:'Proportionality', title:'Four tiers, settled in writing at inception', stage:14, html:`
<table class="tbl free">
<tr><td><b>Tier 3 · Low</b><span class="sub">Drafting, summarising, search, meeting notes</span></td><td>No customer impact, no decision influence, no personal data. Acceptable-use policy, basic logging, cost caps.</td></tr>
<tr><td><b>Tier 2 · Medium</b><span class="sub">Policy assistants, extraction, research</span></td><td>Influences human work; a human decides. Evaluation suite, guardrails, full tracing, named owner, annual review.</td></tr>
<tr><td><b>Tier 1 · High</b><span class="sub">Creditworthiness, collections priority, fraud disposition, pricing</span></td><td>Influences a decision about a person. Everything above, plus independent validation, inventory entry, fairness testing, explainability design, documented oversight, incident procedure, board visibility.</td></tr>
<tr><td><b>Tier 0 · Prohibited</b><span class="sub">Fully autonomous decisions about people</span></td><td>In most institutions, and under most emerging regulation, not a thing that gets built.</td></tr>
</table>
<div class="note q"><div class="lab">The timing failure this prevents</div><p><b>Most disputes about AI governance are disputes about tiering that were never resolved.</b> Left unsettled, they surface two weeks before launch, when the cost of discovering that a system needs independent validation is a delayed launch rather than a design constraint. Classify at inception, in writing, with the business owner's signature.</p></div>`},

{label:'MECHANISM', tag:'The architecture that gets approved', title:'Separate the language layer from the decision layer', stage:14, html:`
<p class="kicker">One structural choice does more for approvability than every control that follows it.</p>
<table class="tbl free">
<tr><td><b>The language layer</b><span class="sub">The model</span></td><td>Reads, retrieves, summarises, drafts, explains, cites. Probabilistic, and its outputs are advisory.</td></tr>
<tr><td><b>The decision layer</b><span class="sub">Code and people</span></td><td>Applies thresholds, checks eligibility, enforces policy, records the outcome. Deterministic, testable, identical every time.</td></tr>
</table>
<div class="note g"><div class="lab">What the separation buys</div><p>A validation function can test the decision layer exhaustively, because it is ordinary logic. The language layer is then assessed on whether it presented the right evidence — a far more tractable question than whether a probabilistic system reached the right conclusion.</p><p>It is also the same principle as stage 08's rule that anything which can be a rule should be a rule. <b>The engineering argument and the governance argument converge on one design.</b></p></div>
<div class="note"><div class="lab">The sentence that survives a committee</div><p>The system explains policy and assembles evidence; a human makes the decision and a deterministic rule enforces the limit. <b>The model's output is an input to a decision, never the decision.</b></p></div>`},

{label:'INDIA', tag:'The jurisdiction', title:'What applies, and what to watch', stage:14, html:`
<p class="kicker">No single Indian statute governs AI systems specifically. What applies is a combination of existing law and supervisory expectation, and the practical requirements are more stable than the regulatory picture.</p>
<table class="tbl free">
<tr><td><b>Data protection</b></td><td>The Digital Personal Data Protection Act, 2023 governs personal data — consent, purpose limitation, and obligations on those determining the purposes of processing. It applies to an AI system exactly as to any other.</td></tr>
<tr><td><b>Supervisory expectation</b></td><td>Sectoral regulators approach AI through existing frameworks for outsourcing, model risk, and technology risk rather than through AI-specific rulebooks. The demands that follow are the familiar ones: named accountability, documented validation, auditability, and a human answerable for outcomes.</td></tr>
<tr><td><b>Extraterritorial reach</b></td><td>The EU's risk-tiered approach matters for any system serving EU customers regardless of where it runs, and its tiering vocabulary has become the common reference in vendor and board discussions.</td></tr>
</table>
<div class="note"><div class="lab">What to build against while the picture settles</div><p>The requirements that appear in every framework, and are therefore the safe target: <b>a named owner, a model inventory entry, documented validation, a full trace per decision, demonstrable human oversight, and an incident procedure.</b> A system with these is defensible under whatever arrives next.</p></div>
<div class="note q"><div class="lab">Held loosely, deliberately</div><p>This is the fastest-moving material in the pack and the most likely to have changed. The tiering logic and the control set are durable; specific instruments and their status should be checked against the current position rather than taken from here.</p></div>`},

{label:'DEFINE', tag:'What changed', title:'Four assumptions that no longer hold', stage:14, html:`
<p class="kicker">Existing model risk apparatus assumes four things about a model. An AI system breaks all four, and naming them converts a vague objection into four answerable questions.</p>
<table class="tbl free">
<tr><td><b>Deterministic output</b></td><td>Broken by sampling, and broken even at temperature zero by floating-point order. <b>Restored by:</b> recording the trace rather than promising re-execution.</td></tr>
<tr><td><b>A stable input space</b></td><td>A scorecard takes twelve defined fields. This takes arbitrary natural language. <b>Restored by:</b> slice-level evaluation over a versioned golden set that grows from production.</td></tr>
<tr><td><b>Inspectable internals</b></td><td>Coefficients can be read; billions of parameters cannot. <b>Restored by:</b> moving explainability to the evidence — verified citations to retrieved passages, which are inspectable.</td></tr>
<tr><td><b>A fixed artefact</b></td><td>A scorecard changes when it is redeveloped. A hosted model can change silently. <b>Restored by:</b> version pinning, change control, and shadow evaluation before any switch.</td></tr>
</table>
<div class="note"><div class="lab">Why this card is the one to have ready</div><p>An objection phrased as "this cannot be validated the way a model is validated" is correct as stated. Answered assumption by assumption, with the specific restoring mechanism for each, it becomes a design review rather than a refusal. <b>Engineers who can hold this conversation are rare and disproportionately valuable</b>, because the gap between a working demonstration and an approved production system is made almost entirely of these four answers.</p></div>`},

{label:'TRAP', tag:'The traps, gathered', title:'Fourteen ways this goes wrong', stage:14, html:`
<table class="tbl free">
<tr><td><b>Facts by fine-tuning</b></td><td>Only retrieval adds a fact the model never saw.</td></tr>
<tr><td><b>Characters ÷ 4</b></td><td>Fails on tables, code, identifiers and every non-Latin script — always upward.</td></tr>
<tr><td><b>Filling the window</b></td><td>Thirty passages are worse than six and cost four times more.</td></tr>
<tr><td><b>Vector search alone</b></td><td>Silently fails on circular numbers, identifiers and rare acronyms.</td></tr>
<tr><td><b>Unmeasured index recall</b></td><td>Seventy percent recall looks identical to ninety-nine from outside.</td></tr>
<tr><td><b>Swapping the embedding model</b></td><td>A full corpus migration, not a configuration change.</td></tr>
<tr><td><b>Flattened tables</b></td><td>Produce confident, precise, wrong figures.</td></tr>
<tr><td><b>Temperature zero as reproducible</b></td><td>Consistent, not reproducible. The trace is the evidence.</td></tr>
<tr><td><b>Trusting the reasoning trace</b></td><td>Generated the same way as the answer. Not a record of a computation.</td></tr>
<tr><td><b>Timestamp at the top of the prompt</b></td><td>Destroys the cache silently and multiplies the bill.</td></tr>
<tr><td><b>Aggregate-only metrics</b></td><td>Conceal the slice that collapsed.</td></tr>
<tr><td><b>Raw judge agreement</b></td><td>Eighty-eight percent can be a kappa of 0.565.</td></tr>
<tr><td><b>Over-gating</b></td><td>Approval fatigue disables the gates that matter.</td></tr>
<tr><td><b>"The guardrail will catch it"</b></td><td>Injection is unsolved. Architecture and egress control are the defences.</td></tr>
</table>`},

{label:'RECALL', tag:'The formulas', title:'Six worth being able to write', stage:14, html:`
<div class="formula" style="font-size:14px">softmax( Q·Kᵀ ÷ √d + mask ) · V<small>attention</small></div>
<div class="formula" style="font-size:13px">2 × layers × kv_heads × head_dim × bytes<small>KV cache per token</small></div>
<div class="formula" style="font-size:14px">cos(A,B) = (A·B) ÷ (|A| × |B|)<small>embedding similarity</small></div>
<div class="formula" style="font-size:14px">score = Σ 1 ÷ (60 + rank)<small>rank fusion across channels</small></div>
<div class="formula" style="font-size:14px">κ = (p_o − p_e) ÷ (1 − p_e)<small>judge calibration beyond chance</small></div>
<div class="formula" style="font-size:13px">E2E = TTFT + (TPOT × output tokens)<small>perceived latency</small></div>`},

{label:'THE COMPRESSION', tag:'The whole pack', title:'If only one page survived', stage:14, html:`
<p class="kicker">Ten missions, compressed to what would have to be reconstructed from first principles if it were lost.</p>
<table class="tbl free">
<tr><td><b>The model is a file of numbers</b></td><td>No records, no index. Knowledge is diffuse and lossy, so it cannot cite, cannot be edited, and blends similar facts. Everything else follows from this.</td></tr>
<tr><td><b>The model is 10 percent of the work</b></td><td>Thirty percent is getting the right information in front of it, and that is where thirty-five percent of production failures live.</td></tr>
<tr><td><b>Only retrieval adds a fact</b></td><td>Prompting and fine-tuning change behaviour. Tools add action. Facts that must be current, citable and correctable cannot live in weights.</td></tr>
<tr><td><b>Everything is tokens</b></td><td>Memory, latency and cost are one unit. Prefill is compute-bound, decode is memory-bound, and that split explains nearly every serving decision.</td></tr>
<tr><td><b>Context is a budget</b></td><td>Six good passages beat thirty mediocre ones on accuracy and on cost. Attention is weakest in the middle.</td></tr>
<tr><td><b>Fluency carries no information about accuracy</b></td><td>The objective rewarded plausible continuation. Confident falsehood is the mechanism working, not failing.</td></tr>
<tr><td><b>Measure first</b></td><td>The evaluation set is the only asset that compounds. Aggregates conceal the slice that collapsed. Refusal must be measurable or the floor is set blind.</td></tr>
<tr><td><b>Code decides, models propose</b></td><td>Anything that can be a rule should be a rule. Completion is checked, never announced.</td></tr>
<tr><td><b>Injection is unsolved</b></td><td>One channel carries instructions and data. Remove a leg of the trifecta; never fetch a model-generated URL.</td></tr>
<tr><td><b>The model's output is an input to a decision</b></td><td>Never the decision. That sentence is what makes the system approvable, and it is also what makes it correct.</td></tr>
</table>`},

{label:'CLOSE', tag:'Pack 02 complete', title:'The loop, end to end', stage:14, html:`
<p class="kicker">Fourteen stages, ten missions. What the pack leaves behind is not a description of AI systems but the ability to place any new technique, product or claim at a stage and ask what it actually changes there.</p>
<ul class="own">
<li>A model is a file of numbers, and the knowledge in it is diffuse, uncitable and uneditable</li>
<li>Tokens are the unit of memory, latency and money, and Indic scripts cost two to four times more</li>
<li>Meaning becomes distance, and distance fails on exactly the identifiers that regulated queries contain</li>
<li>Attention compares every token with every token, which is why context is quadratic and cache is per user</li>
<li>Sampling decides consistency; temperature zero is consistent but not reproducible</li>
<li>Retrieval is the largest engineering surface, and recall at 20 is the gate everything else sits under</li>
<li>Action is bounded by code that validates, authorises and executes what the model only proposes</li>
<li>Prefill and decode need opposite optimisations; cascade and caching are the two largest cost levers</li>
<li>Evaluation compounds, slices reveal what aggregates hide, and injection is defended architecturally</li>
<li>Three questions decide whether a working system becomes an approved one</li>
</ul>
<div class="next">
  <div class="lab">What this was built from</div>
  <div class="ttl">Six volumes, compressed</div>
  <p>This pack is the field-practice compression of a six-volume treatment running to roughly 82,000 words. The volumes remain the depth; these cards are the pass that makes them navigable and the working set that survives without them.</p>
</div>
<div class="byline">Tharun Gajula</div>`}

]}
];

const FLAT = [];
FLAT.push({kind:'packcover', stage:0, title:'AI Engineering', mission:'', html:`
<div class="cover">
  <div class="mark">Field Cards · Pack 02</div>
  <h1>AI<br>Engineering</h1>
  <div class="sub">What a model is, what surrounds it, and what it takes to run one in production — from first principles.</div>
  <div class="meta">
    <div>MISSIONS<b>10</b></div>
    <div>CARDS<b id="totalCards">—</b></div>
    <div>STAGES<b>14</b></div>
  </div>
  <div class="byline">Tharun Gajula</div>
  <div class="scrollhint">Swipe up ↑</div>
</div>`});

MISSIONS.forEach(m=>{
  FLAT.push({kind:'mcover', stage:m.stage, mission:m.n, title:m.title, html:`
  <div class="mcover">
    <div class="num">Mission ${m.n} of 10</div>
    <h1>${m.title}</h1>
    <div class="sub">${m.sub}</div>
    <div class="covers"><div class="lab">In this mission</div><ul>${m.covers.map(c=>`<li>${c}</li>`).join('')}</ul></div>
  </div>`});
  m.cards.forEach(c=>FLAT.push({kind:'card', mission:m.n, ...c}));
});

/* ---------- render ---------- */
const deck=document.getElementById('deck');
deck.innerHTML=FLAT.map((c,i)=>`<section class="card" data-i="${i}" data-stage="${c.stage||0}" data-m="${c.mission||''}">
  <div class="sheet">${(c.kind==='card')
    ? `<div class="eyebrow"><span class="dot"></span><span>${c.label}</span><span style="color:var(--rule)">/</span><span class="tag">${c.tag}</span></div><h2>${c.title}</h2>${c.html}`
    : c.html}</div></section>`).join('');
const tc=document.getElementById('totalCards'); if(tc) tc.textContent=FLAT.length;

/* rail — the fourteen stages of the loop */
const rail=document.getElementById('rail');
rail.innerHTML=Array.from({length:14},()=>'<span></span>').join('');
const ticks=[...rail.children];

/* index — missions only */
const idx=document.getElementById('idx'), idxList=document.getElementById('idxList');
const anchors=[];
FLAT.forEach((c,i)=>{ if(c.kind==='packcover'||c.kind==='mcover') anchors.push({i,c}); });
idxList.innerHTML=anchors.map(a=>`<li data-go="${a.i}">
  <span class="n">${a.c.kind==='packcover'?'·':a.c.mission}</span>
  <span class="t">${a.c.title}${a.c.kind==='mcover'?`<em>${MISSIONS.find(m=>m.n===a.c.mission).cards.length} cards</em>`:'<em>Cover</em>'}</span></li>`).join('');
idxList.addEventListener('click',e=>{const li=e.target.closest('li'); if(!li)return;
  idx.classList.remove('open'); deck.children[+li.dataset.go].scrollIntoView({behavior:'smooth'});});
document.getElementById('counter').onclick=()=>idx.classList.add('open');
document.getElementById('idxClose').onclick=()=>idx.classList.remove('open');

/* observer */
const counter=document.getElementById('counter'), bar=document.getElementById('bar');
let current=0;
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.intersectionRatio<0.5) return;
  current=+e.target.dataset.i;
  const m=e.target.dataset.m;
  counter.textContent=(m?`M${m} · `:'')+String(current+1).padStart(3,'0');
  bar.style.width=((current+1)/FLAT.length*100)+'%';
  const st=+e.target.dataset.stage;
  ticks.forEach((t,k)=>{t.className = st && k===st-1 ? 'on' : (st && k<st-1 ? 'past':'');});
});},{threshold:[0.5]});
[...deck.children].forEach(el=>io.observe(el));

/* keyboard */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){idx.classList.remove('open');return;}
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();
    deck.children[Math.min(current+1,FLAT.length-1)].scrollIntoView({behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();
    deck.children[Math.max(current-1,0)].scrollIntoView({behavior:'smooth'});}
});
</script>
</body>
</html>
