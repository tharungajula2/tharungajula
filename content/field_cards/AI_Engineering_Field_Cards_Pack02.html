<script>
const MISSIONS = [
{n:'01', title:'The Loop', stage:1,
 sub:'An AI system is one loop executed end to end. This mission sets out the loop, the thing at the centre of it, and the four levers that exist when the output is wrong.',
 covers:['What a model physically is','Where the knowledge actually lives','Six layers, four pillars, and where the effort goes','One question traced through ten steps','The four interventions, and what each one fixes','What a request actually costs'],
 cards:[

{label:'ORIENT', tag:'The spine', title:'One loop, fourteen stages', stage:1, html:`
<p class="kicker">An AI system takes text in and produces text out. Every technique in the field lives at one stage of that journey, and the stages run in a fixed order because each consumes what the one above it produced.</p>
<ul class="spine">
<li><span class="k">01</span><span class="v">Frame<em>What the system must do, and what counts as a correct answer, written down before anything is built</em></span></li>
<li><span class="k">02</span><span class="v">Tokenise<em>Text becomes integers. This is the unit of memory, of latency and of the bill</em></span></li>
<li><span class="k">03</span><span class="v">Represent<em>Integers become vectors. Meaning becomes distance in a space</em></span></li>
<li><span class="k">04</span><span class="v">Attend<em>Each token looks at every earlier token. This is the transformer, and it is why context is expensive</em></span></li>
<li><span class="k">05</span><span class="v">Generate<em>A probability for every possible next token, and a rule for picking one</em></span></li>
<li><span class="k">06</span><span class="v">Ground<em>Fetch the passages that hold the answer, rank them honestly, and refuse when nothing qualifies</em></span></li>
<li><span class="k">07</span><span class="v">Assemble<em>Arrange evidence, instructions and question into one block, in a specific order</em></span></li>
<li><span class="k">08</span><span class="v">Act<em>The model proposes a tool call; code decides whether to run it</em></span></li>
<li><span class="k">09</span><span class="v">Serve<em>Run the loop fast enough: caching, batching, quantisation</em></span></li>
<li><span class="k">10</span><span class="v">Cost<em>Convert tokens into money, per resolved task rather than per call</em></span></li>
<li><span class="k">11</span><span class="v">Evaluate<em>A fixed set of cases and a score, so that a change can be shown to be an improvement</em></span></li>
<li><span class="k">12</span><span class="v">Observe<em>A trace of every request, kept long enough to answer questions about it months later</em></span></li>
<li><span class="k">13</span><span class="v">Defend<em>Injected instructions, exfiltration, prohibited output. Deterministic code, not model judgement</em></span></li>
<li><span class="k">14</span><span class="v">Govern<em>Risk tier, named owner, evidence pack. What makes a working system an approved one</em></span></li>
</ul>
<div class="note"><div class="lab">Why the order is not arbitrary</div><p>Stages 01 to 05 describe what a model does. Stages 06 to 08 describe what is built around it. Stages 09 to 14 describe what makes it survivable in production. <b>Skipping stage 01 is the most expensive mistake available</b>, because every later stage optimises toward a target that was never defined.</p></div>`},

{label:'DEFINE', tag:'The artefact', title:'A model is a file of numbers', stage:1, html:`
<p>Downloading an open-weights model produces a directory. Four large files of roughly 16 GB in total, a small configuration file, and a vocabulary file. That is the entire model.</p>
<p>The large files hold nothing but numbers. At two bytes each, 16 GB is about <b>eight billion numbers</b>. Each one is called a <i class="term">parameter</i>, or equivalently a <i class="term">weight</i>. "An 8B model" means eight billion of them. The configuration file states how they are arranged — how many layers, how wide each layer is. The vocabulary file states how text is converted into integers before the numbers are used at all.</p>
<p><b>Nothing else is present.</b> No database of facts. No index of the internet. No stored copies of the documents the model was trained on. Numbers, and an arrangement.</p>
<div class="note"><div class="lab">The arithmetic worth being able to do in the head</div><p>Storage precision decides file size. The same 8B model occupies <b>32 GB</b> at four bytes per parameter, <b>16 GB</b> at two bytes, and <b>8 GB</b> at one byte. So a file size alone does not determine parameter count — the precision has to be known. This single relationship governs which hardware a model fits on, and it returns at every stage of serving.</p></div>`},

{label:'TRAP', tag:'Where knowledge lives', title:'There are no facts in the file', stage:1, html:`
<div class="bt">
<div class="pair">
  <div class="believed"><div class="lab">Commonly believed</div><div class="txt">The model was trained on documents, so somewhere inside it there is a compressed record of those documents that it looks things up in.</div></div>
  <div class="true"><div class="lab">What is true</div><div class="txt">Training adjusted the numbers to get better at one task — predicting the next chunk of text. Structure about the world had to be absorbed, because predicting text well requires it. But it was absorbed as a pattern in how numbers relate to one another, not as a record. The knowledge is real, and it is <b>diffuse and lossy</b>.</div></div>
</div>
</div>
<p style="margin-top:16px">Three consequences follow immediately, and they recur at every later stage.</p>
<table class="tbl free">
<tr><td><b>It cannot cite</b></td><td>There is no record of where a pattern came from, because there are no records.</td></tr>
<tr><td><b>It cannot be edited</b></td><td>A single wrong fact cannot be opened and corrected. There is no location to open.</td></tr>
<tr><td><b>It confuses neighbours</b></td><td>Two facts that were statistically similar during training blend together. This is the mechanism behind hallucination — not deception, but interpolation between patterns.</td></tr>
</table>
<div class="note"><div class="lab">Why this card is load-bearing</div><p>These three consequences are the entire justification for retrieval. Whenever the question "why not simply train the facts in?" is raised, the answer is this list. Facts that must be citable, correctable and precise cannot live in weights, and no amount of additional training changes that.</p></div>`},

{label:'MECHANISM', tag:'The stack', title:'Six layers, four pillars', stage:1, html:`
<p class="kicker">Almost all public attention goes to the model. Almost all engineering effort goes everywhere else. A mental map that is model-shaped predicts the wrong work and produces systems that demonstrate well and fail in production.</p>
<div class="dia">
<svg viewBox="0 0 300 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six layers of an AI system with four cross-cutting pillars">
  <g font-family="IBM Plex Sans, sans-serif">
    <!-- L6 -->
    <rect x="0" y="4" width="300" height="30" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <text x="10" y="18" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84" letter-spacing="1">L6</text>
    <text x="32" y="18" font-size="11" fill="#EDEAE4" font-weight="500">APPLICATION</text>
    <text x="32" y="29" font-size="8.5" fill="#767D84">what a user sees and does</text>
    <!-- L5 -->
    <rect x="0" y="38" width="300" height="30" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <text x="10" y="52" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84" letter-spacing="1">L5</text>
    <text x="32" y="52" font-size="11" fill="#EDEAE4" font-weight="500">ORCHESTRATION</text>
    <text x="32" y="63" font-size="8.5" fill="#767D84">multi-step logic, state, human approval</text>
    <!-- L4 -->
    <rect x="0" y="72" width="300" height="30" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <text x="10" y="86" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84" letter-spacing="1">L4</text>
    <text x="32" y="86" font-size="11" fill="#EDEAE4" font-weight="500">CONTEXT</text>
    <text x="32" y="97" font-size="8.5" fill="#767D84">what information reaches the model</text>
    <!-- L3 -->
    <rect x="0" y="106" width="300" height="30" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <text x="10" y="120" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84" letter-spacing="1">L3</text>
    <text x="32" y="120" font-size="11" fill="#EDEAE4" font-weight="500">SERVING</text>
    <text x="32" y="131" font-size="8.5" fill="#767D84">how the model runs, fast and cheap</text>
    <!-- L2 — the bought box -->
    <rect x="0" y="140" width="300" height="30" rx="2" fill="#14171A" stroke="#E0A73E"/>
    <text x="10" y="154" font-family="IBM Plex Mono, monospace" font-size="8" fill="#E0A73E" letter-spacing="1">L2</text>
    <text x="32" y="154" font-size="11" fill="#E0A73E" font-weight="500">MODEL</text>
    <text x="32" y="165" font-size="8.5" fill="#A8AEB4">the file of numbers — bought, not built</text>
    <!-- L1 -->
    <rect x="0" y="174" width="300" height="30" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <text x="10" y="188" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84" letter-spacing="1">L1</text>
    <text x="32" y="188" font-size="11" fill="#EDEAE4" font-weight="500">COMPUTE</text>
    <text x="32" y="199" font-size="8.5" fill="#767D84">the hardware underneath</text>
    <!-- pillars -->

<p>The model layer is a downloaded or purchased component. It can be swapped in an afternoon, and its price falls sharply every year. Everything above and below it is built, owned and maintained.</p>`},

{label:'NUMBERS', tag:'Where the work is', title:'Ten percent of the effort is the model', stage:1, html:`
<p class="kicker">Measured across enterprise AI programmes, engineering effort and production failures distribute like this.</p>
<table class="tbl">
<tr><th>Concern</th><th>Effort · Failures</th></tr>
<tr><td>Choosing the model, writing prompts</td><td>10% · 5%</td></tr>
<tr class="hi"><td>Getting the right information into the prompt<span class="sub">Retrieval, ranking, context assembly</span></td><td>30% · 35%</td></tr>
<tr><td>Knowing whether it works<span class="sub">Evaluation sets, metrics, regression gates</span></td><td>20% · 25%</td></tr>
<tr><td>Security, guardrails, compliance</td><td>20% · 20%</td></tr>
<tr><td>Running it fast and affordably</td><td>20% · 15%</td></tr>
</table>
<div class="note"><div class="lab">The row that changes what gets built</div><p><b>The largest single cause of production failure is not a weak model. It is a model that was never given the information it needed.</b> When a policy assistant returns a wrong provisioning answer, the usual cause is that the relevant circular was never retrieved — not that the model was incapable of reading it.</p></div>
<div class="note q"><div class="lab">Why teams get this backwards</div><p>Prompt tuning gives immediate visible feedback. Fixing retrieval gives no feedback at all until a way to measure retrieval quality has been built. So the visible thing gets optimised for months, and the system ends up accurate on well under half its cases with nobody able to say why, because no measurement exists anywhere.</p></div>`},

{label:'MECHANISM', tag:'One question, end to end', title:'The model performs two of the ten steps', stage:1, html:`
<p class="kicker">A credit analyst types a question about whether a sanction is permissible for a borrower who has one account 31 to 60 days past due. Here is what a production system actually does with it. Everything named is developed fully at its own stage.</p>
<ul class="spine">
<li><span class="k">01</span><span class="v">Rewrite the question<em>A cheap model turns a question that references earlier conversation into a standalone one</em></span></li>
<li><span class="k">02</span><span class="v">Check the input<em>Deterministic code scans for personal identifiers, manipulation attempts, out-of-scope requests</em></span></li>
<li><span class="k">03</span><span class="v">Search twice, in parallel<em>Once by meaning, once by exact keyword — then filtered to what the analyst is entitled to see</em></span></li>
<li><span class="k">04</span><span class="v">Rank<em>A second, slower model reads each candidate passage together with the question and keeps the best six</em></span></li>
<li><span class="k">05</span><span class="v">Decide whether to answer<em>If nothing scores above threshold, the system says so. This is a feature</em></span></li>
<li><span class="k">06</span><span class="v">Assemble the prompt<em>Passages, policy section, question and rules, arranged in a specific order</em></span></li>
<li><span class="k">07</span><span class="v">Generate<em>The model produces an answer, one token at a time</em></span></li>
<li><span class="k">08</span><span class="v">Call tools if needed<em>The model emits a structured request; code, not the model, decides whether to execute it</em></span></li>
<li><span class="k">09</span><span class="v">Check the output<em>Every cited passage must exist. Every claim must be supported. No prohibited phrasing</em></span></li>
<li><span class="k">10</span><span class="v">Record everything<em>Question, passages, scores, exact prompt, exact response, cost, latency</em></span></li>
</ul>
<div class="note"><div class="lab">The ratio that is the honest picture of the field</div><p>The model performed steps 1 and 7, and proposed step 8. <b>Ten steps; the model did two.</b> The other eight are ordinary software, and they are where the engineering time goes.</p><p>Note also what the model did not do: it did not decide anything. The answer explains policy; a human sanctions the loan. In regulated lending that separation is not a design preference — it is what makes the system approvable at all.</p></div>`},

{label:'MECHANISM', tag:'The four levers', title:'What each intervention actually fixes', stage:1, html:`
<p class="kicker">When a system produces the wrong output, four things can be changed. They are routinely treated as interchangeable and they are not: each fixes a different failure, and choosing the wrong one wastes months.</p>
<div class="dia">
<svg viewBox="0 0 300 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grid showing which of four interventions changes what the model knows, how it behaves, and what it can do">
  <g font-family="IBM Plex Sans, sans-serif">
    <text x="152" y="12" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#767D84" text-anchor="middle" letter-spacing="1">KNOWS</text>
    <text x="212" y="12" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#767D84" text-anchor="middle" letter-spacing="1">BEHAVES</text>
    <text x="272" y="12" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#767D84" text-anchor="middle" letter-spacing="1">ACTS</text>
    <line x1="0" y1="20" x2="300" y2="20" stroke="#242A30"/>

    <text x="0" y="38" font-size="11" fill="#EDEAE4" font-weight="500">Prompting</text>
    <text x="0" y="49" font-size="8" fill="#767D84">instructions, examples, format</text>
    <circle cx="152" cy="40" r="5.5" fill="none" stroke="#242A30"/>
    <circle cx="212" cy="40" r="5.5" fill="#6FBF9B"/>
    <circle cx="272" cy="40" r="5.5" fill="none" stroke="#242A30"/>
    <line x1="0" y1="58" x2="300" y2="58" stroke="#1B2025"/>

    <text x="0" y="76" font-size="11" fill="#EDEAE4" font-weight="500">Retrieval</text>
    <text x="0" y="87" font-size="8" fill="#767D84">fetch the passage, put it in the prompt</text>
    <circle cx="152" cy="78" r="5.5" fill="#E0A73E"/>
    <circle cx="212" cy="78" r="5.5" fill="none" stroke="#242A30"/>
    <circle cx="272" cy="78" r="5.5" fill="none" stroke="#242A30"/>
    <line x1="0" y1="96" x2="300" y2="96" stroke="#1B2025"/>

    <text x="0" y="114" font-size="11" fill="#EDEAE4" font-weight="500">Fine-tuning</text>
    <text x="0" y="125" font-size="8" fill="#767D84">further training on example pairs</text>
    <circle cx="152" cy="116" r="5.5" fill="none" stroke="#242A30"/>
    <circle cx="212" cy="116" r="5.5" fill="#D9584A"/>
    <circle cx="272" cy="116" r="5.5" fill="none" stroke="#242A30"/>
    <line x1="0" y1="134" x2="300" y2="134" stroke="#1B2025"/>

    <text x="0" y="152" font-size="11" fill="#EDEAE4" font-weight="500">Tools and agents</text>
    <text x="0" y="163" font-size="8" fill="#767D84">the model proposes, code executes</text>
    <circle cx="152" cy="154" r="5.5" fill="none" stroke="#242A30"/>
    <circle cx="212" cy="154" r="5.5" fill="none" stroke="#242A30"/>
    <circle cx="272" cy="154" r="5.5" fill="#E0A73E"/>
  </g>
</svg>
<div class="cap">Filled means the lever moves that column. <b>Only one row adds facts</b></div>
</div>
<p><b>The confusion this grid removes.</b> Fine-tuning and retrieval are constantly proposed as alternatives to each other. They are not. Retrieval is the only lever in the grid that puts a fact the model never saw in front of it. Fine-tuning changes format, tone, and task structure — behaviour that persists without being asked for each time.</p>
<div class="note q"><div class="lab">The failure this produces</div><p>A team observes wrong answers about internal policy, concludes the model lacks domain knowledge, and spends a quarter fine-tuning on policy documents. Accuracy barely moves, because the failure was at retrieval and the lever chosen does not touch retrieval. <b>Facts that must be current, citable and correctable cannot be trained in.</b></p></div>
<div class="note g"><div class="lab">Prompting versus fine-tuning, since both fill the same column</div><p>Prompting states the desired behaviour on every request and costs tokens on every request. Fine-tuning bakes the behaviour into the weights, so the instruction no longer has to be sent — cheaper per call, expensive once, and requires a curated dataset. Prompting is tried first for exactly that reason.</p></div>`},

{label:'TRADE-OFF', tag:'The escalation ladder', title:'Prompt, then retrieve, then train', stage:1, html:`
<p class="kicker">The three levers form an ordered ladder. Each rung costs more, takes longer, and is harder to reverse than the one below it. The rule is to climb only when the rung below has been shown to be insufficient.</p>
<div class="ramp">
  <div class="a"><div class="t">Prompt</div><div class="n">Minutes</div></div>
  <div class="b"><div class="t">Retrieve</div><div class="n">Weeks</div></div>
  <div class="c"><div class="t">Train</div><div class="n">Months</div></div>
</div>
<table class="tbl free">
<tr><td><b>Prompt</b><span class="sub">Green</span></td><td>Instant, reversible, free to abandon. Costs tokens on every call thereafter.</td></tr>
<tr><td><b>Retrieve</b><span class="sub">Amber</span></td><td>Requires a parsing pipeline, an index, a ranking step and a way to measure whether the right passages came back. Weeks of work. Adds latency and cost per call.</td></tr>
<tr><td><b>Train</b><span class="sub">Red</span></td><td>Requires a curated dataset, a training run, an evaluation suite to prove it improved anything, and a versioning story. Hard to reverse and easy to make worse.</td></tr>
</table>
<div class="note"><div class="lab">The decision table, stated plainly</div><p>Examples of correct input and output exist → supervised fine-tuning. Pairs where one response is clearly better → preference optimisation. Thumbs up and down at scale → the same family, simpler labels. An automated checker that can verify correctness → the reinforcement family. <b>None of the above → prompting and retrieval. Do not fine-tune.</b></p></div>
<div class="note g"><div class="lab">Reading the colours</div><p>Green, amber and red carry this meaning throughout the pack. Green is cheap and reversible. Amber is infrastructure. Red is a commitment that is expensive to undo. Wherever the ramp appears again, it is this ladder or a direct analogue of it.</p></div>`},

{label:'DEFINE', tag:'Two activities, two bills', title:'Training happens once; inference happens forever', stage:1, html:`
<p><i class="term">Training</i> is the process that produced the numbers. Text is fed in, the model predicts the next chunk, the prediction is scored against the truth, and every parameter is nudged in the direction that would have reduced the error. Repeated trillions of times.</p>
<p><i class="term">Inference</i> is the process of using the numbers. The file is loaded into memory a processor can reach quickly, text is converted to integers, those integers are pushed through a fixed sequence of multiplications and additions, and a score comes out for every possible next chunk. One is picked, appended, and the sequence runs again.</p>
<table class="tbl">
<tr><th>Activity</th><th>Order of cost</th></tr>
<tr><td>Pretraining a frontier model<span class="sub">10 to 30 trillion tokens, thousands of accelerators, weeks to months. Roughly ten organisations worldwide can do it</span></td><td>$10M–$500M+</td></tr>
<tr><td>Continued pretraining on a domain corpus<span class="sub">Needs 10 to 500 billion domain tokens. Rare</span></td><td>$50k–$5M</td></tr>
<tr class="hi"><td>Supervised fine-tuning<span class="sub">1,000 to 1,000,000 instruction and response pairs</span></td><td>$100–$50k</td></tr>
<tr><td>Inference<span class="sub">Paid on every single request, forever</span></td><td>Per token</td></tr>
</table>
<div class="note"><div class="lab">Where attention belongs</div><p>Pretraining will almost certainly never be performed outside those ten organisations. <b>Inference is performed constantly</b>, and it is billed every time anyone uses the system. Any hour spent understanding inference returns more than an hour spent understanding pretraining — which is why serving and cost get an entire mission of this pack and training gets part of one.</p></div>`},

{label:'WORKED', tag:'Cost arithmetic', title:'The estimate that is 2.4× wrong', stage:1, html:`
<p class="kicker">A document extraction pipeline, costed per document. The naive figure appears in nearly every early business case, and it is an underestimate by a factor that is remarkably consistent.</p>
<ul class="steps">
<li><span class="op"><b>Naive — input</b>8,000 tokens × $1.50 per million</span><span class="res">$0.0120</span></li>
<li><span class="op"><b>Naive — output</b>400 tokens × $12.00 per million</span><span class="res">$0.0048</span></li>
<li class="total"><span class="op"><b>Naive total</b>What the business case said</span><span class="res">$0.0168</span></li>
</ul>
<hr class="rule">
<ul class="steps">
<li><span class="op"><b>Input guardrail</b>8,000 in × $0.20 per million, on a cheap model</span><span class="res">$0.0016</span></li>
<li><span class="op"><b>Cached input</b>4,800 tokens × 0.1 discount × $1.50 per million</span><span class="res">$0.0007</span></li>
<li><span class="op"><b>Uncached input</b>3,200 tokens × $1.50 per million</span><span class="res">$0.0048</span></li>
<li><span class="op"><b>Output, thinking included</b>2,100 internal + 400 visible × $12.00 per million</span><span class="res">$0.0300</span></li>
<li><span class="op"><b>Schema retry</b>8% of documents fail validation × $0.0355</span><span class="res">$0.0028</span></li>
<li><span class="op"><b>Output faithfulness check</b>2,500 in and 200 out on a cheap model</span><span class="res">$0.0007</span></li>
<li class="total"><span class="op"><b>Real total</b>Per document</span><span class="res">$0.0406</span></li>
</ul>
<div class="note"><div class="lab">Sanity check</div><p>$0.0406 ÷ $0.0168 = <b>2.4×</b>. At 40,000 documents a month and roughly ₹88 to the dollar: about <b>₹59,200 estimated against ₹1,42,800 actual</b>. The dominant line is not the input — it is the 2,100 thinking tokens, billed at the output rate, invisible in the response.</p></div>
<div class="note q"><div class="lab">The four terms that get left out, every time</div><p><b>Thinking tokens</b> — a reasoning model generates an internal trace before the visible answer, billed as output. A 200-word answer can cost 4,000 output tokens. <b>Requests per task</b> — an agent making 25 calls to answer one question costs 25 calls; the user experienced one interaction. <b>Retries and escalations</b> — a failed schema validation is paid for twice, and an escalation from a cheap model to an expensive one is paid for on both. <b>Supporting calls</b> — query rewriting, guardrail classification, reranking, faithfulness checking. Each is small; together they routinely add 20 to 40 percent.</p></div>
<div class="note g"><div class="lab">The metric that replaces cost per token</div><p><b>Cost per resolved task.</b> Token price is a component, not an answer. A model at half the price that needs three attempts is more expensive than the one that needs one.</p></div>`},

{label:'TRAP', tag:'Fluency', title:'Plausible and true are separate variables', stage:1, html:`
<div class="bt">
<div class="pair">
  <div class="believed"><div class="lab">Commonly believed</div><div class="txt">A confident, well-formatted, correctly-structured answer indicates that the model knew the answer. Uncertainty would show up as hedging.</div></div>
  <div class="true"><div class="lab">What is true</div><div class="txt">The model produces <b>plausible continuations</b>. Plausible and true overlap heavily on well-represented topics and diverge sharply on specifics — dates, figures, names, recent events, internal policy, anything rare. Fluency is generated by the same mechanism whether or not the content is correct, so <b>fluency carries no information about accuracy</b>.</div></div>
</div>
</div>
<p style="margin-top:16px">A policy assistant asked for the current provisioning requirement on a sub-standard secured advance will return a fluent, confident, correctly-formatted answer whether or not anything in the weights supports it. Nothing in the output distinguishes the two cases.</p>
<div class="note"><div class="lab">What follows architecturally</div><p>Because the failure is invisible in the output, it cannot be caught by reading the output. It has to be caught structurally: by supplying the evidence rather than relying on memory, by requiring every claim to carry a citation to supplied evidence, and by verifying afterwards that each citation exists and supports what it is attached to. That chain is stages 06, 07 and 11 of the loop, and this trap is why they exist.</p></div>`},

{label:'TRADE-OFF', tag:'Build order', title:'Measure first, retrieve second, prompt third', stage:1, html:`
<p class="kicker">The natural build order is the reverse of the correct one, because it follows visible feedback rather than eventual accuracy.</p>
<table class="tbl free">
<tr><td><b>1 · Measure</b></td><td>A fixed set of real cases with known correct answers, and a score. Built <i>before</i> any improvement is attempted, because otherwise no change can be shown to be an improvement.</td></tr>
<tr><td><b>2 · Retrieve</b></td><td>The pipeline that puts the right evidence in front of the model. Largest single source of production failure, and now measurable because step 1 exists.</td></tr>
<tr><td><b>3 · Prompt</b></td><td>Instructions and format. Fast, visible, satisfying — and close to worthless when applied to a system that is failing for want of evidence.</td></tr>
</table>
<div class="note q"><div class="lab">The cost of the reverse order</div><p>Prompt tuning returns feedback within seconds. Retrieval work returns none until measurement exists. Measurement itself returns none at all — it produces no improvement, only the ability to detect one. So the order that feels productive is exactly inverted, and the result is a system that has been tuned for months against an unmeasured target.</p></div>
<div class="note"><div class="lab">The trade being made</div><p>Building the evaluation set first delays every visible improvement by one to two weeks and feels like a loss. What it buys is the ability to distinguish a change that helped from a change that felt like it helped. Every later stage of the loop depends on that distinction, and there is no way to acquire it retrospectively without redoing the intervening work.</p></div>`},

{label:'THE HARD QUESTION', tag:'The uncomfortable one', title:'Why is the default failure confident?', stage:1, html:`
<p>A system that failed by producing nothing, or by producing obvious nonsense, would be easy to operate. Failures would be visible, cheap to detect, and safe. Instead the characteristic failure is fluent, well-structured and wrong, which is the most expensive failure shape available. It is worth being honest about why, because the answer is not a defect that a better model removes.</p>
<p><b>The training objective is the reason.</b> The numbers were adjusted to maximise the probability assigned to the observed next chunk of text across an enormous corpus. Text in that corpus is overwhelmingly fluent and well-formed. So fluency and structure are what the objective directly rewards. Truth was never a term in it. Truth was absorbed only to the extent that it improved next-chunk prediction — which it does for common, well-represented material, and barely does for rare specifics.</p>
<p>The consequence is uncomfortable and worth stating without softening: <b>the model is doing exactly what it was optimised to do when it produces a confident falsehood.</b> This is not a malfunction. There is no configuration setting that turns it off, and successive model generations reduce its frequency without changing its nature.</p>
<div class="note q"><div class="lab">What this rules out</div><p>It rules out the whole family of fixes shaped like "instruct the model not to make things up". Such an instruction can shift the probability distribution slightly toward hedging. It cannot introduce a capacity for verification that the mechanism does not have. Every honest defence is external: supply the evidence, require citation to that evidence, verify the citations in code, and refuse when the evidence is absent.</p></div>
<div class="note"><div class="lab">The one place this is genuinely thin</div><p>The claim that later model generations reduce frequency without changing the nature of the failure is a widely-held reading rather than a settled result, and measurements vary sharply by task and by how hallucination is defined. What is not in dispute is the mechanism: an objective that rewards plausible continuation produces plausible continuation whether or not it is true.</p></div>`},

{label:'CLOSE', tag:'Mission 01 complete', title:'The loop is now in hand', stage:1, html:`
<ul class="own">
<li>A model is a file of numbers and an arrangement — no records, no index, no stored documents</li>
<li>Knowledge in the weights is diffuse and lossy, so it cannot be cited, cannot be edited, and blends similar facts</li>
<li>Six layers and four pillars, of which only the model layer is bought</li>
<li>Ten steps in a production request, of which the model performs two</li>
<li>Four levers, and only retrieval adds a fact the model never saw</li>
<li>The escalation ladder: prompt, then retrieve, then train — green, amber, red</li>
<li>Real cost runs about 2.4× the naive estimate, and the metric is cost per resolved task</li>
<li>Fluency carries no information about accuracy, because the objective rewarded fluency</li>
</ul>
<div class="next">
  <div class="lab">Mission 02 unlocks</div>
  <div class="ttl">The unit of everything</div>
  <p>Every quantity in this mission was measured in tokens — memory, latency, cost. Mission 02 opens the unit itself: what a token physically is, why the same sentence costs different amounts in different languages, and why the context window is a budget rather than a capacity.</p>
</div>`}

]},
{n:'02', title:'The Unit of Everything', stage:2,
 sub:'Memory, latency and the bill are all measured in tokens. This mission opens the unit itself — what it physically is, why the same sentence costs different amounts in different languages, and why the context window is a budget rather than a capacity.',
 covers:['What a token physically is','The four-character rule and where it fails','Why Indic scripts cost two to four times more','The context window as a budget','Input and output are not priced alike','Measuring rather than estimating'],
 cards:[

{label:'DEFINE', tag:'The unit', title:'Text becomes integers before anything else', stage:2, html:`
<p>A model performs arithmetic on numbers. Text is not numbers. The first step of every request converts one into the other, and the conversion is not letter-by-letter.</p>
<p>A <i class="term">tokeniser</i> holds a fixed vocabulary — typically 30,000 to 250,000 entries — of character sequences. Splitting text means finding the sequence of vocabulary entries that reconstructs it. Common words become one entry. Rare words fragment into several.</p>
<table class="tbl">
<tr><th>Text</th><th>Tokens</th></tr>
<tr><td>the<span class="sub">Extremely common — one entry</span></td><td>1</td></tr>
<tr><td>provisioning<span class="sub">Common enough in ordinary English</span></td><td>1–2</td></tr>
<tr><td>hypothecation<span class="sub">Rare — fragments</span></td><td>3–4</td></tr>
<tr><td>NPA1234/2024<span class="sub">Identifiers fragment badly</span></td><td>6–9</td></tr>
</table>
<div class="note"><div class="lab">Why the vocabulary is built this way</div><p>A vocabulary of whole words cannot represent a word it has never seen. A vocabulary of single characters makes every sequence enormously long. Sub-word vocabularies take the middle: frequent sequences get one entry, and anything unseen is still representable by falling back to smaller pieces. Nothing is ever out of vocabulary, and common text stays short.</p></div>`},

{label:'NUMBERS', tag:'The estimation rules', title:'Four characters, three quarters of a word', stage:2, html:`
<p class="kicker">Two ratios cover most English estimation, and both are approximations that fail in specific and predictable places.</p>
<div class="formula">≈ 4 characters per token<br><span style="font-size:14px;color:#A8AEB4">≈ 0.75 English words per token</span><small>English prose only</small></div>
<table class="tbl">
<tr><th>Object</th><th>Tokens</th></tr>
<tr><td>One A4 page of prose</td><td>≈ 550</td></tr>
<tr><td>One line of code</td><td>10–15</td></tr>
<tr><td>A 40-page appraisal memo</td><td>25,000–35,000</td></tr>
<tr><td>An annual report</td><td>150,000–400,000</td></tr>
</table>
<div class="note q"><div class="lab">Where the rule breaks</div><p>Code, tables, identifiers, JSON and numbers all tokenise far worse than prose — punctuation and digits fragment. A table that looks like half a page can cost more than three pages of text. <b>The estimate is for prose and nothing else.</b></p></div>
<div class="note g"><div class="lab">The discipline</div><p>Estimation is for a conversation. <b>Measurement is for a budget.</b> Every provider ships a tokeniser; running the actual production tokeniser over a representative sample takes minutes and removes an entire class of forecasting error.</p></div>`},

{label:'INDIA', tag:'The multiplier nobody budgets for', title:'Devanagari costs two to four times more', stage:2, html:`
<p>Tokeniser vocabularies are built from training corpora that are overwhelmingly English. A sequence that appears constantly in English earns a compact entry. A sequence that appears rarely does not, and fragments.</p>
<p>Indic scripts — Devanagari, Bengali, Tamil, Telugu, Kannada — are under-represented in those corpora. The same meaning therefore costs <b>two to four times as many tokens</b> as its English equivalent.</p>
<div class="ramp">
  <div class="a"><div class="t">English</div><div class="n">1×</div></div>
  <div class="b"><div class="t">Transliterated</div><div class="n">~1.5×</div></div>
  <div class="c"><div class="t">Devanagari</div><div class="n">2–4×</div></div>
</div>
<div class="note"><div class="lab">Three consequences, all of them practical</div><p><b>Cost.</b> The same conversation in Hindi costs two to four times as much as in English. A multilingual product has a cost structure that varies by language.</p><p><b>Latency.</b> Tokens are generated one at a time, so two to four times the tokens is two to four times the wait.</p><p><b>Context.</b> A context window measured in tokens holds two to four times less Hindi than English. A document that fits in English may not fit in Hindi.</p></div>
<div class="note q"><div class="lab">The planning error this produces</div><p>A pilot runs in English, unit economics are computed, the business case is approved, and the rollout is to a vernacular market. The forecast is wrong by a multiple before a single other assumption is tested — and nothing in the pilot would have revealed it.</p></div>`},

{label:'DEFINE', tag:'The window', title:'Context is a budget, not a bucket', stage:2, html:`
<p>The <i class="term">context window</i> is the maximum number of tokens a model can process in one request. It is shared by everything: system instructions, tool definitions, retrieved evidence, conversation history, the question, and the answer being generated.</p>
<table class="tbl free">
<tr><td><b>Bucket thinking</b></td><td>A window of 128,000 tokens means 128,000 tokens can be put in. Filling it is efficient use of what was paid for.</td></tr>
<tr><td><b>Budget thinking</b></td><td>Every token in the window is paid for, slows the response, and competes for the model's attention with every other token. Headroom is deliberate.</td></tr>
</table>
<div class="note"><div class="lab">The measured result that settles it</div><p>Retrieving five to eight passages is usually optimal. Retrieving thirty is <b>reliably worse and roughly four times the cost</b> — worse because the relevant passage is now diluted among irrelevant ones, and the model's attention is finite regardless of how large the window is.</p></div>
<div class="note q"><div class="lab">The trap in the marketing number</div><p>A large advertised window states what the model will accept, not what it will use well. Accuracy on a fact placed in the middle of a very long context degrades sharply — a pattern stable enough to have a name, and covered at stage 07 where evidence gets ordered deliberately.</p></div>`},

{label:'MECHANISM', tag:'Two prices', title:'Output costs five to eight times input', stage:2, html:`
<p>Input and output tokens are billed at different rates, and the gap is large. The reason is mechanical rather than commercial, and it is developed fully at stage 09.</p>
<table class="tbl free">
<tr><td><b>Input</b><span class="sub">Prefill</span></td><td>The whole prompt is processed at once, in parallel. Hardware runs near full utilisation. Cheap per token.</td></tr>
<tr><td><b>Output</b><span class="sub">Decode</span></td><td>Tokens are produced one at a time, each requiring the entire model to be read from memory. Hardware sits mostly idle waiting on memory. Expensive per token.</td></tr>
</table>
<div class="note"><div class="lab">What follows for prompt design</div><p>Because output is five to eight times more expensive, reducing output length is disproportionately valuable. Three instructions reliably cut it by 30 to 50 percent: do not restate the question, do not describe the process, and give a short fact in one sentence with its citation, expanding only on request.</p></div>
<div class="note g"><div class="lab">A control, not a formatting preference</div><p>A maximum output length should be set on every call. Left unset, a single malformed request can generate until it hits the model's own ceiling, and that is billed in full.</p></div>`},

{label:'WORKED', tag:'Token arithmetic', title:'Where the tokens actually go', stage:2, html:`
<p class="kicker">One request to a policy assistant, counted honestly. The visible question is the smallest line on the page.</p>
<ul class="steps">
<li><span class="op"><b>System instructions</b>Role, rules, output format, citation requirements</span><span class="res">900</span></li>
<li><span class="op"><b>Tool definitions</b>Four tools with schemas and descriptions</span><span class="res">1,400</span></li>
<li><span class="op"><b>Few-shot examples</b>Three worked question-and-answer pairs</span><span class="res">1,800</span></li>
<li><span class="op"><b>Retrieved evidence</b>Six passages at roughly 600 tokens each</span><span class="res">3,600</span></li>
<li><span class="op"><b>Conversation history</b>Four previous turns</span><span class="res">1,100</span></li>
<li><span class="op"><b>The question</b>What the analyst actually typed</span><span class="res">28</span></li>
<li class="total"><span class="op"><b>Total input</b></span><span class="res">8,828</span></li>
</ul>
<div class="note"><div class="lab">The proportion worth internalising</div><p>The question is <b>0.3 percent</b> of the input. Everything else is assembled by the system. This is why prompt engineering is a small lever and context engineering is a large one — and why the ordering of these blocks, covered at stage 09, is worth real money.</p></div>
<div class="note g"><div class="lab">Sanity check</div><p>The first three blocks total 4,100 tokens and are identical on every request. That is 46 percent of the input, unchanged, paid for every time — unless it is cached, which is the single highest-return optimisation in the stack and the reason block order matters at all.</p></div>`},

{label:'TRAP', tag:'Counting', title:'Characters divided by four is not a measurement', stage:2, html:`
<div class="bt">
<div class="pair">
  <div class="believed"><div class="lab">Commonly believed</div><div class="txt">Dividing the character count by four gives a token count accurate enough to budget with.</div></div>
  <div class="true"><div class="lab">What is true</div><div class="txt">It holds for English prose and fails for everything a production system actually processes. Tables, code, identifiers, JSON, numbers and non-Latin scripts all break it, and they break it upward — the true count is <b>higher</b>, sometimes by a multiple.</div></div>
</div>
</div>
<p style="margin-top:16px">Tokenisers also differ between model families. The same document measured against two providers' tokenisers returns two different counts, and a corpus migration between providers can change total volume by ten percent or more with no change to the corpus.</p>
<div class="note"><div class="lab">The rule</div><p>Estimate to hold a conversation. <b>Measure to sign a contract.</b> The production tokeniser, run over a representative sample of real documents, is the only number that belongs in a forecast.</p></div>`},

{label:'DEFINE', tag:'Special tokens', title:'The message structure is also tokens', stage:2, html:`
<p>A chat request is a list of messages with roles — system, user, assistant. That structure does not exist inside the model. It is flattened into one sequence of tokens using <i class="term">special tokens</i>: reserved vocabulary entries that mark where a turn begins, which role owns it, and where it ends.</p>
<p>The template that performs the flattening is specific to the model and ships with it. Using the wrong template degrades quality in ways that look like the model being weak rather than the plumbing being wrong.</p>
<div class="note q"><div class="lab">The security consequence, which returns at stage 13</div><p>Because roles are marked by tokens in the same sequence as everything else, <b>instructions and data travel on one channel</b>. There is no separate control path. Text that looks like a role marker, arriving inside a document, is in the same stream as the genuine markers. This single fact is the root of prompt injection, and it is why the defence has to be architectural rather than a matter of wording.</p></div>`},

{label:'TRADE-OFF', tag:'Chat templates', title:'Message roles are a convention, not a boundary', stage:2, html:`
<p class="kicker">The three roles carry real conventional weight, and none of it is enforced by the mechanism.</p>
<table class="tbl free">
<tr><td><b>system</b></td><td>Instructions, rules, persona. Models are trained to weight it heavily. It is not privileged in any technical sense.</td></tr>
<tr><td><b>user</b></td><td>The request. Trained to be treated as the thing to satisfy.</td></tr>
<tr><td><b>assistant</b></td><td>Prior model output, replayed as history. A model reads its own past turns as evidence of how it should continue.</td></tr>
</table>
<div class="note"><div class="lab">What the training gives, and what it does not</div><p>Training makes the model <i>tend</i> to follow the system role over the user role. Tendency is a statistical property, not a guarantee. A sufficiently insistent user message can override a system instruction, and a document containing convincing instructions can override both.</p></div>
<div class="note q"><div class="lab">The operating assumption</div><p><b>Assume the system prompt leaks.</b> It is recoverable often enough that no secret, credential, internal endpoint or confidential rule belongs in it. Anything that must not be disclosed belongs in code that the model cannot read.</p></div>`},

{label:'MECHANISM', tag:'Long documents', title:'Two ways to handle a document that will not fit', stage:2, html:`
<p class="kicker">An annual report runs 150,000 to 400,000 tokens. Two strategies exist, they are not interchangeable, and choosing wrongly is a common and expensive error.</p>
<table class="tbl free">
<tr><td><b>Split and retrieve</b></td><td>Break the document into passages, index them, fetch only the few that bear on the question. Cheap, fast, scales to any corpus size. Loses anything that requires seeing two distant parts together.</td></tr>
<tr><td><b>Load whole</b></td><td>Put the entire document in the window. Preserves every cross-reference. Costs the full token count on every request and degrades on precision within very long contexts.</td></tr>
</table>
<div class="note g"><div class="lab">The rule that resolves it</div><p><b>Retrieve at document level, then load whole documents</b> for work that is heavy in cross-references. This is not a compromise between the two — it is the correct answer for a specific and common shape of problem, where the right document must be identified cheaply but then read completely.</p></div>
<div class="note"><div class="lab">What long context does not replace</div><p>A large window does not remove the need for retrieval. Retrieval provides four things a window cannot: access control, provenance, correction of stale material, and the ability to search a corpus larger than any window. The first of those alone settles the question in a regulated firm.</p></div>`},

{label:'CLOSE', tag:'Mission 02 complete', title:'The unit is now legible', stage:2, html:`
<ul class="own">
<li>Text becomes integers through a fixed sub-word vocabulary; common sequences are cheap, rare ones fragment</li>
<li>Four characters per token, 0.75 words per token, 550 tokens per A4 page — for English prose only</li>
<li>Indic scripts cost two to four times more, which is a cost, latency and context multiplier at once</li>
<li>The context window is a budget; five to eight passages beat thirty, at a quarter of the cost</li>
<li>Output costs five to eight times input, for a mechanical reason covered at stage 09</li>
<li>The question is often under one percent of the input; the system assembles the rest</li>
<li>Roles are flattened into one token stream, which is why instructions and data share a channel</li>
</ul>
<div class="next">
  <div class="lab">Mission 03 unlocks</div>
  <div class="ttl">Meaning as distance</div>
  <p>Integers are still only identifiers. Mission 03 covers the step that turns them into positions in a space where similarity of meaning becomes measurable distance — the mechanism that makes search by meaning possible at all.</p>
</div>`}

]},

{n:'03', title:'Meaning as Distance', stage:3,
 sub:'Search by keyword finds documents containing a word. Search by meaning finds documents about a subject. This mission covers the representation that makes the second possible, and the specific things it fails at.',
 covers:['What an embedding physically is','Why similarity becomes geometry','Cosine similarity, computed by hand','What embeddings reliably fail at','Choosing and pinning a model','Why re-embedding a corpus is a migration'],
 cards:[

{label:'DEFINE', tag:'The representation', title:'A vector is a position in a space', stage:3, html:`
<p>An <i class="term">embedding</i> is a list of numbers — typically 384 to 3,072 of them — that represents a piece of text as a single point in a space with that many dimensions.</p>
<p>The property that makes it useful is arranged during training: <b>text with similar meaning is placed close together</b>, and text with different meaning far apart. Not similar spelling. Similar meaning.</p>
<div class="formula">"restructured advance"<br>→ [0.021, −0.184, 0.339, … ]<small>1,024 numbers, one point</small></div>
<p>Two consequences follow immediately. Similarity of meaning becomes a distance, which is arithmetic and therefore fast. And a passage using entirely different words from the query can still be found, because proximity was never about the words.</p>
<div class="note"><div class="lab">Where the arrangement came from</div><p>An embedding model is trained on enormous numbers of text pairs known to be related — a question and its answer, a title and its article, two paraphrases. The training objective pulls related pairs together and pushes unrelated ones apart. The resulting geometry is learned, not designed, and it inherits whatever the training data contained.</p></div>`},

{label:'WORKED', tag:'The measurement', title:'Cosine similarity, by hand', stage:3, html:`
<p class="kicker">Similarity is measured by the angle between two vectors, not the distance between their tips. Three dimensions instead of a thousand, so every step is checkable.</p>
<div class="formula">cos(A,B) = (A · B) ÷ (|A| × |B|)<small>dot product over the product of lengths</small></div>
<ul class="steps">
<li><span class="op"><b>Vector A</b>"loan default"</span><span class="res">[3, 1, 2]</span></li>
<li><span class="op"><b>Vector B</b>"borrower non-payment"</span><span class="res">[2, 1, 3]</span></li>
<li><span class="op"><b>Dot product</b>3×2 + 1×1 + 2×3</span><span class="res">13</span></li>
<li><span class="op"><b>Length of A</b>√(9 + 1 + 4)</span><span class="res">3.742</span></li>
<li><span class="op"><b>Length of B</b>√(4 + 1 + 9)</span><span class="res">3.742</span></li>
<li class="total"><span class="op"><b>Cosine similarity</b>13 ÷ (3.742 × 3.742)</span><span class="res">0.929</span></li>
</ul>
<div class="note"><div class="lab">Reading the number</div><p>The result runs from −1 to 1. Above roughly 0.85 is strong relatedness, 0.5 to 0.7 is loose topical overlap, and near 0 is unrelated. The exact bands differ by model, which is why a threshold copied from one model to another is meaningless.</p></div>
<div class="note g"><div class="lab">Why angle rather than distance</div><p>Angle ignores magnitude. A long document and a short sentence about the same subject point in nearly the same direction while having very different lengths. Measuring the angle makes length irrelevant, which is exactly what is wanted when comparing a six-word query to a 600-token passage.</p></div>`},

{label:'TRAP', tag:'The failure that defines the architecture', title:'Embeddings are bad at identifiers', stage:3, html:`
<div class="bt">
<div class="pair">
  <div class="believed"><div class="lab">Commonly believed</div><div class="txt">Search by meaning is strictly better than search by keyword, so a vector index replaces the older approach entirely.</div></div>
  <div class="true"><div class="lab">What is true</div><div class="txt">Embeddings capture meaning, and an identifier has no meaning. A circular number, a policy version, a rare acronym, a product code, a customer reference — these are strings that must match exactly, and a model trained to place similar meanings nearby has nothing to work with.</div></div>
</div>
</div>
<p style="margin-top:16px">A query for a specific circular number will happily return a dozen passages about similar-sounding circulars and rank the correct one below them. The failure is silent: results come back, they look plausible, and the right passage is absent.</p>
<div class="note q"><div class="lab">Why this matters more here than elsewhere</div><p>Regulatory and banking queries are made almost entirely of the things embeddings are worst at — circular numbers, section references, defined terms, exact thresholds. A retrieval system for this material built on vector search alone will fail on precisely the queries that matter most.</p></div>
<div class="note g"><div class="lab">What this forces, developed at stage 06</div><p>Keyword search is not a legacy technique retained for compatibility. It is a required second channel, and the two are run together and their results merged. That combination is not an optimisation — it is a correction for a known and permanent weakness.</p></div>`},

{label:'MECHANISM', tag:'Two roles, two models', title:'Encoding once versus reading together', stage:3, html:`
<p class="kicker">Two different architectures both produce relevance scores, and the difference between them determines the entire shape of a retrieval pipeline.</p>
<table class="tbl free">
<tr><td><b>Bi-encoder</b><span class="sub">The embedding model</span></td><td>Encodes the query and each document <i>separately</i>. Documents are encoded once, in advance, and stored. At query time only the query is encoded, then compared arithmetically against millions of stored vectors. Fast. Imprecise, because neither side ever saw the other.</td></tr>
<tr><td><b>Cross-encoder</b><span class="sub">The reranker</span></td><td>Reads the query and one document <i>together</i> in a single pass, and scores that specific pairing. Far more accurate. Cannot be precomputed, because the score does not exist until both are present.</td></tr>
</table>
<div class="note"><div class="lab">The arithmetic that forces the two-stage design</div><p>A cross-encoder over a million documents means a million model passes per query — impossible. A bi-encoder over a million documents means one model pass and a million cheap comparisons — trivial. So the bi-encoder narrows a corpus to a hundred candidates, and the cross-encoder re-scores those hundred properly. <b>Two stages are forced by arithmetic, not chosen for elegance.</b></p></div>`},

{label:'TRADE-OFF', tag:'Choosing a model', title:'Dimensions cost storage and buy little', stage:3, html:`
<p class="kicker">Embedding models differ on four axes, and the one that draws the most attention matters the least.</p>
<table class="tbl free">
<tr><td><b>Dimensions</b></td><td>384 to 3,072. More dimensions means more storage and slower comparison, for gains that are usually small. The largest option is rarely the right one.</td></tr>
<tr><td><b>Maximum input length</b></td><td>How much text can be embedded at once. Matters directly for chunk size decisions at stage 06.</td></tr>
<tr><td><b>Domain fit</b></td><td>A model trained largely on general web text handles regulatory and financial language less well than one exposed to it. This axis moves results far more than dimensionality does.</td></tr>
<tr><td><b>Multilingual capability</b></td><td>Whether a Hindi query can retrieve an English passage on the same subject. A product decision, not a technical detail.</td></tr>
</table>
<div class="note"><div class="lab">How to choose without guessing</div><p>Public leaderboards rank models on general benchmarks that resemble nobody's corpus. The only reliable method is to build a small labelled set — a few hundred real queries with their known correct passages — and measure candidate models on it. That set is built at stage 11 and pays for itself immediately here.</p></div>`},

{label:'TRAP', tag:'The migration nobody plans', title:'Changing the embedding model rebuilds the index', stage:3, html:`
<div class="bt">
<div class="pair">
  <div class="believed"><div class="lab">Commonly believed</div><div class="txt">A better embedding model has been released, so it can be swapped in the way a stronger generation model is swapped in.</div></div>
  <div class="true"><div class="lab">What is true</div><div class="txt">Vectors from different models live in different spaces. A query vector from the new model compared against document vectors from the old one produces numbers that are arithmetically valid and semantically meaningless. <b>Every document in the corpus must be re-embedded</b>, and until that finishes the index is not partially upgraded — it is broken.</div></div>
</div>
</div>
<p style="margin-top:16px">For a corpus of any size this is a migration with a cost, a duration, a dual-write period and a rollback plan. It is not a configuration change.</p>
<div class="note"><div class="lab">The operating rules</div><p><b>Pin the embedding model version explicitly.</b> Never point at a moving alias. Record which model version produced every stored vector, so a mixed index is detectable rather than silently wrong. And treat any change to it as a scheduled migration with the same seriousness as a schema change to a production database.</p></div>`},

{label:'MECHANISM', tag:'Finding the nearest', title:'Approximate search, and the recall it silently loses', stage:3, html:`
<p class="kicker">Comparing a query against every vector in a corpus is exact and linear in corpus size. At scale that is too slow, so the search is made approximate — and the approximation has a cost that is invisible unless deliberately measured.</p>
<table class="tbl free">
<tr><td><b>Flat index</b></td><td>Compare against everything. Exact by construction. Slow at scale. <b>This is the ground truth</b> against which everything else is measured.</td></tr>
<tr><td><b>Graph index</b></td><td>A layered graph where each vector links to its neighbours. Search enters at a coarse layer and descends greedily toward the query. Orders of magnitude faster, and it can miss.</td></tr>
</table>
<div class="note"><div class="lab">The dials</div><p>Two are set when the index is built, controlling how many links each vector keeps and how hard the builder works to find good ones. A third is set at query time and controls how widely the search explores before stopping — typically 50 to 200, and the only one adjustable without a rebuild. Raising it costs latency and buys recall.</p></div>
<div class="note q"><div class="lab">The most common invisible failure in the stack</div><p>An approximate index returning 70 percent of the correct nearest neighbours looks identical, from the outside, to one returning 99 percent. Results come back, they are relevant, latency is good. Thirty percent of the corpus is simply unreachable, and no downstream stage can recover a passage that was never a candidate.</p><p><b>The check: build a flat index over a sample, run the same queries against both, and measure what fraction of the exact results the approximate index returned.</b> Anything below 0.95 needs the runtime dial raised.</p></div>`},

{label:'DEFINE', tag:'What embeddings are not', title:'Proximity is not entailment', stage:3, html:`
<p>Two passages placed close together are <i>about</i> similar things. That is the whole guarantee. Four things it does not provide, each of which has caused a production failure somewhere.</p>
<table class="tbl free">
<tr><td><b>Not agreement</b></td><td>A passage stating a rule and a passage withdrawing that rule are about the same subject and sit close together. Nothing in the geometry distinguishes them.</td></tr>
<tr><td><b>Not recency</b></td><td>A 2019 circular and its 2024 replacement are near-identical in meaning and therefore near-identical in position. Temporal ordering is metadata, never geometry.</td></tr>
<tr><td><b>Not negation</b></td><td>"Permitted for secured advances" and "not permitted for secured advances" differ by one token and sit extremely close together.</td></tr>
<tr><td><b>Not entitlement</b></td><td>Nothing about who may read a passage is encoded in its position. Access control is applied as a filter on the query, and it must be applied before the search rather than after it.</td></tr>
</table>
<div class="note"><div class="lab">The design consequence</div><p>Every one of these is handled with structured metadata attached to each passage — effective dates, superseding references, entitlement tags — and enforced in the query. <b>The vector finds candidates; the metadata decides which are admissible.</b> A system that relies on the geometry alone will confidently cite a withdrawn circular to a reader who was never entitled to see it.</p></div>`},

{label:'THE HARD QUESTION', tag:'The uncomfortable one', title:'Whose meaning is in the space?', stage:3, html:`
<p>The geometry is learned from pairs of texts labelled as related. Which pairs, and by whom, determines what "similar" comes to mean — and that judgement is inherited wholesale, without ever being stated.</p>
<p>Where training data over-represents general web English, technical and regulatory language is positioned less precisely, because the model saw fewer examples of what distinguishes one clause from another. Where it under-represents a language, that language's passages cluster more tightly among themselves and separate less cleanly by topic — meaning retrieval quality varies by language in a way that no aggregate metric will show.</p>
<p><b>This is a real limitation and it is not fixable from outside the model.</b> The vectors encode a specific, unstated notion of similarity, and a system built on them inherits it silently.</p>
<div class="note q"><div class="lab">What can actually be done</div><p>Not much, directly — which is the honest answer. What is available is measurement: build the labelled set with slices for language, document type and query type, and report retrieval quality separately for each. That converts an invisible inherited bias into a visible number that can be argued about, budgeted against, and compensated for with keyword search where it is worst.</p></div>
<div class="note"><div class="lab">Where this claim is thinner than it sounds</div><p>That under-representation degrades retrieval is well established in aggregate. Predicting <i>which</i> queries a given model will handle badly, in advance, from properties of the corpus alone, is not currently reliable. Measurement on the actual corpus remains the only trustworthy method.</p></div>`},

{label:'CLOSE', tag:'Mission 03 complete', title:'Meaning is now measurable', stage:3, html:`
<ul class="own">
<li>An embedding is a point in a space where similar meaning is nearby, learned from related text pairs</li>
<li>Cosine similarity measures the angle, which makes document length irrelevant</li>
<li>Embeddings fail on identifiers, circular numbers and rare acronyms — exactly what regulatory queries contain</li>
<li>Bi-encoders narrow, cross-encoders re-score; two stages are forced by arithmetic</li>
<li>Approximate search can silently lose 30 percent of a corpus, and only a flat baseline reveals it</li>
<li>Proximity is not agreement, recency, negation or entitlement — those are metadata</li>
<li>Changing the embedding model is a full corpus migration, not a configuration change</li>
</ul>
<div class="next">
  <div class="lab">Mission 04 unlocks</div>
  <div class="ttl">Every token looks at every token</div>
  <p>Embeddings represent text as isolated points. Mission 04 covers the mechanism that lets each token be interpreted in the light of every other — the transformer — and why that mechanism makes long context expensive in a specific, predictable way.</p>
</div>`}

]},

{n:'04', title:'Every Token Looks at Every Token', stage:4,
 sub:'The mechanism at the centre of every current model, taken far enough to explain why context costs what it costs, why memory rather than compute is the binding constraint, and where every serving optimisation later comes from.',
 covers:['Why context changes meaning','Attention as query, key and value','Why cost grows with the square of length','The causal mask and what it forces','The KV cache and its price per token','Why memory, not compute, is the ceiling'],
 cards:[

{label:'ORIENT', tag:'The problem being solved', title:'The same word is not the same thing twice', stage:4, html:`
<p>A fixed vector per word cannot be right. In "the bank raised its provisioning" and "the river bank eroded", one string carries two unrelated meanings, and any representation assigning it a single position is wrong in at least one of the two.</p>
<p>What is needed is a representation of each token <i>in the light of the tokens around it</i> — one that starts from a generic vector and adjusts it according to context. That adjustment is what attention performs, and performing it repeatedly, in layers, is what a transformer is.</p>
<div class="note"><div class="lab">Why this determines everything downstream</div><p>Interpreting every token in the light of every other token means every token must be compared against every other token. That requirement is the source of the quadratic cost, the memory ceiling, the KV cache, and effectively every optimisation covered at stage 09. The expense is not an implementation flaw. It is the price of the capability.</p></div>`},

{label:'MECHANISM', tag:'The operation', title:'Query, key and value', stage:4, html:`
<p class="kicker">Each token produces three vectors, and their names describe the roles precisely.</p>
<table class="tbl free">
<tr><td><b>Query</b></td><td>What this token is looking for in order to be understood properly.</td></tr>
<tr><td><b>Key</b></td><td>What this token offers to tokens that are looking.</td></tr>
<tr><td><b>Value</b></td><td>What this token actually contributes once it has been selected.</td></tr>
</table>
<p>Every token's query is compared against every token's key. Strong matches produce high scores, the scores are converted into weights summing to one, and each token's new representation becomes a weighted blend of all the values.</p>
<div class="formula">softmax( Q·Kᵀ ÷ √d + mask ) · V<small>the entire operation</small></div>
<div class="note"><div class="lab">The three parts of the formula</div><p><b>Q·Kᵀ</b> compares every query against every key, producing a score for every pair. <b>Division by √d</b> keeps those scores in a range where the next step behaves — without it, high-dimensional dot products grow large enough to make the weights collapse onto a single token. <b>softmax</b> turns scores into weights that sum to one. Multiplying by <b>V</b> produces the blend.</p></div>
<div class="note g"><div class="lab">Reading it in one sentence</div><p>Each token asks a question, every token answers with how well it matches, and the answers are averaged in proportion to how well they matched.</p></div>`},

{label:'WORKED', tag:'The cost curve', title:'Doubling the prompt quadruples the work', stage:4, html:`
<p class="kicker">Every token compared against every token means the number of comparisons is the square of the number of tokens. Small at short lengths, dominant at long ones.</p>
<ul class="steps">
<li><span class="op"><b>500 tokens</b>500 × 500 pairs</span><span class="res">250,000</span></li>
<li><span class="op"><b>1,000 tokens</b>Twice the length</span><span class="res">1,000,000</span></li>
<li><span class="op"><b>4,000 tokens</b>Eight times the length</span><span class="res">16,000,000</span></li>
<li><span class="op"><b>32,000 tokens</b>Sixty-four times the length</span><span class="res">1,024,000,000</span></li>
<li class="total"><span class="op"><b>128,000 tokens</b>256 times the length</span><span class="res">16,384,000,000</span></li>
</ul>
<div class="note"><div class="lab">Reading the table</div><p>Length rose 256-fold; attention work rose <b>65,536-fold</b>. This is why time-to-first-token degrades sharply on long prompts while short ones feel instant, and it is the direct mechanical reason that retrieving six good passages beats retrieving thirty mediocre ones.</p></div>
<div class="note g"><div class="lab">The qualifier that keeps this honest</div><p>Attention is quadratic, but it is not the whole model — the feed-forward layers are linear in length and dominate at short sequences. So total cost is not literally 65,536 times greater; attention's <i>share</i> of it grows until it dominates. The practical rule holds regardless: long prompts get disproportionately expensive, and the penalty accelerates.</p></div>`},

{label:'DEFINE', tag:'Direction', title:'The mask that makes generation possible', stage:4, html:`
<p>A model that generates text must not see the future. When predicting the fifth token, the sixth does not exist yet — and during training, where the whole sequence is present, allowing position five to see position six would let the model simply copy the answer.</p>
<p>The <i class="term">causal mask</i> enforces this. Before the scores become weights, every score for a position later than the current one is set to negative infinity, which the softmax converts to a weight of exactly zero.</p>
<div class="note"><div class="lab">Why this is the pivotal design choice</div><p>Each token attends only to itself and everything before it. So the key and value vectors for a token, once computed, <b>never change</b> — nothing arriving later can alter them. That immutability is what makes it possible to compute them once and keep them, which is the next card and the foundation of everything at stage 09.</p></div>
<div class="note g"><div class="lab">The contrast worth holding</div><p>Embedding models, which classify or compare rather than generate, use no mask — every token sees every other in both directions, which is why they can represent a passage's full meaning in one pass. Generation is one-directional by necessity. That difference is the entire reason the bi-encoder and the generation model are separate components.</p></div>`},

{label:'MECHANISM', tag:'The cache', title:'Computing each key once, and keeping it', stage:4, html:`
<p class="kicker">Generating a hundred tokens naively means running the whole sequence a hundred times, recomputing keys and values that cannot possibly have changed. The causal mask guarantees they have not.</p>
<div class="dia">
<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram contrasting recomputing all keys and values each step with caching them">
  <g font-family="IBM Plex Sans, sans-serif">
    <text x="0" y="10" font-family="IBM Plex Mono, monospace" font-size="8" fill="#D9584A" letter-spacing="1.2">WITHOUT CACHE — RECOMPUTE EVERYTHING</text>
    <rect x="0" y="18" width="26" height="16" rx="2" fill="#14171A" stroke="#D9584A"/>
    <rect x="30" y="18" width="26" height="16" rx="2" fill="#14171A" stroke="#D9584A"/>
    <rect x="60" y="18" width="26" height="16" rx="2" fill="#14171A" stroke="#D9584A"/>
    <rect x="90" y="18" width="26" height="16" rx="2" fill="#14171A" stroke="#D9584A"/>
    <rect x="120" y="18" width="26" height="16" rx="2" fill="#E0A73E" stroke="#E0A73E"/>
    <text x="156" y="30" font-size="9" fill="#A8AEB4">5 computed, every step</text>

    <text x="0" y="58" font-family="IBM Plex Mono, monospace" font-size="8" fill="#6FBF9B" letter-spacing="1.2">WITH CACHE — REUSE, APPEND ONE</text>
    <rect x="0" y="66" width="26" height="16" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <rect x="30" y="66" width="26" height="16" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <rect x="60" y="66" width="26" height="16" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <rect x="90" y="66" width="26" height="16" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <rect x="120" y="66" width="26" height="16" rx="2" fill="#6FBF9B" stroke="#6FBF9B"/>
    <text x="156" y="78" font-size="9" fill="#A8AEB4">4 read from memory, 1 new</text>

    <line x1="0" y1="98" x2="300" y2="98" stroke="#242A30"/>
    <text x="0" y="116" font-size="9.5" fill="#EDEAE4" font-weight="500">The trade</text>
    <text x="0" y="130" font-size="8.5" fill="#767D84">Compute per step falls from O(n) to O(1)</text>
    <text x="0" y="142" font-size="8.5" fill="#E0A73E">Memory per user grows with every token generated</text>
  </g>
</svg>
<div class="cap">Grey means read from memory · <b>amber and green mean computed now</b></div>
</div>
<p>The <i class="term">KV cache</i> holds every key and value vector already computed. Each new token computes only its own, appends them, and attends over the stored set. Compute per step becomes constant instead of growing with length — and the saving is paid for in memory.</p>`},

{label:'WORKED', tag:'The memory bill', title:'What a conversation costs to hold', stage:4, html:`
<p class="kicker">The cache is per user and per conversation. Nothing about it is shared, which makes it the binding constraint on how many people a machine can serve at once.</p>
<div class="formula" style="font-size:13px">2 × layers × kv_heads × head_dim × bytes<small>KV cache, per token</small></div>
<ul class="steps">
<li><span class="op"><b>A 70B model with grouped attention</b>Per token, both keys and values</span><span class="res">≈ 320 KB</span></li>
<li><span class="op"><b>8,000-token context</b>320 KB × 8,000</span><span class="res">2.6 GB</span></li>
<li><span class="op"><b>128,000-token context</b>320 KB × 128,000</span><span class="res">41.0 GB</span></li>
<li class="total"><span class="op"><b>Weights at 2 bytes per parameter</b>Before a single user connects</span><span class="res">140 GB</span></li>
</ul>
<div class="note q"><div class="lab">The arithmetic that ends the argument</div><p>An accelerator with 80 GB of memory cannot hold a 140 GB model at all. Two of them can, with 20 GB spare — which is <b>seven concurrent users at 8,000 tokens each, or not even one at 128,000.</b></p><p>Long context is not a feature that costs a little more. It is a feature that collapses concurrency, and concurrency is what makes a deployment affordable.</p></div>
<div class="note g"><div class="lab">The planning rule</div><p>Weights plus peak KV cache should stay at or below 85 percent of card capacity. The remainder absorbs activations and fragmentation. Planning to 100 percent produces a system that works in testing and fails under real concurrency.</p></div>`},

{label:'MECHANISM', tag:'The main lever on cache size', title:'Sharing keys across query heads', stage:4, html:`
<p class="kicker">Attention runs in parallel <i class="term">heads</i> — typically 32 to 128 of them — each learning a different kind of relationship. One tracks grammatical dependency, another subject reference, another numerical association. Their outputs are concatenated.</p>
<p>Naively, each head keeps its own keys and values, so cache size scales with head count. The dominant fix is to let several query heads share one set of keys and values.</p>
<table class="tbl">
<tr><th>Arrangement</th><th>Cache</th></tr>
<tr><td>Every head keeps its own<span class="sub">Maximum expressiveness</span></td><td>1×</td></tr>
<tr class="hi"><td>Groups of query heads share<span class="sub">The current default</span></td><td>≈ ¼</td></tr>
<tr><td>All heads share one set<span class="sub">Smallest cache, measurable quality loss</span></td><td>1/32×</td></tr>
</table>
<div class="note"><div class="lab">Why the middle option won</div><p>Sharing across all heads cuts the cache dramatically and costs measurable quality. Grouping recovers nearly all of the quality at nearly all of the saving. A roughly fourfold cut in cache size is a fourfold increase in concurrent users, which is the difference between a viable deployment and an unaffordable one.</p></div>`},

{label:'DEFINE', tag:'Order', title:'Position has to be injected deliberately', stage:4, html:`
<p>Attention compares every token with every token, and comparison has no inherent order. Without an explicit signal, "the borrower defaulted" and "defaulted borrower the" produce identical sets of pairwise scores.</p>
<p>Order is therefore added on purpose. The current standard rotates each token's query and key vectors by an angle proportional to its position, so that the score between two tokens depends on the <i>difference</i> between their positions rather than their absolute values.</p>
<div class="note"><div class="lab">Why relative position is the better design</div><p>A model that learns relative distance generalises past the lengths it was trained on. A model keyed to absolute positions has nothing to say about position 40,000 if it never saw one. This is the mechanism behind context-length extension — the rotation is rescaled so trained relationships stretch over a longer range.</p></div>
<div class="note q"><div class="lab">What stretching costs</div><p>Extension is a real capability and it is not free. Accuracy on material placed in the middle of an extended context degrades noticeably, which is why a large advertised window states what will be accepted rather than what will be used well. Placing the most important evidence at the start and the end of the assembled context, covered at stage 07, is a direct response to this.</p></div>`},

{label:'TRADE-OFF', tag:'Total versus active parameters', title:'Two numbers, two different constraints', stage:4, html:`
<p class="kicker">Some models activate only a fraction of their parameters on any given token, routing each one to a small subset of specialised sub-networks. This separates a model's memory requirement from its speed.</p>
<table class="tbl free">
<tr><td><b>Total parameters</b></td><td>Every parameter must be resident in memory, because any of them might be needed for the next token. <b>This sets the hardware requirement.</b></td></tr>
<tr><td><b>Active parameters</b></td><td>Only the routed subset participates in each token's computation. <b>This sets the speed and the compute cost.</b></td></tr>
</table>
<div class="note"><div class="lab">What this buys and what it costs</div><p>A model with a very large total and a modest active count reasons with the breadth of the larger number while running at the speed of the smaller one. The cost is that the full total still has to fit in memory — the arrangement buys speed, never hardware relief.</p></div>
<div class="note q"><div class="lab">The specification error this produces</div><p>Reading only the headline parameter count and sizing hardware from the active number produces a deployment that cannot load the model. Reading only the total and forecasting cost from it overstates the compute bill substantially. <b>Both numbers are needed, and they answer different questions.</b></p></div>`},

{label:'CLOSE', tag:'Mission 04 complete', title:'The mechanism is now accountable', stage:4, html:`
<ul class="own">
<li>Attention re-represents each token in the light of every other, using query, key and value</li>
<li>Every-pair comparison makes attention cost grow with the square of sequence length</li>
<li>The causal mask stops a token seeing the future, which freezes earlier keys and values forever</li>
<li>That immutability is what permits the KV cache: constant compute per step, growing memory per user</li>
<li>A 70B model at 128k context needs 41 GB of cache per user, against 140 GB of weights</li>
<li>Grouped attention cuts the cache roughly fourfold, which is roughly fourfold the concurrency</li>
<li>Position is injected by rotation, and stretching it degrades accuracy in the middle of long contexts</li>
<li>Total parameters set the hardware; active parameters set the speed</li>
</ul>
<div class="next">
  <div class="lab">Mission 05 unlocks</div>
