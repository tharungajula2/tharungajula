  <div class="ttl">Choosing the next token</div>
  <p>Attention produces a score for every possible next token. Mission 05 covers what happens to those scores — how one token gets picked, which dial controls it, and why setting that dial to zero does not buy reproducibility.</p>
</div>`}

]},
{n:'05', title:'Choosing the Next Token', stage:5,
 sub:'The model outputs a probability for every token in its vocabulary. Everything experienced as creativity, consistency, rambling or repetition is decided by the rule that picks one — and that rule is a configuration setting.',
 covers:['From scores to probabilities','What temperature actually changes','Why nucleus sampling beats a fixed cut','Settings by task, with reasons','Why temperature zero is not reproducible','Structured output, and how it is enforced'],
 cards:[

{label:'MECHANISM', tag:'The output', title:'A number for every token in the vocabulary', stage:5, html:`
<p>The final layer produces one raw score — a <i class="term">logit</i> — for every entry in the vocabulary. For a 128,000-entry vocabulary that is 128,000 numbers, on every single token generated.</p>
<p>Raw scores are unbounded and not comparable. Softmax converts them into probabilities that are positive and sum to one, by exponentiating each and dividing by the total.</p>
<div class="formula">P(tokenᵢ) = e^(zᵢ) ÷ Σ e^(zⱼ)<small>softmax over the vocabulary</small></div>
<div class="note"><div class="lab">Why exponentiation and not simple normalisation</div><p>Exponentiating magnifies differences. A score of 8 against a score of 6 becomes roughly a sevenfold probability ratio rather than a 1.33-fold one. The model's mild preferences become decisive ones, which is what makes the output coherent rather than a wander through moderately plausible words.</p></div>
<div class="note g"><div class="lab">Where this reappears</div><p>These probabilities are also the raw material for confidence estimation. The gap between the top token's probability and the second's carries real information about how determined the model was — and at stage 11 that becomes a usable signal for routing and escalation.</p></div>`},

{label:'DEFINE', tag:'The dial', title:'Temperature reshapes the distribution', stage:5, html:`
<p><i class="term">Temperature</i> divides every score before softmax is applied. It changes nothing about what the model computed; it changes how sharply those computations are converted into probabilities.</p>
<table class="tbl">
<tr><th>Setting</th><th>Effect</th></tr>
<tr><td>Below 1<span class="sub">Scores are magnified</span></td><td>Sharper</td></tr>
<tr><td>Exactly 1<span class="sub">Untouched</span></td><td>As trained</td></tr>
<tr><td>Above 1<span class="sub">Scores are compressed</span></td><td>Flatter</td></tr>
</table>
<p>At low temperature the leading token takes almost all the probability mass and output becomes highly consistent. At high temperature the distribution flattens, unlikely tokens become reachable, and output becomes varied — and, past a point, incoherent.</p>
<div class="note"><div class="lab">The distinction that gets blurred</div><p>Temperature does not make a model more or less capable, more or less accurate, or more or less careful. <b>It changes only how much probability mass sits away from the top choice.</b> A high temperature does not produce insight; it produces a wider sample from the same distribution, including its tail.</p></div>`},

{label:'MECHANISM', tag:'Truncation', title:'Cut by probability mass, not by count', stage:5, html:`
<p class="kicker">Even at low temperature, the tail holds thousands of tokens with tiny probabilities. Collectively they carry enough mass to be picked occasionally, and when one is, the output derails. Two methods cut the tail off.</p>
<table class="tbl free">
<tr><td><b>Fixed count</b></td><td>Keep the top k tokens, discard the rest. Simple, and wrong in both directions: where the model is confident and one token deserves everything, k−1 poor candidates are kept alive; where it is genuinely uncertain across many reasonable options, most get discarded.</td></tr>
<tr><td><b>Nucleus</b></td><td>Sort by probability and keep the smallest set whose total reaches a threshold — typically 0.90 to 0.95. The set is small when the model is confident and large when it is not. <b>It adapts to the shape of the distribution.</b></td></tr>
</table>
<div class="note g"><div class="lab">The recommendation, and why</div><p>Nucleus sampling is preferred over a fixed count in essentially all cases, because the correct number of candidates depends on the model's confidence at that position and a fixed count cannot express that. Values of 0.90 to 0.95 are the working range.</p></div>`},

{label:'NUMBERS', tag:'Settings by task', title:'What to set, and why', stage:5, html:`
<table class="tbl free">
<tr><td><b>0 – 0.2</b><span class="sub">Extraction, classification, code, structured output</span></td><td>One right answer exists. Variation is pure downside — it produces inconsistency between runs on identical input, which is indefensible in an audited process.</td></tr>
<tr><td><b>0.3 – 0.5</b><span class="sub">Grounded question answering, summarisation</span></td><td>The content is fixed by the evidence; only phrasing should move. Enough freedom to write naturally, not enough to invent.</td></tr>
<tr><td><b>0.7 – 1.0</b><span class="sub">Drafting, ideation, generating test cases</span></td><td>Variation is the point. Repeated calls should produce genuinely different candidates.</td></tr>
</table>
<div class="note"><div class="lab">Two settings that belong on every call</div><p><b>A maximum output length</b>, as a cost control rather than a formatting preference — unset, a malformed request generates to the model's own ceiling and is billed for it. <b>Stop sequences</b>, which halt generation when a specified string appears, so the model does not continue past a completed answer into invented follow-up dialogue.</p></div>
<div class="note q"><div class="lab">The mistake this table prevents</div><p>Raising temperature is a common response to output that seems flat or repetitive. When the real cause is a weak prompt or missing evidence, the result is output that is equally wrong and now inconsistent between runs — which is strictly worse, because the failure becomes intermittent and therefore harder to reproduce and diagnose.</p></div>`},

{label:'TRAP', tag:'Reproducibility', title:'Temperature zero is consistent, not reproducible', stage:5, html:`
<div class="bt">
<div class="pair">
  <div class="believed"><div class="lab">Commonly believed</div><div class="txt">Temperature zero always selects the highest-probability token, so identical input must produce identical output — which is what an auditor requires.</div></div>
  <div class="true"><div class="lab">What is true</div><div class="txt">Temperature zero removes randomness from the <i>selection</i> rule. It does not make the <i>computation</i> deterministic. Floating-point addition is not associative, so summing the same numbers in a different order gives a very slightly different result. Batch composition, hardware, and engine version all change that order.</div></div>
</div>
</div>
<p style="margin-top:16px">When two tokens have nearly identical probabilities, a difference in the twelfth decimal place decides which is highest — and from that point the two outputs diverge completely. It is uncommon, it is not rare enough to ignore, and it cannot be configured away.</p>
<div class="note q"><div class="lab">The consequence for evidence</div><p>An audit requirement to reproduce a past decision cannot be met by re-running the model. <b>It is met by having recorded the output.</b> A full trace — prompt, response, model version, settings — is the evidence. Re-execution is not, and a system designed on the assumption that it is has no defensible record.</p></div>`},

{label:'MECHANISM', tag:'Structured output', title:'Constraining the vocabulary at each step', stage:5, html:`
<p class="kicker">Asking for JSON in the prompt produces JSON most of the time. Most of the time is not a contract. A stronger method exists and it operates on the sampling step itself.</p>
<table class="tbl free">
<tr><td><b>Ask in the prompt</b></td><td>Instruct the model to return a specific shape. Works often, fails silently, and the failure rate rises on unusual inputs — exactly when it matters.</td></tr>
<tr><td><b>Constrain the sampling</b></td><td>Before each token is chosen, compute which tokens could still lead to a valid document under the schema, and set every other token's probability to zero. <b>Invalid output becomes unreachable rather than unlikely.</b></td></tr>
</table>
<div class="note"><div class="lab">What this does and does not guarantee</div><p>It guarantees the <i>shape</i>: valid JSON, required fields present, values of the declared type. It guarantees nothing about the <i>content</i> — a correctly-typed field can hold a fabricated figure. Schema conformance and factual accuracy are separate properties requiring separate checks, and the second is stage 11.</p></div>
<div class="note q"><div class="lab">Where it degrades quietly</div><p>Heavily quantised models lose schema conformance before they lose fluency, because constrained decoding depends on fine distinctions among low-probability tokens. A model that reads well and quietly stopped producing valid output on eight percent of calls is a specific, documented failure mode at stage 09, and only slice-level measurement catches it.</p></div>`},

{label:'TRADE-OFF', tag:'Thinking tokens', title:'Reasoning is generated text, and it is billed', stage:5, html:`
<p>A reasoning model generates an internal trace before its visible answer. Mechanically this is ordinary generation — the same loop, the same sampling — and every token of it is billed at the output rate.</p>
<ul class="steps">
<li><span class="op"><b>Visible answer</b>Roughly 200 words</span><span class="res">400 tokens</span></li>
<li><span class="op"><b>Internal trace</b>Never displayed</span><span class="res">2,100 tokens</span></li>
<li class="total"><span class="op"><b>Billed as output</b>At the output rate</span><span class="res">2,500 tokens</span></li>
</ul>
<div class="note"><div class="lab">Where it earns its cost</div><p>Multi-step arithmetic, chains of conditional policy logic, and problems where an early wrong turn must be caught before it propagates. On extraction, classification, summarisation and grounded retrieval answering, it adds latency and cost for little or no gain — the work does not decompose into steps.</p></div>
<div class="note q"><div class="lab">The forecasting error</div><p>A cost model built from visible output length underestimates a reasoning workload by a factor of five or more, and nothing in the response reveals the missing tokens. This is the single largest term in the 2.4× gap measured at stage 01, and it is invisible unless the usage figures are read rather than the text.</p></div>`},

{label:'THE HARD QUESTION', tag:'The uncomfortable one', title:'Is the reasoning trace the reason?', stage:5, html:`
<p>A visible chain of reasoning reads as an explanation, and it is powerfully tempting to treat it as one — particularly in a regulated setting, where an explanation is exactly what has to be produced.</p>
<p><b>The trace is generated by the same mechanism as the answer.</b> It is a sequence of plausible continuations, sampled from a distribution, conditioned on the prompt. There is no separate faculty that reasons and then reports. So the trace is not a record of a computation that occurred elsewhere — it is text, produced the same way, and it can be fluent, well-structured and unrelated to whatever actually drove the final answer.</p>
<p>Traces demonstrably do improve accuracy on multi-step problems, so they are not decorative. But a trace that reaches the right answer through invalid steps, and a trace that reaches a wrong answer through steps that look impeccable, are both common enough to be unsurprising.</p>
<div class="note q"><div class="lab">What this rules out</div><p>Presenting a reasoning trace to a customer or a supervisor as the explanation for a decision. It has the form of an audit trail without the substance of one. What is defensible is different in kind: the evidence retrieved, the citations verified against that evidence, the deterministic rules that were applied, and the human who decided. Those are records of things that happened.</p></div>
<div class="note"><div class="lab">Where this is genuinely contested</div><p>How closely traces track the underlying computation is an active research question, with results varying sharply by model and task. What is not contested is that the correspondence is <i>not guaranteed</i>, and a control that only sometimes reflects reality cannot be relied on as a control.</p></div>`},

{label:'CLOSE', tag:'Mission 05 complete', title:'The output rule is now under control', stage:5, html:`
<ul class="own">
<li>The model produces a score for every vocabulary entry; softmax turns those into probabilities</li>
<li>Temperature sharpens or flattens that distribution and changes nothing about capability</li>
<li>Nucleus sampling adapts the candidate set to the model's confidence; a fixed count cannot</li>
<li>Low temperature for extraction and code, mid for grounded answering, high for drafting</li>
<li>Temperature zero is consistent, not reproducible — the trace is the evidence, not re-execution</li>
<li>Constrained decoding makes invalid structure unreachable, and says nothing about content</li>
<li>Thinking tokens are billed as output and are the largest hidden term in a cost forecast</li>
</ul>
<div class="next">
  <div class="lab">Mission 06 unlocks</div>
  <div class="ttl">Getting the right evidence in</div>
  <p>Five missions have covered what the model does. Mission 06 opens the thirty percent of engineering effort and thirty-five percent of production failures that sit in one place: putting the right passage in front of it.</p>
</div>`}

]},

{n:'06', title:'Getting the Right Evidence In', stage:6,
 sub:'The largest single cause of production failure is not a weak model — it is a model that was never given what it needed. This mission is the pipeline that fixes that, stage by stage, with the gate that each stage has to clear.',
 covers:['Why retrieval rather than training','Parsing, and the ceiling it sets','Chunking, and contextual retrieval','Why keyword search is required, not legacy','Fusing two rankings without calibration','Reranking, and the floor that produces refusal','Assembling context in a deliberate order','The build order that actually works'],
 cards:[

{label:'ORIENT', tag:'Why this exists', title:'Five things weights cannot do', stage:6, html:`
<p class="kicker">Retrieval is often justified by the training cutoff alone. That is the weakest of five reasons, and the strongest one is rarely mentioned.</p>
<table class="tbl free">
<tr><td><b>Cutoff</b></td><td>Training ended on a date. Anything after it is absent.</td></tr>
<tr><td><b>Private material</b></td><td>Internal policy, contracts and circulars were never in any public corpus.</td></tr>
<tr><td><b>Provenance</b></td><td>An answer must be traceable to a source. Weights hold no records, so nothing in them can be cited.</td></tr>
<tr><td><b>Correction</b></td><td>A withdrawn circular must stop being used the day it is withdrawn. A retrieval index is updated in seconds; weights cannot be edited at all.</td></tr>
<tr class="hi"><td><b>Access control</b></td><td>Two readers with different entitlements must receive different answers from the same system.</td></tr>
</table>
<div class="note"><div class="lab">The one that settles it in a regulated firm</div><p><b>Access control is impossible in weights and trivial in retrieval.</b> A model trained on documents cannot un-know them for one reader and know them for another — the knowledge is diffuse, and there is no location to gate. A retrieval system filters candidates by entitlement before the search runs, and produces a different, correct result for each reader. No amount of model capability substitutes for this, which is why the architecture is not a matter of preference.</p></div>`},

{label:'MECHANISM', tag:'Parsing', title:'Retrieval quality is capped by parse quality', stage:6, html:`
<p class="kicker">Every later stage operates on the text extracted from source documents. Text lost or mangled during extraction is unreachable by any subsequent technique, however sophisticated.</p>
<table class="tbl free">
<tr><td><b>Fast text extraction</b></td><td>For documents with a real text layer. Cheap and accurate. First choice.</td></tr>
<tr><td><b>Optical character recognition</b></td><td>When the extracted text is sparse or absent, indicating a scan. Slower, introduces errors, unavoidable.</td></tr>
<tr><td><b>Vision model</b></td><td>For pages where layout carries meaning — tables, multi-column text, forms. Most expensive, and the only thing that works on them.</td></tr>
</table>
<div class="note q"><div class="lab">Tables, which are where this goes wrong</div><p>A table flattened into a line of text loses the association between each number and its row and column. The figures survive; what they refer to does not. The model then reads a plausible sequence of numbers and attaches them to the wrong headings — producing <b>a confident, precise, wrong figure</b>, which is the worst available output in a financial context.</p><p>Tables must be extracted as structured objects, never split across chunks, and always kept with their caption.</p></div>
<div class="note"><div class="lab">The metadata that is compliance-critical</div><p>Two fields carry more weight than the rest: a reference recording which document supersedes this one, and tags recording who is entitled to read it. Both are set at ingestion. Neither can be reconstructed later, and a corpus built without them requires reprocessing in full.</p></div>`},

{label:'TRADE-OFF', tag:'Chunking', title:'Precise and contextless against complete and diluted', stage:6, html:`
<p class="kicker">Documents are split into passages before embedding. Passage size trades two failures against each other, and neither is avoidable by choosing well.</p>
<table class="tbl free">
<tr><td><b>Small</b><span class="sub">100–200 tokens</span></td><td>Retrieves precisely — the passage is about one thing. Arrives without the surrounding context needed to interpret it. A clause reading "this shall not apply to secured advances" is useless without knowing what "this" was.</td></tr>
<tr><td><b>Large</b><span class="sub">800–1,500 tokens</span></td><td>Arrives complete and self-explanatory. Retrieves poorly, because one embedding must represent several subjects at once and ends up strongly matching none of them.</td></tr>
</table>
<div class="note g"><div class="lab">Two structural resolutions</div><p><b>Chunk on the document's own boundaries.</b> Regulatory text has clauses, sections and numbered paragraphs — units the author already defined as coherent. Splitting on those beats splitting on a token count, because the author did the work.</p><p><b>Embed small, return large.</b> Index the precise passage for matching, but return the surrounding section when it is retrieved. Precision in the search, completeness in what reaches the model.</p></div>
<div class="note"><div class="lab">The highest-return technique at this stage</div><p>Before embedding a passage, generate one or two sentences situating it within its parent document, and prepend them. The passage then embeds carrying its own context, and a clause about "this exemption" becomes findable by a query naming the exemption.</p><p>Measured effect: <b>roughly 49 percent fewer retrieval failures alone, and around 67 percent combined with reranking.</b> The cost falls almost entirely at ingestion, and the parent document caches across all of its own chunks.</p></div>`},

{label:'MECHANISM', tag:'The second channel', title:'Keyword search is required, not legacy', stage:6, html:`
<p class="kicker">Mission 03 established that embeddings fail on identifiers. Banking and regulatory queries are made largely of identifiers. The correction is to run a keyword index alongside the vector index — not as a fallback, but always.</p>
<div class="formula" style="font-size:13px">term frequency, saturated<br>× inverse document frequency<br>÷ length normalisation<small>the classical keyword score</small></div>
<table class="tbl free">
<tr><td><b>Saturation</b></td><td>The tenth occurrence of a term adds far less than the second. Without this, keyword stuffing wins.</td></tr>
<tr><td><b>Rarity weighting</b></td><td>A term appearing in every document carries no information. A term appearing in three carries a great deal.</td></tr>
<tr><td><b>Length normalisation</b></td><td>Long documents contain more of everything and would otherwise dominate by size alone.</td></tr>
</table>
<div class="note"><div class="lab">The division of labour</div><p>The vector channel finds passages about group delinquency that never use the phrase. The keyword channel finds the exact circular number and the literal string "31–60". <b>Neither channel can do the other's job</b>, and a system with only one fails silently on half its queries.</p></div>`},

{label:'WORKED', tag:'Fusion', title:'Merging two rankings without calibrating either', stage:6, html:`
<p class="kicker">Two channels return two ranked lists with scores on incompatible scales. Comparing those scores directly is meaningless. The standard fix ignores the scores entirely and uses only the positions.</p>
<div class="formula">score = Σ 1 ÷ (60 + rank)<small>reciprocal rank fusion</small></div>
<ul class="steps">
<li><span class="op"><b>Passage A</b>Vector rank 1, keyword rank 40</span><span class="res">0.0262</span></li>
<li><span class="op"><b>Passage B</b>Vector rank 5, keyword rank 3</span><span class="res">0.0313</span></li>
<li><span class="op"><b>Passage C</b>Vector rank 30, keyword rank 1</span><span class="res">0.0275</span></li>
<li class="total"><span class="op"><b>Fused order</b>B, then C, then A</span><span class="res">B · C · A</span></li>
</ul>
<div class="note"><div class="lab">What the arithmetic rewards</div><p>Passage A ranked first on one channel and was nearly absent on the other. Passage B ranked well on both and wins. The constant of 60 flattens the difference between the top few positions, so a passage must do well on both channels rather than spectacularly on one — which is exactly the desired behaviour when one channel is known to fail on identifiers and the other on paraphrase.</p></div>
<div class="note g"><div class="lab">Why this method is the default</div><p>It uses ranks, so it needs no calibration between the two scoring systems, no tuning weights, and no retuning when either channel's model changes. The working shape is <b>50 candidates from each channel, fused to 100, reranked to 6.</b></p></div>`},

{label:'MECHANISM', tag:'Reranking', title:'The score floor is the refusal mechanism', stage:6, html:`
<p class="kicker">The hundred fused candidates go to a cross-encoder, which reads the query and each passage together and scores that specific pairing properly. It adds 10 to 25 points of ranking quality. It also does something more important.</p>
<p>A cross-encoder produces a calibrated relevance score, which means <b>a threshold can be set on it</b>. Passages below the floor are discarded. If every candidate falls below the floor, nothing is passed forward — and the system reports that it could not find an answer.</p>
<div class="note g"><div class="lab">Why refusal is the feature and not the failure</div><p>Without a floor, the six least-bad passages are always sent, however irrelevant. The model receives evidence that does not bear on the question and, being a producer of plausible continuations, produces a plausible answer from it. <b>An empty result producing an honest "this could not be found" is the correct output</b>, and it is only reachable because the reranker's score means something.</p></div>
<div class="note q"><div class="lab">How to set the floor honestly</div><p>Not by intuition. The labelled set at stage 11 must include <b>roughly ten percent unanswerable queries</b> — questions whose answers are genuinely absent from the corpus. Without them, refusal is unmeasurable, and a floor is being set blind. With them, the trade between false refusals and confident wrong answers becomes a number that can be argued about.</p></div>`},

{label:'MECHANISM', tag:'Assembly', title:'Best evidence first and last, question last of all', stage:6, html:`
<p class="kicker">The retrieved passages, the instructions and the question are arranged into one block. The order is not cosmetic — attention over long contexts is measurably uneven.</p>
<div class="dia">
<svg viewBox="0 0 300 158" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Curve showing attention is strongest at the start and end of a long context and weakest in the middle">
  <g font-family="IBM Plex Sans, sans-serif">
    <text x="0" y="10" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84" letter-spacing="1.2">RECALL BY POSITION IN CONTEXT</text>
    <line x1="18" y1="92" x2="292" y2="92" stroke="#242A30"/>
    <line x1="18" y1="20" x2="18" y2="92" stroke="#242A30"/>
    <path d="M 22 30 Q 60 34 100 68 T 155 76 Q 200 72 240 40 T 288 26" fill="none" stroke="#E0A73E" stroke-width="2"/>
    <circle cx="24" cy="30" r="3" fill="#6FBF9B"/>
    <circle cx="155" cy="76" r="3" fill="#D9584A"/>
    <circle cx="286" cy="27" r="3" fill="#6FBF9B"/>
    <text x="24" y="104" font-size="8" fill="#767D84" text-anchor="middle">start</text>
    <text x="155" y="104" font-size="8" fill="#D9584A" text-anchor="middle">middle</text>
    <text x="286" y="104" font-size="8" fill="#767D84" text-anchor="end">end</text>
    <line x1="0" y1="118" x2="300" y2="118" stroke="#242A30"/>
    <text x="0" y="134" font-size="9" fill="#EDEAE4" font-weight="500">Order that follows from this</text>
    <text x="0" y="148" font-size="8.5" fill="#767D84">rules → strongest evidence → weaker → strongest → question</text>
  </g>
</svg>
<div class="cap">A fact placed in the middle is <b>recalled least reliably</b></div>
</div>
<p>Two rules follow. Put the highest-ranked evidence at the beginning and the end of the evidence block rather than in a simple descending list. And put the question <b>last</b>, immediately before generation begins, where recall is strongest.</p>
<div class="note"><div class="lab">The other ordering constraint, which points the opposite way</div><p>Prompt caching matches from the first byte and stops at the first difference, so everything stable must come first: instructions, tool definitions, examples, policy. Everything variable comes after: evidence, history, question. <b>The two rules operate on different parts of the prompt</b> — caching orders the stable prefix, attention orders the variable remainder — and they do not conflict.</p></div>`},

{label:'MECHANISM', tag:'Verification', title:'Citations are checked in code, not trusted', stage:6, html:`
<p class="kicker">The model is instructed to cite a passage identifier for every claim. Instruction is not enforcement. Three deterministic checks run on every response before it is shown to anyone.</p>
<table class="tbl free">
<tr><td><b>Existence</b></td><td>Every cited identifier must correspond to a passage that was actually supplied in this request. A citation to a plausible-looking identifier that was never retrieved is fabrication, and it is caught by a lookup.</td></tr>
<tr><td><b>Support</b></td><td>Each claim must be supported by the passage it cites. A real identifier attached to the wrong claim passes the first check and fails this one.</td></tr>
<tr class="hi"><td><b>Numeric fidelity</b></td><td>Every figure in the answer must appear in the supplied evidence. A number that is not in any retrieved passage was produced by the model, and in a financial answer that is the most dangerous single failure available.</td></tr>
</table>
<div class="note"><div class="lab">Failing closed</div><p>A response failing any of these is blocked, not annotated. Showing a flagged answer transfers the verification burden to a reader who has no way to perform it. <b>The target is zero fabricated citations — not a low rate.</b> This check is cheap, deterministic and one of the highest-value controls in the entire stack.</p></div>`},

{label:'NUMBERS', tag:'The gates', title:'What each stage must clear', stage:6, html:`
<p class="kicker">Retrieval and generation are measured separately. Measured together, a failure cannot be attributed, and the debugging becomes guesswork.</p>
<table class="tbl">
<tr><th>Gate</th><th>Threshold</th></tr>
<tr class="hi"><td>Recall at 20, before reranking<span class="sub">The passage must be a candidate. Nothing downstream can recover one that never was</span></td><td>&gt; 0.90</td></tr>
<tr><td>Ranking quality at 5, after reranking</td><td>&gt; 0.75</td></tr>
<tr><td>Precision at 6, after reranking</td><td>&gt; 0.60</td></tr>
<tr><td>Position of first correct passage</td><td>&gt; 0.80</td></tr>
<tr><td>Faithfulness of the answer to the evidence</td><td>&gt; 0.92</td></tr>
<tr><td>Citation validity</td><td>1.00</td></tr>
</table>
<div class="note"><div class="lab">Why the first row is the one that matters</div><p>Recall before reranking measures whether the correct passage entered the candidate set at all. A reranker cannot promote a passage that was never retrieved; a longer context cannot include it; a stronger model cannot read it. <b>Everything downstream is capped by this number</b>, which is why it is checked first and why an approximate index silently returning 70 percent recall poisons every metric below it.</p></div>`},

{label:'TRADE-OFF', tag:'Build order', title:'Generation is week eight', stage:6, html:`
<p class="kicker">The order in which this pipeline gets built determines whether it can ever be debugged. The intuitive order is close to the reverse of the correct one.</p>
<ul class="spine">
<li><span class="k">01</span><span class="v">Labelled set<em>A few hundred real queries with their known correct passages, including unanswerable ones</em></span></li>
<li><span class="k">02</span><span class="v">Parse and chunk<em>Tables as structured objects, superseding references and entitlement tags attached</em></span></li>
<li><span class="k">03</span><span class="v">Flat baseline<em>Exact search over everything. Slow, and the ground truth for every later comparison</em></span></li>
<li><span class="k">04</span><span class="v">Contextual embedding<em>Situating sentences prepended before embedding</em></span></li>
<li><span class="k">05</span><span class="v">Approximate index, with the recall gate<em>Measured against the flat baseline. Below 0.95, raise the runtime dial</em></span></li>
<li><span class="k">06</span><span class="v">Keyword channel and fusion<em>The identifier problem, corrected</em></span></li>
<li><span class="k">07</span><span class="v">Reranking and the score floor<em>Precision, and the ability to refuse</em></span></li>
<li><span class="k">08</span><span class="v">Query rewriting<em>Multi-turn questions made standalone. Highest return, most often absent</em></span></li>
<li><span class="k">09</span><span class="v">Generation<em>Only now</em></span></li>
<li><span class="k">10</span><span class="v">Temporal filtering and full evaluation<em>Superseded material excluded and proven excluded</em></span></li>
</ul>
<div class="note q"><div class="lab">The classic error</div><p>Starting at step 9. A demonstration is standing within a day, and every subsequent quality problem is unattributable — the failure could be parsing, chunking, index recall, ranking, ordering or the model, and without the earlier steps in place there is no way to tell which. <b>Months are then spent tuning prompts against a pipeline that is silently discarding a third of the corpus.</b></p></div>`},

{label:'CLOSE', tag:'Mission 06 complete', title:'The evidence path is now accountable', stage:6, html:`
<ul class="own">
<li>Five reasons for retrieval, and access control is the one that settles it in a regulated firm</li>
<li>Parse quality caps everything; tables must stay structured or they produce confident wrong figures</li>
<li>Contextual retrieval cuts failures by roughly half, and by two thirds with reranking</li>
<li>Keyword search is a required second channel, because identifiers have no meaning to embed</li>
<li>Rank fusion merges two channels without calibrating either — 50 plus 50, fused to 100, reranked to 6</li>
<li>The reranker's score floor is what makes honest refusal possible</li>
<li>Strongest evidence at the start and end, question last; stable blocks first for caching</li>
<li>Citations are verified in code, and recall at 20 above 0.90 is the gate everything else depends on</li>
</ul>
<div class="next">
  <div class="lab">Mission 07 unlocks</div>
  <div class="ttl">When the model must act</div>
  <p>Everything so far ends with an answer. Mission 07 covers what changes when the system must do something — call tools, take multiple steps, hold state, and stop safely.</p>
</div>`}

]},

{n:'07', title:'When the Model Must Act', stage:8,
 sub:'A model that only answers is bounded by what it says. A model that acts is bounded by what it can reach. This mission covers the boundary that makes the difference safe, and how to buy the least autonomy that solves the problem.',
 covers:['The boundary that is the whole security model','Designing tools the model can actually use','The six levels of autonomy','The loop, and checking completion in code','Three termination caps, all needed','Four ways context degrades','What to gate and what never to gate'],
 cards:[

{label:'DEFINE', tag:'The boundary', title:'The model proposes; code disposes', stage:8, html:`
<p>Tool calling sounds like the model executing something. It is not, and the distinction is the entire security model.</p>
<p>The model emits <b>a structured request</b> — a name and a set of arguments. That request is text, produced by the same sampling loop as everything else. Ordinary code receives it, validates it, decides whether to run it, runs it if permitted, and returns the result as more text.</p>
<div class="formula" style="font-size:14px">model → proposes<br>code → validates, authorises, executes<small>the model never touches the system</small></div>
<div class="note"><div class="lab">Why everything rests here</div><p>A model that could execute directly would carry the full authority of whatever prompt reached it, including text arriving inside a retrieved document. Because execution sits behind code, every tool call passes through a place where authorisation, rate limits, argument validation and audit logging can be applied. <b>Weakening this boundary — by letting a model produce something executed without inspection — removes the only defence there is.</b></p></div>
<div class="note q"><div class="lab">A consequence that is easy to miss</div><p>The tool schema is not configuration. It is serialised into the context as text, which means <b>the schema is part of the prompt</b>. Its descriptions influence behaviour as strongly as any instruction, they cost tokens on every call, and a poorly worded description is a poorly worded prompt.</p></div>`},

{label:'MECHANISM', tag:'Tool design', title:'Seven principles that decide whether this works', stage:8, html:`
<ul class="spine">
<li><span class="k">01</span><span class="v">Design for tasks, not for an existing API<em>One tool that answers a real question beats six that must be composed. Compose on the server</em></span></li>
<li><span class="k">02</span><span class="v">Return summaries, not raw payloads<em>A 40,000-token response consumes the context budget and buries the answer</em></span></li>
<li><span class="k">03</span><span class="v">Error messages are prompts<em>They enter the context and are read. State what to do next, not just what failed</em></span></li>
<li><span class="k">04</span><span class="v">Two-phase commit for anything destructive<em>Propose, receive a token, then commit. Never a single irreversible call</em></span></li>
<li><span class="k">05</span><span class="v">Idempotency keys on every mutating tool<em>Agents retry. Without keys, a retry is a second payment</em></span></li>
<li><span class="k">06</span><span class="v">A small, stable, fixed-order tool set<em>Varying the list per request destroys prompt caching and costs more than it saves</em></span></li>
<li><span class="k">07</span><span class="v">Every tool is an authorisation boundary<em>Act as the user, with the user's entitlements — never with the system's</em></span></li>
</ul>
<div class="note"><div class="lab">The one most often skipped</div><p>Error messages. A tool returning a status code and nothing else gives the model no basis for its next move, so it retries identically, repeatedly, until a cap stops it — burning the budget and producing nothing. An error stating what was wrong and what would work instead converts a loop into a recovery.</p></div>`},

{label:'TRADE-OFF', tag:'Autonomy', title:'Buy the least that solves the problem', stage:8, html:`
<p class="kicker">Autonomy is a ladder, not a switch, and every rung upward costs testability, predictability and auditability. The correct level is the lowest one that works.</p>
<table class="tbl free">
<tr><td><b>L0</b></td><td>A single call. No tools, no steps.</td></tr>
<tr><td><b>L1</b></td><td>A fixed chain — the same steps every time, in the same order.</td></tr>
<tr><td><b>L2</b></td><td>A router: the model picks one of several fixed paths.</td></tr>
<tr><td><b>L3</b></td><td>Tools available, decided per request, with a bounded number of steps.</td></tr>
<tr><td><b>L4</b></td><td>A graph with loops and explicit state. Still a defined structure.</td></tr>
<tr><td><b>L5</b></td><td>Autonomous: the model plans its own sequence. ⚠</td></tr>
<tr><td><b>L6</b></td><td>Multiple agents coordinating. ⚠⚠</td></tr>
</table>
<div class="note g"><div class="lab">The test that decides the level</div><p><b>Can the flowchart be drawn in advance?</b> If yes, the problem is L1 to L4, and building it as L5 adds cost and unpredictability for nothing. Most problems presented as needing an autonomous agent are routers with three branches.</p></div>
<div class="note"><div class="lab">The rule that removes most of the risk</div><p><b>Anything that can be a rule should be a rule.</b> Policy checks, threshold comparisons, entitlement decisions and eligibility logic belong in code, where they are testable, auditable and identical every time. Putting them in a model makes them probabilistic, and there is no upside.</p></div>`},

{label:'MECHANISM', tag:'The loop', title:'Completion is checked, never announced', stage:8, html:`
<p class="kicker">Every agent, regardless of framework, is the same loop. Written out, it is unremarkable — which is the point.</p>
<ul class="spine">
<li><span class="k">01</span><span class="v">Check the budget<em>Steps, spend and elapsed time, before anything else happens</em></span></li>
<li><span class="k">02</span><span class="v">Assemble context<em>Instructions, tools, state, history, and the result of the last step</em></span></li>
<li><span class="k">03</span><span class="v">Call the model<em>Which returns either a final answer or a tool request</em></span></li>
<li><span class="k">04</span><span class="v">Check completion in code<em>Against the actual state, not the model's claim</em></span></li>
<li><span class="k">05</span><span class="v">Execute tools behind guards<em>Validate arguments, check authorisation, apply gates</em></span></li>
<li><span class="k">06</span><span class="v">Record the step<em>Then return to 01</em></span></li>
</ul>
<div class="note q"><div class="lab">Step 4 is where systems fail</div><p>A model announcing that a task is complete is producing a plausible continuation, exactly as it does everywhere else. It will announce completion for work that was not done, and it will do so fluently. <b>Completion must be verified against state</b> — the record exists, the field is populated, the total reconciles. Accepting the announcement means the failure surfaces downstream, detached from its cause.</p></div>`},

{label:'MECHANISM', tag:'Termination', title:'Three caps, and each catches a different failure', stage:8, html:`
<table class="tbl free">
<tr><td><b>Maximum steps</b></td><td>Catches cheap infinite loops — an agent alternating between two tools indefinitely, each call costing little, the total unbounded.</td></tr>
<tr><td><b>Maximum spend</b></td><td>Catches short, expensive runs — three steps that each process a very large context. A step cap never fires; the bill is already large.</td></tr>
<tr><td><b>Maximum wall-clock time</b></td><td>Catches an agent stuck on a slow or hanging tool. Neither other cap advances while it waits.</td></tr>
</table>
<div class="note"><div class="lab">Where the caps live</div><p>In the run state, checked at the top of every iteration — not on a dashboard, and not in an alert. A cap that produces a notification after the fact is a report, not a control.</p></div>
<div class="note q"><div class="lab">The rule that matters more than the caps</div><p><b>Never fail silently.</b> Every non-success path — cap reached, loop detected, tool unavailable, gate declined — must escalate to a human with the partial work and the full trace attached. An agent that stops and returns nothing has destroyed the work and the evidence of what went wrong. Where a loop is detected, injecting a recovery message before terminating often resolves it without escalation at all.</p></div>`},

{label:'TRAP', tag:'Context degradation', title:'Four ways a long run poisons itself', stage:8, html:`
<p class="kicker">An agent accumulates context across steps. Four distinct failures emerge from that accumulation, and they are frequently misdiagnosed as the model being weak.</p>
<table class="tbl free">
<tr><td><b>Poisoning</b></td><td>An early error enters the context and is treated as established fact by every later step. The run is confidently wrong from step three onward.</td></tr>
<tr><td><b>Distraction</b></td><td>The accumulated history grows large enough that the original objective competes with hundreds of intermediate details for attention.</td></tr>
<tr><td><b>Confusion</b></td><td>Too many available tools, or overlapping descriptions, and selection degrades.</td></tr>
<tr><td><b>Clash</b></td><td>Two retrieved sources contradict each other and both remain in context. The model resolves the contradiction by picking one, silently.</td></tr>
</table>
<div class="note"><div class="lab">Two structural responses</div><p><b>Compaction</b> at around 65 percent of the budget: summarise the history and continue. It is lossy by construction, so every event must be logged separately — the log is the record, the summary is a working convenience.</p><p><b>Sub-agent isolation</b>: hand a self-contained piece of work to a fresh context window that returns only a summary. This is how a run exceeds the context window without exceeding it, and it delivers most of the benefit of multiple agents at a fraction of the complexity.</p></div>`},

{label:'MECHANISM', tag:'Human gates', title:'What to gate, and what gating destroys', stage:8, html:`
<table class="tbl free">
<tr><td><b>Always gate</b></td><td>Money moving. External communication. Deletion. Decisions about a person. Binding commitments. Access grants.</td></tr>
<tr><td><b>Never gate</b></td><td>Reads. Searches. Unsent drafts. Analysis.</td></tr>
</table>
<div class="note q"><div class="lab">Why the second row is a safety requirement</div><p>Gating harmless actions produces approval fatigue. A reviewer facing forty approvals an hour approves reflexively, and the gates that matter are approved with the same reflex. <b>Over-gating disables the gates that count</b>, which makes it a safety failure rather than an excess of caution.</p></div>
<div class="note"><div class="lab">The rule that is most often violated</div><p><b>Show the raw action, not the agent's summary of it.</b> The agent controls the summary, so a summary reading "sending a routine confirmation to the customer" can accompany an action that does something else entirely. The reviewer must see the actual recipient, the actual amount, the actual payload. And the system must log <i>what was displayed</i> alongside <i>what executed</i> — because if those two ever diverge, the approval record is worthless.</p></div>
<div class="note g"><div class="lab">A framing that works with existing structures</div><p>Bounded autonomy maps directly onto delegated authority, which every regulated institution already operates. An agent permitted to act within limits and required to escalate beyond them is a familiar arrangement with a familiar control language — and describing it that way converts an unfamiliar approval request into a routine one.</p></div>`},

{label:'DEFINE', tag:'Checkpointing', title:'The audit trail cannot be retrofitted', stage:8, html:`
<p>Persisting the full state after every step gives four things, and only one of them is usually anticipated.</p>
<table class="tbl free">
<tr><td><b>Crash resilience</b></td><td>A failed run resumes from its last good step rather than restarting.</td></tr>
<tr><td><b>Indefinite pauses</b></td><td>A run can stop at a human gate for three days without holding any resource open.</td></tr>
<tr><td><b>Time-travel debugging</b></td><td>Any past step can be re-entered and examined with its exact state.</td></tr>
<tr class="hi"><td><b>The audit trail</b></td><td>Every state, every decision, every tool call, in order, with timing. In a regulated firm this is the evidence pack.</td></tr>
</table>
<div class="note"><div class="lab">Why the timing is not negotiable</div><p>The first three are conveniences that can be added later. The fourth cannot. Evidence about a run that has already completed cannot be reconstructed after the fact, and the demand for it arrives with a deadline attached. <b>Building it on day one costs little; adding it in month nine means every run before that point is unevidenced.</b></p></div>`},

{label:'THE HARD QUESTION', tag:'The uncomfortable one', title:'Why does connecting agents multiply risk faster than it adds capability?', stage:8, html:`
<p>The intuitive model is additive: two agents with two tool sets are twice the capability and roughly twice the risk. Measurement does not support the second half of that.</p>
<p>In a five-server setup, <b>one compromised component produced a 78.3 percent attack success rate, with 72.4 percent cascading to other components.</b> Risk rises with connectivity superlinearly, because each new connection creates paths through every existing one — and a compromise anywhere propagates along all of them.</p>
<p>The mechanism is that trust is transitive in these systems and nobody designed it to be. An agent receiving structured output from another agent treats it as a result rather than as untrusted input, because it came from inside the system. So content that entered anywhere can influence behaviour everywhere, and each component is individually reasonable while the composition is not.</p>
<div class="note q"><div class="lab">What follows practically</div><p><b>Start with a single agent.</b> Split only with a measured reason and tracing that spans the split. Sub-agents are not multi-agent systems — they return summaries to a coordinator that holds authority, and they deliver most of the context-isolation benefit without creating a web of mutually trusting components.</p><p>And treat every inter-agent message as untrusted input, validated against a schema, exactly as though it had arrived from outside.</p></div>
<div class="note"><div class="lab">Where this number should be held loosely</div><p>Those figures come from specific configurations under deliberate attack, and generalising a precise percentage to a different architecture would be misuse. The finding that survives generalisation is the shape, not the number: <b>connectivity multiplies risk faster than it multiplies capability</b>, so each additional connection needs a reason.</p></div>`},

{label:'CLOSE', tag:'Mission 07 complete', title:'Action is now bounded', stage:8, html:`
<ul class="own">
<li>The model proposes a structured request; code validates, authorises and executes it</li>
<li>The tool schema is part of the prompt, and error messages are prompts too</li>
<li>Six levels of autonomy — if the flowchart can be drawn in advance, it is not level five</li>
<li>Anything that can be a rule should be a rule, in code rather than in a model</li>
<li>Completion is checked against state, never accepted from the model's announcement</li>
<li>Three caps — steps, spend, wall-clock — and never fail silently</li>
<li>Gate money, communication, deletion and decisions; never gate reads, or the gates stop working</li>
<li>Show the raw action and log what was displayed alongside what executed</li>
</ul>
<div class="next">
  <div class="lab">Mission 08 unlocks</div>
  <div class="ttl">Fast enough and cheap enough</div>
  <p>Seven missions have built a system that works. Mission 08 is what makes it affordable: the two phases of inference, why they need opposite optimisations, and the levers ranked by what they actually return.</p>
</div>`}

]},
{n:'08', title:'Fast Enough and Cheap Enough', stage:9,
 sub:'Inference has two phases with opposite bottlenecks, and almost every serving decision follows from that split. This mission covers the phases, the levers ranked by return, and the deployment sequence that keeps a change reversible.',
 covers:['Prefill and decode, and the 6,000× gap','The two metrics that matter to a user','Batching, and its two ceilings','Prompt caching and the ordering rule','Quantisation, and where it degrades','The cost levers ranked','Hosted against self-hosted','Shipping without breaking anything'],
 cards:[

{label:'MECHANISM', tag:'The split', title:'Two phases, opposite bottlenecks', stage:9, html:`
<p class="kicker">Serving a request is two different computations wearing one name, and they are limited by different things — which is why one set of optimisations cannot serve both.</p>
<div class="dia">
<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of prefill and decode phases showing compute-bound versus memory-bound behaviour">
  <g font-family="IBM Plex Sans, sans-serif">
    <rect x="0" y="4" width="144" height="118" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <text x="12" y="22" font-size="11" fill="#E0A73E" font-weight="500">PREFILL</text>
    <text x="12" y="38" font-size="8.5" fill="#A8AEB4">whole prompt at once</text>
    <text x="12" y="56" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84">BOUND BY</text>
    <text x="12" y="69" font-size="10" fill="#EDEAE4">compute</text>
    <text x="12" y="87" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84">UTILISATION</text>
    <text x="12" y="100" font-size="10" fill="#6FBF9B">70–95%</text>
    <text x="12" y="115" font-size="8.5" fill="#767D84">drives time to first token</text>

    <rect x="156" y="4" width="144" height="118" rx="2" fill="#0B0D0F" stroke="#242A30"/>
    <text x="168" y="22" font-size="11" fill="#E0A73E" font-weight="500">DECODE</text>
    <text x="168" y="38" font-size="8.5" fill="#A8AEB4">one token at a time</text>
    <text x="168" y="56" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84">BOUND BY</text>
    <text x="168" y="69" font-size="10" fill="#EDEAE4">memory bandwidth</text>
    <text x="168" y="87" font-family="IBM Plex Mono, monospace" font-size="8" fill="#767D84">UTILISATION</text>
    <text x="168" y="100" font-size="10" fill="#D9584A">under 20%</text>
    <text x="168" y="115" font-size="8.5" fill="#767D84">drives time per output token</text>

    <text x="150" y="142" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#E0A73E" text-anchor="middle" letter-spacing="1">ARITHMETIC INTENSITY GAP ≈ 6,000×</text>
  </g>
</svg>
<div class="cap">Prefill does <b>~12,000 operations per byte moved</b>; decode does about 2</div>
</div>
<p>Prefill processes the entire prompt in parallel, so the hardware has enormous work per byte fetched and runs near capacity. Its cost grows with the square of prompt length. Decode produces one token at a time, and each token requires reading <i>every parameter</i> from memory to do a small amount of arithmetic — so the hardware waits on memory and sits mostly idle.</p>
<div class="note"><div class="lab">The pricing that follows</div><p>This is why output tokens cost five to eight times input tokens. It is not a commercial decision. Prefill is efficient work; decode is the hardware idling while memory catches up, and the meter runs regardless.</p></div>`},

{label:'NUMBERS', tag:'What a user feels', title:'Two metrics, and the arithmetic joining them', stage:9, html:`
<table class="tbl">
<tr><th>Metric</th><th>Target</th></tr>
<tr><td>Time to first token<span class="sub">Silence before anything appears. Set by prefill</span></td><td>&lt; 500 ms</td></tr>
<tr><td>Time per output token<span class="sub">Speed of the stream once started. Set by decode</span></td><td>20–50 ms</td></tr>
</table>
<div class="formula" style="font-size:14px">end to end = TTFT + (TPOT × output tokens)<small>the whole perceived latency</small></div>
<div class="note"><div class="lab">Why the ratio must be measured before optimising</div><p>A workload with 8,000 input tokens and 200 output tokens is dominated by prefill; optimising decode returns almost nothing. A workload with 200 input and 2,000 output is the reverse. <b>Measuring the input-to-output ratio takes an afternoon and determines which half of this mission is worth reading twice.</b></p></div>
<div class="note g"><div class="lab">The interface consequence</div><p>Streaming changes the perceived experience even with identical total time, because the wait becomes 500 milliseconds rather than eight seconds. And nothing should show a spinner for more than about two seconds without new information appearing — a degraded answer arriving is better than a correct one that arrives after the reader has left.</p></div>`},

{label:'WORKED', tag:'Batching', title:'Twenty times the throughput for a third less speed', stage:9, html:`
<p class="kicker">Decode reads every parameter from memory to produce one token. Those same parameters can serve many requests in the same read. This is the single largest lever in serving.</p>
<ul class="steps">
<li><span class="op"><b>Batch of 1</b>Per user, and in total</span><span class="res">47 tok/s</span></li>
<li><span class="op"><b>Batch of 32 — per user</b>Each user is slower</span><span class="res">30 tok/s</span></li>
<li class="total"><span class="op"><b>Batch of 32 — total</b>Across all users</span><span class="res">967 tok/s</span></li>
</ul>
<div class="note"><div class="lab">Reading the trade</div><p>Per-user speed fell 36 percent. Total throughput rose <b>twentyfold</b>. Since 30 tokens per second is comfortably inside the acceptable range, this is close to free capacity — which is why every serious serving engine batches aggressively.</p></div>
<div class="note q"><div class="lab">The two ceilings</div><p><b>KV cache memory.</b> Every request in the batch holds its own cache, and the sum must fit alongside the weights. This is usually the binding limit, and it is why the cache arithmetic at stage 04 governs deployment economics.</p><p><b>Acceptable per-user latency.</b> Batching further eventually pushes per-user speed below what a reader tolerates.</p></div>
<div class="note g"><div class="lab">Two refinements worth naming</div><p><b>Continuous batching</b> rebuilds the batch every step so a finished request is replaced immediately rather than leaving its slot idle — 2 to 4 times better than waiting for the whole batch. <b>Chunked prefill</b> splits a long prompt's prefill across several steps so one large request cannot stall everyone else's decoding.</p></div>`},

{label:'MECHANISM', tag:'Caching', title:'The highest-return optimisation, and its ordering rule', stage:9, html:`
<p class="kicker">Prefill for a prompt prefix that has been seen before does not need repeating. The cached result is reused, at roughly 90 percent off the input cost and 75 percent off prefill latency.</p>
<p>The match is <b>prefix-based</b>: comparison starts at the first byte and stops at the first difference. Everything after that point is recomputed. So the ordering of prompt blocks is worth real money.</p>
<ul class="spine">
<li><span class="k">1</span><span class="v">System instructions<em>Identical on every request</em></span></li>
<li><span class="k">2</span><span class="v">Tool definitions<em>Identical, and only if the list is stable</em></span></li>
<li><span class="k">3</span><span class="v">Few-shot examples<em>Identical</em></span></li>
<li><span class="k">4</span><span class="v">Policy text<em>Changes rarely</em></span></li>
<li><span class="k">5</span><span class="v">Retrieved evidence<em>Changes per request</em></span></li>
<li><span class="k">6</span><span class="v">Conversation history<em>Changes per turn</em></span></li>
<li><span class="k">7</span><span class="v">The question<em>Always different</em></span></li>
</ul>
<div class="note q"><div class="lab">Two mistakes that destroy the cache entirely</div><p><b>A timestamp or session identifier at the top of the prompt.</b> The first byte differs on every request, so nothing ever matches and the entire benefit is lost silently — no error, just a bill that is several times larger than it should be.</p><p><b>A dynamically varied tool list.</b> Selecting tools per request seems efficient. It changes the prefix, destroys cache locality, and costs far more than the tokens it saves.</p></div>
<div class="note g"><div class="lab">The number that belongs on the dashboard</div><p><b>Cache hit rate, targeting above 90 percent</b> on any workload with a stable prefix. It is also one of four leading indicators at stage 12 — a falling hit rate reveals a prompt change nobody announced, before the invoice does.</p></div>`},

{label:'TRADE-OFF', tag:'Quantisation', title:'Fewer bytes per parameter, and where it breaks', stage:9, html:`
<p class="kicker">Storing each parameter in fewer bytes shrinks the model. Since decode is limited by reading parameters from memory, a smaller model is also a faster one — this lever buys speed and capacity together.</p>
<table class="tbl">
<tr><th>Precision</th><th>70B model</th></tr>
<tr><td>2 bytes per parameter<span class="sub">The common baseline</span></td><td>140 GB</td></tr>
<tr class="hi"><td>1 byte per parameter<span class="sub">Adopt by default</span></td><td>70 GB</td></tr>
<tr><td>0.5 bytes per parameter<span class="sub">Only with slice-level evaluation</span></td><td>35 GB</td></tr>
</table>
<div class="note q"><div class="lab">Where the damage concentrates</div><p>Degradation is not spread evenly across capabilities. It gathers in five places: <b>arithmetic, long-context retrieval, non-English text, schema conformance, and rare tokens</b> — which between them describe most of what a regulated document system does.</p><p>An aggregate benchmark score barely moves while one of these collapses. A model that reads perfectly well and quietly stopped producing valid structured output on eight percent of calls will pass any average-based check.</p></div>
<div class="note g"><div class="lab">Two rules</div><p><b>Quantise the KV cache as well as the weights.</b> At long context the cache rivals the weights in size, so leaving it untouched forfeits most of the concurrency gain.</p><p><b>Always report by slice.</b> This is the same principle as stage 11 and the same reason: aggregates conceal precisely the failure that needs acting on.</p></div>`},

{label:'NUMBERS', tag:'The levers', title:'Ranked by what they actually return', stage:9, html:`
<table class="tbl">
<tr><th>Lever</th><th>Reduction</th></tr>
<tr class="hi"><td>Model cascade<span class="sub">Cheap tier first, escalate on failure. Medium effort</span></td><td>50–80%</td></tr>
<tr class="hi"><td>Prompt caching<span class="sub">Stable prefix ordering. Low effort</span></td><td>50–90% of input</td></tr>
<tr><td>Output length control<span class="sub">Maximum length, terse formats, no restating. Low effort</span></td><td>20–50%</td></tr>
<tr><td>Batch processing for non-interactive work</td><td>~50% on that traffic</td></tr>
<tr><td>Retrieval precision<span class="sub">Six excellent passages, not forty mediocre ones</span></td><td>30–60% of input</td></tr>
<tr><td>Response caching for repeated questions</td><td>10–40%</td></tr>
</table>
<div class="note"><div class="lab">Why the cascade is first</div><p>Routing to a cheap model first and escalating only on failure cuts cost by half to four fifths. It also <b>improves quality</b>, because building it forces a quality gate to exist — something must decide whether the cheap answer was good enough, and that decision is a measurable check that did not exist before.</p></div>
<div class="note g"><div class="lab">The signal it produces for free</div><p><b>Escalation rate is the best early-warning indicator in the stack.</b> It moves before users complain, before accuracy metrics move, and before the invoice arrives. A rise means the cheap tier started failing more often — from a prompt change, a corpus change, or a shift in what people are asking.</p></div>`},

{label:'MECHANISM', tag:'Budgets', title:'Caps in the run state, tags on every call', stage:9, html:`
<p class="kicker">Cost control that lives on a dashboard is reporting. Control means the system stops.</p>
<table class="tbl free">
<tr><td><b>Three caps</b></td><td>Maximum steps, maximum spend, maximum wall-clock — held in the run state and checked before each iteration, exactly as at stage 08.</td></tr>
<tr><td><b>Five tags</b></td><td>Tenant, use case, tier, environment, and trace identifier — on every model call. Without them, an unexpected invoice cannot be attributed to anything.</td></tr>
</table>
<div class="note"><div class="lab">The kill switch design</div><p>When a cap is hit, the system should <b>degrade to a cheaper tier, never to an error</b>. A user receiving a slightly weaker answer has been served. A user receiving a failure has not, and will escalate to a human — which costs more than the request that was blocked.</p></div>
<div class="note g"><div class="lab">Degraded mode</div><p>Design a fallback that runs all the way down to retrieval alone: return the relevant passages with no generated answer. It is genuinely useful, it is nearly free, and it is far better than a spinner. A system with no degraded mode has only two states, and one of them is down.</p></div>`},

{label:'TRADE-OFF', tag:'Where it runs', title:'Start hosted, and know the five reasons to leave', stage:9, html:`
<p class="kicker">Self-hosting is frequently proposed on cost grounds and is usually wrong on cost grounds. There are five sound reasons, and volume alone is rarely one of them.</p>
<table class="tbl free">
<tr><td><b>Data residency</b></td><td>A regulatory requirement that data does not leave a jurisdiction or a boundary.</td></tr>
<tr><td><b>A genuine 2× cost advantage</b></td><td>Sustained, measured, and inclusive of engineering time — not a comparison of token price against hardware rental.</td></tr>
<tr><td><b>Capability access</b></td><td>Something only available with direct access to weights.</td></tr>
<tr><td><b>A latency floor</b></td><td>A requirement that network round-trips make unachievable.</td></tr>
<tr><td><b>Mandated version pinning</b></td><td>A control requirement that the exact model cannot change without approval.</td></tr>
</table>
<div class="note q"><div class="lab">The break-even that surprises people</div><p>Self-hosting typically becomes economic at roughly <b>four times the volume of a large enterprise workload</b>. Below that, hosted wins once the platform team, the on-call rotation and the capacity headroom are counted — and those are usually left out of the comparison that motivated the move.</p></div>
<div class="note"><div class="lab">One rule regardless of where it runs</div><p><b>Never expose an inference engine directly to untrusted traffic.</b> Put an application layer in front that handles authentication, entitlements, rate limits and logging. Pin engine versions and track their vulnerability disclosures like any other infrastructure component.</p></div>`},

{label:'MECHANISM', tag:'Shipping', title:'Shadow, canary, ramp — and pin everything', stage:9, html:`
<ul class="spine">
<li><span class="k">01</span><span class="v">Shadow<em>Run the new version on live traffic, discard its output, compare against the current one</em></span></li>
<li><span class="k">02</span><span class="v">Canary at 5 percent<em>Real traffic, small exposure, slice-level metrics watched</em></span></li>
<li><span class="k">03</span><span class="v">Ramp<em>Increase gradually while the slices hold</em></span></li>
<li><span class="k">04</span><span class="v">General availability<em>With the previous version deployable for 30 days</em></span></li>
</ul>
<div class="note g"><div class="lab">Why shadow mode earns its cost three times over</div><p>It produces the evaluation set, because real traffic with two versions' outputs is exactly the comparison data needed. It produces the business case, with measured rather than projected numbers. And it produces the model risk evidence a validation function will ask for. <b>All three at zero customer exposure.</b></p></div>
<div class="note q"><div class="lab">The pinning rule</div><p><b>Pin everything, and never point at a moving alias.</b> A provider updating a model behind an unpinned name changes behaviour with no deployment, no change record and no notification. Every metric shifts, nothing in the change log explains it, and the investigation starts by looking in the wrong place. An unpinned model version also makes any past decision unreproducible, which removes the audit answer at stage 14.</p></div>`},

{label:'CLOSE', tag:'Mission 08 complete', title:'The system is now affordable', stage:9, html:`
<ul class="own">
<li>Prefill is compute-bound and drives first-token latency; decode is memory-bound and drives stream speed</li>
<li>The gap between them is around 6,000× in work per byte, which is why output costs more than input</li>
<li>Batch 32 gives twenty times the throughput for a third less per-user speed, capped by KV cache memory</li>
<li>Prompt caching returns 90 percent of cached input cost — stable blocks first, never a timestamp at the top</li>
<li>Quantisation degrades arithmetic, long context, non-English, schema conformance and rare tokens first</li>
<li>Cascade and caching are the two largest levers; escalation rate is the best early warning</li>
<li>Caps live in the run state and degrade to a cheaper tier, never to an error</li>
<li>Start hosted; break-even is around four times a large enterprise workload. Pin everything</li>
</ul>
<div class="next">
  <div class="lab">Mission 09 unlocks</div>
  <div class="ttl">Knowing it works, keeping it safe</div>
  <p>Eight missions have built something fast, cheap and capable. Mission 09 is how anyone knows whether it is correct — and what an attacker does with a system that reads text it did not write.</p>
</div>`}

]},

{n:'09', title:'Knowing It Works, Keeping It Safe', stage:11,
 sub:'Evaluation is the only asset in this stack that compounds and cannot be copied. Security is the part where a system that reads text nobody wrote for it meets people who write text for it deliberately.',
 covers:['The golden set, and why it must be real','Reporting by slice, always','Judging with a model, and calibrating it','Four leading indicators','What is genuinely new in AI security','The lethal trifecta','Injection, and why it is unsolved','Guardrails that fail in the right direction'],
 cards:[

{label:'ORIENT', tag:'Why this first', title:'The only asset that compounds', stage:11, html:`
<p>Models are bought and replaced. Prompts are rewritten in an afternoon. Retrieval pipelines are rebuilt. <b>The evaluation set is the only thing that accumulates value and cannot be acquired from anyone else</b>, because it encodes what correct means for one specific corpus, one specific set of users and one specific regulator.</p>
<table class="tbl free">
<tr><td><b>Without it</b></td><td>"The new version feels better." Unfalsifiable, unarguable, and no basis for a release decision.</td></tr>
<tr><td><b>With it</b></td><td>"Faithfulness up 7.2, cost down 3 percent, numerical slice down 11 — do not ship." Specific, checkable, and it stopped a regression that no aggregate would have shown.</td></tr>
</table>
<div class="note"><div class="lab">Three tiers, by what they cost to run</div><p><b>Smoke</b> — around 20 cases, on every commit, seconds. <b>Regression</b> — around 250 cases, on every change request, minutes. <b>Full and adversarial</b> — 500 to 2,000 cases, weekly, and before every release.</p></div>`},

{label:'MECHANISM', tag:'The golden set', title:'A hundred real cases beat ten thousand synthetic ones', stage:11, html:`
<p class="kicker">The composition matters more than the size. A hundred to three hundred <i>real</i> inputs is the working target.</p>
<table class="tbl">
<tr><th>Composition</th><th>Share</th></tr>
<tr><td>Ordinary questions<span class="sub">What people actually ask most of the time</span></td><td>50%</td></tr>
<tr><td>Hard questions<span class="sub">Multi-part, requiring several passages</span></td><td>25%</td></tr>
<tr><td>Edge cases<span class="sub">Rare, awkward, ambiguous</span></td><td>15%</td></tr>
<tr><td>Adversarial<span class="sub">Deliberate attempts to break it</span></td><td>10%</td></tr>
</table>
<div class="note"><div class="lab">Two case types that make otherwise-invisible controls testable</div><p><b>Unanswerable questions</b> — genuinely absent from the corpus. Without them, abstention cannot be measured and the reranker's score floor is being set blind.</p><p><b>Must-not-cite cases</b> — a question where a superseded document is the most relevant match and citing it is wrong. This is the only way the temporal filter becomes testable rather than assumed.</p></div>
<div class="note g"><div class="lab">How it grows</div><p><b>From production.</b> Every incident, complaint and surprising output becomes a case with its correct answer recorded. A set that grows this way converges on the real distribution of difficulty, which no amount of synthesis achieves. Version it like code.</p></div>`},

{label:'TRAP', tag:'Aggregates', title:'The average conceals exactly what must be acted on', stage:11, html:`
<div class="bt">
<div class="pair">
  <div class="believed"><div class="lab">Commonly believed</div><div class="txt">Overall accuracy rose from 82 to 84 percent, so the change was an improvement and should ship.</div></div>
  <div class="true"><div class="lab">What is true</div><div class="txt">An aggregate is a weighted average over subpopulations. A two-point rise across a large common slice comfortably hides an eleven-point collapse on a small one — and the small one is frequently the one carrying regulatory or reputational weight.</div></div>
</div>
</div>
<p style="margin-top:16px">The slices that repay separate reporting: <b>language, question type, document type, entitlement level, recency, and difficulty.</b></p>
<div class="note"><div class="lab">Two metric choices that matter as much as slicing</div><p><b>Macro-averaged F1 rather than accuracy</b> on imbalanced classification, so a rare class cannot be ignored into a high score.</p><p><b>False refusal rate, always.</b> A system refusing too often is as useless as one that is unsafe, and it is far more dangerous organisationally — <b>it generates no complaints</b>. Users quietly stop using it, and the metrics look excellent right up to the point where nobody is left.</p></div>
<div class="note g"><div class="lab">The gate</div><p>A drop of five points on any single slice blocks a release, regardless of what the aggregate did.</p></div>`},

{label:'MECHANISM', tag:'Model as judge', title:'Decompose, demand evidence, compute the score', stage:11, html:`
<p class="kicker">Many qualities cannot be checked deterministically — faithfulness, completeness, tone. A model can score them, and it brings five biases that have to be designed around.</p>
<table class="tbl free">
<tr><td><b>Position</b></td><td>Prefers whichever candidate came first.</td></tr>
<tr><td><b>Verbosity</b></td><td>Prefers longer answers regardless of content.</td></tr>
<tr><td><b>Self-preference</b></td><td>Prefers output from its own model family.</td></tr>
<tr><td><b>Style</b></td><td>Prefers confident phrasing over hedged phrasing, independent of correctness.</td></tr>
<tr><td><b>Compression</b></td><td>Clusters everything into a narrow band, so real differences vanish.</td></tr>
</table>
<div class="note g"><div class="lab">Three design rules that address most of it</div><p><b>Decompose before scoring</b> — ask for individual factual judgements first, not a holistic rating. <b>Demand evidence spans</b> — require the judge to quote the text supporting each judgement. <b>Compute the score</b> from those judgements rather than asking the model to choose a number.</p><p>And use a strong model. Judging is harder than answering, and a cheap judge is a false economy that corrupts every measurement taken with it.</p></div>`},

{label:'WORKED', tag:'Calibration', title:'Eighty-eight percent agreement can be poor', stage:11, html:`
<p class="kicker">A judge must be checked against human labels before it is trusted. Raw agreement is a misleading way to do that, because two raters who both say "pass" most of the time agree constantly by chance alone.</p>
<div class="formula">κ = (p_observed − p_expected) ÷ (1 − p_expected)<small>agreement beyond chance</small></div>
<ul class="steps">
<li><span class="op"><b>Observed agreement</b>Judge and human matched on 88 of 100</span><span class="res">0.880</span></li>
<li><span class="op"><b>Both say pass</b>0.85 × 0.82</span><span class="res">0.697</span></li>
<li><span class="op"><b>Both say fail</b>0.15 × 0.18</span><span class="res">0.027</span></li>
<li><span class="op"><b>Expected by chance</b>Sum of the two</span><span class="res">0.724</span></li>
<li class="total"><span class="op"><b>Kappa</b>(0.880 − 0.724) ÷ (1 − 0.724)</span><span class="res">0.565</span></li>
</ul>
<div class="note q"><div class="lab">Reading the result</div><p>Eighty-eight percent sounds strong. Because both raters pass most cases, 72 percent agreement would have occurred by chance alone — so the judge is capturing barely half the remaining signal. <b>Raw agreement lies, and it lies in the reassuring direction.</b></p></div>
<div class="note"><div class="lab">The bands</div><p>Above 0.80, the judge can be trusted for routine measurement. Between 0.60 and 0.80, report with caveats. <b>Below 0.60, fix the rubric</b> — a judge at 0.565 is producing numbers that will be quoted in decisions and are not measuring what they claim to.</p></div>`},

{label:'NUMBERS', tag:'Observability', title:'Four indicators that move before users complain', stage:11, html:`
<table class="tbl free">
<tr><td><b>Cache hit rate</b></td><td>Falls when a prompt changed without anyone announcing it.</td></tr>
<tr><td><b>Escalation rate</b></td><td>Rises when the cheap tier starts failing — from a corpus change, a prompt change, or a shift in what is being asked.</td></tr>
<tr><td><b>Abstention rate</b></td><td>Rises when retrieval degrades. Falls when the score floor was quietly lowered.</td></tr>
<tr><td><b>Guardrail trigger rate</b></td><td>Rises under attack. Falls when a guardrail broke and is passing everything.</td></tr>
</table>
<div class="note"><div class="lab">How to alert on them</div><p><b>On 20 percent relative movement, not on absolute thresholds.</b> An absolute threshold is wrong for every workload except the one it was set for, and it stays wrong quietly. Relative movement is meaningful everywhere and needs no tuning.</p></div>
<div class="note g"><div class="lab">Three fields that turn a trace into an audit artefact</div><p><b>Prompt version, model pin, corpus snapshot.</b> Without all three, a stored request and response cannot be explained later — the same input against a changed prompt, a silently updated model or a re-indexed corpus is a different system. Store full prompts and full responses; sampling is a false economy, because the one request that matters is never in the sample.</p></div>`},

{label:'DEFINE', tag:'What is actually new', title:'Three things that have no precedent', stage:11, html:`
<p class="kicker">Most AI security concerns are ordinary application security in unfamiliar clothing. Three are genuinely new, and they are the ones worth the attention.</p>
<table class="tbl free">
<tr><td><b>One channel</b></td><td>Instructions and data travel in the same token stream. Database injection was solved by separating the query from its parameters. <b>There is no equivalent separation for a prompt</b> — no mechanism that marks one span as instruction and another as inert data.</td></tr>
<tr><td><b>Text nobody wrote for the system</b></td><td>The attack surface includes every retrieved document, every web page fetched, every email parsed. Content authored by an attacker, arriving through an ordinary channel, is read with the same weight as the operator's own instructions.</td></tr>
<tr><td><b>Autonomy compounds</b></td><td>A single wrong answer is one wrong answer. An agent acting on a wrong answer propagates it across every subsequent step. <b>The blast radius is every credential and every tool the agent can reach.</b></td></tr>
</table>
<div class="note"><div class="lab">Two rules carrying disproportionate weight</div><p><b>Model output is untrusted input to every downstream system.</b> Text from a model reaching a shell, a query, a template or a browser is attacker-influenced text arriving at an execution surface.</p><p><b>Assume the system prompt leaks.</b> No secrets, no credentials, no internal endpoints, no confidential rules.</p></div>`},

{label:'MECHANISM', tag:'The trifecta', title:'Three ingredients, and removing one collapses the class', stage:11, html:`
<div class="dia">
<svg viewBox="0 0 300 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three overlapping conditions that together make data exfiltration achievable">
  <g font-family="IBM Plex Sans, sans-serif">
    <circle cx="110" cy="66" r="52" fill="none" stroke="#D9584A" stroke-width="1.5" opacity="0.9"/>
    <circle cx="190" cy="66" r="52" fill="none" stroke="#E0A73E" stroke-width="1.5" opacity="0.9"/>
    <circle cx="150" cy="112" r="52" fill="none" stroke="#6FBF9B" stroke-width="1.5" opacity="0.9"/>
    <text x="78" y="44" font-size="9" fill="#D9584A" text-anchor="middle" font-weight="500">private</text>
    <text x="78" y="55" font-size="9" fill="#D9584A" text-anchor="middle" font-weight="500">data</text>
    <text x="222" y="44" font-size="9" fill="#E0A73E" text-anchor="middle" font-weight="500">untrusted</text>
    <text x="222" y="55" font-size="9" fill="#E0A73E" text-anchor="middle" font-weight="500">content</text>
    <text x="150" y="140" font-size="9" fill="#6FBF9B" text-anchor="middle" font-weight="500">external</text>
