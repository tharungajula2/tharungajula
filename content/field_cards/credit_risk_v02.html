<div class="r"><b>Sub-standard, doubtful, loss</b><span>The ladder below the boundary, escalating with age</span></div>
<div class="r"><b>Roll rates rise with depth</b><span>Early buckets cure; deep buckets do not. Chain them for probability of reaching NPA</span></div>
<div class="r"><b>Transition matrix</b><span>Diagonal is stability, last column is realised default rate, asymmetry shows direction</span></div>
<div class="r"><b>Vintage beats headline</b><span>Same months on book, cohort by cohort. Sees deterioration around two years earlier</span></div>
<div class="r"><b>Flow, not just stock</b><span>Opening + slippage &minus; upgrades &minus; recoveries &minus; write-offs = closing</span></div>
</div>`}
]},

/* ============ 06 ============ */
{n:"06",title:"Proving a model works",stage:"Measurement",
line:"The statistics that decide whether an estimate is fit to use, the tests that decide whether it still is, and the governance that surrounds both.",
bullets:["Gini and AUROC, and their exact relationship","The KS statistic","PSI and CSI &mdash; population and characteristic drift","Calibration testing","Backtesting against outcomes","Model governance and the validation cycle"],
cards:[

{l:"ORIENT",t:"Two questions",h:"Ranking and <em>level</em>",b:`<p>Validation answers two independent questions, and every statistic below belongs to one of them. Mixing them produces the classic misdiagnosis: a well-ranking model declared broken because its levels drifted, or a badly ranking model accepted because its average is right.</p>
<div class="two">
<div><b>Does it rank?</b>Are riskier accounts scored worse than safer ones? Tested by Gini, AUROC, KS. Fixed by rebuilding the model.</div>
<div><b>Is the level right?</b>Do predicted rates match observed rates? Tested by calibration and backtesting. Often fixed by recalibration alone, without touching the ranking.</div>
</div>
<p>A third question sits underneath both: <strong>is the population still the one the model was built on?</strong> Tested by PSI and CSI. If the answer is no, the other two tests are being run on a model applied outside its domain.</p>`},

{l:"FORMULA",t:"Gini and AUROC",h:"Two names, one <em>quantity</em>",b:`<p><span class="k">AUROC</span> is the area under the receiver operating characteristic curve. Its interpretation is exact and worth memorising: <strong>the probability that a randomly chosen defaulter scores worse than a randomly chosen non-defaulter.</strong></p>
<div class="fx"><div class="cap">The relationship</div>
<div class="eq"><em>Gini</em> = 2 &times; <em>AUROC</em> &minus; 1</div>
<div class="wh">AUROC 0.5 &rarr; Gini 0&nbsp;&nbsp;no discrimination, equivalent to random<br>
AUROC 0.75 &rarr; Gini 0.50<br>
AUROC 1.0 &rarr; Gini 1&nbsp;&nbsp;perfect separation, and in practice a sign of leakage</div></div>
<p>Both measure the same thing on different scales. Gini is the market convention in credit; AUROC is the convention in statistics. Quoting one when the audience expects the other produces an apparent disagreement about model quality that is purely a units problem.</p>
<div class="note">Indicative bands, and they are conventions rather than thresholds: below 0.30 Gini is weak, 0.30&ndash;0.45 acceptable for many portfolios, 0.45&ndash;0.60 strong, above 0.70 warrants investigation for leakage. Achievable Gini varies enormously by portfolio &mdash; low-default corporate books legitimately score differently from high-volume retail.</div>`},

{l:"FORMULA",t:"The KS statistic",h:"The widest <em>gap</em>",b:`<p>Rank every account by score and plot two cumulative curves: the share of all defaulters captured, and the share of all non-defaulters captured. <span class="k">KS</span> is the largest vertical distance between them.</p>
<div class="fx"><div class="cap">Kolmogorov&ndash;Smirnov statistic</div>
<div class="eq"><em>KS</em> = max<sub>s</sub> | <em>F</em><sub>bad</sub>(s) &minus; <em>F</em><sub>good</sub>(s) |</div>
<div class="wh">F<sub>bad</sub>(s)&nbsp;&nbsp;cumulative share of defaulters with score &le; s<br>
F<sub>good</sub>(s)&nbsp;cumulative share of non-defaulters with score &le; s<br>
Reported as a percentage, 0 to 100</div></div>
<p>KS carries something Gini does not: <strong>the score at which the maximum separation occurs</strong>. That score is the natural candidate for a cut-off, because it is the point where accepting one more account costs the most in bad accounts per good account gained.</p>
<div class="note">KS is a single-point measure and Gini integrates across the whole curve. Two models can share a KS and rank very differently elsewhere in the distribution, which is why both are reported rather than either alone.</div>`},

{l:"FORMULA",t:"PSI",h:"Has the population <em>moved</em>?",b:`<p>A model built on one population and applied to another will misbehave even if nothing about the model changed. The <span class="k">population stability index</span> quantifies the shift.</p>
<div class="fx"><div class="cap">Population stability index</div>
<div class="eq"><em>PSI</em> = &Sigma; ( <em>A</em><sub>i</sub> &minus; <em>E</em><sub>i</sub> ) &times; ln ( <sup><em>A</em><sub>i</sub></sup> &frasl; <sub><em>E</em><sub>i</sub></sub> )</div>
<div class="wh">A<sub>i</sub>&nbsp;actual proportion in band i, current period<br>
E<sub>i</sub>&nbsp;expected proportion in band i, from the development sample<br>
Summed across bands, usually score deciles</div></div>
<div class="wk"><div class="h">Conventional reading</div>
<div class="r"><b>PSI below 0.10</b><span>No material shift</span></div>
<div class="r"><b>PSI 0.10 to 0.25</b><span>Moderate shift &mdash; investigate</span></div>
<div class="r tot"><b>PSI above 0.25</b><span>Significant shift &mdash; model may be out of domain</span></div>
</div>
<p>The same formula applied to a <strong>single input variable</strong> rather than to the score is the <span class="k">characteristic stability index</span>. CSI is the diagnostic partner: PSI says the population moved, CSI says which variable moved it.</p>
<div class="note">These thresholds are industry convention, widely used and not derived from any distributional theory. They are a triage device, not a test with a p-value.</div>`},

{l:"MECHANISM",t:"Calibration",h:"Predicted against <em>observed</em>",b:`<p>Ranking tests say nothing about level. Calibration testing compares the PD assigned to each grade with the default rate actually realised in that grade.</p>
<div class="dt"><table>
<tr><th>Grade</th><th>Assigned PD</th><th>Observed</th><th class="n">Accounts</th></tr>
<tr><td>3</td><td>0.25%</td><td>0.21%</td><td class="n">18,400</td></tr>
<tr><td>4</td><td>0.65%</td><td>0.78%</td><td class="n">31,200</td></tr>
<tr><td>5</td><td>1.60%</td><td>2.45%</td><td class="n">22,700</td></tr>
<tr><td>6</td><td>3.90%</td><td>6.10%</td><td class="n">9,800</td></tr>
</table></div>
<p>Two distinct readings, and the distinction determines the remedy:</p>
<ul>
<li>The <strong>ordering is intact</strong> &mdash; observed rates still rise monotonically with grade. Discrimination is fine.</li>
<li>The <strong>level is understated</strong>, and increasingly so in worse grades. This is a calibration failure, corrected by rescaling PDs, not by rebuilding the scorecard.</li>
</ul>
<p>Statistical tests exist for whether a deviation is significant &mdash; a binomial test per grade, or a chi-square style test across grades jointly. Their power is limited in low-default portfolios, where a handful of defaults moves the observed rate enormously.</p>
<div class="note">This is the practical reason low-default portfolios are difficult: with few defaults, almost no calibration deviation is statistically significant, so the test cannot distinguish a well-calibrated model from a badly calibrated one.</div>`},

{l:"DEFINE",t:"Backtesting",h:"What the model said, against what <em>happened</em>",b:`<p>Backtesting compares predictions against realised outcomes over a period the model did not see during development. Three sample designs, with different strength:</p>
<div class="three">
<div><b>In-sample</b>The development data itself. Establishes the model fitted. Proves nothing about generalisation</div>
<div><b>Out-of-sample</b>A held-out slice of the same period. Tests overfitting</div>
<div><b>Out-of-time</b>A later period entirely. The only design that tests whether the relationship survived</div>
</div>
<p>Out-of-time is the meaningful one and the only one that catches the failure that matters: a relationship that held historically and stopped holding.</p>
<div class="note">Backtesting a through-the-cycle PD against a single year's outcomes is a category error. A TTC estimate is deliberately not the current-year rate. Judging it against one year will always show a deviation, and the deviation is the design working, not failing.</div>`},

{l:"MECHANISM",t:"Governance",h:"The cycle around the <em>statistics</em>",b:`<p>Validation is a governance process with statistics inside it, not a set of statistics with governance attached. The structure is consistent across institutions.</p>
<div class="lay">
<div><span>1</span><strong>Independence.</strong> Validation reports separately from development. The builder does not approve the build.</div>
<div><span>2</span><strong>Inventory.</strong> Every model registered with an owner, a purpose, a version, a validation date and a tier reflecting materiality.</div>
<div><span>3</span><strong>Initial validation</strong> before first use: data quality, methodology, assumptions, implementation testing, documentation.</div>
<div><span>4</span><strong>Ongoing monitoring</strong> at a defined frequency, against pre-agreed thresholds with defined actions.</div>
<div><span>5</span><strong>Periodic revalidation</strong> on a cycle set by tier.</div>
<div><span>6</span><strong>Approval and findings</strong> tracked to closure by a model risk committee.</div>
</div>
<p>The step most often skipped is <strong>implementation testing</strong> &mdash; verifying that the model coded into the production system reproduces the developer's results on identical inputs. A correctly specified model wrongly implemented is a failure that no amount of statistical validation will find, because the statistics are computed on the developer's version rather than the deployed one.</p>`},

{l:"RECALL",t:"Mission 06",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Gini = 2 &times; AUROC &minus; 1</b><span>Same quantity, two scales. AUROC is the probability a bad scores worse than a good</span></div>
<div class="r"><b>KS = max |F<sub>bad</sub> &minus; F<sub>good</sub>|</b><span>Widest separation, and the score where it occurs is the natural cut-off</span></div>
<div class="r"><b>PSI = &Sigma;(A&minus;E) ln(A/E)</b><span>Under 0.10 stable, over 0.25 significant. CSI is the same test per variable</span></div>
<div class="r"><b>Calibration is separate from ranking</b><span>Order intact but levels wrong means recalibrate, not rebuild</span></div>
<div class="r"><b>Out-of-time is the real test</b><span>The only design that catches a relationship that stopped holding</span></div>
<div class="r"><b>Implementation testing</b><span>Deployed code must reproduce developer results on identical inputs</span></div>
</div>`}
]},
/* ============ 07 ============ */
{n:"07",title:"Basel, end to end",stage:"Capital",
line:"Why an international capital rulebook exists, what each round of it fixed, and how the Indian implementation differs from the global text.",
bullets:["Why banks are told how thin they may be","Basel I to the final reforms, as four failures","The three pillars","The capital stack, and what each layer absorbs","The Indian minimum ratios","Buffers, D-SIBs and the leverage backstop","Live: the April 2027 rewrite"],
cards:[

{l:"WHY",t:"Why a rulebook",h:"Banks compete on <em>thinness</em>",b:`<p>Capital is expensive. A bank holding less of it earns a higher return on what remains. Left alone, competition pushes every bank towards the minimum it can defend &mdash; until a bad year takes several of them down and the state pays.</p>
<p>The Basel Committee sets a common minimum so that no jurisdiction can attract business by permitting thinner banks. It has <strong>no legal power whatsoever</strong>. It writes standards; national regulators turn them into enforceable law.</p>
<div class="flow">
<div class="n"><b>Basel Committee</b>Writes the global standard. No enforcement authority anywhere</div>
<div class="a">&#8595;</div>
<div class="n"><b>National regulator</b>Transposes it into binding domestic directions, with national discretions exercised</div>
<div class="a">&#8595;</div>
<div class="n"><b>The bank</b>Calculates, holds, reports and discloses</div>
</div>
<div class="note">This is why the same standard produces different rules in different countries, on different dates. National discretion is built into the design, not a deviation from it.</div>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/basel_framework/" target="_blank" rel="noopener">The consolidated Basel Framework &mdash; the full standard, chapter by chapter</a></div>`},

{l:"MECHANISM",t:"Four rounds, four failures",h:"Each version fixes the last one's <em>arbitrage</em>",b:`<div class="dt"><table>
<tr><th>Version</th><th>What it did, and why it failed</th></tr>
<tr><td>Basel I<br>1988</td><td>Five crude risk buckets. Simple, and immediately arbitraged &mdash; the worst borrower in a bucket cost the same capital as the best, so banks kept the worst and sold the best</td></tr>
<tr><td>Basel II<br>2004</td><td>Risk sensitivity, three pillars, and permission for banks to model their own parameters. Then 2008 showed the models understated risk and the framework said nothing about liquidity at all</td></tr>
<tr><td>Basel III<br>2010&ndash;17</td><td>More capital and better capital, plus two entirely new dimensions &mdash; liquidity ratios and a non-risk-weighted leverage backstop</td></tr>
<tr class="hi"><td>Final reforms<br>2017</td><td>Attacks the remaining problem: unjustifiable variation in modelled RWA between banks holding identical risk. Constrains internal models, rewrites the standardised approach, imposes an output floor</td></tr>
</table></div>
<p>The final package carries a different name in every jurisdiction &mdash; Basel 3.1, the Basel III endgame, CRR3, or simply the revised standardised approach directions. Same underlying standard, different labels and different commencement dates.</p>`},

{l:"DEFINE",t:"The three pillars",h:"Minimum, judgement, <em>daylight</em>",b:`<div class="lay">
<div><span>1</span><strong>Pillar 1 &mdash; minimum requirements.</strong> Formula-driven capital for credit, market and operational risk. The same rules for every bank.</div>
<div><span>2</span><strong>Pillar 2 &mdash; supervisory review.</strong> The bank assesses risks Pillar 1 misses in its ICAAP; the supervisor reviews and may impose a firm-specific addition.</div>
<div><span>3</span><strong>Pillar 3 &mdash; market discipline.</strong> Mandatory public disclosure on prescribed templates, so investors and counterparties can compare banks directly.</div>
</div>
<p>Concentration risk, interest rate risk in the banking book, pension risk, strategic risk and model risk carry <strong>no Pillar 1 charge</strong>. They are assessed in Pillar 2, which is why the ICAAP is a substantive document rather than a compliance exercise. Mission 09 covers it.</p>
<div class="note">Pillar 3 templates are prescribed to the cell. Producing them is a downstream data extraction problem, and the figures disclosed must reconcile to the regulatory returns and to the published accounts &mdash; a reconciliation that is checked and that regularly fails.</div>`},

{l:"MECHANISM",t:"The capital stack",h:"Loss-absorbing, in <em>order</em>",b:`<p>Not all capital absorbs loss equally, so the framework ranks it. Quality descends going down.</p>
<div class="lay">
<div class="hot"><span>1</span><strong>CET1 &mdash; Common Equity Tier 1.</strong> Paid-up equity and retained earnings, net of prescribed deductions. Absorbs loss immediately while the bank continues operating. The real measure.</div>
<div><span>2</span><strong>AT1 &mdash; Additional Tier 1.</strong> Perpetual instruments that convert or are written down when CET1 falls below a trigger. Going-concern capital by contract rather than by nature.</div>
<div><span>3</span><strong>Tier 2.</strong> Subordinated debt with a minimum original maturity, amortised in the final five years. Absorbs loss only in insolvency &mdash; gone-concern capital.</div>
</div>
<p>Deductions from CET1 matter as much as the additions. Goodwill and intangibles, deferred tax assets that rely on future profitability, and reciprocal cross-holdings in other financial institutions are all removed, because none of them would absorb a loss.</p>
<div class="note">AT1 is where the loss-absorption promise is contractual rather than structural, and it is the layer that behaves unexpectedly under stress &mdash; write-down of AT1 while equity retained value has happened, and it repriced the instrument class globally.</div>`},

{l:"NUMBERS",t:"The Indian minima",h:"Nine per cent, plus the <em>buffer</em>",b:`<p>The Indian calibration is stricter than the Basel text at the total capital level, and this is a genuine and frequently missed point of difference.</p>
<div class="dt"><table>
<tr><th>Requirement</th><th>Basel minimum</th><th class="n">Indian minimum</th></tr>
<tr><td>CET1</td><td>4.5%</td><td class="n">5.5%</td></tr>
<tr><td>Tier 1</td><td>6.0%</td><td class="n">7.0%</td></tr>
<tr><td>Total capital (CRAR)</td><td>8.0%</td><td class="n">9.0%</td></tr>
<tr><td>Capital conservation buffer</td><td>2.5%</td><td class="n">2.5%</td></tr>
<tr class="hi"><td>Total including CCB</td><td>10.5%</td><td class="n">11.5%</td></tr>
</table></div>
<p>On top of this sit two further layers. A <strong>countercyclical capital buffer</strong>, provided for in the framework and activated at the regulator's discretion. And a <strong>D-SIB surcharge</strong> for banks designated as domestic systemically important, applied in buckets by systemic importance.</p>
<div class="note">The consequence of a buffer breach is the point of buffers: a bank falling into the conservation buffer range faces automatic restrictions on discretionary distributions &mdash; dividends, discretionary bonuses and AT1 coupons &mdash; on a sliding scale. This is why ratios are managed to the basis point rather than to the percent.</div>`},

{l:"FORMULA",t:"The leverage ratio",h:"The backstop that ignores <em>risk</em>",b:`<p>Every ratio so far divides by RWA, and RWA depends on weights and models. If both err in the same direction, the ratios flatter the bank. The leverage ratio is deliberately crude as a defence.</p>
<div class="fx"><div class="cap">Leverage ratio</div>
<div class="eq"><em>LR</em> = <sup>Tier 1 capital</sup> &frasl; <sub>Total exposure measure</sub></div>
<div class="wh">Exposure measure = on-balance-sheet assets<br>
&nbsp;&nbsp;+ derivative exposures<br>
&nbsp;&nbsp;+ securities financing exposures<br>
&nbsp;&nbsp;+ off-balance-sheet items after conversion<br>
No risk weighting is applied anywhere in the denominator</div></div>
<p>The Indian framework sets a higher requirement for domestic systemically important banks than for other banks. The design intent is simple: a bank can argue about risk weights, but it cannot argue about the size of its balance sheet.</p>`},

{l:"LIVE",t:"The April 2027 rewrite",h:"Two directions, one <em>date</em>",b:`<div class="stamp">Collected 17 August 2026</div>
<p>India is implementing its version of the final Basel reforms, and two separate rulebooks change on the same day.</p>
<div class="dt"><table>
<tr><th>Date</th><th>Event</th></tr>
<tr><td>7 Oct 2025</td><td>Draft directions issued for the revised standardised approach to credit risk</td></tr>
<tr><td>27 Apr 2026</td><td>Final directions issued: the <strong>Capital Charge for Credit Risk &mdash; Standardised Approach Directions, 2026</strong>, alongside the final <strong>expected credit loss directions</strong></td></tr>
<tr class="hi"><td>1 Apr 2027</td><td>Both come into effect for commercial banks, excluding small finance banks, payments banks and local area banks</td></tr>
<tr><td>31 Mar 2031</td><td>End of the glide path smoothing the one-time provisioning impact of the move to expected credit loss</td></tr>
</table></div>
<p>The two directions do different work and it is worth being exact about which is which:</p>
<div class="two">
<div><b>Credit risk SA directions</b>Change how credit risk is <strong>capitalised</strong> on the balance sheet. Risk weights, granularity, conversion factors, mitigation</div>
<div><b>ECL directions</b>Change how credit risk is <strong>recognised</strong> in the profit and loss account. Staging, provisioning, prudential floors</div>
</div>
<div class="note">A structural fact about India worth carrying: the regulator has chosen to implement the <strong>standardised approach</strong> for credit risk capital. Internal ratings-based approaches remain in the wider framework but are not the operative route for Indian commercial banks, which is a material difference from the UK, EU and US positions.</div>
<div class="docs"><b>Official sources</b>
<a href="https://www.rbi.org.in/scripts/BS_ViewMasterDirections.aspx" target="_blank" rel="noopener">Reserve Bank of India &mdash; Master Directions index</a>
<a href="https://www.rbi.org.in/Scripts/BS_ViewMasCirculardetails.aspx?id=12652" target="_blank" rel="noopener">Master Circular &mdash; Basel III Capital Regulations</a></div>`},

{l:"RECALL",t:"Mission 07",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Basel writes standards, regulators write law</b><span>National discretion is designed in, not a deviation</span></div>
<div class="r"><b>Each round fixed the last one's arbitrage</b><span>The final reforms attack modelled RWA variation</span></div>
<div class="r"><b>Three pillars</b><span>Formula minimum, supervisory judgement via ICAAP, prescribed public disclosure</span></div>
<div class="r"><b>CET1 5.5, Tier 1 7.0, CRAR 9.0, plus CCB 2.5</b><span>India runs one percentage point above the Basel text at every tier</span></div>
<div class="r"><b>Buffer breach restricts distributions</b><span>Dividends, bonuses and AT1 coupons, on a sliding scale</span></div>
<div class="r"><b>LR = Tier 1 / total exposure</b><span>No risk weighting. A backstop against model and weight error</span></div>
<div class="r"><b>1 April 2027</b><span>Revised credit risk SA and expected credit loss, same commencement date</span></div>
</div>`}
]},

/* ============ 08 ============ */
{n:"08",title:"Turning exposure into RWA",stage:"Capital",
line:"The arithmetic that converts a loan into a capital requirement &mdash; under the standardised approach that India uses, and under the internal models framework that explains why the standardised approach was rewritten.",
bullets:["The three steps of the standardised approach","Risk weight drivers by exposure class","Credit risk mitigation, applied in order","A full worked RWA computation","The IRB formula, unpacked term by term","The output floor, and what it changes","Why capital and provisions interact"],
cards:[

{l:"MECHANISM",t:"The three steps",h:"Classify, mitigate, <em>weight</em>",b:`<p>Under the standardised approach the path from exposure to RWA is mechanical, and every step is a data operation.</p>
<div class="flow">
<div class="n"><b>1. Classify</b>Assign the exposure to a class: sovereign, bank, corporate, MSME, regulatory retail, real estate, specialised lending, equity, other</div>
<div class="a">&#8595;</div>
<div class="n"><b>2. Compute exposure and mitigate</b>Drawn plus converted undrawn, then recognise eligible collateral and guarantees after haircuts</div>
<div class="a">&#8595;</div>
<div class="n"><b>3. Apply the weight</b>From the table for that class, driven by external rating, loan-to-value, counterparty type or exposure size</div>
</div>
<div class="fx"><div class="cap">Risk-weighted assets and the resulting capital</div>
<div class="eq"><em>RWA</em> = &Sigma; <em>EAD</em><sub>i</sub> &times; <em>RW</em><sub>i</sub></div>
<div class="eq"><em>Capital required</em> = <em>RWA</em> &times; <em>CRAR</em><sub>min</sub></div>
<div class="wh">At the Indian total minimum of 9%, every &#8377;100 of RWA requires &#8377;9 of eligible capital<br>
Including the conservation buffer at 11.5%, &#8377;11.50</div></div>`},

{l:"DEFINE",t:"What drives the weight",h:"Five different <em>levers</em>",b:`<p>Not every exposure class is weighted the same way. Knowing which lever applies tells you which data attribute is critical for that class.</p>
<div class="dt"><table>
<tr><th>Class</th><th>Weight driven by</th></tr>
<tr><td>Sovereign</td><td>The sovereign itself; domestic currency claims on the home sovereign are typically zero-weighted</td></tr>
<tr><td>Banks</td><td>External rating, or a grading of the counterparty bank's own capital position where unrated</td></tr>
<tr><td>Corporate</td><td>External rating; unrated exposures receive a fixed weight. Enhanced due diligence expected on rated exposures</td></tr>
<tr><td>MSME</td><td>A distinct sub-class under the revised framework, with differentiated treatment</td></tr>
<tr><td>Regulatory retail</td><td>Granularity, size and product criteria rather than any rating</td></tr>
<tr><td>Real estate</td><td>Loan-to-value band, and whether repayment depends on cash flows from the property</td></tr>
<tr><td>Off-balance sheet</td><td>Credit conversion factor by commitment type, then weighted as the underlying</td></tr>
</table></div>
<div class="note">The revised framework raises granularity across all of these &mdash; more LTV bands, a separate MSME treatment, a rating-based approach for domestic banks, and conversion applied even to unconditionally cancellable commitments. Every additional dimension is an attribute that must be sourced, validated and mapped before it can be used.</div>`},

{l:"MECHANISM",t:"Credit risk mitigation",h:"Two ways to get <em>relief</em>",b:`<p>Mitigation reduces RWA through one of two mechanisms, and they work differently.</p>
<div class="two">
<div><b>Substitution</b>A guarantee or credit derivative replaces the borrower's risk weight with the protection provider's. Used where the guarantor is better rated than the obligor.</div>
<div><b>Collateralisation</b>Eligible financial collateral reduces the exposure amount itself, after haircuts for price volatility, currency mismatch and maturity mismatch.</div>
</div>
<div class="fx"><div class="cap">Comprehensive approach &mdash; adjusted exposure</div>
<div class="eq"><em>E</em>* = max { 0 , <em>E</em> &times; (1 + <em>H</em><sub>e</sub>) &minus; <em>C</em> &times; (1 &minus; <em>H</em><sub>c</sub> &minus; <em>H</em><sub>fx</sub>) }</div>
<div class="wh">E&nbsp;&nbsp;current exposure value<br>
H<sub>e</sub>&nbsp;haircut applied to the exposure itself<br>
C&nbsp;&nbsp;current value of collateral received<br>
H<sub>c</sub>&nbsp;haircut for collateral price volatility<br>
H<sub>fx</sub>&nbsp;haircut for currency mismatch<br>
E*&nbsp;&nbsp;exposure after mitigation, which is then risk weighted</div></div>
<p>The exposure is haircut <strong>upwards</strong> and the collateral <strong>downwards</strong>. Both adjustments are conservative, and deliberately so: between the default and the sale, the exposure may have grown and the collateral may have fallen.</p>`},

{l:"WORKED",t:"A full RWA computation",h:"One counterparty, end to <em>end</em>",b:`<p>A corporate borrower with three facilities. External rating maps to a 50% risk weight. Government securities of &#8377;60,00,000 are pledged as financial collateral, with a 4% haircut applicable to the security type.</p>
<div class="dt"><table>
<tr><th>Facility</th><th>Limit</th><th>Drawn</th><th>CCF</th><th class="n">EAD</th></tr>
<tr><td>Term loan</td><td>&#8377;2,00,00,000</td><td>&#8377;2,00,00,000</td><td>&mdash;</td><td class="n">&#8377;2,00,00,000</td></tr>
<tr><td>Cash credit</td><td>&#8377;1,50,00,000</td><td>&#8377;90,00,000</td><td>40%</td><td class="n">&#8377;1,14,00,000</td></tr>
<tr><td>Bank guarantee</td><td>&#8377;50,00,000</td><td>&mdash;</td><td>100%</td><td class="n">&#8377;50,00,000</td></tr>
</table></div>
<div class="wk"><div class="h">Computation</div>
<div class="r"><b>Gross EAD across the three facilities</b><span>&#8377;3,64,00,000</span></div>
<div class="r"><b>Collateral after 4% haircut: 60,00,000 &times; 0.96</b><span>&#8377;57,60,000</span></div>
<div class="r tot"><b>Adjusted exposure E*</b><span>&#8377;3,06,40,000</span></div>
<div class="r"><b>Risk weight from the rating</b><span>50%</span></div>
<div class="r tot"><b>RWA = 3,06,40,000 &times; 50%</b><span>&#8377;1,53,20,000</span></div>
<div class="r"><b>Capital at 9% CRAR</b><span>&#8377;13,78,800</span></div>
<div class="r tot"><b>Capital at 11.5% including CCB</b><span>&#8377;17,61,800</span></div>
</div>
<p>Two observations worth carrying. The undrawn cash credit added &#8377;24,00,000 of exposure that does not appear anywhere on the balance sheet. And the guarantee, entirely off balance sheet and generating no interest income, consumed capital at full conversion.</p>
<div class="note">Now remove the collateral linkage &mdash; a single missing join between the security record and the facility record. RWA rises to &#8377;1,82,00,000 and required capital at 11.5% rises by &#8377;3,31,200 on one counterparty. Multiplied across a book, unlinked collateral is one of the largest sources of unnecessary capital consumption in any bank.</div>`},

{l:"FORMULA",t:"The IRB formula",h:"What the internal models route actually <em>computes</em>",b:`<p>Where internal models are permitted, the bank supplies PD, LGD and EAD and the supervisor supplies the formula. It looks forbidding and does one thing: converts an average default probability into a capital requirement for a very bad year.</p>
<div class="fx"><div class="cap">Capital requirement per unit of exposure</div>
<div class="eq"><em>K</em> = [ <em>LGD</em> &times; N ( <sup>N<sup>&minus;1</sup>(<em>PD</em>) + &radic;<em>R</em> &times; N<sup>&minus;1</sup>(0.999)</sup> &frasl; <sub>&radic;(1 &minus; <em>R</em>)</sub> ) &minus; <em>PD</em> &times; <em>LGD</em> ] &times; <em>MA</em></div>
<div class="wh">N()&nbsp;&nbsp;standard normal cumulative distribution<br>
N<sup>&minus;1</sup>()&nbsp;its inverse<br>
R&nbsp;&nbsp;asset correlation, supervisory value by exposure class<br>
0.999&nbsp;the confidence level &mdash; one year in a thousand<br>
MA&nbsp;&nbsp;maturity adjustment</div></div>
<div class="fx"><div class="cap">From K to RWA</div>
<div class="eq"><em>RWA</em> = <em>K</em> &times; 12.5 &times; <em>EAD</em></div>
<div class="wh">12.5 is the reciprocal of the 8% Basel minimum &mdash; it converts a capital amount back into a risk-weighted asset amount</div></div>
<p>Read the bracket left to right. The <code>N(...)</code> term is <strong>PD stressed to the 99.9th percentile</strong> of a single common risk factor. Multiplying by LGD converts probability into loss. Subtracting <code>PD &times; LGD</code> removes the expected part, <strong>because capital covers only unexpected loss</strong>. The maturity adjustment scales the result up for longer exposures, which have more time to migrate to a worse grade.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/basel_framework/chapter/CRE/31.htm" target="_blank" rel="noopener">Basel Framework CRE31 &mdash; IRB risk weight functions</a>
<a href="https://www.bis.org/basel_framework/chapter/CRE/36.htm" target="_blank" rel="noopener">Basel Framework CRE36 &mdash; minimum requirements to use the IRB approach</a></div>`},

{l:"WHY",t:"Correlation",h:"The assumption that hides <em>concentration</em>",b:`<p>The <em>R</em> term in the formula is the <span class="k">asset correlation</span> &mdash; how much borrowers default together. It is not estimated by the bank; it is prescribed, and it varies by exposure class.</p>
<div class="bars">
<div class="row"><div class="lb"><span>Large corporate</span><span>higher correlation</span></div><div class="tr"><i style="width:85%"></i></div></div>
<div class="row"><div class="lb"><span>SME, adjusted for turnover</span><span>reduced</span></div><div class="tr"><i style="width:60%"></i></div></div>
<div class="row"><div class="lb"><span>Residential mortgage</span><span>fixed, relatively high</span></div><div class="tr"><i class="b" style="width:70%"></i></div></div>
<div class="row"><div class="lb"><span>Qualifying revolving retail</span><span>low</span></div><div class="tr"><i class="c" style="width:15%"></i></div></div>
</div>
<p>The formula assumes <strong>a single systematic factor and a perfectly diversified portfolio</strong>. That assumption is what makes the mathematics tractable, and it has a direct consequence: a portfolio concentrated in one borrower, one sector or one geography violates it, so its true tail risk is understated by construction.</p>
<div class="note">This is exactly why concentration risk is assessed under Pillar 2 rather than Pillar 1. It is not an oversight in the framework &mdash; it is the acknowledged cost of the simplification, and Mission 09 covers how it is measured instead.</div>`},

{l:"DEFINE",t:"The output floor",h:"The lever behind the whole <em>rewrite</em>",b:`<p>Two banks holding the same mortgage book were producing RWA differing by a factor of two, purely from model choice. Supervisors could not distinguish prudence from optimism.</p>
<div class="fx"><div class="cap">The floor</div>
<div class="eq"><em>RWA</em><sub>final</sub> = max ( <em>RWA</em><sub>modelled</sub> , 72.5% &times; <em>RWA</em><sub>standardised</sub> )</div>
<div class="wh">Applied at the total portfolio level, not exposure by exposure<br>
Phased in over a transitional period in the jurisdictions applying it</div></div>
<p>Two structural consequences follow, and both create permanent work:</p>
<ul>
<li>Every bank using internal models must compute <strong>both approaches, in parallel, forever</strong>. That doubles the calculation and doubles the data requirement.</li>
<li>Where the floor binds, improving a model <strong>no longer reduces capital</strong>. Investment shifts from modelling towards data quality and towards standardised inputs previously treated as unimportant.</li>
</ul>
<div class="note">India's position sidesteps this: with the standardised approach as the operative route for commercial banks, the floor has no bite domestically. It matters when reading global comparisons, when working with foreign bank branches, and when the standardised approach itself is being rewritten &mdash; which it is.</div>`},

{l:"TRAP",t:"Where RWA numbers break",h:"Six failures that are always <em>data</em>",b:`<div class="sheet q"><div class="h">Recurring causes</div>
<div class="r"><b>Missing or stale rating</b><span>Exposure falls to unrated and attracts a punitive weight it should not carry</span></div>
<div class="r"><b>Collateral not linked</b><span>Mitigation exists economically, is invisible regulatorily, and capital is held against it anyway</span></div>
<div class="r"><b>Wrong exposure class</b><span>An MSME classified as general corporate changes both the weight and the treatment</span></div>
<div class="r"><b>Undrawn limits absent</b><span>Conversion cannot be applied, so EAD is understated &mdash; the dangerous direction</span></div>
<div class="r"><b>Duplicate exposures</b><span>The same facility arriving from two source systems, weighted twice</span></div>
<div class="r"><b>Guarantee without substitution</b><span>Protection recorded but never applied, so the better weight is never taken</span></div>
</div>
<p>Every row is a reconciliation that can be specified, and every one is worth more capital than any refinement of the calculation itself.</p>`},

{l:"RECALL",t:"Mission 08",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>RWA = &Sigma; EAD &times; RW</b><span>Capital = RWA &times; minimum ratio. At 11.5%, &#8377;11.50 per &#8377;100 of RWA</span></div>
<div class="r"><b>Classify, mitigate, weight</b><span>Three mechanical steps, each a data operation</span></div>
<div class="r"><b>E* = E(1+H<sub>e</sub>) &minus; C(1&minus;H<sub>c</sub>&minus;H<sub>fx</sub>)</b><span>Exposure haircut up, collateral haircut down. Deliberately conservative both ways</span></div>
<div class="r"><b>RWA = K &times; 12.5 &times; EAD</b><span>12.5 is the reciprocal of 8%. K stresses PD to 99.9% and removes expected loss</span></div>
<div class="r"><b>Correlation is prescribed</b><span>The formula assumes full diversification, so concentration moves to Pillar 2</span></div>
<div class="r"><b>Floor at 72.5% of standardised</b><span>Forces dual calculation where models are used. Not operative for Indian commercial banks</span></div>
</div>`}
]},
/* ============ 09 ============ */
{n:"09",title:"Pillar 2 and stress",stage:"Capital",
line:"The risks the minimum formula does not capture, how a bank quantifies them itself, and how it proves it would survive a year it has not seen.",
bullets:["What Pillar 1 misses, specifically","Concentration, measured","The ICAAP, section by section","Scenario design and severity","Translating a scenario into a loss","Capital planning under stress","Reverse stress testing"],
cards:[

{l:"ORIENT",t:"The gap",h:"What the formula does not <em>see</em>",b:`<p>Pillar 1 capital is calculated by formulae that make simplifying assumptions. Each assumption leaves a real risk uncovered.</p>
<div class="dt"><table>
<tr><th>Risk</th><th>Why Pillar 1 misses it</th></tr>
<tr><td>Concentration</td><td>The credit formula assumes a perfectly diversified portfolio</td></tr>
<tr><td>Interest rate risk in the banking book</td><td>Deliberately excluded from Pillar 1 and assessed separately</td></tr>
<tr><td>Liquidity risk</td><td>Addressed by ratios and buffers rather than by capital</td></tr>
<tr><td>Model risk</td><td>The formula assumes its own inputs are correct</td></tr>
<tr><td>Reputational and strategic risk</td><td>No formula exists</td></tr>
<tr><td>Residual risk in mitigation</td><td>Assumes collateral and guarantees perform as documented</td></tr>
</table></div>
<p>The <span class="k">ICAAP</span> &mdash; internal capital adequacy assessment process &mdash; is where the bank quantifies these itself, and the supervisory review process is where that assessment is challenged and may result in a firm-specific capital addition.</p>`},

{l:"FORMULA",t:"Measuring concentration",h:"Two numbers, one <em>idea</em>",b:`<p>Concentration is the largest Pillar 2 risk at most lenders and the most tractable to measure. The standard measure comes from industrial economics.</p>
<div class="fx"><div class="cap">Herfindahl&ndash;Hirschman index</div>
<div class="eq"><em>HHI</em> = &Sigma;<sub>i</sub> <em>w</em><sub>i</sub><sup>2</sup></div>
<div class="wh">w<sub>i</sub>&nbsp;share of total exposure held by borrower, sector or geography i<br>
Ranges from 1/n for a perfectly even book to 1 for a single exposure</div></div>
<div class="fx"><div class="cap">The intuitive reading</div>
<div class="eq"><em>n</em><sub>eff</sub> = <sup>1</sup> &frasl; <sub><em>HHI</em></sub></div>
<div class="wh">The effective number of equally sized exposures the portfolio behaves like</div></div>
<div class="wk"><div class="h">Two books, same size</div>
<div class="r"><b>Book A: 100 exposures of 1% each</b><span>HHI 0.0100</span></div>
<div class="r"><b>Book A effective count</b><span>100</span></div>
<div class="r"><b>Book B: 5 of 12% and 40 of 1% each</b><span>HHI 0.0760</span></div>
<div class="r tot"><b>Book B effective count</b><span>13</span></div>
</div>
<p>Book B has 45 borrowers and behaves like 13. Both books have identical Pillar 1 capital if the exposures share a grade &mdash; and Book B is obviously more dangerous. That difference is precisely the Pillar 2 add-on.</p>
<div class="note">The same computation runs across three dimensions: single-name, sector and geography. Regulatory large-exposure limits cap the first directly; the second and third are managed through internal limits and capital.</div>`},

{l:"MECHANISM",t:"The ICAAP",h:"What is actually <em>in</em> it",b:`<p>A board-owned document with a consistent structure. Knowing the sections tells you what data each requires.</p>
<div class="lay">
<div><span>1</span><strong>Business model and strategy.</strong> What the bank does, where it is going, and the risks that creates.</div>
<div><span>2</span><strong>Risk appetite.</strong> Quantified limits the board has set, and current position against each.</div>
<div><span>3</span><strong>Risk assessment.</strong> Every material risk identified, measured where possible and argued where not.</div>
<div><span>4</span><strong>Capital quantification.</strong> Pillar 1 plus the internal assessment of everything Pillar 1 missed.</div>
<div><span>5</span><strong>Stress testing.</strong> Scenarios, methodology, results, and the capital path under each.</div>
<div><span>6</span><strong>Capital planning.</strong> Projected requirement and supply over the planning horizon, with management actions.</div>
<div><span>7</span><strong>Governance.</strong> Who owns the process, who challenged it, when the board approved it.</div>
</div>
<div class="note">The section most often weak is <strong>risk appetite</strong>. A statement that is not quantified, not monitored, and not linked to actual limits is decorative &mdash; and it is exactly what a supervisor tests by asking what happens operationally when a limit is breached.</div>`},

{l:"MECHANISM",t:"Scenario to loss",h:"How a narrative becomes a <em>number</em>",b:`<p>A stress scenario is a coherent story about the economy, expressed as paths for a small set of variables. Turning it into a capital number runs through a defined chain.</p>
<div class="flow">
<div class="n"><b>1. Scenario variables</b>GDP growth, inflation, policy rate, unemployment, property prices, exchange rate &mdash; projected quarterly over the horizon</div>
<div class="a">&#8595;</div>
<div class="n"><b>2. Satellite models</b>Link each variable to portfolio outcomes: default rates, recovery rates, drawdown behaviour</div>
<div class="a">&#8595;</div>
<div class="n"><b>3. Parameter shift</b>Stressed PD and stressed LGD by segment</div>
<div class="a">&#8595;</div>
<div class="n"><b>4. Impairment and RWA</b>Higher provisions hit the profit and loss account; grade migration raises RWA</div>
<div class="a">&#8595;</div>
<div class="n"><b>5. Capital path</b>Lower earnings and lower capital over a larger denominator, quarter by quarter</div>
</div>
<p>The squeeze is the point: <strong>the numerator falls while the denominator rises</strong>. A stress that reduces capital by 15% and increases RWA by 10% cuts the ratio by roughly a quarter, which is far more than either effect alone suggests.</p>`},

{l:"WORKED",t:"A stress on the ratio",h:"Both ends move at <em>once</em>",b:`<p>A bank with &#8377;10,000 crore of RWA and &#8377;1,300 crore of CET1, so a CET1 ratio of 13.0%. A three-year adverse scenario is applied.</p>
<div class="wk"><div class="h">Year 2 of the scenario</div>
<div class="r"><b>Opening CET1</b><span>&#8377;1,300 cr</span></div>
<div class="r"><b>Pre-provision operating profit</b><span>+&#8377;180 cr</span></div>
<div class="r"><b>Credit impairment charge under stress</b><span>&minus;&#8377;420 cr</span></div>
<div class="r"><b>Tax effect at 25% on the loss</b><span>+&#8377;60 cr</span></div>
<div class="r tot"><b>Closing CET1</b><span>&#8377;1,120 cr</span></div>
<div class="r"><b>Opening RWA</b><span>&#8377;10,000 cr</span></div>
<div class="r"><b>Grade migration effect</b><span>+&#8377;900 cr</span></div>
<div class="r tot"><b>Closing RWA</b><span>&#8377;10,900 cr</span></div>
<div class="r tot"><b>CET1 ratio: 1,120 / 10,900</b><span>10.28%</span></div>
</div>
<p>The ratio fell 272 basis points. Capital alone fell 13.8%; RWA alone rose 9.0%; together they cut the ratio by 21%. Against a requirement of 5.5% plus a 2.5% conservation buffer, the bank remains above its buffer &mdash; but the distance has narrowed sharply, and that distance is what the board actually manages.</p>
<div class="note">Illustrative figures constructed to show the mechanism. The migration effect is the part most often underestimated in a first stress model, because it requires a transition matrix conditioned on the scenario rather than a static one.</div>`},

{l:"DEFINE",t:"Reverse stress testing",h:"Starting from the <em>failure</em>",b:`<p>A conventional stress test asks what a severe scenario would do. A <span class="k">reverse stress test</span> inverts the question: what would have to happen for this bank to become unviable?</p>
<div class="two">
<div><b>Conventional</b>Scenario &rarr; outcome. Tests resilience against a defined severity. Comfortable, because the answer is usually "we survive"</div>
<div><b>Reverse</b>Outcome &rarr; scenario. Fixes failure as the endpoint and works backwards to find what causes it</div>
</div>
<p>It is more uncomfortable and more informative, because it identifies the <strong>specific vulnerability</strong> rather than confirming general robustness. The typical finding is not a macroeconomic collapse but something concentrated: one sector, one funding source, one counterparty group, one operational dependency.</p>
<div class="note">Reverse stress testing is where combined scenarios earn their place. Credit losses alone rarely cause failure. Credit losses plus a funding withdrawal plus an inability to monetise the buffer is the combination that actually does, and only a combined scenario reveals it.</div>`},

{l:"RECALL",t:"Mission 09",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Pillar 1 misses concentration, IRRBB, model and strategic risk</b><span>Each is a known cost of a simplifying assumption</span></div>
<div class="r"><b>HHI = &Sigma;w<sub>i</sub><sup>2</sup>, effective count = 1/HHI</b><span>45 borrowers can behave like 13</span></div>
<div class="r"><b>ICAAP has seven sections</b><span>Risk appetite is the one most often decorative rather than binding</span></div>
<div class="r"><b>Scenario &rarr; satellite &rarr; parameters &rarr; impairment and RWA &rarr; capital path</b><span>Five links, each a model</span></div>
<div class="r"><b>Both ends of the ratio move</b><span>Capital falls while RWA rises. The combined effect exceeds either alone</span></div>
<div class="r"><b>Reverse stress starts from failure</b><span>Finds the specific vulnerability rather than confirming general resilience</span></div>
</div>`}
]},

/* ============ 10 ============ */
{n:"10",title:"Provisioning, and the shift",stage:"Provisions",
line:"How a loss is recognised in the accounts &mdash; the classification-based rules India has used, the expected-loss framework replacing them, and why capital and provisions never reconcile.",
bullets:["Incurred loss, and why it failed","The three stages of expected credit loss","Significant increase in credit risk","Lifetime ECL, discounted properly","Forward-looking scenarios","Prudential floors and the glide path","Why Basel EL and accounting ECL differ"],
cards:[

{l:"WHY",t:"The problem",h:"Provisions arrived too <em>late</em>",b:`<p>Under an incurred-loss framework a provision is recognised once there is objective evidence that a loss event has occurred. Through a benign period the books look clean. When the cycle turns, provisions arrive in a rush, after the capital position has already deteriorated.</p>
<p>Expected-loss provisioning inverts the timing. From the day an exposure is recognised, a provision is carried for losses <strong>expected in the future</strong>, before any evidence of trouble in that specific account.</p>
<div class="two">
<div><b>Incurred loss</b>Backward looking. Trigger-based. Provisions lag the cycle and cluster in the downturn</div>
<div><b>Expected loss</b>Forward looking. Continuous. Provisions build earlier and, in principle, more smoothly</div>
</div>
<div class="note">Two frameworks now coexist in India and they answer different questions. Asset <strong>classification</strong> &mdash; standard, sub-standard, doubtful, loss, with the 90-day NPA boundary &mdash; is retained. What changes is the <strong>provisioning basis</strong> sitting on top of it.</div>
<div class="docs"><b>Official source</b>
<a href="https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/" target="_blank" rel="noopener">IFRS 9 Financial Instruments &mdash; the international standard the framework aligns to</a></div>`},

{l:"MECHANISM",t:"The three stages",h:"One trigger, two <em>horizons</em>",b:`<div class="lay">
<div><span>1</span><strong>Stage 1 &mdash; performing.</strong> No significant deterioration since initial recognition. Provide for losses arising from defaults expected within the <strong>next 12 months</strong>.</div>
<div><span>2</span><strong>Stage 2 &mdash; underperforming.</strong> Credit risk has increased significantly since initial recognition. Provide for losses from defaults expected over the <strong>whole remaining life</strong>.</div>
<div><span>3</span><strong>Stage 3 &mdash; credit-impaired.</strong> Default has occurred. Lifetime loss, and interest revenue is computed on the net rather than the gross carrying amount.</div>
</div>
<p>The migration from stage 1 to stage 2 is the single most consequential event in the framework. It is not an incremental increase &mdash; the horizon changes from twelve months to the entire remaining life, so the provision on a long-dated exposure can multiply several times over on one reclassification.</p>
<div class="note">Which is exactly why the trigger is contested, audited, modelled and re-modelled. It is also why staging counts, not just provision amounts, are a reported and challenged disclosure.</div>`},

{l:"FORMULA",t:"Computing ECL",h:"The equation, with a <em>discount</em>",b:`<p>Twelve-month ECL is the loss expected from defaults occurring in the next year, weighted by the probability of those defaults.</p>
<div class="fx"><div class="cap">Twelve-month expected credit loss</div>
<div class="eq"><em>ECL</em><sub>12m</sub> = <em>PD</em><sub>12m</sub> &times; <em>LGD</em> &times; <em>EAD</em> &times; <em>DF</em></div>
<div class="wh">DF&nbsp;discount factor at the effective interest rate</div></div>
<p>Lifetime ECL is the same computation performed for every future period and summed, using the <strong>marginal</strong> probability of default in each period.</p>
<div class="fx"><div class="cap">Lifetime expected credit loss</div>
<div class="eq"><em>ECL</em><sub>LT</sub> = &Sigma;<sub>t=1</sub><sup>T</sup> <em>PD</em><sub>t</sub><sup>marg</sup> &times; <em>LGD</em><sub>t</sub> &times; <em>EAD</em><sub>t</sub> &times; <sup>1</sup>&frasl;<sub>(1 + <em>EIR</em>)<sup>t</sup></sub></div>
<div class="wh">PD<sub>t</sub><sup>marg</sup>&nbsp;probability of defaulting in period t having survived to t&minus;1<br>
EAD<sub>t</sub>&nbsp;expected exposure in period t, reflecting amortisation<br>
EIR&nbsp;effective interest rate at initial recognition<br>
T&nbsp;&nbsp;remaining contractual life, or behavioural life for revolving facilities</div></div>
<div class="note">Three inputs must vary by period and are frequently held constant in a first implementation: the marginal PD, the amortising EAD, and the discount. Holding any of them flat produces a wrong lifetime number, usually overstated on amortising products and understated on revolving ones.</div>`},

{l:"WORKED",t:"Stage 1 against stage 2",h:"The same loan, both <em>ways</em>",b:`<p>A four-year amortising loan. Outstanding &#8377;10,00,000. Effective interest rate 11%. LGD 40%. Annual marginal PD of 1.5% in year one, rising to 2.0%, 2.2% and 2.0% across the remaining life as the amortising balance and the seasoning profile interact.</p>
<div class="dt"><table>
<tr><th>Year</th><th>Marginal PD</th><th>EAD</th><th>Discount</th><th class="n">ECL</th></tr>
<tr><td>1</td><td>1.50%</td><td>&#8377;10,00,000</td><td>0.901</td><td class="n">&#8377;5,405</td></tr>
<tr><td>2</td><td>2.00%</td><td>&#8377;7,80,000</td><td>0.812</td><td class="n">&#8377;5,065</td></tr>
<tr><td>3</td><td>2.20%</td><td>&#8377;5,30,000</td><td>0.731</td><td class="n">&#8377;3,410</td></tr>
<tr><td>4</td><td>2.00%</td><td>&#8377;2,70,000</td><td>0.659</td><td class="n">&#8377;1,423</td></tr>
</table></div>
<div class="wk"><div class="h">The two provisions</div>
<div class="r"><b>Stage 1 &mdash; year 1 only</b><span>&#8377;5,405</span></div>
<div class="r"><b>As a share of exposure</b><span>0.54%</span></div>
<div class="r tot"><b>Stage 2 &mdash; sum of all four years</b><span>&#8377;15,303</span></div>
<div class="r tot"><b>As a share of exposure</b><span>1.53%</span></div>
</div>
<p>Nothing about the borrower changed between the two columns. One reclassification <strong>multiplied the provision by 2.8 times</strong>. On a long-dated mortgage with fifteen years remaining, the same reclassification can multiply it by considerably more.</p>
<div class="note">This is the whole reason staging thresholds attract the scrutiny they do, and the reason a small movement in a threshold parameter can move a bank's reported profit materially.</div>`},

{l:"DEFINE",t:"SICR",h:"The most argued-over test in <em>lending</em>",b:`<p><span class="k">SICR</span> &mdash; significant increase in credit risk &mdash; is the trigger from stage 1 to stage 2. It is deliberately not defined numerically in the standard. Each institution sets its criteria and defends them.</p>
<p>Three layers are used together:</p>
<div class="three">
<div><b>Quantitative</b>Lifetime PD has risen beyond a relative or absolute threshold since initial recognition</div>
<div><b>Qualitative</b>Watch list, restructuring granted, covenant breach, sector action, internal grade migration</div>
<div><b>Backstop</b>30 days past due &mdash; a rebuttable presumption</div>
</div>
<p>Two data consequences follow, and both are genuinely hard:</p>
<ul>
<li>The <strong>PD at initial recognition must be retained for the life of the exposure</strong>, to compare against. Systems designed to hold a current rating do not hold a dated origination rating.</li>
<li>The comparison must be applied <strong>consistently across portfolios and systems</strong> that were never built to share a rating scale.</li>
</ul>
<div class="note">Origination PD retention is the archetypal example of a data requirement that cannot be retrofitted. If the value was not stored at the time, it cannot be recovered later, and the threshold cannot be applied to the back book at all.</div>`},

{l:"MECHANISM",t:"Forward-looking scenarios",h:"A weighted average of <em>futures</em>",b:`<p>Expected credit loss must incorporate reasonable and supportable forward-looking information. In practice this means running the computation under multiple macroeconomic scenarios and probability-weighting the results.</p>
<div class="wk"><div class="h">Probability-weighted ECL</div>
<div class="r"><b>Baseline &mdash; weight 60%, ECL &#8377;1,000 cr</b><span>&#8377;600 cr</span></div>
<div class="r"><b>Upside &mdash; weight 15%, ECL &#8377;700 cr</b><span>&#8377;105 cr</span></div>
<div class="r"><b>Downside &mdash; weight 25%, ECL &#8377;1,900 cr</b><span>&#8377;475 cr</span></div>
<div class="r tot"><b>Reported ECL</b><span>&#8377;1,180 cr</span></div>
</div>
<p>The reported figure is <strong>higher than the baseline</strong> and corresponds to no single scenario. That is the intended behaviour: the relationship between the economy and credit loss is convex, so a symmetric set of scenarios produces an asymmetric expected value.</p>
<div class="note">A single scenario would systematically understate ECL for exactly this reason. If a model produces a probability-weighted result equal to its baseline, either the scenarios are too mild or the loss relationship has been linearised somewhere it should not have been.</div>`},

{l:"DEFINE",t:"Prudential floors",h:"A regulatory <em>minimum</em> under the model",b:`<p>An accounting framework that permits each bank to model its own losses creates a comparability problem and an incentive problem. The Indian implementation addresses both by placing <span class="k">prudential floors</span> underneath the modelled output.</p>
<p>The mechanism is simple: whatever the model computes, the provision carried cannot fall below a prescribed minimum percentage for that stage and asset category.</p>
<div class="fx"><div class="cap">The floor</div>
<div class="eq"><em>Provision</em> = max ( <em>ECL</em><sub>modelled</sub> , <em>Floor</em><sub>stage, category</sub> &times; <em>Exposure</em> )</div>
<div class="wh">Applied by stage and by asset category, with retail floors set at modest levels reflecting the depth of available retail data</div></div>
<p>Alongside the floors sits a <strong>glide path</strong> running to 31 March 2031, allowing the one-time increase in provisions on the existing book to be absorbed over several years rather than in a single reporting period.</p>
<div class="note">The floor is where the accounting framework and the prudential framework meet. It concedes that a model-based provision is the better measure while refusing to let modelling optimism reduce provisions below a level the regulator will accept.</div>`},

{l:"LIVE",t:"The Indian position",h:"Final directions, and the <em>date</em>",b:`<div class="stamp">Collected 17 August 2026</div>
<div class="dt"><table>
<tr><th>Date</th><th>Event</th></tr>
<tr><td>Jan 2023</td><td>Discussion paper on adopting expected credit loss for credit impairment</td></tr>
<tr><td>1 Oct 2025</td><td>Announcement that the framework would apply from 1 April 2027, with prudential floors and a glide path</td></tr>
<tr><td>7 Oct 2025</td><td>Draft directions issued for public consultation</td></tr>
<tr class="hi"><td>27 Apr 2026</td><td>Final directions issued, with a statement of feedback received. Clarifications included the application of prudential floors, treatment of purchased or originated credit-impaired assets, and determination of the effective interest rate</td></tr>
<tr><td>1 Apr 2027</td><td>Effective, for commercial banks excluding small finance banks, payments banks and local area banks</td></tr>
<tr><td>31 Mar 2031</td><td>End of the glide path</td></tr>
</table></div>
<p>Two points of scope worth carrying. The existing <strong>NPA classification norms, including the 90-day rule, are retained</strong> &mdash; classification and provisioning are decoupled rather than merged. And the framework covers loans, irrevocable loan commitments, and investments in the held-to-maturity and available-for-sale categories.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.rbi.org.in/scripts/BS_ViewMasterDirections.aspx" target="_blank" rel="noopener">Reserve Bank of India &mdash; Master Directions index</a></div>`},

{l:"TRAP",t:"Regulatory EL is not accounting ECL",h:"Same words, different <em>rules</em>",b:`<p>Both are called expected loss. They will never reconcile, and understanding exactly why is one of the sharpest distinctions available in this field.</p>
<div class="dt"><table>
<tr><th>Dimension</th><th>Basel EL</th><th>Accounting ECL</th></tr>
<tr><td>Horizon</td><td>12 months always</td><td>12 months in stage 1, lifetime in 2 and 3</td></tr>
<tr><td>PD basis</td><td>Through-the-cycle</td><td>Point-in-time, forward-looking</td></tr>
<tr><td>LGD basis</td><td>Downturn</td><td>Unbiased best estimate</td></tr>
<tr><td>Discounting</td><td>None</td><td>At the effective interest rate</td></tr>
<tr><td>Scenarios</td><td>Single</td><td>Probability-weighted, multiple</td></tr>
<tr><td>Purpose</td><td>Capital adequacy</td><td>Faithful presentation of the accounts</td></tr>
</table></div>
<p>The two meet in exactly one place. Where regulatory expected loss exceeds accounting provisions, the shortfall is deducted from CET1. Where provisions exceed it, a limited excess may be recognised in Tier 2. That mechanism is the only bridge between the frameworks.</p>`},

{l:"RECALL",t:"Mission 10",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Three stages</b><span>12-month in stage 1, lifetime in stages 2 and 3. The 1&rarr;2 migration is where provisions jump</span></div>
<div class="r"><b>ECL<sub>LT</sub> = &Sigma; PD<sup>marg</sup> &times; LGD &times; EAD &times; 1/(1+EIR)<sup>t</sup></b><span>Marginal PD, amortising EAD, discounted. All three must vary by period</span></div>
<div class="r"><b>SICR</b><span>Quantitative threshold, qualitative indicators, 30-DPD backstop. Requires origination PD retained for life</span></div>
<div class="r"><b>Probability-weighted scenarios</b><span>Result exceeds baseline because the loss relationship is convex</span></div>
<div class="r"><b>Prudential floor</b><span>Provision = max(modelled ECL, floor &times; exposure), with a glide path to March 2031</span></div>
<div class="r"><b>Classification is retained</b><span>90-day NPA rule unchanged. Only the provisioning basis moves</span></div>
<div class="r"><b>Basel EL &ne; accounting ECL</b><span>Six differences. They meet only through the CET1 shortfall deduction</span></div>
</div>`}
]},
/* ============ 11 ============ */
{n:"11",title:"Liquidity and funding",stage:"Balance sheet",
line:"Why a solvent bank still fails, the two ratios built to prevent it, and the Indian statement that predates both.",
bullets:["Solvency and liquidity are different deaths","LCR, computed in full","HQLA levels, haircuts and caps","Run-off rates and the inflow cap","NSFR, the structural test","The structural liquidity statement","Live: the run-off change for digital deposits"],
cards:[

{l:"WHY",t:"Solvent and dead",h:"Two entirely different <em>failures</em>",b:`<p>A bank fails in one of two ways, and conflating them is the most common error in this subject.</p>
<div class="two">
<div><b>Insolvency</b>Assets are worth less than liabilities. The equity is gone. A <strong>capital</strong> problem, addressed by Missions 07 to 09</div>
<div><b>Illiquidity</b>Assets exceed liabilities, but the cash is not available on the day the obligation falls due. A <strong>liquidity</strong> problem</div>
</div>
<p>The second is far faster. Capital erodes over quarters and is visible in published accounts. Liquidity evaporates over days &mdash; and, in the bank failures of March 2023, over hours, because deposits now move at the speed of a mobile application rather than at the speed of a branch queue.</p>
<p>That speed is why liquidity is governed by ratios, buffers and high-frequency returns rather than by an annual capital cycle, and why it carries no capital charge at all.</p>`},

{l:"FORMULA",t:"LCR",h:"Thirty days of <em>stress</em>",b:`<p>The <span class="k">liquidity coverage ratio</span> asks one question: under a severe 30-day stress, does the bank hold enough assets it could definitely convert to cash to cover the net outflow?</p>
<div class="fx"><div class="cap">Liquidity coverage ratio</div>
<div class="eq"><em>LCR</em> = <sup>Stock of HQLA</sup> &frasl; <sub>Total net cash outflows over 30 days</sub> &ge; 100%</div>
<div class="wh">Net outflows = stressed outflows &minus; capped inflows</div></div>
<div class="fx"><div class="cap">The denominator, expanded</div>
<div class="eq">Net outflows = &Sigma;(<em>L</em><sub>i</sub> &times; <em>r</em><sub>i</sub>) &minus; min [ &Sigma;(<em>A</em><sub>j</sub> &times; <em>i</em><sub>j</sub>) , 0.75 &times; &Sigma;(<em>L</em><sub>i</sub> &times; <em>r</em><sub>i</sub>) ]</div>
<div class="wh">L<sub>i</sub>&nbsp;liability or commitment category i<br>
r<sub>i</sub>&nbsp;prescribed run-off rate for that category<br>
A<sub>j</sub>&nbsp;contractual inflow j<br>
i<sub>j</sub>&nbsp;prescribed inflow rate<br>
The 0.75 term is the inflow cap</div></div>
<p>The stress is <strong>prescribed, not chosen</strong>. Run-off rates are set in the rules by counterparty type and deposit characteristic. And inflows are capped at 75% of outflows, so no bank can claim it needs no buffer because money is due in &mdash; a rule that exists because in a real stress, counterparties do not pay on time either.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/basel_framework/chapter/LCR/20.htm" target="_blank" rel="noopener">Basel Framework LCR20 &mdash; calculation of the liquidity coverage ratio</a>
<a href="https://www.bis.org/basel_framework/chapter/LCR/40.htm" target="_blank" rel="noopener">Basel Framework LCR40 &mdash; cash inflows and outflows, with the run-off rates</a></div>`},

{l:"DEFINE",t:"HQLA",h:"What actually counts as <em>liquid</em>",b:`<p>An asset qualifies as <span class="k">HQLA</span> only if it can be converted to cash quickly, at little or no loss of value, in a stress &mdash; when everyone is selling simultaneously.</p>
<div class="dt"><table>
<tr><th>Level</th><th>Contents</th><th class="n">Haircut</th></tr>
<tr><td>Level 1</td><td>Cash, central bank reserves, central and state government securities</td><td class="n">nil or minimal</td></tr>
<tr><td>Level 2A</td><td>Certain sovereign and public sector claims, high-grade corporate bonds</td><td class="n">15%</td></tr>
<tr><td>Level 2B</td><td>Lower-grade corporates, qualifying equities</td><td class="n">25&ndash;50%</td></tr>
</table></div>
<p>Level 2 combined is capped at 40% of the total buffer and Level 2B at 15%. Two operational conditions matter as much as eligibility, and both are data fields:</p>
<ul>
<li><strong>Unencumbered.</strong> Not pledged against a repo, a margin call or any other obligation. A pledged security is not available.</li>
<li><strong>Under the control of the liquidity management function</strong>, and monetisable in practice &mdash; not merely eligible on paper.</li>
</ul>
<div class="note">The Indian complication: government securities serve simultaneously as the statutory liquidity requirement, the core of the liquidity buffer, and collateral for central bank funding. The same security can be counted, encumbered or monetised depending on the lens, and reconciling those three views is a real and recurring exercise.</div>`},

{l:"WORKED",t:"An LCR computation",h:"Both halves, in <em>full</em>",b:`<p>A simplified balance sheet, all figures in crore.</p>
<div class="dt"><table>
<tr><th>Outflow category</th><th>Balance</th><th>Rate</th><th class="n">Outflow</th></tr>
<tr><td>Stable retail deposits</td><td>8,000</td><td>5%</td><td class="n">400</td></tr>
<tr><td>Less stable retail deposits</td><td>4,000</td><td>10%</td><td class="n">400</td></tr>
<tr><td>Operational wholesale deposits</td><td>3,000</td><td>25%</td><td class="n">750</td></tr>
<tr><td>Non-operational wholesale</td><td>2,000</td><td>40%</td><td class="n">800</td></tr>
<tr><td>Undrawn committed facilities</td><td>5,000</td><td>10%</td><td class="n">500</td></tr>
</table></div>
<div class="wk"><div class="h">The ratio</div>
<div class="r"><b>Gross stressed outflows</b><span>2,850</span></div>
<div class="r"><b>Contractual inflows due within 30 days</b><span>1,600</span></div>
<div class="r"><b>Inflow cap: 75% &times; 2,850</b><span>2,137</span></div>
<div class="r"><b>Inflows recognised (lower of the two)</b><span>1,600</span></div>
<div class="r tot"><b>Net cash outflows</b><span>1,250</span></div>
<div class="r"><b>Level 1 HQLA, no haircut</b><span>1,200</span></div>
<div class="r"><b>Level 2A: 400 &times; 0.85</b><span>340</span></div>
<div class="r"><b>Level 2 cap check: 340 vs 40% of total</b><span>within cap</span></div>
<div class="r tot"><b>Total HQLA</b><span>1,540</span></div>
<div class="r tot"><b>LCR = 1,540 / 1,250</b><span>123%</span></div>
</div>
<p>Now encumber &#8377;300 crore of the Level 1 securities against a repo. HQLA falls to 1,240 and the LCR falls to <strong>99%</strong> &mdash; a breach, caused by no change whatsoever in the bank's assets or deposits. Only an encumbrance flag moved.</p>
<div class="note">This is why encumbrance is treated as a critical data element rather than an operational detail, and why the reconciliation between the collateral system and the liquidity return is one of the most closely watched in a bank.</div>`},

{l:"FORMULA",t:"NSFR",h:"The <em>structural</em> test",b:`<p>The LCR is a thirty-day survival test. A bank could pass it while funding twenty-year assets entirely with three-month wholesale borrowing &mdash; sustainable until the day it is not.</p>
<div class="fx"><div class="cap">Net stable funding ratio</div>
<div class="eq"><em>NSFR</em> = <sup>Available stable funding</sup> &frasl; <sub>Required stable funding</sub> &ge; 100%</div>
<div class="wh">ASF = &Sigma; liabilities and capital &times; ASF factor<br>
RSF = &Sigma; assets and off-balance-sheet items &times; RSF factor<br>
Both factors run 0% to 100%, over a one-year horizon</div></div>
<div class="two">
<div><b>ASF factors &mdash; how likely funding stays</b>Capital and long-term debt 100%. Stable retail deposits high. Short-dated wholesale from financial institutions near zero</div>
<div><b>RSF factors &mdash; how much stable funding an asset needs</b>Cash and Level 1 HQLA near zero. Performing long-dated loans high. Encumbered and illiquid assets highest</div>
</div>
<p>The two ratios are complements. LCR is a <strong>stock</strong> test over thirty days; NSFR is a <strong>structural</strong> test over a year. Passing one says nothing about the other.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/basel_framework/chapter/NSF/20.htm" target="_blank" rel="noopener">Basel Framework NSF20 &mdash; calculation of the net stable funding ratio</a></div>`},

{l:"MECHANISM",t:"The structural liquidity statement",h:"India's own maturity <em>ladder</em>",b:`<p>Predating the Basel ratios and still in force alongside them, the Indian framework requires assets and liabilities to be slotted into time buckets and the resulting mismatch monitored against tolerance limits.</p>
<div class="dt"><table>
<tr><th>Bucket</th><th>Outflow</th><th>Inflow</th><th class="n">Gap</th></tr>
<tr><td>Day 1</td><td>420</td><td>380</td><td class="n">&minus;40</td></tr>
<tr><td>2&ndash;7 days</td><td>860</td><td>910</td><td class="n">+50</td></tr>
<tr><td>8&ndash;14 days</td><td>640</td><td>600</td><td class="n">&minus;40</td></tr>
<tr><td>15&ndash;30 days</td><td>1,150</td><td>980</td><td class="n">&minus;170</td></tr>
<tr><td>31 days to 3 months</td><td>2,400</td><td>2,150</td><td class="n">&minus;250</td></tr>
</table></div>
<p>The negative gap in the near buckets is normal and expected &mdash; it is the maturity transformation the bank exists to perform. What is monitored is whether the <strong>cumulative</strong> gap as a percentage of cumulative outflows stays within prescribed tolerances in the shortest buckets.</p>
<div class="note">Slotting is where the real judgement sits. A savings deposit is contractually payable on demand and behaviourally stable for years. Whether it is slotted in day 1 or spread across the ladder on a behavioural basis changes the entire statement, which is why the behavioural study behind the slotting is a governed, periodically revalidated document.</div>`},

{l:"LIVE",t:"Digital deposits",h:"The run-off rate that <em>moved</em>",b:`<div class="stamp">Collected 17 August 2026</div>
<p>Deposits accessible through internet and mobile banking can leave faster than deposits that require a branch visit. The Indian framework has been recalibrated to reflect this.</p>
<div class="dt"><table>
<tr><th>Change</th><th>Detail</th></tr>
<tr class="hi"><td>Additional run-off</td><td>An extra <strong>2.5%</strong> run-off factor on retail and small business deposits enabled with internet and mobile banking. Stable such deposits move to 7.5% and less stable to 12.5%</td></tr>
<tr><td>HQLA valuation</td><td>Government securities counted as Level 1 must reflect haircuts aligned to the margin requirements applicable under the central bank's liquidity facilities</td></tr>
<tr><td>Other legal entities</td><td>Funding from non-financial entities such as trusts, partnerships and limited liability partnerships attracts a lower run-off rate than previously</td></tr>
<tr><td>Effective</td><td><strong>1 April 2026</strong>, for commercial banks excluding payments banks, regional rural banks and local area banks</td></tr>
</table></div>
<p>The original draft had proposed 5%. Industry feedback that the impact would compress lending capacity led to the calibration at 2.5%, with an estimated aggregate improvement of roughly 6 percentage points in system LCR relative to the draft.</p>
<div class="note">The data consequence is specific and awkward: every retail and small business account must now be <strong>tagged for internet and mobile banking access</strong>, and that flag must flow into the liquidity computation. It is a field most core systems hold for operational purposes and never previously exposed to regulatory reporting.</div>`},

{l:"RECALL",t:"Mission 11",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Insolvency vs illiquidity</b><span>Capital problem vs cash-timing problem. The second is far faster</span></div>
<div class="r"><b>LCR = HQLA / net 30-day outflows &ge; 100%</b><span>Prescribed run-off rates; inflows capped at 75% of outflows</span></div>
<div class="r"><b>HQLA levels 1, 2A, 2B</b><span>Haircuts and caps, plus unencumbered and monetisable in practice</span></div>
<div class="r"><b>Encumbrance breaks buffers</b><span>One flag can move the ratio across the minimum with no economic change</span></div>
<div class="r"><b>NSFR = ASF / RSF &ge; 100%</b><span>Structural, one-year. Complements rather than replaces the LCR</span></div>
<div class="r"><b>Structural liquidity statement</b><span>Time-bucket slotting with cumulative gap tolerances. Behavioural slotting is the judgement</span></div>
<div class="r"><b>+2.5% run-off on digitally enabled retail deposits</b><span>Effective 1 April 2026. Requires an account-level access flag</span></div>
</div>`}
]},

/* ============ 12 ============ */
{n:"12",title:"Interest rate risk and ALM",stage:"Balance sheet",
line:"What happens to a bank when rates move, the two lenses used to measure it, and the committee that decides what to do about it.",
bullets:["Why rate risk is structural, not optional","The repricing gap","Duration, and the value effect","Earnings against economic value","The prescribed shock scenarios","Optionality written free to the customer","What ALCO decides"],
cards:[

{l:"ORIENT",t:"The structural risk",h:"Assets and liabilities do not move <em>together</em>",b:`<p>A bank's assets and liabilities reprice on different dates. When market rates move, one side adjusts before the other, and the bank gains or loses. This is <span class="k">IRRBB</span> &mdash; interest rate risk in the banking book.</p>
<p>It carries <strong>no minimum capital charge</strong>. It is assessed under Pillar 2 through prescribed shocks and an outlier threshold.</p>
<div class="note">The 2023 bank failures made the mechanism concrete: long-dated fixed-rate securities funded by deposits that repriced immediately. Rates rose, the securities lost value, and the deposits left. Interest rate risk and liquidity risk detonated together, which is how they usually arrive.</div>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/basel_framework/chapter/SRP/31.htm" target="_blank" rel="noopener">Basel Framework SRP31 &mdash; interest rate risk in the banking book</a></div>`},

{l:"FORMULA",t:"The repricing gap",h:"One table, the whole <em>idea</em>",b:`<p>Sort every asset and liability into buckets by when its rate next resets, then net them within each bucket.</p>
<div class="fx"><div class="cap">Gap and its earnings effect</div>
<div class="eq"><em>Gap</em><sub>t</sub> = <em>RSA</em><sub>t</sub> &minus; <em>RSL</em><sub>t</sub></div>
<div class="eq">&Delta;<em>NII</em> &asymp; <em>Gap</em><sub>t</sub> &times; &Delta;<em>r</em> &times; <sup><em>d</em><sub>t</sub></sup>&frasl;<sub>365</sub></div>
<div class="wh">RSA&nbsp;rate-sensitive assets repricing in bucket t<br>
RSL&nbsp;rate-sensitive liabilities repricing in bucket t<br>
&Delta;r&nbsp;&nbsp;change in rates<br>
d<sub>t</sub>&nbsp;days remaining in the year after the bucket</div></div>
<div class="dt"><table>
<tr><th>Bucket</th><th>RSA</th><th>RSL</th><th class="n">Gap</th></tr>
<tr><td>0&ndash;3 months</td><td>2,000</td><td>6,000</td><td class="n">&minus;4,000</td></tr>
<tr><td>3&ndash;12 months</td><td>1,500</td><td>2,000</td><td class="n">&minus;500</td></tr>
<tr><td>1&ndash;5 years</td><td>4,000</td><td>1,000</td><td class="n">+3,000</td></tr>
<tr><td>Over 5 years</td><td>2,500</td><td>1,000</td><td class="n">+1,500</td></tr>
</table></div>
<p>A negative short gap means liabilities reprice faster than assets. If rates rise, funding cost rises immediately while asset income lags, and margin compresses. The bank above is <strong>liability sensitive in the near term and asset sensitive further out</strong> &mdash; the classic shape of a lender funding long assets with short deposits.</p>`},

{l:"FORMULA",t:"Duration",h:"The value effect, in one <em>number</em>",b:`<p>Gap analysis handles earnings. It says nothing about value, because it treats a cash flow in year one and year twenty identically once both sit in the same bucket. <span class="k">Duration</span> fixes that.</p>
<div class="fx"><div class="cap">Macaulay and modified duration</div>
<div class="eq"><em>D</em><sub>Mac</sub> = <sup>&Sigma; <em>t</em> &times; <em>PV</em>(<em>CF</em><sub>t</sub>)</sup> &frasl; <sub>&Sigma; <em>PV</em>(<em>CF</em><sub>t</sub>)</sub></div>
<div class="eq"><em>D</em><sub>Mod</sub> = <sup><em>D</em><sub>Mac</sub></sup> &frasl; <sub>(1 + <em>y</em>)</sub></div>
<div class="eq">&Delta;<em>P</em> &frasl; <em>P</em> &asymp; &minus; <em>D</em><sub>Mod</sub> &times; &Delta;<em>y</em></div>
<div class="wh">CF<sub>t</sub>&nbsp;cash flow in period t<br>
y&nbsp;&nbsp;yield<br>
The last line: a bond with modified duration 6 loses roughly 6% of value for a 1% rise in yield</div></div>
<div class="fx"><div class="cap">Duration gap of the whole balance sheet</div>
<div class="eq"><em>DGAP</em> = <em>D</em><sub>A</sub> &minus; <em>D</em><sub>L</sub> &times; <sup><em>L</em></sup>&frasl;<sub><em>A</em></sub></div>
<div class="wh">D<sub>A</sub>, D<sub>L</sub>&nbsp;weighted average duration of assets and liabilities<br>
L/A&nbsp;&nbsp;liabilities as a share of assets<br>
A positive DGAP means equity value falls when rates rise</div></div>`},

{l:"DEFINE",t:"EVE and NII",h:"Two lenses, two <em>answers</em>",b:`<div class="two">
<div><b>EVE &mdash; economic value of equity</b>Discount all banking book cash flows, assets minus liabilities. A rate shock changes the present value. <strong>Long horizon, value based.</strong> Captures the full life of every position</div>
<div><b>NII &mdash; net interest income</b>Project interest earned minus paid over the next one to three years under a shock. <strong>Short horizon, earnings based.</strong> Captures what reaches the profit and loss account soon</div>
</div>
<div class="fx"><div class="cap">The two measures</div>
<div class="eq">&Delta;<em>EVE</em> = <em>EVE</em><sub>shocked</sub> &minus; <em>EVE</em><sub>base</sub></div>
