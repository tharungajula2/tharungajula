<div class="eq">&Delta;<em>NII</em> = <em>NII</em><sub>shocked</sub> &minus; <em>NII</em><sub>base</sub></div>
<div class="wh">&Delta;EVE is usually assessed against Tier 1 capital<br>
&Delta;NII against projected earnings</div></div>
<p>A position can look benign on one and alarming on the other. Long fixed-rate assets funded short show modest first-year NII sensitivity and severe EVE sensitivity, because most of the damage sits in years the NII window never reaches.</p>
<div class="note">Both are required precisely so that a bank cannot present the flattering measure alone. When someone reports only one, the first question is what the other one says.</div>`},

{l:"MECHANISM",t:"The prescribed shocks",h:"Six scenarios, set by the <em>rulebook</em>",b:`<p>Shocks are prescribed rather than chosen, so that outputs are comparable across banks.</p>
<div class="three">
<div><b>Parallel up</b>Whole curve rises</div>
<div><b>Parallel down</b>Whole curve falls</div>
<div><b>Steepener</b>Short falls, long rises</div>
<div><b>Flattener</b>Short rises, long falls</div>
<div><b>Short up</b>Front end only</div>
<div><b>Short down</b>Front end only</div>
</div>
<p>Non-parallel scenarios exist because most real balance sheets are not exposed to the level of rates so much as to the <strong>shape</strong> of the curve. A bank funding at the short end and lending at the long end is hurt by a flattener even when the average level of rates is unchanged.</p>
<p>A <span class="k">supervisory outlier test</span> then applies a threshold: where the decline in economic value of equity under the worst scenario exceeds a set share of capital, the supervisor engages. A parallel test exists for a large projected decline in net interest income.</p>
<div class="note">Sitting alongside IRRBB is <span class="k">CSRBB</span> &mdash; credit spread risk in the banking book &mdash; the risk that market spreads on banking book instruments move without any change in credit quality. It has become a distinct supervisory expectation rather than a footnote to IRRBB.</div>`},

{l:"TRAP",t:"Optionality",h:"Free to the customer, expensive to the <em>bank</em>",b:`<p>Gap and duration both assume cash flows arrive as scheduled. Customers hold options, and they exercise them at the worst possible moment for the bank &mdash; not out of malice, but because the same rate move that makes exercise attractive is the one that hurts.</p>
<div class="sheet q"><div class="h">The four options</div>
<div class="r"><b>Prepayment</b><span>Rates fall, borrowers refinance, and the high-yielding asset disappears when reinvestment rates are poor</span></div>
<div class="r"><b>Premature withdrawal</b><span>Rates rise, depositors break term deposits to chase yield, so cheap funding vanishes when funding is dearest</span></div>
<div class="r"><b>Caps and floors</b><span>A floor stops a floating asset repricing downwards; a cap stops it repricing upwards</span></div>
<div class="r"><b>Pipeline</b><span>A sanctioned but undrawn fixed-rate offer is an option the customer holds against the bank</span></div>
</div>
<p>Each is modelled through a behavioural assumption with an owner, a review cycle and an audit trail. Each is also a data requirement, because the assumption must be evidenced from the bank's own history of exercise behaviour.</p>`},

{l:"DEFINE",t:"ALCO",h:"Where the balance sheet is actually <em>decided</em>",b:`<p>The asset and liability committee is the senior forum that owns the shape of the balance sheet, as distinct from any individual transaction. Typical membership spans finance, treasury, risk and the major business lines.</p>
<div class="dt"><table>
<tr><th>Domain</th><th>What ALCO decides</th></tr>
<tr><td>Interest rate risk</td><td>Reviews EVE and NII sensitivity against limits; approves hedging strategy</td></tr>
<tr><td>Liquidity</td><td>Reviews the ratios, buffer composition, funding plan and concentration of funding sources</td></tr>
<tr><td>Transfer pricing</td><td>Owns the framework, approves methodology changes and any exception</td></tr>
<tr><td>Behavioural assumptions</td><td>Approves deposit stability and prepayment models and their revalidation cycle</td></tr>
<tr><td>Balance sheet strategy</td><td>Deposit pricing, wholesale issuance, investment portfolio duration</td></tr>
</table></div>
<div class="note">Any change to a transfer pricing curve or a behavioural profile requires ALCO approval. That is a governance path with dates attached, not a courtesy, and it belongs in any plan that touches those assumptions.</div>`},

{l:"RECALL",t:"Mission 12",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>IRRBB has no Pillar 1 charge</b><span>Assessed under Pillar 2 through prescribed shocks and an outlier test</span></div>
<div class="r"><b>Gap = RSA &minus; RSL per bucket</b><span>Negative short gap means margin compresses when rates rise</span></div>
<div class="r"><b>&Delta;P/P &asymp; &minus;D<sub>Mod</sub> &times; &Delta;y</b><span>Duration converts a rate move into a value move</span></div>
<div class="r"><b>EVE is value over full life; NII is earnings over 1&ndash;3 years</b><span>Both required, because either alone can flatter</span></div>
<div class="r"><b>Six prescribed shocks</b><span>Level and shape. Non-parallel scenarios catch curve exposure that parallel ones miss</span></div>
<div class="r"><b>Optionality is written free</b><span>Prepayment, premature withdrawal, caps and floors, pipeline. Always exercised at the wrong moment</span></div>
<div class="r"><b>ALCO owns the framework</b><span>Rate risk, liquidity, transfer pricing and behavioural assumptions</span></div>
</div>`}
]},
/* ============ 13 ============ */
{n:"13",title:"Funds transfer pricing",stage:"Balance sheet",
line:"The internal price of money &mdash; how a bank splits its margin between the unit that raised the funding and the unit that lent it, and why the calibration is a risk control rather than an accounting exercise.",
bullets:["Why branch profitability is meaningless without it","Treasury as the internal counterparty","The three components of an FTP rate","Matched-maturity marginal cost","A full worked rate build","Behavioural maturity for non-maturing deposits","The contingent liquidity charge","The data an FTP computation requires"],
cards:[

{l:"WHY",t:"Two branches, one wrong answer",h:"Why the naive number is <em>useless</em>",b:`<p>Branch A gathers &#8377;100 crore of deposits and lends nothing. Branch B lends &#8377;100 crore and gathers nothing. Measured naively, A earns nothing and looks worthless; B earns the entire lending margin and looks like the star performer.</p>
<p>That answer is wrong. Branch A produced the funding that made Branch B possible.</p>
<p><span class="k">Funds transfer pricing</span> is the internal price at which money moves between business units and treasury. It splits the total margin between the unit that raised the money and the unit that deployed it.</p>
<div class="note">Everything that follows from this &mdash; product pricing, business unit performance, incentive compensation, capital allocation, and the decision to grow or shrink a product line &mdash; is only as sound as the transfer price underneath it.</div>`},

{l:"MECHANISM",t:"Treasury in the middle",h:"Nobody funds <em>themselves</em>",b:`<p>The mechanism is a single rule: no business unit funds itself, and no business unit lends its own deposits. Every unit transacts with treasury at a published internal rate.</p>
<div class="dg"><div class="dg-t">A five-year fixed loan at 9.50%, and a one-year deposit paying 6.00%</div>
<div class="flow">
<div class="n"><b>Lending unit</b>Receives 9.50% from the borrower, pays 7.60% to treasury for five-year money. Keeps <strong>1.90% credit spread</strong></div>
<div class="a">&#8593;&#8595;</div>
<div class="n"><b>Treasury</b>Receives 7.60% from lending, pays 6.90% to the deposit unit. Keeps <strong>0.70%</strong> for running the mismatch</div>
<div class="a">&#8593;&#8595;</div>
<div class="n"><b>Deposit unit</b>Pays 6.00% to the customer, receives 6.90% from treasury. Keeps <strong>0.90% deposit margin</strong></div>
</div></div>
<p>The bank's total margin is 3.50%. Transfer pricing has split it into three components with three different owners: credit spread, deposit-raising spread, and the maturity mismatch treasury is paid to run.</p>
<div class="note">Note what else happened. The lending unit locked in 1.90% for five years and is now <strong>insulated from rate movements entirely</strong>. All interest rate risk has been transferred to treasury &mdash; which is exactly where the bank wants it managed, by the people with the instruments to hedge it.</div>`},

{l:"FORMULA",t:"The three components",h:"What a rate is made <em>of</em>",b:`<p>An FTP rate is a stack, not a single number. Naming the layers is the fastest way to demonstrate real understanding of the subject.</p>
<div class="fx"><div class="cap">Transfer price for an asset</div>
<div class="eq"><em>FTP</em> = <em>r</em><sub>base</sub>(<em>T</em>) + <em>TLP</em>(<em>T</em>) + <em>CLC</em> + <em>&epsilon;</em></div>
<div class="wh">r<sub>base</sub>(T)&nbsp;reference curve rate at the matched tenor T<br>
TLP(T)&nbsp;term liquidity premium &mdash; what the bank itself pays above reference for T-year funding<br>
CLC&nbsp;&nbsp;contingent liquidity charge for undrawn and optional exposure<br>
&epsilon;&nbsp;&nbsp;adjustments: buffer cost, currency basis, statutory reserve cost</div></div>
<div class="lay">
<div><span>1</span><strong>Base rate.</strong> A market reference rate for the matched tenor, from an overnight-indexed swap curve or a government securities curve.</div>
<div><span>2</span><strong>Term liquidity premium.</strong> The bank's own cost of raising term money above that reference. Reflects its credit standing and the scarcity of long funding.</div>
<div><span>3</span><strong>Contingent liquidity charge.</strong> Cost of liquidity the product may consume in stress though it consumes none today.</div>
</div>
<p>In the Indian setting a fourth layer is material: <strong>the cost of statutory reserves</strong>. Money raised as a deposit is partly immobilised in cash reserves earning nothing and in statutory securities earning a low yield, so the effective cost of a rupee of deposit exceeds the rate paid on it.</p>`},

{l:"MECHANISM",t:"Matched maturity",h:"The method that <em>won</em>",b:`<p>Two methods exist, and the difference between them explains a documented historical failure.</p>
<div class="two">
<div><b>Single pool</b>One average funding rate applied to everything regardless of tenor. Simple. It systematically under-charges long assets and over-charges short ones, quietly rewarding maturity mismatch</div>
<div><b>Matched-maturity marginal cost</b>Each transaction priced at what it would cost the bank to raise funding of that exact tenor and profile, at the margin, on the day the deal is struck. The standard</div>
</div>
<p><strong>Marginal</strong> and <strong>on the day</strong> both carry weight. Transfer pricing prices the next rupee, not the average of rupees already raised; and the rate is locked at origination and held for the life of the deal, so the unit's margin is fixed and measurable rather than restated every month.</p>
<div class="note">Single-pool transfer pricing made long, illiquid lending funded by short wholesale money appear highly profitable, because the true cost of term funding was never charged to it. Supervisors concluded after 2008 that internal pricing was a driver of the crisis rather than a bookkeeping detail, and internal pricing of liquidity cost has been a supervisory expectation since.</div>
<div class="docs"><b>Official sources</b>
<a href="https://www.bis.org/publ/bcbs144.htm" target="_blank" rel="noopener">BCBS &mdash; Principles for Sound Liquidity Risk Management and Supervision</a>
<a href="https://www.bis.org/basel_framework/chapter/SRP/50.htm" target="_blank" rel="noopener">Basel Framework SRP50 &mdash; liquidity monitoring metrics</a></div>`},

{l:"WORKED",t:"Building one rate",h:"From curve to <em>charge</em>",b:`<p>A seven-year fixed-rate term loan of &#8377;20 crore, fully drawn at origination, with no undrawn component. Curve levels on the pricing date are given.</p>
<div class="wk"><div class="h">Asset transfer rate build</div>
<div class="r"><b>Seven-year reference curve rate</b><span>6.85%</span></div>
<div class="r"><b>Term liquidity premium, seven year</b><span>+0.95%</span></div>
<div class="r"><b>Liquidity buffer cost allocation</b><span>+0.12%</span></div>
<div class="r"><b>Contingent liquidity charge (nil, fully drawn)</b><span>0.00%</span></div>
<div class="r tot"><b>FTP charge to the lending unit</b><span>7.92%</span></div>
</div>
<div class="wk"><div class="h">Margin decomposition</div>
<div class="r"><b>Customer rate</b><span>10.40%</span></div>
<div class="r"><b>Less FTP charge</b><span>&minus;7.92%</span></div>
<div class="r tot"><b>Lending unit net interest margin</b><span>2.48%</span></div>
<div class="r"><b>Less expected loss at PD 1.8% &times; LGD 45%</b><span>&minus;0.81%</span></div>
<div class="r"><b>Less operating cost allocation</b><span>&minus;0.60%</span></div>
<div class="r tot"><b>Risk-adjusted contribution</b><span>1.07%</span></div>
</div>
<p>This is the number a lending decision should actually be made on. The headline 10.40% customer rate says nothing useful; the 1.07% risk-adjusted contribution says whether the loan is worth writing.</p>
<div class="note">Change one input and watch it move. If the seven-year term liquidity premium widens from 0.95% to 1.60% &mdash; entirely plausible in a funding stress &mdash; the risk-adjusted contribution falls to 0.42% and the product may no longer clear its cost of capital. That is transfer pricing doing its job.</div>`},

{l:"MECHANISM",t:"Behavioural maturity",h:"The hardest assumption in <em>banking</em>",b:`<p>Matched-maturity pricing requires a maturity to match. For a term loan that is trivial. For a savings account it is not.</p>
<p>A savings deposit is contractually repayable on demand. In aggregate the balance has been stable for decades. Fund it overnight and most of its value is discarded; treat it as ten-year money and the bank has taken a large undeclared bet.</p>
<div class="lay">
<div><span>1</span><strong>Split the balance.</strong> Historical analysis separates a volatile portion from a stable core.</div>
<div><span>2</span><strong>Assign a replicating profile.</strong> The core is spread across tenors &mdash; a tranched portfolio of notional investments &mdash; producing a weighted average life.</div>
<div><span>3</span><strong>Price against that profile</strong> rather than against the contractual overnight date.</div>
</div>
<div class="wk"><div class="h">A replicating portfolio for savings deposits</div>
<div class="r"><b>Volatile portion, priced overnight</b><span>25%</span></div>
<div class="r"><b>Core, 1-year tranche</b><span>20%</span></div>
<div class="r"><b>Core, 3-year tranche</b><span>25%</span></div>
<div class="r"><b>Core, 5-year tranche</b><span>20%</span></div>
<div class="r"><b>Core, 7-year tranche</b><span>10%</span></div>
<div class="r tot"><b>Weighted average life</b><span>2.85 years</span></div>
</div>
<p>The same logic runs in reverse on the asset side: a housing loan contractually runs twenty years and behaviourally repays far sooner through prepayment and refinancing.</p>
<div class="note">Every behavioural assumption is a modelled input with an owner, a revalidation cycle and an evidence base. These assumptions have been tightened across the industry since 2023, because deposit stickiness in a world of instant digital transfer is no longer what a decade of history suggests.</div>`},

{l:"DEFINE",t:"Contingent liquidity charge",h:"Paying for risk not yet <em>taken</em>",b:`<p>A committed but undrawn facility of &#8377;50 crore costs nothing today. In a stress the client draws it, precisely when the bank can least afford the outflow. Under the liquidity ratio, that commitment already forces the bank to hold liquid assets against a share of it.</p>
<p>The contingent liquidity charge passes that cost back to the unit that sold the facility.</p>
<div class="fx"><div class="cap">Charge on an undrawn commitment</div>
<div class="eq"><em>CLC</em> = <em>Undrawn</em> &times; <em>r</em><sub>draw</sub> &times; <em>c</em><sub>buffer</sub></div>
<div class="wh">r<sub>draw</sub>&nbsp;assumed draw-down rate in stress, aligned to the liquidity ratio treatment<br>
c<sub>buffer</sub>&nbsp;cost of holding the liquid assets that draw-down requires</div></div>
<div class="three">
<div><b>Undrawn commitments</b>Charged on the undrawn amount at the stressed draw rate</div>
<div><b>Premature withdrawal</b>Deposits the customer can break early attract a charge for the optionality</div>
<div><b>Collateral and margin</b>Potential margin calls consume liquidity and are charged accordingly</div>
</div>
<div class="note">This is the clearest example of transfer pricing as a risk control. If undrawn facilities are internally free, relationship managers will hand them out freely. Charge them and the shape of the balance sheet changes within two quarters.</div>`},

{l:"CHEAT",t:"What an FTP engine needs",h:"The specification, in <em>full</em>",b:`<p>The complete data requirement for a transfer pricing computation, and the reconciliation it must satisfy.</p>
<div class="sheet"><div class="h">Required attributes</div>
<div class="r"><b>Contract identity</b><span>Deal ID, product code, booking unit, legal entity, business line for attribution</span></div>
<div class="r"><b>Balances</b><span>Drawn, undrawn commitment, currency, accounting basis, as-at date</span></div>
<div class="r"><b>Dates</b><span>Origination, contractual maturity, next repricing date, amortisation schedule</span></div>
<div class="r"><b>Rate attributes</b><span>Fixed or floating, customer rate, reference index, spread, reset frequency, caps and floors</span></div>
<div class="r"><b>Behavioural inputs</b><span>Core and non-core split, prepayment assumption, draw-down assumption, replicating profile reference and version</span></div>
<div class="r"><b>Curves</b><span>Reference curve by currency and date, term liquidity premium curve, contingent charge schedule &mdash; each versioned</span></div>
<div class="r"><b>Rate applied</b><span>The transfer rate assigned at origination, retained unchanged for the life of the deal</span></div>
<div class="r"><b>Allocation keys</b><span>Business line, cost centre, portfolio and reporting hierarchy the result attributes to</span></div>
</div>
<div class="fx"><div class="cap">The control that must hold</div>
<div class="eq">&Sigma; <em>Charges</em><sub>assets</sub> &minus; &Sigma; <em>Credits</em><sub>liabilities</sub> = <em>Treasury position</em></div>
<div class="wh">Across the whole bank, transfer prices must net exactly to treasury's own result. Any residual means the allocation is creating or destroying money</div></div>`},

{l:"TRAP",t:"Where FTP fails",h:"Five predictable <em>collapses</em>",b:`<div class="sheet q"><div class="h">Failure modes</div>
<div class="r"><b>Curve version not stored</b><span>A rate cannot be reproduced months later, so a disputed margin cannot be settled by anyone</span></div>
<div class="r"><b>Rate not frozen</b><span>A later run reprices historic deals and reported unit profitability silently restates</span></div>
<div class="r"><b>Assumptions undocumented</b><span>A core deposit split living in a spreadsheet with no owner, no approval and no review date</span></div>
<div class="r"><b>Off-balance-sheet excluded</b><span>Undrawn commitments uncharged, so the framework understates liquidity consumption exactly where it matters</span></div>
<div class="r"><b>Charges do not net</b><span>The sum across units fails to reconcile to treasury, which means the allocation is wrong somewhere</span></div>
</div>
<p>Each of these is a testable control rather than an opinion. Written as acceptance criteria at the specification stage, they cost nothing; discovered after implementation, each one is a rebuild.</p>`},

{l:"RECALL",t:"Mission 13",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>FTP is the internal price of money</b><span>Splits margin between funder and lender, and moves rate risk to treasury</span></div>
<div class="r"><b>FTP = r<sub>base</sub>(T) + TLP(T) + CLC + &epsilon;</b><span>Base curve, term liquidity premium, contingent charge, plus buffer and reserve cost</span></div>
<div class="r"><b>Matched-maturity marginal cost</b><span>The next rupee, at that exact tenor, on that day. Single pool subsidised mismatch</span></div>
<div class="r"><b>Rate is struck at origination and frozen</b><span>Otherwise historic profitability restates every run</span></div>
<div class="r"><b>Behavioural maturity</b><span>Core and volatile split, replicating profile, weighted average life. The most contested assumption in the bank</span></div>
<div class="r"><b>Contingent liquidity charge</b><span>Prices undrawn commitments and optionality. Changes balance sheet shape when applied</span></div>
<div class="r"><b>Charges must net to treasury</b><span>Any residual means money is being created or destroyed by the allocation</span></div>
</div>`}
]},

/* ============ 14 ============ */
{n:"14",title:"The data underneath",stage:"Data",
line:"Every number in this pack is produced by a pipeline. The principles governing that pipeline, the quality dimensions that classify its failures, and the reconciliations that are the only accepted proof.",
bullets:["The finding that produced the rulebook","The principles, grouped","Critical data elements and the golden source","Lineage, and the attribute-level standard","The six quality dimensions","Reconciliation as evidence","Live: where the industry actually stands"],
cards:[

{l:"WHY",t:"Nobody could add it up",h:"The question that broke in <em>2008</em>",b:`<p>In 2008 supervisors asked large banks a simple question: what is your total exposure to this failing counterparty, across the entire group, right now. Several could not answer for days.</p>
<p>Not because the data did not exist. Because it sat in dozens of systems with different identifiers, different definitions and no automated path to a group total.</p>
<p><span class="k">BCBS 239</span> &mdash; Principles for effective risk data aggregation and risk reporting &mdash; is the response. Published January 2013, with compliance expected from globally systemically important banks by January 2016.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.bis.org/publ/bcbs239.htm" target="_blank" rel="noopener">BCBS 239 &mdash; Principles for effective risk data aggregation and risk reporting</a>
<a href="https://www.bis.org/basel_framework/chapter/SRP/36.htm" target="_blank" rel="noopener">Basel Framework SRP36 &mdash; risk data aggregation and risk reporting</a></div>`},

{l:"MECHANISM",t:"The principles",h:"Fourteen, in four <em>blocks</em>",b:`<p>Fourteen principles: eleven for banks, three for supervisors. The numbering is not worth memorising. The grouping is.</p>
<div class="dt"><table>
<tr><th>Block</th><th>What it requires</th></tr>
<tr><td>Governance and infrastructure<br>P1&ndash;P2</td><td>Board-level ownership of risk data. Architecture and IT capable of aggregation in normal conditions and in crisis</td></tr>
<tr><td>Aggregation capability<br>P3&ndash;P6</td><td>Accuracy and integrity. Completeness across material risks and entities. Timeliness. Adaptability to new and ad hoc requests</td></tr>
<tr><td>Reporting practices<br>P7&ndash;P11</td><td>Accuracy of reports. Comprehensiveness. Clarity. Frequency matched to the risk. Distribution to the right recipients</td></tr>
<tr><td>Supervisory review<br>P12&ndash;P14</td><td>Supervisors review, require remediation, and cooperate across jurisdictions</td></tr>
</table></div>
<div class="note">Adaptability is the principle most often forgotten and the one supervisors press hardest. It asks whether a bank can answer a question it has never been asked before, quickly. Most cannot, because every report is hard-wired to a specific structure and any new cut requires a project.</div>`},

{l:"DEFINE",t:"CDEs and golden sources",h:"Two words in every data <em>programme</em>",b:`<div class="two">
<div><b>Critical data element</b>A field whose failure would materially misstate a risk report or a regulatory return. Counterparty identifier, exposure amount, rating, collateral value, maturity date, days past due. Each gets a named owner, a written definition, a quality rule and a monitored threshold</div>
<div><b>Golden source</b>The single system designated authoritative for a given attribute. Everything downstream consumes from it. Where two systems both claim authority, the reconciliation between them never ends</div>
</div>
<p>A quick test of a programme's maturity: ask who owns the definition of "exposure". If the answer is a named individual with a written definition, the work has been done. If four teams each hold a version, it has not.</p>
<div class="note">Identifying critical data elements is more analytical than it sounds. It requires tracing which fields actually drive a reported number, and the answer is almost always a much shorter list than anyone expects &mdash; usually a few dozen fields carrying most of the regulatory surface.</div>`},

{l:"MECHANISM",t:"Data lineage",h:"Proving where the number came <em>from</em>",b:`<p><span class="k">Data lineage</span> is the documented path of a data item from capture, through every transformation, to the reported figure &mdash; traversable in both directions.</p>
<div class="flow">
<div class="n"><b>Source system</b>Where the attribute is first captured. Core banking, origination, treasury, collateral, ratings</div>
<div class="a">&#8595;</div>
<div class="n"><b>Ingestion and staging</b>Extraction, format standardisation, first validation gate, rejection handling</div>
<div class="a">&#8595;</div>
<div class="n"><b>Transformation</b>Business rules, derivations, enrichment, mapping to the target model</div>
<div class="a">&#8595;</div>
<div class="n"><b>Calculation</b>RWA, expected credit loss, liquidity ratio, transfer price</div>
<div class="a">&#8595;</div>
<div class="n"><b>Report or return</b>The cell a supervisor reads</div>
</div>
<div class="two">
<div><b>System-level lineage</b>Which systems feed which. Necessary, and nowhere near sufficient</div>
<div><b>Attribute-level lineage</b>How <em>this specific field</em> in <em>this specific cell</em> was sourced, transformed and derived. This is the standard supervisors now expect</div>
</div>
<div class="note">Lineage is the hardest principle to satisfy and the most frequently cited obstacle in supervisory reviews. Legacy systems, distributed estates and continuously changing flows compound one another, and lineage captured once decays unless it is maintained as code changes.</div>`},

{l:"DEFINE",t:"Six dimensions",h:"The vocabulary of a data <em>issue</em>",b:`<p>Classify every issue raised. It makes triage possible and it makes the issue actionable rather than rhetorical.</p>
<div class="dt"><table>
<tr><th>Dimension</th><th>Question</th><th>Example failure</th></tr>
<tr><td>Completeness</td><td>Is it present?</td><td>Null collateral value, missing rating</td></tr>
<tr><td>Accuracy</td><td>Does it match reality?</td><td>Property valued at a decade-old price</td></tr>
<tr><td>Consistency</td><td>Does it agree across systems?</td><td>Two maturity dates for one facility</td></tr>
<tr><td>Timeliness</td><td>Is it current enough?</td><td>Annual rating refresh feeding a daily report</td></tr>
<tr><td>Validity</td><td>Does it conform?</td><td>Non-standard currency code, impossible negative balance</td></tr>
<tr><td>Uniqueness</td><td>Is it duplicated?</td><td>One exposure arriving from two feeds</td></tr>
</table></div>
<div class="note">Attach three things to every issue: the critical data element, the dimension, and the downstream impact quantified. "Loan-to-value missing on 4,200 mortgages, understating risk-weighted assets by an estimated &#8377;18 crore" gets prioritised. "Data quality is poor" does not.</div>`},

{l:"MECHANISM",t:"Reconciliation",h:"The only accepted <em>proof</em>",b:`<p>Documentation asserts. Reconciliation demonstrates. Four recur, and specifying them is among the most reliably useful contributions available on any data programme.</p>
<div class="lay">
<div><span>1</span><strong>Source to staging.</strong> Record counts and control totals match on ingestion. Catches truncated and partial feeds.</div>
<div><span>2</span><strong>Risk to finance.</strong> Total exposure in the risk system agrees to the general ledger. The most demanded reconciliation in any bank.</div>
<div><span>3</span><strong>Engine in to engine out.</strong> Exposures entering the calculation equal exposures leaving it, with every exclusion explained by a documented rule.</div>
<div><span>4</span><strong>Report to report.</strong> The same figure agrees across returns, disclosures and published accounts.</div>
</div>
<div class="note">A reconciliation without a defined tolerance and a named owner for breaks is decoration. Specify the tolerance, the break-clearing process and the escalation path, or it will not survive contact with the operational team who inherit it.</div>`},

{l:"LIVE",t:"Where the industry stands",h:"Thirteen years and still <em>open</em>",b:`<div class="stamp">Collected 17 August 2026</div>
<p>Useful context, because it changes how the subject should be described: this is not a solved problem being maintained.</p>
<ul>
<li>The most recent full progress report, published <strong>November 2023</strong>, assessed 31 globally systemically important banks. <strong>Two were fully compliant</strong> with all principles &mdash; roughly a decade after publication and seven years after the compliance date.</li>
<li>The causes cited are consistent: fragmented IT landscapes, legacy systems, manual processes, and the absence of a common taxonomy and complete lineage.</li>
<li>A further Basel Committee newsletter published <strong>6 January 2026</strong> summarised current themes from supervisory and industry outreach &mdash; governance of aggregation activities, data lineage, cross-border issues, and the implications of newer technologies. It is informational rather than new guidance.</li>
<li>Supervisory guidance elsewhere has hardened in the same direction, with attribute-level lineage named explicitly among the areas of concern.</li>
</ul>
<div class="docs"><b>Official sources</b>
<a href="https://www.bis.org/bcbs/publ/d559.htm" target="_blank" rel="noopener">BCBS &mdash; Progress in adopting the BCBS 239 principles, November 2023</a>
<a href="https://www.bis.org/publ/bcbs_nl36.htm" target="_blank" rel="noopener">BCBS newsletter &mdash; implementation of the BCBS 239 principles, January 2026</a></div>`},

{l:"RECALL",t:"Mission 14",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>The rulebook exists because aggregation failed in 2008</b><span>Published 2013, compliance expected from 2016</span></div>
<div class="r"><b>14 principles, 11 for banks</b><span>Governance, aggregation capability, reporting practices, supervisory review</span></div>
<div class="r"><b>CDE and golden source</b><span>A field that would misstate a report; the single authoritative system for it</span></div>
<div class="r"><b>Attribute-level lineage</b><span>Not system-level. The supervisory standard and the hardest principle to satisfy</span></div>
<div class="r"><b>Six dimensions</b><span>Completeness, accuracy, consistency, timeliness, validity, uniqueness</span></div>
<div class="r"><b>Four reconciliations</b><span>Source to staging, risk to finance, engine in to out, report to report</span></div>
<div class="r"><b>Two of 31 fully compliant</b><span>As at the November 2023 progress report. Live, unfinished work</span></div>
</div>`}
]},
/* ============ 15 ============ */
{n:"15",title:"From requirement to sign-off",stage:"Delivery",
line:"How a rule becomes a working system &mdash; the document chain, the mapping that carries the whole build, and the testing that proves the number is right before anyone relies on it.",
bullets:["The seven-document chain","The methodology paper that comes first","A requirement that can actually be tested","Source-to-target mapping","What a pipeline designer needs to know","The data quality issue log","Parallel run and the difference log","Sign-off and handover"],
cards:[

{l:"MECHANISM",t:"The chain",h:"Seven documents, one <em>order</em>",b:`<p>Regulatory change follows a chain. Each document answers one question and feeds the next. Skip a link and the gap surfaces during testing, at the highest possible cost.</p>
<div class="flow">
<div class="n"><b>1. Methodology paper</b>What the rule requires, how this institution interprets it, and who approved that reading</div>
<div class="a">&#8595;</div>
<div class="n"><b>2. Business requirements</b>What the solution must do, in business language</div>
<div class="a">&#8595;</div>
<div class="n"><b>3. Data requirements</b>Which attributes are needed, defined, with quality rules</div>
<div class="a">&#8595;</div>
<div class="n"><b>4. Source-to-target mapping</b>Where each attribute comes from and how it transforms</div>
<div class="a">&#8595;</div>
<div class="n"><b>5. Functional specification</b>How it will be built</div>
<div class="a">&#8595;</div>
<div class="n"><b>6. Test strategy and packs</b>How it will be proved</div>
<div class="a">&#8595;</div>
<div class="n"><b>7. Sign-off and handover</b>Who accepted it, and who operates it now</div>
</div>
<div class="note">The chain runs in this order because each document constrains the next. Requirements written before the methodology is settled get rewritten. Mapping written before requirements are agreed gets rebuilt.</div>`},

{l:"DEFINE",t:"The methodology paper",h:"The document that comes <em>first</em>",b:`<p>On regulatory change, the requirements document is not the first artefact. Before any system is specified, someone must establish what the rule requires and how this institution will interpret it.</p>
<p>A methodology paper answers four questions:</p>
<div class="lay">
<div><span>1</span><strong>What does the rule say</strong> &mdash; cited to the direction, paragraph and annex.</div>
<div><span>2</span><strong>Where does it permit discretion</strong>, and what has this institution chosen.</div>
<div><span>3</span><strong>How does that differ from current practice</strong>, and what changes as a result.</div>
<div><span>4</span><strong>Who approved the interpretation</strong>, at which committee, on what date.</div>
</div>
<div class="note">This document is read years later by an auditor or a supervisor testing whether a decision was deliberate or accidental. That is its actual audience, and writing it with that audience in mind changes what goes in it.</div>`},

{l:"TRAP",t:"A testable requirement",h:"The single most useful <em>habit</em>",b:`<p>Every requirement should be checkable by someone who was not in the room. The test is blunt: could a tester write a pass or fail case from this sentence alone?</p>
<div class="two">
<div><b>Not testable</b>"The system should handle collateral appropriately."</div>
<div><b>Testable</b>"For each secured facility, the system shall select the highest-ranking eligible collateral, apply the prescribed haircut for that collateral type and any currency mismatch haircut, and cap the recognised value at the facility's exposure. Where no eligible collateral exists, the exposure shall be treated as unsecured."</div>
</div>
<p>Four properties separate them. <strong>Atomic</strong> &mdash; one requirement, one behaviour. <strong>Unambiguous</strong> &mdash; no adjective doing load-bearing work. <strong>Traceable</strong> &mdash; numbered, mapped forward to a test case and back to a rule. <strong>Complete</strong> &mdash; the exception path is stated, not only the expected path.</p>`},

{l:"CHEAT",t:"Source-to-target mapping",h:"The document the build lives <em>inside</em>",b:`<p>One row per target attribute. These columns, at minimum.</p>
<div class="sheet"><div class="h">Mapping columns</div>
<div class="r"><b>Target attribute</b><span>Name, data type, length, nullability in the target model</span></div>
<div class="r"><b>Business definition</b><span>What it means, in words a business owner will sign</span></div>
<div class="r"><b>Source system</b><span>The designated golden source, named</span></div>
<div class="r"><b>Source field</b><span>Table and column, exactly as it exists</span></div>
<div class="r"><b>Transformation</b><span>Direct, derived, defaulted or looked up &mdash; stated in full, not summarised</span></div>
<div class="r"><b>Reference data</b><span>The code list or hierarchy applied, with its version</span></div>
<div class="r"><b>Quality rule</b><span>The validation applied and the action taken on failure</span></div>
<div class="r"><b>Default and exception</b><span>What happens when the source is null or invalid</span></div>
<div class="r"><b>Owner and version</b><span>Who owns the definition; which version this row is</span></div>
</div>
<div class="note">The two columns most often skipped are reference data version and exception treatment, and they cause the most rework. Silent defaults are the classic production incident: a null quietly becomes zero, and a reported number is wrong for two quarters before anyone notices.</div>`},

{l:"DEFINE",t:"What a pipeline needs",h:"Eight questions before any <em>design</em>",b:`<p>Before a feed can be designed, eight facts must be established. Supplying them turns a month of discovery into an hour of conversation.</p>
<div class="three">
<div><b>Grain</b>One row equals what &mdash; facility, account, position, cash flow?</div>
<div><b>Volume</b>Rows per run, and the growth trajectory</div>
<div><b>Frequency</b>Daily, weekly, monthly &mdash; and the cut-off time</div>
<div><b>Full or delta</b>Whole file each run, or changes only</div>
<div><b>Keys</b>What makes a row unique, and how it joins</div>
<div><b>History</b>Point-in-time retained, or overwritten?</div>
<div><b>Late arrivals</b>What happens when data lands after cut-off</div>
<div><b>Restatement</b>Can the source revise history?</div>
</div>
<div class="note">The last one separates a good analyst from an average one. If a source can retrospectively change last month's balance, every downstream report, every reconciliation and every point-in-time comparison must handle it &mdash; and almost nobody asks until it happens in production.</div>`},

{l:"MECHANISM",t:"The issue log",h:"Turning a complaint into an <em>action</em>",b:`<p>Data quality work runs on a log with a consistent structure. Without it, issues accumulate as opinions.</p>
<div class="dt"><table>
<tr><th>Field</th><th>Content</th></tr>
<tr><td>Reference and date</td><td>Raised by, and where it was found</td></tr>
<tr><td>CDE and dimension</td><td>Which critical field; which of the six quality dimensions</td></tr>
<tr><td>Population affected</td><td>Record count and value &mdash; never "some records"</td></tr>
<tr><td>Downstream impact</td><td>Which report, which cell, estimated misstatement</td></tr>
<tr><td>Root cause</td><td>Source capture, transformation, reference data, or timing</td></tr>
<tr><td>Tactical fix</td><td>What holds the line for the next reporting cycle</td></tr>
<tr><td>Strategic fix</td><td>What removes the cause, with an owner and a date</td></tr>
<tr><td>Status</td><td>Open, mitigated, closed &mdash; and who accepted the residual risk</td></tr>
</table></div>
<div class="note">Always separate tactical from strategic. A regulatory deadline often makes a manual adjustment the correct short-term answer &mdash; but only if it is documented, approved, and carries a dated plan to remove it. An undocumented workaround becomes an audit finding on its own.</div>`},

{l:"MECHANISM",t:"Validating an extract",h:"Six checks, in <em>order</em>",b:`<div class="lay">
<div><span>1</span><strong>Completeness.</strong> Row count and control totals against the source, with every exclusion explained by a documented rule.</div>
<div><span>2</span><strong>Conformance.</strong> Every field matches the agreed type, length, format and code list.</div>
<div><span>3</span><strong>Referential integrity.</strong> Every key resolves. No orphan counterparties, no unmapped product codes.</div>
<div><span>4</span><strong>Business rule.</strong> Derived fields recompute correctly from their inputs, on a sample checked independently.</div>
<div><span>5</span><strong>Reconciliation.</strong> Totals agree to the ledger or to the upstream engine within a stated tolerance.</div>
<div><span>6</span><strong>Reasonableness.</strong> Period-on-period movement is explainable. A large jump requires a cause, not a shrug.</div>
</div>
<div class="note">Step 6 catches what the first five cannot. Data can be complete, conformant, joined and reconciled &mdash; and still wrong, because an upstream mapping changed and nobody said so.</div>`},

{l:"MECHANISM",t:"Parallel run",h:"Signing off the <em>difference</em>",b:`<p>When a new engine replaces an old one for a regulatory calculation, the two are run together for a period and every difference is explained.</p>
<div class="flow">
<div class="n"><b>Run both</b>Old and new, identical input data, identical as-at date</div>
<div class="a">&#8595;</div>
<div class="n"><b>Compare at the lowest grain</b>Facility level, never headline totals</div>
<div class="a">&#8595;</div>
<div class="n"><b>Attribute every difference</b>To a deliberate methodology change, a fixed defect, or an unexplained gap</div>
<div class="a">&#8595;</div>
<div class="n"><b>Sign off the difference log</b>Not the absence of difference &mdash; the explanation of it</div>
</div>
<p>The trap is comparing totals. Two errors of equal size in opposite directions produce a perfect headline match and a completely broken calculation. Reconciliation must run at exposure level for this reason and no other.</p>
<div class="note">A parallel run that produces zero differences is not a success. It usually means the new engine is reading the old engine's output, or the comparison is not actually independent.</div>`},

{l:"DEFINE",t:"Sign-off and handover",h:"What it actually <em>commits</em>",b:`<p>Sign-off is an accountability transfer. For it to hold, four things must be true:</p>
<ul>
<li>The signer <strong>holds authority</strong> over what is being signed &mdash; a defined role, not whoever replied to the email.</li>
<li>A <strong>specific version</strong> was signed, referenced by number and date.</li>
<li><strong>Open items were listed</strong> at the moment of signing, with owners and dates.</li>
<li>The record is <strong>stored where an auditor will find it</strong>, not in a mailbox.</li>
</ul>
<p>Conditional sign-off is legitimate and often correct: approved subject to named items closing by a named date. What is not legitimate is an unqualified sign-off with known open gaps, because it transfers accountability the signer did not knowingly accept.</p>
<div class="note">Handover needs three artefacts: a <strong>runbook</strong> covering every step, its timing and what to do when it fails; a <strong>known-issues list</strong> with owners; and <strong>exit criteria</strong> stating what must be true &mdash; clean cycles completed, breaks cleared, operators trained &mdash; before the project team steps away. The commonest failure is handing over a process that only works when the data is clean.</div>`},

{l:"RECALL",t:"Mission 15",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Seven documents in dependency order</b><span>Methodology first on regulatory change, not requirements</span></div>
<div class="r"><b>Atomic, unambiguous, traceable, complete</b><span>If a tester cannot write a case from it, rewrite it</span></div>
<div class="r"><b>Mapping lives or dies on two columns</b><span>Reference data version and exception treatment</span></div>
<div class="r"><b>Eight pipeline questions</b><span>Grain, volume, frequency, full or delta, keys, history, late arrivals, restatement</span></div>
<div class="r"><b>Issue log quantifies</b><span>Population, impact, root cause, tactical fix, strategic fix, acceptance</span></div>
<div class="r"><b>Six extract checks</b><span>Completeness, conformance, integrity, business rule, reconciliation, reasonableness</span></div>
<div class="r"><b>Parallel run compares at the lowest grain</b><span>Offsetting errors produce a perfect total and a broken engine</span></div>
</div>`}
]},

/* ============ 16 ============ */
{n:"16",title:"The surfaces",stage:"Recall",
line:"The whole subject compressed onto four surfaces: the map, every formula, every trap, and everything that will go out of date.",
bullets:["The subject on one surface","Every formula in the pack","Every trap in one grid","What goes stale, and when to re-check it"],
cards:[

{l:"PICTURE",t:"The whole map",h:"One rupee, followed all the way <em>through</em>",b:`<p>Every mission in this pack sits somewhere on a single path. This is that path.</p>
<div class="dg"><div class="dg-t">From deposit to disclosure</div>
<div class="flow">
<div class="n"><b>Funding arrives</b>Deposits and borrowings, priced against a curve. Reserve requirements immobilise part of it &mdash; M02, M11</div>
<div class="a">&#8595;</div>
<div class="n"><b>Transfer priced</b>Treasury buys the funding from the deposit unit and sells it to the lending unit at a matched-maturity rate &mdash; M13</div>
<div class="a">&#8595;</div>
<div class="n"><b>Lent out</b>Borrower scored, graded, PD assigned. Collateral taken, LGD and EAD estimated &mdash; M03, M04</div>
<div class="a">&#8595;</div>
<div class="n"><b>Capitalised</b>Exposure classified, mitigated, weighted. RWA and required capital &mdash; M07, M08</div>
<div class="a">&#8595;</div>
<div class="n"><b>Provided against</b>Staged, expected loss computed over 12 months or lifetime, floored &mdash; M10</div>
<div class="a">&#8595;</div>
<div class="n"><b>Monitored</b>DPD buckets, roll rates, migration, vintage. Models revalidated &mdash; M05, M06</div>
<div class="a">&#8595;</div>
<div class="n"><b>Stressed</b>Concentration measured, scenarios run, capital path projected &mdash; M09, M12</div>
<div class="a">&#8595;</div>
<div class="n"><b>Aggregated and reported</b>Lineage traced, reconciled, disclosed &mdash; M14, M15</div>
</div></div>
<p>Every role in this field owns one or two boxes. Every regulation constrains one or two. Every data problem breaks the join between two adjacent ones.</p>`},

{l:"CHEAT",t:"Every formula",h:"The whole pack, no <em>explanation</em>",b:`<div class="fx"><div class="cap">Measurement</div>
<div class="eq"><em>EL</em> = <em>PD</em> &times; <em>LGD</em> &times; <em>EAD</em></div>
<div class="eq"><em>EAD</em> = <em>Drawn</em> + <em>CCF</em> &times; <em>Undrawn</em></div>
<div class="eq"><em>LGD</em> = 1 &minus; &Sigma;(<em>R</em><sub>t</sub>&minus;<em>C</em><sub>t</sub>)(1+<em>r</em>)<sup>&minus;t</sup> &frasl; <em>EAD</em></div>
<div class="eq"><em>WoE</em><sub>i</sub> = ln(%Good<sub>i</sub> / %Bad<sub>i</sub>)</div>
<div class="eq"><em>IV</em> = &Sigma;(%Good<sub>i</sub> &minus; %Bad<sub>i</sub>) &times; <em>WoE</em><sub>i</sub></div>
<div class="eq">ln(<em>p</em>/(1&minus;<em>p</em>)) = &beta;<sub>0</sub> + &Sigma;&beta;<sub>i</sub><em>x</em><sub>i</sub></div>
<div class="eq"><em>Score</em> = <em>Offset</em> + <em>Factor</em> &times; ln(<em>odds</em>) , <em>Factor</em> = <em>PDO</em>/ln2</div>
</div>
<div class="fx"><div class="cap">Validation</div>
<div class="eq"><em>Gini</em> = 2 &times; <em>AUROC</em> &minus; 1</div>
<div class="eq"><em>KS</em> = max |<em>F</em><sub>bad</sub>(s) &minus; <em>F</em><sub>good</sub>(s)|</div>
<div class="eq"><em>PSI</em> = &Sigma;(<em>A</em><sub>i</sub>&minus;<em>E</em><sub>i</sub>) ln(<em>A</em><sub>i</sub>/<em>E</em><sub>i</sub>)</div>
</div>
<div class="fx"><div class="cap">Capital</div>
<div class="eq"><em>CRAR</em> = Capital / <em>RWA</em></div>
<div class="eq"><em>RWA</em> = &Sigma; <em>EAD</em><sub>i</sub> &times; <em>RW</em><sub>i</sub></div>
<div class="eq"><em>E</em>* = max{0, <em>E</em>(1+<em>H</em><sub>e</sub>) &minus; <em>C</em>(1&minus;<em>H</em><sub>c</sub>&minus;<em>H</em><sub>fx</sub>)}</div>
<div class="eq"><em>RWA</em><sub>IRB</sub> = <em>K</em> &times; 12.5 &times; <em>EAD</em></div>
<div class="eq"><em>LR</em> = Tier 1 / Total exposure measure</div>
<div class="eq"><em>HHI</em> = &Sigma;<em>w</em><sub>i</sub><sup>2</sup> , <em>n</em><sub>eff</sub> = 1/<em>HHI</em></div>
</div>
<div class="fx"><div class="cap">Provisions</div>
<div class="eq"><em>ECL</em><sub>12m</sub> = <em>PD</em><sub>12m</sub> &times; <em>LGD</em> &times; <em>EAD</em> &times; <em>DF</em></div>
<div class="eq"><em>ECL</em><sub>LT</sub> = &Sigma;<sub>t</sub> <em>PD</em><sub>t</sub><sup>marg</sup> &times; <em>LGD</em><sub>t</sub> &times; <em>EAD</em><sub>t</sub> &times; (1+<em>EIR</em>)<sup>&minus;t</sup></div>
<div class="eq"><em>Provision</em> = max(<em>ECL</em><sub>modelled</sub>, <em>Floor</em> &times; <em>Exposure</em>)</div>
</div>
<div class="fx"><div class="cap">Balance sheet</div>
<div class="eq"><em>LCR</em> = <em>HQLA</em> / Net 30-day outflows &ge; 100%</div>
<div class="eq">Inflows recognised = min(&Sigma;<em>A</em><sub>j</sub><em>i</em><sub>j</sub> , 0.75 &times; &Sigma;<em>L</em><sub>i</sub><em>r</em><sub>i</sub>)</div>
<div class="eq"><em>NSFR</em> = <em>ASF</em> / <em>RSF</em> &ge; 100%</div>
<div class="eq"><em>Gap</em><sub>t</sub> = <em>RSA</em><sub>t</sub> &minus; <em>RSL</em><sub>t</sub></div>
<div class="eq">&Delta;<em>P</em>/<em>P</em> &asymp; &minus;<em>D</em><sub>Mod</sub> &times; &Delta;<em>y</em></div>
<div class="eq"><em>DGAP</em> = <em>D</em><sub>A</sub> &minus; <em>D</em><sub>L</sub> &times; <em>L</em>/<em>A</em></div>
<div class="eq"><em>FTP</em> = <em>r</em><sub>base</sub>(<em>T</em>) + <em>TLP</em>(<em>T</em>) + <em>CLC</em> + <em>&epsilon;</em></div>
<div class="eq"><em>NIM</em> = (Interest earned &minus; expended) / Avg earning assets</div>
</div>`},

{l:"TRAP",t:"Every trap",h:"One grid, all <em>missions</em>",b:`<div class="sheet q"><div class="h">Measurement</div>
<div class="r"><b>Leakage</b><span>A variable populated only after the outcome. Spectacular IV, worthless model</span></div>
<div class="r"><b>Undiscounted LGD</b><span>A four-year workout can shift LGD twenty points or more</span></div>
<div class="r"><b>Missing EAD history</b><span>Limit and balance overwritten, so conversion factors cannot be estimated at all</span></div>
<div class="r"><b>Backtesting TTC against one year</b><span>A category error. The deviation is the design, not a failure</span></div>
</div>
<div class="sheet q"><div class="h">Portfolio</div>
<div class="r"><b>Growth dilution</b><span>Falling NPA ratio while absolute stress rises. Denominator effect only</span></div>
<div class="r"><b>Write-off flattery</b><span>Improves the ratio, recovers nothing</span></div>
<div class="r"><b>Bucket cliff</b><span>Accounts held at 89 days. Stock stays out of NPA; risk does not</span></div>
<div class="r"><b>Alert flooding</b><span>More early warnings than can be actioned trains the team to close them unread</span></div>
</div>
<div class="sheet q"><div class="h">Capital and provisions</div>
<div class="r"><b>Collateral not linked</b><span>Security held, no regulatory benefit taken. Pure wasted capital</span></div>
<div class="r"><b>Undrawn limits absent</b><span>EAD understated &mdash; the dangerous direction of error</span></div>
<div class="r"><b>Correlation assumption</b><span>The formula assumes full diversification, so concentration is invisible in Pillar 1</span></div>
<div class="r"><b>Single ECL scenario</b><span>Understates systematically, because the loss relationship is convex</span></div>
<div class="r"><b>Confusing Basel EL with accounting ECL</b><span>Six structural differences. They never reconcile</span></div>
</div>
<div class="sheet q"><div class="h">Balance sheet and data</div>
<div class="r"><b>Encumbrance</b><span>One flag moves the liquidity ratio across the minimum with no economic change</span></div>
<div class="r"><b>Contractual slotting of savings deposits</b><span>Destroys the structural statement and the transfer price alike</span></div>
<div class="r"><b>Unfrozen transfer rate</b><span>A later run reprices history and unit profitability silently restates</span></div>
<div class="r"><b>Silent defaults in mapping</b><span>A null becomes zero and a reported number is wrong for two quarters</span></div>
<div class="r"><b>Comparing totals in a parallel run</b><span>Offsetting errors produce a perfect match and a broken engine</span></div>
</div>`},

{l:"LIVE",t:"What goes stale",h:"Every dated claim, and when to <em>re-check</em>",b:`<div class="stamp">Collected 17 August 2026</div>
<div class="dt"><table>
<tr><th>Claim</th><th>As collected</th><th>Re-check</th></tr>
<tr><td>Indian minimum ratios</td><td>CET1 5.5%, Tier 1 7.0%, CRAR 9.0%, CCB 2.5%</td><td>Annually, and on any capital circular</td></tr>
<tr class="hi"><td>Revised credit risk standardised approach</td><td>Final directions 27 Apr 2026, effective 1 Apr 2027</td><td>Quarterly until commencement</td></tr>
<tr class="hi"><td>Expected credit loss framework</td><td>Final directions 27 Apr 2026, effective 1 Apr 2027, glide path to 31 Mar 2031</td><td>Quarterly until commencement</td></tr>
<tr><td>Prudential floors under ECL</td><td>Applied by stage and asset category; retail stage 1 floors set at modest levels</td><td>On issue of any clarification or FAQ</td></tr>
<tr><td>Liquidity run-off for digitally enabled deposits</td><td>+2.5% additional factor; stable 7.5%, less stable 12.5%. Effective 1 Apr 2026</td><td>Annually</td></tr>
<tr><td>HQLA valuation for government securities</td><td>Haircuts aligned to central bank facility margin requirements</td><td>Annually</td></tr>
<tr><td>Output floor</td><td>72.5% of standardised, where internal models are permitted</td><td>Only if India adopts internal models</td></tr>
<tr><td>BCBS 239 compliance</td><td>2 of 31 G-SIBs fully compliant, Nov 2023 progress report</td><td>On each new progress report</td></tr>
</table></div>
<div class="note">Mechanism cards elsewhere in this pack do not appear here, and that is deliberate. How a transfer price is built, why discounting changes LGD, what duration measures &mdash; none of that changes when a circular is issued. Only the table above does.</div>`},

{l:"CLOSE",t:"Where this stops",h:"The map, and the <em>ground</em>",b:`<p>This pack is the map: what every measure means, which rulebook demands it, where the data comes from, and how the number is proved. It goes wide deliberately and stops before depth. Scorecard construction, expected credit loss modelling, liquidity management and transfer pricing are each a career on their own.</p>
<p>What should now be possible &mdash; and this is the only real test of it:</p>
<ul>
<li>Place any credit or capital term on the loss equation or the three pillars within a sentence.</li>
<li>Read a regulatory change and identify which stage of the map it lands on and which data it will demand.</li>
<li>Take a number from a report and name every input that produced it.</li>
<li>Explain transfer pricing, the liquidity ratio and expected credit loss to someone who has never encountered them, without notes.</li>
<li>Recognise when a disagreement is a definition problem &mdash; which it usually is.</li>
</ul>
<div class="docs"><b>The seven documents worth keeping open</b>
<a href="https://www.bis.org/basel_framework/" target="_blank" rel="noopener">The consolidated Basel Framework</a>
<a href="https://www.rbi.org.in/scripts/BS_ViewMasterDirections.aspx" target="_blank" rel="noopener">Reserve Bank of India &mdash; Master Directions index</a>
<a href="https://www.rbi.org.in/Scripts/BS_ViewMasCirculardetails.aspx?id=12652" target="_blank" rel="noopener">Master Circular &mdash; Basel III Capital Regulations</a>
<a href="https://www.bis.org/publ/bcbs239.htm" target="_blank" rel="noopener">BCBS 239 &mdash; risk data aggregation and reporting principles</a>
<a href="https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/" target="_blank" rel="noopener">IFRS 9 Financial Instruments</a>
<a href="https://www.bis.org/basel_framework/chapter/CRE/31.htm" target="_blank" rel="noopener">Basel Framework CRE31 &mdash; IRB risk weight functions</a>
<a href="https://www.bis.org/publ/bcbs144.htm" target="_blank" rel="noopener">BCBS &mdash; Principles for sound liquidity risk management</a>
<a href="https://www.rbi.org.in/scripts/NotificationUser.aspx" target="_blank" rel="noopener">Reserve Bank of India &mdash; notifications and circulars</a></div>
<div class="note">The one sentence to keep, if only one survives: <strong>the number is never the deliverable &mdash; the traceable, reconciled, signed-off explanation of the number is.</strong></div>`}
]}
]};
document.title=P.title.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&')+' \u2014 Field Cards';
const main=document.getElementById('main'), rail=document.getElementById('rail');
function lc(l){
  if(l==='TRAP'||l==='TRADE-OFF') return 'label q';
  if(l==='FORMULA'||l==='WORKED') return 'label';
  if(l==='RECALL'||l==='CHEAT'||l==='CLOSE') return 'label r';
  if(l==='LIVE'||l==='NUMBERS') return 'label l';
  return 'label';
}
let total=0;
P.missions.forEach(m=>total+=m.cards.length);

let html=`<section class="cover pcover in">
  <div class="kick">Field Cards &nbsp;/&nbsp; ${P.edition}</div>
  <h1>${P.title}</h1>
  <div class="sub">${P.sub}</div>
  <div class="rule"></div>
  <div class="meta">${P.missions.length} missions &nbsp;·&nbsp; ${total} cards<br>${P.floor}<br>${P.dateline} ${DATE}</div>
  ${P.intro ? `<div class="note" style="margin-top:26px">${P.intro}</div>` : ''}
  <div class="scrollcue">Scroll &nbsp;&#9660;</div>
</section>`;

P.missions.forEach((m,mi)=>{
  m.n=String(mi+1).padStart(2,'0');
  html+=`<section class="cover mcover" data-m="${mi}" id="m${m.n}">
    <div class="kick">Mission ${m.n} &nbsp;/&nbsp; ${m.stage}</div>
    <h1>${m.title}</h1><div class="rule"></div>
    ${m.line ? `<div class="mline">${m.line}</div>` : ''}
    ${m.bullets ? `<div class="inthis">In this mission</div><ul>${m.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : ''}
  </section>`;
  m.cards.forEach(c=>{
    html+=`<section data-m="${mi}" data-card="1">
      <div class="eyebrow"><span class="${lc(c.l)}">${c.l}</span><span class="tag">${m.stage} · ${c.t}</span></div>
      <h1>${c.h}</h1>${c.b}</section>`;
  });
  const b=document.createElement('b');rail.appendChild(b);
});
main.innerHTML=html;

/* ---------- code blocks: highlight + copy ---------- */
const KW=new Set(('False,None,True,and,as,assert,async,await,break,class,continue,def,del,elif,else,except,'+
'finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,'+
'self,print,len,range,list,dict,set,int,str,float,bool,sum,min,max,sorted,enumerate,zip,open,type,round,abs').split(','));
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
</body>
