<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}

a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim)}
a:hover{color:var(--ink);border-color:var(--ink)}
.docs{margin:20px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--live);border-radius:7px;font-size:12.6px;line-height:1.9}
.docs b{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:6px;font-weight:500}
.docs a{display:block;border-bottom:none;color:var(--body)}
.docs a:hover{color:var(--accent)}
.docs a:before{content:'\2192\00a0';color:var(--live)}
.fx{margin:20px 0;padding:16px 15px;background:#0E0E12;border:1px solid var(--line);border-radius:9px;text-align:center;overflow-x:auto}
.fx .eq{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);line-height:2.1;white-space:nowrap}
.fx .eq em{font-style:italic;color:var(--accent);font-family:'Instrument Serif',serif;font-size:17px}
.fx .wh{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:left;line-height:1.8;font-family:'JetBrains Mono',monospace}
.fx .cap{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.wk{margin:20px 0;border:1px solid var(--accent-dim);border-radius:9px;overflow:hidden}
.wk .h{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.wk .r{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;background:var(--surface)}
.wk .r:last-child{border-bottom:none}
.wk .r b{flex:1;color:var(--body);font-weight:400}
.wk .r span{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.wk .r.tot{background:var(--raise)}
.wk .r.tot b{color:var(--ink);font-weight:600}
.wk .r.tot span{color:var(--ink)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "17 August 2026";
const P = {
edition:"Edition 01",
title:"Credit Risk, <em>India</em>",
sub:"Measurement, capital, provisioning, funding and the data that carries all of it. Written for the person who has to turn a rulebook into a number, and then defend the number.",
floor:"No prior knowledge assumed",
dateline:"Regulatory position verified",
intro:"Two kinds of card. <strong>Mechanism</strong> cards explain how something works and do not go stale. <strong>Live</strong> cards carry a collection stamp and do. Every regulation named is linked to the issuing authority's own text, and Mission 16 lists what to re-check and when.",
missions:[

/* ============ 01 ============ */
{n:"01",title:"The one question",stage:"Ground",
line:"The question the entire field exists to answer, the equation it reduces to, and why one loss becomes two completely separate regulatory answers.",
bullets:["The loss equation, in full notation","Expected against unexpected loss","Default, defined precisely enough to code","Why provisions and capital never reconcile","Where every role sits on one equation"],
cards:[

{l:"ORIENT",t:"The question",h:"Will it be paid <em>back</em>?",b:`<p>Every model, regulation, committee and system in this field exists to answer one question about one loan, and then the same question about several crore at once.</p>
<div class="note" style="font-size:16.5px;color:var(--ink);border-left-color:var(--accent)">How much of this money will not come back, and how confident is that number?</div>
<p>Two halves, and they are not the same question. The first is an estimate. The second is the estimate's reliability &mdash; and the second is where regulatory capital lives.</p>
<p>That split is not academic. It is the reason a bank holds <strong>two entirely different cushions</strong> against the same loan book, computed by two different teams under two different rulebooks, which never agree and are never meant to.</p>`},

{l:"FORMULA",t:"Expected loss",h:"Three numbers, <em>multiplied</em>",b:`<p>Expected loss reduces to three quantities. Every credit model in existence estimates one of them.</p>
<div class="fx"><div class="cap">Expected loss, single facility</div>
<div class="eq"><em>EL</em> = <em>PD</em> &times; <em>LGD</em> &times; <em>EAD</em></div>
<div class="wh">PD&nbsp;&nbsp;probability of default over the horizon, 0 to 1<br>
LGD&nbsp;loss given default &mdash; share not recovered, 0 to 1<br>
EAD&nbsp;exposure at default, in currency<br>
EL&nbsp;&nbsp;expected loss, in currency</div></div>
<p>Two of the three are ratios and one is an amount, so the product is an amount. Written as a rate rather than a value:</p>
<div class="fx"><div class="cap">Expressed as a loss rate</div>
<div class="eq"><em>EL</em>% = <em>PD</em> &times; <em>LGD</em></div>
<div class="wh">Loss as a percentage of exposure, independent of facility size</div></div>
<div class="note">A common slip is calling PD &times; LGD the "expected loss". It is the expected loss <em>rate</em>. It becomes an amount only when multiplied by EAD.</div>`},

{l:"WORKED",t:"One facility",h:"The equation with real <em>numbers</em>",b:`<p>A working capital facility. Sanctioned limit &#8377;5,00,00,000, drawn &#8377;3,00,00,000, undrawn &#8377;2,00,00,000. Internal rating implies a one-year PD of 2.4%. Recovery experience on similar secured exposures is 55%, so LGD is 45%. The credit conversion factor applied to the undrawn portion is 40%.</p>
<div class="wk"><div class="h">Step by step</div>
<div class="r"><b>Drawn balance</b><span>&#8377;3,00,00,000</span></div>
<div class="r"><b>Undrawn &#8377;2,00,00,000 &times; CCF 40%</b><span>&#8377;80,00,000</span></div>
<div class="r tot"><b>EAD</b><span>&#8377;3,80,00,000</span></div>
<div class="r"><b>PD</b><span>2.40%</span></div>
<div class="r"><b>LGD</b><span>45.00%</span></div>
<div class="r"><b>EL rate = 2.40% &times; 45%</b><span>1.08%</span></div>
<div class="r tot"><b>EL = &#8377;3,80,00,000 &times; 1.08%</b><span>&#8377;4,10,400</span></div>
</div>
<p>&#8377;4,10,400 is not a prediction about this facility. This facility either defaults or it does not. It is what a very large book of identical facilities would average per facility per year.</p>
<div class="note">Notice that EAD exceeded the drawn balance. A borrower heading towards default draws the remaining limit first. Ignoring the undrawn portion understates loss, which is the more dangerous direction of error.</div>`},

{l:"WHY",t:"Expected and unexpected",h:"The distinction that explains <em>everything</em>",b:`<p>Expected loss is the average. Actual losses vary around that average, and in a bad year land far above it.</p>
<div class="two">
<div><b>Expected loss</b>The average, foreseeable cost of lending. A cost of doing business. Priced into the interest rate and covered by provisions.</div>
<div><b>Unexpected loss</b>The amount by which a bad year exceeds the average. Cannot be priced because its timing is unknown. Covered by capital.</div>
</div>
<p>Everything downstream follows from this one split:</p>
<ul>
<li><span class="k">Provisions</span> absorb expected loss, sit in the profit and loss account, and are governed by accounting and by the provisioning rulebook.</li>
<li><span class="k">Capital</span> absorbs unexpected loss, sits on the balance sheet as shareholders' money, and is governed by the capital rulebook.</li>
<li><span class="k">Stress testing</span> asks how large "unexpected" can plausibly become before capital runs out.</li>
</ul>
<div class="note">If provisions and capital are ever used interchangeably in a discussion, the average is being confused with the tail. It is the single most common conceptual error in the field and it produces wrong answers in both directions.</div>`},

{l:"DEFINE",t:"Default",h:"An event, not an <em>opinion</em>",b:`<p>Everything above depends on a precise definition of <span class="k">default</span>. The Basel definition has two limbs, and either one triggers it.</p>
<div class="lay">
<div><span>1</span><strong>90 days past due.</strong> The obligor is more than 90 days overdue on any material credit obligation to the group.</div>
<div><span>2</span><strong>Unlikeliness to pay.</strong> The bank judges the obligor unlikely to pay in full without recourse to actions such as realising security.</div>
</div>
<p>The second limb is judgemental, and it is where banks differ most. It captures distressed restructuring, sale of the obligation at a material credit-related loss, insolvency proceedings, and specific credit-risk adjustments taken against the exposure.</p>
<p>In the Indian framework the 90-day rule is the classification trigger for non-performing assets, and it is retained unchanged even as the provisioning basis moves to expected loss.</p>
<div class="note">Default is a data specification before it is a concept. Somebody must source days-past-due, materiality thresholds, restructuring flags and write-off dates, and reconcile them across systems that disagree. That work is a job in itself.</div>`},

{l:"PICTURE",t:"The loss distribution",h:"One curve behind every <em>rule</em>",b:`<p>Plot the losses a large loan book could produce in a single year. The shape is not symmetric: most years cluster near the average, and a thin tail runs far to the right.</p>
<div class="dg"><div class="dg-t">Where each concept sits on the curve</div>
<div class="lay">
<div><span>1</span><strong>The mean</strong> &mdash; expected loss. Covered by provisions and by loan pricing.</div>
<div class="hot"><span>2</span><strong>Mean out to the confidence point</strong> &mdash; unexpected loss. Covered by regulatory capital.</div>
<div><span>3</span><strong>The 99.9th percentile</strong> &mdash; the confidence level the credit risk capital formula targets. One year in a thousand.</div>
<div><span>4</span><strong>Beyond the tail</strong> &mdash; not capitalised at all. This is what stress testing and resolution planning exist for.</div>
</div></div>
<p>Almost every disagreement in a capital forum is an argument about where on this curve a particular thing belongs.</p>`},

{l:"FORMULA",t:"The capital ratio",h:"Two numbers, one <em>fraction</em>",b:`<p>Capital adequacy is one fraction, and both halves of it are contested.</p>
<div class="fx"><div class="cap">Capital to risk-weighted assets</div>
<div class="eq"><em>CRAR</em> = <sup>Eligible capital</sup> &frasl; <sub>RWA</sub></div>
<div class="wh">RWA = &Sigma; ( exposure &times; risk weight ) across all exposures<br>
Plus RWA equivalents for market risk and operational risk</div></div>
<p><span class="k">Risk-weighted assets</span> restate the asset base by risk rather than by size. A &#8377;1 crore holding of government securities and a &#8377;1 crore unsecured personal loan are identical on the balance sheet and very different in RWA.</p>
<div class="bars">
<div class="row"><div class="lb"><span>Cash and balances with the central bank</span><span>0%</span></div><div class="tr"><i style="width:1%"></i></div></div>
<div class="row"><div class="lb"><span>Central government securities</span><span>0%</span></div><div class="tr"><i style="width:1%"></i></div></div>
<div class="row"><div class="lb"><span>Residential mortgage, low loan-to-value</span><span>~20-35%</span></div><div class="tr"><i style="width:30%"></i></div></div>
<div class="row"><div class="lb"><span>Regulatory retail</span><span>~75%</span></div><div class="tr"><i style="width:70%"></i></div></div>
<div class="row"><div class="lb"><span>Unrated corporate</span><span>100%</span></div><div class="tr"><i class="b" style="width:92%"></i></div></div>
<div class="row"><div class="lb"><span>Capital market and speculative exposure</span><span>125%+</span></div><div class="tr"><i class="d" style="width:100%"></i></div></div>
</div>
<div class="note">Indicative bands to build intuition. The binding weights come from the applicable standardised approach tables, covered in Mission 08. The point here is only that the denominator is a data problem, not an accounting one.</div>`},

{l:"MECHANISM",t:"Six seats, one equation",h:"Where the work actually <em>sits</em>",b:`<p>Every role in credit risk attaches to a specific point on the equation. The distinction matters because the same word means different work in each seat.</p>
<div class="dt"><table>
<tr><th>Function</th><th>What it owns</th></tr>
<tr><td>Model development</td><td>Estimating PD, LGD and EAD from historical data</td></tr>
<tr><td>Model validation</td><td>Independently challenging those estimates and approving their use</td></tr>
<tr><td>Credit policy</td><td>Who may be lent to, on what terms, and how deterioration is defined internally</td></tr>
<tr><td>Portfolio monitoring</td><td>What the book is actually doing &mdash; arrears, migration, concentration, vintage</td></tr>
<tr><td>Regulatory reporting</td><td>Producing the returns the supervisor receives, on the supervisor's templates</td></tr>
<tr><td class="n">Change and analysis</td><td>Turning any of the above into specifications a system can be built from, then proving it was built right</td></tr>
</table></div>
<p>The last row is connective tissue. It touches every other seat, owns none of them, and is judged on whether the built thing matches the intent and survives inspection.</p>`},

{l:"TRAP",t:"The number is not the truth",h:"Three ways an estimate goes <em>wrong</em>",b:`<p>PD, LGD and EAD are outputs of models fitted to history. Three failure modes recur, and the third is the one people underestimate.</p>
<div class="three">
<div><b>Bad input</b>Missing collateral values, stale ratings, duplicated exposures, unmapped entities. The model is sound; the data is not.</div>
<div><b>Broken history</b>The relationship the model learned stopped holding. A rate cycle, a policy change, a pandemic. Performance decays quietly.</div>
<div><b>Unprovable output</b>The number was correct and nobody could show why.</div>
</div>
<p>The third is fatal in a regulated setting. A figure that cannot be traced back through every transformation to its source system is unusable to a supervisor <strong>regardless of whether it is right</strong>. That principle has a rulebook of its own, and it is Mission 14.</p>`},

{l:"RECALL",t:"Mission 01",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>EL = PD &times; LGD &times; EAD</b><span>Probability, severity, size. Every credit model estimates one of the three.</span></div>
<div class="r"><b>EL rate = PD &times; LGD</b><span>A percentage. Becomes an amount only when multiplied by EAD.</span></div>
<div class="r"><b>Expected vs unexpected</b><span>Average is provisioned. Tail is capitalised. Two rulebooks, two teams, never reconciled.</span></div>
<div class="r"><b>Default</b><span>90 days past due, or unlikely to pay. Both limbs. A data specification first.</span></div>
<div class="r"><b>CRAR = capital / RWA</b><span>Credit capital targets the 99.9th percentile &mdash; one year in a thousand.</span></div>
<div class="r"><b>EAD exceeds drawn</b><span>Undrawn limits convert. Ignoring them understates loss.</span></div>
</div>
<div class="note">Next: the system these numbers live inside &mdash; how an Indian bank is structured, what sits on its balance sheet, and which regulator sets which rule.</div>`}
]},

/* ============ 02 ============ */
{n:"02",title:"The system you are inside",stage:"Ground",
line:"How an Indian bank makes money, what sits on its balance sheet, who regulates which part, and the four risks the whole apparatus is built to contain.",
bullets:["Borrow short, lend long &mdash; and what it costs","The balance sheet, read from the risk side","Bank types, and why the category changes the rules","SLR, CRR and the Indian overlay","The four risks and who owns each","Banking book against trading book"],
cards:[

{l:"ORIENT",t:"The business model",h:"Borrow short, lend <em>long</em>",b:`<p>A bank takes money that can leave quickly and lends it for long periods. The mismatch is not a defect. It is the product, and it is the source of both the margin and the risk.</p>
<div class="flow">
<div class="n"><b>Funding in</b>Deposits, borrowings, bonds issued, refinance lines. Mostly short-dated or withdrawable on demand</div>
<div class="a">&#8595;</div>
<div class="n"><b>Assets out</b>Loans, advances, investments. Mostly long-dated and not readily saleable</div>
<div class="a">&#8595;</div>
<div class="n"><b>Net interest income</b>Earned on assets minus paid on funding. The dominant revenue line at almost every Indian bank</div>
</div>
<div class="fx"><div class="cap">Net interest margin</div>
<div class="eq"><em>NIM</em> = <sup>Interest earned &minus; interest expended</sup> &frasl; <sub>Average earning assets</sub></div>
<div class="wh">Expressed annualised, as a percentage. The headline profitability measure for a lender</div></div>
<p>Two things can destroy the model. The assets do not come back &mdash; <strong>credit risk</strong>. Or the funding leaves faster than the assets can be turned into cash &mdash; <strong>liquidity risk</strong>. Missions 03 to 10 address the first. Missions 11 to 13 address the second.</p>`},

{l:"MECHANISM",t:"The balance sheet",h:"Two columns and a thin <em>sliver</em>",b:`<p>Read from the risk side, a bank balance sheet simplifies dramatically.</p>
<div class="dt"><table>
<tr><th>Side</th><th>Contents</th></tr>
<tr><td>Assets</td><td>Advances &middot; investments &middot; cash and balances with the central bank &middot; balances with other banks &middot; fixed and other assets</td></tr>
<tr><td>Liabilities</td><td>Deposits &middot; borrowings &middot; other liabilities and provisions</td></tr>
<tr><td class="n">Capital and reserves</td><td>Shareholders' money. The sliver that absorbs loss before a depositor is touched</td></tr>
</table></div>
<p>Deposits split three ways, and the split drives both funding cost and liquidity behaviour:</p>
<div class="three">
<div><b>Current</b>Non-interest bearing, operational, volatile in balance but stable in aggregate</div>
<div><b>Savings</b>Low interest, no contractual maturity, historically very sticky</div>
<div><b>Term</b>Contractual maturity, higher interest, often with a premature withdrawal option</div>
</div>
<p>Current and savings together are <span class="k">CASA</span>. A high CASA ratio means cheap funding, which is why it is quoted in every Indian bank's results and why the deposit franchise is treated as an asset in its own right.</p>`},

{l:"DEFINE",t:"Bank types",h:"The category sets the <em>rulebook</em>",b:`<p>Indian prudential rules are written by bank category, and a rule that binds one type may not apply to another. Getting the category wrong makes an entire analysis wrong.</p>
<div class="dt"><table>
<tr><th>Type</th><th>Character</th></tr>
<tr><td>Scheduled commercial banks</td><td>Public sector, private sector and foreign banks. The core of the system and the subject of most prudential rules</td></tr>
<tr><td>Small finance banks</td><td>Licensed for financial inclusion. Priority sector obligation of 75%, with a minimum share of small-ticket loans</td></tr>
<tr><td>Payments banks</td><td>Deposits capped per customer, cannot lend. Balances deployed into government securities and bank deposits</td></tr>
<tr><td>Regional rural banks</td><td>Rural focus, sponsored by a commercial bank</td></tr>
<tr><td>Co-operative banks</td><td>Urban and rural co-operative structures, with a separate supervisory framework</td></tr>
<tr><td>NBFCs</td><td>Lend but do not take demand deposits. Regulated under a scale-based framework, not the bank capital rules</td></tr>
</table></div>
<div class="note">Recent Indian prudential directions repeatedly carve out small finance banks, payments banks and local area banks from scope. When reading any circular, the applicability paragraph is not boilerplate &mdash; it is the first thing to check.</div>`},

{l:"MECHANISM",t:"CRR and SLR",h:"The Indian <em>overlay</em>",b:`<p>Two reserve requirements sit on top of the Basel framework in India, and they materially shape the balance sheet before any risk rule applies.</p>
<div class="two">
<div><b>CRR &mdash; cash reserve ratio</b>A share of net demand and time liabilities held as cash with the central bank. Earns nothing. A monetary policy instrument.</div>
<div><b>SLR &mdash; statutory liquidity ratio</b>A share of net demand and time liabilities held in approved securities, largely government securities. Earns a yield and can be pledged for funding.</div>
</div>
<p>The base for both is <span class="k">NDTL</span> &mdash; net demand and time liabilities, essentially the deposit and borrowing base after specified netting.</p>
<p>The consequence that matters for later missions: SLR securities are simultaneously a <strong>statutory requirement</strong> and the <strong>core of the liquidity buffer</strong>, and they are pledgeable for central bank funding. That triple role is unique to the Indian setup and it complicates every liquidity calculation, because the same security can be counted, encumbered or monetised depending on the lens.</p>
<div class="docs"><b>Official source</b>
<a href="https://www.rbi.org.in/scripts/BS_ViewMasterDirections.aspx" target="_blank" rel="noopener">Reserve Bank of India &mdash; Master Directions index</a></div>`},

{l:"DEFINE",t:"The four risks",h:"What can go wrong, <em>categorised</em>",b:`<p>Prudential regulation splits bank risk into four buckets. Each has its own capital treatment, its own owner and its own data.</p>
<div class="lay">
<div><span>1</span><strong>Credit risk</strong> &mdash; a borrower or counterparty does not pay. The largest capital line at almost every Indian bank.</div>
<div><span>2</span><strong>Market risk</strong> &mdash; the value of traded positions moves adversely. Prices, rates, spreads, exchange rates.</div>
<div><span>3</span><strong>Operational risk</strong> &mdash; loss from failed processes, people, systems or external events. Fraud, outages, litigation.</div>
<div><span>4</span><strong>Liquidity risk</strong> &mdash; obligations cannot be met as they fall due, even while solvent.</div>
</div>
<p>Liquidity is the odd one out and the distinction is worth holding: <strong>it carries no minimum capital charge</strong>. No capital is held against it. Liquid assets and stable funding are held against it instead, measured by ratios. That asymmetry is why liquidity has an entirely separate reporting apparatus, covered in Mission 11.</p>`},

{l:"DEFINE",t:"Banking book, trading book",h:"The line that sets the <em>treatment</em>",b:`<p>Every position sits in one of two books, and the assignment determines the valuation basis, the applicable rules and the capital engine.</p>
<div class="two">
<div><b>Banking book</b>Held to collect contractual cash flows or to maturity. Advances, most investments held for statutory or liquidity purposes. Accrual accounted. Credit risk capital; interest rate risk assessed separately.</div>
<div><b>Trading book</b>Held with intent to trade. Marked to market. Market risk capital.</div>
</div>
<p>In the Indian investment classification the equivalent split runs across held-to-maturity, available-for-sale and held-for-trading categories, with rules governing what may sit where and how transfers between categories are treated.</p>
<div class="note">Book allocation is a critical data attribute rather than a bookkeeping label. Get it wrong in a specification and the exposure is routed to the wrong calculation entirely, producing a number that is not merely inaccurate but computed under the wrong rulebook.</div>`},

{l:"MECHANISM",t:"Three lines of defence",h:"Who is allowed to say <em>no</em>",b:`<p>Banks are organised around a governance model that determines who may challenge whom. It is worth knowing because it explains why documents exist in the form they do.</p>
<div class="lay">
<div><span>1</span><strong>First line &mdash; the business.</strong> Originates risk and owns it. Branches, relationship management, treasury dealing.</div>
<div><span>2</span><strong>Second line &mdash; risk and compliance.</strong> Sets the framework, independently measures and challenges the first line. Credit risk, market risk, model validation.</div>
<div><span>3</span><strong>Third line &mdash; internal audit.</strong> Assures that the first two lines work. Reports to the board audit committee.</div>
</div>
<p>A supervisor sits outside all three and inspects the evidence that each did its job.</p>
<div class="note">Practical consequence: a methodology document is not internal correspondence. It is evidence, read years later by someone testing whether a decision was deliberate or accidental.</div>`},

{l:"TRAP",t:"One word, four meanings",h:"Where analysis quietly <em>derails</em>",b:`<p>Risk, finance, treasury and reporting use identical vocabulary for different quantities. Left unresolved, everyone signs the same document and reads it differently.</p>
<div class="sheet q"><div class="h">The four ambiguous terms</div>
<div class="r"><b>Exposure</b><span>Carrying value, or EAD including converted undrawn, or contractual cash flow by time bucket</span></div>
<div class="r"><b>Maturity</b><span>Contractual date, behavioural life, effective maturity for capital, or the reporting bucket it falls in</span></div>
<div class="r"><b>Balance</b><span>Gross, net of provisions, amortised cost, or sanctioned limit. Four numbers for one facility</span></div>
<div class="r"><b>Entity</b><span>Legal entity, reporting entity, booking unit, or counterparty group for exposure aggregation</span></div>
</div>
<p>The defence is a business glossary with one named owner per term, agreed before specification begins. It feels bureaucratic in the first week and saves the exercise in the sixth month.</p>`},

{l:"RECALL",t:"Mission 02",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Borrow short, lend long</b><span>NIM is the reward. Credit and liquidity risk are the price.</span></div>
<div class="r"><b>CASA</b><span>Current plus savings. Cheap, sticky funding. The reason deposit franchises are valued.</span></div>
<div class="r"><b>Category sets the rulebook</b><span>Always read the applicability paragraph before the substance.</span></div>
<div class="r"><b>CRR and SLR</b><span>Reserve requirements on NDTL. SLR securities are requirement, buffer and collateral at once.</span></div>
<div class="r"><b>Four risks</b><span>Credit, market and operational carry capital. Liquidity carries ratios and buffers instead.</span></div>
<div class="r"><b>Book allocation</b><span>Banking or trading. Determines valuation, rulebook and calculation engine.</span></div>
</div>`}
]},
/* ============ 03 ============ */
{n:"03",title:"PD and the scorecard",stage:"Measurement",
line:"How a probability of default is actually built &mdash; from raw application data to a rating grade with a calibrated PD attached to it.",
bullets:["What a scorecard is, mechanically","Weight of evidence and information value","The logistic model, and why odds not probability","Scaling a score to points","The master scale and rating grades","Point-in-time against through-the-cycle","Where scorecards break"],
cards:[

{l:"ORIENT",t:"What is being estimated",h:"A probability, not a <em>verdict</em>",b:`<p>A <span class="k">scorecard</span> converts borrower characteristics into a number that ranks borrowers by risk, which is then calibrated into a probability of default.</p>
<p>Two separate jobs live inside that sentence, and confusing them causes most scorecard arguments:</p>
<div class="two">
<div><b>Discrimination</b>Does the model rank correctly? Are riskier borrowers scored worse than safer ones? Measured by Gini and KS.</div>
<div><b>Calibration</b>Are the predicted levels right? If the model says 2%, do 2% actually default? Measured by observed against expected.</div>
</div>
<p>A model can rank beautifully and be badly calibrated, or be well calibrated and rank poorly. They are fixed by different means, and Mission 06 covers both tests.</p>
<div class="note">Scorecards exist in three flavours by the data available at the time of use: <strong>application</strong> (at origination, no internal history), <strong>behavioural</strong> (existing customer, repayment history available) and <strong>collections</strong> (already delinquent, predicting recovery).</div>`},

{l:"MECHANISM",t:"The build sequence",h:"Nine steps, in <em>order</em>",b:`<div class="lay">
<div><span>1</span><strong>Define the target.</strong> What counts as bad, over what window. Usually 90+ days past due within 12 months.</div>
<div><span>2</span><strong>Set the observation and performance windows.</strong> Characteristics measured at one date, outcome observed over the following period.</div>
<div><span>3</span><strong>Assemble the sample.</strong> Include rejects if reject inference is being attempted; exclude indeterminates.</div>
<div><span>4</span><strong>Bin every variable</strong> into ranges and compute weight of evidence.</div>
<div><span>5</span><strong>Screen by information value</strong> and by business sense. Drop weak and unstable variables.</div>
<div><span>6</span><strong>Fit a logistic regression</strong> on the transformed variables.</div>
<div><span>7</span><strong>Scale</strong> the model output into points.</div>
<div><span>8</span><strong>Group scores into grades</strong> and calibrate a PD to each grade.</div>
<div><span>9</span><strong>Validate, document, monitor.</strong> Not optional and not a formality.</div>
</div>
<div class="note">Step 1 is where most damage is done. Change the bad definition from 90+ to 60+ days and every number downstream changes &mdash; the bad rate, the coefficients, the cut-off, the calibration. It must be fixed before anything else and written down.</div>`},

{l:"FORMULA",t:"Weight of evidence",h:"Turning a category into a <em>number</em>",b:`<p>Raw variables are messy: income is continuous and skewed, employment type is categorical, and both contain missing values. <span class="k">Weight of evidence</span> transforms any variable into a single ordered numeric scale.</p>
<div class="fx"><div class="cap">Weight of evidence, per bin</div>
<div class="eq"><em>WoE</em><sub>i</sub> = ln ( <sup>%Good</sup> &frasl; <sub>%Bad</sub> )</div>
<div class="wh">%Good&nbsp;share of all non-defaulters falling in bin i<br>
%Bad&nbsp;&nbsp;share of all defaulters falling in bin i<br>
Positive WoE means the bin is safer than average; negative means riskier</div></div>
<div class="fx"><div class="cap">Information value, whole variable</div>
<div class="eq"><em>IV</em> = &Sigma; ( %Good<sub>i</sub> &minus; %Bad<sub>i</sub> ) &times; <em>WoE</em><sub>i</sub></div>
<div class="wh">Summed across every bin of the variable</div></div>
<p>Three properties make this the standard transformation: it handles missing values as a bin rather than an exclusion, it linearises the relationship with log-odds so a linear model can use it, and it makes variables of different types directly comparable.</p>`},

{l:"WORKED",t:"Binning one variable",h:"WoE and IV, computed <em>fully</em>",b:`<p>A sample of 10,000 accounts: 9,400 good, 600 bad. The variable is months in current employment.</p>
<div class="dt"><table>
<tr><th>Bin</th><th>Good</th><th>Bad</th><th>%Good</th><th>%Bad</th><th class="n">WoE</th></tr>
<tr><td>0&ndash;12</td><td>1,880</td><td>270</td><td>20.0%</td><td>45.0%</td><td class="n">&minus;0.811</td></tr>
<tr><td>13&ndash;36</td><td>2,820</td><td>180</td><td>30.0%</td><td>30.0%</td><td class="n">0.000</td></tr>
<tr><td>37&ndash;72</td><td>2,820</td><td>90</td><td>30.0%</td><td>15.0%</td><td class="n">+0.693</td></tr>
<tr><td>73+</td><td>1,880</td><td>60</td><td>20.0%</td><td>10.0%</td><td class="n">+0.693</td></tr>
</table></div>
<div class="wk"><div class="h">Information value</div>
<div class="r"><b>Bin 1: (0.200 &minus; 0.450) &times; &minus;0.811</b><span>0.2028</span></div>
<div class="r"><b>Bin 2: (0.300 &minus; 0.300) &times; 0.000</b><span>0.0000</span></div>
<div class="r"><b>Bin 3: (0.300 &minus; 0.150) &times; 0.693</b><span>0.1040</span></div>
<div class="r"><b>Bin 4: (0.200 &minus; 0.100) &times; 0.693</b><span>0.0693</span></div>
<div class="r tot"><b>IV</b><span>0.376</span></div>
</div>
<p>Two readings. The WoE column is <strong>monotonic</strong> &mdash; risk falls steadily as tenure rises &mdash; which is what a credit variable should look like. And bins 3 and 4 have identical WoE, so they carry no distinct information and should be merged.</p>
<div class="note">Conventional IV bands, and these are rules of thumb rather than rules: below 0.02 useless, 0.02&ndash;0.10 weak, 0.10&ndash;0.30 medium, 0.30&ndash;0.50 strong, above 0.50 suspicious &mdash; usually a variable that leaks the outcome, such as a field only populated after default.</div>`},

{l:"FORMULA",t:"Logistic regression",h:"Why <em>odds</em>, not probability",b:`<p>A probability is bounded between 0 and 1; a linear equation is not. Fit a straight line to a probability and it eventually predicts values below zero and above one.</p>
<p>The fix is to model the <strong>log of the odds</strong>, which is unbounded in both directions.</p>
<div class="fx"><div class="cap">The linear form</div>
<div class="eq">ln ( <sup><em>p</em></sup> &frasl; <sub>1 &minus; <em>p</em></sub> ) = &beta;<sub>0</sub> + &beta;<sub>1</sub><em>x</em><sub>1</sub> + &beta;<sub>2</sub><em>x</em><sub>2</sub> + &hellip; + &beta;<sub>k</sub><em>x</em><sub>k</sub></div>
<div class="wh">p&nbsp;&nbsp;probability of default<br>
p / (1 &minus; p)&nbsp;the odds<br>
x&nbsp;&nbsp;the WoE-transformed characteristics<br>
&beta;&nbsp;&nbsp;fitted coefficients</div></div>
<div class="fx"><div class="cap">Solved back for probability</div>
<div class="eq"><em>p</em> = <sup>1</sup> &frasl; <sub>1 + <em>e</em><sup>&minus;(&beta;<sub>0</sub> + &Sigma;&beta;<sub>i</sub><em>x</em><sub>i</sub>)</sub></sup></sub></div>
<div class="wh">The logistic function. Squashes any real number into the interval (0, 1)</div></div>
<p>Logistic regression remains the default for regulatory credit scorecards despite the availability of far more flexible methods, for one reason: <strong>every coefficient is inspectable and explainable</strong>. A supervisor can be shown exactly how much each characteristic contributed, and an adverse decision can be justified to a customer.</p>`},

{l:"MECHANISM",t:"Scaling to points",h:"From log-odds to a <em>score</em>",b:`<p>Model output is a log-odds value, typically between roughly &minus;5 and +5, which is meaningless to a credit officer. Scaling converts it into a familiar points scale by a linear transformation.</p>
<div class="fx"><div class="cap">Score scaling</div>
<div class="eq"><em>Score</em> = <em>Offset</em> + <em>Factor</em> &times; ln(<em>odds</em>)</div>
<div class="eq"><em>Factor</em> = <sup>PDO</sup> &frasl; <sub>ln(2)</sub></div>
<div class="eq"><em>Offset</em> = <em>Score</em><sub>ref</sub> &minus; <em>Factor</em> &times; ln(<em>odds</em><sub>ref</sub>)</div>
<div class="wh">PDO&nbsp;&nbsp;points to double the odds<br>
Score<sub>ref</sub>&nbsp;the anchor score at the reference odds</div></div>
<div class="wk"><div class="h">A standard calibration</div>
<div class="r"><b>Anchor: 600 points at odds of 50:1</b><span>&mdash;</span></div>
<div class="r"><b>Points to double the odds</b><span>20</span></div>
<div class="r"><b>Factor = 20 / ln(2) = 20 / 0.6931</b><span>28.85</span></div>
<div class="r"><b>Offset = 600 &minus; 28.85 &times; ln(50)</b><span>487.1</span></div>
<div class="r tot"><b>Result: 620 points implies odds of 100:1</b><span>PD &asymp; 0.99%</span></div>
</div>
<div class="note">The scaling changes nothing about the model's power. It is presentation. But it is why every score in the market sits in a familiar range, and why "points to double the odds" is worth being able to explain.</div>`},

{l:"DEFINE",t:"The master scale",h:"Continuous score to discrete <em>grade</em>",b:`<p>Capital and provisioning rules operate on rating grades, not on raw scores. A <span class="k">master scale</span> is the fixed ladder of grades, each with a PD range and a representative PD, applied consistently across portfolios.</p>
<div class="dt"><table>
<tr><th>Grade</th><th>PD range</th><th class="n">Assigned PD</th></tr>
<tr><td>1</td><td>0.00% &ndash; 0.05%</td><td class="n">0.03%</td></tr>
<tr><td>2</td><td>0.05% &ndash; 0.15%</td><td class="n">0.10%</td></tr>
<tr><td>3</td><td>0.15% &ndash; 0.40%</td><td class="n">0.25%</td></tr>
<tr><td>4</td><td>0.40% &ndash; 1.00%</td><td class="n">0.65%</td></tr>
<tr><td>5</td><td>1.00% &ndash; 2.50%</td><td class="n">1.60%</td></tr>
<tr><td>6</td><td>2.50% &ndash; 6.00%</td><td class="n">3.90%</td></tr>
<tr><td>7</td><td>6.00% &ndash; 15.0%</td><td class="n">9.50%</td></tr>
<tr><td class="n">D</td><td>Defaulted</td><td class="n">100%</td></tr>
</table></div>
<p>Three design rules make a master scale usable. Grades are <strong>geometrically spaced</strong>, because a move from 0.1% to 0.2% is as meaningful as one from 1% to 2%. No grade holds an excessive share of the portfolio, or the scale is not discriminating. And the scale is <strong>fixed across portfolios</strong>, so grade 5 means the same thing in retail and in corporate.</p>
<div class="note">Illustrative structure. The grade count and boundaries are a bank-specific design decision, but the three rules above are near-universal.</div>`},

{l:"WHY",t:"Point-in-time and through-the-cycle",h:"Two PDs, same <em>name</em>",b:`<p>The same three letters denote two genuinely different quantities, used for different purposes, and this is the distinction that separates people who have used the numbers from people who have read about them.</p>
<div class="two">
<div><b>Through-the-cycle</b>Deliberately smoothed across the economic cycle. A borrower's grade moves only on borrower-specific change, not on the economy. Used for <strong>capital</strong>, so requirements do not swing violently with the cycle.</div>
<div><b>Point-in-time</b>Reflects conditions right now, including forecast macroeconomics. Rises in a downturn for everyone. Used for <strong>provisioning</strong>, because accounting wants today's best estimate.</div>
</div>
<p>Most banks build one core ranking model and apply a conversion &mdash; a scalar, or a satellite macroeconomic model linking observed default rates to variables such as GDP growth, inflation and unemployment &mdash; to move between the two.</p>
<div class="fx"><div class="cap">Typical satellite structure</div>
<div class="eq"><em>PD</em><sub>PIT,t</sub> = f ( <em>PD</em><sub>TTC</sub> , <em>Z</em><sub>t</sub> )</div>
<div class="wh">Z<sub>t</sub>&nbsp;the systematic factor for period t, estimated from macroeconomic variables<br>
A shift in Z moves every borrower's PD without any change in borrower quality</div></div>`},

{l:"TRAP",t:"Where scorecards break",h:"Six failures that actually <em>occur</em>",b:`<div class="sheet q"><div class="h">Failure modes</div>
<div class="r"><b>Leakage</b><span>A variable populated only after the outcome. IV looks spectacular; live performance collapses</span></div>
<div class="r"><b>Wrong window</b><span>Performance window too short and late defaults are labelled good, so the bad rate is understated</span></div>
<div class="r"><b>Reject bias</b><span>Fitted only on accepted applicants, so the model never saw the population it will now score</span></div>
<div class="r"><b>Non-monotonic bins</b><span>Risk zigzags across ranges. Usually overfitting to a sparse bin</span></div>
<div class="r"><b>Unstable population</b><span>The applicant mix shifted after launch. Ranking survives, calibration does not</span></div>
<div class="r"><b>Policy overlay unmodelled</b><span>Hard cut-offs applied outside the model make observed performance untraceable to the score</span></div>
</div>
<p>Only the fourth is a modelling problem. The rest are data and design problems, which is where the majority of scorecard failure actually lives.</p>`},

{l:"RECALL",t:"Mission 03",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>Discrimination vs calibration</b><span>Ranking correctly and predicting the right level are separate properties with separate tests</span></div>
<div class="r"><b>WoE = ln(%Good / %Bad)</b><span>Per bin. Handles missings, linearises against log-odds, makes variables comparable</span></div>
<div class="r"><b>IV = &Sigma;(%Good &minus; %Bad) &times; WoE</b><span>Variable strength. Above 0.5 usually means leakage, not brilliance</span></div>
<div class="r"><b>Logistic models log-odds</b><span>Because probability is bounded and a linear predictor is not. Coefficients stay inspectable</span></div>
<div class="r"><b>Score = Offset + Factor &times; ln(odds)</b><span>Factor = PDO / ln 2. Presentation only, but universally used</span></div>
<div class="r"><b>Master scale</b><span>Geometrically spaced grades, fixed across portfolios, each with a representative PD</span></div>
<div class="r"><b>TTC for capital, PIT for provisions</b><span>One ranking model, converted by a macroeconomic satellite</span></div>
</div>`}
]},

/* ============ 04 ============ */
{n:"04",title:"LGD and EAD",stage:"Measurement",
line:"The two parameters that decide how much is actually lost when default arrives &mdash; and the two most commonly mis-specified quantities in credit risk.",
bullets:["Workout LGD, computed properly","Why discounting the recovery matters","The recovery curve and the resolution tail","Downturn LGD, and why the average is wrong","Collateral, haircuts and the mitigation chain","EAD and the credit conversion factor"],
cards:[

{l:"ORIENT",t:"After the default",h:"The half nobody <em>models</em> well",b:`<p>PD attracts most of the attention because it is the interesting statistical problem. LGD and EAD attract less, and they deserve more, because two structural facts make them harder.</p>
<div class="two">
<div><b>Sparse data</b>LGD can only be observed on defaults. A portfolio with a 2% default rate produces fifty times less LGD data than PD data, and recovery outcomes vary far more than default outcomes.</div>
<div><b>Slow resolution</b>A secured recovery through the legal process can take years. The most recent defaults have no final outcome yet, so the observable sample is systematically biased towards fast, easy resolutions.</div>
</div>
<p>Halving an LGD estimate halves the expected loss just as surely as halving PD does. The parameter is equally load-bearing and considerably less well evidenced.</p>`},

{l:"FORMULA",t:"Workout LGD",h:"Recoveries, discounted and <em>net</em>",b:`<p>The observable definition. Track everything recovered after default, subtract everything spent recovering it, discount it all back to the default date, and express as a share of exposure.</p>
<div class="fx"><div class="cap">Workout loss given default</div>
<div class="eq"><em>LGD</em> = 1 &minus; <sup>&Sigma; ( <em>R</em><sub>t</sub> &minus; <em>C</em><sub>t</sub> ) &frasl; (1 + <em>r</em>)<sup>t</sup></sup> &frasl; <sub><em>EAD</em></sub></div>
<div class="wh">R<sub>t</sub>&nbsp;recovery cash received in period t<br>
C<sub>t</sub>&nbsp;direct and indirect workout costs incurred in period t<br>
r&nbsp;&nbsp;discount rate<br>
t&nbsp;&nbsp;periods elapsed since the default date</div></div>
<p>Three components are routinely omitted and each one biases LGD downwards:</p>
<ul>
<li><strong>Discounting.</strong> Money recovered in year four is worth materially less than money recovered at default.</li>
<li><strong>Indirect costs.</strong> Collections staff, legal panel fees, valuation, custody, the cost of holding a repossessed asset.</li>
<li><strong>Incomplete workouts.</strong> Unresolved cases dropped from the sample, which removes exactly the difficult ones.</li>
</ul>`},

{l:"WORKED",t:"One secured recovery",h:"Discounting changes the <em>answer</em>",b:`<p>A defaulted loan with EAD of &#8377;1,00,00,000, secured on property. Discount rate 12%.</p>
<div class="dt"><table>
<tr><th>Period</th><th>Cash flow</th><th>Nature</th><th class="n">Discounted</th></tr>
<tr><td>Year 1</td><td>&minus;&#8377;3,00,000</td><td>Legal and valuation costs</td><td class="n">&minus;&#8377;2,67,857</td></tr>
<tr><td>Year 2</td><td>+&#8377;20,00,000</td><td>Part recovery, borrower payment</td><td class="n">+&#8377;15,94,388</td></tr>
<tr><td>Year 3</td><td>&minus;&#8377;2,00,000</td><td>Enforcement and holding costs</td><td class="n">&minus;&#8377;1,42,357</td></tr>
<tr><td>Year 4</td><td>+&#8377;55,00,000</td><td>Sale of secured property</td><td class="n">+&#8377;34,95,127</td></tr>
</table></div>
<div class="wk"><div class="h">The two answers</div>
<div class="r"><b>Undiscounted net recovery</b><span>&#8377;70,00,000</span></div>
<div class="r"><b>Undiscounted LGD = 1 &minus; 70/100</b><span>30.0%</span></div>
<div class="r"><b>Discounted net recovery</b><span>&#8377;46,79,301</span></div>
<div class="r tot"><b>Discounted LGD = 1 &minus; 46.79/100</b><span>53.2%</span></div>
</div>
<p>The same recovery, the same collateral, the same borrower. Ignoring the time value of a four-year workout understates LGD by <strong>23 percentage points</strong> &mdash; which flows straight through to expected loss and to capital.</p>
<div class="note">This is why the discount rate is a governed assumption, not a modelling convenience. Choices range from the facility's original effective rate to a risk-adjusted rate reflecting the uncertainty of recovery cash flows.</div>`},

{l:"PICTURE",t:"The recovery curve",h:"Fast money, then a long <em>tail</em>",b:`<p>Recoveries do not arrive evenly. The shape is consistent enough across portfolios to be worth carrying.</p>
<div class="bars">
<div class="row"><div class="lb"><span>Months 0&ndash;6 &mdash; cure and self-repair</span><span>~35% of total</span></div><div class="tr"><i style="width:35%"></i></div></div>
<div class="row"><div class="lb"><span>Months 7&ndash;18 &mdash; negotiated settlement</span><span>~25%</span></div><div class="tr"><i style="width:25%"></i></div></div>
<div class="row"><div class="lb"><span>Months 19&ndash;48 &mdash; enforcement and sale</span><span>~30%</span></div><div class="tr" ><i class="b" style="width:30%"></i></div></div>
<div class="row"><div class="lb"><span>Beyond 48 months</span><span>~10%</span></div><div class="tr"><i class="d" style="width:10%"></i></div></div>
</div>
<p>Two operational consequences follow. A <strong>cure</strong> &mdash; a defaulted account returning to performing without loss &mdash; is a large share of resolutions and must be modelled explicitly, or LGD is overstated. And the tail is long enough that any sample of recent defaults is dominated by the fast cases.</p>
<div class="note">Illustrative proportions to show the shape, not portfolio-specific figures. Unsecured personal lending resolves far faster and far worse; project and infrastructure exposures resolve far slower.</div>`},

{l:"WHY",t:"Downturn LGD",h:"Why the average is the wrong <em>number</em>",b:`<p>Capital is calculated for a bad year. In a bad year, two things happen simultaneously and they are not independent.</p>
<div class="flow">
<div class="n"><b>More borrowers default</b>PD rises across the portfolio</div>
<div class="a">&#43;</div>
<div class="n"><b>Recoveries get worse</b>Collateral is being sold into a falling market by many sellers at once, legal processes are congested, and buyers are scarce</div>
<div class="a">&#61;</div>
<div class="n"><b>Loss compounds</b>Using average LGD with stressed PD understates the bad year materially</div>
</div>
<p><span class="k">Downturn LGD</span> is the recovery expected under adverse conditions, not the long-run average. Establishing it requires identifying which historical periods were downturns for that portfolio, which is itself a documented and challenged judgement.</p>
<div class="note">The general rule is worth carrying: collateral is worth least at precisely the moment it must be sold. Any framework that treats PD and LGD as independent is understating tail loss by construction.</div>`},

{l:"MECHANISM",t:"Collateral and haircuts",h:"The mitigation <em>chain</em>",b:`<p>Collateral reduces LGD, but only where it survives four tests in sequence. Each is a data attribute, and each fails somewhere in practice.</p>
<div class="lay">
<div><span>1</span><strong>Eligible.</strong> The collateral type is recognised by the applicable rulebook. Not everything pledged qualifies.</div>
<div><span>2</span><strong>Legally enforceable.</strong> The security interest is perfected and can actually be enforced in the relevant jurisdiction.</div>
<div><span>3</span><strong>Valued.</strong> A current, independent valuation exists, refreshed at a governed frequency.</div>
<div><span>4</span><strong>Linked.</strong> The collateral record is joined to the facility record in the data, and is not double-counted across facilities.</div>
</div>
<div class="fx"><div class="cap">Recognised collateral value after haircut</div>
<div class="eq"><em>C</em><sub>adj</sub> = <em>C</em> &times; (1 &minus; <em>H</em><sub>c</sub>) &times; (1 &minus; <em>H</em><sub>fx</sub>)</div>
<div class="wh">C&nbsp;&nbsp;market value of the collateral<br>
H<sub>c</sub>&nbsp;haircut for price volatility of the collateral type<br>
H<sub>fx</sub>&nbsp;further haircut where collateral and exposure are in different currencies</div></div>
<div class="note">Step 4 is the one that fails silently. Collateral held in a separate system, unlinked to the exposure, is economically real and regulatorily invisible &mdash; the bank holds the security and gets no benefit for it.</div>`},

{l:"FORMULA",t:"EAD and the CCF",h:"Converting a promise into an <em>exposure</em>",b:`<p>For a term loan, EAD is close to the outstanding balance. For anything with an undrawn component &mdash; overdrafts, cash credit, revolving limits, guarantees, letters of credit &mdash; it is not.</p>
<div class="fx"><div class="cap">Exposure at default</div>
<div class="eq"><em>EAD</em> = <em>Drawn</em> + <em>CCF</em> &times; <em>Undrawn</em></div>
<div class="wh">CCF&nbsp;credit conversion factor &mdash; the share of the undrawn limit expected to be drawn before default</div></div>
<p>The behavioural fact underneath: a borrower approaching distress draws whatever remains available. The limit is not a ceiling on exposure; it is a ceiling on how much worse the exposure can get.</p>
<div class="dt"><table>
<tr><th>Facility type</th><th>Character</th></tr>
<tr><td>Unconditionally cancellable</td><td>Bank may withdraw without notice. Low conversion, but no longer zero under revised standards</td></tr>
<tr><td>Committed short-term</td><td>Moderate conversion</td></tr>
<tr><td>Committed long-term</td><td>Higher conversion</td></tr>
<tr><td>Direct credit substitutes</td><td>Full conversion &mdash; economically equivalent to a drawn loan</td></tr>
</table></div>
<div class="note">Revised standardised approach rules have made conversion factors more risk-sensitive and removed maturity-based distinctions for some commitment types. The direction of travel is consistent: fewer zero-conversion categories, more granularity.</div>`},

{l:"TRAP",t:"The EAD data problem",h:"You cannot observe what was not <em>stored</em>",b:`<p>Estimating a conversion factor requires knowing the drawn and undrawn balances <strong>at a point in time before default</strong>, typically twelve months before, and comparing them with the balance at default.</p>
<div class="fx"><div class="cap">Realised conversion factor, per observation</div>
<div class="eq"><em>CCF</em><sub>obs</sub> = <sup><em>E</em><sub>default</sub> &minus; <em>E</em><sub>ref</sub></sup> &frasl; <sub><em>L</em><sub>ref</sub> &minus; <em>E</em><sub>ref</sub></sub></div>
<div class="wh">E<sub>ref</sub>&nbsp;drawn balance at the reference date<br>
L<sub>ref</sub>&nbsp;sanctioned limit at the reference date<br>
E<sub>default</sub>&nbsp;drawn balance at default</div></div>
<p>Most core systems overwrite the limit and the balance rather than retaining a dated history. If the sanctioned limit twelve months before default was never stored, the denominator cannot be reconstructed and the parameter cannot be estimated from the bank's own data.</p>
<div class="note">Retaining a monthly point-in-time snapshot of limit and drawn balance is one of the highest-value and least glamorous data requirements in credit risk. It cannot be retrofitted &mdash; history not captured is history lost.</div>`},

{l:"RECALL",t:"Mission 04",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>LGD = 1 &minus; discounted net recovery / EAD</b><span>Discounting, indirect costs and incomplete workouts all bias it downwards if omitted</span></div>
<div class="r"><b>Discounting is not optional</b><span>A four-year workout can move LGD by twenty points or more</span></div>
<div class="r"><b>Cures matter</b><span>A large share of defaults resolve without loss. Ignoring them overstates LGD</span></div>
<div class="r"><b>Downturn LGD</b><span>PD and LGD deteriorate together. Average LGD with stressed PD understates the tail</span></div>
<div class="r"><b>C<sub>adj</sub> = C &times; (1&minus;H<sub>c</sub>) &times; (1&minus;H<sub>fx</sub>)</b><span>Eligible, enforceable, valued, linked. Failure at any step removes the benefit</span></div>
<div class="r"><b>EAD = Drawn + CCF &times; Undrawn</b><span>Requires dated history of limit and balance, which most systems overwrite</span></div>
</div>`}
]},
/* ============ 05 ============ */
{n:"05",title:"Watching the book",stage:"Measurement",
line:"What a portfolio is actually doing, month to month &mdash; the buckets, the movement between them, and the reports that reveal deterioration before it becomes loss.",
bullets:["DPD buckets and the Indian classification ladder","SMA and the early warning window","Roll rates, computed properly","The transition matrix","Vintage analysis, and why it beats headline ratios","Flow and stock, and the ratio traps"],
cards:[

{l:"MECHANISM",t:"The delinquency ladder",h:"Days past due, in <em>buckets</em>",b:`<p>Every monitoring system starts by bucketing accounts on days past due. <span class="k">DPD</span> counts from the date an amount became overdue and was not paid.</p>
<div class="dt"><table>
<tr><th>Bucket</th><th>DPD</th><th>Status</th></tr>
<tr><td>Current</td><td>0</td><td>Nothing overdue</td></tr>
<tr><td>SMA-0</td><td>1&ndash;30</td><td>Overdue but not yet a formal stress category</td></tr>
<tr><td>SMA-1</td><td>31&ndash;60</td><td>Special mention</td></tr>
<tr><td>SMA-2</td><td>61&ndash;90</td><td>Special mention, last stop before impairment</td></tr>
<tr class="hi"><td>NPA</td><td>90+</td><td>Non-performing. The classification boundary</td></tr>
</table></div>
<p>The <span class="k">SMA</span> framework &mdash; special mention accounts &mdash; is the Indian early warning layer sitting below the 90-day boundary. Its purpose is to force recognition of stress before it becomes an NPA, and for larger exposures the categorisation is reported centrally so that stress at one lender is visible to others.</p>
<div class="note">The 90-day boundary is retained under the expected-loss provisioning framework. Classification and provisioning are being decoupled: the account is still an NPA at 90 days, but what is provided against it is computed differently. Mission 10 covers that split.</div>`},

{l:"DEFINE",t:"The NPA ladder below",h:"Three stages after the <em>boundary</em>",b:`<p>Once an account crosses into non-performing, it descends a second ladder based on how long it has stayed there.</p>
<div class="lay">
<div><span>1</span><strong>Sub-standard.</strong> NPA for up to twelve months. Credit weaknesses are evident and full recovery is in doubt.</div>
<div><span>2</span><strong>Doubtful.</strong> Sub-standard for more than twelve months. Collection in full is highly questionable. Sub-tiered further by how long it has been doubtful.</div>
<div><span>3</span><strong>Loss.</strong> Identified as uncollectible by the bank, its auditors or the supervisor, though some salvage value may remain.</div>
</div>
<p>Under the incurred-loss framework, each rung carried a prescribed minimum provisioning percentage, escalating with age and distinguishing secured from unsecured portions.</p>
<p>Two further terms travel with this ladder and are frequently confused. <span class="k">Restructuring</span> is a change to terms granted because of financial difficulty. <span class="k">Write-off</span> removes the asset from the balance sheet but does not extinguish the legal claim &mdash; recovery efforts continue, and recoveries after write-off are a separate reported line.</p>
<div class="note">Gross NPA is before provisions; net NPA is after. A falling net NPA ratio with a flat gross NPA ratio means provisioning increased, not that credit quality improved. The two must be read together.</div>`},

{l:"FORMULA",t:"Roll rate",h:"The movement, not the <em>level</em>",b:`<p>A stock of arrears tells you where the book is. A <span class="k">roll rate</span> tells you where it is going, which is the more actionable quantity.</p>
<div class="fx"><div class="cap">Roll rate, bucket i to bucket i+1</div>
<div class="eq"><em>RR</em><sub>i&rarr;i+1</sub> = <sup>Balance in bucket i+1 at <em>t</em>+1</sup> &frasl; <sub>Balance in bucket i at <em>t</em></sub></div>
<div class="wh">Computed on the same cohort of accounts, one period apart<br>
By value for capital and provisioning; by count for operational and collections purposes</div></div>
<p>Chaining the roll rates gives the probability that a currently delinquent account eventually reaches non-performing.</p>
<div class="wk"><div class="h">Chained roll to NPA</div>
<div class="r"><b>Current &rarr; 1&ndash;30</b><span>4.0%</span></div>
<div class="r"><b>1&ndash;30 &rarr; 31&ndash;60</b><span>35.0%</span></div>
<div class="r"><b>31&ndash;60 &rarr; 61&ndash;90</b><span>55.0%</span></div>
<div class="r"><b>61&ndash;90 &rarr; 90+</b><span>75.0%</span></div>
<div class="r tot"><b>Current &rarr; NPA = 4% &times; 35% &times; 55% &times; 75%</b><span>0.578%</span></div>
</div>
<p>The shape is the point. Roll rates <strong>rise steeply as buckets deepen</strong> &mdash; most one-month arrears cure, most three-month arrears do not. This is why collections effort concentrates in the early buckets, where the marginal account is still winnable.</p>`},

{l:"PICTURE",t:"The transition matrix",h:"Every movement, one <em>grid</em>",b:`<p>Generalise the roll rate across all states at once and the result is a <span class="k">transition matrix</span>: the probability of moving from any grade or bucket to any other over a fixed period.</p>
<div class="dt"><table>
<tr><th>From \\ To</th><th>1</th><th>2</th><th>3</th><th>4</th><th>D</th></tr>
<tr><td>Grade 1</td><td class="n">92.0</td><td>6.5</td><td>1.2</td><td>0.2</td><td class="g">0.1</td></tr>
<tr><td>Grade 2</td><td>3.1</td><td class="n">88.4</td><td>7.0</td><td>1.2</td><td class="g">0.3</td></tr>
<tr><td>Grade 3</td><td>0.4</td><td>6.8</td><td class="n">84.1</td><td>7.5</td><td class="g">1.2</td></tr>
<tr><td>Grade 4</td><td>0.1</td><td>1.1</td><td>9.4</td><td class="n">83.5</td><td class="g">5.9</td></tr>
</table></div>
<p>Read it row-wise: each row sums to 100 and describes where that grade's accounts went. Three properties are diagnostic:</p>
<ul>
<li>The <strong>diagonal</strong> is stability. A thin diagonal means grades are not persistent, which usually means the rating is noisy rather than that the book is volatile.</li>
<li>The <strong>last column</strong> is the realised default rate per grade, and it is the direct empirical check on whether the master scale PDs are calibrated.</li>
<li><strong>Asymmetry</strong> above and below the diagonal shows net migration direction &mdash; the single most useful early signal of portfolio deterioration.</li>
</ul>
<div class="note">Illustrative figures. Built from a bank's own grade history, this same grid is the input to PD calibration, to migration-based stress testing and to significant-increase-in-credit-risk thresholds.</div>`},

{l:"MECHANISM",t:"Vintage analysis",h:"Comparing like with <em>like</em>",b:`<p>A headline NPA ratio mixes loans booked last month with loans booked six years ago. Since a loan cannot default before it is written, rapid growth mechanically dilutes the ratio &mdash; and the dilution reverses later, exactly when the new book starts to season.</p>
<p><span class="k">Vintage analysis</span> removes the distortion. Group accounts by origination cohort and plot the bad rate against <strong>months on book</strong> rather than against calendar time.</p>
<div class="bars">
<div class="row"><div class="lb"><span>FY23 cohort at 12 months on book</span><span>1.2%</span></div><div class="tr"><i style="width:24%"></i></div></div>
<div class="row"><div class="lb"><span>FY24 cohort at 12 months on book</span><span>1.4%</span></div><div class="tr"><i style="width:28%"></i></div></div>
<div class="row"><div class="lb"><span>FY25 cohort at 12 months on book</span><span>2.3%</span></div><div class="tr"><i class="d" style="width:46%"></i></div></div>
<div class="row"><div class="lb"><span>FY26 cohort at 12 months on book</span><span>2.9%</span></div><div class="tr"><i class="d" style="width:58%"></i></div></div>
</div>
<p>Each cohort is measured at the same age, so the comparison is valid. The pattern above says underwriting quality is deteriorating &mdash; and it says so roughly two years before the headline ratio will show it, because the newest cohorts are still small relative to the book.</p>
<div class="note">Vintage curves also reveal the <strong>seasoning profile</strong>: the months-on-book range where most defaults emerge. Knowing it tells you how long a new product must run before its performance can be judged at all.</div>`},

{l:"TRAP",t:"Ratio traps",h:"Four denominators that <em>lie</em>",b:`<div class="sheet q"><div class="h">Where portfolio ratios mislead</div>
<div class="r"><b>Growth dilution</b><span>A rapidly growing book shows a falling NPA ratio while absolute stress rises. Denominator effect only</span></div>
<div class="r"><b>Write-off flattery</b><span>Writing off NPAs reduces both numerator and gross advances. The ratio improves; nothing recovered</span></div>
<div class="r"><b>Sale of assets</b><span>Transferring stressed exposures out removes them from the ratio without any change in underlying quality</span></div>
<div class="r"><b>Bucket cliff</b><span>Accounts held at 89 days by minimal collections activity. The stock stays out of NPA; the risk does not</span></div>
</div>
<p>The general defence is to read <strong>flow alongside stock</strong>: gross slippage into NPA during the period, upgrades out, recoveries, write-offs, and the closing balance reconciled from the opening balance. A movement schedule cannot be flattered by a denominator.</p>
<div class="fx"><div class="cap">NPA movement reconciliation</div>
<div class="eq"><em>NPA</em><sub>close</sub> = <em>NPA</em><sub>open</sub> + <em>Slippage</em> &minus; <em>Upgrades</em> &minus; <em>Recoveries</em> &minus; <em>Write-offs</em></div>
<div class="wh">Every published NPA figure should reconcile through this identity. Where it does not, something is being netted silently</div></div>`},

{l:"DEFINE",t:"Early warning",h:"Signals before the first <em>missed payment</em>",b:`<p>DPD is a lagging indicator: by the time an instalment is missed, the deterioration happened months earlier. An <span class="k">early warning system</span> looks for the earlier signal.</p>
<div class="three">
<div><b>Transactional</b>Falling current account credits, cheque returns, sustained limit utilisation near 100%, rising cash withdrawals</div>
<div><b>External</b>Rating downgrade, litigation filings, statutory dues in arrears, adverse news, promoter share pledging</div>
<div><b>Behavioural</b>Bureau enquiries elsewhere, new unsecured borrowing, deterioration in other lenders' facilities</div>
</div>
<p>Two design rules make an early warning system usable rather than ignored. Each trigger carries a <strong>mandated action with a deadline</strong>, not merely an alert. And the trigger set is <strong>back-tested against actual defaults</strong>, because a signal that fires on everything is indistinguishable from noise.</p>
<div class="note">The dominant failure is alert volume. A system generating more alerts than the credit team can action trains the team to close them without reading, which is worse than having no system, because it manufactures documented evidence that the warning was seen and dismissed.</div>`},

{l:"RECALL",t:"Mission 05",h:"What is now <em>owned</em>",b:`<div class="sheet"><div class="h">Carry these forward</div>
<div class="r"><b>SMA-0/1/2 then NPA at 90</b><span>The early warning layer sits below the classification boundary</span></div>
