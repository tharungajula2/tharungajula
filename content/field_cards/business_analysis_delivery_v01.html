<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --surface:#131317; --raise:#1A1A20;
  --ink:#EAE8E3; --body:#C6C4BE; --muted:#84837E; --faint:#4A4A50;
  --accent:#E0A458; --accent-dim:#8A6634; --line:#26262C;
  --ok:#7FA88A; --warn:#C97B6B; --live:#7B9DC4; --live-dim:#3E5468;
  --sp:clamp(20px,5.5vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;background:var(--bg);color:var(--body);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.65;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ---------- chrome ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:60}
#bar i{display:block;height:100%;background:var(--accent);width:0}
#top{
  position:fixed;top:2px;left:0;right:0;height:48px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp);background:rgba(11,11,13,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
#brand{font-family:'Instrument Serif',serif;font-size:17.5px;color:var(--ink)}
#brand em{font-style:italic;color:var(--accent)}
#count{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;background:var(--surface)
}
#count:hover,#count:focus-visible{color:var(--accent);border-color:var(--accent-dim)}
#rail{position:fixed;right:7px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px}
#rail b{width:3px;height:13px;border-radius:2px;background:var(--faint);transition:background .25s}
#rail b.on{background:var(--accent)}
@media(max-width:560px){#rail{display:none}}

/* ---------- the scroll ---------- */
main{max-width:660px;margin:0 auto;padding:70px var(--sp) 0}
section{
  padding:48px 0 54px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease
}
section.in{opacity:1;transform:none}
section:last-child{border-bottom:none;padding-bottom:110px}

.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.label{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
  background:var(--accent);padding:4px 8px;border-radius:3px
}
.label.q{background:var(--warn)}
.label.r{background:var(--ok)}
.label.l{background:var(--live)}
.tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,7.8vw,42px);line-height:1.14;color:var(--ink);margin:0 0 20px;letter-spacing:-.012em}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 15px}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.k{color:var(--accent);font-weight:500}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--raise);padding:2px 6px;border-radius:3px;color:var(--ink)}
.note{border-left:2px solid var(--accent-dim);padding:2px 0 2px 16px;margin:20px 0;color:var(--muted);font-size:14.5px;line-height:1.58}
ul{margin:0 0 15px;padding-left:0;list-style:none}
li{position:relative;padding-left:19px;margin-bottom:9px}
li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:1px;background:var(--accent)}

/* ---------- dated live data ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--live);border:1px solid var(--live-dim);border-radius:999px;
  padding:4px 10px;margin:0 0 12px
}
.stamp:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--live)}
.src{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-top:10px;line-height:1.7}

/* ---------- data tables ---------- */
.dt{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.dt::-webkit-scrollbar{height:5px}
.dt::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dt table{width:100%;border-collapse:collapse;margin:0;font-size:12.6px;min-width:430px}
.dt th{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#101014
}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);width:auto}
.dt tr:last-child td{border-bottom:none}
.dt td:first-child{color:var(--ink);font-weight:500}
.dt .n{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.dt .g{color:var(--muted)}
.dt tr.hi td{background:rgba(224,164,88,.06)}

table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink);font-weight:500;width:34%}
tr:last-child td{border-bottom:none}

/* ---------- charts ---------- */
.bars{margin:22px 0;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bars .row{margin-bottom:13px}
.bars .row:last-child{margin-bottom:0}
.bars .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:10px}
.bars .lb span:first-child{color:var(--ink)}
.bars .lb span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap}
.bars .tr{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .tr i.b{background:var(--live)}
.bars .tr i.c{background:var(--ok)}
.bars .tr i.d{background:var(--warn)}

.bars .r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bars .r em{font-style:normal;flex:0 0 34%;color:var(--body)}
.bars .r i{font-style:normal;height:15px;background:var(--accent-dim);border-radius:3px;display:block}
.bars .r i.hi{background:var(--warn)}
.bars .r u{text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat div{padding:13px 11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.stat b{display:block;font-family:'Instrument Serif',serif;font-size:23px;color:var(--accent);line-height:1.1;margin-bottom:5px}
.stat span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5;display:block}
@media(max-width:430px){.stat{grid-template-columns:1fr 1fr}}

/* ---------- code ---------- */
.code{position:relative;margin:20px 0;background:#0E0E12;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.code pre{margin:0;padding:15px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.2px;line-height:1.72;color:#D6D3CC;-webkit-overflow-scrolling:touch}
.code pre::-webkit-scrollbar{height:5px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#131318}
.code .cap span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.code .cp{background:none;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.code .cp:hover{color:var(--accent);border-color:var(--accent-dim)}
.code .cp.done{color:var(--ok);border-color:var(--ok)}
.code i{font-style:normal}
.tk{color:#C58FD4}.ts{color:#9CC49A}.tc{color:#5E5E68;font-style:italic}.tn{color:#E0A458}.tf{color:#7FA8D4}

/* ---------- cheatsheet ---------- */
.sheet{margin:20px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.sheet .r{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;background:var(--surface)}
.sheet .r:last-child{border-bottom:none}
.sheet .r b{flex:0 0 33%;color:var(--ink);font-weight:500}
.sheet .r span{color:var(--body)}
.sheet.q .h{background:var(--warn)}
.sheet.b .h{background:var(--live)}
.sheet.g .h{background:var(--ok)}

/* ---------- diagrams ---------- */
.dg{margin:23px 0;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dg-t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:15px}
.lay{display:flex;flex-direction:column-reverse;gap:5px}
.lay div{padding:11px 13px;border-radius:5px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;display:flex;align-items:baseline;gap:10px}
.lay div span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;width:14px}
.lay div.hot{border-color:var(--accent);background:rgba(224,164,88,.09);color:var(--ink)}
.cross{margin-top:7px;padding:9px 13px;border:1px dashed var(--accent-dim);border-radius:5px;font-size:12px;color:var(--muted);text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.flow{display:flex;flex-direction:column}
.flow .n{padding:11px 14px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.flow .n b{display:block;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:500}
.flow .a{text-align:center;color:var(--accent);font-size:15px;line-height:1;padding:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.two>div{padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:13px}
.two>div b{display:block;color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.three>div{padding:12px 11px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-size:12.4px}
.three>div b{display:block;color:var(--accent);font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:430px){.two,.three{grid-template-columns:1fr}}

/* ---------- covers ---------- */
.cover{border-bottom:none}
.pcover{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.pcover h1,.mcover h1{font-size:clamp(37px,10.5vw,58px);margin-bottom:22px}
.sub{font-size:16.5px;color:var(--muted);max-width:32em}
.rule{height:1px;background:var(--line);margin:26px 0}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:2}
.mcover{padding-top:64px;padding-bottom:26px}
.mline{font-size:15px;color:var(--muted);max-width:30em}
.inthis{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.scrollcue{margin-top:38px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ---------- index ---------- */
#idx{position:fixed;inset:0;z-index:70;background:rgba(11,11,13,.98);backdrop-filter:blur(20px);overflow-y:auto;display:none}
#idx.on{display:block}
#idx .in{max-width:660px;margin:0 auto;padding:66px var(--sp) 60px}
#idx h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;color:var(--ink);margin:0 0 26px}
#idxlist .row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:14px;align-items:baseline}
#idxlist .row:hover .t{color:var(--accent)}
#idxlist .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex-shrink:0}
#idxlist .row .t{color:var(--ink);font-size:15px;transition:color .15s}
#idxlist .row .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0}
#close{position:fixed;top:13px;right:var(--sp);z-index:71;background:var(--surface);border:1px solid var(--line);color:var(--body);width:36px;height:36px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
#idx.on ~ #close{display:block}
#toTop{position:fixed;right:16px;bottom:20px;z-index:56;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{color:var(--accent);border-color:var(--accent-dim)}

/* ================= v02 ADDITIONS ================= */

/* links — official source blocks */
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim);transition:color .15s,border-color .15s}
a:hover{color:var(--ink);border-color:var(--ink)}
.docs{margin:20px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--live);border-radius:7px;font-size:12.6px;line-height:1.9}
.docs b{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:6px;font-weight:500}
.docs a{display:block;border-bottom:none;color:var(--body)}
.docs a:hover{color:var(--accent)}
.docs a:before{content:'\2192\00a0';color:var(--live)}

/* formulae */
.fx{margin:20px 0;padding:16px 15px;background:#0E0E12;border:1px solid var(--line);border-radius:9px;text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fx .cap{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.fx .eq{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);line-height:2.1;white-space:normal}
.fx .eq em{font-style:italic;color:var(--accent);font-family:'Instrument Serif',serif;font-size:17px}
.fx .eq .nw{white-space:nowrap}
.fx .wh{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:left;line-height:1.8;font-family:'JetBrains Mono',monospace}

/* stacked fractions — never sup/frasl/sub */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px}
.fr>i{font-style:normal;display:block;padding:0 7px;line-height:1.4;white-space:nowrap}
.fr>i:first-child{border-bottom:1px solid var(--muted);padding-bottom:3px}
.fr>i:last-child{padding-top:3px}

/* worked examples */
.wk{margin:20px 0;border:1px solid var(--accent-dim);border-radius:9px;overflow:hidden}
.wk .h{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px}
.wk .r{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;background:var(--surface)}
.wk .r:last-child{border-bottom:none}
.wk .r b{flex:1;color:var(--body);font-weight:400}
.wk .r span{font-family:'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.wk .r.tot{background:var(--raise)}
.wk .r.tot b{color:var(--ink);font-weight:600}
.wk .r.tot span{color:var(--ink)}

@media(max-width:560px){
 .fx{text-align:left;padding:14px 12px}
 .fx .eq{font-size:12.5px;line-height:2}
 .fx .eq em{font-size:15px}
 .fx .cap{text-align:left}
 .fx .wh{font-size:10.5px;line-height:1.75}
 .fr>i{padding:0 5px}
 .wk .r{flex-wrap:wrap;gap:4px}
 .wk .r b{flex:1 1 100%}
 .wk .r span{flex:0 0 auto}
 .sheet .r{flex-direction:column;gap:3px}
 .sheet .r b{flex:none}
}
@media(max-width:430px){
 .fx{padding:12px 10px}
 .fx .eq{font-size:11.5px}
 .fx .eq em{font-size:14px}
}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"><div id="brand">Field <em>Cards</em></div><button id="count">INDEX</button></div>
<div id="rail"></div>
<main id="main"></main>
<button id="toTop" aria-label="Back to top">&#9650;</button>
<div id="idx"><div class="in"><h2>Contents</h2><div id="idxlist"></div></div></div>
<button id="close" aria-label="Close index">&#10005;</button>

<script>
const DATE = "19 August 2026";
/* ============================================================
   FIELD CARDS — PACK TEMPLATE
   Extracted from investing_FINAL_v02.html. Design is locked:
   do not change tokens, CSS, or the renderer. Fill the data only.

   PACK FIELDS
     title     headline on the cover, one <em> allowed
     sub       one or two sentences under it
     floor     what the pack assumes, e.g. "No prior knowledge assumed"
     dateline  e.g. "Figures verified" — sits before DATE
     intro     optional note on the cover; delete for a pack with no LIVE cards

   MISSION FIELDS
     title     the mission name
     stage     short spine word, shown on every card in the mission
     line      one sentence under the mission title
     bullets   optional array — renders as "In this mission"
     cards     array, 7-18 cards, last one is always RECALL
     n         auto-generated, leave as is

   CARD FIELDS
     l  label   ORIENT DEFINE WHY MECHANISM PICTURE TRAP LIVE CHEAT
                NUMBERS RECALL CLOSE   (colour is automatic)
     t  tag     two or three words, shown next to the stage
     h  headline  one <em> for emphasis
     b  body     raw HTML — see the components below

   BODY COMPONENTS  (all styled already, no new CSS)
     <p> <ul><li> <strong> <em> <code>
     <span class="k">        accent for a key term
     <div class="note">      the aside
     <div class="stamp">     collection date — LIVE cards only
     <div class="src">       source line
     <div class="dt"><table> data table, cells .n for figures .g for context
                             <tr class="hi"> highlights a row
     <div class="flow">      ordered steps, .n boxes with .a arrows between
     <div class="two"> .three  side-by-side blocks
     <div class="bars">      horizontal bar chart, bars .b .c .d recolour
     <div class="stat">      three big numbers
     <div class="dg">        diagram frame, .dg-t title, .lay layers, .cross band
     <div class="code" data-cap="python"><pre>  highlighted, copy button auto
     <div class="sheet">     lookup table, .q warning .g good .b live
   ============================================================ */

const P = {
 "title": "Business Analysis and Product <em>Delivery</em>",
 "sub": "How a business problem becomes a running system in banking and lending. Discovery, requirements, solution design, data, assurance, release, and the product decisions in between. Method is jurisdiction-neutral; where regulation binds, this pack is India-first.",
 "floor": "No prior knowledge assumed",
 "dateline": "Sources verified",
 "intro": "Two kinds of card. <strong>Mechanism</strong> cards explain how something works and do not go stale. <strong>Live</strong> cards carry a collection date and do. Risk data aggregation is covered here only from the commissioning side; release and delivery practice has no standards body and is labelled as convention where it appears.",
 "missions": [
  {
   "n": "01",
   "title": "Where change comes from",
   "stage": "Ground",
   "line": "Before any requirement is written, something has to arrive on somebody's desk. This mission is about what arrives, who it lands on, and why the machine that processes it moves the way it does.",
   "bullets": [
    "Name the five things that start a change in a bank",
    "Name every role around the table and say what each one signs",
    "Tell a project apart from a change and from business-as-usual",
    "Say what the slowness of regulated delivery actually buys"
   ],
   "cards": [
    {
     "l": "ORIENT",
     "t": "What arrives",
     "h": "Nobody ever asks for a <em>system</em>",

     "b": "<p>Delivery inside a regulated institution is slower than delivery outside one, by a wide margin, and every person who arrives from a faster environment finds this maddening. It is worth knowing what the money is being spent on, because some of it is genuinely waste and some of it is the product.</p>\n<div class='two'><div><b>What it buys</b>Three things, all of them real. <strong>Auditability</strong> — the ability to show, two years later, who decided what and on what evidence. <strong>Reversibility</strong> — the ability to put the system back. <strong>Provability</strong> — the ability to demonstrate the rule was applied correctly to a specific customer on a specific date.</div>\n<div><b>What it wastes</b>Also three. Approvals that no longer have a decision attached to them. Documents written because a template exists rather than because someone will read them. And review boards that meet fortnightly regardless of whether anything needs reviewing.</div></div>\n<p>The distinction is testable. <strong>Ask what would go wrong if this step were skipped, and ask who would find out.</strong> If the answer to both is nothing and nobody, it is waste. If the answer is a customer is treated wrongly and nobody can prove otherwise, it is the product.</p>\n<p>A useful way to hold it: the bank is not primarily selling loans or accounts. It is selling the promise that money placed with it is handled correctly and can be shown to have been handled correctly. <span class='k'>Evidence</span> is not overhead on top of the product. In a regulated business it is a large part of the product.</p>"

     "l": "ORIENT",
     "t": "The gap",
     "h": "The ask, the need, and the <em>distance</em> between them",
     "b": "<p>Someone says: <em>we need a dashboard showing daily disbursals by branch.</em> That is an <span class='k'>ask</span> — a solution, already chosen, arriving in the shape of a request.</p>\n<p>Underneath it is a <span class='k'>need</span>, and the need is usually one layer down. Perhaps a regional manager is being asked in a Monday meeting how the month is tracking and cannot answer. Perhaps two branches are booking disbursals on different days and the totals never agree. Perhaps somebody was told off once and wants evidence to hand.</p>\n<p>Those three needs produce three different systems. The first wants a weekly figure on a phone. The second is a data quality problem and a dashboard would make it worse by displaying the disagreement daily. The third does not want a dashboard at all.</p>\n<p><strong>Discovery is the work of finding out which one it is.</strong> The technique for that is not clever, and it is not adversarial. It is asking what the person would do with the thing once they had it, and listening to the answer rather than to the request.</p>\n<div class='note'>The formal name for this discipline is <span class='k'>elicitation</span> — a deliberate word, because it means drawing something out rather than receiving it. The International Institute of Business Analysis, which publishes the widely used body of knowledge for this field, treats it as one of six knowledge areas, and it is the one where inexperienced analysts lose the most time by skipping it.</div>"

    {
     "l": "MECHANISM",
     "t": "Six techniques",
     "h": "How to find out, and when each one <em>works</em>",
     "b": "<p>There are around fifty named techniques in the body of knowledge. Six carry most of the load, and the skill is choosing rather than knowing.</p>\n<div class='dt'><table>\n<tr><th>Technique</th><th>Best for</th><th>Fails when</th></tr>\n<tr class='hi'><td>One-to-one interview</td><td class='n'>Depth, and anything political</td><td class='g'>You need consensus, not information</td></tr>\n<tr><td>Workshop</td><td class='n'>Resolving disagreement in the room</td><td class='g'>One senior voice is present and nobody contradicts it</td></tr>\n<tr><td>Observation</td><td class='n'>Finding the workaround nobody mentions</td><td class='g'>People perform differently while watched</td></tr>\n<tr><td>Document analysis</td><td class='n'>Rules, policies, existing specifications</td><td class='g'>The document describes the intended process, not the real one</td></tr>\n<tr><td>Prototype</td><td class='n'>Requirements people cannot articulate until they see something</td><td class='g'>It gets mistaken for a commitment to build exactly that</td></tr>\n<tr><td>Survey</td><td class='n'>Breadth across many users, and counting</td><td class='g'>You need the reason behind an answer</td></tr>\n</table></div>\n<p>Two pairings do most of the real work. <strong>Document analysis then interview:</strong> read the policy first, then ask the person how it actually works, and the gap between those two answers is where the interesting requirements live. <strong>Observation then workshop:</strong> watch the process, then put what you saw in front of the group, because a room will correct a wrong diagram far more readily than it will answer an open question.</p>\n<div class='note'>Observation is the most consistently underused of the six. Almost every operational process has a spreadsheet in it that appears in no documentation, and the only reliable way to find it is to sit next to someone doing the job.</div>"

     "h": "Questions that get a <em>real</em> answer",
     "b": "<p>Open questions produce speeches. These produce facts. Each one is chosen because the answer is difficult to give vaguely.</p>\n<div class='sheet'><div class='h'>Understanding the current state</div>\n<div class='r'><b>Walk me through the last one you did</b><span>A specific case, not the general process. The exceptions surface here</span></div>\n<div class='r'><b>How many of these happen in a week</b><span>Sizes the problem and separates the loud from the frequent</span></div>\n<div class='r'><b>What happens when it goes wrong</b><span>Finds the exception path, which is where most requirements hide</span></div>\n<div class='r'><b>Who do you have to wait for</b><span>Handoffs, and where the elapsed time actually goes</span></div>\n<div class='r'><b>What do you keep in a spreadsheet</b><span>Finds the shadow system. There is almost always one</span></div>\n</div>\n<div class='sheet'><div class='h'>Understanding what would be better</div>\n<div class='r'><b>What would you do with this once you had it</b><span>Separates the ask from the need</span></div>\n<div class='r'><b>How would you know it had worked</b><span>The acceptance criterion, offered voluntarily</span></div>\n<div class='r'><b>What would you give up to get it</b><span>The only honest priority question. See mission 03</span></div>\n<div class='r'><b>Who else does it this way</b><span>Finds the other stakeholders you were not told about</span></div>\n</div>\n<div class='sheet q'><div class='h'>Questions that waste the meeting</div>\n<div class='r'><b>What are your requirements</b><span>Invites a wish list with no problem attached</span></div>\n<div class='r'><b>Would it be useful if</b><span>Everything is useful. Nothing is learned</span></div>\n<div class='r'><b>Is this a priority</b><span>Asked of one person about their own work, the answer is always yes</span></div>\n</div>"

    {
     "l": "MECHANISM",
     "t": "Who matters",
     "h": "Power, interest, and the two <em>dangerous</em> quadrants",
     "b": "<p>A <span class='k'>stakeholder</span> is anyone affected by the change or able to affect it. That definition is deliberately wide, and the point of mapping is to stop treating them all the same.</p>\n<p>Place each one on two axes: how much <strong>power</strong> they have over whether this happens, and how much <strong>interest</strong> they have in the outcome.</p>\n<div class='dt'><table>\n<tr><th>Position</th><th>Handling</th><th>Why</th></tr>\n<tr class='hi'><td>High power, high interest</td><td class='n'>Involve closely</td><td class='g'>They will shape it whether you invite them or not</td></tr>\n<tr class='hi'><td>High power, low interest</td><td class='n'>Keep satisfied</td><td class='g'>The dangerous quadrant. Uninterested until late, then decisive</td></tr>\n<tr><td>Low power, high interest</td><td class='n'>Keep informed</td><td class='g'>Best source of detail. Often the people doing the actual work</td></tr>\n<tr><td>Low power, low interest</td><td class='n'>Monitor</td><td class='g'>Recheck occasionally. Interest changes when the change gets near</td></tr>\n</table></div>\n<p>The two quadrants that cause trouble are the ones on the left of that table. <strong>High power and low interest</strong> is where late objections come from — the executive who ignores eleven updates and then asks one question in month five that reopens the design. The handling is not more updates. It is one short, direct conversation early, on the single point they will care about.</p>\n<p><strong>Low power and high interest</strong> is where the best information is and where it is most often discarded, because the people who actually operate the process have detailed knowledge and no authority to insist on it.</p>\n<div class='note'>Roles get confused with people. A <span class='k'>RACI</span> assigns four things per activity: who is <strong>Responsible</strong> for doing it, who is <strong>Accountable</strong> and answers for the outcome, who is <strong>Consulted</strong> before it happens, and who is <strong>Informed</strong> after. Exactly one name is Accountable per activity. Two names in the A column means nobody is.</div>"

    {
     "l": "MECHANISM",

     "h": "Draw the process before you <em>change</em> it",
     "b": "<p>An <span class='k'>as-is process map</span> is a diagram of how the work happens today. It is drawn in <span class='k'>swimlanes</span> — one horizontal lane per role or system, with the flow moving left to right across them, so that every time the flow crosses a lane boundary it is visible as a handoff.</p>\n<p>Building one is mechanical. Take the walkthrough of a real case from the interview. Write each step as a box. Assign each box to the lane of whoever performs it. Join them in sequence. Then add every branch someone mentioned as an exception.</p>\n<p>Three things become visible that are invisible in prose:</p>\n<div class='three'><div><b>Handoffs</b>Every lane crossing is a place where work waits, context is lost, and information has to be re-entered. Count them. Most processes have more than anyone estimated.</div>\n<div><b>Waiting</b>Mark elapsed time on each box separately from effort. A process taking six days often contains four hours of work. That gap is the opportunity, and it is almost never a system speed problem.</div>\n<div><b>Loops</b>Any arrow going backwards is rework. Ask what proportion of cases take it. A 30% rework loop is usually a bigger prize than anything on the forward path.</div></div>\n<div class='note'>Draw it in front of people rather than presenting it finished. A group that watches the diagram being built will interrupt and correct it. A group handed a finished diagram will nod. The corrections are the whole value.</div>"

     "t": "Cause or symptom",

     "b": "<p>A <span class='k'>symptom</span> is what people notice. A <span class='k'>root cause</span> is what produces it. Solving symptoms produces systems that need more systems.</p>\n<p>The simplest reliable method is to ask why repeatedly, following one chain rather than branching:</p>\n<div class='wk'><div class='h'>One chain, five steps</div>\n<div class='r'><b>Loan applications are being rejected wrongly</b><span>Symptom</span></div>\n<div class='r'><b>Why? The income figure is often wrong</b><span>Why 1</span></div>\n<div class='r'><b>Why? It is keyed from a document by hand</b><span>Why 2</span></div>\n<div class='r'><b>Why? The document format differs by employer</b><span>Why 3</span></div>\n<div class='r'><b>Why? There is no defined income proof standard</b><span>Why 4</span></div>\n<div class='r tot'><b>The policy has no standard, so keying is guesswork</b><span>Root</span></div>\n</div>\n<p>Notice where a solution would have been proposed if the questioning had stopped early. After the first why: build a validation rule. After the second: buy document reading software. After the fourth: <strong>write the standard, which is free, and then decide whether software is still needed.</strong></p>\n<p>The method has a real limit and it is worth stating. Asking why five times follows a single chain, and most operational problems have several contributing causes rather than one. It is a way of getting past the first answer, not a proof. Where several causes are suspected, a cause-and-effect diagram grouping them by category — people, process, systems, data, policy — is the honest tool, because it does not pretend there is only one path.</p>"

     "h": "The users told us what they <em>wanted</em>",

    {
     "l": "NUMBERS",
     "t": "Sizing it",
     "h": "Five numbers before any <em>solution</em> is named",
     "b": "<p>A problem without numbers cannot be prioritised against another problem, and cannot be shown afterwards to have been solved. Collect these during discovery, while people are still willing to look things up.</p>\n<div class='dt'><table>\n<tr><th>Number</th><th>Question that gets it</th><th>Used for</th></tr>\n<tr class='hi'><td>Volume</td><td class='n'>How many per day, month, year</td><td class='g'>Everything. Sizing, cost, and the non-functional requirement</td></tr>\n<tr><td>Frequency of failure</td><td class='n'>How often does it go wrong</td><td class='g'>Separates an irritation from a problem</td></tr>\n<tr><td>Effort per case</td><td class='n'>Minutes of human time, each</td><td class='g'>The cost side of the business case</td></tr>\n<tr><td>Elapsed time</td><td class='n'>Calendar time from start to finish</td><td class='g'>The customer-facing measure. Usually much larger than effort</td></tr>\n<tr><td>Consequence</td><td class='n'>What happens to the customer or the book when it fails</td><td class='g'>Whether this is a cost problem or a risk problem</td></tr>\n</table></div>\n<p>Two disciplines make these numbers survive contact with a sponsor. <strong>Record where each one came from</strong> — a system report, an operations estimate, or somebody's recollection — because the three carry very different weight and the difference will be asked about. And <strong>capture them before the solution is chosen</strong>, because a number collected afterwards is a number collected by someone who already knows which answer helps.</p>\n<div class='note'>This set is the <span class='k'>baseline</span>. Without it there is no way to demonstrate improvement later, and the benefit claimed in the business case becomes unfalsifiable. Mission 03 returns to this, and mission 10 depends on it entirely.</div>"

     "t": "The to-be",

     "b": "<p>Once the as-is is agreed and the root cause named, the <span class='k'>to-be process</span> is drawn the same way: same swimlanes, same notation, showing how the work will happen afterwards.</p>\n<p>Drawing both is not duplication. <strong>The difference between the two diagrams is the scope of the change</strong>, and it is far more precise than any prose description of scope, because a difference between two pictures cannot be read two ways.</p>\n<div class='flow'>\n<div class='n'><b>Overlay them</b>Every box that changes, disappears or appears is a piece of work.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Classify each difference</b>System change, process change, policy change, or role change. The four have completely different costs and completely different approvers.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Name what is not changing</b>Explicitly. This becomes the out-of-scope list and it prevents a specific argument in month four.</div>\n</div>\n<p>The classification step is where most of the value sits. A difference that turns out to be a <strong>policy change</strong> needs a policy owner and a committee, not a developer, and discovering that in discovery rather than in build is worth a great deal. A difference that is a <strong>role change</strong> needs operations and possibly human resources involved, and those conversations have their own lead times.</p>\n<div class='note'>A to-be process that has the same number of handoffs as the as-is has usually automated the steps and left the waiting alone. Since the waiting is normally where the elapsed time is, that is a change which will not deliver the benefit its business case claims.</div>"

     "b": "<ul>\n<li>The ask is a solution in disguise. <strong>The need sits one layer underneath it</strong>, and the question that separates them is what you would do with it once you had it.</li>\n<li>Six elicitation techniques, each with a failure mode. <strong>Document analysis then interview</strong>, and <strong>observation then workshop</strong>, do most of the work.</li>\n<li>Stakeholders map on power and interest. <strong>High power and low interest is the quadrant that produces late objections.</strong></li>\n<li>Exactly one name is Accountable per activity in a RACI. Two means none.</li>\n<li>An as-is map in swimlanes exposes <strong>handoffs, waiting and rework loops</strong> that prose hides.</li>\n<li>Five whys follows one chain and is a way past the first answer, <strong>not a proof</strong>. Several causes need a cause-and-effect diagram.</li>\n<li>Stated and revealed behaviour differ, and <strong>the gap between them is the finding</strong>.</li>\n<li>Five baseline numbers, collected before the solution is chosen, with their source recorded.</li>\n<li><strong>The difference between the as-is and the to-be is the scope</strong>, classified into system, process, policy and role.</li>\n</ul>"

   "bullets": [

     "l": "ORIENT",
     "t": "The product question",
     "h": "Should this be built <em>at all</em>",
     "b": "<p>Discovery produces a well-understood problem. The next step is not specification. It is a decision, and the decision has three possible answers: build something, do something cheaper that is not a system, or do nothing and accept the problem.</p>\n<p>The third answer is real and gets ruled out too early. A problem occurring eleven times a year and costing two hours each time is a twenty-two hour problem. No amount of accurate specification makes it worth a delivery programme.</p>\n<p>This is the <span class='k'>product</span> half of the work: not designing screens, but deciding what deserves to exist and in what order. In some institutions a product manager holds it, in others the analyst holds it by default because nobody else is looking. <strong>Either way somebody has to hold it, and where nobody does, the loudest requester decides the roadmap.</strong></p>\n<div class='note'>The two halves are genuinely different skills. Analysis asks: is this described correctly? Product asks: is this worth describing? An organisation strong on the first and weak on the second builds precisely specified things nobody needed.</div>"

    {
     "l": "MECHANISM",
     "t": "The problem statement",
     "h": "Five parts, and no <em>solution</em> in any of them",
     "b": "<p>A problem statement is a short document, typically under a page, written before any option is named. Its discipline is that a solution appearing anywhere in it is a defect.</p>\n<div class='flow'>\n<div class='n'><b>Who is affected</b>Named group, with a count. Not <em>users</em>. Underwriters in the mid-market team, roughly forty people.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>What happens today</b>The current behaviour, factually, with the baseline numbers from discovery attached.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>What it costs</b>In money, in time, in risk, or in customers. Whichever is real. Say which figures are measured and which are estimated.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Why it happens</b>The root cause from mission 02. If this box says <em>because we do not have a system</em>, the root cause work has not been done.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>What would be true if it were solved</b>An observable end state, with a number in it. This becomes the success measure and it is agreed here, not later.</div>\n</div>\n<p>The last box is the one that gets softened under pressure, and softening it is how a change becomes impossible to evaluate. <em>Improved efficiency</em> cannot be shown afterwards. <em>Median time from application to decision falls below four hours</em> can.</p>\n<div class='note'>Test the whole document by handing it to someone who was not in discovery and asking them to describe the problem back. If they describe a system instead, a solution has leaked in.</div>"

    {
     "l": "MECHANISM",
     "t": "Five options",
     "h": "Always compare against <em>doing nothing</em>",
     "b": "<p>Every option analysis has five candidates, and a proposal presenting only one has skipped the analysis rather than completed it.</p>\n<div class='dt'><table>\n<tr><th>Option</th><th>What it is</th><th>Argues best when</th></tr>\n<tr class='hi'><td>Do nothing</td><td class='n'>Accept the problem, deliberately</td><td class='g'>Always the baseline. Every other option is measured against it</td></tr>\n<tr><td>Process or policy change</td><td class='n'>Change the rule or the sequence, build nothing</td><td class='g'>The root cause is a rule, not a capability. Often free</td></tr>\n<tr><td>Configure</td><td class='n'>Use settings the existing system already has</td><td class='g'>The capability exists and is switched off or unused</td></tr>\n<tr><td>Buy</td><td class='n'>License a package or a service</td><td class='g'>The need is common to the industry and not a differentiator</td></tr>\n<tr><td>Build</td><td class='n'>Write it</td><td class='g'>The need is genuinely specific, or the integration cost of buying exceeds the build</td></tr>\n</table></div>\n<p>Two of these get skipped systematically. <strong>Do nothing</strong> is skipped because it feels defeatist, but without it there is no comparison and every proposal looks worthwhile in isolation. <strong>Process or policy change</strong> is skipped because it is not a technology answer and the meeting is usually a technology meeting — yet it is frequently the cheapest option and occasionally the only one that addresses the cause.</p>\n<p>Each option is costed on <span class='k'>total cost of ownership</span>, not purchase price: licence or build cost, integration, data migration, training, the annual run cost, and the cost of getting out again in five years. <strong>Buying looks cheaper than building at the point of purchase and frequently is not at year three</strong>, because integration and configuration effort in a bank routinely exceeds the licence fee.</p>"

    {
     "l": "MECHANISM",
     "t": "Ordering the work",
     "h": "Four ways to prioritise, none of them <em>authoritative</em>",
     "b": "<p>Stated plainly, because it is often implied otherwise: <strong>prioritisation frameworks have no standards body and no evidence base.</strong> They are practice conventions. Their value is that they force a conversation into the open and make a decision reviewable later, not that they compute a correct answer.</p>\n<div class='dt'><table>\n<tr><th>Method</th><th>How it works</th><th>Fails by</th></tr>\n<tr class='hi'><td>MoSCoW</td><td class='n'>Must, Should, Could, Won't have</td><td class='g'>Everything becomes a Must. Needs a cap, e.g. Musts under 60% of effort</td></tr>\n<tr><td>Weighted scoring</td><td class='n'>Criteria, weights, scores, multiply and sum</td><td class='g'>False precision. A 7 and an 8 are not distinguishable</td></tr>\n<tr><td>Cost of delay</td><td class='n'>Value lost per unit of time waiting</td><td class='g'>Needs a value per week, which is often unknowable</td></tr>\n<tr><td>Effort against value</td><td class='n'>Two axes, four quadrants, take the top-left</td><td class='g'>Crude, and the most honest of the four for exactly that reason</td></tr>\n</table></div>\n<p>The one question that does real work is none of these. It is: <strong>what would you give up to get this?</strong> Priority is meaningless in isolation, because everybody's own item is urgent. It becomes meaningful the moment it is expressed as a trade against another named item.</p>\n<p>Where a numeric method is used, two rules keep it honest. <strong>Fix the weights before scoring anything</strong>, because weights set afterwards get tuned until the preferred answer wins. And <strong>treat the output as a starting order, not a ranking</strong> — if the result is obviously wrong, the criteria were wrong, and that is a finding rather than a reason to override the number quietly.</p>"

     "t": "Two calculations",
     "h": "Weighted score and <em>cost of delay</em>",
     "b": "<p>Both are simple. The difficulty is entirely in the inputs, which is worth saying before either is used.</p>\n<div class='fx'><div class='cap'>Weighted score for one candidate item</div>\n<div class='eq'><em>S</em> &nbsp;=&nbsp; &#8721; <span class='nw'>( <em>w</em><sub>i</sub> &times; <em>s</em><sub>i</sub> )</span></div>\n<div class='wh'>S&nbsp;&nbsp;the total score for one item, used to order it against others<br>\nw&#8321;&nbsp;the weight of criterion i &mdash; how much that criterion matters, fixed before any scoring begins<br>\ns&#8321;&nbsp;the score of this item against criterion i, on a scale agreed in advance<br>\ni&nbsp;&nbsp;each criterion in turn &mdash; typically four to six, such as revenue, risk reduction, effort, regulatory necessity<br>\n&#8721;&nbsp;sum across every criterion</div></div>\n<p>Weights conventionally sum to 1 so that scores stay on the original scale and remain comparable between exercises. <strong>Effort must be entered as a cost, not a benefit</strong> — either subtract it or divide by it — and the most common error in practice is scoring effort positively so that hard things rank highest.</p>\n<div class='fx'><div class='cap'>Cost of delay per week</div>\n<div class='eq'><em>CoD</em> &nbsp;=&nbsp; <span class='fr'><i>Value lost over the delay period</i><i>Number of weeks delayed</i></span></div>\n<div class='wh'>CoD&nbsp;the value forgone for each additional week the item is not delivered<br>\nValue lost&nbsp;revenue not earned, cost not avoided, losses not prevented, or a penalty incurred<br>\nWeeks delayed&nbsp;the delay being contemplated, not the total build time</div></div>\n<p>Cost of delay is the more honest of the two because it makes a hidden question explicit: <strong>an item with a high value but no urgency is genuinely different from an item with a modest value that decays</strong>. A regulatory item with a hard date has a cost of delay that is near zero until the date and then enormous, and no weighted score will ever represent that shape.</p>"

     "l": "WORKED",

     "h": "The arithmetic, and where it stops <em>helping</em>",
     "b": "<p>Three candidate items, four criteria, weights fixed in advance. Scores are on a one-to-five scale where five is best. Effort is scored so that five means least effort, keeping every criterion pointing the same way.</p>\n<div class='wk'><div class='h'>Item A &mdash; automate income verification</div>\n<div class='r'><b>Revenue impact &nbsp;&nbsp;weight 0.30, score 2</b><span>0.60</span></div>\n<div class='r'><b>Risk reduction &nbsp;&nbsp;weight 0.25, score 4</b><span>1.00</span></div>\n<div class='r'><b>Low effort &nbsp;&nbsp;weight 0.25, score 2</b><span>0.50</span></div>\n<div class='r'><b>Regulatory necessity &nbsp;&nbsp;weight 0.20, score 1</b><span>0.20</span></div>\n<div class='r tot'><b>Total</b><span>2.30</span></div>\n</div>\n<div class='wk'><div class='h'>Item B &mdash; add the new regulatory disclosure field</div>\n<div class='r'><b>Revenue impact &nbsp;&nbsp;weight 0.30, score 1</b><span>0.30</span></div>\n<div class='r'><b>Risk reduction &nbsp;&nbsp;weight 0.25, score 3</b><span>0.75</span></div>\n<div class='r'><b>Low effort &nbsp;&nbsp;weight 0.25, score 4</b><span>1.00</span></div>\n<div class='r'><b>Regulatory necessity &nbsp;&nbsp;weight 0.20, score 5</b><span>1.00</span></div>\n<div class='r tot'><b>Total</b><span>3.05</span></div>\n</div>\n<div class='wk'><div class='h'>Item C &mdash; redesign the application screens</div>\n<div class='r'><b>Revenue impact &nbsp;&nbsp;weight 0.30, score 4</b><span>1.20</span></div>\n<div class='r'><b>Risk reduction &nbsp;&nbsp;weight 0.25, score 1</b><span>0.25</span></div>\n<div class='r'><b>Low effort &nbsp;&nbsp;weight 0.25, score 2</b><span>0.50</span></div>\n<div class='r'><b>Regulatory necessity &nbsp;&nbsp;weight 0.20, score 1</b><span>0.20</span></div>\n<div class='r tot'><b>Total</b><span>2.15</span></div>\n</div>\n<p>The order is B, A, C. Now change one input: move the revenue weight from 0.30 to 0.40 and take it off risk reduction. C rises to 2.40 and A falls to 2.15, and <strong>the bottom two swap places on a weight change nobody would defend to two decimal places.</strong></p>\n<p>That instability is the honest lesson. B wins under both, and it wins because the regulatory score of 5 is a genuine constraint rather than a preference. <strong>Use the score to find the items that win under every reasonable set of weights, and treat the ones that move as a group to be argued about rather than a ranking to be obeyed.</strong></p>"

    {

     "h": "Pilot, MVP and <em>phase one</em> are not synonyms",
     "b": "<p>All three mean less than everything. They commit to very different things, and the words get swapped in meetings by people who mean different things by them.</p>\n<div class='three'><div><b>Pilot</b>The whole thing, for a small population. One branch, one product, one region. Answers: does it work in reality? Reversible by switching that population back.</div>\n<div><b>MVP</b>Minimum viable product. The smallest version that delivers real value to real users, for everyone. Answers: is this worth continuing to invest in? Not reversible &mdash; it is live.</div>\n<div><b>Phase one</b>A funded first slice of a fully specified larger plan. Answers nothing. It is a delivery sequencing decision, not a learning device.</div></div>\n<p>The distinction that matters is <strong>what each one is asking</strong>. A pilot and an MVP are both experiments and both must state in advance what result would cause the work to stop. Phase one is not an experiment; the decision has been taken and the rest is scheduling.</p>\n<p>Two failures follow from blurring them:</p>\n<ul>\n<li><strong>A phase one described as an MVP</strong> collects no learning and stops nothing, because there was never a question. It is just a smaller build wearing a fashionable word.</li>\n<li><strong>An MVP with no stopping condition</strong> is a full build delivered slowly. If no result would cause you to abandon it, calling it minimum and viable is decoration.</li>\n</ul>\n<div class='note'>In a regulated product the minimum is not a free choice. Consent capture, disclosure, grievance routing and audit logging are not features that can wait for phase two, because a live product without them is a live breach. <strong>Scope down the proposition, never the compliance surface.</strong></div>"

     "b": "<p>A business case is the document that converts a chosen option into funding. Most of it is arithmetic. The part that decides whether it is honest is the benefit section.</p>\n<div class='dt'><table>\n<tr><th>Benefit type</th><th>Example</th><th>Evidenced by</th></tr>\n<tr class='hi'><td>Cost avoided</td><td class='n'>Fewer hours spent on manual checking</td><td class='g'>Headcount actually reduced or redeployed, not hours theoretically freed</td></tr>\n<tr><td>Revenue enabled</td><td class='n'>Applications completed that previously dropped out</td><td class='g'>Completion rate before and after, same population</td></tr>\n<tr><td>Loss avoided</td><td class='n'>Fewer bad loans approved</td><td class='g'>Vintage performance compared against the prior cohort</td></tr>\n<tr><td>Risk reduced</td><td class='n'>A control that previously depended on one person</td><td class='g'>Cannot be evidenced numerically. Say so rather than inventing a figure</td></tr>\n</table></div>\n<p>Every claimed benefit needs a named owner who is willing to be measured on it. <strong>A benefit nobody owns will not be delivered, because the change is only the first half of it.</strong> Automating a check saves nothing until somebody stops doing the check, and that decision belongs to an operations manager who must have agreed to it before the money is approved.</p>\n<p>The fourth row is the one to handle carefully. Risk reduction is often the real reason for the work and almost never has a defensible number. <strong>The honest treatment is to state it qualitatively and let it be weighed as a qualitative benefit</strong>, rather than manufacturing an expected loss figure whose assumptions cannot survive being questioned.</p>"

    {
     "l": "ORIENT",
     "t": "Three documents",
     "h": "Different readers, different <em>questions</em>",
     "b": "<p>Specification is not one document. It is a small set, and the reason there is more than one is that the people who must agree to it and the people who must build from it need different things.</p>\n<div class='dt'><table>\n<tr><th>Document</th><th>Answers</th><th>Written for</th></tr>\n<tr class='hi'><td>Business requirements document</td><td class='n'>What does the business need, and why</td><td class='g'>Business owner, sponsor, risk, compliance</td></tr>\n<tr><td>Functional specification</td><td class='n'>What must the system do, exactly</td><td class='g'>Developers, testers, architects</td></tr>\n<tr><td>Non-functional requirements</td><td class='n'>How well, how fast, how much, how long kept</td><td class='g'>Architects, operations, infrastructure</td></tr>\n<tr><td>User story with acceptance criteria</td><td class='n'>Both, in a small slice</td><td class='g'>A delivery team working iteratively</td></tr>\n</table></div>\n<p>The last row is not a fourth document so much as a different packaging of the first three. An iterative team writes small, complete slices instead of large, sequential documents. <strong>The content is the same and the discipline is the same.</strong> A user story with vague acceptance criteria fails for exactly the reason a vague functional specification fails.</p>\n<div class='note'>A common and unhelpful argument treats these as rival methodologies. They are not. The question is only whether the specification is written all at once or a slice at a time, and that choice follows from how much is knowable up front, which is covered in mission 10.</div>"

    {
     "l": "DEFINE",
     "t": "BRD and FSD",
     "h": "The same change, said <em>twice</em>",
     "b": "<p>The clearest way to hold the difference is to see one change written both ways.</p>\n<div class='two'><div><b>In the BRD</b>Underwriters must be able to approve loans up to their delegated limit without a second signature, so that straightforward cases are not delayed by an approval queue that adds no risk control.</div>\n<div><b>In the FSD</b>On submission of a decision where <code>decision = APPROVE</code> and <code>sanction_amount</code> is less than or equal to the approver's <code>delegated_limit</code> for that <code>product_code</code>, the system shall set <code>status = SANCTIONED</code> without routing to a second approver, and shall write an audit entry containing approver ID, limit applied, amount and timestamp.</div></div>\n<p>Both describe one change. The first can be read by a head of credit who will agree to it and by a compliance officer who will check it against the delegation policy. Neither of them can build from it. The second can be built and tested and neither of those two people will read it.</p>\n<p>Three practical rules follow:</p>\n<ul>\n<li><strong>Every FSD line traces to a BRD line.</strong> A functional requirement with no business requirement behind it is something a developer or an analyst decided on their own, and it will not be defensible when questioned.</li>\n<li><strong>Not every BRD line produces one FSD line.</strong> One business requirement commonly becomes six functional ones. That fan-out is normal and is what the traceability matrix records.</li>\n<li><strong>Field names in the BRD are a warning sign.</strong> If <code>sanction_amount</code> appears in the business document, the design has been decided before the need was agreed.</li>\n</ul>"

     "t": "Anatomy",
     "h": "Seven parts of a requirement that can be <em>built</em>",
     "b": "<p>A requirement is not a sentence about what would be nice. It is a structured statement with parts, and a missing part is a defect that will be found later by somebody more expensive.</p>\n<div class='dt'><table>\n<tr><th>Part</th><th>What it does</th><th>Missing it causes</th></tr>\n<tr class='hi'><td>Unique identifier</td><td class='n'>FR-047. Never renumbered</td><td class='g'>No traceability, no way to discuss one line</td></tr>\n<tr><td>Actor</td><td class='n'>Who or what performs it</td><td class='g'>Permissions get invented by the developer</td></tr>\n<tr><td>Trigger</td><td class='n'>The event that starts it</td><td class='g'>Built, but nothing ever calls it</td></tr>\n<tr><td>Action</td><td class='n'>What the system does. One verb</td><td class='g'>Two requirements pretending to be one</td></tr>\n<tr><td>Outcome</td><td class='n'>The resulting state, observable</td><td class='g'>Untestable. Nobody can say if it worked</td></tr>\n<tr><td>Rule or condition</td><td class='n'>The constraint governing it</td><td class='g'>The boundary case is decided in code</td></tr>\n<tr><td>Exception</td><td class='n'>What happens when it cannot complete</td><td class='g'>The largest single source of production defects</td></tr>\n</table></div>\n<p>The last row deserves its own emphasis. <strong>Most specification effort goes into the path where everything works, and most defects live on the paths where something does not.</strong> The bureau is unreachable. The document upload times out. The customer already has an application open. The approver has left the organisation. Every one of those is a requirement, and every one is routinely missing from a first draft.</p>\n<div class='note'>A working habit: after drafting the happy path, go back through each requirement and ask what happens if this step fails, and what happens if it succeeds but slowly. Those two questions typically add thirty to fifty per cent more requirements, and they are the ones that prevent a bad go-live.</div>"
    },

     "l": "CHEAT",
     "t": "Ambiguity",
     "h": "Words that guarantee a <em>defect</em>",
     "b": "<p>These words pass review because everyone reads them as meaning their own expectation. The developer implements one reading, the tester tests another, and the disagreement surfaces at acceptance testing when it is expensive.</p>\n<div class='sheet q'><div class='h'>Never leave these in a requirement</div>\n<div class='r'><b>Appropriate, suitable, reasonable</b><span>Whose judgement, applied when? Replace with the rule</span></div>\n<div class='r'><b>Timely, promptly, quickly, real-time</b><span>Replace with a number and a unit</span></div>\n<div class='r'><b>User-friendly, intuitive, seamless</b><span>Not testable. Replace with a task and a time or an error rate</span></div>\n<div class='r'><b>As required, as applicable, where necessary</b><span>Names no condition. State the condition</span></div>\n<div class='r'><b>Etc, and so on, including but not limited to</b><span>An unbounded list is an unbounded build. Enumerate it</span></div>\n<div class='r'><b>Should, may, ideally</b><span>Optional, so it will not be built. Use shall, or delete it</span></div>\n<div class='r'><b>Handle, manage, process, support</b><span>Verbs with no observable outcome. Say what the system does</span></div>\n<div class='r'><b>Various, several, multiple, all relevant</b><span>How many, and which. Count them</span></div>\n<div class='r'><b>And / or</b><span>Three different requirements. Split them</span></div>\n<div class='r'><b>Flexible, configurable, scalable</b><span>Along which dimension, to what limit, changed by whom</span></div>\n</div>\n<div class='sheet g'><div class='h'>The rewrite pattern</div>\n<div class='r'><b>Ambiguous word found</b><span>Ask: how would a tester prove this?</span></div>\n<div class='r'><b>No answer</b><span>The requirement is not yet written. Go back to the person who asked</span></div>\n<div class='r'><b>An answer with a number in it</b><span>That number is the requirement. Put it in</span></div>\n</div>"

    {
     "l": "MECHANISM",
     "t": "Acceptance criteria",
     "h": "The conditions under which it is <em>done</em>",
     "b": "<p><span class='k'>Acceptance criteria</span> are the specific, checkable conditions that must hold for a requirement to be considered met. They are written by or with the person who will accept the work, and they are written <strong>before the build starts</strong>. Criteria written afterwards describe what was built.</p>\n<p>The common structured form has three parts:</p>\n<div class='flow'>\n<div class='n'><b>Given</b>The starting state. What is already true before anything happens.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>When</b>The single triggering action.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Then</b>The observable outcome. Something a tester can look at and confirm.</div>\n</div>\n<p>Worked on the delegated approval requirement:</p>\n<div class='sheet g'><div class='h'>FR-047 &mdash; acceptance criteria</div>\n<div class='r'><b>Given an approver with a delegated limit of 5,00,000 for product PL, when they approve an application of 4,50,000, then status becomes SANCTIONED with no second approver assigned</b><span>Within limit</span></div>\n<div class='r'><b>Given the same approver, when they approve 5,00,000 exactly, then status becomes SANCTIONED</b><span>The boundary, stated</span></div>\n<div class='r'><b>Given the same approver, when they approve 5,00,001, then the application is routed to a second approver and status remains PENDING_APPROVAL</b><span>Just over</span></div>\n<div class='r'><b>Given any sanction, when status becomes SANCTIONED, then an audit entry exists containing approver ID, limit applied, amount and timestamp</b><span>The audit trail</span></div>\n<div class='r'><b>Given an approver whose delegated limit is null for that product, when they attempt approval, then approval is refused with a stated reason</b><span>The exception</span></div>\n</div>\n<p>Note the second and third criteria. <strong>The boundary is stated twice, at the value and just past it</strong>, because the single most common defect class in rule-based systems is a comparison written as less-than when it should have been less-than-or-equal. Naming both sides makes the intent unmissable.</p>\n<div class='note'>The Given-When-Then form is a convention, not a standard, and a numbered list of conditions is equally acceptable. What is not optional is that each criterion is <strong>independently checkable and has one outcome</strong>. If a criterion needs the word and twice, it is two criteria.</div>"

     "h": "From a sentence to something <em>buildable</em>",
     "b": "<p>A real progression, one pass at a time. The original arrives from the business.</p>\n<div class='wk'><div class='h'>Draft 0 &mdash; as received</div>\n<div class='r'><b>The system should send timely alerts to relevant staff when an account becomes risky</b><span>0 of 7 parts</span></div>\n</div>\n<p><em>Should</em> means optional. <em>Timely</em>, <em>relevant</em> and <em>risky</em> each name no rule. There is no trigger, no outcome and no exception.</p>\n<div class='wk'><div class='h'>Draft 1 &mdash; ask what risky means</div>\n<div class='r'><b>Answer: the account has gone 30 days past due</b><span>Rule found</span></div>\n<div class='r'><b>Ask what relevant staff means &mdash; answer: the relationship manager who owns the account</b><span>Actor found</span></div>\n<div class='r'><b>Ask what timely means &mdash; answer: they need it the same morning</b><span>Still not a number</span></div>\n<div class='r'><b>Ask again: by what time &mdash; answer: before 9am</b><span>Number found</span></div>\n<div class='r'><b>Ask what alert means &mdash; answer: email is fine, they live in it</b><span>Action found</span></div>\n<div class='r tot'><b>Ask what if there is no relationship manager assigned</b><span>Exception found</span></div>\n</div>\n<div class='wk'><div class='h'>Draft 2 &mdash; written</div>\n<div class='r'><b>FR-112 &nbsp; Identifier</b><span>Fixed</span></div>\n<div class='r'><b>When the overnight delinquency job classifies an account as 30 days past due &nbsp; Trigger</b><span>Stated</span></div>\n<div class='r'><b>The system shall send an email &nbsp; Action, one verb</b><span>Stated</span></div>\n<div class='r'><b>To the relationship manager recorded against that account &nbsp; Actor</b><span>Stated</span></div>\n<div class='r'><b>Containing account number, customer name, outstanding balance and days past due &nbsp; Outcome</b><span>Observable</span></div>\n<div class='r'><b>Delivered by 09:00 local time on the day of classification &nbsp; Rule</b><span>Testable</span></div>\n<div class='r tot'><b>Where no relationship manager is recorded, the email shall go to the branch manager of the account's booking branch, and the absence shall be written to the exception report &nbsp; Exception</b><span>Complete</span></div>\n</div>\n<p>Four rounds of asking, and the requirement went from untestable to buildable. <strong>Notice that every single addition came from a question, not from the analyst's judgement.</strong> The one place judgement entered — routing to the branch manager — is exactly the point that should be circulated for agreement, because it is a decision rather than a fact.</p>"

    {
     "l": "DEFINE",
     "t": "Non-functional",
     "h": "Nine characteristics, and a <em>standard</em> that names them",
     "b": "<p>A <span class='k'>functional requirement</span> says what the system does. A <span class='k'>non-functional requirement</span> says how well it must do it. Functional requirements get all the attention in workshops and non-functional ones cause most of the expensive late redesigns, because they are architectural and cannot be added afterwards.</p>\n<p>The international standard for software product quality, ISO/IEC 25010, gives a nine-part model that works as a completeness checklist. Its 2023 revision is the current one and it differs from the 2011 edition, which is still widely quoted.</p>\n<div class='dt'><table>\n<tr><th>Characteristic</th><th>The question to ask</th></tr>\n<tr class='hi'><td>Functional suitability</td><td class='g'>Does it do the right things, correctly and completely?</td></tr>\n<tr class='hi'><td>Performance efficiency</td><td class='g'>How fast, at what volume, using how much resource?</td></tr>\n<tr><td>Compatibility</td><td class='g'>Does it coexist and interoperate with what is already there?</td></tr>\n<tr><td>Interaction capability</td><td class='g'>Can the intended users actually operate it, including users with impairments?</td></tr>\n<tr><td>Reliability</td><td class='g'>How available, how fault tolerant, how quickly recovered?</td></tr>\n<tr><td>Security</td><td class='g'>Confidentiality, integrity, non-repudiation, authenticity</td></tr>\n<tr><td>Maintainability</td><td class='g'>How hard to diagnose, modify and test later?</td></tr>\n<tr><td>Flexibility</td><td class='g'>Can it be adapted, scaled, installed elsewhere, replaced?</td></tr>\n<tr><td>Safety</td><td class='g'>What harm can it do, and how is that limited?</td></tr>\n</table></div>\n<p>Two of these are new names and one is new entirely. In the 2011 edition, <em>interaction capability</em> was called <strong>usability</strong> and <em>flexibility</em> was called <strong>portability</strong>. <strong>Safety was added in 2023</strong> and had no equivalent before. Both lists remain in circulation, so a specification quoting eight characteristics is following the older edition rather than making an error.</p>\n<div class='docs'><b>Official source</b>\n<a href='https://www.iso.org/standard/78176.html' target='_blank' rel='noopener'>ISO &mdash; ISO/IEC 25010:2023, Systems and software engineering, SQuaRE, Product quality model</a></div>"

</div>\n<div class='r'><b>Audit retention</b><span>Often longer than the record itself. Check separately</span></div>\n</div>"

    {
     "l": "FORMULA",
     "t": "Availability",
     "h": "What each <em>nine</em> actually costs in minutes",
     "b": "<p>Availability targets are agreed casually and are one of the largest cost drivers in a design. The arithmetic makes the conversation concrete.</p>\n<div class='fx'><div class='cap'>Permitted downtime over a period</div>\n<div class='eq'><em>D</em> &nbsp;=&nbsp; <span class='nw'>( 1 &minus; <em>A</em> )</span> &times; <em>T</em></div>\n<div class='wh'>D&nbsp;&nbsp;permitted downtime, in the same unit as T<br>\nA&nbsp;&nbsp;the availability target expressed as a fraction &mdash; 99.9% is 0.999<br>\nT&nbsp;&nbsp;the total time in the measurement period, and the period must be stated because a monthly target and an annual target differ by a factor of twelve</div></div>\n<p>Over a 30-day month, T is 43,200 minutes.</p>\n<div class='dt'><table>\n<tr><th>Target</th><th>Downtime per month</th><th>What it implies</th></tr>\n<tr><td>99%</td><td class='n'>432 minutes</td><td class='g'>A little over 7 hours. A weekend patch fits inside it</td></tr>\n<tr class='hi'><td>99.5%</td><td class='n'>216 minutes</td><td class='g'>3.6 hours. Comfortable for most internal systems</td></tr>\n<tr class='hi'><td>99.9%</td><td class='n'>43 minutes</td><td class='g'>Planned maintenance no longer fits. Needs redundancy</td></tr>\n<tr><td>99.99%</td><td class='n'>4.3 minutes</td><td class='g'>Automated failover, tested regularly. A different cost class</td></tr>\n</table></div>\n<p>The step that matters is between 99.5% and 99.9%. <strong>Below it, a system can be taken down at night to be patched. Above it, it cannot, and every future change must be deployable without an outage.</strong> That is an architectural commitment made permanent by a number chosen in a requirements workshop, and it should be chosen knowing that.</p>\n<div class='note'>Always ask whether the target includes planned maintenance. A 99.9% target excluding an agreed maintenance window is an ordinary requirement. The same number including it is a different and far more expensive system.</div>"

    {
     "l": "MECHANISM",

     "h": "Every requirement, followed to its <em>evidence</em>",
     "b": "<p>A <span class='k'>traceability matrix</span> is a table with one row per requirement and a column for each thing that requirement must connect to. It sounds like paperwork and it does four jobs nothing else does.</p>\n<div class='dt'><table>\n<tr><th>Column</th><th>Contains</th><th>Blank means</th></tr>\n<tr class='hi'><td>Requirement ID</td><td class='n'>FR-047</td><td class='g'>&mdash;</td></tr>\n<tr><td>Business requirement</td><td class='n'>BR-09</td><td class='g'>Nobody asked for this. Challenge it</td></tr>\n<tr><td>Design element</td><td class='n'>Component or interface</td><td class='g'>Not designed. It will not be built</td></tr>\n<tr><td>Test case</td><td class='n'>TC-201, TC-202</td><td class='g'>Will not be proven. The most dangerous blank</td></tr>\n<tr><td>Test result</td><td class='n'>Pass, fail, blocked</td><td class='g'>Not yet run</td></tr>\n<tr><td>Defect</td><td class='n'>Linked defect IDs</td><td class='g'>&mdash;</td></tr>\n<tr><td>Status</td><td class='n'>Proposed, agreed, built, tested, accepted</td><td class='g'>&mdash;</td></tr>\n</table></div>\n<p>The four jobs:</p>\n<ul>\n<li><strong>Coverage.</strong> Sort by the test case column and every blank is a requirement going live untested.</li>\n<li><strong>Orphan detection.</strong> Sort by the business requirement column and every blank is scope somebody added without agreement.</li>\n<li><strong>Impact analysis.</strong> When a requirement changes, the row shows every design element and test that must change with it. Without this, impact analysis is a set of meetings and a guess.</li>\n<li><strong>Evidence.</strong> When an auditor asks how you know the delegation rule was implemented correctly, the row is the answer.</li>\n</ul>\n<div class='note'>It only works if it is maintained during the build rather than assembled before an audit. A matrix reconstructed at the end records what happened to survive; a matrix maintained throughout is what stops requirements quietly disappearing.</div>"

    {
     "l": "TRAP",
     "t": "Signed means frozen",
     "h": "It is signed off, so it <em>cannot</em> change",
     "b": "<p>Sign-off exists to create a stable base. So once the requirements are signed, they are fixed, and later requests are refused as scope creep.</p>\n<p>This is wrong, and the way it is wrong matters. <strong>Sign-off does not freeze the requirement. It fixes the point from which changes are counted.</strong> The purpose is not prevention; it is visibility.</p>\n<p>It is a believable error because the alternative looks like having no control at all, and analysts who have been through an uncontrolled project develop a strong preference for the locked door. But requirements change for good reasons — a regulation moves, a bureau interface is retired, discovery in build reveals something discovery in analysis could not. <strong>A process that cannot absorb a genuine change will be bypassed rather than obeyed</strong>, and undocumented changes are worse than documented ones.</p>\n<p>What actually happens after sign-off:</p>\n<div class='flow'>\n<div class='n'><b>The change is written down</b>As a change request, with the same discipline as the original requirement.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Impact is assessed</b>Using the traceability matrix. Which designs, which tests, how much effort, what moves.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Somebody with authority decides</b>Accept and absorb, accept and extend the date, or defer to a later release.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>The decision is logged</b>Including rejections, with the reason. Rejected changes come back otherwise.</div>\n</div>\n<div class='note'>The genuine failure is not change. It is <strong>change without impact assessment</strong> — a small addition agreed in a corridor that turns out to touch four interfaces. The four steps above take under an hour for most changes and exist entirely to prevent that.</div>"

    {

     "b": "<p>A lending business does one thing repeatedly: it meets someone it does not know, decides whether to give them money, gives it, and then collects it back over time with interest. Everything in the technology estate exists to make some part of that repeatable, evidenced and fast.</p>\n<p>The decision itself is a judgement under uncertainty, and the machinery around it exists because that judgement must be made <strong>consistently across thousands of cases, defensibly enough to withstand a regulator asking why one particular person was refused, and quickly enough that the applicant does not go elsewhere.</strong> Those three demands pull against each other, and most design arguments in lending technology are a version of that tension.</p>\n<p>Two halves, and they are different systems built at different times by different people:</p>\n<div class='two'><div><b>Origination</b>Everything up to the money leaving. Application, identity, credit assessment, decision, offer, agreement, disbursal. Short-lived per case, days at most, and heavy on integrations.</div>\n<div><b>Servicing</b>Everything after. Repayment schedules, collections, restructuring, closure. Long-lived per case, years, and heavy on accounting correctness.</div></div>\n<div class='note'>The two halves fail differently and this shapes what a specification must be careful about. Origination failures are visible immediately and cost applications. Servicing failures are invisible for months and cost money, because a schedule computed wrongly compounds quietly until somebody reconciles.</div>"
