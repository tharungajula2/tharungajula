    {
     "l": "MECHANISM",
     "t": "The flow",
     "h": "Eleven stages from stranger to <em>disbursal</em>",
     "b": "<p>Products differ, channels differ, and this sequence is broadly stable across all of them. Each stage is a place where an application can stop, and knowing where applications stop is most of what a lending product manager works on.</p>\n<div class='flow'>\n<div class='n'><b>1 &nbsp; Sourcing</b>The applicant arrives &mdash; branch, app, website, partner platform, direct sales agent.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>2 &nbsp; Application capture</b>Personal, employment and income details. Every field here is a drop-off risk.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>3 &nbsp; Identity and KYC</b><span class='k'>Know Your Customer</span> &mdash; the regulatory obligation to verify who the applicant is before transacting.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>4 &nbsp; De-duplication</b>Do we already know this person? Existing exposure, prior rejection, an application already open.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>5 &nbsp; Bureau pull</b>Credit history from a credit information company. The single highest-value external input.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>6 &nbsp; Eligibility screening</b>Hard gates. Age, geography, minimum income, product rules. Cheap checks first, deliberately.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>7 &nbsp; Scoring</b>A model produces a probability of default or a score band. Statistical, not judgemental.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>8 &nbsp; Policy rules</b>The credit policy applied as executable rules. Where the institution's appetite actually lives.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>9 &nbsp; Decision and terms</b>Approve, decline, or refer to a human. If approved: amount, tenor, rate, conditions.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>10 &nbsp; Offer and agreement</b>Terms disclosed, accepted, documents signed and stored.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>11 &nbsp; Disbursal</b>Money moves, the account opens on the servicing system, and the first repayment date is set.</div>\n</div>\n<p>The ordering of stages 5 to 8 is an engineering decision with real money attached. <strong>A bureau pull costs a fee per enquiry.</strong> Running the free eligibility gates before the paid bureau call, rather than after, removes the cost of every application that was never going to qualify. On a funnel where half the applicants fail a hard gate, that is half the bureau spend.</p>"

     "b": "<p>These four names get used interchangeably in conversation and mean quite different things. Getting them wrong in a specification sends work to the wrong team.</p>\n<div class='dt'><table>\n<tr><th>System</th><th>Holds</th><th>Lives for</th></tr>\n<tr class='hi'><td>Loan origination system (LOS)</td><td class='n'>The application, from arrival to disbursal</td><td class='g'>Days. Discards nothing but stops mattering after booking</td></tr>\n<tr class='hi'><td>Loan management system (LMS)</td><td class='n'>The live loan &mdash; schedule, balance, arrears, closure</td><td class='g'>Years. The system of record for what is owed</td></tr>\n<tr><td>Core banking system</td><td class='n'>Customer, accounts, the general ledger</td><td class='g'>Permanently. Everything eventually posts here</td></tr>\n<tr><td>Decision engine</td><td class='n'>The rules and the scorecard. Stateless</td><td class='g'>Milliseconds. Called, answers, forgets</td></tr>\n</table></div>\n<p>Two boundaries cause most integration trouble:</p>\n<ul>\n<li><strong>The LOS to LMS handoff at disbursal.</strong> The application record and the loan account are different objects with different identifiers, and everything about the application that will later be needed for an audit or a dispute has to survive the crossing. What is not carried over is effectively lost.</li>\n<li><strong>The decision engine being stateless.</strong> It answers with a decision but does not remember making it. <strong>If the caller does not store the inputs, the rule version and the output, the decision cannot be explained afterwards</strong> — and explaining a two-year-old decline to a customer or a regulator is a routine requirement, not a rare one.</li>\n</ul>\n<div class='note'>A specification that says the system shall decide the application, without naming which of these four boxes decides, stores and explains, is not yet specified. Those are three separate responsibilities and they commonly sit in three different      "h": "What comes back, and what a <em>thin file</em> does",
     "b": "<p>A <span class='k'>credit information company</span> — called a credit bureau — collects repayment behaviour reported by lenders and returns a consolidated history on request. In India these operate under the Credit Information Companies (Regulation) Act, 2005, and lenders are required to report to them.</p>\n<p>A typical response carries five things:</p>\n<div class='dt'><table>\n<tr><th>Element</th><th>Used for</th></tr>\n<tr class='hi'><td>Score</td><td class='g'>A single number summarising risk. Convenient, and never the whole decision</td></tr>\n<tr><td>Trade lines</td><td class='g'>Every known credit facility, its balance and its status</td></tr>\n<tr><td>Repayment history</td><td class='g'>Month by month, usually 36 months. Where the real signal is</td></tr>\n<tr><td>Enquiries</td><td class='g'>Who else has searched recently. A burst of enquiries is itself a risk signal</td></tr>\n<tr><td>Disputes and remarks</td><td class='g'>Settled, written off, restructured. Individually decisive</td></tr>\n</table></div>\n<p>Two distinctions a specification must make explicitly:</p>\n<div class='two'><div><b>Hard against soft enquiry</b>A <strong>hard</strong> enquiry is recorded on the file and visible to other lenders, and repeated hard enquiries lower the applicant's standing. A <strong>soft</strong> enquiry is not. Pre-qualification journeys must use soft, and a requirement that does not say which has left it to whoever writes the integration.</div>\n<div><b>Thin file</b>An applicant with little or no credit history. <strong>Not the same as bad history.</strong> A scorecard trained on people with history cannot score them meaningfully, and treating a thin file as a low score declines exactly the first-time borrowers most institutions say they want.</div></div>\n<p>The thin file is a genuine design decision rather than a technicality. The options are a separate policy path using non-bureau signals, a smaller limit offered as a trial, or a human referral. <strong>What is not an option is silence</strong>, because the system will then apply whatever the scorecard emits for an absent history, and nobody will have decided that.</p>\n<div class='note'>Bureau data arrives late, arrives partially, and occasionally does not arrive. Every one of those is a requirement: what the system does at timeout, what it does with a partial response, and whether a decision may proceed without a bureau at all. Mission 04's exception rule applies here more than anywhere.</div>"

    {

     "h": "The rate that measures the whole <em>machine</em>",
     "b": "<p><span class='k'>Straight-through processing</span>, usually shortened to STP, means an application that completes from submission to decision with no human touching it. The <strong>STP rate</strong> is the proportion of applications that do so.</p>\n<p>It is the single most useful number about a lending operation because almost everything shows up in it. Cost per application, turnaround time, capacity limits and the quality of the rule set all move it.</p>\n<div class='stat'><div><b>Cost</b><span>Manual review is the dominant unit cost</span></div><div><b>Speed</b><span>Human queues are where elapsed time goes</span></div><div><b>Scale</b><span>A non-STP business grows by hiring</span></div></div>\n<p>The number is also easy to game, and knowing how is part of reading it honestly:</p>\n<ul>\n<li><strong>Auto-declining more applications raises the STP rate</strong> and shrinks the book. STP must always be read together with approval rate and with the eventual credit performance of what was approved.</li>\n<li><strong>Referral for a reason that is not risk</strong> — a missing document, a name mismatch — counts as a break in straight-through processing but tells you nothing about the credit rules. Separate the two categories or the number cannot be acted on.</li>\n<li><strong>An STP rate quoted without a denominator</strong> is not a number. Of all applications started, or all submitted, or all that passed eligibility? The three differ substantially.</li>\n</ul>\n<div class='note'>The productive use is not the rate itself but its decomposition. Take every application that broke straight-through in a month, group by the reason, and rank. The top three reasons are usually a small number of rules or a single missing data source, and they are the actual roadmap for the next quarter.</div>"

     "b": "<div class='stamp'>Collected 19 August 2026</div>\n<p>In India, digital lending is governed by a single consolidated instrument: the Reserve Bank of India (Digital Lending) Directions, 2025, issued 8 May 2025. It replaced the 2022 digital lending guidelines and the 2023 default loss guarantee guidelines, which are repealed.</p>\n<p><span class='k'>Digital lending</span> is defined there as a remote and largely automated lending process across customer acquisition, credit assessment, approval, disbursement, recovery and associated customer service. A <span class='k'>regulated entity</span> (RE) means a commercial bank, co-operative bank, non-banking financial company including a housing finance company, or an all-India financial institution.</p>\n<p>These are product design constraints, not compliance paperwork. Each one closes off a design that would otherwise be chosen.</p>\n<div class='dt'><table>\n<tr><th>Constraint</th><th>What it forbids</th></tr>\n<tr class='hi'><td>Disbursal routing</td><td class='g'>Money goes only to the borrower's own bank account. No pass-through or pool account controlled by a third party, and no third-party control of fund flow in either direction</td></tr>\n<tr class='hi'><td>Device permissions</td><td class='g'>A lending app must not access files and media, contact list, call logs or telephony functions. Camera, microphone and location only as one-time access for onboarding or identity verification, with explicit consent</td></tr>\n<tr><td>Data residency</td><td class='g'>Data stored only on servers in India. If processed abroad, deleted there and returned within 24 hours of processing</td></tr>\n<tr><td>Cooling-off</td><td class='g'>The borrower may exit by repaying principal and proportionate interest without penalty. The period is set by the RE's board and cannot be less than one day. A one-time processing fee may be retained only if disclosed upfront</td></tr>\n<tr><td>Creditworthiness</td><td class='g'>Assessed before every loan, capturing at minimum age, occupation and income, retained for audit. No automatic credit limit increase without an explicit recorded request from the borrower</td></tr>\n<tr><td>Disclosure</td><td class='g'>A Key Fact Statement is mandatory, and signed documents must flow automatically to the borrower's registered email or SMS on execution</td></tr>\n<tr><td>Grievance</td><td class='g'>A named nodal officer at the RE and at any borrower-facing partner. After 30 days without resolution the borrower may escalate to the Reserve Bank's complaint system</td></tr>\n<tr><td>Liability</td><td class='g'>Outsourcing never dilutes the RE's obligations. The RE remains fully responsible for the acts and omissions of any partner it engages</td></tr>\n</table></div>\n<p>The last row is the one that changes how a specification is written. <strong>Where a partner performs part of the journey, the requirement still belongs to the regulated entity</strong>, so the specification must state what the partner will do, how it will be evidenced, and how the entity will check it. A requirement that stops at the boundary of the organisation is incomplete.</p>\n<div class='src'>Source: Reserve Bank of India (Digital Lending) Directions, 2025, reference DOR.STR.REC.19/21.07.001/2025-26, dated 8 May 2025. Provisions summarised from paragraphs 5 to 13 of the Directions. Two paragraphs commenced later than the rest: multi-lender arrangements from 1 November 2025 and app reporting from 15 June 2025.</div>\n<div class='docs'><b>Official source</b>\n<a href='https://rbi.org.in/Scripts/NotificationUser.aspx?Id=12848&amp;Mode=0' target='_blank' rel='noopener'>Reserve Bank of India &mdash; Reserve Bank of India (Digital Lending) Directions, 2025</a></div>"

     "h": "Who does the work, and who takes the <em>loss</em>",

counts monthly, within 7 working days of month end</td><td class='g'>A recurring reporting requirement with a hard date</td></tr>\n</table></div>\n<p>The sixth row is the one most often misunderstood. <strong>A guarantee does not make a defaulted loan perform.</strong> The loan is still recognised as non-performing and still provisioned by the lender. The regulation also states plainly that a guarantee is not a substitute for credit appraisal — underwriting standards are required regardless of cover.</p>"

     "b": "<p>The regulator publishes an illustration for this, and it is worth following because the asymmetry is not obvious from the rule alone. Figures in crore of rupees.</p>\n<div class='wk'><div class='h'>Setting up the set</div>\n<div class='r'><b>Portfolio earmarked under the arrangement</b><span>40.00</span></div>\n<div class='r'><b>Ceiling at 5% of that set</b><span>2.00</span></div>\n<div class='r tot'><b>Cover activates proportionately as loans are actually disbursed, not at earmarking</b><span>&mdash;</span></div>\n</div>\n<div class='wk'><div class='h'>Disbursal, in two tranches</div>\n<div class='r'><b>First disbursal</b><span>10.00</span></div>\n<div class='r'><b>Cover available &mdash; 5% of 10.00</b><span>0.50</span></div>\n<div class='r'><b>Second disbursal</b><span>10.00</span></div>\n<div class='r tot'><b>Cover available &mdash; 5% of 20.00 disbursed</b><span>1.00</span></div>\n</div>\n<div class='wk'><div class='h'>Three events, in sequence</div>\n<div class='r'><b>Case 1 &mdash; 5.00 matures with no default. Outstanding falls to 15.00</b><span>Cover 1.00</span></div>\n<div class='r'><b>Case 2 &mdash; default of 2.00. The full available cover of 1.00 is invoked</b><span>Cover 0.00</span></div>\n<div class='r tot'><b>Case 3 &mdash; 1.00 recovered on those defaulted loans. Outstanding falls to 14.00</b><span>Cover still 0.00</span></div>\n</div>\n<p>Read the last two rows together. Cover was calculated on the amount disbursed, so repayments in Case 1 did not reduce it. But in Case 3, <strong>recovering money does not restore the cover</strong>, even though the loss it was invoked against has partly reversed.</p>\n<p>The consequence for anyone specifying this: <strong>available cover is not a balance that can be recomputed from current state.</strong> It is a running figure that only ever decreases, so the system must hold invoked-to-date as its own stored value rather than deriving it. A design that recalculates cover from the outstanding portfolio each night will produce a number that is higher than the true one and will be wrong in the institution's favour, which is the worst direction for an error of this kind.</p>\n<div class='note'>Cover of 1.00 against a default of 2.00 also shows the ordinary case: the guarantee is partial by construction. At a 5% cap it is designed to absorb the first slice of losses, not to transfer the credit risk.</div>"

     "t": "Whose component",
     "h": "The rules engine is a <em>technology</em> component",
     "b": "<p>It has a vendor, it sits in the architecture diagram, it is deployed and versioned and monitored like any other service. So it belongs to technology, and the requirement is to integrate with it.</p>\n<p>This is wrong in an expensive way. <strong>The rules engine is the credit policy, in executable form.</strong> The technology is the container. The content is a set of statements about who the institution will lend to and on what terms, and those statements are owned by the credit function, approved through a credit governance process, and answerable to a regulator.</p>\n<p>The mistake is believable because everything visible about the engine is technical — the interface, the deployment, the latency. The part that is not technical is invisible in the architecture diagram: a change to a threshold from 650 to 640 is one number in a configuration file and is a change to the institution's risk appetite.</p>\n<p>Three consequences that follow directly:</p>\n<ul>\n<li><strong>Rule changes need credit approval, not just release approval.</strong> A deployment process that treats rule configuration as a technical release will eventually let a threshold change through without a credit signature, and that is an audit finding waiting to be written.</li>\n<li><strong>Rule versions must be retained the way policy versions are retained.</strong> Explaining a decision from two years ago requires the rule set as it stood on that date, not the current one.</li>\n<li><strong>The engine is now, in a growing number of jurisdictions, formally a model.</strong> Regulatory definitions of what constitutes a model have widened to include decision-based rules and algorithms, which brings inventory, validation and independent review obligations. Mission 11 covers this.</li>\n</ul>\n<div class='note'>A useful question in any design review: if this rule produced a wrong outcome for one customer, who would be answerable? If the answer is a credit officer rather than an engineer, the rule is policy and needs to be governed as policy no matter where it physically lives.</div>"

     "h": "Policy is written to be <em>read</em>, not executed",
     "b": "<p>A credit policy is a document approved by a committee. It is written in the register of a committee document: complete sentences, some hedging, and an assumption that an experienced person will apply judgement to the edges.</p>\n<p>Here is a clause of the kind that arrives:</p>\n<div class='note'>Personal loans may be extended to salaried applicants aged between 23 and 58 with a minimum monthly income of &#8377;25,000, provided the applicant's total obligations after this loan do not exceed 50% of net income. Applicants with recent adverse credit history should generally not be approved. Cases marginally outside these parameters may be considered by an appropriate authority.</div>\n<p>A human reads that and knows roughly what to do. A machine cannot execute a word of it. Six separate things are undefined:</p>\n<ul>\n<li><strong>Aged between 23 and 58</strong> &mdash; inclusive at both ends? Measured at application or at disbursal? On the last birthday or in completed months?</li>\n<li><strong>Minimum monthly income of &#8377;25,000</strong> &mdash; gross or net? Which months, if it varies? What counts as income for someone with two employers?</li>\n<li><strong>Total obligations</strong> &mdash; which obligations, from which source, and does the proposed loan's instalment count?</li>\n<li><strong>Net income</strong> &mdash; net of tax, or net of tax and existing deductions? These give different answers.</li>\n<li><strong>Recent adverse credit history</strong> &mdash; recent how? Adverse meaning what, exactly?</li>\n<li><strong>Should generally not</strong> and <strong>marginally</strong> and <strong>appropriate authority</strong> &mdash; three phrases with no operational meaning at all.</li>\n</ul>\n<p><strong>Every one of those is a question for the policy owner, not a decision for the analyst.</strong> That is the central discipline of this mission. The analyst's job is to find the ambiguity and force it to be resolved by the person with the authority cation. Where an input can genuinely be absent, the honest table has three states for that row, and the arithmetic on the next card changes accordingly.</div>"

     "b": "<p>Completeness is checkable because the number of possible combinations is calculable in advance. If the table has fewer columns than the count, something is uncovered.</p>\n<div class='fx'><div class='cap'>Combinations across all conditions</div>\n<div class='eq'><em>C</em> &nbsp;=&nbsp; <em>s</em><sub>1</sub> &times; <em>s</em><sub>2</sub> &times; &hellip; &times; <em>s</em><sub>n</sub></div>\n<div class='wh'>C&nbsp;&nbsp;the number of distinct combinations the table must account for<br>\ns&#8321;&nbsp;the number of possible states of condition i &mdash; 2 if it is only true or false, 3 if it can also be unknown<br>\nn&nbsp;&nbsp;the number of conditions in the table</div></div>\n<p>Where every condition is binary this reduces to the familiar form:</p>\n<div class='fx'><div class='cap'>All conditions binary</div>\n<div class='eq'><em>C</em> &nbsp;=&nbsp; 2<sup><em>n</em></sup></div>\n<div class='wh'>n&nbsp;&nbsp;the number of binary conditions<br>\nSo four conditions give 16 combinations, five give 32, and eight give 256</div></div>\n<p>Two consequences worth holding on to:</p>\n<ul>\n<li><strong>Allowing unknown roughly halves the number of conditions you can handle in one table.</strong> Five conditions at two states is 32 columns. Five conditions at three states is 243. That is not a table anyone will review properly.</li>\n<li><strong>Above about six conditions, split the table.</strong> Run a first table that produces an intermediate outcome, then a second that consumes it. A 256-column table is not more rigorous than two tables of sixteen; it is less, because nobody checks it.</li>\n</ul>\n<div class='note'>The count is an upper bound on what must be <em>accounted for</em>, not on the number of columns written. Marking a condition as does-not-matter with a dash collapses many combinations into one column legitimately. The check is that the collapsed columns still add up to C.</div>"

     "b": "<p>Taking the clause from the first card, after the policy owner has answered every question. Their answers are the specification and each one is recorded against their name.</p>\n<div class='wk'><div class='h'>Answers obtained from the policy owner</div>\n<div class='r'><b>Age: completed years at application, inclusive both ends</b><span>23 &le; age &le; 58</span></div>\n<div class='r'><b>Income: net monthly, averaged over 3 months, from salary credits</b><span>income &ge; 25,000</span></div>\n<div class='r'><b>Obligations: all bureau instalments plus this loan's instalment, over net income</b><span>ratio &le; 50%</span></div>\n<div class='r'><b>Adverse: any 90+ days past due in the last 24 months, or any settlement or write-off ever</b><span>Boolean</span></div>\n<div class='r'><b>Marginally outside: income within 10% below, or ratio within 5 points above</b><span>Now testable</span></div>\n<div class='r tot'><b>Appropriate authority: credit manager grade 3 or above, one deviation per application</b><span>Named</span></div>\n</div>\n<p>Four conditions, each binary once defined, so sixteen combinations must be accounted for. Adverse history is decisive on its own, which collapses eight of them.</p>\n<div class='wk'><div class='h'>The table, collapsed</div>\n<div class='r'><b>Adverse Y &nbsp;&mdash; all other conditions irrelevant</b><span>DECLINE &nbsp; R01</span></div>\n<div class='r'><b>Adverse N, age N &nbsp;&mdash; outside 23 to 58</b><span>DECLINE &nbsp; R02</span></div>\n<div class='r'><b>Adverse N, age Y, income Y, ratio Y</b><span>APPROVE &nbsp; R03</span></div>\n<div class='r'><b>Adverse N, age Y, income Y, ratio N, marginal Y</b><span>REFER &nbsp; R04</span></div>\n<div class='r'><b>Adverse N, age Y, income Y, ratio N, marginal N</b><span>DECLINE &nbsp; R05</span></div>\n<div class='r'><b>Adverse N, age Y, income N, marginal Y</b><span>REFER &nbsp; R06</span></div>\n<div class='r'><b>Adverse N, age Y, income N, marginal N</b><span>DECLINE &nbsp; R07</span></div>\n<div class='r tot'><b>Any condition input unavailable</b><span>REFER &nbsp; R08</span></div>\n</div>\n<p>Check the arithmetic. Adverse Y covers 8 of the 16. Age N with adverse N covers 4. The remaining 4 are the age-Y, adverse-N cases, split by income and ratio into the five rows above, with marginal acting as a sub-split rather than a fifth condition. Every combination is accounted for.</p>\n<p>Two things this exposes that the prose clause did not. <strong>The final row is a decision nobody had made</strong> — the policy never said what happens when a value is simply unavailable, and defaulting it to decline would reject applicants for a bureau timeout. And <strong>R04 and R06 both refer, but for different reasons</strong>, so a reason code is needed on each to make the referral queue triageable and to tell the applicant something true.</p>"

     "b": "<p>Every credit policy has a legitimate way to say yes to a case the rules say no to. Getting this specified properly is what keeps it legitimate.</p>\n<div class='two'><div><b>Deviation</b>A departure from policy that policy itself anticipates, within defined bounds, approved by a named authority. The marginal cases in the worked example. <strong>Planned.</strong></div>\n<div><b>Override</b>A decision to set aside the system's output entirely. Broader, rarer, and requiring higher authority. <strong>Exceptional.</strong></div></div>\n<p>What must be specified for either to be auditable:</p>\n<div class='dt'><table>\n<tr><th>Element</th><th>Why</th></tr>\n<tr class='hi'><td>Who may approve, by grade and by size band</td><td class='g'>Without this, authority is whoever is available</td></tr>\n<tr class='hi'><td>The original system decision, stored unchanged</td><td class='g'>The whole point. If the record shows only the final outcome, the deviation is invisible</td></tr>\n<tr><td>A reason, from a controlled list, plus free text</td><td class='g'>A list makes deviations countable. Free text alone cannot be analysed</td></tr>\n<tr><td>Approver identity and timestamp</td><td class='g'>Non-repudiation</td></tr>\n<tr><td>How many are permitted per application</td><td class='g'>Stacking three deviations produces a case outside policy in every dimension</td></tr>\n<tr><td>Reporting of deviation volumes</td><td class='g'>The rate is a control indicator in its own right</td></tr>\n</table></div>\n<p>The second row is the requirement people get wrong. <strong>If the approved decision overwrites the system decision in the same field, the deviation has been erased.</strong> Both must be stored, and every report on rule performance must be able to exclude deviated cases, because otherwise the rules will appear to be approving people they in fact declined.</p>\n<div class='note'>A rising deviation rate on one rule is the most useful early signal a lending business gets. It means the rule and the actual appetite have drifted apart, and it is far better to find that in a monthly deviation report than in a portfolio review two years later.</div>"

     "b": "<p>A customer complains. A regulator asks. An internal review samples old cases. The question is always the same: <strong>why was this specific application declined on that specific date?</strong></p>\n<p>Answering it requires the rule set as it stood then, not as it stands now. That needs three things designed in from the start, and retrofitted afterwards none of them work properly.</p>\n<div class='flow'>\n<div class='n'><b>Rules are versioned</b>Every change produces a new version with an identifier. Rules are never edited in place. The old version is retained, not archived out of reach.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Versions are effective-dated</b>Each version carries the dates between which it applied. Two versions never overlap, and there is never a gap.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Every decision stores its version</b>The decision record holds the rule version identifier, the input values as they were at the moment of decision, and the output. Not a pointer to current data &mdash; the values themselves.</div>\n</div>\n<p>The third step is the one that gets specified weakly. A decision record holding a customer identifier and a decision looks sufficient, and it is not, because <strong>the customer's income, obligations and bureau history have all changed since.</strong> Re-running the old rules against today's data does not reconstruct the decision; it produces a different one and hides the fact that it has.</p>\n<div class='two'><div><b>As-at reconstruction</b>What was true when the decision was made. Requires stored inputs. This is what an audit needs.</div>\n<div><b>As-is reconstruction</b>What today's rules would do with today's data. Useful for testing a rule change. Answers a different question and must never be presented as the first.</div></div>\n<div class='note'>The same discipline extends to the scorecard. If a score contributed to the decision, the model version and the score value are stored alongside the rule version. A score is not reproducible from stored inputs alone once the model has been retrained.</div>"

     "h": "Boundaries, impossibilities, and the <em>silent</em> path",
     "b": "<p>Rule sets fail in a small number of characteristic ways, and a test plan built around those ways finds far more than one built by picking representative cases.</p>\n<div class='dt'><table>\n<tr><th>Test</th><th>What it looks for</th><th>Why it finds things</th></tr>\n<tr class='hi'><td>Boundary values</td><td class='n'>At the threshold, one below, one above</td><td class='g'>Off-by-one on an operator is the most common rule defect there is</td></tr>\n<tr class='hi'><td>Missing inputs</td><td class='n'>Each input absent, one at a time</td><td class='g'>Finds the silent default that no column covered</td></tr>\n<tr><td>Every reason code</td><td class='n'>At least one case producing each code</td><td class='g'>An unreachable code means a column that can never fire</td></tr>\n<tr><td>Impossible combinations</td><td class='n'>Deliberately construct them</td><td class='g'>Confirms the system rejects them rather than deciding on them</td></tr>\n<tr><td>Regression on a real sample</td><td class='n'>Re-run past decisions through the new version</td><td class='g'>Shows how many outcomes change, which is the business question</td></tr>\n<tr><td>Deviation stacking</td><td class='n'>Multiple deviations on one case</td><td class='g'>Finds whether the per-application limit is enforced</td></tr>\n</table></div>\n<p>The fifth row is the one that changes conversations. Running a proposed rule change over the last three months of real applications produces a count: <strong>this change would have altered 312 decisions, of which 280 move from decline to refer and 32 from approve to decline.</strong> That is a business impact statement, and it converts an argument about whether a threshold feels right into a discussion about a number.</p>\n<div class='note'>Do it before the change is approved, not after it is built. The regression sample is cheap to run and it regularly stops changes that sounded reasonable and would have moved a tenth of the book.</div>"

     "b": "<p>A case is decided wrongly. The rule is checked against the policy document. It matches. Therefore the rule is correct and the problem lies elsewhere — bad data, an unusual customer, an operational error.</p>\n<p>Frequently the rule matches the policy and both are wrong, because <strong>the policy was ambiguous and the implementation resolved the ambiguity silently.</strong> Somebody chose greater-than rather than greater-than-or-equal. Somebody decided missing income means proceed. Nobody recorded either choice, so the rule now matches one reading of a sentence that has two.</p>\n<p>It is a believable mistake because the check that was performed is a real check and it did pass. Comparing rule to policy is the correct thing to do; it simply cannot detect a defect where the policy is silent, and silence is invisible in a comparison.</p>\n<p>What actually finds it:</p>\n<ul>\n<li><strong>Read the rule as implemented, not the rule as specified.</strong> The operators, the null handling and the order of evaluation are in the configuration, and that is the only place the resolved ambiguity is visible.</li>\n<li><strong>Ask what the policy does not say.</strong> Every unstated boundary, every unstated treatment of missing data, every unstated interaction between two clauses.</li>\n<li><strong>Take the answer back to the policy owner and get the clause amended.</strong> Fixing the rule alone leaves the ambiguity in place for the next implementation to resolve differently.</li>\n</ul>\n<div class='note'>This is why the decomposition on the second card produces a fourth bucket for undefined language. Those items are not annoyances to be cleaned up before the real work. <strong>They are the deliverable.</strong> A policy clause that has been through this process comes back more precise than it went in, and that improvement outlives the system.</div>"

     "l": "ORIENT",
     "t": "The boundary",
     "h": "What this mission does and does <em>not</em> cover",
     "b": "<p>Data work in a bank is a discipline in its own right, with its own architecture, its own tooling and its own regulatory frame. This mission does not teach it. It teaches the part an analyst owns: <strong>specifying what is needed, and accepting what comes back.</strong></p>\n<div class='two'><div><b>In scope here</b>The mapping document. The questions asked before design. The vocabulary used to describe a defect. The evidence required before signing that an extract is correct.</div>\n<div><b>Not in scope here</b>Pipeline architecture, warehouse design, orchestration, storage formats, and the enterprise data governance framework. Different discipline, different mission, and in most institutions a different team.</div></div>\n<p>Two terms are needed throughout and are defined here so nothing later depends on prior knowledge.</p>\n<p><span class='k'>ETL</span> stands for extract, transform, load: pull data from a source, change its shape or content, and write it into a target. <span class='k'>Data lineage</span> is the recorded path a value took to arrive where it is — which source, through which transformations, into which field. Lineage is what makes it possible to answer where a number came from, and it is a requirement rather than a nicety in a regulated institution.</p>\n<div class='note'>The reason this boundary is drawn explicitly: an analyst who tries to design the pipeline usually produces a design the data team will not build, and an analyst who specifies nothing beyond <em>we need this data</em> produces months of rework. The mapping document is the correct place to stand.</div>"

words. Two systems both have customer_type and they differ</span></div>\n<div class='r'><b>Owner</b><span>Who answers questions about this field. Named, not a team</span></div>\n<div class='r'><b>Sensitivity</b><span>Personal data, restricted, public. Drives masking, residency and retention</span></div>\n<div class='r'><b>Historical treatment</b><span>Does a correction to an old record overwrite, or create a new version</span></div>\n</div>"

     "l": "MECHANISM",

     "h": "Eight questions, asked <em>first</em>",
     "b": "<p>These are asked before any pipeline is designed. Each one, unanswered, produces a specific and predictable failure some weeks later.</p>\n<div class='dt'><table>\n<tr><th>Question</th><th>Unanswered, this happens</th></tr>\n<tr class='hi'><td>What is the grain &mdash; what does one row represent?</td><td class='g'>The most consequential question. One row per loan, per instalment, or per loan per day are three different datasets and totals will not reconcile between them</td></tr>\n<tr class='hi'><td>What volume, initially and per run?</td><td class='g'>Designed for thousands, delivered millions. Runs overnight and does not finish</td></tr>\n<tr><td>How often does it run, and by when must it finish?</td><td class='g'>The batch window is discovered after the design is fixed</td></tr>\n<tr><td>How much history is needed at the start?</td><td class='g'>A one-off migration nobody scoped, often larger than the ongoing feed</td></tr>\n<tr><td>What is the key, and is it stable?</td><td class='g'>Keys that get reissued create duplicates that look like growth</td></tr>\n<tr><td>Which fields can be null, and what does null mean there?</td><td class='g'>Unknown treated as zero. Averages and totals both wrong</td></tr>\n<tr><td>Can data arrive late, and how late?</td><td class='g'>A figure reported on the 1st changes by the 5th, and nobody expected it to</td></tr>\n<tr><td>Can data be corrected retrospectively?</td><td class='g'>A report run twice for the same period gives two answers</td></tr>\n</table></div>\n<p>The last two are the pair that causes the most argument after go-live, because they break an assumption nobody knew they were making: that a past period is finished. <strong>In lending it very often is not.</strong> A repayment posts late, a classification is corrected, a write-off is reversed. If the design assumes closed periods and the business does not have them, every downstream number becomes irreproducible.</p>\n<div class='note'>The grain question p>The difference between the second and third lines is a design decision worth noticing. <strong>Some failures should stop the load and some should be reported and let through</strong>, and deciding which is a business call about whether a partial dataset is more useful than none. It is not a technical default.</p>"

     "b": "<p>Looking at the output and seeing that it seems right is not acceptance. <span class='k'>Reconciliation</span> is: proving that what arrived agrees with what left, by a stated method, with the difference explained.</p>\n<p>Four checks, and they are run in this order because each one narrows what the next has to explain.</p>\n<div class='flow'>\n<div class='n'><b>Row count</b>Rows out of the source against rows into the target, plus rows deliberately rejected. The three must add up exactly.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Control totals</b>Sum every monetary and quantity field at both ends. This catches truncation and unit errors that a row count cannot see.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Tie-out to an authoritative source</b>Against the general ledger or the system of record, not against another copy of the same extract. Agreeing with a sibling copy proves nothing.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Record-level sample</b>A defined number of individual records traced end to end, chosen to include boundary and exception cases rather than at random.</div>\n</div>\n<p>Two rules that make the difference between reconciliation and its appearance:</p>\n<ul>\n<li><strong>Every difference is explained, not tolerated.</strong> A gap of eleven rows with no explanation is a defect even if eleven is small. Unexplained differences of a known size become permanent, and next month's gap of eleven hundred gets compared against the wrong baseline.</li>\n<li><strong>Reconciliation runs every time, not once at acceptance.</strong> A pipeline that reconciled at go-live proves nothing about tonight's run. The controls belong in the production process as an ongoing check.</li>\n</ul>\n<div class='note'>Where a difference is genuinely expected &mdash; a source that includes cancelled records the target excludes &mdash; that is not an unexplained difference. It is a reconciling item, and it gets written into the reconciliation specification with its expected size so that a change in it is itself detectable.</div>"

ecause it is the only check that involves the actual consumer.</div>"

     "b": "<div class='stamp'>Collected 19 August 2026</div>\n<p>The reference framework for risk data in banking is the Basel Committee's <em>Principles for effective risk data aggregation and risk reporting</em>, published in January 2013 and universally referred to by its standard number, 239. It sets out <strong>fourteen principles</strong> across governance, data architecture, aggregation capability, reporting practice and supervisory review.</p>\n<p>It applied from 1 January 2016 for global systemically important banks designated by November 2012, and three years after designation for those named later. National supervisors were recommended to apply it to domestically important banks on the same basis.</p>\n<div class='dt'><table>\n<tr><th>Date</th><th>Position</th></tr>\n<tr><td>January 2013</td><td class='g'>Principles published</td></tr>\n<tr><td>January 2016</td><td class='g'>Compliance expected for the first cohort</td></tr>\n<tr class='hi'><td>November 2023</td><td class='g'>Progress report across 31 global systemically important banks: banks at differing stages, significant work remaining at most, earlier recommendations reiterated</td></tr>\n<tr class='hi'><td>January 2026</td><td class='g'>Committee newsletter naming the current themes: governance of aggregation activity, <strong>data lineage</strong>, cross-border issues, and the implications of artificial intelligence adoption</td></tr>\n</table></div>\n<p>Two things are worth carrying from this rather than the principles themselves. First, <strong>a standard published in 2013 with a 2016 deadline was still the subject of a supervisory progress report in 2026</strong>, which is a fair indication of how hard the underlying problem is and why data programmes in banks are long. Second, the 2026 themes tell you what a supervisor is currently interested in, and lineage sits at the centre of it.</p>\n<p>India has its own movement on this. On <strong>15 July 2026</strong> the Reserve Bank of India issued a draft <em>Guidance on Regulatory Expectations for Data Governance</em> for public comment. <strong>As at 19 August 2026 it remains a draft.</strong> Anyone specifying data work for an Indian regulated entity should check its status, because a finalised version would sit directly over the material in this mission.</p>\n<div class='src'>Sources: Basel Committee on Banking Supervision, Principles for effective risk data aggregation and risk reporting, January 2013. Progress report dated 28 November 2023. Committee newsletter dated 6 January 2026, which is explicitly informational and does not constitute new supervisory guidance.</div>\n<div class='docs'><b>Official sources</b>\n<a href='https://www.bis.org/publ/bcbs239.pdf' target='_blank' rel='noopener'>Basel Committee on Banking Supervision &mdash; Principles for effective risk data aggregation and risk reporting</a>\n<a href='https://www.bis.org/publ/bcbs_nl36.htm' target='_blank' rel='noopener'>Basel Committee on Banking Supervision &mdash; Newsletter on implementation of the BCBS 239 Principles</a>\n<a href='https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=63155' target='_blank' rel='noopener'>Reserve Bank of India &mdash; draft Guidance on Regulatory Expectations for Data Governance, 15 July 2026</a></div>"
    },
    {
     "l": "TRAP",
     "t": "It worked before",
     "h": "It matched last month, so it is <em>fine</em>",
     "b": "<p>The pipeline was validated thoroughly at go-live. It reconciled. It has run every night since without an error. Therefore the data is correct, and reconciling it again is duplicated effort.</p>\n<p>The flaw is that <strong>a pipeline proves nothing about its own correctness by not failing.</strong> The great majority of data defects do not raise errors. A source system adds a new product code the mapping does not recognise and it maps to the default bucket. An upstream team changes a date format. A join begins silently dropping rows because a reference table stopped being maintained. Every one of those produces a clean run and wrong numbers.</p>\n<p>It is a believable mistake because the reasoning is sound for software and wrong for data. Code that ran correctly last month will run correctly this month given the same inputs. <strong>The inputs are the thing that changes</strong>, and they change without anyone telling the pipeline's owner, because the person who added the product code had no reason to know the pipeline existed.</p>\n<p>What follows practically:</p>\n<ul>\n<li><strong>Reconciliation is a production control, not an acceptance activity.</strong> It runs on every execution and its output is monitored.</li>\n<li><strong>Coded fields need an unknown-value alarm.</strong> Any source value not in the agreed list must be raised rather than defaulted, or new categories will disappear into an existing bucket indefinitely.</li>\n<li><strong>Trend the reconciliation itself.</strong> A rejection rate that has drifted from 0.1% to 0.9% over four months is a defect nobody reported, because no single night ever looked wrong.</li>\n</ul>\n<div class='note'>This is where lineage earns its cost. When a number is questioned, lineage answers where it came from in minutes. Without it, the same question becomes a week of tracing, and the answer arrives after the conversation that needed it has finished.</div>"

    {
     "l": "ORIENT",
     "t": "The standing",
     "h": "Not the architect, and still has to <em>agree</em>",
     "b": "<p>The solution design is produced by a solution architect. It names components, interfaces, data stores and sequences. It is a technical document and the analyst did not write it.</p>\n<p>The analyst still has to sign that it meets the business requirement, and that signature is not a formality. <strong>The question being answered is not is this a good architecture. It is: if this is built exactly as drawn, will the business get what the requirement said it needed?</strong></p>\n<p>Those are different questions and the second one is answerable without an engineering background, because it is asked entirely in terms of the requirement:</p>\n<ul>\n<li>Every functional requirement has somewhere in the design that satisfies it.</li>\n<li>Every non-functional number from mission 04 appears in the design as a decision, not as an aspiration.</li>\n<li>The exception paths exist. Not just the working path.</li>\n<li>What happens when each external dependency is unavailable is stated.</li>\n<li>Somebody can operate it, and somebody can change it later.</li>\n</ul>\n<div class='note'>The failure mode to avoid is deferring entirely &mdash; accepting the design because it is technical and therefore someone else's judgement. The requirement is the analyst's, and a design that cannot be traced back to it has not been checked by anyone, because the architect is checking it against a different standard.</div>"

    {
     "l": "MECHANISM",
     "t": "Three states",
     "h": "Current, target, and the <em>awkward</em> ones between",
     "b": "<p>Any design of consequence describes at least three pictures, and the third is the one that gets skipped.</p>\n<div class='three'><div><b>Current state</b>How it works today, including the parts nobody is proud of. Must be accurate rather than tidy, or the gap analysis is fiction.</div>\n<div><b>Target state</b>The intended end point. Usually clean, usually further away than the current programme will reach.</div>\n<div><b>Transition states</b>The intermediate configurations the estate actually passes through. Where the real cost and the real risk sit.</div></div>\n<p>Transition states get skipped because they are ugly and nobody wants to design them. But <strong>a transition state is a real running system that real customers use, sometimes for a year or more</strong>, and it has to work.</p>\n<p>The questions that force them into the open:</p>\n<div class='dt'><table>\n<tr><th>Question</th><th>What it exposes</th></tr>\n<tr class='hi'><td>What runs on the day after the first release?</td><td class='g'>Both old and new, usually. Which is authoritative?</td></tr>\n<tr class='hi'><td>Where does data live while both exist?</td><td class='g'>Dual write, or one-way sync, or manual reconciliation. All three are work</td></tr>\n<tr><td>Which customers are on which system, and how does anyone know?</td><td class='g'>A routing rule nobody has specified</td></tr>\n<tr><td>What happens to a case that starts in the old and finishes in the new?</td><td class='g'>The in-flight population. Almost always underestimated</td></tr>\n<tr><td>How long will this state last, and who decides it has ended?</td><td class='g'>Temporary states become permanent when nobody owns their exit</td></tr>\n</table></div>\n<div class='note'>The fourth row is the one to press hardest in lending. Applications in progress at cutover exist in a partly completed state on the old system, and they cannot be abandoned. The options are drain them on the old system, migrate them mid-flight, or restart them, and the third is only acceptable if the customer is not asked to do the work again.</div>"
    },
    {
     "l": "CHEAT",
     "t": "Four patterns",
     "h": "How systems talk, and what each way <em>costs</em>",
     "b": "<p>Almost every integration decision reduces to one of four shapes. The analyst does not choose the technology, but does need to know what has been chosen on their behalf, because each one constrains what the business can be promised.</p>\n<div class='sheet'><div class='h'>Batch file</div>\n<div class='r'><b>What</b><span>A file produced on a schedule, transferred, and loaded</span></div>\n<div class='r'><b>Freshness</b><span>As old as the last run. Usually overnight</span></div>\n<div class='r'><b>Good for</b><span>Volume, reporting, anything where yesterday is acceptable</span></div>\n<div class='r'><b>Costs you</b><span>No real-time answer is possible. If the business later wants one, it is a rebuild</span></div>\n</div>\n<div class='sheet'><div class='h'>API call &mdash; application programming interface</div>\n<div class='r'><b>What</b><span>One system asks another and waits for the answer</span></div>\n<div class='r'><b>Freshness</b><span>Now</span></div>\n<div class='r'><b>Good for</b><span>Decisions in a customer journey. Bureau, identity, payment</span></div>\n<div class='r'><b>Costs you</b><span>A hard dependency. If it is slow or down, your journey is slow or down. Every call needs a timeout and a fallback specified</span></div>\n</div>\n<div class='sheet'><div class='h'>Event or stream</div>\n<div class='r'><b>What</b><span>A system announces that something happened; others react in their own time</span></div>\n<div class='r'><b>Freshness</b><span>Near real time, without the caller waiting</span></div>\n<div class='r'><b>Good for</b><span>Notifying many consumers, and decoupling them from each other</span></div>\n<div class='r'><b>Costs you</b><span>Ordering and duplicate delivery become your problem. Harder to reason about and harder to reconcile</span></div>\n</div>\n<div class='sheet q'><div class='h'>Direct database access</div>\n<div class='r'><b>What</b><span>One system reads another's tables</span></div>\n<div class='r'><b>Freshness</b><span>Now</span></div>\n<div class='r'><b>Good for</b><span>Being quick to build, and almost nothing else</span></div>\n<div class='r'><b>Costs you</b><span>The two systems are now permanently coupled. The owning team cannot change its schema without breaking you, and will eventually do it anyway</span></div>\n</div>\n<div class='note'>The pattern chosen sets the ceiling on what the product can promise. A journey built on an overnight batch cannot offer an instant decision, however the screens are designed. That constraint is worth surfacing at design review rather than discovering it in a later roadmap discussion.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "The questions",
     "h": "Nine things to ask at a design <em>review</em>",
     "b": "<p>These are answerable by an architect and each one exposes an assumption. None of them requires the asker to propose an alternative.</p>\n<div class='dt'><table>\n<tr><th>Question</th><th>Looking for</th></tr>\n<tr class='hi'><td>Which requirement does each component satisfy?</td><td class='g'>Components with no requirement behind them, and requirements with no component</td></tr>\n<tr class='hi'><td>What happens when this dependency is unavailable?</td><td class='g'>Asked of every external call. Fallback, queue, fail, or degrade</td></tr>\n<tr><td>What are the peak numbers this is designed for?</td><td class='g'>Whether the volume figures from the specification actually reached the design</td></tr>\n<tr><td>Where does the data physically sit?</td><td class='g'>Residency constraints, and which jurisdiction's rules apply</td></tr>\n<tr><td>How is a customer's data deleted?</td><td class='g'>Usually unanswered. Copies proliferate and deletion becomes impossible later</td></tr>\n<tr><td>How would we know this had gone wrong?</td><td class='g'>Monitoring and alerting, which are requirements rather than operational details</td></tr>\n<tr><td>What is the rollback if this release fails?</td><td class='g'>Some designs cannot be rolled back once data has been written in a new shape</td></tr>\n<tr><td>Who operates this, and have they seen it?</td><td class='g'>Operations discovering a system at go-live is a recurring and avoidable failure</td></tr>\n<tr><td>What does the next change to this cost?</td><td class='g'>Designs that are cheap once and expensive thereafter</td></tr>\n</table></div>\n<p>The fifth question is worth insisting on. Data protection regimes give individuals rights over their data including, in defined circumstances, erasure. <strong>A design that copies personal data into six places without recording that it did makes those rights impossible to honour</strong>, and it is far cheaper to answer the question at design than to run a discovery exercise across the estate two years later.</p>"
    },
    {
     "l": "DEFINE",
     "t": "Fit for purpose",
     "h": "Nine characteristics, used as a <em>checklist</em>",
     "b": "<p>The nine quality characteristics from mission 04 do a second job here. In specification they were used to ensure nothing was left unstated. In design review they are used to ask whether the design actually delivers each one.</p>\n<div class='dt'><table>\n<tr><th>Characteristic</th><th>Design review question</th></tr>\n<tr class='hi'><td>Functional suitability</td><td class='g'>Trace every requirement to a component. Any orphans either way?</td></tr>\n<tr class='hi'><td>Performance efficiency</td><td class='g'>What has been tested or modelled at peak, rather than assumed?</td></tr>\n<tr><td>Compatibility</td><td class='g'>What else uses these systems, and what does this change do to them?</td></tr>\n<tr><td>Interaction capability</td><td class='g'>Who uses it, on what device, and has accessibility been designed in?</td></tr>\n<tr><td>Reliability</td><td class='g'>Single points of failure. What is the recovery, and has it been rehearsed?</td></tr>\n<tr><td>Security</td><td class='g'>Where does personal data sit, who can see it, and how is access evidenced?</td></tr>\n<tr><td>Maintainability</td><td class='g'>Who can change this in two years, and how would they test the change?</td></tr>\n<tr><td>Flexibility</td><td class='g'>What is the next likely change, and what does the design do to its cost?</td></tr>\n<tr><td>Safety</td><td class='g'>What is the worst outcome for a customer if this misbehaves, and what limits it?</td></tr>\n</table></div>\n<p>Maintainability and flexibility are the two that get traded away silently, because neither costs anything today. <strong>A design optimised purely for the current requirement will meet it and make the following three changes expensive</strong>, and the person who signs it off is usually gone by then.</p>\n<p>The safety row reads oddly for a lending system until it is made concrete. The worst outcome is not a crash. It is a customer wrongly recorded as in default, an incorrect amount collected, or a decision that cannot be explained when challenged. <strong>Each of those has a design answer</strong> — a reversal path, a limit, a stored decision record — and each is cheaper to design than to retrofit.</p>"
    },
    {
     "l": "MECHANISM",
     "t": "Configure or customise",
     "h": "The difference that shows up in <em>year three</em>",
     "b": "<p>When a package is bought, every gap between what it does and what is needed gets closed one of four ways. The four have very different long-run costs and the difference is invisible at the point of decision.</p>\n<div class='dt'><table>\n<tr><th>Approach</th><th>What it means</th><th>Cost at upgrade</th></tr>\n<tr class='hi'><td>Configure</td><td class='n'>Use settings the product supports</td><td class='g'>None. Settings carry forward</td></tr>\n<tr><td>Extend</td><td class='n'>Use the product's own extension points</td><td class='g'>Low. Supported, though it must be retested</td></tr>\n<tr class='hi'><td>Customise</td><td class='n'>Modify the product's code</td><td class='g'>High, and recurring. Every upgrade reapplies and retests every modification</td></tr>\n<tr><td>Change the process</td><td class='n'>Adapt the business to the product</td><td class='g'>None technically. Real change management cost, once</td></tr>\n</table></div>\n<p>The recurring cost of customisation is what the phrase <span class='k'>upgrade tax</span> refers to: <strong>every modification must be reapplied, retested and often reworked at every version upgrade, for the life of the system.</strong> Twenty customisations do not cost twenty times one modification. They cost that, plus a permanent tax on every future upgrade, plus the growing likelihood that the institution simply stops upgrading — which is how banks end up on unsupported versions.</p>\n<p>The fourth row is the option the business resists and it is frequently correct. If the package's way of doing something is merely different rather than worse, changing the process is cheaper than changing the product forever. <strong>The test is whether the current way is a genuine differentiator or simply what people are used to</strong>, and that question is worth asking explicitly for each gap rather than assumed.</p>\n<div class='note'>A practical discipline during package selection: classify every gap into these four before choosing, not after. A product that fits 80% out of the box and needs twelve code modifications for the rest is frequently a worse choice than one fitting 70% where the remainder is configuration.</div>"
    },

     "l": "MECHANISM",

     "h": "How to evaluate without being <em>sold</em> to",
     "b": "<p>Vendor evaluation is a structured exercise, and the structure exists because the unstructured version reliably selects whoever demonstrated best.</p>\n<div class='flow'>\n<div class='n'><b>Requirements first, weighted, before any vendor is contacted</b>Otherwise the requirement list gets shaped by what the first demonstration contained.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Scripted demonstration</b>You write the script, using your own scenarios and your own data. Every vendor runs the same one. An unscripted demo shows what the product is best at, which you already assumed.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Gap classification</b>Every unmet requirement classified as configure, extend, customise or process change, and priced accordingly.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Reference calls with institutions like yours</b>Same size, same regulatory regime, ideally two years past go-live rather than newly live.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Total cost over five years</b>Licence, implementation, integration, migration, training, annual support, and the cost of leaving.</div>\n</div>\n<div class='sheet g'><div class='h'>Questions for a reference call</div>\n<div class='r'><b>What took longer than you expected</b><span>More useful than asking what went wrong</span></div>\n<div class='r'><b>How many customisations did you end up with</b><span>Compare against what they planned</span></div>\n<div class='r'><b>How did the last version upgrade go</b><span>The single most informative question available</span></div>\n<div class='r'><b>What do you wish you had specified differently</b><span>Gives you their hindsight for free</span></div>\n<div class='r'><b>What is your support experience like now</b><span>Attention after signature differs from attention before</span></div>\n</div>\n<p>One clause deserves attention while there is still negotiating leverage: <strong>what happens at exit.</strong> Can the institution extract its own data, in a usable form, at a defined cost, within a defined time? A contract silent on this is a contract where leaving is priced later by the party being left.</p>"

    {
     "l": "TRAP",
     "t": "Later",
     "h": "We will fix that in configuration <em>later</em>",
     "b": "<p>A gap surfaces during design. It is not central, closing it now would delay things, and the product is configurable. So it goes on a list to be handled after go-live.</p>\n<p>Sometimes this is right and it is worth saying so plainly &mdash; deferring genuinely peripheral items is good scope discipline. It is wrong in one specific and predictable way: <strong>the things deferred as configuration are frequently not configuration.</strong></p>\n<p>The reason the mistake is easy: at design time, nobody has tried it. The product's documentation says the field is configurable, and it is, within a range nobody has checked against the actual requirement. The distinction between configurable and configurable-in-the-way-you-need only becomes visible when someone attempts it, which by then is after go-live and after the implementation partner has left.</p>\n<p>Three deferrals that turn out to be architectural:</p>\n<ul>\n<li><strong>Additional data fields.</strong> Configurable to add. Often not configurable to make searchable, reportable, or auditable, which was the actual requirement.</li>\n<li><strong>Approval hierarchies.</strong> Products support a hierarchy. They support <em>a</em> hierarchy, and a second one for a different product line is frequently a code change.</li>\n<li><strong>Retention and deletion rules.</strong> Almost never configurable per record type, and almost always assumed to be.</li>\n</ul>\n<div class='note'>The correction costs one hour. <strong>Before deferring anything to configuration, have someone demonstrate it in the actual product, on the actual version, with a realistic case.</strong> Not a documentation reference and not a vendor assurance. If nobody can demonstrate it inside a week, it is not configuration and it belongs back in the scope conversation while there is still time to make a decision about it.</div>"
    },
    {
     "l": "PICTURE",
     "t": "One decision",
     "h": "The same requirement, two <em>designs</em>",
     "b": "<p>A requirement: an applicant's existing exposure across the group must be checked before a decision. Two designs satisfy it and the choice is not technical.</p>\n<div class='two'><div><b>Design A &mdash; API call at decision time</b>The decision engine calls an exposure service and waits. Always current. Adds latency to every application. If the service is down, no decision can be made unless a fallback is specified.</div>\n<div><b>Design B &mdash; overnight batch into a local table</b>Exposure refreshed nightly and read locally. Fast, and unaffected by the other system's availability. Up to 24 hours stale, so an exposure taken this morning is invisible.</div></div>\n<div class='dg'><div class='dg-t'>What each one commits the business to</div>\n<div class='lay'>\n<div><span>1</span>A &mdash; instant decisions remain possible, but the journey inherits another system's availability</div>\n<div class='hot'><span>2</span>B &mdash; the journey is insulated, but same-day double borrowing across the group becomes possible</div>\n<div><span>3</span>Either &mdash; the risk appetite question decides it, not the architecture</div>\n</div>\n<div class='cross'>A third option exists and is usually the answer: batch for screening, live call only for cases near the exposure limit</div></div>\n<p>The band at the bottom is the general shape of good integration compromise. <strong>Use the cheap, resilient path for the many cases where precision does not change the outcome, and the expensive, precise path only where it does.</strong></p>\n<p>What makes this an analyst's decision rather than an architect's: the question underneath is how much same-day double-borrowing exposure the institution will accept, and how often it occurs. That is a credit risk question with a number attached, obtainable from the current book. <strong>Bring the number to the design review and the argument resolves in ten minutes.</strong></p>"

     "t": "Not one activity",
     "h": "Testing is <em>four</em> different questions",
     "b": "<p>People say testing as though it were one thing. It is a set of activities asking different questions of different objects at different times, and confusing them causes a specific problem: the same defect gets looked for four times and a different one gets looked for never.</p>\n<p>The widely used classification comes from the foundation syllabus of the International Software Testing Qualifications Board, universally abbreviated to ISTQB, and it names four <span class='k'>test levels</span>.</p>\n<div class='dt'><table>\n<tr><th>Level</th><th>Object under test</th><th>Question</th><th>Run by</th></tr>\n<tr class='hi'><td>Component</td><td class='n'>One unit of code in isolation</td><td class='g'>Does this piece work?</td><td class='g'>Developers</td></tr>\n<tr><td>Integration</td><td class='n'>Interfaces between components or systems</td><td class='g'>Do they work together?</td><td class='g'>Developers and testers</td></tr>\n<tr class='hi'><td>System</td><td class='n'>The assembled system</td><td class='g'>Does it meet the specification?</td><td class='g'>Test team</td></tr>\n<tr class='hi'><td>Acceptance</td><td class='n'>The system in a business context</td><td class='g'>Is this what we actually need?</td><td class='g'>The business</td></tr>\n</table></div>\n<p>The distinction between the last two carries the most weight and is the one most often collapsed. <strong>System testing asks whether the system works as specified. Acceptance testing asks whether the specification was right.</strong> Those are genuinely different questions, and it is why acceptance testing is done by the business rather than by testers, who cannot answer the second one.</p>\n<p>Component testing is also worth understanding even though the analyst never touches it, because it explains a costing argument. A defect found at component level costs minutes. The same defect found at acceptance costs a fix, a rebuild, a redeploy and a retest, and it costs them under time pressure. <strong>The economics are why teams push testing earlier, not fashion.</strong></p>"
    },
    {
     "l": "DEFINE",
     "t": "Two axes",
     "h": "Level says <em>when</em>, type says <em>what</em>",
     "b": "<p>Test level and <span class='k'>test type</span> are independent, and treating them as one list is a common source of gaps in a test plan.</p>\n<div class='two'><div><b>Level &mdash; when in the flow</b>Component, integration, system, acceptance. Four values.</div>\n<div><b>Type &mdash; which quality characteristic</b>Functional, performance, security, reliability, compatibility and so on. These map onto the nine characteristics from missions 04 and 08.</div></div>\n<p>A third dimension describes the approach: smoke, regression, exploratory, confirmation. So a single test is properly described by three coordinates, and only then is it unambiguous.</p>\n<div class='sheet g'><div class='h'>One test, fully described</div>\n<div class='r'><b>Level</b><span>System</span></div>\n<div class='r'><b>Type</b><span>Performance</span></div>\n<div class='r'><b>Approach</b><span>Regression</span></div>\n<div class='r'><b>Reads as</b><span>A regression run at system level checking that response times have not degraded</span></div>\n</div>\n<p>Why the separation matters practically: <strong>a plan built only by level will list four rounds of functional testing and no security or performance testing at all.</strong> The types are what surface the non-functional requirements written in mission 04, and if nothing in the plan tests them, those numbers were written for nothing.</p>\n<div class='note'>Two approaches worth naming because they get confused. <span class='k'>Confirmation testing</span> re-runs the specific test that failed, to check the fix worked. <span class='k'>Regression testing</span> re-runs tests around it, to check the fix broke nothing else. A team doing only the first will ship fixes that break adjacent behaviour, and will be surprised each time.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "From criteria",
     "h": "The test case is already <em>written</em>",
     "b": "<p>If acceptance criteria were written properly in mission 04, test case design is mostly transcription. Each criterion is already a precondition, an action and an expected outcome.</p>\n<div class='wk'><div class='h'>Criterion to test case</div>\n<div class='r'><b>Given an approver with a delegated limit of 5,00,000 for product PL</b><span>Precondition</span></div>\n<div class='r'><b>When they approve an application of 4,50,000</b><span>Step and data</span></div>\n<div class='r'><b>Then status becomes SANCTIONED with no second approver assigned</b><span>Expected result</span></div>\n<div class='r tot'><b>TC-201, traced to FR-047</b><span>Identified and linked</span></div>\n</div>\n<p>The transcription is not the whole job. Criteria describe the intended behaviour; a test set must also probe where behaviour is most likely to be wrong. Three techniques add the rest, and between them they cover most of what matters.</p>\n<div class='dt'><table>\n<tr><th>Technique</th><th>How</th><th>Finds</th></tr>\n<tr class='hi'><td>Boundary values</td><td class='n'>Test at the limit, one below, one above</td><td class='g'>Wrong comparison operators. The most common functional defect there is</td></tr>\n<tr class='hi'><td>Equivalence partitions</td><td class='n'>Group inputs that should behave identically; test one from each group</td><td class='g'>Keeps the test set small without losing coverage</td></tr>\n<tr><td>Decision table coverage</td><td class='n'>One test per column of the table from mission 06</td><td class='g'>Uncovered combinations and unreachable rules</td></tr>\n</table></div>\n<p>Equivalence partitioning is what stops a test set becoming unmanageable. If income between &#8377;25,000 and &#8377;1,00,000 all behaves the same way, one value tests all of it. <strong>Effort then goes to the boundaries, where behaviour actually changes</strong>, rather than to twenty values from the middle of a range that behave identically.</p>\n<div class='note'>A test case with no expected result is not a test case. It is an instruction to look at something, and whoever looks will decide on the spot whether what they see is correct. The expected result must be recorded before execution, or the test proves nothing.</div>"

    {
     "l": "CHEAT",

     "h": "Six fields, and the one that gets <em>skipped</em>",
     "b": "<div class='sheet'><div class='h'>Every test case</div>\n<div class='r'><b>Identifier</b><span>TC-201. Stable, referenced from the traceability matrix</span></div>\n<div class='r'><b>Requirement traced</b><span>FR-047. A test tracing to nothing is testing something nobody asked for</span></div>\n<div class='r'><b>Precondition</b><span>The state the system must be in before the first step. Includes the data needed</span></div>\n<div class='r'><b>Steps</b><span>Numbered, unambiguous, executable by someone who was not in the project</span></div>\n<div class='r'><b>Expected result</b><span>Written before execution. Specific enough that pass and fail are not a judgement</span></div>\n<div class='r'><b>Actual result and evidence</b><span>What happened, plus the screenshot, log entry or record that shows it</span></div>\n</div>\n<div class='sheet q'><div class='h'>Where cases go wrong</div>\n<div class='r'><b>Expected result says works correctly</b><span>Not a result. Says nothing checkable</span></div>\n<div class='r'><b>Steps assume knowledge</b><span>Set up a test customer &mdash; which one, with what attributes?</span></div>\n<div class='r'><b>Multiple outcomes in one case</b><span>It fails at step 4 of 9 and the remaining 5 are never assessed</span></div>\n<div class='r'><b>No evidence captured</b><span>A pass with no evidence is an assertion. An auditor will ask</span></div>\n<div class='r'><b>Data specified as any valid value</b><span>Different testers use different values and results are not comparable</span></div>\n</div>\n<p>The evidence field is the one skipped under time pressure, and it is the one that matters most afterwards. <strong>Six months later, the question is not whether it was tested but what was observed.</strong> A test log with a pass and no artefact does not answer that, and in a regulated environment the evidence is frequently the point of the exercise rather than a by-product of it.</p>"

    {
     "l": "MECHANISM",
     "t": "Test data",
     "h": "Production data is not <em>test</em> data",
     "b": "<p>Realistic data is needed to test properly. The most realistic data available is production data. Using it is nonetheless usually prohibited, and understanding why prevents an unproductive argument.</p>\n<p>Test environments have weaker access controls, more people with access, and fewer monitoring controls than production &mdash; by design, because that is what makes them usable for testing. <strong>Copying personal data into them creates a population of real customers whose information sits in a less protected place, for a purpose they never consented to.</strong> Under data protection regimes that is processing without a lawful basis, and it is one of the most common findings in a data protection audit of a bank.</p>\n<div class='dt'><table>\n<tr><th>Approach</th><th>What it does</th><th>Watch for</th></tr>\n<tr class='hi'><td>Masking</td><td class='n'>Replace identifying values while keeping shape and distribution</td><td class='g'>Consistency across tables. A masked customer must be the same masked customer everywhere or joins break</td></tr>\n<tr><td>Subsetting</td><td class='n'>Take a referentially complete slice rather than the whole database</td><td class='g'>The slice must include the exception cases, or only the happy path is testable</td></tr>\n<tr><td>Synthetic generation</td><td class='n'>Manufacture data to specification</td><td class='g'>Too clean. Real data has nulls, oddities and legacy formats that synthetic data lacks</td></tr>\n<tr><td>Targeted construction</td><td class='n'>Build the specific cases the tests need, by hand</td><td class='g'>Slow, and the only way to get genuinely rare scenarios</td></tr>\n</table></div>\n<p>The practical answer is usually a combination: a masked and subset population for volume and realism, plus hand-built cases for the boundaries and exceptions that would never occur often enough to appear in a sample.</p>\n<div class='note'>Test data is a requirement and belongs in the specification, not a task discovered during test preparation. <strong>Every acceptance criterion implies a data condition</strong> &mdash; an approver with a specific limit, a customer with an adverse bureau record, an application with a missing income. Listing those alongside the criteria turns a two-week scramble into a request made in good time.</div>"

    {
     "l": "DEFINE",
     "t": "Severity, priority",
     "h": "How bad, and how <em>soon</em>",
     "b": "<p>These two are confused constantly and they answer different questions. <span class='k'>Severity</span> is how damaging the defect is, and it is a technical assessment. <span class='k'>Priority</span> is how soon it must be fixed, and it is a business decision.</p>\n<p>They are independent, which is the whole point, and the two off-diagonal combinations are the ones that prove it.</p>\n<div class='dt'><table>\n<tr><th>Combination</th><th>Example</th><th>Handling</th></tr>\n<tr class='hi'><td>High severity, high priority</td><td class='n'>Interest calculated wrongly on every loan</td><td class='g'>Stop. Nothing else matters</td></tr>\n<tr class='hi'><td>High severity, low priority</td><td class='n'>Data corruption in a report used once a year, next needed in eight months</td><td class='g'>Serious, and it can wait. Must be tracked, not forgotten</td></tr>\n<tr class='hi'><td>Low severity, high priority</td><td class='n'>The institution's name misspelled on the customer offer letter</td><td class='g'>Trivial and cannot ship. Fix today</td></tr>\n<tr><td>Low severity, low priority</td><td class='n'>Column misaligned on an internal admin screen</td><td class='g'>Backlog</td></tr>\n</table></div>\n<p>Row three is why the two must stay separate. If they were one field, a cosmetic defect would be rated low and would ship, and a customer-facing document would go out with an error on it. <strong>The business sets priority precisely because severity cannot see reputational or contractual consequence.</strong></p>\n<div class='sheet g'><div class='h'>A severity scale that works</div>\n<div class='r'><b>Critical</b><span>No workaround. Money, regulatory breach, or the process cannot continue</span></div>\n<div class='r'><b>Major</b><span>Significant function impaired. A workaround exists and is painful</span></div>\n<div class='r'><b>Minor</b><span>Function impaired in a limited case. Easy workaround</span></div>\n<div class='r'><b>Cosmetic</b><span>No functional impact</span></div>\n</div>\n<div class='note'>Define both scales in the test strategy before testing starts. Defined mid-cycle, they get defined by whoever is arguing about a specific defect at the time, and every subsequent classification inherits that argument.</div>"
