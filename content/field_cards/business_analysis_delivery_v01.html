    {
     "l": "MECHANISM",
     "t": "Triage",
     "h": "The meeting that decides what <em>ships</em>",
     "b": "<p>Defect triage is a short, regular meeting &mdash; usually daily during a test cycle &mdash; where new defects are classified and assigned. It works when it is boring and fails when it becomes a negotiation.</p>\n<div class='flow'>\n<div class='n'><b>Is it a defect at all</b>Three other things arrive disguised as defects: a misunderstanding of the requirement, a test data problem, and a change request. Each goes somewhere different.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Severity, by the defined scale</b>Technical assessment. Not a discussion about whether it is convenient.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Priority, by the business</b>Named person, deciding. Not the room's consensus.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Assign and date</b>Owner and a target. Unowned defects survive to go-live.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Retest and close</b>Closed only by the person who raised it, after confirmation testing plus regression around it.</div>\n</div>\n<p>The first step is where the analyst is most useful and most needed. <strong>A large share of what is raised as a defect is a disagreement about what the requirement meant</strong>, and only somebody who owns the specification can adjudicate that. The three possible outcomes are: the system is wrong and it is a defect, the test is wrong and the case is corrected, or the requirement was ambiguous &mdash; which is a specification defect and should be logged as one rather than silently resolved in favour of whatever was built.</p>\n<div class='note'>The last outcome is worth logging honestly even though it is uncomfortable. Ambiguity counts, gathered across a project, tell you where the specification process is weak. Recorded as system defects instead, they teach nothing and blame the wrong stage.</div>"

    {
     "l": "MECHANISM",
     "t": "Entry and exit",
     "h": "The criteria that decide when testing <em>stops</em>",
     "b": "<p>Without stated criteria, testing stops when the date arrives. <span class='k'>Entry criteria</span> define when a level may begin and <span class='k'>exit criteria</span> define when it may be declared complete. Both are agreed in the test strategy, before anything is executed.</p>\n<div class='two'><div><b>Entry &mdash; before acceptance testing starts</b>System testing complete with its own exit criteria met. Environment available and stable. Test data loaded. Testers trained. No critical or major defects open from the previous level. A build deployed and recorded by version.</div>\n<div><b>Exit &mdash; before it is declared done</b>Every planned case executed. Pass rate above the agreed threshold. Zero critical, zero major open. Every remaining defect assessed and accepted by a named person. Evidence captured for every case. Traceability showing every requirement covered.</div></div>\n<p>Two of these are routinely relaxed under pressure and it is worth knowing which. <strong>Every planned case executed</strong> becomes every case except those blocked by environment problems &mdash; which is often reasonable, and must be recorded as untested rather than passed. And <strong>zero major open</strong> becomes an agreed list of majors deferred with workarounds, which is a legitimate business decision as long as it is a decision rather than a drift.</p>\n<p>What sign-off actually commits, said plainly, because it is signed by people who have not been told:</p>\n<div class='sheet q'><div class='h'>Signing acceptance means</div>\n<div class='r'><b>What was tested behaved as expected</b><span>Only what was tested. Not the system</span></div>\n<div class='r'><b>Known defects are accepted</b><span>The signer owns the consequence of every open item on the list</span></div>\n<div class='r'><b>The business is ready to operate it</b><span>People trained, procedures updated, support arranged</span></div>\n<div class='r'><b>Residual risk is accepted</b><span>The untested remainder is now the signer's risk</span></div>\n</div>"

    {
     "l": "TRAP",
     "t": "It passed",
     "h": "Acceptance passed, so the system is <em>correct</em>",
     "b": "<p>Every planned case was executed. The pass rate met the threshold. The business signed. Therefore the system works.</p>\n<p>What was actually established is narrower and it is worth stating precisely: <strong>the behaviours that were tested behaved as expected on the environment and data used.</strong> Nothing is established about behaviours nobody tested, and in any system of reasonable size those vastly outnumber the tested ones.</p>\n<p>The mistake is believable because passing is genuinely good news and because the alternative sounds like it is asking for infinite testing. It is not. Complete testing is impossible for anything non-trivial &mdash; a form with ten fields has more input combinations than could be executed in a lifetime &mdash; and testing is therefore always a <strong>risk-based sample</strong>. That is a legitimate and well-understood engineering position. It just is not the same thing as proof.</p>\n<p>Three specific gaps that survive a clean acceptance cycle:</p>\n<ul>\n<li><strong>Volume.</strong> Acceptance runs on tens of cases. Behaviour at a hundred thousand is a different test, and it is one that is frequently skipped when timelines compress.</li>\n<li><strong>Data variety.</strong> Test data is cleaner than production. Legacy records with formats nobody documented are the classic first-week production defect.</li>\n<li><strong>Time.</strong> Month-end, year-end, leap years, rate change dates, financial year boundaries. Cases that only exist on specific dates are almost never in an acceptance cycle.</li>\n</ul>\n<div class='note'>The honest formulation for a sign-off conversation: this is what we tested, this is what we did not test and why, and this is the residual risk we are accepting. That is a defensible position. <strong>The system is correct is not</strong>, and it will be quoted back if something surfaces later.</div>"

     "t": "No standard here",
     "h": "This part of the subject is <em>convention</em>",
     "b": "<p>Requirements engineering has a body of knowledge. Software quality has an international standard. Testing has a widely used syllabus. Risk data has a Basel Committee framework.</p>\n<p><strong>Release management, cutover and programme delivery have none of these.</strong> What exists is a set of commercial frameworks behind paywalls, a large consulting literature, and a great deal of accumulated practice that is genuinely useful and carries no external authority whatsoever.</p>\n<p>This mission therefore teaches the mechanics and labels them as practice. Where something is a widely observed convention it is described as one. Nothing here is presented as a rule someone can be held to, because there is no body that would hold them to it.</p>\n<p>The two jobs, and why they are one mission:</p>\n<div class='two'><div><b>Release</b>The event. Moving a tested change into production without breaking what is already there, and being able to reverse it. Hours to a weekend.</div>\n<div><b>Delivery</b>The running of the work. Sequencing, dependencies, estimation, scope control, reporting. Months.</div></div>\n<p>They sit together because the second determines whether the first is survivable. <strong>A programme that manages dependencies badly and estimates dishonestly arrives at cutover with untested work and no rollback</strong>, and no amount of care on the night compensates for that.</p>"

    {
     "l": "MECHANISM",
     "t": "The runbook",
     "h": "Every step, timed, owned, and <em>reversible</em>",
     "b": "<p>A <span class='k'>cutover runbook</span> is a numbered list of every action required to move the change into production, with an owner, a duration and a dependency for each. It is written days in advance and executed by people who are tired.</p>\n<div class='dt'><table>\n<tr><th>Column</th><th>Contents</th><th>Why</th></tr>\n<tr class='hi'><td>Step number</td><td class='n'>Sequential</td><td class='g'>Position is announced on the call. People join late</td></tr>\n<tr><td>Action</td><td class='n'>One action, specific enough to execute without interpretation</td><td class='g'>Two actions in one step means partial completion is unrecordable</td></tr>\n<tr><td>Owner</td><td class='n'>A named person, plus a named deputy</td><td class='g'>Teams do not execute steps. People do</td></tr>\n<tr><td>Start and duration</td><td class='n'>Planned clock time and expected minutes</td><td class='g'>Turns slippage into a number early rather than a feeling late</td></tr>\n<tr><td>Depends on</td><td class='n'>Which steps must finish first</td><td class='g'>Shows what can run in parallel, which is where the window is won</td></tr>\n<tr><td>Verification</td><td class='n'>How you know this step succeeded</td><td class='g'>The most skipped column. A step with no check is a step you assumed</td></tr>\n<tr class='hi'><td>Reversible</td><td class='n'>Yes or no, and how</td><td class='g'>Marks where the point of no return is</td></tr>\n</table></div>\n<p>The last column is the one that changes decisions on the night. <strong>Most cutovers have a specific step after which rollback stops being possible</strong> — usually the first irreversible data transformation, or the first customer transaction on the new system. Everything before it is recoverable and everything after it must be fixed forward.</p>\n<p>That step gets a decision gate in front of it. Reaching it late, with an open issue, means choosing consciously between proceeding and reversing, rather than crossing the line without noticing.</p>\n<div class='note'>Three things belong in every runbook and are frequently absent: a communications step naming who tells the business it has started and finished, a step for taking the backup that rollback would restore, and a stated wall-clock time by which the go or no-go decision must be made regardless of progress.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "The dry run",
     "h": "Rehearse the whole thing, <em>timed</em>",
     "b": "<p>A <span class='k'>dry run</span> executes the runbook end to end in a production-like environment, with the real people, against a realistic data volume, timed.</p>\n<p>Its purpose is not to prove the change works &mdash; testing did that. It is to prove <strong>the runbook is correct and fits in the window.</strong> Those are separate risks and the second is the one that ruins weekends.</p>\n<div class='dt'><table>\n<tr><th>What a dry run finds</th><th>Typical form</th></tr>\n<tr class='hi'><td>Steps that take much longer than estimated</td><td class='g'>A migration estimated at two hours takes nine at full volume. The single most common finding</td></tr>\n<tr class='hi'><td>Missing steps</td><td class='g'>Something everyone assumed someone else was doing</td></tr>\n<tr><td>Wrong order</td><td class='g'>Step 14 needs an output from step 19</td></tr>\n<tr><td>Access nobody has</td><td class='g'>Discovered at 2am otherwise, when the person who could grant it is asleep</td></tr>\n<tr><td>Verification that cannot actually be performed</td><td class='g'>The check requires a report that only runs on weekdays</td></tr>\n</table></div>\n<p>Volume is the part most often compromised, and compromising it removes most of the value. <strong>A dry run on a tenth of the data proves the sequence and tells you nothing about the timing</strong>, and timing is the risk the exercise exists to address. Where full volume is impossible, time the volume-dependent steps separately and extrapolate explicitly, stating the assumption.</p>\n<div class='note'>The output is a revised runbook with measured durations replacing estimated ones. A dry run that does not change the runbook either found nothing, which is unusual, or was not run seriously.</div>"

    {

     "h": "Criteria decided <em>before</em> the day",
     "b": "<p>The go decision is taken at a meeting shortly before cutover starts. It works when the criteria were agreed weeks earlier and fails when the meeting invents them, because a room assembled to start something rarely decides not to.</p>\n<div class='sheet g'><div class='h'>Criteria, agreed in advance</div>\n<div class='r'><b>Testing exit criteria met</b><span>Including the accepted list of open defects, by name</span></div>\n<div class='r'><b>Dry run completed and the runbook updated</b><span>With measured durations</span></div>\n<div class='r'><b>Rollback tested, not merely documented</b><span>The difference matters more than any other line here</span></div>\n<div class='r'><b>Business readiness confirmed</b><span>Trained, procedures updated, support rota staffed</span></div>\n<div class='r'><b>Dependencies confirmed by their owners</b><span>Each one, individually, on the call</span></div>\n<div class='r'><b>Support arrangements in place</b><span>Who is on call, how they are reached, what they are authorised to do</span></div>\n<div class='r'><b>Communications ready</b><span>Customer-facing and internal, drafted, including the message if it fails</span></div>\n</div>\n<p>Three practices keep the meeting honest:</p>\n<ul>\n<li><strong>Each owner states their own status.</strong> A programme manager reading a summary on everyone's behalf produces a green that nobody actually said.</li>\n<li><strong>Amber is not green.</strong> Any criterion not met is a no-go unless somebody with authority explicitly accepts the specific risk, on the record.</li>\n<li><strong>A no-go is a success.</strong> An organisation where no-go is treated as failure will get a go every time, and will discover the reasons afterwards.</li>\n</ul>\n<div class='note'>Rollback tested rather than documented is the criterion worth defending hardest. A documented rollback is a plan. A tested rollback is a capability. The gap between them is discovered at the worst possible moment, and it is usually a missing backup or a data transformation that cannot be undone.</div>"

     "h": "Big bang, phased, and <em>parallel</em> run",
     "b": "<p>How the new system takes over from the old. Three shapes, and the choice is a risk decision rather than a technical one.</p>\n<div class='three'><div><b>Big bang</b>Old off, new on, everyone at once. Shortest, cheapest, no dual running. <strong>Highest risk</strong> and rollback is a single decision under time pressure.</div>\n<div><b>Phased</b>By product, region, branch or customer segment. Problems affect a subset. <strong>Requires the transition state</strong> from mission 08 to be designed and run for months.</div>\n<div><b>Parallel run</b>Both systems process everything, outputs compared, old one authoritative until the new one is trusted. <strong>Safest and most expensive</strong>, because the work is done twice.</div></div>\n<p>Parallel running is the one specific to regulated finance, and it exists because some outputs must be provably correct before they are relied upon. A regulatory return, an interest calculation, a provision figure &mdash; running both and comparing is the only way to demonstrate the new one produces the same answer.</p>\n<p>What makes a parallel run work rather than merely happen:</p>\n<div class='flow'>\n<div class='n'><b>Define what comparison means before starting</b>Exact match on which fields, tolerance on which, and the reason for every tolerance allowed.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Investigate every difference</b>Each one is either a defect in the new system, a defect in the old one, or a deliberate change. All three occur, and finding defects in the old system is common enough to plan for.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Set the exit condition in advance</b>Two consecutive month-ends with all differences explained, or whatever is agreed. Without it, parallel running continues until somebody loses patience.</div>\n</div>\n<div class='note'>The middle step produces an uncomfortable and valuable outcome. A parallel run frequently shows the old system has been wrong for years in some small way. That is a finding to be handled properly, not quietly, and budgeting time for it is realistic rather than pessimistic.</div>"

    {
     "l": "DEFINE",
     "t": "Hypercare",
     "h": "The period where the <em>usual</em> rules are suspended",
     "b": "<p><span class='k'>Hypercare</span> is a defined period immediately after go-live during which the change is supported at an elevated level: the project team stays available, defects bypass the normal queue, and someone watches the system deliberately rather than waiting to be told.</p>\n<p>It exists because of the gap described at the end of mission 09. Testing was a sample. Production is not. <strong>The first two weeks of real volume, real data variety and real user behaviour will surface things no test cycle could have</strong>, and they surface faster than a standard support process handles.</p>\n<div class='dt'><table>\n<tr><th>Element</th><th>Defined how</th></tr>\n<tr class='hi'><td>Duration</td><td class='g'>Stated in advance. Commonly two to four weeks, and must span at least one month-end for anything touching accounting</td></tr>\n<tr class='hi'><td>Exit criteria</td><td class='g'>Defect rate below a threshold for a stated period, and the run team confirming they can operate it. Not simply the calendar</td></tr>\n<tr><td>Who is available</td><td class='g'>Named people from build, test and analysis, with agreed response times</td></tr>\n<tr><td>What is monitored</td><td class='g'>Decided beforehand: volumes, error rates, elapsed times, the specific metrics the change was meant to move</td></tr>\n<tr><td>Escalation</td><td class='g'>Who can authorise a fix straight into production, and who decides to reverse</td></tr>\n<tr><td>Handover</td><td class='g'>A defined event ending it, with documentation and knowledge transferred to the run team</td></tr>\n</table></div>\n<p>The row that gets neglected is monitoring. <strong>Hypercare that only reacts to reported problems misses everything nobody notices</strong> — a rejection rate that has doubled, a queue quietly growing, a batch finishing later each night. Deciding in advance which numbers to watch daily turns hypercare from a support rota into an early warning system.</p>\n<div class='note'>Hypercare without exit criteria either ends abruptly when people are reassigned, or never ends and the project team becomes permanent support. The handover is an event with a date and an owner, and it belongs in the plan from the beginning.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Iterative and sequential",
     "h": "What actually <em>combines</em> in a regulated shop",
     "b": "<p>The argument between iterative and sequential delivery is usually conducted at a level of generality that helps nobody. The useful question is narrower: <strong>which parts of this programme have requirements that can be discovered as you go, and which have requirements that are fixed externally?</strong></p>\n<div class='dt'><table>\n<tr><th>Characteristic</th><th>Suits iterative</th><th>Suits sequential</th></tr>\n<tr class='hi'><td>Requirements</td><td class='n'>Emerge through use and feedback</td><td class='g'>Fixed externally, by regulation or contract</td></tr>\n<tr><td>Feedback loop</td><td class='n'>Fast. Users can try it and react</td><td class='g'>Slow or absent. Correctness is judged against a document</td></tr>\n<tr><td>Release</td><td class='n'>Can go in small increments</td><td class='g'>All-or-nothing, e.g. a regulatory return</td></tr>\n<tr><td>Integration</td><td class='n'>Few external dependencies</td><td class='g'>Many parties who must move together</td></tr>\n</table></div>\n<p>Most real programmes have both, which is why the honest answer is a combination rather than a choice. <strong>What combines is delivery cadence. What does not combine is governance.</strong></p>\n<div class='two'><div><b>Combines well</b>Iterative build inside a fixed scope and date. Incremental delivery to a test environment with a single release to production. Iterative work on the journey, sequential work on the regulatory calculation, in one programme.</div>\n<div><b>Does not combine</b>Iterative scope discovery against a fixed regulatory deadline. A change board expecting a full impact assessment for every backlog reprioritisation. Two teams on the same release with different definitions of done.</div></div>\n<p>Ceremonies are worth the same scrutiny as documents. <strong>A meeting earns its place when a decision comes out of it that would not otherwise have been made.</strong> A daily stand-up that surfaces a blocker earns its place; one where each person recites yesterday to a manager does not. A retrospective that changes something earns its place; one where the same three items are raised each fortnight is a complaint session with a name.</p>"

    {
     "l": "CHEAT",
     "t": "RAID",
     "h": "Four lists that stop the same argument <em>twice</em>",
     "b": "<p>A <span class='k'>RAID log</span> &mdash; risks, assumptions, issues and dependencies &mdash; holds four kinds of open item. Keeping them apart matters because each needs a different action, and merged into one issues list they get the same one, which suits none of them.</p>\n<div class='sheet'><div class='h'>Risk &mdash; might happen</div>\n<div class='r'><b>Needs</b><span>Likelihood, impact, an owner, and a mitigation with a date</span></div>\n<div class='r'><b>Test</b><span>If it has already happened, it is an issue, not a risk</span></div>\n</div>\n<div class='sheet'><div class='h'>Assumption &mdash; taken as true, unverified</div>\n<div class='r'><b>Needs</b><span>Who will confirm it, by when, and what happens if it is false</span></div>\n<div class='r'><b>Test</b><span>An unverified assumption is a risk wearing a calmer word</span></div>\n</div>\n<div class='sheet q'><div class='h'>Issue &mdash; has happened, needs resolving</div>\n<div class='r'><b>Needs</b><span>An owner, a target date, and an escalation path if the date passes</span></div>\n<div class='r'><b>Test</b><span>An issue with no owner is a complaint</span></div>\n</div>\n<div class='sheet'><div class='h'>Dependency &mdash; needed from elsewhere</div>\n<div class='r'><b>Needs</b><span>What, from whom, by when, and confirmation that they know</span></div>\n<div class='r'><b>Test</b><span>A dependency the other party has not acknowledged is not managed. It is hoped for</span></div>\n</div>\n<p>The assumption list is the one most often empty and it is the most useful of the four. <strong>Every plan rests on assumptions, and writing them down converts an invisible fragility into a tracked item with a date.</strong> When one turns out to be false, the log shows immediately what depended on it.</p>\n<div class='note'>The dependency test deserves emphasis. A dependency recorded in your log and not in theirs is a note to yourself. Confirmation means the other party has it in their own plan with their own date, and that confirmation is worth obtaining in writing rather than in a corridor.</div>"

    {

     "h": "Ranges, and the <em>honest</em> conversation about them",
     "b": "<p>A single-number estimate given early in a programme is wrong, and everybody involved knows it is wrong, and it is nonetheless recorded and later compared against actuals as though it had been a commitment. The way out is to change what is given rather than to try harder at the number.</p>\n<div class='dt'><table>\n<tr><th>Stage</th><th>Honest range</th><th>What has been established</th></tr>\n<tr class='hi'><td>Initial idea</td><td class='n'>Roughly a quarter to four times</td><td class='g'>The problem, and not much else</td></tr>\n<tr><td>After discovery</td><td class='n'>Roughly half to twice</td><td class='g'>Scope, stakeholders, the current state</td></tr>\n<tr><td>After specification</td><td class='n'>Roughly 0.8 to 1.25 times</td><td class='g'>Requirements agreed and signed</td></tr>\n<tr><td>After design</td><td class='n'>Roughly 0.9 to 1.15 times</td><td class='g'>Approach and components known</td></tr>\n</table></div>\n<p>Those ranges are a widely used rule of thumb rather than a measured constant, and the specific multipliers vary between the sources that publish them. <strong>What is reliable is the shape: the range narrows as knowledge accumulates, and it is at its widest exactly when the first number is demanded.</strong> Treat the figures as an illustration of that shape, not as calibrated values.</p>\n<p>Three practices that make estimating survivable:</p>\n<ul>\n<li><strong>Give the range and the basis together.</strong> Six to ten weeks, assuming the bureau interface is unchanged and one developer is available throughout. The assumptions are what make it revisable rather than wrong.</li>\n<li><strong>Re-estimate at each stage, visibly.</strong> A programme that never updates its estimate is not more accurate; it is less informed and has stopped saying so.</li>\n<li><strong>Estimate the whole thing.</strong> Build effort is commonly under half the total. Analysis, testing, data migration, training, cutover and hypercare are the rest, and a build-only estimate presented as a total is the most common cause of a programme appearing to overrun.</li>\n</ul>"

    {

     "t": "Scope control",
     "h": "Saying no without being the <em>department</em> of no",
     "b": "<p>Requests to add things arrive continuously and most are reasonable in isolation. Refusing them all makes the process an obstacle to be routed around; accepting them all produces a programme that never ends. The way through is to make the trade visible rather than to make the decision.</p>\n<div class='flow'>\n<div class='n'><b>Write it down as a change request</b>Same discipline as a requirement. Half of them stop here, because writing it precisely reveals it was a passing thought.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Assess the impact using the traceability matrix</b>Which requirements, designs and tests are touched. Effort, and what moves.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Present it as a trade, never as a question</b>This can be added; it costs three weeks, or it displaces these two items. Which do you want?</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Let the person with authority decide</b>Not the analyst, not the project manager, not consensus.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Log the decision, including rejections and their reasons</b>Rejected requests return in month five otherwise, presented as new.</div>\n</div>\n<p>The third step is the whole technique. <strong>Asked whether they want an extra feature, everyone says yes. Asked whether they want it more than the two things it displaces, the answer is often no</strong> — and when it is yes, it is an informed yes that will not be disowned later.</p>\n<p>One category deserves separate handling. Where a change is required to meet a regulation or to close a genuine gap in what was agreed, <strong>it is not scope creep even though it arrives late.</strong> Treating a legitimate correction as creep teaches people to stop raising things, and the next gap surfaces in production instead.</p>"

     "t": "Live means done",
     "h": "It went live, so the project is <em>finished</em>",
     "b": "<p>The system is in production. Hypercare closed. The team has moved on. The project is complete and the closure report says so.</p>\n<p>What has been demonstrated is that <strong>the thing was built and works. Not that it was worth building.</strong> The business case claimed a benefit, somebody owned it, and nobody has checked whether it arrived.</p>\n<p>The mistake is believable and structural rather than lazy. The team that would measure has been reassigned. The benefit typically appears months after go-live, by which point attention has moved. And there is little incentive to look, because the finding might be unwelcome and nobody is asking.</p>\n<p>What is lost is not the individual project's reputation. It is the organisation's ability to estimate. <strong>An institution that never measures delivered benefit has no basis for evaluating the next business case</strong>, so every proposal is assessed on plausibility, and the most confident proposer wins.</p>\n<div class='sheet g'><div class='h'>The post-implementation review</div>\n<div class='r'><b>Did the benefit arrive</b><span>Measured against the baseline from mission 02, same definition, same population</span></div>\n<div class='r'><b>Was the cost what was estimated</b><span>Actual against original, with the reason for any gap</span></div>\n<div class='r'><b>What did we learn about estimating</b><span>Feeds the next range</span></div>\n<div class='r'><b>What is still open</b><span>Deferred defects, deferred scope, and who owns them now</span></div>\n<div class='r'><b>What would we do differently</b><span>Specific and few. A list of twenty is a list nobody reads</span></div>\n</div>\n<div class='note'>Schedule it in the plan at the outset, with a date and a named owner, timed for when the benefit could plausibly have appeared &mdash; typically three to six months after go-live. Left unscheduled it does not happen, because by the time it is due there is no project left to arrange it.</div>"

    {
     "l": "ORIENT",
     "t": "What changes",
     "h": "The same input, a different <em>answer</em>",
     "b": "<p>Every technique so far rests on an assumption so basic it is rarely stated: the same input produces the same output, so a test case can have an expected result, and pass or fail is decidable.</p>\n<p>Three things break that assumption, and all three are now ordinary in lending and risk:</p>\n<div class='three'><div><b>Statistical models</b>A scorecard outputs a probability. It is not right or wrong on one case &mdash; it is well or badly calibrated across many. Deterministic given its inputs, but not judgeable case by case.</div>\n<div><b>Learned models</b>Retrained on new data, so the same input gives a different answer next quarter. The behaviour is a function of the training set as much as of the code.</div>\n<div><b>Generative models</b>May give a different answer to the identical input twice. Fluent, and confidently wrong in ways that are hard to detect by inspection.</div></div>\n<p>What survives is more than people expect. Requirements still need actors, triggers, outcomes and exceptions. Traceability still applies. Governance still applies, more heavily. <strong>What changes is the acceptance criterion, which stops being a statement about one case and becomes a statement about a distribution.</strong></p>\n<div class='note'>The commonest failure is treating the model as the feature. A scorecard is one input to a decision that also involves policy rules, thresholds, referral routes and a workflow. Almost every disappointment attributed to a model turns out to be a fault in what surrounded it.</div>"
    },
    {
     "l": "DEFINE",
     "t": "What is a model",
     "h": "The definition has <em>widened</em>, considerably",
     "b": "<p>The intuitive definition is narrow: a model is a statistical or machine learning artefact built by data scientists. Regulatory definitions have moved well past that.</p>\n<p>The direction of travel is to define a model by <strong>what it does to a decision, not by how it was built.</strong> On that basis, a model includes algorithms, analytics, applications, decision-based rules and computational tools where their use has a material impact on decision-making. Explicitly included in recent Indian supervisory drafting: <span class='k'>scoring algorithms</span>, <span class='k'>rule engines</span>, and <strong>material spreadsheets</strong>.</p>\n<div class='dt'><table>\n<tr><th>Artefact</th><th>Intuitively a model?</th><th>Under the wider definition</th></tr>\n<tr class='hi'><td>Credit scorecard</td><td class='n'>Yes</td><td class='g'>Yes</td></tr>\n<tr class='hi'><td>Eligibility rule engine</td><td class='n'>No</td><td class='g'>Yes &mdash; it materially determines a lending decision</td></tr>\n<tr><td>Pricing spreadsheet used monthly</td><td class='n'>No</td><td class='g'>Yes, if it materially affects pricing decisions</td></tr>\n<tr><td>Provisioning calculation</td><td class='n'>Sometimes</td><td class='g'>Yes</td></tr>\n<tr><td>Fraud detection rules</td><td class='n'>No</td><td class='g'>Yes</td></tr>\n<tr><td>A report that only displays data</td><td class='n'>No</td><td class='g'>No &mdash; it informs rather than decides</td></tr>\n</table></div>\n<p>This is the point where mission 06 and this mission meet. <strong>The decision table built there is, under this definition, a model</strong>, and that brings obligations the team building it did not expect: inclusion in a model inventory, a risk tier, an owner, independent validation proportionate to the tier, and periodic review.</p>\n<div class='note'>The practical consequence for an analyst is a question worth asking at the start of any change: does this alter something that would be on the model inventory? If yes, the governance path is longer than a standard release and finding that out in design rather than in a pre-release review saves weeks.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Criteria that work",
     "h": "Acceptance for something that will sometimes be <em>wrong</em>",
     "b": "<p>A deterministic criterion says: given this input, the output shall be exactly this. That criterion cannot be written for a model, because a model that is wrong on some cases may still be performing exactly as intended.</p>\n<p>Four kinds of criterion replace it, and a usable specification has some of each.</p>\n<div class='dt'><table>\n<tr><th>Kind</th><th>Form</th><th>Example</th></tr>\n<tr class='hi'><td>Distributional</td><td class='n'>A performance measure over a defined dataset, with a threshold</td><td class='g'>Ranking performance at or above an agreed level on the frozen evaluation set</td></tr>\n<tr class='hi'><td>Deterministic guardrail</td><td class='n'>Absolute rules that hold on every case, regardless of the model</td><td class='g'>Never approve above the sanctioning limit. Never decline solely on a protected characteristic. Always produce a reason code</td></tr>\n<tr><td>Comparative</td><td class='n'>Performance against the current approach on the same data</td><td class='g'>At least as good as the existing scorecard on the same holdout population</td></tr>\n<tr><td>Behavioural</td><td class='n'>How the system behaves around the model</td><td class='g'>Below a confidence threshold, route to a human rather than deciding</td></tr>\n</table></div>\n<p>The second row is the one that makes a model specifiable at all. <strong>Guardrails are deterministic and therefore testable in the ordinary way</strong>, and they carry the requirements that must never be violated whatever the model outputs. A model specification without guardrails has no hard requirements in it at all.</p>\n<p>The fourth row is where most of the practical safety sits. A model that is right 92% of the time is not deployed by accepting 8% wrong outcomes. It is deployed inside a workflow that identifies low-confidence cases and routes them differently, so the automated decisions are drawn from the part of the distribution where the model is reliable. <strong>The specification is of the workflow, not of the model.</strong></p>"
    },
    {
     "l": "MECHANISM",
     "t": "The evaluation set",
     "h": "Frozen, representative, and never <em>trained</em> on",
     "b": "<p>An <span class='k'>evaluation set</span> is a fixed collection of cases with known correct outcomes, used to measure a model. It is the closest equivalent to a test suite, and constructing it well is most of what makes model acceptance meaningful.</p>\n<div class='flow'>\n<div class='n'><b>Held out entirely</b>Never used in training or tuning. A model evaluated on data it learned from will report performance it does not have. This is the single most consequential rule.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Representative of production</b>Same mix of segments, channels and periods as the live population. A set drawn only from approved applications cannot say anything about the ones that were declined.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Deliberately including the hard cases</b>Boundaries, rare segments, thin files, the categories where errors would be most costly. Random sampling under-represents exactly these.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Frozen and versioned</b>Changing the set changes the measurement. A comparison between two models is only valid on the same set, at the same version.</div>\n<div class='a'>&#8595;</div>\n<div class='n'><b>Refreshed on a stated schedule</b>Populations drift. Refreshing is necessary and is a controlled event with a new version number, not an ongoing edit.</div>\n</div>\n<p>The business contribution to this is not statistical and cannot be delegated. <strong>Which segments must be represented, which errors are most costly, and which cases would embarrass the institution are business judgements</strong>, and an evaluation set assembled without them will measure something that is technically sound and commercially beside the point.</p>\n<div class='note'>One asymmetry to specify explicitly: the two ways of being wrong rarely cost the same. Approving a bad applicant costs the loss; declining a good one costs the margin and possibly the relationship. The ratio between them is a business input, it determines where the operating threshold sits, and it must come from the business rather than being chosen by whoever tunes the model.</div>"
    },
    {
     "l": "MECHANISM",
     "t": "Mocking honestly",
     "h": "What to <em>fake</em> in a first version, and how to say so",
     "b": "<p>Building a first version frequently means simulating something not yet ready. That is legitimate practice and it becomes dishonest at a specific and identifiable point.</p>\n<div class='two'><div><b>Legitimate to mock</b>An interface not yet built, where the contract is agreed. A data feed arriving later, filled with representative data. A model not yet trained, replaced by a rule of thumb. Volume, in an environment where full scale is not available.</div>\n<div><b>Never mocked</b>Anything the person seeing the output would assume was real. A decision presented as model-driven that is a fixed rule. A confidence figure that is a constant. A citation, a source or a calculation shown to a customer that was not performed.</div></div>\n<p>The dividing line is not technical. <strong>It is whether the person receiving the output would change their behaviour if they knew.</strong> A stakeholder shown a demonstration who believes they are seeing a trained model, and would ask different questions if they knew it was a lookup table, has been misled regardless of what was intended.</p>\n<div class='sheet g'><div class='h'>Three rules that keep it honest</div>\n<div class='r'><b>Label it in the interface, not in the documentation</b><span>Nobody reads the documentation during a demonstration</span></div>\n<div class='r'><b>Keep a mock register</b><span>Every mocked component, what it does now, what replaces it, and by when</span></div>\n<div class='r'><b>Nothing mocked crosses into production</b><span>A go criterion. Every entry in the register is closed or explicitly accepted by a named person</span></div>\n</div>\n<p>The register matters more than it sounds. Mocks are created under time pressure by people who fully intend to replace them and are then reassigned. <strong>Without a register, a mock becomes permanent quietly</strong>, and it is discovered when somebody asks why the confidence score is always 0.85.</p>"

    {
     "l": "DEFINE",
     "t": "The human",
     "h": "Where the person actually <em>sits</em> in the loop",
     "b": "<p>Human oversight is offered as a general reassurance and means at least four different things. Only one of them is a control, and the difference should be stated in the requirement.</p>\n<div class='dt'><table>\n<tr><th>Arrangement</th><th>What the human does</th><th>Is it a control?</th></tr>\n<tr class='hi'><td>Human in the loop</td><td class='n'>Reviews and approves before the decision takes effect</td><td class='g'>Yes. The decision does not happen without them</td></tr>\n<tr><td>Human on the loop</td><td class='n'>Monitors decisions as they happen, can intervene</td><td class='g'>Partly. Depends entirely on whether they have time</td></tr>\n<tr><td>Human after the loop</td><td class='n'>Samples decisions afterwards</td><td class='g'>Detective, not preventive. Finds patterns, not individual harm</td></tr>\n<tr><td>Human available on request</td><td class='n'>The customer may ask for review</td><td class='g'>Only for customers who know to ask, which is the minority</td></tr>\n</table></div>\n<p>Two conditions must hold for any of them to work, and both are specification items rather than operational assumptions:</p>\n<ul>\n<li><strong>The human must have the information to disagree.</strong> A screen showing a decision and an approve button produces approval. A screen showing the inputs, the reason, the confidence and what would change the outcome produces review. Rubber-stamping is a design failure before it is a discipline failure.</li>\n<li><strong>The human must have the time.</strong> One reviewer and four hundred cases a day is not oversight, whatever the process document says. Volume and staffing are part of the requirement.</li>\n</ul>\n<div class='note'>In Indian digital lending there is a related and firmer obligation: creditworthiness must be assessed before every loan and no credit limit may increase automatically without an explicit recorded request from the borrower. That is a specific prohibition on a particular automated action, and it sits above any general oversight arrangement.</div>"

p>\n<p>Its dedicated section on artificial intelligence names <strong>seven risk dimensions</strong>: explainability, hallucinations, bias, overfitting, spurious correlations, output variability, and data risks. It also raises red-teaming, kill-switch capability and mandatory human oversight.</p>\n<div class='src'>Sources: Reserve Bank of India, report of the committee on a framework for responsible and ethical enablement of artificial intelligence, dated 13 August 2025. Reserve Bank of India, draft guidance on regulatory principles for model risk management, press release 2026-2027/528, dated 24 June 2026, comments invited until 24 July 2026. The survey percentages and the seven risk dimensions are taken from published summaries of these documents rather than from the primary texts, and both should be re-verified against the originals before being relied upon.</div>\n<div class='docs'><b>Official sources</b>\n<a href='https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=63006' target='_blank' rel='noopener'>Reserve Bank of India &mdash; draft Guidance on Regulatory Principles for Model Risk Management, 24 June 2026</a>\n<a href='https://www.rbi.org.in/Scripts/DraftNotificationsGuildelines.aspx' target='_blank' rel='noopener'>Reserve Bank of India &mdash; draft notifications and guidelines, to check whether it has been finalised</a></div>"

ts with owners &mdash; rather than implementation details left to whoever integrates it.</div>"

ing from the first card of the lending mission. Specified per stage, they produce five inconsistent implementations.</div>\n<div><b>The baseline</b>Captured in discovery, claimed in the business case, measured in the post-implementation review. Missing at the start makes the last one impossible.</div></div>\n<p>The single dependency worth naming: <strong>almost every failure late in the spine traces to something skipped in stages 2 to 4.</strong> An unmeasured baseline, an unresolved ambiguity, an exception path never specified. The stages after specification are largely execution of decisions already taken.</p>"

ine quality characteristics (2023)</b><span>Functional suitability, performance efficiency, compatibility, interaction capability, reliability, security, maintainability, flexibility, safety</span></div>\n<div class='r'><b>Eight questions before pipeline design</b><span>Grain, volume, frequency, history, key, nulls, late arrival, retrospective correction</span></div>\n<div class='r'><b>Six data quality dimensions</b><span>Completeness, accuracy, consistency, timeliness, validity, uniqueness</span></div>\n<div class='r'><b>Four reconciliation checks</b><span>Row count, control totals, tie-out to authoritative source, record sample</span></div>\n<div class='r'><b>Four integration patterns</b><span>Batch file, API, event or stream, direct database access</span></div>\n<div class='r'><b>Four gap-closing approaches</b><span>Configure, extend, customise, change the process</span></div>\n<div class='r'><b>Four test levels</b><span>Component, integration, system, acceptance</span></div>\n<div class='r'><b>Four severity grades</b><span>Critical, major, minor, cosmetic</span></div>\n<div class='r'><b>Three cutover shapes</b><span>Big bang, phased, parallel run</span></div>\n<div class='r'><b>Eleven origination stages</b><span>Sourcing, capture, KYC, dedupe, bureau, eligibility, scoring, policy rules, decision, offer, disbursal</span></div>\n</div>\n<div class='sheet'><div class='h'>The formulae</div>\n<div class='r'><b>Weighted score</b><span>S = sum of (weight &times; score) across criteria. Effort enters as a cost</span></div>\n<div class='r'><b>Cost of delay</b><span>Value lost over the delay period, divided by weeks delayed</span></div>\n<div class='r'><b>Permitted downtime</b><span>D = (1 &minus; A) &times; T. State the period T</span></div>\n<div class='r'><b>Decision table combinations</b><span>C = product of the state counts. All binary gives 2 to the power n</span></div>\n</div>\n<div class='sheet'><div class='h'>The numbers</div>\n<div class='r'><b>Availability per On the next revision. The 2011 eight-characteristic list is still widely quoted</td></tr>\n</table></div>\n<div class='src'>Two limits stated openly. The survey percentages and the seven artificial intelligence risk dimensions in mission 11 were taken from published summaries rather than from the primary documents, and should be verified against the originals before being relied on. The prioritisation methods in mission 03, the estimate ranges in mission 10, and the whole of the release and delivery material are practice conventions with no standards body behind them, and are labelled as such where they appear.</div>"

rison, model evaluation. All real, all passed, all with a blind spot that is exactly where the expensive failures live.</p>\n<div class='note'>The finish line stated at the outset: take a vague business ask in a lending or risk context and carry it to a signed-off, tested, live change &mdash; naming every stakeholder, running the elicitation, writing the requirement so it can be built and tested, judging the design, commissioning the data work, defining the tests, planning the cutover, and saying what will be measured afterwards. That is now the whole path, end to end.</div>"

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const RE=new RegExp([
  '(#[^\\n]*)',
  '("""[\\s\\S]*?"""|\\u0027\\u0027\\u0027[\\s\\S]*?\\u0027\\u0027\\u0027|"(?:[^"\\\\n]|\\\\.)*"|\\u0027(?:[^\\u0027\\\\n]|\\\\.)*\\u0027)',
  '(\\b\\d+\\.?\\d*\\b)',
  '([A-Za-z_][A-Za-z0-9_]*)'
].join('|'),'g');
function hl(src){
  let out='',last=0,m;
  RE.lastIndex=0;
  while((m=RE.exec(src))!==null){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+='<i class="tc">'+esc(m[1])+'</i>';
    else if(m[2]) out+='<i class="ts">'+esc(m[2])+'</i>';
    else if(m[3]) out+='<i class="tn">'+esc(m[3])+'</i>';
    else{
      const w=m[4];
      if(KW.has(w)) out+='<i class="tk">'+w+'</i>';
      else if(src[RE.lastIndex]==='(') out+='<i class="tf">'+w+'</i>';
      else out+=esc(w);
    }
    last=RE.lastIndex;
  }
  return out+esc(src.slice(last));
}
document.querySelectorAll('.code').forEach(box=>{
  const pre=box.querySelector('pre'); if(!pre) return;
  const raw=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
  const label=box.dataset.cap||'code';
  pre.innerHTML=hl(raw);
  const cap=document.createElement('div'); cap.className='cap';
  const sp=document.createElement('span'); sp.textContent=label;
  const btn=document.createElement('button'); btn.className='cp'; btn.textContent='Copy';
  btn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(raw); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=raw;
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(_){}
      ta.remove();
    }
    btn.textContent='Copied'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
  };
  cap.appendChild(sp); cap.appendChild(btn); box.insertBefore(cap,pre);
});

/* ---------- reveal on scroll ---------- */
const secs=[...document.querySelectorAll('section')];
if('IntersectionObserver' in window){
  const rev=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rev.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  secs.forEach(s=>{if(!s.classList.contains('in'))rev.observe(s);});
}else{
  secs.forEach(s=>s.classList.add('in'));
}

/* ---------- progress, counter, rail ---------- */
const cards=[...document.querySelectorAll('section[data-card]')];
const fill=document.querySelector('#bar i'), cnt=document.getElementById('count'), topBtn=document.getElementById('toTop');
let idxOpen=false;
function onScroll(){
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  fill.style.width=(pct*100).toFixed(2)+'%';
  topBtn.classList.toggle('on',h.scrollTop>900);
  if(idxOpen)return;
  const mid=h.scrollTop+h.clientHeight*0.42;
  let n=0,cur=0;
  for(let i=0;i<cards.length;i++){ if(cards[i].offsetTop<=mid){n=i+1;cur=+cards[i].dataset.m;} }
  cnt.textContent=n? String(n).padStart(3,'0')+' / '+total : 'INDEX';
  [...rail.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
}
let tick=false;
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(()=>{onScroll();tick=false});tick=true}},{passive:true});
onScroll();

/* ---------- index ---------- */
const list=document.getElementById('idxlist'), idx=document.getElementById('idx');
P.missions.forEach(m=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span class="n">${m.n}</span><span class="t">${m.title}</span><span class="c">${m.cards.length} cards</span>`;
  d.onclick=()=>{idx.classList.remove('on');idxOpen=false;document.getElementById('m'+m.n).scrollIntoView();};
  list.appendChild(d);
});
cnt.onclick=()=>{idx.classList.add('on');idxOpen=true;};
document.getElementById('close').onclick=()=>{idx.classList.remove('on');idxOpen=false;onScroll();};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('keydown',e=>{if(e.key==='Escape'&&idxOpen){idx.classList.remove('on');idxOpen=false;}});
</script>
